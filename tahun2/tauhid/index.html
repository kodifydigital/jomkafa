<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8442F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/access.js"></script>
<title>Ladang Tuai Iman • Tauhid Tahun 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@500;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tauhid Tahun 2: "Ladang Tuai Iman" — ladang padi, jalan traktor, jelapang merah, Lulu si anak biri-biri ===== */
:root{
  --sky1:#8FD3FF; --sky2:#E3F5FF; --bg:#FFF8E8; --card:#FFFDF5; --ink:#3B2414; --muted:#7A5A3E; --line:#3B2414;
  --brand:#C8442F; --brand2:#9C2F1F; --gold:#F5C542; --gold2:#D9A21B; --grass:#7CC251; --grass2:#4E8F35;
  --soil:#A56A38; --soil2:#7A4A24; --straw:#F6E3A1; --path:#E8C98E;
  --ok:#2E9A52; --okbg:#DFF5E2; --bad:#D9442F; --badbg:#FFE3DC; --note:#FFF1C9;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0D1B33; --sky2:#1F2B45; --bg:#16110B; --card:#2A2016; --ink:#FFF2DC; --muted:#DCC5A2; --line:#0A0603;
    --grass:#3D7A2E; --grass2:#2A5A20; --soil:#6B4423; --soil2:#4E3018; --straw:#5A4A22; --path:#6E5634;
    --note:#3D3216; --okbg:#173A22; --badbg:#4A231C; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Gluten","Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:19px;line-height:1.4;
  background:radial-gradient(circle at 86% 64px,#FFE27A 0 30px,#FFF2B8 31px 38px,transparent 39px),
  linear-gradient(180deg,var(--sky1) 0,var(--sky2) 300px,var(--grass) 300px,var(--grass) 312px,var(--bg) 360px) fixed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:radial-gradient(circle at 86% 64px,#F4EFCF 0 24px,transparent 26px),radial-gradient(1.5px 1.5px at 20% 40px,#fff,transparent),radial-gradient(1px 1px at 55% 110px,#fff,transparent),radial-gradient(1px 1px at 35% 190px,#fff,transparent),linear-gradient(180deg,var(--sky1) 0,var(--sky2) 300px,var(--grass2) 300px,var(--grass2) 312px,var(--bg) 360px) fixed}}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Gluten",serif;font-weight:600;font-size:20px;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 60px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:12px;border:3px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:22px;font-weight:700;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:0 10px}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 14px;border-radius:12px;border:3px solid var(--line);background:var(--gold);color:#3A2600;font-weight:700;box-shadow:0 4px 0 var(--line)}

/* papan tanda bangsal */
.hero{display:flex;align-items:center;gap:12px;background:repeating-linear-gradient(90deg,var(--brand) 0 38px,var(--brand2) 38px 41px);color:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px 18px;box-shadow:0 6px 0 var(--line);margin:4px 0 14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:repeating-linear-gradient(115deg,var(--gold) 0 8px,var(--gold2) 8px 12px)}
.hero h1{margin:0;font-size:clamp(24px,6.4vw,32px);line-height:1.12;color:#FFF3C4;text-shadow:0 2px 0 var(--line)}
html[dir="rtl"] .hero h1{line-height:1.55}
.hero p{margin:2px 0 4px;color:#FFE9DF;font-size:16px;font-weight:700}
.lulu{width:86px;height:auto;flex:none;overflow:visible}
.lulu.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.lulu.yay{animation:yay .5s ease 2}
@keyframes yay{50%{transform:translateY(-14px) scale(1.06)}}

/* stiker hasil tuaian */
.sttl{font-weight:700;font-size:15px;margin:0 0 4px;color:var(--muted)}
.stickers{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
.stickers span{aspect-ratio:1;display:grid;place-items:center;font-size:24px;border-radius:50%;border:3px dashed var(--muted);background:var(--card);filter:grayscale(1);opacity:.4}
.stickers .got{filter:none;opacity:1;border:3px solid var(--line);background:var(--straw);box-shadow:0 3px 0 var(--line)}

/* peta ladang: jalan traktor berliku */
.farm{position:relative;padding:8px 0 6px;border:3px solid var(--line);border-radius:22px;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 26px,rgba(0,0,0,.05) 26px 28px),linear-gradient(180deg,var(--grass) 0,var(--grass2) 100%)}
.farm::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:46px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,var(--path) 0 22px,#D7B57A 22px 26px);border-left:3px dashed rgba(59,36,20,.35);border-right:3px dashed rgba(59,36,20,.35)}
.prow{display:flex;justify-content:flex-start;position:relative;padding:8px 10px}
.prow.r{justify-content:flex-end}
.plot{position:relative;width:46%;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.plot .bed{width:100%;height:104px;border:3px solid var(--line);border-radius:16px;position:relative;box-shadow:0 5px 0 var(--line);
  background:repeating-linear-gradient(180deg,var(--soil) 0 14px,var(--soil2) 14px 18px)}
.plot.done .bed{background:repeating-linear-gradient(180deg,#E9C452 0 14px,#C99A22 14px 18px)}
.plot .crop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;font-size:30px;letter-spacing:-4px}
.plot .badge{position:absolute;top:-10px;inset-inline-start:-8px;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;border:3px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:17px;z-index:2}
.plot .sign{position:absolute;bottom:-12px;inset-inline-end:-6px;font-size:28px;z-index:2}
.plot .nm{position:relative;z-index:1;background:var(--card);border:3px solid var(--line);border-radius:12px;padding:2px 8px;font-weight:700;font-size:15px;line-height:1.25;margin-top:6px;max-width:100%;overflow-wrap:anywhere}
html[dir="rtl"] .plot .nm{font-size:15px;line-height:1.6}
.plot .st{font-size:15px;min-height:20px;letter-spacing:1px}
.plot.lock .bed{filter:grayscale(.75) brightness(.9)}
.plot.lock .nm{opacity:.75}
.plot.now .bed{outline:4px solid var(--gold);outline-offset:3px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{outline-color:#fff}}
.tractor{position:absolute;top:-30px;inset-inline-end:-4px;font-size:40px;z-index:3;animation:bob 2s ease-in-out infinite}
html[dir="rtl"] .tractor{transform:scaleX(-1)}
.barnrow{display:flex;justify-content:center;padding:6px 10px 10px;position:relative}
.barn{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:70%;position:relative}
.barn .bsvg{width:150px;height:auto;filter:drop-shadow(0 5px 0 var(--line))}
.barn.lock .bsvg{filter:grayscale(.8) drop-shadow(0 5px 0 var(--line))}
.barn .nm{background:var(--gold);color:#3A2600;border:3px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:700;font-size:17px}
.barn .lulu{position:absolute;top:-6px;inset-inline-end:-6px;width:64px}
.gate{position:relative;text-align:center;padding:8px 0 4px}
.gate span{display:inline-block;background:var(--card);border:3px solid var(--line);border-radius:12px;padding:2px 12px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--line)}
.fence{height:22px;background:repeating-linear-gradient(90deg,transparent 0 18px,#F4E3C1 18px 26px),linear-gradient(180deg,transparent 0 5px,#F4E3C1 5px 9px,transparent 9px 13px,#F4E3C1 13px 17px,transparent 17px);position:relative}
</style>
<style>
/* kad bacaan: papan kayu ladang */
@keyframes pagein{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes spin{from{transform:rotate(-360deg) scale(0)}}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 0 var(--line);animation:pagein .35s ease both;position:relative}
.card.board{border-top:14px solid var(--sc);background-image:linear-gradient(180deg,transparent 0 calc(100% - 10px),color-mix(in srgb,var(--sc) 25%,transparent) calc(100% - 10px))}
.card.board::before,.card.board::after{content:"";position:absolute;top:-11px;width:10px;height:10px;border-radius:50%;background:#FFF3C4;border:2px solid var(--line)}
.card.board::before{left:16px}.card.board::after{right:16px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead .bub{width:60px;height:60px;flex:none;border-radius:50% 50% 12px 12px;background:var(--c);border:3px solid var(--line);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 var(--line)}
.shead h2{margin:0;font-size:clamp(21px,5.2vw,26px);line-height:1.15}
html[dir="rtl"] .shead h2{line-height:1.6}
.shead small{display:block;color:var(--muted);font-weight:700;font-size:14.5px}
.rpic{font-size:56px;text-align:center;line-height:1.1;margin-bottom:4px;animation:pop .4s both}
.rh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:clamp(20px,5vw,24px);color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rh,:root:not([data-theme="light"]) .res h2{color:var(--gold)}}
.rtext{margin:0 0 10px;font-weight:700;font-size:19px;background:var(--note);border:2px dashed var(--gold2);border-radius:14px;padding:8px 12px}
.rlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:7px;counter-reset:n}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border:2px solid color-mix(in srgb,var(--line) 25%,transparent);border-radius:12px;padding:6px 10px;font-weight:700;line-height:1.3;animation:pagein .35s both;animation-delay:calc(var(--i)*70ms)}
html[dir="rtl"] .rlist li{line-height:1.7}
.rlist li::before{content:"🌾";flex:none;width:32px;height:32px;border-radius:50%;background:var(--straw);border:2px solid var(--line);display:grid;place-items:center;font-size:16px}
.rlist.num li::before{counter-increment:n;content:counter(n);background:var(--sc);color:#fff;font-weight:700}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.vs div{border:3px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-weight:700;font-size:16.5px;line-height:1.3}
html[dir="rtl"] .vs div{line-height:1.7}
.vs .w{background:var(--okbg)}.vs .m{background:var(--badbg)}
.vs b{display:block;font-size:13.5px;color:var(--muted)}
.abox{background:var(--note);border:3px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 10px;text-align:center}
.abox .ar{display:block;font-size:clamp(23px,6vw,30px);line-height:1.95}
.abox .mk{display:block;font-weight:700;font-size:16px;color:var(--muted);margin-top:4px}
.abox small{display:block;font-weight:700;font-size:14px;color:var(--muted)}
.tip{display:flex;gap:8px;align-items:flex-start;background:#FFF0D1;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:0 0 8px;font-weight:700;font-size:17px;color:#5A3510}
.tip.am{background:#E4F6DA;color:#1F4A14}
.tip b{flex:none}
.ref{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
.navr{display:flex;gap:8px;margin-top:12px}
.navr .btn{flex:1}
.btn{display:block;width:100%;border:3px solid var(--line);border-radius:14px;padding:12px;font-size:21px;font-weight:700;background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--line);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink);text-shadow:none}
.btn.go{background:var(--ok)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:12px;height:12px;border-radius:50% 50% 50% 0;background:color-mix(in srgb,var(--line) 25%,transparent);transform:rotate(-45deg)}
.dots i.on{background:var(--grass2)}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--gold);font-size:20px;box-shadow:0 3px 0 var(--line);flex:none}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* bar kemajuan: traktor melalui batas */
.prog{position:relative;height:50px;margin:2px 4px 12px}
.prog .row{position:absolute;left:0;right:0;bottom:4px;height:18px;border:3px solid var(--line);border-radius:9px;background:repeating-linear-gradient(90deg,var(--soil) 0 10px,var(--soil2) 10px 13px)}
.prog .pf{position:absolute;bottom:16px;transform:translateX(-50%);font-size:20px}
html[dir="rtl"] .prog .pf{transform:translateX(50%)}
.prog .fly{position:absolute;top:50%;transform:translate(-50%,-62%);font-size:34px;transition:left .4s,right .4s;z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
html[dir="rtl"] .prog .fly{transform:translate(50%,-62%)}
.q{display:flex;gap:10px;align-items:center;margin:0 0 12px}
.q p{margin:0;flex:1;font-size:clamp(19px,5vw,23px);font-weight:700;line-height:1.3}
html[dir="rtl"] .q p{line-height:1.75}
.qpic{font-size:52px;text-align:center;line-height:1.1;margin:-4px 0 6px}
.cnt{text-align:center;color:var(--muted);font-weight:700;font-size:15.5px;margin-top:10px}
.hint{margin-top:10px;background:var(--badbg);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;animation:pop .3s both}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tile{border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);font-weight:700;min-height:56px;background:var(--card);padding:8px 10px;line-height:1.25;overflow-wrap:anywhere}
html[dir="rtl"] .tile{line-height:1.65}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
</style>
<style>
/* petik: pokok buah */
.tree{position:relative;padding:14px 10px 18px;border:3px solid var(--line);border-radius:46% 46% 22px 22px / 30% 30% 22px 22px;background:radial-gradient(circle at 30% 30%,#9BD86A,#5DA83A 70%);box-shadow:0 5px 0 var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tree{background:radial-gradient(circle at 30% 30%,#4E8A33,#2C5A1C 70%)}}
.fruits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fruit{min-width:0;overflow-wrap:anywhere;font-size:15px}
.fruit{display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:22px;background:#FFF6E0;color:#3B2414;padding:6px 8px 6px 4px;box-shadow:0 4px 0 var(--line);font-weight:700;min-height:58px;text-align:start;line-height:1.2}
html[dir="rtl"] .fruit{padding:6px 6px 6px 12px;line-height:1.6}
.fruit .em{font-size:24px;flex:none}
.fruit.drop{animation:drop .6s ease-in forwards}
@keyframes drop{to{transform:translateY(140px) rotate(25deg);opacity:0}}
.fruit.wrong{background:var(--badbg)}
.trunk{width:46px;height:34px;margin:-3px auto 0;background:#8A5527;border:3px solid var(--line);border-top:none}
.basket{display:flex;align-items:center;justify-content:center;gap:10px;font-size:46px;margin-top:-6px}
.basket .got{font-size:16px;font-weight:700;background:var(--note);border:3px solid var(--line);border-radius:12px;padding:4px 10px;min-height:40px;display:flex;align-items:center}
/* guni: isi guni */
.cart{display:flex;align-items:center;gap:8px;background:var(--straw);border:3px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--line);font-weight:700;font-size:20px;min-height:76px;line-height:1.3}
html[dir="rtl"] .cart{line-height:1.7}
.cart .em{font-size:34px;flex:none}
.sacks{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;margin-top:14px}
.sack{position:relative;border:3px solid var(--line);border-radius:18px 18px 34px 34px;background:linear-gradient(180deg,#E7CB8F,#C9A35E);color:#3B2414;padding:22px 6px 10px;box-shadow:0 5px 0 var(--line);font-weight:700;font-size:17px;line-height:1.25;min-height:110px}
html[dir="rtl"] .sack{line-height:1.6}
.sack::before{content:"";position:absolute;top:8px;left:24%;right:24%;height:6px;border-radius:4px;background:#8A5527}
.sack .em{display:block;font-size:30px}
.sack .n{display:block;font-size:14px;color:#6B4A20}
.sack.bump{animation:yay .35s}
/* bajak: batas berurutan */
.field{display:grid;gap:6px;background:var(--soil2);border:3px solid var(--line);border-radius:16px;padding:8px}
.furrow{display:flex;align-items:center;gap:8px;min-height:50px;border-radius:10px;background:repeating-linear-gradient(90deg,var(--soil) 0 16px,#8F5A2D 16px 20px);color:#FFF6E0;padding:4px 8px;font-weight:700;line-height:1.25}
html[dir="rtl"] .furrow{line-height:1.6}
.furrow b{flex:none;width:30px;height:30px;border-radius:50%;background:#FFF6E0;color:#3B2414;display:grid;place-items:center;border:2px solid var(--line)}
.furrow.on{background:linear-gradient(90deg,#7CC251,#5DA83A);color:#173A0C}
.furrow.on span{background:rgba(255,255,255,.75);border-radius:8px;padding:0 6px}
.furrow.next{outline:3px dashed var(--gold);outline-offset:-3px}
.seeds{display:grid;gap:8px;margin-top:12px}
.sd{text-align:start}
.sd.used{visibility:hidden}
/* tunas: isi tempat kosong */
.bedbox{background:var(--note);border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.bedbox .plant{font-size:44px;line-height:1;transition:transform .3s}
.bedbox .plant.grow{animation:pop .5s both}
.sent{font-weight:700;font-size:20px;margin:8px 0 0;line-height:1.5}
html[dir="rtl"] .sent{line-height:1.9}
.blank{display:inline-block;min-width:80px;border-bottom:4px dotted var(--soil);color:var(--soil);padding:0 4px}
.blank.fill{border-bottom:4px solid var(--ok);color:var(--ok)}
.packets{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
.packet{display:flex;align-items:center;gap:10px;text-align:start;background:linear-gradient(90deg,#FFE9B0 0 48px,var(--card) 48px)}
.packet .em{font-size:26px;width:30px;flex:none;text-align:center}
.packet.wrong{background:var(--badbg)}
.packet.right{background:var(--okbg)}
/* ternak: beri makan haiwan */
.barnyard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col h4{margin:0;text-align:center;font-size:15px;color:var(--muted)}
.pen{display:flex;flex-direction:column;align-items:center;gap:2px;background:repeating-linear-gradient(90deg,var(--card) 0 20px,var(--straw) 20px 24px);text-align:center}
.pen .em{font-size:32px;line-height:1}
.food{text-align:center;background:#FFF6D8;color:#3B2414}
.food.sel{outline:4px solid var(--gold);outline-offset:2px;transform:translateY(-2px)}
.pen.fed,.food.fed{background:var(--okbg);opacity:.75;pointer-events:none}
/* siram: betul atau salah */
.sprout{text-align:center;background:var(--note);border:3px solid var(--line);border-radius:16px;padding:10px 12px}
.sprout .plant{font-size:48px;line-height:1.1}
.stxt{font-weight:700;font-size:20px;line-height:1.35;margin-top:4px}
html[dir="rtl"] .stxt{line-height:1.85}
.cans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.can{font-size:19px;padding:10px 6px}
.can .em{display:block;font-size:34px}
.can[data-v="1"]{background:#D7F0FF;color:#103A55}
.can[data-v="0"]{background:#FFE0D6;color:#5A1C10}
/* rumpai: cabut rumpai */
.plotgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--soil2);border:3px solid var(--line);border-radius:16px;padding:10px}
.patch{display:flex;flex-direction:column;align-items:center;gap:2px;background:#E9F6DC;color:#1F3A12;font-size:16.5px;text-align:center}
.patch .em{font-size:28px;line-height:1}
.patch.pulled{background:#F3E2C6;color:#7A5A3E;text-decoration:line-through;pointer-events:none}
.patch.wrong{background:var(--badbg)}

/* maklum balas & keputusan */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--okbg);border-top:4px solid var(--line);animation:pagein .3s both;max-height:70vh;overflow:auto}
.fb .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.fb .row1{display:flex;gap:10px;align-items:center}
.fb .lulu{width:66px}
.fb strong{display:block;font-size:24px;color:var(--ok)}
.fb p{margin:0;font-weight:700;font-size:17px;line-height:1.35}
html[dir="rtl"] .fb p{line-height:1.75}
.res{text-align:center}
.res .lulu{width:130px;margin:0 auto;display:block}
.res .stars{font-size:58px;letter-spacing:6px;line-height:1.1}
.res .stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.res .stars .off{filter:grayscale(1);opacity:.25}
.res h2{margin:4px 0;font-size:32px;color:var(--brand)}
.res p{margin:0 0 8px;color:var(--muted);font-weight:700}
.gotst{display:inline-flex;align-items:center;gap:10px;background:var(--note);border:3px dashed var(--line);border-radius:18px;padding:8px 16px;font-weight:700;margin:6px 0 10px}
.gotst span{font-size:44px;animation:spin 1s ease both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(380deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
@media (max-width:370px){.fruits,.barnyard,.plotgrid{gap:7px}.fruit{font-size:16px}.sack{font-size:15px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

  ok:    () => tone([[523,.12],[784,.2]]),
  tick:  () => tone([[740,.08,"triangle"]]),
  no:    () => tone([[220,.18,"square"],[175,.2,"square"]]),
  plop:  () => tone([[420,.06,"sine"],[260,.12,"sine"]]),
  water: () => tone([[900,.05,"sine"],[1200,.05,"sine"],[1500,.08,"sine"]]),
  baa:   () => tone([[330,.1,"sawtooth"],[311,.12,"sawtooth"],[294,.16,"sawtooth"]]),
  win:   () => tone([[523,.14],[659,.14],[784,.14],[1046,.32]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const cleanSpeech = s => s.replace(/"[^"]*"/g," ").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/___/g," ... ").replace(/…/g," ... ").replace(/\ba\.s\./g,"alaihissalam").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanSpeech(text));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .92; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

    <div class="stickers">${STATIONS.map(s=>`<span class="${best[s.id]>0?"got":""}" title="${T(s.t)}">${s.sticker}</span>`).join("")}</div>
    <section class="farm" aria-label="${L("Peta ladang","ڤتا لادڠ")}">
      <div class="barnrow"><button class="barn ${fOpen?"":"lock"} ${cur==="final"?"now":""}" data-act="${fOpen?"final":"flocked"}">
        ${barnSvg(!fOpen)}${cur==="final"?lulu("bob"):""}
        <span class="nm">${fOpen?"🏆":"🔒"} ${L("Cabaran Jelapang","چابرن جلاڤڠ")}</span><span class="st">${fSt?starRow(fSt):""}</span></button></div>
      ${rows}
      <div class="gate"><span>🚪 ${L("Mula di sini","مولا د سيني")}</span></div>
      <div class="fence" aria-hidden="true"></div>
    </section>`;
  const now = app.querySelector(".plot.now, .barn.now");
  if(now) setTimeout(()=>{ try{ now.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){} }, 250);
}

/* ===================== STESEN: BACA ===================== */
function openStation(id){
  const st = STATIONS.find(s=>s.id===id);
  S = { st, phase:"read", ri:0, gi:0, miss:0, games: st.games.slice() };
  renderRead();
}
function openFinal(){
  const games = FINAL_PICK.map(([s,i]) => STATIONS.find(x=>x.id===s).games[i]);
  S = { st:{ id:"final", icon:"🏆", c:"#C8442F", t:["Cabaran Jelapang","چابرن جلاڤڠ"], u:["Soalan daripada semua petak ladang","سوالن درڤد سموا ڤتق لادڠ"], sticker:"🏆" }, phase:"play", gi:0, miss:0, games };
  renderPlay();
}
const head = () => `<div class="top"><button class="ib" data-act="map" aria-label="${L("Kembali ke ladang","کمبالي ک لادڠ")}">${BACK()}</button><span class="sp"></span>${voiceBtn()}${langBtn()}</div>
  <div class="shead"><span class="bub" style="--c:${S.st.c}">${S.st.icon}</span><div><h2>${T(S.st.t)}</h2><small>${T(S.st.u)}</small></div></div>`;
function readSpeech(c){
  return [RU(c.h), ...(c.vs||[]).map(v=>RU(v[0])+": "+RU(v[1])), ...(c.list||[]).map(RU), RU(c.text), RU(c.mk), c.tip?("Tahukah anda? "+RU(c.tip)):"", c.am?("Amalkan: "+RU(c.am)):""].filter(Boolean).join(". ");
}
function renderRead(){
  hush();
  const c = S.st.read[S.ri], n = S.st.read.length, last = S.ri===n-1;
  app.innerHTML = head() + `
    <article class="card board" style="--sc:${S.st.c}">
      <div class="rpic" aria-hidden="true">${c.pic}</div>
      <h3 class="rh">${T(c.h)} ${sayBtn(readSpeech(c))}</h3>
      ${c.vs?`<div class="vs">${c.vs.map((v,i)=>`<div class="${i?"m":"w"}"><b>${T(v[0])}</b>${T(v[1])}</div>`).join("")}</div>`:""}
      ${c.list?`<ol class="rlist ${c.num?"num":""}">${c.list.map((x,i)=>`<li style="--i:${i}">${T(x)}</li>`).join("")}</ol>`:""}
      ${c.text?`<p class="rtext">${T(c.text)}</p>`:""}
      ${c.ar?`<div class="abox"><span class="ar" lang="ar">${c.ar}</span>${c.mk?`<span class="mk">${T(c.mk)}</span>`:""}${c.src?`<small>${T(c.src)}</small>`:""}</div>`:""}
      ${c.tip?`<div class="tip"><b>💡</b><span><b>${L("Tahukah anda?","تاهوکه اندا؟")}</b> ${T(c.tip)}</span></div>`:""}
      ${c.am?`<div class="tip am"><b>🌱</b><span><b>${L("Amalkan:","عملکن:")}</b> ${T(c.am)}</span></div>`:""}
      <div class="ref">📖 ${L("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</div>
      <div class="navr">
        <button class="btn alt" data-act="rprev" ${S.ri?"":"disabled"} aria-label="${L("Sebelum","سبلوم")}" style="flex:0 0 64px">${BACK()}</button>
        <button class="btn ${last?"go":""}" data-act="rnext">${last ? "🚜 "+L("Jom bertani!","جوم برتاني!") : L("Seterusnya","ستروسڽ")+" ▶"}</button>
      </div>
      <div class="dots">${S.st.read.map((_,i)=>`<i class="${i===S.ri?"on":""}"></i>`).join("")}</div>
    </article>`;
  speak(readSpeech(c));
  window.scrollTo(0,0);
}

/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, side = isJ() ? "right" : "left";
  const flags = S.games.map((_,i)=>`<span class="pf" style="${side}:${(i+.5)/n*100}%">${i<k?"🌾":"🌱"}</span>`).join("");
  const pos = Math.max(5, Math.min(95, (k+.5)/n*100));
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="row"></span>${flags}
    <span class="fly" style="${side}:${pos}%">🚜</span></div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play" data-type="${g.type}"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🐑 ${hint || L("Mbeek! Cuba lagi!","مبيق! چوبا لاڬي!")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  if(document.querySelector(".fb")) return;
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${lulu("yay")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Tuaianmu melimpah ruah!","چمرلڠ! توواينمو مليمڤه روه!"] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom main lagi.","شاباس کران منچوبا! جوم ماٴين لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${lulu("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Hasil tuaian baharu untuk kamu!","حاصيل توواين بهارو اونتوق کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🏆 ${L("Cabaran Jelapang kini dibuka!","چابرن جلاڤڠ کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🌾 ${L("Kembali ke ladang","کمبالي ک لادڠ")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN ===================== */
const FRUIT = ["🍎","🍊","🥭","🍐","🍋"];
const GAMES = {
  /* Petik: petik buah yang betul dari pokok ke dalam bakul */
  petik(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    el.innerHTML = `<div class="tree"><div class="fruits">${opts.map((o,i)=>`<button class="fruit" data-i="${i}" data-ok="${o.ok?1:0}"><span class="em" aria-hidden="true">${FRUIT[i%FRUIT.length]}</span><span>${T(o.x)}</span></button>`).join("")}</div></div>
      <div class="trunk" aria-hidden="true"></div><div class="basket"><span aria-hidden="true">🧺</span><span class="got" id="got">❔</span></div>`;
    el.querySelectorAll(".fruit").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = opts[+b.dataset.i];
      if(o.ok){ done = true; sfx.plop(); b.classList.add("drop"); const gt = el.querySelector("#got"); gt.textContent = FRUIT[+b.dataset.i%FRUIT.length]+" "+T(o.x); clearHint(); setTimeout(win, 550); }
      else { b.classList.add("wrong"); oops(b, L("Buah itu belum masak! Pilih yang lain.","بواه ايت بلوم ماسق! ڤيليه يڠ لاٴين.")); }
    }));
  },

  /* Guni: masukkan setiap hasil ke dalam guni yang betul */
  guni(el, g){
    const items = mix(g.items); let k = 0; const cnt = g.cats.map(()=>0);
    const draw = () => {
      el.innerHTML = `<div class="cart" id="gitem"><span class="em" aria-hidden="true">🛒</span><span id="gtxt">${k<items.length?T(items[k][0]):"🎉"}</span></div>
        <div class="sacks" style="--n:${g.cats.length}">${g.cats.map((c,i)=>`<button class="sack" data-c="${i}"><span class="em" aria-hidden="true">${c[1]}</span>${T(c[0])}<span class="n">${"🌾".repeat(cnt[i])||"·"}</span></button>`).join("")}</div>
        <div class="cnt">🧺 ${Math.min(k+1,items.length)} / ${items.length}</div>`;
      if(k<items.length) speak(RU(items[k][0]));
      el.querySelectorAll(".sack").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.c===items[k][1]){
          sfx.tick(); clearHint(); cnt[items[k][1]]++; k++; draw();
          if(k===items.length) setTimeout(win, 400);
        } else oops(el.querySelector("#gitem"), L("Bukan guni itu. Cuba guni yang satu lagi!","بوکن ڬوني ايت. چوبا ڬوني يڠ ساتو لاڬي!"));
      }));
    };
    draw();
  },

  /* Bajak: tanam benih pada batas mengikut urutan */
  bajak(el, g){
    const pool = mix(g.steps.map((t,i)=>({t, i}))); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="field">${g.steps.map((s,i)=>`<div class="furrow ${i<k?"on":i===k?"next":""}"><b>${i+1}</b><span>${i<k?"🌱 "+T(s):""}</span></div>`).join("")}</div>
        <div class="seeds">${pool.map((p,n)=>`<button class="tile sd ${p.used?"used":""}" data-n="${n}" data-i="${p.i}" ${p.used?"disabled":""}>🌰 ${T(p.t)}</button>`).join("")}</div>
        <div class="cnt">🚜 ${L(`Batas ke-${Math.min(k+1,g.steps.length)}`,`باتس ک-${Math.min(k+1,g.steps.length)}`)}</div>`;
      el.querySelectorAll(".sd").forEach(b => b.addEventListener("click", () => {
        if(k>=g.steps.length) return; const p = pool[+b.dataset.n]; if(p.used) return;
        if(p.i===k){ p.used = true; k++; sfx.plop(); clearHint(); draw(); if(k===g.steps.length) setTimeout(win, 450); }
        else oops(b, L(`Bukan itu. Apakah baris ke-${k+1}?`,`بوکن ايت. اڤاکه باريس ک-${k+1}؟`));
      }));
    };
    draw();
  },

  /* Tunas: tanam benih (perkataan) dalam tempat kosong */
  tunas(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    const parts = T(g.text).split("___");
    el.innerHTML = `<div class="bedbox"><div class="plant" id="plant" aria-hidden="true">🟫</div>
      <p class="sent">${parts[0]}<span class="blank" id="blank">____</span>${parts[1]||""}</p></div>
      <div class="packets">${opts.map((o,i)=>`<button class="tile packet" data-i="${i}" data-ok="${o.ok?1:0}"><span class="em" aria-hidden="true">🌰</span><span>${T(o.x)}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".packet").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = opts[+b.dataset.i];
      if(o.ok){ done = true; sfx.water(); b.classList.add("right"); const bl = el.querySelector("#blank"); bl.textContent = T(o.x); bl.classList.add("fill");
        const pl = el.querySelector("#plant"); pl.textContent = "🌱"; setTimeout(()=>{ pl.textContent = "🌻"; pl.classList.add("grow"); }, 250); clearHint(); setTimeout(win, 600); }
      else { b.classList.add("wrong"); oops(b, L("Benih itu tidak tumbuh di sini. Cuba lagi!","بنيه ايت تيدق تومبوه د سيني. چوبا لاڬي!")); }
    }));
  },

  /* Ternak: pilih makanan, kemudian beri kepada haiwan yang betul (padanan) */
  ternak(el, g){
    const AN = ["🐄","🐐","🐔","🦆","🐑"], FD = ["🌿","🥬","🌽","🥕","🍎"];
    const pens = g.pairs.map((p,i)=>({t:p[0], i})), foods = mix(g.pairs.map((p,i)=>({t:p[1], i})));
    let sel = null, fed = 0;
    el.innerHTML = `<div class="barnyard"><div class="col"><h4>${L("Haiwan","حيوان")}</h4>${pens.map(p=>`<button class="tile pen" data-i="${p.i}"><span class="em" aria-hidden="true">${AN[p.i%AN.length]}</span><span>${T(p.t)}</span></button>`).join("")}</div>
      <div class="col"><h4>${L("Makanan","ماکنن")}</h4>${foods.map(f=>`<button class="tile food" data-i="${f.i}">${FD[f.i%FD.length]} ${T(f.t)}</button>`).join("")}</div></div>
      <div class="cnt" id="tcnt">👆 ${L("Pilih makanan, kemudian pilih haiwan.","ڤيليه ماکنن، کمودين ڤيليه حيوان.")}</div>`;
    el.querySelectorAll(".food").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".food").forEach(x=>x.classList.remove("sel")); sel = +b.dataset.i; b.classList.add("sel"); sfx.tick();
      speak(RU(g.pairs[sel][1]));
    }));
    el.querySelectorAll(".pen").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("fed")) return;
      if(sel===null){ toast(L("Pilih makanan dahulu 🌿","ڤيليه ماکنن دهولو 🌿")); return; }
      const fb = el.querySelector(`.food[data-i="${sel}"]`);
      if(+b.dataset.i===sel){
        sfx.baa(); clearHint(); b.classList.add("fed"); fb.classList.add("fed"); fb.classList.remove("sel");
        b.querySelector(".em").textContent += "😋"; sel = null; fed++;
        el.querySelector("#tcnt").textContent = `🍽️ ${fed} / ${g.pairs.length}`;
        if(fed===g.pairs.length) setTimeout(win, 450);
      } else { oops(b, L("Haiwan itu tidak mahu makanan ini. Cuba haiwan lain!","حيوان ايت تيدق ماهو ماکنن اين. چوبا حيوان لاٴين!")); }
    }));
  },

  /* Siram: siram pokok jika ayat betul, cabut jika salah */
  siram(el, g){
    const items = mix(g.items); let k = 0;
    const STAGE = ["🌰","🌱","🌿","🪴","🌳","🌻"];
    const draw = () => {
      el.innerHTML = `<div class="sprout"><div class="plant" aria-hidden="true">${STAGE[Math.min(k,STAGE.length-1)]}</div>
        <div class="stxt" id="stxt">${k<items.length?T(items[k][0]):"🎉"}</div></div>
        <div class="cans"><button class="tile can" data-v="1"><span class="em" aria-hidden="true">💧</span>${L("Betul: siram","بتول: سيرم")}</button>
          <button class="tile can" data-v="0"><span class="em" aria-hidden="true">✂️</span>${L("Salah: cabut","ساله: چابوت")}</button></div>
        <div class="cnt">🌱 ${Math.min(k+1,items.length)} / ${items.length}</div>`;
      if(k<items.length) speak(RU(items[k][0]));
      el.querySelectorAll(".can").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.v===items[k][1]){
          b.dataset.v==="1" ? sfx.water() : sfx.plop(); clearHint(); k++; draw();
          if(k===items.length) setTimeout(win, 400);
        } else oops(el.querySelector("#stxt"), items[k][1] ? L("Ayat ini betul. Siramlah!","ايات اين بتول. سيرمله!") : L("Ayat ini salah. Cabutlah!","ايات اين ساله. چابوتله!"));
      }));
    };
    draw();
  },

  /* Rumpai: cabut semua rumpai (ayat yang salah), tinggalkan tanaman */
  rumpai(el, g){
    const items = mix(g.items); const need = items.filter(x=>!x[1]).length; let k = 0;
    el.innerHTML = `<div class="plotgrid">${items.map((it,i)=>`<button class="tile patch" data-i="${i}" data-ok="${it[1]}"><span class="em" aria-hidden="true">🌿</span><span>${T(it[0])}</span></button>`).join("")}</div>
      <div class="cnt" id="rcnt">🪴 ${L(`Cabut ${need} rumpai!`,`چابوت ${need} رومڤاي!`)}</div>`;
    el.querySelectorAll(".patch").forEach(b => b.addEventListener("click", () => {
      if(k>=need || b.classList.contains("pulled")) return;
      const it = items[+b.dataset.i];
      if(!it[1]){
        k++; sfx.plop(); clearHint(); b.classList.add("pulled"); b.querySelector(".em").textContent = "🥀";
        el.querySelector("#rcnt").textContent = `🪴 ${k} / ${need}`;
        if(k===need){ el.querySelectorAll(".patch:not(.pulled) .em").forEach(e=>e.textContent="🌾"); setTimeout(win, 500); }
      } else { b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"), 700); oops(b, L("Itu tanaman yang baik, jangan dicabut!","ايت تانمن يڠ باٴيق، جاڠن دچابوت!")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t2-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Tuai petak sebelumnya dahulu 🔒","توواي ڤتق سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} petak untuk membuka Cabaran Jelapang 🏆`,`سلسايکن سموا ${STATIONS.length} ڤتق اونتوق ممبوک چابرن جلاڤڠ 🏆`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
