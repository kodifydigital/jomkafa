<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7B3FBF">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Istana Suci Naga Nana • Feqah Tahun 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Feqah Tahun 2: "Istana Suci Naga Nana" — istana ungu & emas, menara batu, parit & titian ===== */
:root{
  --sky1:#B9A2F5; --sky2:#EDE4FF; --hill:#8FCB7A; --hill2:#6BAF5C;
  --bg:#FBF7FF; --card:#FFFFFF; --ink:#2A1846; --muted:#66578A; --line:#2A1846;
  --brand:#7B3FBF; --brand2:#5B2A99; --gold:#F2B630; --gold2:#C98E0A; --stone:#E4DDF0; --stone2:#BDB2D6;
  --moat:#62B6E0; --wood:#B5793F; --wood2:#8A5527; --parch:#FFF3D6;
  --ok:#2FA866; --okbg:#DDF6E6; --bad:#E04848; --badbg:#FFE2E0; --note:#FFF4CF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#140B2E; --sky2:#2A1B55; --hill:#24533A; --hill2:#1A3D2A;
    --bg:#120B26; --card:#22173F; --ink:#F3EDFF; --muted:#C3B6E8; --line:#06030E;
    --stone:#4A3D70; --stone2:#362A58; --moat:#1F5A86; --parch:#3A3020;
    --note:#3A3115; --okbg:#173F2B; --badbg:#4A2420; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Andika","Trebuchet MS",system-ui,sans-serif;font-size:19px;line-height:1.4;
  background:radial-gradient(circle at 85% 70px,#FFE9A8 0 34px,transparent 36px),linear-gradient(180deg,var(--sky1) 0,var(--sky2) 440px,var(--bg) 900px) fixed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:radial-gradient(circle at 85% 70px,#F6F0C8 0 26px,transparent 28px),radial-gradient(1px 1px at 20% 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 120px,#fff,transparent),radial-gradient(1px 1px at 40% 200px,#fff,transparent),linear-gradient(180deg,var(--sky1) 0,var(--sky2) 440px,var(--bg) 900px) fixed}}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Andika",serif;font-size:20px;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 60px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:22px;font-weight:700;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:0 10px}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 14px;border-radius:14px;border:3px solid var(--line);background:var(--gold);color:#3A2600;font-weight:700;box-shadow:0 4px 0 var(--line)}

/* tajuk */
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 6px 0 var(--line);margin:4px 0 14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 24px)}
.hero h1{margin:0;font-size:clamp(24px,6vw,31px);line-height:1.12;color:var(--gold);text-shadow:0 2px 0 var(--line)}
html[dir="rtl"] .hero h1{line-height:1.5}
.hero p{margin:2px 0 6px;color:#F1E8FF;font-size:16px;font-weight:700}
.naga{width:84px;height:auto;flex:none;overflow:visible}
.naga.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.naga.yay{animation:yay .5s ease 2}
@keyframes yay{50%{transform:translateY(-14px) scale(1.06)}}

/* lencana */
.sttl{font-weight:700;font-size:15px;margin:0 0 4px;color:var(--muted)}
.stickers{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;background:var(--note);border:3px solid var(--line);border-radius:16px;padding:8px;margin-bottom:16px;box-shadow:0 4px 0 var(--line)}
.stickers span{aspect-ratio:1;border-radius:10px 10px 50% 50%;display:grid;place-items:center;font-size:clamp(15px,4.6vw,24px);background:rgba(0,0,0,.06);filter:grayscale(1);opacity:.35}
.stickers span.got{filter:none;opacity:1;background:var(--gold);animation:pop .5s both}

/* peta istana */
.castle{position:relative;border:3px solid var(--line);border-radius:24px;overflow:hidden;padding:14px 6px 0;box-shadow:0 6px 0 var(--line);
  background:radial-gradient(120% 60% at 50% 105%,var(--hill) 0 60%,transparent 61%),linear-gradient(180deg,transparent 0,color-mix(in srgb,var(--brand) 12%,transparent) 100%),var(--sky2)}
.throne{display:flex;justify-content:center;margin-bottom:6px}
.trow{position:relative;display:flex;justify-content:space-around;align-items:flex-end;margin:0 0 18px}
.trow::before{content:"";position:absolute;left:12%;right:12%;bottom:46px;height:26px;z-index:0;border:3px solid var(--line);border-radius:4px;
  background:repeating-linear-gradient(90deg,var(--stone2) 0 2px,transparent 2px 26px),linear-gradient(var(--stone),var(--stone2))}
.trow::after{content:"";position:absolute;left:12%;right:12%;bottom:72px;height:10px;z-index:0;background:repeating-linear-gradient(90deg,var(--line) 0 3px,var(--stone) 3px 17px,var(--line) 17px 20px,transparent 20px 30px)}
.trow:nth-child(odd){padding-inline-start:18px}.trow:nth-child(even){padding-inline-end:18px}
.tower{position:relative;z-index:1;background:none;border:0;padding:0;width:46%;display:flex;flex-direction:column;align-items:center;gap:2px}
.tw{position:relative;width:100px;height:130px;display:block}
.tw svg.tsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tw .win{position:absolute;top:56px;left:50%;transform:translateX(-50%);font-size:28px;line-height:1}
.tw .badge{position:absolute;top:30px;inset-inline-start:-4px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;border:3px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700}
.tw .perch{position:absolute;bottom:-6px;inset-inline-end:-46px;width:58px}
.tw .perch .naga{width:58px}
.tw.big{width:126px;height:158px}
.tw.big .win{top:70px;font-size:34px}
.tower .nm{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:700;font-size:15.5px;line-height:1.25;text-align:center;max-width:100%;box-shadow:0 3px 0 var(--line)}
html[dir="rtl"] .tower .nm{font-size:16px;line-height:1.6}
.tower .st{font-size:15px;min-height:20px;letter-spacing:1px}
.tower .st .off{filter:grayscale(1);opacity:.3}
.tower.lock .tsvg,.tower.lock .win{filter:grayscale(.85);opacity:.7}
.tower.lock .nm{opacity:.75}
.tower.now .nm{background:var(--gold);color:#2A1846}
.tower.now .tsvg{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px var(--gold))}}
.tower:active .tw{transform:scale(.96)}
.moat{height:62px;margin:0 -6px;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(255,255,255,.35) 24px 36px) 0 14px/100% 4px no-repeat,var(--moat);border-top:3px solid var(--line);display:grid;place-items:center}
.bridge{background:var(--wood);color:#fff;border:3px solid var(--line);border-radius:10px;padding:2px 16px;font-weight:700;font-size:16px;background-image:repeating-linear-gradient(90deg,transparent 0 18px,var(--wood2) 18px 21px)}
</style>
<style>
/* kad & bacaan */
@keyframes pagein{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes spin{from{transform:rotate(-360deg) scale(0)}}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line);animation:pagein .35s ease both;position:relative}
.card.scroll{background:linear-gradient(var(--card),var(--card)) padding-box;border-top:12px solid var(--sc)}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead .bub{width:60px;height:60px;flex:none;border-radius:14px 14px 50% 50%;background:var(--c);border:3px solid var(--line);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 var(--line)}
.shead h2{margin:0;font-size:clamp(21px,5vw,26px);line-height:1.15}
html[dir="rtl"] .shead h2{line-height:1.6}
.shead small{display:block;color:var(--muted);font-weight:700;font-size:14.5px}
.rpic{font-size:60px;text-align:center;line-height:1.1;margin-bottom:4px;animation:pop .4s both}
.rh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:clamp(20px,5vw,24px);color:var(--brand)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rh,:root:not([data-theme="light"]) .res h2{color:var(--gold)}}
.rtext{margin:0 0 10px;font-weight:700;font-size:19px;background:var(--note);border:2px dashed var(--gold2);border-radius:14px;padding:8px 12px}
.rlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:7px;counter-reset:n}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border:2px solid color-mix(in srgb,var(--line) 25%,transparent);border-radius:12px;padding:6px 10px;font-weight:700;line-height:1.3;animation:pagein .35s both;animation-delay:calc(var(--i)*70ms)}
html[dir="rtl"] .rlist li{line-height:1.7}
.rlist li::before{counter-increment:n;content:counter(n);flex:none;width:30px;height:30px;border-radius:8px 8px 50% 50%;background:var(--sc);color:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700}
.rlist.bad li::before{content:"✗";background:var(--bad)}
.abox{background:var(--note);border:3px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 10px;text-align:center}
.abox .ar{display:block;font-size:clamp(23px,6vw,30px);line-height:1.9}
.abox .mk{display:block;font-weight:700;font-size:16px;color:var(--muted);margin-top:4px}
.abox small{display:block;font-weight:700;font-size:14px;color:var(--muted)}
.tip{display:flex;gap:8px;align-items:flex-start;background:#EFE7FF;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:0 0 8px;font-weight:700;font-size:17px;color:#33195E}
.tip.am{background:#E6F7EA;color:#1C4A2A}
.tip b{flex:none}
.ref{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
.navr{display:flex;gap:8px;margin-top:12px}
.navr .btn{flex:1}
.btn{display:block;width:100%;border:3px solid var(--line);border-radius:16px;padding:12px;font-size:21px;font-weight:700;background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--line);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink);text-shadow:none}
.btn.go{background:var(--ok)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--line) 25%,transparent)}
.dots i.on{background:var(--brand);width:26px;border-radius:99px}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--gold);font-size:20px;box-shadow:0 3px 0 var(--line);flex:none}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* main */
.prog{position:relative;height:48px;margin:2px 4px 12px}
.prog .wall{position:absolute;left:0;right:0;bottom:4px;height:20px;border:3px solid var(--line);border-radius:4px;background:repeating-linear-gradient(90deg,var(--stone2) 0 2px,var(--stone) 2px 24px)}
.prog .pf{position:absolute;bottom:20px;transform:translateX(-50%);font-size:20px}
html[dir="rtl"] .prog .pf{transform:translateX(50%)}
.prog .fly{position:absolute;top:50%;transform:translate(-50%,-60%);font-size:34px;transition:left .4s,right .4s;z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.q{display:flex;gap:10px;align-items:center;margin:0 0 12px}
.q p{margin:0;flex:1;font-size:clamp(19px,5vw,23px);font-weight:700;line-height:1.3}
html[dir="rtl"] .q p{line-height:1.75}
.qpic{font-size:56px;text-align:center;line-height:1.1;margin:-4px 0 6px}
.cnt{text-align:center;color:var(--muted);font-weight:700;font-size:15.5px;margin-top:10px}
.hint{margin-top:10px;background:var(--badbg);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;animation:pop .3s both}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tile{border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);font-weight:700;min-height:56px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
</style>
<style>
/* kunci: pintu menara */
.gate{position:relative;border:3px solid var(--line);border-radius:60px 60px 10px 10px;background:var(--stone);padding:10px 10px 0;margin-bottom:12px;overflow:hidden}
.locks{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;position:relative;z-index:3}
.lk{display:inline-flex;align-items:center;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:18px}
.lk b{font-size:14px}.lk.open{background:var(--okbg)}
.doorway{position:relative;height:92px;margin:8px auto 0;width:150px;border:3px solid var(--line);border-bottom:0;border-radius:75px 75px 0 0;overflow:hidden;background:#FFE9A8}
.doorway .dl,.doorway .dr{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,var(--wood) 0 16px,var(--wood2) 16px 19px);z-index:2;transition:transform .6s ease}
.doorway .dl{left:0;border-right:2px solid var(--line)}.doorway .dr{right:0;border-left:2px solid var(--line)}
.doorway .behind{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:70px}
.doorway .behind .naga{width:70px}
.gate.open .dl{transform:translateX(-100%)}.gate.open .dr{transform:translateX(100%)}
.keys{display:grid;gap:8px}
.key{display:flex;align-items:center;gap:8px;text-align:start;padding:8px 12px;background:#FFF1C9;color:#3A2600;border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);font-weight:700;min-height:56px;line-height:1.3}
html[dir="rtl"] .key{line-height:1.7}
.key .em{font-size:24px}.key .kk{font-size:20px}
.key.used{opacity:.4;box-shadow:none;transform:translateY(3px);border-style:dashed}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* perisai */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bans,.shs{display:grid;gap:10px;align-content:start}
.bn{min-height:74px;padding:8px 8px 18px;border:3px solid var(--line);background:var(--pc);color:#fff;font-weight:700;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);text-shadow:0 1px 0 rgba(0,0,0,.3);line-height:1.25}
.bn.sel{outline:none;filter:brightness(1.15) drop-shadow(0 0 6px var(--gold));transform:scale(1.05)}
.bn.ok{opacity:.55}
.bn .ar,.sh .ar{font-size:19px;line-height:1.8}
.sh{min-height:74px;padding:8px 10px 14px;border:3px solid var(--line);background:var(--card);border-radius:14px 14px 50% 50% / 14px 14px 36% 36%;font-weight:700;font-size:16px;line-height:1.25;box-shadow:0 4px 0 var(--line)}
html[dir="rtl"] .sh,html[dir="rtl"] .bn{line-height:1.6}
.sh.ok{background:var(--pc);color:#fff;opacity:.85;box-shadow:none}

/* manjanik */
.rampart{display:grid;gap:10px;padding:12px 10px;border:3px solid var(--line);border-radius:12px;background:repeating-linear-gradient(0deg,var(--stone2) 0 2px,transparent 2px 30px),repeating-linear-gradient(90deg,var(--stone2) 0 2px,transparent 2px 46px),var(--stone)}
.tgt{display:flex;align-items:center;gap:10px;text-align:start;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;min-height:58px;box-shadow:0 4px 0 var(--line);line-height:1.3}
html[dir="rtl"] .tgt{line-height:1.7}
.tgt .bull{font-size:28px;flex:none}
.tgt.hit{background:var(--okbg);animation:pop .3s}.tgt.hit .bull::after{content:"💥"}
.tgt.miss{background:var(--badbg)}
.cata{position:relative;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:26px}
.cata .arm{transform:rotate(-30deg);display:block;font-size:30px;margin-bottom:-10px}
.cata .rock{position:absolute;top:0;left:50%;transform:translateX(-50%);opacity:0}
.cata .rock.fire{animation:fire .5s ease-out}
@keyframes fire{0%{opacity:1;transform:translate(-50%,10px) scale(1)}100%{opacity:0;transform:translate(-50%,-180px) scale(.5)}}

/* skrol diraja */
.royal{display:flex;flex-direction:column;align-items:stretch}
.royal .rod{height:16px;margin:0 -4px;border:3px solid var(--line);border-radius:10px;background:linear-gradient(var(--gold),var(--gold2))}
.parch{position:relative;background:var(--parch);border-inline:3px solid var(--line);padding:14px 16px 18px;min-height:120px;display:grid;place-items:center;text-align:center}
.parch .seal{position:absolute;top:4px;inset-inline-start:6px;font-size:20px}
.stxt{margin:0;font-size:clamp(19px,5vw,22px);font-weight:700}
.mark{position:absolute;bottom:4px;inset-inline-end:10px;font-size:40px;font-weight:700;transform:rotate(-14deg) scale(0);opacity:0}
.mark.on{transform:rotate(-14deg) scale(1);opacity:1;transition:.2s}.mark.y{color:var(--ok)}.mark.n{color:var(--bad)}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stamp{min-height:64px;border:3px solid var(--line);border-radius:50px;font-size:21px;font-weight:700;color:#fff;box-shadow:0 5px 0 var(--line)}
.stamp.yes{background:var(--ok)}.stamp.nope{background:var(--bad)}
.stamp:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}

/* harta */
.chest{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.chest .lid{font-size:64px;line-height:1}
.chest .cnum{font-weight:700;background:var(--gold);color:#3A2600;border:2px solid var(--line);border-radius:99px;padding:0 12px}
.chest.bump .lid{animation:pop .3s}
.coins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.coin{display:flex;align-items:center;gap:6px;text-align:start;background:linear-gradient(#FFE58A,#F2B630);color:#3A2600;border:3px solid var(--line);border-radius:30px;padding:6px 10px;min-height:60px;font-weight:700;font-size:16px;line-height:1.25;box-shadow:0 4px 0 var(--line)}
html[dir="rtl"] .coin{line-height:1.6}
.coin .cm{font-size:22px;flex:none}
.coin.in{opacity:.35;box-shadow:none;transform:scale(.92);pointer-events:none}.coin.in .cm::after{content:"✔"}
.coin.no{background:var(--badbg)}

/* titian */
.moatbox{border:3px solid var(--line);border-radius:14px;padding:10px;background:repeating-linear-gradient(170deg,transparent 0 18px,rgba(255,255,255,.18) 18px 22px),var(--moat)}
.planks{display:grid;gap:6px}
.plank{display:flex;align-items:center;gap:8px;padding:6px 10px;border:3px solid var(--line);border-radius:6px;background:repeating-linear-gradient(90deg,var(--wood) 0 40px,var(--wood2) 40px 43px);color:#fff;font-weight:700;font-size:16px;line-height:1.3;min-height:48px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.plank b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3A2600;display:grid;place-items:center;font-size:14px;text-shadow:none}
.plank.gap{background:rgba(255,255,255,.25);border-style:dashed;color:var(--ink);text-shadow:none}
.plank.gap.now{background:rgba(255,241,201,.85);animation:glow 1.4s infinite}
.plank.fixed{animation:pop .3s}
.moatbox.done{box-shadow:0 0 0 4px var(--gold)}
.pool{display:grid;gap:8px;margin-top:10px}
.pk{background:#FFF1C9;color:#3A2600;border:3px solid var(--line);border-radius:12px;box-shadow:0 4px 0 var(--line);padding:8px 12px;min-height:54px;font-weight:700;text-align:start;line-height:1.3}
.pk.used{opacity:.3;box-shadow:none}

/* panji */
.banner{display:flex;justify-content:center;align-items:flex-start;gap:0;margin-bottom:10px}
.banner .pole{width:8px;height:96px;background:var(--wood2);border:2px solid var(--line);border-radius:4px}
.cloth{display:flex;flex:0 1 260px;height:80px;border:3px solid var(--line);border-inline-start:0;clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);background:var(--card)}
.cloth i{flex:1;display:grid;place-items:center;font-style:normal;font-size:16px;border-inline-end:1px dashed color-mix(in srgb,var(--line) 30%,transparent);animation:pop .3s both}
.pitem{text-align:center;background:var(--note);border:3px solid var(--line);border-radius:14px;padding:12px;font-weight:700;font-size:clamp(19px,5vw,22px);min-height:64px;margin-bottom:10px}
.pots{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.pot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:3px solid var(--line);border-radius:14px 14px 30px 30px;background:var(--pc);color:#fff;font-weight:700;font-size:15.5px;min-height:84px;box-shadow:0 4px 0 var(--line);text-shadow:0 1px 0 rgba(0,0,0,.35);line-height:1.2}
.pot .em{font-size:28px}
.pot:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* permata */
.crownbox{text-align:center;margin-bottom:10px}
.crown{position:relative;display:inline-block;font-size:70px;line-height:1}
.crown .slot{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:24px}
.sent{font-size:clamp(19px,5vw,22px);font-weight:700;margin:6px 0 0;line-height:1.5}
html[dir="rtl"] .sent{line-height:1.9}
.blank{display:inline-block;min-width:70px;border-bottom:4px dotted var(--gold2);color:var(--brand);padding:0 4px}
.blank.fill{border-bottom-style:solid;background:var(--note);border-radius:6px;animation:pop .3s}
.gems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:var(--card);border:3px solid var(--line);border-radius:18px 18px 40px 40px;box-shadow:0 4px 0 var(--line);font-weight:700;min-height:80px;line-height:1.25}
.gem .em{font-size:28px}.gem.right{background:var(--okbg)}.gem.wrong{background:var(--badbg)}

/* maklum balas & keputusan */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .3s ease both}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:680px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 -4px 0 var(--line),0 6px 0 var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb .row1{display:flex;gap:10px;align-items:center}
.fb .naga{width:68px}
.fb strong{display:block;font-size:24px;color:var(--ok)}
.fb p{margin:0;font-weight:700;font-size:17px;line-height:1.35}
html[dir="rtl"] .fb p{line-height:1.7}
.res{text-align:center}
.res .naga{width:130px;margin:0 auto;display:block}
.res .stars{font-size:58px;letter-spacing:6px;line-height:1.1}
.res .stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.res .stars .off{filter:grayscale(1);opacity:.25}
.res h2{margin:4px 0;font-size:32px;color:var(--brand)}
.res p{margin:0 0 8px;color:var(--muted);font-weight:700}
.gotst{display:inline-flex;align-items:center;gap:10px;background:var(--note);border:3px dashed var(--line);border-radius:18px;padding:8px 16px;font-weight:700;margin:6px 0 10px}
.gotst span{font-size:44px;animation:spin 1s ease both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(380deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[587,.12],[880,.2]]),
  tick: () => tone([[784,.08,"triangle"]]),
  no:   () => tone([[233,.18,"square"],[185,.2,"square"]]),
  clank:() => tone([[420,.05,"square"],[620,.08,"triangle"]]),
  coin: () => tone([[988,.06,"square"],[1319,.12,"square"]]),
  whoosh:()=> tone([[300,.08,"sawtooth"],[500,.08,"sawtooth"],[800,.1,"triangle"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.32]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/___/g," ... ").replace(/…/g," ... ").replace(/SWT/g,"subhanahu wa taala"));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .92; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}

    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="royal"><span class="rod" aria-hidden="true"></span><div class="parch" id="parch"><span class="seal" aria-hidden="true">📜</span><p class="stxt">${T(items[k][0])}</p><span class="mark" id="mark"></span></div><span class="rod" aria-hidden="true"></span></div>
        <div class="stamps"><button class="stamp yes" data-v="1">✔ ${L("Betul","بتول")}</button><button class="stamp nope" data-v="0">✘ ${L("Salah","ساله")}</button></div>
        <div class="cnt">${k+1} / ${items.length}</div>`;
      speak(RU(items[k][0]));
      el.querySelectorAll(".stamp").forEach(b => b.addEventListener("click", () => {
        if(el.dataset.busy) return;
        if(+b.dataset.v===items[k][1]){
          sfx.tick(); clearHint();
          const m = el.querySelector("#mark"); m.textContent = items[k][1] ? "✔" : "✘"; m.className = "mark on " + (items[k][1]?"y":"n");
          k++;
          if(k<items.length){ el.dataset.busy = "1"; setTimeout(()=>{ delete el.dataset.busy; draw(); }, 350); } else setTimeout(win, 350);
        } else oops(el.querySelector("#parch"), items[k][1] ? L("Kenyataan ini betul. Cop BETUL!","كڽاتاٴن اين بتول. چوڤ بتول!") : L("Kenyataan ini salah. Cop SALAH!","كڽاتاٴن اين ساله. چوڤ ساله!"));
      }));
    };
    draw();
  },

  /* Peti harta: masukkan SEMUA syiling yang betul */
  harta(el, g){
    const coins = shuffle(g.coins); const need = coins.filter(c=>c[1]).length; let k = 0;
    el.innerHTML = `<div class="vault"><div class="chest" id="chest" aria-hidden="true"><span class="lid">🧰</span><span class="cnum" id="cnum">0 / ${need}</span></div>
      <div class="coins">${coins.map((c,i)=>`<button class="coin" data-i="${i}" data-ok="${c[1]}"><span class="cm" aria-hidden="true">🪙</span><span>${T(c[0])}</span></button>`).join("")}</div></div>
      <div class="cnt">🪙 ${L(`Cari ${need} syiling yang betul!`,`چاري ${need} شيليڠ يڠ بتول!`)}</div>`;
    el.querySelectorAll(".coin").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("in") || k>=need) return;
      if(coins[+b.dataset.i][1]){
        k++; sfx.coin(); b.classList.add("in"); clearHint();
        el.querySelector("#cnum").textContent = `${k} / ${need}`;
        const ch = el.querySelector("#chest"); ch.classList.remove("bump"); void ch.offsetWidth; ch.classList.add("bump");
        if(k===need){ ch.classList.add("full"); el.querySelector(".lid").textContent = "💰"; setTimeout(win, 500); }
      } else { b.classList.add("no"); oops(b, L("Syiling itu palsu! Cari yang betul.","شيليڠ ايت ڤلسو! چاري يڠ بتول.")); }
    }));
  },

  /* Titian: lengkapkan papan jambatan yang hilang */
  titian(el, g){
    const pool = shuffle(g.gaps.map(i=>({t:g.steps[i], idx:i})).concat((g.extra||[]).map(t=>({t, idx:-1})))); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="moatbox"><div class="planks">${g.steps.map((s,i)=>{
          const gi = g.gaps.indexOf(i), open = gi>=k;
          return `<div class="plank ${gi<0?"":open?(gi===k?"gap now":"gap"):"fixed"}"><b>${i+1}</b><span>${open?"❓":T(s)}</span></div>`; }).join("")}</div></div>
        <div class="pool">${pool.map((p,n)=>`<button class="pk ${p.used?"used":""}" data-n="${n}" data-idx="${p.idx}" ${p.used?"disabled":""}>🪵 ${T(p.t)}</button>`).join("")}</div>
        <div class="cnt">🌉 ${L(`Pilih papan untuk langkah ke-${g.gaps[Math.min(k,g.gaps.length-1)]+1}`,`ڤيليه ڤاڤن اونتوق لڠكه ك-${g.gaps[Math.min(k,g.gaps.length-1)]+1}`)}</div>`;
      el.querySelectorAll(".pk").forEach(b => b.addEventListener("click", () => {
        if(k>=g.gaps.length) return; const p = pool[+b.dataset.n]; if(p.used) return;
        if(p.idx===g.gaps[k]){
          p.used = true; k++; sfx.clank(); clearHint(); draw();
          if(k===g.gaps.length){ el.querySelector(".moatbox").classList.add("done"); setTimeout(win, 450); }
        } else oops(b, L(`Papan itu tidak muat. Apakah langkah ke-${g.gaps[k]+1}?`,`ڤاڤن ايت تيدق موات. اڤاكه لڠكه ك-${g.gaps[k]+1}؟`));
      }));
    };
    draw();
  },

  /* Warnakan panji: hantar setiap item ke kumpulan yang betul */
  panji(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="banner" aria-hidden="true"><span class="pole"></span><div class="cloth">${items.map((it,i)=>`<i style="${i<k?`background:${g.cats[it[1]][2]}`:""}">${i<k?g.cats[it[1]][1]:""}</i>`).join("")}</div></div>
        <div class="pitem" id="pitem">${T(items[k][0])}</div>
        <div class="pots" style="--n:${g.cats.length}">${g.cats.map((c,i)=>`<button class="pot" data-c="${i}" style="--pc:${c[2]}"><span class="em" aria-hidden="true">${c[1]}</span><span>${T(c[0])}</span></button>`).join("")}</div>
        <div class="cnt">🎨 ${k+1} / ${items.length}</div>`;
      speak(RU(items[k][0]));
      el.querySelectorAll(".pot").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.c===items[k][1]){
          sfx.tick(); clearHint(); k++;
          if(k<items.length) draw(); else { draw2(); setTimeout(win, 400); }
        } else oops(el.querySelector("#pitem"), L("Bukan kumpulan itu. Baca semula kad bacaan.","بوكن كومڤولن ايت. باچ سمولا كد باچاٴن."));
      }));
    };
    const draw2 = () => { el.querySelector(".cloth").innerHTML = items.map(it=>`<i style="background:${g.cats[it[1]][2]}">${g.cats[it[1]][1]}</i>`).join(""); el.querySelector("#pitem").textContent = "🎉"; };
    draw();
  },

  /* Permata mahkota: lengkapkan ayat */
  permata(el, g){
    const gems = shuffle(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    const GEM = ["💎","🔮","💠"];
    const parts = T(g.text).split("___");
    el.innerHTML = `<div class="crownbox"><div class="crown" aria-hidden="true">👑<span class="slot" id="slot">❔</span></div>
      <p class="sent">${parts[0]}<span class="blank" id="blank">____</span>${parts[1]||""}</p></div>
      <div class="gems">${gems.map((o,i)=>`<button class="gem" data-i="${i}" data-ok="${o.ok?1:0}"><span class="em" aria-hidden="true">${GEM[i%3]}</span><span>${T(o.x)}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".gem").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = gems[+b.dataset.i];
      if(o.ok){ done = true; sfx.coin(); b.classList.add("right"); const bl = el.querySelector("#blank"); bl.textContent = T(o.x); bl.classList.add("fill");
        el.querySelector("#slot").textContent = GEM[+b.dataset.i%3]; setTimeout(win, 450); }
      else { b.classList.add("wrong"); oops(b, L("Permata itu tidak sesuai. Cuba lagi!","ڤرمات ايت تيدق سسواي. چوبا لاڬي!")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t2-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan menara sebelumnya dahulu 🔒","سلسايكن منارا سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} menara untuk membuka Cabaran Mahkota 👑`,`سلسايكن سموا ${STATIONS.length} منارا اونتوق ممبوك چابرن مهكوتا 👑`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
