<title>Sampan Hafiz • Hafazan Tahun 2</title>

<link href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Hafazan Tahun 2: "Sampan Hafiz" — sampan menghilir Sungai Bakau dari hulu ke kuala, kelip-kelip, Kiko si pekaka ===== */
:root{
  --dusk1:#3E2F6B; --dusk2:#C8607A; --dusk3:#FF9F5A; --deep:#0B3C49; --river:#1B7F8C; --river2:#46B5B0;
  --mang:#2F6B3A; --mang2:#4E8C3E; --fly:#E8FF6B; --wood:#A0602D; --wood2:#D9A066; --kiko:#1E88E5; --kor:#FF7F2A;
  --bg:#F2FBF8; --card:#FFFFFF; --ink:#123540; --muted:#4F6E75; --line:#123540;
  --brand:#1B7F8C; --brand2:#C2551A; --water:#DFF4F2; --plank:#F3DDB7;
  --ok:#1E9E5A; --okbg:#DDF6E7; --bad:#D9434B; --badbg:#FFE3E3; --note:#FFF4DC;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0A2329; --card:#13353D; --ink:#EAF8F5; --muted:#A7C8CC; --line:#04161A; --water:#18454E; --plank:#4A3420;
    --okbg:#1A4A33; --badbg:#5A2430; --note:#3E3420; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{font-family:"Short Stack",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--dusk1) 0,var(--dusk2) 240px,var(--dusk3) 460px,var(--river) 760px,var(--deep) 1300px) fixed;background-color:var(--deep);min-height:100vh;-webkit-tap-highlight-color:transparent}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Short Stack",serif;font-weight:600}
.ar{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400;line-height:2.1}
.wrap{max-width:460px;margin:0 auto;padding:10px 14px 40px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid var(--fly);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;text-decoration:none;color:var(--ink);padding:0 12px;box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;white-space:nowrap}
.hero{display:flex;gap:10px;align-items:center;color:#fff;margin:4px 0 8px}
.hero h1{margin:0;font-size:28px;line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.hero p{margin:4px 0 0;font-size:15px;opacity:.95;line-height:1.35}
.kiko{width:92px;height:92px;flex:0 0 auto;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.yay{animation:yay .7s ease 2}
@keyframes yay{50%{transform:scale(1.15) rotate(-8deg)}}
.sttl{color:#fff;margin:6px 2px;font-size:15px}
.stickers{display:flex;flex-wrap:wrap;gap:6px;background:rgba(11,60,73,.35);border:2px dashed rgba(232,255,107,.8);border-radius:16px;padding:8px}
.stickers span{font-size:26px;width:38px;height:38px;display:grid;place-items:center;filter:grayscale(1) opacity(.35)}
.stickers span.got{filter:none;animation:yay .6s}
/* ---- peta: sungai berliku dari hulu ke kuala ---- */
.rivermap{position:relative;margin-top:14px;border-radius:26px;overflow:hidden;border:3px solid var(--line);background:
  radial-gradient(circle at 12% 30%,var(--fly) 0 2px,transparent 3px),radial-gradient(circle at 86% 46%,var(--fly) 0 2px,transparent 3px),radial-gradient(circle at 20% 74%,var(--fly) 0 2px,transparent 3px),radial-gradient(circle at 80% 88%,var(--fly) 0 2px,transparent 3px),
  linear-gradient(90deg,var(--mang) 0,var(--mang2) 14%,transparent 14.5%,transparent 85.5%,var(--mang2) 86%,var(--mang) 100%),
  repeating-linear-gradient(180deg,rgba(255,255,255,.14) 0 3px,transparent 3px 26px),
  linear-gradient(180deg,var(--river2) 0,var(--river) 50%,var(--deep) 100%)}
.hulu{text-align:center;color:#fff;font-weight:700;padding:14px 8px 0;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.row{display:flex;padding:22px 18px 4px}
.row.r{justify-content:flex-end}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:stretch;background:none;border:0;padding:0;width:68%}
.jeti{position:relative;width:100%;min-height:78px;background:repeating-linear-gradient(90deg,var(--plank) 0 22px,#E4C796 22px 25px);border:3px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 6px 0 var(--wood)}
@media (prefers-color-scheme: dark){ .jeti{background:repeating-linear-gradient(90deg,var(--plank) 0 22px,#3A2918 22px 25px)} }
.jeti::before,.jeti::after{content:"";position:absolute;bottom:-20px;width:8px;height:16px;background:var(--wood);border:2px solid var(--line);border-top:0;border-radius:0 0 3px 3px}
.jeti::before{left:14%}.jeti::after{right:14%}
.bub{width:52px;height:52px;flex:0 0 auto;border-radius:50%;background:var(--c);border:3px solid var(--line);display:grid;place-items:center;font-size:24px;position:relative}
.num{position:absolute;top:-8px;inset-inline-start:-8px;background:var(--fly);color:#123540;border:2px solid var(--line);border-radius:12px;font-size:13px;min-width:24px;height:24px;display:grid;place-items:center;font-family:"Short Stack",sans-serif}
.nm{font-size:17px;font-weight:700;text-align:start;flex:1;line-height:1.25;color:#123540}
@media (prefers-color-scheme: dark){ .nm{color:var(--ink)} }
.jn{display:block;font-size:12px;font-weight:400;opacity:.8}
.st{font-size:13px;min-height:16px;letter-spacing:-2px}
.node.lock .jeti{filter:saturate(.3);opacity:.8}.node.lock .bub{filter:grayscale(1)}
.node.lock .nm::after{content:" 🔒"}
.sampan-now{position:absolute;bottom:-34px;inset-inline-end:-22px;width:86px;z-index:3;pointer-events:none}
.row.r .sampan-now{inset-inline-end:auto;inset-inline-start:-22px}
.node.now .jeti{box-shadow:0 0 0 5px var(--fly),0 6px 0 var(--wood)}
.kuala{position:relative;margin-top:30px;padding:16px 8px 18px;text-align:center;color:#fff;background:radial-gradient(ellipse at 50% 0,rgba(232,255,107,.25),transparent 70%)}
.kuala .node{margin:0 auto;width:78%}
/* ---- kad ---- */
.shead{display:flex;gap:10px;align-items:center;color:#fff;margin-bottom:10px}
.shead h2{margin:0;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.3)}.shead small{opacity:.95}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 7px 0 rgba(4,22,26,.45);border-top:10px solid var(--sc,var(--brand))}
.rpic{font-size:44px;text-align:center}
.rh{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;margin:4px 0 10px;font-size:20px}
.say{width:44px;height:44px;border-radius:22px;border:3px solid var(--line);background:var(--fly);color:#123540;font-size:18px;flex:0 0 auto}
.surah{background:var(--water);border-radius:18px;padding:12px;text-align:center;font-size:26px;color:var(--ink)}
.surah .bsm{display:block;font-size:23px;margin-bottom:4px;opacity:.85}
.mark{font-size:.8em;color:var(--brand2);white-space:nowrap}
.ptg{display:grid;gap:10px}
.ptg .pr{background:var(--water);border-radius:16px;padding:8px}
.ptg .wds{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl}
.ptg .wd{background:var(--plank);border:2px solid var(--line);border-radius:10px;padding:0 10px;font-size:22px}
.ptg .full{text-align:center;font-size:22px;margin-top:4px}
.mkl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mkl li{background:var(--water);border-radius:16px;padding:10px 12px}
.mkl .ar{display:block;font-size:24px;text-align:center}
.mkl .m{display:flex;gap:8px;align-items:flex-start;font-size:16px;line-height:1.45}
.mkl .m b{background:var(--brand);color:#fff;border-radius:10px;min-width:28px;text-align:center;flex:0 0 auto;font-family:"Short Stack",sans-serif}
.tip{display:flex;gap:10px;background:var(--note);border:2px dashed var(--line);border-radius:16px;padding:10px 12px;margin:10px 0;font-size:16px;line-height:1.45}
.tip.am{background:var(--okbg)}
.tip ul{margin:4px 0 0;padding-inline-start:18px}
.abox{background:var(--water);border-radius:14px;padding:8px;text-align:center;margin-top:6px}
.abox .ar{display:block;font-size:23px}
.ref{margin-top:12px;font-size:14px;color:var(--muted);text-align:center}
.navr{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:56px;border-radius:16px;border:3px solid var(--line);background:var(--water);font-size:18px;font-weight:700;box-shadow:0 5px 0 var(--line);width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--kor);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:10px;height:10px;border-radius:5px;background:var(--water);border:2px solid var(--line)}.dots i.on{background:var(--brand);width:24px}
.prog{position:relative;height:34px;background:linear-gradient(180deg,var(--river2),var(--river));border:3px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
.prog .fill{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 14px);transition:width .4s}
.prog .bl{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:22px;transition:all .4s}
html[dir=rtl] .prog .bl{transform:translate(50%,-50%) scaleX(-1)}
.prog .end{position:absolute;top:50%;inset-inline-end:4px;transform:translateY(-50%);font-size:18px}
.q{display:flex;align-items:center;gap:8px;font-size:18px;line-height:1.4}.q p{margin:0;flex:1}
.qar{font-size:26px;text-align:center;background:var(--water);border-radius:16px;padding:6px 10px;margin:10px 0}
.hint{margin-top:10px;background:var(--badbg);border-radius:14px;padding:8px 12px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.right{background:var(--okbg)!important;border-color:var(--ok)!important}
.wrong{background:var(--badbg)!important}
</style>
<style>
/* ---- permainan ---- */
.track{position:relative;height:46px;margin:6px 0 4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 8px,transparent 8px 22px),linear-gradient(180deg,var(--river2),var(--river));border:3px solid var(--line);border-radius:23px}
.track .boat{position:absolute;top:50%;transform:translate(-50%,-55%);width:58px;transition:left .5s,right .5s}
.track .dock{position:absolute;top:50%;inset-inline-end:6px;transform:translateY(-50%);font-size:24px}
.cur{font-size:25px;text-align:center;background:var(--water);border:3px dashed var(--brand);border-radius:16px;padding:6px 10px;margin:8px 0}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{position:relative;border:3px solid var(--line);border-radius:16px 16px 40px 40px;background:var(--plank);font-size:21px;padding:28px 8px 10px;min-height:96px;box-shadow:0 5px 0 var(--wood);color:var(--ink)}
.pad::before{content:"🛶";position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:20px}
.pads.one{grid-template-columns:1fr}
.lline{position:relative;display:flex;flex-wrap:wrap;direction:rtl;justify-content:center;gap:4px;min-height:84px;padding:14px 6px 6px;margin:6px 0 10px;border-top:3px solid var(--wood);border-radius:50% 50% 0 0/14px 14px 0 0;background:linear-gradient(180deg,var(--deep),#1A5A66);border-radius:18px}
.lit{display:flex;flex-direction:column;align-items:center;color:var(--fly);animation:glow 1.6s ease-in-out infinite}
.lit i{font-style:normal;font-size:24px;filter:drop-shadow(0 0 8px #FFD25A)}
.lit .ar{font-size:20px;line-height:1.6;color:#FFF7CF}
.lslot{width:40px;height:56px;border:2px dashed rgba(255,255,255,.4);border-radius:12px}
@keyframes glow{50%{filter:brightness(1.25)}}
.lamps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.lamp{display:flex;flex-direction:column;align-items:center;min-width:84px;min-height:84px;border:3px solid var(--line);border-radius:18px 18px 12px 12px;background:var(--water);box-shadow:0 5px 0 var(--line);padding:4px 8px}
.lamp i{font-style:normal;font-size:26px;filter:grayscale(.7)}
.lamp .ar{font-size:22px;line-height:1.7}
.lamp.used{visibility:hidden}
.mkbox{background:var(--note);border:3px solid var(--line);border-radius:16px;padding:10px 12px;font-size:17px;line-height:1.5;margin:8px 0}
.rnd{text-align:center;color:var(--muted);font-size:14px;margin:4px 0}
.jars{display:grid;gap:10px;padding:10px;border-radius:18px;background:radial-gradient(circle at 20% 30%,rgba(232,255,107,.5) 0 3px,transparent 4px),radial-gradient(circle at 70% 60%,rgba(232,255,107,.5) 0 3px,transparent 4px),linear-gradient(180deg,#0B3C49,#123F2C)}
.fly{position:relative;border:3px solid var(--line);border-radius:22px;background:#FFFDE8;color:#123540;font-size:21px;padding:6px 12px 6px 44px;min-height:60px;text-align:center;box-shadow:0 0 14px rgba(232,255,107,.7)}
html[dir=rtl] .fly{padding:6px 44px 6px 12px}
.fly::before{content:"✨";position:absolute;top:50%;inset-inline-start:10px;transform:translateY(-50%);font-size:22px;animation:blink 1.2s steps(2) infinite}
.fly:nth-child(2)::before{animation-delay:-.4s}.fly:nth-child(3)::before{animation-delay:-.8s}
@keyframes blink{50%{opacity:.25}}
.ayl{font-size:26px;text-align:center;background:var(--water);border-radius:16px;padding:10px;margin:10px 0;line-height:2.4}
.blank{display:inline-block;min-width:70px;border:3px dashed var(--brand2);border-radius:12px;padding:0 8px;margin:0 3px;line-height:1.6;vertical-align:middle;background:var(--card)}
.blank.now{border-color:var(--kor);box-shadow:0 0 0 3px rgba(255,127,42,.35)}
.blank.full{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.net{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border-radius:18px;background:repeating-linear-gradient(45deg,rgba(18,53,64,.25) 0 2px,transparent 2px 16px),repeating-linear-gradient(-45deg,rgba(18,53,64,.25) 0 2px,transparent 2px 16px),linear-gradient(180deg,var(--river2),var(--river))}
.fish{display:flex;align-items:center;justify-content:center;gap:6px;min-height:64px;border:3px solid var(--line);border-radius:40px 14px 14px 40px;background:#FFE3B8;color:#123540;font-size:22px;box-shadow:0 4px 0 var(--line);animation:swim 3s ease-in-out infinite}
.fish:nth-child(2){animation-delay:-.7s}.fish:nth-child(3){animation-delay:-1.4s}.fish:nth-child(4){animation-delay:-2.1s}
.fish i{font-style:normal;font-size:22px}
.fish.gone{visibility:hidden}
@keyframes swim{50%{transform:translateX(4px)}}
.dockw{display:grid;gap:4px;margin:6px 0 12px;padding:8px;border-radius:16px;background:linear-gradient(180deg,var(--river2),var(--river))}
.shore{text-align:center;font-size:22px}
.plk{border:3px solid var(--line);border-radius:8px;background:repeating-linear-gradient(90deg,var(--plank) 0 30px,var(--wood2) 30px 33px);color:var(--ink);font-size:21px;padding:4px 10px;text-align:center;animation:yay .4s}
.plk.empty{background:transparent;border-style:dashed;border-color:rgba(255,255,255,.6);min-height:44px;animation:none}
.pool{display:grid;gap:10px}
.pk{border:3px solid var(--line);border-radius:10px;background:var(--plank);color:var(--ink);font-size:21px;padding:6px 12px;box-shadow:0 4px 0 var(--wood);min-height:56px}
.pk.used{visibility:hidden}
.ripples{display:flex;justify-content:center;gap:14px;margin-top:12px}
.rip{width:88px;height:88px;border-radius:50%;border:3px solid var(--line);background:radial-gradient(circle,var(--card) 0 34%,var(--river2) 35% 46%,var(--water) 47% 62%,var(--river2) 63% 72%,var(--water) 73%);font-size:28px;font-weight:700;color:var(--ink);font-family:"Short Stack",sans-serif;box-shadow:0 5px 0 var(--line)}
.bitems{display:grid;gap:8px;margin:8px 0}
.bi{border:3px solid var(--line);border-radius:14px;background:var(--water);font-size:21px;padding:4px 10px;min-height:54px}
.bi.sel{background:var(--fly);color:#123540;box-shadow:0 0 0 4px var(--kor)}
.bi.gone{display:none}
.traps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bubu{border:3px solid var(--line);border-radius:30px 30px 14px 14px;background:repeating-linear-gradient(90deg,var(--wood2) 0 6px,#C08A4F 6px 9px);min-height:120px;padding:8px 6px;box-shadow:0 5px 0 var(--wood);color:#123540;display:flex;flex-direction:column;align-items:center;gap:4px}
.bubu b{background:var(--card);color:var(--ink);border-radius:10px;padding:2px 8px;font-size:15px}
.bubu .in{font-size:15px;line-height:1.6;max-width:100%}
.bubu .in .ar{display:block;font-size:16px;background:rgba(255,255,255,.8);border-radius:8px;margin-top:3px;padding:0 4px;color:#123540}
/* ---- maklum balas & keputusan ---- */
.fb{position:fixed;inset-inline:0;bottom:0;z-index:40;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:460px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .row1 .kiko{width:64px;height:64px}
.fb strong{font-size:22px}.fb p{margin:2px 0 0;line-height:1.4}
.res{text-align:center}
.res .kiko{width:120px;height:120px}
.stars{font-size:46px;display:flex;justify-content:center;gap:6px}
.stars span{animation:pop .5s both}.stars .off{filter:grayscale(1) opacity(.3)}
@keyframes pop{from{transform:scale(0)}}
.res h2{margin:6px 0}.res p{margin:0 0 8px;color:var(--muted)}
.gotst{display:inline-flex;align-items:center;gap:10px;background:var(--note);border:3px dashed var(--line);border-radius:18px;padding:8px 16px;margin:6px 0}
.gotst span{font-size:44px;animation:pop 1s both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;bottom:-40px;font-size:28px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(20deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;z-index:60;max-width:92vw;text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

const HAS_LETTER = /[\u0621-\u064A\u0671-\u06D3]/;
// pecah ayat kepada perkataan; tanda waqaf (ۚ ۖ) dilekat pada perkataan sebelumnya, ۞ di awal dilekat pada perkataan selepasnya.
// words(a).join(" ") === a
function words(a){
  const out = []; let pre = "";
  for(const w of a.split(" ")){
    if(HAS_LETTER.test(w)){ out.push(pre + w); pre = ""; }
    else if(out.length) out[out.length-1] += " " + w;
    else pre += w + " ";
  }
  if(pre) out.push(pre.trim());
  return out;
}
function rng(seed){ let x = seed >>> 0 || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
const ALL_WORDS = [...new Set(Object.values(AYAT).flat().flatMap(words))];
const ALL_AYAT = [...new Set(Object.values(AYAT).flat())];
function pickDistinct(pool, avoid, n, r){
  const out = []; const p = [...new Set(pool)].filter(x => !avoid.includes(x)); let guard = 0;
  while(out.length < n && guard++ < 800){ const c = p[Math.floor(r()*p.length)]; if(c && !out.includes(c)) out.push(c); }
  return out;
}
const NAMA = s => [ "surah " + s.t[0].replace(/ \(.*\)/,""), "سورة " + s.t[1].replace(/ \(.*\)/,"") ];

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:     () => tone([[660,.12],[990,.18]]),
  tick:   () => tone([[760,.08,"triangle"]]),
  no:     () => tone([[230,.18,"square"],[190,.2,"square"]]),
  splash: () => tone([[420,.06,"triangle"],[260,.1,"sine"],[180,.12,"sine"]]),
  glow:   () => tone([[1100,.07,"triangle"],[1400,.09,"triangle"]]),
  win:    () => tone([[523,.14],[659,.14],[784,.14],[1046,.3]])
};

function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const stripAr = t => t.replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/[﴾﴿]/g," ");
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(stripAr(text).replace(/…/g," ... ").replace(/\s+/g," "));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .92; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

    const draw = () => {
      if(k >= g.strokes.length) return;
      const s = g.strokes[k], opts = shuffle(s.a), side = isJ() ? "right" : "left", pct = 8 + k / g.strokes.length * 70;
      el.innerHTML = `<div class="track"><span class="dock">⚓</span>${sampan("boat").replace('class="boat"',`class="boat" style="${side}:${pct}%"`)}</div>
        <p class="rnd">${L("Kayuhan","کايوهن")} ${k+1}/${g.strokes.length}</p>
        <div class="cur">${AR(s.cur, s.an)}</div><p style="text-align:center;margin:2px 0 8px">⬇️ ${L("Ayat seterusnya?","ايات ستروسڽ؟")}</p>
        <div class="pads ${opts.some(o => words(o).length > 7) ? "one" : ""}">${opts.map((o,i)=>`<button class="pad" data-i="${i}">${AR(o)}</button>`).join("")}</div>`;
      el.querySelectorAll(".pad").forEach(b => b.addEventListener("click", () => {
        if(k >= g.strokes.length) return;
        if(opts[+b.dataset.i] === s.a[0]){ sfx.splash(); k++; clearHint(); if(k === g.strokes.length){ b.classList.add("right"); win(); } else draw(); }
        else { b.classList.add("wrong"); oops(b, L(`Dayung salah arah! Ingat ayat ${s.an+1}.`,`دايوڠ سالله اره! ايڠت ايات ${s.an+1}.`)); }
      }));
    };
    draw();
  },
  /* pelita: nyalakan pelita perkataan ikut tertib bacaan */
  pelita(el, g){
    const order = mix(g.words.map((_,i)=>i)); let k = 0;
    const line = () => g.words.map((w,i)=> i<k ? `<span class="lit"><i>🏮</i><span class="ar" lang="ar">${w}</span></span>` : `<span class="lslot"></span>`).join("") + (g.part ? `<span class="lit"><i>…</i></span>` : "");
    el.innerHTML = `<div class="lline" id="lline">${line()}</div>
      <div class="lamps">${order.map(i=>`<button class="lamp" data-i="${i}"><i>🏮</i><span class="ar" lang="ar">${g.words[i]}</span></button>`).join("")}</div>
      <p class="rnd">${L("Ayat","ايات")} ${g.an} • <span id="cnt">0</span>/${g.words.length} 🏮</p>`;
    el.querySelectorAll(".lamp").forEach(b => b.addEventListener("click", () => {
      if(k >= g.words.length || b.classList.contains("used")) return;
      if(g.words[+b.dataset.i] === g.words[k]){ k++; b.classList.add("used"); sfx.glow(); el.querySelector("#lline").innerHTML = line(); el.querySelector("#cnt").textContent = k; clearHint();
        if(k === g.words.length) setTimeout(win, 350); }
      else oops(b, L("Pelita itu belum lagi. Ikut tertib bacaan!","ڤليتا ايت بلوم لاڬي. ايکوت ترتيب باچاءن!"));
    }));
  },
  /* kelip: kelip-kelip membawa ayat; tangkap yang sepadan dengan maksud */
  kelip(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.a);
      el.innerHTML = `<p class="rnd">${L("Pusingan","ڤوسيڠن")} ${k+1}/${g.rounds.length}</p>
        <div class="mkbox">💬 ${T(r.mk)} ${sayBtn(r.mk[0])}</div>
        <div class="jars">${opts.map((o,i)=>`<button class="fly" data-i="${i}">${AR(o)}</button>`).join("")}</div>`;
      el.querySelectorAll(".fly").forEach(b => b.addEventListener("click", () => {
        if(k >= g.rounds.length) return;
        if(opts[+b.dataset.i] === r.a[0]){ sfx.glow(); k++; clearHint(); if(k === g.rounds.length){ b.classList.add("right"); win(); } else draw(); }
        else { b.classList.add("wrong"); oops(b, L("Kelip-kelip itu membawa ayat lain. Baca maksud sekali lagi.","کليڤ-کليڤ ايت ممباوا ايات لاين. باچ مقصود سکالي لاڬي.")); }
      }));
    };
    draw();
  },
  /* pukat: tangkap ikan perkataan untuk tempat kosong, ikut tertib */
  pukat(el, g){
    const opts = shuffle(g.a); let k = 0;
    const line = () => g.words.map((w,i)=>{ const bi = g.bl.indexOf(i); if(bi<0) return w;
      return bi<k ? `<span class="blank full">${w}</span>` : `<span class="blank ${bi===k?"now":""}">&nbsp;?&nbsp;</span>`; }).join(" ");
    el.innerHTML = `<div class="ayl ar" lang="ar" id="ayl">${line()} <span class="mark">﴿${AN(g.an)}﴾</span></div>
      <div class="net">${opts.map((o,i)=>`<button class="fish" data-i="${i}"><i>🐟</i><span class="ar" lang="ar">${o}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".fish").forEach(b => b.addEventListener("click", () => {
      if(k >= g.bl.length || b.classList.contains("gone")) return;
      if(opts[+b.dataset.i] === g.words[g.bl[k]]){ k++; b.classList.add("gone"); sfx.splash(); clearHint();
        el.querySelector("#ayl").innerHTML = `${line()} <span class="mark">﴿${AN(g.an)}﴾</span>`; if(k === g.bl.length) win(); }
      else { oops(b, L(k===0 ? "Ikan itu tidak muat di tempat kosong pertama." : "Ikan itu tidak muat. Cari perkataan seterusnya!", k===0 ? "ايکن ايت تيدق موات د تمڤت کوسوڠ ڤرتام." : "ايکن ايت تيدق موات. چاري ڤرکاتاءن ستروسڽ!")); }
    }));
  },
  /* jeti: susun papan ayat dari tebing ke sampan */
  jeti(el, g){
    const pool = mix(g.items); let k = 0;
    const draw = () => g.items.map((a,i)=> i<k ? `<div class="plk">${AR(a, g.st+i)}</div>` : `<div class="plk empty"></div>`).join("");
    el.innerHTML = `<div class="dockw"><div class="shore">🌴🏠🌴</div><div id="planks" style="display:grid;gap:4px">${draw()}</div><div class="shore">🛶</div></div>
      <div class="pool">${pool.map((a,i)=>`<button class="pk" data-i="${i}">${AR(a)}</button>`).join("")}</div>`;
    el.querySelectorAll(".pk").forEach(b => b.addEventListener("click", () => {
      if(k >= g.items.length || b.classList.contains("used")) return;
      if(pool[+b.dataset.i] === g.items[k]){ k++; b.classList.add("used"); sfx.tick(); clearHint(); el.querySelector("#planks").innerHTML = draw(); if(k === g.items.length) setTimeout(win, 350); }
      else oops(b, L(`Bukan papan itu. Cari ayat ${g.st+k}!`,`بوکن ڤاڤن ايت. چاري ايات ${g.st+k}!`));
    }));
  },
  /* riak: lempar batu ke riak yang membawa nombor ayat */
  riak(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.opts);
      el.innerHTML = `<p class="rnd">${L("Batu","باتو")} ${k+1}/${g.rounds.length} 🪨</p><div class="qar">${AR(r.ar)}</div>
        <div class="ripples">${opts.map(n=>`<button class="rip" data-n="${n}">${n}</button>`).join("")}</div>`;
      el.querySelectorAll(".rip").forEach(b => b.addEventListener("click", () => {
        if(k >= g.rounds.length) return;
        if(+b.dataset.n === r.an){ sfx.splash(); k++; clearHint(); if(k === g.rounds.length){ b.classList.add("right"); win(); } else draw(); }
        else { b.classList.add("wrong"); oops(b, L("Plup! Bukan nombor itu. Kira ayat dari awal surah.","ڤلوڤ! بوکن نومبور ايت. کيرا ايات دري اول سورة.")); }
      }));
    };
    draw();
  },
  /* bubu: tekan ayat, kemudian tekan bubu surah yang betul */
  bubu(el, g){
    const items = mix(g.items.map((_,i)=>i)); let sel = null, got = 0;
    el.innerHTML = `<div class="bitems">${items.map(i=>`<button class="bi" data-i="${i}">${AR(g.items[i][0])}</button>`).join("")}</div>
      <div class="traps">${g.sides.map((s,j)=>`<button class="bubu" data-j="${j}"><b>🧺 ${T(s.t).replace(/ \(.*\)/,"")}</b><span class="in" id="in${j}"></span></button>`).join("")}</div>`;
    el.querySelectorAll(".bi").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".bi").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; sfx.tick();
    }));
    el.querySelectorAll(".bubu").forEach(b => b.addEventListener("click", () => {
      if(got >= g.items.length) return;
      if(sel===null){ toast(L("Tekan satu ayat dahulu ☝️","تکن ساتو ايات دهولو ☝️")); return; }
      const j = +b.dataset.j;
      if(g.items[sel][1] === j){
        el.querySelector(`.bi[data-i="${sel}"]`).classList.add("gone");
        el.querySelector("#in"+j).insertAdjacentHTML("beforeend", `<span class="ar" lang="ar">${words(g.items[sel][0]).slice(0,3).join(" ")}…</span>`);
        sel = null; got++; sfx.splash(); clearHint(); if(got === g.items.length) setTimeout(win, 300);
      } else oops(b, L("Ayat itu dari surah lain. Cuba bubu sebelah!","ايات ايت دري سورة لاين. چوبا بوبو سبله!"));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan jeti sebelumnya dahulu 🔒","سلسايکن جيتي سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} jeti untuk membuka Cabaran Kuala 🏆`,`سلسايکن سموا ${STATIONS.length} جيتي اونتوق ممبوک چابرن کوالا 🏆`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.phase==="result" && S.res) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
