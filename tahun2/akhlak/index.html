<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8483B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Dapur Adab Chef Mimi • Akhlak Tahun 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Akhlak Tahun 2: "Dapur Adab Chef Mimi" — dapur hangat, jubin pudina, kad resipi ===== */
:root{
  --tile:#CFF1E3; --tile2:#B4E7D2; --grout:#E9FBF3;
  --bg:#FFF6E8; --card:#FFFDF8; --ink:#4A2C2A; --muted:#86625C; --line:#4A2C2A;
  --tom:#E8483B; --tom2:#C2352A; --butter:#FFD66B; --butter2:#F5B83D; --mint:#3FBF8F; --crust:#D98B4A;
  --ok:#2FA36B; --okbg:#DDF7E9; --bad:#E8483B; --badbg:#FFE1DC; --note:#FFF1C7; --paper:#FFFBF0;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --tile:#1E3B34; --tile2:#183229; --grout:#26473F;
    --bg:#1D1716; --card:#2B2220; --ink:#FFF1E6; --muted:#D9BFB3; --line:#120C0B;
    --note:#3D3218; --okbg:#173B2A; --badbg:#4A221D; --paper:#332826; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:18px;line-height:1.45;
  background-color:var(--tile);
  background-image:linear-gradient(var(--grout) 3px,transparent 3px),linear-gradient(90deg,var(--grout) 3px,transparent 3px),linear-gradient(135deg,var(--tile) 0 50%,var(--tile2) 50% 100%);
  background-size:56px 56px,56px 56px,56px 56px;background-attachment:fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-size:20px;line-height:1.85;font-weight:600}
h1,h2,h3,.disp{font-family:"Chewy","Nunito",cursive;font-weight:400;letter-spacing:.3px}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .disp{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--butter2);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:10px 12px 70px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;font-weight:700}

/* jalur awning di atas */
.awning{position:fixed;inset:0 0 auto 0;height:22px;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--tom) 0 34px,#fff 34px 68px);
  -webkit-mask:radial-gradient(17px 12px at 17px 10px,#000 98%,transparent) 0 0/34px 22px;mask:radial-gradient(17px 12px at 17px 10px,#000 98%,transparent) 0 0/34px 22px}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin:14px 0 8px;position:relative;z-index:2}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-grid;place-items:center;
  font-size:20px;font-weight:900;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:0 10px}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--butter);color:#4A2C2A;border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:900;box-shadow:0 4px 0 var(--line)}

/* hero */
.hero{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:10px 14px;box-shadow:0 6px 0 var(--line);position:relative;z-index:1}
.hero h1{margin:0;font-size:30px;line-height:1.1;color:var(--tom)}
.hero p{margin:4px 0 0;font-size:16px;color:var(--muted)}
.mimi{width:96px;height:96px;flex:0 0 auto}
.mimi.bob{animation:bob 2.4s ease-in-out infinite}
.mimi.yay{animation:yay .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes yay{30%{transform:translateY(-10px) rotate(6deg)}60%{transform:translateY(0) rotate(-6deg)}}

/* rak hidangan (pelekat) */
.sttl{margin:16px 4px 6px;font-weight:900}
.shelf{display:flex;justify-content:space-around;gap:4px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 6px 4px;position:relative;box-shadow:0 6px 0 var(--crust)}
.shelf::after{content:"";position:absolute;left:8px;right:8px;bottom:-12px;height:8px;background:var(--crust);border-radius:0 0 8px 8px;border:3px solid var(--line);border-top:0}
.shelf span{font-size:32px;filter:grayscale(1) opacity(.3);transition:.3s}
.shelf span.got{filter:none;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}}

/* peta: kad resipi di dinding jubin */
.menu{position:relative;margin:26px 0 10px;padding:6px 0 4px}
.menu::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:0;border-left:6px dotted var(--tom);transform:translateX(-50%);opacity:.6}
.rc{position:relative;display:flex;align-items:center;gap:12px;width:86%;margin:0 0 22px;text-align:start;
  background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 12px 12px 14px;box-shadow:0 6px 0 var(--line);
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(232,72,59,.13) 27px 29px)}
.rc.l{margin-inline-start:0;transform:rotate(-1.6deg)}
.rc.r{margin-inline-start:14%;transform:rotate(1.6deg)}
.rc::before{content:"📌";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:24px}
.rc:active{transform:translateY(3px)}
.rc .pot{flex:0 0 66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--c);border:3px solid var(--line);position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.rc .num{position:absolute;top:-8px;inset-inline-start:-8px;width:28px;height:28px;border-radius:50%;background:var(--butter);color:#4A2C2A;border:3px solid var(--line);font-size:14px;font-weight:900;display:grid;place-items:center;font-family:Nunito,sans-serif}
.rc .tx{flex:1;min-width:0}
.rc .nm{display:block;font-weight:900;font-size:18px;line-height:1.25}
.rc .lb{display:block;font-size:13px;color:var(--muted)}
.rc .st{font-size:15px;letter-spacing:-2px}
.rc .st .off,.stars .off{filter:grayscale(1) opacity(.3)}
.rc.lock{filter:grayscale(.8) opacity(.65)}
.rc.lock .pot::after{content:"🔒";position:absolute;bottom:-6px;inset-inline-end:-8px;font-size:22px}
.rc.now{border-color:var(--tom);box-shadow:0 6px 0 var(--tom2);animation:wig 2.6s ease-in-out infinite}
@keyframes wig{50%{translate:0 -3px}}
.rc .peek{position:absolute;inset-inline-end:-6px;top:-36px;width:58px;height:58px;pointer-events:none}
.rc.final{width:100%;margin-inline-start:0;transform:none;background:linear-gradient(135deg,#FFE7A3,#FFC2B4);color:#4A2C2A;min-height:96px}
.rc.final .pot{flex-basis:76px;height:76px;font-size:42px}
.counter{margin-top:6px;text-align:center;font-weight:900;background:var(--crust);color:#fff;border:3px solid var(--line);border-radius:14px;padding:8px}
</style>
<style>
/* kepala stesen */
.shead{display:flex;align-items:center;gap:12px;margin:4px 2px 12px}
.shead .pot{flex:0 0 58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--c);border:3px solid var(--line)}
.shead h2{margin:0;font-size:24px;line-height:1.15}
.shead small{color:var(--muted);font-size:14px}
/* kad */
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line);position:relative;margin-bottom:16px}
.card.recipe{background:var(--paper);background-image:linear-gradient(90deg,transparent 30px,rgba(232,72,59,.35) 30px 32px,transparent 32px);padding-inline-start:44px}
html[dir="rtl"] .card.recipe{background-image:linear-gradient(270deg,transparent 30px,rgba(232,72,59,.35) 30px 32px,transparent 32px)}
.rpic{font-size:56px;text-align:center;line-height:1.1}
.rh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 8px;font-size:23px;color:var(--tom)}
.rtext{margin:6px 0}
.rlist{list-style:none;margin:6px 0;padding:0}
.rlist li{position:relative;padding:6px 0;padding-inline-start:34px;border-bottom:2px dashed rgba(134,98,92,.3);animation:inl .4s both;animation-delay:calc(var(--i)*80ms)}
.rlist li::before{content:"🥄";position:absolute;inset-inline-start:0;top:6px}
.rlist.num{counter-reset:n}
.rlist.num li::before{counter-increment:n;content:counter(n);width:26px;height:26px;border-radius:50%;background:var(--butter);border:2px solid var(--line);display:grid;place-items:center;font:900 14px Nunito,sans-serif;color:#4A2C2A}
.rlist.bad li::before{content:"🔥"}
@keyframes inl{from{opacity:0;transform:translateY(6px)}}
.abox{background:var(--note);border:3px dashed var(--butter2);border-radius:16px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:6px;text-align:center}
.abox .ar{font-size:26px;line-height:2}
.abox .mk{font-size:16px}
.abox small{color:var(--muted);font-size:13px}
.tip{display:flex;gap:8px;align-items:flex-start;background:var(--okbg);border-radius:14px;padding:10px;margin-top:10px;font-size:16px}
.tip.am{background:var(--badbg)}
.ref{margin-top:10px;font-size:14px;color:var(--muted);text-align:end}
.navr{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:56px;border-radius:16px;border:3px solid var(--line);background:var(--butter);color:#4A2C2A;font-weight:900;font-size:19px;box-shadow:0 5px 0 var(--line);padding:6px 12px;width:100%}
.btn.go{background:var(--tom);color:#fff}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(134,98,92,.3)}
.dots i.on{background:var(--tom);width:26px;border-radius:6px}
.say{border:2px solid var(--line);background:var(--butter);border-radius:12px;min-width:44px;height:44px;font-size:20px;flex:0 0 auto}
/* kemajuan: pinggan */
.prog{display:flex;justify-content:center;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.prog span{width:40px;height:40px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-size:20px}
.prog span.done{background:var(--butter)}
.prog span.cur{border-color:var(--tom);box-shadow:0 0 0 4px rgba(232,72,59,.3)}
.q{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--note);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.q p{margin:0;font-weight:900;font-size:19px}
.qar{text-align:center;font-size:26px;line-height:2.1;margin:6px 0 12px;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:6px 10px}
.qar .gap{display:inline-block;min-width:80px;border-bottom:4px dashed var(--tom);color:var(--tom)}
.cnt{text-align:center;color:var(--muted);font-size:15px;margin-top:10px}
.hint{margin-top:12px;background:var(--badbg);border-radius:14px;padding:10px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* butang pilihan umum */
.opt{display:block;width:100%;text-align:start;min-height:54px;margin:8px 0;border:3px solid var(--line);border-radius:14px;background:var(--card);padding:8px 12px;box-shadow:0 4px 0 var(--line);font-weight:800}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg)}
/* kacau: periuk */
.potz{position:relative;height:190px;display:grid;place-items:end center}
.potz svg{width:200px;height:170px}
.potz .lvl{transition:height .5s,y .5s}
.spoon{transform-origin:100px 60px;animation:stir 2s ease-in-out infinite}
@keyframes stir{50%{transform:rotate(14deg)}}
.ings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ing{min-height:64px;border:3px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:6px 8px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;text-align:start}
.ing .em{font-size:26px}
.ing.in{animation:drop .5s forwards;pointer-events:none}
@keyframes drop{to{transform:translateY(-60px) scale(.2);opacity:0}}
/* resepi: garis masa memasak */
.tl{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;border-inline-start:5px dotted var(--tom);padding-inline-start:10px}
.slot{min-height:46px;border:3px dashed rgba(134,98,92,.5);border-radius:12px;display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:15px}
.slot b{flex:0 0 30px;height:30px;border-radius:50%;background:var(--butter);border:2px solid var(--line);display:grid;place-items:center;font:900 14px Nunito,sans-serif;color:#4A2C2A}
.slot.full{border-style:solid;border-color:var(--ok);background:var(--okbg);animation:pop .35s}
.rcds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rcd{min-height:60px;border:3px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--line);padding:6px;font-size:15px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rcd .em{font-size:24px}
.rcd.used{visibility:hidden}
/* ketuhar */
.oven{background:#9AA5B1;border:4px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 6px 0 var(--line)}
.oven .knobs{display:flex;gap:8px;justify-content:flex-end;margin-bottom:8px;align-items:center}
.oven .knobs i{width:22px;height:22px;border-radius:50%;background:#4A2C2A;display:block}
.oven .timer{flex:1;height:14px;background:#5E6A76;border-radius:7px;overflow:hidden}
.oven .timer span{display:block;height:100%;background:var(--butter);transition:width .4s}
.ow{background:radial-gradient(circle at 50% 120%,#FF9A3C,#3B2620 70%);color:#FFF6E8;border:4px solid var(--line);border-radius:14px;min-height:120px;display:grid;place-items:center;text-align:center;padding:12px;font-size:19px;font-weight:900}
.tfb{display:flex;gap:10px;margin-top:12px}
.tfb button{flex:1;min-height:64px;border:3px solid var(--line);border-radius:16px;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--line)}
.tfb .t{background:var(--okbg)}.tfb .f{background:var(--badbg)}
/* hidang: pelanggan & pinggan */
.custs{display:flex;flex-direction:column;gap:8px}
.cust{display:flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:16px;background:var(--card);padding:6px 8px;min-height:64px;text-align:start;box-shadow:0 4px 0 var(--line)}
.cust .face{font-size:34px;flex:0 0 auto}
.cust .bub{flex:1;background:var(--note);border-radius:12px;padding:4px 8px;font-size:15px}
.cust .srv{flex:0 0 40px;font-size:28px;text-align:center}
.cust.done{background:var(--okbg);border-color:var(--ok)}
.plates{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.plate{flex:1 1 44%;min-height:60px;border:3px solid var(--line);border-radius:30px;background:var(--paper);box-shadow:0 4px 0 var(--line);padding:6px 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.plate .em{font-size:24px}
.plate.sel{background:var(--butter);transform:translateY(-4px)}
.plate.gone{visibility:hidden}
</style>
<style>
/* rempah: balang */
.jars{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.jar{flex:1 1 30%;min-width:100px;min-height:120px;border:3px solid var(--line);border-radius:12px 12px 22px 22px;background:linear-gradient(180deg,var(--jc) 0 26%,var(--paper) 26%);box-shadow:0 4px 0 var(--line);padding:34px 6px 8px;position:relative;font-size:22px;line-height:1.7}
.jar::before{content:"";position:absolute;top:-10px;left:14%;right:14%;height:14px;background:var(--crust);border:3px solid var(--line);border-radius:6px}
.jar.full{flex-basis:100%;min-height:0;font-size:20px}
.jar.right{background:var(--okbg);border-color:var(--ok)}
.jar.wrong{opacity:.5}
/* kek: lapisan kek cawan */
.cake{display:flex;flex-direction:column-reverse;align-items:center;min-height:150px;justify-content:flex-start;margin-bottom:8px}
.cake .base{width:150px;height:56px;background:repeating-linear-gradient(90deg,#E49A5A 0 14px,#D07E3E 14px 22px);border:3px solid var(--line);border-radius:4px 4px 26px 26px;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.cake .top{font-size:40px;line-height:.9;animation:pop .45s}
.cake .cream{width:160px;height:34px;background:#FFF6FA;border:3px solid var(--line);border-radius:30px 30px 10px 10px;animation:pop .45s}
.kq{font-weight:900;margin:4px 0}
.kn{text-align:center;color:var(--muted);font-size:14px}
/* bekal */
.tray{display:flex;gap:6px;justify-content:center;background:var(--crust);border:3px solid var(--line);border-radius:18px;padding:8px;min-height:72px;margin-bottom:12px}
.tray span{flex:0 0 31%;background:var(--paper);border:3px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-size:28px;min-height:52px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.it{min-height:64px;border:3px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:6px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;text-align:start}
.it .em{font-size:24px}
.it.on{background:var(--butter);transform:translateY(-3px)}
.it.bad{background:var(--badbg)}
/* pinggan: susun doa */
.stack{display:flex;flex-wrap:wrap;direction:rtl;justify-content:center;align-items:center;gap:6px;min-height:70px;margin-bottom:12px;padding:8px;border-radius:16px;background:var(--note);border:3px dashed var(--butter2)}
.stack .pl{background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:2px 18px;font-size:22px;animation:pop .35s}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pbtn{min-height:56px;min-width:90px;border:3px solid var(--line);border-radius:999px;background:var(--bc);box-shadow:0 4px 0 var(--line);padding:4px 14px;font-size:22px;color:#4A2C2A}
.pbtn.used{visibility:hidden}
/* maklum balas */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px;animation:up .3s}
.fb .in{max-width:620px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 -4px 0 var(--ok),0 8px 30px rgba(0,0,0,.3)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .mimi{width:70px;height:70px}
.fb strong{font-size:22px;color:var(--ok)}
.fb p{margin:2px 0 0;font-size:16px}
@keyframes up{from{transform:translateY(100%)}}
.res{text-align:center}
.res .mimi{width:130px;height:130px}
.res h2{font-size:30px;margin:6px 0;color:var(--tom)}
.stars{font-size:46px}
.stars span{display:inline-block;animation:pop .6s both}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border-radius:16px;padding:10px;margin:12px 0;font-weight:900}
.gotst span{font-size:44px;animation:pop .7s}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:60;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[660,.12],[880,.18]]),
  tick: () => tone([[740,.08,"triangle"]]),
  no:   () => tone([[220,.18,"square"],[180,.2,"square"]]),
  plop: () => tone([[300,.06,"sine"],[520,.08,"sine"]]),
  ding: () => tone([[1320,.25,"triangle"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.3]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const clean = text.replace(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/…|___/g," ... ")
      .replace(/SAW/g,"sallallahu alaihi wasallam").replace(/SWT/g,"subhanahu wa taala").replace(/\bRA\b/g,"radhiallahu anhu").replace(/ms\. /g,"muka surat ");
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .92; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}

const JC = ["#E8483B","#F5B83D","#3FBF8F","#9B7BFF","#4DABF7"];
const PC = ["#FFE3E3","#FFF3BF","#D3F9D8","#E5DBFF","#D0EBFF","#FFE8CC","#C5F6FA"];
const potSVG = () => `<svg viewBox="0 0 200 170" aria-hidden="true">

  <path d="M34 70 h132 v58 q0 26 -26 26 h-80 q-26 0 -26 -26 Z" fill="none" stroke="#4A2C2A" stroke-width="5"/>
  <rect x="26" y="62" width="148" height="14" rx="7" fill="#E8483B" stroke="#4A2C2A" stroke-width="4"/>
</svg>`;
const GAMES = {
  /* Kacau periuk: masukkan bahan (adab) yang baik sahaja */
  kacau(el, g){
    const order = shuffle(g.items.map((_,i)=>i)), need = g.items.filter(x=>x[2]).length; let k = 0;
    el.innerHTML = `<div class="potz">${potSVG()}</div><div class="cnt" id="cn">🥄 0 / ${need}</div>
      <div class="ings">${order.map(i=>`<button class="ing" data-i="${i}"><span class="em" aria-hidden="true">${g.items[i][0]}</span><span>${T(g.items[i][1])}</span></button>`).join("")}</div>`;
    const lvl = el.querySelector("#lvl");
    el.querySelectorAll(".ing").forEach(b => b.addEventListener("click", () => {
      if(b.disabled || k>=need) return; const it = g.items[+b.dataset.i];
      if(it[2]){
        k++; sfx.plop(); b.classList.add("in"); b.disabled = true; clearHint();
        const h = 12 + k/need*70; lvl.setAttribute("y", 154-h); lvl.setAttribute("height", h);
        el.querySelector("#cn").textContent = `🥄 ${k} / ${need}`;
        if(k===need) setTimeout(win, 550);
      } else { b.disabled = true; b.style.opacity = ".4"; oops(b, L("Itu bukan adab yang baik. Jangan masukkan ke dalam periuk!","ايت بوکن ادب يڠ باءيق. جاڠن ماسوقکن ک دالم ڤريوق!")); }
    }));
  },

  /* Resipi: susun kad langkah pada garis masa memasak */
  resepi(el, g){
    const n = g.steps.length, order = mix(g.steps.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="tl">${g.steps.map((_,i)=>`<div class="slot" data-s="${i}"><b>${i+1}</b><span></span></div>`).join("")}</div>
      <div class="rcds">${order.map(i=>`<button class="rcd" data-i="${i}"><span class="em" aria-hidden="true">${g.steps[i][0]}</span><span>${T(g.steps[i][1])}</span></button>`).join("")}</div>
      <div class="cnt">⏱️ ${L("Tekan kad ikut urutan: langkah 1 dahulu.","تکن کد ايکوت اوروتن: لڠکه 1 دهولو.")}</div>`;
    el.querySelectorAll(".rcd").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=n) return;
      if(+b.dataset.i===k){
        const sl = el.querySelector(`.slot[data-s="${k}"]`); sl.classList.add("full");
        sl.querySelector("span").textContent = g.steps[k][0]+" "+T(g.steps[k][1]);
        b.classList.add("used"); k++; sfx.tick(); clearHint();
        if(k===n) setTimeout(win, 400);
      } else oops(b, L(`Belum lagi. Apakah langkah ke-${k+1}?`,`بلوم لاڬي. اڤاکه لڠکه ک-${k+1}؟`));
    }));
  },

  /* Ketuhar: betul (masak) atau salah (hangus) */
  ketuhar(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let k = 0;
    const draw = () => {
      const i = order[k];
      el.innerHTML = `<div class="oven"><div class="knobs"><span class="timer"><span style="width:${k/order.length*100}%"></span></span><i></i><i></i></div>
        <div class="ow" id="ow" data-i="${i}">${T(g.items[i][0])}</div></div>
        <div class="tfb"><button class="t" data-v="1">✅ ${L("Betul","بتول")}<br><small>🍞 ${L("masak","ماسق")}</small></button><button class="f" data-v="0">❌ ${L("Salah","سالله")}<br><small>🔥 ${L("hangus","هڠوس")}</small></button></div>
        <div class="cnt">${k+1} / ${order.length} ${sayBtn(RU(g.items[i][0]))}</div>`;
      el.querySelectorAll(".tfb button").forEach(b => b.addEventListener("click", () => {
        if(+b.dataset.v===g.items[i][1]){ sfx.tick(); k++; clearHint(); if(k<order.length) draw(); else win(); }
        else oops(el.querySelector("#ow"), g.items[i][1] ? L("Kenyataan ini betul. Bacalah sekali lagi.","کڽاتاءن اين بتول. باچاله سکالي لاڬي.") : L("Kenyataan ini salah. Ia akan hangus!","کڽاتاءن اين سالله. اي اکن هڠوس!"));
      }));
    };
    draw();
  },

  /* Hidang: pilih pinggan, kemudian tekan pelanggan */
  hidang(el, g){
    const co = shuffle(g.pairs.map((_,i)=>i)), po = mix(co); let sel = null, k = 0;
    el.innerHTML = `<div class="custs">${co.map(i=>`<button class="cust" data-i="${i}"><span class="face" aria-hidden="true">${g.pairs[i][0]}</span><span class="bub">${T(g.pairs[i][1])}</span><span class="srv" aria-hidden="true">🍽️</span></button>`).join("")}</div>
      <div class="plates">${po.map(i=>`<button class="plate" data-i="${i}"><span class="em" aria-hidden="true">${g.pairs[i][2]}</span><span>${T(g.pairs[i][3])}</span></button>`).join("")}</div>
      <div class="cnt">🍽️ ${L("Tekan pinggan, kemudian tekan pelanggan.","تکن ڤيڠڬن، کمودين تکن ڤلڠڬن.")}</div>`;
    el.querySelectorAll(".plate").forEach(p => p.addEventListener("click", () => {
      if(p.classList.contains("gone")) return;
      el.querySelectorAll(".plate").forEach(x=>x.classList.remove("sel")); p.classList.add("sel"); sel = +p.dataset.i; sfx.tick();
    }));
    el.querySelectorAll(".cust").forEach(c => c.addEventListener("click", () => {
      if(c.classList.contains("done")) return;
      if(sel===null){ toast(L("Pilih pinggan dahulu 🍽️","ڤيليه ڤيڠڬن دهولو 🍽️")); return; }
      const p = el.querySelector(`.plate[data-i="${sel}"]`);
      if(+c.dataset.i===sel){
        c.classList.add("done"); c.querySelector(".srv").textContent = g.pairs[sel][2]; p.classList.add("gone"); p.classList.remove("sel");
        sel = null; k++; sfx.plop(); clearHint();
        if(k===g.pairs.length) setTimeout(win, 400);
      } else oops(c, L("Pelanggan ini perlukan hidangan lain. Baca semula situasinya.","ڤلڠڬن اين ڤرلوکن هيدڠن لاءين. باچ سمولا سيتواسيڽ."));
    }));
  },

  /* Rempah: pilih balang perkataan / doa yang betul */
  rempah(el, g){
    const order = shuffle(g.a.map((_,i)=>i)); let done = false;
    const gap = `<span class="gap" id="gap">؟</span>`;
    el.innerHTML = `${g.ar?`<div class="qar ar" lang="ar">${g.ar.replace("___", gap)}</div>`:""}
      <div class="jars">${order.map((i,n)=>`<button class="jar ar ${g.full?"full":""}" lang="ar" data-i="${i}" style="--jc:${JC[(n+S.gi)%JC.length]}">${g.a[i]}</button>`).join("")}</div>
      <div class="cnt">🫙 ${L("Tekan balang yang betul.","تکن بالڠ يڠ بتول.")}</div>`;
    el.querySelectorAll(".jar").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(+b.dataset.i===0){ done = true; b.classList.add("right"); const gp = el.querySelector("#gap"); if(gp) gp.textContent = g.a[0]; sfx.plop(); clearHint(); setTimeout(win, 500); }
      else { b.classList.add("wrong"); oops(b, L("Bukan balang itu. Baca kad resipi sekali lagi.","بوکن بالڠ ايت. باچ کد رسيڤي سکالي لاڬي.")); }
    }));
  },

  /* Kek: setiap jawapan betul menambah hiasan */
  kek(el, g){
    const TOP = ["cream","🍓","🕯️"]; let k = 0;
    const cake = () => `<div class="cake" aria-hidden="true"><div class="base"></div>${TOP.slice(0,k).map(t=>t==="cream"?`<div class="cream"></div>`:`<div class="top">${t}</div>`).join("")}</div>`;
    const draw = () => {
      const [qq, opts] = g.qs[k], order = shuffle(opts.map((_,i)=>i));
      el.innerHTML = cake() + `<p class="kq">${k+1}. ${TX(qq)} ${sayBtn(RU(qq))}</p>
        ${order.map(i=>`<button class="opt" data-i="${i}">${TX(opts[i])}</button>`).join("")}
        <div class="kn">🧁 ${k} / ${g.qs.length}</div>`;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(b.classList.contains("wrong") || b.classList.contains("right")) return;
        if(+b.dataset.i===0){
          b.classList.add("right"); k++; sfx.plop(); clearHint();
          if(k<g.qs.length) setTimeout(draw, 350); else { el.querySelector(".cake").outerHTML = cake(); setTimeout(win, 450); }
        } else { b.classList.add("wrong"); oops(b, L("Bukan itu. Cuba jawapan lain.","بوکن ايت. چوبا جواڤن لاءين.")); }
      }));
    };
    draw();
  },

  /* Bekal: pilih tepat 3 bahan, kemudian tutup bekas */
  bekal(el, g){
    const order = shuffle(g.items.map((_,i)=>i)), on = new Set(); let done = false;
    el.innerHTML = `<div class="tray" id="tray"></div>
      <div class="items">${order.map(i=>`<button class="it" data-i="${i}" aria-pressed="false"><span class="em" aria-hidden="true">${g.items[i][0]}</span><span>${T(g.items[i][1])}</span></button>`).join("")}</div>
      <button class="btn go" id="shut" style="margin-top:14px" disabled>🍱 ${L("Tutup bekal","توتوڤ بکل")}</button>`;
    const sync = () => {
      const ids = [...on];
      el.querySelector("#tray").innerHTML = [0,1,2].map(n=>`<span>${ids[n]!=null?g.items[ids[n]][0]:""}</span>`).join("");
      el.querySelectorAll(".it").forEach(b => { const v = on.has(+b.dataset.i); b.classList.toggle("on", v); b.setAttribute("aria-pressed", v); });
      el.querySelector("#shut").disabled = on.size!==3;
    };
    el.querySelectorAll(".it").forEach(b => b.addEventListener("click", () => {
      if(done) return; const i = +b.dataset.i; b.classList.remove("bad");
      if(on.has(i)) on.delete(i);
      else if(on.size>=3){ toast(L("Bekal sudah penuh! Tekan semula untuk keluarkan.","بکل سوده ڤنوه! تکن سمولا اونتوق کلوارکن.")); return; }
      else on.add(i);
      sfx.tick(); sync();
    }));
    el.querySelector("#shut").addEventListener("click", () => {
      if(done || on.size!==3) return;
      const bad = [...on].filter(i=>!g.items[i][2]);
      if(!bad.length){ done = true; sfx.plop(); clearHint(); setTimeout(win, 300); return; }
      bad.forEach(i => { on.delete(i); el.querySelector(`.it[data-i="${i}"]`).classList.add("bad"); });
      sync(); oops(el.querySelector("#tray"), L(`${bad.length} bahan tidak sesuai. Gantikan dengan yang betul.`,`${bad.length} بهن تيدق سسواي. ڬنتيکن دڠن يڠ بتول.`));
    });
    sync();
  },

  /* Pinggan: susun perkataan doa ikut urutan */
  pinggan(el, g){
    const n = g.parts.length, order = mix(g.parts.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="stack ar" id="stk" lang="ar" aria-live="polite"></div>
      <div class="pool">${order.map((i,m)=>`<button class="pbtn ar" lang="ar" data-i="${i}" style="--bc:${PC[m%PC.length]}">${g.parts[i]}</button>`).join("")}</div>
      <div class="cnt">🍽️ ${L("Mula dari kanan: tekan perkataan pertama doa.","مولا دري کانن: تکن ڤرکاتاءن ڤرتام دعاء.")}</div><div id="mk"></div>`;
    el.querySelectorAll(".pbtn").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=n) return;
      if(g.parts[+b.dataset.i]===g.parts[k]){
        k++; sfx.tick(); b.classList.add("used"); clearHint();
        el.querySelector("#stk").insertAdjacentHTML("beforeend", `<span class="pl">${b.textContent}</span>`);
        if(k===n){ el.querySelector("#mk").innerHTML = `<div class="abox"><span class="mk">${T(g.mk)}</span></div>`; setTimeout(win, 500); }
      } else oops(b, L("Bukan perkataan itu. Baca doa perlahan-lahan.","بوکن ڤرکاتاءن ايت. باچ دعاء ڤرلاهن-لاهن."));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t2-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Siapkan resipi sebelumnya dahulu 🔒","سياڤکن رسيڤي سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Siapkan semua ${STATIONS.length} resipi untuk membuka Kek Juara 🎂`,`سياڤکن سموا ${STATIONS.length} رسيڤي اونتوق ممبوک کيک جوارا 🎂`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa selepas tukar tulisan/suara (tanpa ulang bunyi/konfeti)
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && S.phase==="result") return drawResult(false);
  renderPlay();
}
applyLang();
renderMap();
</script>
