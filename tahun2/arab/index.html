<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E7FD8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Bas Sekolah Kalimah • Bahasa Arab Tahun 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Quicksand:wght@600;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Bahasa Arab Tahun 2: "Bas Sekolah Kalimah" — laluan bas sekolah, hentian bas, Bas Bobo =====
   Warna: kuning bas, kelabu jalan raya, biru papan tanda, hijau rumput, merah loceng. */
:root{
  --sky1:#8FD3FF; --sky2:#E6F6FF; --bg:#EAF6FF; --card:#FFFFFF; --ink:#1F2A3A; --muted:#5A6B80;
  --bus:#FFC21A; --bus2:#FFE48A; --road:#3B4252; --road2:#596273; --sign:#1E7FD8; --sign2:#CDE6FF; --grass:#6CC36A; --grass2:#D6F2CF;
  --stop:#E8453C; --stop2:#FFD9D5; --teal:#14A39A; --plum:#8A4FD8;
  --line:#CFE0F0; --shadow:rgba(20,50,90,.2); --ok:#16A36E; --okbg:#DDF8EC; --bad:#E5484D; --badbg:#FFE3E6; --note:#FFF6CC;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0C1B33; --sky2:#152A4A; --bg:#0E1A2C; --card:#1C2A40; --ink:#F1F6FF; --muted:#A9BCD6;
    --bus2:#4A3A0E; --sign2:#173A63; --grass2:#173D22; --stop2:#4A1F1C; --road:#262B36; --road2:#3B4252;
    --line:#2E4060; --shadow:rgba(0,0,0,.5); --okbg:#123D2D; --badbg:#4A1F2A; --note:#3B3312;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Quicksand","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:19px;line-height:1.4;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 320px,var(--bg) 640px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Quicksand",system-ui,sans-serif;font-size:20px;line-height:1.7}
h1,h2,h3,.ttl{font-family:"Titan One","Quicksand",system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;direction:rtl;unicode-bidi:isolate;font-size:1.3em;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--sign);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20;padding:6px 0}
.sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:14px;border:3px solid var(--road);background:var(--bus);color:#1F2A3A;display:inline-flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;padding:0 10px;box-shadow:0 3px 0 var(--road)}
.pill{background:var(--card);border:3px solid var(--road);border-radius:999px;padding:6px 12px;font-size:18px}
/* ===== hero ===== */
.hero{display:flex;align-items:center;gap:10px;background:var(--card);border:4px solid var(--road);border-radius:22px;padding:10px 12px;box-shadow:0 6px 0 var(--shadow);margin:6px 0 12px}
.hero .bobo{width:110px;flex:0 0 110px}
.hero h1{margin:0;font-size:27px;color:var(--sign);line-height:1.1}
.hero p{margin:4px 0 0;font-size:16px;color:var(--muted)}
.bobo{display:block;width:96px;height:auto}
.bobo .wh{transform-origin:center;transform-box:fill-box;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bobo.yay{animation:hop .7s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-6px)}}
.sttl{margin:8px 4px 4px;font-size:17px;color:var(--muted)}
.bed{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:3px dashed var(--line);border-radius:16px;padding:8px;margin-bottom:12px}
.bed span{width:40px;height:40px;border-radius:10px;background:var(--sign2);display:flex;align-items:center;justify-content:center;font-size:22px;filter:grayscale(1);opacity:.35}
.bed span.got{filter:none;opacity:1;background:var(--bus2)}
/* ===== peta: jalan raya ===== */
.route{position:relative;margin:0 -4px;border-radius:24px;overflow:hidden;
  background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 18px,transparent 19px),linear-gradient(180deg,var(--grass2),var(--grass) 140%)}
.route .road{position:absolute;inset:0;width:100%;height:100%}
.route .road path{fill:none;stroke:var(--road);stroke-width:46;stroke-linecap:round;stroke-linejoin:round}
.route .road path.e{stroke:var(--road2);stroke-width:54}
.route .road path.d{stroke:#FFE48A;stroke-width:4;stroke-dasharray:16 14}
.tree{position:absolute;font-size:30px;pointer-events:none;opacity:.9}
.node{position:absolute;transform:translate(-50%,0);background:none;border:0;padding:0;width:150px;display:flex;flex-direction:column;align-items:center;z-index:2}
.node .sign{position:relative;width:76px;height:76px;border-radius:50%;background:var(--c,var(--sign));border:5px solid #fff;box-shadow:0 0 0 4px var(--road),0 7px 0 4px var(--shadow);display:flex;align-items:center;justify-content:center;font-size:36px}
.node .pole{width:8px;height:22px;background:#9AA6B6;border-radius:0 0 4px 4px;margin-top:2px}
.node .num{position:absolute;top:-6px;inset-inline-start:22px;background:var(--bus);color:#1F2A3A;border:3px solid var(--road);border-radius:10px;min-width:30px;height:30px;font-family:"Titan One",sans-serif;font-size:17px;display:flex;align-items:center;justify-content:center;z-index:3}
.node .nm{background:var(--card);border:3px solid var(--road);border-radius:12px;padding:2px 10px;font-size:16px;line-height:1.3;max-width:150px;text-align:center;margin-top:-2px}
html[dir="rtl"] .node .nm{font-size:17px}
.node .st{font-size:14px;min-height:18px}
.node.lock .sign{filter:grayscale(1);opacity:.7}
.node .lk{position:absolute;bottom:-6px;inset-inline-end:-8px;font-size:24px}
.node.now .sign{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--road),0 0 0 14px rgba(255,194,26,.55)}}
.node .park{position:absolute;top:2px;width:84px;z-index:4;pointer-events:none}
html[dir="rtl"] .node .park svg{transform:scaleX(-1)}
.node.big{width:220px}
.node.big .school{width:180px;height:auto;display:block}
.node.big.lock .school{filter:grayscale(.9);opacity:.75}
.gate{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--bus);border:3px solid var(--road);border-radius:12px;padding:2px 12px;font-size:15px;white-space:nowrap;z-index:3}
/* ===== stesen ===== */
.shead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.badge{width:58px;height:58px;flex:0 0 58px;border-radius:50%;background:var(--c);border:4px solid #fff;box-shadow:0 0 0 3px var(--road);display:flex;align-items:center;justify-content:center;font-size:28px}
.shead h2{margin:0;font-size:22px;line-height:1.2}
.shead small{color:var(--muted);font-size:15px;display:block}
.card{background:var(--card);border:4px solid var(--road);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--shadow);position:relative}
.rpic{font-size:52px;text-align:center;line-height:1.1}
.rh{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center;margin:6px 0;font-size:22px}
.rtext{margin:6px 0;text-align:center}
.say{border:3px solid var(--road);background:var(--sign2);border-radius:12px;min-width:44px;height:44px;font-size:20px;padding:0 6px}
.abox{background:var(--bus2);border-radius:16px;padding:8px 12px;text-align:center;margin:8px 0}
.abox .ar{font-size:1.6em;display:block}
.mk{display:block;color:var(--muted);font-size:16px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:8px 0}
.wt{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;min-height:118px}
.wt .em{font-size:32px;line-height:1.2}
.wt small,.ln small{font-size:15px;color:var(--muted);line-height:1.25}
.lines{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.ln{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ln:nth-child(odd){background:var(--sign2)}
.tip{display:flex;gap:8px;background:var(--note);border-radius:14px;padding:8px 10px;margin:8px 0;font-size:17px}
.ref{font-size:14px;color:var(--muted);text-align:center;margin-top:6px}
.navr{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;min-height:56px;border:4px solid var(--road);border-radius:16px;background:var(--sign);color:#fff;font-size:20px;box-shadow:0 4px 0 var(--road)}
.btn.go{background:var(--bus);color:#1F2A3A}
.btn.alt{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.4}
.btn:active,.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--road)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--bus);box-shadow:0 0 0 2px var(--road)}
/* ===== bar kemajuan: jalan ===== */
.prog{position:relative;height:46px;margin:6px 4px 14px;background:var(--road);border-radius:23px;border:3px solid var(--road2)}
.prog::after{content:"";position:absolute;left:14px;right:14px;top:50%;border-top:3px dashed #FFE48A;opacity:.7}
.prog .fill{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(255,194,26,.35);border-radius:23px}
.prog .tk{position:absolute;top:50%;font-size:18px;z-index:1}
.prog .who{position:absolute;top:50%;width:62px;z-index:2}
.prog .who .bobo{width:62px}
/* ===== permainan umum ===== */
.q{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}
.q p{margin:0;font-size:19px}
.cnt{text-align:center;color:var(--muted);font-size:16px;margin-top:10px}
.hint{background:var(--badbg);border-radius:14px;padding:8px 10px;margin-top:10px;font-size:17px}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ask{background:var(--sign);color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px var(--road);border-radius:16px;text-align:center;padding:6px 10px;margin:6px 4px 12px;font-size:20px}
.ask .ar{font-size:1.6em}
.ask .em{font-size:44px}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--okbg);border-top:5px solid var(--ok);padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:560px;margin:0 auto}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .bobo{width:78px;flex:0 0 78px}
.fb strong{font-family:"Titan One",sans-serif;font-weight:400;font-size:24px;color:var(--ok)}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.fb p{margin:2px 0 0;font-size:17px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--road);color:#fff;padding:10px 16px;border-radius:14px;max-width:90vw;text-align:center;font-size:17px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.res{text-align:center}
.res .bobo{width:140px;margin:0 auto}
.stars{font-size:46px}
.stars span{display:inline-block;animation:pop .5s backwards}
.stars .off{filter:grayscale(1);opacity:.3}
@keyframes pop{from{transform:scale(0)}}
.gotst{background:var(--bus2);border-radius:16px;padding:8px;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:10px}
.gotst span{font-size:38px}
/* ===== tebuk: tiket konduktor ===== */
.cond{display:flex;align-items:center;gap:10px;background:var(--sign);color:#fff;border-radius:18px;border:4px solid #fff;box-shadow:0 0 0 3px var(--road);padding:6px 12px;margin:4px 4px 12px}
.cond .who2{font-size:40px}
.cond .ar{font-size:1.7em;flex:1;text-align:center}
.tstrip{display:flex;flex-direction:column;gap:10px}
.stub{position:relative;display:flex;align-items:center;gap:10px;min-height:66px;border:0;border-radius:12px;background:var(--bus2);padding:6px 14px 6px 46px;text-align:start;box-shadow:0 4px 0 var(--shadow);border-inline-start:6px dashed var(--road)}
html[dir="rtl"] .stub{padding:6px 46px 6px 14px}
.stub .em{font-size:32px}
.stub .hole{position:absolute;inset-inline-start:10px;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;border:3px dashed var(--road2)}
.stub.punched .hole{background:var(--road);border-style:solid}
.stub.punched{background:var(--okbg)}
/* ===== kerusi: duduk penumpang ===== */
.curb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--road2);border-radius:16px;padding:10px;margin-bottom:10px}
.pax{border:3px solid var(--road);background:var(--card);border-radius:22px 22px 10px 10px;min-width:84px;min-height:58px;padding:2px 10px;font-size:18px}
.pax::before{content:"🧒";display:block;font-size:18px;line-height:1}
.pax.pick{background:var(--bus);transform:translateY(-4px)}
.pax.gone{visibility:hidden}
.busin{background:var(--bus);border:4px solid var(--road);border-radius:26px 26px 14px 14px;padding:12px 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seat{border:3px solid var(--road);background:#fff;color:#1F2A3A;border-radius:14px 14px 6px 6px;min-height:76px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;line-height:1.25}
.seat .em{font-size:28px}
.seat.full{background:var(--okbg)}
.seat .ar{font-size:1.1em;line-height:1.4}
/* ===== loceng ===== */
.scard{background:var(--sign2);border:3px solid var(--road);border-radius:18px;text-align:center;padding:8px;margin-bottom:12px}
.scard .em{font-size:56px;line-height:1.2;display:block}
.scard .ar{font-size:1.6em}
.bells{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bell{min-height:84px;border:4px solid var(--road);border-radius:20px;font-size:19px;box-shadow:0 5px 0 var(--road)}
.bell b{display:block;font-size:34px}
.bell[data-v="1"]{background:var(--okbg)} .bell[data-v="0"]{background:var(--stop2)}
.bell.ring b{animation:ring .5s}
@keyframes ring{25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
/* ===== rak bagasi ===== */
.bags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.bag{border:3px solid var(--road);background:var(--card);border-radius:14px;min-width:80px;min-height:56px;padding:2px 10px;position:relative;font-size:18px}
.bag::before{content:"";position:absolute;top:-9px;left:50%;width:22px;height:10px;margin-left:-11px;border:3px solid var(--road);border-bottom:0;border-radius:8px 8px 0 0}
.bag.pick{background:var(--bus)} .bag.used{visibility:hidden}
.racks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rack{border:4px solid var(--road);background:var(--sign2);border-radius:16px;min-height:130px;padding:6px;display:flex;flex-direction:column;align-items:center;background-image:repeating-linear-gradient(90deg,transparent 0 18px,rgba(59,66,82,.15) 18px 21px)}
.rack .lbl{background:var(--sign);color:#fff;border-radius:10px;padding:0 10px;font-size:17px}
.rack .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.rack .in span{background:var(--card);border-radius:8px;padding:0 6px;font-size:15px}
/* ===== tingkap ===== */
.windows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--bus);border:4px solid var(--road);border-radius:22px;padding:12px}
.win{aspect-ratio:1/1;border:4px solid var(--road);border-radius:14px;background:linear-gradient(180deg,#BFE6FF,#E9F7FF);font-size:40px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.win small{font-size:12px;color:#1F2A3A;line-height:1.1}
.win.seen{background:var(--okbg)}
/* ===== papan tanda ===== */
.rsign{background:var(--teal);color:#fff;border:5px solid #fff;box-shadow:0 0 0 4px var(--road);border-radius:16px;text-align:center;padding:10px;margin:6px 6px 0}
.rsign .em{font-size:40px;display:block}
.rsign .ar{font-size:1.5em}
.gap{display:inline-block;min-width:60px;border-bottom:4px dashed #fff;margin:0 4px}
.rpost{width:14px;height:26px;background:#9AA6B6;margin:0 auto 12px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:60px;border:4px solid var(--road);border-radius:16px;background:var(--card);font-size:18px;box-shadow:0 4px 0 var(--shadow)}
.opt.ok{background:var(--okbg)}
/* ===== hentian ===== */
.stops{display:flex;flex-direction:column;gap:8px}
.hs{min-height:56px;border:3px solid var(--road);border-radius:14px;background:var(--card);display:flex;align-items:center;gap:10px;padding:4px 12px;font-size:17px}
.hs::before{content:"🚏";font-size:22px}
.hs.done{visibility:hidden;height:0;min-height:0;padding:0;border:0;margin:-4px 0}
.built{display:flex;flex-direction:column;gap:6px;background:var(--road);border-radius:16px;padding:8px;min-height:50px;margin-bottom:10px}
.built span{background:var(--bus2);border-radius:10px;padding:0 10px;text-align:center}
.built.row{flex-direction:row;flex-wrap:wrap;justify-content:center;direction:rtl}
/* ===== tambang ===== */
.fare{background:var(--road);color:#fff;border-radius:18px;text-align:center;padding:10px;margin-bottom:12px}
.fare .big{font-family:"Titan One",sans-serif;font-size:34px;direction:ltr;display:block}
.fare .emr{font-size:24px;line-height:1.3;display:block;direction:ltr}
.coins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coin{min-height:72px;border:4px solid #B8860B;border-radius:40px;background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC21A);color:#1F2A3A;font-size:17px;box-shadow:0 4px 0 #8A6508}
/* ===== radio ===== */
.radio{display:flex;align-items:center;gap:10px;background:var(--plum);color:#fff;border-radius:18px;border:4px solid #fff;box-shadow:0 0 0 3px var(--road);padding:8px 12px;margin:4px 4px 12px}
.radio .ic{font-size:38px}
.radio .ar{flex:1;text-align:center;font-size:1.5em}
.reps{display:flex;flex-direction:column;gap:10px}
.rep{min-height:60px;border:3px solid var(--road);border-radius:18px 18px 18px 4px;background:var(--card);font-size:18px}
@media (max-width:370px){ .node{width:130px} .node .nm{font-size:15px} .windows{gap:6px;padding:8px} .win{font-size:32px} }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>

/* ============ KANDUNGAN: Buku Teks Bahasa Arab Tahun 2 (KPM, KSSR Semakan) ============
   Teks Melayu = [Rumi, Jawi]; teks Arab = rentetan biasa (berbaris penuh, disalin daripada buku).
   p = muka surat bercetak (ms. N = fail pN+12; Tamhid ms. أ–د = fail p9–p12).
   Jenis permainan (semua tekan sahaja):
     tebuk   : tebuk tiket konduktor — perkataan Arab → maksud (rounds [ar, makna, em])
     kerusi  : dudukkan penumpang (Arab) di kerusi maksudnya (pairs [ar, makna, em])

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const stripAr = t => String(t||"").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+[\s،؟.!…]*/g," ").replace(/…/g," ... ").replace(/[=]/g," ").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const clean = stripAr(text);
    if(!clean || !/[a-z]/i.test(clean)) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .9; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

/* ---------- Bantuan paparan ---------- */
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function confetti(n=34){
  const box = document.createElement("div"); box.className="confetti"; box.setAttribute("aria-hidden","true");
  const em = ["🎉","🚌","⭐","🎫","🚏","✨"];
  for(let i=0;i<n;i++){ const s=document.createElement("span"); s.textContent=em[i%em.length]; s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(2+Math.random()*2)+"s"; s.style.animationDelay=Math.random()*.8+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5000);
}

const voiceBtn = () => `<button class="ib" data-act="voice" aria-label="${L("Suara","سوارا")}" aria-pressed="${voiceOn}">${voiceOn?"🔊":"🔇"}</button>`;
const sayBtn = txt => ttsOK && stripAr(txt) ? `<button class="say" data-say="${enc(txt)}" aria-label="${L("Dengar","دڠر")}">🔊</button>` : "";
const starRow = n => [1,2,3].map(i=>`<span class="${i<=n?"":"off"}">⭐</span>`).join("");
const unlocked = id => id===1 || (best[id-1]||0)>0;
const allDone = () => STATIONS.every(s => (best[s.id]||0)>0);

function progressBar(){
  const n = S.games.length, k = S.gi, pct = k/n*100, side = isJ() ? "right" : "left", tr = isJ() ? "translate(50%,-50%)" : "translate(-50%,-50%)";
  const tks = S.games.map((_,i)=> i>=k ? `<span class="tk" style="${side}:${(i+.6)/n*100}%;transform:${tr}">🚏</span>` : "").join("");
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="fill" style="width:${Math.max(8,pct)}%"></span>${tks}
    <span class="who" style="${side}:${Math.max(7,pct)}%;transform:${isJ()?"translate(50%,-58%) scaleX(-1)":"translate(-50%,-58%)"}">${bobo()}</span></div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${TXmix(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play" data-type="${g.type}"></div><div id="hint"></div>`;

function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🚌 ${hint || L("Hmm, cuba lagi!","همم، چوبا لاڬي!")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  if(document.querySelector(".fb")) return;
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${bobo("yay")}<div><strong>${T(p)}</strong><p>${TXmix(g.e||["Betul! Bas Bobo boleh jalan lagi.","بتول! باس بوبو بوليه جالن لاڬي."])}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Bahasa Arab kamu hebat.","چمرلڠ! بهاس عرب کامو هيبت."] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom main lagi.","شاباس کران منچوبا! جوم ماٴين لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${bobo("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Tiket baharu dalam koleksi kamu!","تيکيت بهارو دالم کوليکسي کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🏫 ${L("Cabaran Juara di sekolah kini dibuka!","چابرن جوارا د سکوله کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🚏 ${L("Kembali ke peta","کمبالي ک ڤتا")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN (perjalanan bas) ===================== */
const DIG = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const others = (arr, i, k) => shuffle(arr.filter((_,j)=>j!==i)).slice(0,k);
const GAMES = {
  /* Tebuk tiket konduktor: perkataan Arab → maksud */
  tebuk(el, g){
    const order = shuffle(g.rounds.map((_,i)=>i)); let r = 0, busy = false;
    const draw = () => {
      const i = order[r], opts = shuffle([i, ...others(g.rounds.map((_,j)=>j), i, 2)]);
      el.innerHTML = `<div class="cond"><span class="who2" aria-hidden="true">🧑‍✈️</span>${AR(g.rounds[i][0])}</div>
        <div class="tstrip" id="tw" data-a="${i}">${opts.map(o=>`<button class="stub" data-i="${o}"><span class="hole"></span><span class="em" aria-hidden="true">${g.rounds[o][2]}</span><span>${T(g.rounds[o][1])}</span></button>`).join("")}</div>
        <div class="cnt">🎫 ${r+1} / ${order.length}</div>`;
      el.querySelectorAll(".stub").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.i===i){ busy = true; b.classList.add("punched"); sfx.punch(); clearHint(); speak(RU(g.rounds[i][1]));
          setTimeout(()=>{ busy = false; r++; if(r<order.length) draw(); else win(); }, 280); }
        else oops(b, L("Bukan tiket itu. Baca perkataan Arab sekali lagi!","بوکن تيکيت ايت. باچ ڤرکاتاٴن عرب سکالي لاڬي!"));
      }));
    };
    draw();
  },

  /* Dudukkan penumpang di kerusi */
  kerusi(el, g){
    const n = g.pairs.length, pax = shuffle(g.pairs.map((_,i)=>i)), seats = mix(pax); let sel = null, k = 0;
    el.innerHTML = `<div class="curb">${pax.map(i=>`<button class="pax" data-i="${i}">${AR(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="busin">${seats.map(i=>`<button class="seat" data-i="${i}"><span class="em" aria-hidden="true">${g.pairs[i][2]}</span><span>${T(g.pairs[i][1])}</span></button>`).join("")}</div>
      <div class="cnt">💺 ${L("Tekan penumpang, kemudian tekan kerusinya.","تکن ڤنومڤڠ، کمودين تکن کروسيڽ.")}</div>`;
    el.querySelectorAll(".pax").forEach(p => p.addEventListener("click", () => {
      if(p.classList.contains("gone")) return;
      el.querySelectorAll(".pax").forEach(x=>x.classList.remove("pick")); p.classList.add("pick"); sel = +p.dataset.i; sfx.tick();
    }));
    el.querySelectorAll(".seat").forEach(s => s.addEventListener("click", () => {
      if(s.classList.contains("full")) return;
      if(sel===null){ toast(L("Tekan seorang penumpang dahulu 🧒","تکن سأورڠ ڤنومڤڠ دهولو 🧒")); return; }
      if(+s.dataset.i===sel){
        const p = el.querySelector(`.pax[data-i="${sel}"]`); p.classList.remove("pick"); p.classList.add("gone");
        s.classList.add("full"); s.insertAdjacentHTML("beforeend", AR(g.pairs[sel][0])); sel = null; k++; sfx.tick(); clearHint();
        if(k===n) setTimeout(win, 300);
      } else oops(s, L("Bukan kerusi itu. Cuba kerusi lain!","بوکن کروسي ايت. چوبا کروسي لاين!"));
    }));
  },

  /* Loceng: betul atau salah */
  loceng(el, g){
    const rounds = shuffle(g.rounds); let r = 0, busy = false;
    const draw = () => {
      const [em, ar, ok] = rounds[r];
      el.innerHTML = `<div class="scard" id="lc" data-ok="${ok?1:0}"><span class="em" aria-hidden="true">${em}</span>${AR(ar)}</div>
        <div class="bells"><button class="bell" data-v="1"><b>🔔</b>${L("Betul","بتول")}</button><button class="bell" data-v="0"><b>✋</b>${L("Salah","ساله")}</button></div>
        <div class="cnt">${r+1} / ${rounds.length}</div>`;
      el.querySelectorAll(".bell").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.v===(ok?1:0)){ busy = true; b.classList.add("ring"); ok ? sfx.bell() : sfx.horn(); clearHint();
          setTimeout(()=>{ busy = false; r++; if(r<rounds.length) draw(); else win(); }, 280); }
        else oops(b, ok ? L("Sebenarnya ayat itu betul. Lihat gambar lagi!","سبنرڽ اءيت ايت بتول. ليهت ڬمبر لاڬي!") : L("Hmm, gambar dan ayat tidak sepadan.","همم، ڬمبر دان اءيت تيدق سڤادن."));
      }));
    };
    draw();
  },

  /* Rak bagasi: susun ikut kumpulan */
  rak(el, g){
    const items = shuffle(g.items.map((x,i)=>({x,i}))); let sel = null, k = 0;
    el.innerHTML = `<div class="bags">${items.map(o=>`<button class="bag" data-i="${o.i}">${AR(o.x[0])}</button>`).join("")}</div>
      <div class="racks">${g.bins.map((b,i)=>`<button class="rack" data-b="${i}"><span class="lbl"><span aria-hidden="true">${b[0]}</span> ${TX(b[1])}</span><span class="in" id="in${i}"></span></button>`).join("")}</div>
      <div class="cnt">🧳 ${L("Tekan beg, kemudian tekan rak.","تکن بيڬ، کمودين تکن رق.")}</div>`;
    el.querySelectorAll(".bag").forEach(c => c.addEventListener("click", () => {
      if(c.classList.contains("used")) return;
      el.querySelectorAll(".bag").forEach(x=>x.classList.remove("pick")); c.classList.add("pick"); sel = +c.dataset.i; sfx.tick();
    }));
    el.querySelectorAll(".rack").forEach(c => c.addEventListener("click", () => {
      if(sel===null){ toast(L("Tekan satu beg dahulu 🧳","تکن ساتو بيڬ دهولو 🧳")); return; }
      const it = g.items[sel], bag = el.querySelector(`.bag[data-i="${sel}"]`);
      if(it[1]===+c.dataset.b){
        bag.classList.remove("pick"); bag.classList.add("used"); sel = null; k++; sfx.tick(); clearHint();
        el.querySelector("#in"+c.dataset.b).insertAdjacentHTML("beforeend", `<span>${AR(it[0])}</span>`);
        if(k===g.items.length) setTimeout(win, 300);
      } else oops(c, L("Bukan rak itu. Cuba rak sebelah!","بوکن رق ايت. چوبا رق سبله!"));
    }));
  },

  /* Intai tingkap bas */
  tingkap(el, g){
    const asks = shuffle(g.items.map((_,i)=>i)), wins = mix(asks); let r = 0;
    el.innerHTML = `<div class="ask" id="want"></div>
      <div class="windows" style="grid-template-columns:repeat(${g.items.length<=4?2:3},1fr)">${wins.map(i=>`<button class="win" data-i="${i}" aria-label="${T(g.items[i][2])}"><span aria-hidden="true">${g.items[i][0]}</span></button>`).join("")}</div>
      <div class="cnt" id="cc"></div>`;
    const draw = () => { const w = el.querySelector("#want"); w.dataset.a = asks[r]; w.innerHTML = AR(g.items[asks[r]][1]); el.querySelector("#cc").textContent = `🪟 ${r+1} / ${asks.length}`; };
    draw();
    el.querySelectorAll(".win").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("seen") || r>=asks.length) return;
      if(+b.dataset.i===asks[r]){ b.classList.add("seen"); b.insertAdjacentHTML("beforeend", `<small>${T(g.items[asks[r]][2])}</small>`); sfx.tick(); speak(RU(g.items[asks[r]][2])); r++; clearHint();
        if(r<asks.length) draw(); else setTimeout(win, 350); }
      else oops(b, L("Bukan tingkap itu. Baca perkataan Arab!","بوکن تيڠکڤ ايت. باچ ڤرکاتاٴن عرب!"));
    }));
  },

  /* Papan tanda: isi tempat kosong */
  tanda(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    el.innerHTML = `<div class="rsign">${g.em?`<span class="em" aria-hidden="true">${g.em}</span>`:""}<span class="ar" lang="ar">${g.ask.replace("___",'<span class="gap"></span>')}</span></div><div class="rpost"></div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done) return;
      if(b.dataset.ok==="1"){ done = true; b.classList.add("ok"); el.querySelector(".gap").outerHTML = `<u>${g.a[0]}</u>`; sfx.ok(); setTimeout(win, 450); }
      else oops(b, L("Belum tepat. Baca ayat pada papan tanda!","بلوم تڤت. باچ اءيت ڤد ڤاڤن تندا!"));
    }));
  },

  /* Hentian bas: tekan ikut urutan */
  hentian(el, g){
    const n = g.seq.length, order = mix(g.seq.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="built ${g.row?"row":""}" id="built" lang="ar"></div>
      <div class="stops">${order.map(i=>`<button class="hs" data-v="${enc(g.seq[i])}">${AR(g.seq[i])}</button>`).join("")}</div>
      <div class="cnt">🚏 ${L("Tekan yang pertama dahulu!","تکن يڠ ڤرتام دهولو!")}</div>`;
    el.querySelectorAll(".hs").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || k>=n) return;
      const v = dec(b.dataset.v);
      if(v===g.seq[k]){ k++; sfx.tick(); b.classList.add("done"); el.querySelector("#built").insertAdjacentHTML("beforeend", `<span class="ar">${v}</span>`); clearHint(); if(k===n) setTimeout(win, 350); }
      else oops(b, L(`Belum lagi. Cari yang ke-${k+1}.`,`بلوم لاڬي. چاري يڠ ک-${k+1}.`));
    }));
  },

  /* Bayar tambang dengan nombor Arab */
  tambang(el, g){
    const rounds = shuffle(g.rounds); let r = 0;
    const draw = () => {
      const [n, ans] = rounds[r];
      const show = typeof n==="string" ? `<span class="big">${n}</span>` : g.show==="num" ? `<span class="big">${DIG(n)} <small>(${n})</small></span>` : `<span class="emr">${String(g.em).repeat(n)}</span>`;
      const opts = shuffle([ans, ...shuffle(g.opts.filter(o=>o!==ans)).slice(0,3)]);
      el.innerHTML = `<div class="fare" id="fw" data-a="${enc(ans)}">🎫 ${L("Tambang","تمبڠ")}${show}</div>
        <div class="coins">${opts.map(o=>`<button class="coin" data-v="${enc(o)}">${AR(o)}</button>`).join("")}</div>
        <div class="cnt">${r+1} / ${rounds.length}</div>`;
      el.querySelectorAll(".coin").forEach(b => b.addEventListener("click", () => {
        if(dec(b.dataset.v)===ans){ sfx.punch(); r++; clearHint(); if(r<rounds.length) draw(); else win(); }
        else oops(b, L("Bukan nombor itu. Kira sekali lagi!","بوکن نومبور ايت. کيرا سکالي لاڬي!"));
      }));
    };
    draw();
  },

  /* Radio pemandu: soalan → jawapan */
  radio(el, g){
    const order = shuffle(g.rounds.map((_,i)=>i)); let r = 0;
    const draw = () => {
      const i = order[r], [q, a, em] = g.rounds[i];
      const pool = [...new Set(g.rounds.map(x=>x[1]).filter(x=>x!==a))];
      const opts = shuffle([a, ...shuffle(pool).slice(0,2)]);
      el.innerHTML = `<div class="radio" id="rq" data-a="${enc(a)}"><span class="ic" aria-hidden="true">📻</span>${AR(q)}${em?`<span class="ic" aria-hidden="true">${em}</span>`:""}</div>
        <div class="reps">${opts.map(o=>`<button class="rep" data-v="${enc(o)}">${AR(o)}</button>`).join("")}</div>
        <div class="cnt">${r+1} / ${order.length}</div>`;
      el.querySelectorAll(".rep").forEach(b => b.addEventListener("click", () => {
        if(dec(b.dataset.v)===a){ sfx.ok(); r++; clearHint(); if(r<order.length) draw(); else win(); }
        else oops(b, L("Jawapan itu tidak sesuai. Dengar soalan lagi!","جواڤن ايت تيدق سسواي. دڠر سوالن لاڬي!"));
      }));
    };
    draw();
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(dec(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan hentian sebelumnya dahulu 🔒","سلسايکن هنتين سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} hentian untuk membuka Cabaran Juara 🏫`,`سلسايکن سموا ${STATIONS.length} هنتين اونتوق ممبوک چابرن جوارا 🏫`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  renderPlay();
}
applyLang();
renderMap();
</script>
