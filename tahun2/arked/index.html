<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7A4A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<title>Stadium Juara KAFA 3D • Zon Arked Tahun 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="../../assets/config.js"></script>
<script src="../../assets/auth.js"></script>
<script src="../../assets/access.js"></script>
<style>
:root{
  --bg:#ECF8EF; --surface:#FFFFFF; --ink:#132049; --muted:#56628C; --line:#CFE0F7;
  --gold:#FFC22E; --ok:#18A957; --bad:#E5484D;
  --w1:#0F7A4A; --w2:#0A3D2A; --wa:#FFC22E;
  --pattern:rgba(27,95,209,.08);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0A1430; --surface:#14214A; --ink:#EAF1FF; --muted:#A9B8E6; --line:#26386E; --pattern:rgba(150,190,255,.07); color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.4;
  background-image:radial-gradient(var(--pattern) 2px,transparent 2.5px);background-size:26px 26px;overscroll-behavior:none}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Baloo 2",serif;font-size:20px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding:10px 14px 40px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;line-height:1.5}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
.grp{display:flex;gap:6px;align-items:center}
.iconbtn,.langbtn{display:inline-grid;place-items:center;min-width:48px;height:48px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-size:22px;font-weight:800;text-decoration:none;color:var(--ink);padding:0 10px}
.langbtn{font-size:17px}
.card{background:var(--surface);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 22px;border:0;border-radius:20px;font-weight:800;font-size:21px;
  background:linear-gradient(180deg,#FFD84D,#FFB000);color:#3A2400;box-shadow:0 5px 0 #C27C00;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #C27C00}
.btn.alt{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);border:3px solid var(--line)}
.btn.go{background:linear-gradient(180deg,#3FE08A,#14A05A);color:#fff;box-shadow:0 5px 0 #0B6B3B;font-size:26px;min-height:68px;padding:6px 34px}
.btn.sm{min-height:44px;font-size:16px;padding:4px 14px}
/* papan tajuk */
.hero{position:relative;overflow:hidden;margin:10px 0 14px;border-radius:26px;padding:18px 18px 20px;color:#fff;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 34px,transparent 34px 68px),linear-gradient(165deg,#13A35C 0%,#0E7A4A 50%,#0A3D2A 100%);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hero h1{margin:0;padding-inline-end:64px;font-size:34px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{margin:6px 0 0;font-size:17px;opacity:.95;max-width:78%}
.hero .flag{position:absolute;inset-inline-end:10px;top:6px;font-size:64px;transform:rotate(-8deg)}
.hero .road{position:absolute;left:0;right:0;bottom:0;height:8px;background:#fff;opacity:.8}
.hero .lights{position:absolute;top:0;inset-inline-start:46%;font-size:22px;letter-spacing:10px;opacity:.9}
.hero .stars{display:inline-block;margin-top:8px;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 12px;font-weight:800}
.sec{font-weight:800;font-size:20px;margin:16px 4px 8px}
/* kad dunia */
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wcard{position:relative;min-width:0;min-height:150px;border:0;border-radius:24px;padding:12px;text-align:start;color:#fff;overflow:hidden;
  background:linear-gradient(165deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;justify-content:flex-end}
.wcard:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.wcard .m{position:absolute;top:6px;inset-inline-end:8px;font-size:54px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.wcard .deco{position:absolute;top:10px;inset-inline-start:10px;font-size:22px;opacity:.85;letter-spacing:2px}
.wcard b{font-size:19px;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.3)}
html[dir="rtl"] .wcard b{font-size:18px;line-height:1.5}
.wcard small{font-weight:700;opacity:.95;font-size:14px}
.wcard.mix{grid-column:1/-1;min-height:110px}
/* kad kenderaan */
.vgrid{display:grid;gap:12px}
.vcard{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:12px;border:0;border-radius:24px;padding:12px 14px;text-align:start;
  background:var(--surface);box-shadow:0 6px 0 var(--line);min-height:104px;border:3px solid transparent}
.vcard:active{transform:translateY(3px)}
.vcard .ve{font-size:58px;line-height:1;display:grid;place-items:center;height:80px;border-radius:20px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.vcard b{display:block;font-size:22px;line-height:1.15}
.vcard small{color:var(--muted);font-weight:600;font-size:15px;display:block}
.vcard .best{font-weight:800;color:var(--w1);font-size:16px;white-space:nowrap}
.vcard .play{font-size:30px}
.whead{display:flex;align-items:center;gap:12px;border-radius:24px;padding:14px;color:#fff;background:linear-gradient(160deg,var(--w1),var(--w2));margin:10px 0 6px}
.whead .m{font-size:60px;line-height:1}
.whead h1{margin:0;font-size:26px;line-height:1.15}
.whead p{margin:2px 0 0;font-size:15px;opacity:.95}
/* skrin pengenalan */
.intro{text-align:center;padding:18px}
.intro .big{font-size:84px;line-height:1.1}
.intro h2{margin:6px 0;font-size:28px}
.how{list-style:none;padding:0;margin:12px 0 18px;display:grid;gap:8px;text-align:start}
.how li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:8px 12px;font-weight:700;font-size:17px}
.how li span{font-size:30px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:80;max-width:92vw;text-align:center}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.rain span{position:absolute;top:-50px;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
/* ---------- skrin permainan sukan ---------- */
.game{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.field{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--w1),var(--w2))}
.field canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:6px;right:6px;display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(10,18,50,.62);color:#fff;border-radius:16px;padding:2px 10px;font-weight:800;font-size:19px;min-height:44px;white-space:nowrap}
.chip.rd{background:linear-gradient(180deg,#FFD84D,#FFB000);color:#3A2400}
.chip.combo{background:linear-gradient(180deg,#FF7A3D,#E5322D)}
.chip.combo[hidden]{display:none}
.chip.par{background:linear-gradient(180deg,#3FE08A,#14A05A)}
.chip.par[hidden]{display:none}
.hud .sp{flex:1}
.hud .iconbtn{border:0;background:rgba(10,18,50,.62);color:#fff;height:44px;min-width:44px}
.prompt{position:absolute;left:8px;right:8px;top:calc(58px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.95);color:#132049;border-radius:20px;padding:6px 8px 6px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25);border:3px solid var(--wa)}
.prompt .q{flex:1;font-weight:800;font-size:21px;line-height:1.2;min-width:0}
html[dir="rtl"] .prompt .q{font-size:22px;line-height:1.6}
.prompt .say{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:var(--w1);color:#fff;font-size:24px}
.prompt.pop{animation:ppop .45s ease-out}
.prompt[hidden]{display:none}
@keyframes ppop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05)}100%{transform:none}}
/* sasaran boleh diketik (diletak di atas kanvas mengikut unjuran) */
.tg{position:absolute;z-index:4;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:0;background:transparent;padding:0}
.tg.sel{box-shadow:0 0 0 4px var(--tc),0 0 18px 6px rgba(255,255,255,.7)}
/* kawalan bawah */
.ctl{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:0 10px;z-index:6;pointer-events:none}
.ctl button{pointer-events:auto;touch-action:none}
.ctl .side{width:72px;height:72px;border-radius:24px;border:4px solid rgba(255,255,255,.9);background:rgba(10,18,50,.5);color:#fff;font-size:34px;font-weight:800}
.ctl .side:active{background:var(--wa);color:#3A2400}
.ctl .pw{width:112px;height:112px;border-radius:50%;border:6px solid #fff;font-size:44px;font-weight:800;color:#3A2400;
  background:conic-gradient(#FF5A3D calc(var(--p,0)*1turn),#FFD84D 0);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.ctl .pw.on{transform:scale(1.06)}
.ctl .pw:disabled{filter:grayscale(.8);opacity:.6}
.meter{position:absolute;inset-inline-end:10px;bottom:calc(140px + env(safe-area-inset-bottom,0px));width:26px;height:150px;border-radius:14px;border:3px solid #fff;background:rgba(10,18,50,.55);z-index:6;overflow:hidden;pointer-events:none}
.meter i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0)*100%);background:linear-gradient(0deg,#3FE08A,#FFD84D,#FF5A3D)}
.meter b{position:absolute;left:0;right:0;border:2px dashed #fff;background:rgba(255,255,255,.35);bottom:calc(var(--z0,0)*100%);height:calc((var(--z1,0) - var(--z0,0))*100%)}
.curve{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:6px;background:rgba(10,18,50,.6);color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}
.curve input{width:130px;accent-color:var(--wa)}
.cd{position:absolute;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none;font-size:140px;font-weight:800;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.cd span{animation:cdz .8s ease-out}
@keyframes cdz{from{transform:scale(2.2);opacity:0}}
.fxtxt{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:7;font-size:44px;font-weight:800;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 4px 0 rgba(0,0,0,.35);animation:fxt 1.2s ease-out forwards}
.fxtxt.bad{color:#FFE3E3;font-size:34px}
.fxtxt.big{font-size:60px;color:#FFE066}
@keyframes fxt{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-110%);opacity:0}}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:6;background:rgba(255,255,255,.95);color:#132049;border-radius:16px;padding:4px 14px;font-weight:800;font-size:17px;border:3px solid var(--ok);max-width:90%;text-align:center;pointer-events:none}
.hint[hidden]{display:none}
.slow{position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(255,230,120,.55);opacity:0;transition:opacity .2s}
.slow.on{opacity:1}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ovl{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(5,10,35,.55);padding:16px}
.ovl .card{text-align:center;width:min(380px,100%)}
.ovl .card .btn{width:100%;margin-top:10px}
/* mod rata (tiada WebGL) */
.flat{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky1,#8FD3FF) 0 20%,var(--gnd,#7CC66B) 20%)}
.flat .lane{position:absolute;left:0;right:0;top:20%;bottom:0;background:var(--lane,transparent);clip-path:polygon(40% 0,60% 0,95% 100%,5% 100%)}
.flat .ft{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.flat .ft .bd{background:#fff;color:#132049;border-radius:12px;border:4px solid var(--tc);text-align:center;font-weight:800;font-size:15px;padding:2px 6px;max-width:30vw;overflow-wrap:break-word}
.flat .ft .bd .e{display:block;font-size:24px;line-height:1.1}
.flat .ft .ic{font-size:34px;line-height:1}
.flat .ft.ok .bd{border-color:#18A957;background:#D8F8E4}
.flat .ft.no .bd{border-color:#E5484D;background:#FFE3E3}
.flat .ball{position:absolute;font-size:34px;transform:translate(-50%,-50%);line-height:1;pointer-events:none}
.flat .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;opacity:.85}
.flat .obs{position:absolute;transform:translate(-50%,-50%);font-size:28px;pointer-events:none}
.flat .coach{position:absolute;left:6%;bottom:24%;font-size:46px}
/* keputusan */
.res{text-align:center}
.res .place{font-size:76px;line-height:1}
.res h2{margin:4px 0;font-size:30px}
.res .stars{font-size:52px;letter-spacing:6px;margin:4px 0}
.res .stars .off{filter:grayscale(1);opacity:.3}
.res .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.res .nums div{background:var(--bg);border-radius:16px;padding:6px 4px;font-weight:700;font-size:14px}
.res .nums b{display:block;font-size:26px;color:var(--w1)}
.res .acts{display:grid;gap:10px;margin-top:12px}
.newbest{display:inline-block;background:var(--gold);color:#3A2400;border-radius:999px;padding:2px 14px;font-weight:800;animation:ppop .6s}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin:12px 0 6px}
.podium:empty{display:none}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pd .md{font-size:34px;line-height:1}
.pd .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;margin-top:2px}
.pd .sc{font-weight:800;color:var(--w1);font-size:18px}
.pd .step{display:grid;place-items:center;width:100%;margin-top:4px;border-radius:14px 14px 4px 4px;color:#fff;font-size:26px;font-weight:800;background:linear-gradient(180deg,var(--w1),var(--w2))}
.pd.p1 .step{height:96px;background:linear-gradient(180deg,#F5C542,#C9952B)}
.pd.p2 .step{height:70px;background:linear-gradient(180deg,#C9D3DE,#8E9AAB)}
.pd.p3 .step{height:52px;background:linear-gradient(180deg,#E3A06B,#A9663A)}
.pd.p1 .md{font-size:44px}
.pd.me .nm{color:var(--w1);text-decoration:underline}
/* ---------- papan pendahulu & akaun (dari Zon Arked T3) ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 0;padding:5px;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.tabs button{border:0;border-radius:13px;padding:8px 10px;font-weight:800;font-size:18px;background:none;color:var(--muted);min-height:48px}
.tabs button[aria-selected="true"]{background:var(--w1);color:#fff;box-shadow:0 3px 0 var(--w2)}
.acct{border:2px solid var(--wa);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;min-height:44px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{padding:12px}
.lbtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.lbtabs button{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px;min-height:40px}
.lbtabs button[aria-pressed="true"]{background:var(--w1);border-color:var(--w1);color:#fff}
.lbtabs.games button[aria-pressed="true"]{background:var(--wa);border-color:var(--wa);color:var(--w2)}
.lbrows{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.lbrows li{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:4px 12px;font-weight:700}
.lbrows li.top{background:color-mix(in srgb,var(--gold) 18%,var(--bg))}
.lbrows li.me{outline:3px solid var(--wa);outline-offset:-1px}
.lbrows .rk{font-size:20px;text-align:center}
.lbrows .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
html[dir="rtl"] .lbrows .nm{text-align:right}
.lbrows b{font-size:20px;color:var(--w1)}
.lbrows .kskel{height:1.05em}
.lbrows li.lbmsg{display:block;text-align:center;font-weight:600;color:var(--muted)}
.lbmsg{text-align:center;color:var(--muted);margin:8px 0}
.lbfoot{text-align:center;margin-top:8px}
.lbfoot p{margin:4px 0}
.lbfoot small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.lbres{margin-top:12px;border:2px solid var(--wa);border-radius:16px;padding:8px 12px;background:color-mix(in srgb,var(--wa) 10%,var(--surface))}
.lbres p{margin:4px 0}
.lbres .rank{font-size:20px;font-weight:800}
.lbres .rank b{font-size:28px;color:var(--w1)}
.sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(10,3,32,.6)}
.sheet .card{position:relative;width:min(460px,100%);max-height:90vh;overflow:auto}
.sheet h2{margin:0 40px 8px 0;font-size:24px}
html[dir="rtl"] .sheet h2{margin:0 0 8px 40px}
.sheet h3{margin:14px 0 4px;font-size:18px}
.sheet .x{position:absolute;top:10px;inset-inline-end:10px;width:38px;height:38px}
.sheet label{display:block;font-weight:700;font-size:15px;margin-top:10px}
.sheet .row{display:flex;gap:8px;margin-top:4px}
.sheet input{flex:1;min-width:0;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg);color:var(--ink)}
.sheet input:focus{outline:3px solid var(--wa);outline-offset:1px}
.sheet .cls{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sheet .cls li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 10px}
.sheet .cls li>span{flex:1 1 160px}
.sheet input:disabled{opacity:.7}
.sheet code{font-size:17px;font-weight:800;letter-spacing:2px;color:var(--w1)}
.sheet details{margin-top:12px}
.sheet summary{font-weight:700;cursor:pointer}
.sheet .muted{color:var(--muted)}
.sheet .err{color:var(--bad);font-weight:700;min-height:1.2em;margin:8px 0 0}
.hero .sub{display:inline-block;font-weight:800;font-size:15px;background:rgba(0,0,0,.22);border-radius:999px;padding:0 12px;margin-bottom:6px}
.prompt{flex-wrap:wrap}

const itLog = it => { const k = itKind(it); return k==="w" ? [String(it[0]), String(it[1])] : k==="h" ? it.huruf : it.ar; };
function okEntry(q){ return q && Array.isArray(q.p) && q.p.length===2 && Array.isArray(q.ok) && q.ok.length && Array.isArray(q.no) && q.no.length>=2; }
function deck(s){
  const B = (typeof BANK!=="undefined" && BANK) || {};
  const from = s==="mix" ? REAL : [s];
  return from.flatMap(id=>(B[id]||[]).filter(okEntry).map(q=>({...q, sub:id})));
}
// bina satu gerbang: 1 jawapan betul + n-1 pengganggu, kedudukan rawak
function makeQ(q, n){
  const ok = pick(q.ok), okK = new Set(q.ok.map(itKey));
  let no = shuffle(q.no).filter(x=>!okK.has(itKey(x)));
  if(no.length < n-1){ // tambah pengganggu daripada soalan lain subjek yang sama (bukan jawapan betul soalan ini)
    const extra = shuffle(deck(q.sub).flatMap(o=>o.no)).filter(x=>!okK.has(itKey(x)) && !no.some(y=>itKey(y)===itKey(x)) && itKind(x)===itKind(ok));
    no = no.concat(extra);
  }
  no = no.slice(0, n-1);
  const opts = shuffle([ok, ...no]);
  return {p:q.p, sub:q.sub, opts, ok:opts.indexOf(ok)};
}

let actx;
function tone(freqs, dur=0.1, type="sine", vol=0.16){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{ const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
      const s = t+i*dur; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol,s+0.015); g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+dur+0.02); });
  }catch(e){}
}

}

function newGame(gid){
  const g = GM(gid) || GAMES[0];
  let pool = shuffle(deck(subj));
  if(subj==="mix"){ const by = {}; pool.forEach(q=>(by[q.sub] = by[q.sub]||[]).push(q)); const ks = Object.keys(by); pool = [];
    for(let i=0;i<NROUND*2 && ks.length;i++){ const k = pick(ks); pool.push(pick(by[k])); } }
  if(!pool.length) pool = [{p:["Pilih yang betul","ڤيليه يڠ بتول"], ok:[["Betul","بتول","✅"]], no:[["Salah","سالة","❌"],["Tidak","تيدق","🚫"],["Bukan","بوکن","⛔"]], sub:subj}];
  const rounds = []; let last = null;
  for(let i=0;i<NROUND;i++){ let q = pool[i % pool.length]; if(last && q.p[0]===last.p[0] && pool.length>1) q = pool[(i+1) % pool.length]; last = q; rounds.push(q); }
  return {subj, gid, g, n:g.n, rounds, ri:-1, q:null, tgts:[], ball:{}, phase:"ready", t:0, cd:3, cdShown:0, score:0, combo:0, maxCombo:0,

}

}
function nudgeAim(d){ if(!canAim()) return; PHX().nudge(G, d); G.pvT = 0; UI.sel(); }
function charge(on){
  if(!canAim()) return;
  if(on){ if(G.aim.charging) return; G.aim.charging = true; G.aim.p = 0; G.aim.dir = 1; }
  else if(G.aim.charging){ G.aim.charging = false; shoot(G.aim.p); }
  UI.power();
}
function shoot(p){
  if(!canAim()) return;
  G.aim.charging = false; G.aim.p = clamp(p, 0, 1);
  PHX().shoot(G, G.aim.p); G.phase = "fly"; G.flyT = 0; G.preview = []; G.autoWait = null;
  sfx.throw(); UI.power(); UI.sel();
  if(G.view && G.view.shoot) G.view.shoot();
}
// seret: k = "move" | "end" (dx,dy dalam piksel)
function dragAim(k, dx, dy, W, Hh){ if(!canAim()) return; const p = PHX().drag(G, k, dx, dy, W||360, Hh||640); G.pvT = 0; UI.sel(); if(k==="end" && p!=null) shoot(p); }
// tembakan automatik (autopilot ?shot= dan ujian): correct=false → pilih sasaran salah
function autoShot(correct){
  if(!canAim()) return false;
  const ok = G.q.ok, i = correct===false ? (ok + 1 + Math.floor(Math.random()*(G.n-1))) % G.n : ok;
  const p = PHX().auto(G, i);
  if(p==null){ G.autoWait = {i, t:0}; return true; }
  shoot(p); return true;
}
function onHit(i){
  const ok = i===G.q.ok, it = G.q.opts[i], right = G.q.opts[G.q.ok];
  G.res = {i, ok}; G.phase = "show"; G.showT = ok ? 1.7 : 2.3;
  if(ok){
    const clean = G.shots===0 && G.clean;
    const pts = Math.min(PTS.max, PTS.base + (clean ? PTS.clean : 0) + (G.combo>=1 ? PTS.combo : 0));
    G.good++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.score += pts; if(clean) G.perfect++;
    sfx.ok(); sfx.cheer(); setTimeout(sfx.star, 160);
    UI.fx(clean ? PHX().word() : G.combo>=3 ? `🔥 x${G.combo}` : pick(["⭐ "+tx("Hebat!","هيبت!"),"👍 "+tx("Betul!","بتول!")]), false, clean);
  } else {
    G.bad++; G.combo = 0; sfx.bad();
    if(G.log.length<20) G.log.push({p:G.q.p, it:itLog(it), right:itLog(right), s:G.q.sub});
    UI.fx("🙈 "+tx("Bukan itu!","بوکن ايت!"), true); UI.hint(right);
  }
  if(itKind(right)==="h") sayHuruf(right.huruf);
  PHX().onHit(G, i, ok);
  if(G.view && G.view.hit) G.view.hit(i, ok);
  UI.hud(true); UI.sel();
}
function onMiss(){
  G.shots++;
  if(G.shots >= MAXSHOT){ // tunjuk jawapan, terus ke soalan seterusnya (tiada markah, tiada hukuman)
    G.combo = 0; G.res = {i:-1, ok:false}; G.phase = "show"; G.showT = 2.3;
    UI.fx("👀 "+tx("Ini jawapannya","اين جواڤنڽ"), true); UI.hint(G.q.opts[G.q.ok]);
    const right = G.q.opts[G.q.ok]; if(itKind(right)==="h") sayHuruf(right.huruf);
    if(G.view && G.view.hit) G.view.hit(-1, false);
  } else {
    G.phase = "aim"; G.aimT = 0; PHX().reset(G); selectT(G.aim.tgt, true);
    UI.fx("🔁 "+tx("Cuba lagi!","چوبا لاڬي!"), true);
    if(G.view && G.view.miss) G.view.miss();
  }
  UI.hud(true); UI.sel();
}
function gameTick(dt){
  if(!G || G.over || G.paused) return;
  dt = Math.min(dt, 0.25);
  if(G.phase==="count"){
    G.cd -= dt; const c = Math.ceil(G.cd);
    if(c!==G.cdShown){ G.cdShown = c; if(c>0){ sfx.tick(); UI.count(c); } }
    if(G.cd<=0){ G.phase = "go"; sfx.go(); UI.count(0); nextRound(); }
    if(G.view) G.view.frame(dt);
    return;
  }
  if(G.phase==="done"){ if(G.view) G.view.frame(dt); return; }
  // gerak perlahan (slow-mo) apabila bola hampir masuk sasaran betul
  if(G.slowT>0) G.slowT -= dt;
  const sdt = G.slowT>0 && !REDUCED ? dt*0.4 : dt;
  G.t += sdt;
  const P = PHX(); if(P.move) P.move(G);
  if(G.phase==="aim"){
    G.aimT += dt;
    if(G.aim.charging){ G.aim.p += G.aim.dir*dt/1.1; if(G.aim.p>=1){ G.aim.p = 1; G.aim.dir = -1; } if(G.aim.p<=0){ G.aim.p = 0; G.aim.dir = 1; } UI.power(); }
    if(G.autoWait){ G.autoWait.t += dt; const p = P.auto(G, G.autoWait.i, G.autoWait.t > 3); if(p!=null) shoot(p); }
    else if(G.auto && G.aimT > 0.9) autoShot(!(G.ri % 4===2));
    if(G.phase==="aim" && (G.pvT -= dt) <= 0){ G.pvT = 0.12; G.preview = P.preview(G); }
  }
  // fizik: langkah tetap 1/120 s (deterministik, sama untuk ramalan)
  G.acc = (G.acc||0) + sdt;
  while(G.acc >= H){ G.acc -= H;
    const ev = P.step(G, H);
    if(ev && G.phase==="fly"){ if(ev.hit!=null) onHit(ev.hit); else if(ev.miss) onMiss(); }
  }
  if(G.phase==="fly"){ G.flyT += sdt; if(G.flyT > 9) onMiss(); }
  if(G.phase==="show"){ G.showT -= dt; if(G.showT<=0){ UI.hint(""); nextRound(); } }
  if(G.view) G.view.frame(dt);
  UI.hud();
}
function finishGame(){
  G.over = true; G.phase = "done";
  const ratio = G.good / NROUND;
  G.stars3 = ratio>=0.85 ? 3 : ratio>=0.5 ? 2 : 1;
  const s = hi[G.subj] = hi[G.subj] || {};
  G.prevBest = s[G.gid] || 0; G.newBest = G.score > G.prevBest;
  if(G.newBest){ s[G.gid] = G.score; save("ark2-hi", hi); }
  sfx.win(); if(G.stars3>=2){ confetti(); sfx.cheer(); }
  const tok = G.tok;
  setTimeout(()=>{ if(G && G.tok===tok) UI.result(true); }, G.manual ? 300 : 1400);
}
function togglePause(force){
  if(!G || G.over || G.phase==="ready") return;
  G.paused = force!=null ? force : !G.paused;
  if(G.paused){ hush(); G.aim.charging = false; }
  UI.pause(G.paused);
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && G && !G.over && G.phase!=="ready" && !G.paused) togglePause(true); });
function runLoop(){
  const tok = G.tok; let last = 0;
  const raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : f=>setTimeout(()=>f(Date.now()), 16);
  const step = ts=>{
    if(!G || G.tok!==tok) return;
    const dt = last ? Math.min(0.05, (ts-last)/1000) : 0.016; last = ts;
    if(!G.manual) G.tick(dt);
    else if(G.view && G.view.idle) G.view.idle();
    raf(step);
  };
  raf(step);
}

/* ============ FIZIK: bola keranjang & boling (unit: meter, y ke atas, -z ke hadapan) ============ */
const PH = {};
const hyp = Math.hypot;
/* ---------- 🏀 Jaring Bola Keranjang ---------- */
const BB = {g:11, el:0.98, vmin:6.5, vmax:12.5, R:0.56, br:0.24, y0:1.5, bz:0.62};
PH.bola = {
  layout(G){
    const hs = shuffle([2.7, 3.15, 3.6]), far = shuffle([0, 0.7, 1.4]);
    G.tgts = G.q.opts.map((it,i)=>({bx:(i-(G.n-1)/2)*2.8, x:0, y:hs[i%3], z:-7.6 - far[i%3], ph:rnd(0,6), mv:G.ri>=4 ? 0.55 + (G.ri-4)*0.12 : 0, net:0}));
    this.move(G); this.reset(G);
  },
  move(G){ for(const h of G.tgts) h.x = h.bx + h.mv*Math.sin(G.t*0.9 + h.ph); },
  reset(G){ G.ball = {x:0, y:BB.y0, z:0, vx:0, vy:0, vz:0, live:false, rim:0, t:0, spin:0, thru:-1}; G.clean = true; },
  hx(G, h, dt){ return h.bx + h.mv*Math.sin((G.t+dt)*0.9 + h.ph); },
  // laju ideal untuk masuk tepat ke tengah gelung (dengan ramalan gerakan gelung)
  ideal(G, i){
    const h = G.tgts[i], c = Math.cos(BB.el), tn = Math.tan(BB.el), hg = h.y + 0.12 - BB.y0;
    let x = h.x, v = 9, T = 0;
    for(let k=0;k<3;k++){ const d = hyp(x, h.z), den = 2*c*c*(d*tn - hg); v = Math.sqrt(BB.g*d*d/Math.max(0.1, den)); T = d/(v*c); x = this.hx(G, h, T); }
    return {yaw:Math.atan2(x, -h.z), v, p:clamp((v - BB.vmin)/(BB.vmax - BB.vmin), 0.05, 0.95)};
  },
  // bantuan kanak-kanak: kuasa dalam ±0.12 daripada ideal dikira tepat
  err: (p, i) => { const e = p - i; return Math.abs(e) < 0.12 ? 0 : e - Math.sign(e)*0.12; },
  aimAt(G, i){ const s = this.ideal(G, i); G.aim.yaw = s.yaw; G.aim.pi = s.p; },
  nudge(G, d){ selectT(clamp(G.aim.tgt + d, 0, G.n-1)); },
  shoot(G, p){
    const i = G.aim.tgt, s = this.ideal(G, i); G.aim.yaw = s.yaw; G.aim.pi = s.p;
    const v = s.v*(1 + this.err(p, s.p)*0.42), c = Math.cos(BB.el), b = G.ball;
    Object.assign(b, {vx:v*c*Math.sin(s.yaw), vz:-v*c*Math.cos(s.yaw), vy:v*Math.sin(BB.el), live:true, t:0, spin:8});
  },
  drag(G, k, dx, dy, W, Hh){
    if(k!=="end" || dy > -40) return null;
    const yaw = clamp(dx/W*1.1, -0.7, 0.7); let best = G.aim.tgt, bd = 9;
    if(Math.abs(dx) > 25) G.tgts.forEach((h,i)=>{ const d = Math.abs(Math.atan2(h.x, -h.z) - yaw); if(d < bd){ bd = d; best = i; } });  // leretan lurus = kekal sasaran terpilih
    G.aim.tgt = best; this.aimAt(G, best);
    return clamp(-dy/(Hh*0.45), 0, 1);
  },
  auto(G, i){ G.aim.tgt = i; const s = this.ideal(G, i); G.aim.yaw = s.yaw; return s.p; },
  word: () => "🏀 SWISH!",
  preview(G){
    const p = G.aim.charging ? G.aim.p : G.aim.pi, s = this.ideal(G, G.aim.tgt), v = s.v*(1 + this.err(p, s.p)*0.42), c = Math.cos(BB.el), out = [];
    const vx = v*c*Math.sin(s.yaw), vz = -v*c*Math.cos(s.yaw), vy = v*Math.sin(BB.el);
    for(let t=0.08; t<1.6 && out.length<14; t+=0.08){ const y = BB.y0 + vy*t - BB.g*t*t/2; if(y < 0.2) break; out.push({x:vx*t, y, z:vz*t}); }
    return out.slice(0, Math.ceil(out.length*0.6));
  },
  step(G, h){
    const b = G.ball; if(!b.live) return null;
    b.t += h; b.vy -= BB.g*h;
    const py = b.y, pz = b.z;
    b.x += b.vx*h; b.y += b.vy*h; b.z += b.vz*h;
    let ev = null;
    if(b.thru>=0){ const t = G.tgts[b.thru]; b.x += (t.x - b.x)*Math.min(1, h*14); b.z += (t.z - b.z)*Math.min(1, h*14); b.vx = b.vz = 0; }
    else G.tgts.forEach((t,k)=>{
      const bz = t.z - BB.bz;
      if(b.vz < 0 && b.z - BB.br < bz && pz - BB.br >= bz && Math.abs(b.x - t.x) < 1.05 && b.y > t.y - 0.4 && b.y < t.y + 1.5){
        b.z = bz + BB.br; b.vz = -b.vz*0.45; b.vx *= 0.8; G.clean = false; sfx.rim(); }
      const dx = t.x - b.x, dz = t.z - b.z, r = hyp(dx, dz);
      if(!G.res && b.vy < 0 && b.y > t.y && b.y < t.y + 1.6 && r < 1.15){ b.vx += dx*4.5*h; b.vz += dz*4.5*h; if(k===G.q.ok && r < 0.9) G.slowT = 0.35; }
      if(py >= t.y && b.y < t.y && b.vy < 0 && !ev){
        if(!G.res && r < BB.R - BB.br*0.5 + 0.2){ ev = {hit:k}; }
        else if(r < BB.R + BB.br + 0.18 && b.rim < 4){ const nx = (b.x - t.x)/(r||1), nz = (b.z - t.z)/(r||1);
          b.vx = nx*2 + b.vx*0.25; b.vz = nz*2 + b.vz*0.25; b.vy = Math.abs(b.vy)*0.45; b.y = t.y + 0.01; b.rim++; G.clean = false; sfx.rim(); }
      }
    });
    if(b.y < BB.br){ b.y = BB.br; b.vy = -b.vy*0.55; b.vx *= 0.7; b.vz *= 0.7; if(Math.abs(b.vy) < 1.2 && !ev && !G.res) ev = {miss:true}; }
    if(!ev && !G.res && (b.t > 4 || b.z < -16 || Math.abs(b.x) > 12)) ev = {miss:true};
    b.spin *= 0.995;
    return ev;
  },
  onHit(G, i, ok){
    const b = G.ball, t = G.tgts[i];
    if(i<0) return;
    if(ok){ b.thru = i; b.vy = Math.min(b.vy, -2); t.net = 1; }
    else { b.vy = 3.5; b.vx = rnd(-2, 2); b.vz = 2.4; b.y = t.y + 0.05; }  // terpantul keluar
  }
};
/* ---------- 🎳 Boling Bintang ---------- */
const BL = {z0:-4, rz:-18, half:3.5, br:0.32, vmin:7, vmax:15, gap:2.35};
const PIN0 = [[0,0],[-0.3,-0.42],[0.3,-0.42],[-0.6,-0.84],[0,-0.84],[0.6,-0.84]];
PH.boling = {
  layout(G){
    G.tgts = G.q.opts.map((it,i)=>({x:(i-(G.n-1)/2)*BL.gap, y:0, z:BL.rz, st:"stand", wt:0,
      pins:PIN0.map(([ox,oz])=>({ox, oz, x:0, y:0, z:0, vx:0, vy:0, vz:0, tilt:0, tv:0, ax:0, wob:0}))}));
    G.tgts.forEach(t=>t.pins.forEach(p=>{ p.x = t.x + p.ox; p.z = t.z + p.oz; }));
    this.reset(G);
  },
  reset(G){ G.ball = {x:G.aim.x||0, y:BL.br, z:BL.z0, vx:0, vy:0, vz:0, live:false, rot:0, gut:false, c:0, back:false}; G.clean = true; },
  aimAt(G, i){ G.aim.x = G.tgts[i].x; G.aim.pi = 0.72; if(!G.ball.live) G.ball.x = G.aim.x; },
  near(G, x){ let k = 0; G.tgts.forEach((t,i)=>{ if(Math.abs(t.x - x) < Math.abs(G.tgts[k].x - x)) k = i; }); return k; },
  nudge(G, d){ G.aim.x = clamp(G.aim.x + d*0.45, -2.5, 2.5); G.aim.tgt = this.near(G, G.aim.x); G.ball.x = G.aim.x; },
  shoot(G, p){ const b = G.ball; b.vz = -(BL.vmin + p*(BL.vmax - BL.vmin)); b.vx = 0; b.c = G.aim.c; b.live = true; G.clean = p >= 0.55 && p <= 0.9; sfx.roll(); },
  drag(G, k, dx, dy, W, Hh){
    if(k==="move"){ if(Math.abs(dx) > Math.abs(dy)){ G.aim.x = clamp((G.aim.x0 ?? G.aim.x) + dx/W*7, -2.5, 2.5); G.aim.tgt = this.near(G, G.aim.x); G.ball.x = G.aim.x; } return null; }
    G.aim.x0 = null;
    return dy < -40 && Math.abs(dy) > Math.abs(dx)*0.8 ? clamp(-dy/(Hh*0.4), 0.2, 1) : null;
  },
  auto(G, i){ G.aim.c = 0; this.aimAt(G, i); G.aim.tgt = i; return 0.72; },
  word: () => "🎳 STRIKE!",
  // jalur ramalan: lurus + lengkung
  preview(G){
    const out = [], v = BL.vmin + 0.72*(BL.vmax - BL.vmin); let x = G.aim.x, vx = 0;
    for(let z=BL.z0-1; z>BL.rz+1 && out.length<12; z-=1.4){ const h = 1.4/v; if(z < -7) vx += G.aim.c*2.6*h; x += vx*h; out.push({x, y:0.05, z}); }
    return out;
  },
  step(G, h){
    const b = G.ball;
    for(const t of G.tgts) this.pins(t, h);
    if(!b.live) return null;
    b.z += b.vz*h; b.rot += -b.vz*h/BL.br;
    if(!b.gut){
      if(b.z < -7 && !b.back) b.vx += b.c*2.6*h;
      if(b.z < -9 && !G.res && !b.back){ const k = this.near(G, b.x), dx = G.tgts[k].x - b.x; if(Math.abs(dx) < 1.5){ b.vx += dx*3.2*h; b.vx *= 1 - 1.2*h; } }
      b.x += b.vx*h;
      if(Math.abs(b.x) > BL.half){ b.gut = true; b.x = Math.sign(b.x)*(BL.half + 0.35); b.vx = 0; b.y = 0.15; }
    }
    if(!G.res && !b.gut && b.z <= BL.rz + 0.5 && !b.back){
      const k = this.near(G, b.x); if(Math.abs(G.tgts[k].x - b.x) < 1.15) return {hit:k};
    }
    if(!G.res && G.q && !b.gut && b.z < BL.rz + 5 && Math.abs(G.tgts[G.q.ok].x - b.x) < 0.9) G.slowT = 0.3;
    if(b.z < BL.rz - 3 || (b.back && b.z > -10)){ b.live = false; if(!G.res) return {miss:true}; }
    return null;
  },
  pins(t, h){
    if(t.st==="fall") for(const p of t.pins){
      p.vy -= 12*h; p.x += p.vx*h; p.y += p.vy*h; p.z += p.vz*h;
      if(p.y < 0){ p.y = 0; p.vy = -p.vy*0.3; p.vx *= 0.9; p.vz *= 0.9; }
      p.tilt = Math.min(Math.PI/2, p.tilt + p.tv*h);
    }
    else if(t.st==="wobble"){ t.wt += h; t.pins.forEach((p,i)=>{ p.wob = 0.3*Math.sin(t.wt*16 + i)*Math.exp(-2.5*t.wt); }); if(t.wt > 2){ t.st = "stand"; t.pins.forEach(p=>p.wob = 0); } }
  },
  onHit(G, i, ok){
    const b = G.ball, t = G.tgts[i];
    if(ok){ t.st = "fall"; sfx.pins();
      t.pins.forEach(p=>{ const dx = p.x - b.x, l = Math.abs(dx) + 0.3; p.vx = dx/l*rnd(1.5, 4.5) + b.vx*0.3; p.vz = -rnd(3, 7); p.vy = rnd(1.5, 4); p.tv = rnd(5, 11); p.ax = rnd(0, 6.28); });
      b.vz *= 0.6; }
    else { t.st = "wobble"; t.wt = 0; sfx.bump(); b.vz = 4.5; b.vx = rnd(-1, 1); b.back = true; }
  }
};

/* ---------- ⛳ Golf Mini Ajaib (padang rata: x kiri-kanan, z ke hadapan negatif) ---------- */
const GF = {hw:4.3, z0:1.2, z1:-10.6, br:0.12, cup:0.34, cap:5.2, A:2.2, k:0.25, vmin:2.5, vmax:11, sweet:0.6};
const GF_BUMP = [[-3.1,-3.2,0.42],[3.1,-3.2,0.42],[-1.2,-6.4,0.38],[1.2,-6.4,0.38]];
PH.golf = {
  layout(G){
    const zs = shuffle([-7.8, -8.3, -8.8]);
    G.tgts = G.q.opts.map((it,i)=>({x:(i-(G.n-1)/2)*2.7, y:0, z:zs[i%3], flag:0}));
    G.bumps = GF_BUMP.map(([x,z,r])=>({x, z, r, hit:0}));
    G.mill = {x:0, z:-4.6, r:0.55, amp:G.ri>=4 ? 2.2 : 1.6, sp:G.ri>=4 ? 1.1 : 0.8, ph:rnd(0,6)};
    G.gt = G.gt || 0; this.move(G);
    G.ball = null; this.reset(G, true);
  },
  millX(G, t){ return G.mill.amp*Math.sin(t*G.mill.sp + G.mill.ph); },
  move(G){ if(G.mill) G.mill.x = this.millX(G, G.gt||0); },
  // selepas pukulan tersasar, bola kekal di tempat ia berhenti (pukulan seterusnya dari situ)
  reset(G, full){
    const o = G.ball && !full ? G.ball : null;
    G.ball = {x:o ? o.x : 0, y:GF.br, z:o ? o.z : 0, vx:0, vy:0, vz:0, live:false, t:0, cup:-1, sink:0};
    if(!o) G.clean = true;
  },
  ideal(G, i){
    const b = G.ball, h = G.tgts[i], dx = h.x - b.x, dz = h.z - b.z, d = hyp(dx, dz);
    const stop = v => v/GF.k - GF.A/(GF.k*GF.k)*Math.log(1 + GF.k*v/GF.A);   // jarak berhenti (geseran tetap + linear)
    let lo = 0.5, hi = 20; for(let n=0;n<30;n++){ const m = (lo+hi)/2; if(stop(m) < d + 0.35) lo = m; else hi = m; }
    const v = lo;
    return {yaw:Math.atan2(dx, -dz), v, p:GF.sweet, d};
  },
  vel(G, p){ const s = this.ideal(G, G.aim.tgt), snap = Math.abs(p - s.p) < 0.08 ? s.p : p; return s.v*(1 + (snap - s.p)*0.62); },
  aimAt(G, i){ const s = this.ideal(G, i); G.aim.yaw = s.yaw; G.aim.pi = s.p; },
  near(G, yaw){ const b = G.ball; let k = 0, bd = 9; G.tgts.forEach((h,i)=>{ const d = Math.abs(Math.atan2(h.x - b.x, -(h.z - b.z)) - yaw); if(d < bd){ bd = d; k = i; } }); return k; },
  nudge(G, d){ G.aim.yaw = clamp(G.aim.yaw + d*0.05, -1.2, 1.2); G.aim.tgt = this.near(G, G.aim.yaw); },
  shoot(G, p){
    // bantuan bidikan: jika hampir tepat ke lubang terpilih, cari sudut kecil yang benar-benar masuk
    const s = this.ideal(G, G.aim.tgt);
    if(!G.simming && Math.abs(G.aim.yaw - s.yaw) < 0.1 && Math.abs(p - s.p) < 0.08){ const y0 = G.aim.yaw; let found = false;
      for(const off of [0, 0.03, -0.03, 0.06, -0.06]){ G.aim.yaw = s.yaw + off; if(this.sim(G, p).hit === G.aim.tgt){ found = true; break; } }

    const b = G.ball, v = this.vel(G, p), y = G.aim.yaw;

  },
  // seret ke belakang dari bola: arah = bertentangan, kuasa = panjang seretan
  drag(G, k, dx, dy, W, Hh){

    if(len > 24 && dy > 0){
      G.aim.yaw = clamp(Math.atan2(-dx, dy*1.2), -1.2, 1.2); G.aim.tgt = this.near(G, G.aim.yaw);

    }

  },
  // cari pukulan yang benar-benar masuk lubang i (simulasi deterministik); null = tunggu kincir lalu
  auto(G, i, force){
    G.aim.tgt = i; const s = this.ideal(G, i);
    const offs = [0, 0.03, -0.03, 0.07, -0.07, 0.12, -0.12];
    for(const pass of force ? [1, 0] : [1]) for(const off of offs){
      G.aim.yaw = s.yaw + off;
      const r = this.sim(G, s.p); if(r.hit === i && (r.clean || !pass)) return s.p;
    }
    G.aim.yaw = s.yaw;
    return force ? s.p : null;
  },
  sim(G, p){
    const keep = {ball:G.ball, gt:G.gt, clean:G.clean, mx:G.mill.x, bh:G.bumps.map(b=>b.hit)}, res = G.res, slow = G.slowT;
    G.ball = Object.assign({}, G.ball); G.simming = true; this.shoot(G, p); G.simming = false; G.res = null;
    let out = {hit:-1, clean:false}; G.clean = true;
    for(let n=0; n<900; n++){ const ev = this.step(G, H, true); if(ev){ out = {hit:ev.hit!=null ? ev.hit : -1, clean:G.clean}; break; } }
    Object.assign(G, {ball:keep.ball, gt:keep.gt, clean:keep.clean, res, slowT:slow}); G.mill.x = keep.mx; G.bumps.forEach((b,k)=>b.hit = keep.bh[k]);
    return out;
  },
  word: () => "⛳ HOLE IN ONE!",
  preview(G){
    const b = G.ball, p = G.aim.charging || G.aim.drag ? G.aim.p : G.aim.pi, v = this.vel(G, p), d = v*v/(2*GF.A)*0.85, out = [];
    for(let s=0.5; s<d && out.length<14; s+=0.7) out.push({x:b.x + Math.sin(G.aim.yaw)*s, y:0.08, z:b.z - Math.cos(G.aim.yaw)*s});
    return out;
  },
  step(G, h, sim){
    G.gt = (G.gt||0) + h; G.mill.x = this.millX(G, G.gt);
    const b = G.ball; if(!b.live) return null;
    if(b.cup>=0){ // jatuh ke dalam cawan
      const c = G.tgts[b.cup]; b.sink += h; b.x += (c.x - b.x)*Math.min(1, h*10); b.z += (c.z - b.z)*Math.min(1, h*10); b.y = Math.max(-0.3, GF.br - b.sink*1.2);
      return null;
    }
    b.t += h;
    let sp = hyp(b.vx, b.vz);
    if(sp > 0){ const ns = Math.max(0, sp - (GF.A + GF.k*sp)*h); b.vx *= ns/sp; b.vz *= ns/sp; sp = ns; }
    b.x += b.vx*h; b.z += b.vz*h;
    // dinding
    if(Math.abs(b.x) > GF.hw - GF.br){ b.x = Math.sign(b.x)*(GF.hw - GF.br); b.vx = -b.vx*0.8; G.clean = false; if(!sim) sfx.bump(); }
    if(b.z > GF.z0 - GF.br){ b.z = GF.z0 - GF.br; b.vz = -b.vz*0.8; G.clean = false; if(!sim) sfx.bump(); }
    if(b.z < GF.z1 + GF.br){ b.z = GF.z1 + GF.br; b.vz = -b.vz*0.8; G.clean = false; if(!sim) sfx.bump(); }
    // bumper bulat + kincir bergerak
    const obs = G.bumps.concat([G.mill]);
    for(const o of obs){
      const dx = b.x - o.x, dz = b.z - o.z, d = hyp(dx, dz), R = o.r + GF.br;
      if(d < R && d > 0){ const nx = dx/d, nz = dz/d, vn = b.vx*nx + b.vz*nz;
        b.x = o.x + nx*R; b.z = o.z + nz*R;
        if(vn < 0){ b.vx -= 1.85*vn*nx; b.vz -= 1.85*vn*nz; }
        G.clean = false; o.hit = 1; if(!sim) sfx.bump(); }
    }
    // lubang: tarikan magnet + tangkap jika cukup perlahan
    let ev = null;
    G.tgts.forEach((c,k)=>{
      if(ev) return;
      const dx = c.x - b.x, dz = c.z - b.z, d = hyp(dx, dz);
      if(d < 1.0 && !G.res){ const pull = (1.0 - d)*7*h; b.vx += dx/(d||1)*pull; b.vz += dz/(d||1)*pull; if(!sim && k===G.q.ok && d < 0.8 && sp < GF.cap) G.slowT = 0.3; }

        else if(sp >= GF.cap){ b.vx += (b.vz)*0.15; b.vz *= 0.85; } // terlalu laju: tersasar di bibir lubang
      }
    });
    if(ev) return ev;
    if(sp < 0.06 && b.t > 0.2){ b.vx = b.vz = 0; return {miss:true}; }
    return null;
  },
  onHit(G, i, ok){
    const b = G.ball, c = G.tgts[i];
    if(i<0) return;
    if(ok){ c.flag = 1; sfx.cup(); }
    else { b.cup = -1; b.live = true; b.vx = rnd(-1.5, 1.5); b.vz = 2.2; b.t = 0; b.x = c.x; b.z = c.z + 0.5; } // terlompat keluar
  }
};
// kamera bagi setiap sukan (dikongsi oleh paparan 3D & unjuran tap/rata)
const CAM = {
  bola:  {pos:[0, 2.2, 6.5], look:[0, 3.6, -8], fov:62},
  boling:{pos:[0, 4.2, 5], look:[0, -1.2, -12], fov:60},
  golf:  {pos:[0, 11, 6], look:[0, 0, -4.4], fov:56}
};
function proj(gid, x, y, z, W, Hh){
  const c = CAM[gid], [px,py,pz] = c.pos, [lx,ly,lz] = c.look;
  let fx = lx-px, fy = ly-py, fz = lz-pz; const fl = hyp(fx, fy, fz); fx/=fl; fy/=fl; fz/=fl;
  let rx = -fz, rz = fx; const rl = hyp(rx, rz); rx/=rl; rz/=rl;           // kanan = f × atas
  const ux = -rz*fy, uy = rz*fx - rx*fz, uz = rx*fy;                        // atas = kanan × f
  const dx = x-px, dy = y-py, dz = z-pz, cz = dx*fx + dy*fy + dz*fz;
  if(cz < 0.1) return null;
  const k = (Hh/2)/Math.tan(c.fov*Math.PI/360);
  return {x:W/2 + (dx*rx + dz*rz)/cz*k, y:Hh/2 - (dx*ux + dy*uy + dz*uz)/cz*k, s:k/cz};
}

function itemTex(it, accent){
  const k = itKind(it), txt = itText(it), em = itEmoji(it), key = `${lang}|${itKey(it)}|${accent}`;
  if(texCache.has(key)) return texCache.get(key);

  const fs = k==="h" ? 150 : k==="ar" ? 92 : ar ? 64 : 58;
  const font = `700 ${fs}px ${k!=="w" ? 'Amiri,"Noto Naskh Arabic",serif' : ar ? '"Noto Naskh Arabic",Amiri,serif' : '"Baloo 2","Trebuchet MS",sans-serif'}`;
  const c = document.createElement("canvas"), x = c.getContext("2d"); x.font = font;
  const maxW = 420, lines = []; let cur = "";
  for(const w of String(txt).split(" ")){ const t = cur ? cur+" "+w : w; if(x.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const lh = fs*(ar ? 1.45 : 1.15), emH = em ? 120 : 0, tw = Math.max(260, ...lines.map(l=>x.measureText(l).width));
  c.width = Math.ceil(tw + 60); c.height = Math.ceil(emH + lh*lines.length + 36);
  const W_ = c.width, H_ = c.height, r = 40;
  x.beginPath(); x.moveTo(r,0); x.arcTo(W_,0,W_,H_,r); x.arcTo(W_,H_,0,H_,r); x.arcTo(0,H_,0,0,r); x.arcTo(0,0,W_,0,r); x.closePath();
  x.fillStyle = "#FFFFFF"; x.fill(); x.lineWidth = 14; x.strokeStyle = accent || "#FFC22E"; x.stroke();
  x.textAlign = "center"; x.textBaseline = "middle";
  if(em){ x.font = '100px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif'; x.fillText(em, W_/2, 18+emH/2); }

  lines.forEach((l,i)=>x.fillText(l, W_/2, 18 + emH + lh*(i+0.5) + fs*0.05));

function addFx(t, step, end){ G.fxs.push({t:0, max:t, step, end}); }
function stepFx(dt){ G.fxs = G.fxs.filter(f=>{ f.t += dt; const k = Math.min(1, f.t/f.max); f.step(k, dt); if(k>=1){ if(f.end) f.end(); return false; } return true; }); }
function burst(pos, color, n=12, sp=4){
  const g = SPH(0.14, 6, 4), m = GLOW(color, .6);

    const v = new THREE.Vector3(rnd(-sp,sp), rnd(1,sp+1), rnd(-sp,sp)*0.6);
    addFx(0.7, (k, dt)=>{ v.y -= 9*dt; s.position.addScaledVector(v, dt); s.scale.setScalar(Math.max(0.01, 1-k)); }, ()=>G.scene.remove(s));

  "bad-class":tx("Nama kelas terlalu pendek.","نام کلس ترلالو ڤندق."), "class-limit":tx("Had 10 kelas telah dicapai.","حد 10 کلس تله دچاڤاي.")}[e.code]
  || {401:tx("Sila log masuk semula.","سيلا لوڬ ماسوق سمولا."), 403:tx("Kamu bukan ahli kelas ini.","کامو بوکن اهلي کلس اين."),
  404:tx("Kod kelas tidak dijumpai.","کود کلس تيدق دجومڤاٴي."), 409:tx("Pilih nama samaran dahulu.","ڤيليه نام سامرن دهولو."),
  429:tx("Terlalu pantas, cuba sebentar lagi.","ترلالو ڤنتس، چوبا سبنتر لاڬي.")}[e.status]
  || (e.status===400 && !isJ() ? e.message : tx("Tidak dapat disambung ke pelayan. Semak internet.","تيدق داڤت دسمبوڠ ک ڤلاين. سمق اينترنيت.")));
const medal = r => r===1 ? "🥇" : r===2 ? "🥈" : r===3 ? "🥉" : "#"+r;

// butang akaun di bar atas
function acctBtn(){
  if(!LB.on) return "";
  const n = LB.name();
  return `<button class="acct" id="acct" data-act="${LB.uid?"acct":"login"}">👤 ${LB.uid ? esc(n || tx("Akaun","اکاٴون")) : tx("Log masuk","لوڬ ماسوق")}</button>`;
}
function lbSection(){
  if(!LB.on) return "";
  return `<div class="sec" id="lbsec">🏆 ${tx("Papan Pendahulu","ڤاڤن ڤندهولو")} — ${tx(WORLD[subj||"mix"].r, WORLD[subj||"mix"].j)}</div><div class="lb card" id="lbbox">${lbSkel()}</div>`;
}
async function lbPaint(){
  if(!LB.on || !$("lbbox")) return;
  await LB.init();
  const box = $("lbbox"); if(!box) return;
  const a = $("acct"); if(a) a.outerHTML = acctBtn();
  if(LB.failed){ box.innerHTML = `<p class="lbmsg">⚠️ ${tx("Papan pendahulu tidak dapat dimuatkan. Semak sambungan internet.","ڤاڤن ڤندهولو تيدق داڤت دمواتکن. سمق سمبوڠن اينترنيت.")}</p>`; return; }
  const games = [{id:"all", icon:"👑", r:"Juara Subjek", j:"جوارا سوبجيک"}, ...GAMES.map(g=>({id:g.id, icon:g.e, r:g.r, j:g.j}))];
  if(!games.some(g=>g.id===LB.game)) LB.game = "all";
  const classes = (LB.me && LB.me.classes) || [];
  if(LB.scope!=="all" && !classes.some(c=>c.code===LB.scope)) LB.scope = "all";
  box.innerHTML = `
    <div class="lbtabs" role="group">${[{code:"all", name:tx("🌏 Semua murid","🌏 سموا موريد")}, ...classes.map(c=>({code:c.code, name:"🏫 <span dir=\"auto\">"+esc(c.name)+"</span>"}))].map(c=>
      `<button data-act="lbscope" data-c="${c.code}" aria-pressed="${c.code===LB.scope}">${c.name}</button>`).join("")}</div>
    <div class="lbtabs games" role="group">${games.map(g=>`<button data-act="lbgame" data-g="${g.id}" aria-pressed="${g.id===LB.game}">${g.icon} ${tx(g.r,g.j)}</button>`).join("")}</div>
    <div class="podium" id="podium" dir="ltr"></div>
    <ol class="lbrows" id="lbrows">${lbSkelRows()}</ol>
    <div class="lbfoot" id="lbfoot"></div>`;
  const q = `leaderboard?subj=${subj}&game=${LB.game}${LB.game==="all"?"&y=2":""}${LB.scope!=="all"?"&class="+LB.scope:""}`;
  try{
    const d = await LB.api(q);
    const rows = $("lbrows"), foot = $("lbfoot"); if(!rows) return;
    const pod = $("podium"), top = d.rows.slice(0,3);
    if(pod) pod.innerHTML = top.length ? [top[1], top[0], top[2]].map((r,i)=>r ? `<div class="pd p${r.rank<=3?r.rank:3} ${r.me?"me":""}"><span class="md">${medal(r.rank)}</span>
      <b class="nm" dir="auto">${esc(r.name)}</b><span class="sc">${r.best}</span><span class="step">${r.rank}</span></div>` : `<div class="pd empty"></div>`).join("") : "";
    rows.innerHTML = d.rows.length ? d.rows.slice(top.length).map(r=>`<li class="${r.me?"me":""} ${r.rank<=3?"top":""}"><span class="rk">${medal(r.rank)}</span><span class="nm" dir="auto">${esc(r.name)}${r.me?` <small>(${tx("kamu","کامو")})</small>`:""}</span><b>${r.best}</b></li>`).join("")
      : `<li class="lbmsg">🌱 ${tx("Belum ada skor. Jadilah yang pertama!","بلوم اد سکور. جاديله يڠ ڤرتام!")}</li>`;
    if(d.rows.length && d.rows.length<=3) rows.innerHTML = "";
    foot.innerHTML = !LB.uid
      ? `<p>${tx("Log masuk dengan Google untuk bersaing dengan murid lain!","لوڬ ماسوق دڠن Google اونتوق برساٴيڠ دڠن موريد لاٴين!")}</p><button class="btn" data-act="login">👤 ${tx("Log masuk","لوڬ ماسوق")}</button>`
      : d.me ? `<p>⭐ ${tx("Kedudukan kamu","کدودوقن کامو")}: <b>${medal(d.me.rank)}</b> ${tx("daripada","درڤد")} ${d.total} ${tx("murid","موريد")}</p>`
      : `<p>🎯 ${tx("Habiskan satu permainan untuk masuk senarai ini!","هابيسکن ساتو ڤرماٴينن اونتوق ماسوق سناراي اين!")}</p>`;
    foot.insertAdjacentHTML("beforeend", `<small>${tx("Senarai menunjukkan skor terbaik setiap murid.","سناراي منونجوقکن سکور تربايق ستياڤ موريد.")}</small>`);
  }catch(e){ const rows = $("lbrows"); if(rows) rows.innerHTML = `<li class="lbmsg">⚠️ ${lbErr(e)}</li>`; }
}
// panel akaun: nama samaran, kelas (sertai / cipta untuk guru), log keluar

function acctSheet(first){
  document.querySelectorAll(".sheet").forEach(s=>s.remove());
  const me = LB.me || {}, cl = me.classes || [];
  const s = document.createElement("div"); s.className = "sheet"; s.setAttribute("role","dialog"); s.setAttribute("aria-modal","true");
  s.innerHTML = `<div class="card">
    <button class="iconbtn x" data-act="sheetclose" aria-label="${tx("Tutup","توتوڤ")}">✕</button>
    <h2>${first ? "👋 "+tx("Selamat datang!","سلامت داتڠ!") : "👤 "+tx("Akaun saya","اکاٴون ساي")}</h2>
    <label for="lbname">${tx("Nama samaran (bukan nama sebenar)","نام سامرن (بوکن نام سبنر)")}</label>
    <div class="row"><input id="lbname" maxlength="16" autocomplete="off" ${me.player&&me.player.locked?"disabled":""} value="${esc(LB.name()||"")}" placeholder="${tx("cth. Ali Bintang","چونتوه: علي بينتڠ")}">${me.player&&me.player.locked?"":`<button class="btn sm" data-act="lbname">💾 ${tx("Simpan","سيمڤن")}</button>`}</div>${me.player&&me.player.locked?`<small class="muted">🔒 ${tx("Nama ini ditetapkan oleh guru.","نام اين دتتڤکن اوليه ڬورو.")}</small>`:""}
    ${me.player ? `
    <h3>🏫 ${tx("Kelas saya","کلس ساي")}</h3>
    ${cl.length ? `<ul class="cls">${cl.map(c=>`<li><span><b dir="auto">${esc(c.name)}</b>${c.owner?` <small>• ${tx("Kod","کود")}: <code>${c.code}</code> • ${c.size} ${tx("ahli","اهلي")}</small>`:` <small>• ${c.size} ${tx("ahli","اهلي")}</small>`}</span><button class="btn alt sm" data-act="lbleave" data-c="${c.code}">${c.owner?tx("Padam","ڤادم"):tx("Keluar","کلوار")}</button>${c.owner?`<a class="btn sm dash" href="../../guru/?k=${c.code}">📊 ${tx("Papan pemuka","ڤاڤن ڤموک")}</a>`:""}</li>`).join("")}</ul>`
      : `<p class="muted">${tx("Belum menyertai kelas. Minta kod kelas daripada guru.","بلوم مڽرتاٴي کلس. مينتا کود کلس درڤد ڬورو.")}</p>`}
    <label for="lbcode">${tx("Sertai kelas dengan kod","سرتاٴي کلس دڠن کود")}</label>
    <div class="row"><input id="lbcode" maxlength="6" autocomplete="off" placeholder="ABC234" style="text-transform:uppercase" dir="ltr"><button class="btn sm" data-act="lbjoin">➕ ${tx("Sertai","سرتاٴي")}</button></div>
    <details><summary>👩‍🏫 ${tx("Untuk guru / ibu bapa: cipta kelas","اونتوق ڬورو / ايبو باڤ: چيڤتا کلس")}</summary>
      <div class="row"><input id="lbcname" maxlength="30" placeholder="${tx("cth. 3 Bestari","چونتوه: 3 بستاري")}"><button class="btn sm" data-act="lbcreate">🏫 ${tx("Cipta","چيڤتا")}</button></div>
      <small class="muted">${tx("Kongsi kod dengan murid atau anak supaya mereka boleh menyertai papan kelas. Ibu bapa boleh mencipta kumpulan keluarga.","کوڠسي کود دڠن موريد اتاو انق سوڤايا مريک بوليه مڽرتاٴي ڤاڤن کلس. ايبو باڤ بوليه منچيڤتا کومڤولن کلوارڬ.")}</small></details>` : ""}
    <p class="err" id="lberr" role="alert"></p>
    <button class="btn alt" data-act="logout">🚪 ${tx("Log keluar","لوڬ کلوار")}</button></div>`;
  app.appendChild(s);
  const i = $("lbname"); if(i && first) i.focus();
}
// kerangka berkilau semasa papan pendahulu dimuatkan
const lbSkelRows = () => [...Array(5)].map((_,i)=>`<li aria-hidden="true"><span class="kskel" style="width:30px"></span><span class="kskel" style="width:${70-i*8}%"></span><span class="kskel" style="width:46px"></span></li>`).join("");
const lbSkel = () => `<div class="lbtabs" aria-hidden="true"><span class="kskel" style="width:120px;height:36px;border-radius:999px"></span><span class="kskel" style="width:110px;height:36px;border-radius:999px"></span></div>
  <div class="podium" aria-hidden="true">${[70,96,52].map(h=>`<div class="pd"><span class="kskel" style="width:42px;height:42px;border-radius:50%"></span><span class="kskel" style="width:70%;margin-top:6px"></span><span class="step kskel" style="height:${h}px"></span></div>`).join("")}</div>
  <ol class="lbrows" role="status" aria-label="${tx("Memuatkan","ممواتکن")}">${lbSkelRows()}</ol>`;
async function lbAct(act, b){
  const err = $("lberr"); if(err) err.textContent = "";
  if(b.disabled) return;
  KafaAuth.busy(b, true, {lbname:tx("Menyimpan","مڽيمڤن"), lbjoin:tx("Menyertai","مڽرتاٴي"), lbcreate:tx("Mencipta","منچيڤتا"), lbleave:tx("Memproses","ممڤروسيس")}[act]);
  try{
    if(act==="lbname") LB.me = await LB.api("me", {name:$("lbname").value});
    if(act==="lbjoin") LB.me = await LB.api("class", {action:"join", code:$("lbcode").value});
    if(act==="lbcreate") LB.me = await LB.api("class", {action:"create", name:$("lbcname").value});
    if(act==="lbleave") LB.me = await LB.api("class", {action:"leave", code:b.dataset.c});
    if(act==="lbname" && LB.pending && $("lbres")){ document.querySelectorAll(".sheet").forEach(s=>s.remove()); return lbSubmit(LB.pending); }
    if($("lbbox")) openWorld(subj);
    acctSheet(false);
    if(act==="lbcreate") toast("🏫 "+tx("Kelas dicipta! Kongsi kod dengan murid.","کلس دچيڤتا! کوڠسي کود دڠن موريد."));
  }catch(e){ const er = $("lberr"); if(er) er.textContent = "⚠️ "+lbErr(e); }
  finally{ if(b.isConnected) KafaAuth.busy(b, false); }
}
// hantar skor selepas permainan (Main Sendiri)
async function lbSubmit(r){
  const box = $("lbres"); if(!box) return;
  await LB.init();
  if(!LB.clerk){ box.remove(); return; }
  if(!LB.uid){ LB.pending = r; box.innerHTML = `<p>🏆 ${tx("Log masuk untuk menyimpan skor ini dalam papan pendahulu!","لوڬ ماسوق اونتوق مڽيمڤن سکور اين دالم ڤاڤن ڤندهولو!")}</p><button class="btn" data-act="login">👤 ${tx("Log masuk dengan Google","لوڬ ماسوق دڠن Google")}</button>`; return; }
  if(!LB.name()){ LB.pending = r; box.innerHTML = `<p>🏆 ${tx("Pilih nama samaran untuk masuk papan pendahulu.","ڤيليه نام سامرن اونتوق ماسوق ڤاڤن ڤندهولو.")}</p><button class="btn" data-act="acct">✏️ ${tx("Pilih nama","ڤيليه نام")}</button>`; return; }
  box.innerHTML = `<p><span class="kspin" aria-hidden="true"></span>${tx("Menyimpan skor…","مڽيمڤن سکور…")}</p>`;
  try{
    const o = await LB.api("score", r); LB.pending = null;
    if(!$("lbres")) return;
    $("lbres").innerHTML = `<p class="rank">🌏 ${tx("Kedudukan","کدودوقن")} <b>${medal(o.rank)}</b> ${tx("dalam semua murid","دالم سموا موريد")}</p>
      <p>${o.improved ? "🎉 "+tx("Skor terbaik kamu disimpan!","سکور تربايق کامو دسيمڤن!") : "🏆 "+tx("Skor terbaik kamu","سکور تربايق کامو")+": "+o.best}</p>
      <button class="btn alt" data-act="lbview" data-g="${r.game}">🏆 ${tx("Lihat papan pendahulu","ليهت ڤاڤن ڤندهولو")}</button>`;
  }catch(e){ const x = $("lbres"); if(x) x.innerHTML = `<p>⚠️ ${lbErr(e)}</p>`; }
}


/* ============ PERISTIWA ============ */
function redraw(){
  if(screen==="map") renderMap();
  else if(screen==="world") openWorld(subj);
  else if(screen==="intro") openGame(gameId);
  else if(screen==="result" && G) UI.result(false);
  else if(screen==="play" && G){ UI.prompt(false); UI.hud(true); if(G.res && G.phase==="show" && !G.res.ok) UI.hint(G.q.opts[G.q.ok]); }
}
const live = () => G && !G.over && !G.paused;
function setLang(l){ lang = l; save("kafa-lang", lang); applyLang(); texCache.clear(); redraw(); }
function handle(b, ev){
  const a = b.dataset.act;
  switch(a){
    case "lang": setLang(isJ() ? "rumi" : "jawi"); break;
    case "mute": muted = !muted; save("ark2-muted", muted); b.textContent = muted ? "🔇" : "🔊"; break;
    case "voice": voiceOn = !voiceOn; save("t2-voice", voiceOn); if(!voiceOn) hush(); b.textContent = voiceOn ? "🗣️" : "🤐"; b.setAttribute("aria-pressed", voiceOn); break;
    case "home": renderMap(); break;
    case "world": openWorld(b.dataset.s || subj); break;
    case "game": openGame(b.dataset.g); break;
    case "start": case "again": start(); break;
    case "pause": togglePause(); break;
    case "resume": togglePause(false); break;
    case "say": if(G && G.q) speak(G.q.p[0], true); if(G && G.q && itKind(G.q.opts[G.q.ok])==="h" && G.res) sayHuruf(G.q.opts[G.q.ok].huruf); break;
    case "left": if(live()) G.nudge(-1); break;
    case "right": if(live()) G.nudge(1); break;
    case "sel": if(live()) G.select(+b.dataset.i); break;
    // butang kuasa: tekan = mula cas, lepas = tembak; klik papan kekunci = tembakan kuasa sasaran
    case "pw": if(!live()) break;
      if(ev==="down") G.charge(true); else if(ev==="click" && !G.aim.charging) G.shoot(G.aim.pi); break;
    case "login": if(!LB.clerk) KafaAuth.loading(true, tx("Membuka log masuk","ممبوک لوڬ ماسوق"), WORLD[subj||"mix"].m);
      LB.init().then(()=>{ KafaAuth.loading(false); if(LB.clerk) LB.clerk.openSignIn({}); else toast("⚠️ "+tx("Log masuk tidak dapat dimuatkan.","لوڬ ماسوق تيدق داڤت دمواتکن.")); }); break;
    case "acct": acctSheet(!LB.name()); break;
    case "sheetclose": document.querySelectorAll(".sheet").forEach(s=>s.remove()); break;
    case "logout": document.querySelectorAll(".sheet").forEach(s=>s.remove()); KafaAuth.signOut(tx("Log keluar","لوڬ کلوار"), WORLD[subj||"mix"].m); break;
    case "lbscope": LB.scope = b.dataset.c; save("ark2-lbscope", LB.scope); lbPaint(); break;
    case "lbgame": LB.game = b.dataset.g; save("ark2-lbgame", LB.game); lbPaint(); break;
    case "lbview": LB.game = b.dataset.g; LB.scope = "all"; openWorld(subj); { const s = $("lbsec"); if(s && s.scrollIntoView) s.scrollIntoView({behavior:"smooth"}); } break;
    case "lbname": case "lbjoin": case "lbcreate": case "lbleave": lbAct(a, b); break;
  }
}
const FAST = ["left","right","sel","pw","pause"];
// kawalan pantas: pointerdown terus (tiada lengah klik); butang lain: klik biasa
app.addEventListener("pointerdown", e=>{ const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(FAST.includes(b.dataset.act)){ e.preventDefault(); b.dataset.pd = "1"; handle(b, "down"); } });
app.addEventListener("click", e=>{ const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(FAST.includes(b.dataset.act) && b.dataset.pd){ delete b.dataset.pd; return; }
  handle(b, "click"); });
const release = ()=>{ if(G && G.aim && G.aim.charging) G.charge(false); };
document.addEventListener("pointerup", release); document.addEventListener("pointercancel", release);
let spaceDown = false;
document.addEventListener("keydown", e=>{
  if(e.target.matches && e.target.matches("input:not([type=range])")){ if(e.key==="Enter" && e.target.matches(".sheet input")){ const b = e.target.parentElement.querySelector("button"); if(b) b.click(); } return; }
  if(!G || screen!=="play") return;
  const k = e.key;
  if(k==="p" || k==="P" || k==="Escape"){ togglePause(); e.preventDefault(); return; }
  if(!live()) return;
  if(k==="ArrowLeft" || k==="a" || k==="A"){ G.nudge(-1); e.preventDefault(); }
  else if(k==="ArrowRight" || k==="d" || k==="D"){ G.nudge(1); e.preventDefault(); }
  else if(k===" " || k==="Enter"){ e.preventDefault(); if(!spaceDown){ spaceDown = true; G.charge(true); } }
  else if(k>="1" && k<=String(G.n)) G.select(+k-1);
});
document.addEventListener("keyup", e=>{ if((e.key===" " || e.key==="Enter") && spaceDown){ spaceDown = false; release(); } });
document.addEventListener("kafa-access", ()=>{ if(screen==="world") openWorld(subj); });
window.addEventListener("popstate", ()=>{ if(screen!=="map") renderMap(); });

applyLang();
// ?shot=<subj>,<game>[,rumi|jawi]: buka terus, mula dan main sendiri (autopilot, kebanyakannya betul)
const SHOT = (()=>{ try{ return new URLSearchParams(location.search).get("shot"); }catch(e){ return null; } })();
function shot(spec){
  const [s, g, l] = String(spec).split(",");
  if(l==="rumi" || l==="jawi"){ lang = l; applyLang(); }
  openWorld(WORLD[s] ? s : "mix"); openGame(GM(g) ? g : "bola");
  return start().then(()=>{ if(G) G.auto = true; return G; });
}
window.shot = shot;
(()=>{ if(SHOT){ shot(SHOT); return; } const h = location.hash.replace("#",""); if(WORLD[h]) openWorld(h); else if(h==="papan" && subj) openWorld(subj); else renderMap(); })();

</script>
