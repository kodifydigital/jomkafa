<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Orkestra Tajwid • Tajwid Tahun 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tajwid Tahun 5: "Orkestra Tajwid" — dewan konsert baldu merah, not muzik emas, Maestro Momo si panda konduktor ===== */
:root{
  --vel1:#3A0A1E; --vel2:#7A1638; --bg:#FFF6E6; --card:#FFFDF8; --ink:#2A0F1A; --muted:#6E4A57; --line:#2A0F1A;
  --gold:#F2B630; --gold2:#C98A12; --cream:#FFF1D6; --teal:#138A8A; --plum:#5B2A86; --rose:#E0457B;
  --ok:#17804F; --okbg:#DDF5E6; --bad:#C62E4A; --badbg:#FFE0E6; --note:#FFF0C2; --tipbg:#F6E7FF; --tipink:#43206B;
  --staff:#C9A86A;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --vel1:#14030A; --vel2:#3A0A1E; --bg:#1A0C12; --card:#2A1520; --ink:#FFF0E6; --muted:#D9B9C4; --line:#0B0206;
    --cream:#3A2216; --okbg:#123A26; --badbg:#4A1622; --note:#3E3214; --tipbg:#2E1A48; --tipink:#EBDDFF; --staff:#8A6E3A;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:700;
  background:
    radial-gradient(ellipse 60% 120px at 50% 0,rgba(242,182,48,.35),transparent 70%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 6px,transparent 6px 34px),
    linear-gradient(180deg,var(--vel1) 0,var(--vel2) 280px,var(--bg) 720px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Nunito",serif;line-height:1.75}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:700;line-height:1.9}
.wrap{max-width:640px;margin:0 auto;padding:10px 14px 120px;position:relative}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:"Shrikhand","Nunito",cursive;font-weight:400;letter-spacing:.3px;margin:0}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700}
/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:16px;border:3px solid var(--line);background:var(--gold);color:#2A0F1A;
  display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;text-decoration:none;box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;color:var(--ink)}
/* hero */
.hero{display:flex;gap:12px;align-items:center;color:#FFF3DA;margin:4px 0 12px}
.hero .momo{width:104px;height:122px;flex:0 0 auto}
.hero h1{font-size:34px;line-height:1.1;color:var(--gold);text-shadow:0 3px 0 #2A0F1A}
html[dir="rtl"] .hero h1{font-size:30px}
.hero p{margin:4px 0 0;font-size:16px}
.sttl{color:#FFF3DA;margin:6px 0 4px;font-weight:900}
.stickers{display:flex;flex-wrap:wrap;gap:6px;background:rgba(0,0,0,.25);border:2px dashed var(--gold);border-radius:18px;padding:8px;margin-bottom:14px}
.stickers span{font-size:26px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.15);filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;background:var(--gold)}
/* peta: helaian skor muzik dalam dewan */
.hall{position:relative;background:var(--card);border:4px solid var(--line);border-radius:28px;padding:10px 10px 16px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.hall::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:repeating-linear-gradient(180deg,transparent 0 22px,var(--staff) 22px 24px,transparent 24px 30px,var(--staff) 30px 32px,transparent 32px 38px,var(--staff) 38px 40px,transparent 40px 46px,var(--staff) 46px 48px,transparent 48px 54px,var(--staff) 54px 56px,transparent 56px 96px)}
.stage{position:relative;text-align:center;padding:8px 6px 6px;margin:-10px -10px 10px;border-bottom:4px solid var(--line);
  background:radial-gradient(ellipse at 50% 0,rgba(242,182,48,.55),transparent 65%),linear-gradient(90deg,#8E1B43 0 14%,#5A0F2C 14% 16%,transparent 16% 84%,#5A0F2C 84% 86%,#8E1B43 86%),linear-gradient(#3A0A1E,#5A0F2C)}
.row{display:flex;position:relative;margin:6px 0}
.row.l{justify-content:flex-start;padding-inline-start:4%}
.row.r{justify-content:flex-end;padding-inline-end:4%}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px;max-width:62%;min-width:140px}
.nh{position:relative;width:86px;height:70px}
.nh svg{width:86px;height:70px;display:block}
.nh .num{position:absolute;left:12px;top:30px;width:34px;text-align:center;font:900 18px "Nunito",sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.nh .tic{position:absolute;right:-2px;top:-4px;font-size:26px}
.node .nm{background:var(--cream);border:3px solid var(--line);border-radius:14px;padding:3px 10px;font-weight:900;font-size:15px;line-height:1.25;text-align:center;position:relative;z-index:2}
.node .st{font-size:14px;min-height:18px}
.node .st .off{filter:grayscale(1);opacity:.3}
.node.lock .nh{filter:grayscale(1);opacity:.55}
.node.lock .nm{opacity:.7}
.node.lock .nm::after{content:" 🔒"}
.node.now .nh{animation:bob 1.3s ease-in-out infinite}
.guide{position:absolute;top:-4px;inset-inline-start:96px;width:58px;z-index:3;pointer-events:none}
.row.r .guide{inset-inline-start:auto;inset-inline-end:96px}
.final .guide{inset-inline-start:auto;inset-inline-end:-62px;top:0}
.guide .momo{width:58px;height:68px}
@keyframes bob{50%{transform:translateY(-6px)}}
.node.final{max-width:100%;margin:0 auto}
.final .core{font-size:46px;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.final .nm{background:var(--gold);font-size:17px}
.final.lock .core{filter:grayscale(1);opacity:.5}
.door{text-align:center;margin-top:10px;font-weight:900;color:var(--muted)}
/* kad baca */
.shead{display:flex;gap:10px;align-items:center;color:#FFF3DA;margin:0 0 12px}
.badge{width:56px;height:56px;border-radius:50%;background:var(--c);border:3px solid var(--line);display:grid;place-items:center;font-size:30px;flex:0 0 auto;box-shadow:0 3px 0 var(--line)}
.shead h2{font-size:22px;line-height:1.15;color:var(--gold)}
.shead small{display:block;font-size:14px;opacity:.9}
.card{background:var(--card);border:4px solid var(--line);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line);position:relative;margin-bottom:14px}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:8px;border-radius:0 0 8px 8px;background:var(--sc,var(--gold))}
.rpic{font-size:44px;text-align:center}
.rh{font-size:22px;display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--vel2)}
@media (prefers-color-scheme: dark){ .rh{color:var(--gold)} }
.rtext{margin:10px 0}
.rlist{margin:6px 0 10px;padding-inline-start:22px}
.rlist li{margin:4px 0}
.rlist li::marker{content:"♪ ";color:var(--rose)}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px;justify-content:center}
.exs .ar{background:var(--cream);border:2px solid var(--staff);border-radius:14px;padding:2px 12px;font-size:28px}
.tip{display:flex;gap:8px;background:var(--tipbg);color:var(--tipink);border-radius:16px;padding:10px 12px;margin:10px 0;font-size:16px}
.tip.am{background:var(--okbg);color:var(--ink)}
.ref{font-size:14px;color:var(--muted);margin:8px 0}
.navr{display:flex;gap:10px}
.btn{flex:1;min-height:54px;border-radius:18px;border:3px solid var(--line);background:var(--gold);color:#2A0F1A;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--line);padding:6px 12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--teal);color:#fff;width:100%}
.btn.alt{background:var(--cream);color:var(--ink)}
.btn[disabled]{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--staff)}
.dots i.on{background:var(--rose);width:24px;border-radius:6px}
.say{border:2px solid var(--line);background:var(--cream);border-radius:12px;min-width:44px;height:44px;font-size:20px;flex:0 0 auto}
</style>
<style>
/* bar kemajuan: baris not */
.prog{position:relative;height:30px;border:3px solid var(--line);border-radius:999px;background:var(--cream);margin:0 0 12px;overflow:hidden}
.prog .fill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,var(--gold2) 18px 22px);transition:width .4s}
html[dir="rtl"] .prog .fill{inset:0 0 0 auto}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-family:"Nunito",sans-serif}
.q{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q p{margin:0 0 8px;font-size:19px;font-weight:900}
.qar{text-align:center;font-size:34px;background:var(--cream);border:2px dashed var(--staff);border-radius:16px;padding:4px 10px;margin:4px 0 10px}
.hint{margin-top:10px;background:var(--badbg);border-radius:14px;padding:8px 12px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{min-height:56px;border:3px solid var(--line);border-radius:16px;background:var(--card);font-weight:900;font-size:17px;padding:6px 8px;min-width:0;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--line)}
.opt .ar{font-size:26px}
.opt.right,.right{background:var(--okbg)!important;border-color:var(--ok)!important}
.opt.wrong,.wrong{background:var(--badbg)!important;border-color:var(--bad)!important;opacity:.75}
.lab{font-size:15px;color:var(--muted);text-align:center;margin:2px 0 6px}
/* gendang: ketuk gendang N kali */
.gd{display:flex;flex-direction:column;align-items:center;gap:8px}
.gd .hk{background:var(--tipbg);color:var(--tipink);border-radius:12px;padding:4px 12px;font-weight:900;text-align:center}
.drum{width:150px;height:130px;border:0;background:none;padding:0;touch-action:manipulation}
.drum svg{width:150px;height:130px}
.drum.hit svg{animation:hit .18s}
@keyframes hit{50%{transform:scale(.93)}}
.beats{display:flex;gap:6px;min-height:34px;font-size:26px}
.beats span{animation:pop .25s}
.gdb{display:flex;gap:10px;width:100%}
.rounds{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.rounds i{width:28px;height:8px;border-radius:4px;background:var(--staff)}
.rounds i.ok{background:var(--ok)}
.rounds i.on{background:var(--rose)}
/* notasi: susun not ke baris paranada */
.notes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.nt{border:3px solid var(--line);border-radius:999px;background:var(--card);padding:2px 14px;min-height:50px;font-size:24px;box-shadow:0 3px 0 var(--line);max-width:100%;overflow-wrap:anywhere}
.nt.txt{font-size:16px;font-weight:900}
.nt.sel{background:var(--gold);transform:translateY(-3px)}
.nt.gone{visibility:hidden;position:absolute}
.staves{display:grid;gap:8px}
.stv{border:3px solid var(--line);border-radius:16px;padding:6px 8px;min-height:62px;text-align:start;background:repeating-linear-gradient(180deg,var(--card) 0 9px,var(--staff) 9px 10px);width:100%}
.stv b{display:inline-block;background:var(--cream);border-radius:8px;padding:0 8px;font-size:16px}
.stv .in{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stv .in span{background:var(--okbg);border-radius:10px;padding:0 8px;font-size:20px}
.stv .in span.txt{font-size:13px}
/* kompang: pilih semua */
.kps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kps.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kp{aspect-ratio:1/1;border-radius:50%;border:5px solid #7A4A1E;background:radial-gradient(circle,#FFF4D8 0 55%,#E9C98A 56% 64%,#C98A12 65%);color:#2A0F1A;font-weight:900;font-size:15px;padding:6px;min-width:0;overflow-wrap:anywhere;box-shadow:0 4px 0 var(--line);display:grid;place-items:center;line-height:1.15}
.kp .ar{font-size:24px;line-height:1.4}
.kp.big .ar{font-size:34px}
.kp.on{border-color:var(--rose);background:radial-gradient(circle,#FFD6E5 0 55%,#F59BBE 56% 64%,var(--rose) 65%);transform:scale(.96)}
.kp.ok{border-color:var(--ok)}
.kp.bad{border-color:var(--bad);animation:shake .4s}
/* irama: susun melodi */
.ladder{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.lad{display:flex;align-items:center;gap:8px;border:2px dashed var(--staff);border-radius:14px;min-height:46px;padding:4px 10px}
.lad i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.lad.fill{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pn{border:3px solid var(--line);border-radius:14px;background:var(--cream);padding:6px 12px;font-weight:900;font-size:16px;min-height:48px;box-shadow:0 3px 0 var(--line);min-width:0;overflow-wrap:anywhere}
.pn.gone{display:none}
/* akord: kekunci piano berpasangan */
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kcol{display:flex;flex-direction:column;gap:8px}
.key{min-height:58px;border:3px solid var(--line);border-radius:0 0 14px 14px;background:#FFFFFF;color:#2A0F1A;font-weight:900;font-size:15px;padding:6px;min-width:0;overflow-wrap:anywhere;box-shadow:0 4px 0 var(--line)}
.key .ar{font-size:24px}
.key.blk{background:#2A0F1A;color:#FFF3DA}
.key.sel{background:var(--gold);color:#2A0F1A}
.key.done{background:var(--okbg);color:var(--ink);opacity:.7}
/* tempo: pusingan pantas */
.tbar{height:10px;border-radius:6px;background:var(--cream);overflow:hidden;margin:4px 0 8px;border:2px solid var(--line)}
.tbar span{display:block;height:100%;background:var(--teal);width:100%;transition:width linear}
.zap{text-align:center;font-weight:900;color:var(--gold2)}
/* konduktor: ketuk kalimah */
.phrase{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;background:var(--cream);border-radius:18px;padding:10px;border:2px solid var(--staff)}
.tok{border:3px solid var(--line);border-radius:14px;background:var(--card);padding:0 10px;font-size:28px;min-height:56px;box-shadow:0 3px 0 var(--line)}
/* lirik: isi tempat kosong */
.lyr{font-size:19px;background:var(--cream);border-radius:16px;padding:10px 12px;border-inline-start:6px solid var(--rose)}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--rose);text-align:center;color:var(--rose)}
.blank.done{border-bottom-style:solid;color:var(--ok)}
/* maklum balas */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:640px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 -4px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .momo{width:58px;height:68px;flex:0 0 auto}
.fb strong{font:400 22px "Shrikhand",cursive;color:var(--ok)}
html[dir="rtl"] .fb strong{font:700 22px "Noto Naskh Arabic",serif}
.fb p{margin:2px 0;font-size:16px}
.fast{display:inline-block;background:var(--gold);color:#2A0F1A;border-radius:999px;padding:0 10px;font-size:14px}
.res{text-align:center}
.res .momo{width:120px;height:140px}
.stars{font-size:46px;display:flex;justify-content:center;gap:6px}
.stars span{animation:pop .5s both}
.stars .off{filter:grayscale(1);opacity:.3}
.gotst{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--note);border-radius:16px;padding:8px;margin:10px 0}
.gotst span{font-size:40px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;max-width:90vw;font-size:16px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

/* ---------- Suara (Rumi sahaja; tulisan Arab dibuang, Al-Quran tidak dibaca mesin) ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
function clean(text){
  return text.replace(AR_RE," ").replace(/[ـ∴⚡]/g," ").replace(/_{2,}/g," ").replace(/\(\s*\)/g," ").replace(/\s+:/g,":")
    .replace(/\s+([.,:;!?])/g,"$1").replace(/(^|\s)[:,.]+(?=\s|$)/g," ").replace(/\s+/g," ").trim();
}
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  const s = clean(text); if(!s || !/[a-z]/i.test(s)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

const GAMES = {
  /* Gendang: ketuk gendang mengikut kadar harakat, kemudian Semak */
  gendang(el, g){
    let k = 0, n = 0;
    const draw = () => {
      const [ar, ok, hk] = g.rounds[k]; n = 0;
      el.innerHTML = rounds(g.rounds.length, k) + `<div class="gd">

      const beats = el.querySelector(".beats"), drum = el.querySelector(".drum");
      const show = () => { beats.innerHTML = Array.from({length:n},()=>"<span>🥁</span>").join("") + (n?` <b>${n}</b>`:""); };
      drum.addEventListener("click", () => { if(n<6){ n++; sfx.drum(); drum.classList.remove("hit"); void drum.offsetWidth; drum.classList.add("hit"); show(); } });
      el.querySelector(".rst").addEventListener("click", () => { n = 0; show(); });

        if(!n){ toast(L("Ketuk gendang dahulu 🥁","کتوق ڬندڠ دهولو 🥁")); return; }
        if(ok.includes(n)){ sfx.tick(); clearHint(); k++; if(k===g.rounds.length) setTimeout(win, 300); else setTimeout(draw, 350); }
        else { oops(e.currentTarget, L(`Rentak tidak tepat. Hukum ini dibaca ${ok.join(" / ")} harakat.`,`رنتق تيدق تڤت. حکوم اين دباچ ${ok.join(" / ")} حرکة.`)); n = 0; show(); }
      });
    };
    draw();
  },

  /* Notasi: pilih not, letak pada baris paranada hukumnya */
  notasi(el, g){
    let sel = null, left = g.items.length;
    const ord = mix(g.items.map((_,i)=>i));
    const isTxt = x => typeof x!=="string";
    el.innerHTML = `<div class="notes">${ord.map(i=>`<button class="nt ${isTxt(g.items[i][0])?"txt":""}" data-i="${i}" data-c="${g.items[i][1]}">${TX(g.items[i][0])}</button>`).join("")}</div>
      <div class="staves">${g.stv.map((s,i)=>`<button class="stv" data-c="${i}"><b>𝄞 ${T(s)}</b><div class="in"></div></button>`).join("")}</div>`;
    el.querySelectorAll(".nt").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".nt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = b; sfx.key(+b.dataset.i);
    }));
    el.querySelectorAll(".stv").forEach(s => s.addEventListener("click", () => {
      if(!sel){ toast(L("Pilih satu not dahulu 🎵","ڤيليه ساتو نوت دهولو 🎵")); return; }
      if(sel.dataset.c === s.dataset.c){
        const it = g.items[+sel.dataset.i][0];
        s.querySelector(".in").insertAdjacentHTML("beforeend", `<span class="${isTxt(it)?"txt":""}">${TX(it)}</span>`);
        sel.classList.add("gone"); sel.disabled = true; sel = null; left--; sfx.tick(); clearHint();
        if(!left) setTimeout(win, 350);
      } else oops(s, L("Not itu bukan pada baris ini. Semak hukumnya semula.","نوت ايت بوکن ڤد باريس اين. سمق حکومڽ سمولا."));
    }));
  },

  /* Kompang: pukul (pilih) semua jawapan betul, kemudian tekan Pukul! */
  kompang(el, g){
    const ord = shuffle(g.items.map((_,i)=>i)), on = new Set();
    const big = g.items.every(it => typeof it[0]==="string" && !Q[it[0]]);
    el.innerHTML = `<div class="kps ${g.items.length===4?"two":""}">${ord.map(i=>`<button class="kp ${big?"big":""}" data-i="${i}" data-ok="${g.items[i][1]}" aria-pressed="false">${TX(g.items[i][0])}</button>`).join("")}</div>
      <div style="margin-top:12px"><button class="btn go chk">🪘 ${L("Pukul!","ڤوکول!")}</button></div>`;
    el.querySelectorAll(".kp").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i; if(on.has(i)) on.delete(i); else { on.add(i); sfx.drum(); }
      b.classList.toggle("on", on.has(i)); b.setAttribute("aria-pressed", on.has(i)); b.classList.remove("bad");
    }));
    el.querySelector(".chk").addEventListener("click", e => {
      if(!on.size){ toast(L("Pilih kompang dahulu 🪘","ڤيليه کومڤڠ دهولو 🪘")); return; }
      const need = g.items.map((it,i)=>it[1]?i:-1).filter(i=>i>=0);
      const good = need.every(i=>on.has(i)) && [...on].every(i=>g.items[i][1]);
      if(good){ el.querySelectorAll(".kp.on").forEach(b=>b.classList.add("ok")); setTimeout(win, 350); return; }
      const wrongPick = [...on].filter(i=>!g.items[i][1]);

      oops(e.currentTarget, wrongPick.length ? L("Ada kompang yang salah dipukul. Pilih semula.","اد کومڤڠ يڠ ساله دڤوکول. ڤيليه سمولا.") : L("Belum cukup! Masih ada kompang yang betul.","بلوم چوکوڤ! ماسيه اد کومڤڠ يڠ بتول."));
      on.clear(); el.querySelectorAll(".kp").forEach(b=>{ b.classList.remove("on"); b.setAttribute("aria-pressed","false"); });

  },

  /* Akord: tekan kekunci putih, kemudian kekunci hitam yang sepadan */
  akord(el, g){

    const lo = shuffle(g.pairs.map((_,i)=>i)), ro = mix(lo);

    el.querySelectorAll('.key[data-s="a"]').forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return; el.querySelectorAll('.key[data-s="a"]').forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = b; sfx.key(+b.dataset.i);

    }));
  },

  /* Tempo: pusingan pantas mengikut rentak metronom (bonus ⚡, tiada hukuman masa) */
  tempo(el, g){
    let k = 0, zap = 0; const LIM = 9000;

      el.innerHTML = rounds(g.rounds.length, k) + `<div class="tbar"><span></span></div>
        <p class="lab" style="font-size:17px;color:var(--ink)">⏱️ ${T(r.p)}</p>${r.ar?`<div class="qar ar" lang="ar">${AX(r.ar)}</div>`:""}
        <div class="opts ${opts.length===2?"":"one"}">${optBtns(opts)}</div><p class="zap">⚡ ${zap}</p>`;
      const bar = el.querySelector(".tbar span");
      requestAnimationFrame(()=>{ bar.style.transitionDuration = LIM+"ms"; bar.style.width = "0%"; });
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(b.disabled || b.classList.contains("wrong")) return;
        if(b.dataset.ok==="1"){
          el.querySelectorAll(".opt").forEach(x=>x.disabled=true); b.classList.add("right");
          if(Date.now()-t0 < LIM) zap++; sfx.tick(); clearHint(); k++;
          if(k===g.rounds.length) setTimeout(win, 350); else setTimeout(draw, 380);
        } else { b.classList.add("wrong"); oops(b, L("Luar rentak! Fikir sekali lagi.","لوار رنتق! فيکير سکالي لاڬي.")); }
      }));
    };
    draw();
  },

  /* Konduktor: ketuk kalimah yang betul dalam potongan ayat (tanda waqaf melekat pada kalimah sebelumnya) */
  konduktor(el, g){
    const toks = [];
    for(const w of AX(g.ar).split(" ")){ if(!/[\u0621-\u064A\u0671]/.test(w) && toks.length) toks[toks.length-1] += " " + w; else toks.push(w); }
    el.innerHTML = `<p class="lab">🪄 ${L("Hayun baton: ketuk satu kalimah","هايون باتون: کتوق ساتو كليمه")}</p>
      <div class="phrase" lang="ar">${toks.map((w,i)=>`<button class="tok ar" data-i="${i}" data-ok="${i===g.ans?1:0}">${w}</button>`).join("")}</div>`;
    el.querySelectorAll(".tok").forEach(b => b.addEventListener("click", () => {
      if(b.disabled || b.classList.contains("wrong")) return;
      if(b.dataset.ok==="1"){ el.querySelectorAll(".tok").forEach(x=>x.disabled=true); b.classList.add("right"); setTimeout(win, 400); }
      else { b.classList.add("wrong"); oops(b, L("Orkestra tersalah masuk! Cuba kalimah lain.","اورکيسترا ترساله ماسوق! چوبا كليمه لاٴين.")); }
    }));
  },

  /* Lirik: isi tempat kosong dalam lirik lagu */
  lirik(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    const s = T(g.s).replace("___", `<span class="blank">🎵</span>`);
    el.innerHTML = `<p class="lyr">🎤 ${s}</p><div class="opts ${opts.length===2?"":"one"}">${optBtns(opts)}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(b.dataset.ok==="1"){ done = true; b.classList.add("right"); const bl = el.querySelector(".blank"); bl.classList.add("done"); bl.innerHTML = TX(opts[+b.dataset.i].x); setTimeout(win, 450); }
      else { b.classList.add("wrong"); oops(b, L("Lirik itu tidak kena dengan lagu. Cuba lagi.","ليريک ايت تيدق کنا دڠن لاڬو. چوبا لاڬي.")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Mainkan seksyen sebelumnya dahulu 🔒","ماٴينکن سيکشن سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} seksyen untuk naik ke pentas Konsert Agung 🎼`,`سلسايکن سموا ${STATIONS.length} سيکشن اونتوق ناٴيق ک ڤنتس کونسيرت اڬوڠ 🎼`)); }
  else if(a==="map"){ renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa (selepas tukar tulisan/suara) tanpa mengulang bunyi/konfeti
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
