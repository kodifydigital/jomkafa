<head>
<meta charset="utf-8">

<title>Rumah Api Hafiz • Hafazan Tahun 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Hafazan Tahun 5: "Rumah Api Hafiz" — pantai waktu malam, satu rumah api untuk setiap stesen, Mira si Camar ===== */
:root{
  --night:#0B1B33; --deep:#12284A; --sea:#1F4E79; --sea2:#2D6FA3; --foam:#5CC8C8; --beam:#FFD54A; --beam2:#FFF3B0;
  --red:#D7263D; --red2:#F06B78; --sand:#F4E3C1; --rock:#5B6475; --gull:#F7F9FC;
  --bg:#EAF2F8; --card:#FFFFFF; --ink:#13213A; --muted:#51607A; --line:#13213A;
  --ok:#1E8A5A; --okbg:#DDF5E8; --bad:#C7283E; --badbg:#FDE3E6; --note:#FFF6D5; --chip:#E3EEF8;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#07111F; --card:#122138; --ink:#EAF1FA; --muted:#A3B4CC; --line:#03070F;
    --okbg:#123A2A; --badbg:#3E1820; --note:#2C2A17; --chip:#1B3150; --sand:#3A3324; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 "Lexend",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Lexend",serif;font-size:18px;line-height:1.85}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 90px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.ar{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:25px;line-height:2.15}
.mark{font-family:"Amiri","Noto Naskh Arabic",serif;color:var(--sea2);font-size:.8em;white-space:nowrap}
@media (prefers-color-scheme: dark){ .mark{color:var(--beam)} }
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sp{flex:1}
.ib{min-width:46px;height:46px;padding:0 10px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-weight:800;text-decoration:none;color:var(--ink);font-size:18px;box-shadow:0 3px 0 var(--line)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--beam);color:#13213A;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800}
/* ---------- hero ---------- */
.hero{display:flex;gap:10px;align-items:center;border-radius:24px;padding:12px;color:#fff;border:3px solid var(--line);
  background:radial-gradient(circle at 96% 92%,#FFF3B0 0 7px,transparent 8px),radial-gradient(circle at 20% 30%,#fff8 0 1.5px,transparent 2px),radial-gradient(circle at 40% 45%,#fff6 0 1px,transparent 2px),linear-gradient(180deg,#0B1B33 0%,#12284A 60%,#1F4E79 100%)}
.hero h1{margin:0;font-weight:800;font-size:25px;line-height:1.15;color:var(--beam)}
html[dir=rtl] .hero h1{font-family:"Noto Naskh Arabic",serif;line-height:1.6}
.hero p{margin:4px 0 0;font-size:15px;line-height:1.4}
html[dir=rtl] .hero p{line-height:1.8}
.mira{width:96px;height:96px;flex:0 0 auto}
.flap .wl{animation:flap 1.4s ease-in-out infinite;transform-origin:52px 60px}
@keyframes flap{50%{transform:rotate(-14deg)}}
.sttl{margin:14px 4px 4px;font-weight:800}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.stickers span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--chip);border:2px dashed var(--muted);filter:grayscale(1);opacity:.45}
.stickers .got{filter:none;opacity:1;border:3px solid var(--line);background:var(--beam2)}
/* ---------- peta pantai ---------- */
.coast{position:relative;margin-top:14px;border-radius:26px;border:3px solid var(--line);padding:14px 10px 18px;overflow:hidden;
  background:radial-gradient(circle at 12% 6%,#fff9 0 1.5px,transparent 2px),radial-gradient(circle at 72% 3%,#fff9 0 1.5px,transparent 2px),radial-gradient(circle at 48% 9%,#fff7 0 1px,transparent 2px),
  repeating-linear-gradient(170deg,transparent 0 38px,#ffffff10 38px 41px),linear-gradient(180deg,#0B1B33 0%,#12284A 35%,#1F4E79 100%)}
.coast .dock,.coast .peak{position:relative;z-index:1;text-align:center;font-weight:800;color:var(--beam2);margin:4px 0 10px}
.coast .peak{margin:14px 0 6px;color:var(--beam)}
.row{position:relative;display:flex;margin:6px 0}
.row.l{justify-content:flex-start}.row.r{justify-content:flex-end}
.row::before{content:"";position:absolute;top:-10px;bottom:-10px;left:50%;border-left:4px dotted #ffffff55}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:10px;width:86%;text-align:start;border:3px solid var(--line);border-radius:22px;padding:8px 10px;
  background:linear-gradient(180deg,var(--card),var(--card)) padding-box;box-shadow:0 5px 0 var(--line);color:var(--ink)}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.node .num{position:absolute;top:-10px;inset-inline-start:-8px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;font-family:"Lexend",sans-serif}
.node .lh{flex:0 0 auto;width:52px;height:74px}
.node .nm{display:flex;flex-direction:column;font-weight:800;line-height:1.25;min-width:0}
html[dir=rtl] .node .nm{line-height:1.7}
.node .jn{font-weight:600;font-size:14px;color:var(--muted)}
.node .st{font-size:15px}
.node.lock{opacity:.62;filter:saturate(.3)}
.node.now{outline:4px solid var(--beam);outline-offset:3px}
.node .here{position:absolute;inset-inline-end:-6px;top:-34px;width:56px;height:56px}
.node.final{width:100%;background:linear-gradient(135deg,var(--beam2),var(--beam));color:#13213A}
.node.final .jn{color:#4A4020}
.lh .bm{opacity:0}
.node:not(.lock) .lh .bm{opacity:.9;animation:sweep 2.6s ease-in-out infinite;transform-origin:26px 18px}
@keyframes sweep{50%{transform:scaleX(-1)}}
.node.lock .lh .lamp{fill:#7A8496}
.st span.off,.stars .off{filter:grayscale(1) opacity(.3)}
</style>
<style>
/* ---------- stesen, kad bacaan ---------- */
.shead{display:flex;gap:10px;align-items:center;margin:4px 0 10px}
.shead h2{margin:0;font-size:22px;line-height:1.2;font-weight:800}
html[dir=rtl] .shead h2{line-height:1.7}
.shead small{color:var(--muted)}
.badge{width:52px;height:52px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--c);border:3px solid var(--line)}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 6px 0 var(--sc,var(--sea));position:relative}
.rpic{font-size:40px;text-align:center}
.rh{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 8px;font-size:20px;text-align:center}
.say{border:2px solid var(--line);background:var(--beam);border-radius:12px;width:40px;height:40px;flex:0 0 auto;font-size:18px}
.surah{background:var(--note);border-radius:18px;padding:10px;text-align:center;direction:rtl;border:2px dashed var(--sea2)}
.surah .ar{font-size:24px}
.bsm{display:block;text-align:center;margin-bottom:4px}
.ptg .pr{border-bottom:2px dotted var(--muted);padding:6px 0}
.ptg .wds{display:flex;flex-wrap:wrap;gap:4px;direction:rtl}
.ptg .wd{background:var(--chip);border-radius:10px;padding:0 8px;font-size:21px;line-height:1.9}
.ptg .full{direction:rtl;text-align:right}
.mkl{list-style:none;margin:0;padding:0}
.mkl li{border-bottom:2px dotted var(--muted);padding:6px 0;text-align:right}
.mkl .m{display:flex;gap:8px;align-items:flex-start;text-align:start;font-size:16px}
html[dir=ltr] .mkl .m{direction:ltr}
.mkl .m b{flex:0 0 auto;min-width:28px;height:28px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-size:13px;font-family:"Lexend",sans-serif}
.tip{display:flex;gap:10px;background:var(--note);border-radius:16px;padding:10px;margin-bottom:10px}
.tip ul{margin:4px 0;padding-inline-start:18px}
.abox{background:var(--card);border-radius:14px;padding:8px;margin-top:6px;border:2px solid var(--beam)}
.abox .ar{display:block;text-align:center;font-size:23px}
.abox small{display:block;color:var(--muted)}
.ref{margin-top:10px;color:var(--muted);font-size:14px;text-align:center}
.navr{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--chip);font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--line);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--beam);color:#13213A}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--beam);outline:2px solid var(--line)}
/* ---------- kemajuan: bot ke rumah api ---------- */
.prog{position:relative;height:30px;border-radius:999px;border:3px solid var(--line);background:repeating-linear-gradient(90deg,var(--sea) 0 14px,var(--sea2) 14px 28px);margin-bottom:12px;overflow:hidden}
.prog .fill{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,#FFD54A88,#FFF3B0cc)}
.prog .end{position:absolute;inset-inline-end:6px;top:0;font-size:18px}
.prog .ft{position:absolute;top:0;font-size:18px;transform:translateX(-50%)}
html[dir=rtl] .prog .ft{transform:translateX(50%)}
.q{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q p{margin:0 0 8px;font-weight:600}
.rnd{text-align:center;font-weight:800;color:var(--muted);margin:6px 0}
.cur{background:var(--note);border-radius:16px;padding:6px 10px;text-align:center;border:2px solid var(--beam)}
.opts{display:grid;gap:8px;margin-top:8px}
.op{border:3px solid var(--line);border-radius:16px;background:var(--chip);padding:4px 10px;min-height:56px;box-shadow:0 3px 0 var(--line);min-width:0;overflow-wrap:anywhere}
.op.right{background:var(--okbg);border-color:var(--ok)}
.op .ar{font-size:23px}
.hint{margin-top:10px;background:var(--badbg);border-radius:14px;padding:8px 10px;font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* suar: suar menyala */
.flares{display:flex;justify-content:center;gap:16px;font-size:30px}
.flares span{filter:grayscale(1) opacity(.35)}
.flares .on{filter:none;animation:pop .4s}
/* pelampung */
.lane{min-height:64px;border-radius:16px;background:linear-gradient(180deg,#2D6FA333,#1F4E7955);border:2px dashed var(--sea2);padding:6px;display:flex;flex-wrap:wrap;gap:6px;direction:rtl;align-items:center}
.lane .pd{background:var(--card);border:2px solid var(--ok);border-radius:12px;padding:0 8px;font-size:22px}
.lane .ps{width:26px;height:26px;border-radius:50%;border:3px dashed var(--red2)}
.buoys{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;direction:rtl}
.buoy{border:3px solid var(--line);border-radius:20px 20px 12px 12px;background:repeating-linear-gradient(180deg,var(--red) 0 10px,#fff 10px 20px);padding:2px;box-shadow:0 3px 0 var(--line);min-width:64px}
.buoy span{display:block;background:var(--card);border-radius:12px;padding:0 8px}
.buoy.used{visibility:hidden}
/* teritip */
.wline{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center;background:var(--note);border-radius:16px;padding:8px}
.wb{border:2px solid var(--muted);border-radius:12px;background:var(--card);padding:0 8px;min-height:48px}
.wb.bad{background:var(--badbg);border-color:var(--bad)}
.wb.fix{background:var(--okbg);border-color:var(--ok)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
</style>
<style>
/* isyarat: rumah api berkelip menghantar maksud */
.sig{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,#0B1B33,#1F4E79);color:#fff;border-radius:18px;padding:10px;border:3px solid var(--line)}
.sig .lh{width:46px;height:66px;flex:0 0 auto}
.sig .lh .bm{opacity:.9;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.sig .msg{font-weight:600;line-height:1.4}
html[dir=rtl] .sig .msg{line-height:1.9}
/* ombak: botol hanyut ke pantai */
.bottles{display:grid;gap:8px}
.bottle{border:3px solid var(--line);border-radius:999px;background:linear-gradient(90deg,#BDE7E7,#E8FBFB);padding:2px 14px;min-height:54px;box-shadow:0 3px 0 var(--line);color:#13213A;min-width:0;overflow-wrap:anywhere}
.bottle.used{opacity:.25;pointer-events:none}
.shore{margin-top:12px;border-radius:16px;background:var(--sand);border:2px solid var(--line);padding:6px;min-height:60px}
.shore .in{border-bottom:2px dotted var(--muted);text-align:right}
.shore .wait{height:16px;border-bottom:2px dotted var(--muted);opacity:.5}
/* beting: betul / salah */
.pair{background:var(--note);border-radius:16px;padding:6px 10px;text-align:center}
.pair .arw{font-size:20px}
.tf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tf button{min-height:64px;border-radius:18px;border:3px solid var(--line);font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--line);min-width:0}
.tf .yes{background:var(--okbg)}.tf .no{background:var(--badbg)}
/* tambat: tali tambat awal ↔ hujung */
.moor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.moor .col{display:grid;gap:8px;align-content:start}
.mk{border:3px solid var(--line);border-radius:14px;background:var(--chip);padding:2px 6px;min-height:52px;min-width:0;overflow-wrap:anywhere}
.mk .ar{font-size:21px;line-height:1.9}
.mk.h{background:var(--note)}
.mk.sel{outline:4px solid var(--beam);outline-offset:1px}
.mk.done{opacity:.3;pointer-events:none}
.joined div{border-bottom:2px dotted var(--muted);text-align:right}
/* sauh: rantai nombor */
.qar{background:var(--note);border-radius:16px;padding:6px 10px;text-align:center}
.chain{display:flex;justify-content:center;gap:4px;margin-top:12px}
.link{width:68px;height:68px;border-radius:50%;border:6px solid var(--rock);background:var(--card);font-weight:800;font-size:22px;box-shadow:0 3px 0 var(--line)}
.link.w{background:var(--badbg)}
.anchor{text-align:center;font-size:36px;margin-top:4px}
/* kapal: dua kapal surah */
.cargo{display:grid;gap:8px}
.cg{border:3px solid var(--line);border-radius:12px;background:#E9D3A8;color:#13213A;padding:2px 10px;min-height:52px;min-width:0;overflow-wrap:anywhere}
.cg.sel{outline:4px solid var(--beam)}
.cg.gone{display:none}
.ships{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.ship{border:3px solid var(--line);border-radius:12px 12px 40px 40px;background:linear-gradient(180deg,var(--card) 0 60%,var(--red) 60%);min-height:110px;padding:6px;min-width:0;box-shadow:0 4px 0 var(--line)}
.ship b{display:block;font-size:15px}
.ship .in .ar{font-size:15px;line-height:1.6;display:block;background:#FFFFFFE6;color:#13213A;border-radius:8px;margin-top:3px}
/* maklum balas, keputusan */
.fb{position:fixed;inset-inline:0;bottom:0;z-index:30;padding:10px;display:flex;justify-content:center}
.fb .in{width:100%;max-width:560px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 -4px 0 var(--beam),0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fb .mira{width:64px;height:64px}
.fb strong{font-size:24px;color:var(--ok)}
.fb p{margin:2px 0 0;line-height:1.3}
html[dir=rtl] .fb p{line-height:1.8}
.res{text-align:center}
.res .mira{width:120px;height:120px}
.stars{font-size:46px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .5s backwards}
@keyframes pop{from{transform:scale(0)}}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border-radius:14px;padding:8px;margin:8px 0}
.gotst span{font-size:40px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:40;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:380px){ .ar{font-size:22px} .link{width:58px;height:58px} .node .lh{width:42px;height:60px} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

    let sel = null, got = 0;
    el.innerHTML = `<div class="moor"><div class="col">${g.items.map((it,i)=>`<button class="mk h" data-h="${i}"><span class="ar" lang="ar">${it.h} …</span></button>`).join("")}</div>
      <div class="col">${mix(g.items.map((it,i)=>[it.t,i])).map(([t,i])=>`<button class="mk t" data-t="${i}"><span class="ar" lang="ar">… ${t}</span></button>`).join("")}</div></div>
      <div class="joined" id="jn"></div>`;
    el.querySelectorAll(".mk.h").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".mk.h").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.h; sfx.tick();
    }));
    el.querySelectorAll(".mk.t").forEach(b => b.addEventListener("click", () => {
      if(sel===null){ toast(L("Tekan awal ayat (tiang) dahulu ☝️","تکن اول ايات (تياڠ) دهولو ☝️")); return; }
      if(+b.dataset.t === sel){
        const it = g.items[sel];
        el.querySelector(`.mk.h[data-h="${sel}"]`).classList.add("done"); b.classList.add("done");
        el.querySelector("#jn").insertAdjacentHTML("beforeend", `<div>⚓ ${AR(it.h + " " + it.t, it.an)}</div>`);
        sel = null; got++; sfx.splash(); clearHint();
        el.querySelectorAll(".mk.h").forEach(x=>x.classList.remove("sel"));
        if(got === g.items.length) setTimeout(win, 350);
      } else oops(b, L("Tali itu tidak sampai. Cuba hujung yang lain.","تالي ايت تيدق سمڤاي. چوبا هوجوڠ يڠ لاٴين."));
    }));
  },
  /* 6c. Sauh: nombor ayat */
  sauh(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k];
      el.innerHTML = `<p class="rnd">⚓ ${k+1} / ${g.rounds.length}</p><div class="qar">${AR(r.ar)}</div>
        <div class="chain">${r.opts.map(n=>`<button class="link" data-n="${n}">${L(n, AN(n))}</button>`).join("")}</div><div class="anchor" aria-hidden="true">⚓</div>`;
      el.querySelectorAll(".link").forEach(b => b.addEventListener("click", () => {
        if(+b.dataset.n === r.an){
          sfx.horn(); clearHint(); k++; el.querySelectorAll(".link").forEach(x=>x.disabled=true);
          if(k >= g.rounds.length) setTimeout(win, 400); else setTimeout(draw, 450);
        } else { b.classList.add("w"); oops(b, L("Sauh tersangkut! Ingat tertib ayat dalam surah.","ساوه ترسڠکوت! ايڠت ترتيب ايات دالم سورة.")); }
      }));
    };
    draw();
  },
  /* 6d. Kapal: asingkan ayat ikut surah */
  kapal(el, g){
    let sel = null, got = 0;
    el.innerHTML = `<div class="cargo">${mix(g.items.map((it,i)=>i)).map(i=>arB(g.items[i][0],"cg",`data-i="${i}"`)).join("")}</div>
      <div class="ships">${g.sides.map((s,j)=>`<button class="ship" data-j="${j}"><b>🚢 ${L("Surah ","سورة ")+T(s.t)}</b><span class="in" id="in${j}"></span></button>`).join("")}</div>`;
    el.querySelectorAll(".cg").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".cg").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; sfx.tick();
    }));
    el.querySelectorAll(".ship").forEach(b => b.addEventListener("click", () => {
      if(got >= g.items.length) return;
      if(sel===null){ toast(L("Tekan satu peti ayat dahulu ☝️","تکن ساتو ڤتي ايات دهولو ☝️")); return; }
      const j = +b.dataset.j;
      if(g.items[sel][1] === j){
        el.querySelector(`.cg[data-i="${sel}"]`).classList.add("gone");
        el.querySelector("#in"+j).insertAdjacentHTML("beforeend", `<span class="ar" lang="ar">${words(g.items[sel][0]).slice(0,2).join(" ")}…</span>`);
        sel = null; got++; sfx.horn(); clearHint(); if(got === g.items.length) setTimeout(win, 350);
      } else oops(b, L("Peti itu milik kapal lain. Cuba kapal sebelah!","ڤتي ايت ميليق کاڤل لاٴين. چوبا کاڤل سبله!"));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Nyalakan rumah api sebelumnya dahulu 🔒","ڽالاکن رومه اڤي سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Nyalakan semua ${STATIONS.length} rumah api untuk membuka Cabaran Suar Agung 🗼`,`ڽالاکن سموا ${STATIONS.length} رومه اڤي اونتوق ممبوک چابرن سوار اڬوڠ 🗼`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.phase==="result" && S.res) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
