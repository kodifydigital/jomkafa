<title>Stesen Cuaca Feqah • Feqah Tahun 5</title>

<style>
/* ===== Feqah Tahun 5: "Stesen Cuaca Feqah" — peta ramalan cuaca, tolok & dail, maskot Awan ===== */
:root{
  --sky1:#7DB9F5; --sky2:#D9ECFF; --bg:#F2F8FF; --card:#FFFFFF; --ink:#12233D; --muted:#4D6280; --line:#12233D;
  --brand:#1F6FB2; --brand2:#144E80; --sun:#FFB703; --sun2:#FB8500; --cloud:#FFFFFF; --storm:#3D5A80; --rain:#48CAE4;
  --grid:rgba(31,111,178,.12); --panel:#E6F1FF; --scr:#0E2A47; --scr2:#16406B;
  --ok:#2A9D5C; --okbg:#DDF6E6; --bad:#D9363E; --badbg:#FFE1E1; --note:#FFF5D1;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0B1A33; --sky2:#13284A; --bg:#08121F; --card:#13233B; --ink:#EAF3FF; --muted:#A9BEDA; --line:#02060C;
    --cloud:#DCE8F7; --grid:rgba(125,185,245,.10); --panel:#1A2F4E; --scr:#06182B; --scr2:#0D2B4A;
    --okbg:#143D29; --badbg:#4A1E22; --note:#3A3115; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:600;
  background:
    radial-gradient(circle at 88% 64px,var(--sun) 0 28px,rgba(255,183,3,.25) 30px 44px,transparent 46px),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(180deg,var(--sky1) 0,var(--sky2) 420px,var(--bg) 860px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Nunito",serif;font-size:19px;line-height:1.75}
#app{max-width:560px;margin:0 auto;padding:12px 14px 40px;position:relative}
h1,h2,h3{font-family:"Rammetto One","Nunito",sans-serif;font-weight:400;margin:0;line-height:1.2;letter-spacing:.2px}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700;line-height:1.5}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:1.3em;line-height:2;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:16px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{height:48px;padding:0 14px;border-radius:999px;border:3px solid var(--line);background:var(--sun);color:#12233D;display:inline-flex;align-items:center;font-weight:900}
/* Maskot Awan */
.awan{width:96px;height:auto;flex:0 0 auto;overflow:visible}
.awan.bob{animation:bob 2.6s ease-in-out infinite}
.awan.yay{animation:yay .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes yay{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-4px)}}
.hero{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:12px 14px;box-shadow:0 6px 0 var(--line);margin-bottom:14px}
.hero h1{font-size:23px;color:var(--brand)}
.hero p{margin:4px 0 0;font-size:15.5px;color:var(--muted)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .hero h1{color:var(--rain)} }
.sttl{margin:4px 2px 6px;font-weight:900}
.stickers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.stickers span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--panel);border:3px dashed var(--muted);filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;border:3px solid var(--line);background:var(--note);box-shadow:0 3px 0 var(--line)}
/* Peta cuaca: laluan isobar zig-zag */
.wmap{position:relative;background:var(--scr);border:3px solid var(--line);border-radius:26px;padding:16px 12px 18px;box-shadow:0 6px 0 var(--line);overflow:hidden;
  background-image:repeating-radial-gradient(circle at 20% 10%,transparent 0 38px,rgba(125,185,245,.16) 38px 40px),repeating-radial-gradient(circle at 85% 70%,transparent 0 46px,rgba(255,183,3,.12) 46px 48px)}
.wmap .start{display:block;width:max-content;margin:0 auto 6px;padding:6px 14px;border-radius:999px;background:var(--sun);color:#12233D;border:3px solid var(--line);font-weight:900;font-size:15px}
.mrow{position:relative;display:flex;align-items:center;gap:10px;padding:10px 0}
.mrow:nth-child(odd){flex-direction:row-reverse}
.mrow::before{content:"";position:absolute;top:-10px;bottom:50%;left:50%;border-left:4px dashed rgba(234,243,255,.55);z-index:0}
.stn{position:relative;z-index:1;display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:start}
.mrow:nth-child(odd) .stn{flex-direction:row-reverse;text-align:end}
.dial{position:relative;width:88px;height:88px;flex:0 0 88px}
.dial svg{width:100%;height:100%}
.dial .em{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;padding-top:6px}
.dial .badge{position:absolute;top:-6px;inset-inline-start:-6px;width:30px;height:30px;border-radius:50%;background:var(--sun);color:#12233D;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:15px}
.stn .lab{min-width:0;flex:1;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 4px 0 var(--line)}
.stn .nm{display:block;font-weight:900;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.stn .st{display:block;font-size:14px;min-height:18px}
.stn .st .off{filter:grayscale(1);opacity:.35}
.stn.lock .lab{opacity:.65}
.stn.lock .dial{filter:grayscale(.8)}
.stn.now .lab{background:var(--note);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--line),0 0 0 6px rgba(255,183,3,.55)}}
.perch{position:absolute;top:-26px;inset-inline-end:-6px;z-index:3}
.perch .awan{width:54px}
.radar{position:relative;z-index:1;margin-top:10px}
.radar .stn .dial{width:110px;height:110px;flex-basis:110px}
.radar .stn .em{font-size:40px}
</style>
<style>
/* Kad, bacaan dan permainan */
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead .bub{width:56px;height:56px;flex:0 0 56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--c);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.shead h2{font-size:19px}
.shead small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 6px 0 var(--line);position:relative}
.card.read{border-top:12px solid var(--sc)}
.rpic{font-size:44px;text-align:center;line-height:1.2}
.rh{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:19px;margin:6px 0 8px}
.rtext{margin:6px 0}
.rlist{margin:6px 0;padding-inline-start:26px}
.rlist li{margin:4px 0;padding:4px 8px;border-radius:10px;background:var(--panel)}
.abox{margin:10px 0;padding:10px 12px;border-radius:16px;border:3px dashed var(--brand);background:var(--panel);text-align:center}
.abox .ar{display:block}
.abox .mk{display:block;margin-top:4px;font-size:16px}
.abox small{display:block;color:var(--muted);margin-top:4px}
.abox .rv{display:inline-block;margin-top:6px;font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--note);color:var(--muted)}
.tip{display:flex;gap:8px;align-items:flex-start;margin:8px 0;padding:10px 12px;border-radius:14px;background:var(--note);border:2px solid var(--line);font-size:16px}
.tip.am{background:var(--okbg)}
.ref{margin-top:10px;font-size:14px;color:var(--muted);font-weight:800}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:56px;border-radius:18px;border:3px solid var(--line);background:var(--brand);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);padding:8px 12px;width:100%}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.go{background:var(--sun);color:#12233D}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--brand);width:22px;border-radius:6px}
.say{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:3px solid var(--line);background:var(--sun);font-size:19px;display:grid;place-items:center;padding:0}
/* Bar kemajuan: jalur ramalan 7 hari */
.prog{display:flex;gap:4px;margin:0 0 12px;padding:6px;background:var(--scr);border:3px solid var(--line);border-radius:16px}
.prog i{flex:1;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:17px;background:var(--scr2)}
.prog i.got{background:var(--sun)}
.prog i.cur{background:var(--rain);animation:glow 1.6s infinite}
.q{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.q p{margin:0;font-weight:800;font-size:18px}
.qpic{font-size:40px;text-align:center;margin-bottom:6px}
.hint{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--badbg);border:2px solid var(--bad);font-weight:800;font-size:16px}
.cnt{margin-top:10px;text-align:center;color:var(--muted);font-weight:800;font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opt{min-width:0;overflow-wrap:anywhere;min-height:56px;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);padding:8px 10px;font-weight:800;font-size:16px;line-height:1.3}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right,.opt.sel.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
/* tolokangin: kompas 4 arah */
.compass{display:grid;grid-template-columns:minmax(0,1fr) 86px minmax(0,1fr);grid-template-areas:"n n n" "w c e" "s s s";gap:8px;align-items:center}
.compass .n{grid-area:n}.compass .e{grid-area:e}.compass .s{grid-area:s}.compass .w{grid-area:w}
.compass .opt b{display:block;font-size:13px;color:var(--brand)}
.vane{grid-area:c;width:86px;height:86px;border-radius:50%;background:var(--scr);border:3px solid var(--line);display:grid;place-items:center;position:relative}
.vane .arr{font-size:40px;transition:transform .5s cubic-bezier(.3,1.6,.5,1);display:block;line-height:1}
/* ramalan: skrin TV cuaca */
.tv{background:var(--scr);color:#EAF3FF;border:3px solid var(--line);border-radius:20px;padding:12px;text-align:center;min-height:96px;display:grid;place-items:center;font-weight:800;font-size:18px;position:relative}
.tv small{position:absolute;top:6px;inset-inline-start:10px;font-size:12px;color:var(--sun)}
.strip{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0;min-height:30px}
.strip span{padding:2px 8px;border-radius:999px;background:var(--panel);font-size:18px}
.bins .opt{display:flex;flex-direction:column;align-items:center;gap:2px}
.bins .opt .em{font-size:28px}
/* petir: rod penangkal kilat */
.rod{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;padding:8px;border-radius:16px;background:var(--scr);border:3px solid var(--line)}
.rod .slot{display:flex;gap:8px;align-items:center;min-height:38px;border-radius:12px;padding:4px 10px;background:var(--scr2);color:#A9BEDA;font-weight:800;font-size:15px}
.rod .slot b{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:grid;place-items:center;background:var(--storm);color:#fff;font-size:14px}
.rod .slot.on{background:var(--sun);color:#12233D;animation:zap .35s}
.rod .slot.on b{background:#12233D}
@keyframes zap{0%{filter:brightness(2.2)}100%{filter:none}}
.opt.used{visibility:hidden}
/* barometer */
.baro{display:flex;flex-direction:column;align-items:center;gap:8px}
.baro svg{width:220px;max-width:100%}
.baro .val{font-family:"Rammetto One","Nunito",sans-serif;font-size:34px;line-height:1;direction:ltr}
.baro .ctr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr}
.baro .ctr .opt{min-width:60px;font-size:20px}
/* satelit: imbas radar */
.radarbg{padding:10px;border-radius:20px;background:radial-gradient(circle at 50% 50%,rgba(72,202,228,.25) 0 20%,transparent 21% 40%,rgba(72,202,228,.18) 41% 42%,transparent 43%),var(--scr);border:3px solid var(--line)}
.radarbg .opt{background:var(--scr2);color:#EAF3FF;border-color:#5E8BC0}
.radarbg .opt.sel{background:var(--sun);color:#12233D;border-color:var(--line)}
.radarbg .opt.wrong{background:var(--bad);color:#fff}
/* tadahan: tolok hujan */
.gauge{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
.tube{width:46px;flex:0 0 46px;min-height:120px;border:3px solid var(--line);border-radius:0 0 14px 14px;background:var(--panel);position:relative;overflow:hidden}
.tube i{position:absolute;inset-inline:0;bottom:0;height:12%;background:linear-gradient(180deg,var(--rain),var(--brand));transition:height .6s}
.tube.full i{height:88%}
.sent{flex:1;margin:0;padding:10px;border-radius:14px;background:var(--panel);font-weight:800;align-self:center}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--brand);text-align:center;color:var(--brand)}
.blank.fill{border-bottom-style:solid;color:var(--ok)}
/* isobar: padankan */
.iso{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.iso .col{display:flex;flex-direction:column;gap:8px}
.iso .opt.pick{background:var(--note);border-color:var(--sun2)}
.iso .opt.done{opacity:.95;color:#12233D;border-style:dashed}
/* ribut: awan ganjil */
.sky{padding:10px;border-radius:20px;background:linear-gradient(180deg,var(--storm),var(--scr));border:3px solid var(--line)}
.sky .opt{border-radius:30px 30px 20px 20px;background:var(--cloud);color:#12233D}
.sky .opt.gone{animation:blow .7s forwards}
@keyframes blow{to{transform:translateX(160px) rotate(20deg);opacity:0}}
html[dir="rtl"] .sky .opt.gone{animation-name:blowr}
@keyframes blowr{to{transform:translateX(-160px) rotate(-20deg);opacity:0}}
/* Maklum balas dan keputusan */
.fb{position:fixed;inset-inline:0;bottom:0;z-index:50;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(8,18,31,.35)}
.fb .in{max-width:540px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .awan{width:70px}
.fb strong{font-family:"Rammetto One","Nunito",sans-serif;font-weight:400;font-size:20px}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.fb p{margin:2px 0 0;font-size:16px}
.res{text-align:center}
.res .awan{width:120px}
.stars{font-size:46px;margin:6px 0}
.stars span{display:inline-block;animation:pop .5s both}
.stars .off{filter:grayscale(1);opacity:.3}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
.gotst{margin:10px auto;padding:10px;border-radius:16px;background:var(--note);border:2px dashed var(--line);font-weight:800}
.gotst span{font-size:36px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:92vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<main id="app"></main>
<script>
const QURAN = {"b183": "يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُتِبَ عَلَيْكُمُ ٱلصِّيَامُ كَمَا كُتِبَ عَلَى ٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ", "n56": "وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ"};
/* ===================== KANDUNGAN (Feqah Tahun 5) =====================
   Buku teks: fail pN.jpg = ms. (N-8). Setiap teks = ["Rumi","Jawi"]. Rentetan biasa = teks Arab.
   Niat/doa disalin daripada buku: perlu semakan ustaz. Ayat Quran dari QURAN (api.quran.com). */
const STATIONS = [
{ id:1, icon:"🌡️", c:"#F28B66", sticker:"🌡️", t:["Solat Orang Sakit","صلاة اورڠ ساکيت"], u:["Stesen Termometer • ms. 1–8","ستيسن تيرموميتر • م.س. 1–8"],
  read:[
    { p:2, pic:"🌡️🤒", h:["Solat tetap wajib","صلاة تتڤ واجب"],
      text:["Solat wajib ditunaikan pada waktunya dalam semua keadaan, sama ada ketika sihat, sakit atau dalam perjalanan.","صلاة واجب دتونايکن ڤد وقتوڽ دالم سموا کأداءن، سام اد کتيک صيحت، ساکيت اتاو دالم ڤرجالنن."],
      list:[["Mengetahui masuk waktu solat","مڠتاهوءي ماسوق وقتو صلاة"],["Menghadap kiblat","مڠهادڤ قبلة"],["Menutup aurat","منوتوڤ عورة"],["Suci daripada hadas dan najis","سوچي درڤد حدث دان نجيس"],["Ada keuzuran","اد کعذورن"]],
      tip:["Senarai di atas ialah syarat sah solat orang sakit.","سناراي د اتس اياله شرط صح صلاة اورڠ ساکيت."] },

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[587,.12],[880,.2]]),
  tick: () => tone([[784,.08,"triangle"]]),
  no:   () => tone([[220,.18,"square"],[175,.2,"square"]]),
  zap:  () => tone([[1200,.04,"sawtooth"],[600,.06,"square"],[900,.1,"triangle"]]),
  drop: () => tone([[1046,.06],[784,.1]]),
  blip: () => tone([[660,.05,"square"],[990,.08,"square"]]),
  whoosh:()=> tone([[300,.08,"sawtooth"],[500,.08,"sawtooth"],[800,.1,"triangle"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.32]])
};

/* ---------- Suara: baca teks Rumi sahaja, buang tulisan Arab ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
const forSpeech = s => String(s).replace(/ﷺ/g," sallallahu alaihi wasallam ").replace(AR_RE," ").replace(/<[^>]+>/g," ")
  .replace(/___/g," ... ").replace(/…/g," ... ").replace(/\bms\. /g,"muka surat ").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    const s = forSpeech(text); if(!s) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

const WX = ["☀️","🌤️","⛅","🌦️","🌧️","⛈️","🌩️","🌈"];

function oops(el, hint){

  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">☁️ ${hint || L("Hmm, ramalan itu kurang tepat. Cuba lagi!","همم، رامالن ايت کورڠ تڤت. چوبا لاڬي!")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){

  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");

}
function nextGame(){

}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }

}
function drawResult(fresh){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Ramalanmu tepat, kamu ahli kaji cuaca feqah!","چمرلڠ! رامالنمو تڤت، کامو اهلي کاجي چواچ فقه!"] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom main lagi.","شاباس کران منچوبا! جوم ماءين لاڬي."];

  app.innerHTML = head() + `<section class="card res">
      ${awan("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Lencana cuaca baharu untuk kamu!","لنچان چواچ بهارو اونتوق کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>📡 ${L("Menara Radar kini dibuka!","منارا رادر کيني دبوک!")}</b></p>` : ""}

/* ===================== JENIS PERMAINAN ===================== */
const GAMES = {
  /* Tolok angin: pilih arah kompas yang betul, ayam cuaca berpusing */
  tolokangin(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))), pos = ["n","e","s","w"], lab = [["U","ا"],["T","ت"],["S","س"],["B","ب"]];
    let done = false;
    el.innerHTML = `<div class="compass">${opts.map((o,i)=>`<button class="opt ${pos[i]}" data-i="${i}" data-ok="${o.ok?1:0}"><b>${T(lab[i])}</b>${TX(o.x)}</button>`).join("")}
      <div class="vane" aria-hidden="true"><span class="arr" id="arr">🐓</span></div></div>
      <div class="cnt">🧭 ${L("Tekan arah jawapan yang betul.","تکن اره جواڤن يڠ بتول.")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return;
      const i = +b.dataset.i; let deg = [0,90,180,270][i]; if(isJ() && (i===1||i===3)) deg = 360-deg;
      el.querySelector("#arr").style.transform = `rotate(${deg}deg)`;
      if(opts[i].ok){ done = true; sfx.whoosh(); b.classList.add("right"); clearHint(); setTimeout(win, 500); }
      else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Angin tidak bertiup ke situ. Cuba arah lain!","اڠين تيدق برتيوڤ ک سيتو. چوبا اره لاين!")); }
    }));
  },

  /* Ramalan: hantar setiap kad ke kotak ramalan yang betul */
  ramalan(el, g){
    let items; do{ items = shuffle(g.items); }while(items.length>1 && items.every((x,i)=>x===g.items[i]));
    let k = 0;
    const draw = () => {
      const it = items[Math.min(k, items.length-1)];
      el.innerHTML = `<div class="tv" id="tv"><small>📺 ${L("RAMALAN","رامالن")} ${Math.min(k+1,items.length)}/${items.length}</small><span>${k<items.length?TX(it[0]):"🎉"}</span></div>
        <div class="strip">${items.slice(0,k).map(x=>`<span>${g.cats[x[1]][1]}</span>`).join("")}</div>
        <div class="bins ${g.cats.length===3?"g3":"g2"}">${g.cats.map((c,i)=>`<button class="opt" data-c="${i}"><span class="em" aria-hidden="true">${c[1]}</span><span>${T(c[0])}</span></button>`).join("")}</div>`;
      if(k<items.length) speak(RU(it[0]));
      el.querySelectorAll(".bins .opt").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.c===items[k][1]){ sfx.blip(); clearHint(); k++; draw(); if(k>=items.length) setTimeout(win, 400); }
        else oops(el.querySelector("#tv"), L("Ramalan itu tersasar. Baca semula kad bacaan.","رامالن ايت ترسسر. باچ سمولا کد باچاءن."));
      }));
    };
    draw();
  },

  /* Petir: sambar langkah ikut urutan ke rod penangkal kilat */
  petir(el, g){
    const order = mix(g.steps.map((_,i)=>i)); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="rod" aria-label="${L("Rod kilat","رود کيلت")}">${g.steps.map((s,i)=>`<div class="slot ${i<k?"on":""}"><b>${i+1}</b><span>${i<k?"⚡ "+T(s):"…"}</span></div>`).join("")}</div>
        <div class="g2">${order.map(i=>`<button class="opt ${i<k?"used":""}" data-i="${i}" ${i<k?"disabled":""}>${T(g.steps[i])}</button>`).join("")}</div>
        <div class="cnt">⚡ ${L(`Langkah ke-${Math.min(k+1,g.steps.length)} daripada ${g.steps.length}`,`لڠکه ک-${Math.min(k+1,g.steps.length)} درڤد ${g.steps.length}`)}</div>`;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(k>=g.steps.length || b.disabled) return;
        if(+b.dataset.i===k){ k++; sfx.zap(); clearHint(); draw(); if(k===g.steps.length) setTimeout(win, 450); }
        else oops(b, L(`Belum lagi! Apakah langkah ke-${k+1}?`,`بلوم لاڬي! اڤاکه لڠکه ک-${k+1}؟`));
      }));
    };
    draw();
  },

  /* Barometer: laraskan jarum kepada nombor yang betul */
  barometer(el, g){
    const dec = String(g.step).includes(".") ? String(g.step).split(".")[1].length : 0;
    const fmt = v => v.toFixed(dec);
    let v = g.min, done = false;
    const ang = () => -120 + 240*(v-g.min)/(g.max-g.min);
    const ticks = Array.from({length:13},(_,i)=>-120+i*20).map(a=>`<line x1="100" y1="22" x2="100" y2="${a%60===0?36:30}" stroke="#12233D" stroke-width="3" transform="rotate(${a} 100 100)"/>`).join("");
    const btn = (d,t) => `<button class="opt" data-d="${d}" aria-label="${t}">${t}</button>`;
    el.innerHTML = `<div class="baro"><svg viewBox="0 0 200 150" aria-hidden="true">
        <path d="M14 112 A90 90 0 1 1 186 112" fill="#FFF5D1" stroke="#12233D" stroke-width="5"/>
        <path d="M30 108 A76 76 0 0 1 60 40" fill="none" stroke="#48CAE4" stroke-width="10"/><path d="M140 40 A76 76 0 0 1 170 108" fill="none" stroke="#FB8500" stroke-width="10"/>${ticks}
        <line id="ndl" x1="100" y1="100" x2="100" y2="34" stroke="#D9363E" stroke-width="6" stroke-linecap="round" style="transition:transform .3s;transform-origin:100px 100px;transform:rotate(${ang()}deg)"/>
        <circle cx="100" cy="100" r="10" fill="#12233D"/></svg>
      <div class="val" id="val">${fmt(v)} <small style="font-size:16px">${T(g.unit)}</small></div>
      <div class="ctr">${g.big?btn(-g.big,"−"+g.big):""}${btn(-g.step,"−")}${btn(g.step,"+")}${g.big?btn(g.big,"+"+g.big):""}</div>
      <button class="btn go" id="chk">✔️ ${L("Semak bacaan","سمق باچاءن")}</button></div>`;
    const show = () => { el.querySelector("#val").firstChild.textContent = fmt(v)+" "; el.querySelector("#ndl").style.transform = `rotate(${ang()}deg)`; };
    el.querySelectorAll(".ctr .opt").forEach(b => b.addEventListener("click", () => {
      if(done) return; v = Math.min(g.max, Math.max(g.min, +(v + +b.dataset.d).toFixed(dec))); sfx.tick(); show();
    }));
    el.querySelector("#chk").addEventListener("click", e => {
      e.stopPropagation(); if(done) return;
      if(Math.abs(v-g.ans) < g.step/2){ done = true; clearHint(); el.querySelector(".val").style.color = "var(--ok)"; setTimeout(win, 300); }
      else oops(el.querySelector(".val"), v<g.ans ? L("Bacaan terlalu rendah. Naikkan jarum!","باچاءن ترلالو رنده. ناءيقکن جاروم!") : L("Bacaan terlalu tinggi. Turunkan jarum!","باچاءن ترلالو تيڠڬي. تورونکن جاروم!"));
    });
  },

  /* Satelit: pilih SEMUA kawasan yang betul, kemudian imbas */
  satelit(el, g){
    const items = shuffle(g.items.map((x,i)=>({x, ok:!!x[1], i}))), need = items.filter(o=>o.ok).length; let done = false;
    el.innerHTML = `<div class="radarbg"><div class="g2">${items.map((o,n)=>`<button class="opt" data-n="${n}" data-ok="${o.ok?1:0}" aria-pressed="false">${TX(o.x[0])}</button>`).join("")}</div></div>
      <div class="cnt" id="sc">🛰️ ${L(`Dipilih: 0 • Cari ${need} jawapan`,`دڤيليه: 0 • چاري ${need} جواڤن`)}</div>
      <button class="btn go" id="scan" style="margin-top:8px">📡 ${L("Imbas sekarang","ايمبس سکارڠ")}</button>`;
    const count = () => { const c = el.querySelectorAll(".opt.sel").length; el.querySelector("#sc").textContent = "🛰️ "+L(`Dipilih: ${c} • Cari ${need} jawapan`,`دڤيليه: ${c} • چاري ${need} جواڤن`); };
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done) return; b.classList.toggle("sel"); b.classList.remove("wrong"); b.setAttribute("aria-pressed", b.classList.contains("sel")); sfx.tick(); count();
    }));
    el.querySelector("#scan").addEventListener("click", () => {
      if(done) return;
      const sel = [...el.querySelectorAll(".opt.sel")], bad = sel.filter(b=>b.dataset.ok==="0"), good = sel.length - bad.length;
      if(!bad.length && good===need){ done = true; sel.forEach(b=>b.classList.add("right")); sfx.blip(); clearHint(); setTimeout(win, 450); return; }
      bad.forEach(b=>{ b.classList.remove("sel"); b.classList.add("wrong"); b.setAttribute("aria-pressed","false"); });
      count();
      oops(el.querySelector(".radarbg"), bad.length ? L("Ada isyarat palsu (merah). Buang dan imbas lagi!","اد ايشارت ڤلسو (ميره). بواڠ دان ايمبس لاڬي!")
        : L(`Belum lengkap: masih ada ${need-good} lagi.`,`بلوم لڠکڤ: ماسيه اد ${need-good} لاڬي.`));
    });
  },

  /* Tadahan hujan: titisan perkataan mengisi tempat kosong */
  tadahan(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    const parts = T(g.text).split("___");
    el.innerHTML = `<div class="gauge"><div class="tube" id="tube" aria-hidden="true"><i></i></div>
        <p class="sent">${parts[0]}<span class="blank" id="blank">💧💧</span>${parts[1]||""}</p></div>
      <div class="g2">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">💧 ${T(o.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return; const o = opts[+b.dataset.i];
      if(o.ok){ done = true; sfx.drop(); b.classList.add("right"); const bl = el.querySelector("#blank"); bl.textContent = T(o.x); bl.classList.add("fill");
        el.querySelector("#tube").classList.add("full"); clearHint(); setTimeout(win, 600); }
      else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Titisan itu tidak sesuai. Cuba lagi!","تيتيسن ايت تيدق سسواي. چوبا لاڬي!")); }
    }));
  },

  /* Isobar: sambungkan kad kiri dengan kad kanan yang sepadan */
  isobar(el, g){
    const n = g.pairs.length, left = shuffle([...Array(n).keys()]); let right; do{ right = shuffle([...Array(n).keys()]); }while(n>1 && right.some((x,i)=>x===left[i]));
    const COL = ["#FFD166","#8ECAE6","#B5E48C","#FFADAD","#CDB4DB","#FFC6FF"];
    let pick = null, k = 0;
    el.innerHTML = `<div class="iso"><div class="col">${left.map(p=>`<button class="opt l" data-p="${p}">${TX(g.pairs[p][0])}</button>`).join("")}</div>
      <div class="col">${right.map(p=>`<button class="opt r" data-p="${p}">${TX(g.pairs[p][1])}</button>`).join("")}</div></div>
      <div class="cnt">〰️ ${L("Tekan kad kiri, kemudian kad kanan yang sepadan.","تکن کد کيري، کمودين کد کانن يڠ سڤادن.")}</div>`;
    el.querySelectorAll(".opt.l").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return; el.querySelectorAll(".opt.l").forEach(x=>x.classList.remove("pick")); b.classList.add("pick"); pick = b; sfx.tick();
    }));
    el.querySelectorAll(".opt.r").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(!pick){ toast(L("Pilih kad di sebelah kiri dahulu.","ڤيليه کد د سبله کيري دهولو.")); return; }
      if(b.dataset.p===pick.dataset.p){
        const c = COL[k%COL.length]; [pick,b].forEach(x=>{ x.classList.remove("pick"); x.classList.add("done"); x.disabled = true; x.style.background = c; });
        pick = null; k++; sfx.blip(); clearHint(); if(k===n) setTimeout(win, 400);
      } else oops(b, L("Garisan isobar itu tidak bersambung. Cuba pasangan lain!","ڬاريسن ايسوبر ايت تيدق برسمبوڠ. چوبا ڤاسڠن لاين!"));
    }));
  },

  /* Ribut: tiup awan yang ganjil, beberapa pusingan */
  ribut(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const opts = mix(g.rounds[r].map((x,i)=>({x, odd:i===0})));
      el.innerHTML = `<div class="sky"><div class="g2">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-odd="${o.odd?1:0}">☁️ ${T(o.x)}</button>`).join("")}</div></div>
        <div class="cnt">🌪️ ${L(`Pusingan ${r+1} daripada ${g.rounds.length}`,`ڤوسيڠن ${r+1} درڤد ${g.rounds.length}`)}</div>`;
      busy = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(busy || b.disabled) return;
        if(opts[+b.dataset.i].odd){ busy = true; sfx.whoosh(); b.classList.add("gone"); clearHint(); r++;
          if(r<g.rounds.length) setTimeout(draw, 650); else setTimeout(win, 650); }
        else { b.disabled = true; b.style.opacity = ".5"; oops(b, L("Awan itu sekumpulan dengan yang lain. Cari yang ganjil!","اوان ايت سکومڤولن دڠن يڠ لاين. چاري يڠ ڬنجيل!")); }
      }));
    };
    draw();
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t5-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan stesen sebelumnya dahulu 🔒","سلسايکن ستيسن سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} stesen untuk membuka Menara Radar 📡`,`سلسايکن سموا ${STATIONS.length} ستيسن اونتوق ممبوک منارا رادر 📡`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
