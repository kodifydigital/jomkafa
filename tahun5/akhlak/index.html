<html lang="ms">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Studio Rakaman Adab • Akhlak Tahun 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Concert+One&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Akhlak Tahun 5: "Studio Rakaman Adab" — studio TV, lampu ON AIR, papan klaper, Didi si dolfin pengacara ===== */
:root{
  --rig1:#1C0D3A; --rig2:#3A1C6E; --bg:#F7F1FF; --card:#FFFFFF; --ink:#22123E; --muted:#66588A; --line:#22123E;
  --brand:#7B2FBE; --brand2:#5A1F92; --hot:#FF3D6E; --hot2:#D61F50; --amber:#FFC23D; --sea:#2EA8E6; --sea2:#1677B3;
  --soft:#EFE6FF; --ok:#14A86B; --okbg:#DCF8EA; --bad:#E5364F; --badbg:#FFE1E6; --note:#FFF4CF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --rig1:#07030F; --rig2:#1A0D33; --bg:#120A24; --card:#22163D; --ink:#F4EEFF; --muted:#BFB2DD; --line:#05020C;
    --soft:#2F2152; --okbg:#123A2A; --badbg:#47202A; --note:#3A3016; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:18px;line-height:1.45;
  background:linear-gradient(180deg,var(--rig1) 0,var(--rig2) 190px,var(--bg) 470px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-weight:600;font-size:19px;line-height:1.85}
h1,h2,h3,.disp{font-family:"Concert One","Nunito",system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .disp{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--amber);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 70px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;font-weight:400}

/* pancaran lampu studio */
.beams{position:fixed;inset:0 0 auto 0;height:330px;pointer-events:none;z-index:-1;overflow:hidden}
.beams i{position:absolute;top:-40px;width:140px;height:380px;background:linear-gradient(180deg,rgba(255,230,160,.30),rgba(255,230,160,0));
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);transform-origin:50% 0;animation:sweep 7s ease-in-out infinite alternate}
.beams i:nth-child(1){left:6%;--r:-18deg}.beams i:nth-child(2){left:42%;--r:8deg;animation-delay:-2s}.beams i:nth-child(3){right:4%;--r:20deg;animation-delay:-4s}
@keyframes sweep{from{transform:rotate(var(--r))}to{transform:rotate(calc(var(--r)*-1))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-grid;place-items:center;
  font-size:21px;font-weight:900;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:0 10px}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--amber);color:#22123E;border:3px solid var(--line);border-radius:999px;padding:5px 13px;font-weight:900;box-shadow:0 4px 0 var(--line);white-space:nowrap}

/* hero */
.hero{display:flex;align-items:center;gap:12px;color:#fff;margin:4px 0 12px}
.hero .didi{width:104px;flex:0 0 104px}
.hero h1{margin:0;font-size:31px;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hero p{margin:4px 0 0;font-size:16px;opacity:.95}
html[dir="rtl"] .hero h1{font-size:28px;line-height:1.5}
.didi{display:block}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}

/* gulungan filem (pelekat) */
.sttl{margin:6px 2px 6px;font-weight:900;color:#fff;font-size:16px}
.reel{display:flex;gap:4px;overflow-x:auto;background:#151515;border:3px solid var(--line);border-radius:12px;padding:16px 8px;position:relative;margin-bottom:14px;
  background-image:radial-gradient(circle,#fff 0 3px,transparent 3.5px),radial-gradient(circle,#fff 0 3px,transparent 3.5px);
  background-size:16px 8px,16px 8px;background-position:4px 3px,4px calc(100% - 3px);background-repeat:repeat-x}
.reel span{flex:0 0 46px;height:44px;border-radius:6px;background:#3a3a3a;display:grid;place-items:center;font-size:24px;filter:grayscale(1);opacity:.35}
.reel span.got{background:#FFF4CF;filter:none;opacity:1}

/* koridor studio: pintu */
.hall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;padding:4px 2px 10px}
.door{position:relative;min-width:0;border:3px solid var(--line);border-radius:18px 18px 8px 8px;background:var(--card);box-shadow:0 5px 0 var(--line);
  padding:28px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;overflow-wrap:anywhere}
.door::before{content:"";position:absolute;inset:6px 6px auto 6px;height:10px;border-radius:6px;background:var(--c,var(--brand));opacity:.9}
.door .lamp{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#4A3A5E;color:#C8BEDA;border:3px solid var(--line);border-radius:8px;
  font:12px/1 "Concert One",sans-serif;padding:4px 8px;letter-spacing:1px;white-space:nowrap;direction:ltr}
.door.now .lamp{background:var(--hot);color:#fff;box-shadow:0 0 14px 4px rgba(255,61,110,.65);animation:glow 1.2s ease-in-out infinite alternate}
.door.done .lamp{background:var(--ok);color:#fff}
@keyframes glow{from{box-shadow:0 0 6px 1px rgba(255,61,110,.5)}to{box-shadow:0 0 18px 6px rgba(255,61,110,.8)}}
.door .ic{font-size:40px;line-height:1.1}
.door .no{font:13px/1 "Concert One",sans-serif;color:var(--muted);letter-spacing:1px}
html[dir="rtl"] .door .no{font-family:"Noto Naskh Arabic",serif;font-size:14px;line-height:1.4}
.door .nm{font-weight:900;font-size:16px;line-height:1.25}
html[dir="rtl"] .door .nm{font-size:17px;line-height:1.7}
.door .st{font-size:15px;min-height:20px;letter-spacing:1px}
.door .knob{position:absolute;bottom:40%;right:10px;width:9px;height:9px;border-radius:50%;background:var(--amber);border:2px solid var(--line)}
html[dir="rtl"] .door .knob{right:auto;left:10px}
.door.lock{opacity:.6;background:repeating-linear-gradient(135deg,var(--card) 0 12px,var(--soft) 12px 24px)}
.door.lock .ic{filter:grayscale(1)}
.door .peek{position:absolute;bottom:-8px;left:-12px;width:50px;z-index:2}
html[dir="rtl"] .door .peek{left:auto;right:-12px}
.door:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.stage{grid-column:1/-1;border-radius:22px;padding:30px 12px 14px;background:linear-gradient(180deg,#5A1F92,#2A1450);color:#fff}
.stage::before{background:repeating-linear-gradient(90deg,#FF3D6E 0 18px,#FFC23D 18px 36px)}
.stage .no{color:#E6D9FF}
.stage.lock{background:repeating-linear-gradient(135deg,#4A3A5E 0 12px,#3A2C4E 12px 24px)}
.floor{grid-column:1/-1;text-align:center;font-weight:900;color:var(--muted);font-size:15px;padding-top:4px}
</style>
<style>
/* kepala stesen: "lower third" */
.shead{display:flex;align-items:center;gap:10px;margin:2px 0 12px;background:var(--card);border:3px solid var(--line);border-radius:14px;
  box-shadow:0 4px 0 var(--line);padding:6px 10px;border-inline-start:12px solid var(--c,var(--brand))}
.shead .ic{font-size:34px;flex:0 0 auto}
.shead h2{margin:0;font-size:22px;line-height:1.15}
html[dir="rtl"] .shead h2{font-size:21px;line-height:1.6}
.shead small{color:var(--muted);display:block;font-size:14px;line-height:1.3}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:0 6px 0 var(--line);padding:16px 14px;position:relative;overflow-wrap:anywhere}
/* kad baca: skrip */
.slate{display:flex;align-items:center;gap:8px;margin:-16px -14px 12px;padding:8px 12px;border-radius:17px 17px 0 0;color:#fff;font:15px/1.2 "Concert One",sans-serif;
  background:repeating-linear-gradient(-45deg,#22123E 0 16px,#fff 16px 32px);border-bottom:3px solid var(--line)}
.slate b{background:#22123E;padding:4px 10px;border-radius:8px;letter-spacing:1px;direction:ltr}
.slate .sp{flex:1}
.rpic{font-size:54px;text-align:center;line-height:1.2;margin:2px 0 6px}
.rh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:23px;line-height:1.2;color:var(--brand)}
html[dir="rtl"] .rh{font-size:22px;line-height:1.7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rh{color:#D7B8FF}}
.say{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--amber);font-size:19px;display:grid;place-items:center;padding:0}
.rtext{margin:0 0 8px}
.rlist{list-style:none;margin:6px 0 8px;padding:0;display:grid;gap:7px}
.rlist li{background:var(--soft);border-radius:12px;padding:8px 12px 8px 42px;position:relative;line-height:1.35}
html[dir="rtl"] .rlist li{padding:6px 42px 6px 12px;line-height:1.7}
.rlist li::before{content:"🎬";position:absolute;left:10px;top:7px;font-size:18px}
html[dir="rtl"] .rlist li::before{left:auto;right:10px}
.rlist.bad li{background:var(--badbg)}.rlist.bad li::before{content:"✂️"}
.rlist.good li{background:var(--okbg)}.rlist.good li::before{content:"🌟"}
.abox{background:var(--note);border:3px dashed var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;display:grid;gap:6px}
.abox .ar{font-size:26px;line-height:2;text-align:center}
.abox .mk{font-style:italic}
.abox small{color:var(--muted)}
.tip{display:flex;gap:8px;background:var(--soft);border-radius:12px;padding:8px 10px;margin:8px 0}
.ref{font-size:14px;color:var(--muted);margin:8px 0 4px}
.navr{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--brand);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);padding:8px 12px}
.btn.go{background:var(--hot)}.btn.alt{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}.dots i.on{background:var(--hot)}
/* bar kemajuan: pita filem + REC */
.prog{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.rec{flex:0 0 auto;background:#22123E;color:#fff;border-radius:10px;padding:4px 9px;font:14px/1.2 "Concert One",sans-serif;border:3px solid var(--line);direction:ltr}
.rec i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hot);margin-right:5px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.film{flex:1;display:flex;gap:3px;background:#151515;border:3px solid var(--line);border-radius:8px;padding:8px 5px;
  background-image:radial-gradient(circle,#fff 0 2px,transparent 2.5px),radial-gradient(circle,#fff 0 2px,transparent 2.5px);background-size:10px 6px;background-position:2px 1px,2px calc(100% - 1px);background-repeat:repeat-x}
.film span{flex:1;height:18px;border-radius:3px;background:#444}.film span.ok{background:var(--amber)}.film span.cur{background:var(--hot)}
/* soalan */
.q{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.q p{margin:0;font-weight:900;font-size:19px}
.qar{font-size:25px;line-height:2;text-align:center;background:var(--note);border-radius:12px;padding:6px 10px;margin-bottom:10px}
.hint{margin-top:12px;background:var(--badbg);border:3px solid var(--bad);border-radius:14px;padding:8px 12px;font-weight:800}
.cnt{text-align:center;color:var(--muted);font-weight:800;font-size:15px;margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-width:0;overflow-wrap:anywhere;min-height:60px;border:3px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--line);
  padding:8px 10px;font-weight:800;font-size:17px;line-height:1.3;text-align:center}
html[dir="rtl"] .opt{line-height:1.7;font-size:18px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);opacity:.75}
.opt.sel{background:var(--amber);color:#22123E}
/* maklum balas */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 10px calc(12px + env(safe-area-inset-bottom,0px));animation:up .3s ease-out}
.fb .in{width:100%;max-width:660px;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 -4px 0 var(--ok),0 8px 30px rgba(0,0,0,.35);padding:12px 14px}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .didi{width:70px;flex:0 0 70px}
.fb strong{font:24px/1.1 "Concert One",sans-serif;color:var(--ok)}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;line-height:1.6}
.fb p{margin:2px 0 0;font-size:16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
/* keputusan */
.res{text-align:center}
.res .didi{width:130px;margin:0 auto}
.res .btn{width:100%}
.stars{font-size:46px;margin:6px 0}
.stars span{display:inline-block;animation:pop .5s backwards}.stars .off{filter:grayscale(1);opacity:.3}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border-radius:14px;padding:8px;margin:10px 0;font-weight:900}
.gotst span{font-size:38px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22123E;color:#fff;border-radius:14px;padding:10px 16px;z-index:60;max-width:90vw;text-align:center;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
<style>
/* ===== permainan ===== */
/* klaper */
.clap{border:3px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;background:#2B2B2B;color:#fff}
.clbar{height:26px;background:repeating-linear-gradient(-45deg,#fff 0 14px,#22123E 14px 28px);border-bottom:3px solid var(--line);transform-origin:4% 100%;transform:rotate(-14deg);transition:transform .18s}
html[dir="rtl"] .clbar{transform-origin:96% 100%;transform:rotate(14deg)}
.clap.snap .clbar{transform:none}
.clbody{padding:8px 12px 12px;text-align:center}
.clbody .sc{display:inline-block;font:13px/1 "Concert One",sans-serif;border:2px solid #fff;border-radius:6px;padding:3px 8px;letter-spacing:1px;direction:ltr}
.clbody .scene{font-size:48px;line-height:1.25;margin:4px 0}
.clbody .sit{margin:0;font-size:17px}
/* mikrofon */
.line{background:var(--soft);border-radius:14px;padding:12px;margin-bottom:12px;font-size:19px;line-height:1.6}
html[dir="rtl"] .line{line-height:2}
.line.ar{font-size:25px;text-align:center;line-height:2.1}
.gap{display:inline-block;min-width:90px;border-bottom:4px dashed var(--hot);padding:0 6px;text-align:center;color:var(--hot2);font-weight:900}
.gap.fill{border-bottom-style:solid;border-color:var(--ok);color:var(--ok)}
.mic::before{content:"🎤 "}
.mic.ar{font-size:24px;font-family:"Amiri",serif;font-weight:400}
/* tepuk */
.tv{border:4px solid var(--line);border-radius:18px;background:#22123E;padding:10px;margin-bottom:12px;position:relative}
.tv::after{content:"";position:absolute;left:50%;bottom:-16px;width:60px;height:12px;transform:translateX(-50%);background:var(--line);border-radius:0 0 8px 8px}
.scr{background:linear-gradient(160deg,#3B6FD8,#1B2E6E);color:#fff;border-radius:10px;min-height:110px;display:grid;place-items:center;padding:12px;text-align:center;font-size:19px;font-weight:900}
.tvb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
.tpk{min-height:66px;border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--line);font-weight:900;font-size:18px;color:#fff;min-width:0}
.tpk.y{background:var(--ok)}.tpk.n{background:var(--bad)}
.tpk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
/* mixer */
.desk{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px;background:#2A2238;border:3px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px}
.ch{min-width:0;border:3px solid var(--line);border-radius:12px;background:#3D3352;color:#fff;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:15px;line-height:1.25;text-align:center}
html[dir="rtl"] .ch{font-size:16px;line-height:1.6}
.ch .fd{width:22px;height:70px;border-radius:11px;background:#151018;border:2px solid #000;position:relative;overflow:hidden}
.ch .fd i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--ok),var(--amber),var(--hot));transition:height .3s}
.ch.arm{outline:4px solid var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-width:0;max-width:100%;overflow-wrap:anywhere;border:3px solid var(--line);border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--line);padding:7px 14px;font-weight:800;font-size:16px;line-height:1.3}
html[dir="rtl"] .chip{line-height:1.7;font-size:17px}
.chip.sel{background:var(--amber);color:#22123E}.chip.used{visibility:hidden}
.chip.on{background:var(--hot);color:#fff}
.chip.ok{background:var(--okbg);border-color:var(--ok)}
/* kamera */
.camw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.camw .col{display:grid;gap:8px;align-content:start;min-width:0}
.camw .hd{text-align:center;font:15px/1.2 "Concert One",sans-serif;color:var(--muted)}
html[dir="rtl"] .camw .hd{font-family:"Noto Naskh Arabic",serif}
.kb{min-width:0;overflow-wrap:anywhere;border:3px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);padding:8px;font-weight:800;font-size:15px;line-height:1.3;min-height:54px}
html[dir="rtl"] .kb{line-height:1.65;font-size:16px}
.kb.cm{background:var(--soft)}
.kb.sel{background:var(--amber);color:#22123E}.kb.ok{background:var(--okbg);border-color:var(--ok);opacity:.8}
/* sunting: garis masa */
.tl{display:grid;gap:6px;background:#1E1830;border:3px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px}
.slot{display:flex;align-items:center;gap:8px;min-height:44px;border:2px dashed #6E6290;border-radius:10px;color:#BFB2DD;padding:4px 8px;font-size:15px;line-height:1.3}
html[dir="rtl"] .slot{line-height:1.6;font-size:16px}
.slot b{flex:0 0 28px;height:28px;border-radius:8px;background:#3D3352;color:#fff;display:grid;place-items:center;font:14px "Concert One",sans-serif}

{ id:8, icon:"🌋", c:"#E5364F", sticker:"🧊",
  t:["Sifat Ghadab","صيفت غضب"], u:["Sifat mazmumah • ms. 36–40","صيفت مذمومة • م.س. 36–40"],
  read:[
    { pic:"🏜️👥😡", h:["Kisah Nabi Muhammad SAW bersama dua orang pemuda","قصه نبي محمد ﷺ برسام دوا اورڠ ڤمودا"],
      text:["Pada suatu hari, ketika Nabi duduk bersama sahabat-sahabat Nabi, tiba-tiba ada dua orang lelaki yang mencaci antara satu sama lain. Seorang daripadanya mencaci dalam keadaan yang sangat marah, wajahnya kemerahan sehingga urat lehernya menegang. Melihat keadaan itu, Nabi Muhammad SAW bersabda yang bermaksud: “Sesungguhnya aku mengetahui satu kalimah yang sekiranya ia mengucapkannya akan menghilangkan kemarahannya.” Kalimah itu ialah:","ڤد سواتو هاري، كتيک نبي دودوق برسام صحابت٢ نبي، تيبا٢ اد دوا اورڠ للاکي يڠ منچاچي انتارا ساتو سام لاٴين. سأورڠ درڤداڽ منچاچي دالم كأداٴن يڠ ساڠت ماره، وجهڽ كميرهن سهيڠڬ اورت ليهيرڽ منڬڠ. مک مليهت كأداٴن يڠ دمكين ايت نبي محمد ﷺ برسبدا يڠ برمقصود: “سسوڠڬوهڽ اكو مڠتاهوٴي ساتو كليمه يڠ سكيراڽ اي مڠوچڤكنڽ اكن مڠهيلڠكن كمارهنڽ.” نبي محمد ﷺ برسبدا:"],

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

  no:   () => tone([[230,.18,"square"],[170,.22,"square"]]),
  clap: () => tone([[1500,.03,"square"],[300,.06,"square"]]),
  cheer:() => tone([[880,.05,"triangle"],[1180,.05,"triangle"],[1480,.08,"triangle"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.32]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const noArab = s => String(s||"").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/[“”]/g,"").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const clean = noArab(text).replace(/…/g," ... ").replace(/___/g," ... ").replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(/\bRA\b/g,"radhiallahu anhum");
    if(!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

// salah: kira kesilapan, goncang, tunjuk petunjuk
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🐬 ${hint || L("Cut! Cuba lagi.","كت! چوبا لاڬي.")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Cut! Hebat!","كت! هيبت!"],["Bagus!","باڬوس!"],["Syabas!","شاباس!"],["Pandai!","ڤنداي!"],["MasyaAllah!","ماشاءالله!"]];
function win(extra){
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${didi()}<div><strong>${T(p)}</strong><p>${T(g.e)}${extra?` <b class="zap">${extra}</b>`:""}</p></div></div>
    <button class="btn go" data-act="next">${L("Babak seterusnya","بابق ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "res";
  S.res = { stars, first: !prev, openedFinal: !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Satu rakaman sempurna! Kamu memang beradab.","ساتو راكمن سمڤورنا! كامو مماڠ برادب."] : stars===2 ? ["Rakaman bagus! Cuba lagi untuk 3 bintang.","راكمن باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom rakam semula.","شاباس كران منچوبا! جوم راكم سمولا."];
  const title = stars===3 ? ["Tayangan hebat!","تاياڠن هيبت!"] : stars===2 ? ["Tayangan bagus!","تاياڠن باڬوس!"] : ["Tayangan selesai!","تاياڠن سلساي!"];
  app.innerHTML = head() + `<section class="card res">
      ${didi("bob")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Pelekat baharu untuk gulungan filem kamu!","ڤلقت بهارو اونتوق ڬولوڠن فيلم كامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🎬 ${L("Siaran Langsung Akhir kini dibuka!","سيارن لڠسوڠ اخير كيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🚪 ${L("Kembali ke koridor","کمبالي ک كوريدور")}</button>
      <button class="btn alt" style="margin-top:10px;width:100%" data-act="again">🔁 ${L("Rakam semula","راكم سمولا")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN (tema studio) ===================== */
const opt = (o,i,cls="") => `<button class="opt ${cls}" data-i="${i}">${T(o)}</button>`;
const GAMES = {
  /* Papan klaper: babak + pilih tindakan beradab (4 pilihan) */
  klaper(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x,i})));
    let take = 1, done = false;
    el.innerHTML = `<div class="clap" id="clap"><div class="clbar"></div><div class="clbody">
        <span class="sc" id="take">${L("BABAK","بابق")} ${S.gi+1} • TAKE 1</span><div class="scene" aria-hidden="true">${g.scene}</div><p class="sit">${T(g.sit)}</p></div></div>
      <div class="grid2">${opts.map(o=>opt(o.x,o.i)).join("")}</div>`;
    speak(RU(g.sit));
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(+b.dataset.i===0){ done = true; b.classList.add("right"); $("#clap").classList.add("snap"); sfx.clap(); setTimeout(win, 350); }
      else { b.classList.add("wrong"); take++; $("#take").textContent = `${L("BABAK","بابق")} ${S.gi+1} • TAKE ${take}`;
        oops(b, L("Take semula! Apakah tindakan yang beradab?","تيک سمولا! اڤاكه تيندقن يڠ برادب؟")); }
    }));
  },

  /* Mikrofon: isi tempat kosong skrip (teks atau ayat al-Quran) */
  mikrofon(el, g){
    let line, opts, ans, isAr = !!g.qk;
    if(isAr){
      const w = QW(QF(...g.qk)); ans = w[g.gap];
      const others = shuffle([...new Set(w.filter((x,i)=>i!==g.gap && x!==ans))]).slice(0,3);
      opts = shuffle([ans, ...others]).map(x=>({x, ok:x===ans}));
      line = w.map((x,i)=> i===g.gap ? `<span class="gap" id="gap">؟</span>` : x).join(" ");
    } else {
      opts = shuffle(g.a.map((x,i)=>({x:T(x), ok:i===0}))); ans = T(g.a[0]);
      line = T(g.s).replace("___", `<span class="gap" id="gap">?</span>`);
    }
    el.innerHTML = `<div class="line ${isAr?"ar":""}" ${isAr?'lang="ar"':""}>${line}</div>
      <div class="grid2">${opts.map((o,i)=>`<button class="opt mic ${isAr?"ar":""}" data-i="${i}" data-ok="${o.ok?1:0}">${o.x}</button>`).join("")}</div>`;
    let done = false;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(b.dataset.ok==="1"){ done = true; b.classList.add("right"); const gp = $("#gap"); gp.textContent = ans; gp.classList.add("fill"); sfx.tick(); setTimeout(win, 450); }
      else { b.classList.add("wrong"); oops(b, isAr ? L("Bukan perkataan itu. Baca semula ayat pada kad skrip.","بوكن ڤركاتاٴن ايت. باچ سمولا ايات ڤد كد سكريڤ.") : L("Mikrofon salah! Cuba perkataan lain.","ميكروفون ساله! چوبا ڤركاتاٴن لاٴين.")); }
    }));
  },

  /* Tepuk atau potong: penonton studio menilai setiap kenyataan */
  tepuk(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="tv"><div class="scr" id="scr">${T(items[k][0])}</div></div>
        <div class="tvb"><button class="tpk y" data-v="1">👏 ${L("Tepuk!","تڤوق!")}</button><button class="tpk n" data-v="0">✂️ ${L("Potong!","ڤوتوڠ!")}</button></div>
        <div class="cnt">${k+1} / ${items.length}</div>`;
      speak(RU(items[k][0]));
      el.querySelectorAll(".tpk").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.v===items[k][1]){ items[k][1] ? sfx.cheer() : sfx.clap(); k++; clearHint(); if(k<items.length) draw(); else win(); }
        else oops($("#scr"), items[k][1] ? L("Ini perbuatan terpuji. Beri tepukan!","اين ڤربواتن ترڤوجي. بري تڤوقن!") : L("Ini perbuatan tidak baik. Potong babak ini!","اين ڤربواتن تيدق باٴيق. ڤوتوڠ بابق اين!"));
      }));
    };
    draw();
  },

  /* Meja mixer: pilih klip, kemudian tekan saluran yang betul */
  mixer(el, g){
    const n = g.ch.length, items = shuffle(g.items.map((x,i)=>({x,i})));
    const tot = g.ch.map((_,c)=>g.items.filter(x=>x[1]===c).length), got = g.ch.map(()=>0);
    let sel = null, left = g.items.length;
    el.innerHTML = `<div class="desk" style="--n:${n}">${g.ch.map((c,ci)=>`<button class="ch" data-c="${ci}"><span>${T(c)}</span><span class="fd"><i></i></span><span class="ct">0/${tot[ci]}</span></button>`).join("")}</div>
      <div class="chips">${items.map(o=>`<button class="chip" data-i="${o.i}">${T(o.x[0])}</button>`).join("")}</div>
      <div class="cnt">🎚️ ${L("Tekan klip, kemudian tekan saluran.","تکن كليڤ، كمودين تکن سالورن.")}</div>`;
    const arm = on => el.querySelectorAll(".ch").forEach(c=>c.classList.toggle("arm", on));
    el.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used")) return;
      el.querySelectorAll(".chip.sel").forEach(x=>x.classList.remove("sel"));
      sel = +b.dataset.i; b.classList.add("sel"); arm(true); sfx.tick(); speak(RU(g.items[sel][0]));
    }));
    el.querySelectorAll(".ch").forEach(c => c.addEventListener("click", () => {
      if(sel===null){ toast(L("Pilih satu klip dahulu 🎞️","ڤيليه ساتو كليڤ دهولو 🎞️")); return; }
      const ci = +c.dataset.c, chip = el.querySelector(`.chip[data-i="${sel}"]`);
      if(g.items[sel][1]===ci){
        chip.classList.remove("sel"); chip.classList.add("used"); got[ci]++; left--; sel = null; arm(false); sfx.tick(); clearHint();
        c.querySelector(".fd i").style.height = (got[ci]/tot[ci]*100)+"%"; c.querySelector(".ct").textContent = `${got[ci]}/${tot[ci]}`;
        if(!left) setTimeout(win, 300);
      } else oops(c, L("Saluran salah! Baca semula klip itu.","سالورن ساله! باچ سمولا كليڤ ايت."));
    }));
  },

  /* ON AIR: pilih SEMUA jawapan betul, kemudian siarkan */
  onair(el, g){
    const items = shuffle(g.items.map((x,i)=>({x,i})));
    el.innerHTML = `<div class="chips">${items.map(o=>`<button class="chip" data-i="${o.i}" aria-pressed="false">${T(o.x[0])}</button>`).join("")}</div>
      <button class="btn go" id="onb" style="width:100%;margin-top:14px">🔴 ON AIR</button>`;
    el.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { const on = b.classList.toggle("on"); b.setAttribute("aria-pressed", on); sfx.tick(); }));
    $("#onb").addEventListener("click", () => {
      const on = [...el.querySelectorAll(".chip")].map(b=>[+b.dataset.i, b.classList.contains("on")]);
      const wrong = on.filter(([i,s])=>s && !g.items[i][1]).length, miss = on.filter(([i,s])=>!s && g.items[i][1]).length;
      if(!wrong && !miss){ el.querySelectorAll(".chip.on").forEach(b=>b.classList.add("ok")); sfx.cheer(); $("#onb").disabled = true; setTimeout(win, 300); }
      else oops($("#onb"), wrong ? L(`Siaran ditahan: ${wrong} klip yang dipilih bukan jawapannya.`,`سيارن دتاهن: ${wrong} كليڤ يڠ دڤيليه بوكن جاوڤنڽ.`) : L(`Hampir! Masih ada ${miss} jawapan belum dipilih.`,`همڤير! ماسيه اد ${miss} جاوڤن بلوم دڤيليه.`));
    });
  },

  /* Kamera ke monitor: padankan pasangan */
  kamera(el, g){
    const L1 = shuffle(g.pairs.map((_,i)=>i)); let R1; do{ R1 = shuffle(L1); }while(g.pairs.length>1 && R1.every((x,i)=>x===L1[i]));
    let sel = null, left = g.pairs.length;
    el.innerHTML = `<div class="camw"><div class="col"><div class="hd">🎥 ${L("Kamera","كاميرا")}</div>${L1.map(i=>`<button class="kb cm" data-l="${i}">${T(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="col"><div class="hd">🖥️ ${L("Monitor","مونيتور")}</div>${R1.map(i=>`<button class="kb" data-r="${i}">${T(g.pairs[i][1])}</button>`).join("")}</div></div>
      <div class="cnt">🎥 ${L("Tekan kamera, kemudian monitor yang sepadan.","تکن كاميرا، كمودين مونيتور يڠ سڤادن.")}</div>`;
    el.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("ok")) return;
      el.querySelectorAll("[data-l].sel").forEach(x=>x.classList.remove("sel")); sel = +b.dataset.l; b.classList.add("sel"); sfx.tick();
    }));
    el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("ok")) return;
      if(sel===null){ toast(L("Tekan kamera dahulu 🎥","تکن كاميرا دهولو 🎥")); return; }
      if(+b.dataset.r===sel){ const l = el.querySelector(`[data-l="${sel}"]`); l.classList.remove("sel"); l.classList.add("ok"); b.classList.add("ok"); l.disabled = b.disabled = true; sel = null; sfx.tick(); clearHint(); if(!--left) setTimeout(win, 300); }
      else oops(b, L("Gambar tidak sepadan. Cuba monitor lain.","ڬمبر تيدق سڤادن. چوبا مونيتور لاٴين."));
    }));
  },

  /* Sunting: letak klip pada garis masa ikut turutan */
  sunting(el, g){
    const order = mix(g.steps.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="tl" id="tl">${g.steps.map((_,i)=>`<div class="slot" data-s="${i}"><b>${i+1}</b><span>…</span></div>`).join("")}</div>
      <div class="clips">${order.map(i=>`<button class="clip" data-i="${i}"><span class="em" aria-hidden="true">${g.steps[i][0]}</span><span>${T(g.steps[i][1])}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".clip").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=g.steps.length) return;
      if(+b.dataset.i===k){
        const s = el.querySelector(`.slot[data-s="${k}"]`); s.classList.add("f"); s.querySelector("span").textContent = g.steps[k][0]+" "+T(g.steps[k][1]);
        b.classList.add("used"); k++; sfx.tick(); clearHint();
        if(k===g.steps.length) setTimeout(win, 350);
      } else oops(b, L(`Bukan klip itu. Apakah babak ke-${k+1}?`,`بوكن كليڤ ايت. اڤاكه بابق ک-${k+1}؟`));
    }));
  },

  /* Skrip teleprompter: susun perkataan ayat al-Quran (dari kanan) */
  skrip(el, g){
    const w = QW(qText(g.qk)), order = mix(w.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="prompter ar" id="pr" lang="ar"></div>
      <div class="words">${order.map(i=>`<button class="wd" data-i="${i}" lang="ar">${w[i]}</button>`).join("")}</div>
      <div class="cnt">📜 ${L("Tekan perkataan ikut turutan ayat. Mula dari kanan!","تکن ڤركاتاٴن ايکوت توروتن ايات. مولا دري كانن!")}</div><div id="mk"></div>`;
    el.querySelectorAll(".wd").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=w.length) return;
      if(w[+b.dataset.i]===w[k]){
        b.classList.add("used"); $("#pr").textContent = w.slice(0,k+1).join(" "); k++; sfx.tick(); clearHint();
        if(k===w.length){ $("#mk").innerHTML = `<div class="abox" style="margin-top:12px"><span class="mk">${T(g.mk)}</span></div>`; setTimeout(win, 600); }
      } else oops(b, L(`Bukan perkataan itu. Lihat semula ayat pada kad skrip.`,`بوكن ڤركاتاٴن ايت. ليهت سمولا ايات ڤد كد سكريڤ.`));
    }));
  },

  /* Rakaman pantas: 4 soalan berturut-turut, ada bonus ⚡ kalau cepat */
  rakam(el, g){
    let k = 0, fast = 0, t0 = Date.now(), tq = Date.now();
    const draw = () => {
      const q = g.qs[k], opts = shuffle(q[1].map((x,i)=>({x,i})));
      el.innerHTML = `<div class="recbar"><span><span class="dot"></span>REC <span id="tm">00:00</span></span><span>${k+1}/${g.qs.length} ⚡${fast}</span></div>
        <p class="rq">${T(q[0])}</p><div class="grid1">${opts.map(o=>opt(o.x,o.i)).join("")}</div>`;
      tq = Date.now(); speak(RU(q[0]));
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(b.classList.contains("wrong") || k>=g.qs.length) return;
        if(+b.dataset.i===0){ if(Date.now()-tq < 8000) fast++; k++; sfx.tick(); clearHint(); if(k<g.qs.length) draw(); else { clearInterval(iv); win(`⚡ ${fast}/${g.qs.length} ${L("jawapan pantas!","جاوڤن ڤنتس!")}`); } }
        else { b.classList.add("wrong"); oops(b, L("Salah rakam! Cuba jawapan lain.","ساله راكم! چوبا جاوڤن لاٴين.")); }
      }));
    };
    const iv = setInterval(() => { const tm = document.getElementById("tm"); if(!tm){ clearInterval(iv); return; } const s = Math.floor((Date.now()-t0)/1000); tm.textContent = `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }, 500);
    draw();
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t5-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Tamatkan studio sebelumnya dahulu 🔒","تامتكن ستوديو سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Tamatkan semua ${STATIONS.length} studio untuk membuka Siaran Langsung Akhir 🎬`,`تامتكن سموا ${STATIONS.length} ستوديو اونتوق ممبوک سيارن لڠسوڠ اخير 🎬`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa selepas tukar tulisan/suara (tanpa ulang bunyi/konfeti)
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
