<title>Perpustakaan Sirah • Sirah Tahun 5</title>

<link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@700;800&family=Nunito:wght@500;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Sirah Tahun 5: "Perpustakaan Sirah" — rak buku per bab, lampu baca, dakwat & pena, maskot Cik Tupai ===== */
:root{
  --bg:#F3E7D0; --paper:#FFF8EA; --card:#FFFDF7; --ink:#2B1D14; --muted:#6E5A48; --line:#2B1D14;
  --wood:#8A5434; --wood2:#5C3420; --wood3:#3E2214; --brand:#8C2F39; --brand2:#6A1F28; --gold:#D4A23C; --gold2:#B07F1E;
  --green:#2F6B57; --navy:#26365C; --lamp:#FFD27A; --dust:#CDBFA6;
  --ok:#2F7D4F; --okbg:#E1F3E4; --bad:#C0392B; --badbg:#FBE1DC; --note:#FFF1C9;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17100B; --paper:#2A1E15; --card:#241A12; --ink:#F6EBDC; --muted:#CDB89E; --line:#0A0603;
    --wood:#5E3822; --wood2:#3F2516; --wood3:#26150B; --dust:#5B4E3D;
    --okbg:#173A26; --badbg:#4A1F1A; --note:#3B2F14; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.5;font-weight:600;
  background:
    radial-gradient(ellipse at 50% -40px,rgba(255,210,122,.55),transparent 320px),
    repeating-linear-gradient(90deg,transparent 0 46px,rgba(92,52,32,.07) 46px 48px),
    var(--bg);
  background-attachment:fixed;}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Nunito",serif;font-size:19px;line-height:1.9}
#app{max-width:560px;margin:0 auto;padding:10px 14px 110px}
h1,h2,h3{font-family:"Merriweather Sans","Nunito",sans-serif;font-weight:800;letter-spacing:.2px;margin:0}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:1.3em;line-height:2.1;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pill{height:44px;padding:0 14px;border-radius:999px;background:var(--brand);color:#fff;border:3px solid var(--line);display:inline-flex;align-items:center;font-weight:900}
/* hero */
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,var(--brand),var(--brand2));color:#FFF6E6;border:3px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10px -14px -10px;height:18px;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 14px);opacity:.5}
.hero .tupai{width:92px;flex:0 0 92px}
.hero h1{font-size:25px;line-height:1.2}
.hero p{margin:4px 0 0;font-size:15px;opacity:.95}
.sttl{margin:16px 2px 6px;font-weight:900}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.stickers span{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--paper);border:2px dashed var(--muted);filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;border:2px solid var(--line);background:var(--note);box-shadow:0 2px 0 var(--line)}
/* peta: almari buku */
.case{margin-top:16px;padding:12px 10px 16px;border:4px solid var(--line);border-radius:22px 22px 10px 10px;
  background:linear-gradient(90deg,var(--wood2),var(--wood) 8%,var(--wood) 92%,var(--wood2));box-shadow:0 6px 0 var(--line);position:relative}
.case::before{content:"";position:absolute;left:14px;right:14px;top:-16px;height:14px;border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;background:var(--wood2)}
.start{display:inline-block;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:900;font-size:15px;margin:0 0 6px}
.shelf{position:relative;display:flex;align-items:flex-end;gap:5px;padding:12px 8px 0;min-height:118px;
  background:linear-gradient(var(--wood3),rgba(0,0,0,.35));border-radius:8px 8px 0 0;margin-top:10px}
.shelf::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-12px;height:14px;background:linear-gradient(var(--gold2),var(--wood2));border:3px solid var(--line);border-radius:4px;z-index:1}
.spn{width:16px;border:2px solid var(--line);border-radius:3px 3px 0 0;flex:0 0 auto;position:relative}
.spn::after{content:"";position:absolute;left:2px;right:2px;top:18%;height:3px;background:rgba(255,255,255,.55)}
.stn{flex:1;min-width:0;display:flex;gap:10px;align-items:center;text-align:start;min-height:100px;margin-bottom:2px;padding:8px 10px;
  border:3px solid var(--line);border-radius:6px 14px 14px 6px;background:var(--paper);box-shadow:inset 7px 0 0 var(--bc,#8C2F39),0 -2px 0 rgba(0,0,0,.15);position:relative;z-index:2}
html[dir="rtl"] .stn{border-radius:14px 6px 6px 14px;box-shadow:inset -7px 0 0 var(--bc,#8C2F39),0 -2px 0 rgba(0,0,0,.15)}
.stn .cov{width:62px;height:76px;flex:0 0 62px;border:3px solid var(--line);border-radius:4px 10px 10px 4px;background:var(--bc,#8C2F39);display:grid;place-items:center;position:relative}
.stn .cov::before{content:"";position:absolute;inset:5px;border:2px solid rgba(255,230,170,.75);border-radius:3px 7px 7px 3px}
.stn .em{font-size:28px;position:relative}
.stn .badge{position:absolute;top:-10px;inset-inline-end:-10px;width:28px;height:28px;border-radius:50%;background:var(--gold);border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:900;font-family:Nunito,sans-serif}
.stn .lab{display:flex;flex-direction:column;gap:2px;min-width:0}
.stn .nm{font-weight:900;font-size:17px;line-height:1.3;overflow-wrap:break-word;hyphens:auto}
html[dir="rtl"] .stn .nm{font-size:18px;line-height:1.6}
.stn .pg{font-size:13px;color:var(--muted)}
.stn .st{font-size:16px;letter-spacing:1px}
.st .off,.stars .off{filter:grayscale(1);opacity:.3}
.stn.lock{background:var(--dust)}
.stn.lock .cov{background:#8E8274}
.stn.lock .nm{opacity:.7}
.stn.now{outline:4px solid var(--lamp);outline-offset:2px;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 7px 0 0 var(--bc),0 0 22px 6px rgba(255,210,122,.75)}}
.lampu{position:absolute;top:-6px;inset-inline-end:8px;font-size:22px;z-index:3}
.perch{position:absolute;top:-16px;inset-inline-start:0;width:50px;z-index:3;pointer-events:none}
.shelf.khazanah{background:radial-gradient(circle at 50% 30%,rgba(255,210,122,.6),var(--wood3) 70%)}
.shelf.khazanah .stn{--bc:#B07F1E;background:linear-gradient(135deg,#FFF3C4,#F6D77F)}
html:not([dir="rtl"]) .shelf.khazanah .stn,.shelf.khazanah .stn{color:#2B1D14}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
</style>
<style>
/* stesen + kad baca */
.shead{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.bub{width:54px;height:62px;flex:0 0 54px;border-radius:4px 12px 12px 4px;background:var(--c);border:3px solid var(--line);display:grid;place-items:center;font-size:28px;box-shadow:0 3px 0 var(--line)}
.shead h2{font-size:21px;line-height:1.25}
.shead small{color:var(--muted);font-weight:800;font-size:14px}
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 0 var(--line);position:relative}
.read{background:linear-gradient(var(--paper),var(--card));border-inline-start:10px solid var(--sc)}
.rpic{font-size:40px;text-align:center;letter-spacing:4px}
.rh{display:flex;align-items:center;gap:8px;font-size:21px;margin:6px 0 8px;line-height:1.3}
.rh span{flex:1}
.rtext{margin:0 0 10px}
.rlist{margin:0 0 10px;padding-inline-start:26px}
.rlist li{margin:4px 0}
.abox{background:var(--note);border:2px solid var(--gold2);border-radius:14px;padding:10px 12px;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.abox .ar{text-align:center;font-size:1.45em}
.abox .mk{font-size:16px}
.abox small{color:var(--muted);font-weight:800}
.tip{display:flex;gap:8px;align-items:flex-start;background:var(--note);border:2px dashed var(--gold2);border-radius:14px;padding:8px 10px;margin:10px 0;font-size:16px}
.tip.am{background:var(--okbg);border-color:var(--ok)}
.ref{font-size:14px;color:var(--muted);font-weight:800;margin-top:8px}
.navr{display:flex;gap:10px;margin-top:12px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--dust);border:2px solid var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:6px}
.btn{flex:1;min-height:54px;width:100%;border-radius:16px;border:3px solid var(--line);background:var(--paper);font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--line);padding:6px 12px}
.btn.go{background:var(--brand);color:#FFF6E6}
.btn.alt{background:var(--card)}
.btn:disabled{opacity:.4}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.say{min-width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--note);font-size:20px;flex:0 0 auto}
/* main */
.prog{display:flex;gap:4px;margin:0 0 10px;flex-wrap:wrap}
.prog i{flex:1;min-width:30px;height:34px;border-radius:4px 4px 0 0;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:15px;background:var(--dust)}
.prog i.got{background:var(--gold)}
.prog i.cur{background:var(--lamp);transform:translateY(-4px)}
.q{display:flex;gap:8px;align-items:flex-start;font-weight:900;font-size:19px}
.q p{margin:0;flex:1}
.qpic{font-size:38px;text-align:center;margin:6px 0}
#play{margin-top:12px}
.hint{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--badbg);border:2px solid var(--bad);font-weight:800;font-size:16px}
.cnt{text-align:center;font-weight:900;color:var(--muted);margin-top:10px;font-size:15px}
.opt{display:block;width:100%;min-height:54px;min-width:0;overflow-wrap:break-word;hyphens:auto;text-align:start;padding:10px 12px;border-radius:12px;border:3px solid var(--line);
  background:var(--paper);font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--line);margin:0 0 10px;line-height:1.35}
html[dir="rtl"] .opt{font-size:18px;line-height:1.7}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{background:var(--lamp)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--badbg);opacity:.6}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2 .opt{margin:0;text-align:center}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* dakwat */
.sent{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px;font-size:18px;margin-bottom:12px;background-image:repeating-linear-gradient(transparent 0 30px,rgba(140,47,57,.12) 30px 31px)}
.blank{display:inline-block;min-width:80px;border-bottom:3px dashed var(--brand);text-align:center;color:var(--brand);font-weight:900}
.inks .opt{display:flex;align-items:center;gap:8px;justify-content:center}
.inks .opt::before{content:"🫙";font-size:20px}
/* penanda */
.tome{border:3px solid var(--line);border-radius:6px 14px 14px 6px;background:linear-gradient(90deg,var(--brand2),var(--brand));padding:12px 0 12px 16px;position:relative}
html[dir="rtl"] .tome{padding:12px 16px 12px 0;border-radius:14px 6px 6px 14px}
.rib{display:block;width:calc(100% + 12px);min-height:52px;margin:0 0 8px;text-align:start;padding:8px 26px 8px 12px;border:3px solid var(--line);border-radius:4px;font-weight:800;font-size:17px;overflow-wrap:break-word;hyphens:auto;
  clip-path:polygon(0 0,100% 0,calc(100% - 16px) 50%,100% 100%,0 100%);box-shadow:none}
html[dir="rtl"] .rib{padding:8px 12px 8px 26px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,16px 50%);margin-inline-start:-12px}
.rib:nth-child(4n+1){background:#F7D9A0}.rib:nth-child(4n+2){background:#CFE6D8}.rib:nth-child(4n+3){background:#F3C6C2}.rib:nth-child(4n){background:#CBD7EE}
.rib{color:#2B1D14}
.rib.no{opacity:.45}
/* katalog */
.icard{background:#FFFDF3;color:#2B1D14;border:3px solid var(--line);border-radius:6px;padding:14px 12px 12px;margin-bottom:12px;min-height:84px;font-weight:900;font-size:18px;position:relative;
  background-image:linear-gradient(#E05A5A,#E05A5A),repeating-linear-gradient(transparent 0 26px,#A9C7E8 26px 27px);background-size:100% 2px,100% 100%;background-repeat:no-repeat,repeat;background-position:0 30px,0 0}
.icard::before{content:"";position:absolute;bottom:-3px;left:50%;width:22px;height:12px;margin-left:-11px;border:3px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--card)}
.drw{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.drw .opt{margin:0;text-align:center;background:linear-gradient(var(--wood),var(--wood2));color:#FFF3DF;min-height:72px;font-size:16px;position:relative;padding-top:22px}
.drw .opt::before{content:"";position:absolute;top:8px;left:50%;width:30px;height:8px;margin-left:-15px;background:var(--gold);border:2px solid var(--line);border-radius:4px}
/* jilid */
.bound{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;padding:8px;border:3px dashed var(--muted);border-radius:12px;min-height:56px}
.bound .pgx{padding:6px 10px;border-radius:6px;background:var(--note);border:2px solid var(--line);font-weight:800;font-size:15px}
.bound .pgx b{color:var(--brand)}
.bound .emp{color:var(--muted);text-align:center;font-weight:800;font-size:15px}
/* indeks */
.ix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ix .opt{margin:0;min-height:60px;font-size:16px}
.ix .opt.r{background:var(--note)}
.ix .opt.done{color:#2B1D14;border-style:dashed}
/* pena */
.parch{background:linear-gradient(#FFF6DA,#F4E3B6);color:#2B1D14;border:3px solid var(--line);border-radius:10px;padding:16px 14px;font-size:18px;font-weight:800;min-height:96px;position:relative;margin-bottom:12px}
.parch::after{content:"🪶";position:absolute;bottom:-12px;inset-inline-end:10px;font-size:28px}
.tf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tf .opt{margin:0;text-align:center;font-size:19px;min-height:62px}
.tf .opt.y{background:var(--okbg)}.tf .opt.n{background:var(--badbg)}
/* pinjam + debu + kodpanggil */
.bk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bk .opt{margin:0;text-align:center;border-radius:4px 12px 12px 4px;border-inline-start:10px solid var(--brand);min-height:66px;font-size:16px}
html[dir="rtl"] .bk .opt{border-radius:12px 4px 4px 12px}
.bk .opt.sel{background:var(--lamp);border-inline-start-color:var(--green)}
.bk .opt.sel::after{content:" ✔"}
.dusty .opt{background:linear-gradient(135deg,var(--paper),var(--dust))}
.dusty .opt.gone{animation:puff .6s forwards}
@keyframes puff{to{opacity:0;transform:scale(1.15) rotate(-4deg);filter:blur(3px)}}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.nums .opt{margin:0;text-align:center;font-size:19px;padding:8px 4px;font-family:"Merriweather Sans",Nunito,sans-serif;min-height:64px;background:var(--note)}
.cardq{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:800}
/* maklum balas + keputusan */
.fb{position:fixed;inset:auto 0 0 0;z-index:50;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(23,16,11,.35)}
.fb .in{max-width:540px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .tupai{width:66px;flex:0 0 66px}
.fb strong{font-family:"Merriweather Sans",Nunito,sans-serif;font-size:20px}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif}
.fb p{margin:2px 0 0;font-size:16px}
.res{text-align:center}
.res .tupai{width:120px}
.stars{font-size:46px;margin:6px 0}
.stars span{display:inline-block;animation:pop .5s both}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
.gotst{margin:10px auto;padding:10px;border-radius:16px;background:var(--note);border:2px dashed var(--line);font-weight:800}
.gotst span{font-size:36px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:92vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const QURAN = {"h78": "وَجَـٰهِدُوا۟ فِى ٱللَّهِ حَقَّ جِهَادِهِۦ ۚ هُوَ ٱجْتَبَىٰكُمْ وَمَا جَعَلَ عَلَيْكُمْ فِى ٱلدِّينِ مِنْ حَرَجٍ", "h39": "أُذِنَ لِلَّذِينَ يُقَـٰتَلُونَ بِأَنَّهُمْ ظُلِمُوا۟ ۚ وَإِنَّ ٱللَّهَ عَلَىٰ نَصْرِهِمْ لَقَدِيرٌ", "nasr": ["إِذَا جَآءَ نَصْرُ ٱللَّهِ وَٱلْفَتْحُ", "وَرَأَيْتَ ٱلنَّاسَ يَدْخُلُونَ فِى دِينِ ٱللَّهِ أَفْوَاجًا", "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَٱسْتَغْفِرْهُ ۚ إِنَّهُۥ كَانَ تَوَّابًۢا"]};

      list:[["1000 orang tentera Islam","1000 اورڠ تنترا إسلام"],["400 orang berbaju besi","400 اورڠ برباجو بسي"],["50 orang pemanah diketuai Abdullah bin Jubair","50 اورڠ ڤمانه دكتواي عبد الله بن جبير"]] },
    { p:16, pic:"🏹⛰️", h:["Pesanan kepada pemanah","ڤسنن كڤد ڤمانه"],
      text:["Dalam perjalanan, 300 orang berpatah balik bersama Abdullah bin Ubai, ketua orang munafik. 700 orang yang lain terus berjuang. Perang Uhud berlaku pada hari Sabtu, 17 Syawal tahun ketiga Hijrah. Nabi SAW mengarahkan 50 orang pemanah berkubu di atas bukit dan tidak meninggalkan tempat mereka sama ada menang atau kalah.","دالم ڤرجالنن، 300 اورڠ برڤاته باليق برسام عبد الله بن أبي، كتوا اورڠ منافق. 700 اورڠ يڠ لاين تروس برجواڠ. ڤرڠ أحد برلاكو ڤد هاري سبتو، 17 شوال تاهون كتيڬ هجرة. نبي "+SAWJ+" مڠارهكن 50 اورڠ ڤمانه بركوبو د اتس بوكيت دان تيدق منيڠڬلكن تمڤت مريك سام اد منڠ اتاو كاله."] },
    { p:"17–18", pic:"⚠️", h:["Pemanah melanggar arahan","ڤمانه ملڠڬر ارهن"],
      text:["Tentera Islam mula menang. Namun, pemanah turun dari bukit untuk mengambil harta rampasan kerana menyangka perang telah tamat, walaupun Abdullah bin Jubair berkali-kali mengingatkan mereka. Khalid bin al-Walid dan Abu Sufyan segera menyerang dari belakang bukit sehingga tentera Islam kucar-kacir.","تنترا إسلام مولا منڠ. نامون، ڤمانه تورون دري بوكيت اونتوق مڠمبيل هرتا رمڤسن كران مڽڠك ڤرڠ تله تامت، والاوڤون عبد الله بن جبير بركالي-كالي مڠيڠتكن مريك. خالد بن الوليد دان أبو سفيان سڬرا مڽرڠ دري بلاكڠ بوكيت سهيڠڬ تنترا إسلام كوچر-كاچير."],
      tip:["Nusaibah berdiri menghunus pedang di samping Nabi SAW, dan Abu Dujanah menjadikan belakang badannya perisai untuk melindungi baginda.","نسيبة برديري مڠهونوس ڤدڠ د سمڤيڠ نبي "+SAWJ+"، دان أبو دجانة منجاديكن بلاكڠ بادنڽ ڤريساي اونتوق مليندوڠي بڬيندا."] },
    { p:"18–19", pic:"🕯️", h:["Pengajaran Perang Uhud","ڤڠاجرن ڤرڠ أحد"],
      text:["Nabi SAW cedera. Seramai 70 orang tentera Islam syahid termasuk Saidina Hamzah bin Abdul Muttalib, manakala 23 orang musyrikin terbunuh. Sifat ingin kepada dunia dan melanggar arahan ketua menyebabkan musibah yang pedih. Namun begitu, kota Madinah terselamat.","نبي "+SAWJ+" چدرا. سراماي 70 اورڠ تنترا إسلام شهيد ترماسوق سيدنا حمزة بن عبد المطلب، مانكالا 23 اورڠ مشركين تربونوه. صيفت ايڠين كڤد دنيا دان ملڠڬر ارهن كتوا مڽببكن مصيبة يڠ ڤديه. نامون بڬيتو، كوتا مدينة ترسلامت."] }

    { p:21, pic:"🤝🏴", h:["Pasukan bersekutu","ڤاسوكن برسكوتو"],
      text:["Musyrikin Mekah berasa angkuh selepas Perang Uhud dan berazam memerangi orang Islam di Madinah. Kaum Yahudi Bani Nadhir pula tidak puas hati kerana diusir dari Madinah setelah mengkhianati perjanjian. Mereka bersatu membentuk 10,000 orang tentera yang diketuai Abu Sufyan bin Harb.","مشركين مكة براس اڠكوه سلڤس ڤرڠ أحد دان برعزم ممرڠي اورڠ إسلام د مدينة. قوم يهودي بني نضير ڤول تيدق ڤواس هاتي كران دأوسير دري مدينة ستله مڠخيانتي ڤرجنجين. مريك برساتو ممبنتوق 10,000 اورڠ تنترا يڠ دكتواي أبو سفيان بن حرب."],

    { p:23, pic:"🌪️⛺", h:["Pertolongan Allah","ڤرتولوڠن الله"],
      text:["Allah SWT menolong orang Islam dengan menurunkan angin kencang. Khemah musyrikin berterbangan dan periuk belanga mereka bertaburan. Angin itu membawa debu dan batu sehingga musyrikin lari menyelamatkan diri.","الله سبحانه وتعالى منولوڠ اورڠ إسلام دڠن منورونكن اڠين كنچڠ. خيمه مشركين برتربڠن دان ڤريوق بلڠ مريك برتابورن. اڠين ايت ممباوا دبو دان باتو سهيڠڬ مشركين لاري مڽلامتكن ديري."],

{ id:5, icon:"📜", c:"#6B4E9B", sticker:"📜", t:["Bani Nadhir dan Bani Quraizah","بني نضير دان بني قريظة"], u:["Rak 5 • ms. 24–26","رق 5 • م.س. 24–26"],
  read:[
    { p:24, pic:"🏠🪨", h:["Bani Nadhir merancang khianat","بني نضير مرنچڠ خيانة"],
      text:["Peperangan Bani Nadhir berlaku sebelum Perang Khandak, iaitu pada bulan Rabiul Awal tahun 4 Hijrah. Bani Nadhir ialah orang Yahudi yang telah mengikat perjanjian damai dengan orang Islam. Ketika Nabi SAW melawat kampung mereka, mereka merancang membunuh baginda dengan menjatuhkan batu besar dari atas bumbung. Rancangan itu diketahui oleh Nabi SAW, lalu baginda segera pulang ke Madinah.","ڤڤرڠن بني نضير برلاكو سبلوم ڤرڠ خندق، ايايت ڤد بولن ربيع الأول تاهون 4 هجرة. بني نضير اياله اورڠ يهودي يڠ تله مڠيكت ڤرجنجين داماي دڠن اورڠ إسلام. كتيك نبي "+SAWJ+" ملاوت كامڤوڠ مريك، مريك مرنچڠ ممبونوه بڬيندا دڠن منجاتوهكن باتو بسر دري اتس بومبوڠ. رنچڠن ايت دكتاهوءي اوليه نبي "+SAWJ+"، لالو بڬيندا سڬرا ڤولڠ ك مدينة."] },
    { p:24, pic:"⏳6️⃣", h:["Bani Nadhir keluar dari Madinah","بني نضير كلوار دري مدينة"],
      text:["Nabi SAW memberi amaran supaya Bani Nadhir keluar kerana pengkhianatan mereka, tetapi mereka enggan. Baginda mengepung kampung mereka selama 6 hari. Akhirnya mereka keluar membawa harta benda. Sebahagian menuju ke Khaibar dan Syam, manakala sebahagian pemimpin mereka berpakat dengan orang Quraisy Mekah.","نبي "+SAWJ+" ممبري امرن سوڤايا بني نضير كلوار كران ڤڠخيانتن مريك، تتاڤي مريك ايڠڬن. بڬيندا مڠڤوڠ كامڤوڠ مريك سلاما 6 هاري. اخيرڽ مريك كلوار ممباوا هرتا بندا. سبهاڬين منوجو ك خيبر دان شام، مانكالا سبهاڬين ڤميمڤين مريك برڤاكت دڠن اورڠ قريش مكة."] },
    { p:25, pic:"🤝💔", h:["Bani Quraizah melanggar janji","بني قريظة ملڠڬر جنجي"],
      text:["Peperangan Bani Quraizah berlaku pada bulan Zulkaedah tahun 5 Hijrah (627 Masihi). Bani Quraizah pada awalnya berjanji mempertahankan Madinah, tetapi mereka menerima hasutan Bani Nadhir dan bekerjasama dengan Quraisy untuk memerangi Madinah.","ڤڤرڠن بني قريظة برلاكو ڤد بولن ذوالقعدة تاهون 5 هجرة (627 مسيحي). بني قريظة ڤد اولڽ برجنجي ممڤرتاهنكن مدينة، تتاڤي مريك منريما هاسوتن بني نضير دان بكرجاسام دڠن قريش اونتوق ممرڠي مدينة."] },
    { p:25, pic:"⚖️", h:["Hukuman atas pengkhianatan","حكومن اتس ڤڠخيانتن"],
      text:["Nabi SAW mengutus Saad bin Ubadah, Saad bin Muaz dan beberapa sahabat untuk menyiasat berita itu. Apabila terbukti, baginda keluar bersama 3000 orang tentera dan 36 tentera berkuda, lalu mengepung Bani Quraizah selama 25 hari. Mereka menyerah kalah, dan Saad bin Muaz diperintah menjatuhkan hukuman kerana jenayah mengkhianati negara Islam Madinah.","نبي "+SAWJ+" مڠوتوس سعد بن عبادة، سعد بن معاذ دان ببراڤ صحابت اونتوق مڽياست بريتا ايت. اڤابيلا تربوقتي، بڬيندا كلوار برسام 3000 اورڠ تنترا دان 36 تنترا بركودا، لالو مڠڤوڠ بني قريظة سلاما 25 هاري. مريك مڽره كاله، دان سعد بن معاذ دڤرينته منجاتوهكن حكومن كران جنايه مڠخيانتي نڬارا إسلام مدينة."],
      tip:["Semua kabilah Yahudi telah membuat perjanjian dengan Nabi SAW tetapi mengkhianatinya: Bani Qainuqa', Bani Nadhir dan Bani Quraizah.","سموا قبيلة يهودي تله ممبوات ڤرجنجين دڠن نبي "+SAWJ+" تتاڤي مڠخيانتيڽ: بني قينقاع، بني نضير دان بني قريظة."] }
  ],

{ id:6, icon:"🤝", c:"#1F7A8C", sticker:"✉️", t:["Perjanjian Hudaibiyah","ڤرجنجين حديبية"], u:["Rak 6 • ms. 27–38","رق 6 • م.س. 27–38"],
  read:[
    { p:28, pic:"💭🕋", h:["Mimpi Nabi SAW","ميمڤي نبي "+SAWJ],
      text:["Pada tahun keenam Hijrah, Nabi SAW bermimpi masuk ke Mekah bersama para sahabat, melakukan tawaf dan umrah. Pada bulan Zulkaedah, baginda keluar bersama 1500 orang menuju ke Mekah. Mereka tidak membawa senjata melainkan pedang yang tersarung untuk keselamatan diri.","ڤد تاهون كأنم هجرة، نبي "+SAWJ+" برميمڤي ماسوق ك مكة برسام ڤارا صحابت، ملاكوكن طواف دان عمرة. ڤد بولن ذوالقعدة، بڬيندا كلوار برسام 1500 اورڠ منوجو ك مكة. مريك تيدق ممباوا سنجات ملاءينكن ڤدڠ يڠ ترساروڠ اونتوق كسلامتن ديري."] },
    { p:"28–29", pic:"🏕️📨", h:["Di Hudaibiyah","د حديبية"],
      text:["Di Hudaibiyah, Nabi SAW mengutus Uthman bin Affan menemui pembesar Quraisy. Uthman ditahan lama sehingga tersebar berita beliau dibunuh. Orang Islam bersumpah setia untuk menuntut bela. Kemudian ternyata Uthman hanya ditawan. Quraisy menghantar utusan untuk berunding, dan Nabi SAW menjelaskan bahawa baginda datang hanya untuk menunaikan umrah.","د حديبية، نبي "+SAWJ+" مڠوتوس عثمان بن عفان منموءي ڤمبسر قريش. عثمان دتاهن لام سهيڠڬ ترسبر بريتا بلياو دبونوه. اورڠ إسلام برسومڤه ستيا اونتوق منونتوت بلا. كمودين ترڽات عثمان هاڽ دتاون. قريش مڠهنتر اوتوسن اونتوق براونديڠ، دان نبي "+SAWJ+" منجلسكن بهاوا بڬيندا داتڠ هاڽ اونتوق منونايكن عمرة."] },
    { p:30, pic:"📜✍️", h:["Isi Perjanjian Hudaibiyah","ايسي ڤرجنجين حديبية"],
      list:[["Gencatan senjata selama 10 tahun","ڬنچتن سنجات سلاما 10 تاهون"],["Kedua-dua pihak tidak boleh membantu kaum yang memerangi sekutu masing-masing","كدوا-دوا ڤيهق تيدق بوليه ممبنتو قوم يڠ ممرڠي سكوتو ماسيڠ٢"],["Orang Quraisy yang lari ke Madinah tanpa izin walinya dihantar pulang ke Mekah","اورڠ قريش يڠ لاري ك مدينة تنڤا إذين واليڽ دهنتر ڤولڠ ك مكة"],["Orang Islam yang lari ke Mekah tidak perlu dihantar pulang","اورڠ إسلام يڠ لاري ك مكة تيدق ڤرلو دهنتر ڤولڠ"],["Umrah tidak dibenarkan pada tahun itu, tetapi dibenarkan pada tahun berikutnya","عمرة تيدق دبنركن ڤد تاهون ايت، تتاڤي دبنركن ڤد تاهون برايكوتڽ"]] },
    { p:"31–32", pic:"🌍📈", h:["Kesan Perjanjian Hudaibiyah","كسن ڤرجنجين حديبية"],
      list:[["Musyrikin mengiktiraf Nabi SAW sebagai ketua negara Islam Madinah","مشركين مڠيقتيراف نبي "+SAWJ+" سباڬاي كتوا نڬارا إسلام مدينة"],["Gencatan senjata digunakan untuk menyebarkan Islam ke luar","ڬنچتن سنجات دڬوناكن اونتوق مڽيباركن إسلام ك لوار"],["Lebih ramai tokoh Quraisy memeluk Islam, seperti Khalid bin al-Walid","لبيه رامي توكوه قريش مملوق إسلام، سڤرتي خالد بن الوليد"],["Orang Islam dapat mengerjakan umrah dengan aman","اورڠ إسلام داڤت مڠرجاكن عمرة دڠن امان"]] },
    { p:"33–36", pic:"✉️👑", h:["Surat kepada raja-raja","سورت كڤد راج٢"],
      text:["Nabi SAW menghantar wakil kepada raja-raja dan pemerintah di sekitar Madinah untuk mengajak mereka memeluk Islam. Ada yang menerima dan memeluk Islam, ada yang menolak dengan baik dan ada yang menolak dengan kasar.","نبي "+SAWJ+" مڠهنتر واكيل كڤد راج٢ دان ڤمرينته د سكيتر مدينة اونتوق مڠاجق مريك مملوق إسلام. اد يڠ منريما دان مملوق إسلام، اد يڠ منولق دڠن باءيق دان اد يڠ منولق دڠن كاسر."],
      list:[["Habsyah: an-Najasyi menerima Islam","حبشة: النجاشي منريما إسلام"],["Rom: Hiraql menolak dengan baik","روم: هرقل منولق دڠن باءيق"],["Mesir: Muqauqis menolak dengan baik","مصر: مقوقس منولق دڠن باءيق"],["Parsi: Kisra menolak dengan kasar","ڤرسي: كسرى منولق دڠن كاسر"],["Bahrain dan Oman: menerima Islam","بحرين دان عمان: منريما إسلام"]] }
  ],

{ id:7, icon:"🕋", c:"#3D6B35", sticker:"🕋", t:["Pembukaan Kota Mekah","ڤمبوكاٴن كوتا مكة"], u:["Rak 7 • ms. 39–47","رق 7 • م.س. 39–47"],
  read:[
    { p:41, pic:"⚔️💔", h:["Sebab Pembukaan Kota Mekah","سبب ڤمبوكاٴن كوتا مكة"],
      text:["Selepas Perjanjian Hudaibiyah, Bani Bakar bersahabat dengan kaum Quraisy, manakala Bani Khuza'ah bersahabat dengan Rasulullah SAW. Apabila Bani Bakar menyerang Bani Khuza'ah, kaum musyrikin Mekah membantu mereka. Tindakan ini bertentangan dengan Perjanjian Hudaibiyah. Lalu Nabi SAW menyiapkan tentera untuk memberi pengajaran kepada Quraisy.","سلڤس ڤرجنجين حديبية، بني بكر برسهابت دڠن قوم قريش، مانكالا بني خزاعة برسهابت دڠن رسول الله "+SAWJ+". اڤابيلا بني بكر مڽرڠ بني خزاعة، قوم مشركين مكة ممبنتو مريك. تيندقن اين برتنتڠن دڠن ڤرجنجين حديبية. لالو نبي "+SAWJ+" مڽياڤكن تنترا اونتوق ممبري ڤڠاجرن كڤد قريش."] },
    { p:42, pic:"🌟", h:["10,000 tentera menuju ke Mekah","10,000 تنترا منوجو ك مكة"],
      text:["Nabi SAW memimpin 10,000 orang tentera Islam menuju ke Mekah pada 10 Ramadan tahun 8 Hijrah (629 Masihi). Rasulullah SAW menerima wahyu:","نبي "+SAWJ+" مميمڤين 10,000 اورڠ تنترا إسلام منوجو ك مكة ڤد 10 رمضان تاهون 8 هجرة (629 مسيحي). رسول الله "+SAWJ+" منريما وحي:"],
      ar:QURAN.nasr.map((a,i)=>a+" ("+"١٢٣"[i]+")").join(" "), mk:["Maksudnya: \"Apabila datang pertolongan Allah dan kemenangan. Dan kamu lihat manusia masuk agama Allah dengan berbondong-bondong. Maka bertasbihlah dengan memuji Tuhanmu dan mohonlah ampun kepada-Nya, sesungguhnya Dia Maha Penerima taubat.\"","مقصودڽ: \"اڤابيلا داتڠ ڤرتولوڠن الله دان كمناڠن. دان كامو ليهت مانوسيا ماسوق اڬام الله دڠن بربوندوڠ-بوندوڠ. مك برتسبيحله دڠن مموجي توهنمو دان موهونله امڤون كڤداڽ، سسوڠڬوهڽ دي مها ڤنريما توبة.\""],
      src:["Surah an-Nasr: 1–3","سورة النصر: 1–3"] },
    { p:43, pic:"🔥⛺", h:["Di Marr az-Zahran","د مر الظهران"],
      text:["Di Marr az-Zahran, tentera berkhemah dan setiap khemah menyalakan tiga unggun api supaya pasukan kelihatan lebih besar dan menggerunkan musuh. Al-Abbas dan Abu Sufyan bin Harb datang untuk memeluk Islam. Pasukan Khalid bin al-Walid masuk dari arah selatan, dan pasukan az-Zubair bin al-Awwam dari arah utara.","د مر الظهران، تنترا بركهيمه دان ستياڤ خيمه مڽالاكن تيڬ اوڠڬون اڤي سوڤايا ڤاسوكن كليهتن لبيه بسر دان مڠڬرونكن موسوه. العباس دان أبو سفيان بن حرب داتڠ اونتوق مملوق إسلام. ڤاسوكن خالد بن الوليد ماسوق دري اره سلاتن، دان ڤاسوكن الزبير بن العوام دري اره اوتارا."] },
    { p:44, pic:"🙇🕋", h:["Nabi SAW memasuki Mekah","نبي "+SAWJ+" مماسوقي مكة"],
      text:["Satu seruan dibuat: sesiapa yang masuk ke rumah dan menutup pintu atau masuk ke Masjidil Haram mendapat jaminan keselamatan. Nabi SAW masuk menunggang unta al-Qaswa' dalam keadaan tunduk merendahkan diri kepada Allah. Baginda bertawaf, menghapuskan semua berhala di sekeliling Kaabah dan memaafkan kesalahan orang Quraisy.","ساتو سروان دبوات: سسياڤ يڠ ماسوق ك رومه دان منوتوڤ ڤينتو اتاو ماسوق ك مسجد الحرام منداڤت جامينن كسلامتن. نبي "+SAWJ+" ماسوق منوڠڬڠ اونتا القصواء دالم كأداءن توندوق مرندهكن ديري كڤد الله. بڬيندا برطواف، مڠهاڤوسكن سموا برهالا د سكليليڠ كعبة دان مماٴفكن كسالهن اورڠ قريش."] },

      text:["Pada 29 Safar tahun ke-11 Hijrah, hari Isnin, Nabi SAW ditimpa sakit kepala yang amat sangat. Ketika itu baginda masih mengimami solat bersama para sahabat. Baginda menghabiskan hari-hari terakhir di rumah Aisyah. Aisyah membantu melegakan kesakitan baginda dengan membaca Surah al-Falaq dan Surah an-Nas lalu meniup ke tubuh baginda.","ڤد 29 صفر تاهون ك-11 هجرة، هاري اثنين، نبي "+SAWJ+" دتيمڤا ساكيت كڤالا يڠ امت ساڠت. كتيك ايت بڬيندا ماسيه مڠيمامي صلاة برسام ڤارا صحابت. بڬيندا مڠهابيسكن هاري٢ تراخير د رومه عائشة. عائشة ممبنتو ملڬاكن كساكيتن بڬيندا دڠن ممباچ سورة الفلق دان سورة الناس لالو منيوڤ ك توبوه بڬيندا."] },

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.17,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[659,.12],[988,.2]]),
  page: () => tone([[1400,.03,"triangle"],[900,.05,"triangle"]]),
  no:   () => tone([[233,.18,"square"],[185,.2,"square"]]),
  stamp:() => tone([[160,.08,"square"],[120,.1,"triangle"]]),
  ink:  () => tone([[880,.06],[660,.08],[990,.12]]),
  puff: () => tone([[500,.06,"sawtooth"],[300,.08,"sawtooth"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.32]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
const forSpeech = s => String(s).replace(/ﷺ/g," sallallahu alaihi wasallam ").replace(/\bSAW\b/g," sallallahu alaihi wasallam ").replace(/\bSWT\b/g," subhanahu wa taala ")
  .replace(AR_RE," ").replace(/<[^>]+>/g," ").replace(/___/g," ... ").replace(/…/g," ... ").replace(/\bms\. /g,"muka surat ").replace(/\bH\)/g,"Hijrah)").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    const s = forSpeech(text); if(!s) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Kamu pembaca sirah yang teliti!","چمرلڠ! كامو ڤمباچ سيرة يڠ تليتي!"] : stars===2 ? ["Bagus! Baca semula dan cuba untuk 3 bintang.","باڬوس! باچ سمولا دان چوبا اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom selak buku ini sekali lagi.","شاباس كران منچوبا! جوم سلق بوكو اين سكالي لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${tupai("bob")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Penanda buku baharu untuk kamu!","ڤنندا بوكو بهارو اونتوق كامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🗝️ ${L("Bilik Khazanah kini dibuka!","بيليق خزانه كيني دبوك!")}</b></p>` : ""}
      <button class="btn go" data-act="map">📚 ${L("Kembali ke almari","كمبالي ك الماري")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماءين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN (1) ===================== */
const GAMES = {};
// pilih satu jawapan; senarai a[0] = betul
function pickOne(el, g, wrap, cls, fill){
  const opts = mix(g.a.map((x,i)=>({x, ok:i===0})));
  el.innerHTML = wrap(opts.map((o,i)=>`<button class="${cls}" data-i="${i}" data-ok="${o.ok?1:0}">${T(o.x)}</button>`).join(""));
  el.querySelectorAll("button[data-ok]").forEach(b => b.addEventListener("click", () => {
    if(b.disabled) return;
    if(b.dataset.ok==="1"){
      el.querySelectorAll("button[data-ok]").forEach(x=>x.disabled=true); b.classList.add("ok"); clearHint();
      if(fill) fill(T(opts[+b.dataset.i].x));
      setTimeout(win, 500);
    } else { b.disabled = true; b.classList.add("no"); oops(b); }
  }));
}
/* Dakwat: celup pena ke dakwat yang betul, perkataan ditulis ke dalam ruang kosong */
GAMES.dakwat = (el, g) => {
  const parts = T(g.text).split("___");
  pickOne(el, g, btns => `<div class="sent">${parts[0]}<span class="blank" id="blank">🪶 ?</span>${parts[1]||""}</div><div class="g2 inks">${btns}</div>`, "opt",
    w => { sfx.ink(); const b = el.querySelector("#blank"); if(b){ b.textContent = w; } });
};
/* Penanda: pilih reben penanda buku yang betul */
GAMES.penanda = (el, g) => {
  pickOne(el, g, btns => `<div class="tome" role="group">${btns}</div>`, "rib", () => sfx.page());
};
/* Katalog: failkan kad katalog ke laci yang betul */
GAMES.katalog = (el, g) => {
  const q = mix(g.items); let k = 0;
  const draw = () => {
    const it = q[k];
    el.innerHTML = `<div class="icard" data-ans="${it[1]}">🗂️ ${T(it[0])}</div>
      <div class="drw">${g.cats.map((c,i)=>`<button class="opt" data-c="${i}">${c[1]} ${T(c[0])}</button>`).join("")}</div>
      <div class="cnt">${L(`Kad ${k+1} daripada ${q.length}`,`كد ${k+1} درڤد ${q.length}`)}</div>`;
    el.querySelectorAll(".drw .opt").forEach(b => b.addEventListener("click", () => {
      if(+b.dataset.c === it[1]){ sfx.page(); clearHint(); k++; if(k<q.length) draw(); else { el.querySelector(".icard").textContent = "✅"; win(); } }
      else oops(b, L("Laci itu untuk kad lain. Baca kad sekali lagi!","لاچي ايت اونتوق كد لاين. باچ كد سكالي لاڬي!"));
    }));
  };
  draw();
};
/* Jilid: ketik halaman mengikut urutan untuk menjilid buku */
GAMES.jilid = (el, g) => {
  const order = mix(g.steps.map((_,i)=>i)); let nx = 0;
  el.innerHTML = `<div class="bound" id="bound"><div class="emp">📕 ${L("Buku belum dijilid. Ketik halaman pertama.","بوكو بلوم دجيليد. كتيق هلامن ڤرتام.")}</div></div>
    <div class="pgs">${order.map(i=>`<button class="opt" data-i="${i}">📄 ${T(g.steps[i])}</button>`).join("")}</div>`;
  const bound = el.querySelector("#bound");
  el.querySelectorAll(".pgs .opt").forEach(b => b.addEventListener("click", () => {
    if(b.disabled) return;
    if(+b.dataset.i === nx){
      if(nx===0) bound.innerHTML = "";
      bound.insertAdjacentHTML("beforeend", `<div class="pgx"><b>${nx+1}.</b> ${T(g.steps[nx])}</div>`);
      b.remove(); nx++; sfx.page(); clearHint();
      if(nx===g.steps.length) setTimeout(win, 400);
    } else oops(b, L("Halaman itu belum tiba gilirannya. Fikir apa yang berlaku dahulu!","هلامن ايت بلوم تيبا ڬيليرنڽ. فيكير اڤ يڠ برلاكو دهولو!"));
  }));
};

/* ===================== JENIS PERMAINAN (2) ===================== */
/* Indeks: ketik entri kiri, kemudian halaman/maksud di kanan */
GAMES.indeks = (el, g) => {
  const n = g.pairs.length, Lx = mix(g.pairs.map((_,i)=>i)), Rx = mix(g.pairs.map((_,i)=>i));
  const COL = ["#F7D9A0","#CFE6D8","#F3C6C2","#CBD7EE","#E4D2F2"];
  el.innerHTML = `<div class="ix"><div>${Lx.map(i=>`<button class="opt l" data-p="${i}" style="margin-bottom:10px">🔎 ${T(g.pairs[i][0])}</button>`).join("")}</div>
    <div>${Rx.map(i=>`<button class="opt r" data-p="${i}" style="margin-bottom:10px">${T(g.pairs[i][1])}</button>`).join("")}</div></div>`;
  let pick = null, k = 0;
  el.querySelectorAll(".opt.l").forEach(b => b.addEventListener("click", () => {
    if(b.disabled) return;
    el.querySelectorAll(".opt.l").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); pick = b; sfx.page();
  }));
  el.querySelectorAll(".opt.r").forEach(b => b.addEventListener("click", () => {
    if(b.disabled) return;
    if(!pick){ toast(L("Pilih entri di lajur pertama dahulu.","ڤيليه انتري د لاجور ڤرتام دهولو.")); return; }
    if(b.dataset.p===pick.dataset.p){
      const c = COL[k%COL.length]; [pick,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; x.style.background = c; });
      pick = null; k++; sfx.ink(); clearHint(); if(k===n) setTimeout(win, 400);
    } else oops(b, L("Padanan itu tidak tepat. Cuba yang lain!","ڤادنن ايت تيدق تڤت. چوبا يڠ لاين!"));
  }));
};
/* Pena: setiap catatan dicop Benar atau Salah */
GAMES.pena = (el, g) => {
  const q = mix(g.items); let k = 0;
  const draw = () => {
    const it = q[k];
    el.innerHTML = `<div class="parch" data-ans="${it[1]}">${T(it[0])}</div>
      <div class="tf"><button class="opt y" data-v="1">✔️ ${L("Benar","بنر")}</button><button class="opt n" data-v="0">✖️ ${L("Salah","ساله")}</button></div>
      <div class="cnt">${L(`Catatan ${k+1} daripada ${q.length}`,`چاتتن ${k+1} درڤد ${q.length}`)}</div>`;
    el.querySelectorAll(".tf .opt").forEach(b => b.addEventListener("click", () => {
      if(+b.dataset.v === it[1]){ sfx.stamp(); clearHint(); k++; if(k<q.length) draw(); else win(); }
      else oops(b, L("Semak semula catatan itu dengan buku teks.","سمق سمولا چاتتن ايت دڠن بوكو تيكس."));
    }));
  };
  draw();
};
/* Pinjam: pilih SEMUA buku yang betul, kemudian tekan Pinjam */
GAMES.pinjam = (el, g) => {
  const items = mix(g.items), need = items.filter(x=>x[1]).length;
  el.innerHTML = `<div class="bk">${items.map((it,i)=>`<button class="opt" data-i="${i}" data-ok="${it[1]}" aria-pressed="false">📘 ${T(it[0])}</button>`).join("")}</div>
    <button class="btn go" id="borrow" style="margin-top:14px">📚 ${L("Pinjam","ڤينجم")}</button>`;
  el.querySelectorAll(".bk .opt").forEach(b => b.addEventListener("click", () => {
    const on = !b.classList.contains("sel"); b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on); sfx.page();
  }));
  el.querySelector("#borrow").addEventListener("click", () => {
    const sel = [...el.querySelectorAll(".bk .opt.sel")];
    if(!sel.length){ toast(L("Pilih buku dahulu.","ڤيليه بوكو دهولو.")); return; }
    const wrong = sel.filter(b=>b.dataset.ok==="0"), got = sel.length - wrong.length;
    if(!wrong.length && got===need){ el.querySelectorAll(".bk .opt").forEach(b=>b.disabled=true); sel.forEach(b=>b.classList.add("ok")); clearHint(); win(); return; }
    wrong.forEach(b=>{ b.classList.remove("sel"); b.setAttribute("aria-pressed","false"); });
    oops(el.querySelector("#borrow"), wrong.length ? L(`${wrong.length} buku itu tidak berkaitan. Ia dipulangkan ke rak.`,`${wrong.length} بوكو ايت تيدق بركاءيتن. اي دڤولڠكن ك رق.`)
      : L(`Masih ada buku yang tertinggal. Semuanya ${need} buku.`,`ماسيه اد بوكو يڠ ترتيڠڬل. سمواڽ ${need} بوكو.`));
  });
};
/* Debu: tiup debu buku yang tidak sekumpulan (beberapa pusingan) */
GAMES.debu = (el, g) => {
  let r = 0, busy = false;
  const draw = () => {
    const opts = mix(g.rounds[r].map((x,i)=>({x, odd:i===0})));
    el.innerHTML = `<div class="bk dusty">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-odd="${o.odd?1:0}">${T(o.x)}</button>`).join("")}</div>
      <div class="cnt">💨 ${L(`Pusingan ${r+1} daripada ${g.rounds.length}`,`ڤوسيڠن ${r+1} درڤد ${g.rounds.length}`)}</div>`;
    busy = false;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(busy || b.disabled) return;
      if(b.dataset.odd==="1"){ busy = true; sfx.puff(); b.classList.add("gone"); clearHint(); r++;
        if(r<g.rounds.length) setTimeout(draw, 650); else setTimeout(win, 650); }
      else { b.disabled = true; b.classList.add("no"); oops(b, L("Buku itu sekumpulan dengan yang lain. Cari yang ganjil!","بوكو ايت سكومڤولن دڠن يڠ لاين. چاري يڠ ڬنجيل!")); }
    }));
  };
  draw();
};
/* Kod panggilan: pilih nombor yang betul bagi setiap soalan */
GAMES.kodpanggil = (el, g) => {
  let r = 0;
  const draw = () => {
    const [q, ...nums] = g.rounds[r];
    const opts = mix(nums.map((x,i)=>({x, ok:i===0})));
    el.innerHTML = `<div class="cardq">🏷️ ${T(q)} ${sayBtn(RU(q))}</div>
      <div class="nums">${opts.map((o,i)=>`<button class="opt" data-ok="${o.ok?1:0}">${o.x}</button>`).join("")}</div>
      <div class="cnt">${L(`Kod ${r+1} daripada ${g.rounds.length}`,`كود ${r+1} درڤد ${g.rounds.length}`)}</div>`;
    el.querySelectorAll(".nums .opt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(b.dataset.ok==="1"){ sfx.ink(); clearHint(); el.querySelectorAll(".nums .opt").forEach(x=>x.disabled=true); b.classList.add("ok"); r++;
        if(r<g.rounds.length) setTimeout(draw, 450); else setTimeout(win, 450); }
      else { b.disabled = true; b.classList.add("no"); oops(b, L("Kod itu salah rak. Semak semula fakta!","كود ايت ساله رق. سمق سمولا فقتا!")); }
    }));
  };
  draw();
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t5-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Habiskan buku di rak sebelumnya dahulu 🔒","هابيسكن بوكو د رق سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Habiskan semua ${STATIONS.length} rak untuk membuka Bilik Khazanah 🗝️`,`هابيسكن سموا ${STATIONS.length} رق اونتوق ممبوك بيليق خزانه 🗝️`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; sfx.page(); renderRead(); } }
  else if(a==="rnext"){ sfx.page(); if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
</html>
