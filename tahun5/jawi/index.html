<style>
/* ===== Jawi Tahun 5: "Kapal Selam Aksara" — menyelam ke palung laut dalam, sonar & makhluk bercahaya ===== */
:root{
  --w1:#BDEBFF; --w2:#4FA8D8; --w3:#155E8C; --card:#FFFFFF; --card2:#EEF9FF; --ink:#08223F; --muted:#466482;
  --line:#0B3A63; --brand:#FFB703; --brand2:#FB8500; --glow:#00E5C3; --cyan:#3FD0FF; --coral:#FF5D73;
  --ok:#11A86B; --okbg:#D8FBEA; --bad:#E5383B; --badbg:#FFE0E0; --note:#FFF4CC; --sub:#FFC93C;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --w1:#0A3A63; --w2:#06213D; --w3:#010A18; --card:#0D2B4A; --card2:#123A60; --ink:#E4F6FF; --muted:#9CC3E0;
    --line:#5FC8F5; --okbg:#0E4634; --badbg:#4A1820; --note:#3B3414; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito","Noto Naskh Arabic",system-ui,sans-serif;color:var(--ink);font-weight:700;
  background:linear-gradient(180deg,var(--w1) 0%,var(--w2) 45%,var(--w3) 100%) fixed;overflow-x:hidden}
[dir=rtl] body{font-family:"Noto Naskh Arabic","Nunito",serif}
h1,h2,h3,.ttl{font-family:"Paytone One","Nunito",sans-serif;font-weight:400;margin:0;line-height:1.2}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.jw,.ar{font-family:"Noto Naskh Arabic","Amiri",serif;direction:rtl;unicode-bidi:isolate;font-weight:600}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:10px 14px 90px;position:relative;z-index:1}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles i{position:absolute;bottom:-30px;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(255,255,255,.08) 60%);animation:rise linear infinite}
@keyframes rise{to{transform:translate(18px,-115vh)}}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:16px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;color:var(--ink);padding:0 10px;box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800}
.hero{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#0B3A63,#126E9E);color:#fff;border-radius:24px;padding:12px 14px;border:3px solid #06264A;box-shadow:0 6px 0 #06264A}
.hero h1{font-size:26px;color:var(--sub);text-shadow:0 2px 0 #06264A}
.hero p{margin:4px 0 0;font-size:15px;line-height:1.5}
.squid{width:96px;height:96px;flex:0 0 auto}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.yay{animation:yay .7s ease-in-out 3}
@keyframes yay{50%{transform:scale(1.12) rotate(6deg)}}
.sttl{margin:16px 4px 6px;font-size:16px;display:inline-block;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px}
.stickers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.6);border-radius:18px;padding:8px}
.stickers span{font-size:28px;text-align:center;filter:grayscale(1) opacity(.35)}
.stickers span.got{filter:none;animation:yay .6s}
/* ---------- Peta menyelam ---------- */
.dive{position:relative;margin-top:14px;padding:10px 0 20px}
.dive::before{content:"";position:absolute;left:50%;top:40px;bottom:70px;width:6px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,var(--sub) 0 14px,transparent 14px 26px);border-radius:3px;opacity:.85}
.surface{text-align:center;color:#06264A;font-weight:800;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.4));border-radius:20px;padding:8px 10px;position:relative;z-index:1}
.surface::after{content:"";display:block;height:10px;margin-top:6px;background:radial-gradient(circle at 10px -4px,transparent 10px,rgba(255,255,255,.9) 11px) 0 0/20px 10px repeat-x}
.row{display:flex;margin:18px 0;position:relative;z-index:1}
.row.l{justify-content:flex-start}.row.r{justify-content:flex-end}
.node{width:62%;min-height:96px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:22px;border:3px solid var(--line);background:var(--card);box-shadow:0 5px 0 var(--line);text-align:start;position:relative}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.port{flex:0 0 64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 70%);border:5px solid #8FA9BF;box-shadow:inset 0 0 0 3px #5E7A92,0 0 0 3px var(--line);position:relative}
.port .num{position:absolute;top:-8px;inset-inline-end:-8px;background:var(--sub);color:#06264A;border:2px solid var(--line);border-radius:50%;width:24px;height:24px;font-size:13px;display:grid;place-items:center;font-family:Nunito,sans-serif;font-weight:800}
.ninfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.dep{font-size:12px;color:var(--muted);font-family:Nunito,sans-serif;direction:ltr;unicode-bidi:isolate}
.st{font-size:13px;letter-spacing:-2px}
.st .off{filter:grayscale(1) opacity(.35)}
.node.lock{opacity:.6}.node.lock .port{filter:grayscale(.9)}
.node.lock .port::after{content:"🔒";position:absolute;font-size:20px;bottom:-6px;inset-inline-start:-6px}
.node.now{border-color:var(--sub);box-shadow:0 5px 0 var(--line),0 0 0 4px rgba(255,201,60,.55)}
.sub{position:absolute;top:-30px;inset-inline-end:-6px;font-size:30px;animation:bob 2s ease-in-out infinite}
.trench{margin-top:26px;text-align:center;position:relative;z-index:1}
.node.final{width:100%;justify-content:center;background:linear-gradient(135deg,#031B33,#0A4A6E);color:#fff;border-color:#00E5C3;box-shadow:0 5px 0 #021024,0 0 22px rgba(0,229,195,.45)}
.node.final .port{background:radial-gradient(circle at 40% 35%,#fff,#9BF6FF 40%,#00B4D8 75%);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 3px #5E7A92,0 0 0 3px #00E5C3,0 0 26px #00E5C3}}
.node.final .dep{color:#9CE7FF}
.floor{margin-top:12px;color:#BFF6FF;font-size:14px;text-shadow:0 1px 2px #000}
.critter{position:absolute;font-size:24px;opacity:.8;animation:bob 3s ease-in-out infinite;z-index:0}
</style>
<style>
/* ---------- Stesen, kad bacaan ---------- */
.shead{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:8px 12px;margin-bottom:10px}
.shead .port{flex:0 0 52px;height:52px;font-size:24px}
.shead h2{font-size:19px;overflow-wrap:anywhere}.shead small{color:var(--muted);font-size:13px}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 6px 0 var(--line);position:relative}
.rpic{font-size:46px;text-align:center}
.rh{font-size:21px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.rtext{font-size:17px;line-height:1.75;margin:10px 0}
[dir=rtl] .rtext{font-size:19px;line-height:2}
.exs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.ex{background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;max-width:100%;flex-wrap:wrap;justify-content:center}
.wd{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0}
.wd b{font-size:22px}.wd small{font-size:12px;color:var(--muted);font-family:Nunito,sans-serif;direction:ltr}
.ex .ar{color:var(--brand2)}
.tip{display:flex;gap:8px;background:var(--note);border-radius:14px;padding:10px;margin-top:10px;line-height:1.7;font-size:15px}
[dir=rtl] .tip{font-size:17px}
.tip.am{background:var(--okbg)}
.ref{margin-top:10px;font-size:13px;color:var(--muted)}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:54px;border-radius:18px;border:3px solid var(--line);background:var(--sub);color:#06264A;font-size:18px;font-weight:800;box-shadow:0 5px 0 var(--line);padding:6px 12px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.go{background:var(--glow)}.btn.alt{background:var(--card2);color:var(--ink)}
.btn:disabled{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}.dots i.on{opacity:1;background:var(--brand2)}
.say{border:2px solid var(--line);background:var(--card2);border-radius:12px;min-width:40px;height:40px;font-size:18px;flex:0 0 auto}
/* ---------- Main ---------- */
.depth{height:26px;border-radius:13px;border:3px solid var(--line);background:linear-gradient(90deg,#BDEBFF,#155E8C 60%,#020C1C);position:relative;margin-bottom:10px;overflow:visible}
.depth .subm{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:24px;transition:all .4s}
[dir=rtl] .depth{background:linear-gradient(270deg,#BDEBFF,#155E8C 60%,#020C1C)}
[dir=rtl] .depth .subm{transform:translate(50%,-50%) scaleX(-1)}
.q{display:flex;gap:8px;align-items:flex-start;font-size:18px;line-height:1.6}
.q p{margin:0;flex:1}
[dir=rtl] .q{font-size:20px}
.rnd{font-size:13px;color:var(--muted);margin:4px 0 8px}
.target{text-align:center;margin:8px 0 12px;padding:10px;border-radius:18px;background:var(--card2);border:2px dashed var(--line)}
.target .wd b{font-size:30px}.target .big{font-size:28px;font-family:Nunito,sans-serif;font-weight:800}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.op{min-height:60px;border-radius:18px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);padding:8px;min-width:0;overflow-wrap:anywhere;font-size:24px}
.op:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.right{background:var(--okbg)!important;border-color:var(--ok)!important}
.wrong{background:var(--badbg)!important;border-color:var(--bad)!important}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* sonar */
.sonar{position:relative;border-radius:50% 50% 24px 24px/30% 30% 24px 24px;padding:26px 12px 14px;background:radial-gradient(circle at 50% 20%,#0B4F3C,#02170F 75%);border:4px solid #0E8F6A;overflow:hidden}
.sonar::before{content:"";position:absolute;left:50%;top:22%;width:260%;height:260%;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,rgba(61,255,176,.35),transparent 18%);animation:sweep 3s linear infinite;pointer-events:none}
@keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
.sonar .target{background:rgba(0,0,0,.35);color:#B9FFE0;border-color:#3DFFB0}
.sonar .target small{color:#B9FFE0}
.blip{position:relative;background:#0C2E22;color:#C7FFE6;border-color:#3DFFB0;box-shadow:0 4px 0 #0E8F6A}
/* kapsul */
.caps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cap{min-width:84px;min-height:58px;border-radius:999px;border:3px solid var(--line);background:linear-gradient(90deg,var(--coral) 50%,#fff 50%);font-size:24px;padding:4px 16px;box-shadow:0 4px 0 var(--line)}
.cap span{background:var(--card);border-radius:12px;padding:0 8px;color:var(--ink)}
.eq{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:24px}
.slot{min-width:70px;min-height:50px;border:3px dashed var(--line);border-radius:14px;display:inline-grid;place-items:center;padding:2px 8px}
/* torpedo */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.tk{min-height:56px;border-radius:14px;border:3px solid var(--line);background:var(--card2);padding:4px 10px;box-shadow:0 3px 0 var(--line);min-width:0}
.tk.sel{background:var(--sub);color:#06264A;transform:translateY(-3px)}
.tk.used{visibility:hidden}
.tubes{display:grid;gap:8px}
.tubes.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.tubes.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tube{min-height:120px;border-radius:40px 40px 14px 14px;border:3px solid var(--line);background:linear-gradient(90deg,#8FA9BF,#DDE8F1 40%,#8FA9BF);color:#06264A;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere;font-size:15px}
.tube .jw{font-size:18px}
.tube .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tube .in b{background:#fff;border-radius:8px;padding:0 6px;font-size:18px}
/* periskop */
.lens{border-radius:28px;border:8px solid #4A5D6E;outline:4px solid var(--line);background:radial-gradient(circle,#E8FBFF,#9ED9F2);color:#06264A;padding:16px;font-size:18px;line-height:1.9;text-align:center;margin-bottom:12px}
.lens .jw{font-size:22px;line-height:2}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--coral);color:var(--coral)}
/* radar */
.stmt{font-size:18px;line-height:1.8;padding:14px;border-radius:18px;background:var(--card2);border:3px solid var(--line);margin-bottom:12px}
[dir=rtl] .stmt{font-size:20px}
.tfb{font-size:20px;font-weight:800}
.tfb.t{background:var(--okbg)}.tfb.f{background:var(--badbg)}
/* palka */
.hatch{display:flex;justify-content:center;align-items:center;min-height:76px;border-radius:50%/30%;border:5px solid #5E7A92;background:repeating-radial-gradient(circle,#2C4A63 0 6px,#36577A 6px 12px);color:#fff;margin-bottom:12px;padding:8px 18px;font-size:32px;direction:rtl}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tl{min-height:58px;font-size:28px;border-radius:14px;border:3px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);min-width:0}
.tl.used{opacity:.2;pointer-events:none}
.mini{display:flex;gap:8px;justify-content:center;margin-top:10px}
.mini .btn{flex:0 1 160px;min-height:46px;font-size:16px}
/* mutiara */
.clams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.sh{min-height:58px;border-radius:30px 30px 14px 14px;border:3px solid var(--line);background:linear-gradient(180deg,#FFD6E0,#FFB3C6);color:#5A1030;padding:6px;font-size:18px;min-width:0;overflow-wrap:anywhere}
.pr{min-height:58px;border-radius:999px;border:3px solid var(--line);background:radial-gradient(circle at 35% 30%,#fff,#E0F4FF 60%,#B7D9F0);color:#06264A;font-size:22px;padding:6px;min-width:0;overflow-wrap:anywhere}
.sh.sel,.pr.sel{outline:4px solid var(--sub)}
.done{opacity:.35;pointer-events:none}
/* ubur */
.jelly{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.jf{min-height:86px;border-radius:50% 50% 16px 16px/60% 60% 16px 16px;border:3px solid var(--line);background:radial-gradient(circle at 50% 30%,#F3D9FF,#C77DFF 80%);color:#2A0845;padding:8px 6px 18px;animation:bob 3s ease-in-out infinite;min-width:0;overflow-wrap:anywhere;position:relative}
.jf::after{content:"";position:absolute;left:20%;right:20%;bottom:-10px;height:12px;background:repeating-linear-gradient(90deg,#C77DFF 0 4px,transparent 4px 10px)}
.jf.lit{background:radial-gradient(circle at 50% 30%,#E7FFF7,#00E5C3 80%);box-shadow:0 0 18px #00E5C3}
.jf .wd small{color:#3F2063}
.left{font-size:14px;color:var(--muted);text-align:center;margin-top:8px}
.hint{margin-top:10px;background:var(--note);border-radius:14px;padding:10px;line-height:1.6}
/* maklum balas & hasil */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px;display:flex;justify-content:center;animation:up .3s}
.fb .in{max-width:520px;width:100%;background:var(--card);border:3px solid var(--ok);border-radius:24px 24px 18px 18px;padding:12px;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
.row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.row1 .squid{width:64px;height:64px}
.row1 strong{font-size:20px;color:var(--ok)}.row1 p{margin:2px 0 0;line-height:1.6}
@keyframes up{from{transform:translateY(100%)}}
.res{text-align:center}.res .btn{width:100%}.res .squid{width:120px;height:120px}
.stars{font-size:46px}.stars span{display:inline-block;animation:pop .5s backwards}.stars .off{filter:grayscale(1) opacity(.3)}
@keyframes pop{from{transform:scale(0)}}
.gotst{margin:12px 0;padding:10px;border-radius:16px;background:var(--note);display:flex;align-items:center;gap:10px;justify-content:center}
.gotst span{font-size:40px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti span{position:absolute;top:-30px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:18px;font-weight:700;z-index:70;max-width:92vw;text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<main class="wrap" id="app"></main>
<script>
/* ===================== KANDUNGAN: Jawi Tahun 5 "Kapal Selam Aksara" ===================== */
/* Buku teks Jawi Tahun 5 (JAIS). Fail pN.jpg = ms. N-8 (ms.1 = p9). Ejaan Jawi disalin daripada buku. */
const KS = ["Kata dasar","کات داسر"];
const STATIONS = [
{ id:1, icon:"🐠", c:"#2EC4B6", depth:"-100 m", sticker:"🐠",
  t:["Imbuhan -an: ن","ايمبوهن -an: ن"], u:["Pelajaran 1 • Unit 1 • ms. 2-9","ڤلاجرن 1 • اونيت 1 • م.س. 2-9"],
  read:[
  { pic:"🫧", p:"2", h:["Tiga cara menulis -an","تيڬ چارا منوليس -an"],
    text:["Imbuhan -an ditulis dalam Jawi dengan tiga cara: huruf ن, huruf ان dan huruf ءن.","ايمبوهن -an دتوليس دالم جاوي دڠن تيڬ چارا: حروف ن، حروف ان دان حروف ءن."],

  read:[
  { pic:"🕋", p:"38-39", h:["Istilah agama: hamzah","ايستيله اڬام: همزة"],

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[620,.1],[930,.18]]),
  ping: () => tone([[1400,.25,"sine"]]),
  no:   () => tone([[200,.18,"square"],[160,.2,"square"]]),
  pop:  () => tone([[500,.05,"triangle"],[900,.07,"triangle"]]),
  whoosh: () => tone([[300,.08,"sawtooth"],[180,.12,"sawtooth"]]),
  win:  () => tone([[392,.14],[523,.14],[659,.14],[784,.3]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const ARABIC = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF\u200c]+/g;
const clean = s => String(s||"").replace(ARABIC," ").replace(/___/g," tempat kosong ").replace(/[()\[\]]/g," ").replace(/\s+([.,;:!?])/g,"$1").replace(/\s{2,}/g," ").trim();
function speak(text, force){
  stopHuruf();
  const t = clean(text);
  if(!ttsOK || !t || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

let TIMERS = [];
const SPD = window.__kafaFast ? .02 : 1; // ujian asap mempercepat animasi

const rndLbl = (k,n) => `<div class="rnd">${L("Pusingan","ڤوسيڠن")} ${k+1}/${n}</div>`;
const GAMES = {
  /* Sonar: dengar ping, pilih ejaan Jawi yang betul (beberapa pusingan) */
  sonar(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const [w, bad] = g.rounds[r];
      const opts = shuffle([{s:w[1],ok:1}, ...bad.map(s=>({s,ok:0}))]);
      el.innerHTML = rndLbl(r, g.rounds.length) + `<div class="sonar"><div class="target" id="tg"><span class="big">${esc(w[0])}</span>${sayBtn(w[0])}</div>
        <div class="opts one">${opts.map(o=>`<button class="op blip jw" data-ok="${o.ok}">${o.s}</button>`).join("")}</div></div>`;
      sfx.ping(); busy = false;
      el.querySelectorAll(".op").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(b.dataset.ok==="1"){ busy = true; b.classList.add("right"); sfx.pop(); clearHint();
          if(++r < g.rounds.length) later(draw, 550); else later(win, 450); }
        else { b.classList.add("wrong"); oops(b, L("Ejaan itu tidak betul. Ingat rumus dalam kad bacaan.","ايجاءن ايت تيدق بتول. ايڠت روموس دالم کد باچاءن.")); }
      }));
    };
    draw();
  },
  /* Kapsul: kata dasar + kapsul imbuhan = kata berimbuhan */
  kapsul(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const [base, k] = g.rounds[r];
      el.innerHTML = rndLbl(r, g.rounds.length) + `<div class="target" id="tg" data-ans="${k}"><div class="eq">${W(base)} <b>+</b> <span class="slot" id="slot">❔</span> <b>=</b> <span class="slot" id="res">❔</span></div></div>
        <div class="caps">${g.sufs.map((s,i)=>`<button class="cap" data-k="${i}"><span class="jw">${s}</span></button>`).join("")}</div>`;
      busy = false;
      el.querySelectorAll(".cap").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.k===k){ busy = true; sfx.whoosh(); clearHint();
          $("#slot").innerHTML = JW(g.sufs[k]); $("#res").innerHTML = W(g.rounds[r][2]); $("#res").classList.add("right");
          speak(g.rounds[r][2][0]);
          if(++r < g.rounds.length) later(draw, 1100); else later(win, 900); }
        else { b.classList.add("wrong"); later(()=>b.classList.remove("wrong"), 500); oops(b, L("Kapsul itu tidak sesuai. Lihat huruf akhir kata dasar.","کاڤسول ايت تيدق سسواي. ليهت حروف اخير کات داسر.")); }
      }));
    };
    draw();
  },
  /* Torpedo: pilih perkataan, tembak ke tiub kategori */
  torpedo(el, g){
    const order = mix(g.items.map((_,i)=>i)); let sel = null, left = g.items.length;
    el.innerHTML = `<div class="tray">${order.map(i=>`<button class="tk" data-i="${i}">${W(g.items[i][0])}</button>`).join("")}</div>
      <div class="tubes n${g.bins.length}">${g.bins.map((b,k)=>`<button class="tube" data-b="${k}"><span>🚀</span><span class="${isJ()?"":"ttl"}">${T(b)}</span><span class="in"></span></button>`).join("")}</div>
      <div class="left" id="left"></div>`;
    const upd = () => { $("#left").textContent = L(`Tinggal ${left} lagi`,`تيڠڬل ${left} لاڬي`); };
    upd();
    el.querySelectorAll(".tk").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".tk").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; sfx.pop();
      speak(g.items[sel][0][0]);
    }));
    el.querySelectorAll(".tube").forEach(t => t.addEventListener("click", () => {
      if(sel===null){ toast(L("Tekan satu perkataan dahulu 👆","تکن ساتو ڤرکاتاءن دهولو 👆")); return; }
      const it = g.items[sel], b = el.querySelector(`.tk[data-i="${sel}"]`);
      if(+t.dataset.b===it[1]){ sfx.whoosh(); clearHint(); b.classList.remove("sel"); b.classList.add("used"); t.querySelector(".in").insertAdjacentHTML("beforeend", `<b class="jw">${it[0][1]}</b>`); sel = null; left--; upd();
        if(!left) later(win, 450); }
      else oops(t, L("Bukan tiub itu. Fikir semula rumusnya.","بوکن تيوب ايت. فيکير سمولا روموسڽ."));
    }));
  },
  /* Periskop: isi tempat kosong dalam ayat */
  periskop(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const [s, k] = g.rounds[r];
      const txt = T(s).replace("___", `<span class="blank" id="blank">&nbsp;?&nbsp;</span>`);
      el.innerHTML = rndLbl(r, g.rounds.length) + `<div class="lens ${isJ()?"jw":""}" id="tg">🔭 ${txt}</div>
        <div class="opts">${shuffle(g.opts.map((o,i)=>({o,i}))).map(x=>`<button class="op" data-ok="${x.i===k?1:0}">${W(x.o, true)}</button>`).join("")}</div>`;
      busy = false;
      el.querySelectorAll(".op").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(b.dataset.ok==="1"){ busy = true; b.classList.add("right"); sfx.pop(); clearHint(); $("#blank").innerHTML = JW(g.opts[k][1]);
          speak(RU(s).replace("___", g.opts[k][0]));
          if(++r < g.rounds.length) later(draw, 1300); else later(win, 1000); }
        else { b.classList.add("wrong"); oops(b, L("Perkataan itu tidak sesuai dengan ayat.","ڤرکاتاءن ايت تيدق سسواي دڠن ايات.")); }
      }));
    };
    draw();
  },
  /* Radar: betul atau salah */
  radar(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const [s, ok] = g.rounds[r];
      el.innerHTML = rndLbl(r, g.rounds.length) + `<div class="stmt" id="tg" data-ok="${ok?1:0}">📡 ${T(s)} ${sayBtn(RU(s))}</div>
        <div class="opts"><button class="op tfb t" data-v="1">✅ ${L("Betul","بتول")}</button><button class="op tfb f" data-v="0">❌ ${L("Salah","ساله")}</button></div>`;
      busy = false;
      el.querySelectorAll(".tfb").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if((b.dataset.v==="1")===ok){ busy = true; b.classList.add("right"); sfx.ping(); clearHint();
          if(++r < g.rounds.length) later(draw, 600); else later(win, 450); }
        else oops(b, L("Radar silap! Baca pernyataan sekali lagi.","رادر سيلڤ! باچ ڤڽاتاءن سکالي لاڬي."));
      }));
    };
    draw();
  },
  /* Palka: susun kepingan huruf untuk membuka palka */
  palka(el, g){
    const tiles = mix([...g.parts, ...g.extra]); let k = 0;
    el.innerHTML = `<div class="target"><span class="big">${esc(g.w[0])}</span>${sayBtn(g.w[0])}</div>
      <div class="hatch" id="built" aria-live="polite">🔒</div>
      <div class="tiles">${tiles.map((t,i)=>`<button class="tl jw" data-t="${t}" data-i="${i}">${t}</button>`).join("")}</div>`;
    el.querySelectorAll(".tl").forEach(b => b.addEventListener("click", () => {
      if(k>=g.parts.length) return;
      const t = b.dataset.t;
      if(t===g.parts[k]){
        b.classList.add("used"); k++; sfx.pop(); clearHint(); if(isHuruf(t)) sayHuruf(t);
        $("#built").innerHTML = JW(g.parts.slice(0,k).join(g.join));
        if(k===g.parts.length){ $("#built").classList.add("right"); later(win, 600); }
      } else oops(b, L(`Bukan kepingan itu. Kepingan ke-${k+1} ialah …?`,`بوکن کڤيڠن ايت. کڤيڠن ک-${k+1} اياله …؟`));
    }));
  },
  /* Mutiara: buka kerang, pasangkan dua sisi */
  mutiara(el, g){
    const L1 = shuffle(g.pairs.map((_,i)=>i)), R1 = mix(L1);
    let pick = null, left = g.pairs.length;
    el.innerHTML = `<div class="clams"><div class="col">${L1.map(i=>`<button class="sh ${g.lj?"jw":""}" data-k="${i}">🐚 ${g.lj?g.pairs[i][0]:esc(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="col">${R1.map(i=>`<button class="pr jw" data-k="${i}">${g.pairs[i][1]}</button>`).join("")}</div></div>`;
    el.querySelectorAll(".sh").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".sh").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); pick = b; sfx.pop();
      if(!g.lj) speak(g.pairs[+b.dataset.k][0]);
    }));
    el.querySelectorAll(".pr").forEach(p => p.addEventListener("click", () => {
      if(!pick){ toast(L("Tekan kerang di kiri dahulu 🐚","تکن کرڠ د سبله کانن دهولو 🐚")); return; }
      if(pick.dataset.k===p.dataset.k){ sfx.ok(); clearHint(); pick.classList.add("done","right"); p.classList.add("done","right"); pick.classList.remove("sel"); pick = null;
        if(!--left) later(win, 450); }
      else oops(p, L("Mutiara itu bukan pasangannya.","موتيارا ايت بوکن ڤاسڠنڽ."));
    }));
  },
  /* Ubur-ubur: nyalakan semua yang menepati rumus */
  ubur(el, g){
    const order = mix(g.items.map((_,i)=>i)); let need = g.items.filter(x=>x[1]).length;
    el.innerHTML = `<div class="jelly">${order.map((i,n)=>`<button class="jf" data-ok="${g.items[i][1]}" style="animation-delay:-${n*.5}s">${W(g.items[i][0], !g.showR)}</button>`).join("")}</div>
      <div class="left" id="left"></div>`;
    const upd = () => { $("#left").textContent = L(`Tinggal ${need} lagi`,`تيڠڬل ${need} لاڬي`); };
    upd();
    el.querySelectorAll(".jf").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("lit")) return;
      if(b.dataset.ok==="1"){ b.classList.add("lit"); sfx.ping(); clearHint(); need--; upd(); if(!need) later(win, 450); }
      else oops(b, L("Obor-obor itu tidak menepati rumus.","اوبور٢ ايت تيدق منڤتي روموس."));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const hz = e.target.closest("[data-huruf]");
  if(hz){ sayHuruf(hz.dataset.huruf, true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan stesen sebelumnya dahulu 🔒","سلسايکن ستيسن سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} stesen untuk membuka Cabaran Palung Mutiara 💎`,`سلسايکن سموا ${STATIONS.length} ستيسن اونتوق ممبوک چابرن ڤالوڠ موتيارا 💎`)); }
  else if(a==="map"){ renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa selepas tukar tulisan/suara, tanpa mengulang konfeti
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  renderPlay();
}
applyLang();
renderMap();
</script>
