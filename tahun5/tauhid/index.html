<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1F5E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Balai Cerap Iman • Tauhid Tahun 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Sansita:wght@700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tauhid Tahun 5: "Balai Cerap Iman" — balai cerap di atas bukit, carta bintang, Bubu si kongkang ===== */
:root{
  --sky1:#1B1F5E; --sky2:#5B4BA8; --sky3:#E88FB0; --bg:#F1ECFF; --card:#FFFDF7; --ink:#1C1A3A; --muted:#58557E; --line:#1C1A3A;
  --brand:#3B40B8; --brand2:#262A86; --gold:#FFC93C; --gold2:#D99A00; --teal:#22A6A3; --rose:#E8507E; --hill:#26305E; --hill2:#1A2148;
  --ok:#1F9A62; --okbg:#DDF6EA; --bad:#D63A4A; --badbg:#FFE1E5; --note:#FFF3CC; --chip:#EEEAFE;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#05071C; --sky2:#141A4A; --sky3:#3A2A6A; --bg:#090C22; --card:#161B42; --ink:#EEF0FF; --muted:#B3B7E4; --line:#02030F;
    --brand:#6E74F0; --brand2:#4A50D0; --hill:#111733; --hill2:#0A0E24; --note:#2E2A12; --okbg:#123A2A; --badbg:#46161F; --chip:#232A5C; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Varela Round","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background:
    radial-gradient(1.5px 1.5px at 20px 30px,#fff 98%,transparent),radial-gradient(1px 1px at 90px 80px,#fff 98%,transparent),
    radial-gradient(1.6px 1.6px at 150px 20px,#FFE9A8 98%,transparent),radial-gradient(1px 1px at 60px 140px,#fff 98%,transparent),
    radial-gradient(1.2px 1.2px at 170px 120px,#fff 98%,transparent);
  background-size:200px 170px,200px 170px,200px 170px,200px 170px,200px 170px;
  background-color:var(--sky1);
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 55%,var(--sky3) 100%);opacity:.92}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Varela Round",serif;font-size:19px;line-height:1.75}
#app{max-width:560px;margin:0 auto;padding:10px 14px 110px}
h1,h2,h3{font-family:"Sansita","Varela Round",sans-serif;font-weight:800;line-height:1.2;margin:0}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700;line-height:1.6}
.ar,[lang="ar"]{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;line-height:2}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;box-shadow:0 4px 0 var(--line);font-weight:700}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--gold);color:#2A1E00;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.hero{display:flex;align-items:center;gap:12px;color:#fff;margin:4px 0 12px}
.hero h1{font-size:30px;color:#FFE08A;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hero p{margin:4px 0 0;font-size:16px;color:#E9E6FF}
.bubu{width:96px;height:96px;flex:0 0 96px}
.bob{animation:bob 3s ease-in-out infinite}
.yay{animation:yay .8s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes yay{30%{transform:rotate(-8deg) scale(1.08)}70%{transform:rotate(8deg) scale(1.08)}}
.sttl{color:#FFE08A;font-weight:700;margin:10px 0 6px}
.stickers{display:flex;flex-wrap:wrap;gap:6px;background:rgba(255,255,255,.1);border:2px dashed rgba(255,224,138,.6);border-radius:18px;padding:8px}
.stickers span{width:42px;height:42px;display:grid;place-items:center;font-size:24px;border-radius:50%;background:rgba(255,255,255,.08);filter:grayscale(1) brightness(.6);opacity:.55}
.stickers span.got{filter:none;opacity:1;background:radial-gradient(circle,#FFE9A8 0,#FFC93C 60%,#D99A00 100%);box-shadow:0 0 12px #FFD76A}
/* ---------- Peta: carta bintang mendaki bukit ---------- */
.chart{position:relative;margin-top:16px;padding:8px 0 150px;border-radius:28px;overflow:hidden;
  background:radial-gradient(circle at 50% 0,rgba(255,255,255,.12),transparent 60%)}
.chart::before{content:"";position:absolute;left:50%;top:150px;bottom:120px;width:0;border-left:4px dotted rgba(255,224,138,.55);transform:translateX(-50%)}
.hill{position:absolute;left:0;right:0;bottom:0;height:150px;
  background:radial-gradient(120% 100% at 30% 100%,var(--hill) 60%,transparent 61%),radial-gradient(90% 80% at 85% 100%,var(--hill2) 60%,transparent 61%)}
.gate{position:absolute;left:0;right:0;bottom:22px;text-align:center;z-index:2}
.gate span{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.nrow{display:flex;justify-content:flex-start;padding:0 4%;margin:6px 0;position:relative;z-index:1}
.nrow.r{justify-content:flex-end}
.node{width:58%;max-width:250px;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:#fff}
.disc{position:relative;width:118px;height:118px;border-radius:50%;border:4px solid var(--line);display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 55%,#000));
  box-shadow:0 0 0 6px rgba(255,255,255,.15),0 6px 0 var(--line)}
.disc svg.cst{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.disc .ico{position:relative;font-size:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.disc .badge{position:absolute;top:-6px;inset-inline-start:-6px;width:36px;height:36px;border-radius:50%;background:var(--gold);color:#2A1E00;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-family:"Sansita",sans-serif}
.node.lock .disc{filter:grayscale(.85) brightness(.7)}
.node.now .disc{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(255,224,138,.45),0 0 26px #FFD76A,0 6px 0 var(--line)}}
.node .nm{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:4px 10px;font-weight:700;font-size:16px;line-height:1.3;max-width:100%;overflow-wrap:break-word;hyphens:auto}
.node .st{min-height:22px;font-size:16px;letter-spacing:1px}
.st span.off,.stars span.off{filter:grayscale(1);opacity:.3}
.bubu.walk{position:absolute;width:62px;height:62px;top:-14px;inset-inline-end:-30px;z-index:3}
.domerow{display:flex;justify-content:center;position:relative;z-index:1;margin-bottom:10px}
.dome{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;color:#fff}
.dome svg.dsvg{width:190px;height:150px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.dome.lock svg.dsvg{filter:grayscale(.7) brightness(.75)}
.dome.now svg.dsvg{animation:bob 2.4s ease-in-out infinite}
.dome .nm{background:var(--gold);color:#2A1E00;border:3px solid var(--line);border-radius:14px;padding:4px 12px;font-weight:800}
.dome .bubu{position:absolute;width:60px;height:60px;top:40px;inset-inline-start:-40px}
</style>
<style>
/* ---------- Kad baca dan permainan ---------- */
.card{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 6px 0 var(--line);margin-top:10px;position:relative}
.shead{display:flex;align-items:center;gap:10px;color:#fff;margin:4px 0 6px}
.shead h2{font-size:22px;color:#FFE08A}
.shead small{display:block;color:#E3E0FF;font-size:14px}
.bub{width:52px;height:52px;flex:0 0 52px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:3px solid var(--line);
  background:radial-gradient(circle at 35% 30%,#fff8,var(--c) 60%)}
.rpic{font-size:40px;text-align:center;margin-bottom:4px}
.rh{font-size:21px;display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px;color:var(--brand)}
html[dir="rtl"] .rh{font-size:21px}
.say{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--gold);font-size:18px;display:grid;place-items:center;padding:0}
.rtext{margin:8px 0}
.rlist{margin:6px 0;padding-inline-start:0;list-style:none;display:grid;gap:7px}
.rlist li{background:var(--chip);border-radius:14px;padding:8px 12px;border-inline-start:6px solid var(--sc,var(--brand));animation:pop .4s calc(var(--i)*.05s) both}
.rlist.num{counter-reset:n}
.rlist.num li{counter-increment:n}
.rlist.num li::before{content:counter(n) ". ";font-weight:800;color:var(--brand)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.vs{display:grid;gap:8px;margin:6px 0}
.vs>div{border:2px solid var(--line);border-radius:18px;padding:8px 12px;background:var(--chip)}
.vs>div.m{background:var(--note);margin-inline-start:22px}
.vs b{display:block;font-size:14px;color:var(--muted)}
.abox{background:linear-gradient(180deg,#14184A,#2B2F77);color:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;display:grid;gap:6px}
.abox .ar{font-size:25px;text-align:center;color:#FFE9A8}
.abox .mk{font-size:16px;color:#E9E6FF}
.abox small{color:#C9C6F5;font-size:14px}
.tip{display:flex;gap:8px;background:var(--note);border:2px solid var(--line);border-radius:16px;padding:8px 10px;margin:8px 0;font-size:16px}
.tip.am{background:var(--okbg)}
.ref{font-size:14px;color:var(--muted);margin-top:8px}
.ng{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0}
.nc{background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:6px 8px;text-align:center;min-width:0;overflow-wrap:break-word;hyphens:auto}
.nc .ar{display:block;font-size:24px;line-height:1.6;color:var(--brand)}
.nc small{display:block;font-size:13px;color:var(--muted)}
.nc span{display:block;font-size:15px;font-weight:700}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:54px;border-radius:18px;border:3px solid var(--line);background:var(--brand);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--line);padding:8px 14px;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--gold);color:#2A1E00}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--gold2);transform:scale(1.3)}
.prog{position:relative;height:40px;margin:6px 4px 0}
.prog .row{position:absolute;left:0;right:0;top:18px;height:5px;border-radius:5px;background:rgba(255,255,255,.3)}
.prog .pf{position:absolute;top:8px;transform:translateX(-50%);font-size:18px}
html[dir="rtl"] .prog .pf,html[dir="rtl"] .prog .fly{transform:translateX(50%)}
.prog .fly{position:absolute;top:-2px;transform:translateX(-50%);font-size:26px;transition:all .4s}
.q{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.q p{margin:0;font-weight:700;font-size:19px}
#play{margin-top:12px}
.hint{margin-top:10px;background:var(--badbg);border:2px solid var(--bad);border-radius:14px;padding:8px 10px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cnt{text-align:center;color:var(--muted);font-weight:700;margin-top:10px;font-size:16px}
.tile{border:3px solid var(--line);border-radius:16px;background:var(--chip);color:var(--ink);padding:10px;min-height:54px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--line);min-width:0;overflow-wrap:break-word;hyphens:auto;line-height:1.35}
html[dir="rtl"] .tile{font-size:18px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.sel{background:var(--gold);color:#2A1E00;outline:4px solid #fff}
.tile.ok,.tile.done{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.tile.done{opacity:.6}
.tile.no{background:var(--badbg)}
.tile .ar{font-size:24px;line-height:1.5;display:block}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.one{grid-template-columns:minmax(0,1fr)}
/* teleskop */
.scope{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:12px}
.lens{width:150px;height:150px;border-radius:50%;border:8px solid #2B2F77;outline:4px solid var(--line);display:grid;place-items:center;text-align:center;padding:14px;
  background:radial-gradient(circle,#2B2F77 0,#0B0E2C 70%);color:#FFE9A8;font-weight:800;font-size:15px;transition:filter .5s;filter:blur(1.5px)}
.lens.clear{filter:none;background:radial-gradient(circle,#FFF4C7 0,#FFC93C 70%);color:#2A1E00}
.lens .ar{font-size:30px;color:inherit}
.tube{width:70px;height:34px;background:linear-gradient(#4A50D0,#262A86);border:3px solid var(--line);border-radius:8px;transform:rotate(-12deg)}
html[dir="rtl"] .tube{transform:rotate(12deg)}
/* gerhana */
.moonbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.moon{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF8D6,#FFD76A 70%);border:3px solid var(--line);box-shadow:0 0 20px #FFD76A;transition:all .4s}
.moon.ecl{background:radial-gradient(circle at 70% 40%,#3B3F6E,#0B0E2C 70%);box-shadow:0 0 18px #E8507E}
.stmt{background:var(--chip);border:2px solid var(--line);border-radius:16px;padding:10px 12px;text-align:center;font-weight:700;min-height:64px;width:100%}
</style>
<style>
/* carta */
.cur{background:var(--note);border:3px dashed var(--line);border-radius:16px;padding:10px;text-align:center;font-weight:800;min-height:60px;display:grid;place-items:center}
.cols{display:grid;gap:8px;margin-top:10px}
.cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.col{border:3px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#22286A,#14184A);color:#fff;padding:8px 6px 10px;min-height:120px;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;box-shadow:0 4px 0 var(--line)}
.col h4{margin:0;font-size:16px;color:#FFE08A;overflow-wrap:break-word;hyphens:auto}
.col .chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.col .chips i{font-style:normal;font-size:18px}
/* kubah */
.domebox{display:flex;justify-content:center;margin-bottom:8px}
.domebox svg{width:130px;height:96px}
.domebox .slit{transition:transform .6s;transform-origin:65px 60px}
.domebox.open .slit{transform:scaleX(3.2)}
.sent{background:var(--chip);border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;margin-bottom:12px}
.gap{display:inline-block;min-width:80px;border-bottom:3px dashed var(--brand);text-align:center;color:var(--brand);padding:0 4px}
.gap.ok{border-color:var(--ok);color:var(--ok)}
/* meteor */
.sky{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;border-radius:18px;background:linear-gradient(180deg,#0B0E2C,#22286A)}
.met{position:relative;padding-inline-start:34px;text-align:start;background:#2B2F77;color:#fff;border-color:#000}
.met::before{content:"☄️";position:absolute;inset-inline-start:6px;top:8px;font-size:20px}
.met.got{background:#FFC93C;color:#2A1E00}
.met.got::before{content:"🌟"}
/* komet */
.cbar{height:12px;border-radius:8px;background:var(--chip);border:2px solid var(--line);overflow:hidden;margin-bottom:10px}
.cbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FFC93C,#E8507E);transition:width .25s linear}
.cprompt{text-align:center;font-weight:800;font-size:19px;margin:6px 0 12px;min-height:56px}
.cprompt .ar{font-size:32px}
.bonus{display:inline-block;margin-inline-start:8px;color:var(--gold2)}
/* orbit */
.orb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.orb .pl{border-radius:999px;background:radial-gradient(circle at 30% 30%,#8F94FF,#3B40B8 70%);color:#fff}
.orb .pl.sel{background:var(--gold);color:#2A1E00}
.orb .mn{border-radius:18px}
.orb .pl.done,.orb .mn.done{background:var(--okbg);color:var(--ink)}
.orb h4{margin:0 0 2px;text-align:center;font-size:15px;color:var(--muted)}
.orb .colw{display:flex;flex-direction:column;gap:8px;min-width:0}
/* rasi */
.rsvg{display:block;width:100%;height:120px;border-radius:16px;background:linear-gradient(180deg,#0B0E2C,#22286A);border:3px solid var(--line);margin-bottom:10px}
.rsvg circle{fill:#5B5F9E;transition:all .3s}
.rsvg circle.lit{fill:#FFE08A;filter:drop-shadow(0 0 4px #FFD76A)}
.rsvg line{stroke:#FFE08A;stroke-width:2.5;stroke-dasharray:4 3}
.rch{display:grid;gap:8px}
.rch .tile{text-align:start}
.rch .tile b{display:inline-block;min-width:26px;color:var(--brand)}
/* galaksi */
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;padding:8px;border:3px dashed var(--line);border-radius:16px;background:var(--note);margin-bottom:10px}
.slots span{background:var(--brand);color:#fff;border-radius:12px;padding:4px 10px;font-weight:700;animation:pop .3s}
.slots .ar,.pool .ar{font-size:24px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pool .tile{min-height:48px}
.pool .tile.used{visibility:hidden}
/* maklum balas, keputusan */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));animation:up .3s}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{width:100%;max-width:560px;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:24px;padding:12px 14px;box-shadow:0 -4px 24px rgba(0,0,0,.35)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .bubu{width:64px;height:64px;flex:0 0 64px}
.fb strong{font-family:"Sansita",sans-serif;font-size:22px;color:var(--ok)}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif}
.fb p{margin:2px 0 0;font-size:16px}
.res{text-align:center}
.res .bubu{width:120px;height:120px}
.stars{font-size:46px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .5s both}
.res h2{font-size:28px;color:var(--brand);margin:6px 0}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border:2px dashed var(--line);border-radius:16px;padding:8px;margin:10px 0;font-weight:700}
.gotst span{font-size:38px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

const cleanSpeech = s => s.replace(/<[^>]+>/g," ").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/___/g," ... ").replace(/[“”]/g," ").replace(/\br\.a\./g,"radhiallahuanhu").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanSpeech(text));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===================== STESEN: MAIN ===================== */
let timers = [];
const later = (f,ms) => { const t = setTimeout(f, window.KAFA_FAST ? 0 : ms); timers.push(t); return t; };   // KAFA_FAST: ujian asap sahaja
const clearTimers = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };
function progressBar(){
  const n = S.games.length, k = S.gi, side = isJ() ? "right" : "left";
  const flags = S.games.map((_,i)=>`<span class="pf" style="${side}:${(i+.5)/n*100}%">${i<k?"⭐":"·"}</span>`).join("");
  const pos = Math.max(5, Math.min(95, (k+.5)/n*100));
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="row"></span>${flags}
    <span class="fly" style="${side}:${pos}%">🔭</span></div>`;
}
function renderPlay(){
  hush(); clearTimers();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play" data-type="${g.type}"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🐾 ${hint || L("Hmm, cerap sekali lagi!","همم، چرڤ سكالي لاڬي!")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(extra){
  if(document.querySelector(".fb")) return;
  clearTimers(); sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${bubu("yay")}<div><strong>${T(p)}${extra||""}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  clearTimers();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Langit imanmu bersinar terang!","چمرلڠ! لاڠيت ايمانمو برسينر تراڠ!"] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom cerap lagi.","شاباس كران منچوبا! جوم چرڤ لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${bubu("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Bintang baharu dalam koleksimu!","بينتڠ بهارو دالم كوليكسيمو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🔭 ${L("Cerapan Agung kini dibuka!","چرڤن اڬوڠ كيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🗺️ ${L("Kembali ke peta","کمبالي ک ڤتا")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN ===================== */
const GAMES = {
  /* Teleskop: lensa kabur; pilih jawapan betul untuk memfokuskan teropong */
  teleskop(el, g){
    const opts = shuffle(g.o.map((t,i)=>({t, ok:i===0?1:0})));
    el.innerHTML = `<div class="scope"><div class="lens" id="lens">${T(g.lens)}</div><div class="tube" aria-hidden="true"></div></div>
      <div class="opts ${opts.some(o=>RU(o.t).length>34)?"one":""}">${opts.map(o=>`<button class="tile opt" data-ok="${o.ok}">${T(o.t)}</button>`).join("")}</div>`;
    let done = false;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("no")) return;
      if(b.dataset.ok==="1"){ done = true; clearHint(); b.classList.add("ok"); el.querySelector("#lens").classList.add("clear"); sfx.twink(); later(win, 600); }
      else { b.classList.add("no"); oops(b, L("Lensa masih kabur. Cuba pilihan lain!","لنسا ماسيه كابور. چوبا ڤيليهن لاٴين!")); }
    }));
  },

  /* Gerhana: bulan terang = betul, gerhana = salah */
  gerhana(el, g){
    const items = mix(g.items); let k = 0;
    el.innerHTML = `<div class="moonbox"><div class="moon" id="moon" aria-hidden="true"></div><div class="stmt" id="gtxt"></div></div>
      <div class="opts" style="margin-top:12px"><button class="tile gb" data-v="1">🌕 ${L("Betul (terang)","بتول (تراڠ)")}</button><button class="tile gb" data-v="0">🌑 ${L("Salah (gerhana)","ساله (ڬرهان)")}</button></div>
      <div class="cnt" id="gcnt"></div>`;
    const show = () => {
      const t = el.querySelector("#gtxt"), it = items[k];
      t.innerHTML = it ? T(it[0]) : "🎉"; t.dataset.v = it ? it[1] : "";
      el.querySelector("#gcnt").textContent = `🌙 ${Math.min(k+1,items.length)} / ${items.length}`;
      if(it) speak(RU(it[0]));
    };
    show();
    el.querySelectorAll(".gb").forEach(b => b.addEventListener("click", () => {
      if(k>=items.length) return;
      if(+b.dataset.v===items[k][1]){
        el.querySelector("#moon").classList.toggle("ecl", !items[k][1]);
        sfx.tick(); clearHint(); k++; show();
        if(k===items.length) later(win, 450);
      } else oops(el.querySelector("#gtxt"), items[k][1] ? L("Pernyataan ini BETUL. Biar bulan bersinar!","ڤڽاتاٴن اين بتول. بيار بولن برسينر!") : L("Pernyataan ini SALAH. Ia gerhana!","ڤڽاتاٴن اين ساله. اي ڬرهان!"));
    }));
  },

  /* Carta: susun setiap kad ke lajur carta bintang yang betul */
  carta(el, g){
    const items = mix(g.items); let k = 0;
    el.innerHTML = `<div class="cur" id="ctxt"></div>
      <div class="cols c${g.cols.length}">${g.cols.map((c,i)=>`<button class="col" data-c="${i}"><h4>${T(c)}</h4><span class="chips"></span></button>`).join("")}</div>
      <div class="cnt" id="ccnt"></div>`;
    const show = () => {
      const t = el.querySelector("#ctxt");
      t.innerHTML = k<items.length ? T(items[k][0]) : "🎉"; t.dataset.c = k<items.length ? items[k][1] : "";
      el.querySelector("#ccnt").textContent = `🗂️ ${Math.min(k+1,items.length)} / ${items.length}`;
      if(k<items.length) speak(RU(items[k][0]));
    };
    show();
    el.querySelectorAll(".col").forEach(b => b.addEventListener("click", () => {
      if(k>=items.length) return;
      if(+b.dataset.c===items[k][1]){
        sfx.twink(); clearHint(); b.querySelector(".chips").insertAdjacentHTML("beforeend","<i>⭐</i>"); k++; show();
        if(k===items.length) later(win, 450);
      } else oops(b, L("Bukan carta ini. Fikir semula!","بوكن كارتا اين. فيكير سمولا!"));
    }));
  },

  /* Kubah: pilih perkataan untuk tempat kosong; kubah balai cerap terbuka */
  kubah(el, g){
    const opts = shuffle(g.o.map((t,i)=>({t, ok:i===0?1:0})));
    const sent = T(g.s).replace("___", `<span class="gap" id="gap">?</span>`);
    el.innerHTML = `<div class="domebox" id="dbox"><svg viewBox="0 0 130 96" aria-hidden="true">
        <rect x="18" y="60" width="94" height="32" rx="4" fill="#E9E6FF" stroke="#1C1A3A" stroke-width="3"/>
        <path d="M14 62 A51 48 0 0 1 116 62 Z" fill="#C9CCF5" stroke="#1C1A3A" stroke-width="3"/>
        <rect class="slit" x="60" y="16" width="10" height="46" fill="#14184A"/>
        <circle cx="96" cy="14" r="4" fill="#FFE08A"/><circle cx="30" cy="22" r="2.5" fill="#FFE08A"/></svg></div>
      <div class="sent">${sent}</div>
      <div class="opts">${opts.map(o=>`<button class="tile ko" data-ok="${o.ok}">${T(o.t)}</button>`).join("")}</div>`;
    let done = false;
    el.querySelectorAll(".ko").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("no")) return;
      if(b.dataset.ok==="1"){
        done = true; clearHint(); b.classList.add("ok");
        const gp = el.querySelector("#gap"); gp.innerHTML = T(g.o[0]); gp.classList.add("ok");
        el.querySelector("#dbox").classList.add("open"); sfx.dome(); later(win, 700);
      } else { b.classList.add("no"); oops(b, L("Kubah masih tertutup. Cuba perkataan lain!","كوبه ماسيه ترتوتوڤ. چوبا ڤركاتاٴن لاٴين!")); }
    }));
  },

  /* Meteor: tangkap SEMUA meteor yang betul dalam hujan meteor */
  meteor(el, g){
    const items = mix(g.items); const need = items.filter(x=>x[1]).length; let k = 0;
    el.innerHTML = `<div class="sky">${items.map((it,i)=>`<button class="tile met" data-i="${i}" data-ok="${it[1]}">${T(it[0])}</button>`).join("")}</div>
      <div class="cnt" id="mcnt">☄️ 0 / ${need}</div>`;
    el.querySelectorAll(".met").forEach(b => b.addEventListener("click", () => {
      if(k>=need || b.classList.contains("got")) return;
      if(b.dataset.ok==="1"){
        k++; sfx.twink(); clearHint(); b.classList.add("got");
        el.querySelector("#mcnt").textContent = `☄️ ${k} / ${need}`;
        if(k===need) later(win, 450);
      } else { b.classList.add("no"); later(()=>b.classList.remove("no"), 700); oops(b, L("Meteor itu bukan jawapannya!","ميتيور ايت بوكن جاوڤنڽ!")); }
    }));
  },

  /* Komet: soalan pantas 2 pilihan; jawab sebelum ekor komet habis untuk bonus ⚡ */
  komet(el, g){
    const items = mix(g.items); let k = 0, bonus = 0, left = 100, slip = false, iv = null;
    el.innerHTML = `<div class="cbar"><i id="cbar"></i></div><div class="cprompt" id="kp"></div><div class="opts" id="kopts"></div>
      <div class="cnt" id="kcnt"></div>`;
    const show = () => {
      if(iv) clearInterval(iv);
      const it = items[k]; slip = false; left = 100;
      const os = shuffle([{t:it[1],ok:1},{t:it[2],ok:0}]);
      el.querySelector("#kp").innerHTML = T(it[0]);
      el.querySelector("#kopts").innerHTML = os.map(o=>`<button class="tile kb" data-ok="${o.ok}">${T(o.t)}</button>`).join("");
      el.querySelector("#kcnt").innerHTML = `☄️ ${k+1} / ${items.length}<span class="bonus">⚡ ${bonus}</span>`;
      el.querySelector("#cbar").style.width = "100%";
      iv = setInterval(() => { left = Math.max(0, left-2.5); const b = el.querySelector("#cbar"); if(b) b.style.width = left+"%"; if(!left) clearInterval(iv); }, 250);
      timers.push(iv);
      speak(RU(it[0]));
      el.querySelectorAll(".kb").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length || b.classList.contains("no")) return;
        if(b.dataset.ok==="1"){
          if(!slip && left>0) bonus++;
          sfx.whoosh(); clearHint(); k++;
          if(k===items.length){ clearInterval(iv); b.classList.add("ok"); later(()=>win(` ⚡${bonus}`), 350); } else show();
        } else { slip = true; b.classList.add("no"); oops(b, L("Komet tersasar! Pilih yang satu lagi.","كوميت ترساسر! ڤيليه يڠ ساتو لاڬي.")); }
      }));
    };
    show();
  },

  /* Orbit: pilih planet, kemudian bulan pasangannya */
  orbit(el, g){
    const pls = g.pairs.map((p,i)=>({t:p[0], i})), mns = mix(g.pairs.map((p,i)=>({t:p[1], i})));
    let sel = null, n = 0;
    el.innerHTML = `<div class="orb"><div class="colw"><h4>🪐 ${L("Planet","ڤلانيت")}</h4>${pls.map(p=>`<button class="tile pl" data-i="${p.i}">${T(p.t)}</button>`).join("")}</div>
      <div class="colw"><h4>🌙 ${L("Bulan","بولن")}</h4>${mns.map(m=>`<button class="tile mn" data-i="${m.i}">${T(m.t)}</button>`).join("")}</div></div>
      <div class="cnt" id="ocnt">👆 ${L("Pilih planet, kemudian bulannya.","ڤيليه ڤلانيت، كمودين بولنڽ.")}</div>`;
    el.querySelectorAll(".pl").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      el.querySelectorAll(".pl").forEach(x=>x.classList.remove("sel")); sel = +b.dataset.i; b.classList.add("sel"); sfx.tick();
      speak(RU(g.pairs[sel][0]));
    }));
    el.querySelectorAll(".mn").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(sel===null){ toast(L("Pilih planet dahulu 🪐","ڤيليه ڤلانيت دهولو 🪐")); return; }
      const pb = el.querySelector(`.pl[data-i="${sel}"]`);
      if(+b.dataset.i===sel){
        sfx.twink(); clearHint(); b.classList.add("done"); pb.classList.add("done"); pb.classList.remove("sel"); sel = null; n++;
        el.querySelector("#ocnt").textContent = `🪐 ${n} / ${g.pairs.length}`;
        if(n===g.pairs.length) later(win, 450);
      } else oops(b, L("Bulan itu bukan milik planet ini. Cuba lagi!","بولن ايت بوكن ميليق ڤلانيت اين. چوبا لاڬي!"));
    }));
  },

  /* Rasi: sentuh bintang mengikut tertib untuk melukis buruj */
  rasi(el, g){
    const n = g.steps.length, order = mix(g.steps.map((_,i)=>i));
    const P = Array.from({length:n}, (_,i) => [20 + i*(260/(n-1||1)), 30 + ((i*37)%3)*30]);
    el.innerHTML = `<svg class="rsvg" viewBox="0 0 300 120" aria-hidden="true"><g id="rl"></g>${P.map((p,i)=>`<circle id="rc${i}" cx="${p[0]}" cy="${p[1]}" r="7"/>`).join("")}</svg>
      <div class="rch">${order.map(i=>`<button class="tile rs" data-i="${i}"><b></b>${T(g.steps[i])}</button>`).join("")}</div>
      <div class="cnt" id="rcnt">✨ 0 / ${n}</div>`;
    let k = 0;
    el.querySelectorAll(".rs").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || k>=n) return;
      if(+b.dataset.i===k){
        sfx.twink(); clearHint(); b.classList.add("done"); b.querySelector("b").textContent = (k+1)+".";
        el.querySelector("#rc"+k).classList.add("lit");
        if(k>0) el.querySelector("#rl").insertAdjacentHTML("beforeend", `<line x1="${P[k-1][0]}" y1="${P[k-1][1]}" x2="${P[k][0]}" y2="${P[k][1]}"/>`);
        k++; el.querySelector("#rcnt").textContent = `✨ ${k} / ${n}`;
        if(k===n) later(win, 500);
      } else oops(b, L("Bintang itu bukan seterusnya dalam buruj.","بينتڠ ايت بوكن ستروسڽ دالم بروج."));
    }));
  },

  /* Galaksi: cantum serpihan bintang (perkataan) mengikut tertib */
  galaksi(el, g){
    const ar = !!g.ar, parts = ar ? arWords(AR_PLAIN[g.ar]) : g.parts, order = mix(parts.map((_,i)=>i));
    el.innerHTML = `<div class="slots" id="gslots" ${ar?'dir="rtl"':""}></div>
      <div class="pool" ${ar?'dir="rtl"':""}>${order.map(i=>`<button class="tile gx" data-i="${i}">${ar?`<span class="ar" lang="ar">${parts[i]}</span>`:T(parts[i])}</button>`).join("")}</div>
      <div class="cnt" id="gxc">🌌 0 / ${parts.length}</div>`;
    let k = 0;
    el.querySelectorAll(".gx").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=parts.length) return;
      if(+b.dataset.i===k){
        sfx.tick(); clearHint(); b.classList.add("used");
        el.querySelector("#gslots").insertAdjacentHTML("beforeend", `<span>${ar?`<span class="ar" lang="ar">${parts[k]}</span>`:T(parts[k])}</span>`);
        k++; el.querySelector("#gxc").textContent = `🌌 ${k} / ${parts.length}`;
        if(k===parts.length) later(win, 500);
      } else oops(b, L("Serpihan itu bukan yang seterusnya.","سرڤيهن ايت بوكن يڠ ستروسڽ."));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t5-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Lengkapkan buruj sebelumnya dahulu 🔒","لڠكڤكن بروج سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Lengkapkan semua ${STATIONS.length} buruj untuk membuka Cerapan Agung 🔭`,`لڠكڤكن سموا ${STATIONS.length} بروج اونتوق ممبوک چرڤن اڬوڠ 🔭`)); }
  else if(a==="map"){ clearTimers(); document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
