<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E6B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pasar Terapung Lughah • Bahasa Arab Tahun 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chango&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Bahasa Arab Tahun 5: "Pasar Terapung Lughah" — terusan, gerai sampan, Tok Bangau ===== */
:root{
  --sky1:#FFD9A8; --sky2:#FFF1DC; --bg:#E9F7F4; --card:#FFFDF7; --ink:#2B1B0E; --muted:#6B5440; --line:#2B1B0E;
  --water:#1FA3A0; --water2:#7FD6CF; --deep:#0F6E6B; --mango:#FFB627; --chili:#E4572E; --leaf:#3D9A4B; --wood:#8A5A2B;
  --cream:#FFF4DE; --ok:#2E9E4F; --okbg:#DCF5E3; --bad:#D64545; --badbg:#FFE1DC; --note:#FFF3C9;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#2A1830; --sky2:#14262C; --bg:#0C1D21; --card:#173035; --ink:#F7EEDD; --muted:#C9B79E; --line:#050C0E;
    --water:#14807D; --water2:#1E5552; --deep:#0A4A48; --cream:#2B2418; --note:#3A3217; --okbg:#143A24; --badbg:#4A2020; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:700;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 300px,var(--bg) 700px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-size:19px;line-height:1.85}
h1,h2,h3,.cf{font-family:"Chango","Nunito",sans-serif;font-weight:400;letter-spacing:.2px}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;direction:rtl;unicode-bidi:isolate;line-height:1.9}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--mango);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--line);padding:0 10px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--mango);color:#2B1B0E;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;box-shadow:0 3px 0 var(--line)}
/* ---------- hero ---------- */
.hero{display:flex;gap:10px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 var(--line);
  position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:14px;background:repeating-linear-gradient(90deg,var(--chili) 0 22px,var(--cream) 22px 44px);border-bottom:3px solid var(--line)}
.hero > *{position:relative;margin-top:10px}
.hero h1{font-size:23px;line-height:1.15;margin:0 0 4px;color:var(--deep)}
.hero p{margin:0;font-size:15px;color:var(--muted)}
.bangau{width:92px;height:92px;flex:0 0 92px}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.sttl{margin:14px 4px 6px;font-weight:900;color:var(--deep)}
.goods{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:3px dashed var(--wood);border-radius:16px;padding:8px}
.goods span{font-size:24px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--cream);opacity:.28;filter:grayscale(1)}
.goods span.got{opacity:1;filter:none;background:var(--note);box-shadow:0 0 0 2px var(--mango)}
/* ---------- peta terusan ---------- */
.canal{position:relative;margin-top:16px;padding:14px 0 10px;border-radius:26px;overflow:hidden;
  background:
    radial-gradient(ellipse 30px 6px at 20% 12%,rgba(255,255,255,.35) 60%,transparent 62%),
    radial-gradient(ellipse 40px 7px at 75% 42%,rgba(255,255,255,.3) 60%,transparent 62%),
    radial-gradient(ellipse 34px 6px at 30% 78%,rgba(255,255,255,.3) 60%,transparent 62%),
    linear-gradient(180deg,var(--water2),var(--water) 30%,var(--deep));
  border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.canal::before,.canal::after{content:"";position:absolute;top:0;bottom:0;width:14px;background:repeating-linear-gradient(180deg,var(--leaf) 0 18px,#2C7A39 18px 30px);z-index:0}
.canal::before{left:0;border-right:3px solid var(--line)}
.canal::after{right:0;border-left:3px solid var(--line)}
.stall{position:relative;z-index:1;display:flex;align-items:center;gap:10px;width:calc(100% - 64px);min-height:76px;margin:0 0 14px 24px;padding:16px 10px 10px;
  border:3px solid var(--line);border-radius:14px 14px 30px 30px;background:var(--card);box-shadow:0 5px 0 var(--line);text-align:start}
.stall:nth-of-type(even){margin-left:40px}
html[dir="rtl"] .stall{margin:0 24px 14px 0}
html[dir="rtl"] .stall:nth-of-type(even){margin-right:40px}
.stall::before{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:13px;border:3px solid var(--line);border-radius:12px 12px 4px 4px;
  background:repeating-linear-gradient(90deg,var(--sc,var(--chili)) 0 16px,var(--cream) 16px 32px)}
.stall:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.stall .no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--mango);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Chango",sans-serif;font-size:15px;color:#2B1B0E}
.stall .ic{font-size:32px;flex:0 0 auto}
.stall .tx{flex:1;min-width:0;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.stall .tx small{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-top:2px}
.stall .st{flex:0 0 auto;font-size:14px;white-space:nowrap}
.stall.lock{filter:grayscale(.85);opacity:.72}
.stall.now{outline:4px solid var(--mango);outline-offset:3px;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-1deg) translateY(-2px)}}
.stall.fin{--sc:var(--leaf);background:var(--note)}
.jeti{position:relative;z-index:1;margin:4px 24px 0;text-align:center;font-weight:900;color:#fff;font-size:14px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
/* ---------- stesen ---------- */
.shead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.shead h2{margin:0;font-size:19px;line-height:1.2;color:var(--deep)}
.shead small{color:var(--muted);font-size:14px}
.bub{flex:0 0 52px;height:52px;border-radius:16px;background:var(--c);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 3px 0 var(--line)}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--line);position:relative;margin-bottom:14px}
.card::before{content:"";position:absolute;left:18px;right:18px;top:-3px;height:8px;border-radius:0 0 8px 8px;background:var(--sc,var(--chili))}
.rpic{font-size:46px;text-align:center;line-height:1.2}
.rh{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:19px;margin:6px 0 10px;text-align:center;color:var(--deep)}
.rtext{margin:0 0 10px}
.lines{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}
.lines li{background:var(--cream);border:2px solid var(--wood);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;gap:0;animation:pop .35s both;animation-delay:calc(var(--i)*60ms)}
.lines li .ar{font-size:22px;text-align:right}
.lines .mk{font-size:15px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.ayat{background:var(--note);border:3px double var(--wood);border-radius:16px;padding:10px;margin:0 0 10px;text-align:center}
.ayat .ar{font-size:24px;display:block}
.ayat small{display:block;color:var(--muted);font-size:13px}
.tip{display:flex;gap:8px;background:var(--note);border-radius:14px;padding:8px 10px;margin-bottom:10px;font-size:16px}
.ref{font-size:14px;color:var(--muted);text-align:center;margin:6px 0}
.navr{display:flex;gap:10px}
.btn{flex:1;display:block;width:100%;min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--water);color:#fff;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--line);padding:8px 12px}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.go{background:var(--chili)}
.btn:disabled{opacity:.4}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--chili)}
.say{border:2px solid var(--line);background:var(--mango);border-radius:50%;width:38px;height:38px;font-size:17px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;padding:0}
/* ---------- kemajuan sampan ---------- */
.prog{position:relative;height:30px;border-radius:999px;background:linear-gradient(180deg,var(--water2),var(--water));border:3px solid var(--line);margin:0 0 12px;overflow:visible}
.prog .wake{position:absolute;top:0;bottom:0;inset-inline-start:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 8px,transparent 8px 16px);border-radius:999px}
.prog .wp{position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--mango);border:2px solid var(--line)}
.prog .boat{position:absolute;top:50%;font-size:26px;transform:translate(-50%,-58%)}
html[dir="rtl"] .prog .boat{transform:translate(50%,-58%) scaleX(-1)}
/* ---------- main ---------- */
.q{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.q p{margin:0;flex:1;font-weight:900}
.opt{min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--cream);font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--line);padding:6px 8px;min-width:0;overflow-wrap:anywhere}
.opt .ar{font-size:22px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);opacity:.6}
.g1{display:grid;gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cnt{text-align:center;color:var(--muted);font-size:14px;margin-top:8px}
.mkline{text-align:center;background:var(--note);border-radius:12px;padding:4px 8px;font-size:15px}
.hint{margin-top:10px;background:var(--badbg);border:2px dashed var(--bad);border-radius:14px;padding:8px 10px;font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.em{font-size:38px;text-align:center;line-height:1.2}
/* syiling: bayar wang tepat */
.price{background:var(--deep);color:#fff;border:3px solid var(--line);border-radius:16px;padding:8px;text-align:center;margin-bottom:10px}
.price .ar{font-size:24px;display:block}
.till{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:10px;font-family:"Chango",sans-serif;font-size:22px}
.till b{background:var(--note);border:3px solid var(--line);border-radius:12px;padding:2px 12px;min-width:110px;text-align:center}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.note{min-height:58px;border-radius:12px;border:3px solid var(--line);font-family:"Chango",sans-serif;font-size:17px;box-shadow:0 3px 0 var(--line);background:#CDEFD8;color:#173B22}
.note[data-v="100"]{background:#FFD7C2;color:#5A1E06}.note[data-v="50"]{background:#CFE6FF;color:#0E2E55}.note[data-v="10"]{background:#F7D1F0;color:#4F1043}
.note[data-v="5"]{background:#D5F3C9;color:#1E4710}.note[data-v="1"]{background:#D8E3FF;color:#14275A}
.note.clr{background:var(--card);color:var(--ink);font-family:inherit}
/* raga: susun barang ke dalam raga */
.wares{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.ware{border:3px solid var(--line);border-radius:14px;background:var(--cream);padding:4px 10px;min-height:48px;box-shadow:0 3px 0 var(--line);max-width:100%}
.ware .ar{font-size:21px}
.ware.sel{background:var(--mango);transform:translateY(-3px)}
.ware.used{display:none}
.ragas{display:grid;gap:8px}
.raga{border:3px solid var(--line);border-radius:12px 12px 26px 26px;padding:6px;min-height:72px;
  background:repeating-linear-gradient(45deg,#E7C27D 0 8px,#D9AE60 8px 16px);color:#2B1B0E;font-weight:900;text-align:center;width:100%}
.raga .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.raga .in > span{background:#FFF8E8;border-radius:10px;padding:0 6px;font-size:15px}
.raga .in .ar{font-size:18px}
/* rakit: susun papan perkataan */
.raft{min-height:64px;border:3px dashed var(--wood);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;direction:rtl;margin-bottom:10px;
  background:linear-gradient(180deg,transparent 70%,var(--water2) 70%)}
.raft > span{background:#C98B4B;color:#fff;border:2px solid var(--line);border-radius:8px;padding:0 8px}
.raft > span .ar{font-size:21px}
.planks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.plank{border:3px solid var(--line);border-radius:10px;background:repeating-linear-gradient(90deg,#E2A866 0 14px,#D6985A 14px 28px);color:#2B1B0E;padding:2px 12px;min-height:50px;box-shadow:0 3px 0 var(--line)}
.plank .ar{font-size:22px}
.plank.used{visibility:hidden}
/* dacing: dua piring timbangan */
.dacing{position:relative;padding-top:34px;margin-bottom:6px}
.dacing .beam{position:absolute;left:12%;right:12%;top:14px;height:8px;background:var(--wood);border:2px solid var(--line);border-radius:6px;transition:transform .4s}
.dacing .post{position:absolute;left:50%;top:6px;width:12px;height:26px;margin-left:-6px;background:var(--wood);border:2px solid var(--line);border-radius:4px}
.dacing.tl .beam{transform:rotate(-6deg)}.dacing.tr .beam{transform:rotate(6deg)}
.pans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pan{border-radius:8px 8px 40px 40px !important;min-height:96px !important;background:linear-gradient(180deg,#FFF0C9,#F3D58C) !important}
/* jala: pilih semua */
.net{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px;padding:8px;border-radius:16px;
  background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(43,27,14,.12) 10px 12px),repeating-linear-gradient(-45deg,transparent 0 10px,rgba(43,27,14,.12) 10px 12px),var(--water2)}
.fish{border:3px solid var(--line);border-radius:16px;background:var(--card);min-height:76px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow-wrap:anywhere}
.fish .e{font-size:26px;line-height:1.1}
.fish .ar{font-size:17px;line-height:1.5}
.fish small{font-size:12px;color:var(--muted)}
.fish.sel{background:var(--mango);box-shadow:0 0 0 3px var(--chili)}
.fish.bad{background:var(--badbg)}
/* galah: isi tempat kosong, sampan bergerak */
.buoys{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.buoys i{width:16px;height:16px;border-radius:50%;background:#9AA;border:2px solid var(--line)}
.buoys i.on{background:var(--chili)}
.lane{background:var(--deep);border:3px solid var(--line);border-radius:16px;padding:10px 8px;margin-bottom:10px;color:#fff;text-align:center}
.lane .s{font-size:24px;direction:rtl}
.lane .gap{display:inline-block;min-width:70px;border-bottom:4px dashed var(--mango);color:var(--mango);margin:0 4px}
/* tukar: barter dua lajur */
.barter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.barter .col{display:grid;gap:8px;align-content:start}
.tk{border:3px solid var(--line);border-radius:14px;background:var(--cream);min-height:54px;padding:4px 6px;box-shadow:0 3px 0 var(--line);min-width:0;overflow-wrap:anywhere;font-size:16px}
.tk .ar{font-size:20px}
.tk.sel{background:var(--mango)}
.tk.done{background:var(--okbg);border-color:var(--ok);opacity:.75}
/* pesanan: pelanggan & jawapan */
.chat{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.chat .who{font-size:40px;flex:0 0 auto}
.chat .bubble{flex:1;background:var(--note);border:3px solid var(--line);border-radius:18px 18px 18px 4px;padding:6px 10px}
html[dir="rtl"] .chat .bubble{border-radius:18px 18px 4px 18px}
.chat .bubble .ar{font-size:22px;display:block}
/* tapis: buang yang lain */
.tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;border-radius:50%/22%;background:repeating-radial-gradient(circle at 50% 50%,#E7C27D 0 6px,#D4A75A 6px 12px);border:3px solid var(--line)}
/* maklum balas */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(0,0,0,.25),transparent);animation:up .3s}
.fb .in{max-width:540px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .row1 .bangau{width:64px;height:64px;flex:0 0 64px}
.fb strong{font-family:"Chango",sans-serif;font-weight:400;color:var(--ok);font-size:20px}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.fb p{margin:2px 0 0;font-size:15px}
@keyframes up{from{transform:translateY(100%)}}
.res{text-align:center}
.res .bangau{width:120px;height:120px}
.stars{font-size:44px;margin:4px 0}
.stars span{display:inline-block;animation:pop .5s both}
.stars .off{opacity:.2;filter:grayscale(1)}
.gotst{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--note);border-radius:14px;padding:8px;margin:8px 0;font-weight:900}
.gotst span{font-size:34px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px;z-index:60;max-width:90vw;text-align:center;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:380px){.hero h1{font-size:20px}.stall .ic{font-size:26px}.opt .ar{font-size:20px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[523,.12],[784,.2]]),
  tick: () => tone([[700,.06,"triangle"]]),
  no:   () => tone([[220,.18,"square"],[180,.2,"square"]]),
  coin: () => tone([[1320,.06,"triangle"],[1760,.1,"triangle"]]),
  splash: () => tone([[300,.08,"sawtooth"],[180,.14,"triangle"]]),
  win:  () => tone([[523,.12],[659,.12],[784,.12],[1046,.32]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const stripAr = t => String(t||"").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+[\s،؟.!…]*/g," ").replace(/…/g," ... ").replace(/[=←⟷+/–]/g," ").replace(/\(\s*\)/g," ").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || (!voiceOn && !force)) return;
  const s = stripAr(text); if(!s || !/[A-Za-z0-9]/.test(s)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

/* ===================== PERMAINAN (bahagian 1) ===================== */
const GAMES = {
  /* Syiling: baca harga Arab, bayar wang tepat dengan menekan wang kertas */
  syiling(el, g){
    let k = 0;
    const NOTES = [100, 50, 10, 5, 1];
    const draw = () => {
      const r = g.rounds[k]; let total = 0;
      el.innerHTML = `<div class="price" id="price" data-n="${r.n}">🏷️ ${L("Harga","هرڬ")}: <span class="ar" lang="ar">${r.ar}</span> ${L("ringgit","ريڠڬيت")}</div>
        <div class="till">💰 RM <b id="sum">0</b></div>
        <div class="notes">${NOTES.map(v=>`<button class="note" data-v="${v}" aria-label="RM ${v}">RM${v}</button>`).join("")}
          <button class="note clr" data-v="0" aria-label="${L("Kosongkan","کوسوڠکن")}">↺</button></div>
        <div class="cnt">🧾 ${k+1} / ${g.rounds.length}</div>`;
      let done = false;
      el.querySelectorAll(".note").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        const v = +b.dataset.v;
        if(!v){ total = 0; $("#sum").textContent = "0"; sfx.tick(); return; }
        total += v; sfx.coin(); $("#sum").textContent = total;
        if(total === r.n){ done = true; clearHint(); k++; setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 420); }
        else if(total > r.n){ total = 0; $("#sum").textContent = "0"; oops(b, L("Terlebih bayar! Wang dipulangkan. Baca harga sekali lagi.","ترلبيه باير! واڠ دڤولڠکن. باچ هرڬ سکالي لاڬي.")); }
      }));
    };
    draw();
  },

  /* Raga: tekan barang, kemudian tekan raga yang betul */
  raga(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let sel = null, left = g.items.length;
    el.innerHTML = `<div class="wares">${order.map(i=>`<button class="ware" data-i="${i}">${OPT(g.items[i][0])}</button>`).join("")}</div>
      <div class="ragas">${g.baskets.map((b,bi)=>`<button class="raga" data-b="${bi}">🧺 ${OPT(b)}<div class="in"></div></button>`).join("")}</div>
      <div class="cnt">${L("Tekan barang, kemudian tekan raganya.","تکن بارڠ، کمودين تکن راڬڽ.")}</div>`;
    el.querySelectorAll(".ware").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".ware.sel").forEach(x=>x.classList.remove("sel"));
      sel = b; b.classList.add("sel"); sfx.tick();
    }));
    el.querySelectorAll(".raga").forEach(r => r.addEventListener("click", () => {
      if(!sel){ toast(L("Pilih satu barang dahulu 🧺","ڤيليه ساتو بارڠ داهولو 🧺")); return; }
      const it = g.items[+sel.dataset.i];
      if(it[1] === +r.dataset.b){
        sfx.splash(); clearHint();
        r.querySelector(".in").insertAdjacentHTML("beforeend", `<span>${OPT(it[0])}</span>`);
        sel.classList.remove("sel"); sel.classList.add("used"); sel = null;
        if(--left===0) setTimeout(win, 300);
      } else oops(r, L("Bukan raga itu. Fikir semula.","بوکن راڬ ايت. فيکير سمولا."));
    }));
  },

  /* Rakit: tekan papan perkataan mengikut susunan untuk membina ayat */
  rakit(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], seq = r.seq || qTokens(r.qk), idx = mix(seq.map((_,i)=>i)); let pos = 0;
      el.innerHTML = `${r.qk?`<div class="mkline" style="margin-bottom:8px">📖 ${L("Potongan ayat al-Quran","ڤوتوڠن اية القرءان")}</div>`:""}
        <div class="raft" id="raft" aria-live="polite"></div>
        <div class="planks">${idx.map(i=>`<button class="plank" data-v="${encodeURIComponent(seq[i])}">${AR(seq[i])}</button>`).join("")}</div>
        <div class="mkline" style="margin-top:10px">💬 ${TX(r.mk)}</div>
        <div class="cnt">🪵 ${k+1} / ${g.rounds.length}</div>`;
      speak(RU(r.mk));
      el.querySelectorAll(".plank").forEach(b => b.addEventListener("click", () => {
        if(b.classList.contains("used")) return;
        const w = decodeURIComponent(b.dataset.v);
        if(w === seq[pos]){
          sfx.tick(); clearHint(); b.classList.add("used"); pos++;
          $("#raft").insertAdjacentHTML("beforeend", `<span>${AR(w)}</span>`);
          if(pos === seq.length){ sfx.splash(); k++; setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 450); }
        } else oops(b, L("Papan itu bukan seterusnya. Baca maksud ayat.","ڤاڤن ايت بوکن ستروسڽ. باچ مقصود اية."));
      }));
    };
    draw();
  },

  /* Dacing: dua piring timbangan; tekan piring yang betul */
  dacing(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], flip = Math.random() < .5, sides = flip ? [[r.b,0],[r.a,1]] : [[r.a,1],[r.b,0]];
      el.innerHTML = `<div class="price">⚖️ ${OPT(r.p)}</div>
        <div class="dacing" id="dac"><span class="post"></span><span class="beam"></span>
          <div class="pans">${sides.map(([x,ok],i)=>`<button class="opt pan" data-ok="${ok}" data-s="${i}">${OPT(x)}</button>`).join("")}</div></div>
        <div class="cnt">⚖️ ${k+1} / ${g.rounds.length}</div>`;
      if(typeof r.p !== "string") speak(RU(r.p));
      let done = false;
      el.querySelectorAll(".pan").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        if(b.dataset.ok==="1"){
          done = true; sfx.ok(); clearHint(); b.classList.add("right");
          $("#dac").classList.add(b.dataset.s==="0" ? (isJ()?"tr":"tl") : (isJ()?"tl":"tr")); k++;
          setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 500);
        } else { b.classList.add("wrong"); oops(b, L("Piring itu tidak tepat. Semak baris dan maknanya.","ڤيريڠ ايت تيدق تڤت. سمق بارس دان معناڽ.")); }
      }));
    };
    draw();
  },

  /* Jala: pilih SEMUA yang betul, kemudian tarik jala */
  jala(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], order = g.words ? r.items.map((_,i)=>i) : shuffle(r.items.map((_,i)=>i));
      el.innerHTML = `<div class="mkline" style="margin-bottom:8px">🎣 ${TX(r.ask)}</div>
        <div class="net" ${g.words?'style="direction:rtl"':""}>${order.map(i=>{ const it = r.items[i];
          return `<button class="fish" data-i="${i}" data-ok="${it[1]}" aria-pressed="false">${it[2]?`<span class="e" aria-hidden="true">${it[2]}</span>`:""}${OPT(it[0])}</button>`; }).join("")}</div>
        <button class="btn go" id="pull">🎣 ${L("Tarik Jala","تاريق جالا")}</button>
        <div class="cnt">🐟 ${k+1} / ${g.rounds.length}</div>`;
      speak(RU(r.ask));
      el.querySelectorAll(".fish").forEach(b => b.addEventListener("click", () => {
        b.classList.toggle("sel"); b.classList.remove("bad"); b.setAttribute("aria-pressed", b.classList.contains("sel")); sfx.tick();
      }));
      $("#pull").addEventListener("click", () => {
        const fs = [...el.querySelectorAll(".fish")], picked = fs.filter(b=>b.classList.contains("sel"));
        if(!picked.length){ toast(L("Tangkap sekurang-kurangnya satu dahulu 🎣","تڠکڤ سکورڠ-کورڠڽ ساتو داهولو 🎣")); return; }
        const bad = picked.filter(b=>b.dataset.ok!=="1"), miss = fs.filter(b=>b.dataset.ok==="1" && !b.classList.contains("sel"));
        if(!bad.length && !miss.length){ sfx.splash(); clearHint(); k++; setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 350); return; }
        bad.forEach(b=>{ b.classList.remove("sel"); b.classList.add("bad"); });
        oops($("#pull"), bad.length ? L("Ada tangkapan yang salah dalam jala. Ia sudah dilepaskan.","اد تڠکڤن يڠ ساله دالم جالا. اي سوده دلڤسکن.") : L("Masih ada yang belum ditangkap!","ماسيه اد يڠ بلوم دتڠکڤ!"));
      });
    };
    draw();
  },

  /* Galah: isi tempat kosong; sampan melepasi pelampung */
  galah(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.o.map((x,i)=>({x, ok:i===0}))), parts = r.s.split("___");
      el.innerHTML = `<div class="buoys">${g.rounds.map((_,i)=>`<i class="${i<k?"on":""}"></i>`).join("")}</div>
        <div class="lane">${r.em?`<div class="em" aria-hidden="true">${r.em}</div>`:""}<div class="s ar" lang="ar">${parts[0]}<span class="gap" id="gap">؟</span>${parts[1]||""}</div></div>
        <div class="mkline" style="margin:-4px 0 10px">💬 ${TX(r.mk)}</div>
        <div class="${opts.length===2?"g2":"g1"}">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${AR(o.x)}</button>`).join("")}</div>`;
      speak(RU(r.mk));
      let done = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        const o = opts[+b.dataset.i];
        if(o.ok){ done = true; sfx.splash(); clearHint(); b.classList.add("right"); $("#gap").textContent = o.x; k++;
          setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 420); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Perkataan itu tidak sesuai. Baca maksudnya.","ڤرکاتاٴن ايت تيدق سسواي. باچ مقصودڽ.")); }
      }));
    };
    draw();
  },

  /* Tukar: barter dua lajur (tekan satu kiri, satu kanan) */
  tukar(el, g){
    const L1 = shuffle(g.pairs.map((_,i)=>i)); let R1, n = 0, sel = null, left = g.pairs.length;
    do{ R1 = shuffle(L1); n++; }while(R1.some((x,i)=>x===L1[i]) && n<60); // lajur kanan tidak sebaris
    el.innerHTML = `<div class="barter"><div class="col">${L1.map(i=>`<button class="tk" data-s="l" data-i="${i}">${OPT(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="col">${R1.map(i=>`<button class="tk" data-s="r" data-i="${i}">${OPT(g.pairs[i][1])}</button>`).join("")}</div></div>
      <div class="cnt">🔁 ${L("Tekan satu barang, kemudian pasangannya.","تکن ساتو بارڠ، کمودين ڤاسڠنڽ.")}</div>`;
    el.querySelectorAll(".tk").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(!sel || sel.dataset.s===b.dataset.s){
        el.querySelectorAll(".tk.sel").forEach(x=>x.classList.remove("sel"));
        sel = b; b.classList.add("sel"); sfx.tick(); return;
      }
      if(sel.dataset.i===b.dataset.i){
        sfx.coin(); clearHint(); sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); sel = null;
        if(--left===0) setTimeout(win, 300);
      } else { sel.classList.remove("sel"); sel = null; oops(b, L("Bukan pasangan itu. Cuba lagi.","بوکن ڤاسڠن ايت. چوبا لاڬي.")); }
    }));
  },

  /* Pesanan: pelanggan bercakap, pilih jawapan yang betul */
  pesanan(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.o.map((x,i)=>({x, ok:i===0})));
      el.innerHTML = `<div class="chat"><span class="who" aria-hidden="true">${r.who}</span><div class="bubble"><span class="ar" lang="ar">${r.say}</span><small>${TX(r.mk)}</small></div></div>
        <div class="g1">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${AR(o.x)}</button>`).join("")}</div>
        <div class="cnt">🧾 ${k+1} / ${g.rounds.length}</div>`;
      speak(RU(r.mk));
      let done = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        if(opts[+b.dataset.i].ok){ done = true; sfx.ok(); clearHint(); b.classList.add("right"); k++; setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 420); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Jawapan itu tidak sesuai dengan soalan.","جواڤن ايت تيدق سسواي دڠن سوالن.")); }
      }));
    };
    draw();
  },

  /* Tapis: buang satu yang lain daripada dulang */
  tapis(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.o.map((x,i)=>({x, ok:i===0})));
      el.innerHTML = `<div class="tray">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${AR(o.x)}</button>`).join("")}</div>
        <div id="why"></div><div class="cnt">🪣 ${k+1} / ${g.rounds.length}</div>`;
      let done = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        if(opts[+b.dataset.i].ok){ done = true; sfx.splash(); clearHint(); b.classList.add("right");
          $("#why").innerHTML = `<div class="mkline" style="margin-top:10px">✔️ ${TX(r.why)}</div>`; k++;
          setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 900); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Yang ini sama kumpulan dengan yang lain. Cari yang berbeza.","يڠ اين سام کومڤولن دڠن يڠ لاٴين. چاري يڠ بربيذا.")); }
      }));
    };
    draw();
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t5-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Gerai ini belum dibuka. Selesaikan gerai sebelumnya 🔒","ڬراي اين بلوم دبوک. سلسايکن ڬراي سبلومڽ 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} gerai untuk ke Jeti Pasar Besar 🏆`,`سلسايکن سموا ${STATIONS.length} ڬراي اونتوق ک جيتي ڤاسر بسر 🏆`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa selepas tukar tulisan/suara (tanpa ulang bunyi kemenangan)
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
