<html lang="ms">
<head>

<title>Hari Sukan Adab • Akhlak Tahun 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Akhlak Tahun 4: "Hari Sukan Adab" — stadium, balapan, podium; Mau si anak harimau atlet ===== */
:root{
  --sky1:#4FB3E8; --sky2:#BFE6FA; --bg:#FFF6E8; --card:#FFFFFF; --ink:#16204A; --muted:#55608A; --line:#16204A;
  --track:#D9482B; --track2:#B63A20; --grass:#2E9D57; --grass2:#7CCB6B; --navy:#1B2A5C; --gold:#FFC23D; --gold2:#E89B0C;
  --silver:#C9D2E3; --bronze:#D28A4A; --ok:#1F8A4C; --okbg:#DDF5E4; --bad:#D63B2A; --badbg:#FDE2DC; --note:#FFF3CC; --tipbg:#E3F1FF; --tipink:#13305C;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0C1638; --sky2:#16254F; --bg:#0F1530; --card:#1B2346; --ink:#F2F4FF; --muted:#B7BFE0; --line:#05081A;
    --okbg:#173A28; --badbg:#46201A; --note:#3A321A; --tipbg:#1C2C52; --tipink:#DCE8FF; --silver:#59627F;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:700;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 320px,var(--bg) 760px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-size:19px;line-height:1.85;font-weight:600}
#app{max-width:520px;margin:0 auto;padding:10px 14px 110px}
h1,h2,h3,.disp{font-family:"Bowlby One SC","Nunito",sans-serif;font-weight:400;letter-spacing:.3px;line-height:1.15;margin:0}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .disp{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700;line-height:1.6;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400;line-height:2}
/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--gold);color:#16204A;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;box-shadow:0 4px 0 var(--line)}
/* hero */
.hero{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line);
  background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.06) 22px 24px)}
.hero h1{font-size:25px;color:var(--gold)}
.hero p{margin:4px 0 0;font-size:15px;color:#E8ECFF}
.mau{width:92px;height:auto;flex:0 0 auto}
.mau.bob{animation:bob 1.8s ease-in-out infinite}
.mau.yay{width:110px;animation:jump .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) rotate(-4deg)}}
.sttl{margin:14px 4px 6px;font-weight:900}
.stickers{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px}
.stickers span{width:38px;height:38px;display:grid;place-items:center;font-size:22px;border-radius:50%;background:var(--silver);filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;background:radial-gradient(circle,var(--gold) 0 55%,var(--gold2) 56%);box-shadow:0 0 0 2px var(--line)}
/* peta: balapan stadium */
.track{position:relative;margin-top:16px;padding:18px 10px 14px;border:3px solid var(--line);border-radius:120px 120px 28px 28px;
  background:
    linear-gradient(90deg,transparent 0 18%,rgba(255,255,255,.55) 18% calc(18% + 3px),transparent 0 82%,rgba(255,255,255,.55) 82% calc(82% + 3px),transparent 0),
    radial-gradient(ellipse 34% 46% at 50% 52%,var(--grass2) 0 92%,transparent 93%),
    repeating-linear-gradient(90deg,var(--track) 0 30px,var(--track2) 30px 33px);
  box-shadow:0 6px 0 var(--line)}
.lane{display:flex;margin:12px 0;position:relative;z-index:1}
.lane.l{justify-content:flex-start}.lane.r{justify-content:flex-end}
.node{position:relative;width:62%;display:flex;align-items:center;gap:10px;padding:8px 10px;border:3px solid var(--line);border-radius:18px;background:var(--card);
  box-shadow:0 5px 0 var(--line);text-align:start}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.node .bib{flex:0 0 52px;height:52px;border-radius:12px;border:3px solid var(--line);background:var(--c);display:grid;place-items:center;font-size:24px;position:relative}
.node .num{position:absolute;top:-10px;inset-inline-start:-10px;width:26px;height:26px;border-radius:50%;background:#fff;color:#16204A;border:2px solid var(--line);font:900 14px/22px Nunito;text-align:center}
.node .nm{flex:1;min-width:0;font-weight:900;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
html[dir="rtl"] .node .nm{font-size:16px;line-height:1.6}
.node .st{position:absolute;bottom:-14px;inset-inline-end:8px;font-size:13px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:0 6px}
.node .st:empty{display:none}
.node.lock{filter:grayscale(.9);opacity:.75}
.node.lock .bib::after{content:"🔒";position:absolute;font-size:18px;bottom:-8px;inset-inline-end:-8px}
.node.now{outline:4px solid var(--gold);outline-offset:3px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.node .guide{position:absolute;top:-34px;inset-inline-end:-6px;width:48px;z-index:3}
.node .guide .mau{width:48px}
.podium{display:flex;justify-content:center;margin:4px 0 18px}
.podium .node{width:78%;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#16204A;flex-direction:column;text-align:center;padding:12px 10px 16px}
.podium .steps{display:flex;align-items:flex-end;gap:4px;font-size:26px}
.podium .steps i{display:grid;place-items:center;width:44px;border:3px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;font:900 16px Nunito;font-style:normal}
.podium .steps i:nth-child(1){height:34px;background:var(--silver)}.podium .steps i:nth-child(2){height:52px;background:#fff}.podium .steps i:nth-child(3){height:24px;background:var(--bronze)}
.start{margin-top:10px;text-align:center;font-weight:900;color:#fff;background:repeating-linear-gradient(90deg,#fff 0 12px,#16204A 12px 24px);padding:4px;border-radius:10px}
.start span{background:var(--navy);padding:2px 10px;border-radius:8px}
</style>
<style>
/* kad bacaan & stesen */
.shead{display:flex;gap:10px;align-items:center;margin:4px 0 12px}
.shead h2{font-size:21px}
.shead small{color:var(--muted);font-weight:800}
.badge{flex:0 0 54px;height:54px;border-radius:14px;border:3px solid var(--line);background:var(--c);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 var(--line)}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line);position:relative;border-top:10px solid var(--sc,var(--track))}
.rpic{font-size:52px;text-align:center;line-height:1.1}
.rh{font-size:21px;margin:6px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rtext{margin:0 0 8px}
.rlist{margin:6px 0;padding:0;list-style:none;counter-reset:n}
.rlist li{counter-increment:n;position:relative;padding:6px 10px 6px 0;padding-inline-start:40px;margin:6px 0;background:var(--bg);border-radius:12px;border:2px solid var(--line);
  animation:slide .35s both;animation-delay:calc(var(--i)*60ms)}
.rlist li::before{content:counter(n);position:absolute;inset-inline-start:6px;top:7px;width:26px;height:26px;border-radius:50%;background:var(--track);color:#fff;font:900 14px/26px Nunito;text-align:center}
@keyframes slide{from{opacity:0;transform:translateY(8px)}}
.abox{background:var(--note);border:2px dashed var(--line);border-radius:14px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.abox .ar{font-size:24px;text-align:center}
.abox .mk{font-size:16px}
.abox small{color:var(--muted)}
.tip{display:flex;gap:8px;background:var(--tipbg);color:var(--tipink);border-radius:14px;padding:10px;margin:8px 0;font-size:16px}
.tip.am{background:var(--okbg);color:var(--ink)}
.ref{margin-top:8px;font-size:14px;color:var(--muted);font-weight:800}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--navy);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);padding:8px 14px}
.btn.go{background:var(--grass);width:100%}
.btn.alt{background:var(--card);color:var(--ink);width:100%}
.btn:disabled{opacity:.4}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--silver)}.dots i.on{background:var(--track);width:24px;border-radius:6px}
.say{border:2px solid var(--line);background:var(--gold);border-radius:12px;min-width:42px;height:42px;font-size:18px;color:#16204A}
/* bar kemajuan: balapan */
.prog{position:relative;height:30px;margin:0 0 12px;border:3px solid var(--line);border-radius:999px;background:repeating-linear-gradient(90deg,var(--track) 0 18px,var(--track2) 18px 20px);overflow:visible}
.prog .run{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(255,255,255,.35);border-radius:999px}
.prog .hu{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px}
.prog .me{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:24px;transition:all .4s}
.q{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.q p{margin:0;font-weight:900;font-size:19px}
.qar{font-size:24px;text-align:center;background:var(--note);border-radius:12px;padding:6px;margin-bottom:10px}
.opt{display:block;width:100%;min-height:54px;min-width:0;overflow-wrap:anywhere;padding:10px 12px;border:3px solid var(--line);border-radius:16px;background:var(--card);
  font-weight:800;font-size:17px;text-align:start;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.opt.right,.opt.done{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);opacity:.7}
.opt.sel{outline:4px solid var(--gold);outline-offset:1px}
.g1{display:grid;gap:10px}
.g2{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.cnt{text-align:center;margin-top:10px;color:var(--muted);font-weight:900;font-size:15px}
.hint{margin-top:10px;background:var(--badbg);border:2px solid var(--bad);border-radius:12px;padding:8px 10px;font-size:15px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* baton */
.lanes{display:grid;gap:8px}
.bt{display:flex;align-items:center;gap:10px}
.bt .ln{flex:0 0 34px;height:34px;border-radius:8px;background:var(--track);color:#fff;display:grid;place-items:center;font:900 16px Nunito;border:2px solid var(--line)}
.bt .tx{flex:1;min-width:0}
.bt.right .ln::after{content:"🏃";position:absolute}
/* lompat */
.hurdles{display:flex;justify-content:center;gap:6px;font-size:22px;margin-bottom:8px}
.hurdles span{opacity:.35}.hurdles span.on{opacity:1;transform:scale(1.2)}.hurdles span.ok{opacity:1}
.stmt{background:var(--note);border:3px solid var(--line);border-radius:16px;padding:14px;text-align:center;font-weight:900;font-size:18px;min-height:90px;display:grid;place-items:center}
.jumps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.jp{min-height:64px;border:3px solid var(--line);border-radius:16px;font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--line);color:#fff}
.jp[data-v="1"]{background:var(--grass)}.jp[data-v="0"]{background:var(--track)}
/* tarik tali */
.rope{position:relative;height:46px;margin:6px 0 12px;border-radius:12px;background:linear-gradient(90deg,var(--tipbg) 50%,var(--badbg) 50%);border:3px solid var(--line)}
.rope::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:6px;margin-top:-3px;background:repeating-linear-gradient(45deg,#C08A3E 0 6px,#8A5A1E 6px 10px);border-radius:3px}
.rope .knot{position:absolute;top:50%;left:calc(50% + var(--x,0)*9%);transform:translate(-50%,-50%);font-size:24px;transition:left .35s}
.tcard{background:var(--note);border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;font-weight:900;min-height:70px;display:grid;place-items:center}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tm{min-height:70px;border:3px solid var(--line);border-radius:16px;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--line);background:var(--card);overflow-wrap:anywhere;min-width:0}
.tm .te{display:block;font-size:26px}
/* sorak */
.sk.done::before{content:"📣 "}
.crowd{text-align:center;font-size:26px;letter-spacing:4px;margin-bottom:6px}
/* pingat */
.medals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.medals .opt{font-size:15px;min-height:60px}
.pl::before{content:"🥇 "}.pr::before{content:"🎀 "}
/* wisel & podium & lontar */
.built{min-height:56px;border:3px dashed var(--line);border-radius:14px;padding:8px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg)}
.built .chip{background:var(--okbg);border:2px solid var(--ok);border-radius:10px;padding:2px 8px;font-size:15px}
.built ol{margin:0;padding-inline-start:22px;font-size:15px}
.sent{background:var(--note);border:3px solid var(--line);border-radius:14px;padding:12px;font-weight:800;margin-bottom:10px}
.sent .bl{display:inline-block;min-width:70px;border-bottom:3px solid var(--line);text-align:center;color:var(--ok)}
.sent .bl.cur{background:var(--gold);border-radius:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bank .opt{width:auto;min-height:48px;text-align:center}
.lt{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:24px;font-weight:400;direction:rtl}
.built.arl{direction:rtl;font-family:"Amiri",serif;font-size:24px}
.field{text-align:center;font-size:24px;margin-bottom:6px;direction:ltr}
/* maklum balas & keputusan */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px;background:rgba(10,15,40,.35);animation:up .25s}
.fb .in{max-width:520px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 -4px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .mau{width:70px}
.fb strong{font-family:"Bowlby One SC",Nunito;font-weight:400;font-size:20px;color:var(--ok)}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.fb p{margin:2px 0;font-size:16px}
.fast{display:inline-block;background:var(--gold);color:#16204A;border-radius:999px;padding:0 10px;font-size:14px}
@keyframes up{from{transform:translateY(100%)}}
.res{text-align:center}
.res .mau{margin:0 auto;display:block}
.stars{font-size:44px;margin:6px 0}
.stars span{display:inline-block;animation:pop .5s both}.stars .off{filter:grayscale(1);opacity:.3}
@keyframes pop{from{transform:scale(0)}}
.gotst{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--note);border-radius:14px;padding:8px;margin:10px 0}
.gotst span{font-size:36px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;z-index:60;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* dijana oleh mkq.js daripada api.quran.com (text_uthmani), potongan ikut indeks perkataan */
const Q = {
 "TAAWUN": {
  "k": "5:2",
  "a": 40,
  "b": 50,
  "t": "وَتَعَاوَنُوا۟ عَلَى ٱلْبِرِّ وَٱلتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا۟ عَلَى ٱلْإِثْمِ وَٱلْعُدْوَٰنِ"
 },
 "SAMA": {
  "k": "17:36",
  "a": 8,
  "b": 17,
  "t": "إِنَّ ٱلسَّمْعَ وَٱلْبَصَرَ وَٱلْفُؤَادَ كُلُّ أُو۟لَـٰٓئِكَ كَانَ عَنْهُ مَسْـُٔولًا"
 },
 "SUBHAN": {
  "k": "43:13",
  "a": 11,
  "b": 20,
  "t": "سُبْحَـٰنَ ٱلَّذِى سَخَّرَ لَنَا هَـٰذَا وَمَا كُنَّا لَهُۥ مُقْرِنِينَ"
 },
 "MUNQALIB": {
  "k": "43:14",
  "a": 0,
  "b": 4,
  "t": "وَإِنَّآ إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ"
 },
 "LINTA": {
  "k": "3:159",
  "a": 0,
  "b": 15,
  "t": "فَبِمَا رَحْمَةٍ مِّنَ ٱللَّهِ لِنتَ لَهُمْ ۖ وَلَوْ كُنتَ فَظًّا غَلِيظَ ٱلْقَلْبِ لَٱنفَضُّوا۟ مِنْ حَوْلِكَ"
 },
 "JIRAN": {
  "k": "4:36",

// potong ayat (api.quran.com) kepada n bahagian ikut perkataan; tanda waqaf (ۖ ۚ ۗ) dilekatkan pada perkataan sebelumnya
function ayatWords(t){ const out=[]; for(const w of t.split(" ")){ if(/^[\u06D6-\u06DC]$/.test(w) && out.length) out[out.length-1]+=" "+w; else out.push(w); } return out; }
function chunks(t, n){
  const w = ayatWords(t); n = Math.max(2, Math.min(n||5, w.length));
  const out = []; let a = 0;
  for(let i=0;i<n;i++){ const b = Math.round((i+1)*w.length/n); out.push(w.slice(a,b).join(" ")); a = b; }
  return out.filter(Boolean);
}

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[660,.12],[880,.18]]),
  tick: () => tone([[740,.08,"triangle"]]),
  no:   () => tone([[220,.18,"square"],[180,.2,"square"]]),
  hop:  () => tone([[400,.07,"triangle"],[800,.12,"triangle"]]),
  whistle: () => tone([[2100,.12,"square"],[2300,.18,"square"]]),
  ding: () => tone([[1320,.25,"triangle"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.3]])
};

/* ---------- Suara (baca teks Rumi sahaja; huruf Arab dibuang) ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const clean = text.replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/…|___/g," ... ")
      .replace(/SAW/g,"sallallahu alaihi wasallam").replace(/SWT/g,"subhanahu wa taala").replace(/ms\. /g,"muka surat ");
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

      <div class="ref">📖 ${L("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</div>
      <div class="navr">
        <button class="btn alt" data-act="rprev" ${S.ri?"":"disabled"} aria-label="${L("Sebelum","سبلوم")}" style="flex:0 0 64px;width:64px">${BACK()}</button>
        <button class="btn ${last?"go":""}" data-act="rnext">${last ? "🏃 "+L("Mula acara!","مولا اچارا!") : L("Seterusnya","ستروسڽ")+" ▶"}</button>
      </div>
      <div class="dots">${S.st.read.map((_,i)=>`<i class="${i===S.ri?"on":""}"></i>`).join("")}</div>
    </article>`;
  speak(readSpeech(c));
  window.scrollTo(0,0);
}

/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, pos = i => (100*(i+.5)/n);
  const side = isJ() ? "right" : "left";
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}">
    <span class="run" style="width:${100*k/n}%"></span>
    ${S.games.map((_,i)=>`<span class="hu" style="${side}:${pos(i)}%">${i<k?"✅":"🚧"}</span>`).join("")}
    <span class="me" style="${side}:${Math.max(4,100*k/n)}%">🐯</span></div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  S.t0 = Date.now();
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div>${g.ar?`<div class="qar ar" lang="ar">${g.ar}</div>`:""}<div id="play"></div><div id="hint" aria-live="polite"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🐯 ${hint || L("Hampir! Cuba lagi.","همڤير! چوبا لاڬي.")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pantas!","ڤنتس!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];

function win(){
  if(document.querySelector(".fb")) return;
  sfx.ding();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const secs = Math.round((Date.now()-(S.t0||Date.now()))/1000), fast = secs <= 25;
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${mau("yay")}<div><strong>${T(p)}</strong> ${fast?`<span class="fast">⚡ ${secs} ${L("saat","ساعت")}</span>`:""}<p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Acara seterusnya","اچارا ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  S.phase = "result";
  drawResult(true);
}
function drawResult(fresh){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars, first, openedFinal } = S.res;
  const medal = stars===3 ? "🥇" : stars===2 ? "🥈" : "🥉";
  const msg = stars===3 ? ["Pingat emas! Adab kamu juara.","ڤيڠت امس! ادب کامو جوارا."] : stars===2 ? ["Pingat perak! Cuba lagi untuk emas.","ڤيڠت ڤيرق! چوبا لاڬي اونتوق امس."] : ["Pingat gangsa! Syabas kerana tidak berputus asa.","ڤيڠت ڬڠسا! شاباس کران تيدق برڤوتوس اسا."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res" style="--sc:${S.st.c}">
      ${mau("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${medal} ${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Pingat baharu untuk koleksi kamu!","ڤيڠت بهارو اونتوق کوليکسي کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🏆 ${L("Podium Juara kini dibuka!","ڤوديوم جوارا کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🏟️ ${L("Kembali ke stadium","کمبالي ک ستاديوم")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== ACARA (PERMAINAN) ===================== */
const GAMES = {
  /* Baton: pilih lorong (jawapan) yang betul untuk menyerahkan baton */
  baton(el, g){
    const order = shuffle(g.a.map((_,i)=>i)); let done = false;
    el.innerHTML = `<div class="lanes">${order.map((i,n)=>`<button class="opt bt" data-i="${i}"><span class="ln">${n+1}</span><span class="tx">${T(g.a[i])}</span></button>`).join("")}</div>
      <div class="cnt">🏃 ${L("Serahkan baton ke lorong jawapan yang betul.","سرهکن باتون ک لوروڠ جواڤن يڠ بتول.")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(+b.dataset.i===0){ done = true; b.classList.add("right"); b.querySelector(".ln").textContent = "🏃"; sfx.ok(); clearHint(); setTimeout(win, 450); }
      else { b.classList.add("wrong"); oops(b, L("Lorong salah! Baca soalan sekali lagi.","لوروڠ ساله! باچ سوالن سکالي لاڬي.")); }
    }));
  },

  /* Lompat: lompat halangan jika kenyataan BETUL, elak jika SALAH */
  lompat(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let k = 0, busy = false;
    const draw = () => {
      const i = order[k];
      el.innerHTML = `<div class="hurdles" aria-hidden="true">${order.map((_,n)=>`<span class="${n<k?"ok":n===k?"on":""}">${n<k?"✅":"🚧"}</span>`).join("")}</div>
        <div class="stmt" data-k="${i}">${T(g.items[i][0])}</div>
        <div class="jumps"><button class="jp" data-v="1">🦘 ${L("Lompat (Betul)","لومڤت (بتول)")}</button><button class="jp" data-v="0">✋ ${L("Elak (Salah)","ايلق (ساله)")}</button></div>
        <div class="cnt">${k+1} / ${order.length}</div>`;
      el.querySelectorAll(".jp").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.v === g.items[i][1]){ k++; sfx.hop(); clearHint(); if(k<order.length) draw(); else { busy = true; setTimeout(win, 300); } }
        else oops(el.querySelector(".stmt"), g.items[i][1] ? L("Kenyataan ini BETUL. Lompatlah!","کڽاتاٴن اين بتول. لومڤتله!") : L("Kenyataan ini SALAH. Elakkan!","کڽاتاٴن اين ساله. ايلقکن!"));
      }));
    };
    draw();
  },

  /* Tarik tali: tarik setiap kad ke pasukan yang betul */
  taritali(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let k = 0, x = 0, busy = false;
    const draw = () => {
      const i = order[k];
      el.innerHTML = `<div class="rope" aria-hidden="true"><span class="knot" style="--x:${isJ()?-x:x}">🎗️</span></div>
        <div class="tcard" data-k="${i}">${T(g.items[i][0])}</div>
        <div class="teams">${g.sides.map((s,n)=>`<button class="tm" data-s="${n}"><span class="te">${s[0]}</span>${T(s[1])}</button>`).join("")}</div>
        <div class="cnt">💪 ${k+1} / ${order.length}</div>`;
      el.querySelectorAll(".tm").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.s === g.items[i][1]){ x += g.items[i][1] ? 1 : -1; x = Math.max(-4, Math.min(4, x)); k++; sfx.tick(); clearHint();
          if(k<order.length) draw(); else { busy = true; sfx.ok(); setTimeout(win, 300); } }
        else oops(el.querySelector(".tcard"), L("Bukan pasukan itu. Fikir semula!","بوکن ڤاسوقن ايت. فيکير سمولا!"));
      }));
    };
    draw();
  },

  /* Sorak: tekan SEMUA kad yang betul; kad yang salah menghentikan sorakan */
  sorak(el, g){
    const order = shuffle(g.items.map((_,i)=>i)), need = g.items.filter(x=>x[1]).length; let got = 0;
    el.innerHTML = `<div class="crowd" aria-hidden="true">🙌📣🙌📣🙌</div>
      <div class="g2">${order.map(i=>`<button class="opt sk" data-i="${i}">${T(g.items[i][0])}</button>`).join("")}</div>
      <div class="cnt" id="sc">📣 0 / ${need}</div>`;
    el.querySelectorAll(".sk").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || b.classList.contains("wrong") || got>=need) return;
      if(g.items[+b.dataset.i][1]){ b.classList.add("done"); got++; sfx.tick(); clearHint(); el.querySelector("#sc").textContent = `📣 ${got} / ${need}`; if(got===need) setTimeout(win, 350); }
      else { b.classList.add("wrong"); oops(b, L("Itu bukan jawapannya. Jangan sorak untuknya!","ايت بوکن جواڤنڽ. جاڠن سورق اونتوقڽ!")); }
    }));
  },

  /* Pingat: tekan pingat, kemudian reben yang sepadan */
  pingat(el, g){
    const lo = shuffle(g.pairs.map((_,i)=>i)), ro = mix(lo); let sel = null, got = 0;
    el.innerHTML = `<div class="medals">${lo.map((li,n)=>`<button class="opt pl" data-i="${li}">${T(g.pairs[li][0])}</button><button class="opt pr" data-i="${ro[n]}">${T(g.pairs[ro[n]][1])}</button>`).join("")}</div>
      <div class="cnt">🥇 ${L("Tekan pingat, kemudian rebennya.","تکن ڤيڠت، کمودين ريبنڽ.")}</div>`;
    el.querySelectorAll(".pl").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      el.querySelectorAll(".pl").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; sfx.tick();
    }));
    el.querySelectorAll(".pr").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(sel==null){ toast(L("Tekan pingat dahulu 🥇","تکن ڤيڠت دهولو 🥇")); return; }
      if(+b.dataset.i===sel){
        b.classList.add("done"); const m = el.querySelector(`.pl[data-i="${sel}"]`); m.classList.remove("sel"); m.classList.add("done");
        sel = null; got++; sfx.ok(); clearHint(); if(got===g.pairs.length) setTimeout(win, 350);
      } else oops(b, L("Reben itu bukan untuk pingat ini.","ريبن ايت بوکن اونتوق ڤيڠت اين."));
    }));
  },

  /* Wisel: tiup wisel mengikut urutan langkah yang betul */
  wisel(el, g){
    const n = g.steps.length, order = mix(g.steps.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="built" aria-live="polite"><ol id="ws"></ol><span class="cnt" id="wh" style="margin:0">📯 ${L("Tekan langkah PERTAMA.","تکن لڠکه ڤرتام.")}</span></div>
      <div class="g1">${order.map(i=>`<button class="opt" data-i="${i}">${T(g.steps[i])}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || k>=n) return;
      if(+b.dataset.i===k){
        b.classList.add("done"); k++; sfx.whistle(); clearHint();
        const wh = el.querySelector("#wh"); if(wh) wh.remove();
        el.querySelector("#ws").insertAdjacentHTML("beforeend", `<li>${T(g.steps[+b.dataset.i])}</li>`);
        if(k===n) setTimeout(win, 400);
      } else oops(b, L(`Bukan itu. Apakah langkah ke-${k+1}?`,`بوکن ايت. اڤاکه لڠکه ک-${k+1}؟`));
    }));
  },

  /* Podium: isi tempat kosong ikut urutan; perkataan betul naik ke podium */
  podium(el, g){
    const words = g.ans.concat(g.extra||[]), order = shuffle(words.map((_,i)=>i)); let k = 0;
    const sent = () => { let n = 0; return T(g.s).split("___").map((part,i,arr)=> part + (i<arr.length-1 ? (()=>{ const j=n++; return `<span class="bl ${j===k?"cur":""}">${j<k?T(g.ans[j]):"?"}</span>`; })() : "")).join(""); };
    const draw = () => { el.querySelector("#sent").innerHTML = sent(); };
    el.innerHTML = `<div class="sent" id="sent"></div><div class="bank">${order.map(i=>`<button class="opt" data-w="${i}">${T(words[i])}</button>`).join("")}</div>
      <div class="cnt">🥇🥈🥉 ${L("Pilih perkataan untuk tempat kosong yang berwarna.","ڤيليه ڤرکاتاٴن اونتوق تمڤت کوسوڠ يڠ برورنا.")}</div>`;
    draw();
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || k>=g.ans.length) return;
      if(+b.dataset.w===k){ b.classList.add("done"); k++; sfx.ok(); clearHint(); draw(); if(k===g.ans.length) setTimeout(win, 450); }
      else { oops(b, L("Perkataan itu tidak sesuai di situ.","ڤرکاتاٴن ايت تيدق سسواي د سيتو.")); }
    }));
  },

  /* Lontar: lontar potongan ayat ke padang mengikut urutan (ayat dari api.quran.com) */
  lontar(el, g){
    const parts = chunks(Q[g.qk].t, g.n), n = parts.length, order = mix(parts.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="field" aria-hidden="true">🎯 ${"🟩".repeat(Math.min(n,8))}</div>
      <div class="built arl" id="ls" lang="ar" aria-live="polite"></div>
      <div class="bank">${order.map(i=>`<button class="opt lt" lang="ar" data-i="${i}">${parts[i]}</button>`).join("")}</div>
      <div class="cnt">🥏 ${L("Mula dari kanan: tekan potongan pertama ayat.","مولا دري کانن: تکن ڤوتوڠن ڤرتام ايات.")}</div>`;
    el.querySelectorAll(".lt").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || k>=n) return;
      if(+b.dataset.i===k){
        b.classList.add("done"); k++; sfx.hop(); clearHint();
        el.querySelector("#ls").insertAdjacentHTML("beforeend", `<span class="chip">${parts[+b.dataset.i]}</span>`);
        if(k===n) setTimeout(win, 450);
      } else oops(b, L("Bukan potongan itu. Baca ayat di kad bacaan.","بوکن ڤوتوڠن ايت. باچ ايات د کد باچاٴن."));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t4-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Menangi acara sebelumnya dahulu 🔒","منڠي اچارا سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Menangi semua ${STATIONS.length} acara untuk naik ke Podium Juara 🏆`,`منڠي سموا ${STATIONS.length} اچارا اونتوق نايق ک ڤوديوم جوارا 🏆`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa selepas tukar tulisan/suara (tanpa ulang bunyi/konfeti)
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && S.phase==="result") return drawResult(false);
  renderPlay();
}
applyLang();
renderMap();
</script>
