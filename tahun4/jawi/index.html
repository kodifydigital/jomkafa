<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A47">

<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Detektif Aksara • Jawi Tahun 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Jawi Tahun 4: "Detektif Aksara" — biru malam, kuning kanta, oren musang, kertas fail ===== */
:root{
  --navy:#1E2A47; --navy2:#2C3E66; --teal:#1F7A8C; --gold:#F4B63F; --fox:#E8742A; --pin:#E0433D; --tan:#C9A178;
  --bg:#EEF1F6; --street:#D5DCE8; --block:#E3E8F0; --paper:#FFF8EA; --card:#FFFFFF; --ink:#18213A; --muted:#5A6482;
  --line:#1E2A47; --ok:#23945A; --okbg:#DDF5E5; --bad:#D63A3A; --badbg:#FFE3E0; --note:#FFF1C9; --folder:#F2D59B;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1524; --street:#1B2438; --block:#151D2E; --paper:#262A35; --card:#1E2536; --ink:#EEF1FA; --muted:#AEB8D4;
    --line:#05080F; --note:#3A3120; --okbg:#143825; --badbg:#47201F; --folder:#5E4A28; --navy2:#34486F; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:700;
  background:
    linear-gradient(90deg,transparent 46px,var(--street) 46px 58px,transparent 58px) 0 0/120px 120px,
    linear-gradient(0deg,transparent 46px,var(--street) 46px 58px,transparent 58px) 0 0/120px 120px,
    var(--block)}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-size:19px;line-height:1.75}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:"Luckiest Guy","Nunito",sans-serif;font-weight:400;letter-spacing:.5px;margin:0;line-height:1.15}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700;letter-spacing:0;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:10px 12px 90px}
.jw{font-family:"Noto Naskh Arabic","Amiri",serif;direction:rtl;unicode-bidi:isolate;font-weight:700}
.rm{font-family:"Nunito",sans-serif;direction:ltr;unicode-bidi:isolate;font-weight:800;color:var(--muted);font-size:.78em}

/* ---------- Bar atas ---------- */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--navy);color:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-family:"Nunito",sans-serif;white-space:nowrap}

/* ---------- Hero ---------- */
.hero{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:22px;padding:12px 14px;border:3px solid var(--line);
  box-shadow:0 6px 0 var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(244,182,63,.35),transparent 45%);pointer-events:none}
.hero h1{font-size:30px;color:var(--gold);text-shadow:2px 2px 0 #000}
.hero p{margin:4px 0 0;font-size:15px;line-height:1.4}
html[dir="rtl"] .hero p{font-size:16px;line-height:1.7}
.fox{width:96px;height:96px;flex:0 0 96px}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

/* ---------- Papan bukti (album pelekat) ---------- */
.sttl{margin:16px 2px 6px;font-weight:900}
.board{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:16px;border:4px solid #8B5E34;
  background:radial-gradient(circle at 20% 30%,rgba(0,0,0,.08) 2px,transparent 3px) 0 0/14px 14px,#D9B382}
.board span{width:44px;height:44px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:24px;filter:grayscale(1) opacity(.35);
  box-shadow:0 2px 0 rgba(0,0,0,.25);position:relative;transform:rotate(-3deg)}
.board span:nth-child(even){transform:rotate(3deg)}
.board span.got{filter:none}
.board span.got::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--pin);box-shadow:0 1px 0 #000}

/* ---------- Peta bandar ---------- */
.city{position:relative;margin-top:16px;padding:8px 0 14px}
.city::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:0;border-left:6px dotted var(--fox);opacity:.55;transform:translateX(-3px)}
.row{display:flex;position:relative;margin:6px 0}
.row.l{justify-content:flex-start}.row.r{justify-content:flex-end}
.node{position:relative;width:62%;min-height:96px;border:3px solid var(--line);border-radius:6px 18px 18px 18px;background:var(--folder);
  box-shadow:0 5px 0 var(--line);padding:22px 10px 10px 74px;text-align:start;display:block;z-index:1}
html[dir="rtl"] .node{padding:22px 74px 10px 10px;border-radius:18px 6px 18px 18px}
.node::before{content:"";position:absolute;top:-14px;inset-inline-start:-3px;width:46%;height:16px;background:var(--folder);border:3px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0}
.node .tab{position:absolute;top:-12px;inset-inline-start:10px;font-family:"Luckiest Guy","Nunito",sans-serif;font-size:13px;color:var(--navy);z-index:2;letter-spacing:.5px}
html[dir="rtl"] .node .tab{font-family:"Noto Naskh Arabic",serif;font-weight:800;top:-16px}
.node .ic{position:absolute;inset-inline-start:10px;top:22px;width:54px;height:54px;border-radius:50%;background:var(--card);border:3px solid var(--c,#1F7A8C);
  display:grid;place-items:center;font-size:28px}
.node .pinr{position:absolute;top:-6px;inset-inline-end:14px;width:16px;height:16px;border-radius:50%;background:var(--pin);border:2px solid var(--line)}
.node .nm{display:block;font-weight:900;font-size:15.5px;line-height:1.25;color:#2A2010}
html[dir="rtl"] .node .nm{font-size:16px;line-height:1.6}
.node .st{display:block;font-size:14px;min-height:18px}
.node.lock{filter:grayscale(.85);opacity:.75}
.node.lock .ic::after{content:"🔒";position:absolute;font-size:20px;bottom:-8px;inset-inline-end:-8px}
.node.now{outline:4px solid var(--gold);outline-offset:3px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{outline-color:var(--fox)}}
.node .peek{position:absolute;inset-inline-end:-30px;bottom:-12px;width:58px;height:58px;z-index:3;pointer-events:none}
.node .peek .fox{width:58px;height:58px}
.hq{display:flex;justify-content:center;margin:4px 0 18px}
.hq .node{width:78%;background:var(--navy);color:#fff}
.hq .node::before{background:var(--navy)}
.hq .node .nm{color:var(--gold)}.hq .node .tab{color:var(--gold)}
.start{text-align:center;margin-top:14px;background:var(--card);border:3px dashed var(--line);border-radius:16px;padding:10px;font-size:15px;position:relative;z-index:1}
</style>
<style>
.node .peek{inset-inline-end:4px;bottom:-24px}
/* ---------- Kepala stesen ---------- */
.shead{display:flex;gap:10px;align-items:center;margin:4px 0 10px}
.shead .ic{flex:0 0 54px;height:54px;border-radius:14px;background:var(--card);border:3px solid var(--c);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 var(--line)}
.shead h2{font-size:21px;color:var(--ink)}
html[dir="rtl"] .shead h2{font-size:20px}
.shead small{display:block;color:var(--muted);font-size:14px}
/* ---------- Kad ---------- */
.card{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 0 var(--line);position:relative;
  background-image:linear-gradient(transparent 31px,rgba(30,42,71,.07) 31px 32px);background-size:100% 32px}
.card::before{content:"";position:absolute;top:-9px;inset-inline-start:24px;width:70px;height:18px;background:rgba(244,182,63,.75);transform:rotate(-4deg);border-radius:3px}
.rpic{font-size:44px;text-align:center}
.rh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:21px;margin:4px 0 8px;color:var(--teal)}
.rtext{margin:6px 0}
.say{flex:0 0 46px;width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--gold);font-size:20px}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.wt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center;min-width:0;overflow-wrap:anywhere;animation:pop .35s both;animation-delay:calc(var(--i)*60ms)}
.wt .jw{display:block;font-size:24px;line-height:1.6}
.wt .rm{display:block}
.wt .ar{display:block;font-size:13px;color:var(--fox);font-family:"Nunito",sans-serif}
.slist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.sl{background:var(--card);border-inline-start:6px solid var(--teal);border-radius:10px;padding:6px 10px;animation:pop .35s both;animation-delay:calc(var(--i)*70ms)}
.sl .jw{display:block;font-size:21px;line-height:1.8}
.sl .rm{display:block;font-size:14px}
.tip{display:flex;gap:8px;background:var(--note);border-radius:12px;padding:8px 10px;margin:10px 0;font-size:16px}
.tip.am{background:var(--okbg)}
.ref{font-size:14px;color:var(--muted);margin:8px 0}
.navr{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--card);font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);padding:8px 12px;width:100%}
.btn.go{background:var(--fox);color:#fff}
.btn.alt{background:var(--card)}
.btn:disabled{opacity:.4}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--street)}
.dots i.on{background:var(--fox)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
/* ---------- Kemajuan: jejak tapak ---------- */
.prog{position:relative;height:26px;border-radius:999px;background:var(--card);border:3px solid var(--line);margin:4px 0 12px;overflow:visible}
.prog .done{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(45deg,var(--gold) 0 10px,var(--fox) 10px 20px);border-radius:999px}
.prog .hm{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:14px}
/* ---------- Permainan umum ---------- */
.q{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.q p{margin:0;font-weight:900;font-size:18px}
.hint{margin-top:10px;background:var(--badbg);border-radius:12px;padding:8px 10px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cnt{text-align:center;color:var(--muted);font-size:15px;margin-top:8px}
.o2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:62px;border-radius:14px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);padding:6px 8px;min-width:0;overflow-wrap:anywhere;font-weight:800}
.opt .jw{font-size:24px;line-height:1.6;display:block}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.used,.opt.gone{opacity:.35;pointer-events:none}
.opt.sel{outline:4px solid var(--gold);outline-offset:2px}
.big{font-size:30px;text-align:center;line-height:1.7}
/* kanta */
.scene{background:var(--card);border:3px dashed var(--teal);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:flex-start}
.tok{font-family:"Noto Naskh Arabic",serif;font-size:22px;line-height:1.6;padding:2px 8px;border-radius:10px;border:2px solid transparent;background:transparent;min-height:46px}
.tok.found{background:var(--gold);border-color:var(--line);color:#1a1a1a}
.tok.miss{background:var(--badbg)}
.sub{font-size:14px;color:var(--muted);margin:6px 0 0;direction:ltr;text-align:left;font-family:"Nunito",sans-serif}
.lens{font-size:15px;margin-top:8px}
/* cap jari */
.cj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cj .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.fp{position:relative;padding-inline-start:30px}
.fp::before{content:"🫆";position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
.fp.sus::before{content:"🕵️"}
/* saksi */
.wit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wit .opt{display:flex;flex-direction:column;align-items:center;padding:6px 4px}
.wit .face{font-size:34px;line-height:1}
.wit .sign{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:2px 4px;margin-top:4px;width:100%}
.wit .sign .jw{font-size:21px}
/* kod rahsia */
.safe{background:var(--navy);color:var(--gold);border:4px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.safe .slot{background:#0B1222;border-radius:10px;min-height:64px;font-family:"Noto Naskh Arabic",serif;font-size:32px;color:#7CF0B0;display:flex;align-items:center;justify-content:center;direction:rtl;padding:0 8px}
.safe .rm{color:#D8E0F5}
.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;direction:rtl}
.key{min-width:62px;min-height:58px;border-radius:12px;border:3px solid var(--line);background:var(--gold);color:#1a1a1a;font-family:"Noto Naskh Arabic",serif;font-size:26px;box-shadow:0 4px 0 var(--line)}
.key.used{opacity:.3;pointer-events:none}
.undo{margin-top:10px;min-height:44px;border-radius:12px;border:3px solid var(--line);background:var(--card);padding:4px 14px;font-weight:900}
</style>
<style>
.fp::before{content:"";width:18px;height:22px;border-radius:50% 50% 45% 45%;opacity:.55;
  background:repeating-radial-gradient(ellipse at 50% 60%,var(--teal) 0 1.5px,transparent 1.5px 3.5px)}
/* fail kes */
.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.files.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fold{position:relative;min-height:84px;border:3px solid var(--line);border-radius:4px 12px 12px 12px;background:var(--folder);padding:16px 6px 6px;min-width:0;overflow-wrap:anywhere;text-align:center;box-shadow:0 4px 0 var(--line)}
.fold::before{content:"";position:absolute;top:-11px;inset-inline-start:-3px;width:50%;height:12px;background:var(--folder);border:3px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}
.fold .lb{display:block;font-weight:900;font-size:15px;line-height:1.3}
.fold .lb .jw{font-size:22px}
.fold .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.fold .in span{font-family:"Noto Naskh Arabic",serif;font-size:15px;background:var(--card);border-radius:6px;padding:0 5px}
.fold.ready{outline:4px dashed var(--fox);outline-offset:2px}
.pile{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pile .opt{min-height:56px;padding:4px 12px}
/* petunjuk */
.sent{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px;font-family:"Noto Naskh Arabic",serif;font-size:22px;line-height:1.9;direction:rtl;text-align:right}
.blank{display:inline-block;min-width:90px;border-bottom:4px dashed var(--fox);text-align:center;color:var(--fox);padding:0 6px}
.blank.fill{border-bottom-style:solid;color:var(--ok)}
.clues{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.clue{min-height:54px;border-radius:6px;border:3px solid var(--line);background:#FFF6A8;color:#1a1a1a;font-family:"Noto Naskh Arabic",serif;font-size:21px;padding:2px 12px;box-shadow:3px 4px 0 var(--line);transform:rotate(-2deg)}
.clue:nth-child(even){transform:rotate(2deg);background:#C6F0FF}
.clue.used{opacity:.3;pointer-events:none}
/* penyamar */
.lineup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:repeating-linear-gradient(0deg,var(--card) 0 22px,var(--street) 22px 24px);border:3px solid var(--line);border-radius:14px;padding:10px}
.lineup .opt{position:relative}
.lineup .opt .n{position:absolute;top:2px;inset-inline-start:6px;font-size:12px;color:var(--muted);font-family:"Nunito",sans-serif}
.lineup .opt.caught{background:var(--badbg);border-color:var(--bad)}
.fix{margin-top:10px;text-align:center;background:var(--okbg);border-radius:12px;padding:6px}
.fix .jw{font-size:26px}
/* bukti */
.ev{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;direction:rtl;margin-bottom:10px}
.ev .bx{min-width:70px;min-height:58px;border:3px solid var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center;font-family:"Noto Naskh Arabic",serif;font-size:26px;padding:0 10px}
.ev .bx.q{border-style:dashed;color:var(--muted)}
.ev .plus{font-size:24px;font-weight:900}
.step{font-size:15px;color:var(--teal);margin:6px 0;font-weight:900}
.pref{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:rtl}
.pref .opt{min-width:72px}
/* siasat */
.doc{background:var(--card);border:3px solid var(--line);border-radius:12px;padding:10px 12px;max-height:230px;overflow:auto;font-family:"Noto Naskh Arabic",serif;font-size:19px;line-height:1.9;direction:rtl;text-align:right;position:relative}
.doc::after{content:"SULIT";position:sticky;bottom:0;float:left;font-family:"Luckiest Guy",sans-serif;color:var(--pin);opacity:.45;transform:rotate(-12deg);font-size:20px}
.doc .rmp{direction:ltr;text-align:left;font-family:"Nunito",sans-serif;font-size:15px;line-height:1.5;color:var(--muted);margin-top:8px}
.qq{margin:12px 0 8px;font-weight:900}
.o1{display:flex;flex-direction:column;gap:8px}
.o1 .opt{text-align:start}
/* cip nama huruf */
.hzc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.hzb{min-width:76px;min-height:64px;border:3px solid var(--line);border-radius:14px;background:var(--note);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 10px;box-shadow:0 4px 0 var(--line)}
.hzb .jw{font-size:28px;line-height:1.3}
.hzb small{font-family:"Nunito",sans-serif;font-size:13px;font-weight:900;direction:ltr}
/* ---------- Maklum balas ---------- */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:10px;animation:up .3s both}
.fb .in{width:100%;max-width:520px;background:var(--okbg);border:3px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 -4px 0 rgba(0,0,0,.15)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .row1 .fox{width:70px;height:70px;flex:0 0 70px}
.fb strong{font-size:22px;color:var(--ok);font-family:"Luckiest Guy","Nunito",sans-serif;font-weight:400}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.fb p{margin:2px 0 0;font-size:16px}
@keyframes up{from{transform:translateY(100%)}}
/* ---------- Keputusan ---------- */
.res{text-align:center}
.res .fox{width:120px;height:120px}
.stars{font-size:44px;margin:4px 0}
.stars span{display:inline-block;animation:pop .5s both}
.stars .off,.st .off{filter:grayscale(1) opacity(.3)}

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:    () => tone([[660,.1],[990,.16]]),
  tick:  () => tone([[820,.06,"triangle"]]),
  no:    () => tone([[200,.16,"square"],[160,.2,"square"]]),
  click: () => tone([[1400,.03,"square"],[700,.04,"square"]]),
  clue:  () => tone([[523,.08],[784,.08],[1046,.14]]),
  open:  () => tone([[300,.08,"sawtooth"],[450,.08,"sawtooth"],[900,.2]]),
  win:   () => tone([[392,.14],[523,.14],[659,.14],[784,.3]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const clean = t => String(t).replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/[✗✓✅❌→←·•¾]/g," ")
  .replace(/\(\s*[\d:\s,/]*\)/g," ").replace(/\s+([.,:;!?])/g,"$1").replace(/([.,:;!?])\s*(?=[.,:;!?])/g,"").replace(/\s{2,}/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean(text).replace(/…/g," ... "));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span class="badge">${S.st.sticker}</span><span>${L("Lencana baharu untuk papan bukti kamu!","لنچان بهارو اونتوق ڤاڤن بوقتي کامو!")}</span></div>` : ""}
      ${openedFinal ? `<p><b>🏢 ${L("Kes Besar di Ibu Pejabat kini dibuka!","کيس بسر د ايبو ڤجابت کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🗺️ ${L("Kembali ke peta","کمبالي ک ڤتا")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Siasat lagi","سياست لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}
const GAMES = {};

/* KANTA: imbas ayat dengan kanta pembesar, tekan setiap perkataan sasaran */
GAMES.kanta = function(el, g){
  let r = 0;
  const draw = () => {
    const [ru, jwS] = g.rounds[r];
    const toks = jwS.split(" ").map(w => ({ hit: w[0]==="*", w: w.replace(/^\*/,"") }));
    const need = toks.filter(t=>t.hit).length; let got = 0, busy = false;
    el.innerHTML = `<div class="scene" lang="ms-Arab">${toks.map((t,i)=>`<button class="tok" data-i="${i}" data-hit="${t.hit?1:0}">${t.w}</button>`).join("")}</div>
      <p class="sub">${ru}</p>
      <div class="lens">🔍 ${L("Dijumpai","دجومڤاءي")}: <b id="kc">0</b> / ${need}</div>
      <div class="cnt">📄 ${r+1} / ${g.rounds.length}</div>`;
    el.querySelectorAll(".tok").forEach(b => b.addEventListener("click", () => {
      if(busy || b.classList.contains("found")) return;
      if(b.dataset.hit==="1"){
        b.classList.add("found"); sfx.ok(); clearHint();
        el.querySelector("#kc").textContent = ++got;
        if(got===need){ busy = true; if(++r < g.rounds.length) setTimeout(draw, 600); else setTimeout(win, 450); }
      } else {
        b.classList.add("miss"); setTimeout(()=>b.classList.remove("miss"), 600);
        oops(b, L("Bukan itu. Perhatikan huruf ء dan imbuhannya.","بوکن ايت. ڤرهاتيکن حروف ء دان ايمبوهنڽ."));
      }
    }));
  };
  draw();
};

/* CAP JARI: pilih suspek (kiri), kemudian cap jari yang sepadan (kanan) */
GAMES.capjari = function(el, g){
  const n = g.pairs.length, leftOrder = shuffle([...Array(n).keys()]);
  const rightOrder = mix(leftOrder);
  let sel = null, left = n;
  const lhtml = i => { const p = g.pairs[i]; return p[0] ? `${jw(p[0])}${rm(p[1])}` : `<span style="font-family:Nunito,sans-serif;font-size:19px;font-weight:900">${p[1]}</span>`; };
  const rhtml = i => { const p = g.pairs[i]; return `${jw(p[2])}${p[3]?rm(p[3]):""}`; };
  el.innerHTML = `<div class="cj"><div class="col">${leftOrder.map(i=>`<button class="opt fp sus" data-l="${i}">${lhtml(i)}</button>`).join("")}</div>
    <div class="col">${rightOrder.map(i=>`<button class="opt fp" data-r="${i}">${rhtml(i)}</button>`).join("")}</div></div>
    <div class="cnt">🕵️ ${L("Pilih suspek dahulu, kemudian cap jarinya.","ڤيليه سوسڤيک دهولو، کمودين چڤ جاريڽ.")}</div>`;
  el.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => {
    if(b.classList.contains("used")) return;
    el.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); sel = b; sfx.tick();
    const p = g.pairs[+b.dataset.l]; speak(p[1]);
  }));
  el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
    if(b.classList.contains("used")) return;
    if(!sel){ toast(L("Pilih suspek di sebelah kiri dahulu 🕵️","ڤيليه سوسڤيک د سبله کانن دهولو 🕵️")); return; }
    if(b.dataset.r === sel.dataset.l){
      sfx.ok(); clearHint();
      [b, sel].forEach(x=>{ x.classList.remove("sel"); x.classList.add("ok","used"); });
      sel = null;
      if(--left===0) setTimeout(win, 400);
    } else oops(b, L("Cap jari tidak sepadan. Lihat huruf awal dan ء.","چڤ جاري تيدق سڤادن. ليهت حروف اول دان ء."));
  }));
};

/* SAKSI: tiga saksi tunjuk ejaan; pilih saksi yang jujur */
const FACES = ["🦉","🐻","🐰","🐼","🐯","🐨","🐸","🐵"];
GAMES.saksi = function(el, g){
  let r = 0;
  const draw = () => {
    const [ru, ok, ...bad] = g.rounds[r], opts = shuffle([ok, ...bad]), faces = shuffle(FACES).slice(0,opts.length);
    let busy = false;
    el.innerHTML = `<p class="big" style="font-family:Nunito,sans-serif;font-size:22px;margin:0 0 8px">🗣️ “${ru}”</p>
      <div class="wit">${opts.map((o,i)=>`<button class="opt" data-v="${esc(o)}"><span class="face">${faces[i]}</span><span class="sign">${jw(o)}</span></button>`).join("")}</div>
      <div class="cnt">👥 ${r+1} / ${g.rounds.length}</div>`;
    speak(ru);
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(busy) return;
      if(b.dataset.v === ok){
        busy = true; b.classList.add("ok"); sfx.ok(); clearHint();
        if(++r < g.rounds.length) setTimeout(draw, 650); else setTimeout(win, 450);
      } else { b.classList.add("used"); oops(b, L(`Saksi itu keliru! Bagaimana mengeja “${ru}”?`,"سکسي ايت کليرو! چوبا ليهت سکالي لاڬي.")); }
    }));
  };
  draw();
};

/* KOD RAHSIA: tekan kepingan ikut urutan untuk membuka peti besi */
GAMES.kod = function(el, g){
  let w = 0;
  const draw = () => {
    const [ru, pieces, decoys] = g.words[w], keys = mix([...pieces, ...decoys]);
    let pos = 0, busy = false;
    el.innerHTML = `<div class="safe"><div>🔐 ${rm(ru)}</div><div class="slot" id="slot" aria-live="polite">&nbsp;</div></div>
      <div class="keys">${keys.map(k=>`<button class="key" data-v="${esc(k)}">${k}</button>`).join("")}</div>
      <div class="cnt">🗝️ ${w+1} / ${g.words.length}</div>`;
    speak(ru);
    el.querySelectorAll(".key").forEach(b => b.addEventListener("click", () => {
      if(busy || b.classList.contains("used")) return;
      if(b.dataset.v === pieces[pos]){
        sfx.click(); clearHint(); b.classList.add("used"); pos++;
        el.querySelector("#slot").textContent = pieces.slice(0,pos).join("");
        if(pos===pieces.length){ busy = true; sfx.open(); if(++w < g.words.length) setTimeout(draw, 700); else setTimeout(win, 500); }
      } else oops(b, L(`Kod salah! Sebut “${ru}” perlahan-lahan dan ikut urutan.`,"کود ساله! ايکوت اوروتن بوڽي ڤرکاتاءن ايت."));
    }));
  };
  draw();
};

/* FAIL KES: pilih bukti, masukkan ke dalam fail yang betul */
GAMES.fail = function(el, g){
  const order = mix([...g.items.keys()]);
  let sel = null, left = g.items.length;
  el.innerHTML = `<div class="files ${g.bins.length>2?"f3":""}">${g.bins.map((b,i)=>`<button class="fold" data-b="${i}"><span class="lb">${b[2]} ${/[\u0600-\u06FF]/.test(b[1]) && isJ() ? jw(b[1]) : (/[\u0600-\u06FF]/.test(b[0]) ? jw(b[0]) : T([b[0],b[1]]))}</span><span class="in"></span></button>`).join("")}</div>
    <div class="pile">${order.map(i=>`<button class="opt" data-i="${i}">${jw(g.items[i][1])}</button>`).join("")}</div>`;
  const folds = el.querySelectorAll(".fold");
  el.querySelectorAll(".pile .opt").forEach(b => b.addEventListener("click", () => {
    if(b.classList.contains("gone")) return;
    el.querySelectorAll(".pile .opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); sel = b; sfx.tick(); folds.forEach(f=>f.classList.add("ready"));
    speak(g.items[+b.dataset.i][0]);
  }));
  folds.forEach(f => f.addEventListener("click", () => {
    if(!sel){ toast(L("Pilih satu bukti dahulu 🔍","ڤيليه ساتو بوقتي دهولو 🔍")); return; }
    const it = g.items[+sel.dataset.i];
    if(it[2] === +f.dataset.b){
      sfx.ok(); clearHint(); sel.classList.add("gone"); sel.classList.remove("sel");
      f.querySelector(".in").insertAdjacentHTML("beforeend", `<span>${it[1]}</span>`);
      sel = null; folds.forEach(x=>x.classList.remove("ready"));
      if(--left===0) setTimeout(win, 400);
    } else oops(f, L(`Bukan fail itu untuk “${it[0]}”. Cuba fail lain.`,"بوکن فايل ايت. چوبا فايل لاءين."));
  }));
};

/* PETUNJUK: tampal kad petunjuk ke tempat kosong dalam ayat */
GAMES.petunjuk = function(el, g){
  let r = 0;
  const used = new Set();
  const draw = () => {
    const [ru, jwS, ans] = g.rounds[r], cards = shuffle(g.bank);
    let busy = false;
    el.innerHTML = `<div class="sent" lang="ms-Arab">${jwS.replace("___",`<span class="blank" id="blank">؟</span>`)}</div>
      <p class="sub">${ru}</p>
      <div class="clues">${cards.map(c=>`<button class="clue ${used.has(c)?"used":""}" data-v="${esc(c)}">${c}</button>`).join("")}</div>
      <div class="cnt">📌 ${r+1} / ${g.rounds.length}</div>`;
    el.querySelectorAll(".clue").forEach(b => b.addEventListener("click", () => {
      if(busy || b.classList.contains("used")) return;
      if(b.dataset.v === ans){
        busy = true; sfx.ok(); clearHint(); used.add(ans); b.classList.add("used");
        const bl = el.querySelector("#blank"); bl.textContent = ans; bl.classList.add("fill");
        speak(ru);
        if(++r < g.rounds.length) setTimeout(draw, 900); else setTimeout(win, 600);
      } else oops(b, L("Petunjuk itu tidak sesuai. Baca ayat Rumi di bawah.","ڤتونجوق ايت تيدق سسواي. باچ سموا ايات دڠن تليتي."));
    }));
  };
  draw();
};

/* PENYAMAR: barisan suspek; tangkap ejaan yang salah */
GAMES.penyamar = function(el, g){
  let r = 0;
  const draw = () => {
    const items = shuffle(g.rounds[r].map((x,i)=>({x,i})));
    const need = g.rounds[r].filter(x=>x[2]).length; let got = 0, busy = false;
    el.innerHTML = `<div class="lineup">${items.map((o,k)=>`<button class="opt" data-i="${o.i}" data-bad="${o.x[2]?1:0}"><span class="n">#${k+1}</span>${jw(o.x[1])}</button>`).join("")}</div>
      <div id="fix"></div><div class="cnt">🚨 ${r+1} / ${g.rounds.length}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(busy || b.classList.contains("caught") || b.classList.contains("ok")) return;
      const it = g.rounds[r][+b.dataset.i];
      if(b.dataset.bad==="1"){
        sfx.ok(); clearHint(); b.classList.add("caught");
        el.querySelector("#fix").insertAdjacentHTML("beforeend", `<div class="fix">✅ ${jw(it[2])} ${rm(it[0])}</div>`);
        speak(it[0]);
        if(++got===need){ busy = true; if(++r < g.rounds.length) setTimeout(draw, 1300); else setTimeout(win, 800); }
      } else { b.classList.add("ok"); oops(b, L(`“${it[0]}” dieja dengan betul. Dia bukan penyamar!`,"ايجاءن ايت بتول. دي بوکن ڤڽامر!")); }
    }));
  };
  draw();
};

/* BUKTI: kata dasar + awalan (langkah 1) → ejaan betul (langkah 2) */
GAMES.bukti = function(el, g){
  let k = 0;
  const draw = () => {
    const [ru, base, pre, ok, bad] = g.items[k];
    let step = 1, busy = false;
    const paint = () => {
      el.innerHTML = `<div class="ev"><span class="bx ${step===1?"q":""}">${step===1?"؟":pre}</span><span class="plus">+</span><span class="bx">${base}</span></div>
        <p class="sub">🎯 ${rm(ru)}</p>
        <p class="step">${step===1 ? L("Langkah 1: Pilih awalan","لڠکه 1: ڤيليه اولن") : L("Langkah 2: Pilih ejaan yang betul","لڠکه 2: ڤيليه ايجاءن يڠ بتول")}</p>
        ${step===1 ? `<div class="pref">${g.prefs.map(p=>`<button class="opt" data-p="${esc(p)}">${jw(p)}</button>`).join("")}</div>`
                   : `<div class="o2">${mix([ok,bad]).map(s=>`<button class="opt" data-s="${esc(s)}">${jw(s)}</button>`).join("")}</div>`}
        <div class="cnt">🧾 ${k+1} / ${g.items.length}</div>`;
      el.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
        if(b.dataset.p === pre){ sfx.tick(); clearHint(); step = 2; paint(); }
        else oops(b, L(`Dengar betul-betul: “${ru}”. Awalan apakah di depannya?`,"دڠر بتول٢. اولن اڤاکه د دڤنڽ؟"));
      }));
      el.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(b.dataset.s === ok){
          busy = true; b.classList.add("ok"); sfx.ok(); clearHint(); speak(ru);
          if(++k < g.items.length) setTimeout(draw, 700); else setTimeout(win, 500);
        } else { b.classList.add("used"); oops(b, L("Ejaan itu palsu! Periksa sama ada ء perlu atau tidak.","ايجاءن ايت ڤلسو! ڤريقسا سام اد ء ڤرلو اتاو تيدق.")); }
      }));
    };
    paint(); speak(ru);
  };
  draw();
};

/* SIASAT: baca fail sulit, kemudian jawab soalan saksi */
GAMES.siasat = function(el, g){
  let r = 0;
  const draw = () => {
    const [qq, ok, ...bad] = g.rounds[r], opts = shuffle([ok, ...bad]);
    let busy = false;
    el.innerHTML = `<div class="doc" lang="ms-Arab">${g.doc[1]}${isJ()?"":`<div class="rmp">${g.doc[0]}</div>`}</div>
      <p class="qq">❓ ${T(qq)} ${sayBtn(RU(qq))}</p>
      <div class="o1">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${T(o)}</button>`).join("")}</div>
      <div class="cnt">🗂️ ${r+1} / ${g.rounds.length}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(busy || b.classList.contains("used")) return;
      if(opts[+b.dataset.i] === ok){
        busy = true; b.classList.add("ok"); sfx.ok(); clearHint();
        if(++r < g.rounds.length) setTimeout(draw, 650); else setTimeout(win, 450);
      } else { b.classList.add("used"); oops(b, L("Cari jawapannya di dalam fail sulit itu.","چاري جاوڤنڽ د دالم فايل سوليت ايت.")); }
    }));
  };
  draw();
};

/* ---------- Sebutan nama huruf: rakaman suara Malaysia (/assets/huruf/uXXXX.mp3), bukan TTS ---------- */
const HURUF = { "ا":"alif","ب":"ba","ت":"ta","ة":"ta marbutoh","ث":"tsa","ج":"jim","چ":"ca","ح":"ha","خ":"kho","د":"dal","ذ":"zal","ر":"ro","ز":"zai",
  "س":"sin","ش":"syin","ص":"sod","ض":"dhod","ط":"tho","ظ":"zo","ع":"ain","غ":"ghain","ڠ":"nga","ف":"fa","ڤ":"pa","ق":"qof","ک":"kaf","ك":"kaf","ڬ":"ga",
  "ل":"lam","م":"mim","ن":"nun","و":"wau","ۏ":"va","ه":"ha","ء":"hamzah","ي":"ya","ڽ":"nya","لا":"lam alif" };
const hurufFile = ch => "/assets/huruf/" + [...ch].map(x => "u" + (x==="ک" ? "0643" : x.codePointAt(0).toString(16).padStart(4,"0"))).join("_") + ".mp3";
const isHurufName = (ch, name) => !!ch && HURUF[ch]!==undefined && String(name).trim().toLowerCase()===HURUF[ch];
let hurufAudio = null;
function stopHuruf(){ try{ if(hurufAudio){ hurufAudio.pause(); hurufAudio = null; } }catch(e){} }
function sayHuruf(ch, force){
  if(!voiceOn && !force) return;
  try{ if(ttsOK) speechSynthesis.cancel(); stopHuruf(); hurufAudio = new Audio(hurufFile(ch)); const pr = hurufAudio.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
}
// cip huruf pada kad bacaan: c.hz = ["ء","ا",...] (hanya huruf yang ada rakaman)
const hzChips = c => c.hz ? `<div class="hzc">${c.hz.filter(ch=>HURUF[ch]).map(ch=>`<button class="hzb" data-huruf="${ch}" aria-label="${HURUF[ch]}">${jw(ch)}<small>🔊 ${HURUF[ch]}</small></button>`).join("")}</div>` : "";

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const hz = e.target.closest("[data-huruf]");
  if(hz){ sayHuruf(hz.dataset.huruf, true); return; }
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t4-voice", voiceOn); if(!voiceOn){ hush(); stopHuruf(); } redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan kes sebelumnya dahulu 🔒","سلسايکن کيس سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Tutup semua ${STATIONS.length} kes untuk membuka Kes Besar 🏢`,`توتوڤ سموا ${STATIONS.length} کيس اونتوق ممبوک کيس بسر 🏢`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); stopHuruf(); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa (selepas tukar tulisan/suara) tanpa ulang bunyi/konfeti
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
