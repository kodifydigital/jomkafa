<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C3A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/access.js"></script>
<title>Kem Pengakap Feqah • Feqah Tahun 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Feqah Tahun 4: "Kem Pengakap Feqah" — denai hutan, khemah, unggun api, Rara si rusa pengakap ===== */
:root{
  --dusk1:#FFB35C; --dusk2:#FCE3B0; --bg:#F7EFD9; --card:#FFFDF5; --ink:#2A2216; --muted:#6B5D45; --line:#2A2216;
  --pine:#1F5C3A; --pine2:#2E8150; --moss:#7DB46C; --khaki:#D8BE86; --khaki2:#B89757; --fire:#F2611D; --fire2:#FFB703;
  --canvas:#F4E4BC; --ok:#2E8150; --okbg:#DDF3DF; --bad:#D9442B; --badbg:#FDE1DA; --note:#FFF4D1; --tipbg:#E6F2E2; --tipink:#1B3D26;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --dusk1:#0E1A33; --dusk2:#1A2B3E; --bg:#121A16; --card:#1D2922; --ink:#F3EEDD; --muted:#C2BBA2; --line:#060A08;
    --canvas:#3B3423; --okbg:#183A24; --badbg:#46201A; --note:#3A321A; --tipbg:#1E3526; --tipink:#D8F0DC; --khaki:#7A6A42; --khaki2:#5D5032;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:700;
  background:linear-gradient(180deg,var(--dusk1) 0,var(--dusk2) 360px,var(--bg) 820px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-size:19px;line-height:1.85;font-weight:600}
h1,h2,h3,.bung{font-family:"Bungee","Nunito",sans-serif;font-weight:400;letter-spacing:.3px}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .bung{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--fire2);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 60px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;font-weight:400}

/* pokok pain di latar */
.pines{position:fixed;inset:auto 0 0 0;height:120px;pointer-events:none;z-index:-1;opacity:.22;
  background:conic-gradient(from 150deg at 8% 0,transparent 0 60deg,var(--pine) 0) 0 100%/90px 120px repeat-x}
.stars-bg{position:fixed;inset:0 0 auto 0;height:220px;pointer-events:none;z-index:-1;opacity:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stars-bg{opacity:.8;
  background:radial-gradient(2px 2px at 12% 20%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 38% 60%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 25%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 88% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 55% 10%,#fff 50%,transparent 51%)}}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:12px;border:3px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:21px;font-weight:800;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:0 10px}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 12px;border-radius:12px;border:3px solid var(--line);background:var(--fire2);color:#3A2600;font-weight:900;box-shadow:0 4px 0 var(--line)}

/* tajuk */
.hero{display:flex;align-items:center;gap:10px;background:var(--canvas);border:3px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 6px 0 var(--line);margin:4px 0 14px;
  background-image:repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.04) 22px 24px)}
.hero h1{margin:0;font-size:clamp(21px,6vw,29px);line-height:1.1;color:var(--pine)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero h1{color:var(--fire2)}}
html[dir="rtl"] .hero h1{line-height:1.5}
.hero p{margin:3px 0 0;color:var(--muted);font-size:15.5px}
.rara{width:86px;height:auto;flex:none}
.rara.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(2deg)}}
.rara.yay{animation:yay .5s ease 2}
@keyframes yay{50%{transform:translateY(-14px) scale(1.06)}}

/* lencana (pelekat) */
.sttl{font-weight:900;font-size:15px;margin:0 0 4px;color:var(--muted)}
.stickers{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;background:var(--pine);border:3px solid var(--line);border-radius:16px;padding:8px;margin-bottom:14px;
  background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.05) 10px 20px)}
.stickers span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(15px,4.6vw,24px);background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.35)}
.stickers span.got{background:var(--fire2);border:3px solid var(--line);box-shadow:0 0 0 3px #fff inset;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stickers span:not(.got){filter:grayscale(1);opacity:.45}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* peta denai kem */
.trail{position:relative;padding:8px 0 0}
.trail::before{content:"";position:absolute;left:50%;top:70px;bottom:80px;width:0;border-left:8px dashed var(--khaki2);transform:translateX(-50%)}
.camp{position:relative;z-index:1;margin:0 auto 8px;display:grid;place-items:center}
.row{position:relative;display:flex;align-items:center;min-height:132px;z-index:1}
.row.r{justify-content:flex-end}
.row::before{content:"";position:absolute;top:58%;height:0;width:26%;border-top:6px dotted var(--khaki2);z-index:-1}
.row.l::before{left:30%}.row.r::before{right:30%}
.node{width:50%;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;color:inherit}
.tent{position:relative;width:104px;height:92px;display:grid;place-items:end center;transition:transform .15s}
.tent::before{content:"";position:absolute;inset:0;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 0 var(--line))}
.tent::after{content:"";position:absolute;left:50%;bottom:0;width:34px;height:46px;transform:translateX(-50%);background:rgba(0,0,0,.35);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tent .tic{position:relative;z-index:1;font-size:34px;margin-bottom:6px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.tent .flag{position:absolute;top:-22px;left:50%;width:3px;height:26px;background:var(--line)}
.tent .flag::after{content:"";position:absolute;left:3px;top:0;width:20px;height:13px;background:var(--fire2);clip-path:polygon(0 0,100% 50%,0 100%)}
.node:active .tent{transform:translateY(4px)}
.node .num{position:absolute;bottom:-6px;left:-4px;z-index:2;width:32px;height:32px;border-radius:50%;background:var(--fire2);border:3px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:900;color:#3A2600;font-family:Nunito,sans-serif}
.node .nm{background:var(--card);border:3px solid var(--line);border-radius:10px;padding:2px 9px;font-weight:900;font-size:15px;text-align:center;line-height:1.25;max-width:100%;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--line)}
html[dir="rtl"] .node .nm{line-height:1.6;font-size:15px}
.node .st{font-size:16px;letter-spacing:1px;min-height:22px}
.node .st .off{filter:grayscale(1);opacity:.3}
.node.lock .tent{filter:grayscale(.9) opacity(.7)}
.node.lock .tent .tic::after{content:"🔒";position:absolute;font-size:24px;right:-26px;bottom:-2px}
.node.now .tent{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.guide{position:absolute;width:60px;top:-18px;right:-34px;pointer-events:none;z-index:3}
.fire{width:126px;height:110px;position:relative;display:grid;place-items:end center}
.fire .fl{font-size:60px;line-height:1;animation:flick 1s ease-in-out infinite alternate;position:relative;z-index:1}
.fire .logs{position:absolute;bottom:2px;width:110px;height:20px;background:linear-gradient(10deg,transparent 40%,#7A4A22 41% 59%,transparent 60%),linear-gradient(-10deg,transparent 40%,#5E3618 41% 59%,transparent 60%)}
@keyframes flick{to{transform:scale(1.08,1.12) translateY(-2px)}}
.final.lock .fl{filter:grayscale(1);opacity:.5}
.gate{position:relative;z-index:1;margin:6px -14px 0;height:86px;background:linear-gradient(180deg,var(--moss),var(--pine2));border-top:4px solid var(--line);border-radius:40% 40% 0 0/30px 30px 0 0;display:grid;place-items:center;color:#fff;font-weight:900;text-shadow:0 2px 0 var(--line);font-size:19px}
</style>
<style>
/* kad umum */
.card{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 0 var(--line);animation:pagein .35s ease both}
@keyframes pagein{from{opacity:0;transform:translateY(14px) scale(.98)}}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead .badge{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--c);border:3px solid var(--line);box-shadow:0 0 0 4px var(--card) inset,0 4px 0 var(--line)}
.shead h2{margin:0;font-size:clamp(17px,4.8vw,23px);line-height:1.2}
html[dir="rtl"] .shead h2{line-height:1.6}
.shead small{display:block;color:var(--muted);font-size:14.5px}
.shead>div{min-width:0}

/* kemajuan: but mendaki denai */
.prog{position:relative;height:34px;margin:2px 0 12px;background:var(--card);border:3px solid var(--line);border-radius:999px;overflow:hidden}
.prog .walk{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--moss) 0 12px,var(--pine2) 12px 24px);transition:width .5s}
html[dir="rtl"] .prog .walk{inset:0 0 0 auto}
.prog .boot{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:24px;transition:left .5s,right .5s}
.prog .fl{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px}

/* kad bacaan */
.rpic{font-size:58px;text-align:center;line-height:1.1;margin:0 0 4px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.rh{margin:0 0 8px;text-align:center;font-size:clamp(18px,5vw,23px);color:var(--pine);line-height:1.25}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rh{color:var(--fire2)}}
html[dir="rtl"] .rh{line-height:1.7}
.rtext{font-size:18px;margin:0 0 10px}
.rlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;counter-reset:n}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border:2px solid color-mix(in srgb,var(--line) 25%,transparent);border-radius:12px;padding:6px 10px;line-height:1.3;animation:pagein .35s both;animation-delay:calc(var(--i)*60ms);min-width:0;overflow-wrap:anywhere}
html[dir="rtl"] .rlist li{line-height:1.75}
.rlist li::before{counter-increment:n;content:counter(n);flex:none;width:30px;height:30px;border-radius:50%;background:var(--sc);color:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:900;font-family:Nunito,sans-serif}
.abox{background:var(--note);border:3px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px;text-align:center}
.abox .ar{display:block;font-size:clamp(21px,5.6vw,28px);line-height:2}
.abox .mk{display:block;font-size:16px;color:var(--muted);margin-top:4px}
.abox small{display:block;font-size:13.5px;color:var(--muted)}
.tip{display:flex;gap:8px;align-items:flex-start;background:var(--tipbg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 8px;font-size:16.5px;color:var(--tipink)}
.tip.am{background:#FFEBD9;color:#5A2A08}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip.am{background:#40281A;color:#FFE3CC}}
.tip b{flex:none}
.ref{font-size:14px;color:var(--muted);text-align:center;margin:4px 0 10px}
.say{border:2px solid var(--line);background:var(--fire2);border-radius:50%;width:40px;height:40px;font-size:18px;vertical-align:middle;flex:none;color:#3A2600}
.navr{display:flex;gap:10px}
.btn{flex:1;min-height:56px;border-radius:14px;border:3px solid var(--line);background:var(--pine2);color:#fff;font-size:19px;font-weight:900;box-shadow:0 5px 0 var(--line);padding:6px 14px;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--fire)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--ink) 25%,transparent)}
.dots i.on{background:var(--fire);width:24px;border-radius:6px}

/* soalan */
.q{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.q p{margin:0;flex:1;font-size:19px;font-weight:900;line-height:1.35;min-width:0}
html[dir="rtl"] .q p{line-height:1.8}
.qar{font-size:clamp(21px,5.6vw,27px);text-align:center;background:var(--note);border:2px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:10px;line-height:2}
.cnt{text-align:center;color:var(--muted);font-size:15px;margin-top:10px}
.hint{margin-top:10px;background:var(--badbg);border:2px solid var(--bad);border-radius:12px;padding:8px 12px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.g1{display:grid;gap:9px}
.opt{min-width:0;overflow-wrap:anywhere;min-height:56px;border-radius:14px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);padding:8px 10px;font-weight:800;font-size:16.5px;line-height:1.3;text-align:center}
html[dir="rtl"] .opt{line-height:1.7}
.opt .ar{font-size:21px;line-height:1.8}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right,.opt.done{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg)}
.opt.sel{outline:4px solid var(--fire2);outline-offset:1px}
.opt.used{opacity:.35;pointer-events:none}

/* maklum balas */
.fb{position:fixed;inset:auto 0 0 0;z-index:50;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--okbg);border-top:4px solid var(--line);animation:up .3s ease both}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:680px;margin:0 auto}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .rara{width:64px}
.fb strong{font-family:Bungee,Nunito,sans-serif;font-weight:400;font-size:21px;color:var(--pine)}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fb strong{color:var(--fire2)}}
.fb p{margin:2px 0 0;font-size:16px}
.fb .fast{display:inline-block;background:var(--fire2);color:#3A2600;border:2px solid var(--line);border-radius:8px;padding:0 8px;font-size:14px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:16px;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* keputusan */
.res{text-align:center}
.res .rara{width:120px}
.res h2{margin:6px 0;color:var(--pine)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .res h2{color:var(--fire2)}}
.stars{font-size:46px;letter-spacing:4px}
.stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stars .off{filter:grayscale(1);opacity:.3}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border:3px dashed var(--line);border-radius:14px;padding:8px;margin:10px 0}
.gotst span{font-size:40px;width:62px;height:62px;border-radius:50%;background:var(--fire2);display:grid;place-items:center;border:3px solid var(--line)}
</style>
<style>
/* ===== permainan kem ===== */
/* kompas */
.rose{width:132px;height:132px;margin:0 auto 10px;border-radius:50%;border:4px solid var(--line);background:radial-gradient(circle,var(--card) 0 52%,var(--canvas) 53% 100%);position:relative;box-shadow:0 5px 0 var(--line)}
.rose b{position:absolute;font-family:Bungee,Nunito,sans-serif;font-weight:400;font-size:15px}
.rose .n{top:3px;left:50%;transform:translateX(-50%)}.rose .s{bottom:3px;left:50%;transform:translateX(-50%)}
.rose .e{right:6px;top:50%;transform:translateY(-50%)}.rose .w{left:6px;top:50%;transform:translateY(-50%)}
.needle{position:absolute;left:50%;top:50%;width:14px;height:96px;margin:-48px 0 0 -7px;transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform:rotate(var(--r,20deg))}
.needle::before{content:"";position:absolute;inset:0 0 50% 0;background:var(--bad);clip-path:polygon(50% 0,100% 100%,0 100%)}
.needle::after{content:"";position:absolute;inset:50% 0 0 0;background:#8A9AA8;clip-path:polygon(0 0,100% 0,50% 100%)}
.opt .dir{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pine);color:#fff;font-family:Bungee,Nunito,sans-serif;font-size:13px;margin-inline-end:6px;vertical-align:middle}

/* khemah: susun ke khemah */
.kitem{background:var(--canvas);border:3px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:18px;font-weight:900;min-height:70px;display:grid;place-items:center;margin-bottom:12px;overflow-wrap:anywhere}
.tents{display:grid;gap:8px}
.kt{min-width:0;overflow-wrap:anywhere;border:3px solid var(--line);border-radius:12px 12px 6px 6px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:6px 4px 8px;font-weight:900;font-size:15px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:2px}
html[dir="rtl"] .kt{line-height:1.6}
.kt .tp{width:58px;height:44px;background:var(--tc);clip-path:polygon(50% 0,100% 100%,0 100%);display:grid;place-items:end center;font-size:18px;padding-bottom:2px}
.kt .kn{font-size:13px;color:var(--muted)}

/* unggun: kumpul kayu api */
.pit{height:96px;display:grid;place-items:end center;margin-bottom:8px;position:relative}
.pit .fl{font-size:calc(22px + var(--lv,0)*12px);line-height:1;transition:font-size .4s;animation:flick 1s ease-in-out infinite alternate}
.pit .logs{width:150px;height:18px;background:linear-gradient(8deg,transparent 40%,#7A4A22 41% 59%,transparent 60%),linear-gradient(-8deg,transparent 40%,#5E3618 41% 59%,transparent 60%)}
.log{background:linear-gradient(180deg,#E9C48F,#C9955A);color:#2A1A06;border-radius:30px}
.log.done{background:linear-gradient(180deg,#FFD27A,#F2611D);color:#fff}
.log.wet{background:#9FB3C2;color:#1C2A35}

/* simpul */
.ropes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;position:relative}
.ropes::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:4px dotted var(--khaki2)}
.rp{position:relative}

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[660,.12],[880,.18]]),
  tick: () => tone([[740,.08,"triangle"]]),
  no:   () => tone([[220,.18,"square"],[180,.2,"square"]]),
  pop:  () => tone([[900,.05,"triangle"],[1300,.06,"triangle"]]),
  fire: () => tone([[300,.06,"sawtooth"],[500,.08,"triangle"]]),
  click:() => tone([[1500,.03,"square"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.3]])
};

/* ---------- Suara (baca teks Rumi sahaja; buang tulisan Arab) ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
function clean(text){
  return text.replace(AR_RE," ").replace(/[“”"]\s*[“”"]/g," ").replace(/\(\s*\)/g," ").replace(/___/g," kosong ").replace(/…/g," ... ")
    .replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(/\s+/g," ").trim();
}
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  const s = clean(text); if(!s) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

  <div class="shead"><span class="badge" style="--c:${S.st.c}">${S.st.icon}</span><div><h2>${T(S.st.t)}</h2><small>${T(S.st.u)}</small></div></div>`;
function readSpeech(c){
  return [RU(c.h), RU(c.text), ...(c.list||[]).map(RU), RU(c.mk), c.tip?("Tahukah anda? "+RU(c.tip)):"", c.am?("Amalkan: "+RU(c.am)):""].filter(Boolean).join(". ");
}
function renderRead(){
  hush();
  const c = S.st.read[S.ri], n = S.st.read.length, last = S.ri===n-1;
  app.innerHTML = head() + `
    <article class="card" style="--sc:${S.st.c}">
      <div class="rpic" aria-hidden="true">${c.pic}</div>
      <h3 class="rh">${T(c.h)} ${sayBtn(readSpeech(c))}</h3>
      ${c.text?`<p class="rtext">${T(c.text)}</p>`:""}
      ${c.list?`<ul class="rlist">${c.list.map((x,i)=>`<li style="--i:${i}">${T(x)}</li>`).join("")}</ul>`:""}
      ${c.ar?`<div class="abox"><span class="ar" lang="ar">${c.ar}</span>${c.mk?`<span class="mk">${T(c.mk)}</span>`:""}${c.src?`<small>${T(c.src)}</small>`:""}</div>`:""}
      ${c.tip?`<div class="tip"><b>💡</b><span><b>${L("Tahukah anda?","تاهوکه اندا؟")}</b> ${T(c.tip)}</span></div>`:""}
      ${c.am?`<div class="tip am"><b>🔥</b><span><b>${L("Amalkan:","عملکن:")}</b> ${T(c.am)}</span></div>`:""}
      <div class="ref">📖 ${L("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</div>
      <div class="navr">
        <button class="btn alt" data-act="rprev" ${S.ri?"":"disabled"} aria-label="${L("Sebelum","سبلوم")}" style="flex:0 0 64px">${BACK()}</button>
        <button class="btn ${last?"go":""}" data-act="rnext">${last ? "🎮 "+L("Jom main!","جوم ماٴين!") : L("Seterusnya","ستروسڽ")+" ▶"}</button>
      </div>
      <div class="dots">${S.st.read.map((_,i)=>`<i class="${i===S.ri?"on":""}"></i>`).join("")}</div>
    </article>`;
  speak(readSpeech(c));
  window.scrollTo(0,0);
}

/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, pct = k/n*100, side = isJ() ? "right" : "left";
  const flags = S.games.map((_,i)=> i>=k ? `<span class="fl" style="${side}:${(i+.5)/n*100}%;${isJ()?"transform:translate(50%,-50%)":""}">🚩</span>` : "").join("");
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="walk" style="width:${pct}%"></span>${flags}
    <span class="boot" style="${side}:${Math.max(5,pct)}%;${isJ()?"transform:translate(50%,-50%) scaleX(-1)":""}">🥾</span></div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  S.t0 = Date.now();
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div>${g.ar?`<div class="qar ar" lang="ar">${g.ar}</div>`:""}<div id="play"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
// salah: kira kesilapan, goncang, tunjuk petunjuk ringkas
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🦌 ${hint || L("Hmm, cuba lagi!","همم، چوبا لاڬي!")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(fast){
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${rara("yay")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p>${fast?`<span class="fast">⚡ ${L("Pantas macam pengakap!","ڤنتس مچم ڤڠاکڤ!")}</span>`:""}</div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Kamu pengakap feqah yang hebat.","چمرلڠ! کامو ڤڠاکڤ فقه يڠ هيبت."] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom main lagi.","شاباس کران منچوبا! جوم ماٴين لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${rara("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Lencana baharu untuk selempang kamu!","لنچان بهارو اونتوق سلمڤڠ کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🔥 ${L("Cabaran Unggun Api kini dibuka!","چابرن اوڠڬون اڤي کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">⛺ ${L("Kembali ke peta kem","کمبالي ک ڤتا کيم")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN (kem) ===================== */
const DIRS = [["U","ا",0],["T","ت",90],["S","س",180],["B","ب",270]];
const GAMES = {
  /* Kompas: pilih jawapan, jarum kompas berpusing ke arahnya */
  kompas(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    el.innerHTML = `<div class="rose" aria-hidden="true"><b class="n">${L("U","ا")}</b><b class="e">${L("T","ت")}</b><b class="s">${L("S","س")}</b><b class="w">${L("B","ب")}</b><span class="needle" id="ndl"></span></div>
      <div class="g1">${opts.map((o,i)=>`<button class="opt cmpo" data-i="${i}" data-ok="${o.ok?1:0}"><span class="dir">${L(DIRS[i][0],DIRS[i][1])}</span>${TX(o.x)}</button>`).join("")}</div>
      <div class="cnt">🧭 ${L("Tekan arah jawapan yang betul.","تکن اره جاوڤن يڠ بتول.")}</div>`;
    el.querySelectorAll(".cmpo").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return; const i = +b.dataset.i;
      $("#ndl").style.setProperty("--r", (DIRS[i][2] + 360*(S.miss+1)) + "deg"); sfx.click();
      if(opts[i].ok){ done = true; b.classList.add("right"); setTimeout(win, 550); }
      else { b.classList.add("wrong"); oops(b, L("Jarum tersasar! Baca soalan sekali lagi.","جاروم ترساسر! باچ سوالن سکالي لاڬي.")); }
    }));
  },

  /* Khemah: hantar setiap kad ke khemah kumpulannya */
  khemah(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let k = 0; const got = g.tents.map(()=>0);
    const COL = ["#2E8150","#3C6E9E","#C2702A"];
    const draw = () => {
      const it = g.items[order[k]];
      el.innerHTML = `<div class="kitem" id="kit" data-k="${order[k]}">${TX(it[0])}</div>
        <div class="tents" style="grid-template-columns:repeat(${g.tents.length},minmax(0,1fr))">${g.tents.map((t,i)=>`<button class="kt" data-c="${i}" style="--tc:${COL[i%3]}"><span class="tp">${t[0]}</span>${T(t[1])}<span class="kn">🃏 ${got[i]}</span></button>`).join("")}</div>
        <div class="cnt">⛺ ${k+1} / ${order.length}</div>`;
      speak(RU(it[0]));
      el.querySelectorAll(".kt").forEach(b => b.addEventListener("click", () => {
        if(k >= order.length) return;
        if(+b.dataset.c === g.items[order[k]][1]){
          sfx.tick(); got[+b.dataset.c]++; k++; clearHint();
          if(k < order.length) draw(); else { el.querySelector(".cnt").textContent = "✅"; win(); }
        } else oops($("#kit"), L("Bukan khemah itu. Lihat semula kad bacaan.","بوکن خيمه ايت. ليهت سمولا کد باچاءن."));
      }));
    };
    draw();
  },

  /* Unggun: pilih semua kayu api yang betul; kayu basah = salah */
  unggun(el, g){
    const opts = shuffle(g.items.map((x,i)=>({x:x[0], ok:x[1], i}))); const need = opts.filter(o=>o.ok).length; let k = 0;
    el.innerHTML = `<div class="pit" aria-hidden="true"><span class="fl" id="flm" style="--lv:0">🔥</span><span class="logs"></span></div>
      <div class="g2">${opts.map((o,i)=>`<button class="opt log" data-i="${i}" data-ok="${o.ok?1:0}">🪵 ${TX(o.x)}</button>`).join("")}</div>
      <div class="cnt" id="cnt">🔥 ${L(`Kayu api: 0 / ${need}`,`کايو اڤي: 0 / ${need}`)}</div>`;
    el.querySelectorAll(".log").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || b.classList.contains("wet") || k>=need) return;
      if(opts[+b.dataset.i].ok){
        k++; sfx.fire(); b.classList.add("done"); $("#flm").style.setProperty("--lv", k/need*4);
        $("#cnt").textContent = `🔥 ${L(`Kayu api: ${k} / ${need}`,`کايو اڤي: ${k} / ${need}`)}`;
        if(k===need) setTimeout(win, 450);
      } else { b.classList.add("wet"); oops(b, L("Kayu basah! Itu bukan jawapannya.","کايو باسه! ايت بوکن جاوڤنڽ.")); }
    }));
  },

  /* Simpul: pilih tali di lajur pertama, kemudian ikat dengan pasangannya */
  simpul(el, g){
    const n = g.pairs.length, left = mix(g.pairs.map((_,i)=>i)); let right; do{ right = shuffle(left); }while(n>1 && right.some((x,i)=>x===left[i]));
    let sel = null, k = 0;
    const cells = left.map((li,r)=>`<button class="opt rp sl" data-i="${li}">${TX(g.pairs[li][0])}</button><button class="opt rp sr" data-i="${right[r]}">${TX(g.pairs[right[r]][1])}</button>`).join("");
    el.innerHTML = `<div class="ropes">${cells}</div><div class="cnt">🪢 ${L("Tekan satu tali di lajur pertama, kemudian pasangannya.","تکن ساتو تالي د لاجور ڤرتام، کمودين ڤاسڠنڽ.")}</div>`;
    el.querySelectorAll(".sl").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      el.querySelectorAll(".sl.sel").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; sfx.click();
    }));
    el.querySelectorAll(".sr").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(sel===null){ toast(L("Pilih tali di lajur pertama dahulu 🪢","ڤيليه تالي د لاجور ڤرتام دهولو 🪢")); return; }
      if(+b.dataset.i===sel){
        const a = el.querySelector(`.sl[data-i="${sel}"]`); a.classList.remove("sel"); a.classList.add("done"); b.classList.add("done");
        sel = null; k++; sfx.tick(); clearHint(); if(k===n) setTimeout(win, 400);
      } else oops(b, L("Simpul terlerai! Itu bukan pasangannya.","سيمڤول ترلراي! ايت بوکن ڤاسڠنڽ."));
    }));
  },

  /* Peta: isi pos denai mengikut urutan */
  peta(el, g){
    const order = mix(g.steps.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="map" id="map">${g.steps.map((_,i)=>`<div class="cp" data-s="${i}"><i>${i+1}</i><span>${i===0?"🏁":"…"}</span></div>`).join("")}</div>
      <div class="g2">${order.map(i=>`<button class="opt pc" data-i="${i}">${TX(g.steps[i])}</button>`).join("")}</div>
      <div class="cnt">🗺️ ${L("Tekan kad untuk pos yang seterusnya.","تکن کد اونتوق ڤوس يڠ ستروسڽ.")}</div>`;
    el.querySelectorAll(".pc").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=g.steps.length) return;
      if(+b.dataset.i===k){
        const cp = el.querySelector(`.cp[data-s="${k}"]`); cp.classList.add("on"); cp.querySelector("span").innerHTML = TX(g.steps[k]);
        b.classList.add("used"); k++; sfx.tick(); clearHint();
        if(k===g.steps.length) setTimeout(win, 400);
      } else oops(b, L(`Bukan itu. Apakah langkah ke-${k+1}?`,`بوکن ايت. اڤاکه لڠکه ک-${k+1}؟`));
    }));
  },

  /* Semboyan: kibar bendera hijau (betul) atau merah (salah); bonus pantas */
  semboyan(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let k = 0, slip = 0; const t0 = Date.now();
    const draw = () => {
      const it = g.items[order[k]];
      el.innerHTML = `<div class="sbt" id="sbt" data-k="${order[k]}">${TX(it[0])}</div><div class="fuse" aria-hidden="true"><i style="--t:9s"></i></div>
        <div class="flags"><button class="flg" data-v="1"><span class="fi">🚩</span>✅ ${L("Betul","بتول")}</button><button class="flg" data-v="0"><span class="fi">🚩</span>❌ ${L("Salah","سالح")}</button></div>
        <div class="cnt">🚩 ${k+1} / ${order.length} • ⚡ ${L("Jawab pantas untuk bonus!","جواب ڤنتس اونتوق بونوس!")}</div>`;
      speak(RU(it[0]));
      el.querySelectorAll(".flg").forEach(b => b.addEventListener("click", () => {
        if(k >= order.length) return;
        if(+b.dataset.v === g.items[order[k]][1]){
          sfx.tick(); k++; clearHint();
          if(k < order.length) draw(); else win(!slip && Date.now()-t0 < order.length*9000);
        } else { slip++; oops($("#sbt"), g.items[order[k]][1] ? L("Kenyataan ini BETUL. Baca semula kad.","کڽاتاءن اين بتول. باچ سمولا کد.") : L("Kenyataan ini SALAH. Baca semula kad.","کڽاتاءن اين سالح. باچ سمولا کد.")); }
      }));
    };
    draw();
  },

  /* Ransel: putar roda nombor mangga, kemudian buka */
  ransel(el, g){
    const ans = String(g.n), w = ans.length; let d;
    do{ d = ans.split("").map(()=>Math.floor(Math.random()*10)); }while(d.join("")===ans);
    el.innerHTML = `<div class="padl" id="padl">${d.map((_,i)=>`<div class="wh"><button class="up" data-w="${i}" aria-label="${L("Naik","نايق")}">▲</button><span class="dg" data-w="${i}">${d[i]}</span><button class="dn" data-w="${i}" aria-label="${L("Turun","تورون")}">▼</button></div>`).join("")}</div>
      <div class="unit">🎒 … ${T(g.unit)}</div>
      <button class="btn go chk" data-x="chk">🔓 ${L("Buka mangga","بوک مڠڬ")}</button>`;
    const set = (i, v) => { d[i] = (v+10)%10; el.querySelector(`.dg[data-w="${i}"]`).textContent = d[i]; sfx.click(); };
    el.querySelectorAll(".up").forEach(b => b.addEventListener("click", () => set(+b.dataset.w, d[+b.dataset.w]+1)));
    el.querySelectorAll(".dn").forEach(b => b.addEventListener("click", () => set(+b.dataset.w, d[+b.dataset.w]-1)));
    let done = false;
    el.querySelector(".chk").addEventListener("click", () => {
      if(done) return; const v = +d.join("");
      if(v===g.n){ done = true; $("#padl").classList.add("open"); el.querySelector(".chk").textContent = "🔓 ✅"; setTimeout(win, 400); }
      else oops($("#padl"), v<g.n ? L("Belum terbuka. Nombornya lebih BESAR.","بلوم تربوک. نومبورڽ لبيه بسر.") : L("Belum terbuka. Nombornya lebih KECIL.","بلوم تربوک. نومبورڽ لبيه کچيل."));
    });
  },

  /* Lencana: lekat lencana perkataan pada tempat kosong mengikut urutan */
  lencana(el, g){
    const parts = T(g.s).split("___"), words = g.ans.concat(g.extra||[]), pool = mix(words.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="sent" id="sent">${parts.map((p,i)=> p + (i<parts.length-1 ? `<span class="blank ${i===0?"cur":""}" data-b="${i}">?</span>` : "")).join("")}</div>
      <div class="bdgs">${pool.map(i=>`<button class="bdg" data-i="${i}">🏅 ${T(words[i])}</button>`).join("")}</div>
      <div class="cnt">🏅 ${L("Tekan lencana untuk tempat kosong yang bercahaya.","تکن لنچان اونتوق تمڤت کوسوڠ يڠ برچهاي.")}</div>`;
    el.querySelectorAll(".bdg").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=g.ans.length) return;
      if(T(words[+b.dataset.i]) === T(g.ans[k])){
        const bl = el.querySelector(`.blank[data-b="${k}"]`); bl.textContent = T(g.ans[k]); bl.classList.remove("cur"); bl.classList.add("on");
        b.classList.add("used"); k++; sfx.tick(); clearHint();
        const nx = el.querySelector(`.blank[data-b="${k}"]`); if(nx) nx.classList.add("cur");
        if(k===g.ans.length) setTimeout(win, 450);
      } else oops(b, L("Lencana itu tidak sesuai di situ.","لنچان ايت تيدق سسواي د سيتو."));
    }));
  },

  /* Obor: suluh semak (tekan sekali), pilih jawapan (tekan lagi) */
  obor(el, g){
    const opts = shuffle(g.items.map(x=>({x:x[0], ok:x[1]}))); let done = false;
    el.innerHTML = `<div class="dark">${opts.map((o,i)=>`<button class="bush" data-i="${i}" data-ok="${o.ok?1:0}" aria-label="${L("Semak","سمق")} ${i+1}"><span>${TX(o.x)}</span></button>`).join("")}</div>
      <div class="cnt">🔦 ${L("Tekan sekali untuk menyuluh. Tekan lagi untuk memilih.","تکن سکالي اونتوق مڽولوه. تکن لاڬي اونتوق ممليه.")}</div>`;
    el.querySelectorAll(".bush").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      const o = opts[+b.dataset.i];
      if(!b.classList.contains("lit")){ b.classList.add("lit"); b.setAttribute("aria-label", isAr(o.x) ? "" : T(o.x)); sfx.pop(); speak(RU(o.x)); return; }
      if(o.ok){ done = true; b.classList.add("pick"); setTimeout(win, 400); }
      else { b.classList.add("wrong"); oops(b, L("Bukan yang itu. Suluh semak yang lain.","بوکن يڠ ايت. سولوه سمق يڠ لاءين.")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan khemah sebelumnya dahulu 🔒","سلسايکن خيمه سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} khemah untuk membuka Cabaran Unggun Api 🔥`,`سلسايکن سموا ${STATIONS.length} خيمه اونتوق ممبوک چابرن اوڠڬون اڤي 🔥`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa (selepas tukar tulisan/suara) tanpa mengulang bunyi/konfeti
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
