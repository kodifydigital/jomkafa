<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B1B5E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<title>Dimensi KAFA 4D • Zon Arked Tahun 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="../../assets/config.js"></script>
<script src="../../assets/auth.js"></script>
<script src="../../assets/access.js"></script>
<style>
:root{
  --bg:#ECF8EF; --surface:#FFFFFF; --ink:#132049; --muted:#56628C; --line:#CFE0F7;
  --gold:#FFC22E; --ok:#18A957; --bad:#E5484D;
  --w1:#0F7A4A; --w2:#0A3D2A; --wa:#FFC22E;
  --pattern:rgba(27,95,209,.08);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0A1430; --surface:#14214A; --ink:#EAF1FF; --muted:#A9B8E6; --line:#26386E; --pattern:rgba(150,190,255,.07); color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.4;
  background-image:radial-gradient(var(--pattern) 2px,transparent 2.5px);background-size:26px 26px;overscroll-behavior:none}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Baloo 2",serif;font-size:20px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding:10px 14px 40px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;line-height:1.5}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
.grp{display:flex;gap:6px;align-items:center}
.iconbtn,.langbtn{display:inline-grid;place-items:center;min-width:48px;height:48px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-size:22px;font-weight:800;text-decoration:none;color:var(--ink);padding:0 10px}
.langbtn{font-size:17px}
.card{background:var(--surface);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 22px;border:0;border-radius:20px;font-weight:800;font-size:21px;
  background:linear-gradient(180deg,#FFD84D,#FFB000);color:#3A2400;box-shadow:0 5px 0 #C27C00;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #C27C00}
.btn.alt{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);border:3px solid var(--line)}
.btn.go{background:linear-gradient(180deg,#3FE08A,#14A05A);color:#fff;box-shadow:0 5px 0 #0B6B3B;font-size:26px;min-height:68px;padding:6px 34px}
.btn.sm{min-height:44px;font-size:16px;padding:4px 14px}
/* papan tajuk */
.hero{position:relative;overflow:hidden;margin:10px 0 14px;border-radius:26px;padding:18px 18px 20px;color:#fff;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 34px,transparent 34px 68px),linear-gradient(165deg,#13A35C 0%,#0E7A4A 50%,#0A3D2A 100%);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hero h1{margin:0;padding-inline-end:64px;font-size:34px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{margin:6px 0 0;font-size:17px;opacity:.95;max-width:78%}
.hero .flag{position:absolute;inset-inline-end:10px;top:6px;font-size:64px;transform:rotate(-8deg)}
.hero .road{position:absolute;left:0;right:0;bottom:0;height:8px;background:#fff;opacity:.8}
.hero .lights{position:absolute;top:0;inset-inline-start:46%;font-size:22px;letter-spacing:10px;opacity:.9}
.hero .stars{display:inline-block;margin-top:8px;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 12px;font-weight:800}
.sec{font-weight:800;font-size:20px;margin:16px 4px 8px}
/* kad dunia */
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wcard{position:relative;min-width:0;min-height:150px;border:0;border-radius:24px;padding:12px;text-align:start;color:#fff;overflow:hidden;
  background:linear-gradient(165deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;justify-content:flex-end}
.wcard:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.wcard .m{position:absolute;top:6px;inset-inline-end:8px;font-size:54px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.wcard .deco{position:absolute;top:10px;inset-inline-start:10px;font-size:22px;opacity:.85;letter-spacing:2px}
.wcard b{font-size:19px;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.3)}
html[dir="rtl"] .wcard b{font-size:18px;line-height:1.5}
.wcard small{font-weight:700;opacity:.95;font-size:14px}
.wcard.mix{grid-column:1/-1;min-height:110px}
/* kad kenderaan */
.vgrid{display:grid;gap:12px}
.vcard{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:12px;border:0;border-radius:24px;padding:12px 14px;text-align:start;
  background:var(--surface);box-shadow:0 6px 0 var(--line);min-height:104px;border:3px solid transparent}
.vcard:active{transform:translateY(3px)}
.vcard .ve{font-size:58px;line-height:1;display:grid;place-items:center;height:80px;border-radius:20px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.vcard b{display:block;font-size:22px;line-height:1.15}
.vcard small{color:var(--muted);font-weight:600;font-size:15px;display:block}
.vcard .best{font-weight:800;color:var(--w1);font-size:16px;white-space:nowrap}
.vcard .play{font-size:30px}
.whead{display:flex;align-items:center;gap:12px;border-radius:24px;padding:14px;color:#fff;background:linear-gradient(160deg,var(--w1),var(--w2));margin:10px 0 6px}
.whead .m{font-size:60px;line-height:1}
.whead h1{margin:0;font-size:26px;line-height:1.15}
.whead p{margin:2px 0 0;font-size:15px;opacity:.95}
/* skrin pengenalan */
.intro{text-align:center;padding:18px}
.intro .big{font-size:84px;line-height:1.1}
.intro h2{margin:6px 0;font-size:28px}
.how{list-style:none;padding:0;margin:12px 0 18px;display:grid;gap:8px;text-align:start}
.how li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:8px 12px;font-weight:700;font-size:17px}
.how li span{font-size:30px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:80;max-width:92vw;text-align:center}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.rain span{position:absolute;top:-50px;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
/* ---------- skrin permainan sukan ---------- */
.game{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.field{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--w1),var(--w2))}
.field canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:6px;right:6px;display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(10,18,50,.62);color:#fff;border-radius:16px;padding:2px 10px;font-weight:800;font-size:19px;min-height:44px;white-space:nowrap}
.chip.rd{background:linear-gradient(180deg,#FFD84D,#FFB000);color:#3A2400}
.chip.combo{background:linear-gradient(180deg,#FF7A3D,#E5322D)}
.chip.combo[hidden]{display:none}
.chip.par{background:linear-gradient(180deg,#3FE08A,#14A05A)}
.chip.par[hidden]{display:none}
.hud .sp{flex:1}
.hud .iconbtn{border:0;background:rgba(10,18,50,.62);color:#fff;height:44px;min-width:44px}
.prompt{position:absolute;left:8px;right:8px;top:calc(58px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.95);color:#132049;border-radius:20px;padding:6px 8px 6px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25);border:3px solid var(--wa)}
.prompt .q{flex:1;font-weight:800;font-size:21px;line-height:1.2;min-width:0}
html[dir="rtl"] .prompt .q{font-size:22px;line-height:1.6}
.prompt .say{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:var(--w1);color:#fff;font-size:24px}
.prompt.pop{animation:ppop .45s ease-out}
.prompt[hidden]{display:none}
@keyframes ppop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05)}100%{transform:none}}
/* sasaran boleh diketik (diletak di atas kanvas mengikut unjuran) */
.tg{position:absolute;z-index:4;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:0;background:transparent;padding:0}
.tg.sel{box-shadow:0 0 0 4px var(--tc),0 0 18px 6px rgba(255,255,255,.7)}
/* kawalan bawah */
.ctl{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:0 10px;z-index:6;pointer-events:none}
.ctl button{pointer-events:auto;touch-action:none}
.ctl .side{width:72px;height:72px;border-radius:24px;border:4px solid rgba(255,255,255,.9);background:rgba(10,18,50,.5);color:#fff;font-size:34px;font-weight:800}
.ctl .side:active{background:var(--wa);color:#3A2400}
.ctl .pw{width:112px;height:112px;border-radius:50%;border:6px solid #fff;font-size:44px;font-weight:800;color:#3A2400;
  background:conic-gradient(#FF5A3D calc(var(--p,0)*1turn),#FFD84D 0);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.ctl .pw.on{transform:scale(1.06)}
.ctl .pw:disabled{filter:grayscale(.8);opacity:.6}
.meter{position:absolute;inset-inline-end:10px;bottom:calc(140px + env(safe-area-inset-bottom,0px));width:26px;height:150px;border-radius:14px;border:3px solid #fff;background:rgba(10,18,50,.55);z-index:6;overflow:hidden;pointer-events:none}
.meter i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0)*100%);background:linear-gradient(0deg,#3FE08A,#FFD84D,#FF5A3D)}
.meter b{position:absolute;left:0;right:0;border:2px dashed #fff;background:rgba(255,255,255,.35);bottom:calc(var(--z0,0)*100%);height:calc((var(--z1,0) - var(--z0,0))*100%)}
.curve{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:6px;background:rgba(10,18,50,.6);color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}
.curve input{width:130px;accent-color:var(--wa)}
.cd{position:absolute;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none;font-size:140px;font-weight:800;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.cd span{animation:cdz .8s ease-out}
@keyframes cdz{from{transform:scale(2.2);opacity:0}}
.fxtxt{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:7;font-size:44px;font-weight:800;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 4px 0 rgba(0,0,0,.35);animation:fxt 1.2s ease-out forwards}
.fxtxt.bad{color:#FFE3E3;font-size:34px}
.fxtxt.big{font-size:60px;color:#FFE066}
@keyframes fxt{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-110%);opacity:0}}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:6;background:rgba(255,255,255,.95);color:#132049;border-radius:16px;padding:4px 14px;font-weight:800;font-size:17px;border:3px solid var(--ok);max-width:90%;text-align:center;pointer-events:none}
.hint[hidden]{display:none}
.slow{position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(255,230,120,.55);opacity:0;transition:opacity .2s}
.slow.on{opacity:1}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ovl{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(5,10,35,.55);padding:16px}
.ovl .card{text-align:center;width:min(380px,100%)}
.ovl .card .btn{width:100%;margin-top:10px}
/* mod rata (tiada WebGL) */
.flat{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky1,#8FD3FF) 0 20%,var(--gnd,#7CC66B) 20%)}
.flat .lane{position:absolute;left:0;right:0;top:20%;bottom:0;background:var(--lane,transparent);clip-path:polygon(40% 0,60% 0,95% 100%,5% 100%)}
.flat .ft{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.flat .ft .bd{background:#fff;color:#132049;border-radius:12px;border:4px solid var(--tc);text-align:center;font-weight:800;font-size:15px;padding:2px 6px;max-width:30vw;overflow-wrap:break-word}
.flat .ft .bd .e{display:block;font-size:24px;line-height:1.1}
.flat .ft .ic{font-size:34px;line-height:1}
.flat .ft.ok .bd{border-color:#18A957;background:#D8F8E4}
.flat .ft.no .bd{border-color:#E5484D;background:#FFE3E3}
.flat .ball{position:absolute;font-size:34px;transform:translate(-50%,-50%);line-height:1;pointer-events:none}
.flat .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;opacity:.85}
.flat .obs{position:absolute;transform:translate(-50%,-50%);font-size:28px;pointer-events:none}
.flat .coach{position:absolute;left:6%;bottom:24%;font-size:46px}
/* keputusan */
.res{text-align:center}
.res .place{font-size:76px;line-height:1}
.res h2{margin:4px 0;font-size:30px}
.res .stars{font-size:52px;letter-spacing:6px;margin:4px 0}
.res .stars .off{filter:grayscale(1);opacity:.3}
.res .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.res .nums div{background:var(--bg);border-radius:16px;padding:6px 4px;font-weight:700;font-size:14px}
.res .nums b{display:block;font-size:26px;color:var(--w1)}
.res .acts{display:grid;gap:10px;margin-top:12px}
.newbest{display:inline-block;background:var(--gold);color:#3A2400;border-radius:999px;padding:2px 14px;font-weight:800;animation:ppop .6s}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin:12px 0 6px}
.podium:empty{display:none}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pd .md{font-size:34px;line-height:1}
.pd .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;margin-top:2px}
.pd .sc{font-weight:800;color:var(--w1);font-size:18px}
.pd .step{display:grid;place-items:center;width:100%;margin-top:4px;border-radius:14px 14px 4px 4px;color:#fff;font-size:26px;font-weight:800;background:linear-gradient(180deg,var(--w1),var(--w2))}
.pd.p1 .step{height:96px;background:linear-gradient(180deg,#F5C542,#C9952B)}
.pd.p2 .step{height:70px;background:linear-gradient(180deg,#C9D3DE,#8E9AAB)}
.pd.p3 .step{height:52px;background:linear-gradient(180deg,#E3A06B,#A9663A)}
.pd.p1 .md{font-size:44px}
.pd.me .nm{color:var(--w1);text-decoration:underline}
/* ---------- papan pendahulu & akaun (dari Zon Arked T3) ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 0;padding:5px;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.tabs button{border:0;border-radius:13px;padding:8px 10px;font-weight:800;font-size:18px;background:none;color:var(--muted);min-height:48px}
.tabs button[aria-selected="true"]{background:var(--w1);color:#fff;box-shadow:0 3px 0 var(--w2)}
.acct{border:2px solid var(--wa);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;min-height:44px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{padding:12px}
.lbtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.lbtabs button{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px;min-height:40px}
.lbtabs button[aria-pressed="true"]{background:var(--w1);border-color:var(--w1);color:#fff}
.lbtabs.games button[aria-pressed="true"]{background:var(--wa);border-color:var(--wa);color:var(--w2)}
.lbrows{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.lbrows li{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:4px 12px;font-weight:700}
.lbrows li.top{background:color-mix(in srgb,var(--gold) 18%,var(--bg))}
.lbrows li.me{outline:3px solid var(--wa);outline-offset:-1px}
.lbrows .rk{font-size:20px;text-align:center}
.lbrows .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
html[dir="rtl"] .lbrows .nm{text-align:right}
.lbrows b{font-size:20px;color:var(--w1)}
.lbrows .kskel{height:1.05em}
.lbrows li.lbmsg{display:block;text-align:center;font-weight:600;color:var(--muted)}
.lbmsg{text-align:center;color:var(--muted);margin:8px 0}
.lbfoot{text-align:center;margin-top:8px}
.lbfoot p{margin:4px 0}
.lbfoot small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.lbres{margin-top:12px;border:2px solid var(--wa);border-radius:16px;padding:8px 12px;background:color-mix(in srgb,var(--wa) 10%,var(--surface))}
.lbres p{margin:4px 0}
.lbres .rank{font-size:20px;font-weight:800}
.lbres .rank b{font-size:28px;color:var(--w1)}
.sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(10,3,32,.6)}
.sheet .card{position:relative;width:min(460px,100%);max-height:90vh;overflow:auto}
.sheet h2{margin:0 40px 8px 0;font-size:24px}
html[dir="rtl"] .sheet h2{margin:0 0 8px 40px}
.sheet h3{margin:14px 0 4px;font-size:18px}
.sheet .x{position:absolute;top:10px;inset-inline-end:10px;width:38px;height:38px}
.sheet label{display:block;font-weight:700;font-size:15px;margin-top:10px}
.sheet .row{display:flex;gap:8px;margin-top:4px}
.sheet input{flex:1;min-width:0;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg);color:var(--ink)}
.sheet input:focus{outline:3px solid var(--wa);outline-offset:1px}
.sheet .cls{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sheet .cls li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 10px}
.sheet .cls li>span{flex:1 1 160px}
.sheet input:disabled{opacity:.7}
.sheet code{font-size:17px;font-weight:800;letter-spacing:2px;color:var(--w1)}
.sheet details{margin-top:12px}
.sheet summary{font-weight:700;cursor:pointer}
.sheet .muted{color:var(--muted)}
.sheet .err{color:var(--bad);font-weight:700;min-height:1.2em;margin:8px 0 0}
.hero .sub{display:inline-block;font-weight:800;font-size:15px;background:rgba(0,0,0,.22);border-radius:999px;padding:0 12px;margin-bottom:6px}
.prompt{flex-wrap:wrap}

const itKind = it => Array.isArray(it) ? "w" : it && it.huruf ? "h" : it && it.ar ? "ar" : "?";
const itKey = it => JSON.stringify(it);
const itText = it => { const k = itKind(it); return k==="w" ? L(it) : k==="h" ? it.huruf : k==="ar" ? it.ar : ""; };
const itEmoji = it => Array.isArray(it) && it[2] ? it[2] : "";
function itHTML(it){
  const k = itKind(it);
  if(k==="h") return `<span class="ar big" lang="ar" dir="rtl">${esc(it.huruf)}</span>`;
  if(k==="ar") return `<span class="ar" lang="ar" dir="rtl">${esc(it.ar)}</span>`;
  return `${it[2] ? `<span class="e">${it[2]}</span>` : ""}<span>${esc(L(it))}</span>`;
}
const itLog = it => { const k = itKind(it); return k==="w" ? [String(it[0]), String(it[1])] : k==="h" ? it.huruf : it.ar; };
function okEntry(q){ return q && Array.isArray(q.p) && q.p.length===2 && Array.isArray(q.ok) && q.ok.length && Array.isArray(q.no) && q.no.length>=1; }
function deck(s){
  const B = (typeof BANK!=="undefined" && BANK) || {};
  const from = s==="mix" ? REAL : [s];
  return from.flatMap(id=>(B[id]||[]).filter(okEntry).map(q=>({...q, sub:id})));
}
// 1 jawapan betul + 2 pengganggu, kedudukan rawak
function makeQ(q, n){
  const ok = pick(q.ok), okK = new Set(q.ok.map(itKey));
  let no = shuffle(q.no).filter(x=>!okK.has(itKey(x)));
  if(no.length < n-1){
    const extra = shuffle(deck(q.sub).flatMap(o=>o.no)).filter(x=>!okK.has(itKey(x)) && !no.some(y=>itKey(y)===itKey(x)) && itKind(x)===itKind(ok));
    no = no.concat(extra);
  }
  no = no.slice(0, n-1);
  while(no.length < n-1) no.push(["—","—","❔"]);
  const opts = shuffle([ok, ...no]);
  return {p:q.p, sub:q.sub, opts, ok:opts.indexOf(ok)};
}

  const a = AC(); if(!a) return;

    freqs.forEach((f,i)=>{ const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
      const s = t+i*dur; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol,s+0.015); g.gain.exponentialRampToValueAtTime(0.0001,s+dur);

}
let noiseBuf = null;
function noise(dur, f0, f1, vol, dest, type){
  const a = AC(); if(!a) return;
  try{ if(!noiseBuf){ const n = a.sampleRate; noiseBuf = a.createBuffer(1, n, n); const d = noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1; }

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+dur*0.25); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f).connect(g).connect(dest||a.destination); s.start(t); s.stop(t+dur+0.05);

}

    let dx = (e.clientX - cx)/R, dy = (e.clientY - cy)/R; const m = Math.hypot(dx, dy); if(m>1){ dx /= m; dy /= m; }
    JOY.x = dx; JOY.y = -dy; JOY.on = true; if(knob) knob.style.transform = `translate(${dx*R*0.6}px,${dy*R*0.6}px)`; };

function gameTick(dt){

    G.cd -= dt; const c = Math.ceil(G.cd);
    if(c!==G.cdShown){ G.cdShown = c; if(c>0){ sfx.tick(); buzz("tap"); UI.count(c); } }

    if(G.view) G.view.frame(dt);

  if(G.phase==="done"){ if(G.view) G.view.frame(dt); return; }

    const seen = [...Array(m.rows)].map(()=>Array(m.cols).fill(false)), st = [[2, m.rows-1]]; seen[m.rows-1][2] = true;
    while(st.length){ const [c,r] = st[st.length-1];

    for(let k=0;k<2;k++){ const c = Math.floor(Math.random()*(m.cols-1)), r = Math.floor(Math.random()*(m.rows-2)); m.E[r][c] = false; } // dua gelung: lebih lapang

  layout(G){ let m = null; while(!m) m = labGen(); G.mz = m; G.mb = {x:m.start.x, z:m.start.z, vx:0, vz:0, sink:0, fall:0, roll:0}; G.cp = {x:m.start.x, z:m.start.z}; G.tilt = {x:0, z:0}; G.flagged = false; G.wallT = 0; },

/* ============ PANAH SAKTI: bidik orang pertama, angin, busur ============ */
const PAN = {eye:1.6, r:1.0, hitR:1.2, grav:9.8, v0:24, v1:22, drawT:0.9};

// simulasi anak panah (sama seperti langkah sebenar) hingga satah sasaran zT
function panSim(G, yaw, pitch, sp, zT){
  const d = panDir(yaw, pitch), p = {x:0.25, y:PAN.eye-0.1, z:-0.5}, v = {x:d.x*sp, y:d.y*sp, z:d.z*sp}; let t = 0;

    if(pz > zT && p.z <= zT){ const f = (pz - zT)/(pz - p.z); return {x:p.x - v.x*H*(1-f), y:p.y - v.y*H*(1-f), t:t - H*(1-f)}; }
    if(p.y < -2) return null; }

}

  for(let it=0; it<6; it++){ const r = panSim(G, yaw, pitch, sp, T.z); if(!r) { pitch += 0.05; continue; }
    c = panTgt(T, G.pt + r.t); const D = -T.z; yaw += (c.x - r.x)/D; pitch += (c.y - r.y)/D; }
  return {yaw, pitch};

  auto(G, i){
    const ok = G.q.ok, P = G.pl, g = G.gm[0];
    G.wp = (i===ok && !g.got ? [[g.x, g.z]] : []).concat([[0, -9], [MIS.doorX[i], -12.2], [MIS.doorX[i], i===ok ? -16 : -16.8]]);
    if(P.z < -9) G.wp = G.wp.slice(G.wp.length-2);
  },
  autoCtl(G){
    const P = G.pl; if(!G.wp || !G.wp.length) return {x:0, y:0};
    const [tx_, tz_] = G.wp[0], dx = tx_-P.x, dz = tz_-P.z, d = Math.hypot(dx, dz);
    if(d < 0.45){ G.wp.shift(); return {x:0, y:0.3}; }
    let e = Math.atan2(dx, -dz) - P.yaw; while(e>Math.PI) e -= 2*Math.PI; while(e<-Math.PI) e += 2*Math.PI;
    return {x:clamp(e*2.5, -1, 1), y:Math.abs(e)<0.5 ? Math.min(1, 0.4 + d*0.5) : 0.1};
  },
  look(G, dx){ if(G.pl) G.pl.yaw += dx; },
  step(G, h){
    const P = G.pl; if(!P) return;
    if(G.phase!=="play"){ if(G.res && G.res.ok){ P.z -= 2.2*h; } return; }
    const v = G.autoGoal!=null ? MOD.misteri.autoCtl(G) : ctlVec();
    P.yaw += v.x*MIS.turn*h;
    const sp = v.y>0 ? v.y*MIS.walk : v.y*MIS.walk*0.55; P.sp = sp;
    const fx = Math.sin(P.yaw)*sp*h, fz = -Math.cos(P.yaw)*sp*h;
    let bumped = false;
    if(misIn(P.x+fx, P.z)) P.x += fx; else bumped = true;
    if(misIn(P.x, P.z+fz)) P.z += fz; else bumped = true;
    // bantuan: dekat dinding pintu → selaraskan ke tengah pintu terdekat
    if(P.z < -12.5 && sp>0.2 && Math.cos(P.yaw) > 0.75){ const dX = MIS.doorX.reduce((a,b)=>Math.abs(b-P.x)<Math.abs(a-P.x)?b:a); const nx = P.x + (dX-P.x)*Math.min(1, 1.6*h); if(misIn(nx, P.z)) P.x = nx; }
    if(bumped && Math.abs(sp)>0.5 && (G.bumpT = (G.bumpT||0) - h) <= 0){ G.bumpT = 0.4; buzz("wall"); S3.thud(P.x + Math.sin(P.yaw), 1, P.z - Math.cos(P.yaw)); }
    if(Math.abs(sp)>0.3){ P.bob += Math.abs(sp)*h*3.2; P.stepT -= h; if(P.stepT<=0){ P.stepT = 0.42; S3.step(P.x, 1.6, P.z); } }
    G.gm.forEach(g=>{ if(!g.got && Math.hypot(g.x-P.x, g.z-P.z) < 0.9){ g.got = true; G.rGems++; G.gems++; S3.chime(g.x, 1, g.z); sfx.gem(); buzz("gem"); UI.fx("💎 +1"); if(G.view && G.view.gem) G.view.gem(g); } });
    if(P.z < MIS.zPass){ const i = MIS.doorX.findIndex(x=>Math.abs(x-P.x) < 1.05); if(i<0) return;
      if(i===G.q.ok){ S3.humOff(); buzz("door"); const bonus = (G.rGems>=2 ? 10 : 0) + (G.rT<14 && !G.rw ? 10 : 0); onHit(i, bonus, bonus>=20 ? "💎 "+tx("Penjelajah sempurna!","ڤنجلاجه سمڤورنا!") : null); }
      else if(!G.rw){ onWrong(i); if(G.autoGoal!=null) G.wp = [[MIS.doorX[i], -12.6], [MIS.doorX[G.q.ok], -12.2], [MIS.doorX[G.q.ok], -16]]; } }
  }
};

const texCache = new Map();
function itemTex(it, accent){
  const k = itKind(it), txt = itText(it), em = itEmoji(it), key = `${lang}|${itKey(it)}|${accent}`;
  if(texCache.has(key)) return texCache.get(key);
  const ar = k!=="w" || /[\u0600-\u06FF]/.test(txt);
  const fs = k==="h" ? 150 : k==="ar" ? 92 : ar ? 64 : 58;
  const font = `700 ${fs}px ${k!=="w" ? 'Amiri,"Noto Naskh Arabic",serif' : ar ? '"Noto Naskh Arabic",Amiri,serif' : '"Baloo 2","Trebuchet MS",sans-serif'}`;
  const c = document.createElement("canvas"), x = c.getContext("2d"); x.font = font;
  const maxW = 420, lines = []; let cur = "";
  for(const w of String(txt).split(" ")){ const t = cur ? cur+" "+w : w; if(x.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const lh = fs*(ar ? 1.45 : 1.15), emH = em ? 120 : 0, tw = Math.max(260, ...lines.map(l=>x.measureText(l).width));
  c.width = Math.ceil(tw + 60); c.height = Math.ceil(emH + lh*lines.length + 36);
  const W_ = c.width, H_ = c.height, r = 40;
  x.beginPath(); x.moveTo(r,0); x.arcTo(W_,0,W_,H_,r); x.arcTo(W_,H_,0,H_,r); x.arcTo(0,H_,0,0,r); x.arcTo(0,0,W_,0,r); x.closePath();
  x.fillStyle = "#FFFFFF"; x.fill(); x.lineWidth = 14; x.strokeStyle = accent || "#FFC22E"; x.stroke();
  x.textAlign = "center"; x.textBaseline = "middle";
  if(em){ x.font = '100px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif'; x.fillText(em, W_/2, 18+emH/2); }
  x.font = font; x.direction = ar ? "rtl" : "ltr"; x.fillStyle = "#132049";
  lines.forEach((l,i)=>x.fillText(l, W_/2, 18 + emH + lh*(i+0.5) + fs*0.05));
  const res = {t:toPOT(c), a:W_/H_}; texCache.set(key, res); return res;
}

function makeWeather(scene, kind, box){
  const W_ = WX[kind] || WX.dust, n = Math.round(W_.n*(lowQ ? 0.4 : 1)), pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3] = box[0]+Math.random()*box[3]; pos[i*3+1] = box[1]+Math.random()*box[4]; pos[i*3+2] = box[2]+Math.random()*box[5]; }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({color:W_.c, size:W_.s*(kind==="rain" ? 1 : 1.6), transparent:true, opacity:kind==="rain" ? 0.65 : 0.85, depthWrite:false});
  const p = new THREE.Points(g, m); p.frustumCulled = false; scene.add(p);
  return {p, W:W_, box, n, pos};
}
function stepWeather(wx, dt, t){
  if(!wx || REDUCED) return; const {pos, W:W_, box, n} = wx;
  for(let i=0;i<n;i++){ const k = i*3;
    pos[k] += (W_.vx + (W_.sway ? Math.sin(t*1.3 + i)*W_.sway : 0))*dt; pos[k+1] += W_.vy*dt*(0.7 + (i%5)*0.12);
    if(pos[k+1] < box[1]) pos[k+1] += box[4]; if(pos[k+1] > box[1]+box[4]) pos[k+1] -= box[4];
    if(pos[k] < box[0]) pos[k] += box[3]; if(pos[k] > box[0]+box[3]) pos[k] -= box[3]; }
  wx.p.geometry.attributes.position.needsUpdate = true;
}

      if(gone) continue;
      for(const r of G.ast) if(Math.abs(l.z - r.z) < 0.7 && Math.abs(l.x - r.x) < r.r + 0.3){ gone = true;

  g.addColorStop(0, c); g.addColorStop(0.45, c + "88"); g.addColorStop(1, c + "00"); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(cv);
}

function akShip(scene, w){

// dunia: satah menegak z=0, y = 0 (bawah skrin) .. NJ.VH (atas skrin); x = 0 di tengah
const NJ = {VH:16, g:6, r:0.8, R:0.95, LH:1.9, y0:-1.3};
const NJ_T = [
  {e:"🍉", o:0x2F9E44, n:0xF2445A, s:[1.15,1,1.15]}, {e:"🍊", o:0xFF8A1E, n:0xFFC46B, s:[1,1,1]},
  {e:"🍎", o:0xD92B35, n:0xFFF0C9, s:[1,0.95,1]},     {e:"🥝", o:0x8A5A2B, n:0x8DCB3B, s:[0.92,1.05,0.92]},
  {e:"🍋", o:0xF5D320, n:0xFFF3A6, s:[1.2,0.9,0.9]},  {e:"🍑", o:0xFF9C7A, n:0xFFD2A0, s:[1,1,1]},
  {e:"🍈", o:0xA8CF5A, n:0xF5E9A8, s:[1,1,1]} ];

const njWd = (G, px, py) => ({x:(px - (G.W||360)/2)/njS(G), y:((G.H||640) - py)/njS(G)});

function njPS(px, py, ax, ay, bx, by){ const dx = bx-ax, dy = by-ay, l = dx*dx + dy*dy; const t = l ? clamp(((px-ax)*dx + (py-ay)*dy)/l, 0, 1) : 0;

function njDist(F, ax, ay, bx, by){
  const cx = F.x, cy = F.y, dx = F.x, dy = F.y + (F.i>=0 ? NJ.LH : 0);
  if(F.i>=0 && njCross(ax,ay,bx,by,cx,cy,dx,dy)) return {d:0, t:njPS(cx,cy,ax,ay,bx,by).t};

  try{ S3.thud(F.x, F.y, 0); }catch(e){}
}
function njAnswer(G, F, multi){

  if(ok){ b = Math.abs(F.vy) < 2.2 ? 20 : (multi || F.y > 4.5) ? 10 : 0; if(!REDUCED) G.slowT = 0.9;
    word = b>=20 ? "🥷 "+tx("Potong di puncak!","ڤوتوڠ د ڤونچق!") : multi ? "⚔️ "+tx("Kombo potong!","کومبو ڤوتوڠ!") : null; }

// leretan dari (ax,ay) ke (bx,by) dalam unit dunia
function njSwipe(G, ax, ay, bx, by){
  if(!playing() || !G.fr) return;
  const hits = [];
  G.fr.forEach(F=>{ if(F.st!=="fly" || F.y < -1) return; const r = njDist(F, ax, ay, bx, by); if(r.d < NJ.R) hits.push({F, t:r.t}); });
  hits.sort((p,q)=>p.t-q.t);
  const a = Math.atan2(by-ay, bx-ax);
  for(const h of hits){ if(!playing()) break; const F = h.F; njCut(G, F, a);
    if(F.i>=0) njAnswer(G, F, (G.swN||0) > 0);
    else { G.swN = (G.swN||0) + 1; UI.fx("💦 "+tx("Sedap!","سدڤ!")); } }
}

const NJD = NJ.VH/2/Math.tan(Math.PI/6);   // jarak kamera supaya satah z=0 = NJ.VH unit tinggi (sama dengan njPx)
function njFruit3D(scene){
  const hemi = geo("njhemi", ()=>new THREE.SphereGeometry(NJ.r, 18, 9, 0, Math.PI*2, 0, Math.PI/2));
  const cap = geo("njcap", ()=>new THREE.CircleGeometry(NJ.r*0.97, 18));
  const halves = [0,1].map(k=>{ const g = new THREE.Group(); scene.add(g);
    const sh = mk(hemi, M(0xFFFFFF), 0, 0, 0, g), cp = mk(cap, M(0xFFFFFF), 0, -0.002, 0, g); cp.rotation.x = Math.PI/2;
    if(k===1){ sh.rotation.x = Math.PI; cp.rotation.x = -Math.PI/2; cp.position.y = 0.002; }
    let stem = null, leaf = null;
    if(k===0){ stem = mk(CYL(0.05, 0.07, 0.32, 5), M(0x6B4423), 0, NJ.r + 0.1, 0, g); leaf = mk(CONE(0.16, 0.42, 4), M(0x3DA04A), 0.17, NJ.r + 0.14, 0, g); leaf.rotation.z = -1.1; leaf.scale.set(1, 1, 0.35); }
    return {g, sh, cp, stem, leaf}; });
  return {halves};
}

    const ground = mk(new THREE.PlaneGeometry(70, 70), M(w.night ? 0x3E7A4A : 0x6FBF4A), 0, -0.3, -6, scene); ground.rotation.x = -Math.PI/2;
    const B = G.board = new THREE.Group(); scene.add(B);
    mk(BOX(BW, 0.3, BD), M(0x9BE07A), 0, -0.15, 0, B);
    const dark = []; for(let r=0;r<UL.rows;r++) for(let c=0;c<UL.cols;c++) if((c+r)%2) dark.push(ulW(c, r));
    const ck = new THREE.InstancedMesh(BOX(UL.C, 0.02, UL.C), M(0x84CE62), dark.length), o = new THREE.Object3D();
    dark.forEach((p,k)=>{ o.position.set(p.x, 0.01, p.z); o.updateMatrix(); ck.setMatrixAt(k, o.matrix); }); B.add(ck);
    // pagar pokok renek + semak bulat di atasnya + bunga di luar pagar
    const hedge = M(0x2E7D32), HX = BW/2+0.3, HZ = BD/2+0.3;
    mk(BOX(0.6, 0.7, BD+1.2), hedge, -HX, 0.2, 0, B); mk(BOX(0.6, 0.7, BD+1.2), hedge, HX, 0.2, 0, B);
    mk(BOX(BW, 0.7, 0.6), hedge, 0, 0.2, -HZ, B); mk(BOX(BW, 0.7, 0.6), hedge, 0, 0.2, HZ, B);
    const bushP = []; for(let z=-HZ;z<=HZ+0.01;z+=1.1){ bushP.push([-HX,z],[HX,z]); } for(let x=-HX+1.1;x<HX-0.5;x+=1.1){ bushP.push([x,-HZ],[x,HZ]); }
    const bush = new THREE.InstancedMesh(SPH(0.42, 8, 6), M(0x3C9A3F), bushP.length);
    bushP.forEach(([x,z],k)=>{ o.position.set(x, 0.6, z); o.scale.setScalar(0.8+((k*7)%5)*0.08); o.updateMatrix(); bush.setMatrixAt(k, o.matrix); }); B.add(bush);
    const flP = []; for(let k=0;k<34;k++){ const side = k%4, t = ((k*37)%100)/100; const x = side<2 ? (side ? 1 : -1)*(HX+0.9+(k%3)*0.5) : (t-0.5)*(BW+2), z = side<2 ? (t-0.5)*(BD+2) : (side===2 ? -1 : 1)*(HZ+0.9+(k%3)*0.5); flP.push([x,z]); }
    const fl = new THREE.InstancedMesh(SPH(0.2, 6, 4), M(0xFFFFFF, {emissive:0x442244, emissiveIntensity:.2}), flP.length), FC = [0xFF6FA8,0xFFD84D,0xFF8A3D,0xC77DFF,0xFFFFFF];
    flP.forEach(([x,z],k)=>{ o.position.set(x, 0.05, z); o.scale.set(1, 0.6, 1); o.updateMatrix(); fl.setMatrixAt(k, o.matrix); if(fl.setColorAt) fl.setColorAt(k, new THREE.Color(FC[k%5])); });
    o.scale.set(1,1,1); B.add(fl);
    propRing(scene, w, [[-7,0.7,-6],[7,0.7,-6],[-7,0.7,0],[7,0.7,0],[-7,0.7,6],[7,0.7,6],[-3,0.9,-9],[3,0.9,-9]], 1.7);
    // ular: kepala (mata, lidah) + badan bulat
    const head = G.ulHead = new THREE.Group(); B.add(head);
    mk(SPH(0.46, 14, 10), M(0x46E07A, {flatShading:false, roughness:.4}), 0, 0, 0, head).scale.set(1, 0.85, 1.1);
    const eyeW = M(0xFFFFFF, {flatShading:false}), eyeB = M(0x111111, {flatShading:false});
    [-1,1].forEach(s=>{ mk(SPH(0.14, 10, 8), eyeW, s*0.19, 0.24, 0.26, head); mk(SPH(0.075, 8, 6), eyeB, s*0.2, 0.28, 0.37, head); });
    G.ulTongue = mk(BOX(0.07, 0.03, 0.34), M(0xFF3355), 0, -0.05, 0.55, head);
    G.ulSegs = []; for(let i=1;i<UL.cap;i++) G.ulSegs.push(mk(SPH(0.4, 12, 8), M(i%2 ? 0x2FA855 : 0x3FD16B, {flatShading:false, roughness:.45}), 0, 0, 0, B));
    G.ulStars = [0,1,2].map(()=>{ const s = emojiSprite("⭐", 0.5); s.visible = false; B.add(s); return s; });
    // buah jawapan: buah + daun + gelang tanah, label di atas
    G.ulFr = [0,1,2].map(i=>{ const g = new THREE.Group(); B.add(g);
      const f = mk(SPH(0.32, 12, 9), M(TCN[i], {flatShading:false, roughness:.3, emissive:TCN[i], emissiveIntensity:.25}), 0, 0.42, 0, g);
      mk(CONE(0.1, 0.24, 5), M(0x2E9D3F), 0.06, 0.34, 0, f).rotation.z = -0.5;
      const rg = mk(TOR(0.42, 0.05, Math.PI*2, 18), GLOW(TCN[i], .7), 0, 0.04, 0, g); rg.rotation.x = Math.PI/2;
      return {g, f, rg}; });
    G.labs = labelsFor(B); G.labs.forEach(s=>{ s.material.depthTest = false; });
    G.ulCoins = [0,1].map(()=>{ const c = mk(CYL(0.24, 0.24, 0.07, 14), M(0xFFC93D, {metalness:.6, roughness:.3, emissive:0xAA7700, emissiveIntensity:.3}), 0, 0.4, 0, B); c.rotation.x = Math.PI/2; return c; });
    G.ulBf = [0,1,2,3].map(k=>{ const s = emojiSprite("🦋", 0.7); s.position.set(rnd(-5,5), 1.5, rnd(-6,6)); scene.add(s); return {s, ph:k*1.7, x:rnd(-4,4), z:rnd(-5,5)}; });
    G.wx = makeWeather(scene, w.night ? "spark" : "leaf", [-12, -0.5, -18, 24, 12, 30]);
    G.ulCam = {x:0, z:0}; G.ulYaw = Math.PI;
    V3G.ular.round();
  },
  round(){
    if(!G.ulFr || !G.fr) return;
    G.fr.forEach((f,i)=>{ const p = ulW(f.c, f.r), F = G.ulFr[i]; F.g.position.set(p.x, 0, p.z); F.g.visible = !f.eaten; F.f.scale.setScalar(1);
      F.rg.material = GLOW(TCN[i], .7); G.labs[i].position.set(clamp(p.x, -2.9, 2.9), 0.95, p.z); G.labs[i].visible = !f.eaten; });
    G.coins.forEach((k,i)=>{ const p = ulW(k.c, k.r), c = G.ulCoins[i]; if(c){ c.position.set(p.x, 0.4, p.z); c.visible = !k.got; } });
    if(G.q) setLabels(G.labs, 1.5);
  },
  coin(k){ const p = ulW(k.c, k.r); burst(G.board.localToWorld(new THREE.Vector3(p.x, 0.5, p.z)), 0xFFC93D, 8, 2); S3.chime(p.x, 0, p.z); },
  dizzy(){ const p = ulW(G.sn.body[0][0], G.sn.body[0][1]); puff(new THREE.Vector3(p.x, 0.5, p.z), 0xFFFFFF); },
  poof(){ const p = ulW(4, 5); ring(new THREE.Vector3(p.x, 0.3, p.z), 0x7CF2FF); },
  hit(i, ok){
    const f = G.fr[i], p = new THREE.Vector3(ulW(f.c, f.r).x, 0.5, ulW(f.c, f.r).z);
    if(ok){ burst(p, TCN[i], 16, 3); burst(p, 0xFFD84D, 10, 2.4); ring(p, 0xFFD84D); }
    else { puff(p, 0x555555); G.ulFr[i].rg.material = GLOW(0x555555, .2); }
    G.labs[i].visible = false; G.ulFr[i].g.visible = false;
    const k = G.q.ok; if(k!==i){ G.labs[k].visible = true; G.ulFr[k].g.visible = true; }
    G.hintI = G.q.ok;
  },
  frame(dt, t){
    const sn = G.sn; if(!sn || !G.ulHead) return;
    const n = sn.body.length, P = [];
    for(let i=0;i<n;i++){ const s = ulSeg(G, i), w_ = ulW(s.c, s.r); P.push(w_); }
    // goyang badan (tegak lurus arah)
    const dz = sn.stun>0, happy = sn.eatT>0 || G.phase==="show";
    for(let i=0;i<n;i++){ const a = P[i], b = P[Math.min(n-1, i+1)], c0 = P[Math.max(0, i-1)];
      let dx = c0.x-b.x, dzz = c0.z-b.z; const l = Math.hypot(dx, dzz) || 1; dx /= l; dzz /= l;
      const wig = REDUCED ? 0 : Math.sin(t*(happy ? 14 : 9) - i*0.9)*(i ? 0.09 : 0.04);
      const y = (happy && !REDUCED ? Math.abs(Math.sin(t*10 - i*0.7))*0.12 : 0);
      if(i===0) G.ulHead.position.set(a.x - dzz*wig, 0.42+y, a.z + dx*wig);
      else { const m = G.ulSegs[i-1]; m.visible = true; m.position.set(a.x - dzz*wig, 0.36+y, a.z + dx*wig); m.scale.setScalar(Math.max(0.55, 1 - i*0.03)); } }
    for(let i=n-1;i<G.ulSegs.length;i++) G.ulSegs[i].visible = false;
    // kepala menghadap arah gerak
    const [ux, uz] = UD[sn.dir], ty = Math.atan2(ux, uz); let d = ty - G.ulYaw; d = Math.atan2(Math.sin(d), Math.cos(d));
    G.ulYaw += d*Math.min(1, dt*14); G.ulHead.rotation.y = G.ulYaw + (dz ? t*12 : 0);
    G.ulTongue.scale.z = REDUCED ? 1 : 0.3 + Math.max(0, Math.sin(t*6))*0.9;
    G.ulStars.forEach((s,k)=>{ s.visible = dz; if(dz){ const a = t*5 + k*2.09; s.position.set(G.ulHead.position.x + Math.cos(a)*0.55, 1.05, G.ulHead.position.z + Math.sin(a)*0.55); } });
    // buah melantun, syiling berputar, petunjuk bercahaya
    G.ulFr.forEach((F,i)=>{ const gl = G.hintI===i; F.f.position.y = 0.42 + Math.sin(t*3 + i*2)*0.1; F.f.rotation.y += dt*1.5;
      F.rg.scale.setScalar(gl ? 1 + Math.sin(t*7)*0.25 : 1); G.labs[i].position.y = 0.95 + Math.sin(t*3 + i*2)*0.1;
      G.labs[i].material.opacity = G.phase==="show" && G.res && i!==G.q.ok ? 0.35 : 1; });
    G.ulCoins.forEach(c=>{ c.rotation.z += dt*3; });
    G.ulBf.forEach(b=>{ b.s.position.set(b.x + Math.sin(t*0.5 + b.ph)*3, 1.4 + Math.sin(t*3 + b.ph)*0.4, b.z + Math.cos(t*0.4 + b.ph)*3); b.s.scale.x = 0.7*(0.6 + Math.abs(Math.sin(t*12 + b.ph))*0.4); });
    // kamera condong ikut kepala dengan lembut
    const h = G.ulHead.position, k = Math.min(1, dt*2.5);
    G.ulCam.x += (h.x*0.15 - G.ulCam.x)*k; G.ulCam.z += (h.z*0.55 - G.ulCam.z)*k;
    G.cam.position.set(G.ulCam.x, 15.5, G.ulCam.z + 8.2); G.cam.lookAt(G.ulCam.x, 0, G.ulCam.z - 0.4);
    G.earYaw = 0;
  }
};
// UJIAN: tekan butang D-pad sebenar mengikut laluan ke buah betul
MOD.ular.human = function(G, D, ev){
  const ri = G.ri, btn = d=>D.querySelector(`[data-ud="${UK[d]}"]`);
  for(let k=0;k<900 && G.phase==="play" && G.ri===ri;k++){
    const sn = G.sn;
    if(sn.stun<=0){
      const body = sn.mv ? [sn.nxt, ...sn.body.slice(0, sn.grow>0 ? sn.body.length : sn.body.length-1)] : sn.body;
      const d = ulDir(G, G.q.ok, body, sn.dir, sn.mv ? Math.max(0, sn.grow-1) : sn.grow), last = sn.q.length ? sn.q[sn.q.length-1] : sn.dir;
      if(d!=null && !sn.q.length && (d!==last || sn.wait)){ const b = btn(d), r = b.getBoundingClientRect(); ev(b, "pointerdown", r.left+5, r.top+5); ev(b, "pointerup", r.left+5, r.top+5); }
    }
    G.tick(0.05);
  }
  return !!(G.res && G.res.ok && G.ri===ri);
};

/* ============ PERISTIWA ============ */
function redraw(){
  if(screen==="map") renderMap();
  else if(screen==="world") openWorld(subj);
  else if(screen==="intro") openGame(gameId);
  else if(screen==="result" && G) UI.result(false);
  else if(screen==="play" && G){ UI.prompt(false); UI.hud(true); if(G.rw || (G.res && G.phase==="show" && !G.res.ok)) UI.hint(G.q.opts[G.q.ok]); }
}
const live = () => G && !G.over && !G.paused;
function setLang(l){ lang = l; save("kafa-lang", lang); applyLang(); texCache.clear(); redraw(); }
function pull(on){ if(G && MOD[G.gid] && MOD[G.gid].pull) MOD[G.gid].pull(G, on); }   // Space/Enter: busur (panah) atau tembak (permainan tambahan)
function handle(b, ev){
  const a = b.dataset.act;
  switch(a){
    case "lang": setLang(isJ() ? "rumi" : "jawi"); break;
    case "mute": muted = !muted; save("ark4-muted", muted); if(muted) S3.humOff(); b.textContent = muted ? "🔇" : "🔊"; break;
    case "voice": voiceOn = !voiceOn; save("t4-voice", voiceOn); if(!voiceOn) hush(); b.textContent = voiceOn ? "🗣️" : "🤐"; b.setAttribute("aria-pressed", voiceOn); break;
    case "home": renderMap(); break;
    case "world": if(screen==="map" && worldLocked(b.dataset.s) && ACC() && ACC().sheet){ ACC().sheet(AY, {msg:lockMsg()}); break; } openWorld(b.dataset.s || subj); break;
    case "game": openGame(b.dataset.g); break;
    case "ctl": ctlMode = b.dataset.m; save("ark4-ctl", ctlMode); if(ctlMode==="tilt") askMotion(); openGame(gameId); break;
    case "vib": vibOn = !vibOn; save("ark4-vib", vibOn); if(vibOn) buzz("hit"); openGame(gameId); break;
    case "lowq": lowQ = !lowQ; save("ark4-lowq", lowQ); openGame(gameId); break;
    case "calib": askMotion().then(()=>{ calibrate(); SENS.calibrated = true; buzz("tap"); toast("🎯 "+tx("Tengah ditetapkan!","تڠه دتتڤکن!")); }); break;
    case "recal": calibrate(); buzz("tap"); togglePause(false); break;
    case "start": askMotion().then(()=>start()); AC(); break;   // iOS: minta kebenaran gerak + buka audio daripada ketikan
    case "again": start(); break;
    case "pause": togglePause(); break;
    case "resume": togglePause(false); break;
    case "say": if(G && G.q) speak(G.q.p[0], true); if(G && G.q && itKind(G.q.opts[G.q.ok])==="h" && (G.res || G.rw)) sayHuruf(G.q.opts[G.q.ok].huruf); break;
    case "pw": if(live() && ev==="down") pull(true); break;
    case "login": if(!LB.clerk) KafaAuth.loading(true, tx("Membuka log masuk","ممبوک لوڬ ماسوق"), WORLD[subj||"mix"].m);
      LB.init().then(()=>{ KafaAuth.loading(false); if(LB.clerk) LB.clerk.openSignIn({}); else toast("⚠️ "+tx("Log masuk tidak dapat dimuatkan.","لوڬ ماسوق تيدق داڤت دمواتکن.")); }); break;
    case "acct": acctSheet(!LB.name()); break;
    case "sheetclose": document.querySelectorAll(".sheet").forEach(s=>s.remove()); break;
    case "logout": document.querySelectorAll(".sheet").forEach(s=>s.remove()); KafaAuth.signOut(tx("Log keluar","لوڬ کلوار"), WORLD[subj||"mix"].m); break;
    case "lbscope": LB.scope = b.dataset.c; save("ark4-lbscope", LB.scope); lbPaint(); break;
    case "lbgame": LB.game = b.dataset.g; save("ark4-lbgame", LB.game); lbPaint(); break;
    case "lbview": LB.game = b.dataset.g; LB.scope = "all"; openWorld(subj); { const s = $("lbsec"); if(s && s.scrollIntoView) s.scrollIntoView({behavior:"smooth"}); } break;
    case "lbname": case "lbjoin": case "lbcreate": case "lbleave": lbAct(a, b); break;
  }
}
const FAST = ["pw","pause"];
app.addEventListener("pointerdown", e=>{ const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(FAST.includes(b.dataset.act)){ e.preventDefault(); b.dataset.pd = "1"; handle(b, "down"); } });
app.addEventListener("click", e=>{ const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(FAST.includes(b.dataset.act) && b.dataset.pd){ delete b.dataset.pd; return; }
  if(b.dataset.act==="pw"){ if(live()){ pull(true); G.draw = 0.75; pull(false); } return; }   // klik papan kekunci: tembakan sederhana
  handle(b, "click"); });
const release = ()=>pull(false);
document.addEventListener("pointerup", release); document.addEventListener("pointercancel", release);
const KMAP = {ArrowLeft:"l", a:"l", A:"l", ArrowRight:"r", d:"r", D:"r", ArrowUp:"u", w:"u", W:"u", ArrowDown:"d", s:"d", S:"d"};
let spaceDown = false;
document.addEventListener("keydown", e=>{
  if(e.target.matches && e.target.matches("input:not([type=range])")){ if(e.key==="Enter" && e.target.matches(".sheet input")){ const b = e.target.parentElement.querySelector("button"); if(b) b.click(); } return; }
  if(!G || screen!=="play") return;
  const k = e.key;
  if(k==="p" || k==="P" || k==="Escape"){ togglePause(); e.preventDefault(); return; }
  if(KMAP[k]){ KEYS[KMAP[k]] = true; e.preventDefault(); return; }
  if((k===" " || k==="Enter") && live()){ e.preventDefault(); if(!spaceDown){ spaceDown = true; pull(true); } }
});
document.addEventListener("keyup", e=>{ if(KMAP[e.key]) KEYS[KMAP[e.key]] = false; if((e.key===" " || e.key==="Enter") && spaceDown){ spaceDown = false; release(); } });
window.addEventListener("blur", ()=>{ for(const k in KEYS) KEYS[k] = false; });
document.addEventListener("kafa-access", ()=>{ if(screen==="world") openWorld(subj); else if(screen==="map") renderMap(); });
window.addEventListener("popstate", ()=>{ if(screen!=="map") renderMap(); });

applyLang();
// ?shot=<subj>,<game>[,rumi|jawi]: buka terus, mula dan main sendiri (autopilot, kebanyakannya betul)
const SHOT = (()=>{ try{ return new URLSearchParams(location.search).get("shot"); }catch(e){ return null; } })();
function shot(spec){
  const [s, g, l] = String(spec).split(",");
  if(l==="rumi" || l==="jawi"){ lang = l; applyLang(); }
  openWorld(WORLD[s] ? s : "mix"); openGame(GM(g) ? g : "labirin");
  return Promise.resolve(start()).then(()=>{ if(G) G.auto = true; return G; });
}
window.shot = shot;
(()=>{ if(SHOT){ shot(SHOT); return; } const h = location.hash.replace("#",""); if(WORLD[h]) openWorld(h); else if(h==="papan" && subj) openWorld(subj); else renderMap(); })();
