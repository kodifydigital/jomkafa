<style>
/* ===== Bahasa Arab Tahun 4: "Lapangan Terbang Lughah" — terminal, papan berlepas, pasport ===== */
:root{
  --sky1:#5EB8FF; --sky2:#CFEBFF; --bg:#F3F7FC; --card:#FFFFFF; --ink:#0B2545; --muted:#4F6380; --line:#0B2545;
  --navy:#0B2545; --blue:#1E6FD9; --sign:#FFC20E; --sign2:#E0A800; --tarmac:#2E3A4B; --stamp:#D7263D; --teal:#13A89E;
  --board:#121A28; --boardtx:#FFD34D; --ok:#1E9E5A; --okbg:#DDF6E7; --bad:#E5383B; --badbg:#FFE3E3; --note:#FFF6D6;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0E1E3D; --sky2:#16294F; --bg:#0D1526; --card:#18233B; --ink:#EEF3FF; --muted:#AFC0DD; --line:#04080F;
    --board:#070B12; --note:#3A3112; --okbg:#143B28; --badbg:#4A1F22; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:700;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 380px,var(--bg) 820px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-size:19px;line-height:1.85}
h1,h2,h3,.rf{font-family:"Righteous","Nunito",sans-serif;font-weight:400;letter-spacing:.3px}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sign);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 70px;position:relative;z-index:1}
.ar,[lang="ar"]{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:700;line-height:1.9}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--sign);color:#0B2545;border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:900;box-shadow:0 4px 0 var(--line)}
.hero{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border:3px solid var(--line);border-radius:24px;padding:12px 14px;box-shadow:0 6px 0 var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,var(--sign) 0 26px,transparent 26px 44px);opacity:.9}
.hero h1{margin:0;font-size:26px;line-height:1.15;color:var(--sign)}
.hero p{margin:4px 0 8px;font-size:15px;color:#DCE8FF}
.pipo{width:96px;flex:0 0 96px;height:auto;display:block}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.sttl{margin:16px 4px 6px;font-weight:900;font-size:16px}
.stamps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;background:#7A1F2B;border:3px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 5px 0 var(--line)}
.stamps span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:50%;border:3px dashed rgba(255,255,255,.35);background:rgba(255,255,255,.06);filter:grayscale(1);opacity:.5}
.stamps span.got{filter:none;opacity:1;border:3px solid var(--sign);background:#FFF6D6;transform:rotate(-8deg)}
.board{margin-top:16px;background:var(--board);border:3px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 6px 0 var(--line)}
.bhd{display:flex;justify-content:space-between;color:var(--boardtx);font-family:"Righteous",sans-serif;font-size:14px;padding:2px 8px 8px;border-bottom:2px dashed #3A475C;margin-bottom:8px}
html[dir="rtl"] .bhd{font-family:"Noto Naskh Arabic",serif}
.gate{width:100%;display:grid;grid-template-columns:52px 40px minmax(0,1fr) auto;align-items:center;gap:8px;text-align:start;background:#1B2638;color:#F2F6FF;border:2px solid #2C3A52;border-radius:14px;padding:8px;margin:0 0 8px;min-height:64px}
.gate .gc{font-family:"Righteous",sans-serif;color:var(--boardtx);font-size:18px;text-align:center;background:#0B1220;border-radius:8px;padding:4px 0}
.gate .gi{font-size:28px;text-align:center}
.gate .gn{min-width:0;overflow-wrap:anywhere;font-size:16px;line-height:1.25}
.gate .gn small{display:block;color:#9FB2D2;font-size:12px;font-weight:700}
.gate .gs{font-size:12px;font-weight:900;padding:4px 8px;border-radius:8px;background:#2C3A52;color:#C9D6EE;white-space:nowrap}
.gate.now{border-color:var(--sign);box-shadow:0 0 0 3px rgba(255,194,14,.35)}
.gate.now .gs{background:var(--sign);color:#0B2545;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.gate.done .gs{background:#174A33;color:#9DF0C2}
.gate.lock{opacity:.6}
.gate.fin{background:linear-gradient(90deg,#3B2A05,#1B2638);border-color:var(--sign2)}
.gate .pp{position:absolute}
.runway{margin:14px 0 0;height:46px;border-radius:12px;background:var(--tarmac);border:3px solid var(--line);position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.runway::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 40px);opacity:.5}
.runway span{position:relative;background:var(--tarmac);padding:0 10px}
</style>
<style>
.shead{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.shead .bub{width:58px;height:58px;flex:0 0 58px;border-radius:16px;background:var(--c);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 0 var(--line)}
.shead h2{margin:0;font-size:22px;line-height:1.2}
.shead small{color:var(--muted);font-size:14px;display:block}
html[dir="rtl"] .shead h2{font-size:22px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line);border-top:12px solid var(--sc,var(--blue))}
.rpic{font-size:54px;text-align:center;line-height:1.2}
.rh{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;margin:6px 0 10px;font-size:21px}
.rtext{margin:0 0 10px;color:var(--muted);text-align:center}
.lines{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lines li{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column;align-items:stretch;animation:slide .35s ease both;animation-delay:calc(var(--i)*.05s)}
.lines .ar{font-size:24px;text-align:right}
.lines .mk{font-size:14px;color:var(--muted);text-align:start}
@keyframes slide{from{opacity:0;transform:translateY(8px)}}
.tip{display:flex;gap:8px;background:var(--note);border:2px dashed var(--line);border-radius:14px;padding:8px 12px;margin-top:12px;font-size:15px}
.ref{margin-top:12px;font-size:13px;color:var(--muted);text-align:center}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:56px;border-radius:16px;border:3px solid var(--line);background:var(--blue);color:#fff;font-weight:900;font-size:19px;box-shadow:0 5px 0 var(--line);padding:6px 12px;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--sign);color:#0B2545}
.btn.alt{background:var(--card);color:var(--ink)}
.btn[disabled]{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--blue);width:22px;border-radius:6px}
.say{border:2px solid var(--line);background:var(--sign);border-radius:12px;min-width:44px;height:44px;font-size:20px;flex:0 0 auto}
.prog{position:relative;height:34px;margin:0 4px 12px;border-radius:999px;background:var(--tarmac);border:3px solid var(--line)}
.prog .trail{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:linear-gradient(90deg,#64B5F6,#1E6FD9)}
.prog .wp{position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;opacity:.7}
.prog .jet{position:absolute;top:50%;font-size:22px;line-height:1;transform:translate(-50%,-50%)}
.q{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.q p{flex:1;margin:0;font-size:19px;font-weight:900}
.qar{font-size:28px;text-align:center;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:10px}
.hint{margin-top:12px;background:var(--badbg);border:2px solid var(--bad);border-radius:14px;padding:8px 12px;font-size:16px}
.cnt{text-align:center;color:var(--muted);font-size:15px;margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,37,69,.35);padding:0 10px 12px;display:flex;justify-content:center}
.fb .in{width:100%;max-width:620px;background:var(--okbg);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 -4px 0 var(--line);animation:up .3s ease both}
@keyframes up{from{transform:translateY(100%)}}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fb .pipo{width:70px;flex:0 0 70px}
.fb strong{font-size:22px;color:var(--ok);font-family:"Righteous",sans-serif;font-weight:400}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.fb p{margin:2px 0 0;font-size:15px;overflow-wrap:anywhere}
.res{text-align:center}
.res .pipo{width:130px;margin:0 auto}
.res .stars{font-size:54px;letter-spacing:6px;line-height:1.1}
.res .stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.res .stars .off{filter:grayscale(1);opacity:.25}
@keyframes pop{from{transform:scale(0)}}
.res h2{margin:4px 0;font-size:30px;color:var(--blue)}
.res p{margin:0 0 8px;color:var(--muted)}
.gotst{display:inline-flex;align-items:center;gap:10px;background:var(--note);border:3px dashed var(--stamp);border-radius:16px;padding:8px 16px;margin:6px 0 12px;color:var(--stamp);font-weight:900}
.gotst span{font-size:42px;animation:stampin .6s ease both}
@keyframes stampin{from{transform:scale(2.4) rotate(-30deg);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(380deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;z-index:60;max-width:92vw;text-align:center}
/* ---- permainan ---- */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{min-width:0;overflow-wrap:anywhere;min-height:60px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:17px;padding:6px 8px;box-shadow:0 4px 0 var(--line)}
.opt .ar{font-size:23px}
.opt.right,.right{background:var(--okbg)!important;border-color:var(--ok)!important}
.opt.wrong{background:var(--badbg)}
.opt.sel{background:var(--note);outline:4px solid var(--sign)}
.opt:disabled{opacity:.45}
.passport{background:#7A1F2B;color:#FFE9B0;border:3px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.passport .pg{flex:1;background:#FFF8E6;color:#0B2545;border-radius:10px;min-height:70px;padding:6px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.passport .pg .ar{font-size:28px}
.passport .seal{display:flex;flex-wrap:wrap;gap:2px;width:64px;justify-content:center}
.passport .seal i{font-style:normal;font-size:16px;opacity:.25}
.passport .seal i.on{opacity:1;color:var(--stamp)}
.belt{background:var(--tarmac);border:3px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;background-image:repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.08) 30px 34px)}
.bag{min-width:0;border:3px solid var(--line);border-radius:12px 12px 14px 14px;background:var(--sign);color:#0B2545;padding:4px 10px;font-size:22px;position:relative;margin-top:8px}
.bag::before{content:"";position:absolute;left:50%;top:-10px;width:22px;height:10px;margin-left:-11px;border:3px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0}
.bag.sel{background:#fff;outline:4px solid var(--blue)}
.carousels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.carousel{min-width:0;border:3px solid var(--line);border-radius:16px;background:var(--bg);padding:6px;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:4px}
.carousel b{font-size:15px;text-align:center;overflow-wrap:anywhere}
.carousel .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.carousel .in span{font-size:17px;background:var(--okbg);border-radius:8px;padding:0 6px}
</style>
<style>
.gatebox{background:var(--bg);border:3px dashed var(--line);border-radius:16px;min-height:70px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-start;direction:rtl;margin-bottom:12px}
.gatebox.long{flex-direction:column;align-items:stretch;direction:inherit}
.gatebox:empty::after{content:"🛂";opacity:.35;font-size:26px;margin:auto}
.gatebox span{background:var(--okbg);border:2px solid var(--ok);border-radius:10px;padding:0 8px;font-size:22px}
.gatebox.long span{font-size:19px;text-align:right}
.queue{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.queue.long{flex-direction:column;align-items:stretch}
.pax{min-width:0;overflow-wrap:anywhere;border:3px solid var(--line);border-radius:14px;background:var(--card);padding:4px 12px;box-shadow:0 4px 0 var(--line);font-size:22px}
.queue.long .pax{font-size:19px;text-align:right}
.pax.used{visibility:hidden}
.mkline{margin-top:10px;text-align:center;color:var(--muted);font-size:15px}
.tower{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.radio{display:flex;gap:8px;align-items:flex-start}
.radio .who{font-size:30px;flex:0 0 auto}

.radio .msg .ar{font-size:24px;display:block;text-align:right}

.replies{display:flex;flex-direction:column;gap:8px}
.replies .opt{text-align:center}

.fl{min-width:0;overflow-wrap:anywhere;min-height:58px;border-radius:10px;border:2px solid #2C3A52;background:#1B2638;color:var(--boardtx);font-size:15px;padding:4px 6px}

.lights i.on{background:var(--sign);box-shadow:0 0 10px var(--sign)}

.counter .seat{display:inline-block;font-family:"Righteous",sans-serif;font-size:28px;color:var(--sign);min-width:70px;border:2px dashed var(--sign);border-radius:10px;margin-top:4px}

<body>
<main class="wrap" id="app"></main>
<script>
/* ===================== KANDUNGAN: Bahasa Arab Tahun 4 (KPM KSSR, DBP 2019) =====================
   Nombor ms. = muka surat bercetak (fail pN.jpg = ms. N-12; Tamhid ms. أ–د = p9–p12). */
const ln = (a, r, j) => [a, [r, j]];
const ST1 = {
  id: 1, icon: "🛂", c: "#1E6FD9", sticker: "🎫", code: "A1",
  t: ["Daftar Masuk: Salam dan Bahasa Kelas", "دفتر ماسوق: سلام دان بهاس کلس"],

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const stripAr = t => String(t||"").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+[\s،؟.!…]*/g," ").replace(/…/g," ... ").replace(/[=←+/]/g," ").replace(/\(\s*\)/g," ").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || (!voiceOn && !force)) return;
  const s = stripAr(text); if(!s || !/[A-Za-z0-9]/.test(s)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

/* ---------- Bantuan paparan ---------- */
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function confetti(n=34){
  const box = document.createElement("div"); box.className="confetti"; box.setAttribute("aria-hidden","true");
  const em = ["⭐","✈️","🎫","🌟","☁️","🧳"];
  for(let i=0;i<n;i++){ const s=document.createElement("span"); s.textContent=em[i%em.length]; s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(2+Math.random()*2)+"s"; s.style.animationDelay=Math.random()*.8+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5000);
}
const langBtn = () => `<button class="ib" data-act="lang" aria-label="${L("Tukar ke tulisan Jawi","توکر ک توليسن رومي")}">${isJ()?"Rumi":'<span style="font-family:Noto Naskh Arabic">جاوي</span>'}</button>`;
const voiceBtn = () => `<button class="ib" data-act="voice" aria-label="${L("Suara","سوارا")}" aria-pressed="${voiceOn}">${voiceOn?"🔊":"🔇"}</button>`;
const sayBtn = txt => (ttsOK && stripAr(txt)) ? `<button class="say" data-say="${encodeURIComponent(txt)}" aria-label="${L("Dengar","دڠر")}">🔊</button>` : "";
const starRow = n => [1,2,3].map(i=>`<span style="${i<=n?"":"opacity:.25;filter:grayscale(1)"}">⭐</span>`).join("");
const unlocked = id => id===1 || (best[id-1]||0)>0;
const allDone = () => STATIONS.every(s => (best[s.id]||0)>0);

const head = () => `<div class="top"><button class="ib" data-act="map" aria-label="${L("Kembali ke terminal","کمبالي ک ترمينل")}">${BACK()}</button><span class="sp"></span>${voiceBtn()}${langBtn()}</div>

/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, pct = k/n*100, side = isJ() ? "right" : "left";
  const wps = S.games.map((_,i)=>`<span class="wp" style="${side}:calc(${(i+1)/n*100}% - 12px)"></span>`).join("");
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="trail" style="width:${pct}%"></span>${wps}
    <span class="jet" style="${side}:${Math.max(4,Math.min(96,pct))}%;${isJ()?"transform:translate(50%,-50%) scaleX(-1)":""}">✈️</span></div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${TX(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play" data-type="${g.type}"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
// salah: kira, goncang, petunjuk
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🐧 ${hint || L("Hmm, cuba lagi!","همم، چوبا لاڬي!")}</div>`; }
}
const clearHint = () => { const h = $("#hint"); if(h) h.innerHTML = ""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${pipo("bob")}<div><strong>${T(p)}</strong><p>${TX(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) try{ b.focus(); }catch(e){} }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res, fin = S.st.id==="final";
  const msg = stars===3 ? (fin ? ["Kamu Juruterbang Lughah! Semua pintu ditawan.","کامو جوروتربڠ لغة! سموا ڤينتو دتاون."] : ["Cemerlang! Penerbangan sempurna.","چمرلڠ! ڤنربڠن سمڤورنا."])
    : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom terbang lagi.","شاباس کران منچوبا! جوم تربڠ لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${pipo("bob")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Cop baharu dalam pasport kamu!","چوڤ بهارو دالم ڤسڤورت کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🏆 ${L("Penerbangan Juara kini dibuka!","ڤنربڠن جوارا کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🛬 ${L("Kembali ke terminal","کمبالي ک ترمينل")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Terbang lagi","تربڠ لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN ===================== */
const GAMES = {
  /* Cop pasport: pilih maksud / perkataan yang betul (4 pilihan, beberapa pusingan) */
  pasport(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.o.map((x,i)=>({x, ok:i===0})));
      el.innerHTML = `<div class="passport"><div class="seal" aria-label="${k}/${g.rounds.length}">${g.rounds.map((_,i)=>`<i class="${i<k?"on":""}">🛂</i>`).join("")}</div>
        <div class="pg">${r.ar?`<span class="ar" lang="ar">${r.ar}</span>`:`<b>${TX(r.t)}</b>`}</div></div>
        <div class="g2">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${OPT(o.x)}</button>`).join("")}</div>
        <div class="cnt">🛂 ${k+1} / ${g.rounds.length}</div>`;
      if(r.t) speak(RU(r.t));
      let done = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        if(b.dataset.ok==="1"){ done = true; sfx.stamp(); b.classList.add("right"); clearHint(); k++;
          setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 260); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Bukan yang itu. Lihat kad bacaan semula.","بوکن يڠ ايت. ليهت کد باچاٴن سمولا.")); }
      }));
    };
    draw();
  },

  /* Bagasi: tekan beg, kemudian tekan tali sawat yang betul */
  bagasi(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let sel = null, left = g.items.length;
    el.innerHTML = `<div class="belt" id="belt">${order.map(i=>`<button class="bag" data-i="${i}"><span class="ar" lang="ar">${g.items[i][0]}</span></button>`).join("")}</div>
      <div class="carousels">${g.bins.map((b,i)=>`<button class="carousel" data-b="${i}"><b>${TX(b)}</b><span class="in"></span></button>`).join("")}</div>
      <div class="cnt">🧳 ${L("Tekan beg, kemudian tekan tempatnya.","تکن بيڬ، کمودين تکن تمڤتڽ.")}</div>`;
    el.querySelectorAll(".bag").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".bag.sel").forEach(x=>x.classList.remove("sel"));
      sel = b; b.classList.add("sel"); sfx.tick();
    }));
    el.querySelectorAll(".carousel").forEach(c => c.addEventListener("click", () => {
      if(!sel){ toast(L("Pilih satu beg dahulu 🧳","ڤيليه ساتو بيڬ دهولو 🧳")); return; }
      const it = g.items[+sel.dataset.i];
      if(+c.dataset.b===it[1]){
        sfx.tick(); clearHint();
        c.querySelector(".in").insertAdjacentHTML("beforeend", `<span class="ar" lang="ar">${it[0]}</span>`);
        sel.remove(); sel = null;
        if(--left===0) setTimeout(win, 300);
      } else oops(c, L("Beg ini bukan untuk tali sawat itu.","بيڬ اين بوکن اونتوق تالي ساوت ايت."));
    }));
  },

  /* Pintu berlepas: tekan perkataan/ayat ikut urutan */
  boarding(el, g){
    let order, n = 0;
    do{ order = shuffle(g.seq.map((_,i)=>i)); n++; }while(order.every((x,i)=>g.seq[x]===g.seq[i]) && n<50);
    let k = 0; const lg = g.long ? "long" : "";
    el.innerHTML = `<div class="gatebox ${lg}" id="built" aria-live="polite"></div>
      <div class="queue ${lg}">${order.map(i=>`<button class="pax" data-v="${encodeURIComponent(g.seq[i])}"><span class="ar" lang="ar">${g.seq[i]}</span></button>`).join("")}</div>
      <div class="cnt">🎫 ${g.long ? L("Tekan ayat pertama dahulu.","تکن ايات ڤرتام دهولو.") : L("Mula dari kanan: tekan perkataan pertama.","مولا دري کانن: تکن ڤرکاتاٴن ڤرتام.")}</div><div id="mk"></div>`;
    el.querySelectorAll(".pax").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=g.seq.length) return;
      const v = decodeURIComponent(b.dataset.v);
      if(v===g.seq[k]){
        k++; sfx.tick(); clearHint(); b.classList.add("used");
        $("#built").insertAdjacentHTML("beforeend", `<span class="ar" lang="ar">${v}</span>`);
        if(k===g.seq.length){ $("#mk").innerHTML = `<div class="mkline">✈️ ${TX(g.mk)}</div>`; setTimeout(win, 450); }
      } else oops(b, g.long ? L("Bukan ayat itu. Apa yang berlaku dahulu?","بوکن ايات ايت. اڤ يڠ برلاکو دهولو؟") : L(`Bukan itu. Cari perkataan ke-${k+1}.`,`بوکن ايت. چاري ڤرکاتاٴن ک-${k+1}.`));
    }));
  },

  /* Menara kawalan: dialog radio, pilih balasan */
  menara(el, g){
    let k = 0; const log = [];
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.o.map((x,i)=>({x, ok:i===0})));
      el.innerHTML = `<div class="tower">${log.join("")}
        <div class="radio"><span class="who" aria-hidden="true">🗼</span><div class="msg"><span class="ar" lang="ar">${r.say}</span><small>${TX(r.mk)}</small></div></div></div>
        <div class="replies">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${AR(o.x)}</button>`).join("")}</div>
        <div class="cnt">📻 ${k+1} / ${g.rounds.length}</div>`;
      speak(RU(r.mk));
      let done = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        const o = opts[+b.dataset.i];
        if(o.ok){ done = true; sfx.tick(); clearHint(); k++;
          log.splice(0, log.length, `<div class="radio"><span class="who" aria-hidden="true">🗼</span><div class="msg"><span class="ar" lang="ar">${r.say}</span></div></div>`,
            `<div class="radio me"><span class="who" aria-hidden="true">🐧</span><div class="msg"><span class="ar" lang="ar">${o.x}</span></div></div>`);
          setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 260); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Balasan itu tidak sesuai. Baca maksud soalan.","بالسن ايت تيدق سسواي. باچ مقصود سوالن.")); }
      }));
    };
    draw();
  },

  /* Kaunter daftar masuk: baca nombor/bulan, tekan angka */
  kaunter(el, g){
    const rounds = shuffle(g.rounds); let k = 0;
    const pool = [...new Set(g.rounds.map(r=>r[0]).concat(g.extra||[]))];
    const draw = () => {
      const [num, word] = rounds[k];
      const keys = shuffle([num].concat(shuffle(pool.filter(x=>x!==num)).slice(0,5)));
      el.innerHTML = `<div class="counter"><span class="ar" lang="ar">${word}</span><span class="seat" id="seat">?</span></div>
        <div class="keypad" dir="ltr">${keys.map(x=>`<button class="opt" data-v="${x}" data-ok="${x===num?1:0}">${x}</button>`).join("")}</div>
        <div class="cnt">🎫 ${k+1} / ${rounds.length}</div>`;
      let done = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        if(+b.dataset.v===num){ done = true; sfx.ding(); clearHint(); b.classList.add("right"); $("#seat").textContent = num; k++;
          setTimeout(()=>{ if(k<rounds.length) draw(); else win(); }, 300); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Bukan nombor itu. Baca perkataan Arab itu sekali lagi.","بوکن نومبور ايت. باچ ڤرکاتاٴن عرب ايت سکالي لاڬي.")); }
      }));
    };
    draw();
  },

  /* Skrin ketibaan: padankan dua lajur (tekan satu kiri, satu kanan) */
  ketibaan(el, g){
    const L1 = shuffle(g.pairs.map((_,i)=>i)); let R1, n = 0, sel = null, left = g.pairs.length;
    do{ R1 = shuffle(L1); n++; }while(R1.every((x,i)=>x===L1[i]) && n<50); // lajur kanan tidak sebaris dengan kiri
    el.innerHTML = `<div class="flights"><div class="col">${L1.map(i=>`<button class="fl" data-s="l" data-i="${i}">${OPT(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="col">${R1.map(i=>`<button class="fl" data-s="r" data-i="${i}">${OPT(g.pairs[i][1])}</button>`).join("")}</div></div>
      <div class="cnt">🛬 ${L("Tekan satu penerbangan, kemudian pasangannya.","تکن ساتو ڤنربڠن، کمودين ڤاسڠنڽ.")}</div>`;
    el.querySelectorAll(".fl").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(!sel || sel.dataset.s===b.dataset.s){
        el.querySelectorAll(".fl.sel").forEach(x=>x.classList.remove("sel"));
        sel = b; b.classList.add("sel"); sfx.tick(); return;
      }
      if(sel.dataset.i===b.dataset.i){
        sfx.ding(); clearHint(); sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); sel = null;
        if(--left===0) setTimeout(win, 300);
      } else { const s = sel; sel.classList.remove("sel"); sel = null; oops(b, L("Bukan pasangan itu. Cuba lagi.","بوکن ڤاسڠن ايت. چوبا لاڬي.")); s.classList.remove("sel"); }
    }));
  },

  /* Imigresen: maksud betul? Lulus atau tahan */
  imigresen(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      const it = items[k];
      el.innerHTML = `<div class="scanner"><div class="scr" id="scan" data-ok="${it[3]}"><div class="em" aria-hidden="true">${it[0]}</div>
          <span class="ar" lang="ar">${it[1]}</span><span class="claim">= ${TX(it[2])}</span></div></div>
        <div class="verdict"><button class="opt ok" data-v="1">✅ ${L("Lulus","لولوس")}</button><button class="opt no" data-v="0">⛔ ${L("Tahan","تاهن")}</button></div>
        <div class="cnt" id="ic">🛂 ${k+1} / ${items.length}</div>`;
      speak(RU(it[2]));
      let done = false;
      el.querySelectorAll(".verdict .opt").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        if(+b.dataset.v===it[3]){
          done = true; sfx.stamp(); clearHint(); k++;
          const fix = it[4] ? `<div class="mkline">✔️ ${AR(it[1])} = <b>${TX(it[4])}</b></div>` : "";
          if(fix) $("#ic").insertAdjacentHTML("afterend", fix);
          setTimeout(()=>{ if(k<items.length) draw(); else win(); }, fix ? 900 : 300);
        } else oops(b, it[3] ? L("Maksud ini sebenarnya betul. Lulus!","مقصود اين سبنرڽ بتول. لولوس!") : L("Maksud ini salah. Tahan dokumen ini!","مقصود اين ساله. تاهن دوکومن اين!"));
      }));
    };
    draw();
  },

  /* Kastam: imbas X-ray, cari barang yang disebut */
  kastam(el, g){
    const grid = shuffle(g.items.map((_,i)=>i)), ask = shuffle(g.items.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="wanted" id="want" data-a="${ask[0]}">🔎 <span class="ar" lang="ar">${g.items[ask[0]][1]}</span></div>
      <div class="xray">${grid.map(i=>`<button class="xi" data-i="${i}" aria-label="${esc(g.labels?T(g.items[i][2]):L("Barang","بارڠ")+" "+(i+1))}"><span aria-hidden="true">${g.items[i][0]}</span>${g.labels?`<small>${T(g.items[i][2])}</small>`:"<small></small>"}</button>`).join("")}</div>
      <div class="cnt" id="kc">🧳 ${k+1} / ${ask.length}</div>`;
    el.querySelectorAll(".xi").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("found") || k>=ask.length) return;
      if(+b.dataset.i===ask[k]){
        sfx.ding(); clearHint(); b.classList.add("found"); b.querySelector("small").textContent = T(g.items[ask[k]][2]); k++;
        if(k<ask.length){ const w = $("#want"); w.dataset.a = ask[k]; w.innerHTML = `🔎 ${AR(g.items[ask[k]][1])}`; $("#kc").textContent = `🧳 ${k+1} / ${ask.length}`; }
        else setTimeout(win, 350);
      } else oops(b, L("Bukan barang itu. Baca perkataan Arab dengan teliti.","بوکن بارڠ ايت. باچ ڤرکاتاٴن عرب دڠن تليتي."));
    }));
  },

  /* Landasan: isi tempat kosong, nyalakan lampu landasan */
  landasan(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.o.map((x,i)=>({x, ok:i===0}))), parts = r.s.split("___");
      el.innerHTML = `<div class="lights">${g.rounds.map((_,i)=>`<i class="${i<k?"on":""}"></i>`).join("")}</div>
        <div class="strip">${r.em?`<div class="em" aria-hidden="true">${r.em}</div>`:""}<div class="s ar" lang="ar">${parts[0]}<span class="gap" id="gap">؟</span>${parts[1]||""}</div></div>
        <div class="mkline" style="margin:-4px 0 10px">💬 ${TX(r.mk)}</div>
        <div class="g3">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${AR(o.x)}</button>`).join("")}</div>`;
      speak(RU(r.mk));
      let done = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(done) return;
        const o = opts[+b.dataset.i];
        if(o.ok){ done = true; sfx.ding(); clearHint(); b.classList.add("right"); $("#gap").textContent = o.x; k++;
          setTimeout(()=>{ if(k<g.rounds.length) draw(); else win(); }, 380); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Perkataan itu tidak sesuai. Baca maksudnya.","ڤرکاتاٴن ايت تيدق سسواي. باچ مقصودڽ.")); }
      }));
    };
    draw();
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t4-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Pintu ini belum dibuka. Selesaikan pintu sebelumnya 🔒","ڤينتو اين بلوم دبوک. سلسايکن ڤينتو سبلومڽ 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} pintu untuk Penerbangan Juara 🏆`,`سلسايکن سموا ${STATIONS.length} ڤينتو اونتوق ڤنربڠن جوارا 🏆`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa selepas tukar tulisan/suara (tanpa ulang bunyi kemenangan)
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
