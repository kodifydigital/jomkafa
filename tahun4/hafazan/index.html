<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123A2B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Ekspedisi Hutan Hafiz • Hafazan Tahun 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Hafazan Tahun 4: "Ekspedisi Hutan Hafiz" — denai hutan hujan, kem setiap surah, Utan si orang utan ===== */
:root{
  --night:#0E2A20; --deep:#123A2B; --canopy:#1F5E3B; --moss:#4F8F3A; --lime:#B6D94C; --fern:#7CB342;
  --bark:#6B4226; --bark2:#A5733F; --amber:#F2A541; --raf:#C8402F; --raf2:#F07A5F; --utan:#D9662B; --mist:#E7F3DF;
  --bg:#F3F8EC; --card:#FFFDF6; --ink:#1D2A1F; --muted:#56664F; --line:#1D2A1F;
  --soil:#EFE2C8; --leaf:#E2F0D2; --ok:#2E8B3E; --okbg:#DDF3DC; --bad:#C8402F; --badbg:#FDE2DC; --note:#FFF3D6;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0B1F17; --card:#16301F; --ink:#EEF6E6; --muted:#A9C2A2; --line:#050F0A; --soil:#3B2E1C; --leaf:#1E3D27;
    --okbg:#1C4627; --badbg:#5A2620; --note:#3D3320; --mist:#1E3A2A; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{font-family:"Patrick Hand",system-ui,sans-serif;font-size:19px;color:var(--ink);
  background:radial-gradient(120% 60% at 50% 0,#2E7A4A 0,transparent 60%),linear-gradient(180deg,var(--deep) 0,var(--canopy) 380px,#16452F 900px,var(--night) 1600px) fixed;
  background-color:var(--night);min-height:100vh;-webkit-tap-highlight-color:transparent}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Patrick Hand",serif;font-size:17px;font-weight:600}
.ar{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400;line-height:2.15}
.wrap{max-width:460px;margin:0 auto;padding:10px 14px 44px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid var(--amber);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:12px 18px 12px 18px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;text-decoration:none;color:var(--ink);padding:0 12px;box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--card);border:3px solid var(--line);border-radius:12px 18px 12px 18px;padding:8px 12px;font-weight:700;white-space:nowrap}
.hero{display:flex;gap:10px;align-items:center;color:#fff;margin:4px 0 10px}
.hero h1{margin:0;font-size:30px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
html[dir=rtl] .hero h1{font-size:25px;line-height:1.5}
.hero p{margin:4px 0 0;font-size:17px;opacity:.95;line-height:1.35}
html[dir=rtl] .hero p{font-size:15px;line-height:1.7}
.utan{width:96px;height:96px;flex:0 0 auto;overflow:visible}
.swing{animation:swing 3s ease-in-out infinite;transform-origin:50% 0}
@keyframes swing{50%{transform:rotate(-5deg) translateY(-4px)}}
.yay{animation:yay .7s ease 2}
@keyframes yay{50%{transform:scale(1.15) rotate(6deg)}}
.vines{height:26px;margin:-10px -14px 4px;background:
  radial-gradient(circle at 10px 18px,var(--lime) 6px,transparent 7px) 0 0/46px 26px repeat-x,
  linear-gradient(90deg,transparent 0 21px,var(--fern) 21px 24px,transparent 24px) 0 0/46px 20px repeat-x;opacity:.9}
.sttl{color:#fff;margin:6px 2px;font-size:18px}
.stickers{display:flex;flex-wrap:wrap;gap:6px;background:rgba(14,42,32,.45);border:2px dashed var(--lime);border-radius:16px;padding:8px}
.stickers span{font-size:26px;width:38px;height:38px;display:grid;place-items:center;filter:grayscale(1) opacity(.35)}
.stickers span.got{filter:none;animation:yay .6s}
/* ---- peta: denai berliku dari pintu hutan ke puncak ---- */
.trail{position:relative;margin:14px 0 10px;padding:12px 0 18px;border-radius:26px;
  background:linear-gradient(180deg,rgba(182,217,76,.18),rgba(14,42,32,.35));border:3px solid rgba(182,217,76,.5);overflow:hidden}
.trail::before{content:"";position:absolute;left:50%;top:40px;bottom:40px;width:14px;margin-left:-7px;border-radius:7px;
  background:repeating-linear-gradient(180deg,var(--bark2) 0 18px,transparent 18px 30px);opacity:.85}
.gate,.summit{position:relative;text-align:center;color:#fff;font-size:18px;line-height:1.4;padding:4px 10px;z-index:1}
html[dir=rtl] .gate,html[dir=rtl] .summit{font-size:16px;line-height:1.8}
.row{display:flex;position:relative;z-index:1;margin:10px 0}
.row.l{justify-content:flex-start;padding-inline-start:8px}
.row.r{justify-content:flex-end;padding-inline-end:8px}
.node{position:relative;display:flex;align-items:center;gap:8px;width:78%;text-align:start;border:3px solid var(--line);
  background:var(--card);border-radius:20px 8px 20px 8px;padding:8px 10px;box-shadow:0 5px 0 var(--line)}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.node .tent{flex:0 0 auto;width:58px;height:58px;display:grid;place-items:center;font-size:28px;position:relative;
  background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:14px}
.node .num{position:absolute;top:-6px;inset-inline-end:-8px;background:var(--amber);color:#1D2A1F;border:2px solid var(--line);border-radius:50%;width:26px;height:26px;font-size:15px;display:grid;place-items:center;font-weight:700;z-index:2}
.node .nm{display:flex;flex-direction:column;min-width:0;font-weight:700;font-size:19px;line-height:1.2}
html[dir=rtl] .node .nm{font-size:17px;line-height:1.6}
.node .jn{font-weight:400;font-size:14px;color:var(--muted)}
.node .st{font-size:15px;margin-top:2px}
.node .st .off{filter:grayscale(1) opacity(.3)}
.node.lock{filter:grayscale(.85);opacity:.72}
.node.lock .tent::after{content:"🔒";position:absolute;font-size:18px;bottom:2px}
.node.now{outline:4px solid var(--lime);outline-offset:3px}
.node .here{position:absolute;inset-inline-end:-10px;top:-34px;width:56px;height:56px;pointer-events:none}
.node.final{width:86%;margin:0 auto;background:linear-gradient(135deg,var(--note),var(--card))}
.node.final .tent{clip-path:polygon(50% 0,100% 100%,0 100%);background:#7A8F99}
</style>
<style>
.shead{display:flex;align-items:center;gap:10px;color:#fff;margin:2px 0 8px}
.shead h2{margin:0;font-size:24px;line-height:1.15}
html[dir=rtl] .shead h2{font-size:21px;line-height:1.6}
.shead small{opacity:.9;font-size:15px}
.badge{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--c);border:3px solid #fff;display:grid;place-items:center;font-size:26px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px 10px 22px 10px;padding:14px;box-shadow:0 6px 0 var(--line);position:relative;border-top:10px solid var(--sc,var(--moss))}
.rpic{font-size:38px;text-align:center;line-height:1}
.rh{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;margin:6px 0 10px;font-size:22px;line-height:1.25}
html[dir=rtl] .rh{font-size:19px;line-height:1.7}
.say{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:var(--amber);font-size:18px;display:grid;place-items:center;padding:0}
.surah{background:var(--leaf);border:2px dashed var(--moss);border-radius:16px;padding:10px 12px;font-size:25px;text-align:justify;direction:rtl}
.surah .ar{line-height:2.3}
.bsm{display:block;text-align:center}
.mark{color:var(--raf);font-size:.8em;white-space:nowrap}
.ptg{display:grid;gap:8px;max-height:56vh;overflow:auto;padding:2px}
.pr{background:var(--leaf);border-radius:14px;padding:8px}
.wds{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center}
.wd{background:var(--card);border:2px solid var(--moss);border-radius:10px;padding:0 8px;font-size:22px;line-height:1.9}
.full{text-align:center;font-size:23px;margin-top:2px}
.mkl{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:56vh;overflow:auto}
.mkl li{background:var(--leaf);border-radius:14px;padding:8px 10px}
.mkl li>.ar{display:block;font-size:22px;text-align:center}
.mkl .m{display:flex;gap:8px;align-items:flex-start;font-size:17px;line-height:1.35}
html[dir=rtl] .mkl .m{font-size:16px;line-height:1.8}
.mkl .m b{flex:0 0 auto;background:var(--moss);color:#fff;border-radius:8px;min-width:30px;text-align:center}
.tip{display:flex;gap:10px;background:var(--note);border:2px solid var(--amber);border-radius:16px;padding:10px;margin-bottom:10px;line-height:1.4}
html[dir=rtl] .tip{line-height:1.9}
.tip>b{font-size:26px}
.tip ul{margin:4px 0;padding-inline-start:18px}
.tip.am{background:var(--okbg);border-color:var(--ok)}
.abox{background:var(--card);border:2px dashed var(--ok);border-radius:12px;padding:8px;margin-top:8px;font-size:16px}
.abox .ar{display:block;text-align:center;font-size:23px}
.abox small{display:block;text-align:center;color:var(--muted)}
.ref{margin:10px 0 4px;text-align:center;color:var(--muted);font-size:16px}
.navr{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;min-height:54px;border:3px solid var(--line);border-radius:16px 8px 16px 8px;background:var(--card);font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--line);padding:6px 12px;width:100%}
html[dir=rtl] .btn{font-size:17px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--lime);color:#1D2A1F}
.btn[disabled]{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--moss)}
/* progres: jejak tapak ke khemah */
.prog{position:relative;height:30px;border-radius:15px;background:rgba(0,0,0,.25);border:2px solid var(--lime);margin:0 0 10px;overflow:hidden}
.prog .fill{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(90deg,var(--moss) 0 14px,var(--fern) 14px 28px)}
.prog .end{position:absolute;inset-inline-end:6px;top:1px;font-size:20px}
.prog .ft{position:absolute;top:0;font-size:20px;transform:translateX(-50%)}
.q{display:flex;align-items:flex-start;gap:8px;font-weight:700;line-height:1.3}
html[dir=rtl] .q{line-height:1.8}
.q p{margin:0 0 8px;flex:1}
.hint{margin-top:10px;background:var(--badbg);border-radius:12px;padding:8px 10px;line-height:1.35}
.rnd{text-align:center;margin:4px 0 8px;color:var(--muted)}
.opts{display:grid;gap:8px}
.op{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:4px 10px;font-size:22px;min-height:56px;box-shadow:0 3px 0 var(--line);min-width:0;overflow-wrap:anywhere}
.op.right{background:var(--okbg);border-color:var(--ok)}
.wrong,.op.wrong{background:var(--badbg)!important}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cur{background:var(--leaf);border-radius:14px;padding:6px 10px;text-align:center;font-size:23px;margin-bottom:6px}
/* kanopi */
.bridge{position:relative;height:74px;margin:0 0 8px;display:flex;align-items:flex-end;gap:4px;padding:0 6px 6px;
  background:linear-gradient(180deg,transparent 60%,var(--bark) 60% 64%,transparent 64%)}
.bridge .pl{flex:1;height:14px;background:var(--bark2);border:2px solid var(--line);border-radius:4px}
.bridge .pl.on{background:var(--lime)}
.bridge .tr{font-size:30px;line-height:1}
.bridge .utan{position:absolute;bottom:14px;width:52px;height:52px;transition:inset-inline-start .4s}
/* tapak & buah */
.tline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl;background:var(--soil);border-radius:14px;padding:10px;min-height:64px}
.tslot{min-width:52px;height:46px;border:2px dashed var(--bark2);border-radius:23px;display:grid;place-items:center;font-size:20px;opacity:.6}
.tdone{background:var(--card);border:2px solid var(--bark);border-radius:12px;padding:0 8px;font-size:22px;line-height:1.9}
.stones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.stone{border:3px solid var(--line);background:#D8D2C2;color:#1D2A1F;border-radius:40% 55% 45% 50%;min-height:58px;font-size:23px;box-shadow:0 3px 0 var(--line);min-width:0;overflow-wrap:anywhere;padding:2px 6px}
.stone.used{visibility:hidden}
.ayl{background:var(--leaf);border-radius:14px;padding:8px 10px;font-size:24px;text-align:center}
.blank{display:inline-block;min-width:54px;border-bottom:3px dashed var(--raf);color:var(--muted)}
.blank.now{background:var(--note)}
.blank.full{border-bottom-color:var(--ok);color:var(--ink)}
.tree{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px;padding:10px;border-radius:50% 50% 18px 18px/30% 30% 18px 18px;background:radial-gradient(circle at 50% 30%,var(--fern),var(--canopy))}
.fruit{border:3px solid var(--line);background:var(--amber);color:#1D2A1F;border-radius:50% 50% 45% 45%;min-height:64px;font-size:22px;min-width:0;overflow-wrap:anywhere;padding:2px 6px}
.fruit i{font-style:normal;display:block;font-size:16px;line-height:1}
.fruit.gone{visibility:hidden}
</style>
<style>
/* rafflesia */
.raf{position:relative;width:min(300px,86vw);aspect-ratio:1;margin:0 auto 6px}
.raf .ctr{position:absolute;inset:24%;border-radius:50%;background:radial-gradient(circle,#5A1E16 0 30%,#8E2A1E 31%);border:3px solid var(--line);color:#FFF3D6;display:grid;place-items:center;text-align:center;padding:8px;font-size:15px;line-height:1.25;overflow:auto}
html[dir=rtl] .raf .ctr{font-size:13.5px;line-height:1.6}
.raf .pt{position:absolute;width:40%;height:40%;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 30% 30%,#F6D7C8 0 7%,transparent 8%),radial-gradient(circle at 65% 55%,#F6D7C8 0 8%,transparent 9%),var(--raf);border:3px solid var(--line)}
.petals{display:grid;gap:8px}
.petal{border:3px solid var(--line);background:var(--raf2);color:#2B0F0A;border-radius:24px 8px 24px 8px;font-size:22px;min-height:56px;padding:4px 10px;box-shadow:0 3px 0 var(--line);min-width:0;overflow-wrap:anywhere}
.petal.right{background:var(--okbg);color:var(--ink)}
/* terjun */
.falls{display:grid;gap:6px;position:relative;padding:8px;border-radius:18px;background:linear-gradient(180deg,#9FD8E8,#4FA9C7);border:3px solid var(--line)}
.drip{border:3px solid var(--line);background:rgba(255,255,255,.88);color:#1D2A1F;border-radius:16px;font-size:22px;min-height:52px;padding:2px 10px;min-width:0;overflow-wrap:anywhere}
.drip.used{opacity:.25;pointer-events:none}
.pool{margin-top:10px;border:3px solid var(--line);border-radius:12px 12px 40px 40px;background:linear-gradient(180deg,#5EC0D8,#2E7FA0);padding:8px;min-height:70px;display:grid;gap:4px}
.pool .in{background:rgba(255,255,255,.9);color:#1D2A1F;border-radius:12px;text-align:center;font-size:20px;padding:0 6px}
.pool .wait{border:2px dashed rgba(255,255,255,.7);border-radius:12px;height:34px}
/* akar */
.roots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.roots .col{display:grid;gap:8px;align-content:start}
.rk{border:3px solid var(--line);border-radius:14px;min-height:56px;font-size:21px;padding:2px 6px;min-width:0;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--line)}
.rk.h{background:var(--fern);color:#132}
.rk.t{background:var(--soil)}
.rk.sel{outline:4px solid var(--amber);outline-offset:1px}
.rk.done{background:var(--okbg);opacity:.55;pointer-events:none}
.joined{margin-top:10px;display:grid;gap:4px}
.joined div{background:var(--leaf);border-radius:12px;text-align:center;font-size:21px;padding:0 6px}
/* kompas */
.cmp{position:relative;width:220px;height:220px;margin:4px auto 8px;border-radius:50%;border:4px solid var(--line);background:radial-gradient(circle,var(--card) 0 58%,var(--bark2) 59% 63%,var(--soil) 64%)}
.cmp .needle{position:absolute;left:50%;top:50%;width:10px;height:90px;margin:-90px 0 0 -5px;transform-origin:50% 100%;background:linear-gradient(180deg,var(--raf) 0 50%,#556 50%);border-radius:5px;transition:transform .6s}
.cmp .dir{position:absolute;width:58px;height:58px;border-radius:50%;border:3px solid var(--line);background:var(--lime);font-size:24px;font-weight:700;color:#1D2A1F;padding:0}
.qar{background:var(--leaf);border-radius:14px;padding:6px 10px;text-align:center;font-size:23px}
/* khemah */
.kitems{display:grid;gap:8px}
.ki{border:3px solid var(--line);background:var(--card);border-radius:14px;font-size:21px;min-height:52px;padding:2px 8px;min-width:0;overflow-wrap:anywhere}
.ki.sel{outline:4px solid var(--amber)}
.ki.gone{display:none}
.tents{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tentb{border:3px solid var(--line);border-radius:60% 60% 10px 10px/40% 40% 10px 10px;background:linear-gradient(180deg,var(--amber),#D9822B);min-height:110px;padding:10px 6px;min-width:0;overflow-wrap:anywhere;color:#1D2A1F;box-shadow:0 4px 0 var(--line)}
.tentb:nth-child(2){background:linear-gradient(180deg,var(--fern),var(--moss))}
.tentb b{display:block;font-size:18px}
.tentb .in{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:4px}
.tentb .in span{background:rgba(255,255,255,.85);border-radius:8px;font-size:15px;padding:0 4px;line-height:1.8}
/* maklum balas, keputusan */
.fb{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));animation:up .3s}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{width:100%;max-width:460px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 -4px 0 var(--ok),0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fb .utan{width:64px;height:64px}
.fb strong{font-size:24px;color:var(--ok)}
.fb p{margin:2px 0 0;line-height:1.3}
html[dir=rtl] .fb p{line-height:1.8}
.res{text-align:center}
.res .utan{width:120px;height:120px}
.stars{font-size:46px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .5s backwards}
.stars .off{filter:grayscale(1) opacity(.3)}
@keyframes pop{from{transform:scale(0)}}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border-radius:14px;padding:8px;margin:8px 0}
.gotst span{font-size:40px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:40;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

function words(a){
  const out = []; let pre = "";

    if(HAS_LETTER.test(w)){ out.push(pre + w); pre = ""; }

  return out;
}

}

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

      el.querySelectorAll(".ki").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; sfx.tick();
    }));
    el.querySelectorAll(".tentb").forEach(b => b.addEventListener("click", () => {
      if(got >= g.items.length) return;
      if(sel===null){ toast(L("Tekan satu ayat dahulu ☝️","تکن ساتو ايات دهولو ☝️")); return; }
      const j = +b.dataset.j;
      if(g.items[sel][1] === j){
        el.querySelector(`.ki[data-i="${sel}"]`).classList.add("gone");
        el.querySelector("#in"+j).insertAdjacentHTML("beforeend", `<span class="ar" lang="ar">${words(g.items[sel][0]).slice(0,2).join(" ")}…</span>`);
        sel = null; got++; sfx.leaf(); clearHint(); if(got === g.items.length) setTimeout(win, 350);
      } else oops(b, L("Ayat itu dari surah lain. Cuba khemah sebelah!","ايات ايت دري سورة لاين. چوبا خيمه سبله!"));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan kem sebelumnya dahulu 🔒","سلسايکن کيم سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} kem untuk membuka Cabaran Puncak 🏆`,`سلسايکن سموا ${STATIONS.length} کيم اونتوق ممبوک چابرن ڤونچق 🏆`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.phase==="result" && S.res) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
