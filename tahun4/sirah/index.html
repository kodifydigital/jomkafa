<title>Muzium Sirah • Sirah Tahun 4</title>

<style>
:root{
  --wall:#6E1F2E; --wall2:#8E2F3F; --gold:#D9A441; --gold2:#F3D27A; --marble:#F7F0E1; --marble2:#EADFC8;
  --teal:#1F6F6B; --ink:#2B1E1A; --mut:#6B5A4E; --card:#FFFDF7; --ok:#2E8B57; --bad:#C0392B; --line:#CDB894;
  --r:18px; --sh:0 6px 0 rgba(60,30,20,.18), 0 10px 24px rgba(60,30,20,.12);
}
@media (prefers-color-scheme: dark){
  :root{ --marble:#211816; --marble2:#2C201C; --card:#30241F; --ink:#F6EBDD; --mut:#CDB9A6; --line:#5B4636; --sh:0 6px 0 rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.3); }
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ink); min-height:100vh;
  background:
    repeating-linear-gradient(90deg, transparent 0 58px, rgba(140,110,70,.07) 58px 60px),
    linear-gradient(180deg, var(--marble) 0%, var(--marble2) 100%);
  -webkit-tap-highlight-color:transparent;
}
[dir=rtl] body, [dir=rtl] button{ font-family:"Noto Naskh Arabic","Nunito",sans-serif; }
[dir=rtl] .card, [dir=rtl] .q p{ line-height:1.9; }
h1,h2,h3{ font-family:"Bree Serif",Georgia,serif; font-weight:400; margin:0; }
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{ font-family:"Noto Naskh Arabic","Bree Serif",serif; font-weight:700; }
.ar{ font-family:"Amiri","Noto Naskh Arabic",serif; direction:rtl; unicode-bidi:isolate; }
#app{ max-width:480px; margin:0 auto; padding:10px 14px 110px; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible,a:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.top{ display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:20; padding:8px 0; }
.sp{ flex:1; }
.ib{ min-width:48px; height:48px; border-radius:14px; border:2px solid var(--gold); background:var(--wall); color:#FFF3D6;
  display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; text-decoration:none; padding:0 10px; box-shadow:0 3px 0 #3E0F18; }
.pill{ background:var(--card); border:2px solid var(--gold); border-radius:999px; padding:8px 12px; font-weight:900; }
.hero{ display:flex; gap:12px; align-items:center; background:linear-gradient(135deg,var(--wall),var(--wall2)); color:#FFF3D6;
  border-radius:22px; padding:14px; border:3px solid var(--gold); box-shadow:var(--sh); position:relative; overflow:hidden; }
.hero:before{ content:""; position:absolute; inset:6px; border:1.5px dashed rgba(243,210,122,.55); border-radius:16px; pointer-events:none; }
.hero h1{ font-size:27px; color:var(--gold2); }
.hero p{ margin:4px 0 0; font-size:15px; font-weight:700; }
.ancil{ width:96px; height:96px; flex:0 0 auto; }
.ancil.sm{ width:58px; height:58px; }
.ancil.bob{ animation:bob 2.4s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(-5px); } }
.sttl{ font-weight:900; margin:16px 4px 6px; color:var(--mut); }
.stickers{ display:flex; flex-wrap:wrap; gap:6px; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:8px; }
.stickers span{ font-size:26px; width:42px; height:42px; display:grid; place-items:center; border-radius:10px; background:var(--marble2); filter:grayscale(1); opacity:.35; }
.stickers span.got{ filter:none; opacity:1; background:#FFF0C9; border:2px solid var(--gold); }
/* ---------- Pelan muzium (peta) ---------- */
.plan{ position:relative; margin-top:18px; padding:12px 0 6px; }
.plan:before{ content:""; position:absolute; top:0; bottom:0; left:50%; width:64px; transform:translateX(-50%);
  background:repeating-linear-gradient(0deg, #B98C5A 0 26px, #A77A49 26px 28px); border-radius:10px; opacity:.55; }
.plan:after{ content:""; position:absolute; top:0; bottom:0; left:50%; width:14px; transform:translateX(-50%); background:var(--wall); opacity:.7; border-radius:8px; }
.row{ position:relative; display:flex; margin:14px 0; z-index:1; }
.row.l{ justify-content:flex-start; } .row.r{ justify-content:flex-end; }
.node{ width:48%; min-height:150px; border:none; background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; }
.door{ position:relative; width:118px; height:112px; border-radius:60px 60px 8px 8px; background:linear-gradient(180deg,var(--c),#3E0F18);
  border:5px solid var(--gold); box-shadow:var(--sh); display:grid; place-items:center; }
.door:before{ content:""; position:absolute; inset:9px 12px 0; border-radius:50px 50px 0 0; border:2px solid rgba(255,240,200,.45); border-bottom:none; }
.door .tic{ font-size:40px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
.door .num{ position:absolute; top:-14px; left:50%; transform:translateX(-50%); background:var(--gold); color:#3E0F18; font-family:"Bree Serif",serif; font-size:16px;
  min-width:32px; height:28px; border-radius:8px; display:grid; place-items:center; border:2px solid #fff; z-index:2; }
.node .nm{ font-weight:900; font-size:15px; text-align:center; background:var(--card); border:2px solid var(--line); border-radius:10px; padding:4px 8px; line-height:1.3; max-width:100%; }
.node .st{ font-size:14px; min-height:18px; }
.node.lock .door{ filter:grayscale(.85) brightness(.85); }
.node.lock .door:after{ content:"🔒"; position:absolute; bottom:-8px; right:-8px; font-size:24px; }
.node.now .door{ animation:glow 1.6s ease-in-out infinite; }
@keyframes glow{ 50%{ box-shadow:0 0 0 7px rgba(217,164,65,.45), var(--sh); } }
.guide{ position:absolute; top:42px; width:58px; height:58px; z-index:3; }
.row.l .guide{ right:-48px; } .row.r .guide{ left:-48px; }
[dir=rtl] .row.l .guide{ right:auto; left:-48px; } [dir=rtl] .row.r .guide{ left:auto; right:-48px; }
.hall{ display:flex; justify-content:center; position:relative; z-index:1; }
.hall .node{ width:78%; }
.hall .door{ width:200px; height:126px; border-radius:100px 100px 10px 10px; background:linear-gradient(180deg,#C98A1E,#6E1F2E); }
.entry{ position:relative; z-index:1; text-align:center; margin:16px auto 0; width:max-content; max-width:100%; background:var(--wall); color:var(--gold2);
  border:3px solid var(--gold); border-radius:12px; padding:8px 16px; font-family:"Bree Serif",serif; }
[dir=rtl] .entry{ font-family:"Noto Naskh Arabic",serif; font-weight:700; }
</style>
<style>
.door .guide{ top:30px; }
.shead{ display:flex; gap:12px; align-items:center; margin:6px 0 12px; }
.badge{ width:56px; height:56px; border-radius:28px 28px 8px 8px; background:var(--c); border:3px solid var(--gold); display:grid; place-items:center; font-size:28px; flex:0 0 auto; }
.shead h2{ font-size:22px; color:var(--wall); }
@media (prefers-color-scheme: dark){ .shead h2{ color:var(--gold2); } }
.shead small{ color:var(--mut); font-weight:700; }
.card{ background:var(--card); border-radius:var(--r); padding:16px; box-shadow:var(--sh); border:3px solid var(--sc,var(--gold)); position:relative; }
.card.frame{ border:10px solid #B07A2E; outline:3px solid var(--gold2); outline-offset:-6px; }
.rpic{ font-size:54px; text-align:center; background:linear-gradient(180deg,#FFF6DD,#F1E2BC); border-radius:14px; padding:8px; border:2px solid var(--gold); }
@media (prefers-color-scheme: dark){ .rpic{ background:linear-gradient(180deg,#4A372A,#3A2B22); } }
.rh{ font-size:21px; margin:12px 0 6px; display:flex; gap:8px; align-items:center; justify-content:space-between; color:var(--wall); }
@media (prefers-color-scheme: dark){ .rh{ color:var(--gold2); } }
.rtext{ font-size:17px; line-height:1.55; margin:6px 0; font-weight:700; }
.rlist{ margin:6px 0; padding-inline-start:22px; font-size:16px; font-weight:700; line-height:1.5; }
.rlist li{ margin:4px 0; }
.tip{ display:flex; gap:8px; background:#FFF3D0; border:2px dashed var(--gold); border-radius:12px; padding:10px; margin:10px 0 0; font-size:15px; font-weight:700; }
.tip.am{ background:#E3F3EF; border-color:var(--teal); }
@media (prefers-color-scheme: dark){ .tip{ background:#4A3A20; } .tip.am{ background:#1D3D3A; } }
.ref{ margin-top:10px; font-size:13px; font-weight:800; color:var(--mut); }
.navr{ display:flex; gap:10px; margin-top:14px; }
.btn{ flex:1; min-height:54px; border-radius:14px; border:3px solid #3E0F18; background:var(--wall); color:#FFF3D6; font-weight:900; font-size:18px; box-shadow:0 4px 0 #3E0F18; padding:8px 12px; width:100%; }
.btn.go{ background:var(--teal); border-color:#0E3B39; box-shadow:0 4px 0 #0E3B39; }
.btn.alt{ background:var(--card); color:var(--ink); border-color:var(--line); box-shadow:0 4px 0 var(--line); }
.btn:disabled{ opacity:.4; }
.btn:active,.opt:active{ transform:translateY(2px); }
.dots{ display:flex; gap:6px; justify-content:center; margin-top:10px; }
.dots i{ width:10px; height:10px; border-radius:5px; background:var(--line); } .dots i.on{ background:var(--gold); width:24px; }
.say{ border:2px solid var(--gold); background:#FFF3D0; border-radius:12px; min-width:44px; height:44px; font-size:20px; flex:0 0 auto; }
/* ---------- Main ---------- */
.prog{ position:relative; height:26px; background:var(--card); border:2px solid var(--line); border-radius:13px; margin:0 0 12px; }
.prog .walk{ position:absolute; inset-block:0; inset-inline-start:0; background:linear-gradient(90deg,var(--gold),var(--gold2)); border-radius:11px; }
.prog .fl{ position:absolute; top:50%; transform:translate(-50%,-50%); font-size:14px; }
.prog .me{ position:absolute; top:50%; transform:translate(-50%,-50%); font-size:20px; }
.q{ display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
.q p{ margin:0; font-size:18px; font-weight:900; line-height:1.45; }
#play{ margin-top:12px; }
.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.col{ display:flex; flex-direction:column; gap:10px; }
.opt{ min-width:0; overflow-wrap:anywhere; min-height:56px; border-radius:14px; border:3px solid var(--line); background:var(--card); font-weight:800; font-size:16px; padding:10px; box-shadow:0 4px 0 var(--line); text-align:center; }
.opt.sel{ border-color:var(--gold); background:#FFF0C9; box-shadow:0 4px 0 var(--gold); }
.opt.ok{ border-color:var(--ok); background:#DFF3E6; box-shadow:0 4px 0 var(--ok); }
.opt.done{ opacity:.45; }
@media (prefers-color-scheme: dark){ .opt.sel{ background:#5A4520; } .opt.ok{ background:#1F4A33; } }
.shake{ animation:shake .4s; } @keyframes shake{ 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.hint{ margin-top:12px; background:#FFE9E4; border:2px solid #E7A598; border-radius:12px; padding:10px; font-weight:800; }
@media (prefers-color-scheme: dark){ .hint{ background:#4A2620; border-color:#8A4A3E; } }
/* vitrin: almari pameran kaca */
.vit{ position:relative; min-height:70px; border-radius:10px 10px 4px 4px; border:3px solid #8A6A3A; background:linear-gradient(160deg,rgba(220,240,250,.9),rgba(190,215,230,.75) 55%,rgba(255,255,255,.85));
  box-shadow:inset 0 -10px 0 #B07A2E, 0 4px 0 #6B4E28; padding:10px 8px 18px; font-weight:800; font-size:16px; min-width:0; overflow-wrap:anywhere; color:#2B1E1A; }
.vit:before{ content:""; position:absolute; top:6px; inset-inline-start:8px; width:14px; height:40%; background:rgba(255,255,255,.7); border-radius:6px; transform:skewX(-12deg); }
.vit.ok{ border-color:var(--ok); box-shadow:inset 0 -10px 0 var(--ok), 0 4px 0 #1C5E39; }
/* tiket muzium */
.tkt{ display:flex; border-radius:14px; overflow:hidden; box-shadow:var(--sh); border:3px solid var(--wall); background:#FFF6DC; color:#2B1E1A; }
.tkt .tl{ flex:1; padding:14px; font-weight:800; font-size:17px; line-height:1.45; }
.tkt .ts{ width:64px; background:var(--wall); color:var(--gold2); display:grid; place-items:center; font-family:"Bree Serif",serif; writing-mode:vertical-rl; border-inline-start:3px dashed var(--gold); }
.tcount{ text-align:center; font-weight:900; color:var(--mut); margin:8px 0; }
.stamps{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
.stp{ min-height:62px; border-radius:50%/40%; border:4px double; font-weight:900; font-size:18px; background:var(--card); }
.stp[data-v="1"]{ color:var(--ok); border-color:var(--ok); } .stp[data-v="0"]{ color:var(--bad); border-color:var(--bad); }
/* garis masa */
.tline{ position:relative; display:flex; flex-direction:column; gap:8px; padding-inline-start:28px; margin-bottom:12px; min-height:30px; }
.tline:before{ content:""; position:absolute; inset-block:0; inset-inline-start:10px; width:5px; background:var(--gold); border-radius:3px; }
.tslot{ position:relative; min-height:44px; border:2px dashed var(--line); border-radius:12px; padding:8px 10px; font-weight:800; }
.tslot:before{ content:attr(data-n); position:absolute; inset-inline-start:-28px; top:8px; width:24px; height:24px; border-radius:12px; background:var(--wall); color:var(--gold2); font-size:13px; display:grid; place-items:center; }
.tslot.fill{ border-style:solid; border-color:var(--ok); background:#E6F5EC; }
@media (prefers-color-scheme: dark){ .tslot.fill{ background:#1F4A33; } .tkt{ background:#F3E6C4; } }
</style>
<style>
/* label: tag nama pameran */
.lab{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.lab .opt{ font-size:15px; }
.lab .ll{ border-style:solid; background:#F6ECD5; }
.lab .lr{ border-radius:4px 14px 14px 4px; border-inline-start:8px solid var(--gold); }
[dir=rtl] .lab .lr{ border-radius:14px 4px 4px 14px; }
@media (prefers-color-scheme: dark){ .lab .ll{ background:#3E2F25; } }
/* artifak: susun ke almari */
.art{ text-align:center; font-size:19px; font-weight:900; padding:16px; border-radius:16px; border:3px solid var(--gold); background:repeating-linear-gradient(45deg,#FFF6DC 0 12px,#FCEFCF 12px 24px); color:#2B1E1A; margin-bottom:12px; }
.art .ai{ font-size:34px; display:block; }
.cases{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.case{ min-height:110px; border-radius:16px 16px 6px 6px; border:3px solid #6B4E28; background:linear-gradient(180deg,#F2E3C0,#D9BE8A); color:#2B1E1A; font-weight:900; font-size:16px; padding:10px; min-width:0; overflow-wrap:anywhere; box-shadow:0 5px 0 #6B4E28; }
.case small{ display:block; font-size:13px; margin-top:6px; font-weight:700; }
/* arkib: dokumen lama */
.doc{ background:linear-gradient(180deg,#F5E6C4,#EAD3A2); color:#3A2A18; border-radius:6px; padding:16px; font-size:18px; font-weight:800; line-height:1.9; box-shadow:inset 0 0 30px rgba(120,80,30,.35); border:2px solid #B08A54; }
.doc .bl{ display:inline-block; min-width:70px; border-bottom:3px dashed #8A5A2A; padding:0 6px; color:#7A2836; }
.doc .bl.f{ border-bottom-style:solid; color:var(--ok); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
.chips .opt{ min-height:48px; }
/* pameran: plak tertutup */
.plaques{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
.plq{ border-radius:10px; padding:10px 12px; font-weight:800; background:linear-gradient(90deg,#C9A050,#F3D27A,#C9A050); color:#3E2410; border:2px solid #8A6A2A; }
.plq.hid{ background:repeating-linear-gradient(135deg,#7A2836 0 10px,#6E1F2E 10px 20px); color:#F3D27A; text-align:center; }
/* kurator: betulkan kapsyen */
.cap{ background:var(--card); border:3px solid var(--line); border-radius:12px; padding:12px; line-height:2.2; font-size:17px; font-weight:800; }
.seg{ display:inline; border:none; background:#F3EAD6; border-radius:8px; padding:4px 6px; margin:2px; font-weight:800; line-height:1.9; color:#2B1E1A; }
.seg.sel{ background:#FFD7CF; outline:2px solid var(--bad); }
.seg.fix{ background:#DFF3E6; outline:2px solid var(--ok); }
.kstep{ margin:10px 0 6px; font-weight:900; color:var(--mut); }
/* maklum balas */
.fb{ position:fixed; inset-inline:0; bottom:0; z-index:50; display:flex; justify-content:center; padding:10px; animation:up .25s ease-out; }
@keyframes up{ from{ transform:translateY(100%); } }
.fb .in{ width:100%; max-width:480px; background:var(--card); border:4px solid var(--gold); border-radius:20px; padding:12px; box-shadow:0 -6px 30px rgba(0,0,0,.25); }
.fb .row1{ display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; }
.fb strong{ font-family:"Bree Serif",serif; font-size:22px; color:var(--teal); }
.fb p{ margin:4px 0; font-weight:700; line-height:1.45; }
.fast{ display:inline-block; background:#FFF0C9; border-radius:8px; padding:2px 8px; font-weight:900; color:#7A4A00; }
.res{ text-align:center; }
.res .ancil{ width:120px; height:120px; }
.stars{ font-size:44px; margin:6px 0; }
.stars span{ display:inline-block; animation:pop .5s backwards; } .stars .off{ filter:grayscale(1); opacity:.3; }
@keyframes pop{ from{ transform:scale(0); } }
.res h2{ font-size:28px; color:var(--teal); }
.gotst{ margin:12px 0; background:#FFF0C9; border:2px dashed var(--gold); border-radius:14px; padding:10px; font-weight:900; color:#5A3A00; }
.gotst span{ font-size:40px; display:block; }
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--wall); color:#FFF3D6; padding:12px 16px; border-radius:14px; font-weight:800; z-index:60; max-width:90vw; border:2px solid var(--gold); }
.confetti{ position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden; }
.confetti span{ position:absolute; top:-40px; font-size:26px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
.hall .guide{ right:-6px; top:30px; } [dir=rtl] .hall .guide{ right:auto; left:-6px; }
button.plq{ width:100%; font:inherit; font-weight:800; }
.vit:disabled{ cursor:default; }
.lab .col{ min-width:0; }
.fb .ancil{ width:58px; height:58px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===================== KANDUNGAN "Muzium Sirah" (Sirah Tahun 4, JAIS) =====================
   ms. = muka surat bercetak (fail pN = ms. N-9). Jawi diselaraskan dengan buku; perlu semakan ustaz. */
const SJ = "صلى الله عليه وسلم";
const STATIONS = [
{ id:1, icon:"🏔️", c:"#7A3E2A", sticker:"📜",
  t:["Gua Hira'","ڬوا حراء"], u:["Wahyu pertama turun","وحي ڤرتام تورون"],
  read:[
    { pic:"🏔️🌙", p:"2", h:["Ber'uzlah di Gua Hira'","برعزلة د ڬوا حراء"],
      text:["Ketika hampir berusia 40 tahun, Nabi Muhammad SAW suka ber'uzlah, iaitu mengasingkan diri, di Gua Hira' di Jabal Nur. Baginda menjauhkan diri daripada kesesatan kaum jahiliah.",
            `کتيک همڤير براوسيا 40 تاهون، نبي محمد ${SJ} سوک برعزلة، ايايت مڠاسيڠکن ديري، د ڬوا حراء د جبل النور. باڬيندا منجاٴوهکن ديري درڤد کسستن کاوم جاهلية.`] },

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[587,.12],[880,.2]]),
  tick: () => tone([[700,.07,"triangle"]]),
  no:   () => tone([[230,.18,"square"],[190,.2,"square"]]),
  stamp:() => tone([[160,.08,"square"],[120,.1,"triangle"]]),
  open: () => tone([[520,.06,"triangle"],[780,.08,"triangle"]]),
  win:  () => tone([[392,.14],[523,.14],[659,.14],[784,.32]])
};

/* ---------- Suara: Rumi sahaja, buang tulisan Arab ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const noArab = s => s.replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const clean = noArab(text.replace(/___/g," ... ").replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bAS\b/g,"alaihissalam"));
    if(!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

function progressBar(){

/* ===================== JENIS PERMAINAN ===================== */
const GAMES = {
  /* vitrin: pilih almari kaca yang menyimpan jawapan betul */
  vitrin(el, g){
    const opts = shuffle(g.opts.map((x,i)=>({x, ok:i===0})));
    el.innerHTML = `<div class="grid2" style="margin-top:12px">${opts.map((o,i)=>`<button class="vit" data-i="${i}" data-ok="${o.ok?1:0}">${T(o.x)}</button>`).join("")}</div>`;
    let done = false;
    el.querySelectorAll(".vit").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return;
      if(opts[+b.dataset.i].ok){ done = true; b.classList.add("ok"); win(); }
      else { b.disabled = true; b.style.opacity = .45; oops(b, L("Bukan almari itu. Baca semula kad galeri!","بوکن المري ايت. باچ سمولا کد ڬاليري!")); }
    }));
  },

  /* garismasa: isi garis masa mengikut urutan peristiwa */
  garismasa(el, g){
    const order = mix(g.steps.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="tline" style="margin-top:12px">${g.steps.map((_,i)=>`<div class="tslot" data-n="${i+1}" id="ts${i}"></div>`).join("")}</div>
      <div class="col">${order.map(i=>`<button class="opt" data-i="${i}">${T(g.steps[i])}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled || k>=g.steps.length) return;
      if(+b.dataset.i===k){
        const s = el.querySelector("#ts"+k); s.textContent = T(g.steps[k]); s.classList.add("fill");
        b.disabled = true; b.classList.add("done"); k++; sfx.tick();
        if(k===g.steps.length) setTimeout(win, 300);
      } else oops(b, L(`Belum lagi. Apakah peristiwa ke-${k+1}?`,`بلوم لاڬي. اڤاکه ڤريستيوا ک-${k+1}؟`));
    }));
  },

  /* tiketmuzium: cop SAH atau PALSU pada setiap tiket */
  tiketmuzium(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="tcount">🎟️ ${k+1} / ${items.length}</div>
        <div class="tkt"><div class="tl">${T(items[k][0])}</div><div class="ts">${L("TIKET","تيکيت")}</div></div>
        <div class="stamps"><button class="stp" data-v="1">✔ ${L("SAH","سه")}</button><button class="stp" data-v="0">✘ ${L("PALSU","ڤالسو")}</button></div>`;
      el.querySelectorAll(".stp").forEach(b => b.addEventListener("click", () => {
        if(+b.dataset.v===items[k][1]){
          sfx.stamp(); k++;
          if(k===items.length){ b.disabled = true; setTimeout(win, 200); } else { draw(); speak(RU(items[k][0])); }
        } else oops(b, L("Cop itu salah. Fikir semula!","چوڤ ايت ساله. فيکير سمولا!"));
      }));
    };
    draw();
  },

  /* tagnama: ketik pameran, kemudian ketik label yang sepadan */
  tagnama(el, g){
    const right = mix(g.pairs.map((_,i)=>i)); let sel = null, got = 0;
    el.innerHTML = `<div class="lab" style="margin-top:12px"><div class="col">${g.pairs.map((p,i)=>`<button class="opt ll" data-l="${i}">${T(p[0])}</button>`).join("")}</div>
      <div class="col">${right.map(i=>`<button class="opt lr" data-r="${i}">${T(g.pairs[i][1])}</button>`).join("")}</div></div>`;
    el.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      el.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.l; sfx.tick();
    }));
    el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(sel===null){ toast(L("Ketik pameran di sebelah dahulu.","کتيق ڤاميرن د سبله دهولو.")); return; }
      const l = el.querySelector(`[data-l="${sel}"]`);
      if(+b.dataset.r===sel){
        [l,b].forEach(x=>{ x.disabled = true; x.classList.remove("sel"); x.classList.add("ok"); }); sel = null; got++; sfx.tick();
        if(got===g.pairs.length) setTimeout(win, 300);
      } else oops(b, L("Label itu bukan untuk pameran ini.","لابل ايت بوکن اونتوق ڤاميرن اين."));
    }));
  },

  /* artifak: masukkan setiap kad ke almari pameran yang betul */
  artifak(el, g){
    const items = shuffle(g.items); let k = 0; const count = [0,0];
    const draw = () => {
      el.innerHTML = `<div class="tcount">🏺 ${k+1} / ${items.length}</div>
        <div class="art"><span class="ai" aria-hidden="true">🏺</span>${T(items[k][0])}</div>
        <div class="cases">${g.cases.map((c,i)=>`<button class="case" data-b="${i}">🗄️ ${T(c)}<small>${count[i]} ${L("artifak","ارتيفک")}</small></button>`).join("")}</div>`;
      el.querySelectorAll(".case").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.b===items[k][1]){
          count[items[k][1]]++; k++; sfx.tick();
          if(k===items.length) setTimeout(win, 200); else draw();
        } else oops(b, L("Bukan almari itu. Baca kad sekali lagi!","بوکن المري ايت. باچ کد سکالي لاڬي!"));
      }));
    };
    draw();
  },

  /* arkib: isi tempat kosong dalam dokumen lama mengikut urutan */
  arkib(el, g){
    const segs = T(g.s).split("___");
    const chips = shuffle([...g.ans.map((x,i)=>({x,a:i})), ...g.extra.map(x=>({x,a:-1}))]); let k = 0;
    el.innerHTML = `<div class="doc" style="margin-top:12px">${segs.map((s,i)=> s + (i<segs.length-1 ? `<span class="bl" id="bl${i}">${i===0?"❓":"&nbsp;"}</span>` : "")).join("")}</div>
      <div class="chips">${chips.map((c,i)=>`<button class="opt" data-c="${i}" data-a="${c.a}">${T(c.x)}</button>`).join("")}</div>`;
    el.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => {
      if(b.disabled || k>=g.ans.length) return;
      if(+b.dataset.a===k){
        const bl = el.querySelector("#bl"+k); bl.textContent = T(g.ans[k]); bl.classList.add("f");
        b.disabled = true; b.classList.add("done"); k++; sfx.tick();
        const nx = el.querySelector("#bl"+k); if(nx) nx.textContent = "❓";
        if(k===g.ans.length) setTimeout(win, 300);
      } else oops(b, L(`Perkataan itu tidak sesuai untuk tempat kosong ke-${k+1}.`,`ڤرکاتاٴن ايت تيدق سسواي اونتوق تمڤت کوسوڠ ک-${k+1}.`));
    }));
  },

  /* pameran: buka plak petunjuk satu demi satu, kemudian teka */
  pameran(el, g){
    const opts = shuffle(g.opts.map((x,i)=>({x, ok:i===0}))); let open = 1, done = false;
    const plaques = () => g.clues.map((c,i)=> i<open ? `<div class="plq">🔎 ${T(c)}</div>` : `<button class="plq hid" data-act2="reveal">🔒 ${L("Ketik untuk buka plak","کتيق اونتوق بوک ڤلق")} ${i+1}</button>`).join("");
    el.innerHTML = `<div class="plaques" style="margin-top:12px"></div>
      <div class="grid2">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${T(o.x)}</button>`).join("")}</div>`;
    const pl = el.querySelector(".plaques");
    const drawP = () => { pl.innerHTML = plaques(); pl.querySelectorAll('[data-act2="reveal"]').forEach(b => b.addEventListener("click", () => { if(open<g.clues.length){ open++; sfx.open(); drawP(); speak(RU(g.clues[open-1])); } })); };
    drawP();
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return;
      if(opts[+b.dataset.i].ok){ done = true; open = g.clues.length; drawP(); b.classList.add("ok"); win(); }
      else { b.disabled = true; b.classList.add("done"); oops(b, open<g.clues.length ? L("Belum tepat. Buka plak seterusnya untuk petunjuk!","بلوم تڤت. بوک ڤلق ستروسڽ اونتوق ڤتونجوق!") : L("Belum tepat. Baca semua plak semula!","بلوم تڤت. باچ سموا ڤلق سمولا!")); }
    }));
  },

  /* kurator: cari perkataan salah dalam kapsyen, kemudian betulkan */
  kurator(el, g){
    let step = 1;
    const segs = [];
    g.parts.forEach((p,i) => { if(i===g.bad) segs.push({x:T(p), bad:1}); else T(p).split(/\s+/).filter(Boolean).forEach(w => segs.push({x:w, bad:0})); });
    const fixes = shuffle(g.fix.map((x,i)=>({x, ok:i===0})));
    el.innerHTML = `<div class="kstep" id="kst">1️⃣ ${L("Ketik perkataan yang salah.","کتيق ڤرکاتاٴن يڠ ساله.")}</div>
      <div class="cap">${segs.map((s,i)=>`<button class="seg" data-s="${i}" data-bad="${s.bad}">${s.x}</button>`).join(" ")}</div>
      <div class="chips" id="fixes" hidden>${fixes.map((f,i)=>`<button class="opt" data-f="${i}" data-ok="${f.ok?1:0}">${T(f.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".seg").forEach(b => b.addEventListener("click", () => {
      if(step!==1) return;
      if(b.dataset.bad==="1"){ step = 2; b.classList.add("sel"); sfx.tick(); el.querySelector("#fixes").hidden = false;
        el.querySelector("#kst").textContent = "2️⃣ " + L("Pilih perkataan yang betul.","ڤيليه ڤرکاتاٴن يڠ بتول."); }
      else oops(b, L("Perkataan itu betul. Cari yang salah!","ڤرکاتاٴن ايت بتول. چاري يڠ ساله!"));
    }));
    el.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
      if(step!==2 || b.disabled) return;
      if(fixes[+b.dataset.f].ok){ step = 3; const s = el.querySelector('.seg[data-bad="1"]'); s.textContent = T(g.fix[0]); s.classList.remove("sel"); s.classList.add("fix"); b.classList.add("ok"); win(); }
      else { b.disabled = true; b.classList.add("done"); oops(b, L("Itu pun tidak tepat. Cuba lagi!","ايت ڤون تيدق تڤت. چوبا لاڬي!")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Lawati galeri sebelumnya dahulu 🔒","لاوتي ڬاليري سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} galeri untuk membuka Dewan Agung 🏆`,`سلسايکن سموا ${STATIONS.length} ڬاليري اونتوق ممبوک ديوان اڬوڠ 🏆`)); }
  else if(a==="map"){ renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
