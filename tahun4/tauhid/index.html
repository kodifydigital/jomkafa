<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24496E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Daki Gunung Iman • Tauhid Tahun 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tauhid Tahun 4: "Daki Gunung Iman" — gunung, kem asas, tali panjat, puncak salji, Pandu si panda merah ===== */
:root{
  --sky1:#7DB7E8; --sky2:#DDEEFB; --bg:#EEF3F7; --card:#FFFFFF; --ink:#1C2B3A; --muted:#4E6275; --line:#1C2B3A;
  --brand:#D9622B; --brand2:#A8441A; --pine:#2F6B4F; --pine2:#1F4A37; --rock:#8A97A6; --rock2:#5D6B7A;
  --snow:#FFFFFF; --ice:#D6ECFA; --ice2:#9FCBEB; --gold:#F2B134; --navy:#24496E;
  --ok:#23864A; --okbg:#DCF3E4; --bad:#C9362B; --badbg:#FDE2DE; --note:#FFF4D6;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0B1830; --sky2:#1A2C47; --bg:#0F1724; --card:#1B2738; --ink:#EAF2FA; --muted:#AFC2D6; --line:#05090F;
    --rock:#4A5869; --rock2:#36424F; --ice:#1F3B55; --ice2:#2E5878; --snow:#DCE8F3; --pine:#2E6A4E;
    --note:#3A3018; --okbg:#173A26; --badbg:#46201C; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Rubik","Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:18px;line-height:1.45;
  background:radial-gradient(circle at 84% 70px,#FFF6C9 0 26px,rgba(255,246,201,.35) 27px 40px,transparent 41px),
  linear-gradient(180deg,var(--sky1) 0,var(--sky2) 320px,var(--bg) 520px) fixed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:radial-gradient(circle at 84% 70px,#E9EEF6 0 20px,transparent 22px),radial-gradient(1.5px 1.5px at 18% 50px,#fff,transparent),radial-gradient(1px 1px at 52% 120px,#fff,transparent),radial-gradient(1px 1px at 33% 200px,#fff,transparent),radial-gradient(1px 1px at 70% 30px,#fff,transparent),linear-gradient(180deg,var(--sky1) 0,var(--sky2) 320px,var(--bg) 520px) fixed}}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Rubik",serif;font-weight:600;font-size:19px;line-height:1.85}
h1,h2,h3,h4,.btn,.nm{font-family:"Rubik","Trebuchet MS",sans-serif;font-weight:800}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4,html[dir="rtl"] .btn,html[dir="rtl"] .nm{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 60px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:21px;font-weight:800;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:0 10px}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 14px;border-radius:14px;border:3px solid var(--line);background:var(--gold);color:#2A1C00;font-weight:800;box-shadow:0 4px 0 var(--line)}

/* papan kem (hero) */
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--navy),#16314D);color:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 14px 22px;box-shadow:0 6px 0 var(--line);margin:4px 0 14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:16px;background:linear-gradient(135deg,transparent 0 50%,#fff 50%) 0 0/24px 16px repeat-x,linear-gradient(225deg,transparent 0 50%,#fff 50%) 0 0/24px 16px repeat-x;opacity:.9}
.hero h1{margin:0;font-size:clamp(24px,6.6vw,32px);line-height:1.1;color:#FFE3C2;letter-spacing:.3px}
html[dir="rtl"] .hero h1{line-height:1.6}
.hero p{margin:4px 0 0;font-size:16px;color:#E3EEF9}
.pandu{width:96px;height:96px;flex:0 0 auto}
.pandu.bob{animation:bob 2.4s ease-in-out infinite}
.pandu.yay{animation:yay .8s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes yay{30%{transform:translateY(-12px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}}

/* pelekat */
.sttl{margin:4px 2px 6px;font-weight:800;color:var(--muted);font-size:16px}
.stickers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.stickers span{width:42px;height:42px;display:grid;place-items:center;font-size:24px;border-radius:50%;background:var(--card);border:3px dashed var(--rock);filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;border:3px solid var(--brand);background:var(--note)}

/* peta gunung */
.mtn{position:relative;border:3px solid var(--line);border-radius:22px;overflow:hidden;padding:0 10px 18px;box-shadow:0 6px 0 var(--line);
  background:linear-gradient(180deg,var(--ice) 0,var(--ice) 180px,var(--rock) 180px,var(--rock2) 70%,var(--pine) 88%,var(--pine2) 100%)}
.mtn::before{content:"";position:absolute;left:50%;top:150px;bottom:70px;width:0;border-left:5px dashed var(--brand);transform:translateX(-50%);opacity:.75}
.peak{position:relative;display:block;margin:0 auto;width:min(320px,100%);border:0;background:none;padding:6px 0 4px;text-align:center}
.peak svg{width:100%;height:auto;display:block}
.peak .nm{display:inline-block;margin-top:-10px;padding:6px 14px;border-radius:12px;background:var(--card);border:3px solid var(--line);font-size:18px;box-shadow:0 4px 0 var(--line);position:relative;z-index:2}
.peak.lock{filter:saturate(.35)}
.peak.now .nm{background:var(--gold);color:#2A1C00}
.peak .pandu{position:absolute;width:70px;height:70px;left:8%;top:40%}
.camprow{display:flex;justify-content:flex-start;padding:10px 0;position:relative;z-index:1}
.camprow.r{justify-content:flex-end}
.camp{width:min(58%,230px);display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--line);border-radius:18px;background:var(--card);padding:8px 8px 10px;box-shadow:0 5px 0 var(--line);position:relative}
.camp:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.camp .tent{width:100%;height:auto;max-height:82px}
.camp .badge{position:absolute;top:-12px;inset-inline-start:-10px;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:16px}
.camp .ic{position:absolute;top:-12px;inset-inline-end:-8px;font-size:26px}
.camp .nm{font-size:16px;text-align:center;line-height:1.25}
html[dir="rtl"] .camp .nm{line-height:1.6}
.camp .st{font-size:15px;min-height:18px}
.st span.off,.stars span.off{filter:grayscale(1);opacity:.3}
.camp.lock{background:#D9DFE6;color:#5A6673}
.camp.lock .tent{filter:grayscale(1) opacity(.7)}
.camp.now{background:var(--note);outline:4px solid var(--gold);outline-offset:2px}
.camp.now .ic{animation:bob 1.6s infinite}
.base{margin:14px auto 0;width:max-content;max-width:100%;background:var(--pine2);color:#fff;border:3px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:800;position:relative;z-index:1}

/* tajuk stesen */
.shead{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.shead h2{margin:0;font-size:22px;line-height:1.15}
html[dir="rtl"] .shead h2{line-height:1.7}
.shead small{color:var(--muted);font-size:15px}
.bub{width:54px;height:54px;flex:0 0 auto;border-radius:16px;background:var(--c);border:3px solid var(--line);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 var(--line)}

/* kad */
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px 14px;box-shadow:0 6px 0 var(--line);border-top:10px solid var(--sc,var(--brand))}
.rpic{font-size:46px;text-align:center;line-height:1.1}
.rh{margin:6px 0 10px;font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.say{min-width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--ice);font-size:19px;display:inline-grid;place-items:center;flex:0 0 auto}
.vs{display:grid;gap:8px;margin-bottom:10px}
.vs>div{border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--okbg)}
.vs>div.m{background:var(--badbg)}
.vs b{display:block;font-size:15px;color:var(--muted)}
.vs .ar{font-size:24px}
.rlist{margin:0 0 10px;padding-inline-start:24px}
.rlist li{margin:6px 0}
.rtext{margin:0 0 10px}
.abox{border:3px dashed var(--navy);border-radius:16px;padding:10px 12px;margin:10px 0;background:var(--ice);display:grid;gap:6px}
.abox .ar{font-size:25px;line-height:2.1;text-align:center}
.abox .mk{font-size:16px}
.abox small{color:var(--muted);font-weight:700}
.tip{display:flex;gap:8px;align-items:flex-start;background:var(--note);border:3px solid var(--gold);border-radius:14px;padding:8px 10px;margin:8px 0;font-size:17px}
.tip.am{border-color:var(--pine);background:var(--okbg)}
.ref{margin-top:10px;color:var(--muted);font-weight:700;font-size:15px}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--navy);color:#fff;font-size:19px;box-shadow:0 5px 0 var(--line);padding:8px 12px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.go{background:var(--brand)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--rock)}
.dots i.on{background:var(--brand);width:24px;border-radius:6px}

/* kemajuan pendakian */
.prog{position:relative;height:44px;margin:4px 6px 12px;background:linear-gradient(180deg,transparent 0 18px,var(--rock) 18px 26px,transparent 26px)}
.prog .pf{position:absolute;top:2px;transform:translateX(-50%);font-size:18px}
html[dir="rtl"] .prog .pf{transform:translateX(50%)}
.prog .me{position:absolute;top:-2px;transform:translateX(-50%);font-size:28px;transition:all .4s}
html[dir="rtl"] .prog .me{transform:translateX(50%) scaleX(-1)}

/* soalan */
.q{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.q p{margin:0;flex:1;font-size:19px;font-weight:700}
.qar{font-size:24px;line-height:2;text-align:center;background:var(--ice);border:3px dashed var(--navy);border-radius:14px;padding:6px 10px;margin:0 0 10px}
.tile{min-height:52px;border-radius:14px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);padding:8px 10px;font-size:17px;min-width:0;overflow-wrap:anywhere;text-align:center}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.sel{background:var(--gold);color:#2A1C00}
.tile.wrong{background:var(--badbg)}
.tile.right,.tile.done{background:var(--okbg)}
.tile:disabled{opacity:.55}
.cnt{text-align:center;color:var(--muted);font-weight:700;margin-top:10px;font-size:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g1{display:grid;gap:10px}

/* panjat: tali panjat */
.cliff{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:stretch}
.rope{position:relative;border-radius:14px;background:linear-gradient(90deg,transparent 0 27px,#B5823C 27px 35px,transparent 35px),linear-gradient(180deg,var(--ice),var(--rock));border:3px solid var(--line);min-height:240px}
.rope .knot{position:absolute;left:50%;transform:translate(-50%,50%);font-size:16px}
.rope .climber{position:absolute;left:50%;transform:translate(-50%,50%);width:50px;height:50px;transition:bottom .5s}
.rope .climber .pandu{width:100%;height:100%}
.rope .flag{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:22px}
.pstep{font-weight:800;margin-bottom:8px}
.holds{display:grid;gap:8px}

/* khemah */
.gears{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.gears .tile{flex:1 1 40%}
.gears .tile.gone{visibility:hidden;height:0;min-height:0;padding:0;margin:0;border:0;flex-basis:0}
.tents{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px}
.tentb{border:3px solid var(--line);border-radius:16px 16px 10px 10px;background:linear-gradient(180deg,var(--tc,var(--brand)) 0 46px,var(--card) 46px);box-shadow:0 4px 0 var(--line);padding:6px 6px 8px;min-height:120px;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:4px}
.tentb .em{font-size:28px}
.tentb b{font-size:15px;line-height:1.2}
.tentb .in{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

/* salji */
.snow{display:flex;align-items:center;gap:10px;min-height:76px;background:var(--ice);border:3px solid var(--line);border-radius:16px;padding:8px 10px;margin-bottom:12px}
.ball{flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#CFE6F7 70%,#9FC4E2);border:3px solid var(--line);transition:all .35s}
.built{flex:1;font-weight:700;min-height:30px}
.built span{background:var(--card);border-radius:8px;padding:0 4px;margin:2px;display:inline-block}
.flakes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.flakes .tile{flex:0 1 auto}
.flakes .tile.used{visibility:hidden}

/* kapak */
.icewall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.icecol{display:grid;gap:8px;align-content:start}
.ice{background:linear-gradient(160deg,#F4FBFF,var(--ice2));color:#12324D}
.ice.done{background:var(--okbg);color:var(--ink)}
.ice.sel{background:var(--gold)}

/* kompas */
.compass{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:relative}
.compass .needle{grid-column:1/-1;justify-self:center;width:84px;height:84px;border-radius:50%;border:4px solid var(--line);background:radial-gradient(circle,var(--card) 0 55%,var(--ice) 56%);display:grid;place-items:center;font-size:34px;transition:transform .5s}
.compass .dir{position:relative;padding-top:22px}
.compass .dir i{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-style:normal;font-weight:800;font-size:13px;color:var(--brand2)}

/* cerun */
.slope{border:3px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center;font-size:19px;font-weight:700;background:linear-gradient(180deg,var(--card),var(--ice));min-height:96px;display:grid;place-items:center}
.tbar{height:10px;border-radius:6px;background:var(--rock);margin:10px 0;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);width:100%;transition:width linear}
.cbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cbtns .tile{font-size:19px;font-weight:800}
.bonus{text-align:center;font-weight:800;color:var(--brand2)}

/* jambatan */
.bridge{display:grid;gap:6px;margin-bottom:12px;padding:8px;border-radius:14px;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(0,0,0,.08) 18px 20px),var(--ice);border:3px solid var(--line)}
.slot{display:flex;gap:8px;align-items:center;min-height:42px;border:3px dashed var(--rock2);border-radius:10px;padding:4px 8px;background:var(--card)}
.slot b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rock2);color:#fff;display:grid;place-items:center;font-size:14px}
.slot.on{border-style:solid;border-color:var(--pine);background:var(--okbg)}
.slot.next{border-color:var(--brand)}
.planks{display:grid;gap:8px}
.plank{background:linear-gradient(180deg,#E7B97A,#C98F4A);color:#2A1700}
.plank.used{display:none}

/* gema */
.sent{font-size:19px;font-weight:700;line-height:2;margin:0 0 12px;padding:10px;border-radius:14px;background:var(--note);border:3px solid var(--line)}
.blank{display:inline-block;min-width:80px;border-bottom:4px solid var(--brand);text-align:center;padding:0 4px}
.blank.cur{background:var(--gold);color:#2A1C00;border-radius:6px}
.blank.fill{border-color:var(--pine);color:var(--pine)}
.echoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* galas */
.kits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kit.in{background:var(--okbg);outline:3px solid var(--pine);outline-offset:-6px}
.kit.in::before{content:"🎒 "}
.chk{margin-top:12px;width:100%}

/* maklum balas */
.hint{margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--badbg);border:3px solid var(--bad);font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.25)}
.fb .in{max-width:640px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .pandu{width:72px;height:72px}
.fb strong{font-size:22px}
.fb p{margin:2px 0 0;font-size:16px}
.fb .btn{width:100%}
.res{text-align:center}
.res .pandu{width:130px;height:130px}
.stars{font-size:46px;display:flex;justify-content:center;gap:6px}
.stars span{animation:pop .5s both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border:3px dashed var(--brand);border-radius:14px;padding:8px;margin:10px 0;font-weight:700}
.gotst span{font-size:38px}
.res .btn{width:100%;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== Dalil al-Quran: dijana oleh gen_ar.py daripada api.quran.com (text_uthmani), dipotong ikut indeks perkataan ===== */
const AR = {
  anam37: "وَقَالُوا۟ لَوْلَا نُزِّلَ عَلَيْهِ ءَايَةٌ مِّن رَّبِّهِۦ ۚ قُلْ إِنَّ ٱللَّهَ قَادِرٌ عَلَىٰٓ أَن يُنَزِّلَ ءَايَةً وَلَـٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ ﴿٣٧﴾",
  nur45: "… إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ",

  yasin82: "إِنَّمَآ أَمْرُهُۥٓ إِذَآ أَرَادَ شَيْـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ ﴿٨٢﴾",
  fatir38: "إِنَّ ٱللَّهَ عَـٰلِمُ غَيْبِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ ﴿٣٨﴾",
  yunus61: "… وَمَا يَعْزُبُ عَن رَّبِّكَ مِن مِّثْقَالِ ذَرَّةٍ فِى ٱلْأَرْضِ وَلَا فِى ٱلسَّمَآءِ وَلَآ أَصْغَرَ مِن ذَٰلِكَ وَلَآ أَكْبَرَ إِلَّا فِى كِتَـٰبٍ مُّبِينٍ",
  imran2: "ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ﴿٢﴾",
  furqan58: "وَتَوَكَّلْ عَلَى ٱلْحَىِّ ٱلَّذِى لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِۦ ۚ وَكَفَىٰ بِهِۦ بِذُنُوبِ عِبَادِهِۦ خَبِيرًا ﴿٥٨﴾",
  mujadalah1: "قَدْ سَمِعَ ٱللَّهُ قَوْلَ ٱلَّتِى تُجَـٰدِلُكَ فِى زَوْجِهَا وَتَشْتَكِىٓ إِلَى ٱللَّهِ وَٱللَّهُ يَسْمَعُ تَحَاوُرَكُمَآ ۚ إِنَّ ٱللَّهَ سَمِيعٌۢ بَصِيرٌ ﴿١﴾",
  zukhruf80: "أَمْ يَحْسَبُونَ أَنَّا لَا نَسْمَعُ سِرَّهُمْ وَنَجْوَىٰهُم ۚ بَلَىٰ وَرُسُلُنَا لَدَيْهِمْ يَكْتُبُونَ ﴿٨٠﴾",
  taha35: "إِنَّكَ كُنتَ بِنَا بَصِيرًا ﴿٣٥﴾",
  baqarah110: "… إِنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ",
  baqarah253: "تِلْكَ ٱلرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ ۘ مِّنْهُم مَّن كَلَّمَ ٱللَّهُ …",

  najm: "وَمَا يَنطِقُ عَنِ ٱلْهَوَىٰٓ ﴿٣﴾ إِنْ هُوَ إِلَّا وَحْىٌ يُوحَىٰ ﴿٤﴾",

  yasin51: "وَنُفِخَ فِى ٱلصُّورِ فَإِذَا هُم مِّنَ ٱلْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ ﴿٥١﴾ قَالُوا۟ يَـٰوَيْلَنَا مَنۢ بَعَثَنَا مِن مَّرْقَدِنَا ۜ ۗ هَـٰذَا مَا وَعَدَ ٱلرَّحْمَـٰنُ وَصَدَقَ ٱلْمُرْسَلُونَ ﴿٥٢﴾ إِن كَانَتْ إِلَّا صَيْحَةً وَٰحِدَةً فَإِذَا هُمْ جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ ﴿٥٣﴾ فَٱلْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْـًٔا وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ ﴿٥٤﴾",
  hud105: "يَوْمَ يَأْتِ لَا تَكَلَّمُ نَفْسٌ إِلَّا بِإِذْنِهِۦ ۚ فَمِنْهُمْ شَقِىٌّ وَسَعِيدٌ ﴿١٠٥﴾ فَأَمَّا ٱلَّذِينَ شَقُوا۟ فَفِى ٱلنَّارِ لَهُمْ فِيهَا زَفِيرٌ وَشَهِيقٌ ﴿١٠٦﴾ خَـٰلِدِينَ فِيهَا مَا دَامَتِ ٱلسَّمَـٰوَٰتُ وَٱلْأَرْضُ إِلَّا مَا شَآءَ رَبُّكَ ۚ إِنَّ رَبَّكَ فَعَّالٌ لِّمَا يُرِيدُ ﴿١٠٧﴾ ۞ وَأَمَّا ٱلَّذِينَ سُعِدُوا۟ فَفِى ٱلْجَنَّةِ خَـٰلِدِينَ فِيهَا مَا دَامَتِ ٱلسَّمَـٰوَٰتُ وَٱلْأَرْضُ إِلَّا مَا شَآءَ رَبُّكَ ۖ عَطَآءً غَيْرَ مَجْذُوذٍ ﴿١٠٨﴾"

{ id:2, icon:"📚", c:"#2F6B4F", sticker:"🏕️", t:["'Aliman & Hayyan","عَالِمًا & حَيًّا"], u:["Allah mengetahui dan hidup • ms. 8–12","الله مڠتاهوءي دان هيدوڤ • م.س. ٨–١٢"],
  read:[
    { pic:"📚", h:["Kaunuhu Ta'ala 'Aliman","كَوْنُهُ تَعَالَى عَالِمًا"],

          [["Sifat mustahil","صيفت مستحيل"],["Kaunuhu Ta'ala Jahilan: keadaan Allah Ta'ala yang tidak mengetahui","كَوْنُهُ تَعَالَى جَاهِلًا: کأداٴن الله تعالى يڠ تيدق مڠتاهوءي"]]],
      ar:AR.fatir38, mk:["Maksudnya: Sesungguhnya Allah mengetahui segala rahsia di langit dan di bumi; sesungguhnya Ia mengetahui akan segala (isi hati) yang terkandung di dalam dada.","مقصودڽ: سسوڠڬوهڽ الله مڠتاهوءي سڬالا رهسيا د لاڠيت دان د بومي؛ سسوڠڬوهڽ اي مڠتاهوءي اکن سڬالا (ايسي هاتي) يڠ ترکندوڠ د دالم دادا."],
      src:["Surah Fatir, ayat 38","سورة فاطر، ايات ٣٨"], p:"8" },
    { pic:"🔍", h:["Allah mengetahui segala-galanya","الله مڠتاهوءي سڬالا٢ڽ"], list:[
      ["Mustahil bagi Allah tidak mengetahui apa yang ada di dunia ini.","مستحيل باڬي الله تيدق مڠتاهوءي اڤ يڠ اد د دنيا اين."],
      ["Allah mengetahui kebaikan atau kejahatan yang kita lakukan walaupun hanya sebesar zarah.","الله مڠتاهوءي کباٴيقن اتاو کجاهتن يڠ کيت لاکوکن والاوڤون هاڽ سبسر ذره."],
      ["Manusia tidak mampu menyembunyikan perbuatan mereka daripada pengetahuan Allah.","مانوسيا تيدق ممڤو مڽمبوڽيکن ڤربواتن مريک درڤد ڤڠتاهوان الله."]],
      ar:AR.yunus61, mk:["Maksudnya: …dan tidak akan hilang lenyap dari pengetahuan Tuhanmu sesuatu seberat zarah di bumi atau di langit, dan tidak ada yang lebih kecil atau lebih besar, melainkan semuanya tertulis di dalam Kitab yang terang nyata.","مقصودڽ: …دان تيدق اکن هيلڠ لڽڤ دري ڤڠتاهوان توهنمو سسواتو سبرت ذره د بومي اتاو د لاڠيت، دان تيدق اد يڠ لبيه کچيل اتاو لبيه بسر، ملاٴينکن سمواڽ ترتوليس د دالم کتاب يڠ تراڠ ڽات."],
      src:["Surah Yunus, ayat 61","سورة يونس، ايات ٦١"],
      tip:["Allah mengetahui zahir dan batin manusia, sama ada perkara itu telah, sedang atau akan berlaku.","الله مڠتاهوءي ظاهر دان باطن مانوسيا، سام اد ڤرکارا ايت تله، سدڠ اتاو اکن برلاکو."],
      am:["Melazimi sebutan istighfar \"Astaghfirullah\" dalam kehidupan seharian.","ملازيمي سبوتن استغفار \"أستغفرالله\" دالم کهيدوڤن سهارين."], p:"9–10" },

      ar:AR.imran2, mk:["Maksudnya: Allah, tiada Tuhan yang berhak disembah melainkan Dia, Yang Tetap Hidup, Yang Kekal selama-lamanya mentadbirkan sekalian makhluk-Nya.","مقصودڽ: الله، تياد توهن يڠ برحق دسمبه ملاٴينکن دي، يڠ تتڤ هيدوڤ، يڠ ککل سلاما٢ڽ منتدبيرکن سکلين مخلوقڽ."],
      src:["Surah Ali 'Imran, ayat 2","سورة آل عمران، ايات ٢"], p:"11" },
    { pic:"♾️", h:["Allah Maha Hidup","الله مها هيدوڤ"], list:[
      ["Allah Maha Hidup tanpa permulaan dan tanpa pengakhiran.","الله مها هيدوڤ تنڤا ڤرمولاٴن دان تنڤا ڤڠاخيرن."],
      ["Allah Maha Hidup tanpa memerlukan makanan dan minuman.","الله مها هيدوڤ تنڤا ممرلوکن ماکنن دان مينومن."],
      ["Allah berkeadaan hidup yang kekal selama-lamanya.","الله برکأداٴن هيدوڤ يڠ ککل سلاما٢ڽ."],
      ["Mustahil Allah bersifat mati kerana Allah yang menghidupkan dan mematikan.","مستحيل الله برصيفت ماتي کران الله يڠ مڠهيدوڤکن دان مماتيکن."]],
      ar:AR.furqan58, mk:["Maksudnya: Dan berserahlah engkau kepada Allah Tuhan Yang Hidup, yang tidak mati; serta bertasbihlah dengan memuji-Nya; dan cukuplah Ia mengetahui secara mendalam akan dosa-dosa hamba-Nya.","مقصودڽ: دان برسراهله اڠکاو کڤد الله توهن يڠ هيدوڤ، يڠ تيدق ماتي؛ سرتا برتسبيحله دڠن مموجيڽ؛ دان چوکوڤله اي مڠتاهوءي سچارا مندالم اکن دوسا٢ همباڽ."],
      src:["Surah al-Furqan, ayat 58","سورة الفرقان، ايات ٥٨"],
      tip:["Dunia ini dan sekalian isinya pasti akan binasa apabila sampai waktu yang ditentukan oleh Allah.","دنيا اين دان سکلين ايسيڽ ڤستي اکن بيناس اڤابيلا سمڤاي وقتو يڠ دتنتوکن اوليه الله."],

{ id:3, icon:"👂", c:"#3C7DC4", sticker:"🦅", t:["Sami'an & Basiran","سَمِيعًا & بَصِيرًا"], u:["Allah mendengar dan melihat • ms. 13–17","الله مندڠر دان مليهت • م.س. ١٣–١٧"],

      vs:[[["Sifat wajib","صيفت واجب"],["Kaunuhu Ta'ala Sami'an: keadaan Allah Ta'ala yang mendengar","كَوْنُهُ تَعَالَى سَمِيعًا: کأداٴن الله تعالى يڠ مندڠر"]],

      ar:AR.mujadalah1, mk:["Maksudnya: Sesungguhnya Allah telah mendengar aduan perempuan yang bersoal jawab denganmu (wahai Muhammad) mengenai suaminya, sambil ia berdoa merayu kepada Allah, sedang Allah sedia mendengar perbincangan kamu berdua. Sesungguhnya Allah Maha Mendengar, lagi Maha Melihat.","مقصودڽ: سسوڠڬوهڽ الله تله مندڠر اڤوان ڤرمڤوان يڠ برسوال جاوب دڠنمو (واهاي محمد) مڠناءي سواميڽ، سمبيل اي بردعا مرايو کڤد الله، سدڠ الله سديا مندڠر ڤربينچڠن کامو بردوا. سسوڠڬوهڽ الله مها مندڠر، لاڬي مها مليهت."],
      src:["Surah al-Mujadalah, ayat 1","سورة المجادلة، ايات ١"], p:"13" },
    { pic:"🤲", h:["Allah sentiasa mendengar","الله سنتياس مندڠر"], list:[
      ["Allah sentiasa mendengar dan mengetahui apa yang diucapkan oleh makhluk-Nya.","الله سنتياس مندڠر دان مڠتاهوءي اڤ يڠ دأوچڤکن اوليه مخلوقڽ."],
      ["Allah juga mendengar dan mengetahui apa yang tersirat dalam hati manusia.","الله جوڬ مندڠر دان مڠتاهوءي اڤ يڠ ترسيرت دالم هاتي مانوسيا."],
      ["Kita hendaklah sentiasa memohon atau berdoa kepada Allah sahaja.","کيت هندقله سنتياس مموهون اتاو بردعا کڤد الله سهاج."],
      ["Manusia yang tidak mahu berdoa kepada Allah tergolong dalam kalangan orang yang sombong.","مانوسيا يڠ تيدق ماهو بردعا کڤد الله ترڬولوڠ دالم کالڠن اورڠ يڠ سومبوڠ."]],
      ar:AR.zukhruf80, mk:["Maksudnya: Patutkah mereka menyangka bahawa Kami tidak mendengar apa yang mereka sembunyikan dan apa yang mereka perkatakan (dengan berbisik) sesama sendiri? Bahkan utusan-utusan Kami (malaikat) yang menjaga mereka ada menulis segala yang mereka lakukan.","مقصودڽ: ڤاتوتکه مريک مڽڠک بهاوا کامي تيدق مندڠر اڤ يڠ مريک سمبوڽيکن دان اڤ يڠ مريک ڤرکاتاکن (دڠن بربيسيق) سسام سنديري؟ بهکن اوتوسن٢ کامي (ملاٴيکة) يڠ منجاڬ مريک اد منوليس سڬالا يڠ مريک لاکوکن."],
      src:["Surah az-Zukhruf, ayat 80","سورة الزخرف، ايات ٨٠"],
      tip:["Allah sentiasa mendengar doa yang dipohon oleh makhluk-Nya.","الله سنتياس مندڠر دعا يڠ دڤوهون اوليه مخلوقڽ."],
      am:["Memulakan sesuatu pekerjaan dengan membaca basmalah \"Bismillahirrahmanirrahim\".","ممولاکن سسواتو ڤکرجاٴن دڠن ممباچ بسملة \"بسم الله الرحمن الرحيم\"."], p:"14–15" },
    { pic:"👁️", h:["Kaunuhu Ta'ala Basiran","كَوْنُهُ تَعَالَى بَصِيرًا"],
      vs:[[["Sifat wajib","صيفت واجب"],["Kaunuhu Ta'ala Basiran: keadaan Allah Ta'ala yang melihat","كَوْنُهُ تَعَالَى بَصِيرًا: کأداٴن الله تعالى يڠ مليهت"]],
          [["Sifat mustahil","صيفت مستحيل"],["Kaunuhu Ta'ala A'ma: keadaan Allah Ta'ala yang buta","كَوْنُهُ تَعَالَى أَعْمَى: کأداٴن الله تعالى يڠ بوتا"]]],
      ar:AR.taha35, mk:["Maksudnya: Sesungguhnya Engkau (Allah) sedia melihat dan mengetahui hal ehwal kami.","مقصودڽ: سسوڠڬوهڽ اڠکاو (الله) سديا مليهت دان مڠتاهوءي حال احوال کامي."],
      src:["Surah Taha, ayat 35","سورة طه، ايات ٣٥"], p:"16" },
    { pic:"🔭", h:["Allah sentiasa melihat","الله سنتياس مليهت"], list:[

      ["Setiap perkara yang kita lakukan tidak akan terlepas dari pandangan Allah.","ستياڤ ڤرکارا يڠ کيت لاکوکن تيدق اکن ترلڤس دري ڤندڠن الله."],
      ["Orang yang beriman dengan sifat ini akan sentiasa bertakwa kepada Allah.","اورڠ يڠ برايمان دڠن صيفت اين اکن سنتياس برتقوى کڤد الله."]],
      ar:AR.baqarah110, mk:["Maksudnya: …Sesungguhnya Allah sentiasa melihat segala yang kamu kerjakan.","مقصودڽ: …سسوڠڬوهڽ الله سنتياس مليهت سڬالا يڠ کامو کرجاکن."],
      src:["Surah al-Baqarah, ayat 110","سورة البقرة، ايات ١١٠"],
      tip:["Allah melihat segala perbuatan kita sama ada secara terang-terangan ataupun secara tersembunyi.","الله مليهت سڬالا ڤربواتن کيت سام اد سچارا تراڠ٢ن اتاوڤون سچارا ترسمبوڽي."],

{ id:5, icon:"🌟", c:"#C99A1E", sticker:"🧭", t:["Sifat Wajib Rasul","صيفت واجب رسول"], u:["Empat sifat wajib bagi para rasul • ms. 23–30","امڤت صيفت واجب باڬي ڤارا رسول • م.س. ٢٣–٣٠"],
  read:[
    { pic:"🌟", h:["Empat sifat wajib bagi rasul","امڤت صيفت واجب باڬي رسول"], num:1, list:[
      ["As-Siddiq: benar","اَلصِّدْقُ: بنر"],["Al-Amanah: amanah","اَلْأَمَانَةُ: امانه"],["At-Tabligh: menyampaikan","اَلتَّبْلِيغُ: مڽمڤايکن"],["Al-Fatanah: bijaksana","اَلْفَطَانَةُ: بيجقسان"]],
      text:["Murid: \"Ustazah, apakah sifat yang wajib bagi para rasul?\" Ustazah: \"Sifat yang wajib bagi para rasul ada empat.\"","موريد: \"استاذه، اڤاکه صيفت يڠ واجب باڬي ڤارا رسول؟\" استاذه: \"صيفت يڠ واجب باڬي ڤارا رسول اد امڤت.\""], p:"24–25" },
    { pic:"🌙", h:["As-Siddiq: benar","اَلصِّدْقُ: بنر"],
      text:["Selepas Israk dan Mikraj, Rasulullah menceritakan baginda pergi ke Baitul Maqdis dan bersolat di dalamnya. Kaum Quraisy tidak percaya, tetapi Saidina Abu Bakar membenarkan cerita baginda. Nabi menjelaskan sifat-sifat Baitul Maqdis supaya orang musyrikin mengetahui kebenaran berita itu.","سلڤس اسراء دان معراج، رسول الله منچريتاکن بڬيندا ڤرڬي ک بيت المقدس دان برصلاة د دالمڽ. قوم قريش تيدق ڤرچاي، تتاڤي سيدنا ابو بکر ممبنرکن چريتا بڬيندا. نبي منجلسکن صيفت٢ بيت المقدس سوڤايا اورڠ مشرکين مڠتاهوءي کبنرن بريتا ايت."],
      ar:AR.najm, mk:["Maksudnya: Dan ia tidak memperkatakan (sesuatu) menurut kemahuan dan pendapatnya sendiri. Segala yang diperkatakannya itu tidak lain hanyalah wahyu yang diwahyukan kepadanya.","مقصودڽ: دان اي تيدق ممڤرکاتاکن (سسواتو) منوروت کماهوان دان ڤنداڤتڽ سنديري. سڬالا يڠ دڤرکاتاکنڽ ايت تيدق لاٴين هاڽاله وحي يڠ دوحيوکن کڤداڽ."],
      src:["Surah an-Najm, ayat 3–4","سورة النجم، ايات ٣–٤"], p:"26" },
    { pic:"🐪", h:["Al-Amanah: amanah","اَلْأَمَانَةُ: امانه"],
      text:["Ketika berumur 25 tahun, baginda membawa barang dagangan milik Khadijah binti Khuwailid ke Syam, ditemani pelayan Khadijah bernama Maisarah. Maisarah memberitahu bahawa Rasulullah sangat baik, sopan, jujur dan amanah. Keuntungan Khadijah berlipat ganda kerana sifat amanah baginda.","کتيک برعمور ٢٥ تاهون، بڬيندا ممباوا بارڠ داڬڠن ميليق خديجة بنت خويلد ک شام، دتماني ڤلاين خديجة برنام ميسرة. ميسرة ممبريتاهو بهاوا رسول الله ساڠت باٴيق، سوڤن، جوجور دان امانه. کأونتوڠن خديجة برليڤت ڬندا کران صيفت امانه بڬيندا."],
      ar:AR.syuara107, mk:["Maksudnya (kata-kata Nabi Nuh): Sesungguhnya aku ini ialah Rasul yang amanah (yang diutus oleh Allah) kepada kamu.","مقصودڽ (کات٢ نبي نوح): سسوڠڬوهڽ اکو اين اياله رسول يڠ امانه (يڠ دأوتوس اوليه الله) کڤد کامو."],
      src:["Surah asy-Syu'ara', ayat 107","سورة الشعراء، ايات ١٠٧"], p:"27" },
    { pic:"📜", h:["At-Tabligh: menyampaikan","اَلتَّبْلِيغُ: مڽمڤايکن"],
      text:["Ketika berumur 40 tahun qamari, semasa beribadah di Gua Hira', Malaikat Jibril menyampaikan wahyu pertama iaitu Surah al-'Alaq ayat 1–5. Kemudian turun wahyu kedua, Surah al-Muddaththir ayat 1–5, iaitu perintah berdakwah.","کتيک برعمور ٤٠ تاهون قمري، سماس برعبادة د ڬوا حراء، ملاٴيکة جبريل مڽمڤايکن وحي ڤرتام ايايت سورة العلق ايات ١–٥. کمودين تورون وحي کدوا، سورة المدثر ايات ١–٥، ايايت ڤرينته بردعوة."],
      ar:AR.maidah67, mk:["Maksudnya: Wahai Rasul Allah! Sampaikanlah apa yang telah diturunkan kepadamu dari Tuhanmu; dan jika engkau tidak melakukannya, maka bermakna tiadalah engkau menyampaikan perutusan-Nya; dan Allah jualah akan memeliharamu dari (kejahatan) manusia. Sesungguhnya Allah tidak memberi hidayah kepada kaum yang kafir.","مقصودڽ: واهاي رسول الله! سمڤايکنله اڤ يڠ تله دتورونکن کڤدامو دري توهنمو؛ دان جک اڠکاو تيدق ملاکوکنڽ، مک برمعنا تيداله اڠکاو مڽمڤايکن ڤروتوسنڽ؛ دان الله جوا اکن ممليهارامو دري (کجاهتن) مانوسيا. سسوڠڬوهڽ الله تيدق ممبري هداية کڤد قوم يڠ کافر."],
      src:["Surah al-Ma'idah, ayat 67","سورة المائدة، ايات ٦٧"], p:"28" },
    { pic:"🕋", h:["Al-Fatanah: bijaksana","اَلْفَطَانَةُ: بيجقسان"],
      text:["Banjir merosakkan Kaabah. Ketika ingin meletakkan Hajar al-Aswad, kabilah Quraisy berselisih. Nabi Muhammad orang pertama memasuki Masjidil Haram, lalu meletakkan Hajar al-Aswad di atas kain dan meminta setiap ketua kabilah mengangkatnya bersama. Baginda sendiri meletakkannya di tempat asal. Baginda digelar \"al-Amin\" iaitu yang dipercayai.","بنجير مروسقکن کعبة. کتيک ايڠين ملتقکن حجر الأسود، قبيلة قريش برسليسيه. نبي محمد اورڠ ڤرتام مماسوقي مسجد الحرام، لالو ملتقکن حجر الأسود د اتس کاٴين دان مميڠتا ستياڤ کتوا قبيلة مڠڠکتڽ برسام. بڬيندا سنديري ملتقکنڽ د تمڤت اصل. بڬيندا دڬلر \"الأمين\" ايايت يڠ دڤرچاياٴي."],
      ar:AR.nahl125, mk:["Maksudnya: Serulah ke jalan Tuhanmu dengan hikmat kebijaksanaan dan nasihat pengajaran yang baik, dan berbahaslah dengan mereka dengan cara yang lebih baik; sesungguhnya Tuhanmu Dialah yang lebih mengetahui akan orang yang sesat dari jalan-Nya, dan Dialah yang lebih mengetahui akan orang yang mendapat hidayah.","مقصودڽ: سروله ک جالن توهنمو دڠن حکمة کبيجقسناٴن دان نصيحت ڤڠاجرن يڠ باٴيق، دان بربحثله دڠن مريک دڠن چارا يڠ لبيه باٴيق؛ سسوڠڬوهڽ توهنمو دياله يڠ لبيه مڠتاهوءي اکن اورڠ يڠ سست دري جالنڽ، دان دياله يڠ لبيه مڠتاهوءي اکن اورڠ يڠ منداڤت هداية."],
      src:["Surah an-Nahl, ayat 125","سورة النحل، ايات ١٢٥"],
      tip:["Dengan kebijaksanaan Rasulullah, baginda berjaya mempersaudarakan kaum Aus dan Khazraj yang lama bermusuhan.","دڠن کبيجقسناٴن رسول الله، بڬيندا برجاي ممڤرسوداراکن قوم اوس دان خزرج يڠ لام برموسوهن."],

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:    () => tone([[523,.12],[784,.2]]),
  tick:  () => tone([[740,.08,"triangle"]]),
  no:    () => tone([[220,.18,"square"],[175,.2,"square"]]),
  crack: () => tone([[1400,.04,"square"],[900,.05,"square"],[1800,.08,"triangle"]]),
  step:  () => tone([[392,.08,"triangle"],[523,.1,"triangle"]]),
  echo:  () => tone([[660,.12],[660,.12],[660,.16]]),
  win:   () => tone([[523,.14],[659,.14],[784,.14],[1046,.32]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const cleanSpeech = s => s.replace(/"[^"]*"/g," ").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/___/g," ... ").replace(/…/g," ... ").replace(/[⟷•]/g,", ").replace(/\ba\.s\./g,"alaihissalam").replace(/\bs\.a\.w\./gi,"sallallahu alaihi wasallam").replace(/\bms\.\s*/g,"muka surat ").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanSpeech(text));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🐾 ${hint || L("Tergelincir sedikit! Cuba lagi.","ترڬلينچير سديکيت! چوبا لاڬي.")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(extra){
  if(document.querySelector(".fb")) return;
  stopTimers(); sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${pandu("yay")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p>${extra?`<p class="bonus">${extra}</p>`:""}</div></div>
    <button class="btn go" data-act="next">${L("Teruskan mendaki","تروسکن منداکي")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}

/* ===================== KEPUTUSAN ===================== */
function renderResult(){
  stopTimers();
  const stars = starsFor(S.miss), id = S.st.id;
  const prev = best[id]||0, first = !prev;
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result"; S.res = { stars, first, isNew: stars > prev };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const r = S.res, fin = S.st.id==="final";
  const idx = fin ? -1 : STATIONS.findIndex(s=>s.id===S.st.id);
  const nxt = !fin && idx < STATIONS.length-1 ? STATIONS[idx+1] : null;
  const mp = fin ? ["Tahniah! Anda menawan Puncak Iman!","تهنية! اندا منون ڤونچق ايمان!"]
    : r.stars===3 ? ["Pendakian sempurna!","ڤنداکين سمڤورنا!"] : r.stars===2 ? ["Pendakian yang baik!","ڤنداکين يڠ باٴيق!"] : ["Anda sampai ke kem! Cuba lagi untuk 3 bintang.","اندا سمڤاي ک کيم! چوبا لاڬي اونتوق ٣ بينتڠ."];
  const msg = T(mp);
  app.innerHTML = head() + `<section class="card res" style="--sc:${S.st.c}">
    ${pandu("yay")}<h2>${msg}</h2>
    <div class="stars" aria-label="${r.stars} ${L("bintang","بينتڠ")}">${starRow(r.stars)}</div>
    <p>${L(`Tergelincir: ${S.miss} kali`,`ترڬلينچير: ${S.miss} کالي`)}</p>
    ${fin ? `<div class="gotst"><span>🏆</span>${L("Bendera di puncak gunung! Semua lencana dikumpul.","بنديرا د ڤونچق ڬونوڠ! سموا لنچان دکومڤول.")}</div>`
      : `<div class="gotst"><span>${S.st.sticker}</span>${r.first ? L("Lencana baharu!","لنچان بهارو!") : L("Lencana kem ini","لنچان کيم اين")}</div>`}
    ${nxt ? `<button class="btn go" data-act="open" data-id="${nxt.id}">⛺ ${L("Kem seterusnya","کيم ستروسڽ")}: ${T(nxt.t)}</button>` : ""}
    ${!fin && !nxt && allDone() ? `<button class="btn go" data-act="final">🏆 ${L("Cabaran Puncak","چابرن ڤونچق")}</button>` : ""}
    <button class="btn alt" data-act="again">🔁 ${L("Daki semula","داکي سمولا")}</button>
    <button class="btn" data-act="map">🗺️ ${L("Peta gunung","ڤتا ڬونوڠ")}</button></section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(mp)); }
  window.scrollTo(0,0);
}

/* ===================== PERMAINAN ===================== */
const GAMES = {
  /* Kabus: kompas dalam kabus — pilih arah (jawapan) yang betul */
  kabus(el, g){
    const DIRS = [["U","ش"],["T","ت"],["S","س"],["B","ب"]];
    const opts = mix(g.a.map((t,i)=>({t, ok:i===0})));
    el.innerHTML = `${g.ar?`<div class="qar ar" lang="ar">${g.ar}</div>`:""}
      <div class="compass"><div class="needle" id="needle" aria-hidden="true">🧭</div>
      ${opts.map((o,i)=>`<button class="tile dir opt" data-ok="${o.ok?1:0}" data-i="${i}"><i>${T(DIRS[i])}</i>${T(o.t)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled || document.querySelector(".fb")) return;
      const i = +b.dataset.i;
      el.querySelector("#needle").style.transform = `rotate(${[0,90,180,270][i]}deg)`;
      if(b.dataset.ok==="1"){ b.classList.add("right"); clearHint(); el.querySelector("#needle").textContent = "🚩"; setTimeout(win, 450); }
      else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Arah itu salah. Kabus masih tebal, cuba arah lain!","اره ايت ساله. کابوس ماسيه تبل، چوبا اره لاٴين!")); }
    }));
  },

  /* Kapak: pecahkan dua bongkah ais yang sepadan */
  kapak(el, g){
    const L1 = g.pairs.map((p,i)=>({t:p[0], i})), R1 = mix(g.pairs.map((p,i)=>({t:p[1], i})));
    let sel = null, done = 0;
    el.innerHTML = `<div class="icewall"><div class="icecol">${L1.map(p=>`<button class="tile ice" data-side="a" data-i="${p.i}">🧊 ${T(p.t)}</button>`).join("")}</div>
      <div class="icecol">${R1.map(p=>`<button class="tile ice" data-side="b" data-i="${p.i}">${T(p.t)}</button>`).join("")}</div></div>
      <div class="cnt" id="kcnt">⛏️ ${L("Pilih satu ais di kiri, kemudian pasangannya.","ڤيليه ساتو اءيس د سبله، کمودين ڤاسڠنڽ.")}</div>`;
    el.querySelectorAll(".ice").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(!sel || sel.dataset.side===b.dataset.side){
        el.querySelectorAll(".ice.sel").forEach(x=>x.classList.remove("sel"));
        sel = b; b.classList.add("sel"); sfx.tick(); return;
      }
      if(sel.dataset.i===b.dataset.i){
        sfx.crack(); clearHint(); [sel,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; });
        sel = null; done++; el.querySelector("#kcnt").textContent = `⛏️ ${done} / ${g.pairs.length}`;
        if(done===g.pairs.length) setTimeout(win, 400);
      } else { const a = sel; a.classList.remove("sel"); sel = null; oops(b, L("Ais itu bukan pasangannya. Cuba lagi!","اءيس ايت بوکن ڤاسڠنڽ. چوبا لاڬي!")); }
    }));
  },

  /* Cerun: ayat meluncur turun; jawab Betul/Salah sebelum ia sampai ke bawah (bonus laju) */
  cerun(el, g){
    const items = mix(g.items); let k = 0, fast = 0, t0 = Date.now();
    const draw = () => {
      el.innerHTML = `<div class="slope" id="ctxt">${T(items[k][0])}</div>
        <div class="tbar" aria-hidden="true"><i id="tb"></i></div>
        <div class="cbtns"><button class="tile cb" data-v="1">✅ ${L("Betul","بتول")}</button><button class="tile cb" data-v="0">❌ ${L("Salah","ساله")}</button></div>
        <div class="cnt">🎿 ${k+1} / ${items.length} · ⚡ ${fast}</div>`;
      t0 = Date.now(); speak(RU(items[k][0]));
      TIMERS.push(setTimeout(()=>{ const b = el.querySelector("#tb"); if(b){ b.style.transitionDuration = "8s"; b.style.width = "0%"; } }, 30));
      el.querySelectorAll(".cb").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.v===items[k][1]){
          if(Date.now()-t0 < 8000) fast++;
          sfx.step(); clearHint(); k++;
          if(k===items.length){ stopTimers(); win(L(`⚡ Bonus laju: ${fast} / ${items.length}`,`⚡ بونس لاجو: ${fast} / ${items.length}`)); } else draw();
        } else oops(el.querySelector("#ctxt"), items[k][1] ? L("Ayat ini betul!","ايات اين بتول!") : L("Ayat ini salah!","ايات اين ساله!"));
      }));
    };
    draw();
  },

  /* Salji: gulung bola salji dengan menyusun cebisan ayat */
  salji(el, g){
    const pool = mix(g.words.map((w,i)=>({w, i})).concat((g.extra||[]).map(w=>({w, i:-1}))));
    let k = 0;
    el.innerHTML = `<div class="snow"><span class="ball" id="ball" style="width:30px;height:30px" aria-hidden="true"></span><div class="built" id="built"></div></div>
      <div class="flakes">${pool.map(p=>`<button class="tile flake" data-i="${p.i}">❄️ ${T(p.w)}</button>`).join("")}</div>
      <div class="cnt" id="scnt">⛄ 0 / ${g.words.length}</div>`;
    el.querySelectorAll(".flake").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=g.words.length) return;
      if(+b.dataset.i===k){
        sfx.tick(); clearHint(); b.classList.add("used"); b.disabled = true; k++;
        el.querySelector("#built").innerHTML += `<span>${T(g.words[k-1])}</span> `;
        const s = 30 + k*12, ball = el.querySelector("#ball"); ball.style.width = s+"px"; ball.style.height = s+"px";
        el.querySelector("#scnt").textContent = `⛄ ${k} / ${g.words.length}`;
        if(k===g.words.length) setTimeout(win, 450);
      } else oops(b, +b.dataset.i<0 ? L("Cebisan itu tidak termasuk dalam ayat ini.","چبيسن ايت تيدق ترماسوق دالم ايات اين.") : L("Bukan giliran cebisan itu lagi.","بوکن ڬيليرن چبيسن ايت لاڬي."));
    }));
  },

  /* Gema: isi tempat kosong; laungan anda bergema di lembah */
  gema(el, g){
    const opts = mix(g.a.map((t,k)=>({t, k})).concat((g.extra||[]).map(t=>({t, k:-1}))));
    let k = 0;
    const sent = () => { let n = -1; return T(g.text).replace(/___/g, () => { n++; return `<span class="blank ${n<k?"fill":n===k?"cur":""}">${n<k?T(g.a[n]):"?"}</span>`; }); };
    const draw = () => { el.querySelector("#sent").innerHTML = sent(); };
    el.innerHTML = `<p class="sent" id="sent"></p><div class="echoes">${opts.map(o=>`<button class="tile echo" data-k="${o.k}">📣 ${T(o.t)}</button>`).join("")}</div>`;
    draw();
    el.querySelectorAll(".echo").forEach(b => b.addEventListener("click", () => {
      if(b.disabled || k>=g.a.length) return;
      if(+b.dataset.k===k){ sfx.echo(); clearHint(); b.disabled = true; b.classList.add("done"); k++; draw(); if(k===g.a.length) setTimeout(win, 450); }
      else oops(b, L("Gema itu tidak sesuai di tempat kosong ini.","ڬما ايت تيدق سسواي د تمڤت کوسوڠ اين."));
    }));
  },

  /* Panjat: panjat tali; setiap jawapan betul = satu pemegang batu */
  panjat(el, g){
    let k = 0; const n = g.steps.length;
    const draw = () => {
      const st = g.steps[Math.min(k,n-1)], opts = mix(st.a.map((t,i)=>({t, ok:i===0})));
      const knots = g.steps.map((_,i)=>`<span class="knot" style="bottom:${(i+1)/(n+1)*100}%">${i<k?"🟢":"🪨"}</span>`).join("");
      el.innerHTML = `<div class="cliff"><div class="rope" aria-hidden="true"><span class="flag">🚩</span>${knots}
          <span class="climber" style="bottom:${k/(n+1)*100}%">${pandu()}</span></div>
        <div><div class="pstep">🧗 ${L(`Pemegang ${k+1} / ${n}`,`ڤمڬڠ ${k+1} / ${n}`)}</div><p class="pq" id="pq" style="margin:0 0 10px;font-weight:700">${T(st.q)}</p>
          <div class="holds">${opts.map(o=>`<button class="tile hold" data-ok="${o.ok?1:0}">${T(o.t)}</button>`).join("")}</div></div></div>`;
      speak(RU(st.q));
      el.querySelectorAll(".hold").forEach(b => b.addEventListener("click", () => {
        if(b.disabled || k>=n) return;
        if(b.dataset.ok==="1"){
          sfx.step(); clearHint(); k++;
          if(k===n){ b.classList.add("right"); el.querySelector(".climber").style.bottom = (n/(n+1)*100)+"%"; setTimeout(win, 450); } else draw();
        } else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Batu itu longgar! Pilih pemegang lain.","باتو ايت لوڠڬر! ڤيليه ڤمڬڠ لاٴين.")); }
      }));
    };
    draw();
  },

  /* Galas: isi beg galas dengan SEMUA barang (ayat) yang betul, kemudian semak */
  galas(el, g){
    const items = mix(g.items.map((it,i)=>({t:it[0], ok:it[1], i})));
    const need = items.filter(x=>x.ok).length;
    el.innerHTML = `<div class="kits">${items.map(it=>`<button class="tile kit" data-ok="${it.ok}" aria-pressed="false">${T(it.t)}</button>`).join("")}</div>
      <button class="btn go chk" id="chk">🎒 ${L("Semak beg","سمق بيڬ")} (<span id="gn">0</span>)</button>`;
    const cnt = () => { el.querySelector("#gn").textContent = el.querySelectorAll(".kit.in").length; };
    el.querySelectorAll(".kit").forEach(b => b.addEventListener("click", () => {
      if(document.querySelector(".fb")) return;
      const on = !b.classList.contains("in"); b.classList.toggle("in", on); b.setAttribute("aria-pressed", on); sfx.tick(); cnt();
    }));
    el.querySelector("#chk").addEventListener("click", () => {
      if(document.querySelector(".fb")) return;
      const inn = [...el.querySelectorAll(".kit.in")];
      const bad = inn.filter(b=>b.dataset.ok!=="1"), good = inn.length - bad.length;
      if(!bad.length && good===need){ clearHint(); el.querySelectorAll(".kit.in").forEach(b=>b.classList.add("right")); setTimeout(win, 300); return; }
      bad.forEach(b=>{ b.classList.remove("in"); b.classList.add("wrong"); b.setAttribute("aria-pressed", false); setTimeout(()=>b.classList.remove("wrong"), 900); });
      cnt();
      oops(el.querySelector(".kits"), bad.length ? L(`${bad.length} barang tidak sepatutnya dibawa. Ia dikeluarkan dari beg.`,`${bad.length} بارڠ تيدق سڤاتوتڽ دباوا. اي دکلوارکن دري بيڬ.`)
        : L(`Masih ada ${need-good} lagi yang betul. Cari lagi!`,`ماسيه اد ${need-good} لاڬي يڠ بتول. چاري لاڬي!`));
    });
  },

  /* Pondok: hantar setiap barang ke pondok rehat yang betul */
  pondok(el, g){
    const items = mix(g.items); let k = 0;
    const TC = ["#D9622B","#2F6B4F","#3C7DC4","#7A4FB5"];
    const placed = g.cats.map(()=>[]);
    const draw = () => {
      el.innerHTML = `<div class="gears"><div class="tile sel" id="ptxt" style="flex:1 1 100%">${k<items.length?"🎒 "+T(items[k][0]):"🎉"}</div></div>
        <div class="tents" style="--n:${g.cats.length>2?2:g.cats.length}">${g.cats.map((c,i)=>`<button class="tentb" data-c="${i}" style="--tc:${TC[i%TC.length]}">
          <span class="em" aria-hidden="true">${c[1]}</span><b>${T(c[0])}</b><span class="in">${placed[i].map(t=>`<span>✔ ${T(t)}</span>`).join("")}</span></button>`).join("")}</div>
        <div class="cnt">⛺ ${Math.min(k+1,items.length)} / ${items.length}</div>`;
      if(k<items.length) speak(RU(items[k][0]));
      el.querySelectorAll(".tentb").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.c===items[k][1]){ sfx.step(); clearHint(); placed[items[k][1]].push(items[k][0]); k++; draw(); if(k===items.length) setTimeout(win, 400); }
        else oops(b, L("Bukan pondok ini. Baca semula dan cuba lagi!","بوکن ڤوندوق اين. باچ سمولا دان چوبا لاڬي!"));
      }));
    };
    draw();
  },

  /* Jambatan: bina jambatan tali dengan menyusun papan (peristiwa) mengikut urutan */
  jambatan(el, g){
    const n = g.steps.length, planks = mix(g.steps.map((t,i)=>({t, i}))); let k = 0;
    el.innerHTML = `<div class="bridge">${g.steps.map((_,i)=>`<div class="slot ${i===0?"next":""}" data-s="${i}"><b>${i+1}</b><span></span></div>`).join("")}</div>
      <div class="planks">${planks.map(p=>`<button class="tile plank" data-i="${p.i}">🪵 ${T(p.t)}</button>`).join("")}</div>`;
    el.querySelectorAll(".plank").forEach(b => b.addEventListener("click", () => {
      if(k>=n || b.classList.contains("used")) return;
      if(+b.dataset.i===k){
        sfx.step(); clearHint(); b.classList.add("used");
        const s = el.querySelector(`.slot[data-s="${k}"]`); s.classList.remove("next"); s.classList.add("on"); s.querySelector("span").textContent = T(g.steps[k]);
        k++; const nx = el.querySelector(`.slot[data-s="${k}"]`); if(nx) nx.classList.add("next");
        if(k===n) setTimeout(win, 450);
      } else oops(b, L(`Papan itu bukan untuk langkah ${k+1}. Fikir apa yang berlaku dahulu.`,`ڤاڤن ايت بوکن اونتوق لڠکه ${k+1}. فيکير اڤ يڠ برلاکو دهولو.`));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t4-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan kem sebelumnya dahulu 🔒","سلسايکن کيم سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} kem untuk membuka Cabaran Puncak 🏆`,`سلسايکن سموا ${STATIONS.length} کيم اونتوق ممبوک چابرن ڤونچق 🏆`)); }
  else if(a==="map"){ stopTimers(); document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
