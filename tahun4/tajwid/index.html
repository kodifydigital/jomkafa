<html lang="ms">
<head>
<meta charset="utf-8">

<title>Makmal Tajwid • Tajwid Tahun 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800;900&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tajwid Tahun 4: "Makmal Tajwid" — makmal sains, tabung uji, bikar, Robo Rabi si robot saintis ===== */
:root{
  --sky1:#2B2A7A; --sky2:#4C3FB0; --bg:#EEF2FF; --card:#FFFFFF; --ink:#1B1A3A; --muted:#5B5A80; --line:#1B1A3A;
  --indigo:#3A2E8F; --violet:#6C4BD8; --teal:#0FA3A3; --teal2:#0B7C86; --lime:#9BE22F; --lime2:#5FAE12; --pink:#FF4FA0; --amber:#FFB020;
  --glass:#DDF5F8; --glass2:#B8E8EE; --ok:#178A5B; --okbg:#DDF7E9; --bad:#D3304A; --badbg:#FFE1E6; --note:#FFF6D6; --tipbg:#E9E6FF; --tipink:#2A1F6E;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0B0B24; --sky2:#1A1850; --bg:#10112A; --card:#1C1D42; --ink:#EEF0FF; --muted:#B4B6DA; --line:#05061A;
    --glass:#163A48; --glass2:#1F5463; --okbg:#123C2C; --badbg:#4A1A26; --note:#3A3218; --tipbg:#2A2560; --tipink:#E2DDFF;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:700;
  background:radial-gradient(circle at 85% 6%,rgba(155,226,47,.25) 0 60px,transparent 160px),linear-gradient(180deg,var(--sky1) 0,var(--sky2) 300px,var(--bg) 760px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-size:19px;line-height:1.85;font-weight:600}
h1,h2,h3,.exo{font-family:"Exo 2","Nunito",sans-serif;font-weight:800;letter-spacing:.2px}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .exo{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700;letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--lime);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 60px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;direction:rtl;unicode-bidi:isolate;line-height:1.9}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.5;
  background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.07) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.07) 31px 32px)}
/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--lime);color:#1B1A3A;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;box-shadow:0 4px 0 var(--line)}
/* hero */
.hero{display:flex;gap:12px;align-items:center;color:#fff;margin:4px 0 14px}
.hero h1{margin:0;font-size:30px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.hero p{margin:6px 0 0;font-size:16px;opacity:.95}
.robo{width:96px;height:110px;flex:0 0 auto}
.robo.sm{width:58px;height:66px}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.robo .ant{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.sttl{color:#fff;margin:6px 0 6px;font-weight:900}
.stickers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.stickers span{width:44px;height:44px;border-radius:12px;border:3px dashed rgba(255,255,255,.6);display:grid;place-items:center;font-size:24px;filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;border:3px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line)}
/* peta: rak makmal dengan paip kaca */
.lab{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:3px solid var(--line);border-radius:26px;padding:18px 10px 14px;
  box-shadow:0 6px 0 var(--line);overflow:hidden}
.lab::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:14px;margin-left:-7px;border-radius:8px;
  background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(184,232,238,.35) 40%,rgba(15,163,163,.45));border:2px solid rgba(27,26,58,.5)}
.lab::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:6px;margin-left:-3px;
  background:repeating-linear-gradient(180deg,var(--lime) 0 10px,transparent 10px 26px);opacity:.8;animation:flow 1.6s linear infinite}
@keyframes flow{to{background-position:0 26px}}
.row{position:relative;display:flex;margin:6px 0;z-index:1}
.row.l{justify-content:flex-start}.row.r{justify-content:flex-end}
.node{position:relative;width:48%;min-height:116px;border:3px solid var(--line);border-radius:20px;background:var(--card);padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 5px 0 var(--line);text-align:center}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.node .flask{position:relative;width:54px;height:58px}
.node .flask svg{width:54px;height:58px}
.node .num{position:absolute;top:-6px;inset-inline-start:-6px;width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff;border:3px solid var(--line);font:900 14px "Exo 2",sans-serif;display:grid;place-items:center}
.node .tic{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:20px}
.node .nm{font-weight:900;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
html[dir="rtl"] .node .nm{font-size:16px;line-height:1.6}
.node .st{font-size:13px;min-height:18px}
.node .st .off{filter:grayscale(1);opacity:.35}
.node.lock{background:#D5D7EA;filter:saturate(.3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .node.lock{background:#2A2B4E}}
.node.lock .tic::after{content:"🔒";position:absolute;inset:-4px -10px auto auto;font-size:16px}
.node.now{outline:4px solid var(--lime);outline-offset:3px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{outline-color:var(--pink)}}
.node .guide{position:absolute;top:-30px;inset-inline-end:-18px;z-index:2}
.node .guide .robo{width:48px;height:56px}
.reactor{display:flex;justify-content:center;margin-bottom:10px;position:relative;z-index:1}
.node.final{width:80%;min-height:120px;background:linear-gradient(180deg,#FFE9F4,#fff)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .node.final{background:linear-gradient(180deg,#3A2050,var(--card))}}
.node.final .core{font-size:40px;line-height:1;filter:drop-shadow(0 0 8px var(--pink))}
.door{position:relative;z-index:1;text-align:center;color:#fff;font-weight:900;margin-top:10px;background:var(--indigo);border:3px solid var(--line);border-radius:14px;padding:6px}
</style>
<style>
/* kad baca */
.shead{display:flex;gap:10px;align-items:center;color:#fff;margin-bottom:10px}
.shead h2{margin:0;font-size:22px;line-height:1.2}
.shead small{opacity:.9;font-size:14px}
.badge{width:52px;height:52px;flex:0 0 auto;border-radius:16px;background:var(--c);border:3px solid var(--line);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 var(--line)}
.card{position:relative;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line);margin-bottom:14px;
  border-top:10px solid var(--sc,var(--teal))}
.rpic{font-size:44px;text-align:center}
.rh{margin:4px 0 8px;font-size:21px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.rtext{margin:6px 0}
.rlist{margin:6px 0;padding-inline-start:22px}
.rlist li{margin:4px 0;animation:pop .35s both;animation-delay:calc(var(--i)*.06s)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.abox{background:var(--glass);border:3px solid var(--line);border-radius:16px;padding:10px 12px;margin:10px 0;text-align:center}
.abox .ar{font-size:30px;display:block}
.abox .mk{display:block;font-size:15px;color:var(--muted)}
.abox small{display:block;color:var(--muted);font-size:13px}
.exs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.exs span{background:var(--glass);border:2px solid var(--line);border-radius:12px;padding:0 10px;font-size:24px}
.tip{display:flex;gap:8px;background:var(--tipbg);color:var(--tipink);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:16px}
.tip.am{background:var(--note);color:var(--ink)}
.ref{font-size:13px;color:var(--muted);margin-top:8px}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:54px;border:3px solid var(--line);border-radius:16px;background:var(--teal);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);padding:6px 12px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.go{background:var(--violet);width:100%}
.btn.alt{background:var(--card);color:var(--ink);width:100%}
.btn:disabled{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--glass2)}
.dots i.on{background:var(--violet);width:24px;border-radius:6px}
.say{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--amber);font-size:18px}
/* main */
.prog{position:relative;height:30px;border:3px solid var(--line);border-radius:999px;background:var(--glass);margin:0 0 12px;overflow:hidden}
.prog .liq{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,var(--teal),var(--lime));transition:width .4s}
.prog .bub{position:absolute;inset:0;background:radial-gradient(circle at 20% 60%,rgba(255,255,255,.7) 0 3px,transparent 4px),radial-gradient(circle at 55% 35%,rgba(255,255,255,.6) 0 2px,transparent 3px);background-size:60px 30px;animation:rise 2s linear infinite}
@keyframes rise{to{background-position:0 -30px}}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font:900 14px "Exo 2",sans-serif;color:var(--ink)}
.q{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.q p{margin:0 0 8px;font-size:19px}
.qar{text-align:center;font-size:32px;background:var(--glass);border:3px dashed var(--teal2);border-radius:16px;padding:6px 10px;margin:4px 0 10px}
.hint{background:var(--note);border-radius:14px;padding:8px 12px;margin-top:10px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-width:0;overflow-wrap:anywhere;min-height:58px;border:3px solid var(--line);border-radius:16px;background:var(--card);font-weight:900;box-shadow:0 4px 0 var(--line);padding:6px 8px}
.opt .ar{font-size:26px}
.opt.right,.chip.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);opacity:.6}
/* mikroskop */
.scope{display:flex;flex-direction:column;align-items:center;margin-bottom:12px}
.lens{width:min(260px,72vw);aspect-ratio:1;border-radius:50%;border:10px solid var(--indigo);background:radial-gradient(circle,#fff 0 55%,var(--glass) 100%);display:grid;place-items:center;
  box-shadow:inset 0 0 0 4px var(--line),0 6px 0 var(--line);overflow:hidden;padding:18px;text-align:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lens{background:radial-gradient(circle,#26285A 0 55%,var(--glass) 100%)}}
.lens .ar{font-size:30px;filter:blur(3px);transition:filter .4s,font-size .4s}
.lens.focus .ar{filter:none;font-size:38px}
.knob{margin-top:-14px;z-index:1;border:3px solid var(--line);border-radius:999px;background:var(--amber);font-weight:900;padding:6px 16px;box-shadow:0 4px 0 var(--line)}
/* tabung uji */
.smps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.smp{min-height:52px;min-width:64px;border:3px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:2px 10px;font-weight:900}
.smp .ar{font-size:24px}
.smp.sel{background:var(--lime);color:#1B1A3A;transform:translateY(-4px)}
.smp.gone{visibility:hidden}
.racks{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.tube{min-width:0;display:flex;flex-direction:column;align-items:center;border:none;background:none;padding:0}
.tube .gl{position:relative;width:62px;height:150px;border:3px solid var(--line);border-top:none;border-radius:0 0 31px 31px;background:rgba(221,245,248,.6);overflow:hidden}
.tube .gl::before{content:"";position:absolute;top:0;left:-6px;right:-6px;height:8px;background:var(--line);border-radius:4px}
.tube .lq{position:absolute;inset:auto 0 0 0;height:var(--h,0%);background:var(--tc,var(--teal));opacity:.75;transition:height .4s}
.tube .in{position:absolute;inset:10px 2px 8px;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;overflow:hidden}
.tube .in span{font-size:13px;line-height:1.3;background:rgba(255,255,255,.85);color:#1B1A3A;border-radius:8px;padding:0 4px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tube .in .ar{font-size:15px}
.tube .tl{margin-top:6px;font-size:14px;font-weight:900;line-height:1.25;text-align:center;overflow-wrap:anywhere;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 6px;max-width:100%}
html[dir="rtl"] .tube .tl{font-size:15px;line-height:1.6}
/* bikar */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-width:58px;min-height:56px;border:3px solid var(--line);border-radius:50%;background:var(--card);font-weight:900;box-shadow:0 4px 0 var(--line);padding:4px 10px}
.chip.wide{border-radius:16px}
.chip .ar{font-size:26px}
.chip.sel{background:var(--teal);color:#fff}
.beaker{position:relative;margin:14px auto 10px;width:150px;height:110px;border:4px solid var(--line);border-top:none;border-radius:0 0 22px 22px;background:rgba(221,245,248,.5);overflow:hidden}
.beaker .lq{position:absolute;inset:auto 0 0 0;height:var(--h,6%);background:linear-gradient(180deg,var(--lime),var(--teal));transition:height .35s}
.beaker b{position:absolute;inset:0;display:grid;place-items:center;font:900 22px "Exo 2",sans-serif;color:var(--ink)}
/* formula */
.fx{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:6px 0 14px;direction:ltr}
.fxb{min-width:70px;min-height:58px;border:3px solid var(--line);border-radius:14px;background:var(--glass);display:grid;place-items:center;padding:4px 8px;font-weight:900;text-align:center}
.fxb .ar{font-size:26px}
.fxb.blank{background:var(--note);border-style:dashed;font-size:26px}
.fxo{font:900 28px "Exo 2",sans-serif;color:var(--violet)}
/* label */
.lbl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lbl .col{display:flex;flex-direction:column;gap:8px}
.lbl button{min-width:0;overflow-wrap:anywhere;min-height:56px;border:3px solid var(--line);border-radius:14px;background:var(--card);font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--line);padding:4px 6px}
.lbl .fl{border-radius:14px 14px 24px 24px;background:var(--glass)}
.lbl .fl .ar{font-size:22px}
.lbl .sel{background:var(--lime);color:#1B1A3A}
.lbl .done{background:var(--okbg);border-color:var(--ok);opacity:.7}
/* magnet */
.mag{text-align:center}
.mag .stm{border:3px solid var(--line);border-radius:18px;background:var(--glass);padding:14px;font-size:18px;min-height:90px;display:grid;place-items:center;margin-bottom:12px}
.mag .poles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pole{min-width:0;min-height:70px;border:3px solid var(--line);border-radius:18px;font-weight:900;font-size:19px;color:#fff;box-shadow:0 5px 0 var(--line)}
.pole.p{background:var(--ok)}.pole.n{background:var(--bad)}
.mag .cnt{font-size:14px;color:var(--muted);margin-top:8px}
/* timbang */
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.slot{min-height:52px;border:3px dashed var(--muted);border-radius:14px;display:flex;align-items:center;gap:8px;padding:4px 10px}
.slot i{font-style:normal;font:900 16px "Exo 2",sans-serif;width:30px;height:30px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.slot.fill{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.wts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wt{min-width:0;min-height:54px;border:3px solid var(--line);border-radius:14px 14px 8px 8px;background:#C9CBE0;color:#1B1A3A;font-weight:900;padding:4px 12px;box-shadow:0 4px 0 var(--line);overflow-wrap:anywhere}
.wt .ar{font-size:22px}
.wt.gone{visibility:hidden}
/* eksperimen */
.lab-steps{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.lab-steps span{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font:900 15px "Exo 2",sans-serif;background:var(--card)}
.lab-steps span.on{background:var(--amber)}.lab-steps span.ok{background:var(--lime)}
.sq{font-weight:900;margin:4px 0 10px}
.log{font-size:15px;color:var(--muted);margin-top:10px}
</style>
<style>
/* maklum balas, keputusan, toast, konfeti */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:640px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 -4px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .robo{width:58px;height:66px;flex:0 0 auto}
.fb strong{font:900 22px "Exo 2",sans-serif;color:var(--ok)}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif}
.fb p{margin:2px 0;font-size:16px}
.fast{display:inline-block;background:var(--amber);color:#1B1A3A;border-radius:999px;padding:0 10px;font-size:14px}
.res{text-align:center}
.res .robo{width:120px;height:136px}
.stars{font-size:46px;display:flex;justify-content:center;gap:6px}
.stars span{animation:pop .5s both}
.stars .off{filter:grayscale(1);opacity:.3}
.gotst{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--note);border-radius:16px;padding:8px;margin:10px 0}
.gotst span{font-size:40px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;max-width:90vw;font-size:16px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[660,.12],[990,.18]]),
  tick: () => tone([[820,.07,"triangle"]]),
  no:   () => tone([[200,.18,"square"],[160,.2,"square"]]),
  pop:  () => tone([[1000,.05,"triangle"],[1400,.06,"triangle"]]),
  zap:  () => tone([[400,.05,"sawtooth"],[800,.07,"sawtooth"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.3]])
};

/* ---------- Suara (Rumi sahaja; tulisan Arab dibuang, Al-Quran tidak dibaca mesin) ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
function clean(text){
  return text.replace(AR_RE," ").replace(/[ـ]/g," ").replace(/["“”]\s*["“”]/g," ").replace(/\(\s*\)/g," ").replace(/[➕]/g," tambah ").replace(/[➖]/g," tolak ")
    .replace(/\s+([.,:;!?])/g,"$1").replace(/\s+/g," ").trim();
}
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  const s = clean(text); if(!s || !/[a-z]/i.test(s)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🤖 ${hint || L("Hmm, eksperimen gagal. Cuba lagi!","همم، ايكسڤيريمين ڬاڬل. چوبا لاڬي!")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Tepat sekali!","تڤت سکالي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fast = Date.now() - (S.t0||0) < 15000;
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${robo()}<div><strong>${T(p)}</strong><p>${T(g.e)}</p>${fast?`<span class="fast">⚡ ${L("Tindak balas pantas!","تيندق بالس ڤنتس!")}</span>`:""}</div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Kamu saintis tajwid yang hebat.","چمرلڠ! كامو ساءينتيس تجويد يڠ هيبت."] : stars===2 ? ["Bagus! Ulang eksperimen untuk 3 bintang.","باڬوس! اولڠ ايكسڤيريمين اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom ulang eksperimen.","شاباس كران منچوبا! جوم اولڠ ايكسڤيريمين."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${robo("bob")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Lencana saintis baharu!","لنچان ساءينتيس بهارو!")}</div>` : ""}
      ${openedFinal ? `<p><b>⚛️ ${L("Reaktor Tajwid kini dibuka!","رياکتور تجويد كيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🧪 ${L("Kembali ke rak makmal","کمبالي ک راق مكمل")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Ulang eksperimen","اولڠ ايكسڤيريمين")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== PERMAINAN MAKMAL ===================== */
const GAMES = {
  /* Magnet: kenyataan ditarik ke kutub ➕ BETUL atau ➖ SALAH, satu demi satu */
  magnet(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let k = 0;
    const draw = () => {
      const it = g.items[order[k]];
      el.innerHTML = `<div class="mag"><div class="stm" data-k="${order[k]}"><span>🧲 ${T(it[0])}</span></div>
        <div class="poles"><button class="pole p" data-v="1">➕ ${L("BETUL","بتول")}</button><button class="pole n" data-v="0">➖ ${L("SALAH","ساله")}</button></div>
        <div class="cnt">${k+1} / ${g.items.length}</div></div>`;
      speak(RU(it[0]));
      el.querySelectorAll(".pole").forEach(b => b.addEventListener("click", () => {
        if(+b.dataset.v === g.items[order[k]][1]){ sfx.zap(); clearHint(); k++; if(k===g.items.length) win(); else draw(); }
        else oops(el.querySelector(".stm"), L("Kutub magnet menolak! Fikir semula.","كوتوب مڬنيت منولق! فيكير سمولا."));
      }));
    };
    draw();
  },

  /* Bikar: pilih SEMUA bahan yang betul, kemudian Uji */
  bikar(el, g){
    const items = shuffle(g.items.map((x,i)=>({x:x[0], ok:x[1], i}))), need = g.items.filter(x=>x[1]).length; let done = false;
    el.innerHTML = `<div class="chips">${items.map(o=>`<button class="chip ${isAr(o.x)&&o.x.length<3?"":"wide"}" data-i="${o.i}" data-ok="${o.ok}" aria-pressed="false">${TX(o.x)}</button>`).join("")}</div>
      <div class="beaker"><span class="lq"></span><b>0</b></div>
      <button class="btn go chk">🧪 ${L("Uji","اوجي")}</button>`;
    const upd = () => { const n = el.querySelectorAll(".chip.sel").length; el.querySelector(".beaker b").textContent = n; el.querySelector(".beaker .lq").style.setProperty("--h", (6+n/Math.max(need,1)*80)+"%"); };
    el.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      if(done) return; b.classList.toggle("sel"); b.setAttribute("aria-pressed", b.classList.contains("sel")); sfx.pop(); upd();
    }));
    el.querySelector(".chk").addEventListener("click", () => {
      if(done) return;
      const sel = [...el.querySelectorAll(".chip.sel")], wrongIn = sel.filter(b=>b.dataset.ok==="0").length, got = sel.length - wrongIn;
      if(!wrongIn && got===need){ done = true; sel.forEach(b=>b.classList.add("right")); setTimeout(win, 400); return; }
      oops(el.querySelector(".beaker"), wrongIn ? L(`Ada ${wrongIn} bahan yang salah dalam bikar.`,`اد ${wrongIn} بهن يڠ ساله دالم بيكر.`) : L(`Belum cukup: perlu ${need}, ada ${got}.`,`بلوم چوكوڤ: ڤرلو ${need}، اد ${got}.`));
    });
  },

  /* Label: pilih kelalang, kemudian tampal label yang sepadan */
  label(el, g){
    const n = g.pairs.length, ord = mix(g.pairs.map((_,i)=>i)); let pick = null, done = 0;
    el.innerHTML = `<div class="lbl"><div class="col">${g.pairs.map((p,i)=>`<button class="fl" data-i="${i}">⚗️ ${TX(p[0])}</button>`).join("")}</div>
      <div class="col">${ord.map(i=>`<button class="lb" data-i="${i}">🏷️ ${TX(g.pairs[i][1])}</button>`).join("")}</div></div>`;
    el.querySelectorAll(".fl").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      el.querySelectorAll(".fl").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); pick = b; sfx.tick();
    }));
    el.querySelectorAll(".lb").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(!pick){ toast(L("Pilih kelalang dahulu ⚗️","ڤيليه كلالڠ دهولو ⚗️")); return; }
      if(b.dataset.i === pick.dataset.i){ b.classList.add("done"); pick.classList.remove("sel"); pick.classList.add("done"); pick = null; done++; sfx.tick(); clearHint(); if(done===n) setTimeout(win, 350); }
      else oops(b, L("Label itu bukan untuk kelalang ini.","لابل ايت بوكن اونتوق كلالڠ اين."));
    }));
  },

  /* Mikroskop: putar tombol fokus untuk menjelaskan sampel, kemudian jawab */
  mikroskop(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    el.innerHTML = `<div class="scope"><div class="lens"><span class="ar" lang="ar">${g.ar}</span></div><button class="knob">🔎 ${L("Putar fokus","ڤوتر فوكوس")}</button></div>
      <div class="opts" hidden>${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>`;
    el.querySelector(".knob").addEventListener("click", e => { el.querySelector(".lens").classList.add("focus"); el.querySelector(".opts").hidden = false; e.currentTarget.hidden = true; sfx.pop(); });
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(b.dataset.ok==="1"){ done = true; b.classList.add("right"); setTimeout(win, 400); }
      else { b.classList.add("wrong"); oops(b, L("Lihat sampel di bawah kanta dengan teliti.","ليهت سمڤل د باوه کنتا دڠن تليتي.")); }
    }));
  },

  /* Tabung uji: pilih sampel, kemudian tuang ke tabung yang betul */
  tabung(el, g){
    const COLS = ["#0FA3A3","#FF4FA0","#FFB020","#6C4BD8"], fill = g.tubes.map(()=>0), per = {};
    g.items.forEach(it => per[it[1]] = (per[it[1]]||0)+1);
    const items = shuffle(g.items.map((x,i)=>({x:x[0], c:x[1], i}))); let pick = null, left = items.length;
    el.innerHTML = `<div class="smps">${items.map(o=>`<button class="smp" data-i="${o.i}" data-c="${o.c}">${TX(o.x)}</button>`).join("")}</div>
      <div class="racks" style="--n:${g.tubes.length}">${g.tubes.map((t,c)=>`<button class="tube" data-c="${c}" style="--tc:${COLS[c]}"><span class="gl"><span class="lq"></span><span class="in"></span></span><span class="tl">${TX(t)}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".smp").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".smp").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); pick = b; sfx.tick();
    }));
    el.querySelectorAll(".tube").forEach(t => t.addEventListener("click", () => {
      if(!pick){ toast(L("Pilih sampel dahulu 🧪","ڤيليه سمڤل دهولو 🧪")); return; }
      const c = +t.dataset.c;
      if(+pick.dataset.c === c){
        fill[c]++; t.querySelector(".lq").style.setProperty("--h", Math.round(fill[c]/per[c]*85)+"%");
        const s = document.createElement("span"); s.innerHTML = pick.innerHTML; t.querySelector(".in").appendChild(s);
        pick.classList.remove("sel"); pick.classList.add("gone"); pick.disabled = true; pick = null; left--; sfx.pop(); clearHint();
        if(!left) setTimeout(win, 400);
      } else oops(t, L("Tindak balas salah! Sampel itu bukan untuk tabung ini.","تيندق بالس ساله! سمڤل ايت بوكن اونتوق تابوڠ اين."));
    }));
  },

  /* Formula: lengkapkan persamaan makmal (petak kosong ?) */
  formula(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    const part = (p,i) => i===g.b ? `<span class="fxb blank">?</span>` : (p==="+"||p==="="||p==="→") ? `<span class="fxo">${p}</span>` : `<span class="fxb">${TX(p)}</span>`;
    el.innerHTML = `<div class="fx">${g.f.map(part).join("")}</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(b.dataset.ok==="1"){ done = true; b.classList.add("right"); const bl = el.querySelector(".fxb.blank"); bl.classList.remove("blank"); bl.innerHTML = TX(opts[+b.dataset.i].x); setTimeout(win, 450); }
      else { b.classList.add("wrong"); oops(b, L("Formula itu tidak seimbang. Cuba lagi.","فورمولا ايت تيدق سايمبڠ. چوبا لاڬي.")); }
    }));
  },

  /* Timbang: letak pemberat ke atas neraca mengikut urutan yang betul */
  timbang(el, g){
    const n = g.items.length, ord = mix(g.items.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="slots">${g.items.map((_,i)=>`<div class="slot" data-s="${i}"><i>${i+1}</i><span></span></div>`).join("")}</div>
      <div class="wts">${ord.map(i=>`<button class="wt" data-i="${i}">⚖️ ${TX(g.items[i])}</button>`).join("")}</div>`;
    el.querySelectorAll(".wt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(+b.dataset.i === k){
        const s = el.querySelector(`.slot[data-s="${k}"]`); s.classList.add("fill"); s.querySelector("span").innerHTML = TX(g.items[k]);
        b.classList.add("gone"); b.disabled = true; k++; sfx.tick(); clearHint();
        if(k===n) setTimeout(win, 400);
      } else oops(b, L(`Neraca senget! Cari pemberat nombor ${k+1}.`,`نراچ سڠيت! چاري ڤمبرت نومبور ${k+1}.`));
    }));
  },

  /* Eksperimen: analisis sampel langkah demi langkah */
  eksperimen(el, g){
    let k = 0; const logs = [];
    const draw = () => {
      const st = g.steps[k], opts = shuffle(st.a.map((x,i)=>({x, ok:i===0})));
      el.innerHTML = `<div class="lab-steps">${g.steps.map((_,i)=>`<span class="${i<k?"ok":i===k?"on":""}">${i<k?"✓":i+1}</span>`).join("")}</div>
        <p class="sq">${L("Langkah","لڠكه")} ${k+1}: ${T(st.q)}</p>
        <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>
        ${logs.length?`<div class="log">📝 ${logs.join(" → ")}</div>`:""}`;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(b.classList.contains("wrong") || b.disabled) return;
        if(b.dataset.ok==="1"){
          el.querySelectorAll(".opt").forEach(x=>x.disabled=true); b.classList.add("right"); logs.push(TX(st.a[0])); sfx.tick(); clearHint(); k++;
          if(k===g.steps.length) setTimeout(win, 400); else setTimeout(draw, 350);
        } else { b.classList.add("wrong"); oops(b, L("Data tidak sepadan. Periksa sampel sekali lagi.","دات تيدق سڤادن. ڤريقسا سمڤل سکالي لاڬي.")); }
      }));
    };
    draw();
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan meja makmal sebelumnya dahulu 🔒","سلسايكن ميجا مكمل سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} meja makmal untuk menghidupkan Reaktor Tajwid ⚛️`,`سلسايكن سموا ${STATIONS.length} ميجا مكمل اونتوق مڠهيدوڤكن رياکتور تجويد ⚛️`)); }
  else if(a==="map"){ renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa (selepas tukar tulisan/suara) tanpa mengulang bunyi/konfeti
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
