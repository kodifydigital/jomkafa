<head>

<title>Kilang Akhbar Jawi • Jawi Tahun 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Jawi Tahun 6: "Kilang Akhbar Jawi" — bilik berita, atur huruf, mesin cetak, van edaran ===== */
:root{
  --bg1:#EFE6CF; --bg2:#E2D5B5; --paper:#FBF6E9; --paper2:#F3EAD3; --ink:#1B1B1F; --muted:#5D574A;
  --line:#1B1B1F; --red:#C8102E; --red2:#8E0B21; --mus:#F2B705; --teal:#1D7874; --blue:#2D5DA1;
  --ok:#1E8A4C; --okbg:#DDF5E5; --bad:#C8102E; --badbg:#FBE0E3; --note:#FFF2B8; --grid:rgba(27,27,31,.07);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#1A1914; --bg2:#0F0E0B; --paper:#26241D; --paper2:#302D24; --ink:#F3EBD8; --muted:#BDB39C;
    --line:#E9DFC6; --okbg:#173A26; --badbg:#47161E; --note:#3D3515; --grid:rgba(243,235,216,.06); color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito","Noto Naskh Arabic",system-ui,sans-serif;color:var(--ink);font-weight:700;overflow-x:hidden;
  background:
    repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 26px),
    linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
[dir=rtl] body{font-family:"Noto Naskh Arabic","Nunito",serif}
h1,h2,h3,.ttl{font-family:"Alfa Slab One","Nunito",serif;font-weight:400;margin:0;line-height:1.2}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.jw,.ar{font-family:"Noto Naskh Arabic","Amiri",serif;direction:rtl;unicode-bidi:isolate;font-weight:600}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:10px 14px 90px;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:10px;border:3px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;color:var(--ink);padding:0 10px;box-shadow:3px 3px 0 var(--line)}
.ib:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.pill{background:var(--paper);border:3px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:800;box-shadow:3px 3px 0 var(--line)}
/* masthead */
.mast{background:var(--paper);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line);padding:10px 12px 12px;position:relative}
.mast .rule{border-top:3px double var(--line);border-bottom:1px solid var(--line);height:6px;margin:6px 0}
.mast h1{font-size:clamp(22px,7vw,30px);text-align:center;letter-spacing:.5px;color:var(--ink)}
.mast h1 b{color:var(--red);font-weight:400}
.mast .ed{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);font-family:Nunito,sans-serif;flex-wrap:wrap}
.mast .lead{display:flex;gap:10px;align-items:center;margin-top:8px}
.mast .lead p{margin:0;font-size:15px;line-height:1.55}
.pel{width:96px;height:96px;flex:0 0 auto}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.yay{animation:yay .7s ease-in-out 3}
@keyframes yay{50%{transform:scale(1.1) rotate(5deg)}}
.sttl{margin:16px 2px 6px;font-size:15px;display:inline-block;background:var(--ink);color:var(--paper);padding:4px 12px;border-radius:4px}
.stickers{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;background:var(--paper);border:2px dashed var(--line);border-radius:8px;padding:8px}
.stickers span{font-size:26px;text-align:center;filter:grayscale(1) opacity(.3)}
.stickers span.got{filter:none;animation:yay .6s}
/* ---------- peta: barisan pengeluaran akhbar ---------- */
.line{position:relative;margin-top:16px;padding:4px 0 10px}
.line::before{content:"";position:absolute;inset-inline-start:50%;top:10px;bottom:120px;width:14px;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,var(--paper) 0 10px,var(--paper2) 10px 12px);border-inline:2px solid var(--line);opacity:.9}
[dir=rtl] .line::before{transform:translateX(50%)}
.zone{position:relative;z-index:1;text-align:center;margin:18px 0 6px}
.zone span{display:inline-block;background:var(--red);color:#fff;border:3px solid var(--line);padding:5px 14px;font-size:14px;box-shadow:3px 3px 0 var(--line);transform:rotate(-1.5deg)}
.row{display:flex;margin:14px 0;position:relative;z-index:1}
.row.l{justify-content:flex-start}.row.r{justify-content:flex-end}
.node{width:72%;min-height:92px;display:flex;align-items:center;gap:10px;padding:10px;border:3px solid var(--line);background:var(--paper);box-shadow:4px 4px 0 var(--line);text-align:start;position:relative;border-radius:4px}
.node:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.node::after{content:"";position:absolute;inset:5px;border:1px solid var(--grid);pointer-events:none}
.plate{flex:0 0 60px;height:60px;display:grid;place-items:center;font-size:30px;background:var(--c);border:3px solid var(--line);border-radius:6px;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.plate .num{position:absolute;top:-10px;inset-inline-end:-10px;background:var(--mus);color:#1B1B1F;border:2px solid var(--line);border-radius:4px;min-width:26px;height:24px;font-size:12px;display:grid;place-items:center;font-family:Nunito,sans-serif;font-weight:800;padding:0 3px}
.ninfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.pg{font-size:12px;color:var(--muted);font-family:Nunito,sans-serif;direction:ltr;unicode-bidi:isolate;text-align:start}
.st{font-size:13px;letter-spacing:-2px}
.st .off{filter:grayscale(1) opacity(.35)}
.stamp{position:absolute;bottom:6px;inset-inline-end:8px;font-family:"Alfa Slab One",serif;font-size:11px;color:var(--red);border:2px solid var(--red);padding:0 5px;transform:rotate(-10deg);opacity:.85;background:var(--paper)}
.node.lock{opacity:1;filter:saturate(.35) brightness(.95)}.node.lock .plate{filter:grayscale(.9)}
.node.lock .plate::after{content:"🔒";position:absolute;font-size:18px;bottom:-8px;inset-inline-start:-8px}
.node.now{outline:4px solid var(--mus);outline-offset:2px}
.pen{position:absolute;top:-26px;inset-inline-start:-4px;font-size:26px;animation:bob 2s ease-in-out infinite}
.dock{margin-top:22px;text-align:center;position:relative;z-index:1}
.node.final{width:100%;justify-content:center;background:linear-gradient(135deg,#1B1B1F,#3A1218);color:#FBF6E9;border-color:var(--mus);box-shadow:5px 5px 0 var(--red)}
.node.final .plate{background:var(--mus);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 18px var(--mus)}}
.node.final .pg{color:#F2D98A}
.road{margin-top:10px;height:22px;background:repeating-linear-gradient(90deg,var(--mus) 0 22px,transparent 22px 40px) center/100% 4px no-repeat,#3A3A40;border-radius:6px;border:2px solid var(--line)}
.foot{margin-top:8px;font-size:14px;color:var(--muted)}
</style>
<style>
/* ---------- skrin stesen ---------- */
.shead{display:flex;align-items:center;gap:10px;margin:4px 0 10px;background:var(--paper);border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);padding:8px 10px}
.shead .plate{flex:0 0 52px;height:52px;font-size:26px}
.shead h2{font-size:19px;line-height:1.3}
.shead small{color:var(--muted);font-size:13px}
.card{background:var(--paper);border:3px solid var(--line);box-shadow:5px 5px 0 var(--line);padding:14px;position:relative}
.rpic{font-size:46px;text-align:center;line-height:1.1}
.rh{font-size:20px;display:flex;align-items:center;gap:8px;justify-content:space-between;margin:6px 0;border-bottom:3px double var(--line);padding-bottom:6px}
.rtext{font-size:17px;line-height:1.8;margin:8px 0}
.exs{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.ex{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper2);border:2px solid var(--line);border-radius:4px;padding:6px 10px}
.wd{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.wd .jw{font-size:24px}
.wd small{font-size:13px;color:var(--muted);font-family:Nunito,sans-serif;direction:ltr}
.hz{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.hz button{min-width:54px;height:54px;border:3px solid var(--line);background:var(--mus);color:#1B1B1F;border-radius:6px;font-size:28px;box-shadow:3px 3px 0 var(--line)}
.tip{display:flex;gap:8px;background:var(--note);border:2px dashed var(--line);border-radius:4px;padding:8px 10px;margin:10px 0;font-size:15px;line-height:1.7}
.ref{font-size:13px;color:var(--muted);margin-top:8px}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:54px;border:3px solid var(--line);background:var(--paper2);border-radius:6px;font-size:17px;font-weight:800;box-shadow:4px 4px 0 var(--line);padding:8px 12px}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn.go{background:var(--red);color:#fff;width:100%}
.btn.alt{background:var(--paper)}
.btn[disabled]{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:2px;background:var(--grid);border:2px solid var(--line)}
.dots i.on{background:var(--red)}
.say{min-width:44px;height:44px;border:2px solid var(--line);border-radius:6px;background:var(--mus);color:#1B1B1F;font-size:18px;flex:0 0 auto}
/* bar kemajuan: gulungan kertas */
.feed{position:relative;height:20px;margin:0 0 12px;background:var(--paper2);border:3px solid var(--line);border-radius:4px;overflow:visible}
.feed i{position:absolute;inset-block:0;inset-inline-start:0;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 7px);opacity:.25}
.feed span{position:absolute;top:-12px;font-size:24px;transform:translateX(-50%)}
[dir=rtl] .feed span{transform:translateX(50%)}
.q{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.q p{margin:0;font-size:17px;line-height:1.6}
.hint .x,.hint{margin-top:10px}
.hint{background:var(--badbg);border:2px solid var(--bad);border-radius:4px;padding:8px 10px;font-size:15px;line-height:1.6}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rnd{font-size:13px;color:var(--muted);margin-bottom:6px;font-family:Nunito,sans-serif}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g1{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.opt{min-width:0;overflow-wrap:anywhere;min-height:58px;border:3px solid var(--line);background:var(--paper2);border-radius:6px;box-shadow:3px 3px 0 var(--line);padding:8px;font-size:16px}
.opt .jw{font-size:24px}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.opt.good,.good{background:var(--okbg)!important;border-color:var(--ok)!important}
.opt.bad{background:var(--badbg)}
.sel{outline:4px solid var(--mus);outline-offset:1px}
/* tajuk: akhbar */
.news{background:var(--paper2);border:2px solid var(--line);padding:10px;margin-bottom:12px}
.news .hd{display:block;font-family:"Alfa Slab One",serif;font-size:12px;color:var(--red);letter-spacing:1px;border-bottom:2px solid var(--line);margin-bottom:6px}
.news .jw{font-size:22px;line-height:1.9;display:block}
.news .ru{font-size:14px;color:var(--muted);display:block;margin-top:4px;direction:ltr;text-align:left}
.news mark{background:var(--mus);color:#1B1B1F;padding:0 4px;border-radius:3px}
.stick.good{background:var(--ok)}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--red);color:var(--red)}
/* timah: atur huruf */
.stick{min-height:70px;background:#3A3A40;border:3px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:8px;margin-bottom:12px}
#built{font-size:34px;color:#FBF6E9;min-height:44px}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tl{min-width:56px;height:60px;border:3px solid var(--line);border-radius:4px;background:linear-gradient(180deg,#C9CED6,#9AA1AC);color:#1B1B1F;font-size:26px;box-shadow:3px 3px 0 var(--line);padding:0 10px}
.tl.used{visibility:hidden}
/* semakpruf */
.proof{background:var(--paper2);border:2px solid var(--line);padding:12px;line-height:2.4;font-size:22px;direction:rtl;text-align:right}
.tok{border:none;background:none;padding:2px 4px;margin:0 1px;border-radius:4px;font-size:22px;font-family:"Noto Naskh Arabic",serif}
.tok:active{background:var(--note)}
.tok.fixd{color:var(--ok);text-decoration:underline wavy var(--ok)}
.tok.miss{text-decoration:line-through var(--red);color:var(--red)}
/* kolum, edar */
.cols{display:grid;gap:8px;margin-top:12px}
.col{min-width:0;min-height:96px;border:3px solid var(--line);background:var(--paper2);border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:stretch;box-shadow:3px 3px 0 var(--line)}
.col h4{margin:0 0 4px;font-size:14px;text-align:center;border-bottom:2px solid var(--line);padding-bottom:4px;overflow-wrap:anywhere}
.col .in{font-size:18px;background:var(--okbg);border-radius:4px;padding:2px 4px;text-align:center}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ck,.pp{min-width:0;border:3px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 10px;box-shadow:3px 3px 0 var(--line);font-size:22px}
.ck.done,.pp.done{display:none}
.houses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.hs{min-width:0;overflow-wrap:anywhere;border:3px solid var(--line);border-radius:4px;background:var(--paper2);padding:24px 6px 8px;position:relative;font-size:15px;box-shadow:3px 3px 0 var(--line);min-height:70px}
.hs::before{content:"🏠";position:absolute;top:-4px;inset-inline-start:6px;font-size:20px}
.hs.done{background:var(--okbg)}
.van{font-size:30px;text-align:center}
/* mesin cetak */
.plates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pl{min-width:0;overflow-wrap:anywhere;min-height:62px;border:3px solid var(--line);border-radius:4px;background:linear-gradient(180deg,#E6E9EE,#C3C9D2);color:#1B1B1F;box-shadow:3px 3px 0 var(--line);font-size:16px;padding:6px}
.pl .jw{font-size:22px}
.pl.on{background:var(--mus)}
.lever{margin-top:14px}
/* hasil */
.res{text-align:center}
.res .pel{width:120px;height:120px}
.stars{font-size:42px;margin:6px 0}
.stars span{display:inline-block;animation:pop .5s both}
.stars .off{filter:grayscale(1) opacity(.3)}
@keyframes pop{from{transform:scale(0)}}
.gotst{background:var(--note);border:2px dashed var(--line);padding:8px;margin:10px 0;display:flex;align-items:center;gap:10px;justify-content:center}
.gotst span{font-size:36px}
.fb{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--paper);border-top:4px solid var(--line);box-shadow:0 -6px 0 var(--red);padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .25s}
.fb .in{max-width:520px;margin:0 auto}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .pel{width:64px;height:64px}
.fb strong{font-size:20px;color:var(--ok)}
.fb p{margin:2px 0 0;font-size:15px;line-height:1.6}
@keyframes up{from{transform:translateY(100%)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;z-index:30;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>

/* ===================== KANDUNGAN (Buku Teks Jawi Tahun 6; ms. = muka surat bercetak, fail pN = ms.(N-8)) ===================== */
const STATIONS = [];
const ZONES = { 1:["Bilik Berita","بيليق بريتا"], 3:["Meja Atur Huruf","ميجا اتور حروف"], 5:["Bilik Semak Pruf","بيليق سمق ڤروف"], 7:["Mesin Cetak","ميسين چيتق"] };

/* ---------- Stesen 1: Homograf ---------- */
STATIONS.push({ id:1, c:"#F7D35E", icon:"👓", sticker:"📰", pg:"ms. 2–8",
  t:["Homograf","هوموڬرف"], u:["Pelajaran 1 • Unit 1","ڤلاجرن 1 • اونيت 1"],
  read:[
    { pic:"📰👓", h:["Apa itu homograf?","اڤ ايت هوموڬرف؟"],
      text:["Homograf ialah pasangan kata yang sama ejaan tetapi berlainan makna.","هوموڬرف اياله ڤاسڠن كات يڠ سام ايجاٴن تتاڤي برلاٴينن معنا."],
      tip:["Homograf ada dua kumpulan: homograf pada kata dasar dan homograf pada kata berimbuhan.","هوموڬرف اد دوا كومڤولن: هوموڬرف ڤد كات داسر دان هوموڬرف ڤد كات برايمبوهن."], p:"2" },
    { pic:"🔤", h:["Homograf kata dasar","هوموڬرف ڤد كات داسر"],
      text:["Vokal 'i' dan 'e' taling dilambangkan dengan huruf ي. Vokal 'u' dan 'o' dilambangkan dengan huruf و.","ۏوكل 'i' دان 'e' تاليڠ دلمبڠكن دڠن حروف ي. ۏوكل 'u' دان 'o' دلمبڠكن دڠن حروف و."],
      hz:["ي","و"], ex:[["bela / bila","بيلا"],["sesi / sisi","سيسي"],["pola / pula","ڤولا"],["biro / biru","بيرو"]], p:"3–4" },
    { pic:"🧩", h:["Homograf kata berimbuhan","هوموڬرف ڤد كات برايمبوهن"],
      text:["Vokal e pepet di tengah kata tidak dilambangkan, maka kata dasar dan kata berimbuhan boleh dieja sama.","ۏوكل e ڤڤت دتڠه كات تيدق دلمبڠكن، مک كات داسر دان كات برايمبوهن بوليه دايجا سام."],
      ex:[["markah / merekah","مركه"],["mantap / menetap","منتڤ"],["dahulu / dihulu","دهولو"]],
      hz:["د"], tip:["Imbuhan 'di' ditulis dengan huruf د sahaja. Maka dihulu dieja دهولو, sama seperti dahulu.","ايمبوهن 'di' دتوليس دڠن حروف د سهاج. مک dihulu دايجا دهولو، سام سڤرتي dahulu."], p:"5" },
    { pic:"🗞️", h:["Baca ikut ayat","باچ ايكوت ايات"],

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  if(window.__kafaFast) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[660,.1],[990,.18]]),
  type: () => tone([[1800,.03,"square"]]),
  no:   () => tone([[210,.18,"square"],[150,.2,"square"]]),
  press:() => tone([[120,.12,"sawtooth"],[90,.18,"sawtooth"]]),
  win:  () => tone([[392,.14],[523,.14],[659,.14],[784,.3]])
};

/* ---------- Suara: hanya teks Rumi; huruf Arab/Jawi dibuang supaya TTS tidak menyebutnya ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const ARABIC = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF\u200c]+/g;
const clean = s => String(s||"").replace(ARABIC," ").replace(/___/g," tempat kosong ").replace(/[()\[\]'+]/g," ").replace(/\s+([.,;:!?])/g,"$1").replace(/\s{2,}/g," ").trim();
function speak(text, force){
  stopHuruf();
  const t = clean(text);
  if(!ttsOK || !t || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* ---------- Nama huruf Jawi: rakaman /assets/huruf/uXXXX.mp3 (bukan TTS) ---------- */
const HURUF = { "ا":"alif","ب":"ba","ت":"ta","ة":"ta marbutoh","ث":"tsa","ج":"jim","چ":"ca","ح":"ha","خ":"kho","د":"dal","ذ":"zal","ر":"ro","ز":"zai",
  "س":"sin","ش":"syin","ص":"sod","ض":"dhod","ط":"tho","ظ":"zo","ع":"ain","غ":"ghain","ڠ":"nga","ف":"fa","ڤ":"pa","ق":"qof","ک":"kaf","ك":"kaf","ڬ":"ga",
  "ل":"lam","م":"mim","ن":"nun","و":"wau","ۏ":"va","ه":"ha","ء":"hamzah","ي":"ya","ڽ":"nya","لا":"lam alif" };
const hurufFile = ch => "/assets/huruf/" + [...ch].map(x => "u" + (x==="ک" ? "0643" : x.codePointAt(0).toString(16).padStart(4,"0"))).join("_") + ".mp3";
const isHuruf = ch => !!ch && HURUF[ch]!==undefined;
let hurufAudio = null;
function stopHuruf(){ try{ if(hurufAudio){ hurufAudio.pause(); hurufAudio = null; } }catch(e){} }
function sayHuruf(ch, force){
  if(!isHuruf(ch) || (!voiceOn && !force) || window.__kafaFast) return;
  try{ if(ttsOK) speechSynthesis.cancel(); stopHuruf(); hurufAudio = new Audio(hurufFile(ch)); const pr = hurufAudio.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } stopHuruf(); }

  renderPlay();
}
const head = () => `<div class="top"><button class="ib" data-act="map" aria-label="${L("Kembali ke peta","كمبالي ك ڤتا")}">${BACK()}</button><span class="sp"></span>${voiceBtn()}${langBtn()}</div>
  <div class="shead"><span class="plate" style="--c:${S.st.c}">${S.st.icon}</span><div><h2>${T(S.st.t)}</h2><small>${T(S.st.u)}</small></div></div>`;
const exRow = r => Array.isArray(r[0]) ? `<span class="ex">${W(r[0])} <b aria-hidden="true">${isJ()?"⬅":"➜"}</b> ${W(r[1])}</span>` : `<span class="ex">${W(r)}</span>`;
function readSpeech(c){
  return [RU(c.h), RU(c.text), ...(c.ss||[]).map(RU), c.tip?("Tahukah anda? "+RU(c.tip)):""].filter(Boolean).join(". ");
}
function renderRead(){
  hush();
  const c = S.st.read[S.ri], n = S.st.read.length, last = S.ri===n-1;
  app.innerHTML = head() + `
    <article class="card">
      <div class="rpic" aria-hidden="true">${c.pic}</div>
      <h3 class="rh"><span>${T(c.h)}</span> ${sayBtn(readSpeech(c))}</h3>
      ${c.text?`<p class="rtext">${T(c.text)}</p>`:""}
      ${c.hz?`<div class="hz">${c.hz.map(h=>`<button data-huruf="${h}" aria-label="${L("Dengar nama huruf","دڠر نام حروف")} ${HURUF[h]}"><span class="jw">${h}</span></button>`).join("")}<small style="align-self:center;color:var(--muted)">🔊 ${L("Tekan huruf untuk dengar namanya","تكن حروف اونتوق دڠر نامڽ")}</small></div>`:""}
      ${c.ex?`<div class="exs">${c.ex.map(exRow).join("")}</div>`:""}
      ${c.ss?c.ss.map(s=>`<div class="news"><span class="hd">${L("PETIKAN AYAT","ڤتيقن ايات")}</span><span class="jw">${s[1]}</span>${isJ()?"":`<span class="ru">${esc(s[0])}</span>`}</div>`).join(""):""}
      ${c.tip?`<div class="tip"><b>💡</b><span><b>${L("Tahukah anda?","تاهوكه اندا؟")}</b> ${T(c.tip)}</span></div>`:""}
      <div class="ref">📖 ${L("Buku teks ms.","بوكو تيكس م.س.")} ${c.p}</div>
      <div class="navr">
        <button class="btn alt" data-act="rprev" ${S.ri?"":"disabled"} aria-label="${L("Sebelum","سبلوم")}" style="flex:0 0 64px">${BACK()}</button>
        <button class="btn ${last?"go":""}" data-act="rnext">${last ? "🖨️ "+L("Mula bekerja!","مولا بكرجا!") : L("Seterusnya","ستروسڽ")+(isJ()?" ◀":" ▶")}</button>
      </div>
      <div class="dots">${S.st.read.map((_,i)=>`<i class="${i===S.ri?"on":""}"></i>`).join("")}</div>
    </article>`;
  speak(readSpeech(c));
  window.scrollTo(0,0);
}

/* ===================== STESEN: MAIN ===================== */
function feedBar(){
  const n = S.games.length, pct = Math.max(3, S.gi/n*100), side = isJ() ? "right" : "left";
  return `<div class="feed" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.gi}"><i style="width:${pct}%"></i><span style="${side}:${Math.min(96,pct)}%">📜</span></div>`;
}
function renderPlay(){
  hush(); document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  app.innerHTML = head() + feedBar() + `<section class="card" id="game">
    <div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play" data-type="${g.type}"></div><div id="hint"></div></section>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h) h.innerHTML = `<div class="hint">🖍️ ${hint || L("Hmm, ada kesilapan! Cuba lagi atau lihat semula kad bacaan.","همم، اد كسيلاڤن! چوبا لاڬي اتاو ليهت سمولا كد باچاٴن.")}</div>`;
}
const clearHint = () => { const h = $("#hint"); if(h) h.innerHTML = ""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${pelican("yay")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ${isJ()?"◀":"▶"}</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Halaman ini dicetak tanpa sebarang kesilapan.","چمرلڠ! هلامن اين دچيتق تنڤ سبارڠ كسيلاڤن."] : stars===2 ? ["Bagus! Semak sekali lagi untuk 3 bintang.","باڬوس! سمق سكالي لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Baca kad dan cuba lagi.","شاباس كران منچوبا! باچ كد دان چوبا لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${pelican("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Keratan akhbar baharu untuk koleksi kamu!","كراتن اخبار بهارو اونتوق كوليكسي كامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🚚 ${L("Edisi Khas kini dibuka!","ايديسي خاص كيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🗺️ ${L("Kembali ke peta","كمبالي ك ڤتا")}</button>
      <button class="btn alt" style="margin-top:10px;width:100%" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== PERMAINAN (8 jenis, semua tekan sahaja) ===================== */
const hasAr = s => /[\u0600-\u06FF]/.test(s);
const lab = o => { const s = T(o); return hasAr(s) ? JW(s) : esc(s); };
const later = fn => setTimeout(fn, window.__kafaFast ? 0 : 650);
const rnd = (r,n) => `<div class="rnd">${L("Pusingan","ڤوسيڠن")} ${r+1} / ${n}</div>`;
const GAMES = {};

/* wartawan: temu bual — pilih bacaan / jawapan bagi ayat atau perkataan berwarna */
GAMES.wartawan = (el, g) => {
  let r = 0, busy = false;
  const draw = () => {
    const R = g.rounds[r], s = R.hl ? R.s.replace(R.hl, `<mark>${R.hl}</mark>`) : `<mark>${R.s}</mark>`;
    const ord = mix(R.o.map((_,i)=>i));
    el.innerHTML = rnd(r, g.rounds.length) + `<div class="news"><span class="hd">🎤 ${L("WAWANCARA","وانچارا")}</span><span class="jw" style="${R.hl?"":"font-size:34px;text-align:center"}">${s}</span></div>
      <div class="g1">${ord.map(i=>`<button class="opt wo" data-ok="${i===0?1:0}">${lab(R.o[i])}</button>`).join("")}</div>`;
    busy = false;
  };
  el.onclick = e => {
    const b = e.target.closest(".wo"); if(!b || busy) return;
    if(b.dataset.ok==="1"){ busy = true; b.classList.add("good"); sfx.ok(); clearHint(); r++; r < g.rounds.length ? later(draw) : win(); }
    else { b.classList.add("bad"); oops(b); }
  };
  draw();
};

/* tajuk: lengkapkan tajuk berita dengan blok perkataan */
GAMES.tajuk = (el, g) => {
  let r = 0, busy = false;
  const blank = `<span class="blank" id="bl">　　　</span>`;
  const draw = () => {
    const R = g.rounds[r], ord = mix(R.o.map((_,i)=>i));
    el.innerHTML = rnd(r, g.rounds.length) + `<div class="news"><span class="hd">📰 ${L("TAJUK UTAMA","تاجوق اوتام")}</span><span class="jw">${R.s[1].replace("___", blank)}</span>${isJ()?"":`<span class="ru">${esc(R.s[0]).replace("___","______")}</span>`}</div>
      <div class="g2">${ord.map(i=>`<button class="opt tj" data-ok="${i===0?1:0}" data-w="${esc(R.o[i])}">${JW(R.o[i])}</button>`).join("")}</div>`;
    busy = false;
  };
  el.onclick = e => {
    const b = e.target.closest(".tj"); if(!b || busy) return;
    if(b.dataset.ok==="1"){ busy = true; b.classList.add("good"); const bl = el.querySelector("#bl"); if(bl){ bl.textContent = b.dataset.w; bl.style.color = "var(--ok)"; }
      sfx.ok(); clearHint(); r++; r < g.rounds.length ? later(draw) : win(); }
    else { b.classList.add("bad"); oops(b); }
  };
  draw();
};

/* timah: atur huruf/blok timah ikut urutan untuk membina ejaan */
GAMES.timah = (el, g) => {
  let k = 0;
  const tiles = mix([...g.parts, ...g.extra].map((t,i)=>({t,i})));
  el.innerHTML = `<div class="stick" aria-live="polite"><span id="built" class="jw"></span></div>
    <p class="rnd" style="text-align:center">${L("Bina:","بينا:")} <b>${esc(g.w[0])}</b> • ${L("blok kanan dahulu","بلوک كانن دهولو")}</p>
    <div class="tray">${tiles.map(o=>`<button class="tl" data-t="${esc(o.t)}"><span class="jw">${o.t===" "?"␣":o.t}</span></button>`).join("")}</div>`;
  const built = el.querySelector("#built");
  el.onclick = e => {
    const b = e.target.closest(".tl"); if(!b || b.classList.contains("used") || k >= g.parts.length) return;
    if(b.dataset.t === g.parts[k]){
      b.classList.add("used"); k++; built.textContent = g.parts.slice(0,k).join(g.join); sfx.type(); clearHint();
      if(isHuruf(b.dataset.t)) sayHuruf(b.dataset.t);
      if(k === g.parts.length){ built.parentNode.classList.add("good"); win(); }
    } else oops(b, L("Bukan blok itu. Ejaan Jawi dibina dari kanan ke kiri.","بوكن بلوک ايت. ايجاٴن جاوي دبينا دري كانن ك كيري."));
  };
};

/* semakpruf: tekan perkataan yang salah ejaan, pen merah membetulkannya */
GAMES.semakpruf = (el, g) => {
  let r = 0, busy = false;
  const draw = () => {
    const R = g.rounds[r];
    el.innerHTML = rnd(r, g.rounds.length) + `<div class="proof">${R.t.map((w,i)=>`<button class="tok" data-i="${i}">${w}</button>`).join(" ")}</div>
      ${isJ()?"":`<p class="rnd" style="margin-top:8px">🖍️ ${esc(R.r)}</p>`}`;
    busy = false;
  };
  el.onclick = e => {
    const b = e.target.closest(".tok"); if(!b || busy) return;
    const R = g.rounds[r];
    if(+b.dataset.i === R.bad){ busy = true; b.textContent = R.fix; b.classList.add("fixd"); sfx.ok(); clearHint(); r++; r < g.rounds.length ? later(draw) : win(); }
    else oops(b, L("Perkataan itu sudah betul. Cari kesilapan yang lain.","ڤركاتاٴن ايت سوده بتول. چاري كسيلاڤن يڠ لاٴين."));
  };
  draw();
};

/* kolum: tekan kad, kemudian lajur akhbar yang betul */
GAMES.kolum = (el, g) => {
  let sel = null, left = g.items.length;
  const ord = mix(g.items.map((_,i)=>i)), n = g.cols.length;
  el.innerHTML = `<div class="cards">${ord.map(i=>`<button class="ck" data-i="${i}">${JW(g.items[i][0])}${isJ()?"":`<small style="display:block;font-size:12px;color:var(--muted)">${esc(g.items[i][2])}</small>`}</button>`).join("")}</div>
    <div class="cols" style="grid-template-columns:repeat(${n===3?3:2},minmax(0,1fr))">${g.cols.map((c,ci)=>`<button class="col" data-c="${ci}"><h4>${T(c)}</h4></button>`).join("")}</div>`;
  el.onclick = e => {
    const c = e.target.closest(".ck"), col = e.target.closest(".col");
    if(c){ el.querySelectorAll(".ck").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); sel = +c.dataset.i; sfx.type(); return; }
    if(!col) return;
    if(sel===null){ toast(L("Pilih satu kad dahulu 🗞️","ڤيليه ساتو كد دهولو 🗞️")); return; }
    const it = g.items[sel];
    if(+col.dataset.c === it[1]){
      el.querySelector(`.ck[data-i="${sel}"]`).classList.add("done");
      col.insertAdjacentHTML("beforeend", `<span class="in jw">${it[0]}</span>`); sel = null; sfx.ok(); clearHint();
      if(--left === 0) win();
    } else oops(col);
  };
};

/* mesincetak: muatkan semua plat yang betul, kemudian tarik tuil */
GAMES.mesincetak = (el, g) => {
  const ord = mix(g.opts.map((_,i)=>i));
  el.innerHTML = `<div class="plates">${ord.map(i=>{ const o = g.opts[i]; return `<button class="pl" data-i="${i}" data-ok="${o[2]}" aria-pressed="false">${o[0]?JW(o[0])+(isJ()?"":`<small style="display:block;font-size:12px">${esc(o[1])}</small>`):`<b style="font-size:18px">${esc(o[1])}</b>`}</button>`; }).join("")}</div>
    <button class="btn go lever" id="press">🖨️ ${L("Tarik tuil CETAK","تاريق توٴيل چيتق")}</button>`;
  el.onclick = e => {
    const p = e.target.closest(".pl");
    if(p){ p.classList.toggle("on"); p.setAttribute("aria-pressed", p.classList.contains("on")); sfx.type(); return; }
    if(!e.target.closest("#press")) return;
    const on = [...el.querySelectorAll(".pl.on")];
    if(!on.length){ toast(L("Muatkan sekurang-kurangnya satu plat dahulu","موتكن سكورڠ٢ڽ ساتو ڤليت دهولو")); return; }
    const wrong = on.filter(x=>x.dataset.ok!=="1"), need = g.opts.filter(o=>o[2]).length;
    if(wrong.length){ wrong.forEach(x=>{ x.classList.remove("on"); x.setAttribute("aria-pressed","false"); }); oops(wrong[0], L("Ada plat yang salah! Plat itu dikeluarkan.","اد ڤليت يڠ ساله! ڤليت ايت دكلوارکن.")); return; }
    if(on.length < need){ oops(el.querySelector("#press"), L("Masih ada plat betul yang belum dimuatkan.","ماسيه اد ڤليت بتول يڠ بلوم دموتكن.")); return; }
    sfx.press(); on.forEach(x=>x.classList.add("good")); win();
  };
};

/* ruang: pilih pruf yang jarak / tandanya betul */
GAMES.ruang = (el, g) => {
  let r = 0, busy = false;
  const draw = () => {
    const R = g.rounds[r], ord = mix(R.o.map((_,i)=>i));
    el.innerHTML = rnd(r, g.rounds.length) + `<div class="news" style="text-align:center"><span class="hd">📐 ${L("PRUF","ڤروف")}</span><b style="font-size:24px;font-family:Nunito,sans-serif">${esc(R.w)}</b></div>
      <div class="g1">${ord.map(i=>`<button class="opt rg" data-ok="${i===0?1:0}">${JW(R.o[i])}</button>`).join("")}</div>`;
    busy = false;
  };
  el.onclick = e => {
    const b = e.target.closest(".rg"); if(!b || busy) return;
    if(b.dataset.ok==="1"){ busy = true; b.classList.add("good"); sfx.ok(); clearHint(); r++; r < g.rounds.length ? later(draw) : win(); }
    else { b.classList.add("bad"); oops(b); }
  };
  draw();
};

/* edar: van edaran — tekan akhbar, kemudian rumah yang sepadan */
GAMES.edar = (el, g) => {
  let sel = null, left = g.pairs.length;
  const idx = g.pairs.map((_,i)=>i), pap = mix(idx); let hou = mix(idx), tries = 0;
  while(hou.every((x,i)=>x===pap[i]) && tries++ < 10) hou = mix(idx);
  el.innerHTML = `<div class="van" aria-hidden="true">🚚💨</div><div class="cards">${pap.map(k=>`<button class="pp" data-k="${k}">🗞️ ${JW(g.pairs[k][0])}</button>`).join("")}</div>
    <div class="houses">${hou.map(k=>`<button class="hs" data-k="${k}">${lab(g.pairs[k][1])}</button>`).join("")}</div>`;
  el.onclick = e => {
    const p = e.target.closest(".pp"), h = e.target.closest(".hs");
    if(p){ el.querySelectorAll(".pp").forEach(x=>x.classList.remove("sel")); p.classList.add("sel"); sel = p.dataset.k; sfx.type(); return; }
    if(!h || h.classList.contains("done")) return;
    if(sel===null){ toast(L("Pilih akhbar dahulu 🗞️","ڤيليه اخبار دهولو 🗞️")); return; }
    if(h.dataset.k === sel){
      el.querySelector(`.pp[data-k="${sel}"]`).classList.add("done"); h.classList.add("done");
      h.insertAdjacentHTML("beforeend", `<span class="jw" style="display:block;font-size:20px">✅ ${g.pairs[+sel][0]}</span>`); sel = null; sfx.ok(); clearHint();
      if(--left === 0) win();
    } else oops(h);
  };
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const hz = e.target.closest("[data-huruf]");
  if(hz){ sayHuruf(hz.dataset.huruf, true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Siapkan halaman sebelumnya dahulu 🔒","سياڤكن هلامن سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Siapkan semua ${STATIONS.length} halaman untuk membuka Edisi Khas 🚚`,`سياڤكن سموا ${STATIONS.length} هلامن اونتوق ممبوک ايديسي خاص 🚚`)); }
  else if(a==="map"){ renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa selepas tukar tulisan/suara, tanpa mengulang konfeti
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
