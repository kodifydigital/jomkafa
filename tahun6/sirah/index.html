<style>
/* ===== Sirah Tahun 6: "Kapal Layar Sirah" — pelayaran kapal layar antara pulau; maskot Nakhoda Nuri (burung nuri) ===== */
:root{
  --sea:#0B3954; --sea2:#087E8B; --wave:#BFE3E8; --chart:#F6E7C8; --chart2:#EAD3A2; --bg:#F3EAD7; --card:#FFFBF2; --ink:#1B1B2F; --muted:#5B5160;
  --line:#1B1B2F; --sail:#FFF6E0; --wood:#8B5A2B; --wood2:#5E3A17; --coral:#E4572E; --gold:#F2B134; --jade:#2E8B57;
  --ok:#1F9D63; --okbg:#DDF5E6; --bad:#C8102E; --badbg:#FFE1E1; --note:#FFF1C9; --panel:#E8F4F2;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#06202F; --sea2:#0B5560; --wave:#123B47; --chart:#2A2418; --chart2:#3A311F; --bg:#141A22; --card:#1F2630; --ink:#F4EEDF; --muted:#C4B9A8;
    --line:#0A0D12; --sail:#3A3428; --note:#3B3218; --panel:#1A3236; --okbg:#173A28; --badbg:#47191E; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;min-height:100vh;
  background:radial-gradient(circle at 20% 0,rgba(255,255,255,.35),transparent 40%),linear-gradient(180deg,var(--bg),var(--chart2));}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Nunito",serif;font-size:19px;line-height:1.9}
#app{max-width:560px;margin:0 auto;padding:10px 14px 90px}
h1,h2,h3{font-family:"Arvo",Georgia,serif;font-weight:700;margin:0;line-height:1.2}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic",serif;line-height:1.6}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:1.3em;line-height:2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);
  background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:900;font-size:20px;text-decoration:none;color:var(--ink)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{padding:8px 12px;border-radius:999px;border:3px solid var(--line);background:var(--gold);color:#1B1B2F;font-weight:900}
/* ---- hero ---- */
.hero{display:flex;gap:12px;align-items:center;padding:14px;border:3px solid var(--line);border-radius:22px;color:#fff;
  background:linear-gradient(180deg,#F7C873 0,#F08A4B 30%,#087E8B 62%,#0B3954 100%);box-shadow:0 6px 0 var(--line)}
.hero .nuri{width:96px;flex:0 0 96px}
.hero h1{font-size:26px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hero p{margin:4px 0 0;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.sttl{font-weight:900;margin:16px 4px 6px}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.stickers span{width:42px;height:42px;display:grid;place-items:center;font-size:24px;border-radius:50%;border:2px dashed var(--muted);filter:grayscale(1);opacity:.45;background:var(--card)}
.stickers span.got{filter:none;opacity:1;border:3px solid var(--line);background:var(--note)}
/* ---- peta laut (carta) ---- */
.chart{position:relative;margin-top:14px;padding:16px 8px 22px;border:3px solid var(--line);border-radius:24px;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(8,126,139,.08) 38px 40px),repeating-linear-gradient(90deg,transparent 0 38px,rgba(8,126,139,.08) 38px 40px),
  radial-gradient(ellipse at 50% 0,#7FD1D8,#2B9BA8 45%,#0B5C7A 100%)}
.chart::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.25) 0 2px,transparent 3px) 0 0/60px 50px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.2) 0 2px,transparent 3px) 0 0/80px 70px}
.compass{position:absolute;top:8px;inset-inline-end:10px;font-size:30px;opacity:.85}
.start{display:inline-block;position:relative;z-index:2;margin:0 0 6px 8px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--sail);color:var(--ink);font-weight:900;font-size:15px}
.mrow{position:relative;display:flex;justify-content:flex-start;padding:6px 0}
.mrow:nth-of-type(even){justify-content:flex-end}
.mrow::after{content:"";position:absolute;top:-18px;bottom:50%;left:50%;width:0;border-left:4px dashed rgba(255,246,224,.8);z-index:0}
.stn{position:relative;z-index:1;display:flex;align-items:center;gap:8px;width:min(330px,88%);padding:6px 10px 6px 6px;border:3px solid var(--line);border-radius:20px;
  background:var(--card);box-shadow:0 5px 0 var(--line);text-align:start}
.stn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.stn.lock{background:#D9D2C3;color:#5B5160}
.stn.now{outline:4px solid var(--gold);outline-offset:3px}
.isle{position:relative;flex:0 0 84px;width:84px;height:72px}
.isle svg{width:84px;height:72px;display:block}
.isle .em{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.isle .badge{position:absolute;top:-4px;inset-inline-start:-4px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--coral);color:#fff;border:2px solid var(--line);font-weight:900;font-size:14px;font-family:Nunito,sans-serif}
.isle .perch{position:absolute;top:-40px;inset-inline-start:-6px;width:40px;z-index:3}
.lab{display:flex;flex-direction:column;min-width:0}
.lab .dk{font-size:13px;font-weight:900;color:var(--sea2)}
.stn.lock .lab .dk{color:#5B5160}
.lab .nm{font-weight:900;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
html[dir="rtl"] .lab .nm{font-size:17px;line-height:1.7}
.lab .st{font-size:15px;letter-spacing:1px}
.lab .st .off,.stars .off{filter:grayscale(1);opacity:.3}
.mrow.port .stn{background:linear-gradient(135deg,var(--note),var(--card))}
</style>
<style>
/* ---- kepala pulau + kad ---- */
.shead{display:flex;gap:10px;align-items:center;margin:4px 0 10px}
.shead .bub{width:52px;height:52px;flex:0 0 52px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--c);border:3px solid var(--line)}
.shead h2{font-size:20px}
.shead small{color:var(--muted);font-weight:800}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--line);margin-bottom:14px}
.read{border-top:10px solid var(--sc)}
.rpic{font-size:44px;text-align:center}
.rh{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:19px;margin:6px 0}
.say{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--wave);font-size:18px}
.rtext{margin:6px 0}
.rlist{margin:6px 0;padding-inline-start:24px}
.rlist li{margin:4px 0}
.abox{display:flex;flex-direction:column;gap:6px;margin:10px 0;padding:12px;border-radius:16px;background:var(--panel);border:2px solid var(--sea2);text-align:center}
.abox .ar{font-size:1.45em}
.abox .mk{font-style:italic}
.abox small{color:var(--muted);font-weight:800}
.tip{display:flex;gap:8px;margin:10px 0;padding:10px;border-radius:14px;background:var(--note);border:2px dashed var(--wood)}
.tip.am{background:var(--okbg);border-color:var(--jade)}
.ref{font-size:14px;font-weight:800;color:var(--muted);margin-top:6px}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;display:block;width:100%;min-height:54px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:var(--sea2);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line)}
.btn.go{background:var(--coral)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.45}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--coral)}
/* ---- main ---- */
.prog{display:flex;gap:4px;margin:0 0 10px}
.prog i{flex:1;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--wave);display:grid;place-items:center;font-style:normal;font-size:15px}
.prog i.got{background:var(--gold)}
.prog i.cur{background:var(--sail)}
.q{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.q p{margin:0;font-weight:900;font-size:18px}
.qpic{font-size:40px;text-align:center;margin:6px 0}
#play{margin-top:10px}
.g1{display:grid;grid-template-columns:1fr;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-width:0;min-height:56px;padding:10px 12px;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;text-align:center;overflow-wrap:anywhere;line-height:1.35}
html[dir="rtl"] .opt{line-height:1.8}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.sel{background:var(--note);outline:4px solid var(--gold)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.used{opacity:.35}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cnt{text-align:center;font-weight:800;color:var(--muted);margin-top:8px}
.hint{margin-top:10px;padding:10px;border-radius:14px;background:var(--badbg);border:2px solid var(--bad);font-weight:800}
/* layar: tiang + layar dinaikkan */
.mast{position:relative;height:96px;margin:0 auto 10px;width:150px}
.mast .pole{position:absolute;left:73px;top:0;width:6px;height:92px;background:var(--wood);border-radius:3px}
.mast .sl{position:absolute;left:12px;width:126px;height:26px;background:var(--sail);border:2px solid var(--line);border-radius:4px 4px 20px 20px;transform:scaleY(.25);transform-origin:top;transition:transform .5s}
.mast.up .sl{transform:scaleY(1)}
.opt.sailb{border-radius:6px 6px 26px 26px;background:linear-gradient(180deg,var(--sail),var(--card))}
/* kemudi */
.wheel{width:90px;height:90px;margin:0 auto 6px;transition:transform .5s}
.wheel.l{transform:rotate(-60deg)}.wheel.r{transform:rotate(60deg)}
.stmt{padding:14px;border-radius:16px;border:3px dashed var(--sea2);background:var(--panel);font-weight:800;text-align:center;min-height:70px}
/* logbuku */
.logp{padding:10px;border-radius:14px;border:2px solid var(--wood);background:repeating-linear-gradient(180deg,var(--sail) 0 30px,var(--chart2) 30px 31px);min-height:60px;margin-bottom:10px}
.logp div{font-weight:800;padding:4px 2px}
/* haluan: pulau destinasi */
.cur{padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--sail);text-align:center;font-weight:900;margin-bottom:10px}
.bays .opt{background:linear-gradient(180deg,var(--card) 60%,#E9D29A)}
/* bintangutara */
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.pairs .opt{min-height:52px;font-size:15px}
.opt.done{background:var(--okbg);border-color:var(--ok);opacity:.7}
/* buritan */
.sent{padding:12px;border-radius:14px;background:var(--panel);border:2px solid var(--sea2);font-weight:800;margin-bottom:10px}
.blank{display:inline-block;min-width:80px;border-bottom:3px dashed var(--coral);padding:0 6px;color:var(--coral)}
/* tiang & lanun */
.opt.flag::before{content:"🚩 "}
.fleet .opt{background:linear-gradient(180deg,var(--card) 70%,var(--wave))}
.opt.sunk{opacity:.35;text-decoration:line-through}
/* maklum balas */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(11,57,84,.35)}
.fb .in{max-width:540px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .nuri{width:62px;flex:0 0 62px}
.fb strong{font-family:"Arvo",Georgia,serif;font-size:20px}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif}
.fb p{margin:2px 0 0;font-size:16px}
.res{text-align:center}
.res .nuri{width:120px}
.stars{font-size:46px;margin:6px 0}
.stars span{display:inline-block;animation:pop .5s both}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
.gotst{margin:10px auto;padding:10px;border-radius:16px;background:var(--note);border:2px dashed var(--line);font-weight:800}
.gotst span{font-size:36px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:92vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

      list:[["Keadilan (al-'adalah): melaksanakan keadilan dalam semua bidang kehidupan untuk memelihara agama, nyawa, akal fikiran, keturunan dan harta benda.","کعاديلن (العدالة): ملقساناکن کعاديلن دالم سموا بيدڠ کهيدوڤن اونتوق ممليهارا اڬام، ڽاوا، عقل فيکيرن، کتورونن دان هرتا بندا."],

    { p:11, pic:"🗣️", h:["Prinsip 3 dan 4: Kebebasan dan Musyawarah","ڤرينسيڤ 3 دان 4: کبيبسن دان مشوارت"],
      list:[["Kebebasan (al-hurriyyah): tidak terkeluar daripada batas yang ditentukan Allah, seperti bebas mencari harta, bersuara, beragama dan mendapat jaminan keselamatan hidup.","کبيبسن (الحرية): تيدق ترکلوار درڤد باتس يڠ دتنتوکن الله، سڤرتي بيبس منچاري هرتا، برسوارا، براڬام دان منداڤت جامينن کسلامتن هيدوڤ."],
            ["Musyawarah (asy-syura): setiap keputusan dibuat setelah mendapat pandangan daripada mereka yang berkelayakan.","مشوارت (الشورى): ستياڤ کڤوتوسن دبوات ستله منداڤت ڤنداڠن درڤد مريک يڠ برکلايقن."]],
      tip:["Nabi Muhammad SAW telah membina negara Islam yang pertama iaitu Madinah al-Munawwarah.","نبي محمد صلى الله عليه وسلم تله ممبينا نڬارا إسلام يڠ ڤرتام يأيت مدينة المنورة."],

{ id:3, icon:"🕌", c:"#2E8B57", sticker:"🌟", t:["Khulafa' ar-Rasyidin dan Abu Bakar","خلفاء الراشدين دان أبو بکر"], u:["Pulau 3 • ms. 14–25","ڤولاو 3 • م.س. 14–25"],
  read:[
    { p:15, pic:"👥", h:["Pengertian sahabat","ڤڠرتين صحابت"],
      text:["Sahabat adalah mereka yang berjumpa (bertemu) Nabi Muhammad SAW, beriman dengan baginda dan mati dalam Islam.","صحابت اداله مريک يڠ برجومڤا (برتمو) نبي محمد صلى الله عليه وسلم، برايمان دڠن بڬيندا دان ماتي دالم إسلام."],
      tip:["Termasuk sahabat: orang yang bertemu baginda sama ada lama atau sekejap, dan orang yang tidak dapat melihat baginda kerana buta.","ترماسوق صحابت: اورڠ يڠ برتمو بڬيندا سام اد لاما اتاو سکجڤ، دان اورڠ يڠ تيدق داڤت مليهت بڬيندا کران بوتا."] },
    { p:16, pic:"👑", h:["Khalifah dan Khulafa' ar-Rasyidin","خليفة دان خلفاء الراشدين"],
      text:["Khalifah ialah orang yang memegang jawatan ketua pentadbiran negara Islam dan hal ehwal agama selepas Rasulullah SAW. Khulafa' ar-Rasyidin ialah gelaran bagi empat orang sahabat yang menjadi ketua negara Islam selepas kewafatan baginda.","خليفة اياله اورڠ يڠ ممڬڠ جاوتن کتوا ڤنتدبيرن نڬارا إسلام دان حال احوال اڬام سلڤس رسول الله صلى الله عليه وسلم. خلفاء الراشدين اياله ڬلرن باڬي امڤت اورڠ صحابت يڠ منجادي کتوا نڬارا إسلام سلڤس کوفاتن بڬيندا."],
      list:[["Khalifah pertama: Sayidina Abu Bakar as-Siddiq","خليفة ڤرتام: سيدنا أبو بکر الصديق"],["Khalifah kedua: Sayidina Umar bin al-Khattab","خليفة کدوا: سيدنا عمر بن الخطاب"],["Khalifah ketiga: Sayidina Uthman bin Affan","خليفة کتيڬ: سيدنا عثمان بن عفان"],["Khalifah keempat: Sayidina Ali bin Abi Talib","خليفة کأمڤت: سيدنا علي بن أبي طالب"]],
      tip:["Abu Bakar dan Umar ialah mertua Rasulullah SAW, manakala Uthman dan Ali ialah menantu baginda.","أبو بکر دان عمر اياله مرتوا رسول الله صلى الله عليه وسلم، مانکالا عثمان دان علي اياله منانتو بڬيندا."] },
    { p:19, pic:"📘", h:["Riwayat hidup Abu Bakar as-Siddiq","روايت هيدوڤ أبو بکر الصديق"],
      list:[["Nama penuh: Abdullah bin Abi Quhafah at-Taimi","نام ڤنوه: عبد الله بن أبي قحافة التيمي"],["Gelaran as-Siddiq: sentiasa yakin dan membenarkan Rasulullah SAW, terutama ketika Israk dan Mikraj","ڬلرن الصديق: سنتياس يقين دان ممبنرکن رسول الله، تراوتام کتيک اسراء دان معراج"],
            ["Lahir dua tahun selepas kelahiran Rasulullah SAW di Mekah, daripada Bani Taim (Quraisy)","لاهير دوا تاهون سلڤس کلاهيرن رسول الله دمکة، درڤد بني تيم (قريش)"],["Khalifah pertama pada tahun 11 Hijrah, memerintah 2 tahun 3 bulan","خليفة ڤرتام ڤد تاهون 11 هجرة، ممرينته 2 تاهون 3 بولن"],["Wafat tahun 13 Hijrah ketika berusia 63 tahun","وفاة تاهون 13 هجرة کتيک براوسيا 63 تاهون"]] },
    { p:21, pic:"💎", h:["Peribadi Abu Bakar","ڤريبادي أبو بکر"],
      list:[["Ahli perniagaan yang berjaya dan lelaki dewasa pertama yang memeluk Islam.","اهلي ڤرنياڬاٴن يڠ برجاي دان للاکي ديواس ڤرتام يڠ مملوق إسلام."],["Tidak pernah meminum arak walaupun sebelum memeluk Islam.","تيدق ڤرنه مميڽوم عارق والاوڤون سبلوم مملوق إسلام."],
            ["Sahabat karib Rasulullah SAW yang paling setia dan menemani baginda berhijrah dari Mekah ke Madinah.","صحابت کاريب رسول الله يڠ ڤاليڠ ستيا دان منماني بڬيندا برهجرة دري مکة ک مدينة."],["Membebaskan Bilal bin Rabah yang diseksa dengan membayar tebusan.","ممبيبسکن بلال بن رباح يڠ دسيقسا دڠن ممباير تبوسن."]] },
    { p:23, pic:"🛡️", h:["Sumbangan semasa menjadi khalifah","سومبڠن سماس منجادي خليفة"],
      list:[["Memerangi golongan murtad yang enggan membayar zakat dan orang yang mengaku menjadi nabi.","ممرڠي ڬولوڠن مرتد يڠ اڠڬن ممباير زکاة دان اورڠ يڠ مڠاکو منجادي نبي."],["Mengembangkan syiar Islam ke negeri Rom serta seluruh Semenanjung Arab.","مڠمبڠکن شعار إسلام ک نڬري روم سرتا سلوروه سمننجوڠ عرب."],["Mengumpulkan al-Quran atas cadangan Sayidina Umar setelah ramai penghafaz al-Quran mati syahid.","مڠومڤولکن القرءان اتس چادڠن سيدنا عمر ستله راماي ڤڠحفظ القرءان ماتي شهيد."]],
      tip:["Di Gua Thur, Abu Bakar menutup lubang dengan kain dan kakinya. Kakinya disengat binatang berbisa, tetapi beliau menahan sakit supaya Rasulullah SAW tidak terjaga.","دڬوا ثور، أبو بکر منوتوڤ لوبڠ دڠن کاين دان کاکيڽ. کاکيڽ دسڠت بيناتڠ بربيسا، تتاڤي بلياو منهن ساکيت سوڤاي رسول الله تيدق ترجاڬ."],
      am:["Mengeratkan silaturahim dan membantu mereka yang memerlukan tanpa mengira pangkat dan keturunan.","مڠرتکن صلة الرحيم دان ممبنتو مريک يڠ ممرلوکن تنڤا مڠيرا ڤڠکت دان کتورونن."] }
  ],

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

  ok:    () => tone([[587,.12],[880,.2]]),

  no:    () => tone([[220,.18,"square"],[165,.22,"square"]]),
  creak: () => tone([[180,.08,"sawtooth"],[240,.1,"sawtooth"]]),
  bell:  () => tone([[1046,.25],[1318,.35]]),
  cannon:() => tone([[90,.25,"square"],[60,.3,"sawtooth"]]),
  win:   () => tone([[392,.14],[523,.14],[659,.14],[784,.34]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
const forSpeech = s => String(s).replace(/ﷺ/g," sallallahu alaihi wasallam ").replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(AR_RE," ").replace(/<[^>]+>/g," ")
  .replace(/___/g," ... ").replace(/…/g," ... ").replace(/\bms\. /g,"muka surat ").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    const s = forSpeech(text); if(!s) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = 1; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

      <span class="compass" aria-hidden="true">🧭</span>
      <span class="start">⛵ ${L("Mula belayar","مولا بلاير")}</span>
      ${STATIONS.map(s=>node(s,cur)).join("")}
      <div class="mrow port"><button class="stn ${fOpen?"":"lock"} ${cur==="final"?"now":""}" data-act="${fOpen?"final":"flocked"}">
        <span class="isle">${isleSvg("#F2B134", !fOpen, fSt)}<span class="em">${fOpen?"⛵":"🔒"}</span>
        ${cur==="final"?`<span class="perch">${nuri("bob")}</span>`:""}</span>
        <span class="lab"><span class="dk">🏁 ${L("Cabaran akhir","چابرن اخير")}</span><span class="nm">${T(FINAL_T)}</span><span class="st">${starRow(fSt)}</span></span></button></div>
    </section>`;
  const now = app.querySelector(".stn.now");
  if(now) setTimeout(()=>{ try{ now.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){} }, 250);
}

/* ===================== PULAU: BACA ===================== */
function openStation(id){
  const st = STATIONS.find(s=>s.id===id);
  S = { st, phase:"read", ri:0, gi:0, miss:0, games: st.games.slice() };
  renderRead();
}
function openFinal(){
  const games = FINAL_PICK.map(([s,i]) => STATIONS.find(x=>x.id===s).games[i]);
  S = { st:{ id:"final", icon:"⛵", c:"#F2B134", t:FINAL_T, u:["Satu cabaran dari setiap pulau","ساتو چابرن دري ستياڤ ڤولاو"], sticker:"⛵" }, phase:"play", gi:0, miss:0, games };
  renderPlay();
}
const head = () => `<div class="top"><button class="ib" data-act="map" aria-label="${L("Kembali ke peta","کمبالي ک ڤتا")}">${BACK()}</button><span class="sp"></span>${voiceBtn()}${langBtn()}</div>
  <div class="shead"><span class="bub" style="--c:${S.st.c}">${S.st.icon}</span><div><h2>${T(S.st.t)}</h2><small>${T(S.st.u)}</small></div></div>`;
function readSpeech(c){
  return [RU(c.h), RU(c.text), ...(c.list||[]).map(RU), RU(c.mk), c.tip?("Tahukah anda? "+RU(c.tip)):"", c.am?("Amalkan: "+RU(c.am)):""].filter(Boolean).join(". ");
}
function renderRead(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const c = S.st.read[S.ri], n = S.st.read.length, last = S.ri===n-1;
  app.innerHTML = head() + `
    <article class="card read" style="--sc:${S.st.c}">
      <div class="rpic" aria-hidden="true">${c.pic}</div>
      <h3 class="rh"><span>${T(c.h)}</span> ${sayBtn(readSpeech(c))}</h3>
      ${c.text?`<p class="rtext">${T(c.text)}</p>`:""}
      ${(c.ar||c.mk)?`<div class="abox">${c.ar?`<span class="ar" lang="ar">${c.ar}</span>`:""}${c.mk?`<span class="mk">${T(c.mk)}</span>`:""}${c.src?`<small>${T(c.src)}</small>`:""}</div>`:""}
      ${c.list?`<ol class="rlist">${c.list.map(x=>`<li>${T(x)}</li>`).join("")}</ol>`:""}
      ${c.tip?`<div class="tip"><b>💡</b><span><b>${L("Tahukah anda?","تاهوکه اندا؟")}</b> ${T(c.tip)}</span></div>`:""}
      ${c.am?`<div class="tip am"><b>🌱</b><span><b>${L("Amalkan:","عملکن:")}</b> ${T(c.am)}</span></div>`:""}
      <div class="ref">📖 ${L("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</div>
      <div class="navr">
        <button class="btn alt" data-act="rprev" ${S.ri?"":"disabled"} aria-label="${L("Sebelum","سبلوم")}" style="flex:0 0 64px">${BACK()}</button>
        <button class="btn ${last?"go":""}" data-act="rnext">${last ? "⛵ "+L("Angkat sauh!","اڠکت ساوه!") : L("Seterusnya","ستروسڽ")+" ▶"}</button>
      </div>
      <div class="dots">${S.st.read.map((_,i)=>`<i class="${i===S.ri?"on":""}"></i>`).join("")}</div>
    </article>`;
  speak(readSpeech(c));
  window.scrollTo(0,0);
}

/* ===================== PULAU: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi;
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}">${S.games.map((_,i)=>`<i class="${i<k?"got":i===k?"cur":""}">${i<k?"🐚":i===k?"⛵":""}</i>`).join("")}</div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game"></section>`;
  const box = $("#game");
  const q = g.q || ["Jawab soalan ini.","جواب سوالن اين."];
  box.innerHTML = `<div class="q"><p>${T(q)}</p>${sayBtn(RU(q))}</div>${g.pic?`<div class="qpic">${g.pic}</div>`:""}<div id="play" data-type="${g.type}"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(q));
  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🦜 ${hint || L("Ombak besar! Cuba lagi.","اومبق بسر! چوبا لاڬي.")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Cekap!","چکڤ!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  if(document.querySelector(".fb")) return;
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${nuri()}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Pelayaran lancar tanpa ribut. Kamu nakhoda sirah sejati!","چمرلڠ! ڤلايرن لنچر تنڤا ريبوت. کامو نخودا سيره سجاتي!"] : stars===2 ? ["Bagus! Belayar sekali lagi untuk 3 bintang.","باڬوس! بلاير سکالي لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom belayar sekali lagi.","شاباس کران منچوبا! جوم بلاير سکالي لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${nuri("bob")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Cenderamata pulau baharu untuk kamu!","چندرامات ڤولاو بهارو اونتوق کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>⛵ ${L("Pelabuhan Bintang kini terbuka!","ڤلابوهن بينتڠ کيني تربوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🗺️ ${L("Kembali ke peta","کمبالي ک ڤتا")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); sfx.bell(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== PERMAINAN PELAYARAN ===================== */
const wheelSvg = `<svg class="wheel" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#5E3A17" stroke-width="6" stroke-linecap="round">
  ${[0,45,90,135].map(a=>`<line x1="50" y1="4" x2="50" y2="96" transform="rotate(${a} 50 50)"/>`).join("")}</g>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#8B5A2B" stroke-width="9"/><circle cx="50" cy="50" r="9" fill="#F2B134" stroke="#5E3A17" stroke-width="3"/></svg>`;
const GAMES = {
  /* Layar: pilih layar yang betul untuk dinaikkan (4 pilihan) */
  layar(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    el.innerHTML = `<div class="mast" id="mast"><span class="pole"></span><span class="sl" style="top:6px"></span><span class="sl" style="top:38px;left:22px;width:106px"></span></div>
      <div class="g1">${opts.map((o,i)=>`<button class="opt sailb" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return;
      if(opts[+b.dataset.i].ok){ done = true; sfx.creak(); b.classList.add("right"); el.querySelector("#mast").classList.add("up"); clearHint(); setTimeout(win, 600); }
      else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Layar itu koyak! Pilih layar yang lain.","لاير ايت کويق! ڤيليه لاير يڠ لاٴين.")); }
    }));
  },

  /* Kemudi: pusing kemudi ke Betul atau Salah bagi setiap kenyataan */
  kemudi(el, g){
    const order = shuffle(g.items.map((_,i)=>i)); let k = 0, busy = false;
    const draw = () => {
      const it = g.items[order[k]];
      el.innerHTML = `${wheelSvg}<div class="stmt" data-k="${order[k]}">${TX(it[0])}</div>
        <div class="g2" style="margin-top:10px"><button class="opt" data-v="1">✅ ${T(B)}</button><button class="opt" data-v="0">❌ ${T(SL)}</button></div>
        <div class="cnt">🧭 ${L(`Kenyataan ${k+1} daripada ${order.length}`,`کڽاتاٴن ${k+1} درڤد ${order.length}`)}</div>`;
      busy = false;
      el.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if((b.dataset.v==="1") === !!it[1]){ busy = true; sfx.creak(); b.classList.add("right"); el.querySelector(".wheel").classList.add(it[1]?"r":"l"); clearHint(); k++;
          if(k < order.length) setTimeout(draw, 420); else setTimeout(win, 450); }
        else oops(b, L("Kapal hampir terkandas! Baca kenyataan itu sekali lagi.","کاڤل همڤير ترکنداس! باچ کڽاتاٴن ايت سکالي لاڬي."));
      }));
    };
    draw();
  },

  /* Log buku: catat peristiwa/nama mengikut urutan yang betul */
  logbuku(el, g){
    const order = mix(g.seq.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="logp" id="log" aria-live="polite"><div style="opacity:.6">📒 ${L("Log pelayaran:","لوڬ ڤلايرن:")}</div></div>
      <div class="g1">${order.map(i=>`<button class="opt" data-k="${i}">${TX(g.seq[i])}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(+b.dataset.k === k){ sfx.tick(); b.disabled = true; b.classList.add("used");
        const row = document.createElement("div"); row.innerHTML = `${k+1}. ${TX(g.seq[k])}`; el.querySelector("#log").appendChild(row); clearHint(); k++;
        if(k === g.seq.length) setTimeout(win, 400); }
      else oops(b, L("Belum lagi! Fikir apa yang datang dahulu.","بلوم لاڬي! فيکير اڤ يڠ داتڠ دهولو."));
    }));
  },

  /* Haluan: hantar setiap muatan ke pulau (kumpulan) yang betul */
  haluan(el, g){
    const order = mix(g.items.map((_,i)=>i)); let k = 0, busy = false;
    const draw = () => {
      const it = g.items[order[k]];
      el.innerHTML = `<div class="cur" data-k="${order[k]}">📦 ${TX(it[0])}</div>
        <div class="bays ${g.bins.length>2?"g1":"g2"}">${g.bins.map((b,i)=>`<button class="opt" data-c="${i}">🏝️ ${T(b)}</button>`).join("")}</div>
        <div class="cnt">🧭 ${L(`Muatan ${k+1} daripada ${order.length}`,`موانن ${k+1} درڤد ${order.length}`)}</div>`;
      busy = false;
      el.querySelectorAll(".bays .opt").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.c === it[1]){ busy = true; sfx.bell(); b.classList.add("right"); clearHint(); k++;
          if(k < order.length) setTimeout(draw, 380); else setTimeout(win, 450); }
        else oops(b, L("Salah haluan! Baca muatan itu sekali lagi.","ساله حالوان! باچ موانن ايت سکالي لاڬي."));
      }));
    };
    draw();
  },

  /* Bintang utara: ketik lajur pertama, kemudian pasangannya */
  bintangutara(el, g){
    const L1 = mix(g.pairs.map((_,i)=>i)), R1 = mix(g.pairs.map((_,i)=>i)); let pick = null, left = g.pairs.length;
    el.innerHTML = `<div class="pairs"><div class="col">${L1.map(i=>`<button class="opt" data-side="l" data-p="${i}">⭐ ${TX(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="col">${R1.map(i=>`<button class="opt" data-side="r" data-p="${i}">${TX(g.pairs[i][1])}</button>`).join("")}</div></div>
      <div class="cnt" id="bc"></div>`;
    const count = () => { el.querySelector("#bc").textContent = "⭐ "+L(`Pasangan tinggal: ${left}`,`ڤاسڠن تيڠڬل: ${left}`); };
    count();
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(b.dataset.side==="l"){ el.querySelectorAll('[data-side="l"]').forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); pick = b; sfx.tick(); return; }
      if(!pick){ toast(L("Ketik bintang di lajur pertama dahulu ⭐","کتيق بينتڠ دلاجور ڤرتام دهولو ⭐")); return; }
      if(pick.dataset.p === b.dataset.p){ sfx.bell(); [pick,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; }); pick = null; left--; count(); clearHint();
        if(!left) setTimeout(win, 400); }
      else oops(b, L("Bintang itu tidak sepadan. Cuba lagi!","بينتڠ ايت تيدق سڤادن. چوبا لاڬي!"));
    }));
  },

  /* Buritan: isi tempat kosong dalam ayat */
  buritan(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    const parts = T(g.s).split("___");
    el.innerHTML = `<div class="sent">${parts[0]}<span class="blank" id="blank">?</span>${parts[1]||""}</div>
      <div class="g2">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return;
      if(opts[+b.dataset.i].ok){ done = true; sfx.tick(); b.classList.add("right"); el.querySelector("#blank").innerHTML = TX(opts[+b.dataset.i].x); clearHint(); setTimeout(win, 550); }
      else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Perkataan itu tidak sesuai. Cuba lagi!","ڤرکاتاٴن ايت تيدق سسواي. چوبا لاڬي!")); }
    }));
  },

  /* Tiang: pilih SEMUA bendera yang betul, kemudian naikkan */
  tiang(el, g){
    const items = mix(g.items.map((x,i)=>({x, ok:!!x[1], i}))), need = items.filter(o=>o.ok).length; let done = false;
    el.innerHTML = `<div class="g1" id="flags">${items.map((o,n)=>`<button class="opt flag" data-n="${n}" data-ok="${o.ok?1:0}" aria-pressed="false">${TX(o.x[0])}</button>`).join("")}</div>
      <div class="cnt" id="tc"></div>
      <button class="btn go" id="raise" style="margin-top:8px">⛳ ${L("Naikkan bendera!","ناٴيقکن بندير!")}</button>`;
    const count = () => { const c = el.querySelectorAll(".opt.sel").length; el.querySelector("#tc").textContent = "🚩 "+L(`Dipilih: ${c} • Cari ${need}`,`دڤيليه: ${c} • چاري ${need}`); };
    count();
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done) return; b.classList.toggle("sel"); b.classList.remove("wrong"); b.setAttribute("aria-pressed", b.classList.contains("sel")); sfx.tick(); count();
    }));
    el.querySelector("#raise").addEventListener("click", () => {
      if(done) return;
      const sel = [...el.querySelectorAll(".opt.sel")], bad = sel.filter(b=>b.dataset.ok==="0"), good = sel.length - bad.length;
      if(!bad.length && good===need){ done = true; sel.forEach(b=>b.classList.add("right")); sfx.bell(); clearHint(); setTimeout(win, 500); return; }
      bad.forEach(b=>{ b.classList.remove("sel"); b.classList.add("wrong"); b.setAttribute("aria-pressed","false"); });
      count();
      oops(el.querySelector("#flags"), bad.length ? L("Ada bendera yang salah (merah). Turunkan dan cuba lagi!","اد بندير يڠ ساله (ميره). تورونکن دان چوبا لاڬي!")
        : L(`Belum cukup: masih ada ${need-good} lagi.`,`بلوم چوکوڤ: ماسيه اد ${need-good} لاڬي.`));
    });
  },

  /* Lanun: tembak kapal yang tidak sepadan (beberapa pusingan) */
  lanun(el, g){
    let r = 0;
    const draw = () => {
      const rd = g.rounds[r], opts = mix(rd.map((x,i)=>({x, ok:i===0}))); let busy = false;
      el.innerHTML = `<div class="fleet g2">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">⛵ ${TX(o.x)}</button>`).join("")}</div>
        <div class="cnt">🏴‍☠️ ${L(`Pusingan ${r+1} daripada ${g.rounds.length}`,`ڤوسيڠن ${r+1} درڤد ${g.rounds.length}`)}</div>`;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(busy || b.disabled) return;
        if(opts[+b.dataset.i].ok){ busy = true; sfx.cannon(); b.classList.add("right","sunk"); clearHint(); r++;
          if(r < g.rounds.length) setTimeout(draw, 450); else setTimeout(win, 450); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Itu kapal kawan! Cari kapal lanun yang tidak sepadan.","ايت کاڤل کاون! چاري کاڤل لانون يڠ تيدق سڤادن.")); }
      }));
    };
    draw();
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t6-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Singgah di pulau sebelumnya dahulu 🔒","سيڠڬه د ڤولاو سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Singgahi semua ${STATIONS.length} pulau untuk ke Pelabuhan Bintang ⛵`,`سيڠڬهي سموا ${STATIONS.length} ڤولاو اونتوق ک ڤلابوهن بينتڠ ⛵`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
