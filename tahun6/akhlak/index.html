<html lang="ms">
<head>
<meta charset="utf-8">

<title>Bandar Pintar Adab • Akhlak Tahun 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Akhlak Tahun 6: "Bandar Pintar Adab" — bandar pintar masa depan, daerah disambung monorel, Bibo si landak bergoggle pintar ===== */
:root{
  --n1:#061A2E; --n2:#0B3B5C; --bg:#E8F7F8; --card:#FFFFFF; --ink:#0B2236; --muted:#4D6B80; --line:#0B2236;
  --teal:#00B3A6; --teal2:#008A80; --lime:#9BE22E; --volt:#FFD23F; --pink:#FF4F9A; --cyan:#33C9F2; --violet:#7A5CFF;
  --soft:#D9F3F1; --ok:#0FA968; --okbg:#DBF8EA; --bad:#E5364F; --badbg:#FFE1E6; --note:#FFF6D1;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --n1:#020A14; --n2:#06243A; --bg:#071923; --card:#0F2A3A; --ink:#E9FBFF; --muted:#9CC0D2; --line:#01060C;
    --soft:#133B48; --okbg:#0E3A2A; --badbg:#46202A; --note:#3A3316; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:18px;line-height:1.45;
  background:
    radial-gradient(circle at 15% 6%,rgba(51,201,242,.35) 0 2px,transparent 3px),
    radial-gradient(circle at 70% 3%,rgba(155,226,46,.5) 0 2px,transparent 3px),
    linear-gradient(180deg,var(--n1) 0,var(--n2) 200px,var(--bg) 480px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Nunito",serif;font-weight:600;font-size:19px;line-height:1.85}
h1,h2,h3,.disp{font-family:"Sora","Nunito",system-ui,sans-serif;font-weight:800;letter-spacing:-.2px;margin:0}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:700;letter-spacing:0}
.ar,[lang="ar"]{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:10px 14px 70px;position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:4px solid var(--volt);outline-offset:2px}
.sky{position:fixed;inset:0 0 auto 0;height:260px;pointer-events:none;z-index:0;opacity:.9;
  background:
    linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 100%),
    repeating-linear-gradient(90deg,transparent 0 22px,rgba(51,201,242,.10) 22px 23px)}
/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:relative;z-index:3}
.sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;text-decoration:none;box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--volt);color:#0B2236;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;box-shadow:0 4px 0 var(--line);white-space:nowrap}
/* hero */
.hero{display:flex;gap:12px;align-items:center;color:#E9FBFF;margin:4px 0 12px}
.hero h1{font-size:28px;line-height:1.1;color:#fff;text-shadow:0 0 14px rgba(51,201,242,.65)}
.hero p{margin:4px 0 0;font-size:16px;color:#BFEAF7}
.bibo{width:92px;height:92px;flex:0 0 auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.bibo.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bibo .lens{animation:scan 3s linear infinite}
@keyframes scan{0%,70%{opacity:1}80%{opacity:.4}90%{opacity:1}}
/* papan pelekat: dok cip */
.sttl{color:#E9FBFF;font-weight:900;margin:6px 0}
.dock{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;background:rgba(6,26,46,.75);border:3px solid var(--cyan);border-radius:16px;padding:8px;margin-bottom:14px;box-shadow:0 0 18px rgba(51,201,242,.35)}
.dock span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:10px;background:#0E2D44;filter:grayscale(1);opacity:.35}
.dock span.got{filter:none;opacity:1;background:#11466A;box-shadow:inset 0 0 0 2px var(--lime)}
/* peta: laluan monorel */
.city{position:relative;padding:8px 0 20px}
.city::before{content:"";position:absolute;top:10px;bottom:30px;left:50%;width:14px;margin-left:-7px;border-radius:8px;
  background:repeating-linear-gradient(180deg,#9FB7C6 0 10px,#6E8A9C 10px 14px);border:3px solid var(--line);box-shadow:0 0 0 4px rgba(51,201,242,.25)}
.stop{position:relative;display:flex;width:100%;margin:0 0 18px;border:0;background:none;padding:0;text-align:start;z-index:1}
.stop:nth-of-type(even){justify-content:flex-end}
.pod{position:relative;width:calc(50% - 16px);min-height:118px;border:3px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--line);padding:10px 10px 10px;
  display:flex;flex-direction:column;gap:2px;overflow:hidden}
.pod::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.pod .no{font:800 12px/1.2 "Sora",sans-serif;color:var(--muted);margin-top:4px;letter-spacing:.4px}
html[dir="rtl"] .pod .no{font-family:"Noto Naskh Arabic",serif;letter-spacing:0}
.pod .ic{font-size:30px;line-height:1.1}
.pod .nm{font-weight:900;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.pod .st{font-size:13px;min-height:16px}
.stop .dot{position:absolute;top:44px;left:50%;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--card);border:4px solid var(--line);z-index:2}
.stop.done .dot{background:var(--lime)}
.stop.now .dot{background:var(--volt);box-shadow:0 0 0 6px rgba(255,210,63,.4)}
.stop.now .pod{border-color:var(--teal2);box-shadow:0 5px 0 var(--teal2),0 0 0 4px rgba(0,179,166,.3)}
.stop.lock .pod{background:#C9D6DE;color:#56707F}
@media (prefers-color-scheme: dark){ .stop.lock .pod{background:#1C3341;color:#7F9AAA} }
.stop .train{position:absolute;top:2px;left:50%;margin-left:-20px;font-size:34px;z-index:3;animation:bob 1.6s ease-in-out infinite}
.stop.tower .pod{width:100%;min-height:120px;background:linear-gradient(135deg,#0B3B5C,#1E6E8C);color:#fff;align-items:center;text-align:center}
.stop.tower.lock .pod{background:linear-gradient(135deg,#3E5566,#5D7686);color:#E3EDF2}
.stop.tower .pod .no{color:#BFEAF7}
.stop.tower{margin-top:40px}
.stop.tower .dot{top:-34px}
.stop.tower .train{top:-48px}
.ground{position:relative;z-index:3;color:#0B2236;background:var(--volt);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:900;text-align:center;box-shadow:0 4px 0 var(--line)}
</style>
<style>
/* ===== stesen, kad bacaan, main, keputusan ===== */
.shead{display:flex;gap:10px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--line);margin-bottom:10px;border-inline-start:12px solid var(--c)}
.shead .ic{font-size:32px}
.shead h2{font-size:21px;line-height:1.2}
.shead small{color:var(--muted);font-weight:800;font-size:14px}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--line);margin-bottom:14px;position:relative}
.slate{display:flex;align-items:center;gap:6px;background:#0B2236;color:#9BE22E;border-radius:10px;padding:5px 10px;margin:-2px 0 10px;font:700 14px/1.3 "Sora",sans-serif}
html[dir="rtl"] .slate{font-family:"Noto Naskh Arabic",serif}
.rpic{font-size:46px;text-align:center;line-height:1.2;margin:4px 0 6px}
.rh{font-size:21px;line-height:1.3;display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.rtext{margin:6px 0}
.rlist{margin:6px 0;padding-inline-start:0;list-style:none;display:grid;gap:7px}
.rlist li{background:var(--soft);border-radius:12px;padding:7px 10px 7px 10px;border-inline-start:6px solid var(--teal)}
.rlist.good li{background:var(--okbg);border-color:var(--ok)}
.rlist.bad li{background:var(--badbg);border-color:var(--bad)}
.abox{background:var(--note);border:3px dashed var(--teal2);border-radius:16px;padding:10px 12px;margin:10px 0;display:grid;gap:6px}
.abox .ar{font-size:27px;line-height:2.05;text-align:center}
.abox small{color:var(--muted);text-align:center}
.abox .mk{font-size:16px}
.tip{display:flex;gap:8px;background:var(--soft);border-radius:14px;padding:8px 10px;margin:8px 0;font-size:16px}
.ref{color:var(--muted);font-size:14px;margin-top:8px}
.navr{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:54px;border:3px solid var(--line);border-radius:16px;background:var(--teal);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);padding:6px 12px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.go{background:var(--pink);width:100%}
.btn[disabled]{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:#B9CCD6}.dots i.on{background:var(--teal);width:22px;border-radius:6px}
.say{border:3px solid var(--line);background:var(--volt);border-radius:12px;min-width:44px;height:44px;font-size:20px;flex:0 0 auto;box-shadow:0 3px 0 var(--line);color:#0B2236}
/* kemajuan */
.prog{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prog .lbl{background:#0B2236;color:var(--lime);border-radius:10px;padding:4px 10px;font:700 14px/1.3 "Sora",sans-serif;white-space:nowrap;direction:ltr}
.prog .rail{flex:1;display:flex;gap:4px;direction:ltr}
html[dir="rtl"] .prog .rail{direction:rtl}
.prog .rail span{flex:1;height:12px;border-radius:6px;background:#B9CCD6;border:2px solid var(--line)}
.prog .rail span.ok{background:var(--lime)}.prog .rail span.cur{background:var(--volt)}
.q{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.q p{margin:0;font-weight:900;font-size:19px}
.hint{margin-top:10px;background:var(--badbg);border-radius:12px;padding:8px 10px;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.grid1{display:grid;gap:9px}
.opt{min-width:0;overflow-wrap:anywhere;min-height:58px;border:3px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--line);padding:8px 10px;font-weight:800;font-size:16px;line-height:1.3}
html[dir="rtl"] .opt{line-height:1.7}
.opt.ar,.wd.ar{font-family:"Amiri",serif;font-size:24px;line-height:1.7;font-weight:400}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.right{background:var(--okbg)!important;border-color:var(--ok)!important;box-shadow:0 4px 0 var(--ok)!important}
.wrong{background:var(--badbg)!important;border-color:var(--bad)!important;opacity:.75}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
/* maklum balas */
.fb{position:fixed;inset:auto 0 0 0;z-index:20;padding:12px;animation:up .3s ease-out}
.fb .in{max-width:560px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 -4px 0 var(--line),0 0 0 999px rgba(2,10,20,.45)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .bibo{width:66px;height:66px}
.fb strong{font-family:"Sora",sans-serif;font-size:22px;color:var(--teal2)}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif}
.fb p{margin:2px 0 0;font-size:16px}
.zap{color:var(--pink)}
@keyframes up{from{transform:translateY(100%)}}
/* keputusan */
.res{text-align:center}
.res .bibo{width:120px;height:120px}
.stars{font-size:44px;margin:4px 0}
.stars span{display:inline-block;animation:pop .5s backwards}
.stars .off,.st .off{filter:grayscale(1);opacity:.3}
@keyframes pop{from{transform:scale(0)}}
.gotst{display:flex;gap:10px;align-items:center;justify-content:center;background:var(--soft);border-radius:14px;padding:8px;margin:10px 0}
.gotst span{font-size:40px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:#0B2236;color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* ===== permainan bandar pintar ===== */
/* dron: hantar pakej ke bumbung */
.dsky{position:relative;background:linear-gradient(180deg,#0B3B5C,#1E6E8C);border:3px solid var(--line);border-radius:16px;padding:12px 12px 10px;margin-bottom:10px;color:#fff;overflow:hidden}
.dsky .sit{margin:0;font-size:17px;position:relative;z-index:1}
.dsky .drone{position:absolute;top:6px;inset-inline-end:8px;width:58px;height:34px;transition:transform .5s ease-in;animation:hover 1.2s ease-in-out infinite}
.dsky .drone.go{animation:none;transform:translateY(160px) scale(.6)}
@keyframes hover{50%{transform:translateY(-4px)}}
.dsky .sit{padding-inline-end:62px}
.pad{position:relative;padding-top:20px}
.pad::before{content:"H";position:absolute;top:2px;left:50%;transform:translateX(-50%);font:800 12px/1 "Sora",sans-serif;color:var(--muted);border:2px solid var(--muted);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
/* hologram: isi tempat kosong */
.holo{position:relative;background:radial-gradient(ellipse at 50% 120%,rgba(51,201,242,.55),transparent 65%),#061A2E;color:#BFF6FF;border:3px solid var(--line);border-radius:16px;padding:14px 12px 24px;margin-bottom:12px;text-align:center;font-size:19px;line-height:1.7;text-shadow:0 0 8px rgba(51,201,242,.8)}
.holo::after{content:"";position:absolute;left:30%;right:30%;bottom:6px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
.holo.ar{font-family:"Amiri",serif;font-size:26px;line-height:2.1}
.gap{display:inline-block;min-width:64px;border-bottom:3px dashed var(--lime);color:var(--lime);padding:0 6px}
.gap.fill{border-bottom-style:solid;color:#fff}
/* sensor: pintu imbasan */
.gate{position:relative;background:#0B2236;color:#fff;border:3px solid var(--line);border-radius:16px;padding:16px 14px;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;overflow:hidden;margin-bottom:10px}
.gate::before{content:"";position:absolute;left:0;right:0;height:4px;background:var(--lime);box-shadow:0 0 12px var(--lime);top:0;animation:beam 2s linear infinite;opacity:.8}
@keyframes beam{to{top:100%}}
.gate.ok{box-shadow:inset 0 0 0 4px var(--lime)}.gate.no{box-shadow:inset 0 0 0 4px var(--bad)}
.sbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sb{min-height:60px;border:3px solid var(--line);border-radius:16px;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--line);color:#0B2236}
.sb.y{background:var(--lime)}.sb.n{background:#FF8FA3}
.cnt{text-align:center;color:var(--muted);font-weight:900;margin-top:8px}
/* panel suria: pilih semua */
.solar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:#0B2236;border:3px solid var(--line);border-radius:16px;padding:8px;margin-bottom:10px}
.cell{min-width:0;overflow-wrap:anywhere;min-height:70px;border:2px solid #3B6E8F;border-radius:10px;padding:6px 8px;font-weight:800;font-size:15px;line-height:1.3;color:#DFF6FF;
  background:repeating-linear-gradient(90deg,#14466A 0 18px,#0F3958 18px 20px),#14466A}
html[dir="rtl"] .cell{line-height:1.7}
.cell.on{background:linear-gradient(135deg,#FFE47A,#FFD23F);color:#0B2236;border-color:var(--volt);box-shadow:0 0 12px rgba(255,210,63,.7)}
.batt{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:900;font-size:15px}
.batt .b{flex:1;height:18px;border:3px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft)}
.batt .b i{display:block;height:100%;width:0;background:var(--lime);transition:width .3s}
/* monorel: susun gerabak */
.track{min-height:76px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:repeating-linear-gradient(90deg,#9FB7C6 0 14px,#6E8A9C 14px 18px) bottom/100% 8px no-repeat,var(--soft);border:3px solid var(--line);border-radius:14px;padding:8px 8px 16px;margin-bottom:10px}
.track.ar{direction:rtl}
.track:empty::before{content:"🚝 . . .";color:var(--muted);font-weight:900}
.car{background:var(--cyan);color:#0B2236;border:3px solid var(--line);border-radius:12px 12px 6px 6px;padding:2px 10px;font-weight:900;font-size:15px;line-height:1.4}
.car.ar{font-family:"Amiri",serif;font-size:24px;line-height:1.6;font-weight:400}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pool.ar{direction:rtl}
.wd{min-width:0;overflow-wrap:anywhere;border:3px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);padding:6px 12px;font-weight:800;font-size:16px;line-height:1.35;min-height:48px}
.wd.used{visibility:hidden}
.pool.steps{display:grid;gap:8px}
.pool.steps .wd{text-align:start}
.track.steps{flex-direction:column;align-items:stretch}
.track.steps .car{border-radius:10px;font-size:15px}
/* robotik: lengan robot mengisih */
.claw{text-align:center;margin-bottom:10px}
.claw .arm{font-size:30px;line-height:1}
.claw .item{display:inline-block;max-width:100%;background:var(--note);border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--line)}
.bins{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px}
.bin{min-width:0;overflow-wrap:anywhere;min-height:84px;border:3px solid var(--line);border-radius:10px 10px 18px 18px;background:var(--soft);box-shadow:0 4px 0 var(--line);font-weight:900;font-size:15px;padding:8px 6px;line-height:1.3}
.bin b{display:block;font-size:24px}
.bin:nth-child(1){background:#CFF5E3}.bin:nth-child(2){background:#FFD9E3}.bin:nth-child(3){background:#E3DCFF}
@media (prefers-color-scheme: dark){ .bin:nth-child(1){background:#14432F}.bin:nth-child(2){background:#4A2030}.bin:nth-child(3){background:#2D2552} .claw .item{color:var(--ink)} }
/* kod QR: padankan */
.qrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qcol{display:grid;gap:8px;align-content:start}
.qr{min-width:0;overflow-wrap:anywhere;min-height:62px;border:3px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--line);padding:8px 8px;padding-inline-end:22px;font-weight:800;font-size:15px;line-height:1.3;text-align:start;

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[700,.1,"triangle"],[1050,.16,"triangle"]]),
  tick: () => tone([[880,.06,"square"]]),
  no:   () => tone([[240,.16,"sawtooth"],[180,.2,"sawtooth"]]),
  scan: () => tone([[1200,.04,"sine"],[1600,.05,"sine"]]),
  zoom: () => tone([[400,.06],[600,.06],[900,.08]]),
  win:  () => tone([[523,.12],[659,.12],[784,.12],[1046,.3,"triangle"]])
};

/* ---------- Suara: baca teks Rumi sahaja, buang tulisan Arab ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const noArab = s => String(s||"").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/[“”]/g,"").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const clean = noArab(text).replace(/…/g," ... ").replace(/___/g," ... ").replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(/\bQR\b/g,"kiu ar");
    if(!clean || !/[A-Za-z0-9]/.test(clean)) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

    let done = false;
    el.innerHTML = `<div class="dsky">${droneSVG}<p class="sit">${T(g.sit)}</p></div>
      <div class="grid2">${opts.map(o=>`<button class="opt pad" data-i="${o.i}">${T(o.x)}</button>`).join("")}</div>`;
    speak(RU(g.sit));
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(+b.dataset.i===0){ done = true; b.classList.add("right"); const d = el.querySelector("#dr"); if(d) d.classList.add("go"); sfx.zoom(); setTimeout(win, 550); }
      else { b.classList.add("wrong"); oops(b, L("Dron tersasar! Fikir semula: apakah yang beradab?","درون ترسسر! فيكير سمولا: اڤاكه يڠ برادب؟")); }
    }));
  },

  /* Hologram: isi tempat kosong (teks atau ayat al-Quran) */
  hologram(el, g){
    let line, opts, ans; const isAr = !!g.qk;
    if(isAr){
      const w = QW(QF(...g.qk)); ans = w[g.gap];
      const others = shuffle([...new Set(w.filter((x,i)=>i!==g.gap && x!==ans))]).slice(0,3);
      opts = shuffle([ans, ...others]).map(x=>({x, ok:x===ans}));
      line = w.map((x,i)=> i===g.gap ? `<span class="gap" id="gap">؟</span>` : x).join(" ");
    } else {
      opts = shuffle(g.a.map((x,i)=>({x:T(x), ok:i===0}))); ans = T(g.a[0]);
      line = T(g.s).replace("___", `<span class="gap" id="gap">?</span>`);
    }
    el.innerHTML = `<div class="holo ${isAr?"ar":""}" id="line" ${isAr?'lang="ar"':""}>${line}</div>
      <div class="grid2">${opts.map((o,i)=>`<button class="opt ${isAr?"ar":""}" data-i="${i}" data-ok="${o.ok?1:0}">${o.x}</button>`).join("")}</div>`;
    let done = false;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(b.dataset.ok==="1"){ done = true; b.classList.add("right"); const gp = el.querySelector("#gap"); gp.textContent = ans; gp.classList.add("fill"); sfx.tick(); setTimeout(win, 450); }
      else { b.classList.add("wrong"); oops(b, isAr ? L("Bukan perkataan itu. Baca semula ayat pada kad data.","بوكن ڤركاتاٴن ايت. باچ سمولا ايات ڤد كد داتا.") : L("Hologram berkelip! Cuba perkataan lain.","هولوڬرم بركليڤ! چوبا ڤركاتاٴن لاٴين.")); }
    }));
  },

  /* Sensor: pintu imbasan — Lulus atau Sekat setiap kenyataan */
  sensor(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="gate" id="scr">${T(items[k][0])}</div>
        <div class="sbtns"><button class="sb y" data-v="1">✅ ${L("Lulus","لولوس")}</button><button class="sb n" data-v="0">⛔ ${L("Sekat","سکت")}</button></div>
        <div class="cnt">${k+1} / ${items.length}</div>`;
      speak(RU(items[k][0]));
      el.querySelectorAll(".sb").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.v===items[k][1]){ sfx.scan(); clearHint(); k++; if(k<items.length) draw(); else { el.querySelector("#scr").classList.add("ok"); setTimeout(win, 250); } }
        else { el.querySelector("#scr").classList.add("no"); oops(b, items[k][1] ? L("Sensor silap! Kenyataan ini betul, biar ia lulus.","سنسور سيلڤ! كنياتاٴن اين بتول، بيار اي لولوس.") : L("Sensor silap! Kenyataan ini patut disekat.","سنسور سيلڤ! كنياتاٴن اين ڤاتوت دسکت.")); }
      }));
    };
    draw();
  },

  /* Panel suria: pilih SEMUA jawapan betul, kemudian hidupkan */
  panelsuria(el, g){
    const order = shuffle(g.items.map((x,i)=>i)), need = g.items.filter(x=>x[1]).length;
    el.innerHTML = `<div class="batt">🔋<span class="b"><i id="bat"></i></span><span id="bn">0/${need}</span></div>
      <div class="solar">${order.map(i=>`<button class="cell" data-i="${i}" aria-pressed="false">${T(g.items[i][0])}</button>`).join("")}</div>
      <button class="btn go" id="pwr">⚡ ${L("Hidupkan panel","هيدوڤكن ڤانل")}</button>`;
    const upd = () => { const on = el.querySelectorAll(".cell.on").length; el.querySelector("#bat").style.width = Math.min(100, on/need*100)+"%"; el.querySelector("#bn").textContent = `${on}/${need}`; };
    let done = false;
    el.querySelectorAll(".cell").forEach(b => b.addEventListener("click", () => {
      if(done) return; b.classList.toggle("on"); b.setAttribute("aria-pressed", b.classList.contains("on")); sfx.tick(); clearHint(); upd();
    }));
    el.querySelector("#pwr").addEventListener("click", () => {
      if(done) return;
      const cells = [...el.querySelectorAll(".cell")];
      const bad = cells.filter(c => c.classList.contains("on") !== !!g.items[+c.dataset.i][1]).length;
      if(!bad){ done = true; cells.filter(c=>c.classList.contains("on")).forEach(c=>c.classList.add("right")); setTimeout(win, 350); }
      else oops(el.querySelector("#pwr"), L(`Litar belum lengkap: ${bad} panel belum betul. Semak semula.`,`ليتر بلوم لڠكڤ: ${bad} ڤانل بلوم بتول. سمق سمولا.`));
    });
  },

  /* Monorel: tap gerabak mengikut tertib (perkataan ayat atau langkah) */
  monorel(el, g){
    const isAr = !!g.qk;
    const words = isAr ? QW(qText(g.qk)) : g.steps.map(T);
    const pool = mix(words.map((_,i)=>i));
    let k = 0; const placed = [];
    el.innerHTML = `<div class="track ${isAr?"ar":"steps"}" id="tr" ${isAr?'lang="ar"':""}></div>
      <div class="pool ${isAr?"ar":"steps"}">${pool.map(i=>`<button class="wd ${isAr?"ar":""}" data-w="${i}">${words[i]}</button>`).join("")}</div>`;
    const tr = el.querySelector("#tr");
    el.querySelectorAll(".wd").forEach(b => b.addEventListener("click", () => {
      if(k>=words.length || b.classList.contains("used")) return;
      if(words[+b.dataset.w]===words[k]){
        b.classList.add("used"); placed.push(words[k]); k++; sfx.tick(); clearHint();
        const c = document.createElement("span"); c.className = "car"+(isAr?" ar":""); c.textContent = placed[placed.length-1]; tr.appendChild(c);
        tr.dataset.txt = placed.join(" ");
        if(k===words.length){ sfx.zoom(); setTimeout(win, 500); }
      } else oops(b, isAr ? L("Gerabak salah! Lihat semula tertib ayat pada kad data.","ڬرابق ساله! ليهت سمولا ترتيب ايات ڤد كد داتا.") : L("Gerabak salah! Fikir: yang mana datang dahulu?","ڬرابق ساله! فيكير: يڠ مان داتڠ دهولو؟"));
    }));
  },

  /* Robotik: lengan robot mengisih setiap item ke dalam tong yang betul */
  robotik(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="claw"><div class="arm" aria-hidden="true">🦾</div><div class="item" id="cur">${T(items[k][0])}</div></div>
        <div class="bins" style="--n:${g.bins.length}">${g.bins.map((b,i)=>`<button class="bin" data-b="${i}"><b>📦</b>${T(b)}</button>`).join("")}</div>
        <div class="cnt">${k+1} / ${items.length}</div>`;
      speak(RU(items[k][0]));
      el.querySelectorAll(".bin").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.b===items[k][1]){ sfx.tick(); clearHint(); k++; if(k<items.length) draw(); else setTimeout(win, 250); }
        else oops(b, L("Tong salah! Baca item itu sekali lagi.","توڠ ساله! باچ ايتم ايت سکالي لاڬي."));
      }));
    };
    draw();
  },

  /* Kod QR: tap kod kiri, kemudian kod kanan yang sepadan */
  kodqr(el, g){
    const lo = mix(g.pairs.map((_,i)=>i)), ro = mix(g.pairs.map((_,i)=>i));
    let sel = null, left = g.pairs.length;
    el.innerHTML = `<div class="qrs"><div class="qcol">${lo.map(i=>`<button class="qr" data-l="${i}">${T(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="qcol">${ro.map(i=>`<button class="qr" data-r="${i}">${T(g.pairs[i][1])}</button>`).join("")}</div></div>`;
    el.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      el.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.l; sfx.scan(); clearHint();
    }));
    el.querySelectorAll("[data-r]").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(sel===null){ toast(L("Imbas kod di lajur kiri dahulu 📷","ايمبس كود دلاجور كيري دهولو 📷")); return; }
      const lb = el.querySelector(`[data-l="${sel}"]`);
      if(+b.dataset.r===sel){ lb.classList.remove("sel"); lb.classList.add("done"); b.classList.add("done"); sel = null; left--; sfx.tick(); clearHint(); if(!left) setTimeout(win, 300); }
      else oops(b, L("Kod tidak sepadan! Cuba pasangan lain.","كود تيدق سڤادن! چوبا ڤاسڠن لاٴين."));
    }));
  },

  /* Hyperloop: kuiz pantas berturut-turut, bonus ⚡ jika menjawab dalam 8 saat */
  hyperloop(el, g){
    let k = 0, fast = 0, tq = Date.now();
    const draw = () => {
      const q = g.qs[k], opts = shuffle(q.a.map((x,i)=>({x,i})));
      tq = Date.now();
      el.innerHTML = `<div class="loop"><span>🚄 ${k+1}/${g.qs.length}</span><span class="pod2"><i style="width:${k/g.qs.length*100}%"></i></span><span>⚡ ${fast}</span></div>
        <p class="rq">${T(q.q)}</p><div class="grid1">${opts.map(o=>`<button class="opt" data-i="${o.i}">${T(o.x)}</button>`).join("")}</div>`;
      speak(RU(q.q));
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(b.classList.contains("wrong") || k>=g.qs.length) return;
        if(+b.dataset.i===0){ if(Date.now()-tq < 8000) fast++; k++; sfx.zoom(); clearHint(); if(k<g.qs.length) draw(); else win(`⚡ ${fast}/${g.qs.length} ${L("jawapan pantas!","جاوڤن ڤنتس!")}`); }
        else { b.classList.add("wrong"); oops(b, L("Brek kecemasan! Cuba jawapan lain.","بريک كچمسن! چوبا جاوڤن لاٴين.")); }
      }));
    };
    draw();
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t6-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan daerah sebelumnya dahulu 🔒","سلسايكن دايره سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} daerah untuk membuka Menara Kawalan 📡`,`سلسايكن سموا ${STATIONS.length} دايره اونتوق ممبوک منارا كاولن 📡`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa selepas tukar tulisan/suara (tanpa ulang bunyi/konfeti)
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
