<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A2511">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Kebun Kurma Hafiz • Hafazan Tahun 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Nunito:wght@400;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Hafazan Tahun 6: "Kebun Kurma Hafiz" — oasis kebun kurma, satu pokok kurma untuk setiap stesen, Ummi si Fenek ===== */
:root{
  --date:#4A2511; --date2:#7A3E1D; --palm:#2F6B3A; --palm2:#4C9A55; --frond:#8CC63F; --sand:#F3DFB0; --sand2:#E9C46A;
  --oasis:#1E8C8C; --oasis2:#6CD4C9; --gold:#F2A93B; --terra:#C8553D; --fox:#E8A55A;
  --bg:#FBF3E1; --card:#FFFDF7; --ink:#2B1A0E; --muted:#6E5640; --line:#3A200D;
  --ok:#2E7D3A; --okbg:#DFF3DC; --bad:#B8321F; --badbg:#FBE1DA; --note:#FFF1C9; --chip:#F4E6C8;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#170D06; --card:#26170C; --ink:#F7EBD8; --muted:#C9B293; --line:#0B0502;
    --okbg:#173A1D; --badbg:#3F1910; --note:#33260F; --chip:#3A2715; --sand:#4A3519; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 "Nunito",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;min-height:100vh;
  background-image:radial-gradient(circle at 10% 0%,#F2A93B22 0 120px,transparent 121px)}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Nunito",serif;font-size:18px;line-height:1.85}
h1,h2,h3,.disp{font-family:"El Messiri","Nunito",sans-serif}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3{font-family:"Noto Naskh Arabic",serif}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 90px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.ar{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:25px;line-height:2.15}
.mark{font-family:"Amiri","Noto Naskh Arabic",serif;color:var(--date2);font-size:.8em;white-space:nowrap}
@media (prefers-color-scheme: dark){ .mark{color:var(--gold)} }
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sp{flex:1}
.ib{min-width:46px;height:46px;padding:0 10px;border-radius:16px 16px 16px 6px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-weight:800;text-decoration:none;color:var(--ink);font-size:18px;box-shadow:0 3px 0 var(--line)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--gold);color:#2B1A0E;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800}
/* ---------- hero ---------- */
.hero{display:flex;gap:10px;align-items:center;border-radius:26px;padding:12px;color:#fff;border:3px solid var(--line);
  background:radial-gradient(circle at 88% 18%,#FFE7A3 0 16px,#F2A93B55 17px 26px,transparent 27px),
    linear-gradient(180deg,#F08A4B 0%,#C8553D 38%,#7A3E1D 72%,#4A2511 100%)}
.hero h1{margin:0;font-weight:700;font-size:27px;line-height:1.15;color:#FFE7A3}
html[dir=rtl] .hero h1{line-height:1.6}
.hero p{margin:4px 0 0;font-size:15px;line-height:1.4}
html[dir=rtl] .hero p{line-height:1.8}
.ummi{width:96px;height:96px;flex:0 0 auto}
.wag .tl{animation:wag 1.6s ease-in-out infinite;transform-origin:30px 92px}
.wag .er{animation:ear 3s ease-in-out infinite;transform-origin:60px 40px}
@keyframes wag{50%{transform:rotate(-14deg)}}
@keyframes ear{0%,80%,100%{transform:none}88%{transform:rotate(-6deg)}}
.sttl{margin:12px 0 4px;font-weight:800;color:var(--muted)}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.stickers span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--chip);border:2px dashed var(--muted);filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;border:2px solid var(--line);background:var(--sand2)}
/* ---------- peta: oasis dengan falaj (terusan air) ---------- */
.grove{position:relative;margin-top:14px;padding:12px 6px 18px;border-radius:28px;border:3px solid var(--line);
  background:radial-gradient(circle at 15% 8%,#ffffff55 0 3px,transparent 4px),radial-gradient(circle at 80% 40%,#ffffff44 0 2px,transparent 3px),
    linear-gradient(180deg,#F7E3B5 0%,#EFCF8E 55%,#E3B66A 100%)}
@media (prefers-color-scheme: dark){ .grove{background:linear-gradient(180deg,#3B2A14 0%,#2E200F 60%,#22170A 100%)} }
.grove::before{content:"";position:absolute;top:44px;bottom:70px;left:50%;width:14px;margin-left:-7px;border-radius:8px;
  background:repeating-linear-gradient(180deg,var(--oasis2) 0 14px,var(--oasis) 14px 28px);border:2px solid var(--line);opacity:.85}
.gate,.spring{position:relative;z-index:1;margin:0 auto 10px;width:max-content;max-width:94%;text-align:center;font-weight:800;padding:6px 14px;border-radius:999px;border:3px solid var(--line);background:var(--card)}
.spring{margin:6px auto 10px;background:var(--oasis);color:#fff}
.row{position:relative;z-index:1;display:flex;margin:8px 0}
.row.l{justify-content:flex-start}.row.r{justify-content:flex-end}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:6px;width:76%;min-height:92px;padding:8px 10px;border-radius:22px;border:3px solid var(--line);
  background:var(--card);box-shadow:0 4px 0 var(--line);text-align:start}
.node:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.node.now{outline:4px solid var(--gold);outline-offset:2px}
.node.lock{filter:grayscale(.85);opacity:.7}
.node .num{position:absolute;top:-10px;inset-inline-start:-8px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:15px}
.node .palm{width:54px;height:74px;flex:0 0 auto}
.node .nm{display:flex;flex-direction:column;font-weight:800;line-height:1.2;min-width:0}
html[dir=rtl] .node .nm{line-height:1.6}
.node .jn{font-weight:700;color:var(--c);font-size:15px}
@media (prefers-color-scheme: dark){ .node .jn{color:var(--gold)} }
.node .st{font-size:14px;color:var(--muted)}
.node .st .off{filter:grayscale(1);opacity:.35}
.node .here{position:absolute;width:56px;height:56px;top:-26px;inset-inline-end:-12px}
.node.final{width:92%;margin:0 auto;background:linear-gradient(180deg,var(--card),var(--note))}
.lockic{position:absolute;bottom:4px;inset-inline-end:8px;font-size:18px}
</style>
<style>
/* ---------- stesen: kad baca ---------- */
.shead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.shead h2{margin:0;font-size:22px;line-height:1.2}
html[dir=rtl] .shead h2{line-height:1.6}
.shead small{color:var(--muted);font-weight:700}
.badge{width:52px;height:52px;border-radius:18px 18px 18px 6px;display:grid;place-items:center;font-size:28px;background:var(--c);border:3px solid var(--line);flex:0 0 auto}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 5px 0 var(--line);border-top:10px solid var(--sc,var(--palm))}
.rpic{font-size:44px;text-align:center}
.rh{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;margin:4px 0 10px;font-size:21px}
.say{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:var(--sand2);flex:0 0 auto;font-size:18px}
.surah{text-align:center;background:var(--note);border-radius:18px;padding:10px;border:2px dashed var(--date2)}
.surah .ar{display:inline}
.bsm{display:block}
.ptg .pr{border-bottom:2px dashed var(--chip);padding:6px 0}
.wds{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:flex-start}
.wd{background:var(--chip);border-radius:12px;padding:0 8px;font-size:22px}
.full{text-align:center}
.mkl{list-style:none;margin:0;padding:0}
.mkl li{border-bottom:2px dashed var(--chip);padding:6px 0;text-align:center}
.mkl .m{display:flex;gap:8px;align-items:flex-start;text-align:start}
.mkl .m b{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--palm);color:#fff;display:grid;place-items:center;font-size:14px}
.tip{display:flex;gap:8px;background:var(--note);border-radius:16px;padding:10px;margin:8px 0}
.tip ul{margin:4px 0;padding-inline-start:20px}
.abox{margin-top:8px;padding:8px;border-radius:14px;background:var(--card);border:2px solid var(--gold);text-align:center}
.abox .ar{display:block}
.abox small{display:block;color:var(--muted)}
.ref{margin-top:10px;font-size:14px;color:var(--muted);font-weight:700;text-align:center}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:52px;border-radius:18px;border:3px solid var(--line);background:var(--chip);font-weight:800;box-shadow:0 4px 0 var(--line);width:100%}
.btn.go{background:var(--palm);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--chip);border:2px solid var(--line)}
.dots i.on{background:var(--gold)}
/* ---------- main ---------- */
.prog{position:relative;height:26px;border-radius:999px;border:3px solid var(--line);background:var(--sand);margin:0 0 12px;overflow:visible}
.prog .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:linear-gradient(90deg,var(--palm2),var(--frond))}
.prog .end{position:absolute;inset-inline-end:-6px;top:-10px;font-size:24px}
.prog .ft{position:absolute;top:-12px;font-size:24px;transform:translateX(-50%)}
html[dir=rtl] .prog .ft{transform:translateX(50%)}
.q{display:flex;gap:8px;align-items:flex-start;font-weight:800}
.q p{margin:0 0 8px;flex:1}
.rnd{text-align:center;font-weight:800;color:var(--muted);margin:6px 0}
.hint{margin-top:10px;background:var(--badbg);border-radius:14px;padding:8px 10px;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cur,.qar,.pair{text-align:center;background:var(--note);border-radius:16px;padding:6px 10px;border:2px solid var(--sand2)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.op{min-height:56px;border-radius:18px;border:3px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);padding:2px 10px;min-width:0;overflow-wrap:anywhere}
.op.right{background:var(--okbg);border-color:var(--ok)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
/* perigi */
.well{display:flex;justify-content:center;gap:12px;font-size:30px}
.well span{opacity:.3;filter:grayscale(1)}.well span.on{opacity:1;filter:none}
/* tandan */
.basket{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center;min-height:62px;padding:8px;border-radius:0 0 30px 30px;border:3px solid var(--line);
  background:repeating-linear-gradient(45deg,#C98B4B 0 8px,#A86B32 8px 16px);margin-bottom:12px}
.basket .slot{width:44px;height:44px;border-radius:50%;border:2px dashed #fff8}
.basket .dt{background:var(--card);border-radius:14px;padding:0 8px;border:2px solid var(--line);font-size:22px}
.bunch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.date{min-width:64px;min-height:56px;border-radius:28px 28px 22px 22px;border:3px solid var(--line);background:radial-gradient(circle at 35% 30%,#B5651D,#6B2F10);color:#fff;padding:0 10px}
.date.used{visibility:hidden}
.date .ar{font-size:23px}
/* pelepah */
.frond{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:center;padding:8px;border-radius:18px;background:var(--okbg);border:2px solid var(--palm2)}
.frond .w{font-size:23px}
.frond .gap{min-width:70px;border-bottom:4px dotted var(--palm);text-align:center;color:var(--muted);font-size:22px}
.frond .gap.cur{background:var(--note);border-radius:10px;border:3px solid var(--gold)}
.frond .gap.fil{border-bottom:4px solid var(--palm);color:var(--ink)}
/* bayu */
.dune{text-align:center;padding:10px;border-radius:18px;border:3px solid var(--line);color:#2B1A0E;font-weight:700;
  background:radial-gradient(ellipse at 30% 120%,#E3B66A 0 60%,transparent 61%),linear-gradient(180deg,#BFE6F0,#F7E3B5)}
.dune .wind{font-size:28px;display:block}
/* falaj */
.flow{display:flex;flex-direction:column;gap:8px}
.fl{min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);padding:0 10px}
.fl.used{opacity:.25}
.channel{margin-top:12px;border-radius:18px;border:3px solid var(--line);background:var(--sand);padding:6px;display:flex;flex-direction:column;gap:6px}
.channel .wait{height:44px;border-radius:12px;border:2px dashed var(--oasis)}
.channel .in{border-radius:12px;background:linear-gradient(90deg,var(--oasis2),#BFF1EA);color:#14302E;text-align:center;padding:0 6px}
.channel .in::before{content:"🌴 ";font-size:18px}
/* fatamorgana */
.pair .arw{font-size:24px}
.pair.mir{background:linear-gradient(180deg,var(--note),#BFE6F0)}
.tf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tf button{min-height:60px;border-radius:18px;border:3px solid var(--line);font-weight:800;box-shadow:0 3px 0 var(--line);min-width:0;overflow-wrap:anywhere}
.tf .yes{background:var(--okbg)}.tf .no{background:#DCEFF5;color:#1B2B30}
/* anyam */
.weave{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.weave .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mk{min-height:56px;border-radius:14px;border:3px solid var(--line);background:repeating-linear-gradient(90deg,var(--card) 0 12px,var(--chip) 12px 24px);padding:0 6px;min-width:0;overflow-wrap:anywhere}
.mk .ar{font-size:21px}
.mk.sel{outline:4px solid var(--gold)}
.mk.done{background:var(--okbg);opacity:.55}
.joined div{text-align:center;border-bottom:2px dashed var(--chip)}
/* telaga */
.drops{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.drop{width:66px;height:66px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);border:3px solid var(--line);background:radial-gradient(circle at 40% 40%,#BFF1EA,var(--oasis));font-weight:800;font-size:22px}
.drop span{display:inline-block;transform:rotate(45deg)}
.drop.w{background:var(--badbg)}
.pond{text-align:center;font-size:30px;margin-top:6px}
/* tamar */
.cargo{display:flex;flex-direction:column;gap:8px}
.cg{min-height:52px;border-radius:14px;border:3px solid var(--line);background:var(--card);padding:0 8px}
.cg.sel{outline:4px solid var(--gold)}.cg.gone{display:none}
.baskets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.bk{min-height:96px;border-radius:0 0 26px 26px;border:3px solid var(--line);color:#fff;font-weight:800;padding:6px;min-width:0;overflow-wrap:anywhere;
  background:repeating-linear-gradient(45deg,#A86B32 0 8px,#7A4A1E 8px 16px)}
.bk .in{display:flex;flex-direction:column}
.bk .in .ar{font-size:17px;line-height:1.8;background:#0004;border-radius:8px;margin-top:3px}
/* maklum balas + keputusan */
.fb{position:fixed;inset-inline:0;bottom:0;padding:10px;z-index:30;display:flex;justify-content:center}
.fb .in{width:100%;max-width:560px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 -4px 0 var(--gold),0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fb .ummi{width:64px;height:64px}
.fb strong{font-size:24px;color:var(--ok);font-family:"El Messiri","Noto Naskh Arabic",sans-serif}
.fb p{margin:2px 0 0;line-height:1.3}
html[dir=rtl] .fb p{line-height:1.8}
.res{text-align:center}
.res .ummi{width:120px;height:120px}
.stars{font-size:46px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .5s backwards}
.stars .off{filter:grayscale(1);opacity:.3}
@keyframes pop{from{transform:scale(0)}}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border-radius:14px;padding:8px;margin:8px 0}
.gotst span{font-size:40px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:40;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (max-width:380px){ .ar{font-size:22px} .drop{width:58px;height:58px} .node .palm{width:44px;height:60px} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

function words(a){
  const out = []; let pre = "";

    if(HAS_LETTER.test(w)){ out.push(pre + w); pre = ""; }

  if(pre) out.push(pre.trim());
  return out;
}

  while(out.length < n && guard++ < 900){ const c = p[Math.floor(r()*p.length)]; if(c && !out.includes(c)) out.push(c); }

}

    G.push({ type:"fatamorgana", q:["Air sebenar atau fatamorgana? Adakah ayat kedua betul-betul datang selepas ayat pertama?","اٴير سبنر اتاو فاتامورڬان؟ اداکه ايات کدوا بتول٢ داتڠ سلڤس ايات ڤرتام؟"],
      rounds, e:["Mata kamu tajam! Fatamorgana tidak menipu kamu.","مات کامو تاجم! فاتامورڬان تيدق منيڤو کامو."] });
  } else if(rot === 1){
    const ai = pickR(R.filter(i => uniq(i) && wc(i) >= 2), 4).sort((x,y) => x-y);
    const items = ai.map(i => { const W = words(F[i]), h = Math.ceil(W.length/2); return { h:W.slice(0,h).join(" "), t:W.slice(h).join(" "), an:i+1 }; });
    G.push({ type:"anyam", q:["Anyam tikar daun kurma! Tekan awal ayat, kemudian tekan hujung ayatnya.","انيم تيکر داٴون کورما! تکن اول ايات، کمودين تکن هوجوڠ اياتڽ."],
      items, e:["Tikar siap dianyam! Ayat-ayat itu lengkap.","تيکر سياڤ دانيم! ايات٢ ايت لڠکڤ."] });
  } else if(rot === 2){
    const kr = pickR(R.filter(uniq), 3).map(i => { const o = new Set([i+1]); let g = 0;
      while(o.size < 4 && g++ < 99) o.add(s.a + Math.floor(r() * (s.b - s.a + 1)));
      return { ar:F[i], an:i+1, opts:[...o].sort((x,y) => x-y) }; });
    G.push({ type:"telaga", q:["Titiskan air ke telaga! Ayat ini ayat yang ke berapa? Tekan titisan yang betul.","تيتيسکن اٴير ک تلاڬ! ايات اين ايات يڠ ک براڤ؟ تکن تيتيسن يڠ بتول."],
      rounds:kr, e:["Telaga penuh! Kamu tahu kedudukan setiap ayat.","تلاڬ ڤنوه! کامو تاهو کدودوقن ستياڤ ايات."] });
  } else {
    const P = AYAT[PAIR[s.k]], mine = pickR(R.filter(i => !P.includes(F[i])), 3).map(i => [F[i], 0]);
    const other = pickDistinct(P.filter(x => !F.includes(x) && words(x).length <= 7), [], 3, r).map(a => [a, 1]);
    G.push({ type:"tamar", q:["Isikan buah tamar ke bakul surahnya. Tekan ayat, kemudian tekan bakul.","ايسيکن بواه تمر ک باکول سورهڽ. تکن ايات، کمودين تکن باکول."],
      items:[...mine, ...other].sort(() => r() - .5), sides:[{k:s.k, t:SNAME[s.k]}, {k:PAIR[s.k], t:SNAME[PAIR[s.k]]}],
      e:["Semua tamar masuk bakul yang betul!","سموا تمر ماسوق باکول يڠ بتول!"] });
  }
  return G;
}

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

  no:   () => tone([[220,.18,"square"],[180,.2,"square"]]),
  drop: () => tone([[1300,.05],[800,.08],[500,.12]]),
  pluck:() => tone([[520,.06,"triangle"],[780,.1,"triangle"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.3]])
};

    </article>`;
  speak(readSpeech(c));
  window.scrollTo(0,0);
}
/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, pct = k/n*100, side = isJ() ? "right" : "left";
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="fill" style="width:${pct}%"></span>
    <span class="end">🌴</span><span class="ft" style="${side}:${Math.max(6,Math.min(84,pct))}%">🦊</span></div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  const tag = g.fs ? `<p style="margin:0 0 6px;color:var(--muted);font-weight:700">🌴 ${L("Surah","سورة")} ${T(STATIONS.find(x=>x.id===g.fs).t)} • ${T(STATIONS.find(x=>x.id===g.fs).u)}</p>` : "";
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `${tag}<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h) h.innerHTML = `<div class="hint">🦊 ${hint || L("Hmm, cuba lagi!","همم، چوبا لاڬي!")}</div>`;
}
const clearHint = () => { const h = $("#hint"); if(h) h.innerHTML = ""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  if(!S || S.phase!=="play") return;
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${ummi("wag")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Pokok kurma ini berbuah lebat.","چمرلڠ! ڤوکوق کورما اين بربواه لبت."] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom ulang hafazan.","شاباس کران منچوبا! جوم اولڠ حفظن."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${ummi("wag")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Hasil tuaian baharu masuk ke bakul kamu!","حاصيل تواين بهارو ماسوق ک باکول کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>💧 ${L("Cabaran Telaga Oasis kini dibuka!","چابرن تلاڬ اواسيس کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🗺️ ${L("Kembali ke kebun","کمبالي ک کبون")}</button>
      <button class="btn" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== PERMAINAN KEBUN ===================== */
const arB = (t, cls, attr="") => `<button class="${cls}" ${attr}>${AR(t)}</button>`;
const GAMES = {
  /* 1. Perigi: 3 timba, pilih ayat seterusnya */
  perigi(el, g){
    let k = 0;
    const draw = () => {
      const s = g.steps[k];
      el.innerHTML = `<div class="well" aria-hidden="true">${g.steps.map((_,i)=>`<span class="${i<k?"on":""}">🪣</span>`).join("")}</div>
        <p class="rnd">${L("Timba","تيمبا")} ${k+1} / ${g.steps.length}</p>
        <div class="cur">${AR(s.cur, s.an)}</div>
        <p class="rnd">⬇️ ${L("Ayat seterusnya?","ايات ستروسڽ؟")}</p>
        <div class="opts">${mix(s.a.map((t,i)=>[t,i])).map(([t,i])=>arB(t,"op",`data-i="${i}"`)).join("")}</div>`;
      el.querySelectorAll(".op").forEach(b => b.addEventListener("click", () => {
        if(b.dataset.i === "0"){
          b.classList.add("right"); sfx.drop(); clearHint(); k++;
          if(k >= g.steps.length){ el.querySelectorAll(".op").forEach(x=>x.disabled=true); el.querySelectorAll(".well span").forEach(x=>x.classList.add("on")); setTimeout(win, 300); }
          else draw();
        } else oops(b, L("Timba itu kosong! Ingat semula ayat selepasnya.","تيمبا ايت کوسوڠ! ايڠت سمولا ايات سلڤسڽ."));
      }));
    };
    draw();
  },
  /* 2. Tandan: petik perkataan ikut tertib */
  tandan(el, g){
    let k = 0;
    el.innerHTML = `<div class="basket" id="bk">${g.words.map((_,i)=>`<span class="slot" data-s="${i}"></span>`).join("")}</div>
      <div class="bunch">${mix(g.words.map((w,i)=>[w,i])).map(([w,i])=>`<button class="date" data-i="${i}"><span class="ar" lang="ar">${w}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".date").forEach(b => b.addEventListener("click", () => {
      if(k >= g.words.length || b.classList.contains("used")) return;
      if(g.words[+b.dataset.i] === g.words[k]){
        el.querySelector(`.slot[data-s="${k}"]`).outerHTML = `<span class="dt ar" lang="ar">${g.words[k]}</span>`;
        b.classList.add("used"); k++; sfx.pluck(); clearHint();
        if(k === g.words.length) setTimeout(win, 350);
      } else oops(b, L("Kurma itu belum masak! Perkataan mana yang datang dahulu?","کورما ايت بلوم مسق! ڤرکاتاٴن مان يڠ داتڠ دهولو؟"));
    }));
  },
  /* 3. Pelepah: isi 2 perkataan yang hilang, satu demi satu */
  pelepah(el, g){
    let k = 0;
    const draw = () => {
      const line = g.words.map((w,i) => { const gi = g.gaps.findIndex(x => x.p === i);
        if(gi < 0) return `<span class="w ar" lang="ar">${w}</span>`;
        if(gi < k) return `<span class="gap fil ar" lang="ar">${w}</span>`;
        return `<span class="gap ${gi===k?"cur":""}">🌿 ${gi+1}</span>`; }).join("");
      el.innerHTML = `<p class="rnd">🌿 ${L("Daun","داٴون")} ${Math.min(k+1, g.gaps.length)} / ${g.gaps.length}</p>
        <div class="frond">${line} <span class="mark ar">﴿${AN(g.an)}﴾</span></div>
        ${k < g.gaps.length ? `<div class="g2">${mix(g.gaps[k].a.map((t,i)=>[t,i])).map(([t,i])=>arB(t,"op lf",`data-i="${i}"`)).join("")}</div>` : ""}`;
      el.querySelectorAll(".lf").forEach(b => b.addEventListener("click", () => {
        if(b.dataset.i === "0"){ k++; sfx.pluck(); clearHint(); draw(); if(k === g.gaps.length) setTimeout(win, 350); }
        else oops(b, L("Daun itu dari pelepah lain. Baca ayat dari awal.","داٴون ايت دري ڤلڤه لاٴين. باچ ايات دري اول."));
      }));
    };
    draw();
  },
  /* 4. Bayu: maksud → ayat */
  bayu(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k];
      el.innerHTML = `<p class="rnd">🍃 ${k+1} / ${g.rounds.length}</p>
        <div class="dune"><span class="wind" aria-hidden="true">🌬️</span><div class="msg">${T(r.mk)}</div></div>
        <div class="opts">${mix(r.a.map((t,i)=>[t,i])).map(([t,i])=>arB(t,"op",`data-i="${i}"`)).join("")}</div>`;
      el.querySelectorAll(".op").forEach(b => b.addEventListener("click", () => {
        if(b.dataset.i === "0"){
          b.classList.add("right"); sfx.ok(); clearHint(); k++;
          el.querySelectorAll(".op").forEach(x=>x.disabled=true);
          if(k >= g.rounds.length) setTimeout(win, 300); else setTimeout(draw, 350);
        } else oops(b, L("Bayu itu membawa maksud lain. Baca maksud sekali lagi.","بايو ايت ممباوا مقصود لاٴين. باچ مقصود سکالي لاڬي."));
      }));
    };
    draw();
  },
  /* 5. Falaj: alirkan air — susun 4 ayat */
  falaj(el, g){
    let k = 0;
    el.innerHTML = `<div class="flow">${mix(g.items.map((t,i)=>[t,i])).map(([t,i])=>arB(t,"fl",`data-i="${i}"`)).join("")}</div>
      <div class="channel" id="ch">${g.items.map(()=>`<div class="wait"></div>`).join("")}</div>`;
    el.querySelectorAll(".fl").forEach(b => b.addEventListener("click", () => {
      if(k >= g.items.length || b.classList.contains("used")) return;
      if(g.items[+b.dataset.i] === g.items[k]){
        el.querySelectorAll("#ch .wait")[0].outerHTML = `<div class="in">${AR(g.items[k], g.st + k)}</div>`;
        b.classList.add("used"); b.disabled = true; k++; sfx.drop(); clearHint();
        if(k === g.items.length) setTimeout(win, 350);
      } else oops(b, L(`Air tersekat! Cari ayat ${g.st + k} dahulu.`,`اٴير ترسکت! چاري ايات ${g.st + k} دهولو.`));
    }));
  },
  /* 6a. Fatamorgana: sambungan sebenar atau palsu */
  fatamorgana(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k];
      el.innerHTML = `<p class="rnd">🏜️ ${k+1} / ${g.rounds.length}</p>
        <div class="pair mir">${AR(r.cur, r.an)}<div class="arw">⬇️</div>${AR(r.nx)}</div>
        <div class="tf"><button class="yes" data-v="1">💧 ${L("Air sebenar: sambungannya","اٴير سبنر: سمبوڠنڽ")}</button><button class="no" data-v="0">🌫️ ${L("Fatamorgana: bukan","فاتامورڬان: بوکن")}</button></div>`;
      el.querySelectorAll(".tf button").forEach(b => b.addEventListener("click", () => {
        if((b.dataset.v === "1") === r.ok){
          sfx.drop(); clearHint(); k++; el.querySelectorAll(".tf button").forEach(x=>x.disabled=true);
          if(k >= g.rounds.length) setTimeout(win, 300); else setTimeout(draw, 350);
        } else oops(b, r.ok ? L("Sebenarnya ayat itu memang datang selepasnya.","سبنرڽ ايات ايت ممڠ داتڠ سلڤسڽ.") : L("Itu fatamorgana! Ayat itu bukan sambungannya.","ايت فاتامورڬان! ايات ايت بوکن سمبوڠنڽ."));
      }));
    };
    draw();
  },
  /* 6b. Anyam: awal ayat ↔ hujung ayat */
  anyam(el, g){
    let sel = null, got = 0;
    el.innerHTML = `<div class="weave"><div class="col">${g.items.map((it,i)=>`<button class="mk h" data-h="${i}"><span class="ar" lang="ar">${it.h} …</span></button>`).join("")}</div>
      <div class="col">${mix(g.items.map((it,i)=>[it.t,i])).map(([t,i])=>`<button class="mk t" data-t="${i}"><span class="ar" lang="ar">… ${t}</span></button>`).join("")}</div></div>
      <div class="joined" id="jn"></div>`;
    el.querySelectorAll(".mk.h").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      el.querySelectorAll(".mk.h").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.h; sfx.tick();
    }));
    el.querySelectorAll(".mk.t").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(sel===null){ toast(L("Tekan awal ayat dahulu ☝️","تکن اول ايات دهولو ☝️")); return; }
      if(+b.dataset.t === sel){
        const it = g.items[sel];
        el.querySelector(`.mk.h[data-h="${sel}"]`).classList.add("done"); b.classList.add("done");
        el.querySelector("#jn").insertAdjacentHTML("beforeend", `<div>🧺 ${AR(it.h + " " + it.t, it.an)}</div>`);
        sel = null; got++; sfx.pluck(); clearHint();
        el.querySelectorAll(".mk.h").forEach(x=>x.classList.remove("sel"));
        if(got === g.items.length) setTimeout(win, 350);
      } else oops(b, L("Jalinan itu tidak padan. Cuba hujung yang lain.","جالينن ايت تيدق ڤادن. چوبا هوجوڠ يڠ لاٴين."));
    }));
  },
  /* 6c. Telaga: nombor ayat */
  telaga(el, g){
    let k = 0;
    const draw = () => {
      const r = g.rounds[k];
      el.innerHTML = `<p class="rnd">💧 ${k+1} / ${g.rounds.length}</p><div class="qar">${AR(r.ar)}</div>
        <div class="drops">${r.opts.map(n=>`<button class="drop" data-n="${n}"><span>${L(n, AN(n))}</span></button>`).join("")}</div><div class="pond" aria-hidden="true">${"🌊".repeat(k+1)}</div>`;
      el.querySelectorAll(".drop").forEach(b => b.addEventListener("click", () => {
        if(+b.dataset.n === r.an){
          sfx.drop(); clearHint(); k++; el.querySelectorAll(".drop").forEach(x=>x.disabled=true);
          if(k >= g.rounds.length) setTimeout(win, 400); else setTimeout(draw, 450);
        } else { b.classList.add("w"); oops(b, L("Titisan itu tersasar! Ingat tertib ayat dalam surah.","تيتيسن ايت ترساسر! ايڠت ترتيب ايات دالم سورة.")); }
      }));
    };
    draw();
  },
  /* 6d. Tamar: asingkan ayat ikut surah */
  tamar(el, g){
    let sel = null, got = 0;
    el.innerHTML = `<div class="cargo">${mix(g.items.map((it,i)=>i)).map(i=>arB(g.items[i][0],"cg",`data-i="${i}"`)).join("")}</div>
      <div class="baskets">${g.sides.map((s,j)=>`<button class="bk" data-j="${j}"><b>🧺 ${L("Surah ","سورة ")+T(s.t)}</b><span class="in" id="in${j}"></span></button>`).join("")}</div>`;
    el.querySelectorAll(".cg").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".cg").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; sfx.tick();
    }));
    el.querySelectorAll(".bk").forEach(b => b.addEventListener("click", () => {
      if(got >= g.items.length) return;
      if(sel===null){ toast(L("Tekan satu ayat dahulu ☝️","تکن ساتو ايات دهولو ☝️")); return; }
      const j = +b.dataset.j;
      if(g.items[sel][1] === j){
        el.querySelector(`.cg[data-i="${sel}"]`).classList.add("gone");
        el.querySelector("#in"+j).insertAdjacentHTML("beforeend", `<span class="ar" lang="ar">${words(g.items[sel][0]).slice(0,2).join(" ")}…</span>`);
        sel = null; got++; sfx.pluck(); clearHint(); if(got === g.items.length) setTimeout(win, 350);
      } else oops(b, L("Tamar itu dari kebun surah lain. Cuba bakul sebelah!","تمر ايت دري کبون سورة لاٴين. چوبا باکول سبله!"));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Suburkan pokok kurma sebelumnya dahulu 🔒","سوبورکن ڤوکوق کورما سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Suburkan semua ${STATIONS.length} pokok kurma untuk membuka Cabaran Telaga Oasis 💧`,`سوبورکن سموا ${STATIONS.length} ڤوکوق کورما اونتوق ممبوک چابرن تلاڬ اواسيس 💧`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.phase==="result" && S.res) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
