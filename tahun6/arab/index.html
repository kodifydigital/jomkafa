<style>
/* ===== Bahasa Arab Tahun 6: "Taman Tema Lughah" — laluan taman tema, wahana; maskot Zuzu si zebra pengendali wahana ===== */
:root{
  --sky:#FFE3EC; --bg:#FFF6EE; --card:#FFFFFF; --ink:#1B1340; --muted:#5B5277; --line:#1B1340;
  --red:#FF3D57; --red2:#C8102E; --teal:#00B3A6; --sun:#FFD23F; --grape:#6C3CE1; --grape2:#4A23A8; --path:#F2C9A0; --grass:#7BD88F;
  --ok:#14965A; --okbg:#D9F7E7; --bad:#D7263D; --badbg:#FFE1E5; --note:#FFF4C9; --panel:#F1EBFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1C0F3A; --bg:#120A26; --card:#211541; --ink:#F4EEFF; --muted:#BDB2DA; --line:#06030E;
    --path:#4A3560; --grass:#1E5A3A; --okbg:#10402B; --badbg:#4A1622; --note:#3B3210; --panel:#2B1D52; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:600;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,210,63,.35) 0 40px,transparent 41px),
    radial-gradient(circle at 88% 14%,rgba(0,179,166,.25) 0 28px,transparent 29px),
    linear-gradient(180deg,var(--sky) 0,var(--bg) 280px,var(--bg) 100%);}
[dir="rtl"] body{font-family:"Noto Naskh Arabic","Nunito",serif;line-height:1.9}
#app{max-width:480px;margin:0 auto;padding:10px 14px 90px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:1.22em;line-height:1.9;font-weight:700}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--sun);color:#1B1340;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900}
h1,h2,.dk,.bang{font-family:"Bangers","Nunito",cursive;letter-spacing:1px;font-weight:400}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] .dk,[dir="rtl"] .bang{font-family:"Noto Naskh Arabic",serif;letter-spacing:0;font-weight:700}
.hero{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,var(--grape),var(--red));color:#fff;border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line);margin:4px 0 14px}
.hero h1{margin:0;font-size:34px;line-height:1.05;text-shadow:2px 2px 0 #1B1340}
.hero p{margin:4px 0 0;font-size:15px}
.zuzu{width:96px;height:96px;flex:0 0 96px}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.sttl{margin:6px 0 4px;font-weight:900}
.stickers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.stickers span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--card);border:3px dashed var(--muted);filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;border:3px solid var(--line);background:var(--sun)}
/* ---- peta taman: laluan berliku ---- */
.park{position:relative;padding:8px 0 20px;background:
  repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.18) 22px 26px),
  linear-gradient(180deg,var(--grass),color-mix(in srgb,var(--grass) 70%,#000));border:3px solid var(--line);border-radius:24px;overflow:hidden}
.park::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:46px;margin-left:-23px;background:repeating-linear-gradient(180deg,var(--path) 0 30px,color-mix(in srgb,var(--path) 80%,#000) 30px 34px);border-left:3px dashed rgba(27,19,64,.35);border-right:3px dashed rgba(27,19,64,.35)}
.gate{position:relative;display:block;text-align:center;margin:4px auto 10px;width:max-content;max-width:92%;background:var(--red);color:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 14px;font-weight:900;font-size:15px}
.mrow{position:relative;display:flex;margin:10px 8px}
.mrow:nth-of-type(even){justify-content:flex-end}
.stn{position:relative;display:flex;align-items:center;gap:8px;width:82%;text-align:start;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:8px 10px;box-shadow:0 5px 0 var(--line);z-index:1}
.stn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.stn.lock{background:color-mix(in srgb,var(--card) 70%,#888);opacity:.85}
.stn.now{outline:4px solid var(--sun);outline-offset:2px}
.tent{position:relative;flex:0 0 76px;width:76px;height:76px}
.tent svg{width:76px;height:76px;display:block}
.tent .em{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:26px}
.tent .badge{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--sun);color:#1B1340;border:2px solid var(--line);border-radius:50%;width:26px;height:26px;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:Nunito}
.perch{position:absolute;top:-34px;inset-inline-end:-40px;width:58px;height:58px;z-index:2;pointer-events:none}
.perch .zuzu{width:58px;height:58px}
.lab{display:flex;flex-direction:column;min-width:0}
.lab .dk{font-size:17px;color:var(--grape)}
@media (prefers-color-scheme: dark){ .lab .dk{color:#C9B5FF} }
.lab .nm{font-weight:900;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.lab .st{font-size:14px}
.lab .st .off,.stars .off{filter:grayscale(1);opacity:.3}
.mrow.big .stn{width:100%;background:linear-gradient(135deg,var(--sun),#FF9F1C);color:#1B1340}
.mrow.big .stn.lock{background:color-mix(in srgb,var(--card) 70%,#888);color:var(--ink)}
</style>
<style>
.shead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.shead h2{margin:0;font-size:26px;line-height:1.1}
.shead small{color:var(--muted);font-weight:800}
.bub{flex:0 0 54px;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--c);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--line);margin-bottom:14px;position:relative}
.read{border-top:12px solid var(--sc)}
.rpic{font-size:44px;text-align:center;line-height:1.2}
.rh{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:6px 0;font-size:21px;font-weight:900}
.rtext{margin:6px 0}
.rlist{margin:6px 0;padding-inline-start:22px}
.rlist li{margin:6px 0}
.abox{background:var(--panel);border:2px dashed var(--grape);border-radius:16px;padding:10px 12px;margin:10px 0;display:flex;flex-direction:column;gap:6px}
.abox .ar{text-align:right}
.abox .mk{font-size:16px}
.abox small{color:var(--muted)}
.pairs{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pairs div{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--note);border-radius:12px;padding:6px 10px;border:2px solid rgba(27,19,64,.15)}
.pairs div .ar{font-size:1.1em}
.pairs i{font-style:normal;font-size:14px;color:var(--muted);text-align:end}
.tip{display:flex;gap:8px;background:var(--note);border-radius:14px;padding:8px 10px;margin:8px 0;font-size:16px}
.tip.am{background:var(--okbg)}
.ref{font-size:14px;color:var(--muted);font-weight:800;margin-top:6px}
.navr{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;min-height:54px;border-radius:16px;border:3px solid var(--line);background:var(--grape);color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);padding:8px 12px;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.go{background:var(--red)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.on{opacity:1;background:var(--red)}
.say{border:2px solid var(--line);background:var(--sun);border-radius:12px;min-width:44px;height:44px;font-size:20px;flex:0 0 auto}
.prog{display:flex;gap:6px;margin:0 0 10px}
.prog i{flex:1;height:26px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-style:normal;font-size:15px;display:flex;align-items:center;justify-content:center}
.prog i.got{background:var(--teal)}
.prog i.cur{background:var(--sun)}
.q{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font-weight:800}
.q p{margin:0}
.qpic{font-size:40px;text-align:center}
.g1{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.opt{min-height:56px;min-width:0;overflow-wrap:anywhere;border-radius:16px;border:3px solid var(--line);background:var(--card);font-weight:800;font-size:17px;padding:8px 10px;box-shadow:0 4px 0 var(--line);text-align:center}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.opt.sel{background:var(--sun);color:#1B1340}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.done{opacity:.45}
.opt:disabled{cursor:default}
.cnt{text-align:center;font-weight:800;color:var(--muted);margin-top:8px;font-size:15px}
.hint{margin-top:10px;background:var(--badbg);border-radius:14px;padding:8px 10px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ---- wahana ---- */
.coaster{height:64px;position:relative;border-bottom:6px solid var(--line);margin:10px 0 4px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(27,19,64,.25) 18px 21px) bottom/100% 14px no-repeat}
.coaster .car{position:absolute;bottom:4px;inset-inline-start:6px;font-size:40px;transition:inset-inline-start .6s ease-in}
.coaster.go .car{inset-inline-start:calc(100% - 56px)}
.bcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.bcols .col{display:flex;flex-direction:column;gap:8px}
.bcols .opt{border-radius:22px 22px 14px 14px;position:relative}
.bcols .opt.l{background:color-mix(in srgb,var(--teal) 25%,var(--card))}
.bcols .opt.r{background:color-mix(in srgb,var(--red) 18%,var(--card))}
.bcols .opt.sel{background:var(--sun)}
.bcols .opt.done{background:var(--okbg);opacity:.6}
.ride{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:62px;padding:8px;border:3px dashed var(--grape);border-radius:50% / 30%;background:var(--panel);margin-top:8px}
.ride span{background:var(--sun);color:#1B1340;border:2px solid var(--line);border-radius:12px;padding:2px 10px;font-weight:800}
.ride .ph{color:var(--muted);font-weight:700;align-self:center}
.door{background:linear-gradient(180deg,#3B1F6E,#1B1340);color:#fff;border:3px solid var(--line);border-radius:60px 60px 14px 14px;padding:18px 14px;text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center;font-weight:800;margin-top:10px}
.door.lit{background:linear-gradient(180deg,#14965A,#0B5B37)}
.door.boo{background:linear-gradient(180deg,#D7263D,#7A0F1E)}
.slide{background:linear-gradient(180deg,#5FD3F3,#00B3A6);color:#1B1340;border:3px solid var(--line);border-radius:18px 60px 18px 18px;padding:14px;margin-top:10px;font-weight:800;text-align:center}
.slide .blank{display:inline-block;min-width:70px;border-bottom:4px dotted #1B1340;color:#fff;text-shadow:1px 1px 0 #1B1340}
.cur{background:var(--note);border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;font-weight:900;margin-top:10px}
.cups .opt{border-radius:14px 14px 40px 40px;background:color-mix(in srgb,var(--grape) 20%,var(--card));min-height:72px}
.swing{display:block;text-align:center;font-size:40px;animation:swing 2s ease-in-out infinite;transform-origin:50% 0}
@keyframes swing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
/* ---- maklum balas, keputusan ---- */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(27,19,64,.35);padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
.fb .in{max-width:480px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 -4px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .row1 .zuzu{width:64px;height:64px;flex:0 0 64px}
.fb strong{font-size:22px}
.fb p{margin:2px 0 0;font-size:16px}
.res{text-align:center}
.res .zuzu{width:120px;height:120px}
.stars{font-size:46px}
.stars span{display:inline-block;animation:pop .5s both}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
.gotst{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--note);border-radius:16px;padding:10px;margin:10px 0;font-weight:800}
.gotst span{font-size:44px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:    () => tone([[523,.12],[784,.2]]),
  tick:  () => tone([[740,.07,"triangle"]]),
  no:    () => tone([[196,.18,"square"],[147,.22,"square"]]),
  bump:  () => tone([[180,.06,"square"],[120,.12,"triangle"]]),
  whee:  () => tone([[400,.08],[600,.08],[900,.08],[1200,.16]]),
  boo:   () => tone([[220,.25,"sawtooth"],[165,.3,"sawtooth"]]),
  ding:  () => tone([[1046,.1,"triangle"],[1318,.2,"triangle"]]),
  win:   () => tone([[392,.14],[523,.14],[659,.14],[784,.34]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
const forSpeech = s => String(s).replace(/ﷺ/g," sallallahu alaihi wasallam ").replace(AR_RE," ").replace(/<[^>]+>/g," ")
  .replace(/___/g," ... ").replace(/[↔→←]/g," ").replace(/…/g," ... ").replace(/\bms\. /g,"muka surat ").replace(/\bRM(\d+)/g,"$1 ringgit")
  .replace(/\(\s*\)/g," ").replace(/\s+([,.?!:;])/g,"$1").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    const s = forSpeech(text); if(!s || !/[a-z0-9]/i.test(s)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = 1; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

      ${c.list?`<ol class="rlist">${c.list.map(x=>`<li>${TX(x)}</li>`).join("")}</ol>`:""}
      ${c.pairs?`<div class="pairs">${c.pairs.map(pairRow).join("")}</div>`:""}
      ${(c.ar||c.mk)?`<div class="abox">${c.ar?`<span class="ar" lang="ar">${c.ar}</span>`:""}${c.mk?`<span class="mk">${T(c.mk)}</span>`:""}${c.src?`<small>${T(c.src)}</small>`:""}</div>`:""}
      ${c.tip?`<div class="tip"><b>💡</b><span><b>${L("Tahukah anda?","تاهوکه اندا؟")}</b> ${T(c.tip)}</span></div>`:""}
      ${c.am?`<div class="tip am"><b>🌱</b><span><b>${L("Amalkan:","عملکن:")}</b> ${T(c.am)}</span></div>`:""}
      <div class="ref">📖 ${L("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</div>
      <div class="navr">
        <button class="btn alt" data-act="rprev" ${S.ri?"":"disabled"} aria-label="${L("Sebelum","سبلوم")}" style="flex:0 0 64px">${BACK()}</button>
        <button class="btn ${last?"go":""}" data-act="rnext">${last ? "🎢 "+L("Naik wahana!","نايق واهان!") : L("Seterusnya","ستروسڽ")+" ▶"}</button>
      </div>
      <div class="dots">${S.st.read.map((_,i)=>`<i class="${i===S.ri?"on":""}"></i>`).join("")}</div>
    </article>`;
  speak(readSpeech(c));
  window.scrollTo(0,0);
}

/* ===================== WAHANA: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi;
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}">${S.games.map((_,i)=>`<i class="${i<k?"got":i===k?"cur":""}">${i<k?"🎟️":i===k?"🦓":""}</i>`).join("")}</div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game"></section>`;
  const box = $("#game");
  const q = g.q || ["Jawab soalan ini.","جواب سوالن اين."];
  box.innerHTML = `<div class="q"><p>${T(q)}</p>${sayBtn(RU(q))}</div>${g.pic?`<div class="qpic" aria-hidden="true">${g.pic}</div>`:""}<div id="play" data-type="${g.type}"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(q));
  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🦓 ${hint || L("Alamak, wahana tersangkut. Cuba lagi!","الامق، واهان ترسڠکوت. چوبا لاڬي!")}</div>`; }
}
const clearHint = () => { const h=$("#hint"); if(h) h.innerHTML=""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Cekap!","چکڤ!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  if(document.querySelector(".fb")) return;
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${zuzu("")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: id!=="final" && !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Kamu juara wahana bahasa Arab!","چمرلڠ! کامو جوارا واهان بهاس عرب!"] : stars===2 ? ["Bagus! Naik sekali lagi untuk 3 bintang.","باڬوس! نايق سکالي لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom naik sekali lagi.","شاباس کران منچوبا! جوم نايق سکالي لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${zuzu("bob")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Tiket wahana baharu untuk kamu!","تيکيت واهان بهارو اونتوق کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🎢 ${L("Roller Coaster Gergasi kini dibuka!","رولر کوستر ڬرڬاسي کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🗺️ ${L("Kembali ke peta","کمبالي ک ڤتا")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); sfx.whee(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== PERMAINAN TAMAN TEMA (1) ===================== */
const isLong = arr => arr.some(x => T(x).length > 16);
const GAMES = {
  /* Roller coaster: pilih jawapan betul, kereta meluncur */
  roller(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    el.innerHTML = `${g.qa?`<div class="slide">${TX(g.qa).replace("___",'<span class="blank">?</span>')}</div>`:""}
      <div class="coaster" id="coast"><span class="car">🎢</span></div>
      <div class="${isLong(g.a)?"g1":"g2"}">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return;
      if(opts[+b.dataset.i].ok){ done = true; sfx.whee(); b.classList.add("right"); el.querySelector("#coast").classList.add("go"); clearHint(); setTimeout(win, 650); }
      else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Kereta tersangkut! Itu bukan jawapannya.","کريتا ترسڠکوت! ايت بوکن جواڤنڽ.")); }
    }));
  },

  /* Kereta bumper: langgarkan kereta kiri dengan pasangannya di kanan */
  bumper(el, g){
    const lo = mix(g.pairs.map((_,i)=>i)), ro = mix(g.pairs.map((_,i)=>i)); let sel = null, left = g.pairs.length;
    el.innerHTML = `<div class="bcols"><div class="col">${lo.map(p=>`<button class="opt l" data-p="${p}">🚗 ${TX(g.pairs[p][0])}</button>`).join("")}</div>
      <div class="col">${ro.map(p=>`<button class="opt r" data-p="${p}">🚙 ${TX(g.pairs[p][1])}</button>`).join("")}</div></div>
      <div class="cnt" id="bc"></div>`;
    const count = () => { el.querySelector("#bc").textContent = "💥 "+L(`Pasangan tinggal: ${left}`,`ڤاسڠن تيڠڬل: ${left}`); };
    count();
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(!sel || sel.classList.contains(b.classList.contains("l")?"l":"r")){
        if(sel) sel.classList.remove("sel");
        sel = b; b.classList.add("sel"); sfx.tick(); return;
      }
      const a = sel; sel = null; a.classList.remove("sel");
      if(a.dataset.p === b.dataset.p){
        sfx.bump(); [a,b].forEach(x=>{ x.classList.add("done"); x.disabled = true; }); left--; count(); clearHint();
        if(!left) setTimeout(win, 400);
      } else oops(b, L("Kereta itu bukan pasangannya. Cuba lagi!","کريتا ايت بوکن ڤاسڠنڽ. چوبا لاڬي!"));
    }));
  },

  /* Karusel: naikkan kuda (perkataan/peristiwa) mengikut urutan */
  karusel(el, g){
    const all = g.steps.map((x,i)=>({x, i})).concat((g.extra||[]).map((x,j)=>({x, i:-1-j})));
    const order = mix(all.map((_,n)=>n)); let k = 0;
    el.innerHTML = `<div class="ride" id="ride"><span class="ph">🎠 ${L("Kuda karusel kosong…","کودا کاروسل کوسوڠ…")}</span></div>
      <div class="g1">${order.map(n=>`<button class="opt" style="border-inline-start:10px solid ${CARC[n%CARC.length]}" data-i="${all[n].i}">${TX(all[n].x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled || k>=g.steps.length) return;
      if(+b.dataset.i === k){
        const r = el.querySelector("#ride"); if(!k) r.innerHTML = "";
        r.insertAdjacentHTML("beforeend", `<span>${TX(g.steps[k])}</span>`);
        b.disabled = true; b.classList.add("done"); sfx.tick(); clearHint(); k++;
        if(k===g.steps.length){ sfx.ding(); setTimeout(win, 450); }
      } else { b.classList.add("wrong"); setTimeout(()=>b.classList.remove("wrong"), 500); oops(b, L("Bukan giliran kuda itu. Fikir urutannya!","بوکن ڬيليرن کودا ايت. فيکير اوروتنڽ!")); }
    }));
  },

  /* Rumah hantu: nyalakan lampu (betul) atau halau hantu (salah), pusingan demi pusingan */
  rumahhantu(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const [s] = g.rounds[r];
      el.innerHTML = `<div class="door" id="door"><span>${TX(s)}</span></div>
        <div class="g2 hh"><button class="opt" data-v="1">🕯️ ${L("Betul","بتول")}</button><button class="opt" data-v="0">👻 ${L("Salah","سالح")}</button></div>
        <div class="cnt">🏚️ ${L(`Bilik ${r+1} daripada ${g.rounds.length}`,`بيليق ${r+1} درڤد ${g.rounds.length}`)}</div>`;
      busy = false;
      el.querySelectorAll(".hh .opt").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        const ok = (b.dataset.v==="1") === !!g.rounds[r][1];
        if(ok){ busy = true; const d = el.querySelector("#door"); d.classList.add(g.rounds[r][1]?"lit":"boo"); g.rounds[r][1]?sfx.ding():sfx.boo(); b.classList.add("right"); clearHint(); r++;
          if(r < g.rounds.length) setTimeout(draw, 500); else setTimeout(win, 500); }
        else oops(b, L("Eh, baca sekali lagi kenyataan di pintu itu!","ايه، باچ سکالي لاڬي کڽاتاٴن د ڤينتو ايت!"));
      }));
    };
    draw();
  },

  /* Gelongsor air: luncurkan perkataan yang betul ke tempat kosong */
  gelongsor(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const [s, a] = g.rounds[r], opts = mix(a.map((x,i)=>({x, ok:i===0})));
      el.innerHTML = `<div class="slide" id="sl">${TX(s).replace("___",'<span class="blank">?</span>')}</div>
        <div class="${isLong(a)?"g1":"g2"}">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">💧 ${TX(o.x)}</button>`).join("")}</div>
        <div class="cnt">🌊 ${L(`Gelongsor ${r+1} daripada ${g.rounds.length}`,`ڬلوڠسور ${r+1} درڤد ${g.rounds.length}`)}</div>`;
      busy = false;
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(busy || b.disabled) return;
        if(opts[+b.dataset.i].ok){ busy = true; sfx.whee(); b.classList.add("right"); const bl = el.querySelector(".blank"); if(bl) bl.innerHTML = TX(opts[+b.dataset.i].x); clearHint(); r++;
          if(r < g.rounds.length) setTimeout(draw, 550); else setTimeout(win, 550); }
        else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Percikan! Perkataan itu tidak sesuai.","ڤرچيقن! ڤرکاتاٴن ايت تيدق سسواي.")); }
      }));
    };
    draw();
  },

  /* Cawan berpusing: masukkan setiap perkataan ke dalam cawan kumpulannya */
  putaran(el, g){
    const order = mix(g.items.map((_,i)=>i)); let k = 0, busy = false;
    const draw = () => {
      const it = g.items[order[k]];
      el.innerHTML = `<div class="cur" data-k="${order[k]}">☕ ${TX(it[0])}</div>
        <div class="cups ${g.bins.length>2?"g1":"g2"}">${g.bins.map((b,i)=>`<button class="opt" data-c="${i}">🫖 ${T(b)}</button>`).join("")}</div>
        <div class="cnt">🌀 ${L(`Penumpang ${k+1} daripada ${order.length}`,`ڤنومڤڠ ${k+1} درڤد ${order.length}`)}</div>`;
      busy = false;
      el.querySelectorAll(".cups .opt").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.c === it[1]){ busy = true; sfx.tick(); b.classList.add("right"); clearHint(); k++;
          if(k < order.length) setTimeout(draw, 380); else setTimeout(win, 450); }
        else oops(b, L("Cawan itu bukan tempatnya. Fikir semula!","چاون ايت بوکن تمڤتڽ. فيکير سمولا!"));
      }));
    };
    draw();
  },

  /* Kapal layun: pilih SEMUA jawapan betul, kemudian hayun */
  kapalayun(el, g){
    const items = mix(g.items.map((x,i)=>({x, ok:!!x[1], i}))), need = items.filter(o=>o.ok).length; let done = false;
    el.innerHTML = `<span class="swing" aria-hidden="true">🏴‍☠️</span>
      <div class="${isLong(g.items.map(x=>x[0]))?"g1":"g2"}">${items.map((o,n)=>`<button class="opt" data-n="${n}" data-ok="${o.ok?1:0}" aria-pressed="false">${TX(o.x[0])}</button>`).join("")}</div>
      <div class="cnt" id="kc"></div>
      <button class="btn go" id="swing" style="margin-top:8px">⛵ ${L("Hayun!","هايون!")}</button>`;
    const count = () => { const c = el.querySelectorAll(".opt.sel").length; el.querySelector("#kc").textContent = "🎫 "+L(`Dipilih: ${c} • Cari ${need}`,`دڤيليه: ${c} • چاري ${need}`); };
    count();
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done) return; b.classList.toggle("sel"); b.classList.remove("wrong"); b.setAttribute("aria-pressed", b.classList.contains("sel")); sfx.tick(); count();
    }));
    el.querySelector("#swing").addEventListener("click", () => {
      if(done) return;
      const sel = [...el.querySelectorAll(".opt.sel")], bad = sel.filter(b=>b.dataset.ok==="0"), good = sel.length - bad.length;
      if(!bad.length && good===need){ done = true; sel.forEach(b=>b.classList.add("right")); sfx.whee(); clearHint(); setTimeout(win, 500); return; }
      bad.forEach(b=>{ b.classList.remove("sel"); b.classList.add("wrong"); b.setAttribute("aria-pressed","false"); });
      count();
      oops(el.querySelector(".swing"), bad.length ? L("Ada pilihan yang salah (merah). Buang dan cuba lagi!","اد ڤيليهن يڠ سالح (ميره). بواڠ دان چوبا لاڬي!")
        : L(`Belum cukup: masih ada ${need-good} lagi.`,`بلوم چوکوڤ: ماسيه اد ${need-good} لاڬي.`));
    });
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t6-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Naiki wahana sebelumnya dahulu 🔒","نايقي واهان سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Naiki semua ${STATIONS.length} wahana untuk membuka Roller Coaster Gergasi 🎢`,`نايقي سموا ${STATIONS.length} واهان اونتوق ممبوک رولر کوستر ڬرڬاسي 🎢`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
