<title>Pelabuhan Feqah • Feqah Tahun 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@500;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Feqah Tahun 6: "Pelabuhan Feqah" — dermaga, kren, kontena, kapal kargo; maskot Kapten Ketam ===== */
:root{
  --sky:#BFE6F2; --sea:#0B4F6C; --sea2:#1D7EA0; --foam:#E8F7FB; --bg:#EEF7F9; --card:#FFFFFF; --ink:#0D1B2A; --muted:#47596B; --line:#0D1B2A;
  --brand:#F26B1D; --brand2:#B9480A; --steel:#3C6E91; --deck:#FFC43D; --quay:#C9D3DA; --asphalt:#4A5560;
  --ok:#1F9D63; --okbg:#DBF5E8; --bad:#D62839; --badbg:#FFE0E3; --note:#FFF3CF; --panel:#E3F1F6;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0A1E2C; --sea:#062A3B; --sea2:#0D4560; --foam:#0E2A38; --bg:#071620; --card:#112433; --ink:#E8F4F8; --muted:#A7BCCB; --line:#02070B;
    --quay:#2A3A46; --asphalt:#1B252D; --okbg:#123B2A; --badbg:#47181F; --note:#3A3013; --panel:#15303F; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.45;font-weight:600;
  background:
    repeating-linear-gradient(170deg,transparent 0 34px,rgba(255,255,255,.08) 34px 37px),
    linear-gradient(180deg,var(--sky) 0,var(--bg) 260px,var(--bg) 100%);
  background-attachment:fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Nunito",serif;font-size:19px;line-height:1.75}
#app{max-width:560px;margin:0 auto;padding:10px 14px 40px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:1.25em;line-height:2;font-weight:400}
h1,h2,h3{font-family:"Russo One","Nunito",sans-serif;font-weight:400;letter-spacing:.2px;margin:0}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-weight:900;font-size:20px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{padding:6px 12px;border-radius:999px;background:var(--deck);color:#0D1B2A;border:3px solid var(--line);font-weight:900}
/* Hero */
.hero{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,var(--sea) 0,var(--sea2) 100%);color:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 12px 24px;box-shadow:0 6px 0 var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:12px;background:repeating-linear-gradient(90deg,var(--deck) 0 18px,#0D1B2A 18px 36px);opacity:.9}
.hero .ketam{width:96px;flex:0 0 96px}
.hero h1{font-size:26px;line-height:1.15}
.hero p{margin:4px 0 10px;font-size:15px;opacity:.95}
.sttl{margin:16px 4px 6px;font-weight:900}
.stickers{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:16px;background:var(--card);border:3px dashed var(--steel)}
.stickers span{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--panel);filter:grayscale(1);opacity:.35}
.stickers span.got{filter:none;opacity:1;background:var(--note)}
/* Peta pelabuhan: jalan dermaga zig-zag */
.harbour{position:relative;margin-top:16px;padding:14px 0 10px;border-radius:24px;border:3px solid var(--line);
  background:
    linear-gradient(90deg,transparent calc(50% - 22px),var(--asphalt) calc(50% - 22px) calc(50% + 22px),transparent calc(50% + 22px)),
    repeating-linear-gradient(180deg,transparent 0 10px,rgba(255,255,255,.12) 10px 12px),
    linear-gradient(180deg,var(--sea2),var(--sea));
  overflow:hidden}
.harbour::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:repeating-linear-gradient(180deg,var(--deck) 0 16px,transparent 16px 30px)}
.start{position:relative;display:block;width:max-content;margin:0 auto 26px;padding:4px 12px;border-radius:999px;background:var(--deck);color:#0D1B2A;border:3px solid var(--line);font-weight:900;font-size:15px}
.mrow{position:relative;display:flex;padding:6px 10px}
.mrow:nth-of-type(odd){justify-content:flex-start}
.mrow:nth-of-type(even){justify-content:flex-end}
.stn{position:relative;width:min(82%,330px);display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;border:3px solid var(--line);background:var(--quay);box-shadow:0 5px 0 var(--line);text-align:start;color:var(--ink)}
.stn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.stn.lock{filter:saturate(.25);opacity:.85}
.stn.now{outline:4px solid var(--deck);outline-offset:3px}
.stack{position:relative;flex:0 0 78px;height:70px}
.stack svg{width:78px;height:70px;display:block}
.stack .em{position:absolute;inset:auto 0 22px 0;text-align:center;font-size:24px;line-height:1}
.stack .badge{position:absolute;top:-6px;inset-inline-start:-6px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;border:2px solid var(--line);font:14px/22px "Russo One",sans-serif;text-align:center}
.perch{position:absolute;top:-30px;inset-inline-end:-14px;width:52px;z-index:2;pointer-events:none}
.lab{display:flex;flex-direction:column;min-width:0}
.lab .dk{font-size:12px;font-weight:900;color:var(--brand2);text-transform:uppercase;letter-spacing:.5px}
html[dir="rtl"] .lab .dk{text-transform:none;letter-spacing:0}
.lab .nm{font-weight:900;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.lab .st{font-size:14px}
.lab .st .off{filter:grayscale(1);opacity:.35}
.mrow.ship .stn{width:min(94%,400px);margin:0 auto;background:linear-gradient(180deg,#fff 0 55%,var(--bad) 55% 100%);color:#0D1B2A}
.mrow.ship{justify-content:center}
.ketam.bob{animation:bob 2.4s ease-in-out infinite}
.ketam.yay{animation:yay .9s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes yay{30%{transform:rotate(-8deg) scale(1.06)}70%{transform:rotate(8deg) scale(1.06)}}
</style>
<style>
/* Stesen / kad baca */
.shead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.bub{flex:0 0 54px;width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--c);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.shead h2{font-size:21px;line-height:1.2}
.shead small{color:var(--muted);font-weight:800}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--line)}
.card.read{border-top:12px solid var(--sc)}
.rpic{font-size:40px;text-align:center;letter-spacing:4px}
.rh{display:flex;align-items:center;gap:8px;font-size:21px;line-height:1.25;margin:4px 0 8px}
.rh span{flex:1;min-width:0}
.say{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--deck);font-size:18px;box-shadow:0 3px 0 var(--line)}
.rtext{margin:0 0 8px}
.rlist{margin:0 0 8px;padding-inline-start:26px}
.rlist li{margin:3px 0}
.rlist li::marker{color:var(--brand);font-weight:900}
.abox{margin:8px 0;padding:10px;border-radius:14px;background:var(--panel);border:2px solid var(--steel);display:flex;flex-direction:column;gap:4px}
.abox .ar{font-size:1.45em;text-align:center}
.abox .mk{font-style:italic}
.abox small{color:var(--muted);font-weight:800}
.tip{display:flex;gap:8px;margin:8px 0;padding:10px;border-radius:14px;background:var(--note);border:2px dashed var(--line)}
.tip.am{background:var(--okbg)}
.ref{margin:10px 0 6px;font-size:14px;font-weight:900;color:var(--muted)}
.navr{display:flex;gap:10px}
.btn{flex:1;min-height:56px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);width:100%}
.btn.go{background:var(--brand);color:#fff}
.btn.alt{background:var(--panel)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn[disabled]{opacity:.45}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--quay);border:2px solid var(--line)}
.dots i.on{background:var(--brand)}
/* Main */
.prog{display:flex;gap:4px;margin:0 0 10px}
.prog i{flex:1;height:30px;border-radius:6px;border:2px solid var(--line);background:var(--quay);font-style:normal;font-size:14px;display:flex;align-items:center;justify-content:center}
.prog i.got{background:var(--deck)}
.prog i.cur{background:var(--brand);color:#fff}
.q{display:flex;gap:8px;align-items:flex-start;font-weight:900;font-size:19px}
.q p{margin:0;flex:1;min-width:0}
.qpic{font-size:38px;text-align:center;margin:6px 0}
#play{margin-top:10px}
.opt{min-height:56px;padding:10px 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-weight:800;font-size:17px;line-height:1.3;box-shadow:0 4px 0 var(--line);min-width:0;overflow-wrap:anywhere;text-align:center}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g1{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.cnt{margin-top:10px;text-align:center;font-weight:900;color:var(--muted);font-size:15px}
.hint{margin-top:10px;padding:10px;border-radius:14px;background:var(--badbg);border:2px solid var(--bad);font-weight:800}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* kren */
.yard{position:relative;height:96px;margin-bottom:8px;border-radius:14px;background:linear-gradient(180deg,var(--sky),var(--foam));border:2px solid var(--line);overflow:hidden}
.yard svg{position:absolute;inset-inline-start:8px;top:4px;height:88px}
.hook{position:absolute;top:0;inset-inline-start:50%;width:4px;height:44px;background:#0D1B2A;transition:height .45s}
.hook::after{content:"🪝";position:absolute;bottom:-20px;left:-10px;font-size:22px}
.yard.up .hook{height:14px}
.box{border-inline-start:12px solid var(--bc)}
.opt.lift{animation:lift .6s forwards}
@keyframes lift{to{transform:translateY(-8px)}}
/* kontena */
.cur{margin:0 auto 12px;padding:14px;border-radius:12px;border:3px solid var(--line);background:repeating-linear-gradient(90deg,var(--brand) 0 10px,var(--brand2) 10px 13px);color:#fff;text-align:center;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line)}
.cur span{display:inline-block;background:rgba(13,27,42,.55);padding:4px 10px;border-radius:10px}
.bays .opt{background:linear-gradient(180deg,var(--card) 0 62%,var(--sea2) 62%)}
/* kargo */
.hold{padding:10px;border-radius:16px;background:var(--panel);border:3px dashed var(--steel)}
.opt.sel{background:var(--deck);color:#0D1B2A}
/* dermaga */
.quay{min-height:64px;margin-bottom:10px;padding:8px;border-radius:14px;background:var(--quay);border:3px solid var(--line);display:flex;flex-direction:column;gap:6px}
.quay .slot{padding:8px 10px;border-radius:10px;background:var(--steel);color:#fff;font-weight:800;font-size:16px}
.quay .slot b{display:inline-block;min-width:26px;margin-inline-end:6px;background:var(--deck);color:#0D1B2A;border-radius:6px;text-align:center}
.quay .empty{color:var(--muted);font-weight:800;text-align:center;padding:10px}
/* manifest */
.mf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mf .col{display:flex;flex-direction:column;gap:8px}
.mf .opt{font-size:15px;min-height:52px;padding:8px}
.opt.pick{outline:4px solid var(--brand);outline-offset:2px}
.opt.done{opacity:.85}
/* tugbot */
.buoy{padding:16px;border-radius:18px;border:3px solid var(--line);background:var(--card);text-align:center;font-weight:900;font-size:18px;box-shadow:0 5px 0 var(--line);margin-bottom:12px}
.tug .opt{font-size:16px}
.tug .yes{background:var(--okbg)}
.tug .no{background:var(--badbg)}
.buoy.away{animation:away .5s forwards}
@keyframes away{to{transform:translateX(40px);opacity:0}}
/* rampa */
.ramp{padding:12px;border-radius:14px;background:var(--panel);border:3px solid var(--line);margin-bottom:12px;font-weight:800}
.blank{display:inline-block;min-width:90px;padding:0 8px;border-bottom:4px dashed var(--brand);text-align:center}
.blank.fill{border-bottom-style:solid;background:var(--okbg);border-radius:6px}
/* maklum balas & keputusan */
.fb{position:fixed;inset:auto 0 0 0;z-index:50;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(7,22,32,.35)}
.fb .in{max-width:540px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .ketam{width:66px;flex:0 0 66px}
.fb strong{font-family:"Russo One","Nunito",sans-serif;font-weight:400;font-size:20px}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.fb p{margin:2px 0 0;font-size:16px}
.res{text-align:center}
.res .ketam{width:120px}
.stars{font-size:46px;margin:6px 0}
.stars span{display:inline-block;animation:pop .5s both}
.stars .off{filter:grayscale(1);opacity:.3}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.2)}100%{transform:scale(1)}}
.gotst{margin:10px auto;padding:10px;border-radius:16px;background:var(--note);border:2px dashed var(--line);font-weight:800}
.gotst span{font-size:36px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:92vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const QURAN = {"haji": "وَأَتِمُّوا۟ ٱلْحَجَّ وَٱلْعُمْرَةَ لِلَّهِ", "korban": "فَصَلِّ لِرَبِّكَ وَٱنْحَرْ", "maidah3": "حُرِّمَتْ عَلَيْكُمُ ٱلْمَيْتَةُ وَٱلدَّمُ وَلَحْمُ ٱلْخِنزِيرِ", "jualbeli": "وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ وَحَرَّمَ ٱلرِّبَوٰا۟", "faraid": "يُوصِيكُمُ ٱللَّهُ فِىٓ أَوْلَـٰدِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ ٱلْأُنثَيَيْنِ", "curi": "وَٱلسَّارِقُ وَٱلسَّارِقَةُ فَٱقْطَعُوٓا۟ أَيْدِيَهُمَا"};

/* ===================== KANDUNGAN (Feqah Tahun 6) =====================
   Buku teks JAIS Feqah Tahun 6: fail pN.jpg = ms. (N-8). Setiap teks = ["Rumi","Jawi"]. Rentetan biasa = teks Arab.
   Ayat Quran dari QURAN (api.quran.com, dipotong ikut indeks perkataan). Niat/talbiah disalin daripada buku: perlu semakan ustaz. */
const STATIONS = [
{ id:1, icon:"🕋", c:"#F26B1D", sticker:"🕋", t:["Haji dan Umrah","حج دان عمرة"], u:["Dermaga 1 • ms. 1–4","درماڬ 1 • م.س. 1–4"],
  read:[
    { p:2, pic:"🕋🚢", h:["Pengertian haji dan umrah","ڤڠرتين حج دان عمرة"],
      list:[["Haji ialah mengunjungi Baitullah al-Haram (Kaabah) di Mekah pada bulan haji dengan mengerjakan ibadah-ibadah tertentu menurut syarat-syaratnya.","حج اياله مڠونجوڠي بيت الله الحرام (كعبة) دمكة ڤد بولن حج دڠن مڠرجاکن عبادة٢ ترتنتو منوروت شرط-شرطڽ."],
            ["Umrah ialah mengunjungi Baitullah al-Haram (Kaabah) di Mekah pada bila-bila masa untuk mengerjakan ibadah-ibadah tertentu menurut syarat-syaratnya.","عمرة اياله مڠونجوڠي بيت الله الحرام (كعبة) دمكة ڤد بيلا٢ ماس اونتوق مڠرجاکن عبادة٢ ترتنتو منوروت شرط-شرطڽ."]] },
    { p:2, pic:"📜", h:["Dalil dan hukum","دليل دان حکوم"], ar:QURAN.haji,
      mk:["Maksudnya: Dan sempurnakanlah ibadah haji dan umrah kerana Allah.","مقصودڽ: دان سمڤورناکنله عبادة حج دان عمرة کران الله."], src:["Surah al-Baqarah, ayat 196","سورة البقرة، ايات 196"],
      text:["Hukum mengerjakan haji dan umrah: wajib sekali seumur hidup bagi setiap orang Islam yang cukup syarat.","حکوم مڠرجاکن حج دان عمرة: واجب سکالي سعمور هيدوڤ باڬي ستياڤ اورڠ إسلام يڠ چوکوڤ شرط."] },
    { p:3, pic:"✅", h:["Syarat wajib haji dan umrah","شرط واجب حج دان عمرة"],
      list:[["Islam","إسلام"],["Baligh","بالغ"],["Berakal","برعقل"],["Merdeka","مرديک"],["Berkemampuan (istitaah)","برکمامڤوان (استطاعة)"]],
      tip:["Berkemampuan bermaksud: mempunyai perbelanjaan yang cukup untuk diri dan orang di bawah tanggungannya, sihat tubuh badan, ada kenderaan yang sesuai, dan aman perjalanan pergi dan balik.","برکمامڤوان برمقصود: ممڤوڽاٴي ڤربلنجاٴن يڠ چوکوڤ اونتوق ديري دان اورڠ د باوه تڠڬوڠنڽ، صيحت توبوه بادن، اد کندراٴن يڠ سسواي، دان امان ڤرجالنن ڤرڬي دان باليق."] },

{ id:4, icon:"🐐", c:"#2A9D8F", sticker:"🐐", t:["Korban dan Akikah","قربان دان عقيقة"], u:["Dermaga 4 • ms. 17–29","درماڬ 4 • م.س. 17-29"],
  read:[

    { p:18, pic:"📜", h:["Dalil dan hukum korban","دليل دان حکوم قربان"], ar:QURAN.korban,

      text:["Akikah ialah penyembelihan binatang ternakan yang halal dimakan semasa kelahiran bayi. Hukumnya sunat muakkad.","عقيقة اياله ڤڽمبليهن بيناتڠ ترنقن يڠ حلال دماکن سماس کلاهيرن بايي. حکومڽ سنة مؤكدة."],

    { p:28, pic:"🎉", h:["Hikmah akikah","حکمه عقيقة"],
      list:[["Mensyukuri kelahiran anak kurniaan Allah","منشکوري کلاهيرن انق کورنياٴن الله"],["Melahirkan kegembiraan kerana mendapat zuriat","ملاهيرکن کڬمبيراٴن کران منداڤت ذريت"],["Mengukuhkan silaturahim antara ahli masyarakat","مڠوکوهکن صلة الرحم انتارا اهلي مشارکت"],["Memperkenalkan anak kepada syariat Islam sejak awal","ممڤرکنلکن انق کڤد شريعة إسلام سجق اول"]],

    { p:58, pic:"📋", h:["Jenis jinayat dan hukuman","جنيس جنايات دان هوکومن"],

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:    () => tone([[523,.12],[784,.2]]),
  tick:  () => tone([[740,.07,"triangle"]]),
  no:    () => tone([[196,.18,"square"],[147,.22,"square"]]),
  clank: () => tone([[330,.05,"square"],[660,.05,"square"],[440,.12,"triangle"]]),
  horn:  () => tone([[147,.35,"sawtooth"],[196,.4,"sawtooth"]]),
  splash:() => tone([[900,.05,"triangle"],[500,.08,"sine"],[300,.1,"sine"]]),
  win:   () => tone([[392,.14],[523,.14],[659,.14],[784,.34]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
const forSpeech = s => String(s).replace(/ﷺ/g," sallallahu alaihi wasallam ").replace(AR_RE," ").replace(/<[^>]+>/g," ")
  .replace(/___/g," ... ").replace(/…/g," ... ").replace(/\bms\. /g,"muka surat ").replace(/\bRM(\d+)/g,"$1 ringgit").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    const s = forSpeech(text); if(!s) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = 1; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

const craneSvg = `<svg viewBox="0 0 90 88" aria-hidden="true"><g stroke="#0D1B2A" stroke-width="3" fill="#FFC43D" stroke-linejoin="round">
  <rect x="10" y="20" width="12" height="64"/><rect x="4" y="80" width="24" height="6" fill="#3C6E91"/>
  <rect x="10" y="10" width="78" height="10"/><path d="M14 20 L22 30 M18 20 L10 30" fill="none"/></g></svg>`;
const GAMES = {
  /* Kren: angkat kontena jawapan yang betul (4 pilihan) */
  kren(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    el.innerHTML = `<div class="yard" id="yard">${craneSvg}<span class="hook"></span></div>
      <div class="g1">${opts.map((o,i)=>`<button class="opt box" style="--bc:${BOXC[i%BOXC.length]}" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return;
      if(opts[+b.dataset.i].ok){ done = true; sfx.clank(); b.classList.add("right","lift"); el.querySelector("#yard").classList.add("up"); clearHint(); setTimeout(win, 650); }
      else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Kontena itu bukan muatan yang betul. Cuba lagi!","کونتينا ايت بوکن موانن يڠ بتول. چوبا لاڬي!")); }
    }));
  },

  /* Kontena: hantar setiap kontena ke kapal (kumpulan) yang betul */
  kontena(el, g){
    const order = mix(g.items.map((_,i)=>i)); let k = 0, busy = false;
    const draw = () => {
      const it = g.items[order[k]];
      el.innerHTML = `<div class="cur" data-k="${order[k]}"><span>📦 ${TX(it[0])}</span></div>
        <div class="bays ${g.bins.length>2?"g1":"g2"}">${g.bins.map((b,i)=>`<button class="opt" data-c="${i}">${T(b)}</button>`).join("")}</div>
        <div class="cnt">🏗️ ${L(`Kontena ${k+1} daripada ${order.length}`,`کونتينا ${k+1} درڤد ${order.length}`)}</div>`;
      busy = false;
      el.querySelectorAll(".bays .opt").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.c === it[1]){ busy = true; sfx.splash(); b.classList.add("right"); clearHint(); k++;
          if(k < order.length) setTimeout(draw, 380); else setTimeout(win, 450); }
        else oops(b, L("Kapal itu bukan destinasinya. Baca kontena sekali lagi!","کاڤل ايت بوکن دستيناسيڽ. باچ کونتينا سکالي لاڬي!"));
      }));
    };
    draw();
  },

  /* Kargo: pilih SEMUA muatan yang betul, kemudian belayar */
  kargo(el, g){
    const items = mix(g.items.map((x,i)=>({x, ok:!!x[1], i}))), need = items.filter(o=>o.ok).length; let done = false;
    el.innerHTML = `<div class="hold"><div class="g2">${items.map((o,n)=>`<button class="opt" data-n="${n}" data-ok="${o.ok?1:0}" aria-pressed="false">📦 ${TX(o.x[0])}</button>`).join("")}</div></div>
      <div class="cnt" id="kc"></div>
      <button class="btn go" id="sail" style="margin-top:8px">🚢 ${L("Belayar!","بلاير!")}</button>`;
    const count = () => { const c = el.querySelectorAll(".opt.sel").length; el.querySelector("#kc").textContent = "⚖️ "+L(`Dimuat: ${c} • Cari ${need} muatan`,`دموات: ${c} • چاري ${need} موانن`); };
    count();
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done) return; b.classList.toggle("sel"); b.classList.remove("wrong"); b.setAttribute("aria-pressed", b.classList.contains("sel")); sfx.tick(); count();
    }));
    el.querySelector("#sail").addEventListener("click", () => {
      if(done) return;
      const sel = [...el.querySelectorAll(".opt.sel")], bad = sel.filter(b=>b.dataset.ok==="0"), good = sel.length - bad.length;
      if(!bad.length && good===need){ done = true; sel.forEach(b=>b.classList.add("right")); sfx.horn(); clearHint(); setTimeout(win, 500); return; }
      bad.forEach(b=>{ b.classList.remove("sel"); b.classList.add("wrong"); b.setAttribute("aria-pressed","false"); });
      count();
      oops(el.querySelector(".hold"), bad.length ? L("Ada muatan haram (merah). Punggah keluar dan cuba lagi!","اد موانن يڠ تيدق بتول (ميره). ڤوڠڬه کلوار دان چوبا لاڬي!")
        : L(`Kapal belum penuh: masih ada ${need-good} lagi.`,`کاڤل بلوم ڤنوه: ماسيه اد ${need-good} لاڬي.`));
    });
  },

  /* Dermaga: susun kontena di dermaga mengikut urutan */
  dermaga(el, g){
    const pool = mix(g.steps.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="quay" id="quay"><div class="empty">⚓ ${L("Dermaga kosong: tekan kontena pertama","درماڬ کوسوڠ: تکن کونتينا ڤرتام")}</div></div>
      <div class="g1">${pool.map(i=>`<button class="opt box" style="--bc:${BOXC[i%BOXC.length]}" data-i="${i}">${TX(g.steps[i])}</button>`).join("")}</div>`;
    const quay = el.querySelector("#quay");
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(+b.dataset.i === k){
        if(k===0) quay.innerHTML = "";
        quay.insertAdjacentHTML("beforeend", `<div class="slot"><b>${k+1}</b>${TX(g.steps[k])}</div>`);
        b.disabled = true; b.style.display = "none"; k++; sfx.clank(); clearHint();
        if(k === g.steps.length) setTimeout(win, 450);
      } else oops(b, L(`Bukan itu. Kontena ke-${k+1} belum dijumpai!`,`بوکن ايت. کونتينا ک-${k+1} بلوم دجومڤاٴي!`));
    }));
  },

  /* Manifest: tekan kad kiri, kemudian kad kanan yang sepadan */
  manifest(el, g){
    const n = g.pairs.length, left = shuffle([...Array(n).keys()]); let right; do{ right = shuffle([...Array(n).keys()]); }while(n>1 && right.some((x,i)=>x===left[i]));
    const COL = ["#FFE08A","#A8E6F0","#C7F0B8","#FFC2C8","#DCC8F5","#FFD3A8"];
    let pick = null, k = 0;
    el.innerHTML = `<div class="mf"><div class="col">${left.map(p=>`<button class="opt l" data-p="${p}">${TX(g.pairs[p][0])}</button>`).join("")}</div>
      <div class="col">${right.map(p=>`<button class="opt r" data-p="${p}">${TX(g.pairs[p][1])}</button>`).join("")}</div></div>
      <div class="cnt">📋 ${L("Tekan kad kiri, kemudian kad kanan yang sepadan.","تکن کد کيري، کمودين کد کانن يڠ سڤادن.")}</div>`;
    el.querySelectorAll(".opt.l").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return; el.querySelectorAll(".opt.l").forEach(x=>x.classList.remove("pick")); b.classList.add("pick"); pick = b; sfx.tick();
    }));
    el.querySelectorAll(".opt.r").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(!pick){ toast(L("Pilih kad di sebelah kiri dahulu.","ڤيليه کد د سبله کيري دهولو.")); return; }
      if(b.dataset.p===pick.dataset.p){
        const c = COL[k%COL.length]; [pick,b].forEach(x=>{ x.classList.remove("pick"); x.classList.add("done"); x.disabled = true; x.style.background = c; x.style.color = "#0D1B2A"; });
        pick = null; k++; sfx.clank(); clearHint(); if(k===n) setTimeout(win, 400);
      } else oops(b, L("Manifes tidak sepadan. Semak semula!","مانيفيس تيدق سڤادن. سمق سمولا!"));
    }));
  },

  /* Tugbot: tarik masuk kenyataan betul, tolak keluar yang tidak betul (beberapa pusingan) */
  tugbot(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const [txt, ok] = g.rounds[r];
      el.innerHTML = `<div class="buoy" id="buoy">🛟 ${TX(txt)}</div>
        <div class="g2 tug"><button class="opt yes" data-v="1">⚓ ${L("Tarik masuk (betul)","تاريق ماسوق (بتول)")}</button><button class="opt no" data-v="0">🌊 ${L("Tolak keluar (tidak betul)","تولق کلوار (تيدق بتول)")}</button></div>
        <div class="cnt">🚤 ${L(`Pusingan ${r+1} daripada ${g.rounds.length}`,`ڤوسيڠن ${r+1} درڤد ${g.rounds.length}`)}</div>`;
      busy = false;
      el.querySelectorAll(".tug .opt").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if((b.dataset.v==="1") === ok){ busy = true; sfx.splash(); b.classList.add("right"); el.querySelector("#buoy").classList.add("away"); clearHint(); r++;
          if(r < g.rounds.length) setTimeout(draw, 550); else setTimeout(win, 550); }
        else oops(b, ok ? L("Kenyataan ini betul. Tarik ia masuk!","کڽاتاٴن اين بتول. تاريق اي ماسوق!") : L("Kenyataan ini tidak betul. Tolak ia keluar!","کڽاتاٴن اين تيدق بتول. تولق اي کلوار!"));
      }));
    };
    draw();
  },

  /* Rampa: pasang papan (perkataan) pada tempat kosong */
  rampa(el, g){
    const opts = mix(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    const parts = T(g.text).split("___");
    el.innerHTML = `${g.ar?`<div class="abox"><span class="ar" lang="ar">${g.ar}</span></div>`:""}
      <div class="ramp"><p class="sent" style="margin:0">${parts[0]}<span class="blank" id="blank">🪵🪵</span>${parts[1]||""}</p></div>
      <div class="g2">${opts.map((o,i)=>`<button class="opt" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.disabled) return; const o = opts[+b.dataset.i];
      if(o.ok){ done = true; sfx.clank(); b.classList.add("right"); const bl = el.querySelector("#blank"); bl.textContent = T(o.x); bl.classList.add("fill"); clearHint(); setTimeout(win, 600); }
      else { b.classList.add("wrong"); b.disabled = true; oops(b, L("Papan itu tidak muat pada rampa. Cuba lagi!","ڤاڤن ايت تيدق موات ڤد رمڤا. چوبا لاڬي!")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t6-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan dermaga sebelumnya dahulu 🔒","سلسايکن درماڬ سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} dermaga untuk melayarkan Kapal Induk 🚢`,`سلسايکن سموا ${STATIONS.length} درماڬ اونتوق ملايرکن کاڤل ايندوق 🚢`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
</html>
