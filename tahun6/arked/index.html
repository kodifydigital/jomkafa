<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B1B5E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<title>Legenda KAFA 6D • Zon Arked Tahun 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="../../assets/config.js"></script>
<script src="../../assets/auth.js"></script>
<script src="../../assets/access.js"></script>
<style>
:root{
  --bg:#ECF8EF; --surface:#FFFFFF; --ink:#132049; --muted:#56628C; --line:#CFE0F7;
  --gold:#FFC22E; --ok:#18A957; --bad:#E5484D;
  --w1:#0F7A4A; --w2:#0A3D2A; --wa:#FFC22E;
  --pattern:rgba(27,95,209,.08);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0A1430; --surface:#14214A; --ink:#EAF1FF; --muted:#A9B8E6; --line:#26386E; --pattern:rgba(150,190,255,.07); color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.4;
  background-image:radial-gradient(var(--pattern) 2px,transparent 2.5px);background-size:26px 26px;overscroll-behavior:none}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Baloo 2",serif;font-size:20px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding:10px 14px 40px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;line-height:1.5}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
.grp{display:flex;gap:6px;align-items:center}
.iconbtn,.langbtn{display:inline-grid;place-items:center;min-width:48px;height:48px;border-radius:16px;border:3px solid var(--line);background:var(--surface);font-size:22px;font-weight:800;text-decoration:none;color:var(--ink);padding:0 10px}
.langbtn{font-size:17px}
.card{background:var(--surface);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 22px;border:0;border-radius:20px;font-weight:800;font-size:21px;
  background:linear-gradient(180deg,#FFD84D,#FFB000);color:#3A2400;box-shadow:0 5px 0 #C27C00;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #C27C00}
.btn.alt{background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);border:3px solid var(--line)}
.btn.go{background:linear-gradient(180deg,#3FE08A,#14A05A);color:#fff;box-shadow:0 5px 0 #0B6B3B;font-size:26px;min-height:68px;padding:6px 34px}
.btn.sm{min-height:44px;font-size:16px;padding:4px 14px}
/* papan tajuk */
.hero{position:relative;overflow:hidden;margin:10px 0 14px;border-radius:26px;padding:18px 18px 20px;color:#fff;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 34px,transparent 34px 68px),linear-gradient(165deg,#13A35C 0%,#0E7A4A 50%,#0A3D2A 100%);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.hero h1{margin:0;padding-inline-end:64px;font-size:34px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{margin:6px 0 0;font-size:17px;opacity:.95;max-width:78%}
.hero .flag{position:absolute;inset-inline-end:10px;top:6px;font-size:64px;transform:rotate(-8deg)}
.hero .road{position:absolute;left:0;right:0;bottom:0;height:8px;background:#fff;opacity:.8}
.hero .lights{position:absolute;top:0;inset-inline-start:46%;font-size:22px;letter-spacing:10px;opacity:.9}
.hero .stars{display:inline-block;margin-top:8px;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 12px;font-weight:800}
.sec{font-weight:800;font-size:20px;margin:16px 4px 8px}
/* kad dunia */
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wcard{position:relative;min-width:0;min-height:150px;border:0;border-radius:24px;padding:12px;text-align:start;color:#fff;overflow:hidden;
  background:linear-gradient(165deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;justify-content:flex-end}
.wcard:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.wcard .m{position:absolute;top:6px;inset-inline-end:8px;font-size:54px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.wcard .deco{position:absolute;top:10px;inset-inline-start:10px;font-size:22px;opacity:.85;letter-spacing:2px}
.wcard b{font-size:19px;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.3)}
html[dir="rtl"] .wcard b{font-size:18px;line-height:1.5}
.wcard small{font-weight:700;opacity:.95;font-size:14px}
.wcard.mix{grid-column:1/-1;min-height:110px}
/* kad kenderaan */
.vgrid{display:grid;gap:12px}
.vcard{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:12px;border:0;border-radius:24px;padding:12px 14px;text-align:start;
  background:var(--surface);box-shadow:0 6px 0 var(--line);min-height:104px;border:3px solid transparent}
.vcard:active{transform:translateY(3px)}
.vcard .ve{font-size:58px;line-height:1;display:grid;place-items:center;height:80px;border-radius:20px;background:linear-gradient(160deg,var(--c1),var(--c2))}
.vcard b{display:block;font-size:22px;line-height:1.15}
.vcard small{color:var(--muted);font-weight:600;font-size:15px;display:block}
.vcard .best{font-weight:800;color:var(--w1);font-size:16px;white-space:nowrap}
.vcard .play{font-size:30px}
.whead{display:flex;align-items:center;gap:12px;border-radius:24px;padding:14px;color:#fff;background:linear-gradient(160deg,var(--w1),var(--w2));margin:10px 0 6px}
.whead .m{font-size:60px;line-height:1}
.whead h1{margin:0;font-size:26px;line-height:1.15}
.whead p{margin:2px 0 0;font-size:15px;opacity:.95}
/* skrin pengenalan */
.intro{text-align:center;padding:18px}
.intro .big{font-size:84px;line-height:1.1}
.intro h2{margin:6px 0;font-size:28px}
.how{list-style:none;padding:0;margin:12px 0 18px;display:grid;gap:8px;text-align:start}
.how li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:16px;padding:8px 12px;font-weight:700;font-size:17px}
.how li span{font-size:30px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:80;max-width:92vw;text-align:center}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.rain span{position:absolute;top:-50px;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
/* ---------- skrin permainan sukan ---------- */
.game{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.field{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--w1),var(--w2))}
.field canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:6px;right:6px;display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(10,18,50,.62);color:#fff;border-radius:16px;padding:2px 10px;font-weight:800;font-size:19px;min-height:44px;white-space:nowrap}
.chip.rd{background:linear-gradient(180deg,#FFD84D,#FFB000);color:#3A2400}
.chip.combo{background:linear-gradient(180deg,#FF7A3D,#E5322D)}
.chip.combo[hidden]{display:none}
.chip.par{background:linear-gradient(180deg,#3FE08A,#14A05A)}
.chip.par[hidden]{display:none}
.hud .sp{flex:1}
.hud .iconbtn{border:0;background:rgba(10,18,50,.62);color:#fff;height:44px;min-width:44px}
.prompt{position:absolute;left:8px;right:8px;top:calc(58px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.95);color:#132049;border-radius:20px;padding:6px 8px 6px 14px;box-shadow:0 4px 0 rgba(0,0,0,.25);border:3px solid var(--wa)}
.prompt .q{flex:1;font-weight:800;font-size:21px;line-height:1.2;min-width:0}
html[dir="rtl"] .prompt .q{font-size:22px;line-height:1.6}
.prompt .say{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:var(--w1);color:#fff;font-size:24px}
.prompt.pop{animation:ppop .45s ease-out}
.prompt[hidden]{display:none}
@keyframes ppop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05)}100%{transform:none}}
/* sasaran boleh diketik (diletak di atas kanvas mengikut unjuran) */
.tg{position:absolute;z-index:4;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:0;background:transparent;padding:0}
.tg.sel{box-shadow:0 0 0 4px var(--tc),0 0 18px 6px rgba(255,255,255,.7)}
/* kawalan bawah */
.ctl{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:0 10px;z-index:6;pointer-events:none}
.ctl button{pointer-events:auto;touch-action:none}
.ctl .side{width:72px;height:72px;border-radius:24px;border:4px solid rgba(255,255,255,.9);background:rgba(10,18,50,.5);color:#fff;font-size:34px;font-weight:800}
.ctl .side:active{background:var(--wa);color:#3A2400}
.ctl .pw{width:112px;height:112px;border-radius:50%;border:6px solid #fff;font-size:44px;font-weight:800;color:#3A2400;
  background:conic-gradient(#FF5A3D calc(var(--p,0)*1turn),#FFD84D 0);box-shadow:0 6px 0 rgba(0,0,0,.3)}
.ctl .pw.on{transform:scale(1.06)}
.ctl .pw:disabled{filter:grayscale(.8);opacity:.6}
.meter{position:absolute;inset-inline-end:10px;bottom:calc(140px + env(safe-area-inset-bottom,0px));width:26px;height:150px;border-radius:14px;border:3px solid #fff;background:rgba(10,18,50,.55);z-index:6;overflow:hidden;pointer-events:none}
.meter i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0)*100%);background:linear-gradient(0deg,#3FE08A,#FFD84D,#FF5A3D)}
.meter b{position:absolute;left:0;right:0;border:2px dashed #fff;background:rgba(255,255,255,.35);bottom:calc(var(--z0,0)*100%);height:calc((var(--z1,0) - var(--z0,0))*100%)}
.curve{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:6px;background:rgba(10,18,50,.6);color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}
.curve input{width:130px;accent-color:var(--wa)}
.cd{position:absolute;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none;font-size:140px;font-weight:800;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35)}
.cd span{animation:cdz .8s ease-out}
@keyframes cdz{from{transform:scale(2.2);opacity:0}}
.fxtxt{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:7;font-size:44px;font-weight:800;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 4px 0 rgba(0,0,0,.35);animation:fxt 1.2s ease-out forwards}
.fxtxt.bad{color:#FFE3E3;font-size:34px}
.fxtxt.big{font-size:60px;color:#FFE066}
@keyframes fxt{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-110%);opacity:0}}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:6;background:rgba(255,255,255,.95);color:#132049;border-radius:16px;padding:4px 14px;font-weight:800;font-size:17px;border:3px solid var(--ok);max-width:90%;text-align:center;pointer-events:none}
.hint[hidden]{display:none}
.slow{position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(255,230,120,.55);opacity:0;transition:opacity .2s}
.slow.on{opacity:1}
.shake{animation:shk .45s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ovl{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(5,10,35,.55);padding:16px}
.ovl .card{text-align:center;width:min(380px,100%)}
.ovl .card .btn{width:100%;margin-top:10px}
/* mod rata (tiada WebGL) */
.flat{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky1,#8FD3FF) 0 20%,var(--gnd,#7CC66B) 20%)}
.flat .lane{position:absolute;left:0;right:0;top:20%;bottom:0;background:var(--lane,transparent);clip-path:polygon(40% 0,60% 0,95% 100%,5% 100%)}
.flat .ft{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.flat .ft .bd{background:#fff;color:#132049;border-radius:12px;border:4px solid var(--tc);text-align:center;font-weight:800;font-size:15px;padding:2px 6px;max-width:30vw;overflow-wrap:break-word}
.flat .ft .bd .e{display:block;font-size:24px;line-height:1.1}
.flat .ft .ic{font-size:34px;line-height:1}
.flat .ft.ok .bd{border-color:#18A957;background:#D8F8E4}
.flat .ft.no .bd{border-color:#E5484D;background:#FFE3E3}
.flat .ball{position:absolute;font-size:34px;transform:translate(-50%,-50%);line-height:1;pointer-events:none}
.flat .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;opacity:.85}
.flat .obs{position:absolute;transform:translate(-50%,-50%);font-size:28px;pointer-events:none}
.flat .coach{position:absolute;left:6%;bottom:24%;font-size:46px}
/* keputusan */
.res{text-align:center}
.res .place{font-size:76px;line-height:1}
.res h2{margin:4px 0;font-size:30px}
.res .stars{font-size:52px;letter-spacing:6px;margin:4px 0}
.res .stars .off{filter:grayscale(1);opacity:.3}
.res .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.res .nums div{background:var(--bg);border-radius:16px;padding:6px 4px;font-weight:700;font-size:14px}
.res .nums b{display:block;font-size:26px;color:var(--w1)}
.res .acts{display:grid;gap:10px;margin-top:12px}
.newbest{display:inline-block;background:var(--gold);color:#3A2400;border-radius:999px;padding:2px 14px;font-weight:800;animation:ppop .6s}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin:12px 0 6px}
.podium:empty{display:none}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pd .md{font-size:34px;line-height:1}
.pd .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;margin-top:2px}
.pd .sc{font-weight:800;color:var(--w1);font-size:18px}
.pd .step{display:grid;place-items:center;width:100%;margin-top:4px;border-radius:14px 14px 4px 4px;color:#fff;font-size:26px;font-weight:800;background:linear-gradient(180deg,var(--w1),var(--w2))}
.pd.p1 .step{height:96px;background:linear-gradient(180deg,#F5C542,#C9952B)}
.pd.p2 .step{height:70px;background:linear-gradient(180deg,#C9D3DE,#8E9AAB)}
.pd.p3 .step{height:52px;background:linear-gradient(180deg,#E3A06B,#A9663A)}
.pd.p1 .md{font-size:44px}
.pd.me .nm{color:var(--w1);text-decoration:underline}
/* ---------- papan pendahulu & akaun (dari Zon Arked T3) ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 0;padding:5px;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.tabs button{border:0;border-radius:13px;padding:8px 10px;font-weight:800;font-size:18px;background:none;color:var(--muted);min-height:48px}
.tabs button[aria-selected="true"]{background:var(--w1);color:#fff;box-shadow:0 3px 0 var(--w2)}
.acct{border:2px solid var(--wa);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;min-height:44px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{padding:12px}
.lbtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.lbtabs button{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px;min-height:40px}
.lbtabs button[aria-pressed="true"]{background:var(--w1);border-color:var(--w1);color:#fff}
.lbtabs.games button[aria-pressed="true"]{background:var(--wa);border-color:var(--wa);color:var(--w2)}
.lbrows{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.lbrows li{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:4px 12px;font-weight:700}
.lbrows li.top{background:color-mix(in srgb,var(--gold) 18%,var(--bg))}
.lbrows li.me{outline:3px solid var(--wa);outline-offset:-1px}
.lbrows .rk{font-size:20px;text-align:center}
.lbrows .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
html[dir="rtl"] .lbrows .nm{text-align:right}
.lbrows b{font-size:20px;color:var(--w1)}
.lbrows .kskel{height:1.05em}
.lbrows li.lbmsg{display:block;text-align:center;font-weight:600;color:var(--muted)}
.lbmsg{text-align:center;color:var(--muted);margin:8px 0}
.lbfoot{text-align:center;margin-top:8px}
.lbfoot p{margin:4px 0}
.lbfoot small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.lbres{margin-top:12px;border:2px solid var(--wa);border-radius:16px;padding:8px 12px;background:color-mix(in srgb,var(--wa) 10%,var(--surface))}
.lbres p{margin:4px 0}
.lbres .rank{font-size:20px;font-weight:800}
.lbres .rank b{font-size:28px;color:var(--w1)}
.sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(10,3,32,.6)}
.sheet .card{position:relative;width:min(460px,100%);max-height:90vh;overflow:auto}
.sheet h2{margin:0 40px 8px 0;font-size:24px}
html[dir="rtl"] .sheet h2{margin:0 0 8px 40px}
.sheet h3{margin:14px 0 4px;font-size:18px}
.sheet .x{position:absolute;top:10px;inset-inline-end:10px;width:38px;height:38px}
.sheet label{display:block;font-weight:700;font-size:15px;margin-top:10px}
.sheet .row{display:flex;gap:8px;margin-top:4px}
.sheet input{flex:1;min-width:0;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg);color:var(--ink)}
.sheet input:focus{outline:3px solid var(--wa);outline-offset:1px}
.sheet .cls{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sheet .cls li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 10px}
.sheet .cls li>span{flex:1 1 160px}
.sheet input:disabled{opacity:.7}
.sheet code{font-size:17px;font-weight:800;letter-spacing:2px;color:var(--w1)}
.sheet details{margin-top:12px}
.sheet summary{font-weight:700;cursor:pointer}
.sheet .muted{color:var(--muted)}
.sheet .err{color:var(--bad);font-weight:700;min-height:1.2em;margin:8px 0 0}
.hero .sub{display:inline-block;font-weight:800;font-size:15px;background:rgba(0,0,0,.22);border-radius:999px;padding:0 12px;margin-bottom:6px}
.prompt{flex-wrap:wrap}

function okEntry(q){ return q && Array.isArray(q.p) && q.p.length===2 && Array.isArray(q.ok) && q.ok.length && Array.isArray(q.no) && q.no.length>=1; }
function deck(s){
  const B = (typeof BANK!=="undefined" && BANK) || {};
  const from = s==="mix" ? REAL : [s];
  return from.flatMap(id=>(B[id]||[]).filter(okEntry).map(q=>({...q, sub:id})));
}
// 1 jawapan betul + 2 pengganggu, kedudukan rawak
function makeQ(q, n){
  const ok = pick(q.ok), okK = new Set(q.ok.map(itKey));
  let no = shuffle(q.no).filter(x=>!okK.has(itKey(x)));
  if(no.length < n-1){
    const extra = shuffle(deck(q.sub).flatMap(o=>o.no)).filter(x=>!okK.has(itKey(x)) && !no.some(y=>itKey(y)===itKey(x)) && itKind(x)===itKind(ok));
    no = no.concat(extra);
  }
  no = no.slice(0, n-1);
  while(no.length < n-1) no.push(["—","—","❔"]);
  const opts = shuffle([ok, ...no]);
  return {p:q.p, sub:q.sub, opts, ok:opts.indexOf(ok)};
}

/* ============ 4D: bunyi 3D (HRTF), getaran, kawalan gerak/sentuh ============ */
let actx = null;
function AC(){ if(muted) return null; try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended" && actx.resume) actx.resume(); return actx; }catch(e){ return null; } }
function tone(freqs, dur=0.1, type="sine", vol=0.16, dest){
  const a = AC(); if(!a) return;
  try{ const t = a.currentTime;
    freqs.forEach((f,i)=>{ const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
      const s = t+i*dur; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol,s+0.015); g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(dest||a.destination); o.start(s); o.stop(s+dur+0.02); });
  }catch(e){}
}
let noiseBuf = null;
function noise(dur, f0, f1, vol, dest, type){
  const a = AC(); if(!a) return;
  try{ if(!noiseBuf){ const n = a.sampleRate; noiseBuf = a.createBuffer(1, n, n); const d = noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1; }
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    s.buffer = noiseBuf; s.loop = true; f.type = type||"bandpass"; f.Q.value = 2; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+dur*0.25); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f).connect(g).connect(dest||a.destination); s.start(t); s.stop(t+dur+0.05);
  }catch(e){}
}
// bunyi berkedudukan 3D: panner HRTF di (x,y,z) dunia; pendengar = kamera (S3.ear)
const S3 = {
  node(x,y,z){ const a = AC(); if(!a) return null;
    try{ const p = a.createPanner(); p.panningModel = "HRTF"; p.distanceModel = "inverse"; p.refDistance = 2; p.maxDistance = 60; p.rolloffFactor = 1;
      if(p.positionX){ p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z; } else p.setPosition(x,y,z);
      p.connect(a.destination); return p; }catch(e){ return null; } },
  ear(x,y,z,yaw){ const a = actx; if(!a || !a.listener) return; const l = a.listener, fx = -Math.sin(yaw||0), fz = -Math.cos(yaw||0);
    try{ if(l.positionX){ l.positionX.value = x; l.positionY.value = y; l.positionZ.value = z; l.forwardX.value = fx; l.forwardY.value = 0; l.forwardZ.value = fz; l.upX.value = 0; l.upY.value = 1; l.upZ.value = 0; }
      else { l.setPosition(x,y,z); l.setOrientation(fx,0,fz,0,1,0); } }catch(e){} },
  whoosh(x,y,z){ const p = S3.node(x,y,z); if(p) noise(0.45, 2400, 500, 0.5, p); },
  chime(x,y,z){ const p = S3.node(x,y,z); if(p) tone([1568,2093,2637], 0.07, "triangle", 0.22, p); },
  thud(x,y,z){ const p = S3.node(x,y,z); if(p){ tone([130,90], 0.06, "square", 0.18, p); noise(0.12, 600, 200, 0.25, p, "lowpass"); } },
  step(x,y,z){ const p = S3.node(x,y-1.4,z); if(p) noise(0.09, 500, 260, 0.18, p, "lowpass"); },
  drop(x,y,z){ const p = S3.node(x,y,z); if(p) tone([700,520,330,200], 0.07, "sine", 0.2, p); },
  hum:null,
  humOn(x,y,z){ S3.humOff(); const a = AC(), p = a && S3.node(x,y,z); if(!p) return;
    try{ const o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain(); o.frequency.value = 196; o2.frequency.value = 294; o.type = "triangle";
      g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(0.12, a.currentTime+0.8);
      o.connect(g); o2.connect(g); g.connect(p); o.start(); o2.start(); S3.hum = {o, o2, g}; }catch(e){} },

    let dx = (e.clientX - cx)/R, dy = (e.clientY - cy)/R; const m = Math.hypot(dx, dy); if(m>1){ dx /= m; dy /= m; }
    JOY.x = dx; JOY.y = -dy; JOY.on = true; if(knob) knob.style.transform = `translate(${dx*R*0.6}px,${dy*R*0.6}px)`; };

const SCALES = { maj:[0,2,4,7,9,12,14,16], min:[0,3,5,7,10,12,15,17], pent:[0,2,4,7,9,12,14,16], hij:[0,1,4,5,7,8,11,12] };

  bus:null,
  out(){ const a = AC(); if(!a) return null;
    try{ if(!MUSIC.bus || MUSIC.bus.context!==a){ MUSIC.bus = a.createGain(); MUSIC.bus.gain.value = 0.55; MUSIC.bus.connect(a.destination); } }catch(e){ return null; }
    return MUSIC.bus; },
  on(){ return musicOn && !muted; },
  kick(){ const a = AC(), o = MUSIC.out(); if(!a || !o) return;
    try{ const t = a.currentTime, os = a.createOscillator(), g = a.createGain(); os.frequency.setValueAtTime(140, t); os.frequency.exponentialRampToValueAtTime(45, t+0.16);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.22); os.connect(g).connect(o); os.start(t); os.stop(t+0.25); }catch(e){} },
  snare(){ const o = MUSIC.out(); if(o) noise(0.14, 2600, 1400, 0.22, o); },

};

  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
  x.font = '100px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif'; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(e, 64, 70);
  const t = new THREE.CanvasTexture(c); emoCache.set(e, t); return t;
}
function emojiSprite(e, s=1){ const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex(e), transparent:true})); sp.scale.set(s, s, 1); return sp; }
function itemSprite(){ const s = new THREE.Sprite(new THREE.SpriteMaterial({transparent:true, depthWrite:false})); s.center.set(0.5, 0); s.renderOrder = 5; return s; }
function setItem(s, it, accent, w=2.7){ const T = itemTex(it, accent); s.material.map = T.t; s.material.needsUpdate = true;
  const maxH = w*0.85; let ww = w, hh = w/T.a; if(hh > maxH){ hh = maxH; ww = hh*T.a; } s.scale.set(ww, hh, 1); }

/* ---------- Kesan ---------- */
function addFx(t, step, end){ G.fxs.push({t:0, max:t, step, end}); }
function stepFx(dt){ G.fxs = G.fxs.filter(f=>{ f.t += dt; const k = Math.min(1, f.t/f.max); f.step(k, dt); if(k>=1){ if(f.end) f.end(); return false; } return true; }); }
function burst(pos, color, n=12, sp=4){
  const g = SPH(0.14, 6, 4), m = GLOW(color, .6);
  for(let i=0;i<n;i++){
    const s = new THREE.Mesh(g, m); s.position.copy(pos); G.scene.add(s);
    const v = new THREE.Vector3(rnd(-sp,sp), rnd(1,sp+1), rnd(-sp,sp)*0.6);
    addFx(0.7, (k, dt)=>{ v.y -= 9*dt; s.position.addScaledVector(v, dt); s.scale.setScalar(Math.max(0.01, 1-k)); }, ()=>G.scene.remove(s));
  }
}
function ring(pos, color){
  const r = new THREE.Mesh(TOR(0.9, 0.1), MU(color, {emissive:color, emissiveIntensity:.9, transparent:true}));
  r.position.copy(pos); G.scene.add(r);
  addFx(0.45, k=>{ r.scale.setScalar(1+k*2.4); r.material.opacity = 1-k; }, ()=>{ G.scene.remove(r); r.material.dispose(); });
}
function puff(pos, c=0xFFFFFF, drift=new THREE.Vector3(0, 1.4, 1.5), t=0.9){
  const s = new THREE.Mesh(SPH(0.35, 7, 5), MU(c, {transparent:true, opacity:.85, roughness:1})); s.position.copy(pos); G.scene.add(s);
  addFx(t, (k, dt)=>{ s.position.addScaledVector(drift, dt); s.scale.setScalar(1+k*1.8); s.material.opacity = 0.85*(1-k); }, ()=>{ G.scene.remove(s); s.material.dispose(); });
}

}

  const y0 = pos.y; addFx(0.9, k=>{ const e = 1 - Math.pow(1-k, 3); s.scale.set(sz*(0.6+0.5*e), sz*0.25*(0.6+0.5*e), 1); s.position.y = y0 + e*0.8; s.material.opacity = k<0.6 ? 1 : 1-(k-0.6)/0.4; }, ()=>{ s.visible = false; }); }

function mascot(scene, x, y, z, s=1.6){ const w = WORLD[G.subj], sp = emojiSprite(w.m, s); sp.position.set(x, y, z); scene.add(sp); G.masc = {sp, y, s}; return sp; }
function mascotReact(ok){ const m = G.masc; if(!m) return; const {sp, y, s} = m;
  addFx(ok ? 0.8 : 1.0, k=>{ if(ok){ sp.position.y = y + Math.sin(k*Math.PI*2)*0.5*(1-k) + Math.abs(Math.sin(k*Math.PI*2))*0.3; sp.material.rotation = Math.sin(k*Math.PI*4)*0.25*(1-k); sp.scale.setScalar(s*(1+0.25*Math.sin(k*Math.PI))); }
    else { sp.position.y = y - Math.sin(k*Math.PI)*0.25; sp.material.rotation = Math.sin(k*Math.PI*6)*0.3*(1-k); sp.scale.set(s*(1+0.1*Math.sin(k*Math.PI)), s*(1-0.15*Math.sin(k*Math.PI)), 1); } },
    ()=>{ sp.position.y = y; sp.material.rotation = 0; sp.scale.setScalar(s); }); }
// tween ringkas (ease) untuk kamera / objek
const ease = { out:k=>1-Math.pow(1-k,3), inout:k=>k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2, back:k=>1+2.70158*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2) };
function tween(obj, to, t, fn){ const from = {}; for(const k in to) from[k] = obj[k]; addFx(t, k=>{ const e = (fn||ease.out)(k); for(const p in to) obj[p] = from[p] + (to[p]-from[p])*e; }); }

// V3G.<id>: build(scene,w,cam), frame(dt,t), round(), hit(i,ok), pilihan: wrong(i), beat(n), lowq(), dark
const V3G = {};
const WX = { // cuaca: warna, saiz, halaju
  rain:{c:0x9FC4FF, s:0.08, vy:-14, vx:-1, n:260}, snow:{c:0xFFFFFF, s:0.14, vy:-1.2, vx:0.4, n:240, sway:1}, leaf:{c:0xF2A33A, s:0.18, vy:-1, vx:0.8, n:110, sway:1.5},
  streak:{c:0xFFFFFF, s:0.07, vy:0, vx:-16, n:120}, dust:{c:0xFFE7A0, s:0.07, vy:0.1, vx:0.15, n:160, sway:0.4}, bubble:{c:0xB9FFDA, s:0.16, vy:1.3, vx:0, n:120, sway:0.8},
  spark:{c:0xFFF3A0, s:0.12, vy:0.3, vx:0, n:150, sway:0.6} };
function makeWeather(scene, kind, box){
  const W_ = WX[kind] || WX.dust, n = Math.round(W_.n*(lowQ ? 0.4 : 1)), pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3] = box[0]+Math.random()*box[3]; pos[i*3+1] = box[1]+Math.random()*box[4]; pos[i*3+2] = box[2]+Math.random()*box[5]; }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({color:W_.c, size:W_.s*(kind==="rain" ? 1 : 1.6), transparent:true, opacity:kind==="rain" ? 0.65 : 0.85, depthWrite:false});
  const p = new THREE.Points(g, m); p.frustumCulled = false; scene.add(p);
  return {p, W:W_, box, n, pos};
}
function stepWeather(wx, dt, t){
  if(!wx || REDUCED) return; const {pos, W:W_, box, n} = wx;
  for(let i=0;i<n;i++){ const k = i*3;
    pos[k] += (W_.vx + (W_.sway ? Math.sin(t*1.3 + i)*W_.sway : 0))*dt; pos[k+1] += W_.vy*dt*(0.7 + (i%5)*0.12);
    if(pos[k+1] < box[1]) pos[k+1] += box[4]; if(pos[k+1] > box[1]+box[4]) pos[k+1] -= box[4];
    if(pos[k] < box[0]) pos[k] += box[3]; if(pos[k] > box[0]+box[3]) pos[k] -= box[3]; }
  wx.p.geometry.attributes.position.needsUpdate = true;
}
const V3 = {
  build(){
    const w = WORLD[G.subj], gid = G.gid, F = G.field;
    const R = new THREE.WebGLRenderer({antialias:!lowQ, powerPreference:"high-performance"});
    R.setPixelRatio(lowQ ? 1 : Math.min(1.5, window.devicePixelRatio||1));
    G.W = F.clientWidth || 360; G.H = F.clientHeight || 640; R.setSize(G.W, G.H);
    F.querySelectorAll("canvas").forEach(c=>c.remove()); F.prepend(R.domElement);
    const scene = new THREE.Scene(); scene.background = gradTex(w.sky);
    const cam = new THREE.PerspectiveCamera(60, G.W/G.H, 0.1, 120);
    const dark = !!V3G[gid].dark;
    scene.add(new THREE.HemisphereLight(0xFFFFFF, w.night ? 0x302050 : 0x8AA070, dark ? 0.16 : w.night ? 0.75 : 0.95));
    const sun = new THREE.DirectionalLight(w.night ? 0xFFD8B0 : 0xFFF2D8, dark ? 0.05 : 0.8); sun.position.set(5, 12, 6); scene.add(sun);
    Object.assign(G, {R, scene, cam, fxs:[], shake:0, vt:0, fovK:0, slowF:0, lowFx:lowQ, masc:null});
    V3G[gid].build(scene, w, cam); G.fov0 = cam.fov;
    G.onResize = ()=>{ if(!G || !G.R) return; G.W = F.clientWidth || 360; G.H = F.clientHeight || 640; G.R.setSize(G.W, G.H); G.cam.aspect = G.W/G.H; G.cam.updateProjectionMatrix(); };
    window.addEventListener("resize", G.onResize);
  },
  round(){ if(G.scene && V3G[G.gid].round) V3G[G.gid].round(); },
  hit(i, ok){ if(G.scene && V3G[G.gid].hit) V3G[G.gid].hit(i, ok); G.shake = ok ? 0.15 : 0.35; if(ok) G.fovK = 7; if(i>=0) mascotReact(ok); UI.flash(ok ? WORLD[G.subj].acc : "#FF3355", !ok); },
  beat(n){ if(G.scene && V3G[G.gid].beat) V3G[G.gid].beat(n); },
  wrong(i){ if(G.scene && V3G[G.gid].wrong) V3G[G.gid].wrong(i); G.shake = 0.3; mascotReact(false); UI.flash("#FF3355", true); },
  glow(i){ G.glowI = i; },
  bump(v){ G.shake = Math.min(0.3, v*0.06); },
  flag(){ if(G.scene && V3G[G.gid].flag) V3G[G.gid].flag(); },
  gem(g){ if(G.scene && V3G[G.gid].gemGot) V3G[G.gid].gemGot(g); },
  shoot(){ if(G.scene && V3G[G.gid].shoot) V3G[G.gid].shoot(); },
  frame(dt){
    if(!G || !G.R) return;
    G.vt += dt; const t = G.vt;
    V3.perf();
    stepFx(dt); stepWeather(G.wx, dt, t);
    V3G[G.gid].frame(dt, t);
    if(G.shake>0 && !REDUCED){ G.shake = Math.max(0, G.shake - dt); const s = G.shake*0.5; G.cam.position.x += rnd(-s,s); G.cam.position.y += rnd(-s,s); }
    if(G.fovK>0.01 || G.cam.fov!==G.fov0){ G.fovK *= Math.exp(-dt*5); G.cam.fov = G.fov0 + G.fovK; G.cam.updateProjectionMatrix(); }
    const c = G.cam.position; S3.ear(c.x, c.y, c.z, G.earYaw||0);
    G.R.render(G.scene, G.cam);
  },
  // kualiti adaptif: masa bingkai > 22 ms selama 2 s → kurangkan zarah/piksel
  perf(){ const now = (window.performance && performance.now) ? performance.now() : Date.now(), ft = G.lastF ? now - G.lastF : 16; G.lastF = now;
    if(G.lowFx || G.manual) return; G.slowF = ft > 22 && ft < 400 ? G.slowF + ft/1000 : Math.max(0, G.slowF - ft/2000);
    if(G.slowF > 2){ G.lowFx = true; try{ G.R.setPixelRatio(1); G.R.setSize(G.W, G.H); }catch(e){} if(G.wx) G.wx.p.visible = false; if(V3G[G.gid].lowq) V3G[G.gid].lowq(); } },
  dispose(){
    if(!G) return;
    if(G.onResize) window.removeEventListener("resize", G.onResize);
    try{ if(G.R){ G.R.dispose(); if(G.R.domElement && G.R.domElement.remove) G.R.domElement.remove(); } }catch(e){}
    G.R = null; G.scene = null;
  }
};

// ketik (bukan seret) pada medan → indeks sasaran: [data-k] dalam mod rata, raycast dalam 3D
function t5Pick(e, tgt){
  const el = tgt && tgt.closest ? tgt.closest("[data-k],[data-c]") : null;
  if(el) return el.dataset.c!=null ? {c:+el.dataset.c} : {k:+el.dataset.k};
  if(!G || G.flat || !G.cam || !G.field || typeof THREE==="undefined") return null;
  const V = V3G[G.gid]; if(!V || !V.pickables) return null;
  const r = G.field.getBoundingClientRect(), W = r.width || G.W || 360, H = r.height || G.H || 640;
  const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2((e.clientX - r.left)/W*2 - 1, -(e.clientY - r.top)/H*2 + 1), G.cam);
  const hit = rc.intersectObjects(V.pickables(), true).find(h=>h.object.visible);
  let o = hit && hit.object; while(o && o.userData.k==null && o.userData.c==null) o = o.parent;
  return o ? (o.userData.c!=null ? {c:o.userData.c} : {k:o.userData.k}) : null;
}

function t6Sky(scene, w, r){

  const m = new THREE.ShaderMaterial({side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{c0:{value:C[0]}, c1:{value:C[1]}, c2:{value:C[2]}, c3:{value:C[3]}, t:{value:0}},
    vertexShader:"varying vec3 vp; void main(){ vp = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
    fragmentShader:"uniform vec3 c0,c1,c2,c3; uniform float t; varying vec3 vp; void main(){ float h = clamp(vp.y*0.5+0.5,0.0,1.0); h = h + 0.02*sin(t*0.3 + vp.x*3.0);"+
      " vec3 c = h<0.45 ? mix(c3,c2,smoothstep(0.0,0.45,h)) : h<0.62 ? mix(c2,c1,smoothstep(0.45,0.62,h)) : mix(c1,c0,smoothstep(0.62,1.0,h)); gl_FragColor = vec4(c,1.0); }"});
  const d = new THREE.Mesh(new THREE.SphereGeometry(r || 80, 24, 12), m); d.renderOrder = -10; scene.add(d); scene.background = null; return d;
}

function blobTex(){ if(blobT) return blobT; const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
  if(x && x.createRadialGradient){ const g = x.createRadialGradient(32,32,2,32,32,31); g.addColorStop(0,"rgba(0,0,0,.55)"); g.addColorStop(1,"rgba(0,0,0,0)"); x.fillStyle = g; x.fillRect(0,0,64,64); }
  blobT = new THREE.CanvasTexture(c); return blobT; }
// bayang lembut palsu di bawah objek
function t6Shadow(parent, x, z, r, y){ const m = new THREE.Mesh(geo("pl1", ()=>new THREE.PlaneGeometry(1,1)), new THREE.MeshBasicMaterial({map:blobTex(), transparent:true, depthWrite:false}));
  m.rotation.x = -Math.PI/2; m.position.set(x, (y||0) + 0.02, z); m.scale.set(r*2, r*2, 1); parent.add(m); return m; }
// pulau/pentas bulat berlapis (rumput + tanah) yang lembut
function t6Island(parent, w, r, y){ const g = new THREE.Group(); g.position.y = y||0; parent.add(g);
  mk(CYL(r, r*0.96, 0.35, 28), M(hex(w.floor), {flatShading:false, roughness:.8}), 0, 0, 0, g);
  mk(CYL(r*0.96, r*0.55, 1.4, 28), M(hex(w.wall), {roughness:.9}), 0, -0.87, 0, g);
  mk(CONE(r*0.55, 1.6, 12), M(hex(w.wall), {roughness:.9}), 0, -2.35, 0, g).rotation.x = Math.PI;

async function start(opts){

  if(!SENS.calibrated && SENS.has){ calibrate(); SENS.calibrated = true; }

  G = newGame(gameId);
  gameScreen();

  let use3D = !opts.flat && hasGL() && !!V3G[gameId];
  if(use3D){
    const tok = G.tok; $("cd").innerHTML = `<span>⏳</span>`;
    const ok = await need3D();
    if(!G || G.tok!==tok) return;
    if(ok){ try{ G.q = makeQ(G.rounds[0], G.n); MODX().layout(G); V3.build(); G.view = V3; G.q = null; }catch(e){ console.error(e); V3.dispose(); use3D = false; } } else use3D = false;

}

const LB = {

  clerk:null, uid:null, me:null, failed:false, pending:null, loadP:null,
  game: load("ark6-lbgame","all"), scope: load("ark6-lbscope","all"),
  init(){

      this.clerk = c; this.failed = KafaAuth.failed; this.uid = KafaAuth.uid;
      if(this.uid) await this.fetchMe();

      return c;
    });

  api(path, body){ return KafaAuth.api(path, body); },

const dioHTML = () => "";
const DIO = {R:null, scene:null, cam:null, s:null, tok:0, t:0, grp:null, wx:null, sp:[]};
function dioEl(){ let d = $("dio"); if(!d){ d = document.createElement("div"); d.id = "dio"; d.setAttribute("aria-hidden", "true"); document.body.prepend(d); } return d; }
// latar CSS (sentiasa ada; juga sandaran tanpa WebGL): kecerunan langit dunia + emoji terapung
function dioCSS(d, w){
  const sk = w.sky; d.style.setProperty("--d1", sk[0]); d.style.setProperty("--d2", sk[Math.min(1, sk.length-1)]); d.style.setProperty("--d3", sk[sk.length-1]);
  d.style.setProperty("--da", w.acc || w.a);
  if(d.dataset.w===w.r) return; d.dataset.w = w.r;
  d.querySelectorAll(".dfl").forEach(x=>x.remove());
  const box = document.createElement("div"); box.className = "dfl";
  box.innerHTML = [...w.props, w.m, ...w.props].map((e,i)=>`<span style="left:${(i*37+11)%92}%;top:${(i*53+17)%80}%;animation-delay:-${i*1.7}s">${e}</span>`).join("");
  d.appendChild(box);
}
function dioShow(s){
  const d = dioEl(), w = WORLD[s] || WORLD.mix;
  d.hidden = false; document.body.classList.add("dio6"); dioCSS(d, w);
  if(!hasGL() || lowQ || REDUCED){ d.classList.remove("gl"); return; }
  const tok = ++DIO.tok;
  need3D().then(ok=>{
    if(!ok || tok!==DIO.tok || (G && !G.over)) return;
    try{ dioBuild(s); d.classList.add("gl"); dioLoop(tok); }catch(e){ console.warn("dio", e); d.classList.remove("gl"); }
  });
}
function dioStop(){ DIO.tok++; document.body.classList.remove("dio6"); const d = $("dio"); if(d) d.hidden = true; }
function dioBuild(s){
  const d = dioEl(), W = window.innerWidth || 390, H = window.innerHeight || 800;
  if(!DIO.R){ DIO.R = new THREE.WebGLRenderer({antialias:true, alpha:true}); DIO.R.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1)); }
  if(DIO.R.domElement.parentNode!==d) d.prepend(DIO.R.domElement);
  DIO.R.setSize(W, H);
  if(!DIO.cam) DIO.cam = new THREE.PerspectiveCamera(42, W/H, 0.1, 200);
  DIO.cam.aspect = W/H; DIO.cam.updateProjectionMatrix();
  if(DIO.s===s && DIO.scene) return;
  DIO.s = s; const w = WORLD[s] || WORLD.mix, sc = DIO.scene = new THREE.Scene();
  const sky = t6Sky(sc, w, 90); DIO.sky = sky;
  sc.add(new THREE.HemisphereLight(0xFFFFFF, hex(w.wall), 0.85));
  const sun = new THREE.DirectionalLight(0xFFE6C8, 0.9); sun.position.set(6, 10, 7); sc.add(sun);
  const g = DIO.grp = new THREE.Group(); sc.add(g);
  t6Island(g, w, 4.2, 0);
  const pal = (w.pal || [w.acc, w.a, w.c1]).map(hex);
  // bangunan/menara rendah-poli lembut mengelilingi pulau
  for(let k=0; k<7; k++){ const a = k/7*Math.PI*2 + 0.3, r = 2.6 + (k%2)*0.7, x = Math.cos(a)*r, z = Math.sin(a)*r, h = 0.6 + (k*37%5)*0.25;
    const b = mk(k%3===0 ? CYL(0.35, 0.45, h, 10) : BOX(0.7, h, 0.7), M(pal[k%pal.length], {flatShading:false, roughness:.5}), x, 0.17 + h/2, z, g);
    mk(k%3===0 ? SPH(0.36, 10, 8) : CONE(0.58, 0.55, 4), M(pal[(k+1)%pal.length], {flatShading:false, roughness:.4}), x, 0.17 + h + 0.24, z, g).rotation.y = Math.PI/4;
    t6Shadow(g, x, z, 0.75, 0.17); b.userData.ph = k; }
  // pokok bulat
  for(let k=0; k<5; k++){ const a = k/5*Math.PI*2 + 1, x = Math.cos(a)*1.5, z = Math.sin(a)*1.5;
    mk(CYL(0.07, 0.09, 0.5, 6), M(0x7A5230), x, 0.42, z, g); const tr = mk(SPH(0.32, 10, 8), M(0x4CC38A, {flatShading:false}), x, 0.8, z, g); tr.userData.sway = k; }
  // maskot + props emoji terapung
  DIO.sp = [];
  const ms = emojiSprite(w.m, 1.5); ms.position.set(0, 1.35, 0); g.add(ms); DIO.sp.push({o:ms, y:1.35, ph:0});
  w.props.forEach((e,k)=>{ const sp = emojiSprite(e, 0.9), a = k/w.props.length*Math.PI*2; sp.position.set(Math.cos(a)*3.4, 2.2 + (k%2)*0.5, Math.sin(a)*3.4); g.add(sp); DIO.sp.push({o:sp, y:sp.position.y, ph:k*1.3}); });
  const hl = halo(hex(w.acc || w.a), 6, 0.35); hl.position.set(0, 0.6, 0); g.add(hl);
  DIO.ring = mk(TOR(4.6, 0.04, Math.PI*2, 48), GLOW(hex(w.acc || w.a), 1.1), 0, 0.1, 0, g); DIO.ring.rotation.x = Math.PI/2;
  DIO.wx = makeWeather(sc, w.wx || "spark", [-9, -1, -9, 18, 9, 18]);
}
function dioLoop(tok){
  let last = 0; const raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : f=>setTimeout(()=>f(Date.now()), 33);
  const step = ts=>{
    if(tok!==DIO.tok || !DIO.R || !DIO.scene) return;
    const dt = last ? Math.min(0.05, (ts - last)/1000) : 0.016; last = ts; DIO.t += dt; const t = DIO.t;
    DIO.grp.rotation.y += dt*0.12; DIO.grp.position.y = Math.sin(t*0.6)*0.15;
    DIO.sp.forEach(p=>{ p.o.position.y = p.y + Math.sin(t*1.5 + p.ph)*0.12; });
    DIO.grp.children.forEach(o=>{ if(o.userData.sway!=null) o.rotation.z = Math.sin(t*1.3 + o.userData.sway)*0.08; });
    if(DIO.ring) DIO.ring.scale.setScalar(1 + Math.sin(t*1.2)*0.02);
    if(DIO.sky) DIO.sky.material.uniforms.t.value = t;
    stepWeather(DIO.wx, dt, t);
    DIO.cam.position.set(Math.sin(t*0.1)*0.6, 4.2, 11.5); DIO.cam.lookAt(0, 0.8, 0);
    DIO.R.render(DIO.scene, DIO.cam);
    raf(step);
  };
  raf(step);
}

// ketik → {k} (pilihan jawapan) atau {c} (petak/menara). Rata: [data-k]/[data-c]; 3D: V3G[id].pick(raycaster) atau raycast pickables()
function bd_pick(e, tgt){
  const el = tgt && tgt.closest ? tgt.closest("[data-k],[data-c]") : null;
  if(el) return el.dataset.k!=null ? {k:+el.dataset.k} : {c:+el.dataset.c};
  if(!G || G.flat || !G.cam || !G.field || typeof THREE==="undefined") return null;
  const V = V3G[G.gid]; if(!V) return null;
  const r = G.field.getBoundingClientRect(), W = r.width || G.W || 360, H = r.height || G.H || 640;
  const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2((e.clientX - r.left)/W*2 - 1, -(e.clientY - r.top)/H*2 + 1), G.cam);
  if(V.pickables){ const hit = rc.intersectObjects(V.pickables(), true).find(h=>h.object.visible);
    let o = hit && hit.object; while(o && o.userData.k==null && o.userData.c==null) o = o.parent;
    if(o) return o.userData.k!=null ? {k:o.userData.k} : {c:o.userData.c}; }
  return V.pick ? V.pick(rc) : null;
}
// ketik + seret pada medan (abai butang/soalan/HUD). onDrag(tx, ty, end) = jumlah anjakan piksel sejak tekan
function bd_field(field, onTap, onDrag){
  let p0 = null;
  field.addEventListener("pointerdown", e=>{ if(!G || (e.target.closest && e.target.closest("button,.prompt,.hud,.ctl4"))) return; p0 = {x:e.clientX, y:e.clientY, t:e.target}; });
  field.addEventListener("pointermove", e=>{ if(!p0 || !G || !playing() || !onDrag) return; onDrag(e.clientX - p0.x, e.clientY - p0.y, false); });
  field.addEventListener("pointerup", e=>{ const p = p0; p0 = null; if(!p || !G || !bd_live()) return; const tx_ = e.clientX - p.x, ty_ = e.clientY - p.y;
    if(Math.hypot(tx_, ty_) < 14){ if(onDrag) onDrag(0, 0, true, true); const r = bd_pick(e, p.t); if(r) onTap(r, e); } else if(onDrag) onDrag(tx_, ty_, true); });
  field.addEventListener("pointercancel", ()=>{ p0 = null; if(onDrag && G) onDrag(0, 0, true, true); });
}

function bd_xz(c){ return {x:(c % BD_N - (BD_N-1)/2)*BD_S, z:(Math.floor(c/BD_N) - (BD_N-1)/2)*BD_S}; }
function bd_load(s){ const a = (load("ark6-bandar", {})||{})[s]; return Array.isArray(a) ? a.filter(b=>Array.isArray(b) && b[0]>=0 && b[0]<BD_N*BD_N && BD_T[b[1]]).map(b=>({c:b[0], t:b[1], lv:clamp(b[2]|0, 1, BD_MAXLV), a:9})) : []; }
function bd_save(G){ const all = load("ark6-bandar", {}) || {}; all[G.subj] = G.bd.city.map(b=>[b.c, b.t, b.lv]); save("ark6-bandar", all); }
const bd_at = (G, c) => G.bd.city.find(b=>b.c===c);

  const ord = [...Array(BD_N*BD_N).keys()].sort((a,b)=>{ const A = bd_xz(a), B = bd_xz(b); return (A.x*A.x + A.z*A.z) - (B.x*B.x + B.z*B.z) || a - b; });
  return ord.find(c=>!bd_at(G, c)) ?? ord.filter(c=>bd_free(G, c)).sort((a,b)=>bd_at(G, a).lv - bd_at(G, b).lv)[0] ?? -1; }

  onHit(k, ok ? b : 0, ok ? "📦 "+tx("Dapat blok!","داڤت بلوک!")+(b>=20 ? " ⚡" : "") : null); }
function bd_place(G, c){
  const B = G.bd, W_ = B.wait; if(!W_ || c<0 || c>=BD_N*BD_N) return false;
  if(!bd_free(G, c)){ B.wig = {c, t:0.5}; tone([520, 390], 0.06, "square", 0.06); buzz("wall"); return false; }
  let b = bd_at(G, c); if(b){ b.lv++; b.a = 0; } else { b = {c, t:W_.t, lv:1, a:0}; B.city.push(b); }
  B.wait = null; B.last = b; G.showT = 1.3; bd_save(G);

  if(!G.flat && G.scene && V3G.bandar.place) V3G.bandar.place(b);
  return true;
}

/* ============ DAM JUARA: dam 6×6 melawan AI; jawab betul dahulu untuk bergerak (logik + kawalan + rata) ============ */
// awalan dm_. Petak s = r*6+c; baris 0 = AI (sd -1), baris 5 = pemain (sd 1).
function dm_css(id, txt){ if(document.getElementById(id)) return; const s = document.createElement("style"); s.id = id; s.textContent = txt; document.head.appendChild(s); }
function dm_reg(g, how){ if(!GM(g.id)) GAMES.push(g); try{ if(!HOW[g.id]) HOW[g.id] = how; }catch(e){} }
function dm_init(D){ D.pc = []; for(let r=0;r<6;r++) for(let c=0;c<6;c++) if((r+c)%2===1 && (r<2 || r>3)) D.pc.push({sd:r<2 ? -1 : 1, r, c, k:false, dead:false, die:0, an:null}); D.sets = (D.sets||0) + 1; D.resetT = -1; }
function dm_at(D, r, c){ return D.pc.findIndex(p=>!p.dead && p.r===r && p.c===c); }
function dm_moves(D, sd){ const out = [];
  D.pc.forEach((p,i)=>{ if(p.dead || p.sd!==sd) return;
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc])=>{ if(!p.k && dr!==-sd) return; const r1 = p.r+dr, c1 = p.c+dc; if(r1<0 || r1>5 || c1<0 || c1>5) return;
      const o = dm_at(D, r1, c1); if(o<0){ out.push({p:i, r:r1, c:c1, cap:-1}); return; }
      const r2 = r1+dr, c2 = c1+dc; if(D.pc[o].sd!==sd && r2>=0 && r2<=5 && c2>=0 && c2<=5 && dm_at(D, r2, c2)<0) out.push({p:i, r:r2, c:c2, cap:o}); }); });
  return out; }
// AI: makan dahulu (raja), jika tiada: langkah selamat rawak
function dm_choose(D, sd){ const mv = dm_moves(D, sd); if(!mv.length) return null;
  const cap = mv.filter(m=>m.cap>=0); if(cap.length){ const kc = cap.filter(m=>D.pc[m.cap].k); return pick(kc.length ? kc : cap); }
  const safe = mv.filter(m=>{ const p = D.pc[m.p], r0 = p.r, c0 = p.c; p.r = m.r; p.c = m.c; const bad = dm_moves(D, -sd).some(x=>x.cap===m.p); p.r = r0; p.c = c0; return !bad; });
  const pool = safe.length ? safe : mv, prom = pool.filter(m=>!D.pc[m.p].k && m.r===(sd>0 ? 0 : 5)); return pick(prom.length ? prom : pool); }
function dm_do(G, m){ const D = G.dm, p = D.pc[m.p], cap = m.cap>=0;
  p.an = {r0:p.r, c0:p.c, t:0, d:cap ? 0.55 : 0.4, h:cap ? 1.3 : 0.35}; p.r = m.r; p.c = m.c;
  if(cap){ const o = D.pc[m.cap]; o.dead = true; o.die = 0.001; D.cap++; noise(0.2, 900, 200, 0.2); buzz("hit"); }
  else tone([392, 523], 0.05, "triangle", 0.09);
  if(!p.k && p.r===(p.sd>0 ? 0 : 5)){ p.k = true; D.king = p.sd; tone([784, 988, 1319], 0.08, "triangle", 0.1); }
  if(G.scene && V3G.dam.moved) V3G.dam.moved(m, p);
  return p.an.d; }
function dm_count(D, sd){ return D.pc.filter(p=>!p.dead && p.sd===sd).length; }
function dm_ans(G, i){ const D = G.dm; if(!D || !playing() || D.st!=="ask") return;
  if(i!==G.q.ok){ D.st = "ai"; onHit(i, 0); UI.fx("🙈 "+tx("Salah! AI bergerak dua kali.","ساله! AI برڬرق دوا کالي."), true); return; }
  D.st = "move"; D.ansT = G.rT; D.cap = 0; D.king = 0; sfx.gem(); buzz("gem");
  if(!dm_moves(D, 1).length){ D.st = "done"; onHit(i, 0, "🛡️ "+tx("Tiada langkah, mata tetap!","تياد لڠکه، مات تتڤ!")); return; }
  UI.fx("✅ "+tx("Betul! Gerakkan buah dam.","بتول! ڬرقکن بواه دام.")); }
function dm_tapSq(G, s){ const D = G.dm; if(!D || !playing() || D.st!=="move") return; const r = Math.floor(s/6), c = s%6, i = dm_at(D, r, c);
  const mv = dm_moves(D, 1);
  if(i>=0 && D.pc[i].sd===1){ if(mv.some(m=>m.p===i)){ D.sel = i; sfx.tick(); buzz("tap"); } else { D.wob = i; D.wobT = 0.5; UI.fx("🔒 "+tx("Buah ini tersekat.","بواه اين ترسکت.")); } return; }
  const m = mv.find(x=>x.p===D.sel && x.r===r && x.c===c); if(!m) return;
  D.st = "anim"; D.animT = dm_do(G, m) + 0.1; }
function dm_ctl(G){ const D = G.dm, box = $("dmA"); if(!box || !G.q || !D) return; const ask = D.st==="ask" && G.phase==="play";
  const sig = G.ri+"|"+lang+"|"+G.q.p[0]+ask+D.hint; if(box.dataset.sig===sig) return; box.dataset.sig = sig;

  box.classList.toggle("off", !ask); }

  auto(G, i){ if(G.dm) G.dm.ap = {i, t:0, m:null}; },

const LS = {Z0:5.2, Y0:1.3, TX:2.35, TZ:-7, EL:0.45, S0:7, S1:11, GR:9.8, R:0.22, HW:0.8, HD:0.35, TOP:2.6};

function ls_vel(yaw, pow){ const s = LS.S0 + clamp(pow, 0, 1)*LS.S1, c = Math.cos(LS.EL)*s; return {x:c*Math.sin(yaw), y:Math.sin(LS.EL)*s, z:-c*Math.cos(yaw)}; }

function ls_fire(G, yaw, pow, assist){
  const L = G.ls; if(!L || L.pj || !playing() || L.cool > 0) return false;
  L.aim.yaw = yaw; L.aim.pow = pow; L.pull = 0; L.snap = 0.25; const v = ls_vel(yaw, pow);
  L.pj = {x:0, y:LS.Y0, z:LS.Z0, vx:v.x, vy:v.y, vz:v.z, t:0}; L.assist = !!assist;

}
function ls_blocks(T){ return LS_BL.map(([x,y,w,h,d],n)=>({hx:x, hy:y, w, h, d, x:T.x + x, y, z:T.z, vx:0, vy:0, vz:0, rx:0, rz:0, wx:0, wz:0, dyn:false, dl:0, n})); }

      const hn = M.hint && i===G.q.ok && G.phase==="play"; P.glow.material.opacity = d.st==="ready" ? 0.35 + 0.25*Math.sin(t*8) + (hn ? 0.3 : 0) : hn ? 0.4 : 0;
      P.st.forEach((s,k)=>{ const u = (t*0.7 + k*0.5 + i*0.3) % 1; s.position.y = 0.5 + u*1.3; s.material.opacity = (d.st==="cook" ? 0.15 : 0.35)*(1 - u)*(1 + d.c); s.scale.setScalar(0.5 + u*0.9); });
      // kedudukan: hidang (lengkung ke kaunter) / di kaunter / kembali ke dapur
      const tgt = new THREE.Vector3(V.DESK[0] + leave*leave*8, V.DESK[1], V.DESK[2]);
      if(M.srv && M.srv.i===i){ const k = ease.inout(Math.min(1, M.srv.t/MSK.SERVE)); P.g.position.lerpVectors(P.p, tgt, k); P.g.position.y += Math.sin(k*Math.PI)*1.2; P.g.rotation.y = k*Math.PI*2; }
      else if(d.st==="done"){ P.g.position.copy(tgt); P.g.rotation.y = 0; }
      else { P.g.position.lerp(P.p, Math.min(1, dt*7)); P.g.rotation.y = 0; if(d.st==="cook") P.g.position.y = P.p.y + Math.abs(Math.sin(t*14 + i))*0.02; }
      P.g.rotation.z = d.wob>0 ? Math.sin(t*40)*0.25*d.wob : 0;
      P.lb.position.set(P.g.position.x, P.g.position.y + 0.75, P.g.position.z);
      P.lb.visible = d.st!=="done" || G.phase!=="show";
      P.lb.material.opacity = G.phase==="show" && i!==G.q.ok ? 0.35 : d.st==="ready" || d.st==="serve" ? 1 : 0.8; });
    // kamera bernafas perlahan
    const c = G.cam.position; const C = V.CAM.p; c.x += (Math.sin(t*0.35)*0.3 - c.x)*Math.min(1, dt*2); c.y += (C[1] - c.y)*Math.min(1, dt*2); c.z += (C[2] - c.z)*Math.min(1, dt*2);
    G.cam.lookAt(V.look);
  }
};

/* ============ PERISTIWA ============ */
function redraw(){
  if(screen==="map") renderMap();
  else if(screen==="world") openWorld(subj);
  else if(screen==="intro") openGame(gameId);
  else if(screen==="result" && G) UI.result(false);
  else if(screen==="play" && G){ UI.prompt(false); UI.hud(true); if(G.rw || (G.res && G.phase==="show" && !G.res.ok)) UI.hint(G.q.opts[G.q.ok]); }
}
const live = () => G && !G.over && !G.paused;
function setLang(l){ lang = l; save("kafa-lang", lang); applyLang(); texCache.clear(); redraw(); }
function pull(on){ if(G && MOD[G.gid] && MOD[G.gid].pull) MOD[G.gid].pull(G, on); }   // Space/Enter: busur (panah) atau tembak (permainan tambahan)
function handle(b, ev){
  const a = b.dataset.act;
  switch(a){
    case "lang": setLang(isJ() ? "rumi" : "jawi"); break;
    case "mute": muted = !muted; save("ark6-muted", muted); if(muted) S3.humOff(); b.textContent = muted ? "🔇" : "🔊"; break;
    case "voice": voiceOn = !voiceOn; save("t6-voice", voiceOn); if(!voiceOn) hush(); b.textContent = voiceOn ? "🗣️" : "🤐"; b.setAttribute("aria-pressed", voiceOn); break;
    case "home": renderMap(); break;
    case "world": if(screen==="map" && worldLocked(b.dataset.s) && ACC() && ACC().sheet){ ACC().sheet(AY, {msg:lockMsg()}); break; } openWorld(b.dataset.s || subj); break;
    case "game": openGame(b.dataset.g); break;
    case "ctl": ctlMode = b.dataset.m; save("ark6-ctl", ctlMode); if(ctlMode==="tilt") askMotion(); openGame(gameId); break;
    case "music": musicOn = !musicOn; save("ark6-music", musicOn); openGame(gameId); break;
    case "vib": vibOn = !vibOn; save("ark6-vib", vibOn); if(vibOn) buzz("hit"); openGame(gameId); break;
    case "lowq": lowQ = !lowQ; save("ark6-lowq", lowQ); openGame(gameId); break;
    case "calib": askMotion().then(()=>{ calibrate(); SENS.calibrated = true; buzz("tap"); toast("🎯 "+tx("Tengah ditetapkan!","تڠه دتتڤکن!")); }); break;
    case "recal": calibrate(); buzz("tap"); togglePause(false); break;
    case "start": askMotion().then(()=>start()); AC(); break;   // iOS: minta kebenaran gerak + buka audio daripada ketikan
    case "again": start(); break;
    case "pause": togglePause(); break;
    case "resume": togglePause(false); break;
    case "say": if(G && G.q) speak(G.q.p[0], true); if(G && G.q && itKind(G.q.opts[G.q.ok])==="h" && (G.res || G.rw)) sayHuruf(G.q.opts[G.q.ok].huruf); break;
    case "pw": if(live() && ev==="down") pull(true); break;
    case "login": if(!LB.clerk) KafaAuth.loading(true, tx("Membuka log masuk","ممبوک لوڬ ماسوق"), WORLD[subj||"mix"].m);
      LB.init().then(()=>{ KafaAuth.loading(false); if(LB.clerk) LB.clerk.openSignIn({}); else toast("⚠️ "+tx("Log masuk tidak dapat dimuatkan.","لوڬ ماسوق تيدق داڤت دمواتکن.")); }); break;
    case "acct": acctSheet(!LB.name()); break;
    case "sheetclose": document.querySelectorAll(".sheet").forEach(s=>s.remove()); break;
    case "logout": document.querySelectorAll(".sheet").forEach(s=>s.remove()); KafaAuth.signOut(tx("Log keluar","لوڬ کلوار"), WORLD[subj||"mix"].m); break;
    case "lbscope": LB.scope = b.dataset.c; save("ark6-lbscope", LB.scope); lbPaint(); break;
    case "lbgame": LB.game = b.dataset.g; save("ark6-lbgame", LB.game); lbPaint(); break;
    case "lbview": LB.game = b.dataset.g; LB.scope = "all"; openWorld(subj); { const s = $("lbsec"); if(s && s.scrollIntoView) s.scrollIntoView({behavior:"smooth"}); } break;
    case "lbname": case "lbjoin": case "lbcreate": case "lbleave": lbAct(a, b); break;
  }
}
const FAST = ["pw","pause"];
app.addEventListener("pointerdown", e=>{ const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(FAST.includes(b.dataset.act)){ e.preventDefault(); b.dataset.pd = "1"; handle(b, "down"); } });
app.addEventListener("click", e=>{ const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(FAST.includes(b.dataset.act) && b.dataset.pd){ delete b.dataset.pd; return; }
  if(b.dataset.act==="pw"){ if(live()){ pull(true); G.draw = 0.75; pull(false); } return; }   // klik papan kekunci: tembakan sederhana
  handle(b, "click"); });
const release = ()=>pull(false);
document.addEventListener("pointerup", release); document.addEventListener("pointercancel", release);
const KMAP = {ArrowLeft:"l", a:"l", A:"l", ArrowRight:"r", d:"r", D:"r", ArrowUp:"u", w:"u", W:"u", ArrowDown:"d", s:"d", S:"d"};
let spaceDown = false;
document.addEventListener("keydown", e=>{
  if(e.target.matches && e.target.matches("input:not([type=range])")){ if(e.key==="Enter" && e.target.matches(".sheet input")){ const b = e.target.parentElement.querySelector("button"); if(b) b.click(); } return; }
  if(!G || screen!=="play") return;
  const k = e.key;
  if(k==="p" || k==="P" || k==="Escape"){ togglePause(); e.preventDefault(); return; }
  if(KMAP[k]){ KEYS[KMAP[k]] = true; e.preventDefault(); return; }
  if((k===" " || k==="Enter") && live()){ e.preventDefault(); if(!spaceDown){ spaceDown = true; pull(true); } }
});
document.addEventListener("keyup", e=>{ if(KMAP[e.key]) KEYS[KMAP[e.key]] = false; if((e.key===" " || e.key==="Enter") && spaceDown){ spaceDown = false; release(); } });
window.addEventListener("blur", ()=>{ for(const k in KEYS) KEYS[k] = false; });
document.addEventListener("kafa-access", ()=>{ if(screen==="world") openWorld(subj); else if(screen==="map") renderMap(); });
window.addEventListener("popstate", ()=>{ if(screen!=="map") renderMap(); });

applyLang();
// permainan yang belum dibina (tiada MOD[id]) dibuang; id berganda (GAMES.push oleh pemalam) dibuang
for(let i=GAMES.length-1;i>=0;i--){ const id = GAMES[i].id; if(!MOD[id] || GAMES.findIndex(g=>g.id===id)!==i) GAMES.splice(i,1); }
if(!GAMES.length) GAMES.push({id:"asas", e:"✅", r:"Kuiz Pantas", j:"کويز ڤنتس", d:["Pilih jawapan betul!","ڤيليه جواڤن بتول!"]}), MOD.asas = MOD_NONE;
// ?shot=<subj>,<game>[,rumi|jawi]: buka terus, mula dan main sendiri (autopilot, kebanyakannya betul)
const SHOT = (()=>{ try{ return new URLSearchParams(location.search).get("shot"); }catch(e){ return null; } })();
function shot(spec){
  const [s, g, l] = String(spec).split(",");
  if(l==="rumi" || l==="jawi"){ lang = l; applyLang(); }
  openWorld(WORLD[s] ? s : "mix"); openGame(GM(g) ? g : GAMES[0].id);
  return Promise.resolve(start()).then(()=>{ if(G) G.auto = true; return G; });
}
window.shot = shot;
(()=>{ if(SHOT){ shot(SHOT); return; } const h = location.hash.replace("#",""); if(WORLD[h]) openWorld(h); else if(h==="papan" && subj) openWorld(subj); else renderMap(); })();

</script>
