<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Gua Kristal Iman • Tauhid Tahun 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fugaz+One&family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tauhid Tahun 6: "Gua Kristal Iman" — turun ke dalam gua kristal, laluan tanglung, tasik bawah tanah; Lunar si keluang ===== */
:root{
  --rock1:#1A1033; --rock2:#2E1F57; --rock3:#4B2F7A; --bg:#EFEAFB; --card:#FFFFFF; --ink:#1E1638; --muted:#5D5480; --line:#1E1638;
  --cy:#2FD3E0; --cy2:#0E8C9C; --mg:#E05BD1; --mg2:#9B2C93; --amb:#FFB547; --amb2:#D9821A; --lake:#1F6FB5; --lake2:#123F73;
  --ok:#14966A; --okbg:#D9F7EA; --bad:#D2384E; --badbg:#FFE0E6; --note:#FFF2D6; --chip:#ECE6FF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#140C28; --card:#221A3E; --ink:#F2EEFF; --muted:#B8AEDB; --line:#0A0618; --chip:#2F2552; --note:#3A2F1E;
    --okbg:#123A2E; --badbg:#47182A; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito",system-ui,sans-serif;font-weight:700;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 12% 8%,rgba(47,211,224,.12),transparent 40%),radial-gradient(circle at 90% 30%,rgba(224,91,209,.10),transparent 40%);
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Nunito",serif}
#app{max-width:520px;margin:0 auto;padding:10px 14px 40px}
h1,h2,h3{font-family:"Fugaz One","Nunito",sans-serif;font-weight:400;margin:0;line-height:1.2}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"Noto Naskh Arabic",serif;font-weight:700;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;direction:rtl;unicode-bidi:isolate}
small.tr{font-size:.78em;color:var(--muted);font-weight:800}
/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;padding:0 12px;border-radius:14px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--amb);color:#2A1600;border:3px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900}
/* hero */
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(160deg,var(--rock2),var(--rock1));color:#fff;border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -10px -18px auto;width:90px;height:60px;background:conic-gradient(from 200deg,transparent,rgba(47,211,224,.35),transparent 30%);filter:blur(2px)}
.hero .lunar{width:96px;height:96px;flex:0 0 96px}
.hero h1{font-size:28px;color:#BFF6FB;text-shadow:0 2px 0 #000}
.hero p{margin:4px 0 0;font-size:15px;line-height:1.45;color:#E9E2FF}
.sttl{margin:14px 0 6px;font-weight:900;color:var(--muted)}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.stickers span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--chip);border:2px dashed var(--muted);filter:grayscale(1);opacity:.45}
.stickers span.got{filter:none;opacity:1;border:2px solid var(--line);background:linear-gradient(135deg,#C8FAFF,#F7D1F2)}
/* ===== peta gua (turun) ===== */
.cave{position:relative;margin-top:16px;padding:0 0 10px;border-radius:26px;border:3px solid var(--line);overflow:hidden;
  background:linear-gradient(180deg,#9BD8F0 0,#9BD8F0 70px,#3D2A6E 120px,#2A1B52 45%,#1C1240 80%,#123F73 100%)}
.mouth{position:relative;height:120px}
.mouth svg{position:absolute;inset:0;width:100%;height:100%}
.mouth span{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fff;color:#1E1638;border:3px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:900;white-space:nowrap;font-size:14px}
.path{position:absolute;left:50%;top:110px;bottom:120px;width:6px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,rgba(255,181,71,.9) 0 10px,transparent 10px 22px);border-radius:3px}
.crow{position:relative;display:flex;padding:8px 14px;z-index:1}
.crow.r{justify-content:flex-end}
.chamber{position:relative;width:62%;min-height:96px;border:3px solid var(--line);border-radius:24px 24px 24px 8px;background:linear-gradient(145deg,var(--c),#2A1B52);color:#fff;text-align:start;padding:10px 10px 10px 74px;box-shadow:0 5px 0 var(--line),0 0 22px color-mix(in srgb,var(--c) 55%,transparent)}
.crow.r .chamber{border-radius:24px 24px 8px 24px}
html[dir="rtl"] .chamber{padding:10px 74px 10px 10px}
.chamber .gem{position:absolute;inset-inline-start:8px;top:10px;width:58px;height:70px}
.chamber .ico{position:absolute;inset-inline-start:22px;top:28px;font-size:26px}
.chamber .no{position:absolute;top:-12px;inset-inline-end:-8px;width:30px;height:30px;border-radius:50%;background:var(--amb);color:#2A1600;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;font-family:"Nunito",sans-serif}
.chamber .nm{display:block;font-weight:900;font-size:16px;line-height:1.3}
.chamber .st{display:block;font-size:14px;margin-top:4px;min-height:18px}
.chamber.lock{background:linear-gradient(145deg,#6B6489,#3A3354);box-shadow:0 5px 0 var(--line);color:#DDD8F0}
.chamber.now{outline:4px solid var(--amb);outline-offset:3px}
.chamber .lunar{position:absolute;width:62px;height:62px;top:-34px;inset-inline-end:26px}
.lakebox{position:relative;margin-top:14px;padding:16px 12px 18px;text-align:center}
.lakebox::before{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 18px,transparent 18px 40px),linear-gradient(180deg,#2E8FD6,var(--lake2));border-top:3px solid rgba(255,255,255,.35)}
.finalbtn{position:relative;z-index:1;width:84%;border:3px solid var(--line);border-radius:28px;background:linear-gradient(135deg,#2FD3E0,#E05BD1);color:#fff;padding:12px;box-shadow:0 6px 0 var(--line),0 0 30px rgba(47,211,224,.6);font-weight:900}
.finalbtn.lock{background:linear-gradient(135deg,#6B6489,#3A3354);box-shadow:0 6px 0 var(--line)}
.finalbtn.now{outline:4px solid var(--amb);outline-offset:3px}
.finalbtn svg{width:110px;height:76px;display:block;margin:0 auto}
.finalbtn .nm{display:block;font-size:18px}
.finalbtn .lunar{width:58px;height:58px;position:absolute;top:-30px;inset-inline-start:10px}
</style>
<style>
/* ===== stesen, kad bacaan ===== */
.shead{display:flex;gap:10px;align-items:center;margin:4px 0 12px}
.shead .bub{width:52px;height:52px;flex:0 0 52px;border-radius:16px;border:3px solid var(--line);background:linear-gradient(145deg,var(--c),#2A1B52);display:grid;place-items:center;font-size:26px}
.shead h2{font-size:21px}
.shead small{color:var(--muted);font-weight:800}
.rh{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--line);position:relative}
.rh .pic{font-size:44px;text-align:center}
.rh h3{font-size:20px;color:var(--mg2);margin:4px 0 8px;text-align:center}
@media (prefers-color-scheme: dark){.rh h3{color:#F7A6EE}}
.rh p{font-size:17px;line-height:1.6;margin:8px 0}
html[dir="rtl"] .rh p, html[dir="rtl"] .rh li{font-size:19px;line-height:1.9}
.rh ul{margin:6px 0;padding-inline-start:22px}
.rh li{font-size:16px;line-height:1.55;margin:4px 0}
.ref{display:inline-block;background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:900}
.ayah{background:linear-gradient(135deg,rgba(47,211,224,.16),rgba(224,91,209,.12));border:2px solid var(--cy2);border-radius:16px;padding:10px;margin:10px 0;text-align:center}
.ayah .ar{font-size:24px;line-height:2.1;display:block}
.mk{font-size:15px;color:var(--muted);font-style:italic;margin-top:4px}
.src{font-size:13px;font-weight:900;color:var(--cy2)}
.tip{background:var(--note);border:2px dashed var(--amb2);border-radius:14px;padding:8px 10px;margin-top:10px;font-size:15px}
.nmlist{display:grid;gap:6px;margin:8px 0}
.nmlist div{display:flex;gap:8px;align-items:center;background:var(--chip);border-radius:12px;padding:6px 10px}
.nmlist .ar{font-size:22px;min-width:40%;text-align:center}
.nmlist span:last-child{font-size:15px}
.rnav{display:flex;gap:10px;margin-top:14px;align-items:center}
.rnav .dots{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.btn{min-height:52px;border:3px solid var(--line);border-radius:16px;background:var(--amb);color:#2A1600;font-weight:900;font-size:17px;padding:8px 16px;box-shadow:0 5px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.cy{background:var(--cy);color:#05282D}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn:disabled{opacity:.5}
.say{border:2px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:18px;vertical-align:middle}
/* ===== main ===== */
.prog{display:flex;gap:4px;margin:0 0 10px}
.prog i{flex:1;height:10px;border-radius:5px;background:var(--chip);border:2px solid var(--line)}
.prog i.d{background:var(--cy)}
.prog i.c{background:var(--amb)}
.gcard{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--line)}
.gtag{display:inline-flex;gap:6px;align-items:center;background:var(--rock2);color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:900}
.gq{font-size:18px;line-height:1.5;margin:8px 0 10px;font-weight:800}
html[dir="rtl"] .gq{font-size:20px;line-height:1.9}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 8px}
.cnt{text-align:center;font-weight:900;color:var(--muted);margin-top:8px}
.tile{border:3px solid var(--line);border-radius:14px;background:var(--card);padding:10px;min-height:52px;font-weight:800;font-size:16px;line-height:1.35;min-width:0;overflow-wrap:anywhere;box-shadow:0 4px 0 var(--line)}
html[dir="rtl"] .tile{font-size:18px}
.tile:active{transform:translateY(2px)}
.tile.bad,.bad{animation:shake .4s;background:var(--badbg)!important}
.tile.done,.tile.used{background:var(--okbg);opacity:.85}
.tile.sel{outline:4px solid var(--amb);outline-offset:1px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.col1{display:grid;gap:10px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px var(--cy))}50%{filter:drop-shadow(0 0 10px var(--cy))}}
.bob{animation:bob 2.4s ease-in-out infinite}
/* kristal */
.crys{position:relative;border:3px solid var(--line);border-radius:18px 18px 6px 6px;background:linear-gradient(160deg,#DDFBFF,#B6EEF5 45%,#F3C8EE);color:#1E1638;padding:12px 8px 10px;min-height:76px;font-weight:900;font-size:16px;clip-path:polygon(12% 0,88% 0,100% 18%,100% 100%,0 100%,0 18%);min-width:0;overflow-wrap:anywhere}
html[dir="rtl"] .crys{font-size:18px}
.crys.on{background:linear-gradient(160deg,#7FF3FF,#2FD3E0 50%,#E05BD1);animation:glow 1s 2}
/* stalaktit */
.drip{position:relative;min-height:110px;background:linear-gradient(180deg,#4B2F7A,#2A1B52);color:#fff;border:3px solid var(--line);border-radius:18px;padding:16px 14px 12px;text-align:center;font-size:18px;line-height:1.5}
html[dir="rtl"] .drip{font-size:20px;line-height:1.9}
.drip::before{content:"";position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:44px;height:18px;background:#1A1033;clip-path:polygon(0 0,100% 0,50% 100%)}
.drip.fall{animation:pop .35s}
.bsrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.bs{min-height:64px;border:3px solid var(--line);border-radius:30px 30px 10px 10px;font-weight:900;font-size:18px;box-shadow:0 4px 0 var(--line)}
.bs.y{background:#BDF5D9;color:#0B4A33}.bs.n{background:#FFD0DA;color:#6B1225}
/* suluh */
.rocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rock{border:3px solid var(--line);border-radius:22px 14px 26px 12px;background:#5C5378;color:#EDE8FF;padding:10px;min-height:64px;font-weight:800;font-size:15px;min-width:0;overflow-wrap:anywhere;transition:background .2s}
html[dir="rtl"] .rock{font-size:17px}
.rock.lit{background:radial-gradient(circle at 30% 20%,#FFF1C2,#FFB547);color:#2A1600;box-shadow:0 0 18px rgba(255,181,71,.8)}
.rock.bad{color:#6B1225}
/* tasik */
.floater{background:var(--note);border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;font-weight:900;font-size:17px;min-height:64px;display:grid;place-items:center}
html[dir="rtl"] .floater{font-size:19px}
.boats{display:grid;gap:10px;margin-top:12px}
.boats.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.boats.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.boat{border:3px solid var(--line);border-radius:10px 10px 40px 40px;background:linear-gradient(180deg,#FFD08A,#D9821A);color:#2A1600;min-height:78px;padding:8px 6px;font-weight:900;font-size:14px;min-width:0;overflow-wrap:anywhere;box-shadow:0 6px 0 var(--lake2)}
html[dir="rtl"] .boat{font-size:16px}
.boat b{display:block;font-size:13px;opacity:.75}
.water{height:12px;margin-top:-4px;border-radius:0 0 12px 12px;background:repeating-linear-gradient(90deg,#2E8FD6 0 14px,#1F6FB5 14px 28px)}
</style>
<style>
/* fosil */
.slab{background:repeating-linear-gradient(135deg,#C9A97A 0 12px,#BF9D6C 12px 24px);border:3px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.fw{border:3px dashed #6B4E2A;border-radius:12px;background:#E8D3AE;color:#2A1A08;padding:6px 10px;min-height:52px;font-size:24px}
.fw.done{background:#FFF1C2;border-style:solid;border-color:var(--ok);box-shadow:0 0 14px rgba(255,181,71,.9)}
.fname{text-align:center;margin:6px 0 10px}
.fname b{display:inline-block;background:var(--rock2);color:#fff;border-radius:12px;padding:4px 12px;font-size:16px}
/* lombong */
.mine{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mine .colh{text-align:center;font-size:13px;color:var(--muted);font-weight:900}
.cart{border:3px solid var(--line);border-radius:8px 8px 18px 18px;background:linear-gradient(180deg,#8C93A6,#555B6E);color:#fff;min-height:58px;padding:6px;width:100%;margin-bottom:8px;box-shadow:0 4px 0 var(--line)}
.cart .ar{font-size:21px}
.ore{border:3px solid var(--line);border-radius:16px 6px 16px 6px;background:linear-gradient(135deg,#FFE7A8,#F7C1EC);color:#1E1638;min-height:58px;padding:6px 8px;width:100%;margin-bottom:8px;font-size:14px;font-weight:800;min-width:0;overflow-wrap:anywhere;box-shadow:0 4px 0 var(--line)}
html[dir="rtl"] .ore{font-size:16px}
.cart.sel{outline:4px solid var(--amb);outline-offset:1px}
.cart.done,.ore.done{background:var(--okbg);color:var(--ink);opacity:.8}
/* geode */
.blank{display:inline-block;min-width:80px;border-bottom:4px dotted var(--mg);color:var(--mg2);padding:0 4px}
.geos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.geo{border:3px solid var(--line);border-radius:46% 54% 50% 50%/55% 50% 50% 45%;background:radial-gradient(circle at 50% 55%,#8C7A6B 0 30%,#6C5A4B 60%,#4E4036);color:#FFF6E6;min-height:76px;padding:10px;font-weight:900;font-size:15px;min-width:0;overflow-wrap:anywhere}
html[dir="rtl"] .geo{font-size:17px}
.geo.open{background:radial-gradient(circle at 50% 55%,#FFFFFF 0 18%,#9BF3FF 30%,#E05BD1 60%,#5B2F7A);color:#1E1638}
/* terowong */
.tunnel{min-height:64px;border:3px solid var(--line);border-radius:40px 40px 12px 12px;background:linear-gradient(180deg,#120A24,#2E1F57);padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-bottom:12px}
.tunnel span{background:#FFE7A8;color:#2A1600;border-radius:10px;padding:4px 8px;font-weight:900;animation:pop .3s}
.tunnel .ar{font-size:22px}
.tunnel.ard{direction:rtl}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pool .ar{font-size:22px}
/* kelawar */
.bats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bat{position:relative;border:3px solid var(--line);border-radius:50% 50% 18px 18px/38% 38% 18px 18px;background:linear-gradient(180deg,#3B2A63,#251845);color:#fff;padding:22px 8px 10px;min-height:84px;font-weight:800;font-size:15px;min-width:0;overflow-wrap:anywhere}
html[dir="rtl"] .bat{font-size:17px}
.bat::before{content:"🦇";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:24px}
.bat.gone{opacity:.2;transform:translateY(-20px);transition:all .4s}
.bat .ar{font-size:21px}
/* maklum balas & keputusan */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:4px solid var(--line);border-radius:24px 24px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.35);max-width:520px;margin:0 auto}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .lunar{width:64px;height:64px;flex:0 0 64px}
.fb strong{font-family:"Fugaz One",sans-serif;font-weight:400;font-size:22px;color:var(--ok)}
html[dir="rtl"] .fb strong{font-family:"Noto Naskh Arabic",serif;font-weight:700}
.fb p{margin:2px 0 0;font-size:16px}
.fb .btn{width:100%}
.res{text-align:center}
.res .lunar{width:120px;height:120px}
.stars{font-size:46px;letter-spacing:6px}
.stars span{display:inline-block;animation:pop .5s both}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
.stars .off{filter:grayscale(1);opacity:.3}
.res h2{font-size:26px;color:var(--mg2);margin:6px 0}
@media (prefers-color-scheme: dark){.res h2{color:#F7A6EE}}
.gotst{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border:2px dashed var(--line);border-radius:16px;padding:8px;margin:10px 0;font-weight:800}
.gotst span{font-size:38px}
.resbtns{display:grid;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:10px 16px;z-index:60;font-weight:800;max-width:90vw;text-align:center}

STATIONS.push({ id:3, icon:"🪄", c:"#E0559B", sticker:"🌕", t:["Gua Mukjizat","ڬوا معجزة"], u:["Pengertian, tujuan dan bahagian mukjizat • ms. 17–25","ڤڠرتين، توجوان دان بهاڬين معجزة • م.س. 17–25"],
  read:[
    { pic:"🪄", h:["Apakah mukjizat?","اڤاكه معجزة؟"], p:"18",
      text:["Mukjizat ialah perkara luar biasa yang dilakukan oleh Allah melalui para rasul untuk membuktikan kebenaran kerasulan dan risalahnya.","معجزة اياله ڤركارا لوار بياسا يڠ دلاكوكن اوليه الله ملالوٴي ڤارا رسول اونتوق ممبوقتيكن كبنرن كرسولن دان رسالهڽ."],
      list:[["Mukjizat tidak boleh dipelajari dengan sebarang usaha.","معجزة تيدق بوليه دڤلاجري دڠن سبارڠ اوساه."],["Para rasul dikurniakan mukjizat mengikut keperluan dan keadaan semasa mereka.","ڤارا رسول دكورنياكن معجزة مڠيكوت كڤرلوان دان كاداٴن سماس مريك."]],
      ar:AR.baqarah23, mk:["“Dan kalau kamu ada menaruh syak tentang apa yang Kami turunkan kepada hamba Kami (Muhammad), maka datangkanlah satu surah yang sebanding dengannya, ...”","“دان كالاو كامو اد مناروه شق تنتڠ اڤ يڠ كامي تورونكن كڤد همبا كامي (محمد)، مک داتڠكنله ساتو سورة يڠ سباندڠ دڠنڽ، ...”"], src:["Surah Al-Baqarah: 23","سورة البقرة: 23"] },
    { pic:"🎯", h:["Tujuan mukjizat","توجوان معجزة"], p:"20",

      ar:AR.syuara45, mk:["“Kemudian Nabi Musa mencampakkan tongkatnya, tiba-tiba ia menelan segala benda palsu yang mereka adakan. Maka ahli-ahli sihir itu segera sujud, sambil berkata: Kami beriman kepada Tuhan sekalian alam.”","“كمودين نبي موسى منچمڤقكن توڠكتڽ، تيبا٢ اي منلن سڬالا بندا ڤالسو يڠ مريك اداكن. مک اهلي٢ سيحير ايت سڬرا سجود، سمبيل بركات: كامي برايمان كڤد توهن سكالين عالم.”"], src:["Surah Asy-Syu'ara': 45–47","سورة الشعراء: 45–47"] },

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:    () => tone([[659,.1],[988,.22]]),
  tick:  () => tone([[1175,.06,"triangle"]]),
  no:    () => tone([[208,.18,"square"],[156,.22,"square"]]),
  chime: () => tone([[1568,.06],[2093,.06],[2637,.12]]),          // kristal berdenting
  drip:  () => tone([[1400,.04],[700,.12,"triangle"]]),           // titisan air
  crack: () => tone([[180,.05,"sawtooth"],[90,.1,"sawtooth"],[1760,.12]]),
  win:   () => tone([[523,.14],[659,.14],[784,.14],[1046,.34]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const cleanSpeech = s => s.replace(/<[^>]+>/g," ").replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g," ").replace(/___/g," ... ").replace(/[“”…]/g," ").replace(/\s+/g," ").trim();
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanSpeech(text));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .97; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

    ${r.list?`<ul>${r.list.map(x=>`<li>${T(x)}</li>`).join("")}</ul>`:""}
    ${r.names?`<div class="nmlist">${r.names.map(id=>`<div><span class="ar" lang="ar">${NM[id][0]}</span><span>${isJ()?"":`<b>${NM[id][1]}</b><br>`}${T(nmMean(id))}</span></div>`).join("")}</div>`:""}
    ${r.ar?`<div class="ayah"><span class="ar" lang="ar">${r.ar}</span>${r.mk?`<div class="mk">${T(r.mk)}</div>`:""}${r.src?`<div class="src">${T(r.src)}</div>`:""}</div>`:""}
    ${r.tip?`<div class="tip">💡 ${T(r.tip)}</div>`:""}
    <div class="rnav"><button class="btn alt" data-act="rprev" ${S.ri?"":"disabled"} aria-label="${L("Sebelum","سبلوم")}">${BACK()}</button>
      <span class="dots">${S.ri+1} / ${n}</span>
      <button class="btn ${S.ri===n-1?"cy":""}" data-act="rnext">${S.ri===n-1?L("Mula main ⛏️","مولا ماٴين ⛏️"):L("Seterusnya","ستروسڽ")+" "+(isJ()?"←":"→")}</button></div>
  </article>`;
  window.scrollTo(0,0);
}

/* ===================== MAIN ===================== */
const GT = {
  kristal:  { e:"💎", n:["Kristal Bercahaya","كريستل برچهاي"] },
  stalaktit:{ e:"💧", n:["Titisan Stalaktit","تيتيسن ستالقتيت"] },
  suluh:    { e:"🔦", n:["Suluh Batu","سولوه باتو"] },
  tasik:    { e:"🛶", n:["Perahu Tasik","ڤراهو تاسيق"] },
  fosil:    { e:"🦴", n:["Gali Fosil","ڬالي فوسيل"] },
  lombong:  { e:"🛤️", n:["Kereta Lombong","كريتا لومبوڠ"] },
  geode:    { e:"🪨", n:["Pecah Geod","ڤچه ڬيود"] },
  terowong: { e:"⛏️", n:["Gali Terowong","ڬالي تروووڠ"] },
  kelawar:  { e:"🦇", n:["Keluang Tersesat","كلواڠ ترسست"] }
};
function renderPlay(){
  clearTimers(); hush(); document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.phase = "play"; S.res = null;
  const g = S.games[S.gi], gt = GT[g.type];
  const prog = S.games.map((_,i)=>`<i class="${i<S.gi?"d":i===S.gi?"c":""}"></i>`).join("");
  app.innerHTML = head() + `<div class="prog" aria-label="${S.gi+1} / ${S.games.length}">${prog}</div>
    <section class="gcard"><span class="gtag">${gt.e} ${T(gt.n)} • ${S.gi+1}/${S.games.length}</span>
    <p class="gq">${T(g.q)} ${sayBtn(RU(g.q))}</p><div id="play"></div></section>`;
  GAMES[g.type](document.getElementById("play"), g);
  if(voiceOn) speak(RU(g.q));
}
function oops(el, msg){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad"); setTimeout(()=>el.classList.remove("bad"), 450); }
  toast(msg);
}
const PRAISE = [["Hebat!","هيبت!"],["Cemerlang!","چمرلڠ!"],["Bersinar!","برسينر!"],["Tepat sekali!","تڤت سكالي!"],["Syabas!","شاباس!"]];
function win(note){
  if(!S || document.querySelector(".fb")) return;
  sfx.ok();
  const p = PRAISE[S.gi % PRAISE.length], last = S.gi === S.games.length-1;
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog");
  fb.innerHTML = `<div class="row1">${lunar()}<div><strong>${T(p)}</strong>${note?`<p>${T(note)}</p>`:`<p>${L("Kristal ini kini bercahaya. 💎","كريستل اين كيني برچهاي. 💎")}</p>`}</div></div>
    <button class="btn cy" data-act="next">${last?L("Lihat keputusan 🏁","ليهت كڤوتوسن 🏁"):L("Seterusnya","ستروسڽ")+" "+(isJ()?"←":"→")}</button>`;
  document.body.appendChild(fb);
  speak(RU(p) + (note ? ". " + RU(note) : ""));
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi >= S.games.length) finish(); else { renderPlay(); window.scrollTo(0,0); }
}
function finish(){
  const stars = starsFor(S.miss), id = S.st.id, prev = best[id]||0;
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.res = { stars, prev }; S.phase = "res";
  drawResult(true);
}
function drawResult(fresh){
  clearTimers(); document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars } = S.res, fin = S.st.id === "final";
  const nxt = !fin && STATIONS.find(s => s.id === S.st.id+1);
  const msg = stars===3 ? L("Ruang ini terang-benderang!","روڠ اين تراڠ-بندرڠ!") : stars===2 ? L("Bagus! Sedikit lagi untuk 3 bintang.","باڬوس! سديكيت لاڬي اونتوق 3 بينتڠ.") : L("Teruskan usaha, cuba sekali lagi!","تروسكن اوساه، چوبا سكالي لاڬي!");
  app.innerHTML = head() + `<section class="gcard res">${lunar("bob")}
    <div class="stars" aria-label="${stars} / 3">${starRow(stars)}</div>
    <h2>${fin?L("Dewan Kristal Agung ditawan!","ديوان كريستل اڬوڠ دتاون!"):msg}</h2>
    <p>${L("Salah tekan:","ساله تكن:")} ${S.miss}</p>
    <div class="gotst"><span>${S.st.sticker}</span>${L("Permata baharu untuk koleksi!","ڤرماتا بهارو اونتوق كوليكسي!")}</div>
    <div class="resbtns">${nxt?`<button class="btn cy" data-act="open" data-id="${nxt.id}">${L("Ruang seterusnya","روڠ ستروسڽ")} ${nxt.icon}</button>`:""}
      ${fin||!nxt?`<button class="btn cy" data-act="map">${L("Kembali ke peta gua","كمبالي ک ڤتا ڬوا")} 🗺️</button>`:""}
      <button class="btn alt" data-act="again">${L("Main lagi","ماٴين لاڬي")} 🔁</button>
      ${nxt?`<button class="btn alt" data-act="map">${L("Peta gua","ڤتا ڬوا")} 🗺️</button>`:""}</div></section>`;
  if(fresh){ sfx.win(); confetti(); speak(plain(msg)); window.scrollTo(0,0); }
}

/* ===================== JENIS PERMAINAN (1) ===================== */
const opt = (v) => T(v);
const GAMES = {
  /* Kristal: sentuh kristal yang betul (4 pilihan) */
  kristal(el, g){
    const order = shuffle(g.opts.map((_,i)=>i));
    el.innerHTML = `<div class="grid2">${order.map(i=>`<button class="crys" data-ok="${i===g.a?1:0}">${opt(g.opts[i])}</button>`).join("")}</div>`;
    el.querySelectorAll(".crys").forEach(b => b.addEventListener("click", () => {
      if(document.querySelector(".fb")) return;
      if(b.dataset.ok==="1"){ sfx.chime(); b.classList.add("on"); later(win, 450); }
      else oops(b, L("Kristal itu malap. Cuba lagi!","كريستل ايت مالڤ. چوبا لاڬي!"));
    }));
  },
  /* Stalaktit: titisan kenyataan jatuh satu demi satu → Benar / Salah */
  stalaktit(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="drip fall" id="dtxt" data-v="${items[k].v}">${T(items[k].s)}</div>
        <div class="bsrow"><button class="bs y" data-v="1">✅ ${L("Benar","بنر")}</button><button class="bs n" data-v="0">❌ ${L("Salah","ساله")}</button></div>
        <div class="cnt">💧 ${k} / ${items.length}</div>`;
      el.querySelectorAll(".bs").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(b.dataset.v === String(items[k].v)){ sfx.drip(); k++; if(k===items.length) later(win, 300); else draw(); }
        else oops(b, L("Fikir semula tentang kenyataan ini.","فيكير سمولا تنتڠ كڽاتاٴن اين."));
      }));
    };
    draw();
  },
  /* Suluh: nyalakan SEMUA batu yang betul, kemudian tekan Suluh! */
  suluh(el, g){
    const order = shuffle(g.items.map((_,i)=>i));
    el.innerHTML = `<p class="hint">${L("Sentuh untuk menyalakan / memadam batu, kemudian tekan Suluh!","سنتوه اونتوق مڽالاكن / ممادم باتو، كمودين تكن سولوه!")}</p>
      <div class="rocks">${order.map(i=>`<button class="rock" data-i="${i}" data-ok="${g.items[i].ok}" aria-pressed="false">${T(g.items[i].s)}</button>`).join("")}</div>
      <button class="btn cy" id="sgo" style="width:100%;margin-top:12px">🔦 ${L("Suluh!","سولوه!")}</button>`;
    el.querySelectorAll(".rock").forEach(b => b.addEventListener("click", () => { sfx.tick(); b.classList.toggle("lit"); b.setAttribute("aria-pressed", b.classList.contains("lit")); }));
    el.querySelector("#sgo").addEventListener("click", () => {
      const rocks = [...el.querySelectorAll(".rock")];
      const wrong = rocks.filter(b => b.classList.contains("lit") !== (b.dataset.ok==="1"));
      if(!wrong.length){ sfx.chime(); later(win, 300); return; }
      wrong.forEach(b => { b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"), 450); });
      const missed = wrong.filter(b => b.dataset.ok==="1").length;
      oops(null, missed ? L(`Masih ada ${missed} batu betul yang belum disuluh.`,`ماسيه اد ${missed} باتو بتول يڠ بلوم دسولوه.`) : L("Ada batu yang tidak sepatutnya disuluh.","اد باتو يڠ تيدق سڤاتوتڽ دسولوه."));
    });
  },
  /* Tasik: hantar setiap kad terapung ke perahu kategori yang betul */
  tasik(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="floater" id="ttxt" data-c="${items[k].c}">${T(items[k].s)}</div>
        <div class="boats c${g.cats.length}">${g.cats.map((c,i)=>`<button class="boat" data-c="${i}">🛶<br>${T(c)}</button>`).join("")}</div><div class="water"></div>
        <div class="cnt">🛶 ${k} / ${items.length}</div>`;
      el.querySelectorAll(".boat").forEach(b => b.addEventListener("click", () => {
        if(k>=items.length) return;
        if(+b.dataset.c === items[k].c){ sfx.drip(); k++; if(k===items.length) later(win, 300); else draw(); }
        else oops(b, L("Perahu itu bukan tempatnya. Cuba perahu lain!","ڤراهو ايت بوكن تمڤتڽ. چوبا ڤراهو لاٴين!"));
      }));
    };
    draw();
  },
  /* Fosil: sentuh perkataan ayat yang membawa nama Allah (beberapa pusingan) */
  fosil(el, g){
    let r = 0, busy = false;
    const draw = () => {
      busy = false;
      const id = g.rounds[r], f = FOS[id];
      el.innerHTML = `<div class="fname"><b>${T(nmName(id))}</b> — ${T(nmMean(id))}</div>
        <div class="slab" lang="ar">${f.w.map((w,i)=>`<button class="fw ar" data-i="${i}">${w}</button>`).join("")}</div>
        <div class="cnt">🦴 ${r} / ${g.rounds.length}</div>`;
      el.querySelectorAll(".fw").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(+b.dataset.i === f.i){ busy = true; sfx.chime(); b.classList.add("done"); r++; if(r===g.rounds.length) later(win, 400); else later(draw, 450); }
        else oops(b, L("Itu bukan perkataannya. Cari perkataan yang serupa dengan nama itu.","ايت بوكن ڤركاتاٴنڽ. چاري ڤركاتاٴن يڠ سروڤا دڠن نام ايت."));
      }));
    };
    draw();
  }
};

/* ===================== JENIS PERMAINAN (2) ===================== */
Object.assign(GAMES, {
  /* Lombong: pilih kereta lombong, kemudian bijih yang sepadan */
  lombong(el, g){
    const L1 = shuffle(g.pairs.map((_,i)=>i)), R1 = mix(g.pairs.map((_,i)=>i));
    el.innerHTML = `<div class="mine"><div><div class="colh">🛤️ ${L("Kereta","كريتا")}</div>${L1.map(i=>`<button class="cart" data-i="${i}">${T(g.pairs[i][0])}</button>`).join("")}</div>
      <div><div class="colh">💎 ${L("Bijih","بيجيه")}</div>${R1.map(i=>`<button class="ore" data-i="${i}">${T(g.pairs[i][1])}</button>`).join("")}</div></div>
      <div class="cnt" id="lcnt">🛤️ 0 / ${g.pairs.length}</div>`;
    let sel = null, n = 0;
    el.querySelectorAll(".cart").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      el.querySelectorAll(".cart").forEach(x=>x.classList.remove("sel")); sel = +b.dataset.i; b.classList.add("sel"); sfx.tick();
      speak(RU(g.pairs[sel][0]));
    }));
    el.querySelectorAll(".ore").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(sel===null){ toast(L("Pilih kereta lombong dahulu 🛤️","ڤيليه كريتا لومبوڠ دهولو 🛤️")); return; }
      const cb = el.querySelector(`.cart[data-i="${sel}"]`);
      if(+b.dataset.i===sel){
        sfx.chime(); b.classList.add("done"); cb.classList.add("done"); cb.classList.remove("sel"); sel = null; n++;
        el.querySelector("#lcnt").textContent = `🛤️ ${n} / ${g.pairs.length}`;
        if(n===g.pairs.length) later(win, 400);
      } else oops(b, L("Bijih itu bukan untuk kereta ini. Cuba lagi!","بيجيه ايت بوكن اونتوق كريتا اين. چوبا لاڬي!"));
    }));
  },
  /* Geode: pecahkan geod berisi jawapan untuk mengisi tempat kosong (pusingan) */
  geode(el, g){
    let r = 0, busy = false;
    const draw = () => {
      busy = false;
      const R = g.rounds[r], order = shuffle(R.opts.map((_,i)=>i));
      el.innerHTML = `<div class="floater" id="gsent">${T(R.s).replace("___", '<span class="blank">?</span>')}</div>
        <div class="geos" style="margin-top:12px">${order.map(i=>`<button class="geo" data-ok="${i===R.a?1:0}">${T(R.opts[i])}</button>`).join("")}</div>
        <div class="cnt">🪨 ${r} / ${g.rounds.length}</div>`;
      el.querySelectorAll(".geo").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(b.dataset.ok==="1"){
          busy = true; sfx.crack(); b.classList.add("open");
          el.querySelector(".blank").innerHTML = T(R.opts[R.a]);
          r++; if(r===g.rounds.length) later(win, 500); else later(draw, 700);
        } else oops(b, L("Geod itu kosong. Cuba yang lain!","ڬيود ايت كوسوڠ. چوبا يڠ لاٴين!"));
      }));
    };
    draw();
  },
  /* Terowong: sentuh kepingan mengikut tertib untuk menggali terowong */
  terowong(el, g){
    const ar = !!g.fos, parts = ar ? FOS[g.fos].w : g.parts, order = mix(parts.map((_,i)=>i));
    const show = i => ar ? `<span class="ar" lang="ar">${parts[i]}</span>` : T(parts[i]);
    el.innerHTML = `${ar?`<div class="fname"><b>${T(S.st.id==="final"?["Dalil","دليل"]:["Dalil al-Asma' al-Husna","دليل الأسماء الحسنى"])}</b></div>`:""}
      <div class="tunnel ${ar?"ard":""}" id="tun" aria-live="polite"></div>
      <div class="pool" ${ar?'dir="rtl"':""}>${order.map(i=>`<button class="tile tw" data-i="${i}">${show(i)}</button>`).join("")}</div>
      <div class="cnt" id="tcnt">⛏️ 0 / ${parts.length}</div>`;
    let k = 0;
    el.querySelectorAll(".tw").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=parts.length) return;
      if(+b.dataset.i===k){
        sfx.tick(); b.classList.add("used");
        el.querySelector("#tun").insertAdjacentHTML("beforeend", `<span>${show(k)}</span>`);
        k++; el.querySelector("#tcnt").textContent = `⛏️ ${k} / ${parts.length}`;
        if(k===parts.length) later(win, 450);
      } else oops(b, L("Kepingan itu bukan yang seterusnya.","كڤيڠن ايت بوكن يڠ ستروسڽ."));
    }));
  },
  /* Kelawar: sentuh keluang yang tersesat (lain daripada kumpulan) — beberapa pusingan */
  kelawar(el, g){
    let r = 0, busy = false;
    const lab = it => it.nm ? `${T(it.nm)}<br><small>${T(it.m)}</small>` : T(it);
    const draw = () => {
      busy = false;
      const R = g.rounds[r], order = shuffle(R.items.map((_,i)=>i));
      el.innerHTML = `<div class="bats">${order.map(i=>`<button class="bat" data-ok="${i===R.odd?1:0}">${lab(R.items[i])}</button>`).join("")}</div>
        <div class="cnt">🦇 ${r} / ${g.rounds.length}</div>`;
      el.querySelectorAll(".bat").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(b.dataset.ok==="1"){
          busy = true; sfx.chime(); b.classList.add("gone");
          r++;
          if(r===g.rounds.length) later(() => win(R.why), 450);
          else { toast(plain(T(R.why))); later(draw, 900); }
        } else oops(b, L("Keluang itu sekumpulan dengan yang lain. Cari yang tersesat!","كلواڠ ايت سكومڤولن دڠن يڠ لاٴين. چاري يڠ ترسست!"));
      }));
    };
    draw();
  }
});

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t6-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ clearTimers(); document.querySelectorAll(".fb").forEach(x=>x.remove()); openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Terangi ruang sebelumnya dahulu 🔒","تراڠي روڠ سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); window.scrollTo(0,0); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Terangi semua ${STATIONS.length} ruang gua untuk membuka Dewan Kristal Agung 💎`,`تراڠي سموا ${STATIONS.length} روڠ ڬوا اونتوق ممبوک ديوان كريستل اڬوڠ 💎`)); }
  else if(a==="map"){ clearTimers(); document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
