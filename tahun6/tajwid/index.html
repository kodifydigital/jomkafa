<!DOCTYPE html>
<html lang="ms" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kereta Kabel Tajwid • Tajwid Tahun 6</title>
<meta name="description" content="Tajwid Tahun 6 JOM KAFA: naik kereta kabel bersama Gogo si kambing gunung. Idgham, hukum ra, tanwin bertemu hamzah wasal, bacaan khas riwayat Hafs dan rukun bacaan al-Quran.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --sky1:#BFE3FF; --sky2:#EEF8FF; --hill:#7CC48A; --hill2:#3E8E5E; --rock:#8A97A8;
  --ink:#14213D; --soft:#4A5A75; --card:#FFFFFF; --line:#D6E2F0;
  --red:#E63946; --red2:#B5202E; --amber:#FFB703; --teal:#1F8A7E; --navy:#1D3557; --cable:#2B2F38;
  --ok:#2A9D5C; --no:#D62839; --shadow:0 6px 0 rgba(20,33,61,.18);
  --hf:"Chakra Petch","Nunito",system-ui,sans-serif; --bf:"Nunito",system-ui,sans-serif;
  --af:"Amiri","Noto Naskh Arabic",serif; --jf:"Noto Naskh Arabic","Amiri",serif;
}
@media (prefers-color-scheme: dark){
  :root{ --sky1:#0B1730; --sky2:#13284A; --hill:#1F5A44; --hill2:#123826; --rock:#47566E;
    --ink:#EAF2FF; --soft:#A9BAD6; --card:#15264A; --line:#2A3F66; --cable:#C9D3E3; --shadow:0 6px 0 rgba(0,0,0,.45); }
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ font-family:var(--bf); color:var(--ink); min-height:100vh;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky1) 100%) fixed; -webkit-tap-highlight-color:transparent; }
html[dir="rtl"] body{ font-family:var(--jf); }
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{ font-family:var(--jf); }
#app{ max-width:560px; margin:0 auto; padding:10px 14px 110px; }
button{ font:inherit; color:inherit; cursor:pointer; }
.ar{ font-family:var(--af); direction:rtl; unicode-bidi:isolate; font-size:1.35em; line-height:1.9; font-weight:400; }
h1,h2,h3{ font-family:var(--hf); font-weight:700; margin:0; }
/* bar atas */
.top{ display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:20; padding:6px 0; }
.sp{ flex:1; }
.ib{ min-width:48px; height:48px; border-radius:14px; border:3px solid var(--navy); background:var(--card); display:inline-flex; align-items:center; justify-content:center;
  font-weight:900; font-size:18px; text-decoration:none; color:var(--ink); box-shadow:var(--shadow); padding:0 10px; }
.pill{ background:var(--amber); color:#14213D; border:3px solid var(--navy); border-radius:999px; padding:8px 12px; font-weight:900; box-shadow:var(--shadow); }
/* hero */
.hero{ display:flex; gap:10px; align-items:center; background:var(--card); border:3px solid var(--navy); border-radius:22px; padding:12px; box-shadow:var(--shadow); margin:8px 0 12px; }
.hero h1{ font-size:26px; line-height:1.1; color:var(--red); letter-spacing:.3px; }
.hero p{ margin:6px 0 0; font-size:15px; line-height:1.45; color:var(--soft); }
html[dir="rtl"] .hero p{ font-size:16px; line-height:1.9; }
.gogo{ width:92px; height:auto; flex:0 0 auto; }
.sttl{ font-weight:900; margin:4px 2px 6px; }
.stickers{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.stickers span{ width:42px; height:42px; display:grid; place-items:center; font-size:24px; border-radius:12px; background:var(--card); border:2px dashed var(--line); filter:grayscale(1); opacity:.45; }
.stickers span.got{ filter:none; opacity:1; border:2px solid var(--amber); background:#FFF4D1; }
/* peta gunung */
.mount{ position:relative; border-radius:26px; border:3px solid var(--navy); overflow:hidden; padding:14px 8px 0; box-shadow:var(--shadow);
  background:
    radial-gradient(circle at 85% 6%, #FFE08A 0 28px, transparent 30px),
    linear-gradient(160deg, transparent 0 62%, rgba(255,255,255,.35) 62% 64%, transparent 64%),
    linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 30%, var(--hill) 70%, var(--hill2) 100%); }
@media (prefers-color-scheme: dark){ .mount{ background:
    radial-gradient(circle at 85% 6%, #F4F1DE 0 22px, transparent 24px),
    radial-gradient(circle at 20% 12%, #fff 0 1.5px, transparent 2px), radial-gradient(circle at 60% 20%, #fff 0 1.5px, transparent 2px),
    linear-gradient(180deg, #0B1730 0%, #13284A 35%, #1F5A44 75%, #123826 100%); } }
.cables{ position:absolute; left:0; top:0; width:100%; pointer-events:none; z-index:0; }
.cables line{ stroke:var(--cable); stroke-width:3; vector-effect:non-scaling-stroke; }
.row{ position:relative; height:132px; display:flex; z-index:1; }
.row.l{ justify-content:flex-start; } .row.r{ justify-content:flex-end; }
html[dir="rtl"] .row.l{ justify-content:flex-end; } html[dir="rtl"] .row.r{ justify-content:flex-start; }
.node{ width:52%; min-height:120px; border:0; background:none; padding:0; display:flex; flex-direction:column; align-items:center; position:relative; }
.cab{ position:relative; width:96px; height:84px; display:block; }
.cab svg{ width:100%; height:100%; }
.node.now .cab{ animation:sway 2.2s ease-in-out infinite; transform-origin:50% 0; }
@keyframes sway{ 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(4deg); } }
.num{ position:absolute; left:50%; top:40px; transform:translateX(-50%); font-family:var(--hf); font-weight:700; font-size:20px; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.4); }
.tic{ position:absolute; right:-8px; top:-4px; font-size:22px; }
.nm{ display:block; margin-top:2px; background:var(--card); border:2px solid var(--navy); border-radius:12px; padding:4px 8px; font-weight:900; font-size:13px; line-height:1.25; max-width:100%; text-align:center; position:relative; z-index:2; }
html[dir="rtl"] .nm{ font-size:14px; line-height:1.6; }
.st{ font-size:13px; min-height:16px; }
.node.lock{ filter:grayscale(.9); opacity:.7; }
.node.lock .tic::after{ content:"🔒"; position:absolute; left:-36px; top:30px; font-size:20px; }
.guide{ position:absolute; top:6px; width:52px; left:-40px; z-index:3; }
html[dir="rtl"] .guide{ left:auto; right:-40px; }
.guide .gogo{ width:52px; }
.peak{ position:relative; z-index:1; display:flex; justify-content:center; padding-bottom:6px; }
.node.final{ width:70%; }
.node.final .core{ font-size:56px; line-height:1; filter:drop-shadow(0 4px 0 rgba(0,0,0,.25)); }
.base{ position:relative; z-index:1; margin:6px -8px 0; padding:10px; background:#5B4636; color:#FFF4D1; text-align:center; font-weight:900; border-top:3px solid var(--navy); }
/* kad */
.shead{ display:flex; gap:10px; align-items:center; margin:4px 0 10px; }
.badge{ width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-size:28px; background:var(--c); border:3px solid var(--navy); flex:0 0 auto; }
.shead h2{ font-size:20px; line-height:1.2; } html[dir="rtl"] .shead h2{ line-height:1.7; }
.shead small{ color:var(--soft); font-weight:800; }
.card{ background:var(--card); border:3px solid var(--navy); border-top:10px solid var(--sc,var(--red)); border-radius:22px; padding:16px; box-shadow:var(--shadow); position:relative; }
.rpic{ font-size:46px; text-align:center; }
.rh{ font-size:21px; display:flex; align-items:center; gap:8px; justify-content:space-between; margin:4px 0 8px; }
.rtext{ font-size:17px; line-height:1.55; margin:0 0 10px; } html[dir="rtl"] .rtext{ font-size:19px; line-height:2; }
.rlist{ margin:0 0 10px; padding-inline-start:22px; font-size:16px; line-height:1.5; } html[dir="rtl"] .rlist{ font-size:18px; line-height:1.95; }
.rlist li{ margin-bottom:6px; }
.exs{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 12px; }
.exs .ar{ background:#EAF4FF; color:#14213D; border:2px solid var(--navy); border-radius:14px; padding:2px 12px; font-size:24px; }
.exs small{ display:block; font-family:var(--bf); font-size:11px; color:#4A5A75; text-align:center; line-height:1; direction:ltr; }
.tip{ display:flex; gap:8px; background:#FFF4D1; color:#14213D; border:2px solid var(--amber); border-radius:14px; padding:10px; margin:8px 0; font-size:15px; line-height:1.5; }
.tip.am{ background:#E3F7EF; border-color:var(--teal); }
html[dir="rtl"] .tip{ font-size:17px; line-height:1.9; }
.ref{ font-size:13px; color:var(--soft); font-weight:800; margin:8px 0; }
.navr{ display:flex; gap:10px; }
.btn{ flex:1; min-height:54px; border-radius:16px; border:3px solid var(--navy); background:var(--card); font-weight:900; font-size:17px; box-shadow:var(--shadow); padding:8px 12px; }
.btn.go{ background:var(--red); color:#fff; }
.btn.alt{ background:#EAF4FF; color:#14213D; }
.btn:disabled{ opacity:.4; }
.btn:active,.opt:active{ transform:translateY(3px); box-shadow:none; }
.dots{ display:flex; justify-content:center; gap:6px; margin-top:10px; }
.dots i{ width:10px; height:10px; border-radius:50%; background:var(--line); } .dots i.on{ background:var(--red); }
.say{ border:2px solid var(--navy); background:var(--amber); color:#14213D; border-radius:12px; min-width:44px; height:44px; font-size:18px; flex:0 0 auto; }
</style>
<style>
/* main */
.prog{ position:relative; height:30px; background:var(--card); border:3px solid var(--navy); border-radius:999px; margin:0 0 10px; overflow:hidden; }
.prog .fill{ position:absolute; inset:0 auto 0 0; background:repeating-linear-gradient(90deg,var(--teal) 0 14px,#26A69A 14px 28px); transition:width .4s; }
html[dir="rtl"] .prog .fill{ inset:0 0 0 auto; }
.prog b{ position:relative; display:block; text-align:center; line-height:24px; font-size:14px; font-family:var(--hf); }
.q{ display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
.q p{ margin:0 0 10px; font-size:18px; font-weight:900; line-height:1.4; } html[dir="rtl"] .q p{ font-size:19px; line-height:1.9; }
.lab{ font-weight:900; color:var(--soft); margin:6px 0; font-size:14px; }
.hint{ margin-top:12px; background:#FFE5E8; color:#7A1020; border:2px solid var(--no); border-radius:14px; padding:10px; font-weight:800; font-size:15px; line-height:1.45; }
html[dir="rtl"] .hint{ font-size:17px; line-height:1.9; }
.shake{ animation:shake .35s; } @keyframes shake{ 25%{ transform:translateX(-6px);} 75%{ transform:translateX(6px);} }
.rounds{ display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
.rounds i{ width:26px; height:10px; border-radius:6px; background:var(--line); } .rounds i.on{ background:var(--amber); } .rounds i.ok{ background:var(--ok); }
.opts{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:8px; }
.opts.one{ grid-template-columns:1fr; }
.opt{ min-width:0; overflow-wrap:anywhere; min-height:56px; border-radius:16px; border:3px solid var(--navy); background:#EAF4FF; color:#14213D; font-weight:900; font-size:16px; padding:8px 10px; box-shadow:var(--shadow); line-height:1.35; }
html[dir="rtl"] .opt{ font-size:17px; line-height:1.8; }
.opt.right,.tok.right,.pax.right{ background:#C9F2D9; border-color:var(--ok); }
.opt.wrong,.tok.wrong{ background:#FFD4DA; border-color:var(--no); opacity:.7; }
.qar{ text-align:center; font-size:30px; background:#EAF4FF; color:#14213D; border:2px dashed var(--navy); border-radius:16px; padding:4px 10px; margin:6px 0; }
/* gondola: isih */
.platform{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:10px; border-radius:16px; background:repeating-linear-gradient(45deg,#FFE9A8 0 12px,#FFF4D1 12px 24px); border:2px solid var(--amber); }
.gi{ min-width:0; max-width:100%; border:3px solid var(--navy); background:var(--red); color:#fff; border-radius:12px 12px 16px 16px; padding:6px 12px; font-weight:900; font-size:15px; position:relative; margin-top:10px; box-shadow:var(--shadow); line-height:1.35; overflow-wrap:anywhere; }
.gi::before{ content:""; position:absolute; left:50%; top:-12px; width:3px; height:10px; background:var(--cable); }
.gi .ar{ color:#fff; }
.gi.sel{ background:var(--amber); color:#14213D; outline:4px solid #fff; } .gi.sel .ar{ color:#14213D; }
.gi.gone{ display:none; }
.stns{ display:grid; gap:10px; margin-top:12px; }
.stn{ min-width:0; text-align:start; border:3px solid var(--navy); border-radius:18px; background:linear-gradient(180deg,#EAF4FF,#D3E9FF); color:#14213D; padding:8px 10px; min-height:62px; box-shadow:var(--shadow); }
.stn b{ display:block; font-size:15px; } html[dir="rtl"] .stn b{ font-size:16px; line-height:1.8; }
.stn .in{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.stn .in span{ background:#fff; border:2px solid var(--teal); border-radius:10px; padding:0 8px; font-size:14px; font-weight:800; }
.stn .in span .ar{ font-size:20px; }
/* kabel: susun */
.track{ min-height:70px; border-radius:16px; border:2px dashed var(--navy); padding:8px; display:flex; flex-direction:column; gap:6px; background:var(--sky2); }
.track span{ display:flex; gap:8px; align-items:flex-start; background:#C9F2D9; color:#14213D; border:2px solid var(--ok); border-radius:12px; padding:6px 10px; font-weight:800; font-size:15px; line-height:1.4; }
.track span i{ font-style:normal; font-family:var(--hf); background:var(--navy); color:#fff; border-radius:8px; padding:0 7px; flex:0 0 auto; }
.segs{ display:grid; gap:8px; margin-top:10px; }
.seg{ min-width:0; text-align:start; border:3px solid var(--navy); border-radius:14px; background:#EAF4FF; color:#14213D; font-weight:800; font-size:15px; padding:10px 12px; box-shadow:var(--shadow); line-height:1.4; }
html[dir="rtl"] .seg,html[dir="rtl"] .track span{ font-size:17px; line-height:1.85; }
.seg.gone{ display:none; }
/* kabin: pilih penumpang */
.cabin{ border:4px solid var(--navy); border-radius:26px 26px 18px 18px; background:var(--red); padding:12px 10px 10px; position:relative; margin-top:18px; }
.cabin::before{ content:""; position:absolute; left:50%; top:-20px; width:4px; height:18px; background:var(--cable); }
.seats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.seats.one{ grid-template-columns:1fr; }
.pax{ min-width:0; overflow-wrap:anywhere; background:#DFF1FF; color:#14213D; border:3px solid var(--navy); border-radius:14px; min-height:54px; padding:6px 8px; font-weight:800; font-size:15px; line-height:1.35; }
html[dir="rtl"] .pax{ font-size:16px; line-height:1.8; }
.pax.on{ background:var(--amber); box-shadow:inset 0 0 0 3px #fff; }
.pax.on::after{ content:" 🧍"; }
.go-row{ display:flex; gap:10px; margin-top:12px; }
/* takal: altimeter */
.alti{ display:flex; gap:10px; align-items:stretch; }
.alti .bar{ width:30px; flex:0 0 30px; border-radius:15px; border:3px solid var(--navy); background:linear-gradient(0deg,var(--hill2),var(--hill) 40%,#DDEFFF 41%,#fff); position:relative; min-height:200px; }
.alti .bar i{ position:absolute; left:50%; transform:translate(-50%,50%); font-size:22px; font-style:normal; transition:bottom .5s; }
.alti .body{ flex:1; min-width:0; }
.zap{ text-align:center; font-weight:900; color:var(--teal); margin:6px 0 0; }
.tbar{ height:8px; border-radius:6px; background:var(--line); overflow:hidden; margin-bottom:6px; } .tbar span{ display:block; height:100%; width:100%; background:var(--amber); transition:width linear; }
/* menarapandang */
.scope{ border:5px solid var(--navy); border-radius:60px; padding:18px 12px; background:radial-gradient(ellipse at center,#FFFFFF 55%,#D3E9FF 100%); position:relative; }
.scope::before,.scope::after{ content:"🔭"; position:absolute; top:-18px; font-size:26px; } .scope::before{ left:14px; } .scope::after{ right:14px; }
.phrase{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; direction:rtl; }
.tok{ border:3px solid var(--navy); background:#fff; color:#14213D; border-radius:14px; font-size:26px; padding:2px 12px; box-shadow:var(--shadow); }
/* palang */
.gate{ display:flex; justify-content:center; margin:4px 0; } .gate svg{ width:160px; height:70px; }
.gate .arm{ transform-origin:22px 40px; transition:transform .45s; } .gate.up .arm{ transform:rotate(-60deg); }
.stmt{ font-size:17px; font-weight:800; line-height:1.5; text-align:center; background:#EAF4FF; color:#14213D; border:2px solid var(--navy); border-radius:16px; padding:10px; }
html[dir="rtl"] .stmt{ font-size:18px; line-height:1.95; }
.pls{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px; }
.pl{ min-height:58px; border-radius:16px; border:3px solid var(--navy); font-weight:900; font-size:18px; box-shadow:var(--shadow); }
.pl[data-v="1"]{ background:#C9F2D9; color:#0E3B22; } .pl[data-v="0"]{ background:#FFD4DA; color:#5A0E19; }
/* cangkuk */
.hooks{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.hcol{ display:flex; flex-direction:column; gap:8px; min-width:0; }
.hk{ min-width:0; overflow-wrap:anywhere; min-height:56px; border:3px solid var(--navy); border-radius:14px; background:#EAF4FF; color:#14213D; font-weight:800; font-size:14px; padding:6px 8px; line-height:1.35; box-shadow:var(--shadow); }
html[dir="rtl"] .hk{ font-size:15px; line-height:1.8; }
.hk[data-s="a"]::before{ content:"🪝 "; }
.hk[data-s="b"]{ background:#FFE9EC; }
.hk.sel{ background:var(--amber); } .hk.done{ background:#C9F2D9; border-color:var(--ok); opacity:.75; }
.hk .ar{ font-size:22px; }
/* jadual */
.board{ background:#101826; color:#FFD45C; border:4px solid #2B2F38; border-radius:16px; padding:14px 12px; font-family:var(--hf); font-size:17px; line-height:1.6; box-shadow:inset 0 0 0 2px #333C4E; }
html[dir="rtl"] .board{ font-family:var(--jf); font-size:19px; line-height:2.1; }
.board .ar{ color:#FFF4D1; }
.blank{ display:inline-block; min-width:70px; border-bottom:3px dashed #FFD45C; text-align:center; color:#fff; }
.blank.done{ border-bottom-style:solid; color:#7CF0A8; }
.blank.done .ar{ color:#7CF0A8; }
/* maklum balas */
.fb{ position:fixed; left:0; right:0; bottom:0; z-index:50; padding:12px; animation:up .3s; }
@keyframes up{ from{ transform:translateY(100%);} }
.fb .in{ max-width:560px; margin:0 auto; background:var(--card); border:3px solid var(--navy); border-top:8px solid var(--ok); border-radius:22px; padding:12px; box-shadow:0 -6px 30px rgba(0,0,0,.25); }
.fb .row1{ display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.fb .gogo{ width:64px; }
.fb strong{ font-family:var(--hf); font-size:22px; color:var(--ok); }
.fb p{ margin:4px 0 0; font-size:15px; line-height:1.45; } html[dir="rtl"] .fb p{ font-size:17px; line-height:1.9; }
.fb .btn{ width:100%; }
.fast{ display:inline-block; margin-top:4px; background:var(--amber); color:#14213D; border-radius:999px; padding:2px 10px; font-weight:900; font-size:13px; }
.res{ text-align:center; }
.res .gogo{ width:120px; }
.stars{ font-size:44px; margin:6px 0; } .stars span{ display:inline-block; animation:pop .5s both; } .stars .off{ filter:grayscale(1); opacity:.3; }
@keyframes pop{ from{ transform:scale(0);} }
.res h2{ font-size:28px; color:var(--red); }
.res p{ font-size:17px; line-height:1.5; }
.gotst{ display:inline-flex; gap:10px; align-items:center; background:#FFF4D1; color:#14213D; border:2px solid var(--amber); border-radius:16px; padding:8px 14px; font-weight:900; margin:6px 0 12px; }
.gotst span{ font-size:32px; }
.res .btn{ width:100%; }
.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:60; background:var(--navy); color:#fff; padding:10px 16px; border-radius:14px; font-weight:800; max-width:90vw; text-align:center; }
.confetti{ position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden; }
.confetti span{ position:absolute; top:-40px; font-size:26px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); } }
@media (prefers-color-scheme: dark){
  .opt,.seg,.stn,.pax,.hk{ box-shadow:0 5px 0 rgba(0,0,0,.5); }
  .track{ background:#0F1E3A; }
}
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

    { p:"35–36", pic:"🌫️", h:["Tashil dan ibdal","تسهيل دان إبدال"],

  read:[
    { p:"41–42", pic:"🏛️", h:["Rukun bacaan al-Quran","روکون باچاءن القرءان"],
      text:["Rukun bacaan al-Quran ialah peraturan yang wajib dipatuhi ketika membaca al-Quran untuk menghasilkan bacaan yang betul, fasih dan lancar. Bacaan yang tidak memenuhi rukun ialah janggal (syaz) dan tidak boleh diterima.","روکون باچاءن القرءان اياله ڤراتورن يڠ واجب دڤاتوهي کتيک ممباچ القرءان اونتوق مڠحاصيلکن باچاءن يڠ بتول، فصيح دان لنچر. باچاءن يڠ تيدق ممنوهي روکون اياله جڠڬل (شاذ) دان تيدق بوليه دتريما."],
      list:[["Mematuhi qawa'id al-'arabiyyah.","ممتوهي قواعد العربية."],["Bersambung sanad kepada Rasulullah ﷺ.","برسامبوڠ سند کڤد رسول الله ﷺ."],["Mengikut rasm uthmani.","مڠيکوت رسم عثماني."]] },
    { p:"43", pic:"📐", h:["Rukun 1: Qawa'id al-'arabiyyah","روکون 1: قواعد العربية"],
      text:["Pembaca mesti menepati salah satu kaedah nahu bahasa Arab dan tidak boleh mengubah kalimah atau baris kecuali ada riwayat qurra' yang mengharuskannya. Contohnya وَٱلْأَرْحَامَ (an-Nisa': 1): Imam Hamzah membacanya dengan baris bawah, dan kedua-dua bacaan menepati kaedah nahu.","ڤمباچ مستي منڤتي سالهساتو قاعدة نحو بهاس عرب دان تيدق بوليه مڠوبه كليمه اتاو باريس کچوالي اد رواية قراء يڠ مڠهاروسکنڽ. چونتوهڽ وَٱلْأَرْحَامَ (النساء: 1): امام حمزة ممباچڽ دڠن باريس باوه، دان کدوا٢ باچاءن منڤتي قاعدة نحو."],
      ex:["rk_rh"] },
    { p:"44", pic:"🔗", h:["Rukun 2: Bersambung sanad","روکون 2: برسامبوڠ سند"],
      text:["Kita mesti mempelajari al-Quran sehingga khatam daripada guru yang bertaqwa dan mahir, yang sanadnya bersambung hingga Rasulullah ﷺ.","کيت مستي ممڤلاجري القرءان سهيڠڬ ختم درڤد ڬورو يڠ برتقوى دان ماهير، يڠ سندڽ برسامبوڠ هيڠڬ رسول الله ﷺ."],
      list:[["Sanad Imam Hafs: Rasulullah ﷺ → Uthman, Ali, Zaid bin Thabit, Ubai bin Ka'ab → Abu 'Abd ar-Rahman as-Sulami → 'Asim → Hafs.","سند امام حفص: رسول الله ﷺ ← عثمان، علي، زيد بن ثابت، أبي بن کعب ← ابو عبد الرحمن السلمي ← عاصم ← حفص."]] },
    { p:"45–46", pic:"📖", h:["Rukun 3: Rasm uthmani","روکون 3: رسم عثماني"],
      text:["Bacaan al-Quran hendaklah berpandukan mushaf rasm uthmani. Rasm uthmani diakui oleh Rasulullah ﷺ, mengikut tulisan asal para sahabat dan disepakati oleh para sahabat.","باچاءن القرءان هندقله برڤندوکن مصحف رسم عثماني. رسم عثماني دأکوي اوليه رسول الله ﷺ، مڠيکوت توليسن اصل ڤارا صحابة دان دسڤاکتي اوليه ڤارا صحابة."],
      ex:["rk_sl","rk_al","rk_ml","rk_ad","rk_zk","rk_rb"],
      am:["Menjaga dan menghormati al-Quran dengan meletakkannya di tempat yang tinggi.","منجاڬ دان مڠحرمتي القرءان دڠن ملتقکنڽ د تمڤت يڠ تيڠڬي."] }

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[523,.12],[784,.2]]),
  tick: () => tone([[880,.07,"triangle"]]),
  clank:() => tone([[160,.08,"square"],[120,.1,"square"]]),
  no:   () => tone([[220,.18,"square"],[185,.2,"square"]]),
  up:   (n=0) => tone([[[330,370,415,466,523,587,659,740][n%8],.14,"triangle"]]),
  win:  () => tone([[392,.14],[523,.14],[659,.14],[784,.3]])
};

const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
const AR_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]+/g;
function clean(text){
  return text.replace(AR_RE," ").replace(/[ـ→←]/g," ").replace(/_{2,}/g," ").replace(/\(\s*[:,]?\s*[\d–-]*\s*\)/g," ").replace(/\s+:/g,":")
    .replace(/\s+([.,:;!?])/g,"$1").replace(/(^|\s)[:,.;]+(?=\s|$)/g," ").replace(/\s+/g," ").trim();
}
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  const s = clean(text); if(!s || !/[a-z]/i.test(s)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .95; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

  S.phase = "result";

  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Perjalanan kamu lancar tanpa tersangkut.","چمرلڠ! ڤرجالنن کامو لنچر تنڤا ترسڠکوت."] : stars===2 ? ["Bagus! Ulang lagi untuk 3 bintang.","باڬوس! اولڠ لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom naik sekali lagi.","شاباس کران منچوبا! جوم ناٴيق سکالي لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:2];
  app.innerHTML = head() + `<section class="card res">
      ${gogo()}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Tiket baharu!","تيکيت بهارو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🗼 ${L("Menara Pandang Puncak kini dibuka!","منارا ڤندڠ ڤونچق کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🚡 ${L("Kembali ke peta","کمبالي ک ڤتا")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Naik semula","ناٴيق سمولا")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== PERMAINAN ===================== */
const rounds = (n,k) => `<div class="rounds">${Array.from({length:n},(_,i)=>`<i class="${i<k?"ok":i===k?"on":""}"></i>`).join("")}</div>`;
const optBtns = (opts, cls="opt") => opts.map((o,i)=>`<button class="${cls}" data-i="${i}" data-ok="${o.ok?1:0}">${TX(o.x)}</button>`).join("");
const wideOpts = opts => opts.some(o => typeof o.x!=="string" && T(o.x).length > 22) ? "one" : "";

const GAMES = {
  /* Gondola: pilih gondola (contoh), hantar ke stesen hukumnya */
  gondola(el, g){
    let sel = null, left = g.items.length;
    const ord = mix(g.items.map((_,i)=>i));
    el.innerHTML = `<p class="lab">🚡 ${L("1. Pilih gondola  2. Ketuk stesen","1. ڤيليه ڬوندولا  2. کتوق ستيسن")}</p>
      <div class="platform">${ord.map(i=>`<button class="gi" data-i="${i}" data-c="${g.items[i][1]}">${TX(g.items[i][0])}</button>`).join("")}</div>
      <div class="stns">${g.stv.map((s,i)=>`<button class="stn" data-c="${i}"><b>🏔️ ${T(s)}</b><div class="in"></div></button>`).join("")}</div>`;
    el.querySelectorAll(".gi").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".gi").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = b; sfx.up(+b.dataset.i);
    }));
    el.querySelectorAll(".stn").forEach(s => s.addEventListener("click", () => {
      if(!sel){ toast(L("Pilih satu gondola dahulu 🚡","ڤيليه ساتو ڬوندولا دهولو 🚡")); return; }
      if(sel.dataset.c === s.dataset.c){
        s.querySelector(".in").insertAdjacentHTML("beforeend", `<span>${TX(g.items[+sel.dataset.i][0])}</span>`);
        sel.classList.add("gone"); sel.disabled = true; sel = null; left--; sfx.clank(); clearHint();
        if(!left) setTimeout(win, 350);
      } else oops(s, L("Gondola tersalah stesen! Semak hukumnya semula.","ڬوندولا ترساله ستيسن! سمق حکومڽ سمولا."));
    }));
  },

  /* Kabel: ketuk segmen kabel mengikut urutan yang betul */
  kabel(el, g){
    let k = 0;
    const ord = mix(g.items.map((_,i)=>i));
    el.innerHTML = `<p class="lab">🔗 ${L("Ketuk ikut urutan untuk menyambung kabel","کتوق ايکوت اوروتن اونتوق مڽمبوڠ کابل")}</p>
      <div class="track" aria-live="polite"></div>
      <div class="segs">${ord.map(i=>`<button class="seg" data-i="${i}">${TX(g.items[i])}</button>`).join("")}</div>`;
    const track = el.querySelector(".track");
    el.querySelectorAll(".seg").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(+b.dataset.i === k){
        track.insertAdjacentHTML("beforeend", `<span><i>${k+1}</i>${TX(g.items[k])}</span>`);
        b.classList.add("gone"); b.disabled = true; sfx.up(k); k++; clearHint();
        if(k===g.items.length) setTimeout(win, 400);
      } else oops(b, L("Kabel terputus! Itu bukan langkah seterusnya.","کابل ترڤوتوس! ايت بوکن لڠکه ستروسڽ."));
    }));
  },

  /* Kabin: pilih SEMUA penumpang yang betul, kemudian Berlepas */
  kabin(el, g){
    const ord = shuffle(g.items.map((_,i)=>i)), on = new Set();
    const one = g.items.some(it => typeof it[0]!=="string" && T(it[0]).length > 24);
    el.innerHTML = `<p class="lab">🧍 ${L("Ketuk untuk naik / turun kabin","کتوق اونتوق ناٴيق / تورون کابين")}</p>
      <div class="cabin"><div class="seats ${one?"one":""}">${ord.map(i=>`<button class="pax" data-i="${i}" data-ok="${g.items[i][1]?1:0}" aria-pressed="false">${TX(g.items[i][0])}</button>`).join("")}</div></div>
      <div class="go-row"><button class="btn go chk">🚡 ${L("Berlepas!","برلڤس!")}</button></div>`;
    el.querySelectorAll(".pax").forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      const i = +b.dataset.i; if(on.has(i)) on.delete(i); else on.add(i);
      b.classList.toggle("on", on.has(i)); b.setAttribute("aria-pressed", on.has(i)); sfx.tick();
    }));
    el.querySelector(".chk").addEventListener("click", e => {
      if(!on.size){ toast(L("Naikkan penumpang dahulu 🧍","ناٴيقکن ڤنومڤڠ دهولو 🧍")); return; }
      const need = g.items.map((x,i)=>x[1]?i:-1).filter(i=>i>=0);
      const wrong = [...on].filter(i => !g.items[i][1]).length, missing = need.filter(i => !on.has(i)).length;
      if(!wrong && !missing){ el.querySelectorAll(".pax").forEach(x=>{ x.disabled = true; if(x.classList.contains("on")) x.classList.add("right"); }); setTimeout(win, 350); }
      else oops(e.currentTarget, wrong ? L(`Ada ${wrong} penumpang yang salah kabin. Turunkan dia.`,`اد ${wrong} ڤنومڤڠ يڠ ساله کابين. تورونکن دي.`) : L(`Masih ada ${missing} penumpang tertinggal di platform.`,`ماسيه اد ${missing} ڤنومڤڠ ترتيڠڬل د ڤلتفورم.`));
    });
  },

  /* Takal: pusingan pantas; setiap jawapan betul menaikkan kabin di altimeter (bonus ⚡, tiada hukuman masa) */
  takal(el, g){
    let k = 0, zap = 0; const LIM = 10000, n = g.rounds.length;
    const draw = () => {
      const r = g.rounds[k], opts = shuffle(r.a.map((x,i)=>({x, ok:i===0}))), t0 = Date.now();
      el.innerHTML = rounds(n, k) + `<div class="alti"><div class="bar" aria-hidden="true"><i style="bottom:${8 + k/n*80}%">🚡</i></div><div class="body">
        <div class="tbar"><span></span></div>
        <p class="lab" style="font-size:16px;color:var(--ink)">⛰️ ${T(r.p)}</p>${r.ar?`<div class="qar ar" lang="ar">${AX(r.ar)}</div>`:""}
        <div class="opts ${wideOpts(opts)}">${optBtns(opts)}</div><p class="zap">⚡ ${zap}</p></div></div>`;
      const bar = el.querySelector(".tbar span");
      requestAnimationFrame(()=>{ bar.style.transitionDuration = LIM+"ms"; bar.style.width = "0%"; });
      el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
        if(b.disabled || b.classList.contains("wrong")) return;
        if(b.dataset.ok==="1"){
          el.querySelectorAll(".opt").forEach(x=>x.disabled=true); b.classList.add("right");
          if(Date.now()-t0 < LIM) zap++; sfx.up(k); clearHint(); k++;
          const cab = el.querySelector(".bar i"); if(cab) cab.style.bottom = (8 + k/n*80) + "%";
          if(k===n) setTimeout(win, 380); else setTimeout(draw, 420);
        } else { b.classList.add("wrong"); oops(b, L("Takal tergelincir! Fikir sekali lagi.","تاکل ترڬلينچير! فيکير سکالي لاڬي.")); }
      }));
    };
    draw();
  },

  /* Menara pandang: teropong potongan ayat, ketuk kalimah yang betul (tanda waqaf melekat pada kalimah sebelumnya) */
  menarapandang(el, g){
    const toks = [];
    for(const w of AX(g.ar).split(" ")){ if(!/[\u0621-\u064A\u0671]/.test(w) && toks.length) toks[toks.length-1] += " " + w; else toks.push(w); }
    el.innerHTML = `<p class="lab">🔭 ${L("Ketuk satu kalimah melalui teropong","کتوق ساتو كليمه ملالوٴي تروڤوڠ")}</p>
      <div class="scope"><div class="phrase" lang="ar">${toks.map((w,i)=>`<button class="tok ar" data-i="${i}" data-ok="${i===g.ans?1:0}">${w}</button>`).join("")}</div></div>
      <p class="lab" style="text-align:center">📍 ${Q[g.ar].k}</p>`;
    el.querySelectorAll(".tok").forEach(b => b.addEventListener("click", () => {
      if(b.disabled || b.classList.contains("wrong")) return;
      if(b.dataset.ok==="1"){ el.querySelectorAll(".tok").forEach(x=>x.disabled=true); b.classList.add("right"); setTimeout(win, 400); }
      else { b.classList.add("wrong"); oops(b, L("Teropong tersasar! Cuba kalimah lain.","تروڤوڠ ترساسر! چوبا كليمه لاٴين.")); }
    }));
  },

  /* Palang: kenyataan Betul/Salah; jawapan betul menaikkan palang stesen */
  palang(el, g){
    let k = 0;
    const gate = `<svg viewBox="0 0 160 70" aria-hidden="true"><rect x="12" y="30" width="20" height="38" rx="4" fill="#1D3557"/>
      <g class="arm"><rect x="22" y="34" width="132" height="12" rx="6" fill="#fff" stroke="#14213D" stroke-width="3"/>
      <path d="M44 34 h16 l-8 12 h-16 Z M84 34 h16 l-8 12 h-16 Z M124 34 h16 l-8 12 h-16 Z" fill="#E63946"/></g>
      <circle cx="22" cy="40" r="7" fill="#FFB703" stroke="#14213D" stroke-width="3"/></svg>`;
    const draw = () => {
      const [s] = g.rounds[k];
      el.innerHTML = rounds(g.rounds.length, k) + `<div class="gate">${gate}</div><p class="stmt">${T(s)}</p>
        <div class="pls"><button class="pl" data-v="1">✅ ${T(BT)}</button><button class="pl" data-v="0">❌ ${T(SL)}</button></div>`;
      el.querySelectorAll(".pl").forEach(b => b.addEventListener("click", () => {
        if(b.disabled) return;
        if(+b.dataset.v === g.rounds[k][1]){
          el.querySelectorAll(".pl").forEach(x=>x.disabled=true); el.querySelector(".gate").classList.add("up"); sfx.clank(); clearHint(); k++;
          if(k===g.rounds.length) setTimeout(win, 500); else setTimeout(draw, 650);
        } else oops(b, L("Palang tidak terbuka. Baca kenyataan itu sekali lagi.","ڤالڠ تيدق تربوک. باچ کڽاتاٴن ايت سکالي لاڬي."));
      }));
    };
    draw();
  },

  /* Cangkuk: ketuk cangkuk (kiri), kemudian kabin yang sepadan (kanan) */
  cangkuk(el, g){
    let sel = null, left = g.pairs.length;
    const lo = shuffle(g.pairs.map((_,i)=>i)), ro = mix(lo);
    el.innerHTML = `<p class="lab">🪝 ${L("Ketuk cangkuk, kemudian kabin yang sepadan","کتوق چڠکوق، کمودين کابين يڠ سڤادن")}</p>
      <div class="hooks"><div class="hcol">${lo.map(i=>`<button class="hk" data-s="a" data-i="${i}">${TX(g.pairs[i][0])}</button>`).join("")}</div>
      <div class="hcol">${ro.map(i=>`<button class="hk" data-s="b" data-i="${i}">${TX(g.pairs[i][1])}</button>`).join("")}</div></div>`;
    el.querySelectorAll('.hk[data-s="a"]').forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return; el.querySelectorAll('.hk[data-s="a"]').forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = b; sfx.tick();
    }));
    el.querySelectorAll('.hk[data-s="b"]').forEach(b => b.addEventListener("click", () => {
      if(b.disabled) return;
      if(!sel){ toast(L("Ketuk cangkuk di sebelah kiri dahulu 🪝","کتوق چڠکوق د سبله کيري دهولو 🪝")); return; }
      if(sel.dataset.i === b.dataset.i){
        [sel,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; });
        sel = null; left--; sfx.clank(); clearHint(); if(!left) setTimeout(win, 350);
      } else oops(b, L("Cangkuk tidak muat! Pasangan itu tidak sepadan.","چڠکوق تيدق موات! ڤاسڠن ايت تيدق سڤادن."));
    }));
  },

  /* Jadual: papan jadual berlepas, isi tempat kosong */
  jadual(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    const s = T(g.s).replace("___", `<span class="blank">🚡</span>`);
    el.innerHTML = `<div class="board">🕒 ${s}</div><div class="opts ${wideOpts(opts)}">${optBtns(opts)}</div>`;
    el.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("wrong")) return;
      if(b.dataset.ok==="1"){ done = true; b.classList.add("right"); const bl = el.querySelector(".blank"); bl.classList.add("done"); bl.innerHTML = TX(opts[+b.dataset.i].x); setTimeout(win, 450); }
      else { b.classList.add("wrong"); oops(b, L("Jadual itu tidak tepat. Cuba lagi.","جدوال ايت تيدق تڤت. چوبا لاڬي.")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save(VKEY, voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan stesen sebelumnya dahulu 🔒","سلسايکن ستيسن سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} stesen untuk naik ke Menara Pandang Puncak 🗼`,`سلسايکن سموا ${STATIONS.length} ستيسن اونتوق ناٴيق ک منارا ڤندڠ ڤونچق 🗼`)); }
  else if(a==="map"){ renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa (selepas tukar tulisan/suara) tanpa mengulang bunyi/konfeti
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
