<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B5A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<title>Angkasa Tajwid • Tajwid Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0FF; --surface:#FFFFFF; --ink:#1C1B3A; --muted:#5E5C85; --line:#D8D9F2;
  --brand:#5B4BD6; --brand-ink:#FFFFFF; --brand-shadow:#3D30A3; --gold:#E8A317;
  --ok:#1F8A50; --ok-bg:#DDF3E5; --bad:#C8452F; --bad-bg:#FBE1DC; --note:#FFF4D6;
  --pattern:rgba(91,75,214,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0B1E; --surface:#1A1836; --ink:#ECEBFF; --muted:#B3B0DD; --line:#2F2C5A;
    --brand:#8C7DFF; --brand-ink:#100B33; --brand-shadow:#5B4BD6; --gold:#F2C14E;
    --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#332E1A;
    --pattern:rgba(140,125,255,.10);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0B1E; --surface:#1A1836; --ink:#ECEBFF; --muted:#B3B0DD; --line:#2F2C5A;
  --brand:#8C7DFF; --brand-ink:#100B33; --brand-shadow:#5B4BD6; --gold:#F2C14E;
  --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#332E1A;
  --pattern:rgba(140,125,255,.10);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background-image:radial-gradient(var(--pattern) 1.5px,transparent 2px),radial-gradient(var(--pattern) 1px,transparent 1.5px);background-size:40px 40px,23px 23px;background-position:0 0,9px 14px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 44px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{max-width:100%}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;line-height:1.7}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
a.iconbtn{text-decoration:none;color:inherit}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.pillstat{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-weight:800;font-size:17px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.langbtn .ar{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:600}

.hero{text-align:center;padding:8px 0 2px}
.hero .badge{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px}
.hero h1{margin:8px 0 0;font-size:clamp(32px,8.6vw,50px);line-height:1.04;font-weight:800;background:linear-gradient(90deg,#5B4BD6,#E84393);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:6px auto 0;color:var(--muted);max-width:480px}

/* ===== Angkasa (peta) ===== */
.space{position:relative;margin:16px auto 0;max-width:540px;border-radius:30px;overflow:hidden;border:2px solid var(--line);
  background:radial-gradient(ellipse at 20% 15%,rgba(232,67,147,.35),transparent 45%),radial-gradient(ellipse at 85% 60%,rgba(0,206,201,.25),transparent 45%),linear-gradient(180deg,#0B0A2A,#1B1250 50%,#2A0F45)}
.space .star{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;animation:tw var(--t) ease-in-out infinite;animation-delay:var(--d);pointer-events:none}
@keyframes tw{50%{opacity:.2}}
.space .shoot{position:absolute;width:90px;height:2px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-30deg);animation:shoot 7s linear infinite;opacity:0;pointer-events:none}
@keyframes shoot{0%,85%{opacity:0;transform:translate(0,0) rotate(-30deg)}88%{opacity:1}100%{opacity:0;transform:translate(-220px,120px) rotate(-30deg)}}
.space .moon{position:absolute;right:18px;top:18px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF7D6,#E9D9A8);box-shadow:0 0 30px rgba(255,240,180,.5);pointer-events:none}
.space .moon::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.08);left:14px;top:30px;box-shadow:18px -12px 0 -2px rgba(0,0,0,.07)}
.space svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.planet{position:absolute;transform:translate(-50%,-50%);width:180px;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0}
.planet .orb{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 32% 30%,color-mix(in srgb,var(--tc) 40%,#fff),var(--tc) 55%,color-mix(in srgb,var(--tc) 60%,#000));box-shadow:0 0 24px color-mix(in srgb,var(--tc) 60%,transparent),inset -10px -12px 0 rgba(0,0,0,.18);transition:transform .15s}
.planet .orb::before{content:"";position:absolute;left:-18px;right:-18px;top:50%;height:16px;margin-top:-8px;border-radius:50%;border:3px solid rgba(255,255,255,.55);transform:rotate(-18deg);clip-path:polygon(0 50%,100% 50%,100% 100%,0 100%)}
.planet .orb .no{position:absolute;top:-6px;right:-8px;background:var(--gold);color:#2A1B00;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;font-weight:800}
.planet .orb .flag{position:absolute;top:-22px;left:8px;font-size:24px;animation:wave 1.6s ease-in-out infinite;transform-origin:0 100%}
@keyframes wave{50%{transform:rotate(-10deg)}}
.planet .lbl{margin-top:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:2px 10px 4px;font-weight:800;font-size:15px;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.planet .lbl small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.planet .st{font-size:13px;letter-spacing:1px;margin-top:3px;background:rgba(255,255,255,.15);border-radius:999px;padding:0 8px}
.planet .st .off{opacity:.3;filter:grayscale(1)}
.planet.locked .orb{filter:grayscale(.85) brightness(.6)}
.planet.locked .lbl{opacity:.8}
.planet:active .orb{transform:scale(.94)}
.planet.current .orb{animation:pglow 2s ease-in-out infinite}
@keyframes pglow{50%{box-shadow:0 0 44px color-mix(in srgb,var(--tc) 90%,transparent),inset -10px -12px 0 rgba(0,0,0,.18)}}
.rocket{position:absolute;width:56px;transform:translate(-50%,-50%);pointer-events:none;z-index:3;transition:left 1.2s ease-in-out,top 1.2s ease-in-out}
.rocket .rk{animation:hover 1.6s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-6px)}}
.rocket .fire{animation:fire .15s linear infinite;transform-origin:50% 0}
@keyframes fire{50%{transform:scaleY(.7)}}
.teacher{display:flex;justify-content:center;margin-top:20px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700}
.toggle .sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--brand)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.foot{margin-top:16px;color:var(--muted);font-size:15px;text-align:center}

/* ===== Stesen ===== */
.banner{border-radius:26px;padding:18px 18px 20px;background:radial-gradient(circle at 85% 20%,color-mix(in srgb,var(--tc) 40%,#fff) 0 8%,transparent 9%),linear-gradient(160deg,var(--tc),#1B1250);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.banner .kick{font-weight:700;opacity:.92;font-size:16px}
.banner h2{margin:0;font-size:clamp(25px,6.4vw,33px);line-height:1.15}
.banner .arh{display:block;font-family:"Amiri",serif;font-size:clamp(24px,6.5vw,32px);line-height:1.5}
.banner .big{position:absolute;inset-inline-end:-4px;bottom:-12px;font-size:92px;opacity:.25}
.banner .stars{margin-top:6px;font-size:20px}
.banner .stars .off{opacity:.35;filter:grayscale(1)}
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.units li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;line-height:1.25}
.units .u{background:var(--tc);color:#fff;border-radius:10px;font-size:13px;font-weight:800;padding:2px 8px;flex:none}
.actions{display:grid;gap:12px;margin-top:18px}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:0;border-radius:20px;padding:14px 16px;font-weight:800;font-size:21px;line-height:1.15}
.bigbtn small{display:block;font-weight:600;font-size:15px;opacity:.9}
.bigbtn .e{font-size:34px;flex:none}
.bigbtn.read{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.bigbtn.play{background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-shadow)}
.bigbtn:active{transform:translateY(3px)}

/* ===== Umum ===== */
.gamehead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.gamehead h2{margin:0;font-size:20px;flex:1;line-height:1.15;color:var(--brand)}
.gamehead h2 small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.progress{position:relative;height:12px;background:var(--line);border-radius:99px;margin:6px 0 16px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#00CEC9,#5B4BD6,#E84393);border-radius:99px;transition:width .3s}
.progress i{position:absolute;top:50%;font-style:normal;font-size:22px;transform:translate(-50%,-50%) rotate(45deg);transition:left .3s}
html[dir="rtl"] .progress i{transform:translate(50%,-50%) rotate(-45deg) scaleX(-1)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.page-in{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qtype{display:inline-block;background:var(--note);border-radius:999px;padding:1px 12px;font-size:14.5px;font-weight:700}
.tag{display:inline-block;background:var(--gold);color:#2A1B00;border-radius:999px;padding:1px 10px;font-size:13.5px;font-weight:800;margin-inline-start:4px}
.pill{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.qtext{font-size:clamp(20px,4.8vw,25px);font-weight:700;line-height:1.32;margin:4px 0 12px}
.qtext .ar{font-size:1.3em}
.hint{color:var(--muted);font-size:15.5px;margin:-4px 0 12px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.08)}}
.counter{display:inline-block;background:var(--note);border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}

/* Rajah mulut */
.mouth{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 70% 30%,#2A1B66,#0E0B2E);margin:0 0 12px}
.mouth svg{display:block;width:100%;height:auto}
.mouth .hs{cursor:pointer}
.mouth .hs circle.dot{fill:rgba(255,255,255,.25);stroke:#fff;stroke-width:2;stroke-dasharray:4 3;transition:fill .2s}
.mouth .hs circle.ring{fill:none;stroke:#FFE27A;stroke-width:3;opacity:0}
.mouth .hs:hover circle.dot,.mouth .hs:focus circle.dot{fill:rgba(255,226,122,.5)}
.mouth .hs.on circle.dot{fill:#FFE27A;stroke-dasharray:none}
.mouth .hs.on circle.ring,.mouth .hs.pulse circle.ring{animation:ringout 1.4s ease-out infinite}
@keyframes ringout{0%{opacity:1;r:10}100%{opacity:0;r:34}}
.mouth .hs.bad circle.dot{fill:#FF6B6B;stroke:#fff}
.mouth .hs text{display:none;font-family:"Amiri",serif;font-size:13px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#0E0B2E;stroke-width:3px;opacity:0;transition:opacity .3s}
.mouth .hs.on text,.mouth.show .hs text{opacity:1}
.mouth .wv{fill:none;stroke:#FFE27A;stroke-width:2.5;stroke-linecap:round;opacity:0}
.mouth.sound .wv{animation:wvv 1.2s ease-out infinite}
@keyframes wvv{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.6)}}
.mouth .cap{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.9);color:#1C1B3A;border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}
html[dir="rtl"] .mouth .cap{left:auto;right:10px}
.mouth .cap .ar{font-size:18px}
.lettercard{display:grid;place-items:center;margin:0 auto 10px;max-width:260px;background:var(--note);border:3px solid var(--gold);border-radius:20px;padding:4px 14px}
.lettercard .ar{font-size:clamp(40px,11vw,56px);line-height:1.4}

/* Roket pilihan */
.rockets{display:grid;gap:10px}
.rbtn{position:relative;display:flex;gap:12px;align-items:center;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:10px 14px;text-align:start;font-size:18.5px;font-weight:700;line-height:1.3;overflow:visible}
.rbtn .rk{font-size:28px;flex:none;display:inline-block;transition:transform .2s}
.rbtn:hover .rk{transform:translateY(-3px) rotate(-8deg)}
.rbtn .ar{font-size:24px;flex:1;text-align:right}
.rbtn.ok{border-color:var(--ok);background:var(--ok-bg)}
.rbtn.bad{border-color:var(--bad);background:var(--bad-bg)}
.rbtn.ok .rk{animation:launch 1.1s ease-in forwards}
@keyframes launch{20%{transform:translateY(4px)}100%{transform:translate(40px,-160px) rotate(-30deg);opacity:0}}
.rbtn.bad .rk{animation:fizzle .9s ease forwards}
@keyframes fizzle{30%{transform:rotate(25deg)}60%{transform:translateY(-6px) rotate(-20deg)}100%{transform:translateY(30px) rotate(160deg);opacity:.2}}

/* Hujan meteor */
.sky{position:relative;height:340px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#0B0A2A,#2A1B66 80%,#4B2E83)}
.sky::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:radial-gradient(ellipse at 50% 120%,#7C6BD9 60%,transparent 62%)}
.met{position:absolute;top:-70px;left:var(--x);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;animation:metfall var(--t) linear infinite;animation-delay:var(--d);z-index:1}
.met .rock{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#B88A62,#6B4A2E);box-shadow:0 -10px 18px rgba(255,140,60,.6),inset -6px -6px 0 rgba(0,0,0,.25);color:#fff}
.met .rock .ar{font-size:30px;line-height:1.2;text-shadow:0 2px 2px rgba(0,0,0,.5)}
.met .rock span{font-size:12px;font-weight:800;line-height:1.1;text-align:center;padding:2px}
.met.wide .rock{width:auto;min-width:62px;border-radius:30px;padding:0 10px}
.met.wide .rock .ar{font-size:18px}
@keyframes metfall{from{transform:translateY(0)}to{transform:translateY(440px)}}
.met.boom{animation-play-state:paused}
.met.boom .rock{animation:boom .45s ease-out forwards}
@keyframes boom{50%{transform:scale(1.5);background:#FFE27A}100%{transform:scale(0);opacity:0}}
.met.nope .rock{background:#666;box-shadow:none}
.met.nope{animation-duration:2.4s!important}

/* Teropong (cari kalimah) */
.scope{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;background:radial-gradient(circle at 50% 0%,#2A1B66,#0E0B2E);border-radius:22px;padding:14px 10px}
.wtile{position:relative;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:14px;padding:0 12px}
.wtile .ar{font-size:24px;line-height:1.7}
.wtile.found{border-color:#FFE27A;background:rgba(255,226,122,.25);animation:pop .3s}
.wtile.found::after{content:"";position:absolute;inset:-6px;border:3px solid #FFE27A;border-radius:50%;animation:scopering .45s ease-out}
@keyframes scopering{from{transform:scale(1.5);opacity:0}}
.wtile.nope{border-color:#FF6B6B;background:rgba(255,107,107,.2);animation:shake .4s}

/* Pelabuhan (asingkan) */
.dockcard{display:grid;place-items:center;min-height:80px;margin:0 auto 12px;max-width:420px;text-align:center;background:var(--note);border:3px solid var(--gold);border-radius:18px;padding:6px 14px;animation:pagein .3s}
.dockcard .ar{font-size:clamp(28px,7.5vw,38px);line-height:1.4}
.dockcard small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.dockcard.zip{transition:transform .4s ease-in,opacity .4s;transform:translateY(80px) scale(.3);opacity:0}
.docks{display:grid;gap:10px}
.docks.n2{grid-template-columns:1fr 1fr}.docks.n3{grid-template-columns:1fr 1fr 1fr}.docks.n4{grid-template-columns:1fr 1fr}
.dock{position:relative;border:0;border-radius:20px 20px 12px 12px;padding:10px 6px 12px;color:#fff;font-weight:800;font-size:15.5px;line-height:1.2;background:linear-gradient(180deg,var(--dc),color-mix(in srgb,var(--dc) 60%,#000));box-shadow:0 5px 0 color-mix(in srgb,var(--dc) 45%,#000);min-height:110px}
.dock .dl .ar{font-size:18px;line-height:1.4;display:block}
.dock .de{font-size:22px;display:block}
.dock.bounce{animation:pop .35s}
.dock:disabled{opacity:.65}
.dock .got{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:4px}
.dock .got i{font-style:normal;background:#fff;color:#1C1B3A;border-radius:8px;padding:0 6px;font-family:"Amiri",serif;font-size:16px;line-height:1.5;animation:pop .3s}
.dock .got i.x{outline:2px solid #FF6B6B}

/* Suis berhenti / sambung */
.gates{display:flex;flex-direction:column;gap:6px;direction:rtl;margin:0 0 12px}
.seg{background:var(--note);border:2px solid var(--gold);border-radius:14px;padding:2px 12px;text-align:center}
.seg .ar{font-size:clamp(19px,5vw,23px);line-height:1.6}
.seg small{display:block;direction:ltr;font-size:12.5px;color:var(--muted);font-weight:800}
html[dir="rtl"] .seg small{direction:rtl}
.sw2{align-self:center;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 16px;font-weight:800;font-size:16px;color:#fff;transition:background .2s;direction:ltr}
html[dir="rtl"] .sw2{direction:rtl}
.sw2.stop{background:#D63031}.sw2.go{background:#00B894}
.sw2:disabled{opacity:.9}
.gatechk{display:block;width:100%;margin-top:6px;border:0;border-radius:16px;padding:11px;background:var(--brand);color:var(--brand-ink);font-size:19px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}

/* Susun & memori */
.slots{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:7px}
.slot{display:flex;gap:10px;align-items:center;min-height:46px;border:2px dashed var(--line);border-radius:14px;padding:6px 12px;line-height:1.25}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);font-weight:700;animation:pop .3s ease}
.slot.filled .n{background:var(--ok);color:#fff}

/* ============ BUNYI & SUARA ============ */
let actx;
function tone(freqs, dur=0.12, type="sine"){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sfx = { ok:()=>tone([660,880]), bad:()=>tone([240,180],0.15,"triangle"), tap:()=>tone([520],0.06,"triangle"), zap:()=>tone([1200,700,400],0.05,"square"), launch:()=>tone([200,300,450,700,1000],0.06), beep:()=>tone([880],0.05), win:()=>tone([523,659,784,1047],0.14) };
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voiceMs = null, voiceAr = null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voiceMs = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; voiceAr = vs.find(v=>/^ar/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function say(text, ar){
  if(!ttsOK || !text) return;
  try{
    speechSynthesis.cancel();
    const t = ar ? String(text).replace(/[؟?_]+/g,"") : String(text).replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/[“”…]/g,"").replace(/[؀-ۿ]+/g,"").replace(/\p{Extended_Pictographic}/gu,"");
    const u = new SpeechSynthesisUtterance(t);
    const v = ar ? voiceAr : voiceMs;
    u.lang = v ? v.lang : (ar ? "ar-SA" : "ms-MY");
    if(v) u.voice = v;
    u.rate = ar ? 0.7 : 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
const speakAr = t => say(t, true);
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

  if(c.ar) body += `<div class="arbox"><button data-act="sayar" data-w="${c.ar}" style="all:unset;cursor:pointer;display:block"><span class="ar" lang="ar">${c.ar}</span></button>${c.src?`<small>${L(c.src)}</small>`:""}</div>`;
  if(c.mk) body += `<p class="maksud">${L(c.mk)}</p>`;

  app.innerHTML = `

    <div class="progress"><span style="width:${Math.round((run.c+1)/n*100)}%"></span></div>
    <div class="card page-in" style="--tc:${t.color}">
      ${body}
      <div class="navrow">
        <button class="secondary" data-act="cprev" aria-label="${tx("Kad sebelum","کد سبلوم")}" ${run.c===0?"disabled":""}>${isJ()?"▶":"◀"}</button>
        ${ttsOK&&run.say?`<button class="pill" data-act="say" style="padding:9px 12px">🔊 ${tx("Dengar","دڠر")}</button>`:"<span></span>"}
        <button class="primary" data-act="cnext">${run.c+1<n?tx("Seterusnya","ستروسڽ"):tx("Mula Misi","مولا ميسي")} ${isJ()?"◀":"▶"}</button>
      </div>
      <div class="dots" aria-hidden="true">${[...Array(n)].map((_,i)=>`<i class="${i===run.c?"on":""}"></i>`).join("")}</div>

}

/* ============ CABARAN ============ */
function startPlay(){
  const src = run.station==="final" ? FINAL.qs : LESSONS[+run.station].qs;
  run = Object.assign(run, {qs:shuffle(src), i:0, score:0, crystal:0, streak:0});
  showQ();
}
function qTitle(){
  if(run.station==="final") return `${L(FINAL.title)}<small>${L(FINAL.sub)}</small>`;
  const t = LESSONS[+run.station];
  return `${tx("Pelajaran","ڤلاجرن")} ${t.id}<small>${L(t.title)}</small>`;
}
const METX = [6,30,54,76,18,42,66,86,10];

function showQ(){
  stopAnims();
  const q = run.qs[run.i];
  run.q = q; run.done = false; run.mist = 0;
  run.say = R(q.q);
  let body = "";
  switch(q.type){
    case "mouth":
      body = `${q.letter?`<div class="lettercard"><button data-act="sayar" data-w="${q.letter}" style="all:unset;cursor:pointer"><span class="ar" lang="ar">${q.letter}</span></button></div>`:""}
        <div class="mouth" id="mbox">${mouthSVG(q.zones,true)}<span class="cap" id="mcap" style="display:none"></span></div>
        <p class="hint">👆 ${tx("Tekan titik pada rajah.","تکن تيتيق ڤد راجه.")}</p>`;
      break;
    case "rocket":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      if(!run.opts.some(o=>isAr(o.t))) run.say += ". " + run.opts.map(o=>R(o.t)).join(". ");
      body = `<div class="rockets">${run.opts.map((o,k)=>`<button class="rbtn" data-act="rk" data-k="${k}"><span class="rk" aria-hidden="true">🚀</span>${OPT(o.t)}</button>`).join("")}</div>`;
      break;
    case "rain": {
      run.left = q.items.filter(x=>x[1]).length;
      const n = q.items.length;
      body = `<p class="hint">${tx("Tekan meteor yang betul sebelum ia jatuh!","تکن ميتيور يڠ بتول سبلوم اي جاتوه!")} <span class="counter" id="mleft">☄️ ${run.left} ${tx("lagi","لاڬي")}</span></p>
        <div class="sky" id="sky">${shuffle(q.items.map((it,i)=>({it,i}))).map((o,k)=>{ const wide = Array.isArray(o.it[0]) || String(o.it[0]).length>3; return `<button class="met ${wide?"wide":""}" data-act="met" data-i="${o.i}" style="--x:${METX[k%METX.length]}%;--t:${6.5+k%3*1.2}s;--d:-${(k/n)*7}s"><span class="rock">${OPT(o.it[0])}</span></button>`; }).join("")}</div>`;
      break; }
    case "hunt":
      run.left = q.words.filter(x=>x[1]).length;
      body = `<p class="hint">${tx("Tekan semua kalimah yang betul.","تکن سموا کليمه يڠ بتول.")} <span class="counter" id="hleft">🔭 ${run.left} ${tx("lagi","لاڬي")}</span></p>
        <div class="scope">${shuffle(q.words.map((w,i)=>({w,i}))).map(o=>`<button class="wtile" data-act="word" data-i="${o.i}"><span class="ar" lang="ar">${o.w[0]}</span></button>`).join("")}</div>`;
      break;
    case "sort":
      run.queue = shuffle(q.items); run.si = 0;
      body = `<div class="dockcard" id="dc"></div>
        <div class="docks n${q.l.length}" dir="rtl">${q.l.map(([a,m,c],k)=>`<button class="dock" style="--dc:${c}" data-act="dock" data-g="${k}" id="dk${k}"><span class="de" aria-hidden="true">🛰️</span><span class="dl"><span class="ar" lang="ar">${a}</span>${L(m)}</span><span class="got" id="dg${k}"></span></button>`).join("")}</div>`;
      break;
    case "gate":
      run.sw = q.target.map(()=> q.target.every(x=>x==="+") ? "-" : "+");
      body = `<p class="hint">⏸️ ${tx("berhenti","برهنتي")} • ➡️ ${tx("sambung","سمبوڠ")} — ${tx("tekan suis untuk menukar","تکن سوءيس اونتوق منوکر")}</p>
        <div class="gates">${q.segs.map(([a,m],i)=>`<div class="seg"><span class="ar" lang="ar">${a}</span><small>${L(m)}</small></div>${i<q.segs.length-1?`<button class="sw2" data-act="sw" data-i="${i}" id="sw${i}"></button>`:""}`).join("")}</div>
        <button class="gatechk" data-act="gatechk">✔ ${tx("Semak","سيمق")}</button>`;
      break;
    case "order":
      run.next = 0;
      body = `<p class="hint">${tx("Tekan mengikut urutan, bermula dengan yang pertama.","تکن مڠيکوت اوروتن، برمولا دڠن يڠ ڤرتام.")}</p>
        <ol class="slots">${q.items.map((_,i)=>`<li class="slot" id="s${i}"><span class="n">${i+1}</span><span class="st">🪐</span></li>`).join("")}</ol>
        <div class="chips">${shuffle(q.items.map((t,i)=>({t,i}))).map(o=>`<button class="chip" data-act="ord" data-i="${o.i}">${OPT(o.t)}</button>`).join("")}</div>`;
      break;
    case "memory": {
      const cards = shuffle(q.pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}]));
      run.mem = {first:null, lock:false, found:0, cards};
      body = `<p class="hint">${tx("Terbalikkan dua planet. Cari pasangannya!","تربالقکن دوا ڤلانيت. چاري ڤاسڠنڽ!")}</p>
        <div class="memo">${cards.map((c,k)=>`<button class="mcard" data-act="mem" data-k="${k}" aria-label="${tx("Planet","ڤلانيت")} ${k+1}"><span class="bk" aria-hidden="true">🪐</span><span class="fc">${OPT(c.t)}</span></button>`).join("")}</div>`;
      break; }
    case "tf":
      body = `<div class="radar"><span>${L(q.q)}</span></div>
        <div class="tfrow"><button class="yes" data-act="tf" data-v="1"><span aria-hidden="true">✅</span>${tx("Betul","بتول")}</button><button class="no" data-act="tf" data-v="0"><span aria-hidden="true">❌</span>${tx("Salah","ساله")}</button></div>`;
      break;
  }
  const tag = q.tag ? `<span class="tag">${P(q.tag)}</span>` : "";
  const pct = Math.round(run.i/run.qs.length*100);
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="${tx("Kembali","کمبالي")}">${BACK()}</button><h2>${qTitle()}</h2><span class="pillstat">${CRYSTAL} ${run.crystal}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${run.qs.length}" aria-valuenow="${run.i}"><span style="width:${pct}%"></span><i style="${isJ()?"right":"left"}:${pct}%" aria-hidden="true">🚀</i></div>
    <div class="card page-in">
      <div class="qmeta"><span><span class="qtype">${(isJ()?TYPE_J:TYPE_R)[q.type]}</span>${tag}</span><span style="display:flex;gap:6px;align-items:center"><span style="color:var(--muted);font-size:15px">${run.i+1}/${run.qs.length}</span>${ttsOK?`<button class="pill" data-act="say" aria-label="${tx("Dengar soalan","دڠر سوالن")}">🔊</button>`:""}</span></div>
      ${q.type==="tf"?"":`<p class="qtext">${L(q.q)}</p>`}
      ${body}
      <div id="fb" aria-live="polite"></div>
    </div>`;
  if(q.type==="sort") showDock();
  if(q.type==="gate") drawSwitches();
}

function finishQ(ok, extra=""){
  run.done = true;
  if(ok){ run.score++; run.crystal++; run.streak++; } else run.streak = 0;
  const q = run.q, last = run.i+1 >= run.qs.length;
  const title = ok ? (run.mist ? tx("Bagus, hampir sempurna!","باڬوس، همڤير سمڤورنا!") : pick(isJ()?PRAISE_J:PRAISE_R)) : tx("Tidak mengapa, mari belajar!","تيدق مڠاڤ، ماري بلاجر!");
  $("fb").innerHTML = `<div class="feedback">${mascot(ok?"happy":"sad")}<div><strong>${title}</strong>${ok?`<span class="streak">+1 ${tx("kristal","کريستل")} 💎</span> `:""}${ok&&run.streak>=3?`<span class="streak">🔥 ${run.streak} ${tx("berturut-turut!","برتوروت٢!")}</span>`:""}<br>${extra}${L(q.e)}<div class="ref">📖 ${tx("Rujuk buku teks ms.","روجوق بوکو تيکس م.س.")} ${q.p}</div></div></div>
    <button class="primary" data-act="next">${last?tx("Lihat keputusan","ليهت کڤوتوسن"):tx("Soalan seterusnya","سوالن ستروسڽ")}</button>`;
  ok ? sfx.ok() : sfx.bad();
  const b = $("fb").querySelector(".primary"); b.focus({preventScroll:true}); b.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
}

/* Tunjuk makhraj */
function ansZone(k){
  if(run.done) return;
  const q = run.q, ok = k===q.target;
  const box = $("mbox");
  box.querySelectorAll(".hs").forEach(h=>h.removeAttribute("data-act"));
  $("hs-"+q.target).classList.add("on");
  if(!ok){ const h=$("hs-"+k); h.classList.add("bad"); }
  box.classList.add("sound"); soundWaves(q.target);
  const cap = $("mcap"); cap.style.display = ""; cap.innerHTML = `${L(ZONES[q.target].n)} • <span class="ar" lang="ar">${ZONES[q.target].h}</span>`;
  if(q.letter) speakAr(q.letter);
  finishQ(ok, ok?"":`${tx("Makhraj yang betul:","مخرج يڠ بتول:")} <b>${L(ZONES[q.target].n)}</b>. `);
}
/* Roket */
function ansRocket(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".rbtn")];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  sfx.launch();
  if(ok) btns[k].classList.add("ok");
  else { btns[k].classList.add("bad"); setTimeout(()=>btns[right].classList.add("ok"), 500); }
  hush(); finishQ(ok);
}
/* Hujan meteor */
function ansMet(b){
  if(run.done || b.disabled) return;
  const it = run.q.items[+b.dataset.i];
  b.disabled = true;
  if(it[1]){
    sfx.zap(); sparkle(b,"💥"); b.classList.add("boom"); run.left--;
    if(isAr(it[0])) speakAr(it[0]);
    $("mleft").textContent = `☄️ ${run.left} ${tx("lagi","لاڬي")}`;
    if(run.left===0){
      app.querySelectorAll(".met").forEach(x=>x.disabled=true);
      setTimeout(()=>finishQ(run.mist<=1, run.mist?`${tx("Meteor kelabu bukan jawapan.","ميتيور کلابو بوکن جواڤن.")} `:""), 500);
    }
  } else { run.mist++; sfx.bad(); b.classList.add("nope"); }
}
/* Teropong */
function ansWord(b){
  if(run.done || b.disabled) return;
  const w = run.q.words[+b.dataset.i];
  b.disabled = true;
  speakAr(w[0]);
  if(w[1]){
    sfx.beep(); b.classList.add("found"); run.left--;
    $("hleft").textContent = `🔭 ${run.left} ${tx("lagi","لاڬي")}`;
    if(run.left===0){ app.querySelectorAll(".wtile").forEach(x=>x.disabled=true); setTimeout(()=>finishQ(run.mist<=1),400); }
  } else { run.mist++; sfx.bad(); b.classList.add("nope"); }
}
/* Stesen angkasa */
function showDock(){
  const it = run.queue[run.si], c = $("dc"); if(!c) return;
  c.className = "dockcard"; void c.offsetWidth;
  c.innerHTML = `<button data-act="sayar" data-w="${it[0]}" style="all:unset;cursor:pointer"><span class="ar" lang="ar">${it[0]}</span></button><small>${run.queue.length-run.si} ${tx("lagi","لاڬي")}</small>`;
}
function ansDock(g){
  if(run.done || run.busy) return;
  const it = run.queue[run.si], ok = g===it[1];
  run.busy = true;
  if(ok) sfx.tap(); else { run.mist++; sfx.bad(); }
  $("dc").classList.add("zip");
  const dk = $("dk"+it[1]); dk.classList.remove("bounce"); void dk.offsetWidth; dk.classList.add("bounce");
  $("dg"+it[1]).insertAdjacentHTML("beforeend", `<i class="${ok?"":"x"}">${ok?"":"❗"}${it[0]}</i>`);
  setTimeout(()=>{
    run.busy = false; run.si++;
    if(run.si>=run.queue.length){
      $("dc").className="dockcard"; $("dc").innerHTML = tx("Siap! ✔️","سياڤ! ✔️");
      app.querySelectorAll(".dock").forEach(b=>b.disabled=true);
      finishQ(run.mist<=1, run.mist?tx("Huruf bertanda ❗ telah dihantar ke stesen yang betul. ","حروف برتندا ❗ تله دهنتر ک ستيسين يڠ بتول. "):"");
    } else showDock();
  }, ok?380:650);
}
/* Berhenti / sambung */
function drawSwitches(){
  run.sw.forEach((s,i)=>{ const b=$("sw"+i); b.className = "sw2 "+(s==="-"?"stop":"go"); b.innerHTML = s==="-" ? `⏸️ ${tx("Berhenti","برهنتي")}` : `➡️ ${tx("Sambung","سمبوڠ")}`; });
}
function ansGate(){
  if(run.done) return;
  const ok = run.sw.every((s,i)=>s===run.q.target[i]);
  app.querySelectorAll(".sw2,.gatechk").forEach(b=>b.disabled=true);
  if(!ok){ run.sw = run.q.target.slice(); drawSwitches(); }
  finishQ(ok, ok?"":`${tx("Suis telah ditukar kepada jawapan yang betul.","سوءيس تله دتوکر کڤد جواڤن يڠ بتول.")} `);
}
/* Susun */
function ansOrder(b){
  if(run.done) return;
  const i = +b.dataset.i;
  if(i===run.next){
    sfx.tap();
    const s=$("s"+i); s.classList.add("filled"); s.querySelector(".st").innerHTML = OPT(run.q.items[i]);
    b.remove(); run.next++;
    if(run.next===run.q.items.length) finishQ(run.mist<=1);
  } else { run.mist++; sfx.bad(); app.querySelectorAll(".chip.shake").forEach(x=>x.classList.remove("shake")); void b.offsetWidth; b.classList.add("shake"); }
}
/* Memori */
function ansMem(b){
  const m = run.mem;
  if(run.done || m.lock || b.classList.contains("flip")) return;
  sfx.tap(); b.classList.add("flip");
  const k = +b.dataset.k;
  if(m.first===null){ m.first = k; return; }
  const a = m.first; m.first = null;
  const A = app.querySelector(`.mcard[data-k="${a}"]`);
  if(m.cards[a].i === m.cards[k].i){
    [A,b].forEach(x=>{ x.classList.add("done"); x.disabled = true; });
    m.found++; setTimeout(()=>sfx.ok(),200);
    if(m.found===run.q.pairs.length) setTimeout(()=>finishQ(run.mist<=run.q.pairs.length+1, run.mist?`${tx("Cubaan tersilap:","چوباٴن ترسيلڤ:")} ${run.mist}. `:""),400);
  } else {
    run.mist++; m.lock = true;
    setTimeout(()=>{ A.classList.remove("flip"); b.classList.remove("flip"); m.lock = false; }, 950);
  }
}
/* Radar */
function ansTF(btn){
  if(run.done) return;
  app.querySelectorAll(".tfrow button").forEach(b=>b.disabled=true);
  btn.classList.add("picked");
  const ok = (btn.dataset.v==="1")===run.q.ans;
  hush(); finishQ(ok, `${tx("Jawapan:","جواڤن:")} <b>${run.q.ans?tx("Betul","بتول"):tx("Salah","ساله")}</b>. `);
}

function nextQ(){
  run.i++;
  if(run.i < run.qs.length){ showQ(); window.scrollTo(0,0); }
  else finishRound();
}
function finishRound(){
  stopAnims();
  const isFinal = run.station==="final";
  const key = isFinal ? "final" : LESSONS[+run.station].id;
  const n = run.qs.length, s = run.score, pct = s/n;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0;
  const wasFinalOpen = finalUnlocked();
  const nextIdx = isFinal ? -1 : +run.station+1;
  const wasNextOpen = nextIdx>0 && nextIdx<LESSONS.length ? unlocked(nextIdx) : true;
  const prev = best[key];
  if(stars>prev){ best[key]=stars; save("j3-best",best); }
  crystals += run.crystal; save("j3-kristal",crystals);
  const msgs = [];
  if(nextIdx>0 && nextIdx<LESSONS.length && !wasNextOpen && unlocked(nextIdx)) msgs.push(tx(`🚀 Roket boleh terbang ke ${L(LESSONS[nextIdx].planet)}!`,`🚀 روکيت بوليه تربڠ ک ${L(LESSONS[nextIdx].planet)}!`));
  if(!isFinal && !wasFinalOpen && finalUnlocked()) msgs.push(tx("🌟 Bintang Tajwid kini dibuka!","🌟 بينتڠ تجويد کيني دبوک!"));
  const titles = isJ() ? ["جوم چوبا سکالي لاڬي","بوليه چوبا لاڬي","باڬوس!","چمرلڠ!"] : ["Jom cuba sekali lagi","Boleh cuba lagi","Bagus!","Cemerlang!"];
  const label = isFinal ? L(FINAL.title) : `${tx("Pelajaran","ڤلاجرن")} ${key}: ${L(LESSONS[+run.station].title)}`;
  app.innerHTML = `
    <div class="card result page-in" style="margin-top:18px">
      ${mascot(stars>=2?"happy":"idle")}
      <p style="margin:4px 0 0">${label}</p>
      <div class="stars" role="img" aria-label="${stars} / 3">${starsHTML(stars)}</div>
      <h2>${titles[stars]}</h2>
      <p>${tx(`Kamu menjawab ${s} daripada ${n} soalan dengan betul.`,`کامو منجواب ${s} درڤد ${n} سوالن دڠن بتول.`)}</p>
      <div class="earned">+${run.crystal} ${CRYSTAL} ${tx("kristal","کريستل")}</div>
      ${stars>prev?`<p>${tx("Rekod baharu!","ريکود بهارو!")}</p>`:""}
      ${stars===0?`<p>${tx("Dapatkan sekurang-kurangnya 1 bintang (separuh betul) untuk terbang ke planet seterusnya. Cuba “Tonton & Dengar” dahulu.","داڤتکن سکورڠ٢ڽ 1 بينتڠ (سڤاروه بتول) اونتوق تربڠ ک ڤلانيت ستروسڽ. چوبا “تونتون & دڠر” دهولو.")}</p>`:""}
      ${msgs.map(m=>`<div class="unlock">${m}</div>`).join("<br>")}
      ${isFinal&&stars===3?`<div class="unlock">🏆 ${tx("Tahniah! Kamu juara Tajwid Tahun 3!","تهنية! کامو جوارا تجويد تاهون 3!")}</div>`:""}
      <button class="primary" data-act="map">${tx("Kembali ke angkasa","کمبالي ک اڠکاس")} 🚀</button>
      <button class="secondary" data-act="again">${tx("Main lagi","ماٴين لاڬي")}</button>
    </div>`;
  sfx.win();
  if(stars===3) rain();
  window.scrollTo(0,0);
}
function rain(){
  if(REDUCED) return;
  const box = document.createElement("div"); box.className = "rain";
  for(let i=0;i<28;i++){
    const s = document.createElement("span");
    s.textContent = pick(["⭐","🌟","💎","🪐","🚀","✨"]);
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (2+Math.random()*2)+"s";
    s.style.animationDelay = (Math.random()*0.8)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4500);
}

/* ============ PERISTIWA ============ */
function handle(b){
  switch(b.dataset.act){
    case "mute": muted=!muted; save("j3-muted",muted); b.textContent=muted?"🔇":"🔊"; b.setAttribute("aria-label",muted?"Hidupkan bunyi":"Matikan bunyi"); if(muted) hush(); break;
    case "lang": lang = isJ() ? "rumi" : "jawi"; save("kafa-lang",lang); applyLang(); renderMap(); break;
    case "teacher": teacher=!teacher; save("j3-teacher",teacher); renderMap(); break;
    case "map": renderMap(); window.scrollTo(0,0); break;
    case "station": openStation(b.dataset.i); break;
    case "station-back": openStation(run.station); break;
    case "read": startRead(); window.scrollTo(0,0); break;
    case "cprev": if(run.c>0){ run.c--; showCard(); } break;
    case "cnext": { const n=LESSONS[+run.station].cards.length; if(run.c+1<n){ run.c++; showCard(); } else startPlay(); window.scrollTo(0,0); break; }
    case "play": startPlay(); window.scrollTo(0,0); break;
    case "say": if(run && run.say) say(run.say); break;
    case "sayar": speakAr(b.dataset.w); break;
    case "zone": ansZone(b.dataset.z); break;
    case "rk": ansRocket(+b.dataset.k); break;
    case "met": ansMet(b); break;
    case "word": ansWord(b); break;
    case "dock": ansDock(+b.dataset.g); break;
    case "sw": if(!run.done){ const i=+b.dataset.i; run.sw[i] = run.sw[i]==="-"?"+":"-"; sfx.tap(); drawSwitches(); } break;
    case "gatechk": ansGate(); break;
    case "ord": ansOrder(b); break;
    case "mem": ansMem(b); break;
    case "tf": ansTF(b); break;
    case "next": nextQ(); break;
    case "again": startPlay(); window.scrollTo(0,0); break;
  }
}
app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  handle(b);
});
app.addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("g.hs[data-act]")){ e.preventDefault(); handle(e.target); }
});

applyLang();
renderMap();
</script>
