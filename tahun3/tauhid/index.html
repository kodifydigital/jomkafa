<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B5A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<title>Kembara Lautan Iman • Tauhid Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F5FA; --surface:#FFFFFF; --ink:#12303D; --muted:#4F6B78; --line:#CDE4EC;
  --brand:#0E7C9B; --brand-ink:#FFFFFF; --brand-shadow:#095A71; --gold:#E8A317; --coral:#F06A5B;
  --ok:#1F8A50; --ok-bg:#DDF3E5; --bad:#C8452F; --bad-bg:#FBE1DC; --note:#FFF4D6;
  --pattern:rgba(14,124,155,.10);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071A2B; --surface:#0F2A40; --ink:#E6F3F8; --muted:#A3C1CE; --line:#1F4560;
    --brand:#3CC3E6; --brand-ink:#04202B; --brand-shadow:#1E8AA8; --gold:#F2C14E; --coral:#FF8A7A;
    --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#33301A;
    --pattern:rgba(60,195,230,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071A2B; --surface:#0F2A40; --ink:#E6F3F8; --muted:#A3C1CE; --line:#1F4560;
  --brand:#3CC3E6; --brand-ink:#04202B; --brand-shadow:#1E8AA8; --gold:#F2C14E; --coral:#FF8A7A;
  --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#33301A;
  --pattern:rgba(60,195,230,.08);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background-image:radial-gradient(circle at 50% 50%,var(--pattern) 3px,transparent 3.5px),radial-gradient(circle at 50% 50%,var(--pattern) 1.5px,transparent 2px);background-size:46px 46px,23px 23px;background-position:0 0,11px 17px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 44px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{max-width:100%}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:400;line-height:1.9}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
a.iconbtn{text-decoration:none;color:inherit}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.pillstat{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-weight:800;font-size:17px}
.pearl{width:20px;height:20px;flex:none}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.langbtn .ar{font-family:"Noto Naskh Arabic","Amiri",serif}

.hero{text-align:center;padding:8px 0 2px}
.hero .sub{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px}
.hero h1{margin:8px 0 0;font-size:clamp(32px,8.6vw,50px);line-height:1.02;font-weight:800;color:var(--brand)}
.hero p{margin:6px auto 0;color:var(--muted);max-width:470px}

/* ===== Lautan (peta) ===== */
.ocean{position:relative;margin:16px auto 0;max-width:540px;border-radius:30px;overflow:hidden;border:2px solid var(--line);
  background:linear-gradient(180deg,#9BE3F5 0%,#4FB9DF 9%,#1E86BC 30%,#14578F 55%,#0B2F5E 78%,#061632 100%)}
.ocean svg.route{position:absolute;inset:0;width:100%;height:100%}
.ocean .ray{position:absolute;top:60px;width:70px;height:520px;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent);transform-origin:top;filter:blur(2px);animation:ray 6s ease-in-out infinite;pointer-events:none}
@keyframes ray{50%{opacity:.35}}
.ocean .bub{position:absolute;bottom:-20px;width:var(--s);height:var(--s);border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);animation:rise var(--t) linear infinite;animation-delay:var(--d);pointer-events:none}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-1 * var(--h)))}}
.ocean .swim{position:absolute;font-size:26px;animation:swimx var(--t) linear infinite;animation-delay:var(--d);pointer-events:none}
@keyframes swimx{from{left:-12%}to{left:108%}}
.ocean .swim.l{animation-name:swiml}
@keyframes swiml{from{left:108%}to{left:-12%}}
.ocean .ship{position:absolute;left:50%;top:6px;width:120px;transform:translateX(-50%);animation:shipbob 3s ease-in-out infinite}
@keyframes shipbob{50%{transform:translate(-50%,4px) rotate(2deg)}}
.ocean .waves{position:absolute;left:0;right:0;top:44px;height:30px}
.ocean .floor{position:absolute;left:0;right:0;bottom:0;height:120px}
.ocean .depth{position:absolute;transform:translateY(-50%);font-size:12px;font-weight:800;color:rgba(255,255,255,.75);background:rgba(0,0,0,.25);border-radius:999px;padding:0 8px;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;width:176px;text-align:center}
.node .port{position:relative;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc));box-shadow:0 0 0 6px #C8923C,0 0 0 9px #8A5A24,0 8px 16px rgba(0,0,0,.35);transition:transform .1s}
.node:active .port{transform:scale(.95)}
.node .num{position:absolute;top:-10px;right:-10px;background:var(--gold);color:#2A1B00;border-radius:999px;font-size:14px;font-weight:800;min-width:28px;height:28px;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 0 #9A6A0A}
.node .gem{position:absolute;bottom:-8px;left:-8px;font-size:24px;animation:gem 2s ease-in-out infinite}
@keyframes gem{50%{transform:translateY(-3px) rotate(-8deg)}}
.node .lbl{font-weight:800;font-size:15px;line-height:1.15;margin-top:12px;background:var(--surface);border-radius:14px;padding:4px 10px;border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.node .lbl small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.node .st{font-size:14px;letter-spacing:1px;background:rgba(0,0,0,.3);border-radius:999px;padding:0 8px;margin-top:3px}
.node .st .off{opacity:.3;filter:grayscale(1)}
.node.locked .port{background:radial-gradient(circle at 35% 30%,#5C7A8A,#2C4352);font-size:30px}
.node.locked .lbl{opacity:.75}
.node.current .port{animation:sonar 2s ease-out infinite}
@keyframes sonar{0%{box-shadow:0 0 0 6px #C8923C,0 0 0 9px #8A5A24,0 0 0 9px rgba(255,255,255,.6)}100%{box-shadow:0 0 0 6px #C8923C,0 0 0 9px #8A5A24,0 0 0 34px rgba(255,255,255,0)}}
.subm{position:absolute;width:92px;transform:translate(-50%,-50%);pointer-events:none;animation:subbob 2.6s ease-in-out infinite}
@keyframes subbob{50%{margin-top:-6px}}
.subm .prop{animation:spin .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:scaleY(-1)}}
.teacher{display:flex;justify-content:center;margin-top:20px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700}
.toggle .sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--brand)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.foot{margin-top:16px;color:var(--muted);font-size:15px;text-align:center}

/* ===== Stesen ===== */
.banner{border-radius:26px;padding:18px 18px 20px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 80%,#fff),var(--tc) 60%,color-mix(in srgb,var(--tc) 70%,#000));color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.banner .kick{font-weight:700;opacity:.92;font-size:16px}
.banner h2{margin:0;font-size:clamp(25px,6.4vw,33px);line-height:1.12}
.banner .big{position:absolute;inset-inline-end:-4px;bottom:-12px;font-size:92px;opacity:.25}
.banner .stars{margin-top:6px;font-size:20px}
.banner .stars .off{opacity:.35;filter:grayscale(1)}
.banner .chip{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 12px;font-weight:700;font-size:15px}
.banner .bb{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.45);animation:rise 5s linear infinite;--h:220px;bottom:-30px}
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.units li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;line-height:1.25}
.units .u{background:var(--tc);color:#fff;border-radius:10px;font-size:13px;font-weight:800;padding:2px 8px;flex:none}
.actions{display:grid;gap:12px;margin-top:18px}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:0;border-radius:20px;padding:14px 16px;font-weight:800;font-size:21px;line-height:1.15}
.bigbtn small{display:block;font-weight:600;font-size:15px;opacity:.9}
.bigbtn .e{font-size:34px;flex:none}
.bigbtn.read{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.bigbtn.play{background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-shadow)}
.bigbtn:active{transform:translateY(3px)}

/* ===== Umum ===== */
.gamehead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.gamehead h2{margin:0;font-size:20px;flex:1;line-height:1.15;color:var(--brand)}
.gamehead h2 small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.progress{position:relative;height:14px;background:var(--line);border-radius:99px;overflow:visible;margin:4px 0 16px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#3CC3E6,#0E7C9B);border-radius:99px;transition:width .3s}
.progress i{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:22px;transition:left .3s}
html[dir="rtl"] .progress i{transform:translate(50%,-50%) scaleX(-1)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.page-in{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qtype{display:inline-block;background:var(--note);border-radius:999px;padding:1px 12px;font-size:14.5px;font-weight:700}
.tag{display:inline-block;background:var(--gold);color:#2A1B00;border-radius:999px;padding:1px 10px;font-size:13.5px;font-weight:800;margin-inline-start:4px}
.pill{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.qtext{font-size:clamp(20px,4.8vw,25px);font-weight:700;line-height:1.32;margin:4px 0 14px}
.hint{color:var(--muted);font-size:15.5px;margin:-6px 0 12px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.06)}}
.counter{display:inline-block;background:var(--note);border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}

/* Peti harta */
.chests{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chest{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:8px 8px 10px;font-weight:700;font-size:16.5px;line-height:1.25;box-shadow:0 4px 0 var(--line)}
.chest:active{transform:translateY(3px)}
.chest svg{width:78px;height:62px;overflow:visible}
.chest .lid{transition:transform .5s cubic-bezier(.3,1.5,.5,1);transform-box:view-box;transform-origin:8px 30px}
.chest .inside{transition:transform .5s .15s;transform-box:view-box}
.chest.open .lid{transform:rotate(-38deg)}
.chest.open .inside{transform:translateY(-22px)}
.chest .ar{font-size:21px;line-height:1.6}
.chest.ok{border-color:var(--ok);background:var(--ok-bg)}
.chest.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Pancing */
.sea{position:relative;height:290px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#7ED6F0,#2386C0 55%,#135A8E);margin-bottom:6px}
.sea::before{content:"";position:absolute;inset:auto 0 0 0;height:36px;background:radial-gradient(ellipse at 20% 100%,#E9D7A6 30%,transparent 31%),radial-gradient(ellipse at 70% 100%,#E3CC92 35%,transparent 36%),linear-gradient(transparent 60%,#D9C38C 60%)}
.sea .boat{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:30px}
.fish{position:absolute;left:-45%;top:var(--y);height:50px;padding:0 18px 0 30px;border:0;border-radius:60% 45% 45% 60% / 50%;background:var(--fc);color:#fff;font-weight:800;font-size:15px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset -8px -6px 0 rgba(0,0,0,.12);animation:swim var(--s) linear infinite;animation-delay:var(--d)}
.fish::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);border:13px solid transparent;border-left:20px solid var(--fc);border-right:0}
.fish::after{content:"";position:absolute;right:11px;top:14px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:inset 2px 1px 0 2px #12303D}
html[dir="rtl"] .fish{padding:0 30px 0 18px}
@keyframes swim{from{left:-45%}to{left:104%}}
.fish.caught{animation-play-state:paused;transition:transform .7s cubic-bezier(.5,-0.4,.6,1),opacity .7s;transform:translateY(-260px) rotate(-25deg);opacity:0;pointer-events:none}
.fish.nope{background:#7C8C96;--fc:#7C8C96;animation-duration:4s!important;opacity:.75}
.hookline{position:absolute;top:0;width:2px;background:#fff;opacity:.9;transition:height .25s;pointer-events:none}

/* Timbang */
.scalebox{position:relative}
.scalebox svg{display:block;width:100%;height:auto}
.scalebox .beam{transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-box:view-box;transform-origin:150px 40px}
.scalebox .pan{transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.weight{display:grid;place-items:center;min-height:74px;margin:0 auto 8px;max-width:420px;text-align:center;background:var(--note);border:3px solid var(--gold);border-radius:16px;padding:8px 12px;font-weight:800;font-size:clamp(18px,4.6vw,22px);line-height:1.25;animation:pagein .3s}
.weight small{display:block;font-size:13px;color:var(--muted)}
.weight.dropL{transition:transform .4s ease-in,opacity .4s;transform:translate(-30%,60px) scale(.5);opacity:0}
.weight.dropR{transition:transform .4s ease-in,opacity .4s;transform:translate(30%,60px) scale(.5);opacity:0}
.swbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swbtn{border:0;border-radius:18px;padding:12px 8px;font-size:19px;font-weight:800;color:#fff;line-height:1.15}
.swbtn span{display:block;font-size:24px}
.swbtn.s0{background:#0E7C9B;box-shadow:0 5px 0 #095A71}
.swbtn.s1{background:#D1495B;box-shadow:0 5px 0 #973341}
.swbtn:active{transform:translateY(3px)}
.swbtn:disabled{opacity:.45}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bins div{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;justify-content:center}
.bins i{font-style:normal;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;animation:pop .3s}
.bins i.x{border-color:var(--bad)}

/* Teka siapa */
.clues{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.clues li{display:flex;gap:10px;align-items:center;border-radius:14px;padding:8px 12px;font-weight:700;line-height:1.3}
.clues li.on{background:var(--note);border:2px solid var(--gold);animation:pagein .4s}
.clues li.off{border:2px dashed var(--line);color:var(--muted)}
.clues .n{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#2A1B00;display:grid;place-items:center;font-weight:800;flex:none}
.clues li.off .n{background:var(--line);color:var(--muted)}
.cluebtn{display:block;margin:0 auto 14px;border:2px solid var(--brand);color:var(--brand);background:transparent;border-radius:999px;padding:6px 16px;font-weight:800;font-size:16px}
.cluebtn:disabled{opacity:.4}
.guesses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.guess{min-height:58px;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:8px;font-size:18px;font-weight:800;line-height:1.25;box-shadow:0 4px 0 var(--line)}
.guess.ok{border-color:var(--ok);background:var(--ok-bg)}
.guess.bad{border-color:var(--bad);background:var(--bad-bg)}
.bonus{display:inline-block;background:var(--gold);color:#2A1B00;border-radius:999px;padding:0 10px;font-weight:800;font-size:14px;margin-inline-start:6px}

/* Garis padan */
.lines{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 40px}
.lines .col{display:grid;gap:10px;align-content:start}
.lines svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lines path{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .45s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.lbtn{position:relative;z-index:1;width:100%;min-height:54px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 10px;font-size:16.5px;font-weight:700;line-height:1.2;box-shadow:0 3px 0 var(--line)}
.lbtn .ar{font-size:20px;line-height:1.5}
.lbtn.sel{border-color:var(--gold);background:var(--note);outline:3px solid var(--gold);outline-offset:1px}
.lbtn.done{color:#fff;border-color:transparent;box-shadow:none;animation:pop .3s}
.lbtn .dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateY(-50%)}

/* Susun kalimah */
.sentence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px;background:var(--note);border:2px dashed var(--gold);border-radius:16px;padding:10px;margin-bottom:14px}
.wslot{min-width:56px;border-bottom:3px dashed color-mix(in srgb,var(--gold) 70%,transparent);text-align:center;color:var(--muted)}
.wslot.f{border-bottom:3px solid var(--ok);color:var(--ink);animation:pop .3s}
.wslot .ar,.wbub .ar{font-size:24px;line-height:1.6}
.wbubs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wbub{border:2px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,#E9FBFF,#8FDCF0 60%,#4FB9DF);color:#0B2F45;border-radius:999px;padding:6px 18px;font-weight:800;font-size:18px;box-shadow:inset -4px -6px 0 rgba(0,0,0,.08),0 4px 0 rgba(14,124,155,.3);animation:wob 3s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wob{50%{transform:translateY(-5px)}}
.wbub.shake{animation:shake .4s;background:var(--bad-bg)}
.wbub.gone{visibility:hidden}

/* Betul / salah */
.tfbubble{position:relative;margin:4px auto 16px;max-width:460px;text-align:center;background:radial-gradient(circle at 30% 25%,#FFFFFF,#D9F4FB 55%,#A8E3F2);color:#0B2F45;border-radius:40px;padding:22px 20px;font-size:clamp(19px,4.8vw,23px);font-weight:800;line-height:1.35;box-shadow:inset -10px -12px 0 rgba(14,124,155,.12),0 6px 0 rgba(14,124,155,.25);animation:wob 3.4s ease-in-out infinite}
.tfbubble.popit{animation:burst .45s ease forwards}
@keyframes burst{40%{transform:scale(1.12)}100%{transform:scale(.9);opacity:.35}}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow button{border:0;border-radius:18px;padding:12px 8px;font-size:21px;font-weight:800;color:#fff;line-height:1.15}
.tfrow button span{display:block;font-size:28px}
.tfrow .yes{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.tfrow .no{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.tfrow button:disabled{opacity:.4}
.tfrow button.picked{opacity:1;outline:3px solid var(--gold);outline-offset:3px}

/* Susun (urutan) */
.slots{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:7px}
.slot{display:flex;gap:10px;align-items:center;min-height:46px;border:2px dashed var(--line);border-radius:14px;padding:6px 12px;line-height:1.25}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);font-weight:700;animation:pop .3s ease}
.slot.filled .n{background:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px;font-size:18px;font-weight:700;line-height:1.25;box-shadow:0 3px 0 var(--line)}
.chip.shake{border-color:var(--bad);background:var(--bad-bg)}

/* ===== Kad bacaan ===== */
.unitlbl{display:inline-block;background:var(--tc);color:#fff;border-radius:999px;padding:1px 12px;font-weight:800;font-size:14.5px;margin-bottom:6px}
.readtext{font-size:clamp(19px,4.4vw,22px);font-weight:600;line-height:1.5;margin:0 0 12px}
.arbox{background:var(--note);border:2px solid var(--gold);border-radius:16px;padding:8px 14px;margin:0 0 10px;text-align:center}
.arbox .ar{font-size:clamp(21px,5.2vw,27px);display:block}
.arbox small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.maksud{font-size:16.5px;color:var(--muted);font-weight:600;margin:-2px 0 12px;font-style:italic}
.rlist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;counter-reset:r}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:5px 10px;font-weight:700;line-height:1.3;animation:pagein .4s both;animation-delay:calc(var(--i) * 70ms)}
.rlist li::before{counter-increment:r;content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.tip{background:var(--note);border-radius:16px;padding:8px 12px;margin:0 0 12px;font-weight:600;font-size:17px}
.tip b{display:block;font-size:15px;color:var(--muted)}
.ref{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--muted)}
.navrow{display:grid;grid-template-columns:52px auto 1fr;gap:8px;align-items:center}
.navrow .secondary,.navrow .primary{margin:0;padding:11px 6px;font-size:18px}
.navrow .secondary:disabled{opacity:.35}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:99px}
.scene{border-radius:18px;overflow:hidden;aspect-ratio:2/1;margin:0 0 12px;position:relative}
.scene svg{display:block;width:100%;height:100%}
.seaweed{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(6deg)}}
.fishgo{animation:fishgo 12s linear infinite}
@keyframes fishgo{from{transform:translateX(-80px)}to{transform:translateX(400px)}}
.bubup{animation:bubup 4s linear infinite}
@keyframes bubup{from{transform:translateY(0);opacity:.9}to{transform:translateY(-190px);opacity:0}}
.turtle{animation:turt 9s ease-in-out infinite}
@keyframes turt{0%{transform:translate(-40px,0)}50%{transform:translate(160px,-14px)}100%{transform:translate(-40px,0)}}
/* Dialog */
.chat{display:grid;gap:8px;margin:0 0 12px}
.msg{display:flex;gap:8px;align-items:flex-end;animation:msgin .45s both;animation-delay:var(--d)}
.msg .who{font-size:30px;line-height:1;flex:none}
.msg .b{background:var(--bg);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:6px 12px;font-weight:600;line-height:1.35;max-width:82%}
html[dir="rtl"] .msg .b{border-radius:18px 18px 4px 18px}
.msg .b small{display:block;font-size:12.5px;font-weight:800;color:var(--muted)}
.msg.r{flex-direction:row-reverse}
.msg.r .b{background:color-mix(in srgb,var(--tc) 16%,var(--surface));border-color:color-mix(in srgb,var(--tc) 40%,var(--line));border-radius:18px 18px 4px 18px}
html[dir="rtl"] .msg.r .b{border-radius:18px 18px 18px 4px}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.95)}}
/* 25 rasul */
.r25{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 12px}
.r25 span{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#E9FBFF,#8FDCF0 60%,#3BAFD6);color:#0B2F45;font-weight:800;font-size:12.5px;line-height:1.05;text-align:center;animation:popin .4s both;animation-delay:calc(var(--i) * 70ms);box-shadow:0 3px 0 rgba(14,124,155,.35)}
.r25 span b{font-size:11px;opacity:.7}
.r25 span.hl{background:radial-gradient(circle at 30% 30%,#FFF6D8,#F6D27A 60%,#E8A317)}
@keyframes popin{from{opacity:0;transform:scale(.3)}70%{transform:scale(1.1)}}
html[dir="rtl"] .r25 span{font-size:13px}
/* Kerang ulul azmi */
.clam{position:relative;margin:0 0 12px;text-align:center}
.clam svg{width:100%;max-width:340px;height:auto}
.clam .top{animation:clamopen 1s .2s both;transform-box:view-box;transform-origin:40px 120px}
@keyframes clamopen{from{transform:rotate(0)}to{transform:rotate(-32deg)}}
.clam .pr{animation:popin .5s both}
/* Kad sifat (kerang berpusing) */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 12px;perspective:900px}
.flip{position:relative;height:150px}
.flip.big{height:200px;max-width:320px;margin:0 auto 12px}
.flip .in{position:absolute;inset:0;transform-style:preserve-3d;animation:flipy 7s ease-in-out infinite;animation-delay:var(--d)}
@keyframes flipy{0%,38%{transform:rotateY(0)}50%,88%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.flip .f,.flip .k{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:8px;text-align:center;font-weight:800;line-height:1.2}
.flip .f{background:radial-gradient(circle at 30% 25%,#FFF6D8,#F6D27A 55%,#D9951A);color:#3A2600}
.flip .k{transform:rotateY(180deg);background:radial-gradient(circle at 30% 25%,#D7E2EA,#8DA3B3 55%,#5A7284);color:#14232E}
.flip .t{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.8;margin-bottom:10px;line-height:1.2}
.flip .a{font-family:"Amiri",serif;font-size:30px;line-height:1.3;font-weight:700}
.flip.big .a{font-size:44px}
.flip .n{font-size:17px}
.flip .e{font-size:15px;font-weight:700;opacity:.85}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.cmp div{border-radius:16px;padding:10px;background:var(--bg);border:2px solid var(--line)}
.cmp h3{margin:0 0 6px;font-size:18px;text-align:center;color:var(--tc)}
.cmp ul{margin:0;padding-inline-start:18px;font-weight:600;font-size:16px;line-height:1.35}
.khatam{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;margin:4px 0 12px}
.khatam i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#9FD9EA);animation:popin .3s both;animation-delay:calc(var(--i) * 80ms)}
.khatam b{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--muted);animation:popin .6s both;animation-delay:2.1s}
.khatam b span{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FFF6D8,#F6D27A 55%,#E8A317);box-shadow:0 0 0 0 rgba(232,163,23,.6);animation:halo 1.8s 2.6s ease-out infinite}
@keyframes halo{to{box-shadow:0 0 0 18px rgba(232,163,23,0)}}

/* Maklum balas & keputusan */
.feedback{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;background:var(--note);font-size:17px;line-height:1.4}
.feedback .mascot{width:80px}
.feedback strong{display:block;font-size:21px}
.streak{display:inline-block;background:var(--gold);color:#3A2600;border-radius:999px;padding:0 10px;font-weight:800;font-size:15px;margin:2px 0 4px}
.primary{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:13px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-shadow)}
.secondary{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:transparent;border-radius:16px;padding:11px;font-size:18px;font-weight:700}
.result{text-align:center}
.result .mascot{width:130px;margin:0 auto}
.result .stars{font-size:54px;letter-spacing:6px;line-height:1.1;margin:4px 0}
.result .stars .off{filter:grayscale(1);opacity:.25}
.result h2{margin:4px 0 2px;font-size:32px;color:var(--brand)}
.result p{margin:0 0 6px;color:var(--muted)}
.unlock{display:inline-block;margin:8px 0 0;background:var(--note);border:2px solid var(--gold);border-radius:999px;padding:3px 14px;font-weight:800}
.earned{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:20px;margin:4px 0}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;bottom:-50px;font-size:28px;animation:float linear forwards}
@keyframes float{to{transform:translateY(-120vh) rotate(40deg)}}
.sparkle{position:fixed;pointer-events:none;font-size:26px;z-index:40;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translateY(-44px) scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
.mascot{display:block;height:auto;flex:none}
.mascot.happy{animation:hop .45s ease 2}
.mascot.sad{animation:tilt .9s ease}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes tilt{30%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rain,.ocean .bub,.ocean .swim{display:none}
  .sea{height:auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:44px 10px 46px}
  .fish{position:relative;left:auto!important;top:auto}
  .fish.caught{opacity:.25}
  .flip .in{transform:none}
}

let actx;
function tone(freqs, dur=0.12, type="sine"){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}

if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text){
  if(!ttsOK || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(/\ba\.s\./g,"alaihissalam").replace(/[“”…'’]/g,"").replace(/[؀-ۿ]+/g,""));
    u.lang = voice ? voice.lang : "ms-MY";
    if(voice) u.voice = voice;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

  for(let i=1;i<nodes.length;i++) d += ` C ${xs[i-1]} ${ys[i-1]+rowH*.55}, ${xs[i]} ${ys[i]-rowH*.55}, ${xs[i]} ${ys[i]}`;
  let current = LESSONS.findIndex(t=>best[t.id]<1);
  if(current<0) current = LESSONS.length;
  if(current<LESSONS.length && !unlocked(current)) current = -1;

      <span style="display:flex;gap:8px"><button class="langbtn" data-act="lang" aria-label="${tx("Tukar ke tulisan Jawi","Tukar ke tulisan Rumi")}">${isJ()?"Rumi":'<span class="ar">جاوي</span>'}</button>${muteBtn()}</span>

      <h1>${tx("Kembara Lautan Iman","کمبارا لاءوتن ايمان")}</h1>
      <p>${tx("Naik kapal selam bersama Pupu si Penyu! Lulus setiap zon untuk menyelam lebih dalam dan kumpul mutiara.","نايق کاڤل سلم برسام ڤوڤو سي ڤڽو! لولوس ستياڤ زون اونتوق مڽلم لبيه دالم دان کومڤول موتيارا.")}</p>

      <svg class="ship" viewBox="0 0 120 70" aria-hidden="true"><path d="M58 4 V44" stroke="#6B3E14" stroke-width="3"/><path d="M60 6 L92 40 H60Z" fill="#fff"/><path d="M56 10 L30 40 H56Z" fill="#F06A5B"/><path d="M58 4 l12 4 l-12 4Z" fill="#D1495B"/><path d="M14 44 H106 L94 62 H26Z" fill="#8B5A2B"/><rect x="26" y="50" width="68" height="3" fill="#E8B33A"/></svg>

      ${fish}

      ${nodeHTML}${sub}
    </div>
    <div class="teacher"><button class="toggle" data-act="teacher" aria-pressed="${teacher}"><span class="sw" aria-hidden="true"></span>${tx("Mod guru: buka semua zon","مود ڬورو: بوک سموا زون")}</button></div>
    <p class="foot">${tx("Kandungan berdasarkan Buku Teks Tauhid Tahun 3 (JAIS). Setiap soalan menunjukkan muka surat rujukan.","کندوڠن برداسرکن بوکو تيکس توحيد تاهون 3 (جايس). ستياڤ سوالن منونجوقکن موک سورت روجوکن.")}</p>`;
}

/* ============ TONTON & BACA ============ */
function startRead(){ run.c = 0; showCard(); }
function showCard(){
  stopAnims();
  const t = LESSONS[+run.station], c = t.cards[run.c], n = t.cards.length;
  run.say = c.chat ? c.chat.map(m=>R(m[2])).join(". ") : [R(c.t), ...(c.list||[]).map(R), R(c.mk)].filter(Boolean).join(". ");
  let body = "";
  if(c.sc==="ocean") body += oceanScene();
  if(c.sc==="clam") body += clamScene();
  if(c.sc==="r25") body += r25HTML();
  if(c.sc==="khatam") body += khatamHTML();
  if(c.flip) body += flipCard(c.flip,0,true);
  if(c.flips) body += `<div class="flipgrid">${c.flips.map((k,i)=>flipCard(k,i)).join("")}</div>`;
  body += `<span class="unitlbl">${L(c.u)}</span>`;
  if(c.chat){
    const first = c.chat[0][1][0];
    body += `<div class="chat">${c.chat.map((m,i)=>`<div class="msg ${m[1][0]===first?"":"r"}" style="--d:${i*0.9}s"><span class="who" aria-hidden="true">${m[0]}</span><div class="b"><small>${L(m[1])}</small>${L(m[2])}</div></div>`).join("")}</div>`;
  }
  if(c.cmp) body += `<div class="cmp">${c.cmp.map(([h,items])=>`<div><h3>${L(h)}</h3><ul>${items.map(x=>`<li>${L(x)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  if(c.t) body += `<p class="readtext">${L(c.t)}</p>`;
  if(c.list) body += `<ol class="rlist">${c.list.map((x,i)=>`<li style="--i:${i}">${L(x)}</li>`).join("")}</ol>`;
  if(c.ar) body += `<div class="arbox"><span class="ar" dir="rtl" lang="ar">${c.ar}</span>${c.src?`<small>${L(c.src)}</small>`:""}</div>`;
  if(c.mk) body += `<p class="maksud">${L(c.mk)}</p>`;
  if(c.tip) body += `<div class="tip"><b>💡 ${tx("Ingat!","ايڠت!")}</b>${L(c.tip)}</div>`;
  body += `<p class="ref" style="margin:-4px 0 12px">📖 ${tx("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</p>`;
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="${tx("Kembali","کمبالي")}">${BACK()}</button><h2>${tx("Tonton & Baca","تونتون & باچ")}<small>${L(t.title)}</small></h2><span class="pill">${run.c+1}/${n}</span></div>
    <div class="progress"><span style="width:${Math.round((run.c+1)/n*100)}%"></span></div>
    <div class="card page-in" style="--tc:${t.color}">
      ${body}
      <div class="navrow">
        <button class="secondary" data-act="cprev" aria-label="${tx("Kad sebelum","کد سبلوم")}" ${run.c===0?"disabled":""}>${isJ()?"▶":"◀"}</button>
        ${ttsOK&&run.say?`<button class="pill" data-act="say" style="padding:9px 12px">🔊 ${tx("Dengar","دڠر")}</button>`:"<span></span>"}
        <button class="primary" data-act="cnext">${run.c+1<n?tx("Seterusnya","ستروسڽ"):tx("Mula Menyelam","مولا مڽلم")} ${isJ()?"◀":"▶"}</button>
      </div>
      <div class="dots" aria-hidden="true">${[...Array(n)].map((_,i)=>`<i class="${i===run.c?"on":""}"></i>`).join("")}</div>
    </div>`;
}

/* ============ CABARAN ============ */
function startPlay(){
  const src = run.station==="final" ? FINAL.qs : LESSONS[+run.station].qs;
  run = Object.assign(run, {qs:shuffle(src), i:0, score:0, pearl:0, streak:0});
  showQ();
}
function qTitle(){
  if(run.station==="final") return `${L(FINAL.title)}<small>${L(FINAL.sub)}</small>`;
  const t = LESSONS[+run.station];
  return `${tx("Pelajaran","ڤلاجرن")} ${t.id}<small>${L(t.title)}</small>`;
}

function showQ(){
  stopAnims();
  const q = run.qs[run.i];
  run.q = q; run.done = false; run.mist = 0;
  run.say = R(q.q);
  let body = "";
  switch(q.type){
    case "chest":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      if(!run.opts.some(o=>isAr(o.t))) run.say += ". " + run.opts.map(o=>R(o.t)).join(". ");
      body = `<p class="hint">${tx("Pilih satu peti. Peti yang betul ada mutiara!","ڤيليه ساتو ڤيتي. ڤيتي يڠ بتول اد موتيارا!")}</p><div class="chests">${run.opts.map((o,k)=>`<button class="chest" data-act="chest" data-k="${k}">${chestSVG()}${T(o.t)}</button>`).join("")}</div>`;
      break;
    case "tf":
      body = `<div class="tfbubble" id="tfb">${L(q.q)}</div>
        <div class="tfrow"><button class="yes" data-act="tf" data-v="1"><span aria-hidden="true">✅</span>${tx("Betul","بتول")}</button><button class="no" data-act="tf" data-v="0"><span aria-hidden="true">❌</span>${tx("Salah","ساله")}</button></div>`;
      break;
    case "fish": {
      run.left = q.items.filter(x=>x[1]).length;
      const lanes = [16,98,180];
      const order = shuffle(q.items.map((it,i)=>({it,i})));
      body = `<p class="hint">${tx("Tekan ikan yang betul untuk memancingnya.","تکن ايکن يڠ بتول اونتوق ممنچيڠڽ.")} <span class="counter" id="fleft">🎣 ${run.left} ${tx("lagi","لاڬي")}</span></p>
        <div class="sea" id="sea"><span class="boat" aria-hidden="true">🛶</span><span class="hookline" id="hook"></span>${order.map((o,k)=>{ const lane=k%3, nIn=Math.ceil(order.length/3), s=13+lane*2.5; return `<button class="fish" data-act="fish" data-i="${o.i}" style="--fc:${FISH_COLORS[k%FISH_COLORS.length]};--y:${lanes[lane]}px;--s:${s}s;--d:-${(Math.floor(k/3)/nIn)*s+lane*1.7}s">${L(o.it[0])}</button>`; }).join("")}</div>`;
      break; }
    case "scale":
      run.queue = shuffle(q.items); run.si = 0; run.cnt = [0,0];
      body = `<div class="weight" id="wt"></div>
        <div class="scalebox">${scaleSVG(q)}</div>
        <div class="swbtns" dir="ltr">${q.l.map((l,k)=>`<button class="swbtn s${k}" data-act="pan" data-g="${k}"><span aria-hidden="true">${k?"➡️":"⬅️"}</span>${L(l)}</button>`).join("")}</div>
        <div class="bins" dir="ltr"><div id="bin0"></div><div id="bin1"></div></div>`;
      break;
    case "clue":
      run.shown = 1;
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      body = `<ol class="clues" id="clues"></ol>
        <button class="cluebtn" data-act="clue" id="cluebtn">🔎 ${tx("Buka petunjuk seterusnya","بوک ڤتونجوق ستروسڽ")}</button>
        <div class="guesses">${run.opts.map((o,k)=>`<button class="guess" data-act="guess" data-k="${k}">${T(o.t)}</button>`).join("")}</div>`;
      break;
    case "lines": {
      run.sel = null; run.matched = [];
      const left = shuffle(q.pairs.map((p,i)=>({t:p[0],i}))), right = shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
      body = `<p class="hint">${tx("Tekan satu kotak di kiri, kemudian pasangannya di kanan.","تکن ساتو کوتق د کيري، کمودين ڤاسڠنڽ د کانن.")}</p>
        <div class="lines" id="lines" dir="ltr"><svg id="lsvg" aria-hidden="true"></svg>
          <div class="col">${left.map(o=>`<button class="lbtn" data-act="ll" data-i="${o.i}" dir="auto">${T(o.t)}</button>`).join("")}</div>
          <div class="col">${right.map(o=>`<button class="lbtn" data-act="lr" data-i="${o.i}" dir="auto">${T(o.t)}</button>`).join("")}</div>
        </div>`;
      break; }
    case "words": {
      run.next = 0;
      const rtl = isAr(q.words[0]);
      body = `<p class="hint">${tx("Tekan gelembung mengikut urutan ayat.","تکن ڬلمبوڠ مڠيکوت اوروتن ايات.")}</p>
        <div class="sentence" dir="${rtl?"rtl":"ltr"}">${q.words.map((_,i)=>`<span class="wslot" id="w${i}">…</span>`).join("")}</div>
        <div class="wbubs" dir="${rtl?"rtl":"ltr"}">${shuffle(q.words.map((w,i)=>({w,i}))).map((o,k)=>`<button class="wbub" data-act="word" data-i="${o.i}" style="--d:-${k*0.5}s">${T(o.w)}</button>`).join("")}</div>`;
      break; }
    case "order":
      run.next = 0;
      body = `<p class="hint">${tx("Tekan mengikut urutan, bermula dengan yang pertama.","تکن مڠيکوت اوروتن، برمولا دڠن يڠ ڤرتام.")}</p>
        <ol class="slots">${q.items.map((_,i)=>`<li class="slot" id="s${i}"><span class="n">${i+1}</span><span class="st">🐚</span></li>`).join("")}</ol>
        <div class="chips">${shuffle(q.items.map((t,i)=>({t,i}))).map(o=>`<button class="chip" data-act="ord" data-i="${o.i}">${T(o.t)}</button>`).join("")}</div>`;
      break;
  }
  const tag = q.tag ? `<span class="tag">${P(q.tag)}</span>` : "";
  const pct = Math.round(run.i/run.qs.length*100);
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="${tx("Kembali","کمبالي")}">${BACK()}</button><h2>${qTitle()}</h2><span class="pillstat">${PEARL} ${run.pearl}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${run.qs.length}" aria-valuenow="${run.i}"><span style="width:${pct}%"></span><i style="${isJ()?"right":"left"}:${pct}%" aria-hidden="true">🐠</i></div>
    <div class="card page-in">
      <div class="qmeta"><span><span class="qtype">${(isJ()?TYPE_J:TYPE_R)[q.type]}</span>${tag}</span><span style="display:flex;gap:6px;align-items:center"><span style="color:var(--muted);font-size:15px">${run.i+1}/${run.qs.length}</span>${ttsOK?`<button class="pill" data-act="say" aria-label="${tx("Dengar soalan","دڠر سوالن")}">🔊</button>`:""}</span></div>
      ${q.type==="tf"?"":`<p class="qtext">${L(q.q)}</p>`}
      ${body}
      <div id="fb" aria-live="polite"></div>
    </div>`;
  if(q.type==="scale"){ showWeight(); tiltScale(); }
  if(q.type==="clue") drawClues();
  if(q.type==="lines") window.onresize = drawLines;
}

function finishQ(ok, extra="", bonus=0){
  run.done = true;
  const gain = ok ? 1 + bonus : 0;
  if(ok){ run.score++; run.pearl += gain; run.streak++; } else run.streak = 0;
  const q = run.q, last = run.i+1 >= run.qs.length;
  const title = ok ? (run.mist ? tx("Bagus, hampir sempurna!","باڬوس، همڤير سمڤورنا!") : pick(isJ()?PRAISE_J:PRAISE_R)) : tx("Tidak mengapa, mari belajar!","تيدق مڠاڤ، ماري بلاجر!");
  $("fb").innerHTML = `<div class="feedback">${mascot(ok?"happy":"sad")}<div><strong>${title}</strong>${ok?`<span class="streak">+${gain} ${tx("mutiara","موتيارا")}</span> `:""}${ok&&run.streak>=3?`<span class="streak">🔥 ${run.streak} ${tx("berturut-turut!","برتوروت٢!")}</span>`:""}<br>${extra}${L(q.e)}<div class="ref">📖 ${tx("Rujuk buku teks ms.","روجوق بوکو تيکس م.س.")} ${q.p}</div></div></div>
    <button class="primary" data-act="next">${last?tx("Lihat keputusan","ليهت کڤوتوسن"):tx("Soalan seterusnya","سوالن ستروسڽ")}</button>`;
  ok ? sfx.ok() : sfx.bad();
  const b = $("fb").querySelector(".primary"); b.focus({preventScroll:true}); b.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
}

/* Peti harta */
function ansChest(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".chest")];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  const open = (b, txt) => { b.querySelector(".inside text").textContent = txt; b.classList.add("open"); };
  sfx.creak();
  open(btns[k], ok ? "🦪" : "🦀");
  btns[k].classList.add(ok?"ok":"bad");
  if(!ok) setTimeout(()=>{ open(btns[right],"🦪"); btns[right].classList.add("ok"); }, 450);
  else sparkle(btns[k],"✨");
  hush(); finishQ(ok);
}
/* Betul / salah */
function ansTF(btn){
  if(run.done) return;
  app.querySelectorAll(".tfrow button").forEach(b=>b.disabled=true);
  btn.classList.add("picked");
  const ok = (btn.dataset.v==="1")===run.q.ans;
  const bub = $("tfb"); bub.classList.add("popit"); sfx.blub();
  hush(); finishQ(ok, `${tx("Jawapan:","جواڤن:")} <b>${run.q.ans?tx("Betul","بتول"):tx("Salah","ساله")}</b>. `);
}
/* Pancing */
function ansFish(b){
  if(run.done || b.disabled) return;
  const it = run.q.items[+b.dataset.i];
  b.disabled = true;
  if(it[1]){
    const sea = $("sea"), r = b.getBoundingClientRect(), sr = sea.getBoundingClientRect(), hook = $("hook");
    hook.style.left = (r.left - sr.left + r.width/2)+"px"; hook.style.height = (r.top - sr.top + 10)+"px";
    setTimeout(()=>{ hook.style.height = "0px"; }, 350);
    sfx.splash(); sparkle(b,"🎣"); b.classList.add("caught"); run.left--;
    $("fleft").textContent = `🎣 ${run.left} ${tx("lagi","لاڬي")}`;
    if(run.left===0){
      app.querySelectorAll(".fish").forEach(x=>x.disabled=true);
      setTimeout(()=>finishQ(run.mist<=1, run.mist?`${tx("Ikan kelabu bukan jawapan:","ايکن کلابو بوکن جواڤن:")} ${run.q.items.filter(x=>!x[1]).map(x=>L(x[0])).join(", ")}. `:""), 400);
    }
  } else { run.mist++; sfx.bad(); b.classList.add("nope","shake"); b.prepend("❌ "); }
}
/* Timbang */
function scaleSVG(q){
  return `<svg viewBox="0 0 300 175" role="img" aria-label="${tx("Neraca","نراچا")}">
    <path d="M110 170 h80 l-12 -12 h-56Z" fill="#8B5A2B"/><rect x="146" y="40" width="8" height="122" fill="#A0622D"/>
    <g class="beam" id="beam"><rect x="40" y="36" width="220" height="8" rx="4" fill="#C8923C"/></g>
    <circle cx="150" cy="40" r="9" fill="#E8B33A"/>
    ${[0,1].map(k=>`<g class="pan" id="pan${k}"><path d="M0 0 L-34 54 M0 0 L34 54" stroke="#8A6A3A" stroke-width="1.6"/><path d="M-44 54 h88 q-6 18 -44 18 q-38 0 -44 -18Z" fill="${k?"#D1495B":"#0E7C9B"}"/><g id="pp${k}"></g><text y="88" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">${L(q.l[k])}</text></g>`).join("")}
  </svg>`;
}
function tiltScale(){
  const d = run.cnt[1]-run.cnt[0], th = Math.max(-16, Math.min(16, d*6)), r = th*Math.PI/180;
  const beam = $("beam"); if(!beam) return;
  beam.style.transform = `rotate(${th}deg)`;
  [[0,-1],[1,1]].forEach(([k,s])=>{ $("pan"+k).style.transform = `translate(${150+s*106*Math.cos(r)}px,${40+s*106*Math.sin(r)}px)`; });
  [0,1].forEach(k=>{ $("pp"+k).innerHTML = [...Array(run.cnt[k])].map((_,i)=>`<circle cx="${-28+(i%5)*14}" cy="${48-Math.floor(i/5)*12}" r="6" fill="#F3E3F0" stroke="#B48BAE"/>`).join(""); });
}
function showWeight(){
  const it = run.queue[run.si], w = $("wt"); if(!w) return;
  w.className = "weight"; void w.offsetWidth;
  w.innerHTML = `<span>${T(it[0])}<small>${run.queue.length-run.si} ${tx("lagi","لاڬي")}</small></span>`;
}
function ansPan(g){
  if(run.done || run.busy) return;
  const it = run.queue[run.si], ok = g===it[1];
  run.busy = true;
  if(ok) sfx.tap(); else { run.mist++; sfx.bad(); }
  $("wt").classList.add(it[1]?"dropR":"dropL");
  setTimeout(()=>{
    run.cnt[it[1]]++; tiltScale();
    $("bin"+it[1]).insertAdjacentHTML("beforeend", `<i class="${ok?"":"x"}">${ok?"✓ ":"❗"}${L(it[0])}</i>`);
    run.busy = false; run.si++;
    if(run.si>=run.queue.length){
      $("wt").className="weight"; $("wt").innerHTML = run.cnt[0]===run.cnt[1] ? tx("⚖️ Seimbang!","⚖️ سايمبڠ!") : tx("Siap! ✔️","سياڤ! ✔️");
      app.querySelectorAll(".swbtn").forEach(b=>b.disabled=true);
      finishQ(run.mist<=1, run.mist?tx("Item bertanda ❗ telah dipindahkan ke dulang yang betul. ","ايتم برتندا ❗ تله دڤينداهکن ک دولڠ يڠ بتول. "):"");
    } else showWeight();
  }, ok?380:650);
}
/* Teka siapa */
function drawClues(){
  const q = run.q;
  $("clues").innerHTML = q.clues.map((c,i)=> i<run.shown
    ? `<li class="on"><span class="n">${i+1}</span>${L(c)}</li>`
    : `<li class="off"><span class="n">${i+1}</span>🔒 ${tx("Petunjuk tersembunyi","ڤتونجوق ترسمبوڽي")}</li>`).join("");
  const b = $("cluebtn"); if(b){ b.disabled = run.shown>=q.clues.length || run.done; }
}
function ansGuess(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".guess")];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  btns[right].classList.add("ok"); if(!ok) btns[k].classList.add("bad","shake");
  const bonus = ok ? run.q.clues.length - run.shown : 0;
  run.shown = run.q.clues.length; drawClues();
  hush(); finishQ(ok, ok&&bonus?`<span class="bonus">🕵️ +${bonus} ${tx("bonus detektif","بونوس ديتيکتيف")}</span><br>`:"", bonus);
}
/* Garis padan */
function lineEnds(a, b){
  const box = $("lines").getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const ax = (ra.left < rb.left ? ra.right : ra.left) - box.left, bx = (ra.left < rb.left ? rb.left : rb.right) - box.left;
  return [ax, ra.top+ra.height/2-box.top, bx, rb.top+rb.height/2-box.top];
}
function linePath([x1,y1,x2,y2]){ const m=(x1+x2)/2; return `M${x1} ${y1} C${m} ${y1}, ${m} ${y2}, ${x2} ${y2}`; }
function drawLines(){
  const svg = $("lsvg"); if(!svg) return;
  svg.innerHTML = run.matched.map(([a,b,c])=>{ const e=lineEnds(a,b); return `<path d="${linePath(e)}" stroke="${c}" style="--len:400;animation:none;stroke-dasharray:none"/>`; }).join("");
}
function ansLine(b, side){
  if(run.done || b.classList.contains("done")) return;
  if(side==="l"){ app.querySelectorAll('.lbtn[data-act="ll"]').forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); run.sel=b; sfx.tap(); return; }
  if(!run.sel){ b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
  const a = run.sel, svg = $("lsvg"), e = lineEnds(a,b), len = Math.ceil(Math.hypot(e[2]-e[0],e[3]-e[1])*1.3);
  if(a.dataset.i===b.dataset.i){
    const c = LINE_COLORS[run.matched.length % LINE_COLORS.length];
    svg.insertAdjacentHTML("beforeend", `<path d="${linePath(e)}" stroke="${c}" style="--len:${len}"/>`);
    [a,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.style.background=c; x.disabled=true; });
    run.matched.push([a,b,c]); run.sel=null; sfx.tap();
    if(run.matched.length===run.q.pairs.length) setTimeout(()=>finishQ(run.mist<=1),300);
  } else {
    run.mist++; sfx.bad();
    svg.insertAdjacentHTML("beforeend", `<path class="wrongl" d="${linePath(e)}" stroke="#C8452F" stroke-dasharray="6 6" style="--len:${len}"/>`);
    setTimeout(()=>svg.querySelectorAll(".wrongl").forEach(p=>p.remove()), 600);
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
  }
}
/* Susun kalimah */
function ansWord(b){
  if(run.done) return;
  const i = +b.dataset.i;
  if(i===run.next){
    sfx.blub();
    const s = $("w"+i); s.innerHTML = T(run.q.words[i]); s.classList.add("f");
    b.classList.add("gone"); b.disabled = true; run.next++;
    if(run.next===run.q.words.length) finishQ(run.mist<=1);
  } else { run.mist++; sfx.bad(); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
}
/* Susun urutan */
function ansOrder(b){
  if(run.done) return;
  const i = +b.dataset.i;
  if(i===run.next){
    sfx.tap();
    const s=$("s"+i); s.classList.add("filled"); s.querySelector(".st").innerHTML = T(run.q.items[i]);
    b.remove(); run.next++;
    if(run.next===run.q.items.length) finishQ(run.mist<=1);
  } else { run.mist++; sfx.bad(); app.querySelectorAll(".chip.shake").forEach(x=>x.classList.remove("shake")); void b.offsetWidth; b.classList.add("shake"); }
}

function nextQ(){
  run.i++;
  if(run.i < run.qs.length){ showQ(); window.scrollTo(0,0); }
  else finishRound();
}
function finishRound(){
  stopAnims();
  const isFinal = run.station==="final";
  const key = isFinal ? "final" : LESSONS[+run.station].id;
  const n = run.qs.length, s = run.score, pct = s/n;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0;
  const wasFinalOpen = finalUnlocked();
  const nextIdx = isFinal ? -1 : +run.station+1;
  const wasNextOpen = nextIdx>0 && nextIdx<LESSONS.length ? unlocked(nextIdx) : true;
  const prev = best[key];
  if(stars>prev){ best[key]=stars; save("t3-best",best); }
  pearls += run.pearl; save("t3-mutiara",pearls);
  const msgs = [];
  if(nextIdx>0 && nextIdx<LESSONS.length && !wasNextOpen && unlocked(nextIdx)) msgs.push(tx(`🤿 Zon baharu dibuka: ${L(LESSONS[nextIdx].zone)} (−${LESSONS[nextIdx].depth} m)!`,`🤿 زون بهارو دبوک: ${L(LESSONS[nextIdx].zone)} (−${LESSONS[nextIdx].depth} m)!`));
  if(!isFinal && !wasFinalOpen && finalUnlocked()) msgs.push(tx("👑 Istana Mutiara kini dibuka!","👑 ايستان موتيارا کيني دبوک!"));
  const titles = isJ() ? ["جوم چوبا سکالي لاڬي","بوليه چوبا لاڬي","باڬوس!","چمرلڠ!"] : ["Jom cuba sekali lagi","Boleh cuba lagi","Bagus!","Cemerlang!"];
  const label = isFinal ? L(FINAL.title) : `${tx("Pelajaran","ڤلاجرن")} ${key}: ${L(LESSONS[+run.station].title)}`;
  app.innerHTML = `
    <div class="card result page-in" style="margin-top:18px">
      ${mascot(stars>=2?"happy":"idle")}
      <p style="margin:4px 0 0">${label}</p>
      <div class="stars" role="img" aria-label="${stars} / 3">${starsHTML(stars)}</div>
      <h2>${titles[stars]}</h2>
      <p>${tx(`Kamu menjawab ${s} daripada ${n} soalan dengan betul.`,`کامو منجواب ${s} درڤد ${n} سوالن دڠن بتول.`)}</p>
      <div class="earned">+${run.pearl} ${PEARL} ${tx("mutiara","موتيارا")}</div>
      ${stars>prev?`<p>${tx("Rekod baharu!","ريکود بهارو!")}</p>`:""}
      ${stars===0?`<p>${tx("Dapatkan sekurang-kurangnya 1 bintang (separuh betul) untuk menyelam ke zon seterusnya. Cuba “Tonton & Baca” dahulu.","داڤتکن سکورڠ٢ڽ 1 بينتڠ (سڤاروه بتول) اونتوق مڽلم ک زون ستروسڽ. چوبا “تونتون & باچ” دهولو.")}</p>`:""}
      ${msgs.map(m=>`<div class="unlock">${m}</div>`).join("<br>")}
      ${isFinal&&stars===3?`<div class="unlock">👑 ${tx("Tahniah! Kamu juara Tauhid Tahun 3!","تهنية! کامو جوارا توحيد تاهون 3!")}</div>`:""}
      <button class="primary" data-act="map">${tx("Kembali ke lautan","کمبالي ک لاءوتن")} 🌊</button>
      <button class="secondary" data-act="again">${tx("Main lagi","ماٴين لاڬي")}</button>
    </div>`;
  sfx.win();
  if(stars===3) rain();
  window.scrollTo(0,0);
}
function rain(){
  if(REDUCED) return;
  const box = document.createElement("div"); box.className = "rain";
  for(let i=0;i<28;i++){
    const s = document.createElement("span");
    s.textContent = pick(["🫧","⭐","🐠","🦪","✨","🐚"]);
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (2.5+Math.random()*2)+"s";
    s.style.animationDelay = (Math.random()*0.8)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 5000);
}

/* ============ PERISTIWA ============ */
app.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || b.disabled) return;
  switch(b.dataset.act){
    case "mute": muted=!muted; save("t3-muted",muted); b.textContent=muted?"🔇":"🔊"; b.setAttribute("aria-label",muted?"Hidupkan bunyi":"Matikan bunyi"); if(muted) hush(); break;
    case "lang": lang = isJ() ? "rumi" : "jawi"; save("kafa-lang",lang); applyLang(); renderMap(); break;
    case "teacher": teacher=!teacher; save("t3-teacher",teacher); renderMap(); break;
    case "map": renderMap(); window.scrollTo(0,0); break;
    case "station": openStation(b.dataset.i); break;
    case "station-back": openStation(run.station); break;
    case "read": startRead(); window.scrollTo(0,0); break;
    case "cprev": if(run.c>0){ run.c--; showCard(); } break;
    case "cnext": { const n=LESSONS[+run.station].cards.length; if(run.c+1<n){ run.c++; showCard(); } else startPlay(); window.scrollTo(0,0); break; }
    case "play": startPlay(); window.scrollTo(0,0); break;
    case "say": if(run && run.say) speak(run.say); break;
    case "chest": ansChest(+b.dataset.k); break;
    case "tf": ansTF(b); break;
    case "fish": ansFish(b); break;
    case "pan": ansPan(+b.dataset.g); break;
    case "clue": if(!run.done && run.shown<run.q.clues.length){ run.shown++; sfx.blub(); drawClues(); } break;
    case "guess": ansGuess(+b.dataset.k); break;
    case "ll": ansLine(b,"l"); break;
    case "lr": ansLine(b,"r"); break;
    case "word": ansWord(b); break;
    case "ord": ansOrder(b); break;
    case "next": nextQ(); break;
    case "again": startPlay(); window.scrollTo(0,0); break;
  }
});

applyLang();
renderMap();
</script>
</body>
</html>
