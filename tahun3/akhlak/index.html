<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jalan-jalan Kampung Akhlak • Akhlak Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF2F5; --surface:#FFFFFF; --ink:#3A1F2B; --muted:#7A5966; --line:#F2D5DE;
  --brand:#D6336C; --brand-ink:#FFFFFF; --brand-shadow:#A3204F; --gold:#E8A317;
  --ok:#1F8A50; --ok-bg:#DDF3E5; --bad:#C8452F; --bad-bg:#FBE1DC; --note:#FFF4D6;
  --pattern:rgba(214,51,108,.09);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1218; --surface:#2C1B24; --ink:#FBEAF0; --muted:#D3AEBE; --line:#4A2E3B;
    --brand:#FF6FA0; --brand-ink:#2A0614; --brand-shadow:#C2406E; --gold:#F2C14E;
    --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#3A3018;
    --pattern:rgba(255,111,160,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1218; --surface:#2C1B24; --ink:#FBEAF0; --muted:#D3AEBE; --line:#4A2E3B;
  --brand:#FF6FA0; --brand-ink:#2A0614; --brand-shadow:#C2406E; --gold:#F2C14E;
  --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#3A3018;
  --pattern:rgba(255,111,160,.08);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background-image:linear-gradient(45deg,var(--pattern) 25%,transparent 25%,transparent 75%,var(--pattern) 75%),linear-gradient(45deg,var(--pattern) 25%,transparent 25%,transparent 75%,var(--pattern) 75%);background-size:36px 36px;background-position:0 0,18px 18px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 44px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{max-width:100%}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:400;line-height:1.9}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
a.iconbtn{text-decoration:none;color:inherit}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.pillstat{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-weight:800;font-size:17px}
.heart{width:20px;height:20px;flex:none}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.langbtn .ar{font-family:"Noto Naskh Arabic","Amiri",serif}

.hero{text-align:center;padding:8px 0 2px}
.hero .badge{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px}
.hero h1{margin:8px 0 0;font-size:clamp(30px,8.2vw,48px);line-height:1.04;font-weight:800;color:var(--brand)}
.hero p{margin:6px auto 0;color:var(--muted);max-width:480px}

/* ===== Jalan kampung (peta mendatar) ===== */
.streetwrap{position:relative;margin:16px -16px 0}
.street{overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:thin;border-radius:0;-webkit-overflow-scrolling:touch}
.town{position:relative;height:410px;background:linear-gradient(180deg,#8ED6F5 0%,#C8ECFA 45%,#E8F7FC 58%)}
.town .sun{position:absolute;top:22px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#FFE680,#FFC93C);box-shadow:0 0 0 12px rgba(255,214,90,.25);animation:sunp 4s ease-in-out infinite}
@keyframes sunp{50%{box-shadow:0 0 0 20px rgba(255,214,90,.12)}}
.town .cloud{position:absolute;font-size:44px;opacity:.9;animation:cloud linear infinite;pointer-events:none}
@keyframes cloud{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
.town .hills{position:absolute;left:0;right:0;top:120px;height:110px}
.town .walk{position:absolute;left:0;right:0;top:248px;height:16px;background:#E7D3B5;border-top:3px solid #CDB28C}
.town .road{position:absolute;left:0;right:0;top:264px;height:62px;background:#55606E}
.town .road::after{content:"";position:absolute;left:0;right:0;top:29px;height:4px;background:repeating-linear-gradient(90deg,#FFE27A 0 26px,transparent 26px 50px)}
.town .grass{position:absolute;left:0;right:0;top:326px;bottom:0;background:#7CC66B}
.town .tree{position:absolute;top:186px;font-size:52px;line-height:1;animation:sway 4s ease-in-out infinite;transform-origin:50% 100%;pointer-events:none}
@keyframes sway{50%{transform:rotate(3deg)}}
.town .lamp{position:absolute;top:196px;width:6px;height:54px;background:#5B5B6B;border-radius:3px}
.town .lamp::before{content:"";position:absolute;top:-8px;left:-6px;width:18px;height:12px;border-radius:8px 8px 3px 3px;background:#FFD95A;box-shadow:0 0 10px #FFD95A}
.town .car{position:absolute;top:268px;font-size:34px;animation:drive linear infinite;pointer-events:none}
@keyframes drive{from{left:-60px}to{left:100%}}
.stop{position:absolute;top:58px;width:170px;transform:translateX(-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center}
.bld{position:relative;display:block;width:124px;height:132px;margin-top:58px;background:var(--tc);border-radius:6px 6px 0 0;box-shadow:inset -12px 0 0 rgba(0,0,0,.1)}
.bld .roof{position:absolute;left:-12px;right:-12px;top:-46px;height:48px;background:color-mix(in srgb,var(--tc) 55%,#3A1F2B);clip-path:polygon(50% 0,100% 100%,0 100%)}
.bld .sign{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:1}
.bld .wins{position:absolute;left:14px;right:14px;top:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bld .wins i{height:28px;border-radius:5px;background:#FFF4C2;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.bld .door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:34px;height:48px;border-radius:16px 16px 0 0;background:#7A4A2A}
.bld .num{position:absolute;top:-10px;right:-14px;z-index:2;background:var(--gold);color:#2A1B00;border-radius:999px;font-size:14px;font-weight:800;min-width:28px;height:28px;display:grid;place-items:center;box-shadow:0 2px 0 #9A6A0A}
.bld .done{position:absolute;bottom:52px;left:-14px;font-size:26px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.2)}30%{transform:scale(1)}}
.stop .plate{display:block;margin-top:80px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:3px 10px 4px;font-weight:800;font-size:14.5px;line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.15);max-width:170px}
.stop .plate small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.stop .plate .st{display:block;font-size:12px;letter-spacing:1px;margin-top:2px}
.stop .plate .st .off{opacity:.3;filter:grayscale(1)}
.stop.locked .bld{filter:grayscale(.85) brightness(.9)}
.stop.locked .bld .wins i{background:#9C9AA8}
.stop.current .bld .sign{animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 3px 0 rgba(0,0,0,.2),0 0 0 0 rgba(214,51,108,.6)}100%{box-shadow:0 3px 0 rgba(0,0,0,.2),0 0 0 18px rgba(214,51,108,0)}}
.stop:active .bld{transform:translateY(3px)}
.walker{position:absolute;top:206px;width:58px;transform:translateX(-50%);pointer-events:none;animation:hopw .7s ease-in-out infinite}
@keyframes hopw{50%{margin-top:-6px}}
.scr{position:absolute;top:150px;z-index:3;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.scr.l{left:8px}.scr.r{right:8px}
.streetnote{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:15px;font-weight:700}
.trip{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.trip span{display:block;height:100%;background:linear-gradient(90deg,#FF8FB1,#D6336C);border-radius:99px}
.teacher{display:flex;justify-content:center;margin-top:20px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700}
.toggle .sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--brand)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.foot{margin-top:16px;color:var(--muted);font-size:15px;text-align:center}

/* ===== Stesen ===== */
.banner{border-radius:26px;padding:18px 18px 20px;background:var(--tc);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.banner .kick{font-weight:700;opacity:.92;font-size:16px}
.banner h2{margin:0;font-size:clamp(25px,6.4vw,33px);line-height:1.12}
.banner .big{position:absolute;inset-inline-end:-4px;bottom:-12px;font-size:92px;opacity:.25}
.banner .stars{margin-top:6px;font-size:20px}
.banner .stars .off{opacity:.35;filter:grayscale(1)}
.banner .chip{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 12px;font-weight:700;font-size:15px}
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.units li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;line-height:1.25}
.units .u{background:var(--tc);color:#fff;border-radius:10px;font-size:13px;font-weight:800;padding:2px 8px;flex:none}
.actions{display:grid;gap:12px;margin-top:18px}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:0;border-radius:20px;padding:14px 16px;font-weight:800;font-size:21px;line-height:1.15}
.bigbtn small{display:block;font-weight:600;font-size:15px;opacity:.9}
.bigbtn .e{font-size:34px;flex:none}
.bigbtn.read{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.bigbtn.play{background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-shadow)}
.bigbtn:active{transform:translateY(3px)}

/* ===== Umum ===== */
.gamehead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.gamehead h2{margin:0;font-size:20px;flex:1;line-height:1.15;color:var(--brand)}
.gamehead h2 small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#FF8FB1,#D6336C);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.page-in{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qtype{display:inline-block;background:var(--note);border-radius:999px;padding:1px 12px;font-size:14.5px;font-weight:700}
.tag{display:inline-block;background:var(--gold);color:#2A1B00;border-radius:999px;padding:1px 10px;font-size:13.5px;font-weight:800;margin-inline-start:4px}
.pill{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.qtext{font-size:clamp(20px,4.8vw,25px);font-weight:700;line-height:1.32;margin:4px 0 14px}
.hint{color:var(--muted);font-size:15.5px;margin:-6px 0 12px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.06)}}
.counter{display:inline-block;background:var(--note);border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}
.bigem{font-size:46px;text-align:center;letter-spacing:6px;line-height:1.2;margin:0 0 8px}
.bigem span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* Kapal terbang kertas */
.planes{display:grid;gap:10px}
.plane{position:relative;display:flex;gap:12px;align-items:center;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:10px 14px;text-align:start;font-size:18.5px;font-weight:700;line-height:1.3;overflow:visible}
.plane .pl{width:42px;height:32px;flex:none;transition:transform .2s}
.plane:hover .pl{transform:translate(3px,-2px) rotate(-6deg)}
.plane .ar{font-size:23px;flex:1;text-align:right}
.plane.ok{border-color:var(--ok);background:var(--ok-bg)}
.plane.bad{border-color:var(--bad);background:var(--bad-bg)}
.plane.ok .pl{animation:flyaway 1.1s ease-in forwards}
.plane.bad .pl{animation:dive .9s ease-in forwards}
@keyframes flyaway{30%{transform:translate(-6px,4px) rotate(8deg)}100%{transform:translate(260px,-90px) rotate(-18deg) scale(.6);opacity:0}}
html[dir="rtl"] .plane .pl{transform:scaleX(-1)}
html[dir="rtl"] .plane.ok .pl{animation-name:flyawayr}
@keyframes flyawayr{30%{transform:scaleX(-1) translate(-6px,4px) rotate(8deg)}100%{transform:scaleX(-1) translate(260px,-90px) rotate(-18deg) scale(.6);opacity:0}}
@keyframes dive{40%{transform:translate(8px,-6px) rotate(-10deg)}100%{transform:translate(30px,40px) rotate(70deg);opacity:.2}}

/* Pilih jalan */
.story{display:flex;gap:12px;align-items:center;background:var(--note);border-radius:18px;padding:12px 14px;margin:0 0 14px}
.story .se{font-size:44px;line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
.story p{margin:0;font-weight:700;font-size:clamp(18px,4.4vw,21px);line-height:1.35}
.fork{position:relative;display:grid;gap:12px;padding-top:6px}
.signpost{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:#8B5A2B;color:#fff;border-radius:12px 30px 30px 12px;padding:12px 18px 12px 14px;font-size:18px;font-weight:800;line-height:1.3;text-align:start;box-shadow:0 5px 0 #5E3B1A;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,0 100%)}
html[dir="rtl"] .signpost{clip-path:polygon(22px 0,100% 0,100% 100%,22px 100%,0 50%);padding:12px 14px 12px 18px}
.signpost .k{font-size:24px;flex:none}
.signpost:active{transform:translateY(3px)}
.signpost.ok{background:var(--ok);box-shadow:0 5px 0 #145C35}
.signpost.bad{background:var(--bad);box-shadow:0 5px 0 #8E2E1F}
.signpost:disabled:not(.ok):not(.bad){opacity:.45}
.cons{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px 14px;border-radius:18px;font-weight:700;font-size:17.5px;animation:consin .5s cubic-bezier(.3,1.5,.5,1)}
.cons .cf{font-size:40px;line-height:1;flex:none;animation:bob 1.6s ease-in-out infinite}
.cons.good{background:var(--ok-bg)}
.cons.sad{background:var(--bad-bg)}
@keyframes consin{from{opacity:0;transform:scale(.8)}}

/* Balas mesej */
.phone{max-width:380px;margin:0 auto 14px;border:8px solid #2B2B35;border-radius:30px;overflow:hidden;background:#EDE6DD}
.ph-top{display:flex;align-items:center;gap:8px;background:#128C7E;color:#fff;padding:8px 12px;font-weight:800;font-size:16px}
.ph-top .av{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px}
.ph-top small{display:block;font-size:12px;font-weight:600;opacity:.85}
.ph-body{display:flex;flex-direction:column;gap:6px;padding:12px 10px 14px;min-height:150px}
.pm{max-width:80%;border-radius:14px;padding:6px 11px;font-size:16px;font-weight:600;line-height:1.35;color:#1E1E1E;animation:consin .35s ease both}
.pm.in{align-self:flex-start;background:#fff;border-top-left-radius:4px}
.pm.out{align-self:flex-end;background:#DCF8C6;border-top-right-radius:4px}
html[dir="rtl"] .pm.in{align-self:flex-end;border-top-left-radius:14px;border-top-right-radius:4px}
html[dir="rtl"] .pm.out{align-self:flex-start;border-top-right-radius:14px;border-top-left-radius:4px}
.pm.typing{font-size:22px;letter-spacing:3px;padding:0 12px}
.pm.typing i{display:inline-block;font-style:normal;animation:dot 1s infinite}
.pm.typing i:nth-child(2){animation-delay:.2s}.pm.typing i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:.2}}
.replies{display:grid;gap:8px}
.reply{border:2px solid #128C7E;background:var(--surface);color:var(--ink);border-radius:20px;padding:9px 14px;font-weight:700;font-size:17px;line-height:1.3;text-align:start}
.reply::before{content:"💬 "}
.reply.ok{background:var(--ok-bg);border-color:var(--ok)}
.reply.bad{background:var(--bad-bg);border-color:var(--bad)}

/* Detektif */
.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:linear-gradient(180deg,#E9F6FF,#FFF6E6);border-radius:20px;padding:12px;border:2px solid var(--line)}
@media (max-width:420px){.scene-grid{grid-template-columns:repeat(2,1fr)}}
.spot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;background:rgba(255,255,255,.75);color:#3A1F2B;border-radius:16px;padding:8px 6px;font-size:15px;font-weight:700;line-height:1.2;text-align:center}
.spot .se{font-size:38px;line-height:1.1;animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
.spot.found{border-color:var(--bad);background:#FFE3DD}
.spot.found::after{content:"";position:absolute;inset:-4px;border:4px solid var(--bad);border-radius:50%;animation:circle .45s ease-out}
@keyframes circle{from{transform:scale(1.6);opacity:0}}
.spot.nope{animation:shake .4s;background:#EEE}
.spot.target-good.found{border-color:var(--ok);background:var(--ok-bg)}
.spot.target-good.found::after{border-color:var(--ok)}
.spot.missed{outline:3px dashed var(--bad);outline-offset:2px}

/* Susun komik */
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.frame{position:relative;min-height:110px;border:3px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;font-weight:700;font-size:14px;line-height:1.2;background:var(--bg)}
.frame .fn{position:absolute;top:4px;inset-inline-start:6px;font-size:13px;font-weight:800;color:var(--muted)}
.frame.f{border:3px solid #3A1F2B;background:#FFFBEA;color:#3A1F2B;animation:pop .35s;box-shadow:4px 4px 0 #3A1F2B}
.frame .pe{font-size:34px;line-height:1.1}
.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.panel{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-weight:700;font-size:15.5px;line-height:1.25;text-align:start;box-shadow:0 3px 0 var(--line)}
.panel .pe{font-size:28px;flex:none}
.panel.shake{border-color:var(--bad);background:var(--bad-bg)}

/* Muka ceria / muram */
.facecard{display:grid;place-items:center;min-height:76px;margin:0 auto 12px;max-width:440px;text-align:center;background:var(--note);border:3px solid var(--gold);border-radius:18px;padding:10px 14px;font-weight:800;font-size:clamp(18px,4.6vw,22px);line-height:1.25;animation:pagein .3s}
.facecard small{display:block;font-size:13px;color:var(--muted)}
.facecard.goL{transition:transform .35s ease-in,opacity .35s;transform:translate(-40%,40px) scale(.5);opacity:0}
.facecard.goR{transition:transform .35s ease-in,opacity .35s;transform:translate(40%,40px) scale(.5);opacity:0}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.face{border:0;border-radius:22px;padding:10px 8px 12px;font-weight:800;font-size:18px;color:#fff;line-height:1.2}
.face svg{width:84px;height:84px;display:block;margin:0 auto 4px}
.face.f1{background:#F2A93B;box-shadow:0 5px 0 #B87A1C}
.face.f0{background:#6C7A99;box-shadow:0 5px 0 #4A5570}
.face.react svg{animation:react .6s ease}
@keyframes react{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95) rotate(6deg)}}
.face:disabled{opacity:.5}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bins div{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;justify-content:center}
.bins i{font-style:normal;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;animation:pop .3s}
.bins i.x{border-color:var(--bad)}

/* Lengkapkan dalil */
.dalil{background:var(--note);border:2px solid var(--gold);border-radius:18px;padding:12px 14px;text-align:center;margin:0 0 8px}
.dalil .ar{font-size:clamp(23px,5.6vw,29px)}
.gap{display:inline-block;min-width:90px;border-bottom:3px dashed var(--brand);margin:0 6px;color:var(--muted);font-family:"Amiri",serif;font-size:clamp(23px,5.6vw,29px)}
.gap.w{border-bottom-color:var(--ok);color:var(--ok);animation:write .7s steps(8) both}
@keyframes write{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
.mk{color:var(--muted);font-style:italic;font-weight:600;font-size:16px;margin:0 0 12px;text-align:center}
.inks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ink{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 18px;box-shadow:0 3px 0 var(--line)}
.ink .ar{font-size:26px}
.ink::before{content:"✍️";font-size:15px;margin-inline-end:6px}
.ink.ok{border-color:var(--ok);background:var(--ok-bg)}
.ink.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Lampu isyarat */
.tl{display:flex;gap:14px;align-items:center;margin:0 0 14px}
.tlight{display:grid;gap:6px;background:#2B2B35;border-radius:16px;padding:8px;flex:none}
.tlight i{width:30px;height:30px;border-radius:50%;background:#4A4A55;transition:background .3s,box-shadow .3s}
.tlight.r .r{background:#FF4D4D;box-shadow:0 0 16px #FF4D4D}
.tlight.y .y{background:#FFC93C;box-shadow:0 0 16px #FFC93C;animation:blink .8s infinite}
.tlight.g .g{background:#3CD070;box-shadow:0 0 16px #3CD070}
@keyframes blink{50%{opacity:.4}}
.tl .stmt{flex:1;background:var(--note);border-radius:18px;padding:12px 14px;font-weight:800;font-size:clamp(18px,4.6vw,22px);line-height:1.35}
.lane{position:relative;height:40px;background:#55606E;border-radius:10px;margin:0 0 12px;overflow:hidden}
.lane::after{content:"";position:absolute;left:0;right:0;top:18px;height:4px;background:repeating-linear-gradient(90deg,#FFE27A 0 20px,transparent 20px 40px)}
.lane .cr{position:absolute;left:6px;top:2px;font-size:30px;line-height:1;transition:left 1.4s ease-in;z-index:1}
.lane.go .cr{left:calc(100% - 44px)}
html[dir="rtl"] .lane .cr{left:auto;right:6px;transform:scaleX(-1);transition:right 1.4s ease-in}
html[dir="rtl"] .lane.go .cr{right:calc(100% - 44px)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow button{border:0;border-radius:18px;padding:12px 8px;font-size:21px;font-weight:800;color:#fff;line-height:1.15}
.tfrow button span{display:block;font-size:26px}
.tfrow .yes{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.tfrow .no{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.tfrow button:disabled{opacity:.4}
.tfrow button.picked{opacity:1;outline:3px solid var(--gold);outline-offset:3px}

/* ===== Kad bacaan ===== */
.unitlbl{display:inline-block;background:var(--tc);color:#fff;border-radius:999px;padding:1px 12px;font-weight:800;font-size:14.5px;margin-bottom:6px}
.readtext{font-size:clamp(19px,4.4vw,22px);font-weight:600;line-height:1.5;margin:0 0 12px}
.arbox{background:var(--note);border:2px solid var(--gold);border-radius:16px;padding:8px 14px;margin:0 0 10px;text-align:center}
.arbox .ar{font-size:clamp(21px,5.2vw,27px);display:block}
.arbox small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.maksud{font-size:16.5px;color:var(--muted);font-weight:600;margin:-2px 0 12px;font-style:italic}
.rlist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;counter-reset:r}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:5px 10px;font-weight:700;line-height:1.3;animation:pagein .4s both;animation-delay:calc(var(--i) * 70ms)}
.rlist li::before{counter-increment:r;content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.rlist.bad li::before{content:"✗";background:#8A8FA3}
.tip{background:var(--note);border-radius:16px;padding:8px 12px;margin:0 0 12px;font-weight:600;font-size:17px}
.tip b{display:block;font-size:15px;color:var(--muted)}
.ref{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--muted)}
.navrow{display:grid;grid-template-columns:52px auto 1fr;gap:8px;align-items:center}
.navrow .secondary,.navrow .primary{margin:0;padding:11px 6px;font-size:18px}
.navrow .secondary:disabled{opacity:.35}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:99px}
.comic{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.comic div{position:relative;background:#FFFBEA;color:#3A1F2B;border:3px solid #3A1F2B;border-radius:10px;padding:8px 10px 10px;box-shadow:4px 4px 0 #3A1F2B;font-weight:700;font-size:15.5px;line-height:1.3;animation:pagein .5s both;animation-delay:calc(var(--i) * .5s)}
.comic div b{display:block;font-size:34px;line-height:1.15;text-align:center}
.comic div small{position:absolute;top:4px;inset-inline-start:8px;font-weight:800;font-size:12px;color:#7A5966}
.pantun{background:var(--note);border-radius:16px;padding:10px 16px;margin:0 0 12px;font-weight:700;font-size:18px;line-height:1.55;font-style:italic;border-inline-start:6px solid var(--tc)}
.pantun span{display:block;animation:pagein .4s both;animation-delay:calc(var(--i) * .35s)}
.groups{display:grid;gap:8px;margin:0 0 12px}
.groups div{border-radius:14px;padding:8px 12px;background:var(--bg);border:2px solid var(--line);animation:pagein .4s both;animation-delay:calc(var(--i) * .2s)}
.groups h3{margin:0 0 2px;font-size:17px;color:var(--tc)}
.groups ul{margin:0;padding-inline-start:20px;font-weight:600;font-size:16px;line-height:1.35}

/* Maklum balas & keputusan */
.feedback{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;background:var(--note);font-size:17px;line-height:1.4}
.feedback .mascot{width:76px}
.feedback strong{display:block;font-size:21px}
.streak{display:inline-block;background:var(--gold);color:#3A2600;border-radius:999px;padding:0 10px;font-weight:800;font-size:15px;margin:2px 0 4px}
.primary{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:13px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-shadow)}
.secondary{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:transparent;border-radius:16px;padding:11px;font-size:18px;font-weight:700}
.result{text-align:center}
.result .mascot{width:120px;margin:0 auto}
.result .stars{font-size:54px;letter-spacing:6px;line-height:1.1;margin:4px 0}
.result .stars .off{filter:grayscale(1);opacity:.25}
.result h2{margin:4px 0 2px;font-size:32px;color:var(--brand)}
.result p{margin:0 0 6px;color:var(--muted)}
.unlock{display:inline-block;margin:8px 0 0;background:var(--note);border:2px solid var(--gold);border-radius:999px;padding:3px 14px;font-weight:800}
.earned{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:20px;margin:4px 0}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;top:-50px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
.sparkle{position:fixed;pointer-events:none;font-size:26px;z-index:40;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translateY(-44px) scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
.mascot{display:block;height:auto;flex:none}
.mascot.happy{animation:hop .45s ease 2}
.mascot.sad{animation:tilt .9s ease}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes tilt{30%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rain,.town .car,.town .cloud{display:none}
}

html[dir="rtl"] .hero h1{font-weight:700;line-height:1.35}

let actx;
function tone(freqs, dur=0.12, type="sine"){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sfx = { ok:()=>tone([660,880]), bad:()=>tone([240,180],0.15,"triangle"), tap:()=>tone([520],0.06,"triangle"), whoosh:()=>tone([500,800,1200],0.05), msg:()=>tone([880,1175],0.07), honk:()=>tone([330,330],0.1,"square"), win:()=>tone([523,659,784,1047],0.14) };
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text){
  if(!ttsOK || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(/[“”…]/g,"").replace(/[؀-ۿ]+/g,"").replace(/\p{Extended_Pictographic}/gu,""));
    u.lang = voice ? voice.lang : "ms-MY";
    if(voice) u.voice = voice;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

const GAP = 210, PAD = 130;
function renderMap(){
  stopAnims(); run = null;
  const stops = [...LESSONS.map((t,i)=>({t,i})), {final:true}];
  const W = PAD*2 + (stops.length-1)*GAP;
  const xs = stops.map((_,i)=>PAD + i*GAP);
  let current = LESSONS.findIndex(t=>best[t.id]<1);
  if(current<0) current = LESSONS.length;
  if(current<LESSONS.length && !unlocked(current)) current = -1;
  const visited = LESSONS.filter(t=>best[t.id]>=1).length + (best.final>=1?1:0);
  const stopHTML = stops.map((s,i)=>{
    if(s.final){
      const open = finalUnlocked();
      return `<button class="stop ${open?"":"locked"} ${current===LESSONS.length?"current":""}" style="left:${xs[i]}px;--tc:#E8A317" data-act="station" data-i="final" aria-label="${L(FINAL.title)}">
        <span class="bld"><span class="roof"></span><span class="sign">${open?FINAL.icon:"🔒"}</span><span class="wins"><i></i><i></i></span><span class="door"></span>${best.final>=1?`<span class="done">🏆</span>`:""}</span>
        <span class="plate"><small>${L(FINAL.place)}</small>${L(FINAL.title)}<span class="st">${starsHTML(best.final)}</span></span></button>`;
    }
    const t = s.t, open = unlocked(s.i);
    return `<button class="stop ${open?"":"locked"} ${current===s.i?"current":""}" style="left:${xs[i]}px;--tc:${t.color}" data-act="station" data-i="${s.i}" aria-label="${tx("Pelajaran","ڤلاجرن")} ${t.id}: ${L(t.title)}${open?"":" ("+tx("berkunci","برکونچي")+")"}">
      <span class="bld"><span class="roof"></span><span class="sign">${open?t.icon:"🔒"}</span><span class="num">${t.id}</span><span class="wins"><i></i><i></i><i></i><i></i></span><span class="door"></span>${best[t.id]>=1?`<span class="done">❤️</span>`:""}</span>

/* ============ TONTON & BACA ============ */
function startRead(){ run.c = 0; showCard(); }
function showCard(){
  stopAnims();
  const t = LESSONS[+run.station], c = t.cards[run.c], n = t.cards.length;
  run.say = [R(c.t), ...(c.list||[]).map(R), ...(c.story||[]).map(s=>R(s[1])), ...(c.pantun||[]).map(R), R(c.mk)].filter(Boolean).join(". ");
  let body = "";
  if(c.em) body += bigEm(c.em);
  body += `<span class="unitlbl">${L(c.u)}</span>`;
  if(c.t) body += `<p class="readtext">${L(c.t)}</p>`;
  if(c.list) body += `<ol class="rlist ${c.bad?"bad":""}">${c.list.map((x,i)=>`<li style="--i:${i}">${L(x)}</li>`).join("")}</ol>`;
  if(c.groups) body += `<div class="groups">${c.groups.map(([h,items],i)=>`<div style="--i:${i}"><h3>${i+1}. ${L(h)}</h3><ul>${items.map(x=>`<li>${L(x)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  if(c.story) body += `<div class="comic">${c.story.map(([e,s],i)=>`<div style="--i:${i}"><small>${i+1}</small><b aria-hidden="true">${e}</b>${L(s)}</div>`).join("")}</div>`;
  if(c.pantun) body += `<div class="pantun">${c.pantun.map((x,i)=>`<span style="--i:${i}">${L(x)}</span>`).join("")}</div>`;
  if(c.ar) body += `<div class="arbox"><span class="ar" dir="rtl" lang="ar">${c.ar}</span>${c.src?`<small>${L(c.src)}</small>`:""}</div>`;
  if(c.mk) body += `<p class="maksud">${L(c.mk)}</p>`;
  if(c.tip) body += `<div class="tip"><b>💡 ${tx("Ingat!","ايڠت!")}</b>${L(c.tip)}</div>`;
  body += `<p class="ref" style="margin:-4px 0 12px">📖 ${tx("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</p>`;
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="${tx("Kembali","کمبالي")}">${BACK()}</button><h2>${tx("Tonton & Baca","تونتون & باچ")}<small>${L(t.title)}</small></h2><span class="pill">${run.c+1}/${n}</span></div>
    <div class="progress"><span style="width:${Math.round((run.c+1)/n*100)}%"></span></div>
    <div class="card page-in" style="--tc:${t.color}">
      ${body}
      <div class="navrow">
        <button class="secondary" data-act="cprev" aria-label="${tx("Kad sebelum","کد سبلوم")}" ${run.c===0?"disabled":""}>${isJ()?"▶":"◀"}</button>
        ${ttsOK&&run.say?`<button class="pill" data-act="say" style="padding:9px 12px">🔊 ${tx("Dengar","دڠر")}</button>`:"<span></span>"}
        <button class="primary" data-act="cnext">${run.c+1<n?tx("Seterusnya","ستروسڽ"):tx("Mula Cabaran","مولا چابرن")} ${isJ()?"◀":"▶"}</button>
      </div>
      <div class="dots" aria-hidden="true">${[...Array(n)].map((_,i)=>`<i class="${i===run.c?"on":""}"></i>`).join("")}</div>
    </div>`;
}

/* ============ CABARAN ============ */
function startPlay(){
  const src = run.station==="final" ? FINAL.qs : LESSONS[+run.station].qs;
  run = Object.assign(run, {qs:shuffle(src), i:0, score:0, heart:0, streak:0});
  showQ();
}
function qTitle(){
  if(run.station==="final") return `${L(FINAL.title)}<small>${L(FINAL.sub)}</small>`;
  const t = LESSONS[+run.station];
  return `${tx("Pelajaran","ڤلاجرن")} ${t.id}<small>${L(t.title)}</small>`;
}

function showQ(){
  stopAnims();
  const q = run.qs[run.i];
  run.q = q; run.done = false; run.mist = 0;
  const qq = q.q || [`${R(q.name)} menghantar mesej kepada kamu. Bagaimana kamu membalasnya?`,`${q.name[1]} مڠهنتر ميسيج کڤد کامو. باڬايمان کامو ممبالسڽ؟`];
  run.say = R(qq);
  let body = "", showQ = true;
  switch(q.type){
    case "plane":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      if(!run.opts.some(o=>isAr(o.t))) run.say += ". " + run.opts.map(o=>R(o.t)).join(". ");
      body = `<div class="planes">${run.opts.map((o,k)=>`<button class="plane" data-act="plane" data-k="${k}">${PLANE}${T(o.t)}</button>`).join("")}</div>`;
      break;
    case "path":
      showQ = false;
      run.opts = shuffle(q.a.map((o,i)=>({t:o[0],c:o[1],ok:i===0})));
      run.say += ". " + run.opts.map(o=>R(o.t)).join(". ");
      body = `<div class="story">${q.em?`<span class="se" aria-hidden="true">${q.em}</span>`:""}<p>${L(q.q)}</p></div>
        <p class="hint">${tx("Pilih jalan yang terbaik!","ڤيليه جالن يڠ ترباءيق!")}</p>
        <div class="fork">${run.opts.map((o,k)=>`<button class="signpost" data-act="path" data-k="${k}"><span class="k" aria-hidden="true">🪧</span>${L(o.t)}</button>`).join("")}</div><div id="cons"></div>`;
      break;
    case "chat":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      body = `<div class="phone"><div class="ph-top"><span class="av" aria-hidden="true">${q.who}</span><span>${L(q.name)}<small>${tx("dalam talian","دالم تالين")}</small></span></div>
          <div class="ph-body" id="phb">${q.msgs.map((m,i)=>`<div class="pm in" style="animation-delay:${i*.4}s">${L(m)}</div>`).join("")}</div></div>
        <p class="hint">${tx("Pilih balasan yang paling baik.","ڤيليه بالسن يڠ ڤاليڠ باءيق.")}</p>
        <div class="replies">${run.opts.map((o,k)=>`<button class="reply" data-act="reply" data-k="${k}">${L(o.t)}</button>`).join("")}</div>`;
      break;
    case "spot": {
      run.left = q.items.filter(x=>x[2]).length;
      body = `<p class="hint">${q.good?tx("Tekan semua yang betul.","تکن سموا يڠ بتول."):tx("Tekan kelakuan yang salah.","تکن کلاکوان يڠ ساله.")} <span class="counter" id="sleft">🔍 ${run.left} ${tx("lagi","لاڬي")}</span></p>
        <div class="scene-grid">${shuffle(q.items.map((it,i)=>({it,i}))).map((o,k)=>`<button class="spot ${q.good?"target-good":""}" data-act="spot" data-i="${o.i}" style="--d:-${k*0.4}s"><span class="se" aria-hidden="true">${o.it[0]}</span>${L(o.it[1])}</button>`).join("")}</div>`;
      break; }
    case "komik":
      run.next = 0;
      body = `<p class="hint">${tx("Tekan panel mengikut urutan cerita.","تکن ڤانل مڠيکوت اوروتن چريتا.")}</p>
        <div class="frames">${q.panels.map((_,i)=>`<div class="frame" id="f${i}"><span class="fn">${i+1}</span>🎞️</div>`).join("")}</div>
        <div class="pool">${shuffle(q.panels.map((p,i)=>({p,i}))).map(o=>`<button class="panel" data-act="panel" data-i="${o.i}"><span class="pe" aria-hidden="true">${o.p[0]}</span>${L(o.p[1])}</button>`).join("")}</div>`;
      break;
    case "face": {
      run.queue = shuffle(q.items); run.si = 0;
      const lb = q.l || [["Baik","باءيق"],["Tidak baik","تيدق باءيق"]];
      body = `<div class="facecard" id="fc"></div>
        <div class="faces" dir="ltr"><button class="face f1" data-act="face" data-g="1">${faceSVG(true)}${L(lb[0])}</button><button class="face f0" data-act="face" data-g="0">${faceSVG(false)}${L(lb[1])}</button></div>
        <div class="bins" dir="ltr"><div id="bin1"></div><div id="bin0"></div></div>`;
      break; }
    case "hafaz":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      body = `<div class="dalil" dir="rtl"><span class="ar" lang="ar">${q.pre}</span><span class="gap" id="gap">؟</span>${q.post?`<span class="ar" lang="ar">${q.post}</span>`:""}</div>
        ${q.mk?`<p class="mk">${L(q.mk)}</p>`:""}
        <div class="inks">${run.opts.map((o,k)=>`<button class="ink" data-act="ink" data-k="${k}">${T(o.t)}</button>`).join("")}</div>`;
      break;
    case "tf":
      showQ = false;
      body = `<div class="tl"><div class="tlight y" id="tlight" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="stmt">${L(q.q)}</div></div>
        <div class="lane" id="lane" aria-hidden="true"><span class="cr">🚗</span></div>
        <div class="tfrow"><button class="yes" data-act="tf" data-v="1"><span aria-hidden="true">🟢</span>${tx("Betul","بتول")}</button><button class="no" data-act="tf" data-v="0"><span aria-hidden="true">🔴</span>${tx("Salah","ساله")}</button></div>`;
      break;
  }
  const tag = q.tag ? `<span class="tag">${P(q.tag)}</span>` : "";
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="${tx("Kembali","کمبالي")}">${BACK()}</button><h2>${qTitle()}</h2><span class="pillstat">${HEART} ${run.heart}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${run.qs.length}" aria-valuenow="${run.i}"><span style="width:${Math.round(run.i/run.qs.length*100)}%"></span></div>
    <div class="card page-in">
      <div class="qmeta"><span><span class="qtype">${(isJ()?TYPE_J:TYPE_R)[q.type]}</span>${tag}</span><span style="display:flex;gap:6px;align-items:center"><span style="color:var(--muted);font-size:15px">${run.i+1}/${run.qs.length}</span>${ttsOK?`<button class="pill" data-act="say" aria-label="${tx("Dengar soalan","دڠر سوالن")}">🔊</button>`:""}</span></div>
      ${showQ?`<p class="qtext">${L(qq)}</p>`:""}
      ${body}
      <div id="fb" aria-live="polite"></div>
    </div>`;
  if(q.type==="face") showFaceItem();
}

function finishQ(ok, extra=""){
  run.done = true;
  if(ok){ run.score++; run.heart++; run.streak++; } else run.streak = 0;
  const q = run.q, last = run.i+1 >= run.qs.length;
  const title = ok ? (run.mist ? tx("Bagus, hampir sempurna!","باڬوس، همڤير سمڤورنا!") : pick(isJ()?PRAISE_J:PRAISE_R)) : tx("Tidak mengapa, mari belajar!","تيدق مڠاڤ، ماري بلاجر!");
  $("fb").innerHTML = `<div class="feedback">${mascot(ok?"happy":"sad")}<div><strong>${title}</strong>${ok?`<span class="streak">+1 ${tx("hati","هاتي")} ❤️</span> `:""}${ok&&run.streak>=3?`<span class="streak">🔥 ${run.streak} ${tx("berturut-turut!","برتوروت٢!")}</span>`:""}<br>${extra}${L(q.e)}<div class="ref">📖 ${tx("Rujuk buku teks ms.","روجوق بوکو تيکس م.س.")} ${q.p}</div></div></div>
    <button class="primary" data-act="next">${last?tx("Lihat keputusan","ليهت کڤوتوسن"):tx("Soalan seterusnya","سوالن ستروسڽ")}</button>`;
  ok ? sfx.ok() : sfx.bad();
  const b = $("fb").querySelector(".primary"); b.focus({preventScroll:true}); b.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
}

/* Kapal terbang kertas */
function ansPlane(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".plane")];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  sfx.whoosh();
  if(ok) btns[k].classList.add("ok");
  else { btns[k].classList.add("bad"); setTimeout(()=>btns[right].classList.add("ok"), 500); }
  hush(); finishQ(ok);
}
/* Pilih jalan */
function ansPath(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".signpost")];
  btns.forEach(b=>b.disabled=true);
  const o = run.opts[k], ok = o.ok;
  btns[k].classList.add(ok?"ok":"bad");
  $("cons").innerHTML = `<div class="cons ${ok?"good":"sad"}"><span class="cf" aria-hidden="true">${ok?"😊":"😟"}</span>${L(o.c)}</div>`;
  let extra = "";
  if(!ok){ const b = run.opts.find(x=>x.ok); extra = `${tx("Pilihan terbaik:","ڤيليهن ترباءيق:")} <b>${L(b.t)}</b>. `; btns[run.opts.indexOf(b)].classList.add("ok"); }
  hush(); setTimeout(()=>finishQ(ok, extra), 500);
}
/* Balas mesej */
async function ansReply(k){
  if(run.done || run.busy) return;
  run.busy = true;
  const btns = [...app.querySelectorAll(".reply")];
  btns.forEach(b=>b.disabled=true);
  const ok = run.opts[k].ok, tok = animTok, phb = $("phb");
  btns[k].classList.add(ok?"ok":"bad");
  phb.insertAdjacentHTML("beforeend", `<div class="pm out">${L(run.opts[k].t)} ✓✓</div>`); sfx.msg();
  await wait(500); if(tok!==animTok) return;
  phb.insertAdjacentHTML("beforeend", `<div class="pm in typing" id="typing"><i>•</i><i>•</i><i>•</i></div>`);
  await wait(900); if(tok!==animTok) return;
  $("typing").remove();
  phb.insertAdjacentHTML("beforeend", `<div class="pm in">${L(run.q.re[ok?0:1])}</div>`); sfx.msg();
  if(!ok) btns[run.opts.findIndex(o=>o.ok)].classList.add("ok");
  run.busy = false;
  hush(); finishQ(ok);
}
/* Detektif */
function ansSpot(b){
  if(run.done || b.disabled) return;
  const it = run.q.items[+b.dataset.i];
  b.disabled = true;
  if(it[2]){
    sfx.tap(); b.classList.add("found"); sparkle(b, run.q.good?"⭐":"🔍"); run.left--;
    $("sleft").textContent = `🔍 ${run.left} ${tx("lagi","لاڬي")}`;
    if(run.left===0){ app.querySelectorAll(".spot").forEach(x=>x.disabled=true); setTimeout(()=>finishQ(run.mist<=1),350); }
  } else { run.mist++; sfx.bad(); b.classList.add("nope"); }
}
/* Susun komik */
function ansPanel(b){
  if(run.done) return;
  const i = +b.dataset.i;
  if(i===run.next){
    sfx.tap();
    const p = run.q.panels[i], f = $("f"+i);
    f.className = "frame f"; f.innerHTML = `<span class="fn">${i+1}</span><span class="pe" aria-hidden="true">${p[0]}</span>${L(p[1])}`;
    b.remove(); run.next++;
    if(run.next===run.q.panels.length) finishQ(run.mist<=1);
  } else { run.mist++; sfx.bad(); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
}
/* Muka ceria / muram */
function showFaceItem(){
  const it = run.queue[run.si], c = $("fc"); if(!c) return;
  c.className = "facecard"; void c.offsetWidth;
  c.innerHTML = `<span>${L(it[0])}<small>${run.queue.length-run.si} ${tx("lagi","لاڬي")}</small></span>`;
}
function ansFace(b){
  if(run.done || run.busy) return;
  const g = +b.dataset.g, it = run.queue[run.si], ok = g===it[1];
  run.busy = true;
  const target = app.querySelector(`.face[data-g="${it[1]}"]`);
  target.classList.remove("react"); void target.offsetWidth; target.classList.add("react");
  if(ok) sfx.tap(); else { run.mist++; sfx.bad(); }
  $("fc").classList.add(it[1]?"goL":"goR");
  $("bin"+it[1]).insertAdjacentHTML("beforeend", `<i class="${ok?"":"x"}">${ok?"✓ ":"❗"}${L(it[0])}</i>`);
  setTimeout(()=>{
    run.busy = false; run.si++;
    if(run.si>=run.queue.length){
      $("fc").className="facecard"; $("fc").innerHTML = tx("Siap! ✔️","سياڤ! ✔️");
      app.querySelectorAll(".face").forEach(x=>x.disabled=true);
      finishQ(run.mist<=1, run.mist?tx("Item bertanda ❗ telah dipindahkan ke tempat yang betul. ","ايتم برتندا ❗ تله دڤينداهکن ک تمڤت يڠ بتول. "):"");
    } else showFaceItem();
  }, ok?380:650);
}
/* Lengkapkan dalil */
function ansInk(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".ink")];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  btns[right].classList.add("ok"); if(!ok) btns[k].classList.add("bad","shake");
  const g = $("gap"); g.textContent = run.opts[right].t; g.classList.add("w");
  hush(); finishQ(ok);
}
/* Lampu isyarat */
function ansTF(btn){
  if(run.done) return;
  app.querySelectorAll(".tfrow button").forEach(b=>b.disabled=true);
  btn.classList.add("picked");
  const ok = (btn.dataset.v==="1")===run.q.ans;
  $("tlight").className = "tlight " + (run.q.ans?"g":"r");
  if(ok){ $("lane").classList.add("go"); sfx.honk(); }
  hush(); finishQ(ok, `${tx("Jawapan:","جواڤن:")} <b>${run.q.ans?tx("Betul","بتول"):tx("Salah","ساله")}</b>. `);
}

function nextQ(){
  run.i++;
  if(run.i < run.qs.length){ showQ(); window.scrollTo(0,0); }
  else finishRound();
}
function finishRound(){
  stopAnims();
  const isFinal = run.station==="final";
  const key = isFinal ? "final" : LESSONS[+run.station].id;
  const n = run.qs.length, s = run.score, pct = s/n;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0;
  const wasFinalOpen = finalUnlocked();
  const nextIdx = isFinal ? -1 : +run.station+1;
  const wasNextOpen = nextIdx>0 && nextIdx<LESSONS.length ? unlocked(nextIdx) : true;
  const prev = best[key];
  if(stars>prev){ best[key]=stars; save("a3-best",best); }
  hearts += run.heart; save("a3-hati",hearts);
  const msgs = [];
  if(nextIdx>0 && nextIdx<LESSONS.length && !wasNextOpen && unlocked(nextIdx)) msgs.push(tx(`🚶 Tempat baharu dibuka: ${L(LESSONS[nextIdx].place)}!`,`🚶 تمڤت بهارو دبوک: ${L(LESSONS[nextIdx].place)}!`));
  if(!isFinal && !wasFinalOpen && finalUnlocked()) msgs.push(tx("🎪 Pesta Akhlak kini dibuka!","🎪 ڤستا اخلاق کيني دبوک!"));
  const titles = isJ() ? ["جوم چوبا سکالي لاڬي","بوليه چوبا لاڬي","باڬوس!","چمرلڠ!"] : ["Jom cuba sekali lagi","Boleh cuba lagi","Bagus!","Cemerlang!"];
  const label = isFinal ? L(FINAL.title) : `${tx("Pelajaran","ڤلاجرن")} ${key}: ${L(LESSONS[+run.station].title)}`;
  app.innerHTML = `
    <div class="card result page-in" style="margin-top:18px">
      ${mascot(stars>=2?"happy":"idle")}
      <p style="margin:4px 0 0">${label}</p>
      <div class="stars" role="img" aria-label="${stars} / 3">${starsHTML(stars)}</div>
      <h2>${titles[stars]}</h2>
      <p>${tx(`Kamu menjawab ${s} daripada ${n} soalan dengan betul.`,`کامو منجواب ${s} درڤد ${n} سوالن دڠن بتول.`)}</p>
      <div class="earned">+${run.heart} ${HEART} ${tx("hati kebaikan","هاتي کباءيقن")}</div>
      ${stars>prev?`<p>${tx("Rekod baharu!","ريکود بهارو!")}</p>`:""}
      ${stars===0?`<p>${tx("Dapatkan sekurang-kurangnya 1 bintang (separuh betul) untuk ke tempat seterusnya. Cuba “Tonton & Baca” dahulu.","داڤتکن سکورڠ٢ڽ 1 بينتڠ (سڤاروه بتول) اونتوق ک تمڤت ستروسڽ. چوبا “تونتون & باچ” دهولو.")}</p>`:""}
      ${msgs.map(m=>`<div class="unlock">${m}</div>`).join("<br>")}
      ${isFinal&&stars===3?`<div class="unlock">🏆 ${tx("Tahniah! Kamu juara Akhlak Tahun 3!","تهنية! کامو جوارا اخلاق تاهون 3!")}</div>`:""}
      <button class="primary" data-act="map">${tx("Kembali ke kampung","کمبالي ک کامڤوڠ")} 🏘️</button>
      <button class="secondary" data-act="again">${tx("Main lagi","ماٴين لاڬي")}</button>
    </div>`;
  sfx.win();
  if(stars===3) rain();
  window.scrollTo(0,0);
}
function rain(){
  if(REDUCED) return;
  const box = document.createElement("div"); box.className = "rain";
  for(let i=0;i<28;i++){
    const s = document.createElement("span");
    s.textContent = pick(["❤️","💖","⭐","✨","🌸"]);
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (2+Math.random()*2)+"s";
    s.style.animationDelay = (Math.random()*0.8)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4500);
}

/* ============ PERISTIWA ============ */
app.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || b.disabled) return;
  switch(b.dataset.act){
    case "mute": muted=!muted; save("a3-muted",muted); b.textContent=muted?"🔇":"🔊"; b.setAttribute("aria-label",muted?"Hidupkan bunyi":"Matikan bunyi"); if(muted) hush(); break;
    case "lang": lang = isJ() ? "rumi" : "jawi"; save("kafa-lang",lang); applyLang(); renderMap(); break;
    case "teacher": teacher=!teacher; save("a3-teacher",teacher); renderMap(); break;
    case "scrl": $("street").scrollBy({left:+b.dataset.d*GAP*1.5}); break;
    case "map": renderMap(); window.scrollTo(0,0); break;
    case "station": openStation(b.dataset.i); break;
    case "station-back": openStation(run.station); break;
    case "read": startRead(); window.scrollTo(0,0); break;
    case "cprev": if(run.c>0){ run.c--; showCard(); } break;
    case "cnext": { const n=LESSONS[+run.station].cards.length; if(run.c+1<n){ run.c++; showCard(); } else startPlay(); window.scrollTo(0,0); break; }
    case "play": startPlay(); window.scrollTo(0,0); break;
    case "say": if(run && run.say) speak(run.say); break;
    case "plane": ansPlane(+b.dataset.k); break;
    case "path": ansPath(+b.dataset.k); break;
    case "reply": ansReply(+b.dataset.k); break;
    case "spot": ansSpot(b); break;
    case "panel": ansPanel(b); break;
    case "face": ansFace(b); break;
    case "ink": ansInk(+b.dataset.k); break;
    case "tf": ansTF(b); break;
    case "next": nextQ(); break;
    case "again": startPlay(); window.scrollTo(0,0); break;
  }
});

applyLang();
renderMap();
</script>
</body>
</html>
