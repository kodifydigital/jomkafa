<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zon Arked • KAFA Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1ECFF; --surface:#FFFFFF; --ink:#1E1640; --muted:#5F5689; --line:#DCD3F5;
  --brand:#7C3AED; --brand-ink:#FFFFFF; --brand-shadow:#5521B5; --gold:#F5B400;
  --ok:#14A05A; --bad:#E5484D; --note:#FFF3C9;
  --red:#E5484D; --blue:#2F7BFF;
  --pattern:rgba(124,58,237,.10);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0820; --surface:#1A1236; --ink:#F1ECFF; --muted:#B9AEE3; --line:#33285E;
    --brand:#A78BFA; --brand-ink:#170A3A; --brand-shadow:#6D45D9; --gold:#FFCB3D;
    --ok:#2BC173; --bad:#FF6B6F; --note:#3A3016;
    --pattern:rgba(167,139,250,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0820; --surface:#1A1236; --ink:#F1ECFF; --muted:#B9AEE3; --line:#33285E;
  --brand:#A78BFA; --brand-ink:#170A3A; --brand-shadow:#6D45D9; --gold:#FFCB3D;
  --ok:#2BC173; --bad:#FF6B6F; --note:#3A3016;
  --pattern:rgba(167,139,250,.08);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background-image:linear-gradient(var(--pattern) 1px,transparent 1px),linear-gradient(90deg,var(--pattern) 1px,transparent 1px);background-size:28px 28px}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Baloo 2",serif;font-size:20px;line-height:1.8}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;line-height:1.5}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
a.iconbtn{text-decoration:none;color:inherit}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.grp{display:flex;gap:8px;align-items:center}

/* ===== Laman arked ===== */
.marquee{position:relative;margin:10px 0 0;border-radius:26px;padding:16px 18px;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 15% 20%,rgba(255,79,216,.55),transparent 40%),radial-gradient(circle at 90% 80%,rgba(0,229,255,.45),transparent 45%),linear-gradient(135deg,#2A0E61,#120634);
  box-shadow:0 6px 0 #0A0320,0 0 0 3px #FF4FD8 inset}
.marquee h1{margin:0;font-size:clamp(32px,8vw,48px);line-height:1.05;font-weight:800;text-shadow:0 0 12px #FF4FD8,0 0 2px #fff}
html[dir="rtl"] .marquee h1{line-height:1.5;font-weight:700}
.marquee p{margin:4px 0 0;opacity:.92;max-width:min(520px,calc(100% - 56px))}
.marquee .bulbs{position:absolute;inset:6px;border-radius:22px;pointer-events:none;background:radial-gradient(circle,#FFE45C 2.5px,transparent 3.5px) 0 0/22px 22px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:5px;animation:bulb 1s steps(2) infinite}
@keyframes bulb{50%{opacity:.35}}
.marquee .joy{position:absolute;inset-inline-end:12px;top:12px;font-size:48px;opacity:.9}
.sec{margin:20px 0 8px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.chipsel{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chipsel button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.chipsel button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:10px 12px;text-align:start;font-weight:800;font-size:18px;line-height:1.2}
.mode small{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-top:2px;line-height:1.3}
.mode .e{font-size:28px;display:block}
.mode[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.cabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:460px){.cabs{grid-template-columns:1fr 1fr;gap:10px}}
.cab{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;border:0;border-radius:24px 24px 14px 14px;padding:12px 8px 12px;color:#fff;
  background:linear-gradient(180deg,var(--c) 0 34%,#16082F 34% 100%);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000);min-height:200px;overflow:hidden}
.cab .scr{width:86%;aspect-ratio:4/3;border-radius:12px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 55%,#000),#07021A);border:3px solid #000;display:grid;place-items:center;font-size:44px;box-shadow:0 0 18px color-mix(in srgb,var(--c) 70%,transparent) inset}
.cab .scr span{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.cab b{display:block;margin-top:8px;font-size:18px;line-height:1.2}
html[dir="rtl"] .cab b{line-height:1.6}
.cab small{display:block;font-size:13.5px;opacity:.85;line-height:1.3;margin-top:2px}
.cab .hi{margin-top:auto;font-size:13px;font-weight:800;background:rgba(255,255,255,.14);border-radius:999px;padding:0 10px}
.cab .knob{position:absolute;left:12px;top:44%;width:14px;height:14px;border-radius:50%;background:#FF4FD8;box-shadow:16px 0 0 #00E5FF}
.cab:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 45%,#000)}
.cab.lock{filter:grayscale(.8) brightness(.8)}
.foot{margin-top:18px;color:var(--muted);font-size:15px;text-align:center}

/* ===== HUD ===== */
.hud{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
.hud .sc{font-weight:800;font-size:22px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:0 14px;min-width:84px;text-align:center}
.hud .combo{font-weight:800;font-size:15px;background:var(--gold);color:#3A2600;border-radius:999px;padding:1px 10px;opacity:0;transition:opacity .2s}
.hud .combo.on{opacity:1;animation:pop .3s}
.hud .hearts{font-size:20px;letter-spacing:1px}
.hud .team{font-weight:800;color:#fff;border-radius:999px;padding:1px 12px;font-size:15px}
.hud .sp{flex:1}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 8px}
.tbar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#00E5FF,#7C3AED,#FF4FD8);transform-origin:left;transition:transform .2s linear}
html[dir="rtl"] .tbar span{transform-origin:right}
.tbar.low span{background:var(--bad)}
.prompt{position:relative;text-align:center;font-weight:800;font-size:clamp(19px,4.8vw,24px);line-height:1.25;color:#fff;background:linear-gradient(90deg,#7C3AED,#C026D3);border-radius:18px;padding:8px 14px;margin:0 0 8px;box-shadow:0 4px 0 #4C1D95}
html[dir="rtl"] .prompt{line-height:1.7}
.prompt.new{animation:newp .6s ease}
@keyframes newp{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:none}}
.prompt small{display:block;font-size:13px;opacity:.85;font-weight:700}
@keyframes pop{50%{transform:scale(1.15)}}

/* ===== Padang permainan ===== */
.field{position:relative;height:min(62vh,540px);min-height:380px;border-radius:24px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,#1B0B45,#2E0F5C 60%,#3B1170);border:3px solid #000;box-shadow:0 0 0 3px #FF4FD8,0 0 24px rgba(255,79,216,.35)}
.field .lab{display:inline-block;background:#fff;color:#1E1640;border-radius:12px;padding:1px 9px 3px;font-weight:800;font-size:15px;line-height:1.2;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.35);max-width:150px}
html[dir="rtl"] .field .lab{line-height:1.6}
.field .lab .ar{font-size:22px;line-height:1.5;font-weight:700;display:inline-block}
.it{position:absolute;left:0;top:0;will-change:transform;border:0;background:none;padding:0}
.fx{position:absolute;pointer-events:none;font-weight:800;font-size:22px;color:#FFE45C;text-shadow:0 2px 0 #000;animation:fx .8s ease-out forwards;z-index:9;transform:translate(-50%,-50%)}
.fx.bad{color:#FF6B6F}
@keyframes fx{to{transform:translate(-50%,-160%) scale(1.3);opacity:0}}
.flash{position:absolute;inset:0;pointer-events:none;background:rgba(229,72,77,.35);animation:flash .35s ease-out forwards;z-index:8}
@keyframes flash{to{opacity:0}}
/* Ketuk mol */
.holes{position:absolute;inset:4% 3% 3%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px}
.hole{position:relative;border:0;background:none;padding:0;overflow:visible}
.hole::after{content:"";position:absolute;left:8%;right:8%;bottom:6%;height:26%;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#0A0320 55%,#5B2A0E 57%,#7A3B12 75%,transparent 77%)}
.pit{position:absolute;left:0;right:0;top:0;bottom:19%;overflow:hidden;z-index:1;pointer-events:none}
.mole{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);transition:transform .16s ease-out;display:flex;flex-direction:column;align-items:center;width:100%}
.hole.up .mole{transform:translate(-50%,0)}
.mole .face{font-size:clamp(34px,9vw,48px);line-height:1}
.mole .lab{font-size:13.5px;max-width:96%;margin-bottom:2px}
html[dir="rtl"] .mole .lab{font-size:14px}
.hole.bonk .face{animation:bonk .3s}
@keyframes bonk{50%{transform:scaleY(.6)}}
.hole.oops .lab{background:#FFB3B5}
.hole.yay .lab{background:#B8F5CF}
.hammer{position:absolute;pointer-events:none;font-size:40px;z-index:7;transform:translate(-30%,-80%) rotate(-30deg);animation:hammer .25s ease-out forwards}
@keyframes hammer{50%{transform:translate(-30%,-80%) rotate(20deg)}100%{transform:translate(-30%,-80%) rotate(0);opacity:0}}
/* Tangkap */
.basket{position:absolute;bottom:6px;left:0;width:104px;height:64px;transform:translateX(-50%);z-index:5;pointer-events:none;display:grid;place-items:end center;font-size:54px;line-height:1;filter:drop-shadow(0 0 8px rgba(0,229,255,.7))}
.basket.gulp{animation:pop .25s}
.drop{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.drop .st{font-size:20px;line-height:1}
.ctlrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ctlrow button{border:0;border-radius:16px;padding:10px;font-size:26px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
/* Belon */
.bal{display:flex;flex-direction:column;align-items:center}
.bal .b{position:relative;width:96px;height:112px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.7),transparent 22%),var(--bc);display:grid;place-items:center;padding:8px;box-shadow:inset -8px -10px 0 rgba(0,0,0,.15)}
.bal .b::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:8px solid var(--bc)}
.bal .str{width:2px;height:36px;background:rgba(255,255,255,.6)}
.bal .lab{font-size:13.5px;max-width:88px;padding:1px 6px 2px}
.bal.popped .b{animation:popb .25s forwards}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
/* Lorong */
.road{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);background:repeating-linear-gradient(180deg,transparent 0 40px,rgba(255,255,255,.04) 40px 80px)}
.road .lane{border-inline-end:3px dashed rgba(255,255,255,.25);background:none;border-top:0;border-bottom:0;border-inline-start:0;padding:0}
.road .lane:last-child{border-inline-end:0}
.road.run{animation:scroll .6s linear infinite}
@keyframes scroll{to{background-position:0 80px}}
.gaterow{position:absolute;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 6px;pointer-events:none}
.gaterow .gt{display:grid;place-items:center;min-height:64px;border-radius:14px;background:rgba(255,255,255,.12);border:3px solid #00E5FF;box-shadow:0 0 12px rgba(0,229,255,.5)}
.gaterow .gt .lab{max-width:100%}
.gaterow .gt.yes{border-color:#2BC173;background:rgba(43,193,115,.3)}
.gaterow .gt.no{border-color:#FF6B6F;background:rgba(255,107,111,.3)}
.runner{position:absolute;bottom:14px;width:33.33%;text-align:center;font-size:52px;line-height:1;transition:left .15s ease-out;pointer-events:none;z-index:4}
.runner span{display:inline-block;animation:runb .3s ease-in-out infinite alternate}
@keyframes runb{to{transform:translateY(-6px)}}
/* Panjat susun */
.climb{position:absolute;inset:0;display:grid;grid-template-columns:96px 1fr;gap:8px;padding:10px}
.ladder{position:relative;border-radius:14px;background:repeating-linear-gradient(180deg,transparent 0 30px,#C68642 30px 36px),linear-gradient(90deg,#8B5A2B 0 10px,transparent 10px calc(100% - 10px),#8B5A2B calc(100% - 10px))}
.ladder .flag{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:30px}
.climber{position:absolute;left:50%;font-size:44px;line-height:1;transform:translate(-50%,0);transition:bottom .35s ease-out}
.cside{display:flex;flex-direction:column;gap:8px;overflow:auto}
.slots{display:flex;flex-direction:column;gap:5px}
.slots .sl{min-height:38px;border:2px dashed rgba(255,255,255,.35);border-radius:12px;display:flex;align-items:center;gap:8px;padding:2px 8px;color:#fff;font-weight:800}
.slots .sl.f{border-style:solid;border-color:#2BC173;background:rgba(43,193,115,.25);animation:pop .3s}
.slots .sl .ar{font-size:20px}
.cpick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cpick button{border:0;background:none;padding:0}
.cpick button.shake .lab{background:#FFB3B5;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* Duel */
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;height:min(66vh,560px);min-height:420px}
.pan{position:relative;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;color:#fff;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 50%,#000));box-shadow:0 5px 0 color-mix(in srgb,var(--tc) 40%,#000)}
.pan.red{--tc:var(--red)}.pan.blue{--tc:var(--blue)}
.pan .nm{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
.pan .nm b{font-size:34px;line-height:1}
.pan .dq{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 10px;font-weight:800;text-align:center;font-size:16.5px;line-height:1.3}
html[dir="rtl"] .pan .dq{line-height:1.7}
.pan .ops{display:grid;gap:8px;flex:1;align-content:center}
.pan .ops button{border:0;border-radius:16px;background:#fff;color:#1E1640;font-weight:800;font-size:18px;padding:8px;min-height:58px;box-shadow:0 4px 0 rgba(0,0,0,.3);line-height:1.25}
html[dir="rtl"] .pan .ops button{line-height:1.6}
.pan .ops button .ar{font-size:24px}
.pan .ops button.ok{background:#B8F5CF}
.pan .ops button.no{background:#FFB3B5;animation:shake .35s}
.pan.locked .ops{opacity:.45}
.pan.win{animation:pop .4s}
@media (max-width:620px){
  .duel{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:calc(100vh - 120px);min-height:520px}
  .duel .pan.red{transform:rotate(180deg)}
}
/* 3D */
.field.f3d{background:#000}
.field.f3d canvas{width:100%!important;height:100%!important;touch-action:none}
.cab .dimtag{position:absolute;top:8px;inset-inline-end:8px;background:#00E5FF;color:#08203A;font-size:12px;font-weight:800;border-radius:999px;padding:0 8px;z-index:1}
/* Lapisan */
.over{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:rgba(10,3,32,.72);color:#fff;text-align:center;padding:16px;border-radius:inherit}
.over .cd{font-size:110px;font-weight:800;line-height:1;text-shadow:0 0 24px #FF4FD8;animation:cd .9s ease-out}
@keyframes cd{from{transform:scale(2);opacity:0}}
.over h2{margin:0 0 6px;font-size:28px}
.over p{margin:0 0 10px}
.btn{display:block;width:100%;margin-top:12px;border:0;border-radius:16px;padding:12px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:18px}
.btn:active{transform:translateY(3px)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.result{text-align:center}
.result .big{font-size:64px;font-weight:800;line-height:1;color:var(--brand)}
.result .trophy{font-size:64px;line-height:1}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0}
.versus div{border-radius:18px;color:#fff;padding:8px;font-weight:800}
.versus div b{display:block;font-size:40px;line-height:1.1}
.versus .r{background:var(--red)}.versus .b{background:var(--blue)}
.versus .w{outline:4px solid var(--gold);outline-offset:3px}
.review{text-align:start;margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.review li{background:var(--bg);border-radius:12px;padding:6px 10px;font-size:15.5px;line-height:1.35}
html[dir="rtl"] .review li{line-height:1.7}
.review li .ar{font-size:20px}
.review b{color:var(--bad)}
.turn{display:inline-block;border-radius:999px;color:#fff;padding:2px 16px;font-weight:800;font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;top:-50px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
.howto{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none;text-align:start}
.howto li{background:rgba(255,255,255,.1);border-radius:12px;padding:4px 10px;font-size:16px;line-height:1.35}
html[dir="rtl"] .howto li{line-height:1.7}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rain{display:none}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const BANK = {}, BANK_ORDER = {};
BANK.sirah = [
{ p:["Pilih nama dalam nasab Nabi SAW","ڤيليه نام دالم نسب نبي ﷺ"],
  ok:[["Kilab bin Murrah","کلاب بن مرة"],["Qusai","قصي"],["Abdu Manaf","عبد مناف"],["Hasyim","هاشم"],["Abdul Muttalib","عبد المطلب"],["Abdullah","عبدالله"],["Zuhrah","زهرة"],["Wahab","وهب"]],
  no:[["Abrahah","أبرهة"],["Abu Jahal","أبو جهل"],["Abu Lahab","أبو لهب"],["Maisarah","ميسرة"],["Umayyah bin Al-Mughirah","أمية بن المغيرة"],["Salman Al-Farisi","سلمان الفارسي"]],

let threeP = null;
function need3D(){
  if(!threeP) threeP = window.THREE ? Promise.resolve(true) : new Promise(res=>{
    const s = document.createElement("script"); s.src = THREE_URL;
    s.onload = () => res(!!window.THREE); s.onerror = () => { threeP = null; res(false); };
    document.head.appendChild(s);
  });
  const fonts = document.fonts
    ? Promise.race([Promise.all(['700 40px "Baloo 2"','700 40px "Noto Naskh Arabic"','700 40px Amiri'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,2500))]).catch(()=>{})
    : Promise.resolve();

}

/* Label teks sebagai tekstur (Rumi, Jawi atau teks al-Quran) */
const texCache = new Map();
function labelTex(it, o={}){
  const txt = Array.isArray(it) ? L(it) : it, ar = /[؀-ۿ]/.test(txt), quran = !Array.isArray(it);
  const k = `${txt}|${o.bg||""}|${o.w||0}`;
  if(texCache.has(k)) return texCache.get(k);
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const fs = quran ? 60 : ar ? 48 : 44;
  const font = `700 ${fs}px ${quran ? 'Amiri,"Noto Naskh Arabic",serif' : ar ? '"Noto Naskh Arabic",Amiri,serif' : '"Baloo 2","Trebuchet MS",sans-serif'}`;
  x.font = font;
  const maxW = o.w || 400, lines = []; let cur = "";
  for(const w of txt.split(" ")){ const t = cur ? cur+" "+w : w; if(x.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const lh = fs*(ar?1.5:1.18), tw = Math.max(...lines.map(l=>x.measureText(l).width));
  c.width = Math.ceil(Math.max(tw, o.minW||0) + 52); c.height = Math.ceil(lh*lines.length + 30);
  x.font = font; x.direction = ar ? "rtl" : "ltr"; x.textAlign = "center"; x.textBaseline = "middle";
  const r = 26, W_ = c.width, H_ = c.height;
  x.beginPath(); x.moveTo(r,0); x.arcTo(W_,0,W_,H_,r); x.arcTo(W_,H_,0,H_,r); x.arcTo(0,H_,0,0,r); x.arcTo(0,0,W_,0,r); x.closePath();
  x.fillStyle = o.bg || "#FFFFFF"; x.fill(); x.lineWidth = 6; x.strokeStyle = o.line || "rgba(30,22,64,.25)"; x.stroke();
  x.fillStyle = o.fg || "#1E1640";
  lines.forEach((l,i)=>x.fillText(l, W_/2, 15 + lh*(i+0.5) + (ar?fs*0.06:fs*0.04)));
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const res = {t, a:W_/H_}; texCache.set(k, res); return res;
}
function labelSprite(it, h=0.55, o){
  const {t, a} = labelTex(it, o);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false}));
  s.scale.set(h*a, h, 1); s.renderOrder = 10; s.userData.h = h; return s;
}
function setLabel(s, it, o){ const {t, a} = labelTex(it, o); s.material.map = t; s.material.needsUpdate = true; s.scale.set(s.userData.h*a, s.userData.h, 1); }
function fitLabel(s, maxW){ if(s.scale.x > maxW){ const k = maxW/s.scale.x; s.scale.multiplyScalar(k); } }
function burst(pos, color, n=10){
  const parts = [];
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), mat(color, {emissive:color, emissiveIntensity:.4}));
    m.position.copy(pos); m.userData.v = new THREE.Vector3(rnd(-3,3), rnd(1,4), rnd(-2,2)); G.scene.add(m); parts.push(m);
  }
  G.parts = (G.parts||[]).concat(parts.map(m=>({m, t:0.6})));
}
function stepParts(dt){
  if(!G.parts) return;
  G.parts = G.parts.filter(p=>{ p.t -= dt; p.m.userData.v.y -= 9*dt; p.m.position.addScaledVector(p.m.userData.v, dt); p.m.scale.setScalar(Math.max(0.01, p.t/0.6));
    if(p.t<=0){ G.scene.remove(p.m); return false; } return true; });
}
function sky(scene, n=60, spread=30){
  const g = new THREE.BufferGeometry(), pts = [];
  for(let i=0;i<n;i++) pts.push(rnd(-spread,spread), rnd(4,18), rnd(-30,-8));
  g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xffffff, size:0.12})));
}
function tree(x, z, s=1){
  const g = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.12*s, 0.16*s, 0.8*s, 8), mat(0x8B5A2B)); tr.position.y = 0.4*s; g.add(tr);

}

    G.bgeo = new THREE.SphereGeometry(0.62, 28, 20);
  },
  update(dt){
    G.spawnT -= dt;
    if(G.spawnT<=0 && G.items.length<7){
      G.spawnT = Math.max(0.55, 1.0 - G.el*0.007);
      const d = drawItem(), col = new THREE.Color(pick(BCOL)), g = new THREE.Group();
      const b = new THREE.Mesh(G.bgeo, mat(col, {roughness:.25, metalness:.05})); b.scale.set(1, 1.18, 1); g.add(b);
      const knot = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.16, 8), mat(col)); knot.position.y = -0.78; knot.rotation.x = Math.PI; g.add(knot);
      const sg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-0.85,0), new THREE.Vector3(0.08,-1.4,0), new THREE.Vector3(-0.05,-2,0)]);

      g.position.set(x0, -2.6, rnd(-0.6, 0.6)); G.scene.add(g); b.userData.o = true;
      G.items.push({g, b, lab, it:d.it, ok:d.ok, x0, ph:rnd(0,6), vy:Math.min(2.3, 1.0 + G.el*0.022), col});
    }
    for(const o of G.items.slice()){
      o.ph += dt*1.6; o.g.position.y += o.vy*dt; o.g.position.x = o.x0 + Math.sin(o.ph)*0.35; o.g.rotation.z = Math.sin(o.ph)*0.12;

  pointer(e, ndc){

MOD3.run = {
  init(){
    W3.setup({bg:0x2A0E61, fov:58, fog:[18,55]});
    const {scene, cam} = G, asp = G.W/G.H;
    cam.position.set(0, 3.4 + 1.2/asp, 7.5 + 1.5/asp); cam.lookAt(0, 1, -6);
    sky(scene, 80, 30);
    const road = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 140), mat(0x3A3550)); road.rotation.x = -Math.PI/2; road.position.z = -50; scene.add(road);
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(80, 140), mat(0x1F5A35)); grass.rotation.x = -Math.PI/2; grass.position.set(0, -0.02, -50); scene.add(grass);
    G.dashes = []; G.trees = [];
    for(let i=0;i<14;i++) [-1.1, 1.1].forEach(x=>{ const d = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 1.2), new THREE.MeshBasicMaterial({color:0xFFE45C})); d.position.set(x, 0.01, 8 - i*5); scene.add(d); G.dashes.push(d); });
    for(let i=0;i<10;i++) [-1, 1].forEach(s=>{ const t = tree(s*rnd(4.5,6.5), 8 - i*7, rnd(1,1.5)); scene.add(t); G.trees.push(t); });
    const p = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.9, 16), mat(0xFF7A45)); body.position.y = 1.05; p.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 18, 14), mat(0xF2C9A0)); head.position.y = 1.8; p.add(head);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.31, 18, 10, 0, Math.PI*2, 0, Math.PI/2), mat(0xFFFFFF)); cap.position.y = 1.85; p.add(cap);
    G.legs = [-0.15, 0.15].map(x=>{ const l = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.6, 0.18), mat(0x2F7BFF)); l.geometry.translate(0, -0.3, 0); l.position.set(x, 0.62, 0); p.add(l); return l; });
    G.arms = [-0.42, 0.42].map(x=>{ const a = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.55, 0.14), mat(0xFF7A45)); a.geometry.translate(0, -0.25, 0); a.position.set(x, 1.4, 0); p.add(a); return a; });
    p.position.set(0, 0, 2); p.rotation.y = Math.PI; scene.add(p); G.player = p;
    G.lane = 1; G.px = 0; G.gate = null; G.gwait = 0.6; G.speed = 9;
  },
  spawn(){
    const ok = pick(G.set.ok), nos = shuffle(G.set.no).slice(0,2);
    const cells = shuffle([{it:ok, ok:true}, ...nos.map(it=>({it, ok:false}))]);
    const g = new THREE.Group(), panels = [];
    cells.forEach((c,i)=>{
      const {t, a} = labelTex(c.it, {w:380, minW:300});
      const w = 1.9, h = Math.min(1.5, w/a);
      const pm = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({map:t, transparent:true}));
      pm.position.set((i-1)*2.2, 1.7, 0); pm.userData.lane = i; g.add(pm); panels.push(pm);
      const frame = new THREE.Mesh(new THREE.BoxGeometry(w+0.16, h+0.16, 0.06), mat(0x00E5FF, {emissive:0x00A5C0, emissiveIntensity:.6})); frame.position.set((i-1)*2.2, 1.7, -0.05); g.add(frame); c.frame = frame;
    });
    [-3.3, 3.3].forEach(x=>{ const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.6, 8), mat(0xFF4FD8, {emissive:0xFF4FD8, emissiveIntensity:.5})); post.position.set(x, 1.3, 0); g.add(post); });
    g.position.z = -45; G.scene.add(g);
    G.gate = {g, cells, panels, done:false};
  },
  update(dt){
    G.speed = Math.min(20, 9 + G.el*0.17);
    const mv = G.speed*dt;
    G.dashes.forEach(d=>{ d.position.z += mv; if(d.position.z > 10) d.position.z -= 70; });
    G.trees.forEach(t=>{ t.position.z += mv; if(t.position.z > 12) t.position.z -= 70; });
    const tx = (G.lane-1)*2.2; G.px += (tx - G.px)*Math.min(1, dt*12); G.player.position.x = G.px; G.player.rotation.z = (G.px - tx)*0.15;
    const sw = Math.sin(G.el*14);
    G.legs[0].rotation.x = sw*0.8; G.legs[1].rotation.x = -sw*0.8; G.arms[0].rotation.x = -sw*0.7; G.arms[1].rotation.x = sw*0.7;
    G.player.position.y = Math.abs(sw)*0.08;
    if(!G.gate){ G.gwait -= dt; if(G.gwait<=0) this.spawn(); }
    else {
      const g = G.gate; g.g.position.z += mv;
      if(!g.done && g.g.position.z >= G.player.position.z - 0.2){
        g.done = true;
        g.cells.forEach(c=>{ c.frame.material.color.set(c.ok ? 0x2BC173 : 0xFF6B6F); c.frame.material.emissive.set(c.ok ? 0x2BC173 : 0xFF6B6F); });
        const c = g.cells[G.lane], p = W3.screen(new THREE.Vector3(G.px, 2.2, G.player.position.z));
        burst(new THREE.Vector3(G.px, 1.6, G.player.position.z - 0.5), c.ok ? 0xFFE45C : 0xFF6B6F, 10);
        c.ok ? good(p.x, p.y, c.it) : bad(p.x, p.y, c.it, g.cells.find(z=>z.ok).it);
      }
      if(g.g.position.z > 12){ G.scene.remove(g.g); G.gate = null; G.gwait = 0.25; }
    }
    stepParts(dt); W3.render();
  },
  setLane(l){ G.lane = Math.max(0, Math.min(2, l)); sfx.tick(); },
  nudge(dir){ this.setLane(G.lane + dir); },
  pointer(e, ndc){
    if(G.gate && !G.gate.done){ const h = W3.hit(ndc, G.gate.panels); if(h){ this.setLane(h.object.userData.lane); return; } }
    const p = W3.screen(G.player.position.clone().setY(1)), r = G.R.domElement.getBoundingClientRect(), x = e.clientX - r.left;
    if(x < p.x - 25) this.nudge(-1); else if(x > p.x + 25) this.nudge(1);
  },
  key(e){ if(e.key==="ArrowLeft"){ this.nudge(-1); e.preventDefault(); } if(e.key==="ArrowRight"){ this.nudge(1); e.preventDefault(); } },
  clear(){ if(G.gate){ G.scene.remove(G.gate.g); G.gate = null; G.gwait = 0.5; } },
  dispose(){ W3.dispose(); }
};

MOD3.climb = {
  init(){
    W3.setup({bg:0x1B0B45, fov:50});
    const {scene, cam} = G, asp = G.W/G.H;
    G.camY = 0; G.camD = 8.5 + 1.6/asp;
    cam.position.set(0, 4.2, G.camD); cam.lookAt(0, 1.6, 0);
    sky(scene, 100, 25);
    const floor = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 0.3, 40), mat(0x3B1170)); floor.position.y = -0.15; scene.add(floor);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.6, 0.4, 24), mat(0xFFC93C, {metalness:.3, roughness:.4})); base.position.set(0, 0.2, -1.5); scene.add(base);
    G.tower = []; G.blocks = []; G.fly = []; G.used = []; G.steps = 0;
  },
  newSeq(s){
    G.blocks.forEach(b=>G.scene.remove(b.m)); G.blocks = [];
    const n = s.items.length, order = shuffle(s.items.map((it,k)=>({it,k})));
    const span = W3.halfW(G.camD-2.5)*2*0.92, cols3 = n>4 && span>6.6 ? 3 : 2;
    G.bw = Math.min(2.4, span/cols3 - 0.2);
    order.forEach((o,i)=>{
      const c = i % cols3, r = Math.floor(i / cols3), rows = Math.ceil(n/cols3);
      const {t, a} = labelTex(o.it, {w:Array.isArray(o.it)?360:700});
      const w = G.bw, h = Math.max(0.55, Math.min(1.1, w/a));
      const face = new THREE.MeshStandardMaterial({map:t, roughness:.7});
      const side = mat(pick([0xFF5C8A,0x3DD6F5,0x7CE36A,0xB57BFF,0xFFB020]));
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.7), [side, side, side, side, face, side]);
      m.position.set((c-(cols3-1)/2)*(w+0.2), 0.45 + h/2 + r*1.05, 2.5 - r*1.1); m.rotation.x = -0.35;
      m.userData = {k:o.k, h, x0:m.position.x}; G.scene.add(m);
      G.blocks.push({m, it:o.it, k:o.k, shake:0});
    });
  },
  update(dt){
    G.fly = G.fly.filter(f=>{ f.t += dt/0.5; const k = Math.min(1, f.t), e = 1-Math.pow(1-k, 3);
      f.m.position.lerpVectors(f.a, f.b, e); f.m.position.y += Math.sin(k*Math.PI)*1.6; f.m.rotation.x = -0.35*(1-e); f.m.rotation.y = e*Math.PI*2*(f.spin||0);
      return k<1; });
    G.blocks.forEach(b=>{ if(b.shake>0){ b.shake -= dt; b.m.position.x = b.m.userData.x0 + Math.sin(b.shake*60)*0.08*(b.shake/0.35); } });
    const top = G.tower.reduce((a,b)=>a+b.userData.h, 0);
    const want = Math.max(0, top - 2.2);
    G.camY += (want - G.camY)*Math.min(1, dt*3);
    G.cam.position.set(Math.sin(G.el*0.4)*0.8, 4.2 + G.camY, G.camD); G.cam.lookAt(0, 1.6 + G.camY, 0);
    stepParts(dt); W3.render();
  },
  pointer(e, ndc){
    const h = W3.hit(ndc, G.blocks.map(b=>b.m)); if(!h) return;
    const b = G.blocks.find(x=>x.m===h.object); if(!b) return;
    const want = G.seq.items[G.next], p = W3.screen(b.m.position);
    if(key(b.it)===key(want)){
      G.blocks = G.blocks.filter(x=>x!==b);
      const y = G.tower.reduce((a,t)=>a+t.userData.h, 0) + 0.4 + b.m.userData.h/2;
      G.fly.push({m:b.m, a:b.m.position.clone(), b:new THREE.Vector3(0, y, -1.5), t:0, spin:Math.random()<0.5?1:0});
      G.tower.push(b.m); G.next++; G.steps = (G.steps||0) + 1;
      good(p.x, p.y, want);
      if(G.next===G.seq.items.length){
        G.score += 20; fx(G.W*0.5, 60, "+20 🎉"); sfx.win(); hud();
        const tk = G.tok;
        setTimeout(()=>{ if(!G || G.over || G.tok!==tk) return;
          burst(new THREE.Vector3(0, y+0.6, -1.5), 0xFFE45C, 18);
          G.tower.forEach(m=>G.scene.remove(m)); G.tower = []; nextOrder(); }, 900);
      }
    } else { b.shake = 0.35; bad(p.x, p.y, b.it, want); }
  },
  clear(){},
  dispose(){ W3.dispose(); }
};

function tone(freqs, dur=0.1, type="sine", vol=0.16){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(vol,s+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sfx = { ok:()=>tone([784,1047],0.08,"square",0.08), bad:()=>tone([220,150],0.14,"sawtooth",0.09), pop:()=>tone([1200,500],0.05,"triangle"), bonk:()=>tone([180,120],0.06,"square",0.12),
  tick:()=>tone([660],0.05,"square",0.06), go:()=>tone([523,784,1047],0.1,"square",0.08), win:()=>tone([523,659,784,1047,1319],0.12,"square",0.08), level:()=>tone([660,880,1100],0.07,"triangle") };
const muteBtn = () => `<button class="iconbtn" data-act="mute" aria-label="${muted?"Hidupkan bunyi":"Matikan bunyi"}">${muted?"🔇":"🔊"}</button>`;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2800);
}

function start(){
  const g = G.g;
  if(g.duel) return startDuel();
  const team = G.turns[G.ti];
  Object.assign(G, {score:0, lives:LIVES, dur: team==="solo"?DUR.solo:DUR.kelas, el:0, streak:0, good:0, badn:0, log:[], set:null, setHits:0, setT:0, items:[], uid:0, over:false, paused:true, spawnT:0});

async function countdown(done){
  const f = $("field") || $("duel"), tok = G.tok;
  const o = document.createElement("div"); o.className = "over"; f.appendChild(o);
  for(const n of ["3","2","1",tx("Mula!","مولا!")]){
    if(!G || G.tok!==tok) return;
    o.innerHTML = `<div class="cd">${n}</div>`; n.length>1 ? sfx.go() : sfx.tick();
    await new Promise(r=>setTimeout(r, REDUCED?250:700));
  }
  o.remove(); if(G && G.tok===tok) done();
}
function loop(ts, tok){
  if(!G || G.tok!==tok || G.over) return;
  if(G.paused){ G.last = ts; requestAnimationFrame(t=>loop(t,tok)); return; }
  const dt = Math.min(0.05, Math.max(0, (ts-G.last)/1000)); G.last = ts;
  G.el += dt; G.setT += dt;
  const left = Math.max(0, G.dur - G.el);
  const tb = $("tbar"); if(tb){ tb.firstElementChild.style.transform = `scaleX(${left/G.dur})`; tb.classList.toggle("low", left<10); }
  if(G.g.id!=="climb" && G.setT>22) newSet();
  G.mod.update(dt);
  if(left<=0 || G.lives<=0) return endTurn();
  requestAnimationFrame(t=>loop(t,tok));
}
function newSet(){
  const B = bank(); if(!B.length) return;
  let s = pick(B); for(let k=0;k<5 && G.set && s.p[0]===G.set.p[0];k++) s = pick(B);
  G.set = s; G.setHits = 0; G.setT = 0;
  if(G.mod && G.mod.clear) G.mod.clear();
  showPrompt(s.p, s.sub);
}
function showPrompt(p, sub){
  const el = $("prompt"); if(!el) return;
  el.innerHTML = `${subj==="mix"?`<small>${SUB(sub).icon} ${tx(SUB(sub).r,SUB(sub).j)}</small>`:""}🎯 ${L(p)}`;
  el.classList.remove("new"); void el.offsetWidth; el.classList.add("new");
  if(G.el>0.5) sfx.level();
}
function drawItem(){
  const vis = new Set(G.items.map(x=>key(x.it)));
  const okFree = G.set.ok.filter(x=>!vis.has(key(x))), noFree = G.set.no.filter(x=>!vis.has(key(x)));
  const visOk = G.items.some(x=>x.ok);
  const wantOk = okFree.length && (!noFree.length || !visOk || Math.random()<0.5);
  const it = wantOk ? pick(okFree) : pick(noFree.length?noFree:G.set.no);
  return {it, ok: G.set.ok.includes(it)};
}
const mult = () => Math.min(4, 1 + Math.floor(G.streak/3));
function fx(x, y, txt, bad){
  const e = document.createElement("div"); e.className = "fx"+(bad?" bad":""); e.textContent = txt;
  e.style.left = x+"px"; e.style.top = y+"px"; G.field.appendChild(e); setTimeout(()=>e.remove(), 800);
}
function good(x, y, it, extra=0){
  const m = mult(), pts = 10*m + extra;
  G.score += pts; G.streak++; G.good++; G.setHits++;
  fx(x, y, "+"+pts); sfx.ok(); hud();
  if(G.setHits>=5 && G.g.id!=="climb"){ const tk = G.tok; setTimeout(()=>{ if(G && !G.over && G.tok===tk) newSet(); }, 250); }
}
function bad(x, y, it, right){
  G.lives--; G.streak = 0; G.badn++;
  G.log.push({p:G.set.p, it, right});
  fx(x, y, "✗", true); sfx.bad();
  const f = document.createElement("div"); f.className = "flash"; G.field.appendChild(f); setTimeout(()=>f.remove(), 400);
  if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
  hud();
}
function hud(){
  const s = $("sc"); if(s) s.textContent = G.score;
  const c = $("combo"); if(c){ const m = mult(); c.textContent = "🔥 x"+m; c.classList.toggle("on", m>1); }
  const h = $("hearts"); if(h) h.textContent = "❤️".repeat(Math.max(0,G.lives)) + "🖤".repeat(LIVES-Math.max(0,G.lives));
}
function rel(e){ const r = G.field.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function onKey(e){
  if(!G || G.over) return;
  if(e.key===" " && !G.g.duel){ e.preventDefault(); togglePause(); return; }
  const m = G.mod; if(m && m.key) m.key(e);
}
function togglePause(){
  if(!G || G.over || G.g.duel) return;
  const f = $("field"); if(!f) return;
  if(!G.paused){
    G.paused = true;
    const o = document.createElement("div"); o.className = "over"; o.id = "pause";
    o.innerHTML = `<div style="width:min(320px,90%)"><h2>⏸ ${tx("Jeda","جيدا")}</h2><button class="btn" data-act="resume">▶ ${tx("Sambung","سمبوڠ")}</button><button class="btn alt" data-act="quit">${tx("Keluar","کلوار")}</button></div>`;
    f.appendChild(o);
  } else { const o = $("pause"); if(o) o.remove(); G.paused = false; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && G && !G.over && !G.paused && G.field) togglePause(); });

const MOD = {};
/* Ketuk Mol */
MOD.whack = {
  init(){
    G.holes = [...Array(9)].map(()=>({up:false, t:0, it:null}));
    G.field.innerHTML = `<div class="holes">${G.holes.map((_,i)=>`<button class="hole" data-act="hole" data-i="${i}" aria-label="${tx("Lubang","لوبڠ")} ${i+1}"><span class="pit"><span class="mole"><span class="lab" dir="auto"></span><span class="face" aria-hidden="true">🐹</span></span></span></button>`).join("")}</div>`;
  },
  update(dt){
    G.spawnT -= dt;
    const upN = G.holes.filter(h=>h.up).length;
    if(G.spawnT<=0 && upN < (G.el>25?3:2)){
      G.spawnT = Math.max(0.5, 1.05 - G.el*0.009);
      const free = G.holes.map((h,i)=>i).filter(i=>!G.holes[i].up && !G.holes[i].busy);
      if(free.length){
        const i = pick(free), h = G.holes[i];
        G.items = G.holes.filter(x=>x.up).map(x=>({it:x.it, ok:x.ok}));
        const d = drawItem();
        Object.assign(h, {up:true, t:Math.max(1.15, 2.1 - G.el*0.012), it:d.it, ok:d.ok, hit:false});
        const b = G.field.querySelector(`.hole[data-i="${i}"]`);
        b.classList.remove("bonk","oops","yay"); b.querySelector(".lab").innerHTML = LAB(d.it); b.classList.add("up");
      }
    }
    G.holes.forEach((h,i)=>{ if(h.up){ h.t -= dt; if(h.t<=0) this.down(i); } });
  },
  down(i, delay=0){
    const h = G.holes[i]; h.up = false; h.busy = true;
    setTimeout(()=>{ if(!G || !G.field) return; const b = G.field.querySelector(`.hole[data-i="${i}"]`); if(b) b.classList.remove("up"); setTimeout(()=>{ if(G && G.holes) h.busy = false; }, 200); }, delay);
  },
  tap(b){
    const i = +b.dataset.i, h = G.holes[i]; if(!h.up || h.hit) return;
    h.hit = true; sfx.bonk();
    const r = b.getBoundingClientRect(), f = G.field.getBoundingClientRect(), x = r.left-f.left+r.width/2, y = r.top-f.top+r.height*0.45;
    const hm = document.createElement("div"); hm.className = "hammer"; hm.textContent = "🔨"; hm.style.left = x+"px"; hm.style.top = y+"px"; G.field.appendChild(hm); setTimeout(()=>hm.remove(), 300);
    b.classList.add("bonk", h.ok?"yay":"oops");
    h.ok ? good(x, y, h.it) : bad(x, y, h.it);
    this.down(i, 280);
  },
  clear(){ if(G.holes) G.holes.forEach((h,i)=>{ if(h.up) this.down(i); }); }
};
/* Item jatuh / naik (asas tangkap & belon) */
function addItem(cls, inner, x, y, vy, extra){
  const d = drawItem(), id = ++G.uid;
  const el = document.createElement("button"); el.className = "it "+cls; el.dataset.act = "it"; el.dataset.id = id;
  el.innerHTML = inner(d.it); G.field.appendChild(el);
  const o = Object.assign({id, el, it:d.it, ok:d.ok, x, y, vy, w:el.offsetWidth||100, h:el.offsetHeight||40}, extra||{});
  G.items.push(o); place(o); return o;
}
function place(o){ o.el.style.transform = `translate(${o.x - o.w/2}px, ${o.y - o.h/2}px)`; }
function removeItem(o){ o.el.remove(); G.items = G.items.filter(x=>x!==o); }
/* Tangkap Bintang */
MOD.catch = {
  init(){ G.bx = G.W/2; G.tx = G.W/2; G.field.innerHTML = `<div class="basket" id="basket" aria-hidden="true">🧺</div>`; this.drawB(); },
  drawB(){ const b = $("basket"); if(b) b.style.left = G.bx+"px"; },
  update(dt){
    G.spawnT -= dt;
    if(G.spawnT<=0){ G.spawnT = Math.max(0.6, 1.15 - G.el*0.008); const x = rnd(60, G.W-60);
      addItem("", it=>`<span class="drop"><span class="st">⭐</span><span class="lab" dir="auto">${LAB(it)}</span></span>`, x, -30, Math.min(210, 85 + G.el*2)); }
    if(G.hold) G.tx = G.bx + G.hold*400*dt*3;
    G.tx = Math.max(52, Math.min(G.W-52, G.tx));
    const dx = G.tx - G.bx, step = 900*dt; G.bx += Math.abs(dx)<step ? dx : Math.sign(dx)*step; this.drawB();
    for(const o of G.items.slice()){
      o.y += o.vy*dt; place(o);
      if(o.y > G.H-74 && o.y < G.H-20 && Math.abs(o.x-G.bx) < 40 + o.w/2*0.6){
        const b = $("basket"); b.classList.remove("gulp"); void b.offsetWidth; b.classList.add("gulp");
        o.ok ? good(o.x, o.y, o.it) : bad(o.x, o.y, o.it); removeItem(o);
      } else if(o.y > G.H+30) removeItem(o);
    }
  },
  move(e){ G.tx = rel(e).x; },
  key(e){ if(e.key==="ArrowLeft"){ G.tx = G.bx-90; e.preventDefault(); } if(e.key==="ArrowRight"){ G.tx = G.bx+90; e.preventDefault(); } },
  clear(){ G.items.slice().forEach(removeItem); }
};
/* Pecah Belon */
const BCOL = ["#FF5C8A","#FFB020","#3DD6F5","#7CE36A","#B57BFF","#FF7A45"];
MOD.pop = {
  init(){ G.field.innerHTML = ""; },
  update(dt){
    G.spawnT -= dt;
    if(G.spawnT<=0 && G.items.length<7){ G.spawnT = Math.max(0.55, 1.0 - G.el*0.007);
      const x = rnd(55, G.W-55), c = pick(BCOL);

    const el = document.createElement("div"); el.className = "gaterow";
    el.innerHTML = cells.map(c=>`<div class="gt"><span class="lab" dir="auto">${LAB(c.it)}</span></div>`).join("");
    G.field.appendChild(el);
    G.gate = {el, cells, y:-90, v:Math.min(300, 120 + G.el*2.6), done:false};
  },
  update(dt){
    if(!G.gate){ G.gwait -= dt; if(G.gwait<=0) this.spawn(); return; }
    const g = G.gate; g.y += g.v*dt; g.el.style.top = g.y+"px";
    if(!g.done && g.y + g.el.offsetHeight >= G.H-80){
      g.done = true;
      const c = g.cells[G.lane], x = (G.lane+0.5)*G.W/3, y = G.H-100;
      [...g.el.children].forEach((d,i)=>d.classList.add(g.cells[i].ok?"yes":"no"));
      c.ok ? good(x, y, c.it) : bad(x, y, c.it, g.cells.find(z=>z.ok).it);
    }
    if(g.y > G.H+10){ g.el.remove(); G.gate = null; G.gwait = 0.25; }
  },
  setLane(l){ G.lane = Math.max(0, Math.min(2, l)); this.drawP(); sfx.tick(); },
  key(e){ if(e.key==="ArrowLeft"){ this.setLane(G.lane-1); e.preventDefault(); } if(e.key==="ArrowRight"){ this.setLane(G.lane+1); e.preventDefault(); } },
  clear(){ if(G.gate){ G.gate.el.remove(); G.gate = null; G.gwait = 0.5; } }
};
/* Panjat Susun */
MOD.climb = {
  init(){
    G.steps = 0; G.used = [];
    G.field.innerHTML = `<div class="climb"><div class="ladder"><span class="flag" aria-hidden="true">🚩</span><span class="climber" id="climber" aria-hidden="true">🧗</span></div><div class="cside"><div class="slots" id="slots"></div><div class="cpick" id="cpick"></div></div></div>`;
    this.drawC();
  },
  drawC(){ const c = $("climber"); if(c) c.style.bottom = (6 + (G.steps%8)*11)+"%"; },
  update(){},
  tap(b){
    const k = +b.dataset.k, want = G.seq.items[G.next];
    const r = b.getBoundingClientRect(), f = G.field.getBoundingClientRect(), x = r.left-f.left+r.width/2, y = r.top-f.top;
    if(key(G.seq.items[k])===key(want)){
      b.remove(); const s = $("slots").children[G.next]; s.classList.add("f"); s.innerHTML = `${G.next+1}. ${LAB(want)}`;
      G.next++; G.steps++; this.drawC(); good(x, y, want);
      if(G.next===G.seq.items.length){ G.score += 20; fx(G.W*0.6, 40, "+20 🎉"); sfx.win(); hud(); const tk = G.tok; setTimeout(()=>{ if(G && !G.over && G.tok===tk) nextOrder(); }, 600); }
    } else {
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      bad(x, y, G.seq.items[k], want);
    }
  }
};
function nextOrder(){
  const O = orders(); if(!O.length) return;
  let avail = O.filter(o=>!G.used.includes(o.p[0])); if(!avail.length){ G.used = []; avail = O; }
  const s = pick(avail); G.used.push(s.p[0]);
  G.seq = s; G.set = s; G.next = 0; G.setT = 0;
  showPrompt(s.p, s.sub);
  if(G.mod && G.mod.newSeq){ G.mod.newSeq(s); return; }
  $("slots").innerHTML = s.items.map((_,i)=>`<div class="sl">${i+1}.</div>`).join("");
  $("cpick").innerHTML = shuffle(s.items.map((it,k)=>({it,k}))).map(o=>`<button data-act="cpk" data-k="${o.k}"><span class="lab" dir="auto">${LAB(o.it)}</span></button>`).join("");
}

/* ============ DUEL ============ */
function startDuel(){
  const solo = G.turns[0]==="solo";
  Object.assign(G, {qn:0, pts:{red:0, blue:0}, over:false, log:[], solo});
  G.tok = Math.random();
  const pan = (t) => `<div class="pan ${t}" id="pan-${t}"><div class="nm"><span>${L(TEAM[t==="red"&&solo?"robot":t==="blue"&&solo?"me":t])}</span><b id="pt-${t}">0</b></div><div class="dq" id="dq-${t}"></div><div class="ops" id="op-${t}"></div></div>`;
  app.innerHTML = `<div class="hud"><button class="iconbtn" data-act="home" aria-label="${tx("Keluar","کلوار")}">✕</button><span class="sp"></span><span class="sc" id="dqn">1/${DUEL_N}</span></div>
    <div class="duel ${solo?"solo":""}" id="duel" style="position:relative">${pan("red")}${pan("blue")}</div>`;
  if(solo){ const st = document.createElement("style"); st.textContent = ".duel.solo .pan.red{transform:none!important}"; app.appendChild(st); }
  countdown(()=>duelQ());
  window.scrollTo(0,0);
}
function duelQ(){
  const B = bank(), s = pick(B), ok = pick(s.ok), opts = [{it:ok, ok:true}, ...shuffle(s.no).slice(0,2).map(it=>({it, ok:false}))];
  G.dq = {s, opts, lock:{red:false, blue:false}, done:false, tok:Math.random()};
  $("dqn").textContent = `${G.qn+1}/${DUEL_N}`;
  ["red","blue"].forEach(t=>{
    const order = shuffle(opts.map((_,i)=>i));
    $("dq-"+t).innerHTML = `${subj==="mix"?SUB(s.sub).icon+" ":""}${L(s.p)}`;
    $("op-"+t).innerHTML = order.map(i=>`<button data-act="dopt" data-t="${t}" data-i="${i}">${LAB(opts[i].it)}</button>`).join("");
    $("pan-"+t).classList.remove("locked","win");
  });
  if(G.solo){
    const tok = G.dq.tok, wait = rnd(2800, 5600);
    setTimeout(()=>{ if(!G || !G.dq || G.dq.tok!==tok || G.dq.done) return;
      const i = Math.random()<0.65 ? 0 : 1 + Math.floor(Math.random()*2);
      const b = $("op-red").querySelector(`[data-i="${i}"]`); if(b) duelAns("red", i, b); }, wait);
  }
}
function duelAns(t, i, b){
  const q = G.dq; if(!q || q.done || q.lock[t]) return;
  if(q.opts[i].ok){
    q.done = true; G.pts[t]++; b.classList.add("ok"); sfx.ok();
    $("pt-"+t).textContent = G.pts[t]; $("pan-"+t).classList.add("win");
    const other = t==="red"?"blue":"red"; const ob = $("op-"+other).querySelector(`[data-i="0"]`); if(ob) ob.classList.add("ok");
    setTimeout(duelNext, 1300);
  } else {
    q.lock[t] = true; b.classList.add("no"); sfx.bad(); $("pan-"+t).classList.add("locked");
    if(t==="blue" || !G.solo) G.log.push({p:q.s.p, it:q.opts[i].it, right:q.opts[0].it});
    if(q.lock.red && q.lock.blue){ q.done = true; ["red","blue"].forEach(x=>{ const ob=$("op-"+x).querySelector(`[data-i="0"]`); if(ob) ob.classList.add("ok"); }); setTimeout(duelNext, 1700); }
  }
}
function duelNext(){
  if(!G || G.over) return;
  G.qn++;
  if(G.qn>=DUEL_N) return duelEnd();
  duelQ();
}
function duelEnd(){
  G.over = true;
  const r = G.pts.red, b = G.pts.blue, solo = G.solo;
  const nm = t => L(TEAM[solo ? (t==="red"?"robot":"me") : t]);
  const win = r===b ? null : r>b ? "red" : "blue";
  showResult(`<div class="trophy">${win?"🏆":"🤝"}</div>
    <h2 style="margin:4px 0;font-size:30px;color:var(--brand)">${win ? `${nm(win)} ${tx("menang!","مناڠ!")}` : tx("Seri!","سري!")}</h2>
    <div class="versus"><div class="r ${win==="red"?"w":""}">${nm("red")}<b>${r}</b></div><span>VS</span><div class="b ${win==="blue"?"w":""}">${nm("blue")}<b>${b}</b></div></div>`, win && (!solo || win==="blue"));
}

/* ============ TAMAT ============ */
function endTurn(){
  G.over = true;
  const team = G.turns[G.ti];
  G.results[team] = {score:G.score, good:G.good, bad:G.badn, log:G.log};
  if(G.ti+1 < G.turns.length){
    const nextT = G.turns[G.ti+1];
    const f = $("field"); const o = document.createElement("div"); o.className = "over";
    o.innerHTML = `<div><h2>${tx("Masa tamat!","ماس تامت!")}</h2><p>${L(TEAM[team])}: <b style="font-size:30px">${G.score}</b></p><button class="btn" data-act="nextturn" style="background:var(--${nextT})">${tx("Giliran","ڬيليرن")} ${L(TEAM[nextT])} ▶</button></div>`;
    f.appendChild(o); sfx.level(); return;
  }
  if(team==="solo"){
    const gk = gkey(G.gid), prev = hiOf(subj, gk), rec = G.score > prev;
    if(rec){ hi[subj] = Object.assign({}, hi[subj], {[gk]:G.score}); save("ark3-hi", hi); }
    const acc = G.good+G.badn ? Math.round(G.good/(G.good+G.badn)*100) : 0;
    showResult(`<div class="trophy">${rec?"🏆":G.lives<=0?"💥":"⏱️"}</div>
      <p style="margin:0;color:var(--muted)">${G.lives<=0?tx("Nyawa habis!","ڽاوا هابيس!"):tx("Masa tamat!","ماس تامت!")}</p>
      <div class="big">${G.score}</div>
      <p>${rec?`🎉 ${tx("Rekod baharu!","ريکود بهارو!")}`:`🏆 ${tx("Rekod","ريکود")}: ${prev}`}</p>
      <p>✅ ${G.good} • ❌ ${G.badn} • 🎯 ${acc}%</p>`, rec, G.log);
  } else {
    const r = G.results.red.score, b = G.results.blue.score, win = r===b ? null : r>b ? "red" : "blue";
    showResult(`<div class="trophy">${win?"🏆":"🤝"}</div>
      <h2 style="margin:4px 0;font-size:30px;color:var(--brand)">${win ? `${L(TEAM[win])} ${tx("menang!","مناڠ!")}` : tx("Seri!","سري!")}</h2>
      <div class="versus"><div class="r ${win==="red"?"w":""}">${L(TEAM.red)}<b>${r}</b></div><span>VS</span><div class="b ${win==="blue"?"w":""}">${L(TEAM.blue)}<b>${b}</b></div></div>`, !!win, [...G.results.red.log, ...G.results.blue.log]);
  }
}
function showResult(inner, party, log){
  drop3D();
  log = log || (G && G.log) || [];
  const seen = new Set(), rv = log.filter(x=>{ const k = key(x.it); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,6);
  const gid = G.gid;
  document.removeEventListener("keydown", onKey);
  app.innerHTML = `<div class="card result" style="margin-top:14px">${inner}
    ${rv.length?`<div class="sec" style="justify-content:center;margin-top:14px">📖 ${tx("Belajar daripada silap","بلاجر درڤد سيلڤ")}</div>
      <ul class="review">${rv.map(x=>`<li>🎯 ${L(x.p)}<br><b>✗ ${LAB(x.it)}</b>${x.right?` &nbsp; ✓ ${LAB(x.right)}`:` — ${tx("bukan jawapannya","بوکن جواڤنڽ")}`}</li>`).join("")}</ul>`:""}
    <button class="btn" data-act="again">🔁 ${tx("Main lagi","ماٴين لاڬي")}</button>
    <button class="btn alt" data-act="home">🕹️ ${tx("Tukar permainan","توکر ڤرماٴينن")}</button></div>`;
  G.over = true; G.gidLast = gid;
  sfx.win(); if(party) rain();
  window.scrollTo(0,0);
}
function rain(){
  if(REDUCED) return;
  const box = document.createElement("div"); box.className = "rain";
  for(let i=0;i<26;i++){ const s = document.createElement("span"); s.textContent = pick(["⭐","🏆","🎉","🕹️","✨","🌟"]);
    s.style.left = Math.random()*100+"vw"; s.style.animationDuration = (2+Math.random()*2)+"s"; s.style.animationDelay = (Math.random()*0.8)+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 4500);
}

/* ============ PERISTIWA ============ */
function handle(b, e){
  switch(b.dataset.act){
    case "mute": muted=!muted; save("ark3-muted",muted); b.textContent=muted?"🔇":"🔊"; break;
    case "lang": lang = isJ() ? "rumi" : "jawi"; save("kafa-lang",lang); applyLang(); renderMap(); break;
    case "subj": subj = b.dataset.s; save("ark3-subj",subj); try{ history.replaceState(null,"","?s="+subj); }catch(err){} renderMap(); break;
    case "pmode": pmode = b.dataset.m; save("ark3-mode",pmode); renderMap(); break;
    case "game": openGame(b.dataset.g); break;
    case "home": renderMap(); break;
    case "start":
      if(dim==="3d" && !G.g.duel && !window.THREE){
        b.disabled = true; b.textContent = "⏳ "+tx("Memuatkan dunia 3D…","ممواتکن دنيا 3D…");
        need3D().then(ok=>{ if(!G) return; if(!ok) toast("⚠️ "+tx("3D tidak dapat dimuatkan (tiada internet?). Main versi 2D.","3D تيدق داڤت دمواتکن (تيادا اينترنيت؟). ماٴين ۏرسي 2D.")); start(); });
      } else start();
      break;
    case "dim": dim = b.dataset.d; save("ark3-dim",dim); if(dim==="3d") need3D(); renderMap(); break;
    case "again": { const gid = G ? G.gid : null; if(gid) openGame(gid); else renderMap(); break; }
    case "nextturn": G.ti++; intro(); break;
    case "pause": togglePause(); break;
    case "resume": togglePause(); break;
    case "quit": renderMap(); break;
    case "hole": if(G && !G.paused && !G.over) MOD.whack.tap(b); break;
    case "it": if(G && !G.paused && !G.over && G.g.id==="pop") MOD.pop.tap(b); break;
    case "lane": if(G && !G.paused && !G.over) MOD.run.setLane(+b.dataset.l); break;
    case "cpk": if(G && !G.paused && !G.over) MOD.climb.tap(b); break;
    case "left": if(G && !G.over){ if(G.mod.nudge) G.mod.nudge(-1); else if(G.g.id==="run") MOD.run.setLane(G.lane-1); else G.tx = G.bx-90; } break;
    case "right": if(G && !G.over){ if(G.mod.nudge) G.mod.nudge(1); else if(G.g.id==="run") MOD.run.setLane(G.lane+1); else G.tx = G.bx+90; } break;
    case "dopt": if(G && G.dq && !(G.solo && b.dataset.t==="red")) duelAns(b.dataset.t, +b.dataset.i, b); break;
  }
}
app.addEventListener("pointerdown", e=>{
  const b = e.target.closest("[data-act]");
  if(G && !G.over && !G.paused && G.g && G.g.id==="catch" && !G.is3d && e.target.closest("#field")){ MOD.catch.move(e); G.drag = true; }
  if(!b || b.disabled) return;
  if(["hole","it","lane","cpk","dopt"].includes(b.dataset.act)){ e.preventDefault(); handle(b, e); }
});
app.addEventListener("pointermove", e=>{ if(G && G.drag && G.g && G.g.id==="catch" && !G.is3d && !G.paused) MOD.catch.move(e); });
window.addEventListener("pointerup", ()=>{ if(G) G.drag = false; });
app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  if(["hole","it","lane","cpk","dopt"].includes(b.dataset.act)){ if(e.detail===0) handle(b, e); return; }
  handle(b, e);
});

applyLang();
renderMap();
</script>
