<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B5A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<title>Zon Arked 3D • KAFA Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="../../assets/config.js"></script>
<script src="../../assets/auth.js"></script>
<style>
:root{
  --bg:#F1ECFF; --surface:#FFFFFF; --ink:#1E1640; --muted:#5F5689; --line:#DCD3F5;
  --brand:#7C3AED; --brand-ink:#FFFFFF; --brand-shadow:#5521B5; --gold:#F5B400;
  --ok:#14A05A; --bad:#E5484D; --note:#FFF3C9;
  --red:#E5484D; --blue:#2F7BFF;
  --w1:#7C3AED; --w2:#120634; --wa:#FF4FD8;
  --pattern:rgba(124,58,237,.10);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0820; --surface:#1A1236; --ink:#F1ECFF; --muted:#B9AEE3; --line:#33285E;
    --brand:#A78BFA; --brand-ink:#170A3A; --brand-shadow:#6D45D9; --gold:#FFCB3D;
    --ok:#2BC173; --bad:#FF6B6F; --note:#3A3016;
    --pattern:rgba(167,139,250,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0820; --surface:#1A1236; --ink:#F1ECFF; --muted:#B9AEE3; --line:#33285E;
  --brand:#A78BFA; --brand-ink:#170A3A; --brand-shadow:#6D45D9; --gold:#FFCB3D;
  --ok:#2BC173; --bad:#FF6B6F; --note:#3A3016;
  --pattern:rgba(167,139,250,.08);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background-image:linear-gradient(var(--pattern) 1px,transparent 1px),linear-gradient(90deg,var(--pattern) 1px,transparent 1px);background-size:28px 28px}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Baloo 2",serif;font-size:20px;line-height:1.8}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;line-height:1.5}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
a.iconbtn{text-decoration:none;color:inherit}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.grp{display:flex;gap:8px;align-items:center}

/* ===== Laman arked (warna mengikut dunia subjek) ===== */
.marquee{position:relative;margin:10px 0 0;border-radius:26px;padding:16px 18px 14px;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 12% 18%,color-mix(in srgb,var(--wa) 55%,transparent),transparent 42%),radial-gradient(circle at 92% 85%,rgba(255,255,255,.22),transparent 45%),linear-gradient(135deg,var(--w1),var(--w2));
  box-shadow:0 6px 0 color-mix(in srgb,var(--w2) 80%,#000),0 0 0 3px var(--wa) inset}
.marquee .sub{display:inline-block;font-size:14px;font-weight:800;background:rgba(0,0,0,.25);border-radius:999px;padding:0 10px}
.marquee h1{margin:2px 0 0;font-size:clamp(30px,7.5vw,46px);line-height:1.05;font-weight:800;text-shadow:0 0 14px var(--wa),0 2px 0 rgba(0,0,0,.25)}
html[dir="rtl"] .marquee h1{line-height:1.5;font-weight:700}
.marquee p{margin:4px 0 0;opacity:.95;max-width:min(520px,calc(100% - 70px))}
.marquee .coins{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:rgba(255,255,255,.95);color:var(--w2);border-radius:999px;padding:2px 14px;font-size:20px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.marquee .coins small{font-size:14px;font-weight:700}
.marquee .bulbs{position:absolute;inset:6px;border-radius:22px;pointer-events:none;background:radial-gradient(circle,#FFE45C 2.5px,transparent 3.5px) 0 0/22px 22px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:5px;animation:bulb 1s steps(2) infinite}
@keyframes bulb{50%{opacity:.35}}
.marquee .joy{position:absolute;inset-inline-end:14px;top:14px;font-size:58px;line-height:1;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.sec{margin:20px 0 8px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.chipsel{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chipsel button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.chipsel button[aria-pressed="true"]{background:var(--w1);border-color:var(--w1);color:#fff}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:10px 12px;text-align:start;font-weight:800;font-size:18px;line-height:1.2}
.mode small{display:block;font-weight:600;font-size:14px;color:var(--muted);margin-top:2px;line-height:1.3}
.mode .e{font-size:28px;display:block}
.mode[aria-pressed="true"]{border-color:var(--w1);box-shadow:0 0 0 3px color-mix(in srgb,var(--w1) 30%,transparent)}
/* Kabinet arked 3D: papan nama bercahaya, skrin dunia, panel kawalan; condong ikut tetikus */
.cabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px;perspective:1100px;padding-top:4px}
@media (max-width:560px){.cabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px}}
.cab{--rx:0deg;--ry:0deg;min-width:0;position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:center;border:0;padding:0 0 12px;color:#fff;
  border-radius:20px 20px 14px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 62%,#0B0718),color-mix(in srgb,var(--c) 22%,#05030C));
  box-shadow:7px 8px 0 color-mix(in srgb,var(--c) 30%,#000),0 16px 26px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.22),inset 3px 0 0 rgba(255,255,255,.08);
  transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .18s ease-out,box-shadow .18s;animation:cabin .5s both;animation-delay:calc(var(--i) * 70ms)}
@keyframes cabin{from{opacity:0;transform:translateY(20px) rotateX(18deg)}}
.cab:hover{box-shadow:7px 8px 0 color-mix(in srgb,var(--c) 30%,#000),0 0 0 3px var(--c),0 0 26px color-mix(in srgb,var(--c) 70%,transparent),0 18px 30px rgba(0,0,0,.5)}
.cab:active{transform:translateY(5px);box-shadow:3px 3px 0 color-mix(in srgb,var(--c) 30%,#000)}
.cab .mq{position:relative;display:block;margin:0 0 10px;padding:8px 10px;border-radius:20px 20px 8px 8px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 20px color-mix(in srgb,var(--c) 60%,transparent)}
.cab .mq::before,.cab .mq::after{content:"";position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#FFF6B0;box-shadow:0 0 8px #FFE45C;animation:bulb 1s steps(2) infinite}
.cab .mq::before{left:9px}.cab .mq::after{right:9px;animation-delay:.5s}
.cab .mq b{display:block;font-size:17px;line-height:1.2;text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 10px rgba(255,255,255,.5);padding:0 12px}
html[dir="rtl"] .cab .mq b{line-height:1.6}
.cab .scr{position:relative;display:grid;place-items:center;margin:0 12px;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:4px solid #05030C;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--w1) 70%,#fff 10%),var(--w2));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 50%,#000),inset 0 0 22px rgba(0,0,0,.55)}
.cab .scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px),linear-gradient(160deg,rgba(255,255,255,.22),transparent 40%)}
.cab .scr .ic{font-size:clamp(44px,9vw,58px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3));animation:bob 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * -250ms)}
.cab .dimtag{position:absolute;top:6px;inset-inline-end:6px;background:#fff;color:#1E1640;font-size:11px;font-weight:800;border-radius:999px;padding:0 7px;z-index:1}
.cab .deck{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;height:30px;margin:8px 8px 4px;border-radius:10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 40%,#1A1030),#0B0718);transform:perspective(200px) rotateX(28deg);box-shadow:0 4px 0 #05030C}
.cab .deck .joy{position:relative;width:8px;height:16px;margin-top:-10px;background:#2A2A3A;border-radius:3px}
.cab .deck .joy::before{content:"";position:absolute;left:-5px;top:-10px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8A8A,#E5484D)}
.cab .deck .bt{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6B0,#F5B400);box-shadow:0 2px 0 #8A5A00}
.cab .deck .bt.b2{background:radial-gradient(circle at 35% 35%,#9BEAFF,#06B6D4);box-shadow:0 2px 0 #04556A}
.cab small{display:block;padding:2px 10px 0;font-size:13.5px;opacity:.9;line-height:1.3}
html[dir="rtl"] .cab small{line-height:1.6}
.cab .hi{align-self:center;margin-top:8px;font-size:13px;font-weight:800;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.2);border-radius:999px;padding:0 10px}
.cab.lock{filter:grayscale(.8) brightness(.75)}
@media (max-width:560px){.cab .mq b{font-size:15px}.cab small{font-size:12.5px}}
.foot{margin-top:18px;color:var(--muted);font-size:15px;text-align:center}

/* ===== HUD ===== */
.hud{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}
.hud .sc{font-weight:800;font-size:22px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:0 14px;min-width:84px;text-align:center}
.hud .coin{font-weight:800;font-size:18px;background:var(--surface);border:2px solid var(--wa);border-radius:999px;padding:0 12px}
.hud .coin.bump{animation:pop .3s}
.hud .combo{font-weight:800;font-size:15px;background:var(--gold);color:#3A2600;border-radius:999px;padding:1px 10px;opacity:0;transition:opacity .2s}
.hud .combo.on{opacity:1;animation:pop .3s}
.hud .hearts{font-size:20px;letter-spacing:1px}
.hud .team{font-weight:800;color:#fff;border-radius:999px;padding:1px 12px;font-size:15px}
.hud .sp{flex:1}
.hud .dtitle{font-size:18px}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 8px}
.tbar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--wa),var(--w1));transform-origin:left;transition:transform .2s linear}
html[dir="rtl"] .tbar span{transform-origin:right}
.tbar.low span{background:var(--bad)}
.prompt{position:relative;text-align:center;font-weight:800;font-size:clamp(19px,4.8vw,24px);line-height:1.25;color:#fff;background:linear-gradient(90deg,var(--w1),color-mix(in srgb,var(--w1) 55%,var(--w2)));border-radius:18px;padding:8px 14px;margin:0 0 8px;box-shadow:0 4px 0 var(--w2)}
html[dir="rtl"] .prompt{line-height:1.7}
.prompt.new{animation:newp .6s ease}
@keyframes newp{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:none}}
.prompt small{display:block;font-size:13px;opacity:.85;font-weight:700}
@keyframes pop{50%{transform:scale(1.15)}}

/* ===== Padang permainan 3D ===== */
.field{position:relative;height:min(62vh,540px);min-height:380px;border-radius:24px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background:var(--w2);border:3px solid #000;box-shadow:0 0 0 3px var(--wa),0 0 24px color-mix(in srgb,var(--wa) 40%,transparent)}
.f3d canvas{width:100%!important;height:100%!important;touch-action:none;display:block}
.fx{position:absolute;pointer-events:none;font-weight:800;font-size:24px;color:#FFE45C;text-shadow:0 2px 0 #000,0 0 6px #000;animation:fx .8s ease-out forwards;z-index:9;transform:translate(-50%,-50%)}
.fx.bad{color:#FF6B6F}
@keyframes fx{to{transform:translate(-50%,-160%) scale(1.3);opacity:0}}
.flash{position:absolute;inset:0;pointer-events:none;background:rgba(229,72,77,.35);animation:flash .35s ease-out forwards;z-index:8}
@keyframes flash{to{opacity:0}}
.praise{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);pointer-events:none;z-index:9;font-weight:800;font-size:clamp(34px,8vw,56px);color:#fff;white-space:nowrap;
  text-shadow:0 4px 0 var(--w2),0 0 18px var(--wa);animation:praise 1.3s ease-out forwards}
html[dir="rtl"] .praise{line-height:1.6}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.ctlrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ctlrow button{border:0;border-radius:16px;padding:10px;font-size:26px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
/* Susun: dulang jawapan di bawah, langkah bernombor */
.field.tall{height:min(76vh,680px);min-height:480px}
.prompt .ord{margin-top:2px;font-size:14.5px;opacity:1;color:#FFF3B0}
.tray{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;padding:8px 10px 10px;border-radius:18px;background:rgba(255,255,255,.94);color:#1E1640;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 3px var(--wa)}
.thead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.tnext{font-weight:800;font-size:clamp(17px,3.6vw,21px)}
.tnext b{display:inline-block;min-width:30px;text-align:center;border-radius:10px;padding:0 8px;margin:0 2px;color:#fff;background:var(--w1)}
.tnext small{font-size:14px;color:#5F5689}
.tdots{display:flex;gap:5px}
.tdots i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-style:normal;font-weight:800;font-size:14px;background:#ECE8F6;color:#5F5689;border:2px solid #DCD3F5}
.tdots i.ok{background:#2BC173;border-color:#2BC173;color:#fff}
.tdots i.cur{background:var(--w1);border-color:var(--wa);color:#fff;animation:pop 1s ease-in-out infinite}
.tbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tbtns button{border:0;border-radius:14px;padding:8px 10px;min-height:56px;font-weight:800;font-size:clamp(16px,3.4vw,19px);line-height:1.25;color:#1E1640;
  background:linear-gradient(180deg,#fff,#F3EFFF);box-shadow:0 4px 0 color-mix(in srgb,var(--w1) 55%,#000),0 0 0 2px color-mix(in srgb,var(--w1) 35%,transparent) inset;transition:transform .12s}
html[dir="rtl"] .tbtns button{line-height:1.6}
.tbtns button .ar{font-size:clamp(20px,4vw,26px)}
.tbtns button:hover{transform:translateY(-2px)}
.tbtns button:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--w1) 55%,#000)}
.tbtns button.no{background:#FFB3B5;animation:shake .35s}
.lanehud{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:6}
.lanehud:empty{display:none}
.lanehud button{border:3px solid var(--wa);background:rgba(255,255,255,.95);color:#1E1640;border-radius:14px;font-weight:800;font-size:clamp(14px,2.4vw,21px);padding:4px 6px;line-height:1.2;min-height:56px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
html[dir="rtl"] .lanehud button{line-height:1.6}
.lanehud button .ar{font-size:clamp(20px,3.2vw,28px)}
.lanehud button.me{outline:4px solid #FFE45C;outline-offset:2px}
.lanehud button.ok{background:#B8F5CF;border-color:#2BC173}
.lanehud button.no{background:#FFB3B5;border-color:#FF6B6F}
/* Duel: perlumbaan 3D di tengah */
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:130px 1fr;grid-template-areas:"race race" "red blue";gap:10px;height:min(74vh,640px);min-height:480px}
.duel .race{grid-area:race;position:relative;border-radius:20px;overflow:hidden;background:var(--w2);border:3px solid #000;box-shadow:0 0 0 3px var(--wa)}
.pan{position:relative;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;color:#fff;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 50%,#000));box-shadow:0 5px 0 color-mix(in srgb,var(--tc) 40%,#000)}
.pan.red{--tc:var(--red);grid-area:red}.pan.blue{--tc:var(--blue);grid-area:blue}
.pan .nm{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
.pan .nm b{font-size:34px;line-height:1}
.pan .dq{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 10px;font-weight:800;text-align:center;font-size:16.5px;line-height:1.3}
html[dir="rtl"] .pan .dq{line-height:1.7}
.pan .ops{display:grid;gap:8px;flex:1;align-content:center}
.pan .ops button{border:0;border-radius:16px;background:#fff;color:#1E1640;font-weight:800;font-size:18px;padding:8px;min-height:58px;box-shadow:0 4px 0 rgba(0,0,0,.3);line-height:1.25}
html[dir="rtl"] .pan .ops button{line-height:1.6}
.pan .ops button .ar{font-size:24px}
.pan .ops button.ok{background:#B8F5CF}
.pan .ops button.no{background:#FFB3B5;animation:shake .35s}
.pan.locked .ops{opacity:.45}
.pan.win{animation:pop .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:620px){
  .duel{grid-template-columns:1fr;grid-template-rows:1fr 96px 1fr;grid-template-areas:"red" "race" "blue";height:calc(100vh - 80px);min-height:600px}
  .duel:not(.solo) .pan.red{transform:rotate(180deg)}
}
/* Lapisan */
.over{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:rgba(10,3,32,.72);color:#fff;text-align:center;padding:16px;border-radius:inherit}
.over.cdwrap{background:rgba(10,3,32,.35)}
.over .cd{font-size:110px;font-weight:800;line-height:1;text-shadow:0 0 24px var(--wa),0 4px 0 var(--w2);animation:cd .9s ease-out}
@keyframes cd{from{transform:scale(2);opacity:0}}
.over h2{margin:0 0 6px;font-size:28px}
.over p{margin:0 0 10px}
.btn{display:block;width:100%;margin-top:12px;border:0;border-radius:16px;padding:12px;background:var(--w1);color:#fff;font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--w2)}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:18px}
.btn:active{transform:translateY(3px)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.card.intro{border-color:var(--wa);box-shadow:0 6px 0 color-mix(in srgb,var(--w1) 35%,transparent)}
.result{text-align:center}
.result .big{font-size:64px;font-weight:800;line-height:1;color:var(--w1)}
.result .trophy{font-size:64px;line-height:1}

.result .cheer{margin:10px 0 0;background:color-mix(in srgb,var(--wa) 18%,var(--surface));border:2px dashed var(--wa);border-radius:16px;padding:8px 12px;font-weight:700}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0}
.versus div{border-radius:18px;color:#fff;padding:8px;font-weight:800}

.versus .r{background:var(--red)}.versus .b{background:var(--blue)}
.versus .w{outline:4px solid var(--gold);outline-offset:3px}
.review{text-align:start;margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.review li{background:var(--bg);border-radius:12px;padding:6px 10px;font-size:15.5px;line-height:1.35}
html[dir="rtl"] .review li{line-height:1.7}
.review li .ar{font-size:20px}
.review b{color:var(--bad)}
.turn{display:inline-block;border-radius:999px;color:#fff;padding:2px 16px;font-weight:800;font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}

.howto{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none;text-align:start}
.howto li{background:var(--bg);border-radius:12px;padding:4px 10px;font-size:16px;line-height:1.35}
html[dir="rtl"] .howto li{line-height:1.7}

.wt{--rx:0deg;--ry:0deg;min-width:0;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;
  border:0;border-radius:20px;padding:10px 6px;color:#fff;background:linear-gradient(150deg,var(--t1),var(--t2));
  box-shadow:0 5px 0 color-mix(in srgb,var(--t2) 70%,#000);opacity:.75;filter:saturate(.8);transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .18s,opacity .18s,filter .18s,box-shadow .18s;animation:wtin .45s both;animation-delay:calc(var(--i) * 45ms)}

.wt small{font-size:11.5px;opacity:.88;line-height:1.25;font-weight:700}

.wt[aria-pressed="true"]{opacity:1;filter:none;transform:rotateX(var(--rx)) rotateY(var(--ry)) translateY(-4px) scale(1.03);box-shadow:0 5px 0 color-mix(in srgb,var(--t2) 70%,#000),0 0 0 3px var(--ta),0 0 18px var(--ta)}
.wt[aria-pressed="true"] .e{animation:bob 1.6s ease-in-out infinite}
.wt:active{transform:translateY(2px) scale(.98)}

/* Latar halaman ikut warna dunia yang dipilih */
body{background-image:radial-gradient(1100px 620px at 50% -12%,color-mix(in srgb,var(--w1) 40%,transparent),transparent 70%),
  radial-gradient(800px 560px at 105% 105%,color-mix(in srgb,var(--wa) 16%,transparent),transparent 70%),
  linear-gradient(var(--pattern) 1px,transparent 1px),linear-gradient(90deg,var(--pattern) 1px,transparent 1px);

.lb{padding:12px}

.lbtabs button[aria-pressed="true"]{background:var(--w1);border-color:var(--w1);color:#fff}
.lbtabs.games button[aria-pressed="true"]{background:var(--wa);border-color:var(--wa);color:var(--w2)}

.sheet .cls li>span{flex:1 1 160px}
.btn.dash{text-decoration:none;text-align:center}
.sheet input:disabled{opacity:.7}

/* ============ DUNIA 3D: bahan & model asas ============
   Semua model dibina daripada bentuk asas three.js (tiada fail luar).
   Model menghadap +z (ke arah kamera) kecuali dinyatakan. */
const MATS = new Map();
function M(c, o){ const k = c+"|"+(o?JSON.stringify(o):""); let m = MATS.get(k);
  if(!m){ m = new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.62}, o||{})); MATS.set(k, m); } return m; }
const MU = (c, o) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.62}, o||{}));
const GLOW = (c, k=.7) => M(c, {emissive:c, emissiveIntensity:k});
const FLAT = {flatShading:true};
function mk(geo, mat, x=0, y=0, z=0, p){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; if(p) p.add(m); return m; }
const SPH = (r, w=16, h=12) => new THREE.SphereGeometry(r, w, h);
const HEMI = (r, w=18) => new THREE.SphereGeometry(r, w, 10, 0, Math.PI*2, 0, Math.PI/2);
const CYL = (a, b, h, n=12) => new THREE.CylinderGeometry(a, b, h, n);
const BOX = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const CONE = (r, h, n=12) => new THREE.ConeGeometry(r, h, n);
const TOR = (r, t, arc=Math.PI*2) => new THREE.TorusGeometry(r, t, 8, 24, arc);
function shapeGeo(pts, depth){ const s = new THREE.Shape(); pts.forEach(([x,y],i)=>i ? s.lineTo(x,y) : s.moveTo(x,y)); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth, bevelEnabled:false}); g.translate(0, 0, -depth/2); return g; }
// separuh kanan sahaja, kiri dicerminkan
const mirror = pts => [...pts, ...pts.slice().reverse().map(([x,y])=>[-x,y])];
function heartGeo(s=1, d=0.18){
  const h = new THREE.Shape(); h.moveTo(0, -0.45*s);
  h.bezierCurveTo(-0.15*s, -0.3*s, -0.5*s, -0.1*s, -0.5*s, 0.15*s); h.bezierCurveTo(-0.5*s, 0.4*s, -0.15*s, 0.5*s, 0, 0.28*s);
  h.bezierCurveTo(0.15*s, 0.5*s, 0.5*s, 0.4*s, 0.5*s, 0.15*s); h.bezierCurveTo(0.5*s, -0.1*s, 0.15*s, -0.3*s, 0, -0.45*s);
  const g = new THREE.ExtrudeGeometry(h, {depth:d, bevelEnabled:true, bevelThickness:0.05, bevelSize:0.05, bevelSegments:3}); g.center(); return g;
}
function starGeo(){
  const s = new THREE.Shape();
  for(let i=0;i<10;i++){ const r = i%2 ? 0.17 : 0.4, a = i/10*Math.PI*2 + Math.PI/2; i ? s.lineTo(Math.cos(a)*r, Math.sin(a)*r) : s.moveTo(Math.cos(a)*r, Math.sin(a)*r); }
  const g = new THREE.ExtrudeGeometry(s, {depth:0.14, bevelEnabled:true, bevelThickness:0.04, bevelSize:0.04, bevelSegments:2}); g.center(); return g;
}
function eyes(p, x, y, z, s=1, gap=0.17){
  [-1,1].forEach(k=>{ const w = mk(SPH(0.085*s,12,10), M(0xffffff), x+k*gap*s, y, z, p); mk(SPH(0.05*s,10,8), M(0x1a1a1a), 0, 0, 0.05*s, w); });
}
function smile(p, y, z, s=1, c=0x5A1A2E){ const m = mk(TOR(0.09*s, 0.022*s, Math.PI), M(c), 0, y, z, p); m.rotation.z = Math.PI; return m; }
// kaki/tangan berpaksi di atas supaya boleh dihayun
function limb(p, geo, mat, x, y, z){ geo.translate(0, -geo.parameters.height/2, 0); return mk(geo, mat, x, y, z, p); }
function crescent(r=0.22, c=0xF5C542){ const g = new THREE.Group(); const t = mk(TOR(r, r*0.28, Math.PI*1.25), GLOW(c,.35), 0, 0, 0, g); t.rotation.z = -Math.PI*0.12; return g; }

/* ============ ENJIN 3D (three.js) ============
   three.js disimpan dalam portal (assets/vendor) supaya boleh main tanpa internet;
   CDN hanya digunakan jika fail tempatan tiada. */
const THREE_SRC = ["../../assets/vendor/three.min.js", "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"];
let threeP = null;
const loadJS = src => new Promise(res=>{ const s = document.createElement("script"); s.src = src;
  s.onload = () => res(!!window.THREE); s.onerror = () => { s.remove(); res(false); }; document.head.appendChild(s); });
function need3D(){
  if(!threeP) threeP = window.THREE ? Promise.resolve(true) : (async()=>{ for(const u of THREE_SRC) if(await loadJS(u)) return true; threeP = null; return false; })();
  const fonts = document.fonts
    ? Promise.race([Promise.all(['700 40px "Baloo 2"','700 40px "Noto Naskh Arabic"','700 40px Amiri'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,2500))]).catch(()=>{})
    : Promise.resolve();
  return Promise.all([threeP, fonts]).then(([ok])=>ok);
}
const MOD3 = {};
// Mutu rendah (tanpa bayang, resolusi 1x) dihidupkan sendiri jika peranti lambat, dan diingati.
let lowQ = load("ark3-lowq", false);
function gradTex(stops){
  const c = document.createElement("canvas"); c.width = 2; c.height = 256; const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 256);
  stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1), s)); x.fillStyle = g; x.fillRect(0, 0, 2, 256); return new THREE.CanvasTexture(c);
}
let dotT = null;
function dotTex(){ if(dotT) return dotT;
  const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d"), g = x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.4, "rgba(255,255,255,.8)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return dotT = new THREE.CanvasTexture(c); }
const W3 = {
  setup(o){
    const w = G.w;
    const R = new THREE.WebGLRenderer({antialias:true});
    R.setPixelRatio(lowQ ? 1 : Math.min(2, window.devicePixelRatio||1)); R.setSize(G.W, G.H);
    R.shadowMap.enabled = !lowQ; R.shadowMap.type = THREE.PCFSoftShadowMap;
    G.field.querySelectorAll("canvas").forEach(c=>c.remove()); G.field.prepend(R.domElement); R.domElement.style.display = "block";
    const scene = new THREE.Scene(); scene.background = gradTex(w.sky);
    scene.fog = new THREE.Fog(new THREE.Color(w.fogc || w.sky[w.sky.length-1]), ...(o.fog || [22, 60]));
    const cam = new THREE.PerspectiveCamera(o.fov||50, G.W/G.H, 0.1, 200);
    scene.add(new THREE.HemisphereLight(w.hemi[0], w.hemi[1], w.hemi[2]*0.62));
    const sun = new THREE.DirectionalLight(w.sun[0], w.sun[1]*0.85); sun.position.set(5, 14, 8); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, {left:-14, right:14, top:14, bottom:-14, near:1, far:60}); sun.shadow.bias = -0.0008;

  },

function dress(kind, y=0){
  const w = G.w, s = G.scene;

  const area = {whack:[-13,13,-13,5, (x,z)=>Math.abs(x)<5.4 && z>-5.6], catch:[-15,15,-17,-4.5], pop:[-15,15,-17,-4.5], climb:[-13,13,-13,-3.2, (x,z)=>Math.abs(x)<2.8], race:[-16,16,-9,-3]}[kind];

      const x = rnd(x0,x1), z = rnd(z0,z1); if(bad && bad(x,z)) continue;

  const add = kind==="firefly" || kind==="star";

function stepEnv(dt){
  const t = G.el || 0, a = G.amb;
  if(a && !REDUCED){
    const p = a.pts.geometry.attributes.position, r = p.array;
    for(let i=0;i<a.n;i++){ const k = i*3;
      if(a.kind==="bubble"){ r[k+1] += dt*(0.6+(i%5)*0.15); r[k] += Math.sin(t*2+i)*dt*0.2; if(r[k+1]>12) r[k+1] = 0; }
      else if(a.kind==="dust"){ r[k] += dt*(0.8+(i%4)*0.3); r[k+1] += Math.sin(t+i)*dt*0.1; if(r[k]>18) r[k] = -18; }
      else if(a.kind==="leaf"){ r[k+1] -= dt*(0.35+(i%3)*0.15); r[k] += Math.sin(t*1.5+i)*dt*0.5; if(r[k+1]<0) r[k+1] = 12; }
      else if(a.kind==="firefly"){ r[k] += Math.sin(t*0.9+i*1.7)*dt*0.4; r[k+1] += Math.cos(t*1.1+i)*dt*0.3; }
    }
    p.needsUpdate = true;
    if(a.kind==="star" || a.kind==="firefly") a.pts.material.opacity = 0.75 + Math.sin(t*3)*0.2;
  }
  G.wavers.forEach(o=>o.userData.wave.forEach(w=>w.parts.forEach((s,i)=>{ s.rotation.z = Math.sin(t*1.6+w.ph+i*0.5)*0.12*(i+1)*0.5; s.position.x = Math.sin(t*1.6+w.ph)*0.05*i; })));

/* ---------- Label teks (Rumi, Jawi atau al-Quran) ---------- */
const texCache = new Map();
function labelTex(it, o){
  o = o || {};
  const txt = Array.isArray(it) ? L(it) : it, ar = /[؀-ۿ]/.test(txt), quran = !Array.isArray(it);
  const k = `${txt}|${o.bg||""}|${o.w||0}|${o.minW||0}`;
  if(texCache.has(k)) return texCache.get(k);
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const fs = quran ? 84 : ar ? 70 : 62;
  const font = `700 ${fs}px ${quran ? 'Amiri,"Noto Naskh Arabic",serif' : ar ? '"Noto Naskh Arabic",Amiri,serif' : '"Baloo 2","Trebuchet MS",sans-serif'}`;
  x.font = font;
  const maxW = (o.w || 400) * fs/44, lines = []; let cur = "";
  for(const w of txt.split(" ")){ const t = cur ? cur+" "+w : w; if(x.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  const lh = fs*(ar?1.5:1.18), tw = Math.max(...lines.map(l=>x.measureText(l).width));
  c.width = Math.ceil(Math.max(tw, o.minW||0) + 52); c.height = Math.ceil(lh*lines.length + 30);
  x.font = font; x.direction = ar ? "rtl" : "ltr"; x.textAlign = "center"; x.textBaseline = "middle";
  const r = 34, W_ = c.width, H_ = c.height;
  x.beginPath(); x.moveTo(r,0); x.arcTo(W_,0,W_,H_,r); x.arcTo(W_,H_,0,H_,r); x.arcTo(0,H_,0,0,r); x.arcTo(0,0,W_,0,r); x.closePath();
  x.fillStyle = o.bg || "#FFFFFF"; x.fill(); x.lineWidth = 8; x.strokeStyle = o.line || "rgba(30,22,64,.28)"; x.stroke();
  x.fillStyle = o.fg || "#1E1640";
  lines.forEach((l,i)=>x.fillText(l, W_/2, 15 + lh*(i+0.5) + (ar?fs*0.06:fs*0.04)));
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const res = {t, a:W_/H_, n:lines.length, ar}; texCache.set(k, res); return res;
}
// Label sentiasa dipaparkan pada saiz piksel yang mudah dibaca (bukan saiz dunia 3D)
function labelSprite(it, o, anchor=0.5){
  const T = labelTex(it, o);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:T.t, depthTest:false, fog:false}));
  s.center.set(0.5, anchor); s.renderOrder = 10; s.userData = {a:T.a, n:T.n, ar:T.ar};
  G.labels.push(s); return s;
}
function setLabel(s, it, o){ const T = labelTex(it, o); s.material.map = T.t; s.material.needsUpdate = true; Object.assign(s.userData, {a:T.a, n:T.n, ar:T.ar}); }
const inScene = o => { while(o){ if(o===G.scene) return true; o = o.parent; } return false; };
function sizeLabels(){
  G.labels = G.labels.filter(inScene);
  const tanF = Math.tan(G.cam.fov*Math.PI/360), v = new THREE.Vector3();
  const line = Math.max(30, Math.min(48, G.H*0.075)), maxW = Math.max(150, G.W*0.36);
  for(const s of G.labels){
    const u = s.userData, mw = u.maxPx || maxW; s.getWorldPosition(v);
    const wpp = 2*tanF*v.distanceTo(G.cam.position)/G.H;
    let px = (u.ar ? line*1.25 : line)*u.n + 18;
    if(px*u.a > mw) px = Math.max(mw/u.a, (u.ar?22:18)*u.n + 12);
    const k = u.k == null ? 1 : u.k;
    s.scale.set(px*wpp*u.a*k, px*wpp*k, 1);
  }
}

MOD3.whack = {
  init(){
    W3.setup({fov:45, fog:[24,60]});

    const D = Math.max(10.5, 4.5/(Math.tan(cam.fov*Math.PI/360)*asp));

        [-0.55, 0.55].forEach(dz=>mk(BOX(9, 0.08, 0.08), M(0x7F8C8D, {metalness:.6}), 0, 0.06, (r-1)*2.4+dz, scene));
        for(let i=0;i<12;i++) mk(BOX(0.18, 0.06, 1.2), M(0x6B4A2B), -4.4+i*0.8, 0.03, (r-1)*2.4, scene);
      }
      for(let c=0;c<3;c++){
        const x = (c-1)*2.4, z = (r-1)*2.4, i = G.holes.length, root = new THREE.Group(); root.position.set(x, 0, z); scene.add(root);
        let upY = 0, labY = 1.85;
        if(wg.hole==="burrow" || wg.hole==="crater" || wg.hole==="slot"){
          const h = mk(holeGeo, M(0x24150A), 0, 0.02, 0, root); h.rotation.x = -Math.PI/2; h.castShadow = false;
          if(wg.hole==="burrow"){ const rim = mk(TOR(0.82, 0.14), M(G.w.neon ? 0x7A4B22 : 0xC9A06A, FLAT), 0, 0.04, 0, root); rim.rotation.x = -Math.PI/2; }
          if(wg.hole==="crater"){ const cr = P.crater(1.55); root.add(cr); h.material = M(0x2E2A44); }
          if(wg.hole==="slot"){ h.geometry = new THREE.PlaneGeometry(1.5, 1.5); [[0,.75,1.7,.2],[0,-.75,1.7,.2],[.75,0,.2,1.5],[-.75,0,.2,1.5]].forEach(([dx,dz,a,b])=>mk(BOX(a, 0.22, b), M(0xB8B2A4), dx, 0.11, dz, root)); }
        }
        if(wg.hole==="pad"){ const p = P.pad(1.15); root.add(p); }
        if(wg.hole==="bush"){ const b = P.bush(1.25); b.position.z = 0.75; root.add(b); }
        if(wg.hole==="sand"){ const m = mk(new THREE.CircleGeometry(0.95, 24), M(0xD9C48F), 0, 0.02, 0, root); m.rotation.x = -Math.PI/2; m.castShadow = false; }
        if(wg.hole==="wagon"){ const w = C.wagon(pick([0x3498DB,0x9B59B6,0x1ABC9C,0xE67E22])); w.rotation.y = Math.PI/2; w.scale.set(1, 1, 1.1); root.add(w); upY = 0.62; labY = 2.4; }
        const cr = wg.critter(); root.add(cr);
        if(!wg.clam) cr.scale.setScalar(cr.userData.arms ? 0.78 : 1);
        if(wg.clam){ cr.scale.setScalar(1.25); labY = 1.25; }
        const lab = labelSprite(["…","…"], null, 0); lab.position.set(0, labY, 0); lab.visible = false; root.add(lab);
        const hit = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 2.6, 12), new THREE.MeshBasicMaterial({visible:false}));
        hit.position.set(x, 1.2, z); hit.userData.i = i; scene.add(hit); G.hitters.push(hit);
        G.holes.push({root, cr, lab, upY, k:0, up:false, t:0, it:null, ok:false, hit:false, busy:false, sq:0});
      }
    }
  },
  update(dt){
    G.spawnT -= dt;
    const upN = G.holes.filter(h=>h.up).length;
    if(G.spawnT<=0 && upN < (G.el>25?3:2)){
      G.spawnT = Math.max(0.5, 1.05 - G.el*0.009);
      const free = G.holes.map((h,i)=>i).filter(i=>!G.holes[i].up && !G.holes[i].busy);
      if(free.length){
        const h = G.holes[pick(free)];
        G.items = G.holes.filter(x=>x.up).map(x=>({it:x.it, ok:x.ok}));
        const d = drawItem();
        Object.assign(h, {up:true, t:Math.max(1.15, 2.1 - G.el*0.012), it:d.it, ok:d.ok, hit:false});
        setLabel(h.lab, d.it, {w:170}); h.lab.userData.maxPx = G.W/3 - 12;
      }
    }
    const clam = G.wg.clam;
    G.holes.forEach((h,i)=>{
      if(h.up){ h.t -= dt; if(h.t<=0) this.down(i); }
      h.k += ((h.up?1:0) - h.k) * Math.min(1, dt*13);
      if(clam){ h.cr.userData.top.rotation.x = -h.k*1.05; h.cr.userData.pearl.position.y = 0.2 + h.k*0.28; }
      else h.cr.position.y = -1.95 + (h.upY + 1.95)*h.k;
      h.lab.visible = h.k > 0.55; h.lab.userData.k = Math.min(1, (h.k-0.5)*2.2);
      if(h.sq>0){ h.sq -= dt; const s = 1 - Math.sin(Math.min(1, h.sq/0.25)*Math.PI)*0.35; h.cr.scale.y = s*(clam?1.25:h.cr.scale.x); } else h.cr.scale.y = h.cr.scale.x;
      if(!clam) h.cr.rotation.y = Math.sin(G.el*3 + i)*0.18;
    });
    W3.frame(dt);
  },
  down(i, delay=0){
    const h = G.holes[i]; h.busy = true;
    if(!delay) h.up = false;
    const tk = G.tok;
    setTimeout(()=>{ if(!G || G.tok!==tk || !G.holes) return; h.up = false; setTimeout(()=>{ if(G && G.tok===tk) h.busy = false; }, 220); }, delay);
  },
  pointer(e, ndc){
    G.ray.setFromCamera(ndc, G.cam);
    const hs = G.ray.intersectObjects(G.hitters), h = hs.find(x=>G.holes[x.object.userData.i].up) || hs[0];
    if(h) this.tap(h.object.userData.i);
  },
  tap(i){
    const h = G.holes[i]; if(!h || !h.up || h.hit || h.k < 0.45) return;
    h.hit = true; h.sq = 0.25; sfx.bonk();
    const at = h.root.position, p = W3.screen(new THREE.Vector3(at.x, 1.4, at.z));
    ring(new THREE.Vector3(at.x, 0.15, at.z), h.ok ? 0x2BC173 : 0xFF6B6F);
    burst(new THREE.Vector3(at.x, 1, at.z), h.ok ? 0xFFE45C : 0xFF6B6F, 8);
    h.ok ? good(p.x, p.y, h.it) : bad(p.x, p.y, h.it);
    this.down(i, 300);
  },
  clear(){ G.holes.forEach((h,i)=>{ if(h.up) this.down(i); }); },
  dispose(){ W3.dispose(); }
};

MOD3.catch = {
  init(){
    W3.setup({fov:50, fog:[16,45]});
    const {scene, cam} = G; cam.position.set(0, 3.4, 10); cam.lookAt(0, 3, 0);
    G.xr = Math.min(4.2, W3.halfW(10)*0.8);
    ground(); dress("catch");
    if(G.wg.catcher==="wagon") [-0.6, 0.6].forEach(dz=>mk(BOX(30, 0.08, 0.08), M(0x7F8C8D, {metalness:.6}), 0, 0.06, dz, scene));
    const b = catcher(G.wg.catcher); scene.add(b); G.basket = b; G.bx = 0; G.tx = 0;
    G.catchY = {turtle:1.15, frogpad:0.95, ufo:0.9, wagon:1.15, barrow:0.85}[G.wg.catcher] || 0.9;
    G.plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
    colsSetup(10, 200);
    // bakul mesti sampai ke lajur paling kiri dan kanan (skrin lebar ada lajur lebih jauh)
    G.xr = Math.max(...G.cols.map(c=>Math.abs(c.x)));
  },
  update(dt){
    G.spawnT -= dt;
    const cc = G.spawnT<=0 && freeCol(l=>l.g.position.y < 8.5 - (l.lab.scale.y + 1.2));
    if(cc){
      G.spawnT = Math.max(0.6, 1.15 - G.el*0.008);
      const d = drawItem(), g = catchItem(G.wg.item);
      const lab = labelSprite(d.it, {w:300}, 0); lab.position.y = 0.48; lab.userData.maxPx = G.colPx; g.add(lab);
      g.position.set(cc.x, 8.5, 0); G.scene.add(g);
      const o = {g, lab, it:d.it, ok:d.ok, vy:Math.min(3.6, 1.5 + G.el*0.035), ph:rnd(0,6)}; G.items.push(o); cc.last = o;
    }
    if(G.hold) G.tx = G.bx + G.hold*4*dt*3;
    G.tx = Math.max(-G.xr, Math.min(G.xr, G.tx));
    const dx = G.tx - G.bx, step = 11*dt; G.bx += Math.abs(dx)<step ? dx : Math.sign(dx)*step;
    const B = G.basket; B.position.x = G.bx; B.rotation.z = -dx*0.05;
    if(G.wg.catcher==="ufo") B.position.y = 0.2 + Math.sin(G.el*3)*0.08;
    if(G.wg.catcher==="turtle") B.rotation.y = Math.sin(G.el*2)*0.15;
    const spin = G.wg.item;
    for(const o of G.items.slice()){
      o.g.position.y -= o.vy*dt; o.ph += dt;
      const kid = o.g.children[0];
      if(spin==="star" || spin==="heart" || spin==="lotus") kid.rotation.y += dt*2.5; else if(spin!=="pearl"){ kid.rotation.z = Math.sin(o.ph*2)*0.4; kid.rotation.x += dt; }
      const y = o.g.position.y;
      if(y < G.catchY+0.25 && y > G.catchY-0.55 && Math.abs(o.g.position.x - G.bx) < 0.95){
        const p = W3.screen(o.g.position);
        burst(o.g.position, o.ok ? 0xFFE45C : 0xFF6B6F, 8);
        o.ok ? good(p.x, p.y, o.it) : bad(p.x, p.y, o.it); this.rm(o);
        B.scale.set(1.15, 0.85, 1.15); const tk = G.tok; setTimeout(()=>{ if(G && G.tok===tk && G.basket) G.basket.scale.set(1,1,1); }, 120);
      } else if(y < -0.5) this.rm(o);
    }
    W3.frame(dt);
  },
  rm(o){ G.scene.remove(o.g); G.items = G.items.filter(x=>x!==o); },
  move3(e, ndc){ if(e.pointerType==="mouse" || e.buttons){ const p = W3.onPlane(ndc, G.plane); if(p) G.tx = p.x; } },
  pointer(e, ndc){ const p = W3.onPlane(ndc, G.plane); if(p) G.tx = p.x; },
  nudge(dir){ G.tx = G.bx + dir*1.3; },
  key(e){ if(e.key==="ArrowLeft"){ this.nudge(-1); e.preventDefault(); } if(e.key==="ArrowRight"){ this.nudge(1); e.preventDefault(); } },
  clear(){ G.items.slice().forEach(o=>this.rm(o)); },
  dispose(){ W3.dispose(); }
};

        burst(new THREE.Vector3(G.px, 1.6, G.player.position.z - 0.5), c.ok ? 0xFFE45C : 0xFF6B6F, 12);
        c.ok ? good(p.x, p.y, c.it) : bad(p.x, p.y, c.it, g.cells.find(z=>z.ok).it);
        this.board();
      }
      if(g.g.position.z > 12){ G.scene.remove(g.g); G.gate = null; G.gwait = 0.25; this.board(); }

  },
  setLane(l){ G.lane = Math.max(0, Math.min(2, l)); sfx.tick(); if(G.gate && !G.gate.done) this.board(); },

  dispose(){ W3.dispose(); }
};

      <span class="tdots" dir="ltr">${G.seq.items.map((_,k)=>`<i class="${k<G.next?"ok":k===i&&!done?"cur":""}">${k<G.next?"✓":k+1}</i>`).join("")}</span></div>
      <div class="tbtns">${G.trayOrder.filter(k=>!G.placed.has(k)).map(k=>`<button data-act="pick" data-k="${k}">${LAB(G.seq.items[k])}</button>`).join("")}</div>`;
    // anjak kamera ke atas supaya objek 3D berada di ruang di atas dulang

  },
  // Blok bersudut bulat (bertepi lembut) + label di hadapan + lencana nombor urutan di kiri
  block(it, i){
    const {t, a} = labelTex(it, {w:Array.isArray(it)?260:520});

    const col = new THREE.Color(G.wg.blocks[i % G.wg.blocks.length]);
    const s = new THREE.Shape(), r = 0.2, x0 = -w/2, y0 = -h/2;
    s.moveTo(x0+r, y0); s.lineTo(x0+w-r, y0); s.quadraticCurveTo(x0+w, y0, x0+w, y0+r); s.lineTo(x0+w, y0+h-r); s.quadraticCurveTo(x0+w, y0+h, x0+w-r, y0+h);
    s.lineTo(x0+r, y0+h); s.quadraticCurveTo(x0, y0+h, x0, y0+h-r); s.lineTo(x0, y0+r); s.quadraticCurveTo(x0, y0, x0+r, y0);
    const geo = new THREE.ExtrudeGeometry(s, {depth:0.56, bevelEnabled:true, bevelThickness:0.08, bevelSize:0.07, bevelSegments:3, curveSegments:8}); geo.center();
    const m = new THREE.Mesh(geo, MU(col, {roughness:.38, metalness:.08, emissive:col, emissiveIntensity:G.w.neon ? .25 : .06})); m.castShadow = true; m.receiveShadow = true;
    // label (sudut lutsinar kini menampakkan warna blok, bukan hitam)

      [-1,1].forEach(k=>{ const wh = mk(CYL(0.22, 0.22, 0.1, 18), M(0x2B2B3A), k*(w/2-0.4), -h/2-0.2, 0.32, m); wh.rotation.x = Math.PI/2;

  pick(k, btn){

    const it = G.seq.items[k], want = G.seq.items[G.next];
    const r = btn.getBoundingClientRect(), f = G.field.getBoundingClientRect(), px = r.left - f.left + r.width/2, py = r.top - f.top + r.height/2;

    // blok 3D terbang dari butang yang ditekan ke menara / kereta api

    const dir = new THREE.Vector3(px/G.W*2-1, -(py/G.H*2-1), 0.5).unproject(G.cam).sub(G.cam.position).normalize();
    const start = G.cam.position.clone().addScaledVector(dir, 6);

      if(fl){ fl.rotation.x = Math.PI; G.tower[0].add(fl); fl.position.y = -G.tower[0].userData.h/2 - 0.8; }
      G.depart = d => { el += d;

    }, 650);

let actx;
function tone(freqs, dur=0.1, type="sine", vol=0.16){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(vol,s+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}

function start(){
  const g = G.g;
  G.wid = subj; G.w = WD(); G.wg = G.w.g[g.id];
  if(g.duel) return startDuel();
  const team = G.turns[G.ti];
  Object.assign(G, {score:0, lives:LIVES, dur: team==="solo"?DUR.solo:DUR.kelas, el:0, streak:0, good:0, badn:0, log:[], set:null, setHits:0, setT:0, items:[], uid:0, over:false, paused:true, spawnT:0});
  G.tok = Math.random();
  app.innerHTML = `${hudHTML()}<div class="field f3d${g.id==="climb"?" tall":""}" id="field" dir="ltr"></div>${g.id==="catch"||g.id==="run"?`<div class="ctlrow"><button data-act="left" aria-label="Kiri">◀</button><button data-act="right" aria-label="Kanan">▶</button></div>`:""}`;
  G.field = $("field"); G.W = G.field.clientWidth; G.H = G.field.clientHeight;
  G.mod = MOD3[g.id];
  try{ G.mod.init(); }catch(e){ console.error(e); return noGL(); }
  if(g.id==="climb") nextOrder(); else newSet();
  document.addEventListener("keydown", onKey);
  W3.frame(0);
  countdown(()=>{ G.paused = false; G.last = performance.now(); requestAnimationFrame(t=>loop(t, G.tok)); });
  window.scrollTo(0,0);
}
async function countdown(done){
  const f = $("field") || $("duel"), tok = G.tok;
  const o = document.createElement("div"); o.className = "over cdwrap"; f.appendChild(o);
  for(const n of ["3","2","1",tx("Mula!","مولا!")]){
    if(!G || G.tok!==tok) return;
    o.innerHTML = `<div class="cd">${n}</div>`; n.length>1 ? sfx.go() : sfx.tick();
    await new Promise(r=>setTimeout(r, REDUCED?250:700));
  }
  o.remove(); if(G && G.tok===tok) done();
}
function loop(ts, tok){
  if(!G || G.tok!==tok || G.over) return;
  if(G.paused){ G.last = ts; requestAnimationFrame(t=>loop(t,tok)); return; }
  const dt = Math.min(0.05, Math.max(0, (ts-G.last)/1000)); G.last = ts;
  G.el += dt; G.setT += dt;
  const left = Math.max(0, G.dur - G.el);
  const tb = $("tbar"); if(tb){ tb.firstElementChild.style.transform = `scaleX(${left/G.dur})`; tb.classList.toggle("low", left<10); }
  if(G.g.id!=="climb" && G.setT>22) newSet();
  G.mod.update(dt);
  if(left<=0 || G.lives<=0) return endTurn();
  requestAnimationFrame(t=>loop(t,tok));
}
function newSet(){
  const B = bank(); if(!B.length) return;
  let s = pick(B); for(let k=0;k<5 && G.set && s.p[0]===G.set.p[0];k++) s = pick(B);
  G.set = s; G.setHits = 0; G.setT = 0;
  if(G.mod && G.mod.clear) G.mod.clear();
  showPrompt(s.p, s.sub);
}
function showPrompt(p, sub){
  const el = $("prompt"); if(!el) return;
  el.innerHTML = `${subj==="mix"?`<small>${SUB(sub).icon} ${tx(SUB(sub).r,SUB(sub).j)}</small>`:""}🎯 ${L(p)}${G.g.id==="climb"?`<small class="ord">🔢 ${tx("Mula dari yang PERTAMA ➜ hingga yang terakhir","مولا دري يڠ ڤرتام ➜ هيڠڬ يڠ ترآخير")}</small>`:""}`;
  el.classList.remove("new"); void el.offsetWidth; el.classList.add("new");
  if(G.el>0.5) sfx.level();
}
function drawItem(){
  const vis = new Set(G.items.map(x=>key(x.it)));
  const okFree = G.set.ok.filter(x=>!vis.has(key(x))), noFree = G.set.no.filter(x=>!vis.has(key(x)));
  const visOk = G.items.some(x=>x.ok);
  const wantOk = okFree.length && (!noFree.length || !visOk || Math.random()<0.5);
  const it = wantOk ? pick(okFree) : pick(noFree.length?noFree:G.set.no);
  return {it, ok: G.set.ok.includes(it)};
}
const mult = () => Math.min(4, 1 + Math.floor(G.streak/3));
function fx(x, y, txt, bad){
  const e = document.createElement("div"); e.className = "fx"+(bad?" bad":""); e.textContent = txt;
  e.style.left = x+"px"; e.style.top = y+"px"; G.field.appendChild(e); setTimeout(()=>e.remove(), 800);
}
function praise(t){
  const e = document.createElement("div"); e.className = "praise"; e.textContent = t;
  G.field.appendChild(e); setTimeout(()=>e.remove(), 1300); sfx.praise();
}
function good(x, y, it, extra=0){
  const m = mult(), pts = 10*m + extra;
  G.score += pts; G.streak++; G.good++; G.setHits++;
  fx(x, y, "+"+pts); sfx.ok(); hud();
  const pr = PRAISE.find(p=>p[0]===G.streak); if(pr) praise(L(pr[1]));
  if(G.setHits>=5 && G.g.id!=="climb"){ const tk = G.tok; setTimeout(()=>{ if(G && !G.over && G.tok===tk) newSet(); }, 250); }
}
function bad(x, y, it, right){
  G.lives--; G.streak = 0; G.badn++;
  G.log.push({p:G.set.p, it, right, s:G.set.sub});
  fx(x, y, "✗", true); sfx.bad();
  const f = document.createElement("div"); f.className = "flash"; G.field.appendChild(f); setTimeout(()=>f.remove(), 400);
  if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
  hud();
}
function hud(){
  const s = $("sc"); if(s) s.textContent = G.score;
  const k = $("coin"); if(k){ k.textContent = `${WD().coin.e} ${G.good}`; k.classList.remove("bump"); void k.offsetWidth; k.classList.add("bump"); }
  const c = $("combo"); if(c){ const m = mult(); c.textContent = "🔥 x"+m; c.classList.toggle("on", m>1); }
  const h = $("hearts"); if(h) h.textContent = "❤️".repeat(Math.max(0,G.lives)) + "🖤".repeat(LIVES-Math.max(0,G.lives));
}
function onKey(e){
  if(!G || G.over) return;
  if(e.key===" " && !G.g.duel){ e.preventDefault(); togglePause(); return; }
  const m = G.mod; if(m && m.key) m.key(e);
}
function togglePause(){
  if(!G || G.over || G.g.duel) return;
  const f = $("field"); if(!f) return;
  if(!G.paused){
    G.paused = true;
    const o = document.createElement("div"); o.className = "over"; o.id = "pause";
    o.innerHTML = `<div style="width:min(320px,90%)"><h2>⏸ ${tx("Jeda","جيدا")}</h2><button class="btn" data-act="resume">▶ ${tx("Sambung","سمبوڠ")}</button><button class="btn alt" data-act="quit">${tx("Keluar","کلوار")}</button></div>`;
    f.appendChild(o);
  } else { const o = $("pause"); if(o) o.remove(); G.paused = false; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && G && !G.over && !G.paused && G.field && !G.g.duel) togglePause(); });

function nextOrder(){
  const O = orders(); if(!O.length) return;
  let avail = O.filter(o=>!G.used.includes(o.p[0])); if(!avail.length){ G.used = []; avail = O; }
  const s = pick(avail); G.used.push(s.p[0]);
  G.seq = s; G.set = s; G.next = 0; G.setT = 0;
  showPrompt(s.p, s.sub);
  G.mod.newSeq(s);
}

/* ============ DUEL (perlumbaan 3D) ============ */
function startDuel(){
  const solo = G.turns[0]==="solo";
  Object.assign(G, {qn:0, pts:{red:0, blue:0}, over:false, log:[], solo, el:0, paused:false});
  G.tok = Math.random();
  const pan = (t) => `<div class="pan ${t}" id="pan-${t}"><div class="nm"><span>${L(TEAM[t==="red"&&solo?"robot":t==="blue"&&solo?"me":t])}</span><b id="pt-${t}">0</b></div><div class="dq" id="dq-${t}"></div><div class="ops" id="op-${t}"></div></div>`;
  app.innerHTML = `<div class="hud"><button class="iconbtn" data-act="home" aria-label="${tx("Keluar","کلوار")}">✕</button><b class="dtitle">${G.g.icon} ${tx(G.g.r,G.g.j)}</b><span class="sp"></span><span class="sc" id="dqn">1/${DUEL_N}</span></div>
    <div class="duel ${solo?"solo":""}" id="duel" style="position:relative">${pan("red")}<div class="race f3d" id="race" dir="ltr"></div>${pan("blue")}</div>`;
  G.field = $("race"); G.W = G.field.clientWidth; G.H = G.field.clientHeight;
  G.mod = MOD3.race;
  try{ G.mod.init(); }catch(e){ console.error(e); return noGL(); }
  W3.frame(0);
  const tok = G.tok; let last = performance.now();
  const rl = ts => { if(!G || G.tok!==tok || G.over) return; const dt = Math.min(0.05, Math.max(0, (ts-last)/1000)); last = ts; G.el += dt; G.mod.update(dt); requestAnimationFrame(rl); };
  requestAnimationFrame(rl);
  countdown(()=>duelQ());
  window.scrollTo(0,0);
}
function duelQ(){
  const B = bank(), s = pick(B), ok = pick(s.ok), opts = [{it:ok, ok:true}, ...shuffle(s.no).slice(0,2).map(it=>({it, ok:false}))];
  G.dq = {s, opts, lock:{red:false, blue:false}, done:false, tok:Math.random()};
  $("dqn").textContent = `${G.qn+1}/${DUEL_N}`;
  ["red","blue"].forEach(t=>{
    const order = shuffle(opts.map((_,i)=>i));
    $("dq-"+t).innerHTML = `${subj==="mix"?SUB(s.sub).icon+" ":""}${L(s.p)}`;
    $("op-"+t).innerHTML = order.map(i=>`<button data-act="dopt" data-t="${t}" data-i="${i}">${LAB(opts[i].it)}</button>`).join("");
    $("pan-"+t).classList.remove("locked","win");
  });
  if(G.solo){
    const tok = G.dq.tok, wait = rnd(2800, 5600);
    setTimeout(()=>{ if(!G || !G.dq || G.dq.tok!==tok || G.dq.done) return;
      const i = Math.random()<0.65 ? 0 : 1 + Math.floor(Math.random()*2);
      const b = $("op-red").querySelector(`[data-i="${i}"]`); if(b) duelAns("red", i, b); }, wait);
  }
}
function duelAns(t, i, b){
  const q = G.dq; if(!q || q.done || q.lock[t]) return;
  if(q.opts[i].ok){
    q.done = true; G.pts[t]++; b.classList.add("ok"); sfx.ok();
    $("pt-"+t).textContent = G.pts[t]; $("pan-"+t).classList.add("win");
    const other = t==="red"?"blue":"red"; const ob = $("op-"+other).querySelector(`[data-i="0"]`); if(ob) ob.classList.add("ok");
    const tk = G.tok; setTimeout(()=>{ if(G && G.tok===tk) duelNext(); }, 1300);
  } else {
    q.lock[t] = true; b.classList.add("no"); sfx.bad(); $("pan-"+t).classList.add("locked");
    if(t==="blue" || !G.solo) G.log.push({p:q.s.p, it:q.opts[i].it, right:q.opts[0].it});
    if(q.lock.red && q.lock.blue){ q.done = true; ["red","blue"].forEach(x=>{ const ob=$("op-"+x).querySelector(`[data-i="0"]`); if(ob) ob.classList.add("ok"); }); const tk = G.tok; setTimeout(()=>{ if(G && G.tok===tk) duelNext(); }, 1700); }
  }
}
function duelNext(){
  if(!G || G.over) return;
  G.qn++;
  if(G.qn>=DUEL_N) return duelEnd();
  duelQ();
}
function duelEnd(){
  G.over = true;
  const r = G.pts.red, b = G.pts.blue, solo = G.solo;
  const nm = t => L(TEAM[solo ? (t==="red"?"robot":"me") : t]);
  const win = r===b ? null : r>b ? "red" : "blue";
  showResult(`<div class="trophy">${win?"🏆":"🤝"}</div>
    <h2 style="margin:4px 0;font-size:30px;color:var(--w1)">${win ? `${nm(win)} ${tx("menang!","مناڠ!")}` : tx("Seri!","سري!")}</h2>
    <div class="versus"><div class="r ${win==="red"?"w":""}">${nm("red")}<b>${r}</b></div><span>VS</span><div class="b ${win==="blue"?"w":""}">${nm("blue")}<b>${b}</b></div></div>`, win && (!solo || win==="blue"));
}

/* ============ TAMAT ============ */
function endTurn(){
  G.over = true;
  const team = G.turns[G.ti];
  G.results[team] = {score:G.score, good:G.good, bad:G.badn, log:G.log};
  coins[subj] = (coins[subj]||0) + G.good; save("ark3-coins", coins);
  if(G.ti+1 < G.turns.length){
    const nextT = G.turns[G.ti+1];
    const f = $("field"); const o = document.createElement("div"); o.className = "over";
    o.innerHTML = `<div><h2>${tx("Masa tamat!","ماس تامت!")}</h2><p>${L(TEAM[team])}: <b style="font-size:30px">${G.score}</b></p><button class="btn" data-act="nextturn" style="background:var(--${nextT})">${tx("Giliran","ڬيليرن")} ${L(TEAM[nextT])} ▶</button></div>`;
    f.appendChild(o); sfx.level(); return;
  }
  const w = WD();
  if(team==="solo"){
    const gk = G.gid, prev = hiOf(subj, gk), rec = G.score > prev;
    if(rec){ hi[subj] = Object.assign({}, hi[subj], {[gk]:G.score}); save("ark3-hi", hi); }
    const acc = G.good+G.badn ? Math.round(G.good/(G.good+G.badn)*100) : 0;
    const stars = G.good>=20 ? 3 : G.good>=12 ? 2 : G.good>=5 ? 1 : 0;
    showResult(`<div class="trophy">${rec?"🏆":G.lives<=0?"💥":"⏱️"}</div>
      <p style="margin:0;color:var(--muted)">${G.lives<=0?tx("Nyawa habis!","ڽاوا هابيس!"):tx("Masa tamat!","ماس تامت!")}</p>
      <div class="stars" aria-label="${stars}/3">${"⭐".repeat(stars)}<span>${"☆".repeat(3-stars)}</span></div>
      <div class="big">${G.score}</div>
      <p>${rec?`🎉 ${tx("Rekod baharu!","ريکود بهارو!")}`:`🏆 ${tx("Rekod","ريکود")}: ${prev}`}</p>
      <p class="got">${w.coin.e} ${tx("Kamu kumpul","کامو کومڤول")} <b>${G.good}</b> ${tx(w.coin.r, w.coin.j)} • ❌ ${G.badn} • 🎯 ${acc}%</p>
      <p class="cheer">${w.emoji} ${L(w.cheer)}</p>
      ${LB.on ? '<div class="lbres" id="lbres"></div>' : ""}`, rec || stars===3, G.log);
    if(LB.on) lbSubmit({subj, game:gk, score:G.score, good:G.good, bad:G.badn, mistakes:G.log.slice(0,20)});
  } else {
    const r = G.results.red.score, b = G.results.blue.score, win = r===b ? null : r>b ? "red" : "blue";
    showResult(`<div class="trophy">${win?"🏆":"🤝"}</div>
      <h2 style="margin:4px 0;font-size:30px;color:var(--w1)">${win ? `${L(TEAM[win])} ${tx("menang!","مناڠ!")}` : tx("Seri!","سري!")}</h2>
      <div class="versus"><div class="r ${win==="red"?"w":""}">${L(TEAM.red)}<b>${r}</b></div><span>VS</span><div class="b ${win==="blue"?"w":""}">${L(TEAM.blue)}<b>${b}</b></div></div>
      <p class="cheer">${w.emoji} ${L(w.cheer)}</p>`, !!win, [...G.results.red.log, ...G.results.blue.log]);
  }
}
function showResult(inner, party, log){
  drop3D();
  log = log || (G && G.log) || [];
  const seen = new Set(), rv = log.filter(x=>{ const k = key(x.it); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,6);
  const gid = G.gid;
  document.removeEventListener("keydown", onKey);
  app.innerHTML = `<div class="card result" style="margin-top:14px">${inner}
    ${rv.length?`<div class="sec" style="justify-content:center;margin-top:14px">📖 ${tx("Belajar daripada silap","بلاجر درڤد سيلڤ")}</div>
      <ul class="review">${rv.map(x=>`<li>🎯 ${L(x.p)}<br><b>✗ ${LAB(x.it)}</b>${x.right?` &nbsp; ✓ ${LAB(x.right)}`:` — ${tx("bukan jawapannya","بوکن جواڤنڽ")}`}</li>`).join("")}</ul>`:""}
    <button class="btn" data-act="again">🔁 ${tx("Main lagi","ماٴين لاڬي")}</button>
    <button class="btn alt" data-act="home">🕹️ ${tx("Tukar permainan","توکر ڤرماٴينن")}</button></div>`;
  G.over = true; G.gidLast = gid;
  sfx.win(); if(party) rain();
  window.scrollTo(0,0);
}
function rain(){
  if(REDUCED) return;
  const box = document.createElement("div"), e = WD().coin.e; box.className = "rain";
  for(let i=0;i<26;i++){ const s = document.createElement("span"); s.textContent = pick([e, e, "⭐","🎉","✨","🌟"]);
    s.style.left = Math.random()*100+"vw"; s.style.animationDuration = (2+Math.random()*2)+"s"; s.style.animationDelay = (Math.random()*0.8)+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 4500);
}


/* ============ PAPAN PENDAHULU (Clerk + /api di Vercel + Neon) ============
   Log masuk Google melalui Clerk. Murid memilih nama samaran (nama sebenar tidak dipaparkan).
   Hanya skor "Main Sendiri" dihantar. Jika kunci Clerk tiada atau laman dibuka dari fail, bahagian ini disembunyikan. */
// Log masuk dan API dikongsi dengan Papan Pemuka Guru melalui assets/auth.js (KafaAuth)
const LB = {
  on: !!(window.KafaAuth && KafaAuth.on),
  clerk:null, uid:null, me:null, failed:false, pending:null, loadP:null,
  game: load("ark3-lbgame","all"), scope: load("ark3-lbscope","all"),
  init(){
    if(!this.on) return Promise.resolve(null);
    if(!this.loadP) this.loadP = KafaAuth.init().then(async c=>{
      this.clerk = c; this.failed = KafaAuth.failed; this.uid = KafaAuth.uid;
      if(this.uid) await this.fetchMe();
      if(c) KafaAuth.onChange(()=>{ this.uid = KafaAuth.uid; this.me = null; this.changed(); });
      return c;
    });
    return this.loadP;
  },
  api(path, body){ return KafaAuth.api(path, body); },
  async fetchMe(){ try{ this.me = await this.api("me"); }catch(e){ this.me = null; } return this.me; },
  async changed(){
    if(this.uid) await this.fetchMe();
    if(this.uid && this.me && !this.me.player) return acctSheet(true);
    if(this.pending && $("lbres")) return lbSubmit(this.pending);
    if($("lbbox")) renderMap();
  },
  name(){ return this.me && this.me.player ? this.me.player.name : null; }
};

const lbErr = e => ({"rude-name":tx("Nama ini tidak sesuai. Pilih nama yang sopan.","نام اين تيدق سسواي. ڤيليه نام يڠ سوڤن."),
  "bad-name":tx("Nama samaran mesti 2–16 huruf atau nombor.","نام سامرن مستي 2–16 حروف اتاو نومبور."),
  "name-locked":tx("Nama kamu telah ditetapkan oleh guru.","نام کامو تله دتتڤکن اوليه ڬورو."),
  "bad-class":tx("Nama kelas terlalu pendek.","نام کلس ترلالو ڤندق."), "class-limit":tx("Had 10 kelas telah dicapai.","حد 10 کلس تله دچاڤاي.")}[e.code]
  || {401:tx("Sila log masuk semula.","سيلا لوڬ ماسوق سمولا."), 403:tx("Kamu bukan ahli kelas ini.","کامو بوکن اهلي کلس اين."),
  404:tx("Kod kelas tidak dijumpai.","کود کلس تيدق دجومڤاٴي."), 409:tx("Pilih nama samaran dahulu.","ڤيليه نام سامرن دهولو."),
  429:tx("Terlalu pantas, cuba sebentar lagi.","ترلالو ڤنتس، چوبا سبنتر لاڬي.")}[e.status]

async function lbAct(act, b){

    if(act==="lbname") LB.me = await LB.api("me", {name:$("lbname").value});

    if(act==="lbcreate") LB.me = await LB.api("class", {action:"create", name:$("lbcname").value});
    if(act==="lbleave") LB.me = await LB.api("class", {action:"leave", code:b.dataset.c});
    if(act==="lbname" && LB.pending && $("lbres")){ document.querySelectorAll(".sheet").forEach(s=>s.remove()); return lbSubmit(LB.pending); }

}

/* ============ PERISTIWA ============ */
function handle(b, e){
  switch(b.dataset.act){
    case "mute": muted=!muted; save("ark3-muted",muted); b.textContent=muted?"🔇":"🔊"; break;
    case "lang": lang = isJ() ? "rumi" : "jawi"; save("kafa-lang",lang); applyLang(); renderMap(); break;
    case "subj": subj = b.dataset.s; save("ark3-subj",subj); tabURL(); renderMap(); break;
    case "tab": tab = b.dataset.t; tabURL(); renderMap(); break;
    case "pmode": pmode = b.dataset.m; save("ark3-mode",pmode); renderMap(); break;
    case "game": openGame(b.dataset.g); break;
    case "home": renderMap(); break;
    case "start": begin(b); break;
    case "again": { const gid = G ? G.gid : null; if(gid) openGame(gid); else renderMap(); break; }
    case "nextturn": G.ti++; intro(); break;
    case "pause": togglePause(); break;
    case "resume": togglePause(); break;
    case "quit": renderMap(); break;
    case "pick": if(G && !G.paused && !G.over && G.mod.pick) G.mod.pick(+b.dataset.k, b); break;
    case "lane3": if(G && !G.paused && !G.over && G.mod.setLane) G.mod.setLane(+b.dataset.l); break;
    case "left": if(G && !G.over && G.mod.nudge) G.mod.nudge(-1); break;
    case "right": if(G && !G.over && G.mod.nudge) G.mod.nudge(1); break;
    case "login": LB.init().then(()=>{ if(LB.clerk) LB.clerk.openSignIn({}); else toast("⚠️ "+tx("Log masuk tidak dapat dimuatkan.","لوڬ ماسوق تيدق داڤت دمواتکن.")); }); break;
    case "acct": acctSheet(!LB.name()); break;
    case "sheetclose": document.querySelectorAll(".sheet").forEach(s=>s.remove()); break;
    case "logout": document.querySelectorAll(".sheet").forEach(s=>s.remove()); if(LB.clerk) LB.clerk.signOut(); break;
    case "lbscope": LB.scope = b.dataset.c; save("ark3-lbscope", LB.scope); lbPaint(); break;
    case "lbgame": LB.game = b.dataset.g; save("ark3-lbgame", LB.game); lbPaint(); break;
    case "lbview": LB.game = b.dataset.g; LB.scope = "all"; tab = "board"; tabURL(); renderMap(); break;
    case "lbname": case "lbjoin": case "lbcreate": case "lbleave": lbAct(b.dataset.act, b); break;
    case "dopt": if(G && G.dq && !(G.solo && b.dataset.t==="red")) duelAns(b.dataset.t, +b.dataset.i, b); break;
  }
}
app.addEventListener("pointerdown", e=>{
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  if(["lane3","dopt","pick"].includes(b.dataset.act)){ e.preventDefault(); handle(b, e); }
});
app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  if(["lane3","dopt","pick"].includes(b.dataset.act)){ if(e.detail===0) handle(b, e); return; }
  handle(b, e);
});

if(!REDUCED){
  app.addEventListener("pointermove", e=>{
    if(e.pointerType!=="mouse") return; // jari/pen: tiada condong (elak halaman melebar semasa menatal)
    const c = e.target.closest(".tilt"); if(!c) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    c.style.setProperty("--rx", (-y * 12).toFixed(2) + "deg"); c.style.setProperty("--ry", (x * 14).toFixed(2) + "deg");
  });
  app.addEventListener("pointerout", e=>{ const c = e.target.closest(".tilt"); if(c && !c.contains(e.relatedTarget)){ c.style.removeProperty("--rx"); c.style.removeProperty("--ry"); } });
}
app.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.matches(".sheet input")){ const b = e.target.parentElement.querySelector("button"); if(b) b.click(); } });

applyLang();
renderMap();
</script>
</body>
</html>
