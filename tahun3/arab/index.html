<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lompat Katak • Bahasa Arab Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF7EC; --surface:#FFFFFF; --ink:#1D3324; --muted:#55705C; --line:#CDE6D2;
  --brand:#2E9D4F; --brand-ink:#FFFFFF; --brand-shadow:#1E6E36; --gold:#E8A317; --pink:#E85D9A;
  --ok:#1F8A50; --ok-bg:#DDF3E5; --bad:#C8452F; --bad-bg:#FBE1DC; --note:#FFF4D6;
  --pattern:rgba(46,157,79,.10);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1C13; --surface:#18301F; --ink:#E6F5EA; --muted:#A9C9B1; --line:#2A4A34;
    --brand:#4CC26F; --brand-ink:#06200F; --brand-shadow:#2E8A4B; --gold:#F2C14E; --pink:#FF7FB5;
    --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#33301A;
    --pattern:rgba(76,194,111,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1C13; --surface:#18301F; --ink:#E6F5EA; --muted:#A9C9B1; --line:#2A4A34;
  --brand:#4CC26F; --brand-ink:#06200F; --brand-shadow:#2E8A4B; --gold:#F2C14E; --pink:#FF7FB5;
  --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#33301A;
  --pattern:rgba(76,194,111,.08);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background-image:radial-gradient(ellipse 14px 10px at 50% 50%,var(--pattern) 98%,transparent 100%);background-size:48px 40px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 44px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{max-width:100%}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:700;line-height:1.7}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
a.iconbtn{text-decoration:none;color:inherit}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.pillstat{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-weight:800;font-size:17px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.langbtn .ar{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:600}

.hero{text-align:center;padding:8px 0 2px}
.hero .badge{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px}
.hero h1{margin:8px 0 0;font-size:clamp(32px,8.6vw,50px);line-height:1.04;font-weight:800;color:var(--brand)}
.hero .arsub{display:block;font-family:"Amiri",serif;font-size:24px;color:var(--muted);line-height:1.5}
.hero p{margin:4px auto 0;color:var(--muted);max-width:480px}

/* ===== Kolam (peta) ===== */
.pondmap{position:relative;margin:16px auto 0;max-width:540px;border-radius:40px;overflow:hidden;border:6px solid #8BC48A;box-shadow:inset 0 0 0 4px #6FA86E;
  background:radial-gradient(ellipse at 30% 20%,#7FD3D6 0%,#3FA9B5 45%,#2A8597 100%)}
.pondmap .ripple{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:ripple 4s ease-out infinite;pointer-events:none}
@keyframes ripple{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.pondmap .deco{position:absolute;font-size:30px;pointer-events:none}
.pondmap .reed{position:absolute;font-size:40px;pointer-events:none;animation:sway 3.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.pondmap .fishsh{position:absolute;width:46px;height:16px;border-radius:50%;background:rgba(10,50,60,.28);animation:fishsh linear infinite;pointer-events:none}
@keyframes fishsh{from{left:-60px}to{left:110%}}
.pondmap .bfly{position:absolute;font-size:26px;animation:bfly 14s linear infinite;pointer-events:none}
@keyframes bfly{0%{left:-10%;transform:translateY(0)}25%{transform:translateY(-30px)}50%{transform:translateY(10px)}75%{transform:translateY(-20px)}100%{left:110%;transform:translateY(0)}}
.pondmap svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad{position:absolute;transform:translate(-50%,-50%);width:180px;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0}
.pad .leaf{position:relative;width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 200deg,transparent 0 26deg,var(--tc) 26deg 360deg);box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.pad .leaf::before{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.pad .leaf .ic{position:relative;font-size:30px;line-height:1}
.pad .leaf .no{position:absolute;top:-6px;right:-6px;background:#fff;color:#1D3324;border-radius:999px;min-width:30px;height:30px;display:grid;place-items:center;font-family:"Amiri",serif;font-weight:700;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.pad .leaf .bloom{position:absolute;bottom:-4px;left:-6px;font-size:28px;animation:bloom 2.4s ease-in-out infinite}
@keyframes bloom{50%{transform:scale(1.15) rotate(-6deg)}}
.pad .lbl{margin-top:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:2px 10px 4px;font-weight:800;font-size:15px;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.pad .lbl .ar{display:block;font-size:18px;line-height:1.5;font-weight:700}
.pad .lbl small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.pad .st{font-size:13px;letter-spacing:1px;margin-top:3px;background:rgba(0,0,0,.28);border-radius:999px;padding:0 8px}
.pad .st .off{opacity:.3;filter:grayscale(1)}
.pad.locked .leaf{filter:grayscale(.75) brightness(.85)}
.pad.locked .lbl{opacity:.8}
.pad:active .leaf{transform:scale(.94)}
.pad.current .leaf{animation:padglow 1.8s ease-in-out infinite}
@keyframes padglow{50%{box-shadow:0 6px 0 rgba(0,0,0,.18),0 0 0 10px rgba(255,255,255,.35)}}
.mfrog{position:absolute;width:74px;transform:translate(-50%,-80%);pointer-events:none;transition:left .9s ease-in-out,top .9s ease-in-out;z-index:3}
.mfrog .mascot{animation:idle 2.6s ease-in-out infinite}
.mfrog.hopping .mascot{animation:maphop .9s ease-in-out}
@keyframes maphop{50%{transform:translateY(-60px) scale(1.1)}}
@keyframes idle{50%{transform:translateY(-4px)}}
.teacher{display:flex;justify-content:center;margin-top:20px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700}
.toggle .sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--brand)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.foot{margin-top:16px;color:var(--muted);font-size:15px;text-align:center}

/* ===== Stesen ===== */
.banner{border-radius:26px;padding:18px 18px 20px;background:var(--tc);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.banner .kick{font-weight:700;opacity:.92;font-size:16px}
.banner h2{margin:0;font-size:clamp(25px,6.4vw,33px);line-height:1.15}
.banner .arh{display:block;font-family:"Amiri",serif;font-size:clamp(26px,7vw,36px);line-height:1.5}
.banner .big{position:absolute;inset-inline-end:-4px;bottom:-12px;font-size:92px;opacity:.25}
.banner .stars{margin-top:6px;font-size:20px}
.banner .stars .off{opacity:.35;filter:grayscale(1)}
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.units li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;line-height:1.25}
.units .u{background:var(--tc);color:#fff;border-radius:10px;font-size:13px;font-weight:800;padding:2px 8px;flex:none}
.actions{display:grid;gap:12px;margin-top:18px}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:0;border-radius:20px;padding:14px 16px;font-weight:800;font-size:21px;line-height:1.15}
.bigbtn small{display:block;font-weight:600;font-size:15px;opacity:.9}
.bigbtn .e{font-size:34px;flex:none}
.bigbtn.read{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.bigbtn.play{background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-shadow)}
.bigbtn:active{transform:translateY(3px)}

/* ===== Umum ===== */
.gamehead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.gamehead h2{margin:0;font-size:20px;flex:1;line-height:1.15;color:var(--brand)}
.gamehead h2 small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#8BD98F,#2E9D4F);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.page-in{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qtype{display:inline-block;background:var(--note);border-radius:999px;padding:1px 12px;font-size:14.5px;font-weight:700}
.tag{display:inline-block;background:var(--gold);color:#2A1B00;border-radius:999px;padding:1px 10px;font-size:13.5px;font-weight:800;margin-inline-start:4px}
.pill{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.qtext{font-size:clamp(20px,4.8vw,25px);font-weight:700;line-height:1.32;margin:4px 0 12px}
.qtext .ar{font-size:1.25em}
.hint{color:var(--muted);font-size:15.5px;margin:-4px 0 12px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.08)}}
.counter{display:inline-block;background:var(--note);border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}
.prompt{display:grid;place-items:center;text-align:center;background:var(--note);border:3px solid var(--gold);border-radius:20px;padding:10px 14px;margin:0 0 12px;min-height:90px}
.prompt .pe{font-size:64px;line-height:1.1;animation:bob 2.4s ease-in-out infinite}
.prompt .ar{font-size:clamp(30px,8vw,42px);line-height:1.5}
.prompt .dg{font-size:46px;font-weight:800;letter-spacing:2px;line-height:1.1}
.prompt .dg small{display:block;font-size:18px;color:var(--muted);letter-spacing:0}
.prompt .mn{font-size:22px;font-weight:800}
@keyframes bob{50%{transform:translateY(-6px)}}

/* Lompat teratai */
.lily{position:relative;padding:4px 0 86px;border-radius:22px;background:radial-gradient(ellipse at 50% 30%,#8ADCE0,#3FA9B5 75%);overflow:hidden}
.lilies{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.lp{position:relative;min-height:96px;border:0;border-radius:50%/46%;background:conic-gradient(from 160deg,transparent 0 22deg,#4CAF50 22deg 360deg);color:#10331C;padding:14px 10px;font-weight:800;font-size:16px;line-height:1.25;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.lp::before{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);pointer-events:none}
.lp .ar{position:relative;font-size:clamp(20px,5.4vw,25px);line-height:1.5;color:#0B2614}
.lp span{position:relative}
.lp:active{transform:scale(.96)}
.lp.ok{background:conic-gradient(from 160deg,transparent 0 22deg,#8BE07F 22deg 360deg);box-shadow:0 0 0 4px #FFE27A,0 5px 0 rgba(0,0,0,.18)}
.lp.bad{filter:grayscale(.6) brightness(.85)}
.qfrog{position:absolute;left:50%;bottom:6px;width:76px;margin-left:-38px;transition:transform .8s cubic-bezier(.4,0,.3,1);z-index:2}
.qfrog .mascot{transition:transform .2s}
.qfrog.jump .mascot{animation:qhop .8s ease-in-out}
@keyframes qhop{50%{transform:translateY(-70px) scale(1.15) rotate(-8deg)}}
.qfrog.sink{transition:opacity .5s .1s,transform .5s;opacity:0}
.splash{position:absolute;font-size:44px;pointer-events:none;animation:spl .8s ease-out forwards;z-index:3}
@keyframes spl{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6) translateY(-20px);opacity:0}}

/* Dengar & pilih */
.speaker{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 12px}
.speaker .big{width:96px;height:96px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:44px;box-shadow:0 6px 0 var(--brand-shadow);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--brand-shadow),0 0 0 12px color-mix(in srgb,var(--brand) 25%,transparent)}}
.speaker .reveal{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.heard{text-align:center;margin:-4px 0 10px;min-height:10px}
.heard .ar{font-size:32px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:104px;border:2px solid var(--line);background:var(--bg);border-radius:20px;font-size:52px;line-height:1.1;box-shadow:0 4px 0 var(--line);padding:6px}
.tile.txt{font-size:20px;font-weight:800}
.tile:active{transform:translateY(3px)}
.tile.ok{border-color:var(--ok);background:var(--ok-bg);animation:pop .35s}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Tangkap lalat */
.flyzone{position:relative;height:330px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#BFE9F2 0%,#E3F6E0 62%,#3FA9B5 62%,#2A8597 100%)}
.flyzone .padbase{position:absolute;left:50%;bottom:8px;width:120px;height:40px;margin-left:-60px;border-radius:50%;background:#4CAF50}
.flyzone .ffrog{position:absolute;left:50%;bottom:22px;width:84px;margin-left:-42px;z-index:2}
.fly{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;animation:buzz var(--t) ease-in-out infinite;animation-delay:var(--d)}
.fly .bug{font-size:30px;line-height:1;animation:wings .18s linear infinite}
.fly .w{background:#fff;color:#10331C;border:2px solid #2E9D4F;border-radius:12px;padding:0 10px;font-size:19px;line-height:1.5;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
@keyframes wings{50%{transform:rotate(8deg)}}
@keyframes buzz{0%,100%{margin:0}25%{margin:-10px 0 0 14px}50%{margin:6px 0 0 -10px}75%{margin:-6px 0 0 -14px}}
.fly.eaten{animation:eaten .45s .2s ease-in forwards}
@keyframes eaten{to{opacity:0;transform:translate(-50%,-50%) scale(.2)}}
.fly.nope .w{background:#ddd;border-color:#999;color:#666}
.fly.nope{animation:shake .4s}
.tongue{position:absolute;height:7px;background:#F06A8A;border-radius:6px;transform-origin:0 50%;z-index:1;animation:tongue .5s ease-in-out forwards;pointer-events:none}
@keyframes tongue{0%{transform:rotate(var(--a)) scaleX(0)}45%{transform:rotate(var(--a)) scaleX(1)}100%{transform:rotate(var(--a)) scaleX(0)}}

/* Papan kekunci nombor */
.numwords{text-align:center;background:var(--note);border:3px solid var(--gold);border-radius:20px;padding:10px;margin:0 0 12px}
.numwords .ar{font-size:clamp(26px,7vw,36px)}
.screen{display:flex;justify-content:center;gap:8px;margin:0 0 12px}
.screen i{width:62px;height:72px;border-radius:14px;background:#16301E;color:#9CFF8A;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:34px;line-height:1;box-shadow:inset 0 3px 0 rgba(0,0,0,.4)}
.screen i small{font-size:15px;color:#7FC98A;font-family:"Amiri",serif}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
.key{height:58px;border:0;border-radius:14px;background:var(--bg);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:24px;line-height:1}
.key small{display:block;font-family:"Amiri",serif;font-size:16px;color:var(--muted)}
.key.ent{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);box-shadow:0 4px 0 var(--brand-shadow)}
.key:active{transform:translateY(3px)}

/* Bakul */
.wordcard{display:grid;place-items:center;min-height:84px;margin:0 auto 12px;max-width:420px;text-align:center;background:var(--note);border:3px solid var(--gold);border-radius:18px;padding:6px 14px;animation:pagein .3s}
.wordcard .ar{font-size:clamp(30px,8vw,40px);line-height:1.4}
.wordcard small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.wordcard.drop{transition:transform .4s ease-in,opacity .4s;transform:translateY(70px) scale(.4);opacity:0}
.baskets{display:grid;gap:10px}
.baskets.n2{grid-template-columns:1fr 1fr}.baskets.n3{grid-template-columns:1fr 1fr 1fr}
.basket{position:relative;border:0;border-radius:10px 10px 40px 40px;padding:10px 6px 14px;color:#3A2410;font-weight:800;font-size:16px;line-height:1.2;background:repeating-linear-gradient(45deg,#E2B46D 0 8px,#C99447 8px 16px);box-shadow:0 5px 0 #8C6328;min-height:120px}
.basket::before{content:"";position:absolute;left:12%;right:12%;top:-14px;height:24px;border:5px solid #8C6328;border-bottom:0;border-radius:30px 30px 0 0}
.basket .bl{display:block;background:rgba(255,255,255,.85);border-radius:10px;padding:2px 4px;margin-bottom:4px}
.basket .bl .ar{font-size:20px;line-height:1.4}
.basket .be{font-size:22px;display:block}
.basket.bounce{animation:pop .35s}
.basket:disabled{opacity:.6}
.basket .got{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:4px}
.basket .got i{font-style:normal;background:#fff;border-radius:8px;padding:0 6px;font-family:"Amiri",serif;font-size:15px;line-height:1.5;animation:pop .3s}
.basket .got i.x{outline:2px solid var(--bad)}

/* Sihir */
.magic{display:grid;place-items:center;text-align:center;margin:0 auto 12px;max-width:420px;border-radius:22px;padding:12px;background:radial-gradient(circle at 50% 30%,#3D2A6E,#1C1235);color:#fff;min-height:150px;position:relative;overflow:hidden}
.magic .from{font-family:"Amiri",serif;font-size:clamp(36px,9vw,48px);font-weight:700;line-height:1.4}
.magic .to{font-size:15px;font-weight:800;background:rgba(255,255,255,.18);border-radius:999px;padding:1px 12px}
.magic .st{position:absolute;font-size:16px;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}
.magic.morph .from{animation:morph .9s ease}
@keyframes morph{0%{transform:scale(1);filter:none}40%{transform:scale(.2) rotate(-20deg);filter:blur(4px);opacity:.2}100%{transform:scale(1);filter:none;opacity:1}}
.potions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.potion{border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:6px 10px 10px;box-shadow:0 4px 0 var(--line)}
.potion::before{content:"🧪";display:block;font-size:26px}
.potion .ar{font-size:24px}
.potion.ok{border-color:var(--ok);background:var(--ok-bg)}
.potion.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Bina ayat */
.sentence{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:68px;background:#F4E7CF;border:3px dashed #B98B4E;border-radius:16px;padding:10px;margin-bottom:14px}
.bslot{min-width:64px;border-bottom:4px dashed #B98B4E;text-align:center;color:#8C6328;font-size:24px}
.bslot.f{border-bottom:0;background:#C98B4E;color:#fff;border-radius:10px;padding:0 10px;box-shadow:0 4px 0 #8C6328;animation:pop .3s}
.bslot .ar{font-size:24px}
.blocks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.block{border:0;background:#E2B46D;color:#3A2410;border-radius:10px;padding:2px 16px;box-shadow:0 5px 0 #8C6328}
.block .ar{font-size:25px}
.block:active{transform:translateY(3px)}
.block.gone{visibility:hidden}
.block.shake{background:var(--bad-bg)}

/* Susun kalendar */
.calslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cal{position:relative;min-height:74px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;padding:18px 4px 4px;text-align:center}

.cal.f{border:2px solid #C0392B;background:#fff;color:#2B2B2B;animation:pop .3s}
.cal.f .cn{background:#C0392B;color:#fff}
.cal .ar{font-size:19px;line-height:1.4}
.calchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.calchip{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:2px 12px;box-shadow:0 3px 0 var(--line);border-top:8px solid #C0392B}
.calchip .ar{font-size:20px}
.calchip.shake{background:var(--bad-bg)}

/* Memori teratai */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;perspective:800px}
@media (max-width:460px){.memo{grid-template-columns:repeat(3,1fr)}}
.mcard{position:relative;aspect-ratio:1;min-height:76px;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .45s}
.mcard.flip{transform:rotateY(180deg)}
.mcard .bk,.mcard .fc{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:6px;text-align:center;font-weight:800;line-height:1.2}
.mcard .bk{background:conic-gradient(from 160deg,#3FA9B5 0 22deg,#4CAF50 22deg 360deg);font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.mcard .fc{transform:rotateY(180deg);background:#FFF6D8;border:3px solid var(--gold);color:#1D3324;font-size:14px}
.mcard .fc .ar{font-size:18px;line-height:1.4}
.mcard .fc .em{font-size:34px}
.mcard.done .fc{background:#C8F0C0;border-color:var(--ok)}

.unitlbl{display:inline-block;background:var(--tc);color:#fff;border-radius:999px;padding:1px 12px;font-weight:800;font-size:14.5px;margin-bottom:8px}
.readtext{font-size:clamp(18px,4.4vw,21px);font-weight:600;line-height:1.5;margin:0 0 12px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:0 0 12px}
.vt{display:flex;flex-direction:column;align-items:center;gap:0;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:6px 4px 8px;box-shadow:0 3px 0 var(--line);animation:pagein .4s both;animation-delay:calc(var(--i) * 50ms)}
.vt .em{font-size:34px;line-height:1.2}
.vt .ar{font-size:22px;line-height:1.5}
.vt small{font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.2}
.vt:active{transform:translateY(2px)}
.vt.playing{border-color:var(--brand);background:var(--ok-bg)}
.dlg{display:grid;gap:8px;margin:0 0 12px}
.dl{display:flex;gap:8px;align-items:flex-end;animation:msgin .45s both;animation-delay:var(--d)}

.dl .b .ar{font-size:22px;line-height:1.6;display:block}
.dl .b small{display:block;font-size:13.5px;color:var(--muted);font-weight:700;text-align:start;direction:ltr}
html[dir="rtl"] .dl .b small{direction:rtl}
.dl .b em{display:block;font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}
.dl.r{flex-direction:row-reverse}
.dl.r .b{border-radius:18px 18px 18px 4px;background:color-mix(in srgb,var(--tc) 14%,var(--surface));border-color:color-mix(in srgb,var(--tc) 40%,var(--line))}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.95)}}
.dl button,.sent button{border:0;background:none;font-size:18px;padding:0 4px}
.sents{display:grid;gap:8px;margin:0 0 12px}
.sent{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:6px 10px;animation:pagein .4s both;animation-delay:calc(var(--i) * 80ms)}
.sent .em{font-size:30px;flex:none}
.sent .tx{flex:1;text-align:right}
.sent .tx .ar{font-size:22px;display:block;line-height:1.6}
.sent .tx small{display:block;text-align:start;color:var(--muted);font-weight:700;font-size:14.5px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 12px}
.nt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:4px 6px 6px;box-shadow:0 3px 0 var(--line);animation:pagein .4s both;animation-delay:calc(var(--i) * 40ms)}

.arbox small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.maksud{font-size:16px;color:var(--muted);font-weight:600;margin:0 0 12px;font-style:italic}
.tip{background:var(--note);border-radius:16px;padding:8px 12px;margin:0 0 12px;font-weight:600;font-size:17px}

.ref{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--muted)}
.navrow{display:grid;grid-template-columns:52px auto 1fr;gap:8px;align-items:center}
.navrow .secondary,.navrow .primary{margin:0;padding:11px 6px;font-size:18px}
.navrow .secondary:disabled{opacity:.35}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:99px}

.feedback{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;background:var(--note);font-size:17px;line-height:1.4}
.feedback .mascot{width:76px}
.feedback strong{display:block;font-size:21px}
.feedback .ar{font-size:21px}
.streak{display:inline-block;background:var(--gold);color:#3A2600;border-radius:999px;padding:0 10px;font-weight:800;font-size:15px;margin:2px 0 4px}
.primary{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:13px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-shadow)}
.secondary{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:transparent;border-radius:16px;padding:11px;font-size:18px;font-weight:700}
.result{text-align:center}
.result .mascot{width:120px;margin:0 auto}
.result .stars{font-size:54px;letter-spacing:6px;line-height:1.1;margin:4px 0}
.result .stars .off{filter:grayscale(1);opacity:.25}
.result h2{margin:4px 0 2px;font-size:32px;color:var(--brand)}
.result p{margin:0 0 6px;color:var(--muted)}
.unlock{display:inline-block;margin:8px 0 0;background:var(--note);border:2px solid var(--gold);border-radius:999px;padding:3px 14px;font-weight:800}
.earned{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:20px;margin:4px 0}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;top:-50px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
.sparkle{position:fixed;pointer-events:none;font-size:26px;z-index:40;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translateY(-44px) scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
.mascot{display:block;height:auto;flex:none}
.mascot.happy{animation:hopm .45s ease 2}
.mascot.sad{animation:tilt .9s ease}
@keyframes hopm{50%{transform:translateY(-10px)}}
@keyframes tilt{30%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rain,.pondmap .fishsh,.pondmap .bfly,.pondmap .ripple{display:none}
}

/* ============ BUNYI & SUARA ============ */
let actx;
function tone(freqs, dur=0.12, type="sine"){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sfx = { ok:()=>tone([660,880]), bad:()=>tone([240,180],0.15,"triangle"), tap:()=>tone([520],0.06,"triangle"), boing:()=>tone([300,600,900],0.07), splash:()=>tone([200,140],0.12,"sawtooth"), slurp:()=>tone([900,500],0.06), magic:()=>tone([784,988,1319,1568],0.07), win:()=>tone([523,659,784,1047],0.14) };
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voiceMs = null, voiceAr = null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voiceMs = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; voiceAr = vs.find(v=>/^ar/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function say(text, ar){
  if(!ttsOK || !text) return;
  try{
    speechSynthesis.cancel();
    const t = ar ? String(text).replace(/[؟?_]+/g,"") : String(text).replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/[“”…]/g,"").replace(/[؀-ۿ]+/g,"").replace(/\p{Extended_Pictographic}/gu,"");
    const u = new SpeechSynthesisUtterance(t);
    const v = ar ? voiceAr : voiceMs;
    u.lang = v ? v.lang : (ar ? "ar-SA" : "ms-MY");
    if(v) u.voice = v;
    u.rate = ar ? 0.75 : 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
const speakAr = t => say(t, true);
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

const LOTUS = `<span aria-hidden="true">🪷</span>`;
const starsHTML = n => [0,1,2].map(i=>`<span class="${i<n?"":"off"}">⭐</span>`).join("");
const muteBtn = () => `<button class="iconbtn" data-act="mute" aria-label="${muted?"Hidupkan bunyi":"Matikan bunyi"}">${muted?"🔇":"🔊"}</button>`;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2800);
}
function sparkle(el, txt){
  const r = el.getBoundingClientRect(), s = document.createElement("span");
  s.className="sparkle"; s.textContent = txt; s.style.left=(r.left+r.width/2-13)+"px"; s.style.top=(r.top+r.height/4)+"px";
  document.body.appendChild(s); setTimeout(()=>s.remove(),900);
}

function startRead(){ run.c = 0; showCard(); }
function showCard(){
  stopAnims();
  const t = LESSONS[+run.station], c = t.cards[run.c], n = t.cards.length;
  run.say = [R(c.t), R(c.rule), R(c.mk), R(c.tip)].filter(Boolean).join(". ").replace(/<[^>]+>/g,"");
  let body = `<span class="unitlbl">${L(c.u)}</span>`;
  if(c.t) body += `<p class="readtext">${L(c.t)}</p>`;
  if(c.dlg) body += `<div class="dlg">${c.dlg.map(([who,nm,a,m],i)=>`<div class="dl ${i%2?"r":""}" style="--d:${i*0.5}s"><span class="who" aria-hidden="true">${who}</span><div class="b"><em>${L(nm)}</em><span class="ar" lang="ar">${a}</span><small>${L(m)}</small></div><button data-act="sayar" data-w="${a}" aria-label="${tx("Dengar","دڠر")}">🔊</button></div>`).join("")}</div>`;
  if(c.vocab) body += `<p class="hint">👆 ${tx("Tekan perkataan untuk mendengar sebutan.","تکن ڤرکاتاٴن اونتوق مندڠر سبوتن.")}</p><div class="vgrid">${c.vocab.map((w,i)=>`<button class="vt" style="--i:${i}" data-act="sayar" data-w="${w.a}">${w.e?`<span class="em" aria-hidden="true">${w.e}</span>`:""}<span class="ar" lang="ar">${w.a}</span><small>${L(w.m)}</small></button>`).join("")}</div>`;
  if(c.nums) body += `<p class="hint">👆 ${tx("Tekan nombor untuk mendengar sebutan.","تکن نومبور اونتوق مندڠر سبوتن.")}</p><div class="ngrid">${c.nums.map((x,i)=>`<button class="nt vt" style="--i:${i}" data-act="sayar" data-w="${NUM(x)}"><b>${x}<small>${AD(x)}</small></b><span class="ar" lang="ar">${NUM(x)}</span></button>`).join("")}</div>`;
  if(c.sents) body += `<div class="sents">${c.sents.map(([e,a,m],i)=>`<button class="sent vt" style="--i:${i}" data-act="sayar" data-w="${a}"><span class="em" aria-hidden="true">${e}</span><span class="tx"><span class="ar" lang="ar">${a}</span><small>${L(m)}</small></span>🔊</button>`).join("")}</div>`;
  if(c.table) body += `<table class="ttable"><tr>${c.table.h.map(h=>`<th>${h}</th>`).join("")}<th></th></tr>${c.table.rows.map(r=>`<tr>${r.slice(0,3).map(x=>isAr(x)?`<td><button class="vt" style="all:unset;cursor:pointer" data-act="sayar" data-w="${x}"><span class="ar" lang="ar">${x}</span></button></td>`:`<td style="font-size:26px">${x}</td>`).join("")}<td><small>${L(r[3])}</small></td></tr>`).join("")}</table>`;
  if(c.rule) body += `<div class="rule">💡 ${L(c.rule)}${(c.ex||[]).map(x=>`<span class="ex">${x}</span>`).join("")}</div>`;
  if(c.ar) body += `<div class="arbox"><span class="ar" lang="ar">${c.ar}</span>${c.src?`<small>${L(c.src)}</small>`:""}</div>`;
  if(c.mk) body += `<p class="maksud">${L(c.mk)}</p>`;
  if(c.tip) body += `<div class="tip"><b>🌟 ${tx("Ingat!","ايڠت!")}</b>${L(c.tip)}</div>`;
  body += `<p class="ref" style="margin:-4px 0 12px">📖 ${tx("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</p>`;
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="${tx("Kembali","کمبالي")}">${BACK()}</button><h2>${tx("Dengar & Baca","دڠر & باچ")}<small>${L(t.title)}</small></h2><span class="pill">${run.c+1}/${n}</span></div>

      ${body}
      <div class="navrow">
        <button class="secondary" data-act="cprev" aria-label="${tx("Kad sebelum","کد سبلوم")}" ${run.c===0?"disabled":""}>${isJ()?"▶":"◀"}</button>
        ${ttsOK&&run.say?`<button class="pill" data-act="say" style="padding:9px 12px">🔊 ${tx("Dengar","دڠر")}</button>`:"<span></span>"}
        <button class="primary" data-act="cnext">${run.c+1<n?tx("Seterusnya","ستروسڽ"):tx("Mula Melompat","مولا ملومڤت")} ${isJ()?"◀":"▶"}</button>
      </div>
      <div class="dots" aria-hidden="true">${[...Array(n)].map((_,i)=>`<i class="${i===run.c?"on":""}"></i>`).join("")}</div>

    s.style.animationDelay = (Math.random()*0.8)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4500);
}

/* ============ PERISTIWA ============ */
app.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || b.disabled) return;
  switch(b.dataset.act){
    case "mute": muted=!muted; save("r3-muted",muted); b.textContent=muted?"🔇":"🔊"; b.setAttribute("aria-label",muted?"Hidupkan bunyi":"Matikan bunyi"); if(muted) hush(); break;
    case "lang": lang = isJ() ? "rumi" : "jawi"; save("kafa-lang",lang); applyLang(); renderMap(); break;
    case "teacher": teacher=!teacher; save("r3-teacher",teacher); renderMap(); break;
    case "map": renderMap(); window.scrollTo(0,0); break;
    case "station": openStation(b.dataset.i); break;
    case "station-back": openStation(run.station); break;
    case "read": startRead(); window.scrollTo(0,0); break;
    case "cprev": if(run.c>0){ run.c--; showCard(); } break;
    case "cnext": { const n=LESSONS[+run.station].cards.length; if(run.c+1<n){ run.c++; showCard(); } else startPlay(); window.scrollTo(0,0); break; }
    case "play": startPlay(); window.scrollTo(0,0); break;
    case "say": if(run && run.say) say(run.say); break;
    case "sayar": app.querySelectorAll(".vt.playing").forEach(x=>x.classList.remove("playing")); b.classList.add("playing"); speakAr(b.dataset.w); break;
    case "hear": speakAr(run.q.say); break;
    case "reveal": reveal(false); break;
    case "hop": ansHop(+b.dataset.k); break;
    case "tile": ansTile(+b.dataset.k); break;
    case "fly": ansFly(b); break;
    case "key": ansKey(b.dataset.n); break;
    case "bsk": ansBasket(+b.dataset.g); break;
    case "potion": ansPotion(+b.dataset.k); break;
    case "block": ansBlock(b); break;
    case "ord": ansOrder(b); break;
    case "mem": ansMem(b); break;
    case "next": nextQ(); break;
    case "again": startPlay(); window.scrollTo(0,0); break;
  }
});

applyLang();
renderMap();
</script>
</body>
</html>
