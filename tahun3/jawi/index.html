<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B5A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/access.js"></script>
<title>Kilang Coklat Jawi • Jawi Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6EC; --surface:#FFFFFF; --ink:#3B2116; --muted:#7F5A45; --line:#EED9C4;
  --brand:#8B4A23; --brand-ink:#FFFFFF; --brand-shadow:#5E2F14; --gold:#E8A317;
  --ok:#1F8A50; --ok-bg:#DDF3E5; --bad:#C8452F; --bad-bg:#FBE1DC; --note:#FFF1D6;
  --pattern:rgba(139,74,35,.07); --choc:#6B3A1F; --choc2:#4A2511;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C120D; --surface:#2A1B13; --ink:#FBEDE2; --muted:#D2B49F; --line:#4A3326;
    --brand:#E39A5E; --brand-ink:#2A1206; --brand-shadow:#A9632F; --gold:#F2C14E;
    --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#3A2C18;
    --pattern:rgba(227,154,94,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C120D; --surface:#2A1B13; --ink:#FBEDE2; --muted:#D2B49F; --line:#4A3326;
  --brand:#E39A5E; --brand-ink:#2A1206; --brand-shadow:#A9632F; --gold:#F2C14E;
  --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#3A2C18;
  --pattern:rgba(227,154,94,.07);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background-image:linear-gradient(45deg,var(--pattern) 25%,transparent 25%,transparent 75%,var(--pattern) 75%),linear-gradient(45deg,var(--pattern) 25%,transparent 25%,transparent 75%,var(--pattern) 75%);background-size:36px 36px;background-position:0 0,18px 18px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 44px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{max-width:100%}
/* ===== Stesen ===== */
.banner{border-radius:26px;padding:18px 18px 20px;background:var(--tc);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 55%,#000)}
.banner .kick{font-weight:700;opacity:.92;font-size:16px}
.banner h2{margin:0;font-size:clamp(25px,6.4vw,33px);line-height:1.12}
.banner .big{position:absolute;inset-inline-end:-4px;bottom:-12px;font-size:92px;opacity:.25}
.banner .stars{margin-top:6px;font-size:20px}
.banner .stars .off{opacity:.35;filter:grayscale(1)}
.banner .chip{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 12px;font-weight:700;font-size:15px}
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.units li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;line-height:1.25}
.units .u{background:var(--tc);color:#fff;border-radius:10px;font-size:13px;font-weight:800;padding:2px 8px;flex:none}
.actions{display:grid;gap:12px;margin-top:18px}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:0;border-radius:20px;padding:14px 16px;font-weight:800;font-size:21px;line-height:1.15}
.bigbtn small{display:block;font-weight:600;font-size:15px;opacity:.9}
.bigbtn .e{font-size:34px;flex:none}
.bigbtn.read{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.bigbtn.play{background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-shadow)}
.bigbtn:active{transform:translateY(3px)}

/* ===== Umum ===== */
.gamehead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.gamehead h2{margin:0;font-size:20px;flex:1;line-height:1.15;color:var(--brand)}
.gamehead h2 small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#E0A774,#8B4A23);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.page-in{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qtype{display:inline-block;background:var(--note);border-radius:999px;padding:1px 12px;font-size:14.5px;font-weight:700}
.tag{display:inline-block;background:var(--gold);color:#2A1B00;border-radius:999px;padding:1px 10px;font-size:13.5px;font-weight:800;margin-inline-start:4px}
.pill{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.qtext{font-size:clamp(20px,4.8vw,25px);font-weight:700;line-height:1.32;margin:4px 0 14px}
.hint{color:var(--muted);font-size:15.5px;margin:-6px 0 12px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.06)}}
.counter{display:inline-block;background:var(--note);border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}
.bigem{font-size:46px;text-align:center;letter-spacing:6px;line-height:1.2;margin:0 0 8px}
.bigem span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.jw{font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:600;line-height:1.9;unicode-bidi:isolate}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:400;line-height:1.9}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
a.iconbtn{text-decoration:none;color:inherit}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.pillstat{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-weight:800;font-size:17px}
.cbar{width:22px;height:20px;flex:none}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.langbtn .jw{line-height:1.2}
.hero{text-align:center;padding:8px 0 2px}
.hero .badge{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px}
.hero h1{margin:8px 0 0;font-size:clamp(30px,8.2vw,48px);line-height:1.04;font-weight:800;color:var(--brand)}
.hero p{margin:6px auto 0;color:var(--muted);max-width:480px}

/* ===== Lantai kilang (peta mendatar) ===== */
.floorwrap{position:relative;margin:16px -16px 0}
.street{overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.factory{position:relative;height:440px;background:linear-gradient(180deg,#F6E2C9 0%,#EFD2B0 62%,#E2BF98 66%)}
.factory .win{position:absolute;top:66px;width:70px;height:84px;border-radius:36px 36px 6px 6px;background:linear-gradient(180deg,#9ED8F2,#D9F1FB);box-shadow:inset 0 0 0 6px #C99A6E,0 3px 0 rgba(0,0,0,.08)}
.factory .win::after{content:"";position:absolute;left:32px;top:6px;bottom:6px;width:6px;background:#C99A6E}
.factory .pipe{position:absolute;left:0;right:0;top:26px;height:20px;background:linear-gradient(180deg,#A0613A,#7A4422 60%,#5E2F14);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.factory .pipe::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 150px,#4A2511 150px 160px)}
.factory .drip{position:absolute;top:44px;width:12px;height:22px;border-radius:0 0 8px 8px;background:#6B3A1F;transform-origin:50% 0;animation:drip 2.6s ease-in infinite}
@keyframes drip{0%{transform:scaleY(.3)}70%{transform:scaleY(1.2)}100%{transform:scaleY(.3)}}
.factory .belt{position:absolute;left:0;right:0;top:288px;height:30px;background:#3E3434;border-top:4px solid #1F1A1A;border-bottom:6px solid #8E8E96}
.factory .belt::after{content:"";position:absolute;left:0;right:0;top:8px;height:8px;background:repeating-linear-gradient(90deg,#5C5050 0 18px,#2E2626 18px 36px);animation:belt 1.2s linear infinite}
@keyframes belt{to{background-position:36px 0}}
.factory .floor{position:absolute;left:0;right:0;top:324px;bottom:0;background-color:#D9B48B;background-image:linear-gradient(45deg,#CDA47A 25%,transparent 25%,transparent 75%,#CDA47A 75%),linear-gradient(45deg,#CDA47A 25%,transparent 25%,transparent 75%,#CDA47A 75%);background-size:40px 40px;background-position:0 0,20px 20px}
.factory .bar{position:absolute;top:262px;font-size:30px;animation:ride linear infinite;pointer-events:none}
@keyframes ride{from{left:-50px}to{left:100%}}
.mach{position:absolute;top:44px;width:176px;transform:translateX(-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;z-index:1}
.mbody{position:relative;display:block;width:128px;height:150px;margin-top:40px;background:var(--tc);border-radius:16px 16px 8px 8px;box-shadow:inset -12px 0 0 rgba(0,0,0,.12),0 4px 0 rgba(0,0,0,.18)}
.mbody .hop{position:absolute;left:14px;right:14px;top:-40px;height:42px;background:color-mix(in srgb,var(--tc) 60%,#3B2116);clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)}
.mbody .hop::after{content:"";position:absolute;left:12%;right:12%;top:0;height:10px;border-radius:0 0 50% 50%;background:#6B3A1F}
.mbody .sign{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 0 rgba(0,0,0,.2),inset 0 0 0 3px #E8A317;z-index:1}
.mbody .pane{position:absolute;left:22px;right:22px;top:34px;height:62px;border-radius:12px;background:#FFF4E2;box-shadow:inset 0 0 0 4px rgba(0,0,0,.18);overflow:hidden}
.mbody .pane i{position:absolute;inset:-30px;background:conic-gradient(#6B3A1F 0 25%,#8B5A3A 0 50%,#6B3A1F 0 75%,#A0704E 0);border-radius:50%;animation:mix 4s linear infinite;opacity:.9}
@keyframes mix{to{transform:rotate(360deg)}}
.mbody .knobs{position:absolute;left:24px;right:24px;top:106px;display:flex;justify-content:space-between}
.mbody .knobs b{width:16px;height:16px;border-radius:50%;background:#FFD95A;box-shadow:0 0 0 3px rgba(0,0,0,.18)}
.mbody .knobs b:nth-child(2){background:#7CDB8A}
.mbody .chute{position:absolute;left:50%;bottom:-56px;transform:translateX(-50%);width:34px;height:56px;background:linear-gradient(90deg,#9A9AA4,#C9C9D2,#9A9AA4);clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}
.mbody .num{position:absolute;top:-8px;right:-14px;z-index:2;background:var(--gold);color:#2A1B00;border-radius:999px;font-size:14px;font-weight:800;min-width:28px;height:28px;display:grid;place-items:center;box-shadow:0 2px 0 #9A6A0A}
.mbody .done{position:absolute;bottom:4px;left:-18px;font-size:26px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.2)}30%{transform:scale(1)}}
.mach .plate{display:block;margin-top:96px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:3px 10px 4px;font-weight:800;font-size:14.5px;line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.15);max-width:176px}
.mach .plate small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.mach .plate .st{display:block;font-size:12px;letter-spacing:1px;margin-top:2px}
.mach .plate .st .off{opacity:.3;filter:grayscale(1)}
.mach.locked .mbody{filter:grayscale(.85) brightness(.9)}
.mach.locked .mbody .pane i{animation:none}
.mach.current .mbody .sign{animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 3px 0 rgba(0,0,0,.2),0 0 0 0 rgba(232,163,23,.7)}100%{box-shadow:0 3px 0 rgba(0,0,0,.2),0 0 0 18px rgba(232,163,23,0)}}
.mach:active .mbody{transform:translateY(3px)}
.walker{position:absolute;top:196px;width:66px;transform:translateX(-50%);pointer-events:none;animation:hopw .7s ease-in-out infinite;z-index:2}
@keyframes hopw{50%{margin-top:-6px}}
.scr{position:absolute;top:150px;z-index:3;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.scr.l{left:8px}.scr.r{right:8px}
.streetnote{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:15px;font-weight:700}
.trip{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.trip span{display:block;height:100%;background:linear-gradient(90deg,#E0A774,#8B4A23);border-radius:99px}
.teacher{display:flex;justify-content:center;margin-top:20px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700}
.toggle .sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--brand)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.foot{margin-top:16px;color:var(--muted);font-size:15px;text-align:center}
/* ===== Kad bacaan: tambahan Jawi ===== */
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.wchip{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:4px 8px 6px;text-align:center;animation:pagein .4s both;animation-delay:calc(var(--i) * 60ms);min-width:0}
.wchip .jw{display:block;font-size:clamp(24px,6vw,30px);color:var(--tc);line-height:1.6}
.wchip small{display:block;font-size:14px;font-weight:700;color:var(--muted);line-height:1.2}
.sents{display:grid;gap:8px;margin:0 0 12px}
.sents div{background:var(--bg);border-inline-start:6px solid var(--tc);border-radius:12px;padding:6px 12px;animation:pagein .4s both;animation-delay:calc(var(--i) * 90ms)}
.sents .jw{display:block;font-size:clamp(19px,4.8vw,23px);line-height:1.9;text-align:right}
.sents small{display:block;font-size:14.5px;color:var(--muted);font-weight:600;line-height:1.3}
mark{background:#FFE08A;color:#5E2F14;border-radius:6px;padding:0 3px}
.passage{background:#FFF6E6;color:#3B2116;border:3px solid #6B3A1F;border-radius:16px;padding:10px 14px;margin:0 0 12px;box-shadow:4px 4px 0 #6B3A1F}
.passage p{margin:0 0 8px;font-weight:600;font-size:17px;line-height:1.45}
.passage p.jw{font-size:19px;line-height:1.95;text-align:right}

/* ===== Permainan ===== */
.ticket{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 14px;max-width:340px;background:#FFF6E6;color:#3B2116;border:3px dashed #8B4A23;border-radius:14px;padding:6px 16px;font-weight:800;font-size:clamp(24px,6.4vw,32px);line-height:1.2}
.ticket small{font-size:14px;color:#7F5A45;font-weight:700}
.moulds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mould{position:relative;min-width:0;border:0;border-radius:12px;padding:12px 6px;color:#FFF3E0;background-color:var(--choc);background-image:linear-gradient(rgba(255,255,255,.08) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.08) 2px,transparent 2px);background-size:33.3% 50%;box-shadow:inset 0 -6px 0 var(--choc2),0 4px 0 rgba(0,0,0,.2);overflow-wrap:break-word}
.mould .jw{font-size:clamp(25px,6.6vw,32px);line-height:1.6}
.mould span:not(.jw){font-weight:800;font-size:19px}
.mould.ok{background-color:#E8A317;color:#3B2116;box-shadow:inset 0 -6px 0 #B47A0A,0 0 0 4px var(--ok);animation:pop .4s}
.mould.ok::after{content:"✨";position:absolute;top:-10px;inset-inline-end:-6px;font-size:24px}
.mould.bad{background-color:#8E6B5A;animation:crack .45s;opacity:.85}
@keyframes crack{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}}
.mould:disabled:not(.ok):not(.bad){opacity:.55}
.lane2{position:relative;height:92px;margin:0 0 12px;border-radius:14px;background:linear-gradient(180deg,transparent 64%,#3E3434 64%,#3E3434 84%,#8E8E96 84%)}
.lane2::after{content:"";position:absolute;left:0;right:0;top:66%;height:6px;background:repeating-linear-gradient(90deg,#5C5050 0 16px,#2E2626 16px 32px);animation:belt 1.2s linear infinite}
.box{position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:1;background:#FFF6E6;color:#3B2116;border:3px solid #8B4A23;border-radius:12px;padding:0 16px;text-align:center;min-width:120px;animation:boxin .45s ease-out;line-height:1.2}
.box .jw{display:block;font-size:30px;line-height:1.55}
.box small{display:block;font-size:13px;font-weight:700;color:#7F5A45;margin-top:-4px;padding-bottom:3px}
@keyframes boxin{from{left:-30%}}
.box.go0{transition:left .4s ease-in,opacity .4s;left:18%;opacity:0}
.box.go1{transition:left .4s ease-in,opacity .4s;left:82%;opacity:0}
.crates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.crate{min-width:0;border:0;border-radius:14px;padding:10px 8px;font-weight:800;font-size:17px;line-height:1.25;color:#fff;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 3px,transparent 3px 22px),var(--cc);box-shadow:0 5px 0 color-mix(in srgb,var(--cc) 60%,#000)}
.crate .e{display:block;font-size:30px}
.crate.react{animation:pop .4s}
.crate:disabled{opacity:.5}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bins div{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;justify-content:center}
.bins i{font-style:normal;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:17px;animation:pop .3s}
.bins i.x{border-color:var(--bad)}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:0 0 14px;padding:10px;background:#FFF6E6;border-radius:16px;border:2px solid #E8C79E}
.slot{min-width:58px;height:64px;border:3px dashed #C99A6E;border-radius:14px;display:grid;place-items:center;font-size:28px;color:#3B2116;background:#fff}
.slot.f{border:3px solid #8B4A23;background:#FFE7C2;animation:pop .3s}
.slot .jw{line-height:1.5}
.wrapdone{text-align:center;font-size:44px;line-height:1;margin:-6px 0 8px;animation:pop .5s}
.pieces{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.piece{border:0;border-radius:999px;padding:4px 18px;min-width:64px;color:#3B2116;background:radial-gradient(circle at 30% 30%,#fff 0 12%,transparent 13%),var(--pc);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.piece .jw{font-size:28px;line-height:1.5}
.piece.shake{background:var(--bad-bg)}
.sent{background:var(--note);border:2px solid var(--gold);border-radius:18px;padding:10px 14px;text-align:center;margin:0 0 8px;font-size:clamp(21px,5.4vw,26px)}
.sent .jw{line-height:2}
.gap{display:inline-block;min-width:80px;border-bottom:3px dashed var(--brand);margin:0 6px;color:var(--muted)}
.gap.w{border-bottom-color:var(--ok);color:var(--ok);animation:pop .5s}
.mk{color:var(--muted);font-style:italic;font-weight:600;font-size:16px;margin:0 0 12px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip2{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:2px 16px;box-shadow:0 3px 0 var(--line)}
.chip2 .jw{font-size:26px;line-height:1.7}
.chip2::before{content:"🍫";font-size:15px;margin-inline-end:6px}
.chip2.ok{border-color:var(--ok);background:var(--ok-bg)}
.chip2.bad{border-color:var(--bad);background:var(--bad-bg)}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:#6B3A1F;border-radius:20px;padding:12px;box-shadow:inset 0 0 0 4px #4A2511}
.bon{min-width:0;border:0;border-radius:50% 50% 44% 44%;aspect-ratio:1/1;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 35% 30%,#B07A55,#7A4422 70%);color:#FFF3E0;box-shadow:0 4px 0 #3B1D0C;padding:4px}
.bon .jw{font-size:clamp(20px,5.4vw,26px);line-height:1.4}
.bon small{font-size:12.5px;font-weight:700;opacity:.9;line-height:1.1}
.bon.ok{background:radial-gradient(circle at 35% 30%,#FFE08A,#E8A317 70%);color:#3B2116;box-shadow:0 0 0 4px var(--ok)}
.bon.bad{animation:crack .45s;filter:grayscale(.6)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.mem{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{min-width:0;height:84px;border:0;border-radius:14px;padding:4px;background:repeating-linear-gradient(45deg,#8B4A23 0 10px,#7A4020 10px 20px);color:#FFF3E0;font-size:28px;box-shadow:0 4px 0 #4A2511;overflow-wrap:break-word}
.mc.open,.mc.got{background:#FFF6E6;color:#3B2116;box-shadow:inset 0 0 0 3px #E8A317}
.mc.got{box-shadow:inset 0 0 0 3px var(--ok);background:var(--ok-bg);color:var(--ink)}
.mc .jw{font-size:24px;line-height:1.5}
.mc span:not(.jw){font-size:17px;font-weight:800}
.qc{display:flex;gap:14px;align-items:center;margin:0 0 14px}
.lamp{display:grid;gap:6px;background:#4A4A55;border-radius:16px;padding:8px;flex:none}
.lamp i{width:30px;height:30px;border-radius:50%;background:#6A6A75;transition:background .3s,box-shadow .3s}
.lamp.y .y{background:#FFC93C;box-shadow:0 0 16px #FFC93C;animation:blink .8s infinite}
.lamp.g .g{background:#3CD070;box-shadow:0 0 16px #3CD070}
.lamp.r .r{background:#FF4D4D;box-shadow:0 0 16px #FF4D4D}
@keyframes blink{50%{opacity:.4}}
.qc .stmt{flex:1;background:var(--note);border-radius:18px;padding:12px 14px;font-weight:800;font-size:clamp(18px,4.6vw,22px);line-height:1.4}
.stamp{display:inline-block;margin:0 0 12px;border:4px solid var(--ok);color:var(--ok);border-radius:10px;padding:0 12px;font-weight:800;font-size:22px;transform:rotate(-8deg);animation:pop .4s}
.stamp.no{border-color:var(--bad);color:var(--bad)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow button{border:0;border-radius:18px;padding:12px 8px;font-size:21px;font-weight:800;color:#fff;line-height:1.15}
.tfrow button span{display:block;font-size:26px}
.tfrow .yes{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.tfrow .no{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.tfrow button:disabled{opacity:.4}
.tfrow button.picked{opacity:1;outline:3px solid var(--gold);outline-offset:3px}
/* ===== Kad bacaan ===== */
.unitlbl{display:inline-block;background:var(--tc);color:#fff;border-radius:999px;padding:1px 12px;font-weight:800;font-size:14.5px;margin-bottom:6px}
.readtext{font-size:clamp(19px,4.4vw,22px);font-weight:600;line-height:1.5;margin:0 0 12px}
.arbox{background:var(--note);border:2px solid var(--gold);border-radius:16px;padding:8px 14px;margin:0 0 10px;text-align:center}
.arbox .ar{font-size:clamp(21px,5.2vw,27px);display:block}
.arbox small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.maksud{font-size:16.5px;color:var(--muted);font-weight:600;margin:-2px 0 12px;font-style:italic}
.rlist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;counter-reset:r}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:5px 10px;font-weight:700;line-height:1.3;animation:pagein .4s both;animation-delay:calc(var(--i) * 70ms)}
.rlist li::before{counter-increment:r;content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.rlist.bad li::before{content:"✗";background:#8A8FA3}
.tip{background:var(--note);border-radius:16px;padding:8px 12px;margin:0 0 12px;font-weight:600;font-size:17px}
.tip b{display:block;font-size:15px;color:var(--muted)}
.ref{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--muted)}
.navrow{display:grid;grid-template-columns:52px auto 1fr;gap:8px;align-items:center}
.navrow .secondary,.navrow .primary{margin:0;padding:11px 6px;font-size:18px}
.navrow .secondary:disabled{opacity:.35}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:99px}
.comic{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.comic div{position:relative;background:#FFF6E6;color:#3B2116;border:3px solid #3B2116;border-radius:10px;padding:8px 10px 10px;box-shadow:4px 4px 0 #3B2116;font-weight:700;font-size:15.5px;line-height:1.3;animation:pagein .5s both;animation-delay:calc(var(--i) * .5s)}
.comic div b{display:block;font-size:34px;line-height:1.15;text-align:center}
.comic div small{position:absolute;top:4px;inset-inline-start:8px;font-weight:800;font-size:12px;color:#7F5A45}
.pantun{background:var(--note);border-radius:16px;padding:10px 16px;margin:0 0 12px;font-weight:700;font-size:18px;line-height:1.55;font-style:italic;border-inline-start:6px solid var(--tc)}
.pantun span{display:block;animation:pagein .4s both;animation-delay:calc(var(--i) * .35s)}
.groups{display:grid;gap:8px;margin:0 0 12px}
.groups div{border-radius:14px;padding:8px 12px;background:var(--bg);border:2px solid var(--line);animation:pagein .4s both;animation-delay:calc(var(--i) * .2s)}
.groups h3{margin:0 0 2px;font-size:17px;color:var(--tc)}
.groups ul{margin:0;padding-inline-start:20px;font-weight:600;font-size:16px;line-height:1.35}

/* Maklum balas & keputusan */
.feedback{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;background:var(--note);font-size:17px;line-height:1.4}
.feedback .mascot{width:76px}
.feedback strong{display:block;font-size:21px}
.streak{display:inline-block;background:var(--gold);color:#3A2600;border-radius:999px;padding:0 10px;font-weight:800;font-size:15px;margin:2px 0 4px}
.primary{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:13px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-shadow)}
.secondary{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:transparent;border-radius:16px;padding:11px;font-size:18px;font-weight:700}
.result{text-align:center}
.result .mascot{width:120px;margin:0 auto}
.result .stars{font-size:54px;letter-spacing:6px;line-height:1.1;margin:4px 0}
.result .stars .off{filter:grayscale(1);opacity:.25}
.result h2{margin:4px 0 2px;font-size:32px;color:var(--brand)}
.result p{margin:0 0 6px;color:var(--muted)}
.unlock{display:inline-block;margin:8px 0 0;background:var(--note);border:2px solid var(--gold);border-radius:999px;padding:3px 14px;font-weight:800}
.earned{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:20px;margin:4px 0}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;top:-50px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
.sparkle{position:fixed;pointer-events:none;font-size:26px;z-index:40;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translateY(-44px) scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
.mascot{display:block;height:auto;flex:none}
.mascot.happy{animation:hop .45s ease 2}
.mascot.sad{animation:tilt .9s ease}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes tilt{30%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rain,.factory .bar{display:none}
}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Baloo 2",serif;font-size:20px;line-height:1.8}
html[dir="rtl"] .qtext,html[dir="rtl"] .readtext{line-height:1.85}
html[dir="rtl"] .hero h1{font-weight:700;line-height:1.35}
html[dir="rtl"] .banner h2{line-height:1.5}
html[dir="rtl"] .mach .plate{font-size:15px;line-height:1.5}
html[dir="rtl"] .crate,html[dir="rtl"] .qc .stmt,html[dir="rtl"] .rlist li{line-height:1.6}

let actx;
function tone(freqs, dur=0.12, type="sine"){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sfx = { ok:()=>tone([660,880]), bad:()=>tone([240,180],0.15,"triangle"), tap:()=>tone([520],0.06,"triangle"), clunk:()=>tone([300,220],0.07,"square"), flip:()=>tone([700],0.05), ding:()=>tone([988,1319],0.09), win:()=>tone([523,659,784,1047],0.14) };
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text){
  if(!ttsOK || !text) return;
  try{
    speechSynthesis.cancel();
    // Tulisan Jawi/Arab dibuang: mesin hanya membaca teks Rumi.
    const u = new SpeechSynthesisUtterance(String(text).replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/\bSWT\b/g,"subhanahu wa taala").replace(/[“”…"]/g,"").replace(/[؀-ۿ٠-٩ـ]+/g,"").replace(/\p{Extended_Pictographic}/gu,""));
    u.lang = voice ? voice.lang : "ms-MY";
    if(voice) u.voice = voice;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

/* ============ TONTON DAN BACA ============ */
function startRead(){ run.c = 0; showCard(); }
const hl = (s, w) => w ? s.replace(w, `<mark>${w}</mark>`) : s;
function showCard(){
  stopAnims();
  const t = LESSONS[+run.station], c = t.cards[run.c], n = t.cards.length;
  run.say = [R(c.u), R(c.t), ...(c.words||[]).map(w=>w[0]), ...(c.sents||[]).map(s=>s[0]), ...(c.passage||[]).map(R), R(c.tip)].filter(Boolean).join(". ");
  let body = "";
  if(c.em) body += bigEm(c.em);
  body += `<span class="unitlbl">${L(c.u)}</span>`;
  if(c.t) body += `<p class="readtext">${L(c.t)}</p>`;
  if(c.words) body += `<div class="wgrid">${c.words.map((w,i)=>`<div class="wchip" style="--i:${i}">${JW(w[1])}<small>${w[0]}</small></div>`).join("")}</div>`;
  if(c.sents) body += `<div class="sents">${c.sents.map((s,i)=>`<div style="--i:${i}">${JW(hl(s[1],s[2]))}${isJ()?"":`<small>${s[0]}</small>`}</div>`).join("")}</div>`;
  if(c.passage) body += `<div class="passage">${c.passage.map(p=>isJ()?`<p class="jw" dir="rtl">${p[1]}</p>`:`<p>${p[0]}</p>`).join("")}</div>`;
  if(c.tip) body += `<div class="tip"><b>💡 ${tx("Ingat!","ايڠت!")}</b>${L(c.tip)}</div>`;
  body += `<p class="ref" style="margin:-4px 0 12px">📖 ${tx("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</p>`;
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="${tx("Kembali","کمبالي")}">${BACK()}</button><h2>${tx("Tonton dan Baca","تونتون دان باچ")}<small>${L(t.title)}</small></h2><span class="pill">${run.c+1}/${n}</span></div>
    <div class="progress"><span style="width:${Math.round((run.c+1)/n*100)}%"></span></div>
    <div class="card page-in" style="--tc:${t.color}">
      ${body}
      <div class="navrow">
        <button class="secondary" data-act="cprev" aria-label="${tx("Kad sebelum","کد سبلوم")}" ${run.c===0?"disabled":""}>${isJ()?"▶":"◀"}</button>
        ${ttsOK&&run.say?`<button class="pill" data-act="say" style="padding:9px 12px">🔊 ${tx("Dengar","دڠر")}</button>`:"<span></span>"}
        <button class="primary" data-act="cnext">${run.c+1<n?tx("Seterusnya","ستروسڽ"):tx("Mula Cabaran","مولا چابرن")} ${isJ()?"◀":"▶"}</button>
      </div>
      <div class="dots" aria-hidden="true">${[...Array(n)].map((_,i)=>`<i class="${i===run.c?"on":""}"></i>`).join("")}</div>
    </div>`;
}

/* ============ CABARAN ============ */
function startPlay(){
  const src = run.station==="final" ? FINAL.qs : LESSONS[+run.station].qs;
  run = Object.assign(run, {qs:shuffle(src), i:0, score:0, gain:0, streak:0});
  showQ();
}
function qTitle(){
  if(run.station==="final") return `${L(FINAL.title)}<small>${L(FINAL.sub)}</small>`;
  const t = LESSONS[+run.station];
  return `${tx("Pelajaran","ڤلاجرن")} ${t.id}<small>${L(t.title)}</small>`;
}
const QDEF = {
  mould:["Pilih acuan dengan ejaan Jawi yang betul.","ڤيليه اچوان دڠن ايجاٴن جاوي يڠ بتول."],
  belt:["Hantar setiap kotak ke peti yang betul.","هنتر ستياڤ کوتق ک ڤتي يڠ بتول."],
  wrap:["Tekan kepingan mengikut urutan untuk mengeja perkataan ini.","تکن کڤيڠن مڠيکوت اوروتن اونتوق مڠيجا ڤرکاتاٴن اين."],
  fill:["Pilih perkataan Jawi untuk melengkapkan ayat.","ڤيليه ڤرکاتاٴن جاوي اونتوق ملڠکڤکن ايات."],
  memory:["Buka dua kotak: padankan Rumi dengan Jawi.","بوک دوا کوتق: ڤادنکن رومي دڠن جاوي."]
};
const ticket = w => `<div class="ticket"><small>${tx("Pesanan:","ڤسنن:")}</small><span>${w}</span></div>`;
const PCOL = ["#FFC9DE","#C9E8FF","#D4F5C4","#FFE3A8","#E3D1FF","#FFD3BA"];
function showQ(){
  stopAnims();
  const q = run.qs[run.i];
  run.q = q; run.done = false; run.mist = 0; run.busy = false;
  const qq = q.q || QDEF[q.type];
  run.say = R(qq) + (q.w ? ". " + q.w : "");
  let body = "", showQt = true;
  switch(q.type){
    case "mould":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      body = `${ticket(q.w)}<div class="moulds">${run.opts.map((o,k)=>`<button class="mould" data-act="mould" data-k="${k}">${T(o.t)}</button>`).join("")}</div>`;
      break;
    case "belt":
      run.queue = shuffle(q.items); run.si = 0;
      body = `<div class="lane2" aria-hidden="false"><div class="box" id="box"></div></div>
        <div class="crates">${q.l.map((lb,g)=>`<button class="crate" data-act="crate" data-g="${g}" style="--cc:${g?"#2E86AB":"#B5562B"}"><span class="e" aria-hidden="true">${g?"📦":"🧺"}</span>${L(lb)}</button>`).join("")}</div>
        <div class="bins"><div id="bin0"></div><div id="bin1"></div></div>`;
      break;
    case "wrap": {
      run.next = 0;
      const all = [...q.pc.map((t,i)=>({t,i})), ...(q.x||[]).map(t=>({t,i:-1}))];
      run.pieces = shuffleNot(all, a=>a.slice(0,q.pc.length).every((o,k)=>o.i===k));
      body = `${ticket(q.w)}<div class="slots" dir="rtl" id="slots">${q.pc.map((_,i)=>`<span class="slot" id="s${i}">?</span>`).join("")}</div><div id="wdone"></div>
        <div class="pieces">${run.pieces.map((o,k)=>`<button class="piece" data-act="piece" data-k="${k}" style="--pc:${PCOL[k%PCOL.length]}">${JW(o.t)}</button>`).join("")}</div>`;
      break; }
    case "fill":
      run.opts = shuffle(q.a.map((t,i)=>({t,ok:i===0})));
      body = `<div class="sent" dir="rtl">${q.pre?JW(q.pre):""}<span class="gap" id="gap">؟</span>${q.post?JW(q.post):""}</div>
        ${isJ()?"":`<p class="mk">${L(q.r)}</p>`}
        <div class="chips">${run.opts.map((o,k)=>`<button class="chip2" data-act="chip" data-k="${k}">${T(o.t)}</button>`).join("")}</div>`;
      break;
    case "odd":
      run.opts = shuffle(q.items.map((it,i)=>({it,ok:i===0})));
      body = `<div class="tray">${run.opts.map((o,k)=>`<button class="bon" data-act="bon" data-k="${k}">${JW(o.it[1])}<small>${o.it[0]}</small></button>`).join("")}</div>`;
      break;
    case "memory":
      run.cards = shuffle(q.pairs.flatMap((p,i)=>[{pid:i,s:0,t:p[0]},{pid:i,s:1,t:p[1]}]));
      run.open = []; run.got = 0;
      body = `<div class="mem">${run.cards.map((c,k)=>`<button class="mc" data-act="mc" data-k="${k}" aria-label="${tx("Kotak","کوتق")} ${k+1}">🍫</button>`).join("")}</div>`;
      break;
    case "tf":
      showQt = false;
      body = `<div class="qc"><div class="lamp y" id="lamp" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div><div class="stmt">${L(q.q)}</div></div>
        <div id="stamp"></div>
        <div class="tfrow"><button class="yes" data-act="tf" data-v="1"><span aria-hidden="true">✅</span>${tx("Betul","بتول")}</button><button class="no" data-act="tf" data-v="0"><span aria-hidden="true">❌</span>${tx("Salah","ساله")}</button></div>`;
      break;
  }
  const tag = q.tag ? `<span class="tag">${P(q.tag)}</span>` : "";
  app.innerHTML = `
    <div class="gamehead"><button class="iconbtn" data-act="station-back" aria-label="${tx("Kembali","کمبالي")}">${BACK()}</button><h2>${qTitle()}</h2><span class="pillstat">${CBAR} ${run.gain}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${run.qs.length}" aria-valuenow="${run.i}"><span style="width:${Math.round(run.i/run.qs.length*100)}%"></span></div>
    <div class="card page-in">
      <div class="qmeta"><span><span class="qtype">${(isJ()?TYPE_J:TYPE_R)[q.type]}</span>${tag}</span><span style="display:flex;gap:6px;align-items:center"><span style="color:var(--muted);font-size:15px">${run.i+1}/${run.qs.length}</span>${ttsOK?`<button class="pill" data-act="say" aria-label="${tx("Dengar soalan","دڠر سوالن")}">🔊</button>`:""}</span></div>
      ${showQt?`<p class="qtext">${L(qq)}</p>`:""}
      ${body}
      <div id="fb" aria-live="polite"></div>
    </div>`;
  if(q.type==="belt") showBox();
}

function finishQ(ok, extra=""){
  run.done = true;
  if(ok){ run.score++; run.gain++; run.streak++; } else run.streak = 0;
  const q = run.q, last = run.i+1 >= run.qs.length;
  const title = ok ? (run.mist ? tx("Bagus, hampir sempurna!","باڬوس، همڤير سمڤورنا!") : pick(isJ()?PRAISE_J:PRAISE_R)) : tx("Tidak mengapa, mari belajar!","تيدق مڠاڤ، ماري بلاجر!");
  $("fb").innerHTML = `<div class="feedback">${mascot(ok?"happy":"sad")}<div><strong>${title}</strong>${ok?`<span class="streak">+1 ${tx("coklat","چوکلت")} 🍫</span> `:""}${ok&&run.streak>=3?`<span class="streak">🔥 ${run.streak} ${tx("berturut-turut!","برتوروت٢!")}</span>`:""}<br>${extra}${L(q.e)}<div class="ref">📖 ${tx("Rujuk buku teks ms.","روجوق بوکو تيکس م.س.")} ${q.p}</div></div></div>
    <button class="primary" data-act="next">${last?tx("Lihat keputusan","ليهت کڤوتوسن"):tx("Soalan seterusnya","سوالن ستروسڽ")}</button>`;
  ok ? sfx.ok() : sfx.bad();
  const b = $("fb").querySelector(".primary"); b.focus({preventScroll:true}); b.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
}

/* Acuan coklat */
function ansMould(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".mould")];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  sfx.clunk();
  btns[right].classList.add("ok"); if(!ok) btns[k].classList.add("bad");
  hush(); finishQ(ok, ok?"":`${tx("Jawapan:","جواڤن:")} ${JW(run.opts[right].t)}. `);
}
/* Tali sawat */
function showBox(){
  const it = run.queue[run.si], b = $("box"); if(!b) return;
  b.className = "box"; void b.offsetWidth;
  b.innerHTML = `${JW(it[1])}<small>${it[0]} • ${run.queue.length-run.si} ${tx("lagi","لاڬي")}</small>`;
}
function ansCrate(b){
  if(run.done || run.busy) return;
  const g = +b.dataset.g, it = run.queue[run.si], ok = g===it[2];
  run.busy = true;
  const target = app.querySelector(`.crate[data-g="${it[2]}"]`);
  target.classList.remove("react"); void target.offsetWidth; target.classList.add("react");
  if(ok) sfx.tap(); else { run.mist++; sfx.bad(); }
  $("box").classList.add("go"+it[2]);
  $("bin"+it[2]).insertAdjacentHTML("beforeend", `<i class="${ok?"":"x"}">${ok?"✓ ":"❗"}${JW(it[1])}</i>`);
  const tok = animTok;
  setTimeout(()=>{
    if(tok!==animTok) return;
    run.busy = false; run.si++;
    if(run.si>=run.queue.length){
      $("box").className = "box"; $("box").innerHTML = `<span style="font-size:30px">✔️</span>`;
      app.querySelectorAll(".crate").forEach(x=>x.disabled=true);
      finishQ(run.mist<=1, run.mist?tx("Kotak bertanda ❗ sudah dipindahkan ke peti yang betul. ","کوتق برتندا ❗ سوده دڤينداهکن ک ڤتي يڠ بتول. "):"");
    } else showBox();
  }, ok?380:650);
}
/* Balut huruf */
function ansPiece(b){
  if(run.done) return;
  const o = run.pieces[+b.dataset.k], want = run.q.pc[run.next];
  if(o.t===want){
    sfx.tap();
    const s = $("s"+run.next); s.className = "slot f"; s.innerHTML = JW(o.t);
    b.remove(); run.next++;
    if(run.next===run.q.pc.length){
      app.querySelectorAll(".piece").forEach(x=>x.disabled=true);
      $("wdone").innerHTML = `<div class="wrapdone">🍬 ${JW(run.q.pc.join(""))}</div>`;
      finishQ(run.mist<=1);
    }
  } else { run.mist++; sfx.bad(); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); }
}
/* Isi ayat */
function ansChip(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".chip2")];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  btns[right].classList.add("ok"); if(!ok) btns[k].classList.add("bad","shake");
  const g = $("gap"); g.innerHTML = JW(run.opts[right].t); g.classList.add("w");
  hush(); finishQ(ok);
}
/* Coklat lain */
function ansBon(k){
  if(run.done) return;
  const btns = [...app.querySelectorAll(".bon")];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;
  btns[right].classList.add("ok"); if(!ok) btns[k].classList.add("bad");
  if(ok) sparkle(btns[right],"✨");
  hush(); finishQ(ok);
}
/* Kotak memori */
const cardFace = c => c.s ? JW(c.t) : `<span>${c.t}</span>`;
function ansMem(b){
  if(run.done || run.busy || b.classList.contains("open") || b.classList.contains("got")) return;
  const k = +b.dataset.k, c = run.cards[k];
  sfx.flip(); b.classList.add("open"); b.innerHTML = cardFace(c);
  run.open.push(k);
  if(run.open.length<2) return;
  const [a, d] = run.open, ca = run.cards[a], cd = run.cards[d];
  const ea = app.querySelector(`.mc[data-k="${a}"]`), ed = app.querySelector(`.mc[data-k="${d}"]`);
  run.open = [];
  if(ca.pid===cd.pid && ca.s!==cd.s){
    sfx.ding(); [ea,ed].forEach(e=>{ e.classList.remove("open"); e.classList.add("got"); e.disabled = true; });
    run.got++;
    if(run.got===run.q.pairs.length) finishQ(run.mist<=2);
  } else {
    run.mist++; run.busy = true;
    const tok = animTok;
    setTimeout(()=>{ if(tok!==animTok) return; [ea,ed].forEach(e=>{ e.classList.remove("open"); e.innerHTML = "🍫"; }); run.busy = false; }, 750);
  }
}
/* Lampu QC */
function ansTF(btn){
  if(run.done) return;
  app.querySelectorAll(".tfrow button").forEach(b=>b.disabled=true);
  btn.classList.add("picked");
  const ok = (btn.dataset.v==="1")===run.q.ans;
  $("lamp").className = "lamp " + (ok?"g":"r");
  $("stamp").innerHTML = `<span class="stamp ${ok?"":"no"}">${ok?tx("LULUS","لولوس"):tx("CUBA LAGI","چوبا لاڬي")}</span>`;
  hush(); finishQ(ok, `${tx("Jawapan:","جواڤن:")} <b>${run.q.ans?tx("Betul","بتول"):tx("Salah","ساله")}</b>. `);
}

function nextQ(){
  run.i++;
  if(run.i < run.qs.length){ showQ(); window.scrollTo(0,0); }
  else finishRound(true);
}
function finishRound(fresh){
  stopAnims();
  const isFinal = run.station==="final";
  const key = isFinal ? "final" : LESSONS[+run.station].id;
  let stars, prev, msgs = [];
  if(fresh){
    const n = run.qs.length, s = run.score, pct = s/n;
    stars = pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0;
    const wasFinalOpen = finalUnlocked();
    const nextIdx = isFinal ? -1 : +run.station+1;
    const wasNextOpen = nextIdx>0 && nextIdx<LESSONS.length ? unlocked(nextIdx) : true;
    prev = best[key];
    if(stars>prev){ best[key]=stars; save("jw3-best",best); }
    coklat += run.gain; save("jw3-coklat",coklat);
    if(nextIdx>0 && nextIdx<LESSONS.length && !wasNextOpen && unlocked(nextIdx)) msgs.push(["🏭 Mesin baharu hidup: "+R(LESSONS[nextIdx].place)+"!","🏭 مسين بهارو هيدوڤ: "+LESSONS[nextIdx].place[1]+"!"]);
    if(!isFinal && !wasFinalOpen && finalUnlocked()) msgs.push(["🏪 Pesta Coklat Jawi kini dibuka!","🏪 ڤستا چوکلت جاوي کيني دبوک!"]);
    run.res = {stars, prev, msgs, s, n};
  }
  ({stars, prev, msgs} = run.res);
  const {s, n} = run.res;
  const titles = isJ() ? ["جوم چوبا سکالي لاڬي","بوليه چوبا لاڬي","باڬوس!","چمرلڠ!"] : ["Jom cuba sekali lagi","Boleh cuba lagi","Bagus!","Cemerlang!"];
  const label = isFinal ? L(FINAL.title) : `${tx("Pelajaran","ڤلاجرن")} ${key}: ${L(LESSONS[+run.station].title)}`;
  app.innerHTML = `
    <div class="card result page-in" style="margin-top:18px">
      ${mascot(stars>=2?"happy":"idle")}
      <p style="margin:4px 0 0">${label}</p>
      <div class="stars" role="img" aria-label="${stars} / 3">${starsHTML(stars)}</div>
      <h2>${titles[stars]}</h2>
      <p>${tx(`Kamu menjawab ${s} daripada ${n} soalan dengan betul.`,`کامو منجواب ${s} درڤد ${n} سوالن دڠن بتول.`)}</p>
      <div class="earned">+${run.gain} ${CBAR} ${tx("coklat","چوکلت")}</div>
      ${stars>prev?`<p>${tx("Rekod baharu!","ريکود بهارو!")}</p>`:""}
      ${stars===0?`<p>${tx("Dapatkan sekurang-kurangnya 1 bintang (separuh betul) untuk menghidupkan mesin seterusnya. Cuba “Tonton dan Baca” dahulu.","داڤتکن سکورڠ٢ڽ 1 بينتڠ (سڤاروه بتول) اونتوق مڠهيدوڤکن مسين ستروسڽ. چوبا “تونتون دان باچ” دهولو.")}</p>`:""}
      ${msgs.map(m=>`<div class="unlock">${L(m)}</div>`).join("<br>")}
      ${isFinal&&stars===3?`<div class="unlock">🏆 ${tx("Tahniah! Kamu juara Jawi Tahun 3!","تهنية! کامو جوارا جاوي تاهون 3!")}</div>`:""}
      <button class="primary" data-act="map">${tx("Kembali ke kilang","کمبالي ک کيلڠ")} 🏭</button>
      <button class="secondary" data-act="again">${tx("Main lagi","ماٴين لاڬي")}</button>
    </div>`;
  if(fresh){ sfx.win(); if(stars===3) rain(); }
  window.scrollTo(0,0);
}
function rain(){
  if(REDUCED) return;
  const box = document.createElement("div"); box.className = "rain";
  for(let i=0;i<28;i++){
    const s = document.createElement("span");
    s.textContent = pick(["🍫","🍬","⭐","✨","🍭"]);
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (2+Math.random()*2)+"s";
    s.style.animationDelay = (Math.random()*0.8)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4500);
}

/* ============ PERISTIWA ============ */
function redraw(){
  if(!run) return renderMap();
  if(run.res && run.i>=run.qs.length) return finishRound(false);
  if(run.qs) return showQ();
  if(run.c!=null) return showCard();
  openStation(run.station);
}
app.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || b.disabled) return;
  switch(b.dataset.act){
    case "mute": muted=!muted; save("jw3-muted",muted); b.textContent=muted?"🔇":"🔊"; b.setAttribute("aria-label",muted?"Hidupkan bunyi":"Matikan bunyi"); if(muted) hush(); break;
    case "lang": lang = isJ() ? "rumi" : "jawi"; save("kafa-lang",lang); applyLang(); redraw(); break;
    case "teacher": teacher=!teacher; save("jw3-teacher",teacher); renderMap(); break;
    case "scrl": $("street").scrollBy({left:+b.dataset.d*GAP*1.5}); break;
    case "map": renderMap(); window.scrollTo(0,0); break;
    case "station": openStation(b.dataset.i); break;
    case "station-back": openStation(run.station); break;
    case "read": startRead(); window.scrollTo(0,0); break;
    case "cprev": if(run.c>0){ run.c--; showCard(); } break;
    case "cnext": { const n=LESSONS[+run.station].cards.length; if(run.c+1<n){ run.c++; showCard(); } else { run.c = null; startPlay(); } window.scrollTo(0,0); break; }
    case "play": run.c = null; startPlay(); window.scrollTo(0,0); break;
    case "say": if(run && run.say) speak(run.say); break;
    case "mould": ansMould(+b.dataset.k); break;
    case "crate": ansCrate(b); break;
    case "piece": ansPiece(b); break;
    case "chip": ansChip(+b.dataset.k); break;
    case "bon": ansBon(+b.dataset.k); break;
    case "mc": ansMem(b); break;
    case "tf": ansTF(b); break;
    case "next": nextQ(); break;
    case "again": run.res = null; startPlay(); window.scrollTo(0,0); break;
  }
});

/* Untuk alat tangkap layar: playGame(i, j) buka pelajaran i (0–5, atau "final") pada soalan jenis ke-j */
function playGame(i, j){
  openStation(String(i));
  if(!run) return;
  startPlay();
  const src = i==="final" ? FINAL.qs : LESSONS[+i].qs;
  run.qs = src.slice(); run.i = Math.min(+j||0, src.length-1); showQ();
}
Object.assign(window, {LESSONS, FINAL, openStation, startRead, showCard, startPlay, showQ, renderMap, playGame, getRun:()=>run});

applyLang();
renderMap();
</script>
