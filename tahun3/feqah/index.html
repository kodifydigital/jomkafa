<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B5A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<title>Jom Bina Masjid • Feqah Tahun 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --ink:#1E2340; --muted:#5D6485; --line:#D9DDEE;
  --brand:#3E4FB0; --brand-ink:#FFFFFF; --brand-shadow:#2A3780; --gold:#E8A317;
  --ok:#23824A; --ok-bg:#DDF3E5; --bad:#C8452F; --bad-bg:#FBE1DC; --note:#FFF4D6;
  --pattern:rgba(62,79,176,.09);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11142A; --surface:#1C2040; --ink:#EEF0FA; --muted:#AEB4D6; --line:#30365E;
    --brand:#7C8CFF; --brand-ink:#0B0E24; --brand-shadow:#4B58B8; --gold:#F2C14E;
    --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#3A3218;
    --pattern:rgba(124,140,255,.08);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11142A; --surface:#1C2040; --ink:#EEF0FA; --muted:#AEB4D6; --line:#30365E;
  --brand:#7C8CFF; --brand-ink:#0B0E24; --brand-shadow:#4B58B8; --gold:#F2C14E;
  --ok:#2E9E5B; --ok-bg:#173F2B; --bad:#E0634E; --bad-bg:#4A2420; --note:#3A3218;
  --pattern:rgba(124,140,255,.08);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.45;
  background-image:radial-gradient(var(--pattern) 2px,transparent 2.5px);background-size:24px 24px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 44px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
svg{max-width:100%}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;font-weight:400;line-height:1.9}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
a.iconbtn{text-decoration:none;color:inherit}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:999px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;padding:0}
.pillstat{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;font-weight:800;font-size:17px}
.pelita{width:20px;height:20px;flex:none}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.langbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px;min-height:44px}
.langbtn .ar{font-family:"Noto Naskh Arabic","Amiri",serif}

.hero{text-align:center;padding:8px 0 2px}
.hero .sub{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:2px 14px;font-weight:700;font-size:15px}
.hero h1{margin:8px 0 0;font-size:clamp(34px,9vw,52px);line-height:1.02;font-weight:800;color:var(--brand)}
.hero p{margin:6px auto 0;color:var(--muted);max-width:460px}

/* ===== Masjid (peta kemajuan) ===== */
.mosque{margin:16px auto 0;max-width:560px;border-radius:28px;overflow:hidden;border:2px solid var(--line);box-shadow:0 6px 0 var(--line);position:relative}
.mosque svg{display:block;width:100%;height:auto}
.mosque .ghost *{fill:none!important;stroke:rgba(255,255,255,.6);stroke-width:1.4;stroke-dasharray:4 4}
.mosque .newpart{animation:build 1s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes build{0%{opacity:0;transform:translateY(-46px) scale(.6)}70%{opacity:1}100%{opacity:1;transform:none}}
.mosque .lit{animation:lit 2.4s ease-in-out infinite}
@keyframes lit{50%{opacity:.6}}
.mosque .wv{animation:wv 2.2s ease-out infinite;transform-box:fill-box;transform-origin:0 50%;opacity:0}
@keyframes wv{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}
.mosque .mbadge{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:2px 14px;font-weight:800;font-size:15px;white-space:nowrap}
.lessons{display:grid;gap:10px;margin-top:18px}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 var(--line);position:relative}
.lesson:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lesson .ic{width:58px;height:58px;border-radius:18px;background:var(--tc);display:grid;place-items:center;font-size:30px;flex:none;box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 62%,#000)}
.lesson .tt{flex:1;min-width:0;line-height:1.2}
.lesson .tt small{display:block;color:var(--muted);font-weight:700;font-size:14px}
.lesson .tt b{display:block;font-size:19px}
.lesson .part{display:inline-block;margin-top:3px;font-size:13.5px;font-weight:700;background:var(--note);border-radius:999px;padding:0 9px}
.lesson .st{font-size:15px;letter-spacing:1px;flex:none}
.lesson .st .off{opacity:.25;filter:grayscale(1)}
.lesson.locked{opacity:.62}
.lesson.locked .ic{background:#9C9AAE;box-shadow:0 4px 0 #6E6C80;font-size:24px}
.lesson.current{border-color:var(--gold);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 var(--line),0 0 0 5px color-mix(in srgb,var(--gold) 45%,transparent)}}
.lesson.final{--tc:#E8A317}
.teacher{display:flex;justify-content:center;margin-top:20px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:16px;font-weight:700}
.toggle .sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .sw{background:var(--brand)}
.toggle[aria-pressed="true"] .sw::after{left:21px}
.foot{margin-top:16px;color:var(--muted);font-size:15px;text-align:center}

/* ===== Stesen ===== */
.banner{border-radius:26px;padding:18px 18px 20px;background:var(--tc);color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 62%,#000)}
.banner.final{color:#2A1B00}
.banner .kick{font-weight:700;opacity:.92;font-size:16px}
.banner h2{margin:0;font-size:clamp(26px,6.6vw,34px);line-height:1.1}
.banner .big{position:absolute;inset-inline-end:-6px;bottom:-14px;font-size:96px;opacity:.25}
.banner .stars{margin-top:6px;font-size:20px}
.banner .stars .off{opacity:.35;filter:grayscale(1)}
.banner .partchip{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 12px;font-weight:700;font-size:15px}
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.units li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;line-height:1.25}
.units .u{background:var(--tc);color:#fff;border-radius:10px;font-size:13px;font-weight:800;padding:2px 8px;flex:none}
.final-units .u{color:#2A1B00}
.actions{display:grid;gap:12px;margin-top:18px}
.bigbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:0;border-radius:20px;padding:14px 16px;font-weight:800;font-size:21px;line-height:1.15}
.bigbtn small{display:block;font-weight:600;font-size:15px;opacity:.9}
.bigbtn .e{font-size:34px;flex:none}
.bigbtn.read{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.bigbtn.play{background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-shadow)}
.bigbtn:active{transform:translateY(3px)}

/* ===== Umum ===== */
.gamehead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.gamehead h2{margin:0;font-size:20px;flex:1;line-height:1.15;color:var(--brand)}
.gamehead h2 small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.progress{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#F07F3C);border-radius:99px;transition:width .3s}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.page-in{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qtype{display:inline-block;background:var(--note);border-radius:999px;padding:1px 12px;font-size:14.5px;font-weight:700}
.tag{display:inline-block;background:var(--gold);color:#2A1B00;border-radius:999px;padding:1px 10px;font-size:13.5px;font-weight:800;margin-inline-start:4px}
.pill{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700}
.qtext{font-size:clamp(20px,4.8vw,25px);font-weight:700;line-height:1.32;margin:4px 0 14px}
.hint{color:var(--muted);font-size:15.5px;margin:-6px 0 12px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:11px 14px;text-align:start;font-size:19px;font-weight:600;line-height:1.3}
.opt .k{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);flex:none;font-size:16px;font-weight:800}
.opt .ar{font-size:24px;flex:1;text-align:right}
.opt.ok,.odd.ok,.mini.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad,.odd.bad,.mini.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{50%{transform:scale(1.06)}}

/* Susun langkah */
.slots{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:7px}
.slot{display:flex;gap:10px;align-items:center;min-height:46px;border:2px dashed var(--line);border-radius:14px;padding:6px 12px;line-height:1.25}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800;flex:none;font-size:15px}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--ok-bg);font-weight:700;animation:pop .3s ease}
.slot.filled .n{background:var(--ok);color:#fff}
.slot .ar{font-size:22px}
.chips{display:grid;gap:8px}
.chip{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 14px;text-align:start;font-size:18px;font-weight:700;line-height:1.25;box-shadow:0 3px 0 var(--line)}
.chip .ar{font-size:22px}
.chip.shake{border-color:var(--bad);background:var(--bad-bg)}

/* Leret kad */
.deck{position:relative;height:190px;margin:4px 0 12px;display:grid;place-items:center;touch-action:pan-y}
.scard{position:absolute;inset:6px 10%;display:grid;place-items:center;text-align:center;background:var(--note);border:3px solid var(--gold);border-radius:24px;padding:14px;font-size:clamp(19px,4.8vw,24px);font-weight:800;line-height:1.25;box-shadow:0 8px 0 color-mix(in srgb,var(--gold) 45%,transparent);cursor:grab;user-select:none;transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .45s}
.scard.under{transform:translateY(10px) scale(.94);opacity:.55;z-index:0;cursor:default}
.scard.top{z-index:1;animation:cardin .35s ease}
@keyframes cardin{from{transform:scale(.85);opacity:0}}
.scard.dragging{transition:none}
.scard.flyL{transform:translate(-130%,-20px) rotate(-22deg)!important;opacity:0}
.scard.flyR{transform:translate(130%,-20px) rotate(22deg)!important;opacity:0}
.scard .left{position:absolute;bottom:8px;font-size:13px;color:var(--muted);font-weight:700}
.scard .stamp{position:absolute;top:10px;font-size:15px;font-weight:800;border-radius:10px;padding:0 10px;opacity:0;transition:opacity .15s}
.swbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swbtn{border:0;border-radius:18px;padding:12px 8px;font-size:19px;font-weight:800;color:#fff;line-height:1.15}
.swbtn span{display:block;font-size:28px}
.swbtn.s0{background:#C0573E;box-shadow:0 5px 0 #8E3E2B}
.swbtn.s1{background:#23824A;box-shadow:0 5px 0 #17593A}
.swbtn:active{transform:translateY(3px)}
.swbtn:disabled{opacity:.45}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bins div{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;min-height:20px}
.bins i{font-style:normal;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;animation:pop .3s}
.bins i.x{border-color:var(--bad)}

/* Belon */
.balloons{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 12px;padding:6px 0 18px}
.balloon{position:relative;width:132px;min-height:118px;border:0;border-radius:50% 50% 46% 46% / 55% 55% 45% 45%;background:var(--bc);color:#fff;font-weight:800;font-size:15.5px;line-height:1.2;padding:16px 12px 20px;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset -10px -12px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.18);animation:bob 3s ease-in-out infinite;animation-delay:var(--d)}
.balloon::after{content:"";position:absolute;left:50%;bottom:-16px;width:2px;height:16px;background:color-mix(in srgb,var(--ink) 40%,transparent)}
.balloon::before{content:"";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--bc)}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.balloon.popped{animation:burst .4s ease forwards;pointer-events:none}
@keyframes burst{40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
.balloon.wrong{background:#9C9AAE;animation:shake .4s;opacity:.7}
.balloon.wrong::before{border-bottom-color:#9C9AAE}
.sparkle{position:fixed;pointer-events:none;font-size:26px;z-index:40;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translateY(-40px) scale(1.4);opacity:0}}
.counter{display:inline-block;background:var(--note);border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}

/* Cari yang lain */
.odds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.odd{min-height:96px;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:10px;font-size:18px;font-weight:700;line-height:1.25;box-shadow:0 4px 0 var(--line)}
.odd:active{transform:translateY(3px)}

/* Kira */
.mats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 6px}
.mat{width:58px;height:84px;border-radius:10px;border:3px dashed var(--line);background:transparent;display:grid;place-items:center;font-size:30px;padding:0;transition:transform .15s}
.mat.on{border:0;background:var(--mc,#B5473A);box-shadow:0 4px 0 color-mix(in srgb,var(--mc,#B5473A) 60%,#000);animation:pop .25s}
.mat.on svg{width:44px;height:70px}
.mat.ic.on{background:var(--note);border:3px solid var(--gold);box-shadow:0 4px 0 var(--gold)}
.countshow{text-align:center;font-weight:800;font-size:22px;margin:4px 0}
.countshow b{font-size:36px;color:var(--brand)}

/* Kad memori */
.memo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:800px}
.memo.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:460px){.memo.c4{grid-template-columns:repeat(2,1fr)}}
.mcard{position:relative;min-height:96px;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .45s}
.mcard.flip{transform:rotateY(180deg)}
.mcard .fc,.mcard .bk{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:800;line-height:1.2}
.mcard .bk{background:var(--brand);color:var(--brand-ink);font-size:34px;box-shadow:0 4px 0 var(--brand-shadow);background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.5px);background-size:14px 14px}
.mcard .fc{transform:rotateY(180deg);background:var(--note);border:2px solid var(--gold);font-size:16px}
.mcard .fc .ar{font-size:20px;line-height:1.6}
.mcard.done .fc{background:var(--mcol);border-color:transparent;color:#fff}
.mcard.done{animation:pop .3s}

/* Pentas animasi */
.stage{border-radius:18px;overflow:hidden;margin:0 0 12px;background:#CFE3EA;position:relative}
.stage svg{display:block;width:100%;height:auto}
.stage .cap{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.88);color:#1E2340;border-radius:999px;padding:0 12px;font-weight:800;font-size:15px}
html[dir="rtl"] .stage .cap{left:auto;right:10px}
.replay{position:absolute;right:8px;bottom:8px;border:0;background:rgba(255,255,255,.9);color:#1E2340;border-radius:999px;padding:2px 12px;font-weight:800;font-size:15px}
html[dir="rtl"] .replay{right:auto;left:8px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:4px 4px 8px;font-weight:800;font-size:15px;line-height:1.2;box-shadow:0 4px 0 var(--line)}
.mini svg{display:block;width:100%;height:auto;border-radius:12px;background:#CFE3EA;margin-bottom:4px}

/* Langit */
.scene{border-radius:18px;overflow:hidden;aspect-ratio:2/1;margin:0 0 12px;position:relative}
.scene svg{display:block;width:100%;height:100%}
.sky stop{transition:stop-color 1.6s ease}
.sky .orb{transition:transform 1.8s cubic-bezier(.4,0,.2,1)}
.sky .sun{transition:fill 1.6s}
.sky .stars,.sky .moon{transition:opacity 1.6s}
.sky .tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.skylbl{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:1px 14px;font-weight:800;font-size:16px;white-space:nowrap}

/* Bacaan */
.unitlbl{display:inline-block;background:var(--tc);color:#fff;border-radius:999px;padding:1px 12px;font-weight:800;font-size:14.5px;margin-bottom:6px}
.final-tc .unitlbl{color:#2A1B00}
.readtext{font-size:clamp(19px,4.4vw,22px);font-weight:600;line-height:1.5;margin:0 0 12px}
.arbox{background:var(--note);border:2px solid var(--gold);border-radius:16px;padding:8px 14px;margin:0 0 12px;text-align:center}
.arbox .ar{font-size:clamp(22px,5.4vw,28px);display:block}
.arbox .ar + .ar{border-top:1px dashed color-mix(in srgb,var(--gold) 60%,transparent)}
.arbox small{display:block;color:var(--muted);font-weight:700;font-size:13.5px}
.artable{width:100%;border-collapse:collapse;margin:0 0 12px}
.artable th{font-size:14px;color:var(--muted);text-align:center;padding:2px}
.artable td{border-top:1px dashed var(--line);text-align:center;padding:2px 4px}
.artable .ar{font-size:19px}
.rlist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;counter-reset:r}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:5px 10px;font-weight:700;line-height:1.3;animation:pagein .4s both;animation-delay:calc(var(--i) * 70ms)}
.rlist li::before{counter-increment:r;content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.final-tc .rlist li::before{color:#2A1B00}
.tip{background:var(--note);border-radius:16px;padding:8px 12px;margin:0 0 12px;font-weight:600;font-size:17px}
.tip b{display:block;font-size:15px;color:var(--muted)}
.ref{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--muted)}
.navrow{display:grid;grid-template-columns:52px auto 1fr;gap:8px;align-items:center}
.navrow .secondary,.navrow .primary{margin:0;padding:11px 6px;font-size:18px}
.navrow .secondary:disabled{opacity:.35}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold);width:22px;border-radius:99px}
.rk{display:grid;gap:8px;margin:0 0 12px}
.rk div{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:6px 10px}
.rk .nm{width:92px;font-weight:800;flex:none}
.rk .ms{display:flex;gap:5px;flex-wrap:wrap}
.rk .ms i{width:18px;height:28px;border-radius:4px;background:#B5473A;box-shadow:inset 0 0 0 2px #E8B33A;animation:pop .3s both}
.rk .num{margin-inline-start:auto;font-weight:800;color:var(--muted)}
.saf{display:grid;gap:6px;margin:0 0 12px;text-align:center}
.saf .row{display:flex;align-items:center;justify-content:center;gap:4px;font-size:28px;line-height:1.1;animation:drop .5s both;animation-delay:calc(var(--i) * 260ms)}
.saf .row small{font-size:14px;font-weight:800;color:var(--muted);min-width:120px;text-align:start;margin-inline-start:8px}
.saf .kib{font-size:15px;font-weight:800;color:var(--muted)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}

/* Pemain solat */
.plctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:10px}
.plctl button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px;font-weight:800;font-size:17px}
.plctl .pp{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.plcap{font-weight:800;font-size:clamp(19px,4.6vw,23px);margin:0;line-height:1.25}
.plcap small{display:block;font-size:14px;color:var(--muted)}

/* Maklum balas & keputusan */
.feedback{display:flex;gap:12px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:18px;background:var(--note);font-size:17px;line-height:1.4}
.feedback .mascot{width:76px}
.feedback strong{display:block;font-size:21px}
.streak{display:inline-block;background:var(--gold);color:#3A2600;border-radius:999px;padding:0 10px;font-weight:800;font-size:15px;margin:2px 0 4px}
.primary{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:13px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:800;box-shadow:0 4px 0 var(--brand-shadow)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-shadow)}
.secondary{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:transparent;border-radius:16px;padding:11px;font-size:18px;font-weight:700}
.result{text-align:center}
.result .mascot{width:120px;margin:0 auto}
.result .stars{font-size:54px;letter-spacing:6px;line-height:1.1;margin:4px 0}
.result .stars .off{filter:grayscale(1);opacity:.25}
.result h2{margin:4px 0 2px;font-size:32px;color:var(--brand)}
.result p{margin:0 0 6px;color:var(--muted)}
.unlock{display:inline-block;margin:8px 0 0;background:var(--note);border:2px solid var(--gold);border-radius:999px;padding:3px 14px;font-weight:800}
.earned{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:20px;margin:4px 0}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;top:-50px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}

.mascot{display:block;height:auto;flex:none}
.mascot.happy{animation:hop .45s ease 2}
.mascot.sad{animation:tilt .9s ease}
@keyframes hop{50%{transform:translateY(-10px)}}
@keyframes tilt{30%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}}

/* Animasi ilustrasi */
.puff{animation:puff 6s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes puff{0%,6%{opacity:0;transform:scale(.3)}10%{opacity:.9}20%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
.puff2{animation-delay:2.8s}
.hl{animation:hl 6s ease-in-out infinite}
.hr{animation:hr 6s ease-in-out infinite}
@keyframes hl{0%,12%{transform:translate(0,0)}26%{transform:translate(10px,-70px)}38%{transform:translate(10px,-46px)}48%,58%{transform:translate(0,0)}70%{transform:translate(70px,-34px)}84%{transform:translate(52px,-20px)}100%{transform:translate(0,0)}}
@keyframes hr{0%,12%{transform:translate(0,0)}26%{transform:translate(-10px,-70px)}38%{transform:translate(-10px,-46px)}48%,58%{transform:translate(0,0)}70%,84%{transform:translate(34px,-30px)}100%{transform:translate(0,0)}}
.wave3{animation:wv 2.2s ease-out infinite;transform-box:fill-box;transform-origin:0 50%;opacity:0}
.floaty{animation:floaty 5s ease-in-out infinite;opacity:0}
@keyframes floaty{0%{opacity:0;transform:translate(0,10px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(30px,-26px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rain{display:none}
  .puff,.wave3,.floaty,.mosque .wv{opacity:.8}
}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Baloo 2",serif;font-size:20px;line-height:1.8}
html[dir="rtl"] .qtext,html[dir="rtl"] .readtext{line-height:1.85}
html[dir="rtl"] .hero h1{font-weight:700;line-height:1.35}
html[dir="rtl"] .banner h2{line-height:1.5}
html[dir="rtl"] .opt,html[dir="rtl"] .chip,html[dir="rtl"] .odd,html[dir="rtl"] .balloon,html[dir="rtl"] .scard{line-height:1.6}
html[dir="rtl"] .lesson .tt{line-height:1.6}
@media (max-width:400px){
  .balloon{width:118px;font-size:14.5px}
  .mat{width:50px;height:74px}
}

    {u:["Waktu azan dan iqamah","وقتو اذان دان اقامة"],sc:"sky",p:9,t:["Azan dilaungkan apabila masuk waktu solat fardu. Iqamah dilaungkan ketika hendak mendirikan solat fardu.","اذان دلاوڠکن اڤابيلا ماسوق وقتو صلاة فرض. اقامة دلاوڠکن کتيک هندق منديريکن صلاة فرض."]},

  cards:[
    {u:["Pengertian solat","ڤڠرتين صلاة"],sc:"pose:sujud",p:13,t:["Solat ialah perkataan dan perbuatan yang dimulai dengan takbir dan disudahi dengan salam dengan syarat-syarat tertentu.","صلاة اياله ڤرکاتاٴن دان ڤربواتن يڠ دمولاٴي دڠن تکبير دان دسوداهي دڠن سلام دڠن شرط٢ ترتنتو."]},
    {u:["Hukum solat fardu","حکوم صلاة فرض"],p:14,t:["Solat fardu wajib ke atas setiap orang Islam yang berakal dan baligh.","صلاة فرض واجب ک اتس ستياڤ اورڠ اسلام يڠ براقل دان بالغ."]},
    {u:["Solat lima waktu","صلاة ليم وقتو"],sc:"sky",p:14,t:["Solat fardu lima waktu sehari semalam ialah Subuh, Zuhur, Asar, Maghrib dan Isyak. Lihat langit berubah!","صلاة فرض ليم وقتو سهاري سمالم اياله صبح، ظهر، عصر، مغرب دان عشاء. ليهت لاڠيت بروبه!"]},
    {u:["Bilangan rakaat","بيلڠن رکعة"],sc:"rakaat",p:14,t:["Setiap sejadah merah ialah satu rakaat.","ستياڤ سجادة ميره اياله ساتو رکعة."]},
    {u:["Niat solat Subuh","نيت صلاة صبح"],p:14,ar:["أُصَلِّيْ فَرْضَ الصُّبْحِ رَكْعَتَيْنِ أَدَاءً لِلّٰهِ تَعَالَى"],t:["Ertinya: Sahaja aku solat fardu Subuh dua rakaat tunai kerana Allah Taala.","ارتيڽ: سهاج اکو صلاة فرض صبح دوا رکعة توناي کران الله تعالى."]},

    {u:["Niat solat Maghrib","نيت صلاة مغرب"],p:15,ar:["أُصَلِّيْ فَرْضَ الْمَغْرِبِ ثَلَاثَ رَكَعَاتٍ أَدَاءً لِلّٰهِ تَعَالَى"],t:["Ertinya: Sahaja aku solat fardu Maghrib tiga rakaat tunai kerana Allah Taala.","ارتيڽ: سهاج اکو صلاة فرض مغرب تيڬ رکعة توناي کران الله تعالى."],tip:["Petua: رَكْعَتَيْنِ = dua rakaat, ثَلَاثَ رَكَعَاتٍ = tiga rakaat, أَرْبَعَ رَكَعَاتٍ = empat rakaat.","ڤتوا: رَكْعَتَيْنِ = دوا رکعة، ثَلَاثَ رَكَعَاتٍ = تيڬ رکعة، أَرْبَعَ رَكَعَاتٍ = امڤت رکعة."]}

    {type:"swipe",q:["Solat Amin batal atau tidak?","صلاة امين بطل اتاو تيدق؟"],l:[["Tidak batal","تيدق بطل"],["Batal","بطل"]],ic:["👍","💥"],items:[[["Amin makan gula-gula ketika solat","امين ماکن ڬولا٢ کتيک صلاة"],1],[["Amin membaca tasbih tiga kali ketika rukuk","امين ممباچ تسبيح تيڬ کالي کتيک رکوع"],0],[["Amin berbual dengan kawan ketika solat","امين بربوال دڠن کاون کتيک صلاة"],1],[["Amin berpaling dada ke belakang","امين برڤاليڠ دادا ک بلاکڠ"],1],[["Amin membaca doa qunut ketika Subuh","امين ممباچ دعاء قنوت کتيک صبح"],0]],e:["Makan, berbual dan berpaling dada dari kiblat membatalkan solat.","ماکن، بربوال دان برڤاليڠ دادا دري قبلة ممبطلکن صلاة."],p:19},
    {type:"mcq",q:["Perkara sunat dalam solat terbahagi kepada…","ڤرکارا سنة دالم صلاة ترباهاڬي کڤد…"],a:[["Sunat ab'ad dan sunat hai'ah","سنة ابعاض دان سنة هيئة"],["Sunat muakkad dan sunat biasa","سنة مؤکد دان سنة بياسا"],["Syarat wajib dan syarat sah","شرط واجب دان شرط سه"],["Rukun dan tertib","رکن دان ترتيب"]],e:["Ada dua jenis: sunat ab'ad dan sunat hai'ah.","اد دوا جنيس: سنة ابعاض دان سنة هيئة."],p:17},
    {type:"count",q:["Berapa kali tasbih dibaca ketika rukuk? Tekan tasbih.","براڤ کالي تسبيح دباچ کتيک رکوع؟ تکن تسبيح."],n:3,max:5,ic:"📿",e:["Tasbih dibaca tiga kali ketika rukuk dan sujud.","تسبيح دباچ تيڬ کالي کتيک رکوع دان سجود."],p:18},
    {type:"mcq",q:["Bacaan ketika bangkit daripada rukuk ialah…","باچاٴن کتيک بڠکيت درڤد رکوع اياله…"],a:["سَمِعَ اللّٰهُ لِمَنْ حَمِدَهُ","سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ","آمِيْن","اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللّٰهِ"],e:["Ketika bangkit daripada rukuk: “Sami‘allahu liman hamidah, Rabbana lakal hamd”.","کتيک بڠکيت درڤد رکوع: “سمع الله لمن حمده، ربنا لک الحمد”."],p:18},
    {type:"mcq",q:["Duduk ketika tahiyat AKHIR dinamakan duduk…","دودوق کتيک تحية اخير دنامکن دودوق…"],a:[["Tawarruk","تورک"],["Iftirasy","افتراش"],["Bersila","برسيلا"],["Melunjur","ملونجور"]],e:["Tahiyat akhir: tawarruk. Tahiyat awal: iftirasy.","تحية اخير: تورک. تحية اول: افتراش."],p:18},
    {type:"odd",q:["Cari yang BUKAN sunat ab'ad.","چاري يڠ بوکن سنة ابعاض."],a:[["Membaca doa iftitah","ممباچ دعاء افتتاح"],["Membaca doa qunut","ممباچ دعاء قنوت"],["Duduk tahiyat awal","دودوق تحية اول"],["Membaca tahiyat awal","ممباچ تحية اول"]],e:["Doa iftitah ialah sunat hai'ah.","دعاء افتتاح اياله سنة هيئة."],p:17},
    {type:"mcq",q:["Lafaz taawuz dibaca perlahan sebelum…","لفظ تعوذ دباچ ڤرلاهن سبلوم…"],a:[["Membaca surah al-Fatihah","ممباچ سورة الفاتحة"],["Rukuk","رکوع"],["Memberi salam","ممبري سلام"],["Sujud","سجود"]],e:["Taawuz “A‘uzu billahi minasy syaitanir rajim” dibaca sebelum al-Fatihah.","تعوذ “اعوذ بالله من الشيطان الرجيم” دباچ سبلوم الفاتحة."],p:18},
    {type:"swipe",q:["Betul atau salah?","بتول اتاو ساله؟"],l:[["Salah","ساله"],["Betul","بتول"]],ic:["✖️","✔️"],items:[[["Takbir intiqal ialah takbir ketika berpindah dari satu rukun ke rukun lain.","تکبير انتقال اياله تکبير کتيک برڤينده دري ساتو رکن ک رکن لاٴين."],1],[["Makan sedikit sahaja tidak membatalkan solat.","ماکن سديکيت سهاج تيدق ممبطلکن صلاة."],0]],e:["Makan dan minum walaupun sedikit membatalkan solat.","ماکن دان مينوم والاوڤون سديکيت ممبطلکن صلاة."],p:19}

    {u:["Iktidal","اعتدال"],sc:"pose:iktidal",p:25,ar:["سَمِعَ اللّٰهُ لِمَنْ حَمِدَهُ ، رَبَّنَا لَكَ الْحَمْدُ"],t:["Bangkit dari rukuk sambil mengangkat tangan, kemudian berdiri tegak.","بڠکيت دري رکوع سمبيل مڠڠکت تاڠن، کمودين بردييري تڬق."]},

    {u:["Doa qunut","دعاء قنوت"],sc:"pose:qunut",p:48,ar:["اَللّٰهُمَّ اهْدِنِيْ فِيْمَنْ هَدَيْتَ ، وَعَافِنِيْ فِيْمَنْ عَافَيْتَ …"],t:["Doa qunut dibaca ketika iktidal rakaat kedua solat Subuh. Ia sunat ab'ad.","دعاء قنوت دباچ کتيک اعتدال رکعة کدوا صلاة صبح. اي سنة ابعاض."],tip:["Solat Subuh tiada tahiyat awal. Maghrib, Zuhur, Asar dan Isyak ada tahiyat awal selepas rakaat kedua.","صلاة صبح تياد تحية اول. مغرب، ظهر، عصر دان عشاء اد تحية اول سلڤس رکعة کدوا."]}

let actx;
function tone(freqs, dur=0.12, type="sine"){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      const s=t+i*dur;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.18,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s+dur+0.02);
    });
  }catch(e){}
}
const sfx = { ok:()=>tone([660,880]), bad:()=>tone([240,180],0.15,"triangle"), tap:()=>tone([520],0.06,"triangle"), pop:()=>tone([900,1350],0.06), flip:()=>tone([420],0.05,"triangle"), win:()=>tone([523,659,784,1047],0.14) };

if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text){
  if(!ttsOK || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\bSAW\b/g,"sallallahu alaihi wasallam").replace(/[“”…]/g,"").replace(/[؀-ۿ]+/g,""));
    u.lang = voice ? voice.lang : "ms-MY";
    if(voice) u.voice = voice;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

const dirv = a => { const r=a*Math.PI/180; return [Math.sin(r), Math.cos(r)]; };
const adv = (p,a,l) => { const d=dirv(a); return [p[0]+d[0]*l, p[1]+d[1]*l]; };
const f1 = n => n.toFixed(1);

function figBody(p, c){
  const hip=p.hip, knee=adv(hip,p.th,30), foot=adv(knee,p.sh,30), sh=adv(hip,p.to,40), head=adv(sh,p.hd,13), el=adv(sh,p.ua,22), hand=adv(el,p.fa,19);

  const rot = face ? 0 : -(p.hd-180);

  const finger = p.fg ? LN(hand, adv(hand, 120, 8), 3, c.skin) : "";

  return `${LN(hip,knee,15,c.sel)}${LN(knee,foot,13,c.sel)}${footEl}
    ${outline!=="none"?LN(hip,sh,26,outline):""}${LN(hip,sh,24,c.baju)}

}
const cloneP = p => JSON.parse(JSON.stringify(p));
class Fig{
  constructor(g, pose, c){ this.g=g; this.c=c; this.p=cloneP(POSES[pose]); this.draw(); }
  draw(){ if(this.g) this.g.innerHTML = figBody(this.p, this.c); }
  set(k){ this.p = cloneP(POSES[k]); this.draw(); }
  async to(k, ms=700){
    const tgt = POSES[k];
    if(Math.abs(tgt.sh - this.p.sh) > 45){ await this.tween("turun", ms*0.5); return this.tween(k, ms*0.6); }
    return this.tween(k, ms);
  }
  tween(k, ms){
    const a = cloneP(this.p), b = POSES[k], tok = animTok;
    if(REDUCED || ms<=0){ this.set(k); return Promise.resolve(); }
    return new Promise(res=>{
      const t0 = performance.now();
      const step = now => {
        if(tok!==animTok || !this.g.isConnected) return res();
        const t = Math.min(1,(now-t0)/ms), e = t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
        const p = {};
        NUMK.forEach(n=>{ p[n] = a[n] + (b[n]-a[n])*e; });
        p.hip = [a.hip[0]+(b.hip[0]-a.hip[0])*e, a.hip[1]+(b.hip[1]-a.hip[1])*e];
        p.face = e<.5 ? (a.face||0) : (b.face||0);
        p.fg = e<.8 ? a.fg : b.fg;
        this.p = p; this.draw();
        if(t<1) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
  }
}

async function jemaahLoop(tok){
  const imam = new Fig($("fA"),"qiyam",IMAM), mk = new Fig($("fB"),"qiyam",KID);
  const seq = ["takbir","qiyam","rukuk","iktidal","sujud","duduk","sujud","qiyam"];
  let i = 0;
  await wait(500);
  while(tok===animTok){
    const k = seq[i%seq.length];
    const cap = $("jcap"); if(cap) cap.textContent = `${tx("Imam","امام")}: ${L(POSE_N[k])}`;
    imam.to(k, 750);

    if(cap) cap.textContent = `${tx("Makmum ikut","مأموم ايکوت")}: ${L(POSE_N[k])}`;
    await mk.to(k, 750);

function sceneHTML(k){
  if(k.startsWith("pose:")) return figStage("fA", L(POSE_N[k.slice(5)]));
  switch(k){
    case "tayammum": return tayammumSVG();
    case "azan": return azanSVG();
    case "sky": return `<div class="scene">${skySVG("subuh","skyA")}<span class="skylbl" id="skyLbl">${L(SOLAT.subuh)}</span></div>`;
    case "rakaat": return rakaatHTML();
    case "saf": return safHTML();
    case "jemaah": return jemaahStage();
    case "player": return playerHTML();
  }
  return "";
}
function mountScene(k){
  const tok = animTok;
  if(!k) return;
  if(k.startsWith("pose:")){
    const f = new Fig($("fA"),"qiyam",KID), p = k.slice(5);
    const go = async () => { while(tok===animTok){ await wait(700); if(tok!==animTok) break; await f.to(p, 900); await wait(2600); if(tok!==animTok || p==="qiyam") break; await f.to("qiyam", 700); } };
    go();
  }
  if(k==="sky") skyCycle(tok);
  if(k==="jemaah") jemaahLoop(tok);
  if(k==="player") mountPlayer();
}

async function plPlay(){
  const pl = run.pl; pl.playing = !pl.playing;
  $("plPlay").innerHTML = pl.playing ? `⏸ ${tx("Henti","هنتي")}` : `▶ ${tx("Main","ماٴين")}`;

        <div class="chips">${shuffle(q.items.map((t,i)=>({t,i}))).map(o=>`<button class="chip" data-act="ord" data-i="${o.i}">${optLabel(o.t)}</button>`).join("")}</div>`;

async function playPose(tok){
  const f = run.fig, k = run.q.pose;
  await wait(400); if(tok!==animTok) return;
  await f.to(k, 1000);
}

function finishQ(ok, extra=""){
  run.done = true;
  if(ok){ run.score++; run.pelita++; run.streak++; } else run.streak = 0;
  const q = run.q, last = run.i+1 >= run.qs.length;
  const title = ok ? (run.mist ? tx("Bagus, hampir sempurna!","باڬوس، همڤير سمڤورنا!") : pick(isJ()?PRAISE_J:PRAISE_R)) : tx("Tidak mengapa, mari belajar!","تيدق مڠاڤ، ماري بلاجر!");
  $("fb").innerHTML = `<div class="feedback">${mascot(ok?"happy":"sad")}<div><strong>${title}</strong>${ok?`<span class="streak">+1 ${tx("pelita","ڤليتا")} 🪔</span> `:""}${ok&&run.streak>=3?`<span class="streak">🔥 ${run.streak} ${tx("berturut-turut!","برتوروت٢!")}</span>`:""}<br>${extra}${L(q.e)}<div class="ref">📖 ${tx("Rujuk buku teks ms.","روجوق بوکو تيکس م.س.")} ${q.p}</div></div></div>
    <button class="primary" data-act="next">${last?tx("Lihat keputusan","ليهت کڤوتوسن"):tx("Soalan seterusnya","سوالن ستروسڽ")}</button>`;
  ok ? sfx.ok() : sfx.bad();
  const b = $("fb").querySelector(".primary"); b.focus({preventScroll:true}); b.scrollIntoView({block:"nearest",behavior:REDUCED?"auto":"smooth"});
}

function ansChoice(k, sel){
  if(run.done) return;
  const btns = [...app.querySelectorAll(sel)];
  btns.forEach(b=>b.disabled=true);
  const right = run.opts.findIndex(o=>o.ok), ok = k===right;

}
async function ansImam(k){

  const right = run.opts.findIndex(o=>o.ok), ok = k===right, nxt = run.opts[right].k, tok = animTok;

function ansMat(k){

}
function ansCount(){
  if(run.done) return;
  if(run.val===0){ const m=$("mats"); m.classList.remove("shake"); void m.offsetWidth; m.classList.add("shake"); return; }
  const ok = run.val===run.q.n;

/* Leret kad */
function sideFromDx(dx){ const right = dx>0; return isJ() ? (right?0:1) : (right?1:0); }
function showSwipeCard(){
  const deck = $("deck"); if(!deck) return;
  const it = run.queue[run.si], nx = run.queue[run.si+1];
  deck.innerHTML = `${nx?`<div class="scard under" aria-hidden="true"></div>`:""}<div class="scard top" id="scard" role="group">${L(it[0])}<span class="left">${run.queue.length-run.si} ${tx("lagi","لاڬي")}</span></div>`;
  const c = $("scard"); let x0 = null, dx = 0;
  c.addEventListener("pointerdown", e=>{ if(run.done) return; x0 = e.clientX; dx = 0; c.classList.add("dragging"); try{ c.setPointerCapture(e.pointerId); }catch(_){} });
  c.addEventListener("pointermove", e=>{ if(x0===null) return; dx = e.clientX - x0; c.style.transform = `translateX(${dx}px) rotate(${dx/14}deg)`; });
  const end = () => { if(x0===null) return; x0 = null; c.classList.remove("dragging");
    if(Math.abs(dx) > 80) ansSwipe(sideFromDx(dx)); else c.style.transform = ""; };
  c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
}
function ansSwipe(g){
  if(run.done || run.swBusy) return;
  const it = run.queue[run.si], ok = g===it[1], c = $("scard");
  run.swBusy = true;
  const goRight = isJ() ? it[1]===0 : it[1]===1;   // kad terbang ke arah jawapan yang betul
  if(ok) sfx.tap(); else { run.mist++; sfx.bad(); }
  c.style.transform = "";
  c.classList.add(goRight?"flyR":"flyL");
  $("bin"+it[1]).insertAdjacentHTML("beforeend", `<i class="${ok?"":"x"}">${ok?"✓ ":"❗"}${L(it[0])}</i>`);
  setTimeout(()=>{
    run.swBusy = false; run.si++;
    if(run.si>=run.queue.length){
      $("deck").innerHTML = `<div class="scard top">${tx("Siap!","سياڤ!")} ✔️</div>`;
      app.querySelectorAll(".swbtn").forEach(b=>b.disabled=true);
      finishQ(run.mist<=1, run.mist?tx("Kad bertanda ❗ telah diletakkan di tempat yang betul. ","کد برتندا ❗ تله دلتقکن د تمڤت يڠ بتول. "):"");
    } else showSwipeCard();
  }, ok?380:700);
}
/* Belon */
function ansPop(b){
  if(run.done || b.disabled) return;
  const it = run.q.items[+b.dataset.i];
  b.disabled = true;
  if(it[1]){
    sfx.pop(); b.classList.add("popped"); run.popLeft--;

    }
  } else { run.mist++; sfx.bad(); b.classList.add("wrong"); b.prepend("❌ "); }

/* Susun */
function ansOrder(b){
  if(run.done) return;
  const i = +b.dataset.i;
  if(i===run.next){
    sfx.tap();
    const s=$("s"+i); s.classList.add("filled"); s.querySelector(".st").innerHTML = optLabel(run.q.items[i]);

/* Kad memori */
function ansMem(b){
  const m = run.mem;
  if(run.done || m.lock || b.classList.contains("flip")) return;
  sfx.flip(); b.classList.add("flip");
  const k = +b.dataset.k;
  if(m.first===null){ m.first = k; return; }
  const a = m.first; m.first = null;
  const A = app.querySelector(`.mcard[data-k="${a}"]`);
  if(m.cards[a].i === m.cards[k].i){
    const col = MATCH_COLORS[m.found % MATCH_COLORS.length];
    [A,b].forEach(x=>{ x.classList.add("done"); x.style.setProperty("--mcol",col); x.disabled = true; });
    m.found++; setTimeout(()=>sfx.tap(),200);
    if(m.found===run.q.pairs.length) setTimeout(()=>finishQ(run.mist<=run.q.pairs.length+1, run.mist?`${tx("Cubaan tersilap:","چوباٴن ترسيلڤ:")} ${run.mist}. `:""),400);
  } else {
    run.mist++; m.lock = true;
    setTimeout(()=>{ A.classList.remove("flip"); b.classList.remove("flip"); m.lock = false; }, 950);
  }
}

function nextQ(){
  run.i++;
  if(run.i < run.qs.length){ showQ(); window.scrollTo(0,0); }
  else finishRound();
}
function finishRound(){
  stopAnims();
  const isFinal = run.station==="final";
  const key = isFinal ? "final" : LESSONS[+run.station].id;
  const n = run.qs.length, s = run.score, pct = s/n;
  const stars = pct>=0.9?3:pct>=0.7?2:pct>=0.5?1:0;
  const wasFinalOpen = finalUnlocked();
  const nextIdx = isFinal ? -1 : +run.station+1;
  const wasNextOpen = nextIdx>0 && nextIdx<LESSONS.length ? unlocked(nextIdx) : true;
  const prev = best[key];
  if(stars>prev){ best[key]=stars; save("f3-best",best); }
  pelitaTotal += run.pelita; save("f3-pelita",pelitaTotal);
  let msgs = [];
  if(prev<1 && stars>=1) msgs.push(isFinal ? tx("🌙 Bulan sabit dipasang di atas kubah!","🌙 بولن سابيت دڤاسڠ د اتس کوبه!") : `🧱 ${L(LESSONS[+run.station].part)} ${tx("sudah dibina!","سوده دبينا!")}`);
  if(nextIdx>0 && nextIdx<LESSONS.length && !wasNextOpen && unlocked(nextIdx)) msgs.push(tx(`🔓 Pelajaran ${nextIdx+1} kini dibuka!`,`🔓 ڤلاجرن ${nextIdx+1} کيني دبوک!`));
  if(!isFinal && !wasFinalOpen && finalUnlocked()) msgs.push(tx("🔓 Cabaran Akhir kini dibuka!","🔓 چابرن اخير کيني دبوک!"));
  const titles = isJ() ? ["جوم چوبا سکالي لاڬي","بوليه چوبا لاڬي","باڬوس!","چمرلڠ!"] : ["Jom cuba sekali lagi","Boleh cuba lagi","Bagus!","Cemerlang!"];
  const label = isFinal ? L(FINAL.title) : `${tx("Pelajaran","ڤلاجرن")} ${key}: ${L(LESSONS[+run.station].title)}`;
  app.innerHTML = `
    <div class="card result page-in" style="margin-top:18px">
      ${mascot(stars>=2?"happy":"idle")}
      <p style="margin:4px 0 0">${label}</p>
      <div class="stars" role="img" aria-label="${stars} / 3">${starsHTML(stars)}</div>
      <h2>${titles[stars]}</h2>
      <p>${tx(`Kamu menjawab ${s} daripada ${n} soalan dengan betul.`,`کامو منجواب ${s} درڤد ${n} سوالن دڠن بتول.`)}</p>
      <div class="earned">+${run.pelita} ${PELITA} ${tx("pelita","ڤليتا")}</div>
      ${stars>prev?`<p>${tx("Rekod baharu!","ريکود بهارو!")}</p>`:""}
      ${stars===0?`<p>${tx("Dapatkan sekurang-kurangnya 1 bintang (separuh betul) untuk membina bahagian masjid. Cuba “Tonton & Baca” dahulu.","داڤتکن سکورڠ٢ڽ 1 بينتڠ (سڤاروه بتول) اونتوق ممبينا بهاڬين مسجد. چوبا “تونتون & باچ” دهولو.")}</p>`:""}
      ${msgs.map(m=>`<div class="unlock">${m}</div>`).join("<br>")}
      ${isFinal&&stars===3?`<div class="unlock">🏆 ${tx("Tahniah! Kamu juara Feqah Tahun 3!","تهنية! کامو جوارا فقه تاهون 3!")}</div>`:""}
      <button class="primary" data-act="map">${tx("Lihat masjid saya","ليهت مسجد ساي")} 🕌</button>
      <button class="secondary" data-act="again">${tx("Main lagi","ماٴين لاڬي")}</button>
    </div>`;
  sfx.win();
  if(stars===3) rain();
  window.scrollTo(0,0);
}
function rain(){
  if(REDUCED) return;
  const box = document.createElement("div"); box.className = "rain";
  for(let i=0;i<28;i++){
    const s = document.createElement("span");
    s.textContent = pick(["⭐","✨","🌙","🪔","🕌"]);
    s.style.left = Math.random()*100+"vw";
    s.style.animationDuration = (2+Math.random()*2)+"s";
    s.style.animationDelay = (Math.random()*0.8)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 4500);
}

/* ============ PERISTIWA ============ */
app.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || b.disabled) return;
  switch(b.dataset.act){
    case "mute": muted=!muted; save("f3-muted",muted); b.textContent=muted?"🔇":"🔊"; b.setAttribute("aria-label",muted?"Hidupkan bunyi":"Matikan bunyi"); if(muted) hush(); break;
    case "lang": lang = isJ() ? "rumi" : "jawi"; save("kafa-lang",lang); applyLang(); renderMap(); break;
    case "teacher": teacher=!teacher; save("f3-teacher",teacher); renderMap(); break;
    case "map": renderMap(); window.scrollTo(0,0); break;
    case "station": openStation(b.dataset.i); break;
    case "station-back": openStation(run.station); break;
    case "read": startRead(); window.scrollTo(0,0); break;
    case "cprev": if(run.c>0){ run.c--; showCard(); } break;
    case "cnext": { const n=LESSONS[+run.station].cards.length; if(run.c+1<n){ run.c++; showCard(); } else startPlay(); window.scrollTo(0,0); break; }
    case "play": startPlay(); window.scrollTo(0,0); break;
    case "say": if(run && run.say) speak(run.say); break;
    case "mc": ansChoice(+b.dataset.k, ".opt"); break;
    case "odd": ansChoice(+b.dataset.k, ".odd"); break;
    case "mini": ansImam(+b.dataset.k); break;
    case "mat": ansMat(+b.dataset.k); break;
    case "cchk": ansCount(); break;
    case "sw": ansSwipe(+b.dataset.g); break;
    case "pop": ansPop(b); break;
    case "ord": ansOrder(b); break;
    case "mem": ansMem(b); break;
    case "pl-play": plPlay(); break;
    case "pl-next": run.pl.playing=false; $("plPlay").innerHTML=`▶ ${tx("Main","ماٴين")}`; run.pl.i=(run.pl.i+1)%SUBUH.length; plShow(); break;
    case "pl-prev": run.pl.playing=false; $("plPlay").innerHTML=`▶ ${tx("Main","ماٴين")}`; run.pl.i=(run.pl.i-1+SUBUH.length)%SUBUH.length; plShow(); break;
    case "next": nextQ(); break;
    case "again": startPlay(); window.scrollTo(0,0); break;
  }
});

applyLang();
renderMap();
</script>
