<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0EA5C6">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/access.js"></script>
<title>Pulau Titisan Suci • Feqah Tahun 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Feqah Tahun 1: "Pulau Titisan Suci" — air, buih & pelangi; kad kaca lembut tanpa garis gelap ===== */
:root{
  --sea:#0EA5C6; --sea-d:#0A7EA4; --aqua:#7FE3F0; --foam:#E8FBFF; --deep:#0B5F86;
  --sand:#F8E2AE; --sand-d:#E2B86A; --leaf:#34C77B; --coral:#FF6F91; --sun:#FFD166;
  --bg:#E8FBFF; --card:#FFFFFF; --glass:rgba(255,255,255,.78); --ink:#0B3954; --muted:#467690;
  --line:rgba(11,57,84,.13); --sh:0 10px 26px rgba(10,126,164,.20); --sh2:0 4px 12px rgba(10,126,164,.18);
  --ok:#1FB86A; --okbg:#DDF8EA; --bad:#FF5A6E; --badbg:#FFE4E8; --note:#EFFAFF; --tip:#E3F6FF; --am:#FFF0F5;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06283A; --foam:#06283A; --card:#0D3A52; --glass:rgba(13,58,82,.82); --ink:#E4F7FF; --muted:#9DCBE0;
    --line:rgba(255,255,255,.14); --sh:0 10px 26px rgba(0,0,0,.35); --sh2:0 4px 12px rgba(0,0,0,.3);
    --note:#0F4560; --tip:#0E4A63; --am:#4A2338; --okbg:#124A33; --badbg:#4C1F2A; --sand:#C9A766; --sand-d:#9C7E40; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Sniglet","Trebuchet MS",system-ui,sans-serif;font-size:19px;line-height:1.4;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.7) 0 5px,transparent 6px) 0 0/90px 110px,
    radial-gradient(circle at 70% 60%,rgba(255,255,255,.55) 0 3px,transparent 4px) 0 0/70px 80px,
    linear-gradient(180deg,#9EE7F7 0,#D3F5FD 380px,var(--bg) 820px) fixed;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:
    radial-gradient(circle at 12% 18%,rgba(127,227,240,.12) 0 5px,transparent 6px) 0 0/90px 110px,
    linear-gradient(180deg,#0A3F5C 0,#06283A 600px) fixed}}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Sniglet",serif;font-size:20px;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 70px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl}
.waves{position:fixed;left:0;right:0;bottom:0;height:46px;pointer-events:none;z-index:-1;opacity:.55;
  background:radial-gradient(circle at 50% 0,transparent 22px,var(--aqua) 23px) 0 0/48px 46px repeat-x;animation:wave 6s linear infinite}
@keyframes wave{to{background-position:48px 0}}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.ib{min-width:50px;height:50px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(6px);display:inline-grid;place-items:center;font-size:22px;font-weight:800;text-decoration:none;color:var(--deep);box-shadow:var(--sh2),inset 0 -3px 0 rgba(10,126,164,.15);padding:0 10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ib{color:var(--aqua)}}
.ib:active{transform:scale(.92)}
.pill{display:inline-flex;align-items:center;gap:4px;height:50px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,#FFE29A,var(--sun));color:#5A3B00;font-weight:800;box-shadow:var(--sh2),inset 0 -3px 0 rgba(0,0,0,.08)}

/* tajuk */
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(220,248,255,.85));border-radius:32px;padding:12px 16px;box-shadow:var(--sh);margin:4px 0 14px;position:relative;overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#0F4762,#0B3348)}}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,transparent 46%,rgba(255,111,145,.25) 47% 53%,rgba(255,209,102,.25) 54% 60%,rgba(52,199,123,.22) 61% 67%,rgba(14,165,198,.22) 68% 74%,transparent 75%)}
html[dir="rtl"] .hero::after{right:auto;left:-30px}
.hero h1{margin:0;font-size:clamp(25px,6.4vw,33px);line-height:1.1;font-weight:800;background:linear-gradient(90deg,var(--sea-d),var(--sea) 50%,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
html[dir="rtl"] .hero h1{line-height:1.6}
.hero p{margin:2px 0 0;color:var(--muted);font-size:16px}
.titis{width:80px;height:auto;flex:none;overflow:visible}
.titis.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) scaleY(1.03)}}
.titis.yay{animation:yay .55s ease 2}
@keyframes yay{40%{transform:translateY(-16px) scale(1.08,.95)}70%{transform:translateY(0) scale(.95,1.06)}}

/* balang pelekat */
.sttl{font-weight:800;font-size:15px;margin:0 0 6px;color:var(--muted)}
.jar{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(127,227,240,.35));border-radius:22px 22px 30px 30px;padding:10px 8px;margin-bottom:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),var(--sh2)}
.jar span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(15px,4.4vw,24px);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9) 0 14%,rgba(255,255,255,.25) 15%),rgba(14,165,198,.12)}
.jar span.got{background:radial-gradient(circle at 32% 28%,#fff 0 14%,rgba(255,255,255,.4) 15%),linear-gradient(135deg,#C9F4FF,#FFE1EC);box-shadow:0 3px 8px rgba(10,126,164,.25);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.jar span:not(.got){filter:grayscale(1);opacity:.4}

/* peta sungai */
.map{position:relative;padding:0;margin:0 -6px;direction:ltr}
html[dir="rtl"] .isle .nm{direction:rtl}
.map svg.river{position:absolute;left:0;top:0;width:100%;z-index:0;pointer-events:none}
.stone{position:absolute;width:18px;height:11px;border-radius:50%;background:#B9C3CC;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transform:translate(-50%,-50%);z-index:1}
.irow{position:relative;z-index:2;display:flex;align-items:flex-start;height:165px;padding-top:24px}
.irow.r{justify-content:flex-end}
.irow.c{justify-content:center}
.isle{width:52%;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:inherit}
.irow.c .isle{width:70%}
.bub{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:44px;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.75) 0 15%,transparent 16%),var(--c);
  box-shadow:0 0 0 7px var(--sand),0 9px 0 7px var(--sand-d),0 16px 22px 6px rgba(11,57,84,.25);transition:transform .15s}
.isle .bub::before{content:"🌴";position:absolute;font-size:30px;top:-24px;left:-18px;transform:rotate(-12deg)}
.irow.r .isle .bub::before{left:auto;right:-18px;transform:scaleX(-1) rotate(-12deg)}
.isle:active .bub{transform:translateY(4px) scale(.97)}
.isle .nm{background:var(--glass);border-radius:16px;padding:3px 12px;font-weight:800;font-size:15.5px;text-align:center;line-height:1.25;max-width:100%;box-shadow:var(--sh2);margin-top:12px}
html[dir="rtl"] .isle .nm{line-height:1.6;font-size:15px}
.isle .st{font-size:17px;letter-spacing:1px;min-height:22px}
.st .off{filter:grayscale(1);opacity:.3}
.isle.lock .bub{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6) 0 15%,transparent 16%),#A9BAC6;filter:saturate(.4)}
.isle.lock .bub::after{content:"🔒";position:absolute;font-size:28px;bottom:-8px;right:-10px}
.isle.now .bub{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.07);box-shadow:0 0 0 7px var(--sand),0 9px 0 7px var(--sand-d),0 0 0 18px color-mix(in srgb,var(--c) 28%,transparent)}}
.num{position:absolute;top:-6px;right:-10px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:var(--sh2)}
.perch{position:absolute;width:58px;top:-46px;right:-34px;pointer-events:none;z-index:3}
.irow.r .perch{right:auto;left:-34px}
.final .bub{width:108px;height:108px;font-size:52px;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.8) 0 15%,transparent 16%),conic-gradient(from 200deg,#FF6F91,#FFB347,#FFD166,#34C77B,#0EA5C6,#7B61FF,#FF6F91);
  box-shadow:0 0 0 8px #fff,0 9px 0 8px #D7EEF7,0 16px 22px 8px rgba(11,57,84,.25)}
.final .bub::before{content:"☁️"!important;font-size:38px!important;top:auto!important;bottom:-22px;left:-34px!important;transform:none!important}
.rainbow-top{height:70px;margin:0 auto -30px;width:240px;border-radius:240px 240px 0 0;
  background:radial-gradient(circle at 50% 100%,transparent 0 46%,#7B61FF 46% 52%,#0EA5C6 52% 58%,#34C77B 58% 64%,#FFD166 64% 70%,#FFB347 70% 76%,#FF6F91 76% 82%,transparent 82%);opacity:.75}
.start{position:relative;z-index:2;text-align:center;margin-top:-6px;padding:16px 0 6px}
.start span{display:inline-block;background:linear-gradient(180deg,#F8E2AE,#E2B86A);color:#6B4A12;border-radius:999px;padding:8px 20px;font-weight:800;box-shadow:var(--sh2)}

/* kad umum */
.card{background:var(--card);border-radius:30px;padding:16px;box-shadow:var(--sh);animation:pagein .35s ease both;position:relative}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;border-radius:30px 30px 0 0;background:linear-gradient(90deg,var(--sc,var(--sea)),var(--aqua))}
@keyframes pagein{from{opacity:0;transform:translateY(14px) scale(.98)}}
.shead{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.shead .bub{width:60px;height:60px;font-size:30px;box-shadow:0 0 0 5px var(--sand),0 6px 0 5px var(--sand-d)}
.shead .bub::before{display:none}
.shead h2{margin:0;font-size:clamp(21px,5vw,26px);line-height:1.15;font-weight:800;color:var(--deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .shead h2{color:var(--aqua)}}
html[dir="rtl"] .shead h2{line-height:1.6}
.shead small{display:block;color:var(--muted);font-size:14.5px}

/* titisan kemajuan */
.drops{display:flex;justify-content:center;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.drops i{width:26px;height:32px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;position:relative;background:rgba(14,165,198,.15);box-shadow:inset 0 0 0 2px rgba(14,165,198,.35);transform:rotate(0)}
.drops i::before{content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%);border:7px solid transparent;border-bottom:11px solid rgba(14,165,198,.3);border-top:0}
.drops i.on{background:linear-gradient(180deg,#7FE3F0,#0EA5C6);box-shadow:0 3px 8px rgba(14,165,198,.4);animation:pop .4s both}
.drops i.on::before{border-bottom-color:#7FE3F0}
.drops i.cur{animation:bob 1.4s ease-in-out infinite;box-shadow:inset 0 0 0 3px var(--sea)}

/* kad bacaan */
.rpic{font-size:66px;text-align:center;line-height:1.1;margin:6px 0 4px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.rh{margin:0 0 10px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:clamp(22px,5.4vw,27px);font-weight:800;color:var(--sea-d)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rh{color:var(--aqua)}}
.rtext{font-size:19px;margin:0 0 10px;background:var(--note);border-radius:20px;padding:10px 14px}
.rlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px;counter-reset:n}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--note);border-radius:18px;padding:7px 12px;line-height:1.3;animation:pagein .35s both;animation-delay:calc(var(--i)*80ms)}
html[dir="rtl"] .rlist li{line-height:1.75}
.rlist li::before{counter-increment:n;content:counter(n);flex:none;width:30px;height:32px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:linear-gradient(180deg,var(--aqua),var(--sc));color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}
.rlist.bad li{background:var(--badbg)}
.rlist.bad li::before{content:"!";background:linear-gradient(180deg,#FFB3C0,var(--bad))}
.abox{background:linear-gradient(180deg,#FFFBEA,#FFF3C9);color:#3B2F0B;border-radius:22px;padding:10px 14px;margin:0 0 10px;text-align:center;box-shadow:inset 0 0 0 2px rgba(226,184,106,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .abox{background:linear-gradient(180deg,#3A3418,#2E2912);color:#FFF4D0}}
.abox .ar{display:block;font-size:clamp(23px,6vw,30px);line-height:1.9}
.abox .mk{display:block;font-size:16px;opacity:.85;margin-top:4px}
.abox small{display:block;font-weight:800;font-size:14px;opacity:.75}
.tip{display:flex;gap:8px;align-items:flex-start;background:var(--tip);border-radius:18px;padding:8px 12px;margin:0 0 8px;font-size:17px}
.tip.am{background:var(--am)}
.tip b{flex:none}
.ref{font-size:14px;color:var(--muted);font-weight:800;margin-top:4px}
.navr{display:flex;gap:10px;margin-top:12px}
.navr .btn{flex:1}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:13px;font-size:21px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#3CC8E4,var(--sea) 55%,var(--sea-d));box-shadow:0 8px 18px rgba(10,126,164,.35),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.12);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.alt{background:var(--note);color:var(--deep);text-shadow:none;box-shadow:var(--sh2),inset 0 -3px 0 rgba(10,126,164,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.alt{color:var(--ink)}}
.btn.go{background:linear-gradient(180deg,#5FE39B,var(--ok) 55%,#14955A);box-shadow:0 8px 18px rgba(31,184,106,.35),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.12)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(14,165,198,.25)}
.dots i.on{background:var(--sea);width:26px;border-radius:99px}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(180deg,#FFE29A,var(--sun));font-size:20px;box-shadow:var(--sh2);flex:none}
.say:active{transform:scale(.9)}

/* soalan */
.q{display:flex;gap:10px;align-items:center;margin:4px 0 12px}
.q p{margin:0;flex:1;font-size:clamp(20px,5vw,24px);font-weight:800;line-height:1.3}
html[dir="rtl"] .q p{line-height:1.8}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.cnt{color:var(--muted);text-align:center;margin-top:8px;font-size:16px}

/* PAIP: sambung paip */
.pipes{display:flex;align-items:center;justify-content:center;margin:4px 0 14px;gap:0;direction:ltr}
.tank{width:62px;height:84px;border-radius:14px 14px 18px 18px;background:linear-gradient(180deg,#E9F8FC 0 25%,#5FD3EA 25%,#0EA5C6);box-shadow:inset 0 0 0 3px #9ADCEB,var(--sh2);display:grid;place-items:center;font-size:28px}
.pipe{height:24px;flex:1;max-width:60px;background:linear-gradient(180deg,#D7E3EA,#9FB3BF);position:relative;overflow:hidden}
.pipe::after{content:"";position:absolute;inset:6px 0;background:linear-gradient(90deg,transparent,#7FE3F0,transparent);transform:translateX(-100%);opacity:0}
.pipes.flow .pipe::after{opacity:1;animation:flow .7s linear infinite}
@keyframes flow{to{transform:translateX(100%)}}
.gap{min-width:110px;max-width:48%;min-height:44px;border-radius:12px;border:3px dashed var(--sea);display:grid;place-items:center;padding:4px 10px;font-weight:800;font-size:16px;color:var(--sea-d);text-align:center;line-height:1.2;background:var(--note)}
.pipes.flow .gap{border-style:solid;background:linear-gradient(180deg,#D7E3EA,#B6C7D1);color:#0B3954;animation:pop .35s both}
html[dir="rtl"] .gap{line-height:1.6}
.faucet{font-size:40px;position:relative}
.faucet .dripw{position:absolute;left:8px;top:40px;font-size:22px;opacity:0}
.pipes.flow .faucet .dripw{animation:drip .6s ease-in infinite}
@keyframes drip{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(26px)}}
.pieces{display:grid;gap:12px}
.piece{position:relative;border:0;border-radius:16px;padding:12px 18px;min-height:58px;font-size:clamp(18px,4.8vw,21px);font-weight:800;color:#0B3954;text-align:center;line-height:1.25;
  background:linear-gradient(180deg,#F2F7FA,#C9D8E1 70%,#AFC2CE);box-shadow:0 6px 0 #8BA2B0,0 10px 16px rgba(11,57,84,.18)}
html[dir="rtl"] .piece{line-height:1.7}
.piece::before,.piece::after{content:"";position:absolute;top:50%;width:14px;height:34px;transform:translateY(-50%);border-radius:5px;background:linear-gradient(90deg,#AFC2CE,#E4ECF1,#AFC2CE)}
.piece::before{left:-7px}.piece::after{right:-7px}
.piece:active{transform:translateY(4px);box-shadow:0 2px 0 #8BA2B0}
.piece.leak{background:linear-gradient(180deg,#FFE4E8,#FFC2CC);box-shadow:0 6px 0 #E58A99}
.piece.used{visibility:hidden}
.piece .ar{font-size:1.2em}

/* BALDI: isi baldi */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 14px 7px 8px;background:var(--note);box-shadow:var(--sh2),inset 0 -3px 0 rgba(10,126,164,.12);font-size:16.5px;line-height:1.25;text-align:start}
html[dir="rtl"] .chip{padding:7px 8px 7px 14px;line-height:1.6}
.chip .em{font-size:28px;flex:none}
.chip.sel{background:linear-gradient(180deg,#FFF5C9,var(--sun));transform:translateY(-4px) scale(1.04);box-shadow:0 0 0 3px var(--sea),var(--sh)}
.chip.no{animation:shake .4s}
.bins{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:12px}
.bin{border:0;padding:30px 0 10px;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:16px;line-height:1.25;text-align:center}
html[dir="rtl"] .bin{line-height:1.6}
.pail{position:relative;width:100%;max-width:150px;height:120px;border-radius:10px 10px 34px 34px;
  background:linear-gradient(90deg,rgba(255,255,255,.65),rgba(255,255,255,.2) 40%,rgba(255,255,255,.55));box-shadow:inset 0 0 0 4px var(--bc,#0EA5C6),var(--sh2)}
.pail::before{content:"";position:absolute;left:12%;right:12%;top:-26px;height:46px;border:4px solid #8A9BA8;border-bottom:0;border-radius:50% 50% 0 0}
.pail .lvl{position:absolute;left:4px;right:4px;bottom:4px;border-radius:0 0 30px 30px;height:var(--h,0%);background:linear-gradient(180deg,#9AEAF6,#22B5D3);transition:height .5s}

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[660,.12],[990,.18]]),
  tick: () => tone([[760,.07,"triangle"]]),
  no:   () => tone([[260,.16,"triangle"],[200,.2,"triangle"]]),
  drop: n => tone([[700+(n||0)*60,.05],[1100+(n||0)*60,.08]]),
  flow: () => tone([[420,.09],[560,.09],[740,.09],[980,.16]]),
  pop:  () => tone([[1000,.04,"triangle"],[1500,.05,"triangle"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.3]])
};

/* ---------- Suara (baca teks Rumi) ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g," ... ").replace(/SAW/g,"sallallahu alaihi wasallam").replace(/SWT/g,"subhanahu wa taala"));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .9; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function confetti(n=34){
  const box = document.createElement("div"); box.className="confetti"; box.setAttribute("aria-hidden","true");
  const em = ["💧","🫧","🌈","⭐","💦","🫧"];
  for(let i=0;i<n;i++){ const s=document.createElement("span"); s.textContent=em[i%em.length]; s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(2.2+Math.random()*2)+"s"; s.style.animationDelay=Math.random()*.8+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5200);
}

    <header class="hero">${titis("bob")}<div><h1>${L("Pulau Titisan Suci","ڤولاو تيتيسن سوچي")}</h1>
      <p>${L("Lompat dari pulau ke pulau, belajar bersuci bersama Titis!","لومڤت دري ڤولاو ک ڤولاو، بلاجر برسوچي برسام تيتيس!")}</p></div></header>
    <p class="sttl">🫙 ${L("Balang pelekat saya","بالڠ ڤلقت ساي")}</p>
    <div class="jar">${STATIONS.map(s=>`<span class="${best[s.id]>0?"got":""}" title="${T(s.t)}">${s.sticker}</span>`).join("")}</div>

          <path d="${d}" stroke="#fff" stroke-width="3" fill="none" vector-effect="non-scaling-stroke" stroke-dasharray="10 22" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.4s" repeatCount="indefinite"/></path>

}

      ${openedFinal ? `<p><b>🌈 ${L("Cabaran Pelangi kini dibuka!","چابرن ڤلاڠي کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🏝️ ${L("Kembali ke pulau","کمبالي ک ڤولاو")}</button>
      <button class="btn alt" style="margin-top:12px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>

}

/* ===================== JENIS PERMAINAN ===================== */
const BINC = ["#0EA5C6","#FF6F91","#7B61FF"];
const RC = ["#FF5D73","#FF9F40","#FFC93C","#34C77B","#1FA2E0","#5B6CFF","#9B5DE5"];
const GAMES = {
  /* Sambung paip: pilih kepingan paip yang betul, air mengalir ke pili */
  paip(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0})));
    el.innerHTML = `<div class="pipes" id="pp" aria-hidden="true"><div class="tank">💧</div><div class="pipe"></div><div class="gap" id="gap">?</div><div class="pipe"></div><div class="faucet">🚰<span class="dripw">💧</span></div></div>
      <div class="pieces">${opts.map((o,i)=>`<button class="piece" data-i="${i}">${lab(o.x)}</button>`).join("")}</div>
      <div class="cnt">🔧 ${L("Pilih kepingan paip yang betul supaya air mengalir!","ڤيليه کڤيڠن ڤايڤ يڠ بتول سوڤايا اٴير مڠالير!")}</div>`;
    let done = false;
    el.querySelectorAll(".piece").forEach(b => b.addEventListener("click", () => {
      if(done || b.classList.contains("leak")) return; const o = opts[+b.dataset.i];
      if(o.ok){ done = true; clearHint(); sfx.flow(); $("#gap").innerHTML = lab(o.x); b.classList.add("used"); $("#pp").classList.add("flow"); setTimeout(win, 700); }
      else { b.classList.add("leak"); oops(b, L("Paip itu bocor! Cuba kepingan lain.","ڤايڤ ايت بوچر! چوبا کڤيڠن لاٴين.")); }
    }));
  },

  /* Isi baldi: tekan kad, kemudian tekan baldi yang betul */
  baldi(el, g){
    const items = shuffle(g.items.map((x,i)=>({x,i})));
    const cnt = g.bins.map(()=>0), tot = g.bins.map((_,b)=>g.items.filter(it=>it[2]===b).length);
    let sel = null, placed = 0;
    el.innerHTML = `<div class="tray" id="tray">${items.map(o=>`<button class="chip" data-i="${o.i}"><span class="em" aria-hidden="true">${o.x[0]}</span><span>${T(o.x[1])}</span></button>`).join("")}</div>
      <div class="bins" style="--n:${g.bins.length}">${g.bins.map((b,k)=>`<button class="bin" data-b="${k}" style="--bc:${BINC[k%3]}"><span class="pail"><span class="lvl"></span><span class="ic" aria-hidden="true">${b[0]}</span><span class="k">0</span></span><span>${T(b[1])}</span></button>`).join("")}</div>
      <div class="cnt">👆 ${L("Tekan kad, kemudian tekan baldi.","تکن کد، کمودين تکن بالدي.")}</div>`;
    const ready = on => el.querySelectorAll(".bin").forEach(b=>b.classList.toggle("ready", on));
    el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      el.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));
      if(sel===+c.dataset.i){ sel = null; ready(false); return; }
      sel = +c.dataset.i; c.classList.add("sel"); sfx.tick(); ready(true); speak(RU(g.items[sel][1]));
    }));
    el.querySelectorAll(".bin").forEach(b => b.addEventListener("click", () => {
      if(sel===null){ toast(L("Tekan satu kad dahulu 👆","تکن ساتو کد دهولو 👆")); return; }
      const k = +b.dataset.b, chip = el.querySelector(`.chip[data-i="${sel}"]`);
      if(g.items[sel][2]===k){
        cnt[k]++; placed++; sfx.drop(placed); clearHint(); chip.remove(); sel = null; ready(false);
        b.querySelector(".lvl").style.setProperty("--h", Math.round(cnt[k]/Math.max(1,tot[k])*82)+"%"); b.querySelector(".k").textContent = cnt[k];
        if(placed===g.items.length) setTimeout(win, 400);
      } else {
        b.classList.remove("no"); void b.offsetWidth; b.classList.add("no");
        oops(chip, L("Bukan baldi itu. Cuba baldi yang satu lagi!","بوکن بالدي ايت. چوبا بالدي يڠ ساتو لاڬي!"));
      }
    }));
  },

  /* Basuh anggota: tekan anggota badan budak ikut urutan */
  basuh(el, g){
    let k = 0;
    el.innerHTML = `<div class="body-wrap" style="position:relative">${kidSVG(!!g.lr)}</div><div class="donelist" id="dl"></div>
      <div class="cnt">💦 ${g.order.length>1 ? L("Tekan ikut urutan, yang pertama dahulu!","تکن ايکوت اوروتن، يڠ ڤرتام دهولو!") : L("Tekan anggota yang betul.","تکن اڠڬوتا يڠ بتول.")}</div>`;
    const svg = el.querySelector("svg"), wrap = el.querySelector(".body-wrap");
    svg.addEventListener("click", e => {
      const z = e.target.closest && e.target.closest(".zone"); if(!z || k>=g.order.length) return;
      if(z.classList.contains("wet")) return;
      if(z.dataset.z===g.order[k]){
        k++; sfx.drop(k); clearHint(); z.classList.add("wet");
        const [x,y] = ZP[z.dataset.z];
        z.insertAdjacentHTML("beforeend", `<g class="badge"><circle cx="${x}" cy="${y}" r="12"/><text x="${x}" y="${y+5}" text-anchor="middle">${k}</text></g>`);
        const sp = document.createElement("span"); sp.className = "splash"; sp.textContent = "💦";
        sp.style.left = (x/220*100)+"%"; sp.style.top = (y/330*100)+"%"; wrap.appendChild(sp); setTimeout(()=>sp.remove(), 900);
        $("#dl").insertAdjacentHTML("beforeend", `<span>${k}. ${T(ZN[z.dataset.z])}</span>`);
        speak(RU(ZN[z.dataset.z]));
        if(k===g.order.length) setTimeout(win, 450);
      } else {
        z.classList.remove("no"); void z.getBoundingClientRect(); z.classList.add("no");
        oops(null, g.order.length>1 ? L(`Bukan ${T(ZN[z.dataset.z])}. Anggota ke-${k+1} ialah …? Ingat tertib.`,`بوکن ${T(ZN[z.dataset.z])}. اڠڬوتا ک-${k+1} اياله …؟ ايڠت ترتيب.`) : L(`Itu ${T(ZN[z.dataset.z])}. Cuba lagi!`,`ايت ${T(ZN[z.dataset.z])}. چوبا لاڬي!`));
      }
    });
  },

  /* Curah gayung: tuang air ikut bilangan, kemudian tekan Siap */
  gayung(el, g){
    const MAX = 10; let c = 0, done = false;
    el.innerHTML = `${g.show?`<div class="show">${g.show.map(s=>`<span><b aria-hidden="true">${s[0]}</b>${T(s[1])}</span>`).join("")}</div>`:""}
      <div class="pour"><button class="scoop" id="scoop" aria-label="${L("Tuang air","توڠ اٴير")}">🪣</button><div class="tub" id="tub"><span class="lvl"></span><span class="n" id="cn">0</span></div></div>
      <div class="ctl"><button class="btn alt" id="reset" aria-label="${L("Kosongkan","کوسوڠکن")}">↺</button><button class="btn go" id="okb">✓ ${L("Siap","سياڤ")}</button></div>
      <div class="cnt">🪣 ${L("Tekan gayung untuk menuang. Satu tekan = satu gayung.","تکن ڬايوڠ اونتوق منوڠ. ساتو تکن = ساتو ڬايوڠ.")}</div>`;
    const draw = () => { $("#cn").textContent = c; $("#tub .lvl").style.setProperty("--h", (c/MAX*100)+"%"); };
    $("#scoop").addEventListener("click", () => {
      if(done) return;
      if(c>=MAX){ sfx.no(); return; }
      c++; sfx.drop(c); draw(); clearHint();
      const s = $("#scoop"); s.classList.remove("tilt"); void s.offsetWidth; s.classList.add("tilt");
      const d = document.createElement("span"); d.className = "fall"; d.textContent = "💧"; $("#tub").appendChild(d); setTimeout(()=>d.remove(), 520);
    });
    $("#reset").addEventListener("click", () => { if(done) return; c = 0; draw(); sfx.tick(); });
    $("#okb").addEventListener("click", () => {
      if(done) return;
      if(c===0){ toast(L("Tuang air dahulu 🪣","توڠ اٴير دهولو 🪣")); return; }
      if(c===g.n){ done = true; sfx.flow(); win(); }
      else { oops($("#tub"), c<g.n ? L("Belum cukup! Kosongkan dan kira semula.","بلوم چوکوڤ! کوسوڠکن دان کيرا سمولا.") : L("Terlebih! Kosongkan dan kira semula.","ترلبيه! کوسوڠکن دان کيرا سمولا.")); c = 0; draw(); }
    });
  },

  /* Tali sawat: tangkap benda yang betul semasa ia lalu */
  sawat(el, g){
    const its = shuffle(g.items.map((x,i)=>({x,i}))), need = g.items.filter(x=>x[2]).length; let got = 0;
    const box = (o,dup) => `<button class="box ${dup?"dup":""}" data-i="${o.i}" ${dup?'aria-hidden="true" tabindex="-1"':""}><span class="em" aria-hidden="true">${o.x[0]}</span><span>${T(o.x[1])}</span></button>`;
    el.innerHTML = `<div class="belt-in"><div class="caught" id="caught"><span class="k" id="ck">🧺 0 / ${need}</span></div>
      <div class="belt"><div class="track" style="--dur:${its.length*3.4}s">${its.map(o=>box(o,0)).join("")}${its.map(o=>box(o,1)).join("")}</div></div></div>
      <div class="cnt">👆 ${L("Tekan yang betul semasa ia lalu! Tekan lama untuk berhenti.","تکن يڠ بتول سماس اي لالو! تکن لام اونتوق برهنتي.")}</div>`;
    el.querySelector(".belt").addEventListener("click", e => {
      const b = e.target.closest(".box"); if(!b || b.classList.contains("got") || got>=need) return;
      const it = g.items[+b.dataset.i];
      if(it[2]){
        got++; sfx.pop(); clearHint();
        el.querySelectorAll(`.box[data-i="${b.dataset.i}"]`).forEach(x=>x.classList.add("got"));
        $("#ck").insertAdjacentHTML("beforebegin", `<span class="em" title="${T(it[1])}">${it[0]}</span>`);
        $("#ck").textContent = `🧺 ${got} / ${need}`; speak(RU(it[1]));
        if(got===need) setTimeout(win, 400);
      } else {
        b.classList.remove("no"); void b.offsetWidth; b.classList.add("no");
        oops(null, L(`"${T(it[1])}" bukan jawapannya. Biarkan ia lalu!`,`"${T(it[1])}" بوکن جواڤنڽ. بيارکن اي لالو!`));
      }
    });
  },

  /* Batu loncatan: pilih batu yang betul untuk menyeberang sungai */
  batu(el, g){
    const rows = g.rows.map(r => shuffle([{x:r[0],ok:1},{x:r[1],ok:0}])); let k = 0, busy = false;
    const draw = () => {
      el.innerHTML = `<div class="riverx"><div class="bank end">${k===rows.length?titis("yay").replace('class="titis yay"','class="titis yay" style="width:56px;display:block;margin:0 auto"'):"🏁"} ${L("Seberang sungai","سبرڠ سوڠاي")}</div>
        <div class="srows">${rows.map((r,ri)=>`<div class="srow ${ri<k?"past":ri===k?"cur":"future"}">${r.map(s=>`<button class="stn ${ri<k&&s.ok?"ok":""}" data-r="${ri}" data-ok="${s.ok}" ${ri!==k?"tabindex=\"-1\"":""}>${T(s.x)}${(ri===k-1&&s.ok&&k<rows.length)?`<span class="me">${titis()}</span>`:""}</button>`).join("")}</div>`).join("")}</div>
        <div class="bank beg">${k===0?titis("bob").replace('class="titis bob"','class="titis bob" style="width:54px"'):""} ${L("Mula","مولا")}</div></div>
        <div class="cnt">🪨 ${k<rows.length?`${k+1} / ${rows.length}`:"✓"}</div>`;
    };
    draw();
    el.addEventListener("click", e => {
      const b = e.target.closest(".stn"); if(!b || busy || k>=rows.length || +b.dataset.r!==k) return;
      if(b.dataset.ok==="1"){
        k++; sfx.drop(k); clearHint(); draw();
        if(k===rows.length) setTimeout(win, 450);
      } else {
        busy = true; b.classList.add("sink");
        oops(null, L("Plup! Batu itu tenggelam. Pijak batu yang satu lagi.","ڤلوڤ! باتو ايت تڠڬلم. ڤيجق باتو يڠ ساتو لاڬي."));
        setTimeout(()=>{ b.classList.remove("sink"); busy = false; }, 750);
      }
    });
  },

  /* Buih sabun: pecahkan buih ikut susunan perkataan */
  buih(el, g){
    const isAr = typeof g.parts[0]==="string", txt = p => isAr ? p : T(p);
    const order = mix(g.parts.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="line ${isAr?"ar":""}" id="line" aria-live="polite"></div>
      <div class="bath ${isAr?"ar":""}">${order.map((i,n)=>`<button class="bubl" data-i="${i}" style="animation-delay:${-n*.45}s" ${isAr?'lang="ar"':""}>${txt(g.parts[i])}</button>`).join("")}</div>
      <div class="cnt">🫧 ${isAr ? L("Bacaan Arab bermula dari kanan. Pecahkan perkataan pertama!","باچاٴن عرب برمولا دري کانن. ڤچهکن ڤرکاتاٴن ڤرتام!") : L("Pecahkan perkataan pertama dahulu!","ڤچهکن ڤرکاتاٴن ڤرتام دهولو!")}</div><div id="mk"></div>`;
    el.querySelectorAll(".bubl").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=g.parts.length) return;
      if(txt(g.parts[+b.dataset.i])===txt(g.parts[k])){
        k++; sfx.pop(); clearHint(); b.classList.add("used");
        $("#line").insertAdjacentHTML("beforeend", `<span>${txt(g.parts[+b.dataset.i])}</span>`);
        if(k===g.parts.length){ if(g.mk) $("#mk").innerHTML = `<div class="abox" style="margin-top:12px"><span class="mk">${T(g.mk)}</span></div>`; setTimeout(win, 500); }
      } else { b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); oops(null, L("Bukan buih itu. Perkataan mana yang datang dahulu?","بوکن بوٴيه ايت. ڤرکاتاٴن مان يڠ داتڠ دهولو؟")); }
    }));
  },

  /* Warnakan pelangi: tekan langkah ikut urutan, setiap langkah mewarnakan satu jalur */
  pelangi(el, g){
    const n = g.steps.length, order = mix(g.steps.map((_,i)=>i)); let k = 0;
    const arcs = g.steps.map((_,i)=>{ const r = 140 - i*16; return `<path d="M${160-r} 162 A${r} ${r} 0 0 1 ${160+r} 162" style="--rc:${RC[i%7]}" id="arc${i}"/>`; }).join("");
    el.innerHTML = `<svg class="rbow" viewBox="0 0 320 170" aria-hidden="true">${arcs}<text x="160" y="160" text-anchor="middle" font-size="34">☁️</text></svg>
      <div class="steps">${order.map(i=>`<button class="stp" data-i="${i}"><span class="em" aria-hidden="true">${g.steps[i][0]}</span><span>${T(g.steps[i][1])}</span><span class="no"></span></button>`).join("")}</div>
      <div class="cnt">🌈 ${L("Tekan langkah pertama dahulu!","تکن لڠکه ڤرتام دهولو!")}</div>`;
    el.querySelectorAll(".stp").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || k>=n) return;
      if(+b.dataset.i===k){
        b.style.setProperty("--rc", RC[k%7]); b.classList.add("done"); b.querySelector(".no").textContent = k+1;
        el.querySelector("#arc"+k).classList.add("on"); k++; sfx.drop(k); clearHint();
        if(k===n) setTimeout(win, 450);
      } else { b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); oops(null, L(`Bukan langkah itu. Apakah langkah ke-${k+1}?`,`بوکن لڠکه ايت. اڤاکه لڠکه ک-${k+1}؟`)); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t1-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan pulau sebelumnya dahulu 🔒","سلسايکن ڤولاو سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${NST()} pulau untuk membuka Cabaran Pelangi 🌈`,`سلسايکن سموا ${NST()} ڤولاو اونتوق ممبوک چابرن ڤلاڠي 🌈`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa (selepas tukar tulisan/suara) tanpa mengulang permainan
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
</html>
