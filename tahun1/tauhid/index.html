<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFB627">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/access.js"></script>
<title>Taman Bunga Iman • Tauhid Tahun 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Tauhid Tahun 1: "Taman Bunga Iman" — taman bunga, sarang madu & lebah Bibi =====
   Gaya lembut: tiada garis hitam tebal; kad putih "pelekat" dengan bayang madu yang lembut. */
:root{
  --sky:#FFF4C9; --meadow:#DDF3C4; --bg:#FFFBEF; --card:#FFFFFF; --ink:#4A2E14; --muted:#8A6A48;
  --honey:#FFB627; --honey2:#F08A00; --honeyL:#FFE7A3; --petal:#FF6FA8; --petal2:#FFC2DA; --leaf:#45B36B; --leaf2:#2E8B50;
  --line:#F3D58A; --shadow:rgba(176,112,10,.22); --ok:#2FA35B; --okbg:#E1F7E6; --bad:#E5484D; --badbg:#FFE4E4; --note:#FFF3CF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#2A2240; --meadow:#1F3326; --bg:#17140F; --card:#2A231A; --ink:#FFF3DA; --muted:#D8C29A;
    --line:#5E4A22; --shadow:rgba(0,0,0,.45); --okbg:#173F27; --badbg:#4A2224; --note:#3A2F17; --honeyL:#5A4518; --petal2:#5A2A40;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Grandstander","Comic Sans MS",system-ui,sans-serif;font-size:19px;line-height:1.4;font-weight:500;
  background:
    radial-gradient(circle at 12% 18%,rgba(255,111,168,.18) 0 26px,transparent 27px),
    radial-gradient(circle at 88% 9%,rgba(255,182,39,.28) 0 46px,transparent 47px),
    linear-gradient(180deg,var(--sky) 0,var(--bg) 380px,var(--meadow) 1400px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Grandstander",serif;font-size:20px;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--petal);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 70px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl}
/* bunga kecil terapung di latar */
.petals{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.petals i{position:absolute;font-style:normal;font-size:20px;opacity:.5;animation:sway 7s ease-in-out infinite}
@keyframes sway{50%{transform:translate(14px,-18px) rotate(20deg)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .petals i{opacity:.18}}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:50%;border:0;background:var(--card);display:inline-grid;place-items:center;font-size:21px;font-weight:800;text-decoration:none;color:var(--ink);
  box-shadow:0 4px 12px var(--shadow),inset 0 -3px 0 rgba(0,0,0,.06);padding:0 10px}
.ib:active{transform:scale(.92)}
.pill{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,#FFD25E,var(--honey));color:#5A3400;font-weight:800;box-shadow:0 4px 12px var(--shadow)}

/* tajuk */
.hero{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:30px;padding:12px 16px;box-shadow:0 8px 22px var(--shadow);margin:4px 0 14px;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -20px -26px auto;width:140px;height:90px;opacity:.35;
  background:radial-gradient(circle at 20% 50%,var(--honey) 0 12px,transparent 13px),radial-gradient(circle at 55% 30%,var(--petal) 0 10px,transparent 11px),radial-gradient(circle at 80% 60%,var(--leaf) 0 9px,transparent 10px)}
.hero h1{margin:0;font-size:clamp(25px,6.4vw,32px);line-height:1.1;font-weight:800;background:linear-gradient(90deg,var(--honey2),var(--petal));-webkit-background-clip:text;background-clip:text;color:transparent}
html[dir="rtl"] .hero h1{line-height:1.6}
.hero p{margin:3px 0 0;color:var(--muted);font-size:15.5px;font-weight:700}
.bee{width:86px;height:auto;flex:none;overflow:visible}
.bee .wg{transform-origin:60px 46px;animation:flap .18s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.7)}}
.bee.hover{animation:hover 2.2s ease-in-out infinite}
@keyframes hover{25%{transform:translate(4px,-7px) rotate(4deg)}75%{transform:translate(-4px,-3px) rotate(-4deg)}}
.bee.yay{animation:loop .9s ease}
@keyframes loop{40%{transform:translateY(-16px) rotate(-16deg) scale(1.08)}70%{transform:translateY(-6px) rotate(10deg)}}

/* pasu pelekat */
.sttl{font-weight:800;font-size:15px;margin:0 0 6px;color:var(--muted)}
.bed{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px 8px 0;margin-bottom:16px;border-radius:24px 24px 14px 14px;
  background:linear-gradient(180deg,transparent 58%,#B9774A 58% 100%);}
.bed span{display:flex;flex-direction:column;align-items:center;font-size:clamp(20px,5.6vw,28px);line-height:1}
.bed span::after{content:"";width:80%;height:14px;margin-top:2px;border-radius:2px 2px 8px 8px;background:#D9895A;box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
.bed span:not(.got) b{filter:grayscale(1);opacity:.35}
.bed span.got b{animation:grow .6s cubic-bezier(.2,1.6,.4,1) both}
.bed b{font-weight:400}
@keyframes grow{from{transform:scale(0) translateY(20px)}}

/* PETA: sarang madu di sepanjang laluan lebah */
.garden{position:relative;margin:0 -4px}
.garden svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.garden .trail path{fill:none;stroke:var(--honey2);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;opacity:.75}
.node{position:absolute;width:128px;margin-left:-64px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;color:inherit;z-index:1}
.cell{position:relative;width:104px;height:92px;display:grid;place-items:center;filter:drop-shadow(0 6px 8px var(--shadow))}
.cell::before,.cell::after{content:"";position:absolute;inset:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.cell::before{background:#fff}
.cell::after{inset:6px;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55) 0 14%,transparent 15%),linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.cell .ic{position:relative;z-index:1;font-size:42px;line-height:1}
.node .num{position:absolute;z-index:2;top:-4px;inset-inline-start:2px;width:30px;height:30px;border-radius:50%;background:var(--honey);color:#5A3400;font-weight:800;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 6px var(--shadow)}
.node .nm{background:var(--card);border-radius:14px;padding:2px 10px;font-weight:800;font-size:14.5px;text-align:center;line-height:1.2;max-width:100%;box-shadow:0 3px 8px var(--shadow)}
html[dir="rtl"] .node .nm{line-height:1.6;font-size:14.5px}
.node .st{font-size:15px;min-height:20px;letter-spacing:1px}
.node .st .off{filter:grayscale(1);opacity:.3}
.node.lock .cell::after{background:linear-gradient(160deg,#E8E2D2,#C9C0AA)}
.node.lock .ic{filter:grayscale(1);opacity:.55}
.node.lock .cell .lk{position:absolute;z-index:2;bottom:2px;inset-inline-end:4px;font-size:24px}
.node.now .cell{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.node:active .cell{transform:scale(.93)}
.node .perch{position:absolute;z-index:3;width:64px;top:-30px;inset-inline-end:-18px;pointer-events:none}
.node .perch .bee{width:64px}
.hive .cell{width:124px;height:110px}
.hive .cell::after{background:repeating-linear-gradient(180deg,#FFC93C 0 16px,#F5A300 16px 20px)}
.hive .ic{font-size:50px}
.start{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:800;color:var(--leaf2);font-size:18px}
.start::before{content:"🌼🌱🌷🌱🌼";display:block;font-size:24px;letter-spacing:6px}

/* kad */
.card{background:var(--card);border-radius:30px;padding:16px;box-shadow:0 10px 26px var(--shadow);animation:rise .35s ease both;position:relative}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shead .cell{width:66px;height:58px}
.shead .cell .ic{font-size:28px}
.shead h2{margin:0;font-size:clamp(21px,5.2vw,26px);line-height:1.15;font-weight:800}
html[dir="rtl"] .shead h2{line-height:1.6}
.shead small{display:block;color:var(--muted);font-weight:700;font-size:14.5px}

/* balang madu: kemajuan */
.prog{position:relative;height:30px;margin:0 6px 14px;background:var(--honeyL);border-radius:999px;box-shadow:inset 0 3px 6px rgba(0,0,0,.08)}
.prog .hon{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(180deg,#FFD25E,var(--honey) 60%,var(--honey2));transition:width .5s}
html[dir="rtl"] .prog .hon{inset:0 0 0 auto}
.prog .fl{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px}
.prog .bz{position:absolute;top:50%;width:46px;transform:translate(-50%,-58%);transition:left .5s,right .5s}
.prog .bz .bee{width:46px}

/* kad bacaan */
.rpic{font-size:64px;text-align:center;line-height:1.1;margin:0 0 4px;animation:grow .55s cubic-bezier(.2,1.6,.4,1) both}
.rh{margin:0 0 10px;text-align:center;font-size:clamp(22px,5.4vw,27px);font-weight:800;color:var(--honey2);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.rtext{font-weight:700;font-size:19px;margin:0 0 10px}
.rlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px;counter-reset:n}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--note);border-radius:18px;padding:7px 12px;font-weight:700;line-height:1.3;animation:rise .35s both;animation-delay:calc(var(--i)*80ms)}
html[dir="rtl"] .rlist li{line-height:1.75}
.rlist li::before{counter-increment:n;content:counter(n);flex:none;width:30px;height:28px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:var(--sc);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}
.abox{background:linear-gradient(180deg,#FFF8E1,#FFEFC2);color:#4A2E14;border-radius:22px;padding:10px 14px;margin:0 0 10px;text-align:center;box-shadow:inset 0 0 0 3px #FFE08A}
.abox .ar{display:block;font-size:clamp(23px,6.2vw,30px);line-height:2}
.abox .mk{display:block;font-weight:700;font-size:16px;color:#7A5A32;margin-top:4px}
.abox small{display:block;font-weight:800;font-size:14px;color:#9A7440}
.tip{display:flex;gap:8px;align-items:flex-start;background:#E8F6FF;border-radius:18px;padding:8px 12px;margin:0 0 8px;font-weight:700;font-size:17px;color:#1C4466}
.tip.am{background:#FFEAF3;color:#6A1B3C}
.tip b{flex:none}
.ref{font-size:14px;color:var(--muted);font-weight:800;margin-top:6px}
.navr{display:flex;gap:8px;margin-top:12px}
.navr .btn{flex:1}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:13px;font-size:21px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#FFC94A,var(--honey2));box-shadow:0 6px 14px var(--shadow),inset 0 -5px 0 rgba(0,0,0,.14);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.alt{background:var(--card);color:var(--ink);text-shadow:none;box-shadow:0 4px 12px var(--shadow),inset 0 0 0 3px var(--line)}
.btn.go{background:linear-gradient(180deg,#5BCB7E,var(--leaf2))}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--petal);transform:scale(1.25)}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:var(--petal2);font-size:20px;box-shadow:0 3px 8px var(--shadow);flex:none}
.say:active{transform:scale(.9)}

/* soalan */
.q{display:flex;gap:10px;align-items:center;margin:0 0 12px}
.q p{margin:0;flex:1;font-size:clamp(20px,5vw,24px);font-weight:800;line-height:1.3}
html[dir="rtl"] .q p{line-height:1.8}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.cnt{font-weight:800;color:var(--muted);text-align:center;margin-top:10px;font-size:16px}
.hint{margin-top:10px;background:var(--badbg);border-radius:18px;padding:7px 12px;font-weight:700;animation:pop .3s both}

/* NEKTAR: Bibi terbang ke bunga */
.meadow{position:relative;min-height:330px;border-radius:26px;overflow:hidden;padding:96px 6px 10px;display:flex;justify-content:space-around;align-items:flex-end;gap:4px;
  background:radial-gradient(circle at 86% 14%,#FFF2A8 0 26px,transparent 27px),linear-gradient(180deg,#BFE9FF 0,#E8F7FF 52%,#8FD48A 52%,#5DB862 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .meadow{background:radial-gradient(circle at 86% 14%,#FFF2A8 0 20px,transparent 21px),linear-gradient(180deg,#3C4C7A 0,#566A9E 52%,#2F6A3A 52%,#244F2C 100%)}}
.meadow .flyer{position:absolute;left:8px;top:8px;width:74px;transition:left .6s ease,top .6s ease;z-index:3;pointer-events:none}
html[dir="rtl"] .meadow .flyer{left:auto;right:8px}
.meadow .flyer .bee{width:74px}
.flw{flex:1 1 0;max-width:33%;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;animation:sprout .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*.12s)}
@keyframes sprout{from{transform:translateY(60px) scale(.5);opacity:0}}
.flw .hd{width:84px;height:84px;display:block;transition:transform .3s}
.flw .stem{width:6px;height:var(--h,40px);background:var(--leaf2);border-radius:3px;position:relative}
.flw .stem::before{content:"";position:absolute;top:40%;left:4px;width:20px;height:11px;border-radius:0 50% 0 50%;background:var(--leaf)}
.flw .lb{margin-top:-2px;background:var(--card);border-radius:16px;padding:6px 8px;font-weight:800;font-size:clamp(14px,3.9vw,17px);line-height:1.2;text-align:center;box-shadow:0 4px 10px var(--shadow);min-height:48px;display:grid;place-items:center;width:100%}
html[dir="rtl"] .flw .lb{line-height:1.6}
.flw .lb .ar{font-size:1.3em;line-height:1.6}
.flw:active .hd{transform:scale(.9)}
.flw.sip .hd{animation:spin2 1s ease}
@keyframes spin2{to{transform:rotate(360deg) scale(1.1)}}
.flw.sip .lb{background:var(--okbg)}
.flw.droop .hd{transform:rotate(25deg) translateY(10px);filter:grayscale(.6)}

/* SARANG: isi sel madu */
.comb,.pool2{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px}
.comb{background:var(--note);border-radius:24px;padding:12px 6px;margin-bottom:12px}
.hx{position:relative;width:calc(50% - 6px);min-height:78px;border:0;padding:8px 18px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:800;font-size:15.5px;line-height:1.2;
  clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);background:#fff;color:#4A2E14}
html[dir="rtl"] .hx{line-height:1.6}
.hx .em{font-size:24px;flex:none}
.hx.ar{font-size:clamp(19px,5.2vw,24px);line-height:1.7;font-family:"Amiri",serif}
.comb .hx{background:repeating-linear-gradient(45deg,#FFE9A8 0 6px,#FFF3CC 6px 12px);color:#B98A2E}
.comb .hx .n{font-size:24px;opacity:.7}
.comb .hx.full{background:linear-gradient(180deg,#FFD25E,#FFB627);color:#4A2E14;animation:pop .4s both}
.pool2 .hx{background:linear-gradient(180deg,#fff,#FFF6DC);box-shadow:0 4px 0 #EBCB7A;filter:drop-shadow(0 3px 4px var(--shadow))}
.pool2 .hx:active{transform:scale(.94)}
.pool2 .hx.used{visibility:hidden}
.comb.rtl{direction:rtl}

/* KEMBANG: kuntum betul mekar */
.buds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bud{border:0;border-radius:24px;background:var(--note);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:16px;line-height:1.25;text-align:center;box-shadow:0 4px 10px var(--shadow);transition:background .3s}
html[dir="rtl"] .bud{line-height:1.7}
.bud .em{font-size:40px;line-height:1;transition:transform .4s}
.bud.open{background:var(--okbg)}
.bud.open .em{animation:bloom .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes bloom{from{transform:scale(.2) rotate(-90deg)}}
.bud.wilt{background:var(--badbg);opacity:.7}
.bud.wilt .em{transform:rotate(20deg)}
.bud:active{transform:scale(.96)}

/* LANGIT: siang / malam */
.skybox{position:relative;height:300px;border-radius:26px;overflow:hidden;transition:background .6s;
  background:linear-gradient(180deg,#8FD3FF 0,#D8F1FF 64%,#9DD98B 64%,#6CBF62 100%)}
.skybox.night{background:radial-gradient(circle,#fff 1px,transparent 1.6px) 0 0/38px 34px,linear-gradient(180deg,#1C1F4A 0,#3B3F7A 64%,#264A33 64%,#1D3A27 100%)}
.sk{position:absolute;width:64px;height:64px;border:0;border-radius:50%;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 3px rgba(255,255,255,.75);font-size:38px;display:grid;place-items:center;animation:tw 2s ease-in-out infinite}
.sk span{filter:grayscale(1) brightness(1.3);opacity:.45}
@keyframes tw{50%{transform:scale(1.08)}}
.sk.found{animation:none;background:rgba(255,255,255,.55);box-shadow:0 0 0 4px #FFE066}
.sk.found span{filter:none;opacity:1;animation:pop .4s both}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.toggle button{border:0;border-radius:999px;padding:10px;font-weight:800;font-size:19px;background:var(--card);box-shadow:0 4px 10px var(--shadow),inset 0 0 0 3px var(--line)}
.toggle button.on{background:linear-gradient(180deg,#FFD25E,var(--honey));color:#4A2E14;box-shadow:0 4px 10px var(--shadow)}
.toggle button.on.mn{background:linear-gradient(180deg,#6B6FD8,#3B3F9A);color:#fff}
.facts{display:grid;gap:6px;margin-top:10px}
.facts div{background:var(--okbg);border-radius:14px;padding:6px 12px;font-weight:700;animation:pop .4s both}

/* PASU: tanam benih */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.seed{border:0;border-radius:18px;background:var(--note);padding:8px 12px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 10px var(--shadow);line-height:1.25}
html[dir="rtl"] .seed{line-height:1.7}
.seed .em{font-size:26px}
.seed.sel{background:var(--petal2);transform:translateY(-4px);box-shadow:0 0 0 3px var(--petal),0 8px 14px var(--shadow)}
.seed.used{display:none}
.pots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pot{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.pot .gr{min-height:44px;display:flex;flex-wrap:wrap;justify-content:center;font-size:24px;line-height:1}
.pot .gr span{animation:grow .5s both}
.pot .bd{width:100%;min-height:104px;padding:16px 8px 10px;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);background:linear-gradient(180deg,#E99A62,#C8693A);color:#fff;font-weight:800;font-size:16px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
html[dir="rtl"] .pot .bd{line-height:1.7}
.pot .bd .em{font-size:30px}
.pot:active .bd{transform:scale(.96)}

/* KELOPAK: kira kelopak */
.blooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bloom{border:0;border-radius:24px;background:var(--note);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 10px var(--shadow)}
.bloom svg{width:100%;max-width:110px;height:auto}
.bloom b{font-size:26px;min-height:34px}
.bloom.right{background:var(--okbg)}
.bloom.right svg{animation:spin2 1s ease}
.bloom:active{transform:scale(.95)}

/* BAYANG: cari bayang */
.who{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--note);border-radius:22px;padding:8px 12px;margin-bottom:12px;font-weight:800;font-size:22px;animation:pop .3s both}
.shadows{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shd{border:0;border-radius:26px;background:var(--card);box-shadow:0 4px 12px var(--shadow),inset 0 0 0 3px var(--line);padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:118px;justify-content:center}
.shd .em{font-size:62px;line-height:1.1;filter:brightness(0);opacity:.72;transition:filter .4s,opacity .4s}
.shd small{font-weight:800;font-size:15px;min-height:22px}
.shd.lit{background:var(--okbg)}
.shd.lit .em{filter:none;opacity:1;animation:pop .45s both}
.shd:active{transform:scale(.95)}

/* maklum balas */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .3s ease both}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:680px;margin:0 auto;background:var(--card);border-radius:30px 30px 26px 26px;box-shadow:0 -6px 28px var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--honey)}
.fb .row1{display:flex;gap:10px;align-items:center}
.fb .bee{width:72px}
.fb strong{display:block;font-size:24px;color:var(--ok);font-weight:800}
.fb p{margin:0;font-weight:700;font-size:17px;line-height:1.35}
html[dir="rtl"] .fb p{line-height:1.8}

/* keputusan */
.res{text-align:center}
.res .bee{width:132px;margin:0 auto;display:block}
.res .stars{font-size:56px;letter-spacing:6px;line-height:1.1}
.res .stars span{display:inline-block;animation:grow .5s cubic-bezier(.2,1.6,.4,1) both}
.res .stars .off{filter:grayscale(1);opacity:.25}
.res h2{margin:4px 0;font-size:32px;color:var(--honey2);font-weight:800}
.res p{margin:0 0 8px;color:var(--muted);font-weight:700}
.gotst{display:inline-flex;align-items:center;gap:10px;background:var(--note);border-radius:22px;padding:8px 16px;font-weight:800;margin:6px 0 10px}
.gotst span{font-size:44px;animation:grow 1s cubic-bezier(.2,1.6,.4,1) both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[587,.12],[880,.2]]),
  tick: () => tone([[784,.08,"triangle"]]),
  no:   () => tone([[240,.16,"sawtooth"],[200,.2,"sawtooth"]]),
  buzz: () => tone([[300,.06,"sawtooth"],[340,.06,"sawtooth"],[300,.06,"sawtooth"]]),
  bloom:() => tone([[660,.07,"triangle"],[990,.1,"triangle"]]),
  win:  () => tone([[523,.12],[659,.12],[784,.12],[988,.12],[1175,.3]])
};

/* ---------- Suara (baca teks Rumi) ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g," ... ").replace(/SAW/g,"sallallahu alaihi wasallam").replace(/SWT/g,"subhanahu wa taala"));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .9; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

const langBtn = () => `<button class="ib" data-act="lang" aria-label="${L("Tukar ke tulisan Jawi","توکر ک توليسن رومي")}">${isJ()?"Rumi":'<span style="font-family:Noto Naskh Arabic">جاوي</span>'}</button>`;

const starRow = n => [1,2,3].map(i=>`<span class="${i<=n?"":"off"}">⭐</span>`).join("");
const unlocked = id => id===1 || (best[id-1]||0)>0;
const allDone = () => STATIONS.every(s => (best[s.id]||0)>0);
const FINAL_T = ["Cabaran Madu Emas","چابرن مادو امس"];

/* ===================== PETA: LALUAN SARANG MADU ===================== */
let S = null;
function renderMap(){

  document.title = L("Taman Bunga Iman • Tauhid Tahun 1","تامن بوڠا ايمان • توحيد تاهون 1");

  const N = STATIONS.length, STEP = 132, TOPY = 86, H = TOPY + 170 + N*STEP;

      <span class="cell"><span class="ic">${s.icon}</span>${lock?'<span class="lk">🔒</span>':""}</span><span class="num">${s.id}</span>
      ${cur===s.id?`<span class="perch">${bee("hover")}</span>`:""}

  };
  const fOpen = allDone(), fSt = best.final||0;
  app.innerHTML = `
    <div class="top"><a class="ib" href="../index.html" aria-label="${L("Kembali ke Tahun 1","کمبالي ک تاهون 1")}">${BACK()}</a><span class="sp"></span>
      <span class="pill" aria-label="${totalStars()} ${L("bintang","بينتڠ")}">⭐ ${totalStars()}</span>${voiceBtn()}${langBtn()}</div>
    <header class="hero">${bee("hover")}<div><h1>${L("Taman Bunga Iman","تامن بوڠا ايمان")}</h1>
      <p>${L("Terbang bersama Bibi si lebah. Kenali Allah, tanam bunga iman!","تربڠ برسام بيبي سي لبه. کنالي الله، تانم بوڠا ايمان!")}</p></div></header>
    <p class="sttl">🪴 ${L("Taman pelekat saya","تامن ڤلقت ساي")}</p>
    <div class="bed">${STATIONS.map(s=>`<span class="${best[s.id]>0?"got":""}" title="${esc(T(s.t))}"><b>${best[s.id]>0?s.sticker:"🌱"}</b></span>`).join("")}</div>
    <section class="garden" aria-label="${L("Peta stesen","ڤتا ستيسن")}" style="height:${H}px">
      <svg class="trail" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>
      <button class="node hive ${fOpen?"":"lock"} ${cur==="final"?"now":""}" data-act="${fOpen?"final":"flocked"}" style="--c:#FFB627;left:50%;top:${TOPY-56}px">
        <span class="cell"><span class="ic">🍯</span>${fOpen?"":'<span class="lk">🔒</span>'}</span>
        ${cur==="final"?`<span class="perch">${bee("hover")}</span>`:""}
        <span class="nm">${T(FINAL_T)}</span><span class="st">${fSt?starRow(fSt):""}</span></button>
      ${STATIONS.map((s,i)=>node(s,pos[i])).join("")}

    </section>`;
  const now = app.querySelector(".node.now");
  if(now) setTimeout(()=>{ try{ now.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){} }, 250);
}

/* ===================== STESEN: BACA ===================== */

const head = () => `<div class="top"><button class="ib" data-act="map" aria-label="${L("Kembali ke taman","کمبالي ک تامن")}">${BACK()}</button><span class="sp"></span>${voiceBtn()}${langBtn()}</div>

function readSpeech(c){

      ${c.am?`<div class="tip am"><b>🌱</b><span><b>${L("Amalkan:","عملکن:")}</b> ${T(c.am)}</span></div>`:""}
      ${c.ar?`<div class="abox"><span class="ar" lang="ar">${c.ar}</span>${c.mk?`<span class="mk">${T(c.mk)}</span>`:""}${c.src?`<small>(${T(c.src)})</small>`:""}</div>`:""}
      <div class="ref">📖 ${L("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</div>
      <div class="navr">
        <button class="btn alt" data-act="rprev" ${S.ri?"":"disabled"} aria-label="${L("Sebelum","سبلوم")}" style="flex:0 0 64px">${BACK()}</button>
        <button class="btn ${last?"go":""}" data-act="rnext">${last ? "🐝 "+L("Jom main!","جوم ماٴين!") : L("Seterusnya","ستروسڽ")+" ▶"}</button>

/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, pct = k/n*100, side = isJ() ? "right" : "left";
  const fl = S.games.map((_,i)=> i>=k ? `<span class="fl" style="${side}:${(i+.5)/n*100}%;${isJ()?"transform:translate(50%,-50%)":""}">🌼</span>` : "").join("");
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="hon" style="width:${pct}%"></span>${fl}
    <span class="bz" style="${side}:${Math.max(4,pct)}%;${isJ()?"transform:translate(50%,-58%) scaleX(-1)":""}">${bee()}</span></div>`;
}
function renderPlay(){
  hush();
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
function clearHint(){ const h=$("#hint"); if(h) h.innerHTML=""; }
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🐝 ${hint || L("Hmm, cuba lagi!","همم، چوبا لاڬي!")}</div>`; }
}
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  if(document.querySelector(".fb")) return;
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${bee("yay")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.res = { stars, first: !prev, openedFinal: !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Iman kamu berbunga indah.","چمرلڠ! ايمان کامو بربوڠا اينده."] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom main lagi.","شاباس کران منچوبا! جوم ماٴين لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${bee("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Bunga baharu untuk taman kamu!","بوڠا بهارو اونتوق تامن کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🍯 ${L("Cabaran Madu Emas kini dibuka!","چابرن مادو امس کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🌻 ${L("Kembali ke taman","کمبالي ک تامن")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN ===================== */
const FCOL = ["#FF6FA8","#B07CFF","#FF9F43","#4DABF7","#FF5D5D"];
const GAMES = {
  /* Bibi terbang ke bunga jawapan yang betul */
  nektar(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0})));
    el.innerHTML = `<div class="meadow"><span class="flyer">${bee("hover")}</span>
      ${opts.map((o,i)=>`<button class="flw" data-i="${i}" style="--i:${i};--h:${[46,26,38][i%3]}px">${flowerSVG(6+i%2, FCOL[(i+S.gi)%FCOL.length])}<span class="stem"></span><span class="lb">${TX(o.x)}</span></button>`).join("")}</div>
      <div class="cnt">🐝 ${L("Tolong Bibi! Tekan bunga yang betul.","تولوڠ بيبي! تکن بوڠا يڠ بتول.")}</div>`;
    let done = false;
    const flyer = el.querySelector(".flyer");
    el.querySelectorAll(".flw").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = opts[+b.dataset.i];
      if(o.ok){
        done = true; sfx.buzz(); b.classList.add("sip");
        const hd = b.querySelector(".hd");
        const t = hd || b;
        flyer.style.right = "auto"; flyer.style.left = (t.offsetLeft + t.offsetWidth/2 - 37) + "px";
        flyer.style.top = Math.max(0, t.offsetTop - 44) + "px";
        setTimeout(win, 650);
      } else { b.classList.add("droop"); oops(b, L("Bukan bunga itu. Cuba lagi!","بوکن بوڠا ايت. چوبا لاڬي!")); setTimeout(()=>b.classList.remove("droop"),900); }
    }));
  },

  /* Isi sel sarang madu ikut urutan */
  sarang(el, g){
    const ar = !!g.ar, n = g.items.length;
    const lab = i => ar ? g.items[i] : `<span class="em">${g.items[i][0]}</span><span>${T(g.items[i][1])}</span>`;
    const order = mix(g.items.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="comb ${ar?"rtl":""}" aria-live="polite">${g.items.map((_,i)=>`<div class="hx ${ar?"ar":""}" data-c="${i}"><span class="n">${i+1}</span></div>`).join("")}</div>
      <div class="pool2">${order.map(i=>`<button class="hx ${ar?"ar":""}" data-i="${i}" ${ar?'lang="ar"':""}>${lab(i)}</button>`).join("")}</div>
      <div class="cnt">🍯 ${ar ? L("Mula dari kanan: tekan bahagian pertama dahulu.","مولا دري کانن: تکن بهاڬين ڤرتام دهولو.") : L("Tekan ikut urutan: yang pertama dahulu!","تکن ايکوت اوروتن: يڠ ڤرتام دهولو!")}</div>`;
    el.querySelectorAll(".pool2 .hx").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=n) return;
      if(+b.dataset.i===k){
        const cell = el.querySelector(`.comb .hx[data-c="${k}"]`);
        cell.innerHTML = lab(k); cell.classList.add("full"); if(ar) cell.setAttribute("lang","ar");
        b.classList.add("used"); k++; sfx.tick(); clearHint();
        if(k===n) setTimeout(win, 400);
      } else oops(b, L(`Bukan yang itu. Cari sel nombor ${k+1}.`,`بوکن يڠ ايت. چاري سل نومبور ${k+1}.`));
    }));
  },

  /* Mekarkan kuntum kenyataan yang betul sahaja */
  kembang(el, g){
    const items = shuffle(g.items), need = items.filter(x=>x[1]).length; let k = 0;
    el.innerHTML = `<div class="buds">${items.map((x,i)=>`<button class="bud" data-i="${i}" data-v="${x[1]}"><span class="em">🌱</span><span>${T(x[0])}</span></button>`).join("")}</div>
      <div class="cnt" id="kc">🌸 0 / ${need}</div>`;
    el.querySelectorAll(".bud").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("open") || b.classList.contains("wilt") || k>=need) return;
      if(+b.dataset.v===1){
        k++; sfx.bloom(); b.classList.add("open"); b.querySelector(".em").textContent = ["🌸","🌼","🌷","🌺","🌻"][k%5]; clearHint();
        el.querySelector("#kc").textContent = `🌸 ${k} / ${need}`;
        if(k===need) setTimeout(win, 500);
      } else { b.classList.add("wilt"); b.querySelector(".em").textContent = "🥀"; oops(b, L("Kenyataan itu salah, jadi ia layu. Cari yang betul!","کڽاتاٴن ايت ساله، جادي اي لايو. چاري يڠ بتول!")); }
    }));
  },

  /* Siang dan malam: cari semua ciptaan Allah */
  langit(el, g){
    const POS = { day:[[10,10],[70,16],[40,62],[78,64],[14,66]], night:[[12,8],[66,12],[40,30],[78,58],[18,60]] };
    const all = [...g.day.map((x,i)=>({x,m:"day",i})), ...g.night.map((x,i)=>({x,m:"night",i}))];
    let mode = "day", found = 0;
    el.innerHTML = `<div class="skybox" id="sky">${all.map((o,j)=>`<button class="sk" data-j="${j}" data-m="${o.m}" style="left:${POS[o.m][o.i][0]}%;top:${POS[o.m][o.i][1]}%" aria-label="${L("Cari","چاري")} ${j+1}"><span>${o.x[0]}</span></button>`).join("")}</div>
      <div class="toggle"><button data-mode="day" class="on">☀️ ${L("Siang","سياڠ")}</button><button data-mode="night" class="mn">🌙 ${L("Malam","مالم")}</button></div>
      <div class="cnt" id="lc">✨ 0 / ${all.length}</div><div class="facts" id="facts"></div>`;
    const sky = el.querySelector("#sky");
    const show = () => {
      sky.classList.toggle("night", mode==="night");
      el.querySelectorAll(".sk").forEach(b => b.style.display = b.dataset.m===mode ? "" : "none");
      el.querySelectorAll(".toggle button").forEach(b => b.classList.toggle("on", b.dataset.mode===mode));
    };
    el.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; sfx.tick(); show(); }));
    el.querySelectorAll(".sk").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("found")) return;
      b.classList.add("found"); found++; sfx.bloom();
      const f = all[+b.dataset.j].x;
      $("#facts").insertAdjacentHTML("beforeend", `<div>${f[0]} ${T(f[1])}</div>`); speak(RU(f[1]));
      el.querySelector("#lc").textContent = `✨ ${found} / ${all.length}`;
      const left = all.filter((o,j)=>o.m===mode && !el.querySelector(`.sk[data-j="${j}"]`).classList.contains("found")).length;
      if(found===all.length) setTimeout(win, 700);
      else if(!left) toast(mode==="day" ? L("Hebat! Sekarang tekan 🌙 Malam.","هيبت! سکارڠ تکن 🌙 مالم.") : L("Hebat! Sekarang tekan ☀️ Siang.","هيبت! سکارڠ تکن ☀️ سياڠ."));
    }));
    show();
  },

  /* Pilih biji benih, tanam dalam pasu yang betul */
  pasu(el, g){
    const seeds = shuffle(g.seeds.map((s,i)=>({s,i}))); let sel = null, k = 0;
    el.innerHTML = `<div class="tray">${seeds.map(o=>`<button class="seed" data-i="${o.i}"><span class="em">${o.s[0]}</span><span>${T(o.s[1])}</span></button>`).join("")}</div>
      <div class="pots">${g.pots.map((p,j)=>`<button class="pot" data-p="${j}"><span class="gr" id="gr${j}"></span><span class="bd"><span class="em">${p[0]}</span>${T(p[1])}</span></button>`).join("")}</div>
      <div class="cnt">🌱 ${L("1. Tekan biji benih  2. Tekan pasu","1. تکن بيجي بنيه  2. تکن ڤاسو")}</div>`;
    el.querySelectorAll(".seed").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".seed").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; sfx.tick(); speak(RU(g.seeds[sel][1]));
    }));
    el.querySelectorAll(".pot").forEach(p => p.addEventListener("click", () => {
      if(sel==null){ toast(L("Pilih biji benih dahulu 🌱","ڤيليه بيجي بنيه دهولو 🌱")); return; }
      const s = g.seeds[sel];
      if(s[2]===+p.dataset.p){
        el.querySelector(`.seed[data-i="${sel}"]`).classList.add("used");
        el.querySelector("#gr"+p.dataset.p).insertAdjacentHTML("beforeend", `<span>${["🌷","🌸","🌼","🌻","🌺"][k%5]}</span>`);
        sel = null; k++; sfx.bloom(); clearHint();
        if(k===g.seeds.length) setTimeout(win, 450);
      } else oops(p, L("Bukan pasu itu. Fikir lagi!","بوکن ڤاسو ايت. فکير لاڬي!"));
    }));
  },

  /* Kira kelopak: pilih bunga yang betul */
  kelopak(el, g){
    const opts = shuffle(g.opts); let done = false;
    el.innerHTML = `<div class="blooms">${opts.map((n,i)=>`<button class="bloom" data-n="${n}" aria-label="${L("Bunga","بوڠا")} ${i+1}">${flowerSVG(n, FCOL[(i+2)%FCOL.length])}<b>?</b></button>`).join("")}</div>
      <div class="cnt">🌸 ${L("Kira kelopak setiap bunga.","کيرا کلوڤق ستياڤ بوڠا.")}</div>`;
    el.querySelectorAll(".bloom").forEach(b => b.addEventListener("click", () => {
      if(done) return;
      if(+b.dataset.n===g.n){ done = true; b.classList.add("right"); b.querySelector("b").textContent = g.n; sfx.bloom(); setTimeout(win, 500); }
      else { b.querySelector("b").textContent = b.dataset.n; oops(b, L(`Bunga itu ada ${b.dataset.n} kelopak. Cuba lagi!`,`بوڠا ايت اد ${b.dataset.n} کلوڤق. چوبا لاڬي!`)); }
    }));
  },

  /* Cari bayang yang sepadan */
  bayang(el, g){
    const ask = shuffle(g.items.map((_,i)=>i)), grid = mix(g.items.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="who" id="who" data-k="${ask[0]}"></div>
      <div class="shadows">${grid.map(i=>`<button class="shd" data-k="${i}" aria-label="${L("Bayang","بايڠ")}"><span class="em">${g.items[i][0]}</span><small></small></button>`).join("")}</div>
      <div class="cnt" id="bc">🔦 0 / ${g.items.length}</div>`;
    const who = el.querySelector("#who");
    const ask1 = () => { const it = g.items[ask[k]][1]; who.dataset.k = ask[k]; who.innerHTML = `🔎 ${L("Mana","مان")} <b>${T(it)}</b>? ${sayBtn(RU(it))}`; who.style.animation="none"; void who.offsetWidth; who.style.animation=""; };
    ask1();
    el.querySelectorAll(".shd").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("lit") || k>=ask.length) return;
      if(+b.dataset.k===ask[k]){
        b.classList.add("lit"); b.querySelector("small").textContent = T(g.items[ask[k]][1]); sfx.bloom(); clearHint(); k++;
        el.querySelector("#bc").textContent = `🔦 ${k} / ${g.items.length}`;
        if(k===ask.length){ who.innerHTML = "🌟"; setTimeout(win, 450); } else { ask1(); speak(RU(g.items[ask[k]][1])); }
      } else oops(b, L("Bukan bayang itu. Lihat bentuknya!","بوکن بايڠ ايت. ليهت بنتوقڽ!"));
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t1-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan stesen sebelumnya dahulu 🔒","سلسايکن ستيسن سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} stesen untuk membuka Cabaran Madu Emas 🍯`,`سلسايکن سموا ${STATIONS.length} ستيسن اونتوق ممبوک چابرن مادو امس 🍯`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
