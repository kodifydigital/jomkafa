<title>Belon Udara Hafiz • Hafazan Tahun 1</title>

<style>
/* ===== Hafazan Tahun 1: "Belon Udara Hafiz" — langit fajar, belon naik melepasi awan, wau Layang ===== */
:root{
  --dawn1:#3B3470; --dawn2:#8E7CC3; --dawn3:#FF9A8B; --dawn4:#FFD27F; --sun:#FFC94D;
  --bg:#FFF6EE; --card:#FFFFFF; --ink:#33285C; --muted:#6E6490; --line:#33285C;
  --brand:#FF7A59; --brand2:#E2583A; --cloud:#FFFFFF; --cloud2:#E9E3FF;
  --ok:#22A06B; --okbg:#DDF6EA; --bad:#E5484D; --badbg:#FFE3E3; --note:#FFF1D6; --night:#25204A;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1C1838; --card:#2A2550; --ink:#F4EEFF; --muted:#BDB3E6; --line:#120F2A; --cloud:#3A3468; --cloud2:#4A4380;
    --okbg:#1E4A3A; --badbg:#5A2430; --note:#4A3A22; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{font-family:"Mali",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--dawn1) 0,var(--dawn2) 260px,var(--dawn3) 620px,var(--dawn4) 1000px,var(--bg) 1400px) fixed;background-color:var(--bg);min-height:100vh;-webkit-tap-highlight-color:transparent;font-weight:600}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Mali",serif}
.ar{font-family:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400;line-height:2.1}
.wrap{max-width:460px;margin:0 auto;padding:10px 14px 40px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:24px;border:3px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;text-decoration:none;color:var(--ink);padding:0 12px;box-shadow:0 4px 0 var(--line)}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:8px 14px;font-weight:700}
.hero{display:flex;gap:10px;align-items:center;color:#fff;margin:4px 0 8px}
.hero h1{margin:0;font-size:27px;line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{margin:4px 0 0;font-size:15px;opacity:.95}
.kite{width:92px;height:92px;flex:0 0 auto;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.yay{animation:yay .7s ease 2}
@keyframes yay{50%{transform:scale(1.15) rotate(8deg)}}
.sttl{color:#fff;margin:6px 2px;font-size:15px}
.stickers{display:flex;flex-wrap:wrap;gap:6px;background:rgba(255,255,255,.18);border:2px dashed rgba(255,255,255,.7);border-radius:18px;padding:8px}
.stickers span{font-size:26px;width:38px;height:38px;display:grid;place-items:center;filter:grayscale(1) opacity(.35)}
.stickers span.got{filter:none;animation:yay .6s}
/* ---- peta: belon naik melepasi awan ---- */
.skymap{position:relative;margin-top:14px;padding:10px 0 0;border-radius:28px;overflow:hidden;background:
  radial-gradient(circle at 20% 4%,#fff 0 2px,transparent 3px),radial-gradient(circle at 70% 2%,#fff 0 1.5px,transparent 3px),radial-gradient(circle at 88% 7%,#fff 0 2px,transparent 3px),
  linear-gradient(180deg,var(--night) 0,var(--dawn2) 25%,var(--dawn3) 62%,var(--dawn4) 92%)}
.row{display:flex;padding:24px 14px 6px}
.row.r{justify-content:flex-end}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;width:62%}
.cloudb{position:relative;width:100%;min-height:78px;background:var(--cloud);border:3px solid var(--line);border-radius:44px;display:flex;align-items:center;gap:10px;padding:8px 14px;box-shadow:0 6px 0 rgba(51,40,92,.35)}
.cloudb::before,.cloudb::after{content:"";position:absolute;background:var(--cloud);border:3px solid var(--line);border-bottom:0;border-radius:50% 50% 0 0;z-index:-1}
.cloudb::before{width:46px;height:30px;top:-18px;left:18%}.cloudb::after{width:62px;height:40px;top:-26px;left:46%}
.bub{width:52px;height:52px;flex:0 0 auto;border-radius:50%;background:var(--c);border:3px solid var(--line);display:grid;place-items:center;font-size:24px;position:relative}
.num{position:absolute;top:-8px;inset-inline-start:-8px;background:var(--sun);color:#33285C;border:2px solid var(--line);border-radius:12px;font-size:13px;min-width:24px;height:24px;display:grid;place-items:center}
.nm{font-size:17px;font-weight:700;text-align:start;flex:1}
.st{font-size:13px;min-height:16px;letter-spacing:-2px}
.node.lock .cloudb{background:var(--cloud2);opacity:.75}.node.lock .bub{filter:grayscale(1)}
.node.lock .nm::after{content:" 🔒"}
.balloon-now{position:absolute;top:-40px;inset-inline-end:-46px;width:64px;z-index:3;pointer-events:none}
.node.now .cloudb{box-shadow:0 0 0 5px var(--sun),0 6px 0 rgba(51,40,92,.35)}
.peak{text-align:center;color:#fff;padding:8px}
.peak .node{margin:0 auto;width:72%}
.ground{position:relative;height:110px;margin-top:20px;background:radial-gradient(circle at 50% 120%,var(--sun) 0 70px,#FFE6A8 72px 92px,transparent 94px),linear-gradient(180deg,transparent 60%,#7BC47F 60%);text-align:center;color:#33285C;font-weight:700;padding-top:24px}
/* ---- kad ---- */
.shead{display:flex;gap:10px;align-items:center;color:#fff;margin-bottom:10px}
.shead h2{margin:0;font-size:22px}.shead small{opacity:.9}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px;box-shadow:0 7px 0 rgba(51,40,92,.35);border-top:10px solid var(--sc,var(--brand))}
.rpic{font-size:44px;text-align:center}
.rh{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;margin:4px 0 10px;font-size:20px}
.say{width:44px;height:44px;border-radius:22px;border:3px solid var(--line);background:var(--sun);font-size:18px;flex:0 0 auto}
.surah{background:var(--note);border-radius:20px;padding:12px;text-align:center;font-size:27px;color:var(--ink)}
.surah .bsm{display:block;font-size:24px;margin-bottom:4px;opacity:.85}
.mark{font-size:.8em;color:var(--brand2);white-space:nowrap}
.mkl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mkl li{background:var(--note);border-radius:18px;padding:10px 12px}
.mkl .ar{display:block;font-size:24px;text-align:center}
.mkl .m{display:flex;gap:8px;align-items:flex-start;font-size:16px}
.mkl .m b{background:var(--brand);color:#fff;border-radius:12px;min-width:26px;text-align:center;flex:0 0 auto}
.tip{display:flex;gap:10px;background:var(--note);border:2px dashed var(--line);border-radius:18px;padding:10px 12px;margin:10px 0;font-size:16px}
.tip.am{background:var(--okbg)}
.tip ul{margin:4px 0 0;padding-inline-start:18px}
.abox{background:var(--cloud2);border-radius:16px;padding:8px;text-align:center;margin-top:6px}
.abox .ar{display:block;font-size:24px}
.ref{margin-top:12px;font-size:14px;color:var(--muted);text-align:center}
.navr{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:56px;border-radius:28px;border:3px solid var(--line);background:var(--cloud2);font-size:18px;font-weight:700;box-shadow:0 5px 0 var(--line);width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--brand);color:#fff}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:10px;height:10px;border-radius:5px;background:var(--cloud2);border:2px solid var(--line)}.dots i.on{background:var(--brand);width:24px}
.prog{position:relative;height:30px;background:rgba(255,255,255,.35);border:3px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden}
.prog .fill{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,var(--dawn3),var(--sun));transition:width .4s}
.prog .bl{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:20px;transition:all .4s}
html[dir=rtl] .prog .bl{transform:translate(50%,-50%)}
.q{display:flex;align-items:center;gap:8px;font-size:18px}.q p{margin:0;flex:1}
.qar{font-size:28px;text-align:center;background:var(--note);border-radius:18px;padding:6px 10px;margin:10px 0}
.hint{margin-top:10px;background:var(--badbg);border-radius:14px;padding:8px 12px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.right{background:var(--okbg)!important;border-color:var(--ok)!important}
.wrong{background:var(--badbg)!important}
</style>
<style>
/* ---- permainan ---- */
.clouds3{display:grid;gap:12px;margin-top:8px}
.cl{position:relative;background:var(--cloud);border:3px solid var(--line);border-radius:40px;padding:10px 16px;font-size:24px;box-shadow:0 5px 0 rgba(51,40,92,.3);animation:drift 4s ease-in-out infinite}
.cl:nth-child(2){animation-delay:-1.3s}.cl:nth-child(3){animation-delay:-2.6s}
@keyframes drift{50%{transform:translateX(6px)}}
.ayl{font-size:28px;text-align:center;background:var(--note);border-radius:18px;padding:10px;margin:10px 0;line-height:2.4}
.blank{display:inline-block;min-width:80px;border:3px dashed var(--brand);border-radius:12px;padding:0 8px;margin:0 4px;line-height:1.6;vertical-align:middle;background:var(--card)}
.blank.full{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:96px;min-height:60px;border:3px solid var(--line);border-radius:16px;background:var(--sun);color:#33285C;font-size:26px;box-shadow:0 5px 0 var(--line);padding:0 10px}
.ladder{position:relative;border-inline:4px solid #A0673A;margin:4px 22px 12px;padding:6px 8px;min-height:60px;display:grid;gap:6px}
.ladder .bal{text-align:center;font-size:40px;margin-top:-6px}
.rung{border:3px solid var(--line);border-radius:14px;background:var(--okbg);padding:4px 10px;font-size:22px;text-align:center;animation:yay .4s}
.rung.empty{background:transparent;border-style:dashed;opacity:.5;min-height:44px;animation:none}
.pool{display:grid;gap:10px}
.ay{border:3px solid var(--line);border-radius:18px;background:var(--cloud);font-size:23px;padding:6px 12px;box-shadow:0 4px 0 var(--line);min-height:56px}
.ay.used{visibility:hidden}
.night{position:relative;height:260px;background:radial-gradient(circle at 15% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 80% 70%,#fff 0 1px,transparent 2px),linear-gradient(180deg,#1B1740,#4B3F8F);border-radius:22px;margin-top:10px;overflow:hidden}
.night svg{position:absolute;inset:0;width:100%;height:100%}
.night line{stroke:#FFE58A;stroke-width:3;stroke-linecap:round;stroke-dasharray:200;animation:draw .5s ease forwards}
@keyframes draw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
.star{position:absolute;transform:translate(-50%,-50%);background:none;border:0;display:flex;flex-direction:column;align-items:center;color:#fff;min-width:56px;min-height:56px;padding:2px}
.star i{font-style:normal;font-size:30px;filter:drop-shadow(0 0 4px #FFE58A);transition:transform .3s}
.star .ar{font-size:20px;line-height:1.4;background:rgba(0,0,0,.35);border-radius:10px;padding:0 6px}
.star.lit i{transform:scale(1.35)}
.ikat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ikat .col{display:grid;gap:10px;align-content:start}
.ca,.cm{border:3px solid var(--line);border-radius:16px;background:var(--cloud);padding:6px 8px;min-height:64px;box-shadow:0 4px 0 var(--line)}
.ca{font-size:20px}.cm{font-size:14px;text-align:start}
.ca.sel{background:var(--sun);color:#33285C}
.ca.done,.cm.done{border-color:var(--pc);background:var(--okbg);box-shadow:0 0 0 3px var(--pc)}
.flags{display:flex;justify-content:space-around;gap:6px;margin-top:10px}
.flag{background:none;border:0;display:flex;flex-direction:column;align-items:center;width:32%}
.flag .bb{font-size:42px;animation:bob 3s ease-in-out infinite}
.flag:nth-child(2) .bb{animation-delay:-1s}.flag:nth-child(3) .bb{animation-delay:-2s}
.flag .tx{border:3px solid var(--line);border-radius:6px 16px 16px 6px;background:var(--fc);color:#fff;padding:10px 6px;font-weight:700;width:100%;font-size:16px;text-shadow:0 1px 0 rgba(0,0,0,.3);min-height:56px}
.chips{display:flex;flex-wrap:wrap-reverse;gap:8px;justify-content:center;direction:rtl;margin:10px 0}
.chip{background:var(--cloud);border:3px solid var(--line);border-radius:30px;padding:2px 12px;font-size:19px;cursor:pointer}
.chip.cnt{background:var(--okbg)}
.chip .n{font-family:"Mali",sans-serif;font-size:14px;background:var(--brand);color:#fff;border-radius:10px;padding:0 6px;margin-inline-start:6px;direction:ltr}
.sand{display:flex;justify-content:center;gap:14px}
.sand button{width:78px;height:86px;border:3px solid var(--line);border-radius:18px 18px 30px 30px;background:#D9A066;font-size:34px;font-weight:700;color:#33285C;box-shadow:0 5px 0 var(--line)}
/* ---- maklum balas & keputusan ---- */
.fb{position:fixed;inset-inline:0;bottom:0;z-index:40;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:460px;margin:0 auto;background:var(--okbg);border:3px solid var(--line);border-radius:26px;padding:12px 14px;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.fb .row1{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fb .row1 .kite{width:64px;height:64px}
.fb strong{font-size:22px}.fb p{margin:2px 0 0}
.res{text-align:center}
.res .kite{width:120px;height:120px}
.stars{font-size:46px;display:flex;justify-content:center;gap:6px}
.stars span{animation:pop .5s both}.stars .off{filter:grayscale(1) opacity(.3)}
@keyframes pop{from{transform:scale(0)}}
.res h2{margin:6px 0}.res p{margin:0 0 8px;color:var(--muted)}
.gotst{display:inline-flex;align-items:center;gap:10px;background:var(--note);border:3px dashed var(--line);border-radius:20px;padding:8px 16px;margin:6px 0}
.gotst span{font-size:44px;animation:pop 1s both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;bottom:-40px;font-size:28px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(20deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;z-index:60;max-width:92vw;text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* Teks ayat: Rasm Uthmani (Hafs) daripada api.quran.com (text_uthmani), disemak dengan buku teks. JANGAN UBAH DENGAN TANGAN. */

"ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ",
"مَـٰلِكِ يَوْمِ ٱلدِّينِ",
"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",

"صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ"
],
"114": [
"قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ",
"مَلِكِ ٱلنَّاسِ",
"إِلَـٰهِ ٱلنَّاسِ",
"مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ",
"ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ",

"113": [

"مِن شَرِّ مَا خَلَقَ",
"وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ",
"وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِى ٱلْعُقَدِ",

/* ===================== JANA STESEN & PERMAINAN daripada AYAT (teks al-Quran tidak diubah) ===================== */
const AN = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const HAS_LETTER = /[\u0621-\u064A\u0671-\u06D3]/;
// pecah ayat kepada perkataan; tanda waqaf (cth. ۚ) dilekatkan pada perkataan sebelumnya. words(a).join(" ") === a
function words(a){ const out = []; for(const w of a.split(" ")){ if(out.length && !HAS_LETTER.test(w)) out[out.length-1] += " " + w; else out.push(w); } return out; }
function rng(seed){ let x = seed >>> 0 || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
const ALL_WORDS = [...new Set(Object.values(AYAT).flat().flatMap(words))];
const ALL_AYAT = Object.entries(AYAT).flatMap(([k, a]) => a.map(x => x));
const uniq = (A, i) => A.filter(x => x === A[i]).length === 1;
function pickDistinct(pool, avoid, n, r){
  const out = []; const p = pool.filter(x => !avoid.includes(x)); let guard = 0;
  while(out.length < n && guard++ < 500){ const c = p[Math.floor(r()*p.length)]; if(c && !out.includes(c)) out.push(c); }
  return out;
}
const NAMA = s => [ "surah " + s.t[0], "سورة " + s.t[1] ];

function makeGames(s){
  const A = AYAT[s.k], n = A.length, r = rng(s.id * 7919 + 13), nm = NAMA(s), G = [];
  /* 1. angin: ayat seterusnya */
  let k = s.id % (n - 1); while(!uniq(A, k) && k < n - 2) k++;
  const ans = A[k + 1];
  const pool1 = (n >= 4 ? A : ALL_AYAT).filter(x => x !== ans && x !== A[k]);
  G.push({ type:"angin", q:["Ayat apakah selepas ayat ini? Tekan awan yang betul!","ايت اڤاکه سلڤس ايت اين؟ تکن اوان يڠ بتول!"],
    ar:A[k], an:k + 1, a:[ans, ...pickDistinct(pool1, [ans], 2, r)],
    e:[`Betul! Selepas ayat ${k+1} ialah ayat ${k+2} ${nm[0]}.`,`بتول! سلڤس ايت ${k+1} اياله ايت ${k+2} ${nm[1]}.`] });
  /* 2. tampal: perkataan yang hilang */
  let j = (k + 2) % n, guard = 0; while((words(A[j]).length < 3 || !uniq(A, j)) && guard++ < n) j = (j + 1) % n;
  if(words(A[j]).length < 3) j = A.reduce((b, x, i) => words(x).length > words(A[b]).length ? i : b, 0);
  const W = words(A[j]), bi = Math.floor(W.length / 2);
  G.push({ type:"tampal", q:["Perkataan apa yang hilang? Tekan jubin yang betul.","ڤرکاتاٴن اڤ يڠ هيلڠ؟ تکن جوبين يڠ بتول."],
    words:W, bi, an:j + 1, a:[W[bi], ...pickDistinct(ALL_WORDS, W, 2, r)],
    e:[`Hebat! Ayat ${j+1} ${nm[0]} sudah lengkap.`,`هيبت! ايت ${j+1} ${nm[1]} سوده لڠکڤ.`] });
  /* 3. tali: susun ayat ikut tertib */
  let st = n <= 4 ? 0 : s.id % (n - 3);
  const okWin = b => { const w = A.slice(b, b + 4); return new Set(w).size === w.length; };
  while(!okWin(st) && st > 0) st--;
  const items = A.slice(st, st + 4);
  G.push({ type:"tali", q:[`Susun ayat ${st+1} hingga ${st+items.length} mengikut tertib. Mula dengan ayat ${st+1}.`,`سوسون ايت ${st+1} هيڠڬ ${st+items.length} مڠيکوت ترتيب. مولا دڠن ايت ${st+1}.`],
    items, from:st + 1, e:[`Syabas! Tali ayat ${nm[0]} sudah tersusun.`,`شاباس! تالي ايت ${nm[1]} سوده ترسوسون.`] });
  /* 4. buruj: tekan perkataan ikut tertib untuk melukis buruj bintang */
  const cand = A.map((x, i) => i).filter(i => words(A[i]).length >= 3 && words(A[i]).length <= 6);
  const bj = cand.length ? (cand.find(i => i !== j) ?? cand[0]) : 0;
  G.push({ type:"buruj", q:[`Lukis buruj! Tekan bintang ikut tertib perkataan ayat ${bj+1}.`,`لوکيس بوروج! تکن بينتڠ ايکوت ترتيب ڤرکاتاٴن ايت ${bj+1}.`],
    words:words(A[bj]), an:bj + 1, e:[`Cantiknya buruj ayat ${bj+1}!`,`چنتيقڽ بوروج ايت ${bj+1}!`] });
  /* 5. ikat: padankan ayat dengan maksud */
  let idx = [...new Set([0, Math.floor(n / 2), n - 1])];
  idx = idx.map(i => { let t = i; while(!uniq(A, t)) t = (t + 1) % n; return t; });
  idx = [...new Set(idx)];
  G.push({ type:"ikat", q:["Ikat tali! Tekan satu ayat, kemudian tekan maksudnya.","ايکت تالي! تکن ساتو ايت، کمودين تکن مقصودڽ."],
    pairs:idx.map(i => [A[i], s.mk[i], i + 1]), e:[`Pandai! Kamu faham maksud ${nm[0]}.`,`ڤنداي! کامو فهم مقصود ${nm[1]}.`] });
  /* 6. bendera (stesen ganjil) / bilang (stesen genap) */
  if(s.id % 2){
    const ai = s.k === "1" ? 1 : 0;
    G.push({ type:"bendera", q:["Ayat ini daripada surah apa? Tekan bendera yang betul.","ايت اين درڤد سورة اڤ؟ تکن بنديرا يڠ بتول."],
      ar:A[ai], an:ai + 1, sid:s.id, e:[`Betul! Ini ayat ${ai+1} ${nm[0]}.`,`بتول! اين ايت ${ai+1} ${nm[1]}.`] });
  } else {
    const opts = [n, n + 1, n > 3 ? n - 1 : n + 2];
    G.push({ type:"bilang", q:[`Berapa ayat dalam ${nm[0]}? Kira awan ayat.`,`براڤ ايت دالم ${nm[1]}؟ کيرا اوان ايت.`],
      k:s.k, n, opts, e:[`Ya! ${nm[0]} ada ${n} ayat.`,`ي! ${nm[1]} اد ${n} ايت.`] });
  }
  return G;
}

let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}

/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, pct = k/n*100, side = isJ() ? "right" : "left";
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="fill" style="width:${pct}%"></span>
    <span class="bl" style="${side}:${Math.max(6,Math.min(94,pct))}%">🎈</span></div>`;
}
function renderPlay(){
  hush();
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const g = S.games[S.gi];
  const tag = g.fs ? `<p style="margin:0 0 6px;color:var(--muted)">☁️ ${L("Surah","سورة")} ${T(STATIONS.find(x=>x.id===g.fs).t)}</p>` : "";
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `${tag}<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h) h.innerHTML = `<div class="hint">🪁 ${hint || L("Hmm, cuba lagi!","همم، چوبا لاڬي!")}</div>`;
}
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${kite("yay")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.phase = "result";
  S.res = { stars, first: !prev, openedFinal: !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Belon kamu terbang paling tinggi.","چمرلڠ! بلون کامو تربڠ ڤاليڠ تيڠڬي."] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom ulang hafazan.","شاباس کران منچوبا! جوم اولڠ حفظن."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${kite("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Pelekat baharu untuk langit kamu!","ڤلقت بهارو اونتوق لاڠيت کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🌟 ${L("Cabaran Puncak Bintang kini dibuka!","چابرن ڤونچق بينتڠ کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🎈 ${L("Kembali ke langit","کمبالي ک لاڠيت")}</button>
      <button class="btn" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}
/* ===================== JENIS PERMAINAN (semua tekan sahaja) ===================== */
const PCOL = ["#FF7A59","#8E7CC3","#20BF6B","#F7B731"];
const GAMES = {
  /* angin: tiup belon ke awan yang membawa ayat seterusnya */
  angin(el, g){
    const opts = shuffle(g.a); let done = false;
    el.innerHTML = `<div class="qar">${AR(g.ar, g.an)}</div><p style="text-align:center;margin:4px 0">⬇️ 🎈 ⬇️</p>
      <div class="clouds3">${opts.map((o,i)=>`<button class="cl" data-i="${i}">${AR(o)}</button>`).join("")}</div>`;
    el.querySelectorAll(".cl").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = opts[+b.dataset.i];
      if(o===g.a[0]){ done = true; b.classList.add("right"); sfx.whoosh(); win(); }
      else { b.classList.add("wrong"); oops(b, L("Bukan awan itu. Ingat bacaan ayat seterusnya!","بوکن اوان ايت. ايڠت باچاٴن ايت ستروسڽ!")); }
    }));
  },
  /* tampal: tampal jubin perkataan yang hilang */
  tampal(el, g){
    const opts = shuffle(g.a); let done = false;
    const line = () => g.words.map((w,i)=> i===g.bi ? `<span class="blank ${done?"full":""}">${done?w:"&nbsp;?&nbsp;"}</span>` : w).join(" ");
    el.innerHTML = `<div class="ayl ar" lang="ar" id="ayl">${line()} <span class="mark">﴿${AN(g.an)}﴾</span></div>
      <div class="tiles">${opts.map((o,i)=>`<button class="tile ar" lang="ar" data-i="${i}">${o}</button>`).join("")}</div>`;
    el.querySelectorAll(".tile").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = opts[+b.dataset.i];
      if(o===g.a[0]){ done = true; b.classList.add("right"); el.querySelector("#ayl").innerHTML = `${line()} <span class="mark">﴿${AN(g.an)}﴾</span>`; win(); }
      else { b.classList.add("wrong"); oops(b, L("Jubin itu tidak muat. Cuba lagi!","جوبين ايت تيدق موات. چوبا لاڬي!")); }
    }));
  },
  /* tali: susun ayat menjadi tangga tali di bawah belon */
  tali(el, g){
    const pool = mix(g.items); let k = 0;
    const draw = () => g.items.map((a,i)=> i<k ? `<div class="rung">${AR(a, g.from+i)}</div>` : `<div class="rung empty"></div>`).join("");
    el.innerHTML = `<div class="ladder"><div class="bal">🎈</div><div id="rungs" style="display:grid;gap:6px">${draw()}</div></div>
      <div class="pool">${pool.map((a,i)=>`<button class="ay" data-i="${i}">${AR(a)}</button>`).join("")}</div>`;
    el.querySelectorAll(".ay").forEach(b => b.addEventListener("click", () => {
      if(k>=g.items.length || b.classList.contains("used")) return;
      if(pool[+b.dataset.i]===g.items[k]){ k++; b.classList.add("used"); sfx.tick(); el.querySelector("#rungs").innerHTML = draw(); if(k===g.items.length) setTimeout(win, 350); }
      else oops(b, L(`Bukan itu. Cari ayat ${g.from+k}!`,`بوکن ايت. چاري ايت ${g.from+k}!`));
    }));
  },
  /* buruj: tekan bintang ikut tertib perkataan, garis buruj terlukis */
  buruj(el, g){
    const BASE = [[82,22],[55,14],[24,26],[30,62],[62,74],[86,58]].slice(0, g.words.length);
    const pos = mix(BASE); let k = 0;
    el.innerHTML = `<div class="night"><svg viewBox="0 0 100 100" preserveAspectRatio="none" id="lines"></svg>
      ${g.words.map((w,i)=>`<button class="star" data-i="${i}" style="left:${pos[i][0]}%;top:${pos[i][1]}%"><i>⭐</i><span class="ar" lang="ar">${w}</span></button>`).join("")}</div>
      <p style="text-align:center;margin:8px 0 0">${L("Ayat","ايت")} ${g.an} • <span id="cnt">0</span>/${g.words.length} ⭐</p>`;
    el.querySelectorAll(".star").forEach(b => b.addEventListener("click", () => {
      if(k>=g.words.length || b.classList.contains("lit")) return;
      const i = +b.dataset.i;
      if(g.words[i]===g.words[k]){
        if(k>0){ const a = pos[k-1], c = pos[i]; el.querySelector("#lines").insertAdjacentHTML("beforeend", `<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}"/>`); }
        if(i!==k){ [pos[i],pos[k]] = [pos[k],pos[i]]; }
        b.classList.add("lit"); sfx.star(); k++; el.querySelector("#cnt").textContent = k;
        if(k===g.words.length) setTimeout(win, 450);
      } else oops(b, L("Bintang itu belum lagi. Ikut tertib bacaan!","بينتڠ ايت بلوم لاڬي. ايکوت ترتيب باچاٴن!"));
    }));
  },
  /* ikat: ikat tali antara ayat dan maksudnya */
  ikat(el, g){
    const L1 = shuffle(g.pairs.map((p,i)=>i)), R1 = mix(L1); let sel = null, got = 0;
    el.innerHTML = `<div class="ikat"><div class="col">${L1.map(i=>`<button class="ca" data-p="${i}">${AR(g.pairs[i][0], g.pairs[i][2])}</button>`).join("")}</div>
      <div class="col">${R1.map(i=>`<button class="cm" data-p="${i}">${T(g.pairs[i][1])}</button>`).join("")}</div></div>`;
    el.querySelectorAll(".ca").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      el.querySelectorAll(".ca").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.p; sfx.tick();
    }));
    el.querySelectorAll(".cm").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done")) return;
      if(sel===null){ toast(L("Tekan satu ayat dahulu 👈","تکن ساتو ايت دهولو 👉")); return; }
      if(+b.dataset.p===sel){
        const a = el.querySelector(`.ca[data-p="${sel}"]`), c = PCOL[got%PCOL.length];
        [a,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.style.setProperty("--pc", c); });
        sel = null; got++; sfx.ok(); if(got===g.pairs.length) setTimeout(win, 350);
      } else oops(b, L("Maksud itu untuk ayat lain.","مقصود ايت اونتوق ايت لاين."));
    }));
  },
  /* bendera: belon membawa bendera nama surah */
  bendera(el, g){
    const others = shuffle(STATIONS.filter(s=>s.id!==g.sid)).slice(0,2);
    const opts = shuffle([STATIONS.find(s=>s.id===g.sid), ...others]); let done = false;
    el.innerHTML = `<div class="qar">${AR(g.ar, g.an)}</div>
      <div class="flags">${opts.map((s,i)=>`<button class="flag" data-id="${s.id}" style="--fc:${s.c}"><span class="bb">🎈</span><span class="tx">${T(s.t)}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".flag").forEach(b => b.addEventListener("click", () => {
      if(done) return;
      if(+b.dataset.id===g.sid){ done = true; b.querySelector(".tx").classList.add("right"); win(); }
      else oops(b, L("Bukan surah itu. Baca ayat sekali lagi.","بوکن سورة ايت. باچ ايت سکالي لاڬي."));
    }));
  },
  /* bilang: kira awan ayat, pilih guni pasir yang betul */
  bilang(el, g){
    const A = AYAT[g.k]; let c = 0, done = false;
    const opts = shuffle(g.opts);
    el.innerHTML = `<p style="margin:6px 0 0;color:var(--muted)">${L("Tekan setiap awan untuk mengira.","تکن ستياڤ اوان اونتوق مڠيرا.")}</p>
      <div class="chips">${A.map((a,i)=>`<span class="chip" data-i="${i}">☁️ ${AR(a)}</span>`).join("")}</div>
      <div class="sand">${opts.map(n=>`<button data-n="${n}">${n}</button>`).join("")}</div>`;
    el.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("cnt")) return; c++; b.classList.add("cnt"); b.insertAdjacentHTML("beforeend", `<span class="n">${c}</span>`); sfx.tick();
    }));
    el.querySelectorAll(".sand button").forEach(b => b.addEventListener("click", () => {
      if(done) return;
      if(+b.dataset.n===g.n){ done = true; b.classList.add("right"); win(); }
      else { b.classList.add("wrong"); oops(b, L("Kira semula awan ayat.","کيرا سمولا اوان ايت.")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t1-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan surah sebelumnya dahulu 🔒","سلسايکن سورة سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Selesaikan semua ${STATIONS.length} surah untuk membuka Cabaran Puncak Bintang 🌟`,`سلسايکن سموا ${STATIONS.length} سورة اونتوق ممبوک چابرن ڤونچق بينتڠ 🌟`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.phase==="result" && S.res) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
</body>
</html>
