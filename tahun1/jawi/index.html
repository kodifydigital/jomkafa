<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7DB443">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/access.js"></script>
<title>Zoo Huruf Jaja • Jawi Tahun 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Jawi Tahun 1: "Zoo Huruf Jaja" — safari savana, papan kayu, gajah Jaja ===== */
:root{
  --sky:#FFE9B8; --sky2:#FFF6DE; --sav:#9CCB52; --sav2:#6FA234; --sand:#F6E3B4; --sand2:#E9CC8A;
  --bg:#FFF8E8; --card:#FFFDF6; --ink:#3D2A16; --muted:#7A6346; --line:#8A5A2B; --soft:rgba(110,70,30,.18);
  --brand:#E8731C; --brand2:#C9580B; --leaf:#4E8F2A; --wood:#C98B4E; --wood2:#A86B33; --sun:#FFC83D;
  --ok:#3F9B3A; --okbg:#E1F5D6; --bad:#D9483B; --badbg:#FDE3DC; --note:#FFF1C9; --jw:#2F1E0E;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1C2340; --sky2:#27305A; --sav:#3F6B2A; --sav2:#2C4F1C; --sand:#4A3D27; --sand2:#5C4B30;
    --bg:#16182A; --card:#232741; --ink:#FBF2E0; --muted:#D7C6A6; --line:#D9A86A; --soft:rgba(0,0,0,.45);
    --note:#3C3420; --okbg:#1E3D22; --badbg:#4A2621; --jw:#FFF4DC; --wood:#8E5E30; --wood2:#6E4520; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Grandstander","Trebuchet MS",system-ui,sans-serif;font-size:19px;line-height:1.4;
  background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 300px,var(--bg) 700px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Grandstander",serif;font-size:20px;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--brand);outline-offset:3px}
.wrap{max-width:660px;margin:0 auto;padding:10px 14px 70px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl}
.jw{font-family:"Noto Naskh Arabic","Amiri",serif;direction:rtl;unicode-bidi:isolate;font-weight:700;color:var(--jw)}

/* latar savana: matahari, bukit, pokok akasia */
.savanna{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.savanna .sunb{position:absolute;top:26px;right:8%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#FFE38A 0 45%,#FFC83D 46% 60%,rgba(255,200,61,.25) 61%);animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.06)}}
.savanna .acacia{position:absolute;top:150px;width:130px;height:90px}
.savanna .acacia::before{content:"";position:absolute;left:10px;right:10px;top:0;height:34px;border-radius:50%/60%;background:var(--sav2);opacity:.55}
.savanna .acacia::after{content:"";position:absolute;left:58px;top:24px;width:10px;height:70px;background:var(--wood2);opacity:.55;border-radius:4px}
.savanna .a1{left:-20px}.savanna .a2{right:-30px;top:210px;transform:scale(.75)}
.savanna .hill{position:absolute;left:-10%;right:-10%;top:230px;height:160px;border-radius:50% 50% 0 0;background:var(--sav);opacity:.35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .savanna .sunb{background:radial-gradient(circle,#F4F1E0 0 40%,rgba(244,241,224,.15) 41%)}}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:50%;border:0;background:var(--card);display:inline-grid;place-items:center;font-size:22px;font-weight:800;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--line),0 6px 14px var(--soft);padding:0 10px}
.ib[data-act="lang"]{border-radius:24px}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 14px;border-radius:24px;background:var(--sun);color:#4A3000;font-weight:800;box-shadow:0 3px 0 #C98F12}

/* tajuk peta: papan kayu */
.hero{position:relative;display:flex;align-items:center;gap:10px;margin:6px 0 14px;padding:14px 14px 14px 10px;border-radius:22px;
  background:repeating-linear-gradient(0deg,var(--wood) 0 22px,var(--wood2) 22px 24px);color:#FFF8E6;box-shadow:0 6px 0 var(--wood2),0 10px 20px var(--soft)}
.hero h1{margin:0;font-size:clamp(26px,6.6vw,34px);line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.25);letter-spacing:.5px}
html[dir="rtl"] .hero h1{line-height:1.5}
.hero p{margin:4px 0 0;font-size:15.5px;font-weight:700;opacity:.95}
.ele{width:92px;height:auto;flex:none}
.ele.bob{animation:sway 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{50%{transform:rotate(-4deg) translateY(-3px)}}
.ele.yay{animation:hop .45s ease 2}
@keyframes hop{50%{transform:translateY(-14px)}}
.ele .trunk{transform-origin:60px 74px;animation:trunk 2.6s ease-in-out infinite}
@keyframes trunk{50%{transform:rotate(8deg)}}
html[dir="rtl"] .hero .ele{transform:scaleX(-1)}

/* album haiwan */
.sttl{font-weight:800;font-size:15px;margin:0 0 4px;color:var(--muted)}
.stickers{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:var(--card);border-radius:18px;padding:8px;margin-bottom:16px;box-shadow:inset 0 0 0 3px var(--sand2)}
.stickers span{aspect-ratio:1;border-radius:30%;display:grid;place-items:center;font-size:clamp(15px,4.4vw,24px);background:var(--sand)}
.stickers span.got{background:#FFF;box-shadow:0 0 0 2px var(--sav2);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stickers span:not(.got){filter:grayscale(1) brightness(1.1);opacity:.35}

/* peta zoo: laluan pasir berliku */
.zoo{position:relative;padding:4px 0 10px}
.gate{position:relative;margin:0 auto 8px;width:min(300px,86%);text-align:center;padding:10px 12px 8px;border-radius:16px 16px 6px 6px;font-weight:800;color:#FFF8E6;
  background:repeating-linear-gradient(90deg,var(--wood) 0 18px,var(--wood2) 18px 20px);box-shadow:0 5px 0 var(--wood2);font-size:18px}
.gate::before,.gate::after{content:"";position:absolute;bottom:-26px;width:14px;height:34px;background:var(--wood2);border-radius:0 0 4px 4px}
.gate::before{left:14px}.gate::after{right:14px}
.trail{position:relative;margin-top:22px}
.trail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:46px;transform:translateX(-50%);border-radius:24px;
  background:radial-gradient(circle,rgba(138,90,43,.28) 2px,transparent 3px) 0 0/16px 16px,var(--sand);box-shadow:inset 0 0 0 3px var(--sand2)}
.pen{position:relative;display:flex;align-items:center;min-height:132px;z-index:1}
.pen.r{justify-content:flex-end}
.pen::before{content:"🐾";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-20deg);font-size:18px;opacity:.5}
.node{width:47%;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;color:inherit;text-decoration:none;position:relative}
.encl{position:relative;width:118px;height:96px;border-radius:22px;display:grid;place-items:center;font-size:50px;
  background:radial-gradient(ellipse at 50% 120%,var(--sav) 0 55%,transparent 56%),color-mix(in srgb,var(--c) 30%,var(--card));
  box-shadow:0 0 0 4px var(--c),0 7px 0 4px color-mix(in srgb,var(--c) 70%,#000),0 12px 18px var(--soft);overflow:visible;transition:transform .15s}
.encl::after{content:"";position:absolute;left:6px;right:6px;bottom:6px;height:26px;border-radius:0 0 16px 16px;
  background:repeating-linear-gradient(90deg,var(--wood) 0 5px,transparent 5px 14px),linear-gradient(transparent 6px,var(--wood) 6px 9px,transparent 9px 17px,var(--wood) 17px 20px,transparent 20px);opacity:.9}
.encl .an{position:relative;z-index:1;margin-top:-12px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.node:active .encl{transform:translateY(4px)}
.node .num{position:absolute;top:-12px;left:-10px;z-index:2;min-width:34px;height:34px;border-radius:10px;background:var(--wood);color:#FFF8E6;display:grid;place-items:center;font-size:16px;font-weight:800;box-shadow:0 3px 0 var(--wood2);transform:rotate(-8deg)}
.node .nm{position:relative;z-index:3;margin-top:8px;background:var(--card);border-radius:12px;padding:3px 10px;font-weight:800;font-size:15px;text-align:center;line-height:1.25;max-width:100%;box-shadow:0 2px 0 var(--sand2),0 4px 10px var(--soft)}
html[dir="rtl"] .node .nm{line-height:1.6;font-size:15px}
.node .st{font-size:16px;letter-spacing:1px;min-height:22px}
.node .st .off{filter:grayscale(1);opacity:.3}
.node.lock .encl{filter:grayscale(.85) brightness(1.05)}
.node.lock .encl .an{opacity:.45}
.node.lock .encl::before{content:"🔒";position:absolute;z-index:3;font-size:28px;bottom:-10px;right:-10px}
.node.now .encl{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.07)}}
.guide{position:absolute;width:58px;top:-30px;right:-34px;z-index:3;pointer-events:none}
.final .encl{width:150px;height:104px;font-size:56px;background:radial-gradient(circle at 50% 30%,#FFF6C8 0 30%,transparent 31%),linear-gradient(135deg,#FFD24A,#F08A24);box-shadow:0 0 0 4px #E8731C,0 7px 0 4px #B4500A,0 12px 18px var(--soft)}
.final .encl::after{display:none}
.stage{display:flex;justify-content:center;margin-top:6px;position:relative;z-index:1}
.stage .node{width:auto}

/* kad umum */
.card{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 0 0 3px var(--sand2),0 8px 0 3px var(--sand2),0 14px 26px var(--soft);animation:slidein .35s ease both;position:relative}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}}
html[dir="rtl"] .card{animation-name:slidein2}
@keyframes slidein2{from{opacity:0;transform:translateX(-24px)}}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead .encl{width:66px;height:56px;font-size:32px;border-radius:16px}
.shead .encl::after{height:14px;bottom:4px}
.shead h2{margin:0;font-size:clamp(20px,5vw,25px);line-height:1.15}
html[dir="rtl"] .shead h2{line-height:1.6}
.shead small{display:block;color:var(--muted);font-weight:700;font-size:14px}

/* kemajuan: gajah makan kacang */
.prog{position:relative;height:38px;margin:2px 0 12px;background:var(--sand);border-radius:999px;box-shadow:inset 0 0 0 3px var(--sand2);overflow:hidden}
.prog .eat{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--sav),var(--sav2));transition:width .5s;border-radius:999px}
html[dir="rtl"] .prog .eat{inset:0 0 0 auto}
.prog .el{position:absolute;top:50%;transform:translate(-50%,-50%) scaleX(-1);font-size:28px;transition:left .5s,right .5s}
.prog .nut{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:17px}

/* kad bacaan */
.rpic{font-size:62px;text-align:center;line-height:1.1;margin:0 0 4px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.rh{margin:0 0 8px;text-align:center;font-size:clamp(22px,5.4vw,27px);color:var(--brand);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.rtext{font-weight:700;font-size:19px;margin:0 0 10px}
.rlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:7px}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:6px 12px;font-weight:700;line-height:1.35;box-shadow:inset 4px 0 0 var(--sc);animation:slidein .35s both;animation-delay:calc(var(--i)*80ms)}
html[dir="rtl"] .rlist li{line-height:1.8;box-shadow:inset -4px 0 0 var(--sc)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:7px;margin:0 0 12px;direction:rtl}
.chip{border:0;border-radius:14px;background:var(--note);padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 var(--sand2);animation:pop .4s both;animation-delay:calc(var(--i)*25ms)}
.chip .jw{font-size:30px;line-height:1.5}
.chip small{font-family:"Grandstander",sans-serif;font-size:12.5px;font-weight:700;color:var(--muted);direction:ltr;line-height:1.1}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sand2)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin:0 0 12px}
.word{border:0;border-radius:16px;background:var(--bg);box-shadow:0 0 0 2px var(--sand2);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.word .em{font-size:30px;line-height:1.2}
.word .jw{font-size:26px;line-height:1.6}
.word small{font-family:"Grandstander",sans-serif;font-weight:700;color:var(--muted);font-size:14px}
.abox{background:var(--note);border-radius:18px;padding:10px 14px;margin:0 0 10px;text-align:center;box-shadow:inset 0 0 0 2px var(--sand2)}
.abox .ar{display:block;font-size:clamp(26px,7vw,34px);line-height:1.9}
.abox .mk{display:block;font-weight:700;font-size:16px;color:var(--muted);margin-top:2px}
.tip{display:flex;gap:8px;align-items:flex-start;background:#E8F6DA;border-radius:16px;padding:8px 12px;margin:0 0 8px;font-weight:700;font-size:17px;color:#2D4A16}
.tip.am{background:#FFEBD9;color:#6A3510}
.tip b{flex:none}
.ref{font-size:14px;color:var(--muted);font-weight:800;margin-top:4px}
.navr{display:flex;gap:8px;margin-top:12px}
.navr .btn{flex:1}
.btn{display:block;width:100%;border:0;border-radius:20px;padding:13px;font-size:21px;font-weight:800;background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--brand2),0 9px 16px var(--soft);text-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand2)}
.btn.alt{background:var(--card);color:var(--ink);text-shadow:none;box-shadow:0 0 0 3px var(--sand2),0 5px 0 3px var(--sand2)}
.btn.go{background:var(--ok);box-shadow:0 5px 0 #2A6E26,0 9px 16px var(--soft)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--sand2)}
.dots i.on{background:var(--sav2);width:28px;border-radius:99px}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:var(--sun);font-size:20px;box-shadow:0 3px 0 #C98F12;flex:none}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 #C98F12}

/* soalan */
.q{display:flex;gap:10px;align-items:center;margin:0 0 12px}
.q p{margin:0;flex:1;font-size:clamp(19px,5vw,23px);font-weight:800;line-height:1.3}
html[dir="rtl"] .q p{line-height:1.8}
.qar{font-size:clamp(24px,6vw,30px);text-align:center;background:var(--note);border-radius:16px;padding:6px 10px;margin:0 0 12px;line-height:1.9}
.cnt{font-weight:800;color:var(--muted);text-align:center;margin-top:10px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* MAKAN: suap haiwan */
.feed{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:12px;min-height:130px;background:radial-gradient(ellipse at 50% 100%,var(--sav) 0 45%,transparent 46%);border-radius:20px}
.feed .animal{font-size:92px;line-height:1;transition:transform .2s}
.feed .animal.chomp{animation:chomp .45s ease}
@keyframes chomp{30%{transform:scale(1.15,.9)}60%{transform:scale(.95,1.08)}}
.want{position:relative;align-self:flex-start;background:var(--card);border-radius:20px;padding:6px 14px;font-weight:800;font-size:26px;box-shadow:0 0 0 3px var(--sand2),0 6px 12px var(--soft);display:flex;align-items:center;gap:8px;direction:ltr;font-family:"Grandstander",sans-serif}
.want::after{content:"";position:absolute;bottom:-10px;left:22px;border:10px solid transparent;border-top-color:var(--card);border-bottom:0}
.fruits{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fruit{border:0;border-radius:50% 50% 46% 46%/56% 56% 44% 44%;aspect-ratio:1.25;background:radial-gradient(circle at 30% 26%,#fff8 0 12%,transparent 13%),var(--fc);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative;animation:pop .4s both}
.fruit::before{content:"🍃";position:absolute;top:-14px;font-size:22px}
.fruit .jw{font-size:clamp(34px,10vw,46px);color:#2F1E0E;line-height:1.3}
.fruit:active{transform:scale(.95)}
.fruit.eaten{animation:gulp .4s forwards}
@keyframes gulp{to{transform:scale(0) translateY(-80px);opacity:0}}
.nuts{display:flex;justify-content:center;gap:6px;font-size:22px;margin-top:10px}
.nuts .off{filter:grayscale(1);opacity:.3}

/* TITIK: kira titik */
.dotstage{display:grid;place-items:center;height:170px;margin-bottom:12px;border-radius:24px;background:repeating-linear-gradient(45deg,var(--note) 0 14px,var(--card) 14px 28px);box-shadow:inset 0 0 0 3px var(--sand2)}
.dotstage .jw{font-size:110px;line-height:1.2;animation:pop .4s both}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
.dotb{border:0;border-radius:20px;background:var(--card);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 0 0 3px var(--sand2),0 6px 0 3px var(--sand2)}
.dotb b{font-size:30px;line-height:1}
.dotb span{font-size:13px;letter-spacing:1px;min-height:16px;color:var(--brand)}
.dotb:active{transform:translateY(3px)}

/* TELUR: telur ajaib */
.sign{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 14px;padding:8px 18px;width:fit-content;border-radius:14px;background:var(--wood);color:#FFF8E6;font-weight:800;font-size:30px;box-shadow:0 5px 0 var(--wood2);font-family:"Grandstander",sans-serif;direction:ltr}
.nest{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px;padding:14px;border-radius:26px;background:radial-gradient(ellipse at 50% 60%,#E7C48A 0 60%,#C9995A 61%)}
.nest.n3{grid-template-columns:repeat(3,1fr)}
.egg{border:0;aspect-ratio:.8;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 34% 28%,#fff 0 10%,transparent 11%),radial-gradient(circle at 70% 70%,rgba(0,0,0,.06) 0 20%,transparent 21%),#FFF7E8;box-shadow:0 6px 0 rgba(0,0,0,.18);display:grid;place-items:center;animation:wob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
.egg .jw{font-size:clamp(32px,9vw,44px);color:#2F1E0E}
@keyframes wob{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}}
.egg.hatch{animation:none;background:#FFF0B8}
.egg.hatch::after{content:"🐣";position:absolute;font-size:40px;animation:pop .4s both}
.egg{position:relative}
.egg.crack{animation:shake .4s;opacity:.55}

/* CANTUM: bina perkataan */
.wordpic{text-align:center;font-size:58px;line-height:1.1}
.slots{display:flex;justify-content:center;gap:8px;direction:rtl;margin:8px 0 6px;flex-wrap:wrap}
.slot{min-width:70px;height:72px;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;background:var(--bg)}
.slot.full{border-style:solid;border-color:var(--sav2);background:var(--okbg);animation:pop .3s both}
.slot .jw{font-size:36px;line-height:1.4}
.built{text-align:center;min-height:62px;font-size:44px;line-height:1.4}
.built .jw{animation:pop .4s both;color:var(--ok)}
.blocks{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;direction:rtl;margin-top:8px}
.blk{border:0;min-width:74px;height:74px;border-radius:18px;background:var(--fc,#FFD9A0);box-shadow:0 6px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0 10px}
.blk .jw{font-size:36px;line-height:1.4;color:#2F1E0E}
.blk:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.blk.used{visibility:hidden}

/* INTAI: meerkat */
.burrows{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:16px 10px 12px;border-radius:26px;background:linear-gradient(var(--sav) 0 30%,var(--sand2) 30%)}
.hole{position:relative;height:104px;overflow:hidden;border-radius:0 0 50% 50%/0 0 30% 30%}
.hole::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:30px;border-radius:50%;background:#5A3A1A;box-shadow:inset 0 6px 0 rgba(0,0,0,.35)}
.mk{position:absolute;left:50%;bottom:10px;z-index:1;transform:translateX(-50%);border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:0;animation:peek .35s ease-out both}
.mk .face{font-size:34px;line-height:1}
.mk .tag{min-width:58px;background:#FFF7E8;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.2);padding:0 8px}
.mk .tag .jw{font-size:30px;line-height:1.4;color:#2F1E0E}
@keyframes peek{from{transform:translate(-50%,90px)}}
.mk.hit{animation:duck .35s forwards}
@keyframes duck{to{transform:translate(-50%,100px)}}
.hits{display:flex;justify-content:center;gap:4px;font-size:24px;margin-top:10px}
.hits .off{filter:grayscale(1);opacity:.3}

/* BENTUK */
.formstage{display:grid;place-items:center;height:160px;margin-bottom:12px;border-radius:24px;background:var(--note);box-shadow:inset 0 0 0 3px var(--sand2)}
.formstage .jw{font-size:96px;line-height:1.3;animation:pop .4s both}
.poss{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.posb{border:0;border-radius:18px;padding:10px 4px;font-weight:800;font-size:19px;background:var(--card);box-shadow:0 0 0 3px var(--c2),0 6px 0 3px var(--c2);display:flex;flex-direction:column;align-items:center;gap:2px}
.posb i{font-style:normal;font-size:26px}
.posb:active{transform:translateY(3px)}
.posrow{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:800;margin-top:6px}

.pen2{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:80px;padding:10px;border-radius:20px;background:var(--sand);margin-bottom:12px;direction:rtl}
.tk{border:0;min-width:66px;height:66px;border-radius:50%;background:#FFF7E8;box-shadow:0 5px 0 rgba(0,0,0,.18);display:grid;place-items:center;padding:0 8px;transition:transform .15s}
.tk .jw{font-size:30px;line-height:1.4;color:#2F1E0E}
.tk.sel{transform:translateY(-8px) scale(1.12);box-shadow:0 0 0 4px var(--brand),0 10px 0 rgba(0,0,0,.18)}
.cages{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cage{border:0;border-radius:20px 20px 12px 12px;min-height:150px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:15.5px;line-height:1.25;
  background:repeating-linear-gradient(90deg,transparent 0 16px,rgba(90,60,30,.45) 16px 20px),var(--cg);box-shadow:0 6px 0 rgba(0,0,0,.2)}
html[dir="rtl"] .cage{line-height:1.6}
.cage .inside{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;direction:rtl}
.cage .inside span{background:#FFF7E8;border-radius:10px;padding:0 8px;animation:pop .3s both}
.cage .inside .jw{font-size:24px}
.cage.c0{--cg:#D6EFC0}.cage.c1{--cg:#FFD9B8}

.scope{position:relative;margin:0 auto 12px;width:230px;height:150px;display:grid;place-items:center}
.scope::before,.scope::after{content:"";position:absolute;top:0;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--note) 0 62%,#3D2A16 63% 70%,transparent 71%)}
.scope::before{left:0}.scope::after{right:0}
.scope .jw{position:relative;z-index:1;font-size:62px;line-height:1.4}
.scope small{position:absolute;z-index:1;bottom:-6px;font-weight:800;color:var(--muted);direction:ltr;font-family:"Grandstander",sans-serif}
.letters{display:flex;justify-content:center;gap:10px;direction:rtl;flex-wrap:wrap}
.lt{border:0;width:70px;height:80px;border-radius:16px;background:var(--card);box-shadow:0 0 0 3px var(--sand2),0 6px 0 3px var(--sand2);display:grid;place-items:center}
.lt .jw{font-size:42px;line-height:1.4}
.lt.found{background:var(--okbg);box-shadow:0 0 0 3px var(--ok),0 6px 0 3px var(--ok);animation:pop .3s both}
.lt.found::after{content:"🔍";position:absolute;font-size:18px;transform:translate(26px,-30px)}
.lt{position:relative}

/* PAPAN tanda */
.picbig{text-align:center;font-size:96px;line-height:1.15;margin-bottom:8px;animation:sway 2.6s ease-in-out infinite}
.posts{display:grid;gap:14px}
.post{border:0;position:relative;border-radius:14px;padding:6px 10px;background:repeating-linear-gradient(0deg,var(--wood) 0 16px,var(--wood2) 16px 18px);box-shadow:0 6px 0 var(--wood2);display:grid;place-items:center;margin-inline:auto;width:min(270px,90%);transform:rotate(var(--r));animation:pop .4s both}
.post .jw{font-size:36px;line-height:1.5;color:#FFF8E6;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.post:active{transform:rotate(var(--r)) translateY(3px)}
.post.right{background:var(--ok);box-shadow:0 6px 0 #2A6E26}
.post.wrong{opacity:.5}

/* maklum balas */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .3s ease both}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:660px;margin:0 auto;background:var(--card);border-radius:26px;box-shadow:0 0 0 3px var(--sav2),0 -6px 24px var(--soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb .row1{display:flex;gap:10px;align-items:center}
.fb .ele{width:72px}
.fb strong{display:block;font-size:24px;color:var(--ok)}
.fb p{margin:0;font-weight:700;font-size:17px;line-height:1.4}
html[dir="rtl"] .fb p{line-height:1.8}
.hint{margin-top:10px;background:var(--badbg);border-radius:16px;padding:6px 12px;font-weight:700;animation:pop .3s both}

/* keputusan */
.res{text-align:center}
.res .ele{width:130px;margin:0 auto}
.res .stars{font-size:58px;letter-spacing:6px;line-height:1.1}
.res .stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.res .stars .off{filter:grayscale(1);opacity:.25}
.res h2{margin:4px 0;font-size:32px;color:var(--brand)}
.res p{margin:0 0 8px;color:var(--muted);font-weight:700}
.gotst{display:inline-flex;align-items:center;gap:10px;background:var(--note);border-radius:20px;padding:8px 16px;font-weight:800;margin:6px 0 10px;box-shadow:inset 0 0 0 3px var(--sand2)}
.gotst span{font-size:44px;animation:spin 1s ease both}
@keyframes spin{from{transform:rotate(-360deg) scale(0)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(380deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:700;z-index:60;max-width:92vw;text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[587,.12],[880,.2]]),
  tick: () => tone([[660,.08,"triangle"]]),
  no:   () => tone([[240,.16,"sawtooth"],[200,.2,"sawtooth"]]),
  munch:() => tone([[300,.05,"square"],[260,.05,"square"],[330,.06,"square"]]),
  crack:() => tone([[1400,.03,"square"],[900,.05,"triangle"],[1200,.08,"triangle"]]),
  peek: () => tone([[500,.05,"triangle"],[1000,.08,"triangle"]]),
  trumpet: () => tone([[392,.12,"sawtooth"],[523,.12,"sawtooth"],[659,.14,"sawtooth"],[784,.3,"sawtooth"]])
};

/* ---------- Suara (baca teks Rumi) ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    // buang huruf Jawi daripada teks suara; sebut nama huruf/suku kata dalam Rumi sahaja
    const clean = text.replace(/[\u0600-\u06FF\u0750-\u077F]+/g," ").replace(/ \/ /g,", ").replace(/…/g," ... ").replace(/\s+/g," ").trim();
    if(!clean) return;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .85; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

    <p class="sttl">📸 ${L("Album haiwan saya","البوم حيوان ساي")}</p>

    <section class="zoo" aria-label="${L("Peta zoo","ڤتا زو")}">

          <span class="encl"><span class="an">🏆</span>${cur==="final"?`<span class="guide">${ele("bob")}</span>`:""}</span>

const head = () => `<div class="top"><button class="ib" data-act="map" aria-label="${L("Kembali ke zoo","کمبالي ک زو")}">${BACK()}</button><span class="sp"></span>${voiceBtn()}${langBtn()}</div>

function readSpeech(c){

function renderRead(){

      <div class="ref">📖 ${L("Buku teks ms.","بوکو تيکس م.س.")} ${c.p}</div>

/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, pct = k/n*100, side = isJ() ? "right" : "left";
  const nuts = S.games.map((_,i)=> i>=k ? `<span class="nut" style="${side}:${(i+.5)/n*100}%;${isJ()?"transform:translate(50%,-50%)":""}">🥜</span>` : "").join("");
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="eat" style="width:${pct}%"></span>${nuts}
    <span class="el" style="${side}:${Math.max(6,pct)}%;${isJ()?"transform:translate(50%,-50%)":""}">🐘</span></div>`;
}
function renderPlay(){
  hush(); clearTimers();
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div><div id="play" data-type="${g.type}"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
// salah: kira kesilapan, goncang, tunjuk petunjuk ringkas (tiada nyawa, tiada tamat permainan)
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🐘 ${hint || L("Hmm, cuba lagi!","همم، چوبا لاڬي!")}</div>`; }
}
const clearHint = () => { const h = $("#hint"); if(h) h.innerHTML = ""; };
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  clearTimers(); sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${ele("yay")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.res = { stars, first: !prev, openedFinal: !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush(); clearTimers();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Kamu pandai membaca Jawi.","چمرلڠ! کامو ڤنداي ممباچ جاوي."] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom main lagi.","شاباس کران منچوبا! جوم ماٴين لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${ele("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Gambar baharu untuk album kamu!","ڬمبر بهارو اونتوق البوم کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🏆 ${L("Pertunjukan Juara kini dibuka!","ڤرتونجوقن جوارا کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🐘 ${L("Kembali ke zoo","کمبالي ک زو")}</button>
      <button class="btn alt" style="margin-top:12px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.trumpet(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN ===================== */
const GAMES = {
  /* Suap haiwan: haiwan minta huruf (nama Rumi), tekan buah yang betul */
  makan(el, g){
    let r = 0, busy = false;
    const draw = () => {
      const [lab, ans] = g.rounds[r];
      const opts = shuffle([ans, ...shuffle(g.pool.filter(x => x!==ans)).slice(0,3)]);
      el.innerHTML = `<div class="feed"><span class="animal" id="animal" aria-hidden="true">${g.animal}</span>
          <div class="want" id="want" data-v="${ans}">🗨️ <span>${lab}</span>${sayBtn(lab)}</div></div>
        <div class="fruits">${opts.map((o,i)=>`<button class="fruit" data-v="${o}" style="--fc:${FRUIT[(i+r)%FRUIT.length]};animation-delay:${i*.06}s">${JW(o)}</button>`).join("")}</div>
        <div class="nuts" aria-label="${r} / ${g.rounds.length}">${g.rounds.map((_,i)=>`<span class="${i<r?"":"off"}">🥜</span>`).join("")}</div>`;
      speak(lab);
      el.querySelectorAll(".fruit").forEach(b => b.addEventListener("click", () => {
        if(busy) return;
        if(b.dataset.v===ans){
          busy = true; sfx.munch(); b.classList.add("eaten"); clearHint();
          const a = el.querySelector("#animal"); a.classList.remove("chomp"); void a.offsetWidth; a.classList.add("chomp");
          later(() => { busy = false; r++; if(r<g.rounds.length) draw(); else win(); }, 450);
        } else oops(b, L(`Itu bukan "${lab}". Cuba buah lain!`,`ايت بوکن "${lab}". چوبا بواه لاٴين!`));
      }));
    };
    draw();
  },

  /* Kira titik pada huruf */
  titik(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      const [ch, n] = items[k];
      el.innerHTML = `<div class="dotstage"><span class="jw" id="tl" data-n="${n}">${ch}</span></div>
        <div class="nums">${[0,1,2,3].map(v=>`<button class="dotb" data-n="${v}"><b>${v}</b><span>${"●".repeat(v)||"○"}</span></button>`).join("")}</div>
        <div class="cnt">🔍 ${k+1} / ${items.length}</div>`;
      el.querySelectorAll(".dotb").forEach(b => b.addEventListener("click", () => {
        if(+b.dataset.n===n){ sfx.tick(); clearHint(); k++; if(k<items.length) draw(); else win(); }
        else oops(b, L("Kira titik sekali lagi, perlahan-lahan.","کيرا تيتيق سکالي لاڬي، ڤرلاهن٢."));
      }));
    };
    draw();
  },

  /* Telur ajaib: tekan telur yang betul, ia menetas */
  telur(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0}))); let done = false;
    el.innerHTML = `${g.say?`<div class="sign">🔊 <span>${g.say}</span>${sayBtn(g.say)}</div>`:""}
      <div class="nest ${opts.length===3?"n3":""}">${opts.map((o,i)=>`<button class="egg" data-i="${i}" style="--i:${i}">${JW(o.x)}</button>`).join("")}</div>
      <div class="cnt">🥚 ${L("Tekan telur yang betul!","تکن تلور يڠ بتول!")}</div>`;
    if(g.say) later(()=>speak(g.say), 1800);
    el.querySelectorAll(".egg").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = opts[+b.dataset.i];
      if(o.ok){ done = true; sfx.crack(); b.classList.add("hatch"); later(win, 450); }
      else { b.classList.add("crack"); oops(b, L("Telur itu tidak menetas. Cuba lagi!","تلور ايت تيدق منتس. چوبا لاڬي!")); }
    }));
  },

  /* Cantum suku kata: isi petak dari kanan ke kiri */
  cantum(el, g){
    const tiles = shuffle([...g.parts, ...(g.extra||[])]); let k = 0;
    el.innerHTML = `<div class="wordpic" aria-hidden="true">${g.pic||"🧩"}</div>
      <div class="cnt" style="margin:0" dir="ltr">${g.word[0]}</div>
      <div class="slots">${g.parts.map((_,i)=>`<span class="slot" data-s="${i}"></span>`).join("")}</div>
      <div class="built" id="built"></div>
      <div class="blocks">${tiles.map((t,i)=>`<button class="blk" data-t="${t}" style="--fc:${FRUIT[i%FRUIT.length]}">${JW(t)}</button>`).join("")}</div>
      <div class="cnt">🧱 ${L("Mula dari kanan ➜ tekan kepingan pertama.","مولا دري کانن ➜ تکن کڤيڠن ڤرتام.")}</div>`;
    el.querySelectorAll(".blk").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=g.parts.length) return;
      if(b.dataset.t===g.parts[k]){
        b.classList.add("used"); sfx.tick(); clearHint();
        const s = el.querySelector(`.slot[data-s="${k}"]`); s.classList.add("full"); s.innerHTML = JW(g.parts[k]);
        k++;
        if(k===g.parts.length){ el.querySelector("#built").innerHTML = JW(g.word[1]); speak(g.word[0]); later(win, 650); }
      } else oops(b, L(`Sebut perlahan: "${g.word[0]}". Apa bunyi bahagian ke-${k+1}?`,`سبوت ڤرلاهن: "${g.word[0]}". اڤ بوڽي بهاڬين ک-${k+1}؟`));
    }));
  },

  /* Meerkat mengintai: tekan yang membawa huruf sasaran */
  intai(el, g){
    let hits = 0; const N = 6;
    el.innerHTML = `<div class="sign">🎯 ${JW(g.target)}</div>
      <div class="burrows">${Array.from({length:N},(_,i)=>`<div class="hole" data-h="${i}"></div>`).join("")}</div>
      <div class="hits" id="hits"></div>`;
    const showHits = () => { el.querySelector("#hits").innerHTML = Array.from({length:g.need},(_,i)=>`<span class="${i<hits?"":"off"}">⭐</span>`).join(""); };
    const fill = () => {
      const pool = Array.from({length:N}, () => Math.random()<.3 ? g.target : g.others[Math.floor(Math.random()*g.others.length)]);
      if(!pool.includes(g.target)) pool[Math.floor(Math.random()*N)] = g.target;
      el.querySelectorAll(".hole").forEach((h,i) => {
        h.innerHTML = Math.random()<.18 && pool[i]!==g.target ? "" : `<button class="mk" data-v="${pool[i]}" style="animation-delay:${i*.05}s"><span class="face" aria-hidden="true">🦦</span><span class="tag">${JW(pool[i])}</span></button>`;
      });
      sfx.peek();
    };
    el.addEventListener("click", e => {
      const b = e.target.closest(".mk"); if(!b || b.classList.contains("hit") || hits>=g.need) return;
      if(b.dataset.v===g.target){
        hits++; b.classList.add("hit"); sfx.tick(); clearHint(); showHits();
        if(hits>=g.need) later(win, 350); else fill();
      } else oops(b, L(`Itu bukan ${g.target}. Cari ${g.target}!`,`ايت بوکن ${g.target}. چاري ${g.target}!`));
    });
    showHits(); fill();
    every(() => { if(hits<g.need) fill(); }, 2600);
  },

  /* Bentuk huruf: awal / tengah / akhir */
  bentuk(el, g){
    const items = shuffle(g.items); let k = 0;
    const POS = { awal:["Awal","اول","➡️"], tengah:["Tengah","تڠه","↔️"], akhir:["Akhir","اخير","⬅️"] };
    const draw = () => {
      const [f, a] = items[k];
      el.innerHTML = `<div class="formstage"><span class="jw" id="bf" data-a="${a}">${f}</span></div>
        <div class="poss" dir="rtl">${["awal","tengah","akhir"].map(p=>`<button class="posb" data-a="${p}" style="--c2:${p==="awal"?"#9CCB52":p==="tengah"?"#FFC83D":"#F29A5B"}"><i>${POS[p][2]}</i>${L(POS[p][0],POS[p][1])}</button>`).join("")}</div>
        <div class="posrow" dir="ltr"><span>${L("kiri: akhir","کيري: اخير")}</span><span>${L("kanan: awal","کانن: اول")}</span></div>
        <div class="cnt">🧩 ${k+1} / ${items.length}</div>`;
      el.querySelectorAll(".posb").forEach(b => b.addEventListener("click", () => {
        if(b.dataset.a===a){ sfx.tick(); clearHint(); k++; if(k<items.length) draw(); else win(); }
        else oops(b, L("Lihat garis sambung: di kiri, di kanan atau kedua-duanya?","ليهت ڬاريس سمبوڠ: د کيري، د کانن اتاو کدوا٢ڽ؟"));
      }));
    };
    draw();
  },

  /* Sangkar: tekan kad, kemudian tekan sangkar */
  sangkar(el, g){
    let sel = null, left = g.items.length;
    el.innerHTML = `<div class="pen2">${g.items.map(([t],i)=>`<button class="tk" data-i="${i}">${JW(t)}</button>`).join("")}</div>
      <div class="cages">${g.cages.map((c,i)=>`<button class="cage c${i}" data-c="${i}"><span>${T(c)}</span><span class="inside"></span></button>`).join("")}</div>
      <div class="cnt">👆 ${L("Tekan huruf, kemudian tekan sangkar.","تکن حروف، کمودين تکن سڠکر.")}</div>`;
    el.querySelectorAll(".tk").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".tk").forEach(x=>x.classList.remove("sel"));
      sel = b; b.classList.add("sel"); sfx.tick();
    }));
    el.querySelectorAll(".cage").forEach(c => c.addEventListener("click", () => {
      if(!sel){ toast(L("Pilih satu huruf dahulu 👆","ڤيليه ساتو حروف دهولو 👆")); return; }
      const [t, want] = g.items[+sel.dataset.i];
      if(+c.dataset.c===want){
        sfx.ok(); clearHint();
        c.querySelector(".inside").insertAdjacentHTML("beforeend", `<span>${JW(t)}</span>`);
        sel.remove(); sel = null; left--;
        if(!left) later(win, 400);
      } else { oops(c, L("Bukan sangkar itu. Fikir lagi!","بوکن سڠکر ايت. فيکير لاڬي!")); sel.classList.remove("sel"); sel = null; }
    }));
  },

  /* Teropong: cari semua huruf sasaran dalam perkataan */
  teropong(el, g){
    const need = g.tiles.filter(t=>t[1]).length; let got = 0;
    el.innerHTML = `<div class="scope">${JW(g.word[1])}<small>${g.word[0]}</small></div>
      <div class="letters">${g.tiles.map(([t,ok],i)=>`<button class="lt" data-i="${i}" data-ok="${ok}">${JW(t)}</button>`).join("")}</div>
      <div class="cnt">🔭 ${L("Jumpa","جومڤ")} <span id="got">0</span> / ${need}</div>`;
    el.querySelectorAll(".lt").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("found") || got>=need) return;
      if(b.dataset.ok==="1"){ b.classList.add("found"); sfx.tick(); clearHint(); got++; el.querySelector("#got").textContent = got; if(got===need) later(win, 400); }
      else oops(b, L("Bukan huruf itu. Lihat sekali lagi!","بوکن حروف ايت. ليهت سکالي لاڬي!"));
    }));
  },

  /* Papan tanda: gambar ➜ perkataan Jawi */
  papan(el, g){
    const opts = shuffle(g.opts.map((o,i)=>({o, ok:i===0}))); let done = false;
    el.innerHTML = `<div class="picbig" aria-hidden="true">${g.pic}</div>
      <div class="posts">${opts.map((x,i)=>`<button class="post" data-i="${i}" style="--r:${[-2,1.5,-1][i%3]}deg;animation-delay:${i*.08}s">${JW(x.o[1])}</button>`).join("")}</div>`;
    el.querySelectorAll(".post").forEach(b => b.addEventListener("click", () => {
      if(done) return; const x = opts[+b.dataset.i];
      if(x.ok){ done = true; b.classList.add("right"); speak(x.o[0]); later(win, 500); }
      else { b.classList.add("wrong"); oops(b, L("Baca huruf satu per satu, dari kanan.","باچ حروف ساتو ڤر ساتو، دري کانن.")); }
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t1-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Lawat kandang sebelumnya dahulu 🔒","لاوت کندڠ سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L(`Lawat semua ${STATIONS.length} kandang untuk membuka Pertunjukan Juara 🏆`,`لاوت سموا ${STATIONS.length} کندڠ اونتوق ممبوک ڤرتونجوقن جوارا 🏆`)); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa (selepas tukar tulisan/suara)
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
