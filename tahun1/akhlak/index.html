<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF8A00">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JOM KAFA">
<script src="/assets/pwa.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/access.js"></script>
<title>Pokok Adab Hoho • Akhlak Tahun 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Akhlak Tahun 1: "Pokok Adab Hoho" — gaya kartun bergaris tebal, langit & matahari ===== */
:root{
  --sky1:#7FD0FF; --sky2:#DDF3FF; --grass:#5CC46A; --grass2:#3E9B4E;
  --bg:#FFF9EC; --card:#FFFFFF; --ink:#23314F; --muted:#5B6787; --line:#23314F;
  --brand:#FF8A00; --brand2:#E06A00; --sun:#FFD23F; --leaf:#43B05C; --bark:#9A5B2E; --bark2:#6F3D1C;
  --ok:#2FB463; --okbg:#DDF8E6; --bad:#F0504A; --badbg:#FFE2E0; --note:#FFF3C4;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#1B2A5A; --sky2:#2B3F78; --grass:#2F7A3E; --grass2:#225C2E;
    --bg:#141B33; --card:#1F2A4A; --ink:#F2F5FF; --muted:#B8C2E0; --line:#0A0F1F;
    --note:#3A3415; --okbg:#173F2B; --badbg:#4A2420; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:19px;line-height:1.4;
  background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 420px,var(--bg) 900px) fixed}
html[dir="rtl"] body{font-family:"Noto Naskh Arabic","Amiri","Fredoka",serif;font-size:20px;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:10px 14px 60px;position:relative}
.ar{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl}

/* awan bergerak */
.clouds{position:fixed;inset:0 0 auto 0;height:260px;pointer-events:none;z-index:-1;overflow:hidden}
.clouds i{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.85;animation:drift linear infinite}
.clouds i::before,.clouds i::after{content:"";position:absolute;background:#fff;border-radius:50%}
.clouds i::before{width:56px;height:56px;top:-26px;left:18px}.clouds i::after{width:40px;height:40px;top:-16px;left:62px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .clouds i{opacity:.12}}

/* bar atas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .sp{flex:1}
.ib{min-width:48px;height:48px;border-radius:16px;border:3px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:22px;font-weight:700;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--line);padding:0 10px}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pill{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 14px;border-radius:16px;border:3px solid var(--line);background:var(--sun);color:#3A2A00;font-weight:700;box-shadow:0 4px 0 var(--line)}

/* tajuk peta */
.hero{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--line);border-radius:26px;padding:12px 14px;box-shadow:0 6px 0 var(--line);margin:4px 0 14px}
.hero h1{margin:0;font-size:clamp(25px,6vw,32px);line-height:1.1;color:var(--brand)}
html[dir="rtl"] .hero h1{line-height:1.5}
.hero p{margin:2px 0 0;color:var(--muted);font-size:16px;font-weight:600}
.owl{width:84px;height:auto;flex:none}
.owl.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.owl.yay{animation:yay .5s ease 2}
@keyframes yay{50%{transform:translateY(-14px) scale(1.06)}}
.owl.hmm{animation:hmm .7s ease}
@keyframes hmm{25%{transform:rotate(-10deg)}75%{transform:rotate(8deg)}}

/* buku pelekat */
.stickers{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:var(--note);border:3px dashed var(--line);border-radius:18px;padding:8px;margin-bottom:14px}
.stickers span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(15px,4.4vw,24px);background:rgba(0,0,0,.06)}
.stickers span.got{background:#fff;border:2px solid var(--line);box-shadow:0 2px 0 var(--line);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.stickers span:not(.got){filter:grayscale(1);opacity:.35}
.sttl{font-weight:700;font-size:15px;margin:0 0 4px;color:var(--muted)}

/* pokok */
.tree{position:relative;padding:20px 0 0}
.tree::before{content:"";position:absolute;left:50%;top:40px;bottom:70px;width:34px;transform:translateX(-50%);border-radius:18px;
  background:repeating-linear-gradient(170deg,var(--bark) 0 18px,var(--bark2) 18px 22px);border:3px solid var(--line)}
.crown{position:relative;z-index:1;margin:0 auto 6px;width:220px;height:120px;display:grid;place-items:center}
.crown::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 60%,var(--leaf) 0 34%,transparent 35%),radial-gradient(circle at 70% 60%,var(--leaf) 0 34%,transparent 35%),radial-gradient(circle at 50% 35%,#5BC873 0 38%,transparent 39%);filter:drop-shadow(0 4px 0 var(--line))}
.row{position:relative;display:flex;align-items:center;min-height:124px;z-index:1}
.row.r{justify-content:flex-end}
.row::before{content:"";position:absolute;top:50%;height:14px;width:24%;background:var(--bark);border:3px solid var(--line);border-radius:10px;z-index:-1}
.row.l::before{left:26%}.row.r::before{right:26%}
.node{width:46%;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;text-decoration:none;color:inherit}
.bub{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:46px;background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 19%),var(--c);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);transition:transform .15s}
.node:active .bub{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.node .nm{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:2px 10px;font-weight:700;font-size:15.5px;text-align:center;line-height:1.25;max-width:100%}
html[dir="rtl"] .node .nm{line-height:1.6;font-size:15px}
.node .st{font-size:17px;letter-spacing:1px;min-height:22px}
.node .st .off{filter:grayscale(1);opacity:.3}
.node.lock .bub{background:#B9C0CF;filter:grayscale(.6)}
.node.lock .bub::after{content:"🔒";position:absolute;font-size:30px;bottom:-6px;right:-6px}
.node.now .bub{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 6px 0 var(--line),0 0 0 10px color-mix(in srgb,var(--c) 30%,transparent)}}
.node .num{position:absolute;top:-8px;left:-8px;width:32px;height:32px;border-radius:50%;background:var(--sun);border:3px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700;color:#3A2A00}
.perch{position:absolute;width:62px;top:-38px;right:-30px;pointer-events:none}
.ground{position:relative;z-index:1;height:90px;margin:0 -14px;background:radial-gradient(ellipse at 50% 0,var(--grass) 0 60%,var(--grass2) 61% 100%);border-top:4px solid var(--line);border-radius:50% 50% 0 0/40px 40px 0 0;display:grid;place-items:center;font-weight:700;color:#fff;text-shadow:0 2px 0 var(--line);font-size:20px}
.final .bub{width:108px;height:108px;font-size:52px;background:radial-gradient(circle at 35% 30%,#fff9 0 18%,transparent 19%),linear-gradient(135deg,#FFD23F,#FF8A00)}

/* kad umum */
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line);animation:pagein .35s ease both}
@keyframes pagein{from{opacity:0;transform:translateY(14px) scale(.98)}}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead .bub{width:62px;height:62px;font-size:32px;box-shadow:0 4px 0 var(--line);border-width:3px}
.shead h2{margin:0;font-size:clamp(21px,5vw,26px);line-height:1.15}
html[dir="rtl"] .shead h2{line-height:1.6}
.shead small{display:block;color:var(--muted);font-weight:600;font-size:14.5px}

/* ulat beluncas: kemajuan */
.prog{position:relative;height:34px;margin:2px 0 12px;background:var(--card);border:3px solid var(--line);border-radius:999px;overflow:hidden}
.prog .eat{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,#B6EFC3 0 14px,#9BE3AD 14px 28px);transition:width .5s}
html[dir="rtl"] .prog .eat{inset:0 0 0 auto}
.prog .bug{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:26px;transition:left .5s,right .5s}
.prog .lf{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:16px}

/* kad bacaan */
.rpic{font-size:64px;text-align:center;line-height:1.1;margin:0 0 4px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.rh{margin:0 0 8px;text-align:center;font-size:clamp(22px,5.4vw,27px);color:var(--brand)}
.rtext{font-weight:600;font-size:19px;margin:0 0 10px}
.rlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:7px;counter-reset:n}
.rlist li{display:flex;gap:10px;align-items:center;background:var(--bg);border:2px solid color-mix(in srgb,var(--line) 25%,transparent);border-radius:14px;padding:6px 10px;font-weight:600;line-height:1.3;animation:pagein .35s both;animation-delay:calc(var(--i)*80ms)}
html[dir="rtl"] .rlist li{line-height:1.7}
.rlist li::before{counter-increment:n;content:counter(n);flex:none;width:30px;height:30px;border-radius:50%;background:var(--sc);color:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700}
.rlist.bad li::before{content:"✗";background:var(--bad)}
.abox{background:var(--note);border:3px solid var(--line);border-radius:18px;padding:10px 14px;margin:0 0 10px;text-align:center}
.abox .ar{display:block;font-size:clamp(23px,6vw,30px);line-height:1.9}
.abox .mk{display:block;font-weight:600;font-size:16px;color:var(--muted);margin-top:4px}
.abox small{display:block;font-weight:700;font-size:14px;color:var(--muted)}
.tip{display:flex;gap:8px;align-items:flex-start;background:#E7F5FF;border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin:0 0 8px;font-weight:600;font-size:17px;color:#1D3557}
.tip.am{background:#FFF0F6;color:#5A1736}
.tip b{flex:none}
.ref{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
.navr{display:flex;gap:8px;margin-top:12px}
.navr .btn{flex:1}
.btn{display:block;width:100%;border:3px solid var(--line);border-radius:18px;padding:12px;font-size:21px;font-weight:700;background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--line);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink);text-shadow:none}
.btn.go{background:var(--ok)}
.btn:disabled{opacity:.4}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--line) 25%,transparent)}
.dots i.on{background:var(--brand);width:26px;border-radius:99px}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--sun);font-size:20px;box-shadow:0 3px 0 var(--line);flex:none}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* soalan */
.q{display:flex;gap:10px;align-items:center;margin:0 0 12px}
.q p{margin:0;flex:1;font-size:clamp(20px,5vw,24px);font-weight:700;line-height:1.3}
html[dir="rtl"] .q p{line-height:1.8}
.qar{font-size:clamp(22px,6vw,28px);text-align:center;background:var(--note);border:3px solid var(--line);border-radius:16px;padding:6px 10px;margin:0 0 12px;line-height:1.9}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* BELON */
.sky{position:relative;height:310px;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(#9EDBFF,#E3F6FF)}
.balloon{position:absolute;top:var(--top,20px);width:31%;display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;animation:inflate .6s cubic-bezier(.2,1.6,.4,1) both,floaty 3s ease-in-out .6s infinite}
.balloon .b{width:100%;aspect-ratio:.82;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 32% 28%,#fff9 0 12%,transparent 13%),var(--bc);border:3px solid var(--line);display:grid;place-items:center;padding:8px;color:#fff;font-weight:700;font-size:clamp(14px,3.8vw,18px);line-height:1.2;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.35)}
html[dir="rtl"] .balloon .b{line-height:1.6}
.balloon .b .ar{font-size:1.25em;line-height:1.5}
.balloon .s{width:2px;height:40px;background:var(--line)}
@keyframes inflate{from{transform:translateY(160px) scale(.4);opacity:0}}
@keyframes floaty{50%{transform:translateY(-14px) rotate(3deg)}}
.balloon.popd .b{animation:burst .35s forwards}
@keyframes burst{to{transform:scale(1.6);opacity:0}}
.balloon.no .b{animation:shake .4s}
.sky.paused .balloon{animation-play-state:paused}

/* KIRI KANAN */
.lr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lrbtn{border:3px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lrbtn .em{font-size:64px;line-height:1.1}
.lrbtn b{font-size:24px}
.lrbtn.k{background:#E3F2FF}.lrbtn.r{background:#FFF0E0}
.lrbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.bigpic{font-size:84px;text-align:center;line-height:1.15;margin:0 0 8px;animation:bob 2.4s ease-in-out infinite}

/* JEJAK */
.trail{display:grid;gap:10px}
.step{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--line);padding:8px 12px;text-align:start;font-weight:600;font-size:18px;line-height:1.3}
html[dir="rtl"] .step{line-height:1.7}
.step .em{font-size:34px;flex:none}
.step .ft{margin-inline-start:auto;flex:none;width:40px;height:40px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-size:18px}
.step.done{background:var(--okbg);box-shadow:0 2px 0 var(--line);transform:translateY(3px)}
.step.done .ft{border-style:solid;background:var(--ok);color:#fff}
.path{display:flex;gap:6px;justify-content:center;min-height:42px;margin-bottom:10px;font-size:28px}
.path span{animation:pop .4s both}

/* LAMPU */
.light{display:flex;gap:12px;align-items:stretch}
.pole{flex:none;width:92px;background:#2B2F3A;border:3px solid var(--line);border-radius:26px;padding:10px;display:grid;gap:10px}
.lamp{width:66px;height:66px;border-radius:50%;border:3px solid #000;display:grid;place-items:center;font-size:28px;color:#fff;font-weight:700;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.lamp.g{background:#2FB463}.lamp.r{background:#F0504A}
.lamp:active{transform:scale(.94)}
.stmt{flex:1;display:grid;place-items:center;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:14px;font-size:clamp(21px,5.4vw,26px);font-weight:700;line-height:1.3;animation:pop .35s both}
html[dir="rtl"] .stmt{line-height:1.8}
.lbl{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted);margin-top:6px}
.cnt{font-weight:700;color:var(--muted);text-align:center;margin-top:8px}

/* MANIK */
.string{min-height:78px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;direction:rtl;padding:10px;border:3px dashed var(--line);border-radius:22px;background:var(--note);margin-bottom:12px;position:relative}
.string::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:3px;background:#B07A3E;z-index:0}
.bead{position:relative;z-index:1;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-size:clamp(20px,5.4vw,26px);font-family:"Amiri",serif;background:var(--bc,#fff);box-shadow:0 4px 0 var(--line);line-height:1.6;color:#23314F}
.string .bead{animation:pop .35s both;box-shadow:0 2px 0 var(--line)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;direction:rtl}
.bead:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.bead.used{visibility:hidden}

/* JARI */
.hand{display:flex;justify-content:center;align-items:flex-end;gap:6px;direction:ltr;padding:16px 8px 0;background:#FFE8D6;border:3px solid var(--line);border-radius:26px 26px 60px 60px;min-height:230px;position:relative}
.hand::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:70px;background:#F7C9A5;border:3px solid var(--line);border-bottom:0;border-radius:40px 40px 0 0;z-index:0}
.fing{position:relative;z-index:1;width:17%;border:3px solid var(--line);border-bottom:0;border-radius:40px 40px 0 0;background:#F7C9A5;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;margin-bottom:60px}
.fing .nail{width:62%;aspect-ratio:1/1.1;border-radius:50% 50% 40% 40%;background:#FFF5EE;border:3px solid var(--line);display:grid;place-items:center;font-size:16px;font-weight:700}
.fing.long .nail{background:#E9E3D0;border-style:dashed}
.fing.cut .nail{background:#FFC1D4;border-style:solid}
.fing small{font-size:12px;font-weight:700;margin-top:4px;line-height:1.1;text-align:center}
html[dir="rtl"] .fing small{font-size:12px;line-height:1.4}
.fing.thumb{margin-bottom:20px;transform:rotate(var(--rt,0deg))}
.kaki .fing{margin-bottom:56px;border-radius:30px 30px 0 0}
.kaki .fing .nail{width:70%}

/* GAMBAR */
.pics{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media (max-width:480px){.pics{grid-template-columns:1fr}.pics .pc{flex-direction:row;text-align:start}.pics .pc .em{font-size:48px}}
.pc{border:3px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 6px 0 var(--line);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:600;font-size:17px;line-height:1.3}
html[dir="rtl"] .pc{line-height:1.7}
.pc .em{font-size:60px;line-height:1.1;flex:none}
.pc:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.pc.right{background:var(--okbg)}.pc.wrong{background:var(--badbg)}

/* KUMAN */
.germ-zone{position:relative;height:300px;border:3px solid var(--line);border-radius:26px;background:radial-gradient(circle,#fff 0 40%,#DFF4FF 41%);overflow:hidden}
.germ-zone .big{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;line-height:1}
.germ{position:absolute;width:62px;height:62px;border:0;background:none;font-size:46px;animation:wig 1.2s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(12deg) scale(1.08)}}
.germ.gone{animation:burst .35s forwards;pointer-events:none}
.facts{display:grid;gap:6px;margin-top:10px}
.facts div{background:var(--okbg);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:600;animation:pop .4s both}

/* maklum balas */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));animation:up .3s ease both}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:680px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 -4px 0 var(--line),0 6px 0 var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb .row1{display:flex;gap:10px;align-items:center}
.fb .owl{width:70px}
.fb strong{display:block;font-size:24px;color:var(--ok)}
.fb.oops strong{color:var(--bad)}
.fb p{margin:0;font-weight:600;font-size:17px;line-height:1.35}
html[dir="rtl"] .fb p{line-height:1.8}
.hint{margin-top:10px;background:var(--badbg);border:2px solid var(--line);border-radius:16px;padding:6px 12px;font-weight:600;animation:pop .3s both}

/* keputusan */
.res{text-align:center}
.res .owl{width:130px;margin:0 auto}
.res .stars{font-size:58px;letter-spacing:6px;line-height:1.1}
.res .stars span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.res .stars .off{filter:grayscale(1);opacity:.25}
.res h2{margin:4px 0;font-size:32px;color:var(--brand)}
.res p{margin:0 0 8px;color:var(--muted);font-weight:600}
.gotst{display:inline-flex;align-items:center;gap:10px;background:var(--note);border:3px dashed var(--line);border-radius:20px;padding:8px 16px;font-weight:700;margin:6px 0 4px}
.gotst span{font-size:44px;animation:spin 1s ease both}
@keyframes spin{from{transform:rotate(-360deg) scale(0)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(380deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:18px;font-weight:600;z-index:60;max-width:92vw;text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
// rombak susunan dan pastikan tidak sama dengan jawapan (untuk permainan urutan)
const mix = a => { if(a.length<2) return a.slice(); let b; do{ b=shuffle(a); }while(b.every((x,i)=>x===a[i])); return b; };
const starsFor = m => m<=1 ? 3 : m<=3 ? 2 : 1;
const totalStars = () => Object.values(best).reduce((s,v)=>s+(+v||0),0);

/* ---------- Bunyi ---------- */
let actx = null;
function tone(seq){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f,d,type] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t += d*.8;
    }
  }catch(e){}
}
const sfx = {
  ok:   () => tone([[660,.12],[880,.18]]),
  tick: () => tone([[740,.08,"triangle"]]),
  no:   () => tone([[220,.18,"square"],[180,.2,"square"]]),
  pop:  () => tone([[900,.05,"triangle"],[1300,.06,"triangle"]]),
  snip: () => tone([[1200,.04,"square"],[1600,.04,"square"]]),
  win:  () => tone([[523,.14],[659,.14],[784,.14],[1046,.3]])
};

/* ---------- Suara (baca teks Rumi) ---------- */
const ttsOK = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let voice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); voice = vs.find(v=>/^ms/i.test(v.lang)) || vs.find(v=>/^id/i.test(v.lang)) || null; }catch(e){} }
if(ttsOK){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function speak(text, force){
  if(!ttsOK || !text || (!voiceOn && !force)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/…/g," ... ").replace(/SAW/g,"sallallahu alaihi wasallam").replace(/SWT/g,"subhanahu wa taala"));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = .9; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ if(ttsOK){ try{ speechSynthesis.cancel(); }catch(e){} } }

/* ---------- Bantuan paparan ---------- */
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function confetti(n=36){
  const box = document.createElement("div"); box.className="confetti"; box.setAttribute("aria-hidden","true");
  const em = ["⭐","🌟","🎉","🍃","🎈","💛"];
  for(let i=0;i<n;i++){ const s=document.createElement("span"); s.textContent=em[i%em.length]; s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(2+Math.random()*2)+"s"; s.style.animationDelay=Math.random()*.8+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5000);
}

const voiceBtn = () => `<button class="ib" data-act="voice" aria-label="${L("Suara","سوارا")}" aria-pressed="${voiceOn}">${voiceOn?"🔊":"🔇"}</button>`;
const sayBtn = txt => ttsOK ? `<button class="say" data-say="${encodeURIComponent(txt)}" aria-label="${L("Dengar","دڠر")}">🔊</button>` : "";
const starRow = n => [1,2,3].map(i=>`<span class="${i<=n?"":"off"}">⭐</span>`).join("");
const unlocked = id => id===1 || (best[id-1]||0)>0;
const allDone = () => STATIONS.every(s => (best[s.id]||0)>0);

/* ===================== STESEN: MAIN ===================== */
function progressBar(){
  const n = S.games.length, k = S.gi, pct = k/n*100, side = isJ() ? "right" : "left";
  const leaves = S.games.map((_,i)=> i>=k ? `<span class="lf" style="${side}:${(i+.5)/n*100}%;${isJ()?"transform:translate(50%,-50%)":""}">🍃</span>` : "").join("");
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${k}"><span class="eat" style="width:${pct}%"></span>${leaves}
    <span class="bug" style="${side}:${Math.max(5,pct)}%;${isJ()?"transform:translate(50%,-50%) scaleX(-1)":""}">🐛</span></div>`;
}
function renderPlay(){
  hush();
  const g = S.games[S.gi];
  app.innerHTML = head() + progressBar() + `<section class="card" id="game" style="--sc:${S.st.c}"></section>`;
  const box = $("#game");
  box.innerHTML = `<div class="q"><p>${T(g.q)}</p>${sayBtn(RU(g.q))}</div>${g.ar?`<div class="qar ar" lang="ar">${g.ar}</div>`:""}<div id="play"></div><div id="hint"></div>`;
  GAMES[g.type]($("#play"), g);
  speak(RU(g.q));
  window.scrollTo(0,0);
}
// salah: kira kesilapan, goncang, tunjuk petunjuk ringkas
function oops(el, hint){
  S.miss++; sfx.no();
  if(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  const h = $("#hint"); if(h){ h.innerHTML = `<div class="hint">🦉 ${hint || L("Hmm, cuba lagi!","همم، چوبا لاڬي!")}</div>`; }
}
const PRAISE = [["Hebat!","هيبت!"],["Bagus!","باڬوس!"],["Pandai!","ڤنداي!"],["Syabas!","شاباس!"],["MasyaAllah!","ماشاءالله!"]];
function win(){
  sfx.ok();
  const g = S.games[S.gi], p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("role","dialog"); fb.setAttribute("aria-live","polite");
  fb.innerHTML = `<div class="in"><div class="row1">${owl("yay")}<div><strong>${T(p)}</strong><p>${T(g.e)}</p></div></div>
    <button class="btn go" data-act="next">${L("Seterusnya","ستروسڽ")} ▶</button></div>`;
  document.body.appendChild(fb);
  speak(RU(p)+" "+RU(g.e));
  setTimeout(()=>{ const b = fb.querySelector("button"); if(b) b.focus(); }, 50);
}
function nextGame(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  S.gi++;
  if(S.gi < S.games.length) renderPlay(); else renderResult();
}
function renderResult(){
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  const id = S.st.id, stars = starsFor(S.miss), prev = best[id]||0, wasAll = allDone();
  if(stars > prev){ best[id] = stars; save(KEY, best); }
  S.res = { stars, first: !prev, openedFinal: !wasAll && allDone() };
  drawResult(true);
}
function drawResult(fresh){
  hush();
  const { stars, first, openedFinal } = S.res;
  const msg = stars===3 ? ["Cemerlang! Kamu memang pandai beradab.","چمرلڠ! کامو مماڠ ڤنداي برادب."] : stars===2 ? ["Bagus! Cuba lagi untuk 3 bintang.","باڬوس! چوبا لاڬي اونتوق 3 بينتڠ."] : ["Syabas kerana mencuba! Jom main lagi.","شاباس کران منچوبا! جوم ماٴين لاڬي."];
  const title = PRAISE[stars===3?4:stars===2?0:3];
  app.innerHTML = head() + `<section class="card res">
      ${owl("yay")}
      <div class="stars" aria-label="${stars} ${L("bintang","بينتڠ")}">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}" style="animation-delay:${i*.25}s">⭐</span>`).join("")}</div>
      <h2>${T(title)}</h2><p>${T(msg)}</p>
      ${first ? `<div class="gotst"><span>${S.st.sticker}</span>${L("Pelekat baharu untuk buku kamu!","ڤلقت بهارو اونتوق بوکو کامو!")}</div>` : ""}
      ${openedFinal ? `<p><b>🌟 ${L("Cabaran Bintang kini dibuka!","چابرن بينتڠ کيني دبوک!")}</b></p>` : ""}
      <button class="btn go" data-act="map">🌳 ${L("Kembali ke pokok","کمبالي ک ڤوکوق")}</button>
      <button class="btn alt" style="margin-top:10px" data-act="again">🔁 ${L("Main lagi","ماٴين لاڬي")}</button>
    </section>`;
  if(fresh){ sfx.win(); confetti(); speak(RU(title)+" "+RU(msg)); }
  window.scrollTo(0,0);
}

/* ===================== JENIS PERMAINAN ===================== */
const BCOL = ["#FF6B6B","#4DABF7","#51CF66","#FCC419","#CC5DE8"];
const GAMES = {
  /* Pecahkan belon jawapan betul */
  belon(el, g){
    const opts = shuffle(g.a.map((x,i)=>({x, ok:i===0})));
    el.innerHTML = `<div class="sky">${opts.map((o,i)=>`<button class="balloon" data-i="${i}" style="left:${2+i*33.5}%;--bc:${BCOL[(i+S.gi)%BCOL.length]};animation-delay:${i*.15}s,${.6+i*.4}s;--top:${[18,118,58][i]}px">
      <span class="b">${typeof o.x==="string"?`<span class="ar">${o.x}</span>`:T(o.x)}</span><span class="s"></span></button>`).join("")}</div>
      <div class="cnt">🎈 ${L("Tekan belon yang betul!","تکن بلون يڠ بتول!")}</div>`;
    let done = false;
    el.querySelectorAll(".balloon").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = opts[+b.dataset.i];
      if(o.ok){ done = true; sfx.pop(); b.classList.add("popd"); el.querySelector(".sky").classList.add("paused"); setTimeout(win, 380); }
      else { b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); oops(null, L("Bukan belon itu. Cuba lagi!","بوکن بلون ايت. چوبا لاڬي!")); }
    }));
  },

  /* Kanan atau kiri? */
  kiri(el, g){
    const P = { kaki:["🦶","🦶"], tangan:["✋","✋"], mata:["👁️","👁️"], mulut:["👄","👄"], rambut:["💇","💇"], badan:["🧍","🧍"] }[g.part] || ["👈","👉"];
    el.innerHTML = `<div class="bigpic" aria-hidden="true">${g.pic||"🤔"}</div>
      <div class="lr" dir="ltr">
        <button class="lrbtn k" data-s="kiri"><span class="em" style="display:inline-block;transform:scaleX(-1)">${P[0]}</span><b>⬅️ ${L("Kiri","کيري")}</b></button>
        <button class="lrbtn r" data-s="kanan"><span class="em">${P[1]}</span><b>${L("Kanan","کانن")} ➡️</b></button>
      </div>`;
    let done = false;
    el.querySelectorAll(".lrbtn").forEach(b => b.addEventListener("click", () => {
      if(done) return;
      if(b.dataset.s===g.ans){ done = true; b.style.background = "var(--okbg)"; win(); }
      else oops(b, L("Bukan yang itu. Fikir sekali lagi!","بوکن يڠ ايت. فکير سکالي لاڬي!"));
    }));
  },

  /* Tekan tapak kaki ikut urutan */
  jejak(el, g){
    const order = mix(g.steps.map((_,i)=>i));
    let k = 0;
    el.innerHTML = `<div class="path" aria-hidden="true"></div><div class="trail">${order.map(i=>`<button class="step" data-i="${i}"><span class="em">${g.steps[i][0]}</span><span>${T(g.steps[i][1])}</span><span class="ft">👣</span></button>`).join("")}</div>
      <div class="cnt">👣 ${L("Tekan ikut urutan: yang pertama dahulu!","تکن ايکوت اوروتن: يڠ ڤرتام دهولو!")}</div>`;
    el.querySelectorAll(".step").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("done") || k>=g.steps.length) return;
      if(+b.dataset.i===k){
        k++; sfx.tick(); b.classList.add("done"); b.querySelector(".ft").textContent = k;
        el.querySelector(".path").insertAdjacentHTML("beforeend", `<span>${g.steps[+b.dataset.i][0]}</span>`);
        if(k===g.steps.length) setTimeout(win, 300);
      } else oops(b, L(`Bukan langkah itu. Apakah langkah ke-${k+1}?`,`بوکن لڠکه ايت. اڤاکه لڠکه ک-${k+1}؟`));
    }));
  },

  /* Lampu isyarat: hijau boleh, merah jangan */
  lampu(el, g){
    const items = shuffle(g.items); let k = 0;
    const draw = () => {
      el.innerHTML = `<div class="light">
        <div class="stmt" id="stmt">${T(items[k][0])}</div>
        <div class="pole"><button class="lamp g" data-v="1" aria-label="${L("Boleh","بوليه")}">✓</button><button class="lamp r" data-v="0" aria-label="${L("Jangan","جاڠن")}">✗</button></div></div>
        <div class="lbl"><span></span><span>🟢 ${L("Boleh","بوليه")} &nbsp; 🔴 ${L("Jangan","جاڠن")}</span></div>
        <div class="cnt">${k+1} / ${items.length}</div>`;
      speak(RU(items[k][0]));
      el.querySelectorAll(".lamp").forEach(b => b.addEventListener("click", () => {
        if(+b.dataset.v===items[k][1]){
          sfx.tick(); k++;
          if(k<items.length){ const h=$("#hint"); if(h) h.innerHTML=""; draw(); } else win();
        } else oops($("#stmt"), items[k][1] ? L("Ini perbuatan yang baik. Ia boleh!","اين ڤربواتن يڠ باءيق. اي بوليه!") : L("Ini perbuatan yang tidak baik. Jangan!","اين ڤربواتن يڠ تيدق باءيق. جاڠن!"));
      }));
    };
    draw();
  },

  /* Susun manik doa */
  manik(el, g){
    const order = mix(g.parts.map((_,i)=>i)); let k = 0;
    el.innerHTML = `<div class="string" id="str" aria-live="polite"></div>
      <div class="pool">${order.map((i,n)=>`<button class="bead" data-i="${i}" style="--bc:${["#FFE3E3","#E7F5FF","#EBFBEE","#FFF9DB","#F3F0FF","#FFF0F6","#E3FAFC"][n%7]}" lang="ar">${g.parts[i]}</button>`).join("")}</div>
      <div class="cnt">📿 ${L("Mula dari kanan: tekan perkataan pertama doa.","مولا دري کانن: تکن ڤرکاتاٴن ڤرتام دعاء.")}</div><div id="mk"></div>`;
    el.querySelectorAll(".pool .bead").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("used") || k>=g.parts.length) return;
      if(g.parts[+b.dataset.i]===g.parts[k]){
        k++; sfx.tick(); b.classList.add("used");
        $("#str").insertAdjacentHTML("beforeend", `<span class="bead" style="--bc:${b.style.getPropertyValue("--bc")}">${g.parts[+b.dataset.i]}</span>`);
        if(k===g.parts.length){ $("#mk").innerHTML = `<div class="abox" style="margin-top:12px"><span class="mk">${T(g.mk)}</span></div>`; setTimeout(win, 500); }
      } else oops(b, L("Bukan perkataan itu. Baca doa perlahan-lahan.","بوکن ڤرکاتاٴن ايت. باچ دعاء ڤرلاهن٢."));
    }));
  },

  /* Potong kuku ikut sunnah */
  jari(el, g){
    const NAME = { ibu:["Ibu jari","ايبو جاري"], telunjuk:["Telunjuk","تلونجوق"], hantu:["Jari hantu","جاري هنتو"], manis:["Jari manis","جاري مانيس"], kelingking:["Kelingking","کليڠکيڠ"] };
    const kaki = g.limb==="kaki";
    // pandangan atas (kuku kelihatan): kanan = ibu jari di kiri skrin; kiri = sebaliknya
    let lay = ["ibu","telunjuk","hantu","manis","kelingking"]; if(g.side==="kiri") lay = lay.slice().reverse();
    const H = kaki ? { ibu:128, telunjuk:120, hantu:112, manis:104, kelingking:94 } : { ibu:92, telunjuk:136, hantu:156, manis:140, kelingking:108 };
    let k = 0;
    el.innerHTML = `<p class="cnt" style="margin:0 0 8px">${kaki?"🦶":"✋"} <b>${L(`${kaki?"Kaki":"Tangan"} ${g.side}`, `${kaki?"کاکي":"تاڠن"} ${g.side==="kanan"?"کانن":"کيري"}`)}</b> • ✂️ ${L("Tekan kuku ikut urutan sunnah","تکن کوکو ايکوت اوروتن سنة")}</p>
      <div class="hand ${kaki?"kaki":""}">${lay.map(f=>`<button class="fing long ${f==="ibu"&&!kaki?"thumb":""}" data-f="${f}" style="height:${H[f]}px;${f==="ibu"&&!kaki?`--rt:${g.side==="kanan"?-14:14}deg;`:""}${kaki&&f==="ibu"?"width:21%;":""}" aria-label="${T(NAME[f])}"><span class="nail">✂️</span><small>${T(NAME[f])}</small></button>`).join("")}</div>`;
    el.querySelectorAll(".fing").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("cut") || k>=g.order.length) return;
      if(b.dataset.f===g.order[k]){
        k++; sfx.snip(); b.classList.remove("long"); b.classList.add("cut"); b.querySelector(".nail").textContent = k;
        if(k===g.order.length) setTimeout(win, 300);
      } else oops(b, L(`Bukan jari ini. Jari ke-${k+1} ialah …? Lihat kad bacaan.`,`بوکن جاري اين. جاري ک-${k+1} اياله …؟ ليهت کد باچاٴن.`));
    }));
  },

  /* Pilih kad gambar yang betul */
  gambar(el, g){
    const opts = shuffle(g.opts); let done = false;
    el.innerHTML = `<div class="pics">${opts.map((o,i)=>`<button class="pc" data-i="${i}"><span class="em" aria-hidden="true">${o[0]}</span><span>${T(o[1])}</span></button>`).join("")}</div>`;
    el.querySelectorAll(".pc").forEach(b => b.addEventListener("click", () => {
      if(done) return; const o = opts[+b.dataset.i];
      if(o[2]){ done = true; b.classList.add("right"); win(); }
      else { b.classList.add("wrong"); oops(b, L("Itu tidak betul. Pilih yang beradab!","ايت تيدق بتول. ڤيليه يڠ برادب!")); }
    }));
  },

  /* Tekan kuman untuk membuka fakta */
  kuman(el, g){
    const POS = [[10,12],[70,8],[78,62],[8,66],[42,4],[40,74]];
    el.innerHTML = `<div class="germ-zone"><div class="big" aria-hidden="true">${g.pic}</div>
      ${g.facts.map((_,i)=>`<button class="germ" data-i="${i}" style="left:${POS[i][0]}%;top:${POS[i][1]}%;animation-delay:${-i*.3}s" aria-label="${L("Kuman","کومن")} ${i+1}">🦠</button>`).join("")}</div>
      <div class="facts" id="facts"></div>`;
    let k = 0;
    el.querySelectorAll(".germ").forEach(b => b.addEventListener("click", () => {
      if(b.classList.contains("gone")) return;
      b.classList.add("gone"); sfx.pop();
      const f = g.facts[+b.dataset.i];
      $("#facts").insertAdjacentHTML("beforeend", `<div>✨ ${T(f)}</div>`); speak(RU(f));
      if(++k===g.facts.length) setTimeout(win, 700);
    }));
  }
};

/* ===================== KAWALAN ===================== */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-say]");
  if(s){ speak(decodeURIComponent(s.dataset.say), true); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="lang"){ LANG = isJ() ? "rumi" : "jawi"; save("kafa-lang", LANG); applyLang(); redraw(); }
  else if(a==="voice"){ voiceOn = !voiceOn; save("t1-voice", voiceOn); if(!voiceOn) hush(); redraw(); }
  else if(a==="open"){ openStation(+b.dataset.id); }
  else if(a==="locked"){ sfx.no(); toast(L("Selesaikan stesen sebelumnya dahulu 🔒","سلسايکن ستيسن سبلومڽ دهولو 🔒")); }
  else if(a==="final"){ openFinal(); }
  else if(a==="flocked"){ sfx.no(); toast(L("Selesaikan semua 10 stesen untuk membuka Cabaran Bintang 🌟","سلسايکن سموا 10 ستيسن اونتوق ممبوک چابرن بينتڠ 🌟")); }
  else if(a==="map"){ document.querySelectorAll(".fb").forEach(x=>x.remove()); renderMap(); window.scrollTo(0,0); }
  else if(a==="rprev"){ if(S.ri>0){ S.ri--; renderRead(); } }
  else if(a==="rnext"){ if(S.ri < S.st.read.length-1){ S.ri++; renderRead(); } else { S.phase="play"; S.gi=0; S.miss=0; renderPlay(); } }
  else if(a==="next"){ nextGame(); }
  else if(a==="again"){ S.res = null; S.st.id==="final" ? openFinal() : (S.gi=0, S.miss=0, S.phase="play", renderPlay()); }
});
// lukis semula skrin semasa (selepas tukar tulisan/suara) tanpa mengulang permainan
function redraw(){
  if(!S) return renderMap();
  if(S.phase==="read") return renderRead();
  if(S.res && document.querySelector(".res")) return drawResult(false);
  // semasa bermain: kekalkan soalan semasa (permainan dimulakan semula)
  document.querySelectorAll(".fb").forEach(x=>x.remove());
  renderPlay();
}
applyLang();
renderMap();
</script>
